<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course &amp; Lecture Browser - Mark Veltzer</title>
<style>
{{CSS}}
</style>
</head>
<body>
<div id="index-view">
<div class="header-bar">
<h1>Course &amp; Lecture Browser</h1>
<select id="theme-select" title="Choose theme">
<option value="midnight">Midnight (dark blue)</option>
<option value="paper">Paper (warm light)</option>
<option value="nord">Nord (cool dark)</option>
<option value="solarized">Solarized (warm light)</option>
<option value="rosepine">Rose Pine (purple dark)</option>
</select>
</div>
<p id="total-count">{{TOTAL_COUNT}} items</p>

<div id="breadcrumb"></div>
<div id="subfolders"></div>

<div class="filters">
<div class="filter-row">
<label for="search">Search:</label>
<div class="autocomplete-wrap">
<input type="text" id="search" placeholder="Type to filter by name..." autocomplete="off">
<div id="autocomplete-list" class="autocomplete-list"></div>
</div>
</div>
<div class="filter-row">
<label for="filter-level">Level:</label>
<select id="filter-level">
<option value="">All levels</option>
{{LEVEL_OPTIONS}}
</select>
</div>
<div class="filter-row">
<label for="filter-category">Category:</label>
<select id="filter-category">
<option value="">All categories</option>
{{CATEGORY_OPTIONS}}
</select>
</div>
<div class="filter-row">
<label for="filter-type">Type:</label>
<select id="filter-type">
<option value="">All types</option>
{{TYPE_OPTIONS}}
</select>
</div>
<div class="filter-row">
<label for="filter-tag">Tag:</label>
<select id="filter-tag">
<option value="">All tags</option>
{{TAG_OPTIONS}}
</select>
</div>
<div class="filter-row">
<label for="filter-duration">Duration:</label>
<select id="filter-duration"></select>
</div>
<div class="filter-row">
<label for="filter-audience">Audience:</label>
<select id="filter-audience">
<option value="">All audiences</option>
{{AUDIENCE_OPTIONS}}
</select>
</div>
<div class="filter-row">
<label for="show-numbers">Numbering:</label>
<label class="toggle-switch"><input type="checkbox" id="show-numbers"><span class="toggle-slider"></span></label>
</div>
<div class="filter-row">
<label for="sort-primary">Sort by:</label>
<select id="sort-primary">
<option value="folder" selected>Folder</option>
<option value="name">Name</option>
<option value="level">Level</option>
<option value="category">Category</option>
<option value="duration">Duration</option>
<option value="slides">Slides</option>
<option value="chapters">Chapters</option>
</select>
<select id="sort-primary-dir">
<option value="asc" selected>Asc</option>
<option value="desc">Desc</option>
</select>
<label for="sort-secondary">Then by:</label>
<select id="sort-secondary">
<option value="name" selected>Name</option>
<option value="folder">Folder</option>
<option value="level">Level</option>
<option value="category">Category</option>
<option value="duration">Duration</option>
<option value="slides">Slides</option>
<option value="chapters">Chapters</option>
</select>
<select id="sort-secondary-dir">
<option value="asc" selected>Asc</option>
<option value="desc">Desc</option>
</select>
</div>
</div>

<div id="results"></div>

<hr>
<p>Mark Veltzer <a href="mailto:mark.veltzer@gmail.com">mark.veltzer@gmail.com</a></p>
</div>

<script>
const DATA = {{DATA_JSON}};
{{JS}}
</script>
</body>
</html>

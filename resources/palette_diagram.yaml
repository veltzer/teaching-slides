# Canonical color palette for all course SVG diagrams.
#
# This is the "muted v2" palette: less saturated than v1, gradient-filled
# rects, beefier shadows. The semantic role names are unchanged, so any
# SVG written against v1 also works against v2 — only the hex values
# (and rendering style) shift.
#
# Roles per semantic family (primary, ok, warn, danger, info):
#   {family}-fill    - the box background fill (used for solid + gradient base)
#   {family}-border  - matching border / stroke
#   {family}-text    - text drawn on top of the fill (always readable)
#   {family}-accent  - deeper shade for emphasis, lines, marker heads
#
# Neutrals: bg, surface, border, text, text-muted, text-faint, code-bg,
# shadow, black.
#
# check_svg.py --colors validates every SVG attribute against this file.

colors:
  neutrals:
    bg: "#ffffff"                 # slide/page background
    surface: "#c4cdd6"            # neutral box fills, panel backgrounds
    border: "#6b7280"             # dividers, default box strokes
    text: "#212121"               # primary body text
    text-muted: "#555555"         # secondary text, annotations
    text-faint: "#888888"         # placeholder, minor labels
    code-bg: "#1a1a2e"            # dark code-block background
    shadow: "#00000044"           # feDropShadow flood-color (deeper)
    black: "#000000"              # pure black (use sparingly)

  primary:
    primary-fill: "#5a7a9c"       # muted steel blue
    primary-border: "#3d5a7d"     # darker steel
    primary-text: "#ffffff"
    primary-accent: "#243b59"     # navy

  ok:
    ok-fill: "#7a9a6a"            # sage green
    ok-border: "#5a7a4d"          # forest sage
    ok-text: "#ffffff"
    ok-accent: "#385030"          # deep forest

  warn:
    warn-fill: "#c8924a"          # ochre / muted amber
    warn-border: "#9c6e2e"        # bronze
    warn-text: "#ffffff"
    warn-accent: "#5a3f12"        # deep bronze

  danger:
    danger-fill: "#a86058"        # muted brick red
    danger-border: "#7d3f38"      # rust
    danger-text: "#ffffff"
    danger-accent: "#4a1f1a"      # deep rust

  info:
    info-fill: "#7c6a8e"          # mauve / muted plum
    info-border: "#574a68"        # plum
    info-text: "#ffffff"
    info-accent: "#2f253b"        # deep plum

# Gradients are now actively used (rects with family fills get gradient
# treatment via fix_svg_gradients.py).
gradients:
  grad-primary:
    direction: vertical
    stops:
      - color: "#7493b3"          # lighter steel
        offset: "0%"
      - color: "#3d5a7d"          # primary-border
        offset: "100%"
  grad-surface:
    direction: vertical
    stops:
      - color: "#ffffff"          # bg
        offset: "0%"
      - color: "#c4cdd6"          # surface
        offset: "100%"
  grad-ok:
    direction: vertical
    stops:
      - color: "#94b384"          # lighter sage
        offset: "0%"
      - color: "#5a7a4d"          # ok-border
        offset: "100%"
  grad-warn:
    direction: vertical
    stops:
      - color: "#dba868"          # lighter ochre
        offset: "0%"
      - color: "#9c6e2e"          # warn-border
        offset: "100%"
  grad-danger:
    direction: vertical
    stops:
      - color: "#bd7d75"          # lighter brick
        offset: "0%"
      - color: "#7d3f38"          # danger-border
        offset: "100%"
  grad-info:
    direction: vertical
    stops:
      - color: "#9384a5"          # lighter mauve
        offset: "0%"
      - color: "#574a68"          # info-border
        offset: "100%"

filters:
  shadow:
    type: drop-shadow
    dx: 0
    dy: 4                         # was 2 — bigger drop
    stdDeviation: 8               # was 3 — softer/larger blur
    flood-color: "#00000044"      # was #00000022 — deeper opacity

# Visual effects applied uniformly across all SVGs. Enforced by
# check_svg.py --shadows; fix_svg_shadows.py rewrites files to comply.
effects:
  rect-shadow:
    enabled: true                 # whether shadow filter is used at all
    apply-to: family-only         # family-only | all | none
    # family-only: rects with fill=var(--{family}-fill) MUST have
    #              filter="url(#shadow)"; other rects MUST NOT.
    # all:         every <rect> outside <defs> MUST have the shadow filter.
    # none:        equivalent to enabled: false — no rect may have it.
  rect-fill:
    style: gradient               # solid | gradient
    # solid:    family-fill rects MUST use fill="var(--{family}-fill)"
    # gradient: family-fill rects MUST use fill="url(#grad-{family})"
    # Applies only to rects whose fill resolves to a family color.
    # Neutral fills (--bg, --surface, none) are not affected.

# Canonical typography. Every <text>/<tspan> in every SVG must use one of
# these two font stacks (enforced by check_svg.py --typography; rewritten
# by fix_svg_fonts.py). To re-skin the deck typographically, change these
# values and re-run fix_svg_fonts.py.
typography:
  sans: "Arial, sans-serif"
  mono: "Courier New, monospace"

markers:
  arrow:
    fill: "#555555"               # text-muted
    markerWidth: 10
    markerHeight: 10
  arrow-primary:
    fill: "#3d5a7d"               # primary-border
    markerWidth: 10
    markerHeight: 10
  arrow-ok:
    fill: "#5a7a4d"               # ok-border
    markerWidth: 10
    markerHeight: 10
  arrow-warn:
    fill: "#9c6e2e"               # warn-border
    markerWidth: 10
    markerHeight: 10
  arrow-danger:
    fill: "#7d3f38"               # danger-border
    markerWidth: 10
    markerHeight: 10
  arrow-info:
    fill: "#574a68"               # info-border
    markerWidth: 10
    markerHeight: 10
  arrow-white:
    fill: "#ffffff"               # bg
    markerWidth: 10
    markerHeight: 10

# Shape primitives. Every <rect>/<circle>/<ellipse> in an SVG must match
# one of these. The normalize_svg_style.py script enforces them; the
# check_svg.py --shapes flag validates compliance.
shapes:
  box:
    rx: 6
    stroke-width: 2
    stroke-width-neutral: 1

# Line primitives. Every <line>/<path> used as a connector must match
# one of these.
lines:
  connector:
    stroke: "#555555"             # text-muted
    stroke-width: 2
    marker-end: "url(#arrow)"
  emphasis:
    stroke: "#212121"             # text
    stroke-width: 3
    marker-end: "url(#arrow)"

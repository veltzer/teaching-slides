# The shared-themes diagram theme each kind of SVG is drawn with. The themes
# live in shared/shared-themes/diagram-themes.yaml: colours, gradients, drop
# shadow (or none), typography, markers, shapes, lines. After changing a
# theme here, install it into the SVGs:
#   scripts/install_palette.py --apply
#   scripts/svg_fix.py --shadows --gradients --fonts
# Each SVG declares its kind in <metadata><type>.
regular: flat
title: intro

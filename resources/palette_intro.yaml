# Color palette for course intro / title slides.
#
# Title slides share the same semantic role names as palette_diagram.yaml,
# so both palettes speak the same language. check_svg.py routes title.svg
# files to this palette automatically.
#
# Roles per semantic family (primary, ok, warn, danger, info):
#   {family}-fill    - the box background fill
#   {family}-border  - matching border / stroke
#   {family}-text    - text drawn on top of the fill
#   {family}-accent  - deeper shade for emphasis

colors:
  neutrals:
    bg: "#ffffff"                 # slide/page background
    surface: "#f5f5f5"            # neutral box fills
    border: "#e0e0e0"             # dividers, default box strokes
    text: "#212121"               # primary body text
    text-muted: "#555555"         # secondary text
    text-faint: "#888888"         # placeholder labels
    code-bg: "#1a1a2e"            # dark code-block / slide background
    black: "#000000"              # pure black

  primary:
    primary-fill: "#2196f3"
    primary-border: "#1565c0"
    primary-text: "#ffffff"
    primary-accent: "#0d47a1"

  ok:
    ok-fill: "#4caf50"
    ok-border: "#2e7d32"
    ok-text: "#ffffff"
    ok-accent: "#1b5e20"

  warn:
    warn-fill: "#ff9800"
    warn-border: "#e65100"
    warn-text: "#ffffff"
    warn-accent: "#bf360c"

  danger:
    danger-fill: "#e74c3c"
    danger-border: "#c62828"
    danger-text: "#ffffff"
    danger-accent: "#b71c1c"

  info:
    info-fill: "#9c27b0"
    info-border: "#6a1b9a"
    info-text: "#ffffff"
    info-accent: "#4a148c"

gradients:
  grad-primary:
    direction: vertical
    stops:
      - color: "#2196f3"
        offset: "0%"
      - color: "#1565c0"
        offset: "100%"
  grad-ok:
    direction: vertical
    stops:
      - color: "#4caf50"
        offset: "0%"
      - color: "#2e7d32"
        offset: "100%"
  grad-warn:
    direction: vertical
    stops:
      - color: "#ff9800"
        offset: "0%"
      - color: "#e65100"
        offset: "100%"
  grad-danger:
    direction: vertical
    stops:
      - color: "#e74c3c"
        offset: "0%"
      - color: "#c62828"
        offset: "100%"
  grad-info:
    direction: vertical
    stops:
      - color: "#9c27b0"
        offset: "0%"
      - color: "#6a1b9a"
        offset: "100%"

markers:
  arrow:
    fill: "#555555"
    markerWidth: 10
    markerHeight: 10
  arrow-primary:
    fill: "#1565c0"
    markerWidth: 10
    markerHeight: 10
  arrow-ok:
    fill: "#2e7d32"
    markerWidth: 10
    markerHeight: 10
  arrow-warn:
    fill: "#e65100"
    markerWidth: 10
    markerHeight: 10
  arrow-danger:
    fill: "#c62828"
    markerWidth: 10
    markerHeight: 10
  arrow-info:
    fill: "#6a1b9a"
    markerWidth: 10
    markerHeight: 10
  arrow-white:
    fill: "#ffffff"
    markerWidth: 10
    markerHeight: 10

# Background rect for title slides. The first <rect> after </defs> must
# match these attributes exactly.
background-rect:
  width: 1200
  height: 580
  x: 40
  y: 40
  fill: "var(--code-bg)"
  rx: 6

# Title text style for title slides. Every title.svg must have exactly one
# <text> element matching these attributes (enforced by install_palette.py).
# x and y are per-slide and not enforced.
title-text:
  font-family: "Arial, sans-serif"
  font-size: 39
  font-weight: bold
  fill: "var(--surface)"
  text-anchor: middle
  x: 640
  y: 120

# Subtitle text style for title slides. Every title.svg must have exactly
# one subtitle <text> element matching these attributes.
subtitle-text:
  font-family: "Arial, sans-serif"
  font-size: 21
  fill: "var(--text-faint)"
  text-anchor: middle
  x: 640
  y: 163

shapes:
  box:
    rx: 6
    stroke-width: 2
    stroke-width-neutral: 1

lines:
  connector:
    stroke: "#555555"
    stroke-width: 2
    marker-end: "url(#arrow)"
  emphasis:
    stroke: "#212121"
    stroke-width: 3
    marker-end: "url(#arrow)"

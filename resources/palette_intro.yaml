# Color palette for course intro / title slides.
#
# Intro slides use a dark, visually striking theme to set the tone
# for a course. This palette defines the allowed colors for title.svg
# files under svg/courses/**/title.svg.
#
# Uses the same semantic names as palette_diagram.yaml so that both
# palettes share the project's visual identity. This file lists only
# the subset of colors actually used in title SVGs.
#
# check_svg.py routes title.svg files to this palette automatically.

colors:
  neutrals:
    bg: "#ffffff"                  # slide/page background
    surface: "#f5f5f5"            # neutral box fills
    surface-alt: "#eeeeee"        # alternate rows
    surface-dark: "#f0f0f0"       # slightly darker surface
    black: "#000000"              # pure black
    border-faint: "#cccccc"       # subtle borders
    border-strong: "#bdbdbd"      # emphasized borders
    code-bg: "#1a1a2e"            # dark code-block / slide background
    text: "#212121"               # primary body text
    text-dark: "#333333"          # slightly lighter text
    text-darker: "#222222"        # near-black text
    text-muted: "#555555"         # secondary text
    text-mid: "#666666"           # mid-grey text
    text-faint: "#888888"         # placeholder labels
    text-faintest: "#999999"      # very faint labels
    text-disabled: "#9e9e9e"      # disabled text
    text-placeholder: "#aaaaaa"   # placeholder text

  primary:
    primary: "#1e88e5"            # accent blue
    primary-dk: "#1565c0"         # dark blue
    primary-mid: "#1976d2"        # medium blue
    primary-vivid: "#2196f3"      # vivid blue
    primary-soft: "#3498db"       # soft blue
    primary-deep: "#0d47a1"       # deep navy
    primary-deeper: "#1a237e"     # deeper navy
    primary-strong: "#0277bd"     # strong blue
    primary-bright: "#4a90e2"     # bright/light blue variant
    primary-tint: "#90caf9"       # lighter tint
    primary-google: "#4285f4"     # google blue
    primary-indigo: "#3949ab"     # indigo variant
    primary-indigo-dk: "#283593"  # dark indigo

  ok:
    ok-dk: "#2e7d32"              # dark green
    ok-light: "#4caf50"           # light green
    ok-bright: "#28a745"          # bright green
    ok-vivid: "#2ecc71"           # vivid green
    ok-google: "#34a853"          # google green
    ok-lt: "#c8e6c9"              # green tint
    ok-tint: "#a5d6a7"            # lighter green tint
    ok-pale: "#e8f5e9"            # very light green
    ok-soft: "#27ae60"            # soft green
    ok-pale2: "#d4edda"           # alternate pale green

  warn:
    warn-dk: "#e65100"            # dark orange
    warn-mid: "#f57c00"           # medium orange
    warn-amber: "#f9a825"         # amber
    warn-orange: "#ff9800"        # orange
    warn-gold: "#f39c12"          # gold
    warn-bright: "#fbbc04"        # bright yellow
    warn-deep: "#ef6c00"          # deep orange
    warn-yellow: "#ffc107"        # yellow-amber
    warn-lt: "#ffe0b2"            # orange tint
    warn-tint: "#ffcc80"          # lighter orange tint

  danger:
    danger: "#e53935"             # red
    danger-dk: "#c62828"          # dark red
    danger-mid: "#d32f2f"         # medium red
    danger-light: "#e74c3c"       # lighter red
    danger-vivid: "#f44336"       # vivid red
    danger-bright: "#dc3545"      # bright red
    danger-pale: "#ffebee"        # very light red

  info:
    info-vivid: "#673ab7"         # violet
    info-indigo: "#3f51b5"        # indigo
    info-soft: "#9b59b6"          # soft purple
    info-lt: "#ce93d8"            # purple tint
    info-deep: "#4a148c"          # deep purple
    info-tint: "#e1bee7"          # lighter purple tint

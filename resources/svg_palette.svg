<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!--
    Canonical SVG palette for all course diagrams.
    Use scripts/install_palette.py to push the defs block into every SVG.
    The check_svg.py (colors flag) check enforces palette compliance.

    Semantic roles - use these names in comments, never raw hex:

    Neutrals:
      bg            #ffffff   - slide/page background
      surface       #f5f5f5   - neutral box fills, panel backgrounds
      surface-alt   #eeeeee   - alternate rows, inset panels
      surface-light #f9f9f9   - very light fill
      surface-dark  #f0f0f0   - slightly darker surface
      border        #e0e0e0   - box strokes, dividers
      border-strong #bdbdbd   - emphasized borders
      border-faint  #cccccc   - subtle borders, disabled
      border-softer #dddddd   - mid-weight borders
      text          #212121   - primary body text
      text-dark     #333333   - slightly lighter than text
      text-darker   #222222   - near-black text
      text-muted    #555555   - secondary text, annotations
      text-mid      #666666   - mid-grey text
      text-faint    #888888   - placeholder, minor labels
      text-lighter  #777777   - light secondary text
      text-faintest #999999   - very faint labels
      text-disabled #9e9e9e   - disabled text
      text-placeholder #aaaaaa - placeholder text
      code-bg       #1a1a2e   - dark code-block background
      shadow        #00000022 - feDropShadow flood-color
      black         #000000   - pure black (use sparingly)

    Primary (blue):
      primary       #1e88e5   - accent boxes, key steps (gradient top)
      primary-dk    #1565c0   - accent gradient bottom / dark
      primary-mid   #1976d2   - medium blue
      primary-bright #4a90e2  - bright/light blue variant
      primary-vivid #2196f3   - vivid blue
      primary-soft  #3498db   - soft blue
      primary-deep  #0d47a1   - deep navy blue
      primary-deeper #1a237e  - deeper navy
      primary-strong #0277bd  - strong blue
      primary-lt    #bbdefb   - tint (text on dark primary bg)
      primary-tint  #90caf9   - lighter tint
      primary-pale  #e3f2fd   - very light primary fill
      primary-pale2 #e8f4f8   - alternate pale primary fill
      primary-pale3 #e1f5fe   - pale cyan-blue fill
      primary-indigo #3949ab  - indigo variant
      primary-indigo-dk #283593 - dark indigo
      primary-google #4285f4  - google-blue variant

    OK (green):
      ok            #43a047   - success, positive (gradient top)
      ok-dk         #2e7d32   - gradient bottom / dark green
      ok-mid        #388e3c   - medium green
      ok-light      #4caf50   - light green
      ok-bright     #28a745   - bright green (bootstrap)
      ok-vivid      #2ecc71   - vivid green
      ok-soft       #27ae60   - soft green
      ok-google     #34a853   - google green
      ok-deep       #1b5e20   - deep dark green
      ok-lt         #c8e6c9   - tint (text on dark ok bg)
      ok-tint       #a5d6a7   - lighter tint
      ok-pale       #e8f5e9   - very light ok fill
      ok-pale2      #d4edda   - alternate pale ok fill (bootstrap)
      ok-pale3      #e8f5e8   - near-identical pale variant

    Warn (orange/yellow):
      warn          #fb8c00   - warning, caution (gradient top)
      warn-dk       #e65100   - gradient bottom / dark orange
      warn-mid      #f57c00   - medium orange
      warn-amber    #f9a825   - amber
      warn-yellow   #ffc107   - yellow-amber
      warn-orange   #ff9800   - orange
      warn-gold     #f39c12   - gold
      warn-bright   #fbbc04   - bright yellow (google)
      warn-deep     #ef6c00   - deep orange
      warn-lt       #ffe0b2   - tint
      warn-tint     #ffcc80   - lighter tint
      warn-pale     #fff3e0   - very light warn fill
      warn-pale2    #fff3cd   - alternate pale (bootstrap)
      warn-pale3    #fff8e1   - pale yellow fill
      warn-pale4    #fff9c4   - pale lemon fill
      warn-pale5    #fff8e1   - pale warm fill

    Danger (red):
      danger        #e53935   - error, destructive (gradient top)
      danger-dk     #c62828   - gradient bottom / dark red
      danger-mid    #d32f2f   - medium red
      danger-light  #e74c3c   - lighter red
      danger-vivid  #f44336   - vivid red
      danger-bright #dc3545   - bright red (bootstrap)
      danger-google #ea4335   - google red
      danger-deep   #b71c1c   - deep dark red
      danger-deeper #bf360c   - deeper red-orange
      danger-pink   #c2185b   - pink-red
      danger-lt     #ffcdd2   - tint
      danger-pale   #ffebee   - very light danger fill
      danger-pale2  #f8d7da   - alternate pale (bootstrap)
      danger-pale3  #fce4ec   - pale pink fill

    Info (purple):
      info          #8e24aa   - informational, purple (gradient top)
      info-dk       #6a1b9a   - gradient bottom / dark purple
      info-mid      #7b1fa2   - medium purple
      info-light    #9c27b0   - lighter purple
      info-vivid    #673ab7   - violet
      info-deep     #4a148c   - deep purple
      info-soft     #9b59b6   - soft purple
      info-lt       #ce93d8   - tint
      info-tint     #e1bee7   - lighter tint
      info-pale     #f3e5f5   - very light info fill
      info-indigo   #3f51b5   - indigo
      info-indigo-lt #e8eaf6  - light indigo fill
  -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Visual swatch reference - not used in slides -->
  <rect x="40"  y="40"  width="55" height="30" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="100" y="40"  width="55" height="30" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="160" y="40"  width="55" height="30" fill="#eeeeee" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="220" y="40"  width="55" height="30" fill="#e0e0e0"/>
  <rect x="280" y="40"  width="55" height="30" fill="#bdbdbd"/>
  <rect x="340" y="40"  width="55" height="30" fill="#212121"/>
  <rect x="400" y="40"  width="55" height="30" fill="#333333"/>
  <rect x="460" y="40"  width="55" height="30" fill="#555555"/>
  <rect x="520" y="40"  width="55" height="30" fill="#888888"/>
  <rect x="580" y="40"  width="55" height="30" fill="#999999"/>
  <rect x="640" y="40"  width="55" height="30" fill="#1a1a2e"/>

  <rect x="40"  y="80"  width="55" height="30" fill="#1e88e5"/>
  <rect x="100" y="80"  width="55" height="30" fill="#1565c0"/>
  <rect x="160" y="80"  width="55" height="30" fill="#1976d2"/>
  <rect x="220" y="80"  width="55" height="30" fill="#4a90e2"/>
  <rect x="280" y="80"  width="55" height="30" fill="#0d47a1"/>
  <rect x="340" y="80"  width="55" height="30" fill="#1a237e"/>
  <rect x="400" y="80"  width="55" height="30" fill="#bbdefb"/>
  <rect x="460" y="80"  width="55" height="30" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="520" y="80"  width="55" height="30" fill="#e8f4f8" stroke="#e0e0e0" stroke-width="1"/>

  <rect x="40"  y="120" width="55" height="30" fill="#43a047"/>
  <rect x="100" y="120" width="55" height="30" fill="#2e7d32"/>
  <rect x="160" y="120" width="55" height="30" fill="#388e3c"/>
  <rect x="220" y="120" width="55" height="30" fill="#28a745"/>
  <rect x="280" y="120" width="55" height="30" fill="#1b5e20"/>
  <rect x="340" y="120" width="55" height="30" fill="#c8e6c9"/>
  <rect x="400" y="120" width="55" height="30" fill="#e8f5e9" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="460" y="120" width="55" height="30" fill="#d4edda" stroke="#e0e0e0" stroke-width="1"/>

  <rect x="40"  y="160" width="55" height="30" fill="#fb8c00"/>
  <rect x="100" y="160" width="55" height="30" fill="#e65100"/>
  <rect x="160" y="160" width="55" height="30" fill="#f57c00"/>
  <rect x="220" y="160" width="55" height="30" fill="#ffc107"/>
  <rect x="280" y="160" width="55" height="30" fill="#f9a825"/>
  <rect x="340" y="160" width="55" height="30" fill="#ffe0b2"/>
  <rect x="400" y="160" width="55" height="30" fill="#fff3e0" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="460" y="160" width="55" height="30" fill="#fff3cd" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="520" y="160" width="55" height="30" fill="#fff8e1" stroke="#e0e0e0" stroke-width="1"/>

  <rect x="40"  y="200" width="55" height="30" fill="#e53935"/>
  <rect x="100" y="200" width="55" height="30" fill="#c62828"/>
  <rect x="160" y="200" width="55" height="30" fill="#dc3545"/>
  <rect x="220" y="200" width="55" height="30" fill="#e74c3c"/>
  <rect x="280" y="200" width="55" height="30" fill="#b71c1c"/>
  <rect x="340" y="200" width="55" height="30" fill="#ffcdd2"/>
  <rect x="400" y="200" width="55" height="30" fill="#ffebee" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="460" y="200" width="55" height="30" fill="#f8d7da" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="520" y="200" width="55" height="30" fill="#fce4ec" stroke="#e0e0e0" stroke-width="1"/>

  <rect x="40"  y="240" width="55" height="30" fill="#8e24aa"/>
  <rect x="100" y="240" width="55" height="30" fill="#6a1b9a"/>
  <rect x="160" y="240" width="55" height="30" fill="#7b1fa2"/>
  <rect x="220" y="240" width="55" height="30" fill="#9c27b0"/>
  <rect x="280" y="240" width="55" height="30" fill="#673ab7"/>
  <rect x="340" y="240" width="55" height="30" fill="#ce93d8"/>
  <rect x="400" y="240" width="55" height="30" fill="#f3e5f5" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="460" y="240" width="55" height="30" fill="#e8eaf6" stroke="#e0e0e0" stroke-width="1"/>

  <text x="67"  y="300" font-family="Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">bg</text>
  <text x="127" y="300" font-family="Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">surface</text>
  <text x="187" y="300" font-family="Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">surface-alt</text>
  <text x="247" y="300" font-family="Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">border</text>
  <text x="307" y="300" font-family="Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">border-strong</text>
  <text x="367" y="300" font-family="Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">text</text>
  <text x="427" y="300" font-family="Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">text-dark</text>
  <text x="487" y="300" font-family="Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">text-muted</text>
  <text x="547" y="300" font-family="Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">text-faint</text>
  <text x="607" y="300" font-family="Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">text-faintest</text>
  <text x="667" y="300" font-family="Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">code-bg</text>
</svg>

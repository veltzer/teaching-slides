<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!--
    Canonical SVG palette for all course diagrams.
    Use scripts/install_palette.py to push this defs block into every SVG.
    Only use colors that appear as stop-color / flood-color values inside this
    file - no ad-hoc hex values anywhere else.
    The check_svg.py (colors flag) check enforces this.

    Semantic roles (use these names in comments, never raw hex):
      bg            - slide / page background
      surface       - neutral box fills, panel backgrounds
      surface-alt   - alternate row, inset panels
      border        - box strokes, dividers, rules
      border-strong - emphasized borders
      text          - primary body text
      text-muted    - secondary text, annotations, captions
      text-faint    - placeholder, disabled, very minor labels
      code-bg       - dark code-block background
      shadow        - feDropShadow flood-color (semi-transparent)

      primary       - accent boxes, key steps, highlights  (gradient top)
      primary-dk    - accent gradient bottom / strong accent
      primary-lt    - accent tint  (text on dark primary bg)
      primary-pale  - very light accent fill

      ok            - success, correct, positive  (gradient top)
      ok-dk         - success gradient bottom / dark
      ok-lt         - success tint  (text on dark ok bg)
      ok-pale       - very light success fill

      warn          - warning, caution  (gradient top)
      warn-dk       - warning gradient bottom / dark
      warn-lt       - warning tint  (text on dark warn bg)
      warn-pale     - very light warning fill

      danger        - error, bad, destructive  (gradient top)
      danger-dk     - error gradient bottom / dark
      danger-lt     - error tint  (text on dark danger bg)
      danger-pale   - very light error fill

      info          - informational, note, purple  (gradient top)
      info-dk       - info gradient bottom / dark
      info-lt       - info tint  (text on dark info bg)
      info-pale     - very light info fill

    Color values (change these to retheme everything):
      bg            #ffffff
      surface       #f5f5f5
      surface-alt   #eeeeee
      border        #e0e0e0
      border-strong #bdbdbd
      text          #212121
      text-muted    #555555
      text-faint    #888888
      code-bg       #1a1a2e
      shadow        #00000022

      primary       #1e88e5
      primary-dk    #1565c0
      primary-lt    #bbdefb
      primary-pale  #e3f2fd

      ok            #43a047
      ok-dk         #2e7d32
      ok-lt         #c8e6c9
      ok-pale       #e8f5e9

      warn          #fb8c00
      warn-dk       #e65100
      warn-lt       #ffe0b2
      warn-pale     #fff3e0

      danger        #e53935
      danger-dk     #c62828
      danger-lt     #ffcdd2
      danger-pale   #ffebee

      info          #8e24aa
      info-dk       #6a1b9a
      info-lt       #ce93d8
      info-pale     #f3e5f5
  -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Visual swatch reference - not used in slides -->
  <rect x="40"  y="40"  width="60" height="35" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="110" y="40"  width="60" height="35" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="180" y="40"  width="60" height="35" fill="#eeeeee" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="250" y="40"  width="60" height="35" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="320" y="40"  width="60" height="35" fill="#bdbdbd"/>
  <rect x="390" y="40"  width="60" height="35" fill="#212121"/>
  <rect x="460" y="40"  width="60" height="35" fill="#555555"/>
  <rect x="530" y="40"  width="60" height="35" fill="#888888"/>
  <rect x="600" y="40"  width="60" height="35" fill="#1a1a2e"/>

  <rect x="40"  y="90"  width="60" height="35" fill="#1e88e5"/>
  <rect x="110" y="90"  width="60" height="35" fill="#1565c0"/>
  <rect x="180" y="90"  width="60" height="35" fill="#bbdefb"/>
  <rect x="250" y="90"  width="60" height="35" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>

  <rect x="40"  y="140" width="60" height="35" fill="#43a047"/>
  <rect x="110" y="140" width="60" height="35" fill="#2e7d32"/>
  <rect x="180" y="140" width="60" height="35" fill="#c8e6c9"/>
  <rect x="250" y="140" width="60" height="35" fill="#e8f5e9" stroke="#e0e0e0" stroke-width="1"/>

  <rect x="40"  y="190" width="60" height="35" fill="#fb8c00"/>
  <rect x="110" y="190" width="60" height="35" fill="#e65100"/>
  <rect x="180" y="190" width="60" height="35" fill="#ffe0b2"/>
  <rect x="250" y="190" width="60" height="35" fill="#fff3e0" stroke="#e0e0e0" stroke-width="1"/>

  <rect x="40"  y="240" width="60" height="35" fill="#e53935"/>
  <rect x="110" y="240" width="60" height="35" fill="#c62828"/>
  <rect x="180" y="240" width="60" height="35" fill="#ffcdd2"/>
  <rect x="250" y="240" width="60" height="35" fill="#ffebee" stroke="#e0e0e0" stroke-width="1"/>

  <rect x="40"  y="290" width="60" height="35" fill="#8e24aa"/>
  <rect x="110" y="290" width="60" height="35" fill="#6a1b9a"/>
  <rect x="180" y="290" width="60" height="35" fill="#ce93d8"/>
  <rect x="250" y="290" width="60" height="35" fill="#f3e5f5" stroke="#e0e0e0" stroke-width="1"/>

  <text x="70"  y="365" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">bg</text>
  <text x="140" y="365" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">surface</text>
  <text x="210" y="365" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">surface-alt</text>
  <text x="280" y="365" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">border</text>
  <text x="350" y="365" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">border-strong</text>
  <text x="420" y="365" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">text</text>
  <text x="490" y="365" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">text-muted</text>
  <text x="560" y="365" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">text-faint</text>
  <text x="630" y="365" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">code-bg</text>
</svg>

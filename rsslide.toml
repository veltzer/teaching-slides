# rsslide configuration for this repository's decks.
#
# Everything not set here keeps rsslide's defaults, which reproduce marp's
# default theme, except the palette: the decks render in the fleet's azure
# palette from shared-themes, the one veltzer.github.io and the syllabi use,
# so a deck, the site that lists it and its syllabus look like one family. A
# deck may name another palette in its front matter (`theme: midnight`), or
# `theme: default` for marp's look; diagrams follow the palette (see
# rsslide's README, Themes).

[theme]
shared_themes = "shared/shared-themes"
default = "azure"

[credit]
# Who compiles these decks, named on each deck's first slide. Set here
# rather than taken from git, which CI's runner has no identity in.
name = "Mark Veltzer"
email = "mark.veltzer@gmail.com"

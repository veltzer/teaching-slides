# rsslide configuration for this repository's decks.
#
# Everything not set here keeps rsslide's defaults, which reproduce marp's
# default theme. The one setting is where the fleet's page palettes live: a
# deck may name one in its front matter (`theme: midnight`) and render in it,
# diagrams included (see rsslide's README, Themes).

[theme]
shared_themes = "shared/shared-themes"

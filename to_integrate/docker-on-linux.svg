<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="containerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="hwGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1000" height="820" fill="#f9fafb"/>

  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">
    Docker Container Running on Linux
  </text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#6b7280">
    Container = isolated process on a shared kernel (no guest OS, no hypervisor)
  </text>

  <!-- CONTAINER -->
  <g>
    <rect x="60" y="80" width="880" height="180" rx="10" fill="url(#containerGrad)" stroke="#0284c7" stroke-width="2"/>
    <text x="80" y="105" font-size="14" font-weight="700" fill="#075985">DOCKER CONTAINER (isolated user space)</text>

    <rect x="80" y="120" width="840" height="44" rx="6" fill="#ffffff" stroke="#0284c7"/>
    <text x="500" y="147" text-anchor="middle" font-size="13" fill="#0c4a6e">
      Application Process  —  e.g. nginx, python app, postgres
    </text>

    <rect x="80" y="172" width="840" height="44" rx="6" fill="#ffffff" stroke="#0284c7"/>
    <text x="500" y="192" text-anchor="middle" font-size="13" fill="#0c4a6e">
      Container Filesystem (image layers via union mount)
    </text>
    <text x="500" y="208" text-anchor="middle" font-size="11" fill="#475569">
      /bin   /etc   /usr   /var   /app   ...
    </text>

    <text x="80" y="238" font-size="11" fill="#0c4a6e" font-weight="600">
      Namespaces:  PID  •  NET  •  MNT  •  UTS  •  IPC  •  USER
    </text>
    <text x="80" y="254" font-size="11" fill="#0c4a6e" font-weight="600">
      Cgroups:  CPU  •  Memory  •  I/O  •  PIDs
    </text>
  </g>

  <!-- arrow container -> engine -->
  <line x1="500" y1="260" x2="500" y2="295" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="282" font-size="11" fill="#374151" font-style="italic">syscalls</text>

  <!-- DOCKER ENGINE -->
  <g>
    <rect x="60" y="300" width="880" height="110" rx="10" fill="url(#engineGrad)" stroke="#b45309" stroke-width="2"/>
    <text x="80" y="325" font-size="14" font-weight="700" fill="#78350f">DOCKER ENGINE (user space)</text>

    <rect x="120" y="340" width="240" height="50" rx="6" fill="#ffffff" stroke="#b45309"/>
    <text x="240" y="362" text-anchor="middle" font-size="13" fill="#78350f" font-weight="600">dockerd</text>
    <text x="240" y="378" text-anchor="middle" font-size="11" fill="#92400e">user-facing daemon / API</text>

    <rect x="380" y="340" width="240" height="50" rx="6" fill="#ffffff" stroke="#b45309"/>
    <text x="500" y="362" text-anchor="middle" font-size="13" fill="#78350f" font-weight="600">containerd</text>
    <text x="500" y="378" text-anchor="middle" font-size="11" fill="#92400e">container lifecycle manager</text>

    <rect x="640" y="340" width="240" height="50" rx="6" fill="#ffffff" stroke="#b45309"/>
    <text x="760" y="362" text-anchor="middle" font-size="13" fill="#78350f" font-weight="600">runc</text>
    <text x="760" y="378" text-anchor="middle" font-size="11" fill="#92400e">OCI runtime — creates container</text>
  </g>

  <!-- arrow engine -> kernel -->
  <line x1="500" y1="410" x2="500" y2="445" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- KERNEL -->
  <g>
    <rect x="60" y="450" width="880" height="240" rx="10" fill="url(#kernelGrad)" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="80" y="475" font-size="14" font-weight="700" fill="#7f1d1d">LINUX KERNEL (shared by host and all containers)</text>

    <!-- row 1 -->
    <rect x="80" y="490" width="270" height="80" rx="6" fill="#ffffff" stroke="#b91c1c"/>
    <text x="215" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Namespaces</text>
    <text x="215" y="532" text-anchor="middle" font-size="11" fill="#991b1b">isolation: own view of</text>
    <text x="215" y="548" text-anchor="middle" font-size="11" fill="#991b1b">PIDs, network, mounts,</text>
    <text x="215" y="562" text-anchor="middle" font-size="11" fill="#991b1b">hostname, IPC, users</text>

    <rect x="365" y="490" width="270" height="80" rx="6" fill="#ffffff" stroke="#b91c1c"/>
    <text x="500" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Cgroups</text>
    <text x="500" y="532" text-anchor="middle" font-size="11" fill="#991b1b">resource limits:</text>
    <text x="500" y="548" text-anchor="middle" font-size="11" fill="#991b1b">CPU, memory, I/O,</text>
    <text x="500" y="562" text-anchor="middle" font-size="11" fill="#991b1b">PIDs, devices</text>

    <rect x="650" y="490" width="270" height="80" rx="6" fill="#ffffff" stroke="#b91c1c"/>
    <text x="785" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Security</text>
    <text x="785" y="532" text-anchor="middle" font-size="11" fill="#991b1b">capabilities, seccomp,</text>
    <text x="785" y="548" text-anchor="middle" font-size="11" fill="#991b1b">AppArmor / SELinux,</text>
    <text x="785" y="562" text-anchor="middle" font-size="11" fill="#991b1b">user-ns mapping</text>

    <!-- row 2 -->
    <rect x="80" y="585" width="270" height="80" rx="6" fill="#ffffff" stroke="#b91c1c"/>
    <text x="215" y="607" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">OverlayFS</text>
    <text x="215" y="627" text-anchor="middle" font-size="11" fill="#991b1b">stacks read-only image</text>
    <text x="215" y="643" text-anchor="middle" font-size="11" fill="#991b1b">layers under a thin</text>
    <text x="215" y="657" text-anchor="middle" font-size="11" fill="#991b1b">writable layer</text>

    <rect x="365" y="585" width="270" height="80" rx="6" fill="#ffffff" stroke="#b91c1c"/>
    <text x="500" y="607" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Networking</text>
    <text x="500" y="627" text-anchor="middle" font-size="11" fill="#991b1b">bridge, veth pairs,</text>
    <text x="500" y="643" text-anchor="middle" font-size="11" fill="#991b1b">iptables / nftables,</text>
    <text x="500" y="657" text-anchor="middle" font-size="11" fill="#991b1b">network namespaces</text>

    <rect x="650" y="585" width="270" height="80" rx="6" fill="#ffffff" stroke="#b91c1c"/>
    <text x="785" y="607" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Core kernel</text>
    <text x="785" y="627" text-anchor="middle" font-size="11" fill="#991b1b">scheduler, memory mgmt,</text>
    <text x="785" y="643" text-anchor="middle" font-size="11" fill="#991b1b">VFS, drivers,</text>
    <text x="785" y="657" text-anchor="middle" font-size="11" fill="#991b1b">syscall interface</text>
  </g>

  <!-- arrow kernel -> hardware -->
  <line x1="500" y1="690" x2="500" y2="725" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HARDWARE -->
  <g>
    <rect x="60" y="730" width="880" height="70" rx="10" fill="url(#hwGrad)" stroke="#374151" stroke-width="2"/>
    <text x="500" y="758" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">HARDWARE</text>
    <text x="500" y="780" text-anchor="middle" font-size="12" fill="#374151">CPU  •  RAM  •  Disk / SSD  •  Network Interfaces</text>
  </g>
</svg>

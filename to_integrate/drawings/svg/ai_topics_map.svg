<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Central AI hub -->
  <rect x="540" y="280" width="200" height="100" rx="6" fill="url(#grad-primary)" stroke="#3d5a7d" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Artificial</text>
  <text x="640" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Intelligence</text>

  <!-- Connectors from center to branches -->
  <line x1="540" y1="300" x2="290" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="280" x2="640" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="300" x2="990" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="330" x2="290" y2="330" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="330" x2="990" y2="330" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="380" x2="290" y2="540" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="380" x2="640" y2="540" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="380" x2="990" y2="540" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch 1: AI Languages (top-left) - info -->
  <rect x="40" y="40" width="250" height="100" rx="6" fill="url(#grad-info)" stroke="#574a68" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">AI Languages</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Prolog</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Lisp, Scheme</text>
  <text x="60" y="128" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Symbolic AI</text>

  <!-- Branch 2: Traditional ML (top-center) - ok -->
  <rect x="500" y="40" width="280" height="100" rx="6" fill="url(#grad-ok)" stroke="#5a7a4d" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Traditional ML</text>
  <text x="520" y="88" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• kNN, SVM, Naive Bayes</text>
  <text x="520" y="108" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Trees, Random Forest</text>
  <text x="520" y="128" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Regression, Clustering</text>

  <!-- Branch 3: Deep Learning (top-right) - warn -->
  <rect x="990" y="40" width="250" height="100" rx="6" fill="url(#grad-warn)" stroke="#9c6e2e" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Deep Learning</text>
  <text x="1010" y="88" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Vision (CNN)</text>
  <text x="1010" y="108" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Audio, Language (LLM)</text>
  <text x="1010" y="128" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• GANs, Diffusion</text>

  <!-- Branch 4: NLP (middle-left) - info -->
  <rect x="40" y="280" width="250" height="100" rx="6" fill="url(#grad-info)" stroke="#574a68" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">NLP</text>
  <text x="60" y="328" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Tokenization</text>
  <text x="60" y="348" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Embeddings</text>
  <text x="60" y="368" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Translation</text>

  <!-- Branch 5: Reinforcement Learning (middle-right, added) - warn -->
  <rect x="990" y="280" width="250" height="100" rx="6" fill="url(#grad-warn)" stroke="#9c6e2e" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Reinforcement</text>
  <text x="1010" y="328" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Q-Learning, PPO</text>
  <text x="1010" y="348" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• RLHF</text>
  <text x="1010" y="368" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Robotics, games</text>

  <!-- Branch 6: AI for Development (bottom-left) - danger -->
  <rect x="40" y="500" width="250" height="120" rx="6" fill="url(#grad-danger)" stroke="#7d3f38" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">AI for Dev</text>
  <text x="165" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">(you are here)</text>
  <text x="60" y="565" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Basic: autocomplete</text>
  <text x="60" y="585" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Advanced: agentic coding</text>
  <text x="60" y="605" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Claude Code, Cursor</text>

  <!-- Branch 7: MLOps & Production (bottom-center) - ok -->
  <rect x="500" y="500" width="280" height="120" rx="6" fill="url(#grad-ok)" stroke="#5a7a4d" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">MLOps &amp; Production</text>
  <text x="520" y="548" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Training, versioning</text>
  <text x="520" y="568" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Serving, monitoring</text>
  <text x="520" y="588" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Fine-tuning, evals</text>
  <text x="520" y="608" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Safety, ethics</text>

  <!-- Branch 8: AI Agents (bottom-right) - danger -->
  <rect x="990" y="500" width="250" height="120" rx="6" fill="url(#grad-danger)" stroke="#7d3f38" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">AI Agents</text>
  <text x="1010" y="548" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Tool use, memory</text>
  <text x="1010" y="568" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• RAG, vector DBs</text>
  <text x="1010" y="588" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• MCP, multi-agent</text>
  <text x="1010" y="608" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">• Build your own</text>
</svg>

<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <pattern id="sharedMemory" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#e8f4f8"/>
      <circle cx="2" cy="2" r="1" fill="#0891b2"/>
      <circle cx="6" cy="6" r="1" fill="#0891b2"/>
    </pattern>
    <linearGradient id="userSpaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="kernelSpaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">
    io_uring: Shared Ring Buffer Architecture
  </text>
  
  <!-- User Space -->
  <rect x="50" y="60" width="800" height="200" fill="url(#userSpaceGrad)" stroke="#2563eb" stroke-width="2" rx="10"/>
  <text x="70" y="85" font-size="16" font-weight="bold" fill="#1e40af">User Space</text>
  
  <!-- Application -->
  <rect x="80" y="100" width="120" height="60" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="140" y="120" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Application</text>
  <text x="140" y="135" text-anchor="middle" font-size="10" fill="white">Process</text>
  <text x="140" y="150" text-anchor="middle" font-size="10" fill="white">(User Code)</text>
  
  <!-- Submission Queue (SQ) -->
  <rect x="250" y="90" width="180" height="80" fill="url(#sharedMemory)" stroke="#0891b2" stroke-width="3" rx="8"/>
  <text x="340" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">Submission Queue (SQ)</text>
  <text x="340" y="125" text-anchor="middle" font-size="10" fill="#0c4a6e">Shared Memory</text>
  
  <!-- SQEs -->
  <g id="sqes">
    <rect x="260" y="135" width="25" height="25" fill="#22c55e" stroke="#16a34a" stroke-width="1" rx="2"/>
    <text x="272" y="150" text-anchor="middle" font-size="8" fill="white">SQE</text>
    <rect x="290" y="135" width="25" height="25" fill="#22c55e" stroke="#16a34a" stroke-width="1" rx="2"/>
    <text x="302" y="150" text-anchor="middle" font-size="8" fill="white">SQE</text>
    <rect x="320" y="135" width="25" height="25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="2"/>
    <text x="332" y="150" text-anchor="middle" font-size="8" fill="#6b7280">...</text>
    <rect x="350" y="135" width="25" height="25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="2"/>
    <text x="362" y="150" text-anchor="middle" font-size="8" fill="#6b7280">...</text>
    <rect x="380" y="135" width="25" height="25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="2"/>
    <text x="392" y="150" text-anchor="middle" font-size="8" fill="#6b7280">...</text>
  </g>
  
  <!-- Completion Queue (CQ) -->
  <rect x="480" y="90" width="180" height="80" fill="url(#sharedMemory)" stroke="#0891b2" stroke-width="3" rx="8"/>
  <text x="570" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">Completion Queue (CQ)</text>
  <text x="570" y="125" text-anchor="middle" font-size="10" fill="#0c4a6e">Shared Memory</text>
  
  <!-- CQEs -->
  <g id="cqes">
    <rect x="490" y="135" width="25" height="25" fill="#f59e0b" stroke="#d97706" stroke-width="1" rx="2"/>
    <text x="502" y="150" text-anchor="middle" font-size="8" fill="white">CQE</text>
    <rect x="520" y="135" width="25" height="25" fill="#f59e0b" stroke="#d97706" stroke-width="1" rx="2"/>
    <text x="532" y="150" text-anchor="middle" font-size="8" fill="white">CQE</text>
    <rect x="550" y="135" width="25" height="25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="2"/>
    <text x="562" y="150" text-anchor="middle" font-size="8" fill="#6b7280">...</text>
    <rect x="580" y="135" width="25" height="25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="2"/>
    <text x="592" y="150" text-anchor="middle" font-size="8" fill="#6b7280">...</text>
    <rect x="610" y="135" width="25" height="25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="2"/>
    <text x="622" y="150" text-anchor="middle" font-size="8" fill="#6b7280">...</text>
  </g>
  
  <!-- liburing -->
  <rect x="700" y="100" width="120" height="60" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2" rx="5"/>
  <text x="760" y="120" text-anchor="middle" font-size="12" fill="white" font-weight="bold">liburing</text>
  <text x="760" y="135" text-anchor="middle" font-size="10" fill="white">Helper Library</text>
  <text x="760" y="150" text-anchor="middle" font-size="10" fill="white">(Optional)</text>
  
  <!-- Kernel Space -->
  <rect x="50" y="300" width="800" height="280" fill="url(#kernelSpaceGrad)" stroke="#f59e0b" stroke-width="2" rx="10"/>
  <text x="70" y="325" font-size="16" font-weight="bold" fill="#92400e">Kernel Space</text>
  
  <!-- io_uring Subsystem -->
  <rect x="80" y="340" width="160" height="80" fill="#dc2626" stroke="#b91c1c" stroke-width="2" rx="5"/>
  <text x="160" y="365" text-anchor="middle" font-size="12" fill="white" font-weight="bold">io_uring</text>
  <text x="160" y="380" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Subsystem</text>
  <text x="160" y="395" text-anchor="middle" font-size="10" fill="white">Ring Processing</text>
  <text x="160" y="408" text-anchor="middle" font-size="10" fill="white">SQ → CQ</text>
  
  <!-- I/O Subsystems -->
  <rect x="280" y="340" width="100" height="60" fill="#059669" stroke="#047857" stroke-width="2" rx="5"/>
  <text x="330" y="360" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Block I/O</text>
  <text x="330" y="375" text-anchor="middle" font-size="10" fill="white">File System</text>
  <text x="330" y="388" text-anchor="middle" font-size="10" fill="white">Storage</text>
  
  <rect x="400" y="340" width="100" height="60" fill="#059669" stroke="#047857" stroke-width="2" rx="5"/>
  <text x="450" y="360" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Network I/O</text>
  <text x="450" y="375" text-anchor="middle" font-size="10" fill="white">Sockets</text>
  <text x="450" y="388" text-anchor="middle" font-size="10" fill="white">TCP/UDP</text>
  
  <rect x="520" y="340" width="100" height="60" fill="#059669" stroke="#047857" stroke-width="2" rx="5"/>
  <text x="570" y="360" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Other I/O</text>
  <text x="570" y="375" text-anchor="middle" font-size="10" fill="white">Pipes, etc.</text>
  
  <!-- Hardware -->
  <rect x="650" y="340" width="120" height="60" fill="#6b7280" stroke="#4b5563" stroke-width="2" rx="5"/>
  <text x="710" y="365" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Hardware</text>
  <text x="710" y="380" text-anchor="middle" font-size="10" fill="white">Storage/Network</text>
  <text x="710" y="393" text-anchor="middle" font-size="10" fill="white">Devices</text>
  
  <!-- Polling Thread (Optional) -->
  <rect x="100" y="450" width="120" height="50" fill="#7c3aed" stroke="#6d28d9" stroke-width="2" rx="5" stroke-dasharray="5,5"/>
  <text x="160" y="470" text-anchor="middle" font-size="11" fill="white" font-weight="bold">SQ Poll Thread</text>
  <text x="160" y="485" text-anchor="middle" font-size="9" fill="white">(Optional Polling)</text>
  
  <!-- Arrows and Flow -->
  
  <!-- App to SQ -->
  <line x1="200" y1="130" x2="250" y2="130" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="225" y="120" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="bold">1. Submit</text>
  <text x="225" y="145" text-anchor="middle" font-size="9" fill="#16a34a">SQEs</text>
  
  <!-- CQ to App -->
  <line x1="570" y1="180" x2="200" y2="180" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="385" y="170" text-anchor="middle" font-size="10" fill="#d97706" font-weight="bold">4. Read Completions</text>
  <text x="385" y="195" text-anchor="middle" font-size="9" fill="#d97706">CQEs</text>
  
  <!-- SQ to Kernel -->
  <line x1="340" y1="170" x2="340" y2="300" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="355" y="235" font-size="10" fill="#b91c1c" font-weight="bold">2. Process</text>
  <text x="355" y="250" font-size="9" fill="#b91c1c">Requests</text>
  
  <!-- Kernel to CQ -->
  <line x1="240" y1="380" x2="480" y2="150" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="320" y="280" font-size="10" fill="#d97706" font-weight="bold">3. Complete</text>
  <text x="320" y="295" font-size="9" fill="#d97706">Results</text>
  
  <!-- Kernel I/O flows -->
  <line x1="240" y1="380" x2="280" y2="370" stroke="#047857" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="380" x2="400" y2="370" stroke="#047857" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="380" x2="520" y2="370" stroke="#047857" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Hardware connections -->
  <line x1="380" y1="370" x2="650" y2="370" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="370" x2="650" y2="370" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="620" y1="370" x2="650" y2="370" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Polling thread connection -->
  <line x1="160" y1="450" x2="160" y2="420" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <line x1="180" y1="475" x2="250" y2="475" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="250" y1="475" x2="250" y2="170" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  
  <!-- System calls -->
  <rect x="70" y="200" width="760" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="5"/>
  <text x="450" y="215" text-anchor="middle" font-size="12" fill="#475569" font-weight="bold">System Call Interface</text>
  <text x="150" y="230" font-size="10" fill="#64748b">io_uring_setup()</text>
  <text x="280" y="230" font-size="10" fill="#64748b">io_uring_enter()</text>
  <text x="420" y="230" font-size="10" fill="#64748b">io_uring_register()</text>
  <text x="580" y="230" font-size="10" fill="#64748b">mmap() for rings</text>
  
  <!-- Key Features Box -->
  <rect x="680" y="180" width="160" height="80" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="5"/>
  <text x="760" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Key Features</text>
  <text x="690" y="220" font-size="10" fill="#475569">• Zero-copy operation</text>
  <text x="690" y="235" font-size="10" fill="#475569">• Batch processing</text>
  <text x="690" y="250" font-size="10" fill="#475569">• Minimal syscalls</text>
  
  <!-- Operation Types -->
  <rect x="100" y="520" width="650" height="50" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="5"/>
  <text x="425" y="540" text-anchor="middle" font-size="12" font-weight="bold" fill="#0c4a6e">Supported Operations</text>
  <text x="130" y="555" font-size="10" fill="#0369a1">read/write</text>
  <text x="200" y="555" font-size="10" fill="#0369a1">accept/connect</text>
  <text x="290" y="555" font-size="10" fill="#0369a1">send/recv</text>
  <text x="360" y="555" font-size="10" fill="#0369a1">fsync</text>
  <text x="410" y="555" font-size="10" fill="#0369a1">openat</text>
  <text x="460" y="555" font-size="10" fill="#0369a1">close</text>
  <text x="510" y="555" font-size="10" fill="#0369a1">timeout</text>
  <text x="570" y="555" font-size="10" fill="#0369a1">poll</text>
  <text x="620" y="555" font-size="10" fill="#0369a1">splice</text>
  <text x="680" y="555" font-size="10" fill="#0369a1">+ many more</text>
  
  <!-- Flow numbers -->
  <circle cx="225" cy="130" r="12" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="225" y="135" text-anchor="middle" font-size="10" fill="white" font-weight="bold">1</text>
  
  <circle cx="340" cy="285" r="12" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
  <text x="340" y="290" text-anchor="middle" font-size="10" fill="white" font-weight="bold">2</text>
  
  <circle cx="360" cy="265" r="12" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="270" text-anchor="middle" font-size="10" fill="white" font-weight="bold">3</text>
  
  <circle cx="385" cy="180" r="12" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="385" y="185" text-anchor="middle" font-size="10" fill="white" font-weight="bold">4</text>
</svg>
    <text x="300" y="120">Released</text>
    <text x="390" y="120">GitHub Stars</text>
    <text x="510" y="120">Async Support</text>
    <text x="670" y="120">Performance</text>
    <text x="820" y="120">Learning</text>
    <text x="940" y="120">Best For</text>
  </g>
  
  <!-- Header line -->
  <line x1="30" y1="135" x2="1370" y2="135" stroke="#333" stroke-width="2"/>
  
  <!-- Row 1: Django -->
  <g transform="translate(0, 160)">
    <line x1="30" y1="55" x2="1370" y2="55" stroke="#252525" stroke-width="1"/>
    <text x="40" y="30" font-family="monospace" font-size="14" font-weight="600" fill="#fff">Django</text>
    <rect x="180" y="15" width="80" height="22" rx="4" fill="#1e3a5f"/>
    <text x="220" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#7dd3fc">Full-Stack</text>
    <text x="300" y="30" font-family="monospace" font-size="13" fill="#888">2005</text>
    <text x="390" y="30" font-family="monospace" font-size="13" fill="#fbbf24">★ 82k+</text>
    <text x="510" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#eab308">◐ Partial (ASGI)</text>
    <text x="670" y="30" font-family="monospace" font-size="12" fill="#f97316">~3,000 req/s</text>
    <text x="820" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#888">Steep</text>
    <text x="940" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">Large apps, CMS, admin-heavy</text>
  </g>
  
  <!-- Row 2: FastAPI -->
  <g transform="translate(0, 220)">
    <line x1="30" y1="55" x2="1370" y2="55" stroke="#252525" stroke-width="1"/>
    <text x="40" y="30" font-family="monospace" font-size="14" font-weight="600" fill="#fff">FastAPI</text>
    <rect x="180" y="15" width="80" height="22" rx="4" fill="#3d2d1f"/>
    <text x="220" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#fcd34d">Micro/API</text>
    <text x="300" y="30" font-family="monospace" font-size="13" fill="#888">2018</text>
    <text x="390" y="30" font-family="monospace" font-size="13" fill="#fbbf24">★ 75k+</text>
    <text x="510" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">✓ Native async</text>
    <text x="670" y="30" font-family="monospace" font-size="12" fill="#22c55e" filter="url(#glow)">~20,000+ req/s</text>
    <text x="820" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#888">Moderate</text>
    <text x="940" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">APIs, microservices, ML</text>
  </g>
  

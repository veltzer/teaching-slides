    <text x="390" y="30" font-family="monospace" font-size="13" fill="#fbbf24">★ 21k+</text>
    <text x="510" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#eab308">◐ Limited</text>
    <text x="670" y="30" font-family="monospace" font-size="12" fill="#888">N/A (UI focused)</text>
    <text x="820" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#888">Easy-Mod</text>
    <text x="940" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">Data dashboards, viz</text>

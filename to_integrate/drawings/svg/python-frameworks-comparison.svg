    <text x="820" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#888">Moderate</text>
    <text x="940" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">High-performance APIs</text>

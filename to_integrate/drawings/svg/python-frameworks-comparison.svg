    <line x1="30" y1="55" x2="1370" y2="55" stroke="#252525" stroke-width="1"/>
    <text x="40" y="30" font-family="monospace" font-size="14" font-weight="600" fill="#fff">Bottle</text>
    <rect x="180" y="15" width="55" height="22" rx="4" fill="#3d1f1f"/>
    <text x="207" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#fca5a5">Micro</text>

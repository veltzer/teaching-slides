    <rect x="180" y="15" width="55" height="22" rx="4" fill="#3d1f1f"/>
    <text x="207" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#fca5a5">Micro</text>
    <text x="300" y="30" font-family="monospace" font-size="13" fill="#888">2010</text>
    <text x="390" y="30" font-family="monospace" font-size="13" fill="#fbbf24">★ 68k+</text>
    <text x="510" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#eab308">◐ Limited</text>
    <text x="670" y="30" font-family="monospace" font-size="12" fill="#eab308">~4,000-5,000 req/s</text>
    <text x="820" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#888">Easy</text>
    <text x="940" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">Small apps, prototypes</text>
  </g>
  
  <!-- Row 4: Tornado -->
  <g transform="translate(0, 340)">
    <line x1="30" y1="55" x2="1370" y2="55" stroke="#252525" stroke-width="1"/>
    <text x="40" y="30" font-family="monospace" font-size="14" font-weight="600" fill="#fff">Tornado</text>
    <rect x="180" y="15" width="55" height="22" rx="4" fill="#1f3d2d"/>
    <text x="207" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#86efac">Async</text>
    <text x="300" y="30" font-family="monospace" font-size="13" fill="#888">2009</text>
    <text x="390" y="30" font-family="monospace" font-size="13" fill="#fbbf24">★ 21k+</text>
    <text x="510" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">✓ Native</text>
    <text x="670" y="30" font-family="monospace" font-size="12" fill="#84cc16">~8,000-12,000 req/s</text>
    <text x="820" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#888">Moderate</text>
    <text x="940" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">WebSockets, real-time</text>
  </g>
  
  <!-- Row 5: Dash -->

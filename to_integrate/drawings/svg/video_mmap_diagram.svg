<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <style>
      .title { font: bold 24px sans-serif; fill: #2c3e50; }
      .subtitle { font: bold 16px sans-serif; fill: #34495e; }
      .label { font: 14px sans-serif; fill: #2c3e50; }
      .code { font: 12px monospace; fill: #27ae60; }
      .comment { font: 11px sans-serif; fill: #7f8c8d; font-style: italic; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .kernel-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; }
      .userspace-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
      .buffer-box { fill: #fff3e0; stroke: #ef6c00; stroke-width: 2; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .data-arrow { stroke: #e74c3c; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Direct Video Buffer Access via mmap</text>
  <text x="400" y="55" text-anchor="middle" class="comment">V4L2 Memory-Mapped I/O</text>
  
  <!-- User Space Section -->
  <rect x="50" y="80" width="700" height="340" class="userspace-box" rx="5"/>
  <text x="400" y="105" text-anchor="middle" class="subtitle">User Space Application</text>
  
  <!-- Step 1: Open Device -->
  <rect x="70" y="120" width="300" height="80" class="box" rx="3"/>
  <text x="220" y="145" text-anchor="middle" class="label">1. Open Video Device</text>
  <text x="80" y="170" class="code">fd = open("/dev/video0", O_RDWR);</text>
  <text x="80" y="190" class="comment">Get file descriptor for camera</text>
  
  <!-- Step 2: Request Buffers -->
  <rect x="70" y="220" width="300" height="90" class="box" rx="3"/>
  <text x="220" y="245" text-anchor="middle" class="label">2. Request Buffers</text>
  <text x="80" y="270" class="code">struct v4l2_requestbuffers req;</text>
  <text x="80" y="285" class="code">req.count = 4;  // 4 buffers</text>
  <text x="80" y="300" class="code">ioctl(fd, VIDIOC_REQBUFS, &amp;req);</text>
  
  <!-- Step 3: Query & Map -->
  <rect x="430" y="120" width="300" height="190" class="box" rx="3"/>
  <text x="580" y="145" text-anchor="middle" class="label">3. Query &amp; mmap Each Buffer</text>
  <text x="440" y="170" class="code">for (i = 0; i &lt; 4; i++) {</text>
  <text x="450" y="185" class="code">  struct v4l2_buffer buf;</text>
  <text x="450" y="200" class="code">  buf.index = i;</text>
  <text x="450" y="215" class="code">  ioctl(fd, VIDIOC_QUERYBUF, &amp;buf);</text>
  <text x="450" y="235" class="code">  buffers[i] = mmap(NULL,</text>
  <text x="470" y="250" class="code">buf.length,</text>
  <text x="470" y="265" class="code">PROT_READ | PROT_WRITE,</text>
  <text x="470" y="280" class="code">MAP_SHARED, fd,</text>
  <text x="470" y="295" class="code">buf.m.offset);</text>
  <text x="440" y="305" class="code">}</text>
  
  <!-- Step 4: Queue & Stream -->
  <rect x="70" y="330" width="300" height="70" class="box" rx="3"/>
  <text x="220" y="355" text-anchor="middle" class="label">4. Queue Buffers &amp; Start</text>
  <text x="80" y="375" class="code">ioctl(fd, VIDIOC_QBUF, &amp;buf);</text>
  <text x="80" y="390" class="code">ioctl(fd, VIDIOC_STREAMON, ...);</text>
  
  <!-- Arrows between steps -->
  <path d="M 220 200 L 220 220" class="arrow"/>
  <path d="M 220 310 L 220 330" class="arrow"/>
  <path d="M 370 160 L 430 160" class="arrow"/>
  
  <!-- Kernel Space Section -->
  <rect x="50" y="450" width="700" height="200" class="kernel-box" rx="5"/>
  <text x="400" y="475" text-anchor="middle" class="subtitle">Kernel Space (V4L2 Driver)</text>
  
  <!-- Kernel manages buffers -->
  <rect x="70" y="490" width="300" height="140" class="box" rx="3"/>
  <text x="220" y="515" text-anchor="middle" class="label">Driver Buffer Management</text>
  <text x="80" y="540" class="comment">• Allocates physically contiguous memory</text>
  <text x="80" y="560" class="comment">• Manages DMA transfers from camera</text>
  <text x="80" y="580" class="comment">• Tracks buffer states (queued/done)</text>
  <text x="80" y="600" class="comment">• Signals when buffers are ready</text>
  <text x="80" y="620" class="comment">• Maps kernel memory to user space</text>
  
  <!-- Memory mapping visualization -->
  <rect x="430" y="490" width="300" height="140" class="box" rx="3"/>
  <text x="580" y="515" text-anchor="middle" class="label">Memory Mapping</text>
  <text x="440" y="540" class="comment">Kernel Physical Memory</text>
  <rect x="450" y="550" width="100" height="30" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="500" y="570" text-anchor="middle" class="code">Buffer 0</text>
  <rect x="560" y="550" width="100" height="30" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="610" y="570" text-anchor="middle" class="code">Buffer 1</text>
  <text x="440" y="600" class="comment">↕ mmap() creates mapping</text>
  <text x="440" y="620" class="comment">User space sees same memory</text>
  
  <!-- Arrow from user to kernel -->
  <path d="M 400 420 L 400 450" class="arrow"/>
  <text x="420" y="440" class="comment">ioctl calls</text>
  
  <!-- Hardware Section -->
  <rect x="50" y="680" width="700" height="120" class="buffer-box" rx="5"/>
  <text x="400" y="705" text-anchor="middle" class="subtitle">Video Hardware (Camera/Capture Device)</text>
  
  <rect x="150" y="720" width="500" height="60" class="box" rx="3"/>
  <text x="400" y="745" text-anchor="middle" class="label">Camera → DMA → Physical Memory</text>
  <text x="160" y="765" class="comment">Hardware writes video frames directly to mapped buffers</text>
  
  <!-- Data flow arrow -->
  <path d="M 400 650 L 400 680" class="data-arrow"/>
  <text x="420" y="670" class="comment" fill="#e74c3c">DMA transfer</text>
  
  <!-- Runtime Flow -->
  <rect x="50" y="830" width="700" height="150" class="box" rx="5"/>
  <text x="400" y="855" text-anchor="middle" class="subtitle">5. Runtime Loop (Zero-Copy Access)</text>
  
  <text x="70" y="880" class="code">while (capturing) {</text>
  <text x="80" y="900" class="code">  // Wait for buffer to be filled by hardware</text>
  <text x="80" y="915" class="code">  ioctl(fd, VIDIOC_DQBUF, &amp;buf);  // Dequeue</text>
  <text x="80" y="935" class="code">  // Access frame data directly in memory!</text>
  <text x="80" y="950" class="code">  process_frame(buffers[buf.index], buf.bytesused);</text>
  <text x="80" y="970" class="code">  ioctl(fd, VIDIOC_QBUF, &amp;buf);   // Re-queue</text>
  <text x="70" y="985" class="code">}</text>
  
  <!-- Key benefit callout -->
  <ellipse cx="650" cy="920" rx="120" ry="40" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="650" y="915" text-anchor="middle" class="label" fill="#155724">Zero-Copy!</text>
  <text x="650" y="932" text-anchor="middle" class="comment" fill="#155724">No data copying</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 935" width="1200" height="935" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e88e5"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 700; fill: #263238; }
      .h  { font-size: 13px; font-weight: 700; fill: #263238; text-anchor: middle; }
      .s  { font-size: 12px; fill: #37474f; text-anchor: middle; }
      .n  { font-size: 12.5px; fill: #37474f; }
      .box { rx: 8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="935" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#263238">How an Operating System Is Organized</text>

  <!-- ================= LEFT: LAYER STACK ================= -->

  <!-- User space -->
  <rect x="20" y="70" width="620" height="130" class="box" fill="#e8f5e9" stroke="#43a047"/>
  <text x="35" y="95" class="t">USER SPACE  ·  user mode (ring 3, least privileged)</text>
  <rect x="45"  y="112" width="170" height="68" class="box" fill="#fff" stroke="#43a047"/>
  <text x="130" y="140" class="h">App A</text><text x="130" y="160" class="s">own virtual memory</text>
  <rect x="235" y="112" width="170" height="68" class="box" fill="#fff" stroke="#43a047"/>
  <text x="320" y="140" class="h">App B</text><text x="320" y="160" class="s">own virtual memory</text>
  <rect x="425" y="112" width="190" height="68" class="box" fill="#fff" stroke="#43a047"/>
  <text x="520" y="140" class="h">Shell / Services</text><text x="520" y="160" class="s">own virtual memory</text>

  <!-- privilege boundary -->
  <line x1="20" y1="225" x2="640" y2="225" stroke="#b71c1c" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="245" y="214" width="170" height="22" fill="#fff"/>
  <text x="330" y="230" class="s" fill="#b71c1c" font-weight="700" style="fill:#b71c1c">privilege boundary</text>
  <line x1="110" y1="202" x2="110" y2="248" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="120" y="221" class="n">system call (trap)</text>
  <line x1="530" y1="248" x2="530" y2="202" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="540" y="221" class="n">result</text>

  <!-- Kernel space -->
  <rect x="20" y="250" width="620" height="170" class="box" fill="#ffebee" stroke="#e53935"/>
  <text x="35" y="275" class="t">KERNEL SPACE  ·  supervisor mode (ring 0, most privileged)</text>
  <rect x="45"  y="288" width="180" height="52" class="box" fill="#fff" stroke="#e53935"/>
  <text x="135" y="310" class="h">Scheduler</text><text x="135" y="328" class="s">who runs on the CPU</text>
  <rect x="240" y="288" width="180" height="52" class="box" fill="#fff" stroke="#e53935"/>
  <text x="330" y="310" class="h">Memory Manager</text><text x="330" y="328" class="s">owns the page tables</text>
  <rect x="435" y="288" width="180" height="52" class="box" fill="#fff" stroke="#e53935"/>
  <text x="525" y="310" class="h">File Systems</text><text x="525" y="328" class="s">files, directories</text>
  <rect x="45"  y="352" width="180" height="52" class="box" fill="#fff" stroke="#e53935"/>
  <text x="135" y="374" class="h">Networking</text><text x="135" y="392" class="s">protocols, sockets</text>
  <rect x="240" y="352" width="180" height="52" class="box" fill="#fff" stroke="#e53935"/>
  <text x="330" y="374" class="h">Device Drivers</text><text x="330" y="392" class="s">talk to hardware</text>
  <rect x="435" y="352" width="180" height="52" class="box" fill="#fff" stroke="#e53935"/>
  <text x="525" y="374" class="h">Interrupt Handlers</text><text x="525" y="392" class="s">react to events</text>

  <!-- kernel <-> hardware -->
  <line x1="110" y1="422" x2="110" y2="458" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="120" y="445" class="n">commands, configure MMU</text>
  <line x1="530" y1="458" x2="530" y2="422" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="540" y="445" class="n">interrupts</text>

  <!-- Hardware -->
  <rect x="20" y="460" width="620" height="115" class="box" fill="#eceff1" stroke="#546e7a"/>
  <text x="35" y="484" class="t">HARDWARE</text>
  <rect x="45" y="495" width="185" height="66" class="box" fill="#fff" stroke="#546e7a"/>
  <text x="85" y="533" class="h">CPU</text>
  <rect x="122" y="505" width="96" height="46" rx="6" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="170" y="526" class="h">MMU</text><text x="170" y="542" class="s">addr. translation</text>
  <rect x="245" y="495" width="120" height="66" class="box" fill="#fff" stroke="#546e7a"/>
  <text x="305" y="524" class="h">RAM</text><text x="305" y="542" class="s">physical memory</text>
  <rect x="380" y="495" width="110" height="66" class="box" fill="#fff" stroke="#546e7a"/>
  <text x="435" y="524" class="h">Disk</text><text x="435" y="542" class="s">storage</text>
  <rect x="505" y="495" width="110" height="66" class="box" fill="#fff" stroke="#546e7a"/>
  <text x="560" y="524" class="h">Devices</text><text x="560" y="542" class="s">net, USB, screen</text>

  <!-- ================= RIGHT: PROTECTION RINGS ================= -->
  <text x="930" y="80" class="h" font-size="16">Protection Rings</text>
  <circle cx="930" cy="320" r="225" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <circle cx="930" cy="320" r="172" fill="#fffde7" stroke="#c0a000" stroke-width="1.2"/>
  <circle cx="930" cy="320" r="122" fill="#fff8e1" stroke="#c0a000" stroke-width="1.2"/>
  <circle cx="930" cy="320" r="72"  fill="#ffcdd2" stroke="#e53935" stroke-width="1.5"/>
  <text x="930" y="125" class="h">Ring 3 — Applications</text>
  <text x="930" y="174" class="h" style="fill:#8d6e00">Ring 2</text>
  <text x="930" y="224" class="h" style="fill:#8d6e00">Ring 1</text>
  <text x="930" y="315" class="h" font-size="15">Ring 0</text>
  <text x="930" y="335" class="s">Kernel</text>
  <text x="930" y="420" class="s">rings 1–2: optional,</text>
  <text x="930" y="435" class="s">rarely used</text>
  <text x="930" y="520" class="s">untrusted, can't touch hardware directly</text>
  <!-- gate arrow -->
  <path d="M1105,190 Q1060,250 990,280" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="1088" y="160" width="86" height="20" fill="#fff" rx="4"/>
  <text x="1131" y="175" class="s" font-weight="700">only via gates</text>
  <text x="930" y="568" class="s">Inner = more privilege. Outer code enters inward only through gates (syscalls, interrupts).</text>
  <text x="930" y="585" class="s">Many CPUs simply have two levels: user mode and supervisor (kernel) mode.</text>

  <!-- ================= BOTTOM: MMU / VIRTUAL MEMORY ================= -->
  <rect x="20" y="605" width="1160" height="315" class="box" fill="#faf8ff" stroke="#7e57c2"/>
  <text x="35" y="632" class="t">MMU: every address a program uses is virtual — hardware translates it to a physical address using the running process's page table</text>

  <text x="100" y="662" class="h" style="fill:#1565c0">Process A (virtual)</text>
  <text x="270" y="662" class="h">A's page table</text>
  <text x="505" y="662" class="h">Physical RAM (frames)</text>
  <text x="740" y="662" class="h">B's page table</text>
  <text x="910" y="662" class="h" style="fill:#e65100">Process B (virtual)</text>

  <!-- Process A pages -->
  <g fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5">
    <rect x="40" y="678" width="120" height="34" rx="5"/>
    <rect x="40" y="720" width="120" height="34" rx="5"/>
    <rect x="40" y="762" width="120" height="34" rx="5"/>
    <rect x="40" y="804" width="120" height="34" rx="5" stroke-dasharray="5 3"/>
  </g>
  <text x="100" y="700" class="s">page 0</text>
  <text x="100" y="742" class="s">page 1</text>
  <text x="100" y="784" class="s">page 2 (lib)</text>
  <text x="100" y="826" class="s">page 3</text>

  <!-- A page table -->
  <g fill="#fff" stroke="#7e57c2" stroke-width="1.2">
    <rect x="200" y="678" width="140" height="34"/>
    <rect x="200" y="720" width="140" height="34"/>
    <rect x="200" y="762" width="140" height="34"/>
    <rect x="200" y="804" width="140" height="34"/>
  </g>
  <text x="270" y="700" class="s">0 → frame 1</text>
  <text x="270" y="742" class="s">1 → frame 5</text>
  <text x="270" y="784" class="s">2 → frame 3</text>
  <text x="270" y="826" class="s" style="fill:#c62828;font-weight:700">3 → ✗ not mapped</text>

  <!-- A arrows -->
  <g stroke="#1e88e5" stroke-width="1.8" fill="none" marker-end="url(#arrA)">
    <line x1="160" y1="695" x2="198" y2="695"/>
    <line x1="160" y1="737" x2="198" y2="737"/>
    <line x1="160" y1="779" x2="198" y2="779"/>
    <line x1="340" y1="695" x2="418" y2="719.5"/>
    <line x1="340" y1="737" x2="418" y2="851.5"/>
    <line x1="340" y1="779" x2="418" y2="785.5"/>
  </g>
  <line x1="160" y1="821" x2="198" y2="821" stroke="#c62828" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="40" y="866" class="n" style="fill:#c62828;font-weight:700">Touch page 3 ⇒ page fault ⇒ CPU jumps to the kernel,</text>
  <text x="40" y="884" class="n" style="fill:#c62828">which loads the page (e.g. from disk) or kills the process.</text>

  <!-- Physical RAM frames -->
  <rect x="420" y="672" width="170" height="29" fill="#ffcdd2" stroke="#e53935"/>
  <text x="505" y="691" class="s">0: kernel</text>
  <rect x="420" y="705" width="170" height="29" fill="#e3f2fd" stroke="#1e88e5"/>
  <text x="505" y="724" class="s">1: A</text>
  <rect x="420" y="738" width="170" height="29" fill="#fff3e0" stroke="#fb8c00"/>
  <text x="505" y="757" class="s">2: B</text>
  <rect x="420" y="771" width="170" height="29" fill="#ede7f6" stroke="#7e57c2"/>
  <text x="505" y="790" class="s">3: shared lib (A + B)</text>
  <rect x="420" y="804" width="170" height="29" fill="#ffffff" stroke="#90a4ae"/>
  <text x="505" y="823" class="s">4: free</text>
  <rect x="420" y="837" width="170" height="29" fill="#e3f2fd" stroke="#1e88e5"/>
  <text x="505" y="856" class="s">5: A</text>
  <rect x="420" y="870" width="170" height="29" fill="#fff3e0" stroke="#fb8c00"/>
  <text x="505" y="889" class="s">6: B</text>

  <!-- B page table -->
  <g fill="#fff" stroke="#7e57c2" stroke-width="1.2">
    <rect x="670" y="678" width="140" height="34"/>
    <rect x="670" y="720" width="140" height="34"/>
    <rect x="670" y="762" width="140" height="34"/>
  </g>
  <text x="740" y="700" class="s">0 → frame 2</text>
  <text x="740" y="742" class="s">1 → frame 6</text>
  <text x="740" y="784" class="s">2 → frame 3</text>

  <!-- Process B pages -->
  <g fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5">
    <rect x="850" y="678" width="120" height="34" rx="5"/>
    <rect x="850" y="720" width="120" height="34" rx="5"/>
    <rect x="850" y="762" width="120" height="34" rx="5"/>
  </g>
  <text x="910" y="700" class="s">page 0</text>
  <text x="910" y="742" class="s">page 1</text>
  <text x="910" y="784" class="s">page 2 (lib)</text>

  <!-- B arrows -->
  <g stroke="#fb8c00" stroke-width="1.8" fill="none" marker-end="url(#arrB)">
    <line x1="850" y1="695" x2="812" y2="695"/>
    <line x1="850" y1="737" x2="812" y2="737"/>
    <line x1="850" y1="779" x2="812" y2="779"/>
    <line x1="670" y1="695" x2="592" y2="752.5"/>
    <line x1="670" y1="737" x2="592" y2="884.5"/>
    <line x1="670" y1="779" x2="592" y2="785.5"/>
  </g>

  <!-- Notes -->
  <text x="995" y="690" class="n" font-weight="700">Why it matters</text>
  <text x="995" y="714" class="n">• Each process sees its</text>
  <text x="1005" y="731" class="n">own private memory</text>
  <text x="995" y="755" class="n">• A can't reach B's frames:</text>
  <text x="1005" y="772" class="n">no mapping, no access</text>
  <text x="995" y="796" class="n">• Sharing is explicit</text>
  <text x="1005" y="813" class="n">(frame 3)</text>
  <text x="995" y="837" class="n">• Only ring 0 may edit</text>
  <text x="1005" y="854" class="n">page tables</text>
  <text x="995" y="878" class="n">• Process switch =</text>
  <text x="1005" y="895" class="n">switch page table</text>
</svg>

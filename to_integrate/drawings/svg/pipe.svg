<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    How Pipes Work in Unix/Linux
  </text>
  
  <!-- Process 1 -->
  <g id="process1">
    <rect x="50" y="80" width="150" height="100" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2" rx="5"/>
    <text x="125" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Process 1</text>
    <text x="125" y="135" font-size="14" text-anchor="middle" fill="white">ls -la</text>
    <text x="125" y="160" font-size="12" text-anchor="middle" fill="white">(writes to stdout)</text>
  </g>
  
  <!-- Process 2 -->
  <g id="process2">
    <rect x="600" y="80" width="150" height="100" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2" rx="5"/>
    <text x="675" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Process 2</text>
    <text x="675" y="135" font-size="14" text-anchor="middle" fill="white">grep "txt"</text>
    <text x="675" y="160" font-size="12" text-anchor="middle" fill="white">(reads from stdin)</text>
  </g>
  
  <!-- Pipe visualization -->
  <g id="pipe">
    <!-- Pipe body -->
    <rect x="250" y="100" width="300" height="60" fill="#FFD700" stroke="#DAA520" stroke-width="2" rx="30"/>
    <text x="400" y="135" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">PIPE</text>
    
    <!-- Flow arrow inside pipe -->
    <path d="M 280 130 L 520 130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Connection arrows -->
  <path d="M 200 130 L 250 130" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 550 130 L 600 130" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Detailed Pipe Mechanism -->
  <g id="detail" transform="translate(0, 250)">
    <text x="400" y="0" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
      Pipe Internal Mechanism
    </text>
    
    <!-- Kernel space -->
    <rect x="200" y="30" width="400" height="200" fill="#F0F0F0" stroke="#999" stroke-width="2" stroke-dasharray="5,5" rx="5"/>
    <text x="400" y="55" font-size="16" font-weight="bold" text-anchor="middle" fill="#666">
      Kernel Space
    </text>
    
    <!-- Buffer -->
    <rect x="300" y="80" width="200" height="60" fill="#90EE90" stroke="#228B22" stroke-width="2" rx="5"/>
    <text x="400" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Pipe Buffer
    </text>
    <text x="400" y="120" font-size="12" text-anchor="middle" fill="#333">
      (typically 64KB)
    </text>
    
    <!-- File descriptors -->
    <g id="fd1">
      <circle cx="250" cy="110" r="25" fill="#FF6B6B" stroke="#CC0000" stroke-width="2"/>
      <text x="250" y="115" font-size="12" text-anchor="middle" fill="white">FD[1]</text>
      <text x="250" y="145" font-size="10" text-anchor="middle" fill="#333">Write end</text>
    </g>
    
    <g id="fd2">
      <circle cx="550" cy="110" r="25" fill="#4ECDC4" stroke="#008B8B" stroke-width="2"/>
      <text x="550" y="115" font-size="12" text-anchor="middle" fill="white">FD[0]</text>
      <text x="550" y="145" font-size="10" text-anchor="middle" fill="#333">Read end</text>
    </g>
    
    <!-- Data flow arrows -->
    <path d="M 275 110 L 300 110" stroke="#CC0000" stroke-width="2" marker-end="url(#arrowhead2)"/>
    <path d="M 500 110 L 525 110" stroke="#008B8B" stroke-width="2" marker-end="url(#arrowhead3)"/>
    
    <!-- Arrow markers for FDs -->
    <defs>
      <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
        <polygon points="0 0, 10 5, 0 10" fill="#CC0000"/>
      </marker>
      <marker id="arrowhead3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
        <polygon points="0 0, 10 5, 0 10" fill="#008B8B"/>
      </marker>
    </defs>
    
    <!-- Properties -->
    <g id="properties" transform="translate(250, 170)">
      <text x="0" y="0" font-size="12" fill="#333">• Unidirectional data flow</text>
      <text x="0" y="20" font-size="12" fill="#333">• FIFO (First In, First Out)</text>
      <text x="0" y="40" font-size="12" fill="#333">• Automatic blocking when full/empty</text>
    </g>
  </g>
  
  <!-- Example command -->
  <g id="example" transform="translate(50, 520)">
    <rect x="0" y="0" width="700" height="50" fill="#2C3E50" rx="5"/>
    <text x="350" y="20" font-size="14" text-anchor="middle" fill="#0F0">
      $ ls -la | grep "txt" | wc -l
    </text>
    <text x="350" y="40" font-size="12" text-anchor="middle" fill="#AAA">
      Process 1 → Pipe 1 → Process 2 → Pipe 2 → Process 3
    </text>
  </g>
</svg>

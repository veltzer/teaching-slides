<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold">Cross-Site Request Forgery (CSRF)</text>

  <!-- Actors -->
  <!-- Attacker -->
  <rect x="40" y="80" width="160" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="108" text-anchor="middle" font-weight="bold" fill="#c0392b">Attacker</text>
  <text x="120" y="128" text-anchor="middle" fill="#555">evil.com</text>

  <!-- Victim browser -->
  <rect x="370" y="80" width="160" height="70" rx="8" fill="#eef5ff" stroke="#2c5fa8" stroke-width="2"/>
  <text x="450" y="108" text-anchor="middle" font-weight="bold" fill="#2c5fa8">Victim's Browser</text>
  <text x="450" y="128" text-anchor="middle" fill="#555">(logged into bank.com)</text>

  <!-- Bank -->
  <rect x="700" y="80" width="160" height="70" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="780" y="108" text-anchor="middle" font-weight="bold" fill="#27ae60">bank.com</text>
  <text x="780" y="128" text-anchor="middle" fill="#555">trusts session cookie</text>

  <!-- Cookie indicator on browser -->
  <circle cx="525" cy="92" r="10" fill="#f1c40f" stroke="#b9890b" stroke-width="1.5"/>
  <text x="525" y="96" text-anchor="middle" font-size="11" font-weight="bold">🍪</text>
  <text x="555" y="76" font-size="11" fill="#7a5d00">bank.com cookie</text>

  <!-- Step 1: prior login (background) -->
  <line x1="450" y1="160" x2="780" y2="160" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>
  <text x="615" y="155" text-anchor="middle" fill="#27ae60" font-style="italic">0. earlier: victim logs in → session cookie set</text>

  <!-- Step 2: attacker lures victim -->
  <line x1="200" y1="200" x2="370" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="285" y="194" text-anchor="middle" fill="#c0392b" font-weight="bold">1. lure</text>
  <text x="285" y="218" text-anchor="middle" fill="#555">email/ad/link to evil.com</text>

  <!-- Malicious page box -->
  <rect x="330" y="250" width="240" height="100" rx="6" fill="#fff" stroke="#c0392b" stroke-dasharray="5,3"/>
  <text x="450" y="270" text-anchor="middle" font-weight="bold" fill="#c0392b">evil.com page (loaded in browser)</text>
  <text x="450" y="292" text-anchor="middle" font-family="monospace" font-size="12">&lt;form action="https://bank.com/transfer"</text>
  <text x="450" y="308" text-anchor="middle" font-family="monospace" font-size="12">      method="POST"&gt;</text>
  <text x="450" y="324" text-anchor="middle" font-family="monospace" font-size="12">  &lt;input name="to" value="attacker"&gt;</text>
  <text x="450" y="340" text-anchor="middle" font-family="monospace" font-size="12">  &lt;input name="amount" value="1000"&gt;</text>

  <!-- Step 3: hidden form auto-submits -->
  <line x1="450" y1="150" x2="450" y2="248" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
  <text x="460" y="200" fill="#c0392b" font-weight="bold">2. page auto-submits</text>

  <!-- Step 4: browser sends request WITH cookie to bank -->
  <path d="M 570 380 Q 700 380 770 200" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="700" y="370" text-anchor="middle" fill="#c0392b" font-weight="bold">3. POST /transfer</text>
  <text x="700" y="388" text-anchor="middle" fill="#c0392b">Cookie: session=… 🍪 (auto-attached!)</text>

  <!-- Step 5: bank executes -->
  <rect x="660" y="430" width="240" height="60" rx="6" fill="#eafaf1" stroke="#27ae60"/>
  <text x="780" y="452" text-anchor="middle" font-weight="bold" fill="#27ae60">4. bank.com sees valid session</text>
  <text x="780" y="472" text-anchor="middle" fill="#555">→ transfers $1000 to attacker</text>
  <line x1="780" y1="150" x2="780" y2="428" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Note on response -->
  <text x="780" y="510" text-anchor="middle" font-size="11" fill="#555" font-style="italic">(response blocked by same-origin policy —</text>
  <text x="780" y="525" text-anchor="middle" font-size="11" fill="#555" font-style="italic">attacker doesn't need it; side effect already done)</text>

  <!-- Defenses panel -->
  <rect x="40" y="510" width="540" height="95" rx="6" fill="#f9f9f9" stroke="#888"/>
  <text x="55" y="530" font-weight="bold">Defenses</text>
  <text x="55" y="550">• Anti-CSRF token: secret in form, validated server-side (attacker can't read it)</text>
  <text x="55" y="568">• SameSite=Lax / Strict cookies: browser won't send cookie on cross-site POSTs</text>
  <text x="55" y="586">• Check Origin / Referer header on state-changing requests</text>
  <text x="55" y="604">• Re-authenticate for sensitive actions (password, transfer)</text>
</svg>

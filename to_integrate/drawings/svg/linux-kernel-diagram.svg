<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e6db4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5a623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4880c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hwGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7ed321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5ca018;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Linux Kernel Architecture</text>

  <!-- User Space -->
  <rect x="50" y="55" width="700" height="70" rx="8" fill="url(#userGrad)" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">User Space</text>
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Applications | Libraries (glibc) | Shell | Daemons</text>

  <!-- System Call Interface -->
  <rect x="50" y="135" width="700" height="35" rx="5" fill="#9b59b6" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">System Call Interface (syscall)</text>

  <!-- Kernel Space Label -->
  <text x="400" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f5a623" text-anchor="middle">─── Kernel Space ───</text>

  <!-- VFS -->
  <rect x="50" y="200" width="220" height="60" rx="6" fill="url(#kernelGrad)" stroke="#ffffff" stroke-width="2"/>
  <text x="160" y="225" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">VFS</text>
  <text x="160" y="245" font-family="Arial, sans-serif" font-size="10" fill="#1a1a2e" text-anchor="middle">Virtual File System</text>

  <!-- Process Management -->
  <rect x="290" y="200" width="220" height="60" rx="6" fill="url(#kernelGrad)" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="225" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Process Management</text>
  <text x="400" y="245" font-family="Arial, sans-serif" font-size="10" fill="#1a1a2e" text-anchor="middle">Scheduler | fork | exec | signals</text>

  <!-- Memory Management -->
  <rect x="530" y="200" width="220" height="60" rx="6" fill="url(#kernelGrad)" stroke="#ffffff" stroke-width="2"/>
  <text x="640" y="225" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Memory Management</text>
  <text x="640" y="245" font-family="Arial, sans-serif" font-size="10" fill="#1a1a2e" text-anchor="middle">Virtual Memory | Paging | Slab</text>

  <!-- File Systems -->
  <rect x="50" y="275" width="140" height="55" rx="6" fill="#e67e22" stroke="#ffffff" stroke-width="1"/>
  <text x="120" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">File Systems</text>
  <text x="120" y="318" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">ext4|xfs|btrfs|nfs</text>

  <!-- Network Stack -->
  <rect x="210" y="275" width="140" height="55" rx="6" fill="#e67e22" stroke="#ffffff" stroke-width="1"/>
  <text x="280" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Network Stack</text>
  <text x="280" y="318" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">TCP/IP | Sockets | Netfilter</text>

  <!-- IPC -->
  <rect x="370" y="275" width="140" height="55" rx="6" fill="#e67e22" stroke="#ffffff" stroke-width="1"/>
  <text x="440" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">IPC</text>
  <text x="440" y="318" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Pipes|Shmem|Signals</text>

  <!-- Security -->
  <rect x="530" y="275" width="100" height="55" rx="6" fill="#e67e22" stroke="#ffffff" stroke-width="1"/>
  <text x="580" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Security</text>
  <text x="580" y="318" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">SELinux|Caps</text>

  <!-- Cgroups/Namespaces -->
  <rect x="650" y="275" width="100" height="55" rx="6" fill="#e67e22" stroke="#ffffff" stroke-width="1"/>
  <text x="700" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Isolation</text>
  <text x="700" y="318" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">cgroups|ns</text>

  <!-- Device Drivers Section -->
  <rect x="50" y="345" width="700" height="80" rx="6" fill="#8e44ad" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Device Drivers</text>
  
  <!-- Driver subsections -->
  <rect x="70" y="380" width="95" height="35" rx="4" fill="#a569bd" stroke="#ffffff" stroke-width="1"/>
  <text x="117" y="402" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Block (SCSI)</text>

  <rect x="180" y="380" width="95" height="35" rx="4" fill="#a569bd" stroke="#ffffff" stroke-width="1"/>
  <text x="227" y="402" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Character</text>

  <rect x="290" y="380" width="95" height="35" rx="4" fill="#a569bd" stroke="#ffffff" stroke-width="1"/>
  <text x="337" y="402" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Network</text>

  <rect x="400" y="380" width="95" height="35" rx="4" fill="#a569bd" stroke="#ffffff" stroke-width="1"/>
  <text x="447" y="402" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">USB</text>

  <rect x="510" y="380" width="95" height="35" rx="4" fill="#a569bd" stroke="#ffffff" stroke-width="1"/>
  <text x="557" y="402" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">I2C/SPI</text>

  <rect x="620" y="380" width="110" height="35" rx="4" fill="#a569bd" stroke="#ffffff" stroke-width="1"/>
  <text x="675" y="402" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">GPU/DRM</text>

  <!-- Arch-specific -->
  <rect x="50" y="440" width="700" height="45" rx="6" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="468" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Architecture-Specific Code (x86 | ARM | RISC-V | PowerPC) — Interrupts | Context Switch | Boot</text>

  <!-- Hardware Abstraction -->
  <rect x="50" y="495" width="700" height="35" rx="5" fill="#27ae60" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="518" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Hardware Abstraction Layer</text>

  <!-- Hardware -->
  <rect x="50" y="540" width="700" height="50" rx="8" fill="url(#hwGrad)" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="565" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Hardware</text>
  <text x="400" y="582" font-family="Arial, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="middle">CPU | Memory | Storage | Network | GPU | Peripherals</text>

  <!-- Arrows -->
  <path d="M400 125 L400 135" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M400 170 L400 200" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M400 425 L400 440" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M400 485 L400 495" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M400 530 L400 540" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)"/>

</svg>

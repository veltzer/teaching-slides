  <rect x="240" y="340" width="80" height="25" rx="2" fill="#4caf50"/>
  <rect x="360" y="340" width="100" height="25" rx="2" fill="#4caf50"/>
  <rect x="520" y="340" width="120" height="25" rx="2" fill="#4caf50"/>
  <rect x="730" y="340" width="80" height="25" rx="2" fill="#4caf50"/>

  <rect x="130" y="380" width="90" height="25" rx="2" fill="#2196f3"/>
  <rect x="290" y="380" width="130" height="25" rx="2" fill="#2196f3"/>
  <rect x="500" y="380" width="150" height="25" rx="2" fill="#2196f3"/>
  <rect x="710" y="380" width="100" height="25" rx="2" fill="#2196f3"/>

  <rect x="200" y="420" width="30" height="25" rx="2" fill="#ff9800"/>
  <rect x="470" y="420" width="40" height="25" rx="2" fill="#ff9800"/>

  <!-- Legend -->
  <rect x="130" y="460" width="15" height="15" rx="2" fill="#4caf50"/>

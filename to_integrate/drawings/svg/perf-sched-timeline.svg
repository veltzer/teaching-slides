  <!-- Info panel -->
  <rect x="620" y="460" width="260" height="30" rx="4" fill="#333"/>
  <text x="630" y="480" font-family="monospace" font-size="10" fill="#4fc3f7">Selected: myapp [1234] @ CPU0</text>
  <text x="790" y="480" font-family="monospace" font-size="10" fill="#888">12.3ms</text>


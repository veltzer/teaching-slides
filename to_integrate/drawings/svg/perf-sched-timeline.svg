<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e1e"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bg)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="40" fill="#333"/>
  <text x="20" y="26" font-family="monospace" font-size="14" fill="#fff">Perfetto - perf sched trace</text>
  <text x="750" y="26" font-family="monospace" font-size="12" fill="#888">0ms - 100ms</text>

  <!-- Timeline header -->
  <rect x="120" y="50" width="760" height="25" fill="#252525"/>
  <text x="130" y="67" font-family="monospace" font-size="10" fill="#888">0ms</text>
  <text x="230" y="67" font-family="monospace" font-size="10" fill="#888">20ms</text>
  <text x="350" y="67" font-family="monospace" font-size="10" fill="#888">40ms</text>
  <text x="470" y="67" font-family="monospace" font-size="10" fill="#888">60ms</text>
  <text x="590" y="67" font-family="monospace" font-size="10" fill="#888">80ms</text>
  <text x="710" y="67" font-family="monospace" font-size="10" fill="#888">100ms</text>

  <!-- Grid lines -->
  <line x1="220" y1="75" x2="220" y2="450" stroke="#333" stroke-width="1"/>
  <line x1="340" y1="75" x2="340" y2="450" stroke="#333" stroke-width="1"/>
  <line x1="460" y1="75" x2="460" y2="450" stroke="#333" stroke-width="1"/>
  <line x1="580" y1="75" x2="580" y2="450" stroke="#333" stroke-width="1"/>
  <line x1="700" y1="75" x2="700" y2="450" stroke="#333" stroke-width="1"/>

  <!-- CPU Labels -->

  <text x="175" y="295" font-family="monospace" font-size="9" fill="#fff">systemd</text>

  <rect x="290" y="270" width="80" height="40" rx="3" fill="#9e9e9e" opacity="0.5"/>

  <rect x="380" y="270" width="60" height="40" rx="3" fill="#795548" opacity="0.9"/>
  <text x="390" y="295" font-family="monospace" font-size="8" fill="#fff">jbd2</text>

  <rect x="450" y="270" width="200" height="40" rx="3" fill="#9e9e9e" opacity="0.5"/>

  <rect x="660" y="270" width="90" height="40" rx="3" fill="#009688" opacity="0.9"/>
  <text x="680" y="295" font-family="monospace" font-size="9" fill="#fff">systemd</text>

  <rect x="760" y="270" width="50" height="40" rx="3" fill="#9e9e9e" opacity="0.5"/>


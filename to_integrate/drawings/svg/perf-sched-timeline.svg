  <rect x="230" y="150" width="50" height="40" rx="3" fill="#9e9e9e" opacity="0.5"/>

  <rect x="290" y="150" width="130" height="40" rx="3" fill="#2196f3" opacity="0.9"/>
  <text x="330" y="175" font-family="monospace" font-size="9" fill="#fff">myapp:2</text>

  <rect x="430" y="150" width="60" height="40" rx="3" fill="#e91e63" opacity="0.9"/>
  <text x="440" y="175" font-family="monospace" font-size="8" fill="#fff">irq/23</text>

  <rect x="500" y="150" width="150" height="40" rx="3" fill="#2196f3" opacity="0.9"/>
  <text x="550" y="175" font-family="monospace" font-size="9" fill="#fff">myapp:2</text>

  <rect x="660" y="150" width="40" height="40" rx="3" fill="#9e9e9e" opacity="0.5"/>

  <rect x="710" y="150" width="100" height="40" rx="3" fill="#2196f3" opacity="0.9"/>

  <rect x="130" y="210" width="40" height="40" rx="3" fill="#9c27b0" opacity="0.9"/>
  <text x="133" y="235" font-family="monospace" font-size="8" fill="#fff">ssh</text>

  <rect x="180" y="210" width="200" height="40" rx="3" fill="#9e9e9e" opacity="0.5"/>

  <rect x="390" y="210" width="80" height="40" rx="3" fill="#ff5722" opacity="0.9"/>

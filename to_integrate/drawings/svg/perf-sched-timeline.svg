  <rect x="130" y="90" width="60" height="40" rx="3" fill="#4caf50" opacity="0.9"/>
  <text x="140" y="115" font-family="monospace" font-size="9" fill="#fff">myapp</text>
  
  <rect x="200" y="90" width="30" height="40" rx="3" fill="#ff9800" opacity="0.9"/>
  <text x="203" y="115" font-family="monospace" font-size="8" fill="#fff">kw</text>

  <rect x="240" y="90" width="80" height="40" rx="3" fill="#4caf50" opacity="0.9"/>
  <text x="260" y="115" font-family="monospace" font-size="9" fill="#fff">myapp</text>

  <rect x="330" y="90" width="20" height="40" rx="3" fill="#9e9e9e" opacity="0.5"/>
  
  <rect x="360" y="90" width="100" height="40" rx="3" fill="#4caf50" opacity="0.9"/>
  <text x="390" y="115" font-family="monospace" font-size="9" fill="#fff">myapp</text>

  <rect x="470" y="90" width="40" height="40" rx="3" fill="#ff9800" opacity="0.9"/>
  <text x="475" y="115" font-family="monospace" font-size="8" fill="#fff">kw</text>

  <rect x="520" y="90" width="120" height="40" rx="3" fill="#4caf50" opacity="0.9"/>
  <text x="560" y="115" font-family="monospace" font-size="9" fill="#fff">myapp</text>

  <rect x="650" y="90" width="70" height="40" rx="3" fill="#9e9e9e" opacity="0.5"/>

  <rect x="730" y="90" width="80" height="40" rx="3" fill="#4caf50" opacity="0.9"/>

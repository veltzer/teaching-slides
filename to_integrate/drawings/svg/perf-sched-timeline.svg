  <rect x="0" y="145" width="120" height="50" fill="#252525"/>
  <text x="15" y="175" font-family="monospace" font-size="12" fill="#4fc3f7">CPU 1</text>

  <rect x="0" y="205" width="120" height="50" fill="#2a2a2a"/>
  <text x="15" y="235" font-family="monospace" font-size="12" fill="#4fc3f7">CPU 2</text>

  <rect x="0" y="265" width="120" height="50" fill="#252525"/>
  <text x="15" y="295" font-family="monospace" font-size="12" fill="#4fc3f7">CPU 3</text>

  <!-- Process Labels -->
  <rect x="0" y="335" width="120" height="35" fill="#2a2a2a"/>
  <text x="15" y="357" font-family="monospace" font-size="11" fill="#aaa">myapp [1234]</text>

  <rect x="0" y="375" width="120" height="35" fill="#252525"/>

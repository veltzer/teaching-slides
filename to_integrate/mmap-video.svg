<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 900" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="appGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="hwGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="ramGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="vramGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1150" height="900" fill="#f9fafb"/>

  <!-- Title -->
  <text x="575" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">
    Linux App Talking Directly to a Video Device via mmap
  </text>
  <text x="575" y="56" text-anchor="middle" font-size="13" fill="#6b7280">
    One syscall maps device memory into the process — after that, writes to a pointer hit the GPU/framebuffer directly
  </text>

  <!-- ===== USER SPACE ===== -->
  <g>
    <rect x="30" y="80" width="1090" height="200" rx="10" fill="url(#appGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="50" y="105" font-size="14" font-weight="700" fill="#1e3a8a">USER SPACE  (your process)</text>

    <!-- Code box -->
    <rect x="50" y="120" width="540" height="145" rx="6" fill="#0f172a" stroke="#1d4ed8"/>
    <text x="65" y="142" font-size="12" font-family="monospace" fill="#93c5fd">// open the device</text>
    <text x="65" y="160" font-size="12" font-family="monospace" fill="#e2e8f0">int fd = open("/dev/fb0", O_RDWR);</text>
    <text x="65" y="184" font-size="12" font-family="monospace" fill="#93c5fd">// ask the kernel to map device memory in</text>
    <text x="65" y="202" font-size="12" font-family="monospace" fill="#e2e8f0">uint8_t *fb = mmap(NULL, size,</text>
    <text x="65" y="218" font-size="12" font-family="monospace" fill="#e2e8f0">     PROT_READ|PROT_WRITE, MAP_SHARED, fd, 0);</text>
    <text x="65" y="242" font-size="12" font-family="monospace" fill="#93c5fd">// now write a pixel — no syscall, no copy</text>
    <text x="65" y="260" font-size="12" font-family="monospace" fill="#fde68a">fb[y * stride + x*4] = 0xFF;  // red pixel</text>

    <!-- Process VA box -->
    <rect x="610" y="120" width="490" height="145" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="855" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">
      Process virtual address space
    </text>
    <rect x="630" y="156" width="450" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="855" y="175" text-anchor="middle" font-size="11" fill="#1e3a8a">code  •  data  •  heap  •  stack  (normal RAM)</text>
    <rect x="630" y="194" width="450" height="56" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="855" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">
      mmap'd region  →  fb[]
    </text>
    <text x="855" y="232" text-anchor="middle" font-size="11" fill="#78350f">
      virtual pages whose PTEs point at DEVICE memory
    </text>
    <text x="855" y="246" text-anchor="middle" font-size="10" fill="#78350f" font-style="italic">
      (not RAM — writes here go to the GPU/framebuffer)
    </text>
  </g>

  <!-- syscall arrow -->
  <line x1="320" y1="280" x2="320" y2="315" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="330" y="302" font-size="11" fill="#1d4ed8" font-style="italic">open() / mmap()  — syscalls (one-time setup)</text>

  <!-- ===== KERNEL ===== -->
  <g>
    <rect x="30" y="320" width="1090" height="240" rx="10" fill="url(#kernelGrad)" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="50" y="345" font-size="14" font-weight="700" fill="#7f1d1d">KERNEL SPACE</text>

    <!-- VFS -->
    <rect x="50" y="360" width="240" height="80" rx="6" fill="#ffffff" stroke="#b91c1c"/>
    <text x="170" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">VFS layer</text>
    <text x="170" y="404" text-anchor="middle" font-size="11" fill="#991b1b">routes /dev/fb0 (or</text>
    <text x="170" y="420" text-anchor="middle" font-size="11" fill="#991b1b">/dev/dri/card0,</text>
    <text x="170" y="436" text-anchor="middle" font-size="11" fill="#991b1b">/dev/video0) to driver</text>

    <!-- Driver -->
    <rect x="310" y="360" width="280" height="80" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="450" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Video driver</text>
    <text x="450" y="404" text-anchor="middle" font-size="11" fill="#991b1b">fbdev / DRM-KMS / V4L2</text>
    <text x="450" y="420" text-anchor="middle" font-size="11" fill="#991b1b">(i915, amdgpu, nouveau,</text>
    <text x="450" y="436" text-anchor="middle" font-size="11" fill="#991b1b">uvcvideo, etc.)</text>

    <!-- mmap impl -->
    <rect x="610" y="360" width="490" height="80" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
    <text x="855" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">
      driver's .mmap() handler
    </text>
    <text x="855" y="402" text-anchor="middle" font-size="11" fill="#92400e">
      remap_pfn_range() / vm_iomap_memory() / dma_mmap_coherent()
    </text>
    <text x="855" y="420" text-anchor="middle" font-size="11" fill="#92400e">
      installs page-table entries pointing at the device's physical addresses
    </text>
    <text x="855" y="436" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">
      (sets PTE flags: write-combining / uncached as appropriate)
    </text>

    <!-- MMU -->
    <rect x="50" y="460" width="540" height="80" rx="6" fill="#ffffff" stroke="#b91c1c"/>
    <text x="320" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">CPU MMU + page tables</text>
    <text x="320" y="505" text-anchor="middle" font-size="11" fill="#991b1b">
      translates  fb[i]  (virtual)  →  physical address on the PCIe BAR
    </text>
    <text x="320" y="522" text-anchor="middle" font-size="11" fill="#991b1b">
      this happens in hardware on every access — no kernel involvement
    </text>

    <!-- IOMMU / coherence -->
    <rect x="610" y="460" width="490" height="80" rx="6" fill="#ffffff" stroke="#b91c1c"/>
    <text x="855" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">PCIe / IOMMU / cache policy</text>
    <text x="855" y="505" text-anchor="middle" font-size="11" fill="#991b1b">
      stores route over PCIe to the GPU's BAR (memory-mapped I/O)
    </text>
    <text x="855" y="522" text-anchor="middle" font-size="11" fill="#991b1b">
      write-combining buffers coalesce pixel writes for throughput
    </text>
  </g>

  <!-- arrow kernel -> hardware -->
  <line x1="575" y1="560" x2="575" y2="595" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="585" y="582" font-size="11" fill="#374151" font-style="italic">PCIe transactions</text>

  <!-- ===== HARDWARE ===== -->
  <g>
    <rect x="30" y="600" width="1090" height="220" rx="10" fill="url(#hwGrad)" stroke="#b45309" stroke-width="2"/>
    <text x="50" y="625" font-size="14" font-weight="700" fill="#78350f">HARDWARE</text>

    <!-- CPU + RAM -->
    <rect x="50" y="640" width="280" height="160" rx="8" fill="url(#ramGrad)" stroke="#15803d" stroke-width="2"/>
    <text x="190" y="664" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">CPU  +  System RAM</text>
    <text x="190" y="685" text-anchor="middle" font-size="11" fill="#166534">code, normal data,</text>
    <text x="190" y="701" text-anchor="middle" font-size="11" fill="#166534">page tables live here</text>
    <rect x="70" y="715" width="240" height="70" rx="4" fill="#ffffff" stroke="#15803d"/>
    <text x="190" y="735" text-anchor="middle" font-size="11" fill="#14532d">Note: the mmap'd pages</text>
    <text x="190" y="751" text-anchor="middle" font-size="11" fill="#14532d">are NOT backed by RAM —</text>
    <text x="190" y="767" text-anchor="middle" font-size="11" fill="#14532d">no copy lives here</text>
    <text x="190" y="781" text-anchor="middle" font-size="10" fill="#14532d" font-style="italic">(zero-copy)</text>

    <!-- PCIe bus -->
    <rect x="350" y="700" width="60" height="40" rx="4" fill="#ffffff" stroke="#374151"/>
    <text x="380" y="725" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">PCIe</text>

    <!-- GPU / video device -->
    <rect x="430" y="640" width="670" height="160" rx="8" fill="url(#vramGrad)" stroke="#6d28d9" stroke-width="2"/>
    <text x="765" y="664" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">
      GPU / Video Device  (PCIe endpoint)
    </text>

    <rect x="450" y="678" width="300" height="100" rx="6" fill="#ffffff" stroke="#6d28d9"/>
    <text x="600" y="700" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">
      VRAM / Framebuffer
    </text>
    <text x="600" y="720" text-anchor="middle" font-size="11" fill="#5b21b6">
      exposed via PCIe BAR
    </text>
    <text x="600" y="738" text-anchor="middle" font-size="11" fill="#5b21b6">
      (memory-mapped I/O region)
    </text>
    <text x="600" y="758" text-anchor="middle" font-size="11" fill="#5b21b6">
      this is what the PTEs point at
    </text>
    <text x="600" y="774" text-anchor="middle" font-size="10" fill="#5b21b6" font-style="italic">
      writes here = pixels on screen
    </text>

    <rect x="770" y="678" width="310" height="100" rx="6" fill="#ffffff" stroke="#6d28d9"/>
    <text x="925" y="700" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">
      Display engine / scanout
    </text>
    <text x="925" y="720" text-anchor="middle" font-size="11" fill="#5b21b6">
      reads framebuffer at refresh rate
    </text>
    <text x="925" y="738" text-anchor="middle" font-size="11" fill="#5b21b6">
      drives HDMI / DisplayPort out
    </text>
    <text x="925" y="760" text-anchor="middle" font-size="11" fill="#5b21b6">
      → monitor
    </text>
  </g>

  <!-- The killer arrow: app pointer write -> VRAM, bypassing kernel -->
  <path d="M 855 250 C 855 580, 600 580, 600 678"
        fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#arrRed)"/>
  <text x="900" y="430" font-size="12" font-weight="700" fill="#b91c1c">
    fast path
  </text>
  <text x="900" y="446" font-size="11" fill="#b91c1c">
    fb[i] = ...   →   PCIe write
  </text>
  <text x="900" y="462" font-size="11" fill="#b91c1c">
    no syscall, no copy
  </text>

  <!-- Legend -->
  <g>
    <rect x="30" y="836" width="1090" height="56" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <line x1="60" y1="858" x2="100" y2="858" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="110" y="862" font-size="12" fill="#111827">Setup path  (one-time:  open + mmap, kernel-mediated)</text>

    <line x1="500" y1="858" x2="540" y2="858" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 4"/>
    <text x="550" y="862" font-size="12" fill="#111827">Hot path  (every pixel write: pointer → MMU → PCIe → VRAM, kernel bypassed)</text>

    <text x="60" y="882" font-size="11" fill="#374151" font-style="italic">
      Real apps (V4L2 capture, DRM/KMS, GPU compute) usually mmap DMA buffers and use ioctl/poll for synchronization — but the data itself never flows through read()/write().
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:#ffffff">
  <defs>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#212121">Zero-Cost Batch Service</text>
  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#555555">Pay only when work arrives — idle = $0</text>

  <!-- Producer (client) -->
  <rect x="60" y="280" width="180" height="100" rx="6" fill="url(#grad-primary)" stroke="#3d5a7d" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Client / Producer</text>
  <text x="150" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">submits jobs</text>
  <text x="150" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#ffffff">(occasional)</text>

  <!-- Arrow producer -> queue -->
  <path d="M 245 330 L 365 330" fill="none" stroke="#3d5a7d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="305" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#212121">enqueue</text>

  <!-- Queue (SQS / Pub/Sub) -->
  <rect x="370" y="280" width="220" height="100" rx="6" fill="url(#grad-info)" stroke="#574a68" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Queue</text>
  <text x="480" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">SQS / Pub/Sub / EventBridge</text>
  <text x="480" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#ffffff">pay-per-message · no idle fee</text>

  <!-- Queue messages (visual) -->
  <rect x="395" y="385" width="20" height="14" rx="2" fill="#9384a5" stroke="#574a68" stroke-width="1"/>
  <rect x="420" y="385" width="20" height="14" rx="2" fill="#9384a5" stroke="#574a68" stroke-width="1"/>
  <rect x="445" y="385" width="20" height="14" rx="2" fill="#9384a5" stroke="#574a68" stroke-width="1"/>

  <!-- Trigger arrow -->
  <path d="M 595 330 L 715 330" fill="none" stroke="#3d5a7d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="655" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#212121">trigger</text>
  <text x="655" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#555555">on message</text>

  <!-- Worker (Lambda / Cloud Run) -->
  <rect x="720" y="280" width="220" height="100" rx="6" fill="url(#grad-ok)" stroke="#5a7a4d" stroke-width="2" filter="url(#shadow)"/>
  <text x="830" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Serverless Worker</text>
  <text x="830" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Lambda / Cloud Run / Functions</text>
  <text x="830" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#ffffff">scales 0 → N → 0</text>

  <!-- Worker -> result -->
  <path d="M 945 330 L 1060 330" fill="none" stroke="#5a7a4d" stroke-width="2.5" marker-end="url(#arrow-ok)"/>
  <text x="1002" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#212121">write</text>

  <!-- Result store (S3 / DB) -->
  <rect x="1065" y="280" width="160" height="100" rx="6" fill="url(#grad-warn)" stroke="#9c6e2e" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Result Store</text>
  <text x="1145" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">S3 / DynamoDB</text>
  <text x="1145" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#ffffff">pay-per-GB / req</text>

  <!-- Idle state callout -->
  <rect x="60" y="460" width="1165" height="140" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="640" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212121">When no jobs are running:</text>

  <!-- Idle cost rows -->
  <text x="120" y="525" font-family="Arial, sans-serif" font-size="14" fill="#212121">• Queue (empty)</text>
  <text x="370" y="525" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#385030">$0.00</text>

  <text x="120" y="552" font-family="Arial, sans-serif" font-size="14" fill="#212121">• Worker (no invocations)</text>
  <text x="370" y="552" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#385030">$0.00</text>

  <text x="120" y="579" font-family="Arial, sans-serif" font-size="14" fill="#212121">• Compute / VMs / containers</text>
  <text x="370" y="579" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#385030">$0.00 (none provisioned)</text>

  <text x="700" y="525" font-family="Arial, sans-serif" font-size="14" fill="#212121">• Storage at rest (small)</text>
  <text x="980" y="525" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#5a3f12">~ pennies / GB·month</text>

  <text x="700" y="552" font-family="Arial, sans-serif" font-size="14" fill="#212121">• Free tier (Lambda 1M req)</text>
  <text x="980" y="552" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#385030">often $0 in practice</text>

  <text x="700" y="579" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212121">Total idle cost:</text>
  <text x="980" y="579" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#385030">≈ $0 / month</text>

  <!-- Bottom note -->
  <text x="640" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#555555">Cost scales linearly with work — not with time.</text>
</svg>

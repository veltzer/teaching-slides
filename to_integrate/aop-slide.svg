<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system, Segoe UI, sans-serif">
  <rect width="1280" height="800" fill="#0f172a"/>

  <!-- Title -->
  <text x="640" y="55" text-anchor="middle" font-size="28" font-weight="700" fill="#f8fafc">
    Aspect-Oriented Programming
  </text>
  <text x="640" y="82" text-anchor="middle" font-size="14" fill="#94a3b8">
    Pull cross-cutting concerns out of business logic and weave them in at well-defined points
  </text>

  <!-- ============== LEFT: BEFORE ============== -->
  <text x="320" y="130" text-anchor="middle" font-size="16" font-weight="600" fill="#f87171">
    Without AOP — concerns tangled into every method
  </text>

  <!-- Three "service" boxes, each polluted with the same cross-cutting code -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11">

    <!-- OrderService -->
    <rect x="80" y="155" width="480" height="135" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="100" y="178" fill="#cbd5e1" font-weight="600">OrderService.place(order)</text>
    <text x="100" y="200" fill="#fb923c">log.info("enter place")        // logging</text>
    <text x="100" y="216" fill="#a78bfa">if (!user.can("ORDER")) throw  // security</text>
    <text x="100" y="232" fill="#34d399">tx.begin()                     // transaction</text>
    <text x="100" y="248" fill="#f8fafc">repo.save(order)               // ← real work</text>
    <text x="100" y="264" fill="#34d399">tx.commit()                    // transaction</text>
    <text x="100" y="280" fill="#fb923c">log.info("exit place")         // logging</text>

    <!-- PaymentService -->
    <rect x="80" y="305" width="480" height="135" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="100" y="328" fill="#cbd5e1" font-weight="600">PaymentService.charge(card)</text>
    <text x="100" y="350" fill="#fb923c">log.info("enter charge")</text>
    <text x="100" y="366" fill="#a78bfa">if (!user.can("PAY")) throw</text>
    <text x="100" y="382" fill="#34d399">tx.begin()</text>
    <text x="100" y="398" fill="#f8fafc">gateway.charge(card)           // ← real work</text>
    <text x="100" y="414" fill="#34d399">tx.commit()</text>
    <text x="100" y="430" fill="#fb923c">log.info("exit charge")</text>

    <!-- ShippingService -->
    <rect x="80" y="455" width="480" height="135" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="100" y="478" fill="#cbd5e1" font-weight="600">ShippingService.dispatch(pkg)</text>
    <text x="100" y="500" fill="#fb923c">log.info("enter dispatch")</text>
    <text x="100" y="516" fill="#a78bfa">if (!user.can("SHIP")) throw</text>
    <text x="100" y="532" fill="#34d399">tx.begin()</text>
    <text x="100" y="548" fill="#f8fafc">carrier.send(pkg)              // ← real work</text>
    <text x="100" y="564" fill="#34d399">tx.commit()</text>
    <text x="100" y="580" fill="#fb923c">log.info("exit dispatch")</text>
  </g>

  <!-- "duplicated" callouts -->
  <g font-size="11" fill="#f87171" font-style="italic">
    <text x="320" y="615" text-anchor="middle">Logging, security, and transactions are duplicated in every service.</text>
    <text x="320" y="632" text-anchor="middle">Change the logging format → edit dozens of files.</text>
  </g>

  <!-- Arrow to the right -->
  <g>
    <path d="M 590 380 L 690 380" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="640" y="365" text-anchor="middle" font-size="13" fill="#cbd5e1" font-weight="600">extract</text>
    <text x="640" y="402" text-anchor="middle" font-size="13" fill="#cbd5e1" font-weight="600">+ weave</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ============== RIGHT: AFTER ============== -->
  <text x="960" y="130" text-anchor="middle" font-size="16" font-weight="600" fill="#34d399">
    With AOP — business code stays clean, aspects live in one place
  </text>

  <!-- Clean services -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11">
    <rect x="720" y="155" width="480" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="740" y="178" fill="#cbd5e1" font-weight="600">OrderService.place(order)</text>
    <text x="740" y="195" fill="#f8fafc">repo.save(order)</text>

    <rect x="720" y="220" width="480" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="740" y="243" fill="#cbd5e1" font-weight="600">PaymentService.charge(card)</text>
    <text x="740" y="260" fill="#f8fafc">gateway.charge(card)</text>

    <rect x="720" y="285" width="480" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="740" y="308" fill="#cbd5e1" font-weight="600">ShippingService.dispatch(pkg)</text>
    <text x="740" y="325" fill="#f8fafc">carrier.send(pkg)</text>
  </g>

  <!-- Aspects panel -->
  <rect x="720" y="365" width="480" height="225" rx="8" fill="#0b1220" stroke="#475569" stroke-dasharray="4 3"/>
  <text x="740" y="390" font-size="13" fill="#f8fafc" font-weight="600">Aspects (each defined once)</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="11">
    <!-- Logging aspect -->
    <text x="740" y="418" fill="#fb923c" font-weight="600">@Aspect LoggingAspect</text>
    <text x="740" y="434" fill="#94a3b8">  pointcut: execution(* service.*.*(..))</text>
    <text x="740" y="450" fill="#94a3b8">  @Around: log.info(enter); proceed(); log.info(exit)</text>

    <!-- Security aspect -->
    <text x="740" y="478" fill="#a78bfa" font-weight="600">@Aspect SecurityAspect</text>
    <text x="740" y="494" fill="#94a3b8">  pointcut: @annotation(RequiresPermission)</text>
    <text x="740" y="510" fill="#94a3b8">  @Before: assertCan(user, perm)</text>

    <!-- Transaction aspect -->
    <text x="740" y="538" fill="#34d399" font-weight="600">@Aspect TransactionAspect</text>
    <text x="740" y="554" fill="#94a3b8">  pointcut: @annotation(Transactional)</text>
    <text x="740" y="570" fill="#94a3b8">  @Around: tx.begin(); proceed(); tx.commit()</text>
  </g>

  <!-- Weaving illustration: dotted connectors from aspects to clean services -->
  <g stroke-dasharray="3 3" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M 720 426 C 690 420, 690 185, 720 180" stroke="#fb923c"/>
    <path d="M 720 426 C 690 420, 690 250, 720 245" stroke="#fb923c"/>
    <path d="M 720 426 C 690 420, 690 315, 720 310" stroke="#fb923c"/>

    <path d="M 720 486 C 695 480, 695 188, 720 183" stroke="#a78bfa"/>
    <path d="M 720 486 C 695 480, 695 252, 720 248" stroke="#a78bfa"/>
    <path d="M 720 486 C 695 480, 695 318, 720 313" stroke="#a78bfa"/>

    <path d="M 720 546 C 700 540, 700 192, 720 188" stroke="#34d399"/>
    <path d="M 720 546 C 700 540, 700 254, 720 250" stroke="#34d399"/>
    <path d="M 720 546 C 700 540, 700 320, 720 316" stroke="#34d399"/>
  </g>

  <!-- ============== BOTTOM: VOCABULARY ============== -->
  <rect x="80" y="660" width="1120" height="115" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="100" y="688" font-size="14" fill="#f8fafc" font-weight="700">Core vocabulary</text>

  <g font-size="12">
    <text x="100" y="715" fill="#fbbf24" font-weight="600">Join point</text>
    <text x="100" y="732" fill="#cbd5e1">a place execution can be</text>
    <text x="100" y="747" fill="#cbd5e1">intercepted (method call,</text>
    <text x="100" y="762" fill="#cbd5e1">field access, exception)</text>

    <text x="290" y="715" fill="#fbbf24" font-weight="600">Pointcut</text>
    <text x="290" y="732" fill="#cbd5e1">a predicate selecting</text>
    <text x="290" y="747" fill="#cbd5e1">which join points to</text>
    <text x="290" y="762" fill="#cbd5e1">match (e.g. all @Tx methods)</text>

    <text x="490" y="715" fill="#fbbf24" font-weight="600">Advice</text>
    <text x="490" y="732" fill="#cbd5e1">code that runs at matched</text>
    <text x="490" y="747" fill="#cbd5e1">points: @Before, @After,</text>
    <text x="490" y="762" fill="#cbd5e1">@Around (wraps the call)</text>

    <text x="690" y="715" fill="#fbbf24" font-weight="600">Aspect</text>
    <text x="690" y="732" fill="#cbd5e1">module bundling a pointcut</text>
    <text x="690" y="747" fill="#cbd5e1">+ its advice (one concern,</text>
    <text x="690" y="762" fill="#cbd5e1">e.g. LoggingAspect)</text>

    <text x="890" y="715" fill="#fbbf24" font-weight="600">Weaving</text>
    <text x="890" y="732" fill="#cbd5e1">combining aspects with</text>
    <text x="890" y="747" fill="#cbd5e1">target code: compile-time,</text>
    <text x="890" y="762" fill="#cbd5e1">load-time, or runtime proxies</text>
  </g>
</svg>

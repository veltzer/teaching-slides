<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="-apple-system, Segoe UI, sans-serif">
  <rect width="1200" height="900" fill="#fafafa"/>

  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#222">
    22 GoF Design Patterns — distance ≈ similarity of solution
  </text>
  <text x="600" y="52" text-anchor="middle" font-size="12" fill="#666">
    No axes. Position is driven only by how alike the patterns' structures and use-cases are.
  </text>

  <!-- Legend -->
  <g transform="translate(90, 75)">
    <circle cx="8" cy="0" r="6" fill="#3b82f6"/>
    <text x="22" y="4" font-size="11" fill="#444">Creational</text>
    <circle cx="105" cy="0" r="6" fill="#10b981"/>
    <text x="119" y="4" font-size="11" fill="#444">Structural</text>
    <circle cx="200" cy="0" r="6" fill="#f59e0b"/>
    <text x="214" y="4" font-size="11" fill="#444">Behavioral</text>
  </g>

  <!--
    Edges (faint) for "deeply similar / often confused" pairs.
    Drawn first so circles cover endpoints.
  -->
  <g stroke="#bbb" stroke-width="1.2" stroke-opacity="0.55">
    <!-- Strategy <-> State (identical UML, different intent) -->
    <line x1="640" y1="430" x2="710" y2="380"/>
    <!-- Strategy <-> Template Method (variation: composition vs inheritance) -->
    <line x1="640" y1="430" x2="560" y2="370"/>
    <!-- Strategy <-> Command (encapsulate behavior as object) -->
    <line x1="640" y1="430" x2="690" y2="500"/>
    <!-- Command <-> Memento (state snapshot for undo) -->
    <line x1="690" y1="500" x2="780" y2="540"/>
    <!-- Decorator <-> Proxy (both wrap a target) -->
    <line x1="380" y1="380" x2="460" y2="430"/>
    <!-- Decorator <-> Composite (recursive composition, same hierarchy) -->
    <line x1="380" y1="380" x2="320" y2="450"/>
    <!-- Composite <-> Visitor (operate on tree) -->
    <line x1="320" y1="450" x2="250" y2="520"/>
    <!-- Composite <-> Iterator (traverse structure) -->
    <line x1="320" y1="450" x2="230" y2="430"/>
    <!-- Adapter <-> Bridge (interfaces) -->
    <line x1="430" y1="320" x2="495" y2="305"/>
    <!-- Adapter <-> Facade (simplify access) -->
    <line x1="430" y1="320" x2="500" y2="380"/>
    <!-- Bridge <-> Abstract Factory (decouple impl) -->
    <line x1="495" y1="305" x2="900" y2="220"/>
    <!-- Factory Method <-> Abstract Factory (creation, families vs single) -->
    <line x1="990" y1="170" x2="900" y2="220"/>
    <!-- Abstract Factory <-> Prototype (alt. for object creation) -->
    <line x1="900" y1="220" x2="970" y2="320"/>
    <!-- Prototype <-> Builder (alternate construction) -->
    <line x1="970" y1="320" x2="1040" y2="270"/>
    <!-- Singleton <-> Abstract Factory (often combined; lone construction) -->
    <line x1="1075" y1="170" x2="900" y2="220"/>
    <!-- Observer <-> Mediator (decouple via central hub vs broadcast) -->
    <line x1="170" y1="660" x2="320" y2="700"/>
    <!-- Observer <-> Chain of Responsibility (passing notifications) -->
    <line x1="170" y1="660" x2="180" y2="560"/>
    <!-- Mediator <-> Facade (a kind of front for collaborators) -->
    <line x1="320" y1="700" x2="500" y2="380"/>
    <!-- Chain of Responsibility <-> Command -->
    <line x1="180" y1="560" x2="690" y2="500"/>
    <!-- Interpreter <-> Composite (AST nodes form a tree) -->
    <line x1="430" y1="600" x2="320" y2="450"/>
    <!-- Interpreter <-> Visitor (traversal of AST) -->
    <line x1="430" y1="600" x2="250" y2="520"/>
    <!-- Iterator <-> Visitor -->
    <line x1="230" y1="430" x2="250" y2="520"/>
    <!-- Flyweight <-> Prototype (sharing/copying instances) -->
    <line x1="850" y1="430" x2="970" y2="320"/>
    <!-- Flyweight <-> Singleton (shared limited instances) -->
    <line x1="850" y1="430" x2="1075" y2="170"/>
    <!-- State <-> Memento (state machine snapshots) -->
    <line x1="710" y1="380" x2="780" y2="540"/>
    <!-- Template Method <-> Factory Method (hooks, often used together) -->
    <line x1="560" y1="370" x2="990" y2="170"/>
  </g>

  <!--
    Soft cluster blobs (drawn behind nodes).
    These are organic clusters of similar SOLUTIONS, not GoF categories.
  -->

  <!-- Cluster A: "Wrap & compose objects" — Decorator/Proxy/Composite/Adapter/Facade/Bridge -->
  <ellipse cx="395" cy="370" rx="220" ry="140" fill="#10b981" fill-opacity="0.07" stroke="#10b981" stroke-opacity="0.2"/>
  <text x="290" y="240" font-size="11" fill="#10b981" font-weight="600" opacity="0.7">wrap / compose</text>

  <!-- Cluster B: "Interchangeable behavior" — Strategy/State/Template Method/Command -->
  <ellipse cx="640" cy="445" rx="130" ry="135" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.2"/>
  <text x="630" y="305" font-size="11" fill="#f59e0b" font-weight="600" opacity="0.7">pluggable behavior</text>

  <!-- Cluster C: "Object creation" — Factory Method/Abstract Factory/Builder/Prototype/Singleton -->
  <ellipse cx="985" cy="240" rx="160" ry="160" fill="#3b82f6" fill-opacity="0.07" stroke="#3b82f6" stroke-opacity="0.2"/>
  <text x="950" y="100" font-size="11" fill="#3b82f6" font-weight="600" opacity="0.7">construction</text>

  <!-- Cluster D: "Traverse / visit structures" — Iterator/Visitor/Composite-edge/Interpreter -->
  <ellipse cx="305" cy="510" rx="160" ry="140" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-opacity="0.22"/>
  <text x="220" y="635" font-size="11" fill="#7c3aed" font-weight="600" opacity="0.7">traverse structure</text>

  <!-- Cluster E: "Decouple communication" — Observer/Mediator/Chain of Responsibility -->
  <ellipse cx="225" cy="640" rx="155" ry="115" fill="#ef4444" fill-opacity="0.06" stroke="#ef4444" stroke-opacity="0.22"/>
  <text x="80" y="770" font-size="11" fill="#ef4444" font-weight="600" opacity="0.7">decoupled comms</text>

  <!-- Cluster F: "Snapshot / share instance state" — Memento/Flyweight (loose) -->
  <ellipse cx="815" cy="490" rx="100" ry="90" fill="#0891b2" fill-opacity="0.06" stroke="#0891b2" stroke-opacity="0.22"/>
  <text x="800" y="610" font-size="11" fill="#0891b2" font-weight="600" opacity="0.7">instance state mgmt</text>


  <!-- ============================================================ -->
  <!--               NODES (placed by similarity)                   -->
  <!-- ============================================================ -->

  <!-- ===== Cluster: pluggable behavior ===== -->
  <!-- Strategy at the heart -->
  <g><circle cx="640" cy="430" r="38" fill="#f59e0b" fill-opacity="0.92"/>
     <text x="640" y="434" text-anchor="middle" font-size="11" fill="white" font-weight="600">Strategy</text></g>

  <!-- State (very close to Strategy: identical UML) -->
  <g><circle cx="710" cy="380" r="34" fill="#f59e0b" fill-opacity="0.92"/>
     <text x="710" y="384" text-anchor="middle" font-size="11" fill="white" font-weight="600">State</text></g>

  <!-- Template Method (close to Strategy via inheritance variant) -->
  <g><circle cx="560" cy="370" r="38" fill="#f59e0b" fill-opacity="0.92"/>
     <text x="560" y="367" text-anchor="middle" font-size="11" fill="white" font-weight="600">Template</text>
     <text x="560" y="381" text-anchor="middle" font-size="11" fill="white" font-weight="600">Method</text></g>

  <!-- Command (encapsulated invocation) -->
  <g><circle cx="690" cy="500" r="36" fill="#f59e0b" fill-opacity="0.92"/>
     <text x="690" y="504" text-anchor="middle" font-size="11" fill="white" font-weight="600">Command</text></g>

  <!-- ===== Cluster: wrap / compose ===== -->
  <!-- Decorator + Proxy nearly overlap (both wrap a target) -->
  <g><circle cx="380" cy="380" r="36" fill="#10b981" fill-opacity="0.9"/>
     <text x="380" y="384" text-anchor="middle" font-size="11" fill="white" font-weight="600">Decorator</text></g>
  <g><circle cx="460" cy="430" r="32" fill="#10b981" fill-opacity="0.9"/>
     <text x="460" y="434" text-anchor="middle" font-size="11" fill="white" font-weight="600">Proxy</text></g>

  <!-- Composite (recursive wrapping, sits between wrap-cluster and traverse-cluster) -->
  <g><circle cx="320" cy="450" r="36" fill="#10b981" fill-opacity="0.9"/>
     <text x="320" y="454" text-anchor="middle" font-size="11" fill="white" font-weight="600">Composite</text></g>

  <!-- Adapter (interface conversion, near Bridge & Facade) -->
  <g><circle cx="430" cy="320" r="34" fill="#10b981" fill-opacity="0.9"/>
     <text x="430" y="324" text-anchor="middle" font-size="11" fill="white" font-weight="600">Adapter</text></g>

  <!-- Bridge -->
  <g><circle cx="495" cy="305" r="34" fill="#10b981" fill-opacity="0.9"/>
     <text x="495" y="309" text-anchor="middle" font-size="11" fill="white" font-weight="600">Bridge</text></g>

  <!-- Facade -->
  <g><circle cx="500" cy="380" r="32" fill="#10b981" fill-opacity="0.9"/>
     <text x="500" y="384" text-anchor="middle" font-size="11" fill="white" font-weight="600">Facade</text></g>

  <!-- ===== Cluster: traverse structure ===== -->
  <!-- Iterator -->
  <g><circle cx="230" cy="430" r="34" fill="#7c3aed" fill-opacity="0.85"/>
     <text x="230" y="434" text-anchor="middle" font-size="11" fill="white" font-weight="600">Iterator</text></g>

  <!-- Visitor -->
  <g><circle cx="250" cy="520" r="34" fill="#7c3aed" fill-opacity="0.85"/>
     <text x="250" y="524" text-anchor="middle" font-size="11" fill="white" font-weight="600">Visitor</text></g>

  <!-- Interpreter (close to Composite + Visitor; AST-shaped) -->
  <g><circle cx="430" cy="600" r="38" fill="#7c3aed" fill-opacity="0.85"/>
     <text x="430" y="604" text-anchor="middle" font-size="11" fill="white" font-weight="600">Interpreter</text></g>

  <!-- ===== Cluster: decoupled comms ===== -->
  <!-- Observer -->
  <g><circle cx="170" cy="660" r="36" fill="#ef4444" fill-opacity="0.85"/>
     <text x="170" y="664" text-anchor="middle" font-size="11" fill="white" font-weight="600">Observer</text></g>

  <!-- Mediator -->
  <g><circle cx="320" cy="700" r="36" fill="#ef4444" fill-opacity="0.85"/>
     <text x="320" y="704" text-anchor="middle" font-size="11" fill="white" font-weight="600">Mediator</text></g>

  <!-- Chain of Responsibility (close to Observer) -->
  <g><circle cx="180" cy="560" r="40" fill="#ef4444" fill-opacity="0.85"/>
     <text x="180" y="557" text-anchor="middle" font-size="10" fill="white" font-weight="600">Chain of</text>
     <text x="180" y="570" text-anchor="middle" font-size="10" fill="white" font-weight="600">Responsibility</text></g>

  <!-- ===== Cluster: instance state mgmt ===== -->
  <!-- Memento (near Command & State for undo / snapshots) -->
  <g><circle cx="780" cy="540" r="34" fill="#0891b2" fill-opacity="0.85"/>
     <text x="780" y="544" text-anchor="middle" font-size="11" fill="white" font-weight="600">Memento</text></g>

  <!-- Flyweight (shared instances; bridge to Singleton/Prototype) -->
  <g><circle cx="850" cy="430" r="34" fill="#0891b2" fill-opacity="0.85"/>
     <text x="850" y="434" text-anchor="middle" font-size="11" fill="white" font-weight="600">Flyweight</text></g>

  <!-- ===== Cluster: construction (top right) ===== -->
  <!-- Factory Method -->
  <g><circle cx="990" cy="170" r="40" fill="#3b82f6" fill-opacity="0.9"/>
     <text x="990" y="167" text-anchor="middle" font-size="11" fill="white" font-weight="600">Factory</text>
     <text x="990" y="181" text-anchor="middle" font-size="11" fill="white" font-weight="600">Method</text></g>

  <!-- Abstract Factory -->
  <g><circle cx="900" cy="220" r="42" fill="#3b82f6" fill-opacity="0.9"/>
     <text x="900" y="217" text-anchor="middle" font-size="11" fill="white" font-weight="600">Abstract</text>
     <text x="900" y="231" text-anchor="middle" font-size="11" fill="white" font-weight="600">Factory</text></g>

  <!-- Builder -->
  <g><circle cx="1040" cy="270" r="36" fill="#3b82f6" fill-opacity="0.9"/>
     <text x="1040" y="274" text-anchor="middle" font-size="11" fill="white" font-weight="600">Builder</text></g>

  <!-- Prototype -->
  <g><circle cx="970" cy="320" r="38" fill="#3b82f6" fill-opacity="0.9"/>
     <text x="970" y="324" text-anchor="middle" font-size="11" fill="white" font-weight="600">Prototype</text></g>

  <!-- Singleton (slightly off — odd one out) -->
  <g><circle cx="1075" cy="170" r="38" fill="#3b82f6" fill-opacity="0.9"/>
     <text x="1075" y="174" text-anchor="middle" font-size="11" fill="white" font-weight="600">Singleton</text></g>

  <!-- Footnote -->
  <text x="600" y="870" text-anchor="middle" font-size="11" fill="#888">
    Lines connect patterns whose solutions are commonly substituted or confused. Cluster shading shows neighborhoods of similar intent.
  </text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="ctrlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="podGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="storGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1200" height="950" fill="#f9fafb"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">
    How Pods in Kubernetes Use Shared Network Storage
  </text>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#6b7280">
    PVC → PV → CSI driver → network storage backend.  Pods on different nodes mount the same volume; the storage system is shared, not the local disk.
  </text>

  <!-- ===== CONTROL PLANE ===== -->
  <g>
    <rect x="30" y="80" width="1140" height="150" rx="10" fill="url(#ctrlGrad)" stroke="#b45309" stroke-width="2"/>
    <text x="50" y="105" font-size="14" font-weight="700" fill="#78350f">CONTROL PLANE</text>

    <!-- API server -->
    <rect x="50" y="120" width="220" height="95" rx="6" fill="#ffffff" stroke="#b45309"/>
    <text x="160" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">API server</text>
    <text x="160" y="162" text-anchor="middle" font-size="11" fill="#92400e">stores PVC, PV,</text>
    <text x="160" y="178" text-anchor="middle" font-size="11" fill="#92400e">StorageClass,</text>
    <text x="160" y="194" text-anchor="middle" font-size="11" fill="#92400e">VolumeAttachment</text>
    <text x="160" y="208" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">(in etcd)</text>

    <!-- StorageClass -->
    <rect x="290" y="120" width="200" height="95" rx="6" fill="#ffffff" stroke="#b45309"/>
    <text x="390" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">StorageClass</text>
    <text x="390" y="162" text-anchor="middle" font-size="11" fill="#92400e">"fast-ssd-rwx"</text>
    <text x="390" y="178" text-anchor="middle" font-size="11" fill="#92400e">provisioner: csi.example</text>
    <text x="390" y="194" text-anchor="middle" font-size="11" fill="#92400e">params: tier=gold,</text>
    <text x="390" y="208" text-anchor="middle" font-size="11" fill="#92400e">accessModes=RWX</text>

    <!-- PVC -->
    <rect x="510" y="120" width="200" height="95" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <text x="610" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">PersistentVolumeClaim</text>
    <text x="610" y="162" text-anchor="middle" font-size="11" fill="#92400e">"shared-data" (10Gi)</text>
    <text x="610" y="178" text-anchor="middle" font-size="11" fill="#92400e">accessMode: RWX</text>
    <text x="610" y="194" text-anchor="middle" font-size="11" fill="#92400e">storageClassName:</text>
    <text x="610" y="208" text-anchor="middle" font-size="11" fill="#92400e">fast-ssd-rwx</text>

    <!-- PV -->
    <rect x="730" y="120" width="200" height="95" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <text x="830" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">PersistentVolume</text>
    <text x="830" y="162" text-anchor="middle" font-size="11" fill="#92400e">bound to the PVC</text>
    <text x="830" y="178" text-anchor="middle" font-size="11" fill="#92400e">csi.volumeHandle:</text>
    <text x="830" y="194" text-anchor="middle" font-size="11" fill="#92400e">vol-abc123</text>
    <text x="830" y="208" text-anchor="middle" font-size="11" fill="#92400e">capacity: 10Gi</text>

    <!-- External provisioner -->
    <rect x="950" y="120" width="220" height="95" rx="6" fill="#ffffff" stroke="#b45309"/>
    <text x="1060" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">CSI controller</text>
    <text x="1060" y="160" text-anchor="middle" font-size="11" fill="#92400e">external-provisioner</text>
    <text x="1060" y="176" text-anchor="middle" font-size="11" fill="#92400e">external-attacher</text>
    <text x="1060" y="192" text-anchor="middle" font-size="11" fill="#92400e">CreateVolume /</text>
    <text x="1060" y="208" text-anchor="middle" font-size="11" fill="#92400e">ControllerPublish</text>
  </g>

  <!-- arrows in control plane -->
  <line x1="490" y1="167" x2="510" y2="167" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="710" y1="167" x2="730" y2="167" stroke="#15803d" stroke-width="2" marker-end="url(#arrGreen)"/>
  <line x1="930" y1="167" x2="950" y2="167" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- ===== NODE A ===== -->
  <g>
    <rect x="30" y="260" width="555" height="380" rx="10" fill="url(#nodeGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="50" y="285" font-size="14" font-weight="700" fill="#1e3a8a">NODE A  (worker)</text>

    <!-- Pod 1 -->
    <rect x="50" y="300" width="240" height="155" rx="8" fill="url(#podGrad)" stroke="#6d28d9" stroke-width="2"/>
    <text x="170" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Pod  web-1</text>
    <rect x="65" y="335" width="210" height="44" rx="4" fill="#ffffff" stroke="#6d28d9"/>
    <text x="170" y="354" text-anchor="middle" font-size="11" fill="#4c1d95">container: nginx</text>
    <text x="170" y="370" text-anchor="middle" font-size="11" fill="#4c1d95">volumeMount: /data</text>
    <rect x="65" y="389" width="210" height="56" rx="4" fill="#fef3c7" stroke="#b45309"/>
    <text x="170" y="408" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">volumes:</text>
    <text x="170" y="425" text-anchor="middle" font-size="11" fill="#78350f">- name: data</text>
    <text x="170" y="440" text-anchor="middle" font-size="11" fill="#78350f">  pvc: shared-data</text>

    <!-- Pod 2 -->
    <rect x="305" y="300" width="260" height="155" rx="8" fill="url(#podGrad)" stroke="#6d28d9" stroke-width="2"/>
    <text x="435" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Pod  worker-1</text>
    <rect x="320" y="335" width="230" height="44" rx="4" fill="#ffffff" stroke="#6d28d9"/>
    <text x="435" y="354" text-anchor="middle" font-size="11" fill="#4c1d95">container: jobrunner</text>
    <text x="435" y="370" text-anchor="middle" font-size="11" fill="#4c1d95">volumeMount: /shared</text>
    <rect x="320" y="389" width="230" height="56" rx="4" fill="#fef3c7" stroke="#b45309"/>
    <text x="435" y="408" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">volumes:</text>
    <text x="435" y="425" text-anchor="middle" font-size="11" fill="#78350f">- name: shared</text>
    <text x="435" y="440" text-anchor="middle" font-size="11" fill="#78350f">  pvc: shared-data  (same!)</text>

    <!-- bind mount lines -->
    <line x1="170" y1="455" x2="170" y2="490" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="435" y1="455" x2="435" y2="490" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
    <text x="180" y="475" font-size="10" fill="#374151" font-style="italic">bind mount</text>
    <text x="445" y="475" font-size="10" fill="#374151" font-style="italic">bind mount</text>

    <!-- Kubelet mount point on node -->
    <rect x="50" y="495" width="515" height="55" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="307" y="516" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">
      kubelet global mount point
    </text>
    <text x="307" y="534" text-anchor="middle" font-size="11" fill="#1e40af">
      /var/lib/kubelet/plugins/kubernetes.io/csi/.../mount  →  bind-mounted into both pods
    </text>

    <line x1="307" y1="550" x2="307" y2="580" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>

    <!-- CSI node plugin -->
    <rect x="50" y="585" width="515" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
    <text x="307" y="606" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">
      CSI node plugin (DaemonSet)  +  kubelet
    </text>
    <text x="307" y="624" text-anchor="middle" font-size="11" fill="#1e40af">
      NodeStageVolume → NodePublishVolume   (mounts the network volume on the node)
    </text>
  </g>

  <!-- ===== NODE B ===== -->
  <g>
    <rect x="615" y="260" width="555" height="380" rx="10" fill="url(#nodeGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="635" y="285" font-size="14" font-weight="700" fill="#1e3a8a">NODE B  (worker)</text>

    <!-- Pod 3 -->
    <rect x="635" y="300" width="240" height="155" rx="8" fill="url(#podGrad)" stroke="#6d28d9" stroke-width="2"/>
    <text x="755" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Pod  web-2</text>
    <rect x="650" y="335" width="210" height="44" rx="4" fill="#ffffff" stroke="#6d28d9"/>
    <text x="755" y="354" text-anchor="middle" font-size="11" fill="#4c1d95">container: nginx</text>
    <text x="755" y="370" text-anchor="middle" font-size="11" fill="#4c1d95">volumeMount: /data</text>
    <rect x="650" y="389" width="210" height="56" rx="4" fill="#fef3c7" stroke="#b45309"/>
    <text x="755" y="408" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">volumes:</text>
    <text x="755" y="425" text-anchor="middle" font-size="11" fill="#78350f">- name: data</text>
    <text x="755" y="440" text-anchor="middle" font-size="11" fill="#78350f">  pvc: shared-data</text>

    <!-- Pod 4 -->
    <rect x="890" y="300" width="260" height="155" rx="8" fill="url(#podGrad)" stroke="#6d28d9" stroke-width="2"/>
    <text x="1020" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Pod  worker-2</text>
    <rect x="905" y="335" width="230" height="44" rx="4" fill="#ffffff" stroke="#6d28d9"/>
    <text x="1020" y="354" text-anchor="middle" font-size="11" fill="#4c1d95">container: jobrunner</text>
    <text x="1020" y="370" text-anchor="middle" font-size="11" fill="#4c1d95">volumeMount: /shared</text>
    <rect x="905" y="389" width="230" height="56" rx="4" fill="#fef3c7" stroke="#b45309"/>
    <text x="1020" y="408" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">volumes:</text>
    <text x="1020" y="425" text-anchor="middle" font-size="11" fill="#78350f">- name: shared</text>
    <text x="1020" y="440" text-anchor="middle" font-size="11" fill="#78350f">  pvc: shared-data  (same!)</text>

    <line x1="755" y1="455" x2="755" y2="490" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="1020" y1="455" x2="1020" y2="490" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
    <text x="765" y="475" font-size="10" fill="#374151" font-style="italic">bind mount</text>
    <text x="1030" y="475" font-size="10" fill="#374151" font-style="italic">bind mount</text>

    <rect x="635" y="495" width="515" height="55" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="892" y="516" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">
      kubelet global mount point
    </text>
    <text x="892" y="534" text-anchor="middle" font-size="11" fill="#1e40af">
      /var/lib/kubelet/plugins/kubernetes.io/csi/.../mount  →  bind-mounted into both pods
    </text>

    <line x1="892" y1="550" x2="892" y2="580" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="635" y="585" width="515" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
    <text x="892" y="606" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">
      CSI node plugin (DaemonSet)  +  kubelet
    </text>
    <text x="892" y="624" text-anchor="middle" font-size="11" fill="#1e40af">
      NodeStageVolume → NodePublishVolume   (mounts the network volume on the node)
    </text>
  </g>

  <!-- arrows nodes -> network storage -->
  <line x1="307" y1="640" x2="307" y2="700" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line x1="892" y1="640" x2="892" y2="700" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="320" y="675" font-size="11" fill="#b91c1c" font-style="italic">NFS / iSCSI / SMB / FC / RBD over network</text>
  <text x="905" y="675" font-size="11" fill="#b91c1c" font-style="italic">NFS / iSCSI / SMB / FC / RBD over network</text>

  <!-- ===== NETWORK STORAGE ===== -->
  <g>
    <rect x="30" y="710" width="1140" height="160" rx="12" fill="url(#storGrad)" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="50" y="738" font-size="15" font-weight="700" fill="#7f1d1d">
      NETWORK STORAGE BACKEND  (lives outside the cluster — or in a dedicated storage namespace)
    </text>

    <rect x="60" y="755" width="340" height="100" rx="8" fill="#ffffff" stroke="#b91c1c"/>
    <text x="230" y="780" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">File-based  (RWX)</text>
    <text x="230" y="800" text-anchor="middle" font-size="11" fill="#991b1b">NFS, CephFS, GlusterFS,</text>
    <text x="230" y="816" text-anchor="middle" font-size="11" fill="#991b1b">AWS EFS, Azure Files,</text>
    <text x="230" y="832" text-anchor="middle" font-size="11" fill="#991b1b">GCP Filestore</text>
    <text x="230" y="848" text-anchor="middle" font-size="10" fill="#991b1b" font-style="italic">multiple pods, multiple nodes can mount r/w</text>

    <rect x="420" y="755" width="340" height="100" rx="8" fill="#ffffff" stroke="#b91c1c"/>
    <text x="590" y="780" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Block-based  (usually RWO)</text>
    <text x="590" y="800" text-anchor="middle" font-size="11" fill="#991b1b">iSCSI, Ceph RBD, FC,</text>
    <text x="590" y="816" text-anchor="middle" font-size="11" fill="#991b1b">EBS, Azure Disk,</text>
    <text x="590" y="832" text-anchor="middle" font-size="11" fill="#991b1b">GCE PD</text>
    <text x="590" y="848" text-anchor="middle" font-size="10" fill="#991b1b" font-style="italic">one node mounts at a time (or RWOX with care)</text>

    <rect x="780" y="755" width="370" height="100" rx="8" fill="#ffffff" stroke="#b91c1c"/>
    <text x="965" y="780" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Object  (via CSI shim)</text>
    <text x="965" y="800" text-anchor="middle" font-size="11" fill="#991b1b">S3 / GCS / Azure Blob</text>
    <text x="965" y="816" text-anchor="middle" font-size="11" fill="#991b1b">via s3fs / Mountpoint-S3 /</text>
    <text x="965" y="832" text-anchor="middle" font-size="11" fill="#991b1b">COSI</text>
    <text x="965" y="848" text-anchor="middle" font-size="10" fill="#991b1b" font-style="italic">eventual consistency; not POSIX-complete</text>
  </g>

  <!-- Legend / footnotes -->
  <g>
    <rect x="30" y="885" width="1140" height="55" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="45" y="906" font-size="11" fill="#111827" font-weight="700">Access modes:</text>
    <text x="135" y="906" font-size="11" fill="#111827">
      RWO = one node r/w  •  ROX = many nodes read-only  •  RWX = many nodes r/w  •  RWOP = single pod r/w
    </text>
    <text x="45" y="926" font-size="11" fill="#374151" font-style="italic">
      Two pods on the same node share via bind mounts of one node-level mount.  Two pods on different nodes share because the backend itself is networked — each node mounts it independently and the storage system arbitrates.
    </text>
  </g>
</svg>

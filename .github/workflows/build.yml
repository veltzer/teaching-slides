name: build
on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write
  # needed to delete stale pages artifacts on re-run
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        cache: pip
        python-version: '3.x'
    - uses: actions/setup-node@v6
      with:
        cache: npm
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
    - uses: actions/cache@v5
      with:
        path: .rsconstruct
        # Primary key is unique per run so every successful run saves a fresh
        # cache. restore-keys lets the run start from the most recent cache
        # matching the prefix. Without this (static key), actions/cache never
        # re-saves once the first cache exists.
        key: rsconstruct-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          rsconstruct-${{ runner.os }}-
    - name: install rsconstruct
      run: |
        gh release download --repo veltzer/rsconstruct --pattern 'rsconstruct-linux-x86_64' --output /usr/local/bin/rsconstruct
        chmod +x /usr/local/bin/rsconstruct
        rsconstruct version
        rsconstruct processors config
      env:
        GH_TOKEN: ${{ github.token }}
    - name: install
      run: |
        rsconstruct tools install-deps --yes
        rsconstruct tools install --yes
    - name: build
      run: rsconstruct build --pset marp.max_jobs=2
    - name: status
      run: rsconstruct status
    - name: delete stale pages artifact
      # Artifacts survive re-run attempts, and deploy-pages fails hard when it
      # finds more than one artifact named "github-pages" in the run. Delete
      # any leftover from a previous attempt before uploading a fresh one.
      run: |
        gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
          --jq '.artifacts[] | select(.name == "github-pages") | .id' |
        while read -r artifact_id; do
          echo "deleting stale artifact $artifact_id"
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
        done
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/upload-pages-artifact@v5
    - uses: actions/deploy-pages@v5

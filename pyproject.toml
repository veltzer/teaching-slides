# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "teaching-slides"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "PyYAML",
    "lxml",
]

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
    "types-PyYAML",
]

[tool.uv]
package = false

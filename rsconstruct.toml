[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# rsslide renders the decks (crates.io, cargo install), with the fonts its
# default configuration draws with: Noto Sans and Noto Sans Math, Liberation
# Sans and Mono, DejaVu Sans and Mono, FreeSans and FreeMono, Noto Sans CJK
# and Noto Color Emoji for the characters Noto Sans lacks.
[dependencies]
cargo = ["rsslide"]
system = [
    "fonts-noto-core",
    "fonts-noto-extra",
    "fonts-liberation",
    "fonts-dejavu-core",
    "fonts-dejavu-mono",
    "fonts-freefont-ttf",
    "fonts-noto-cjk",
    "fonts-noto-color-emoji",
]

[processor.generator.tera]
src_dirs = ["tera.templates"]

[processor.checker.script.check_svg]
command = "scripts/check_svg.py"
src_extensions = [".svg"]
src_dirs = ["svg"]
batch = true

[processor.checker.script.check_marp_md]
command = "scripts/check_marp_md.py"
src_extensions = [".md"]
src_dirs = ["marp"]
batch = true

# The decks render with rsslide (https://github.com/veltzer/rsslide), which
# reproduces marp's default theme without a browser and reads the marp
# decks directly. Content that runs off a slide fails the build, where
# marp silently cut it off: split the slide (`## Title (cont.)`).

# Per-chapter course PDFs are only inputs for ipdfunite merging; they render
# outside _site so the published site carries only the united course PDFs.
[processor.generator.generic.rsslide_courses]
command = "rsslide"
args = ["generate", "--format=pdf"]
src_dirs = ["marp/courses"]
src_extensions = [".md"]
output_dir = "out/chapters/courses"
output_extension = "pdf"
batch = true

# Standalone lectures have no united PDF; the site links them individually.
[processor.generator.generic.rsslide_lectures]
command = "rsslide"
args = ["generate", "--format=pdf"]
src_dirs = ["marp/lectures"]
src_extensions = [".md"]
output_dir = "_site/marp/lectures"
output_extension = "pdf"
batch = true

[processor.checker.ruff]
src_dirs = ["scripts"]

# Design-token rules (biome GritQL plugin) from the shared-themes submodule:
# stylesheets must use its var(--<role>) tokens instead of raw colors.
[processor.checker.biome]
src_dirs = ["resources"]
src_extensions = [".css"]
args = ["--config-path", "shared/shared-themes/biome-tokens.jsonc"]
dep_inputs = ["shared/shared-themes/biome-tokens.jsonc", "shared/shared-themes/design-tokens.grit"]

[processor.checker.zspell]
src_dirs = ["marp"]

[processor.generator.ipdfunite]
src_dirs = ["marp/courses"]
output_dir = "_site/pdfunite"
source_output_dir = "out/chapters"

[processor.explicit.generic]
command = "scripts/build_index.py"
inputs = [
    "resources/courses_index_material_web.html",
    "resources/courses_index_material_web.css",
    "resources/courses_index_material_web.js",
    "resources/courses_index_material_css.html",
    "resources/courses_index_material_css.css",
    "resources/courses_index_material_css.js",
    "shared/shared-themes/themes.css",
    "shared/shared-themes/base.css",
    "shared/shared-themes/typography.css",
    "shared/shared-themes/components.css",
    "shared/shared-themes/theme-switcher.js",
    "shared/shared-themes/themes.json",
    "shared/shared-themes/fonts.css",
    "shared/shared-themes/shared_themes.py",
]
input_globs = [
    "shared/shared-themes/fonts/*",
    "_site/pdfunite/**/*.pdf",
    "_site/marp/lectures/**/*.pdf",
]
output_dirs = [ "_site" ]

[analyzer.markdown]

[analyzer.tera]

[analyzer.python]

[processor.checker.terms]
dir_terms_unambiguous = "shared/shared-terms/unambiguous"
dir_terms_ambiguous = "shared/shared-terms/ambiguous"
src_dirs = [ "marp" ]
enabled = false

[pages]
dir = "_site"

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_dirs = ["doc", "marp"]
src_files = ["CLAUDE.md", "README.md"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_dirs = ["resources"]
src_files = ["text_labels.yaml"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.checker.ijsonlint]
src_files = ["package.json"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.checker.ixmllint]
src_dirs = ["svg", "to_integrate"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.checker.iluacheck]
src_dirs = ["config"]

# ─── html ────────────────────────────────────────────────────────────────────

[processor.checker.itidy]
src_dirs = ["resources", "to_integrate"]
# The index pages use Material Web components (<md-outlined-select>, ...),
# which are valid HTML5 custom elements tidy only accepts with custom-tags,
# and a CSS-drawn toggle built from an empty <span>, which is valid HTML that
# tidy would otherwise warn it might trim.
options = ["custom-tags: blocklevel", "drop-empty-elements: no"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.checker.oxlint]
src_dirs = ["resources"]
src_files = [".marprc.mjs"]
args = ["-c", ".oxlintrc.json"]

[processor.generator.tags]
# Validates the marp decks' front-matter against the shared vocabulary, the
# same lists teaching-syllabi and business-syllabi validate against.
# tags_dir defaults to "tags", so the submodule location must be named.
tags_dir = "shared/shared-tags"
src_dirs = ["marp"]

[processor.make]
exclude_paths = ["Makefile"]

[processor.tera]
extra_inputs = [
    "config/project.lua",
    "config/personal.lua",
    "config/version.lua",
    "config/python.lua",
    "config/github.lua",
    "config/shared.lua",
]

[processor.jsonlint]
enabled = false

[processor.ascii_check]
enabled = false

[processor.rumdl]
enabled = false

[processor.mdl]
enabled = false

[processor.markdownlint]
enabled = false

[processor.pandoc]
enabled = false

[processor.a2x]
enabled = false

[processor.luacheck]
enabled = false

[processor.script_check]
enabled = true
linter = "python"
args = ["scripts/md_lint.py", "-q"]
extensions = [".md"]
scan_dir = "marp"

[processor.slidev]
enabled = false

[processor.tidy]
enabled = false

[processor.htmlhint]
enabled = false

[processor.htmllint]
enabled = false

[processor.jslint]
enabled = false

[processor.jshint]
enabled = false

[processor.eslint]
enabled = false

[processor.stylelint]
enabled = false

[processor.standard]
enabled = false

[processor.drawio]
enabled = false

[processor.libreoffice]
enabled = false

[processor.pip]
enabled = false

[processor.tera]
extra_inputs = [
    "config/project.lua",
    "config/personal.lua",
    "config/version.lua",
    "config/python.lua",
    "config/github.lua",
    "config/shared.lua",
]

[processor.script]
linter = "python"
args = ["scripts/md_lint.py", "-q"]
extensions = [".md"]
scan_dirs = ["marp"]

[processor.marp]
formats = [ "pdf" ]
max_jobs = 4

[processor.pylint]
scan_dirs = ["scripts"]

[processor.mdl]
scan_dirs = ["marp"]

[processor.markdownlint]
scan_dirs = ["marp"]

[processor.pdfunite]

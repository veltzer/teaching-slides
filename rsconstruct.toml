[processor.tera]
extra_inputs = [
    "config/project.lua",
    "config/personal.lua",
]

[processor.script]
linter = "python"
args = ["scripts/md_lint.py", "-q"]
extensions = [".md"]
scan_dirs = ["marp"]

[processor.marp]
formats = [ "pdf" ]
max_jobs = 10
output_dir = "_site/marp"

[processor.pylint]
scan_dirs = ["scripts"]

[processor.mdl]
scan_dirs = ["marp"]

[processor.markdownlint]
scan_dirs = ["marp"]

[processor.aspell]
scan_dirs = ["marp"]

[processor.zspell]
scan_dirs = ["marp"]

[processor.pdfunite]
output_dir = "_site/pdfunite"
source_output_dir = "_site/marp"

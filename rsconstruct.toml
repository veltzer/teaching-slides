[processor.tera]
dep_inputs = [
    "config/project.lua",
    "config/personal.lua",
]

[processor.script.check_svg]
command = "scripts/check_svg.py"
src_extensions = [".svg"]
src_dirs = ["svg"]
batch = true

[processor.svglint]
src_dirs = ["svg"]

[processor.script.check_md]
command = "scripts/check_md.py"
src_extensions = [".md"]
src_dirs = ["marp"]
batch = true

[processor.marp]
formats = [ "pdf" ]
max_jobs = 10
output_dir = "_site/marp"

[processor.ruff]
src_dirs = ["scripts"]

[processor.requirements]
src_dirs = ["scripts"]

[processor.markdownlint]
src_dirs = ["marp"]

[processor.zspell]
src_dirs = ["marp"]

[processor.ipdfunite]
output_dir = "_site/pdfunite"
source_output_dir = "_site/marp"

[processor.explicit]
command = "scripts/build_index.py"
inputs = [
    "resources/courses_index.html",
    "resources/courses_index.css",
    "resources/courses_index.js",
]
input_globs = [
    "_site/courses/**/*.pdf",
    "_site/pdfunite/**/*.pdf",
]
output_dirs = [ "_site" ]

[analyzer.markdown]

[analyzer.tera]

[analyzer.python]

[dependencies]
pip = ["PyYAML"]

[processor.tera]
extra_inputs = [
    "config/project.lua",
    "config/personal.lua",
]

[processor.script.check_svg_quality]
linter = "scripts/check_svg_quality.py"
extensions = [".svg"]
scan_dirs = ["svg"]
batch = true

[processor.svglint]
scan_dirs = ["svg"]

[processor.script.md_checks]
linter = "scripts/md_checks.py"
extensions = [".md"]
scan_dirs = ["marp"]
batch = true

[processor.marp]
formats = [ "pdf" ]
max_jobs = 10
output_dir = "_site/marp"

[processor.ruff]
scan_dirs = ["scripts"]

[processor.markdownlint]
scan_dirs = ["marp"]

[processor.zspell]
scan_dirs = ["marp"]

[processor.ipdfunite]
output_dir = "_site/pdfunite"
source_output_dir = "_site/marp"

[processor.explicit]
command = "scripts/build_index.py"
inputs = [
    "resources/courses_index.html",
    "resources/courses_index.css",
    "resources/courses_index.js",
]
input_globs = [
    "_site/courses/**/*.pdf",
    "_site/pdfunite/**/*.pdf",
]
outputs = [
    "_site/index.html",
]

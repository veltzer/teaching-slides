semantic:
  # Custom semantic labels (no syntax highlighting, for categorization)
  - label: tree
    description: directory/file tree structures (using indentation, pipes, etc.)
  - label: diagram
    description: ASCII art diagrams, flowcharts, architecture drawings, box diagrams
  - label: config
    description: configuration file contents (generic, when not ini/toml/yaml/etc.)
  - label: output
    description: program output, log output, data dumps
  - label: console
    description: shell sessions with $ prompts, interactive terminal output
  - label: template
    description: template files, commit message templates
  - label: gitignore
    description: .gitignore file contents
  - label: cron
    description: cron expressions, systemd timer/calendar expressions
  - label: protocol
    description: network protocol examples
  - label: misc
    description: any text which doesn't comply with the previous definitions


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <rect x="284.4444" y="80" width="568.8889" height="80" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="128" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="22.7556" font-weight="bold">User Space (Applications)</text>
  <rect x="284.4444" y="184" width="568.8889" height="64" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="224" text-anchor="middle" fill="var(--info-accent)" font-family="Arial,sans-serif" font-size="19.9111">Virtual File System (VFS)</text>
  <rect x="284.4444" y="272" width="170.6667" height="56" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="369.7778" y="307.2" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial,sans-serif" font-size="17.0667">ext4</text>
  <rect x="483.5556" y="272" width="170.6667" height="56" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="307.2" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial,sans-serif" font-size="17.0667">XFS</text>
  <rect x="682.6667" y="272" width="170.6667" height="56" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="768" y="307.2" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial,sans-serif" font-size="17.0667">NFS</text>
  <rect x="284.4444" y="352" width="568.8889" height="64" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="392" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial,sans-serif" font-size="19.9111">Block I/O Layer</text>
  <rect x="355.5556" y="440" width="426.6667" height="56" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="475.2" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="18.4889">Device Drivers</text>
  <line x1="568.8889" y1="160" x2="568.8889" y2="184" stroke="var(--text)" stroke-width="2" />
  <line x1="568.8889" y1="248" x2="568.8889" y2="272" stroke="var(--text)" stroke-width="2" />
  <line x1="568.8889" y1="328" x2="568.8889" y2="352" stroke="var(--text)" stroke-width="2" />
  <line x1="568.8889" y1="416" x2="568.8889" y2="440" stroke="var(--text)" stroke-width="2" />
  <text x="568.8889" y="560" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="42.6667" font-weight="bold">Linux I/O Architecture</text>
  <text x="568.8889" y="608" text-anchor="middle" fill="var(--text-faint)" font-family="Arial,sans-serif" font-size="21.3333">Understanding Input/Output in Linux Systems</text>
</svg>
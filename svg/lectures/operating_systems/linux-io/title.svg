<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <rect x="339.9999" y="112.5" width="600" height="72.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="156" text-anchor="middle" fill="var(--primary-accent)" font-size="22.2471" font-weight="bold" font-family="Arial, sans-serif">User Space (Applications)</text>
  <rect x="339.9999" y="206.75" width="600" height="58" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="243" text-anchor="middle" fill="var(--info-accent)" font-size="19.4662" font-family="Arial, sans-serif">Virtual File System (VFS)</text>
  <rect x="339.9999" y="286.5" width="180" height="50.75" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="430" y="318.4" text-anchor="middle" fill="var(--danger-accent)" font-size="16.6854" font-family="Arial, sans-serif">ext4</text>
  <rect x="550" y="286.5" width="180" height="50.75" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="318.4" text-anchor="middle" fill="var(--danger-accent)" font-size="16.6854" font-family="Arial, sans-serif">XFS</text>
  <rect x="760" y="286.5" width="180" height="50.75" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="850" y="318.4" text-anchor="middle" fill="var(--danger-accent)" font-size="16.6854" font-family="Arial, sans-serif">NFS</text>
  <rect x="339.9999" y="359" width="600" height="58" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="395.25" text-anchor="middle" fill="var(--warn-accent)" font-size="19.4662" font-family="Arial, sans-serif">Block I/O Layer</text>
  <rect x="415" y="438.75" width="450" height="50.75" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="470.65" text-anchor="middle" fill="var(--primary-accent)" font-size="18.0758" font-family="Arial, sans-serif">Device Drivers</text>
  <line x1="640" y1="185" x2="640" y2="206.75" stroke="var(--text)" stroke-width="2" />
  <line x1="640" y1="264.75" x2="640" y2="286.5" stroke="var(--text)" stroke-width="2" />
  <line x1="640" y1="337.25" x2="640" y2="359" stroke="var(--text)" stroke-width="2" />
  <line x1="640" y1="417" x2="640" y2="438.75" stroke="var(--text)" stroke-width="2" />
  <text x="640" y="547.5" text-anchor="middle" fill="var(--surface)" font-size="41.7133" font-weight="bold" font-family="Arial, sans-serif">Linux I/O Architecture</text>
  <text x="640" y="591" text-anchor="middle" fill="var(--text-faint)" font-size="20.8566" font-family="Arial, sans-serif">Understanding Input/Output in Linux Systems</text>
</svg>
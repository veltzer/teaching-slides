<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Layered architecture -->
  <!-- User space -->
  <rect x="200" y="50" width="400" height="50" rx="8" fill="none" stroke="#00d2ff" stroke-width="2.5"/>
  <text x="400" y="80" text-anchor="middle" fill="#00d2ff" font-family="Arial,sans-serif" font-size="16" font-weight="bold">User Space (Applications)</text>
  <!-- VFS layer -->
  <rect x="200" y="115" width="400" height="40" rx="6" fill="none" stroke="#533483" stroke-width="2"/>
  <text x="400" y="140" text-anchor="middle" fill="#533483" font-family="Arial,sans-serif" font-size="14">Virtual File System (VFS)</text>
  <!-- File systems -->
  <rect x="200" y="170" width="120" height="35" rx="5" fill="none" stroke="#e94560" stroke-width="1.5"/>
  <text x="260" y="192" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="12">ext4</text>
  <rect x="340" y="170" width="120" height="35" rx="5" fill="none" stroke="#e94560" stroke-width="1.5"/>
  <text x="400" y="192" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="12">XFS</text>
  <rect x="480" y="170" width="120" height="35" rx="5" fill="none" stroke="#e94560" stroke-width="1.5"/>
  <text x="540" y="192" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="12">NFS</text>
  <!-- Block layer -->
  <rect x="200" y="220" width="400" height="40" rx="6" fill="none" stroke="#ff9900" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" fill="#ff9900" font-family="Arial,sans-serif" font-size="14">Block I/O Layer</text>
  <!-- Device drivers -->
  <rect x="250" y="275" width="300" height="35" rx="5" fill="none" stroke="#0f3460" stroke-width="2"/>
  <text x="400" y="297" text-anchor="middle" fill="#0f3460" font-family="Arial,sans-serif" font-size="13">Device Drivers</text>
  <!-- Arrows between layers -->
  <line x1="400" y1="100" x2="400" y2="115" stroke="#444" stroke-width="1.5"/>
  <line x1="400" y1="155" x2="400" y2="170" stroke="#444" stroke-width="1.5"/>
  <line x1="400" y1="205" x2="400" y2="220" stroke="#444" stroke-width="1.5"/>
  <line x1="400" y1="260" x2="400" y2="275" stroke="#444" stroke-width="1.5"/>
  <!-- Title -->
  <text x="400" y="350" text-anchor="middle" fill="#eee" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Linux I/O Architecture</text>
  <text x="400" y="380" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="15">Understanding Input/Output in Linux Systems</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.1066" font-weight="bold" fill="var(--text)">Linux I/O Models</text>

  <rect x="40" y="72.8302" width="290" height="284.5283" rx="6.2766" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="111.1321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8299" font-weight="bold" fill="var(--primary-text)">Blocking</text>
  <text x="185" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--primary-text)">read() waits for data</text>
  <text x="185" y="209.6226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--primary-text)">thread per fd</text>
  <text x="185" y="247.9245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--primary-text)">simplest</text>
  <text x="185" y="286.2264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--primary-text)">scales poorly</text>
  <text x="185" y="324.5283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--primary-text)">past ~1k conns</text>

  <rect x="340" y="72.8302" width="290" height="284.5283" rx="6.2766" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="485" y="111.1321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8299" font-weight="bold" fill="var(--ok-text)">Non-blocking</text>
  <text x="485" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--ok-text)">EAGAIN if not ready</text>
  <text x="485" y="209.6226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--ok-text)">O_NONBLOCK</text>
  <text x="485" y="247.9245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--ok-text)">caller retries</text>
  <text x="485" y="286.2264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--ok-text)">busy-poll wastes CPU</text>
  <text x="485" y="324.5283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--ok-text)">rare alone</text>

  <rect x="640" y="72.8302" width="290" height="284.5283" rx="6.2766" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="785" y="111.1321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8299" font-weight="bold" fill="var(--warn-text)">Multiplexing</text>
  <text x="785" y="149.434" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--warn-text)">select/poll/epoll</text>
  <text x="785" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--warn-text)">kernel lists ready fds</text>
  <text x="785" y="247.9245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--warn-text)">one thread, many fds</text>
  <text x="785" y="286.2264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--warn-text)">scales 10k+</text>
  <text x="785" y="324.5283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--warn-text)">nginx, Redis</text>

  <rect x="940" y="72.8302" width="300" height="284.5283" rx="6.2766" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1090" y="111.1321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8299" font-weight="bold" fill="var(--info-text)">Async (io_uring)</text>
  <text x="1090" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--info-text)">submit → completion</text>
  <text x="1090" y="209.6226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--info-text)">shared mem rings</text>
  <text x="1090" y="247.9245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--info-text)">kernel polls</text>
  <text x="1090" y="286.2264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--info-text)">zero-syscall path</text>
  <text x="1090" y="324.5283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--info-text)">Linux 5.1+</text>

  <rect x="40" y="401.1321" width="1200" height="218.8679" rx="6.2766" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="439.434" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7377" font-weight="bold" fill="var(--text)">Pick by scale</text>
  <text x="640" y="477.7358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" fill="var(--text-muted)">Few: blocking. Many: epoll. Disk: io_uring.</text>
  <text x="640" y="516.0377" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" fill="var(--text-muted)">Network servers: epoll by default.</text>
  <text x="640" y="548.8679" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" fill="var(--text-muted)">io_uring removes syscall overhead.</text>
  <text x="640" y="587.1698" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--text-muted)">Runtimes hide these behind async/await.</text>
</svg>

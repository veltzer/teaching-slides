<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <g transform="translate(50, 50)">
    <rect x="-11.1822" y="-10" width="633.737" height="165.7142" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6.7212" stroke-width="2"/>
    <text x="305.6863" y="93.5714" text-anchor="middle" font-size="64.9715">Blocking I/O</text>
    <rect x="41.6293" y="238.5714" width="528.114" height="82.8572" fill="var(--danger-fill)" rx="6.7212" stroke="var(--danger-border)" stroke-width="2"/>
    <text x="305.6863" y="300.7142" text-anchor="middle" font-size="51.0489" fill="var(--bg)">Wait for data</text>
    <rect x="41.6293" y="362.8572" width="528.114" height="82.8572" fill="var(--ok-fill)" rx="6.7212" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="305.6863" y="425" text-anchor="middle" font-size="51.0489" fill="var(--bg)">Process data</text>
  </g>
  <g transform="translate(200, 50)">
    <rect x="-11.1822" y="-10" width="633.737" height="165.7142" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6.7212" stroke-width="2"/>
    <text x="305.6863" y="93.5714" text-anchor="middle" font-size="64.9715">Non-blocking</text>
    <rect x="41.6293" y="238.5714" width="158.4343" height="82.8572" fill="var(--ok-fill)" rx="6.7212" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="226.4692" y="238.5714" width="158.4343" height="82.8572" fill="var(--ok-fill)" rx="6.7212" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="411.3092" y="238.5714" width="158.4343" height="82.8572" fill="var(--ok-fill)" rx="6.7212" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="305.6863" y="300.7142" text-anchor="middle" font-size="51.0489">Poll</text>
    <rect x="41.6293" y="362.8572" width="528.114" height="82.8572" fill="var(--ok-fill)" rx="6.7212" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="305.6863" y="425" text-anchor="middle" font-size="51.0489" fill="var(--bg)">Process data</text>
  </g>
  <g transform="translate(350, 50)">
    <rect x="-11.1822" y="-10" width="633.737" height="165.7142" fill="var(--info-fill)" stroke="var(--info-border)" rx="6.7212" stroke-width="2"/>
    <text x="305.6863" y="93.5714" text-anchor="middle" font-size="64.9715">Async I/O</text>
    <rect x="41.6293" y="238.5714" width="528.114" height="82.8572" fill="var(--info-fill)" rx="6.7212" stroke="var(--info-border)" stroke-width="2"/>
    <text x="305.6863" y="300.7142" text-anchor="middle" font-size="51.0489" fill="var(--bg)">Submit request</text>
    <rect x="41.6293" y="362.8572" width="528.114" height="82.8572" fill="var(--info-fill)" rx="6.7212" stroke="var(--info-border)" stroke-width="2"/>
    <text x="305.6863" y="425" text-anchor="middle" font-size="51.0489" fill="var(--bg)">Do other work</text>
    <rect x="41.6293" y="487.1428" width="528.114" height="82.8572" fill="var(--ok-fill)" rx="6.7212" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="305.6863" y="549.2858" text-anchor="middle" font-size="51.0489" fill="var(--bg)">Handle completion</text>
  </g>
  <g transform="translate(500, 50)">
    <rect x="-11.1822" y="-10" width="739.3598" height="165.7142" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6.7212" stroke-width="2"/>
    <text x="358.4977" y="93.5714" text-anchor="middle" font-size="64.9715">I/O Multiplexing</text>
    <rect x="41.6293" y="238.5714" width="633.737" height="82.8572" fill="var(--warn-fill)" rx="6.7212" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="358.4977" y="300.7142" text-anchor="middle" font-size="51.0489">select/poll/epoll</text>
    <rect x="41.6293" y="362.8572" width="633.737" height="82.8572" fill="var(--warn-fill)" rx="6.7212" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="358.4977" y="425" text-anchor="middle" font-size="51.0489" fill="var(--bg)">Monitor multiple FDs</text>
    <rect x="41.6293" y="487.1428" width="633.737" height="82.8572" fill="var(--ok-fill)" rx="6.7212" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="358.4977" y="549.2858" text-anchor="middle" font-size="51.0489" fill="var(--bg)">Process ready FDs</text>
  </g>
</svg>
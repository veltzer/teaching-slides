<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.1066" font-weight="bold" fill="var(--text)">Linux I/O Models</text>

  <rect x="40" y="72.8302" width="290" height="284.5283" rx="6.2766" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="111.1321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8299" font-weight="bold" fill="var(--primary-text)">Blocking</text>
  <text x="185" y="149.434" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--primary-text)">read() waits until</text>
  <text x="185" y="171.3208" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--primary-text)">data is ready</text>
  <text x="185" y="209.6226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--primary-text)">one thread per fd</text>
  <text x="185" y="247.9245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--primary-text)">simplest to write</text>
  <text x="185" y="286.2264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--primary-text)">scales poorly</text>
  <text x="185" y="324.5283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--primary-text)">beyond ~1k connections</text>

  <rect x="340" y="72.8302" width="290" height="284.5283" rx="6.2766" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="485" y="111.1321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8299" font-weight="bold" fill="var(--ok-text)">Non-blocking</text>
  <text x="485" y="149.434" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--ok-text)">read() returns</text>
  <text x="485" y="171.3208" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--ok-text)">EAGAIN if not ready</text>
  <text x="485" y="209.6226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--ok-text)">O_NONBLOCK flag</text>
  <text x="485" y="247.9245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--ok-text)">caller must retry</text>
  <text x="485" y="286.2264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--ok-text)">busy-poll wastes CPU</text>
  <text x="485" y="324.5283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--ok-text)">rarely used alone</text>

  <rect x="640" y="72.8302" width="290" height="284.5283" rx="6.2766" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="785" y="111.1321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8299" font-weight="bold" fill="var(--warn-text)">Multiplexing</text>
  <text x="785" y="149.434" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--warn-text)">select / poll / epoll</text>
  <text x="785" y="187.7358" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--warn-text)">kernel tells you</text>
  <text x="785" y="209.6226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--warn-text)">which fds are ready</text>
  <text x="785" y="247.9245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--warn-text)">one thread, many fds</text>
  <text x="785" y="286.2264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--warn-text)">scales to 10k+</text>
  <text x="785" y="324.5283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--warn-text)">used by nginx, Redis</text>

  <rect x="940" y="72.8302" width="300" height="284.5283" rx="6.2766" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1090" y="111.1321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8299" font-weight="bold" fill="var(--info-text)">Async (io_uring)</text>
  <text x="1090" y="149.434" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--info-text)">submit a request,</text>
  <text x="1090" y="171.3208" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--info-text)">get a completion</text>
  <text x="1090" y="209.6226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--info-text)">shared memory rings</text>
  <text x="1090" y="247.9245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--info-text)">kernel polls async</text>
  <text x="1090" y="286.2264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--info-text)">zero-syscall hot path</text>
  <text x="1090" y="324.5283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--info-text)">Linux 5.1+</text>

  <rect x="40" y="401.1321" width="1200" height="218.8679" rx="6.2766" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="439.434" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7377" font-weight="bold" fill="var(--text)">Pick by scale</text>
  <text x="640" y="477.7358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" fill="var(--text-muted)">Few connections → blocking is fine. Many → epoll. Storage-heavy → io_uring.</text>
  <text x="640" y="516.0377" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" fill="var(--text-muted)">Network servers: epoll remains the default choice.</text>
  <text x="640" y="548.8679" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6455" fill="var(--text-muted)">High-throughput disk I/O: io_uring removes per-op syscall overhead.</text>
  <text x="640" y="587.1698" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5994" fill="var(--text-muted)">Language runtimes (Go, Node, async Rust) hide these behind async/await.</text>
</svg>

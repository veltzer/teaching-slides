<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <g transform="translate(50, 50)">
    <rect x="386.0317" y="80" width="435.3742" height="142.8571" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
    <text x="603.7188" y="169.2857" text-anchor="middle" font-size="50">Blocking I/O</text>
    <rect x="422.313" y="294.2857" width="362.8117" height="71.4286" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
    <text x="603.7188" y="347.8571" text-anchor="middle" font-size="39.2857" fill="var(--bg)">Wait for data</text>
    <rect x="422.313" y="401.4286" width="362.8117" height="71.4286" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="603.7188" y="455" text-anchor="middle" font-size="39.2857" fill="var(--bg)">Process data</text>
  </g>
  <g transform="translate(200, 50)">
    <rect x="386.0317" y="80" width="435.3742" height="142.8571" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
    <text x="603.7188" y="169.2857" text-anchor="middle" font-size="50">Non-blocking</text>
    <rect x="422.313" y="294.2857" width="108.8435" height="71.4286" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="549.2971" y="294.2857" width="108.8435" height="71.4286" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="676.2812" y="294.2857" width="108.8435" height="71.4286" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="603.7188" y="347.8571" text-anchor="middle" font-size="39.2857">Poll</text>
    <rect x="422.313" y="401.4286" width="362.8117" height="71.4286" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="603.7188" y="455" text-anchor="middle" font-size="39.2857" fill="var(--bg)">Process data</text>
  </g>
  <g transform="translate(350, 50)">
    <rect x="386.0317" y="80" width="435.3742" height="142.8571" fill="var(--info-fill)" stroke="var(--info-border)" rx="6" stroke-width="2"/>
    <text x="603.7188" y="169.2857" text-anchor="middle" font-size="50">Async I/O</text>
    <rect x="422.313" y="294.2857" width="362.8117" height="71.4286" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
    <text x="603.7188" y="347.8571" text-anchor="middle" font-size="39.2857" fill="var(--bg)">Submit request</text>
    <rect x="422.313" y="401.4286" width="362.8117" height="71.4286" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
    <text x="603.7188" y="455" text-anchor="middle" font-size="39.2857" fill="var(--bg)">Do other work</text>
    <rect x="422.313" y="508.5714" width="362.8117" height="71.4286" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="603.7188" y="562.1429" text-anchor="middle" font-size="39.2857" fill="var(--bg)">Handle completion</text>
  </g>
  <g transform="translate(500, 50)">
    <rect x="386.0317" y="80" width="507.9365" height="142.8571" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
    <text x="640" y="169.2857" text-anchor="middle" font-size="50">I/O Multiplexing</text>
    <rect x="422.313" y="294.2857" width="435.3742" height="71.4286" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="640" y="347.8571" text-anchor="middle" font-size="39.2857">select/poll/epoll</text>
    <rect x="422.313" y="401.4286" width="435.3742" height="71.4286" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="640" y="455" text-anchor="middle" font-size="39.2857" fill="var(--bg)">Monitor multiple FDs</text>
    <rect x="422.313" y="508.5714" width="435.3742" height="71.4286" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="640" y="562.1429" text-anchor="middle" font-size="39.2857" fill="var(--bg)">Process ready FDs</text>
  </g>
</svg>
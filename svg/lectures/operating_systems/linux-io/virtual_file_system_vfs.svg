<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="102.353" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="99.7058" text-anchor="middle" font-size="29.7377" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">User Applications</text>
  <rect x="40" y="176.4706" width="1200" height="68.2353" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="219.1176" text-anchor="middle" font-size="26.0204" font-family="Arial, sans-serif" fill="var(--warn-text)">System Call Interface</text>
  <rect x="40" y="278.8236" width="1200" height="102.353" fill="url(#grad-info)" stroke="var(--info-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="338.5294" text-anchor="middle" font-size="29.7377" font-weight="bold" font-family="Arial, sans-serif" fill="var(--info-text)">Virtual File System (VFS)</text>
  <rect x="88" y="415.2941" width="240" height="85.2941" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="208" y="466.4706" text-anchor="middle" font-size="22.3033" font-family="Arial, sans-serif" fill="var(--ok-text)">ext4</text>
  <rect x="376" y="415.2941" width="240" height="85.2941" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="496" y="466.4706" text-anchor="middle" font-size="22.3033" font-family="Arial, sans-serif" fill="var(--ok-text)">XFS</text>
  <rect x="663.9999" y="415.2941" width="240" height="85.2941" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="783.9999" y="466.4706" text-anchor="middle" font-size="22.3033" font-family="Arial, sans-serif" fill="var(--ok-text)">Btrfs</text>
  <rect x="951.9999" y="415.2941" width="240" height="85.2941" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1071.9999" y="466.4706" text-anchor="middle" font-size="22.3033" font-family="Arial, sans-serif" fill="var(--ok-text)">Device Files</text>
  <rect x="40" y="534.7059" width="1200" height="85.2941" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="6" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="585.8823" text-anchor="middle" font-size="26.0204" font-family="Arial, sans-serif" fill="var(--danger-text)">Hardware Devices (Disks, Network, etc.)</text>
  <path d="M 639.9999 142.353 L 639.9999 176.4706" stroke="var(--black)" stroke-width="3.4595" marker-end="url(#arrow)" />
  <path d="M 639.9999 244.7059 L 639.9999 278.8236" stroke="var(--black)" stroke-width="3.4595" marker-end="url(#arrow)" />
  <path d="M 639.9999 381.1764 L 639.9999 415.2941" stroke="var(--black)" stroke-width="3.4595" marker-end="url(#arrow)" />
  <path d="M 639.9999 500.5882 L 639.9999 534.7059" stroke="var(--black)" stroke-width="3.4595" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
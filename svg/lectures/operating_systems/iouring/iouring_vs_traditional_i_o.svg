<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#28a745" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="612.6496" y="49.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0644" font-weight="bold" fill="var(--text)">Traditional I/O vs io_uring</text>
  <text x="302.721" y="106.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1814" font-weight="bold" fill="var(--danger-accent)">Traditional I/O (Blocking)</text>
  <rect x="86.4917" y="131.2821" width="187.3987" height="73.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="180.1911" y="175.5898" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" fill="var(--text)">Application</text>
  <line x1="273.8904" y1="167.3846" x2="338.7592" y2="167.3846" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="307.0455" y="152.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4153" fill="var(--danger-accent)">syscall</text>
  <rect x="345.9669" y="131.2821" width="187.3987" height="73.8462" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="439.6662" y="175.5898" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" fill="var(--text)">read() / write()</text>
  <line x1="439.6662" y1="205.1282" x2="439.6662" y2="287.1795" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="468.4968" y="254.359" font-family="Arial, sans-serif" font-size="14.4153" fill="var(--danger-accent)">wait</text>
  <rect x="345.9669" y="295.3846" width="187.3987" height="73.8462" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="439.6662" y="339.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" fill="var(--text)">Kernel</text>
  <path d="M 345.9669 331.4872 Q 43.2459 331.4872 43.2459 167.3846 L 79.284 167.3846" fill="none" stroke="var(--primary-border)" stroke-width="2.8831" marker-end="url(#arrow)" />
  <text x="28.8305" y="254.359" font-family="Arial, sans-serif" font-size="14.4153" fill="var(--primary-accent)">data</text>
  <rect x="144.1528" y="426.6667" width="360.3821" height="49.2308" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5.7661 4.3245" />
  <text x="324.3439" y="459.4872" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8568" fill="var(--danger-accent)">Thread blocked during each I/O operation</text>
  <line x1="612.6496" y1="90.2564" x2="612.6496" y2="640" stroke="var(--border)" stroke-width="2" stroke-dasharray="8.6492 5.7661" />
  <text x="922.5782" y="106.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1814" font-weight="bold" fill="var(--ok-accent)">io_uring (Async, Batched)</text>
  <rect x="677.5184" y="131.2821" width="187.3987" height="73.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="771.2178" y="175.5898" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" fill="var(--text)">Application</text>
  <line x1="864.9171" y1="167.3846" x2="929.7858" y2="167.3846" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="898.0722" y="152.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4153" fill="var(--ok-accent)">submit</text>
  <rect x="936.9935" y="131.2821" width="216.2293" height="73.8462" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1045.1081" y="164.1026" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text)">Submission</text>
  <text x="1045.1081" y="188.718" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text)">Queue (SQ)</text>
  <line x1="1045.1081" y1="205.1282" x2="1045.1081" y2="287.1795" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="1078.2633" y="254.359" font-family="Arial, sans-serif" font-size="14.4153" fill="var(--ok-accent)">batch</text>
  <rect x="951.4088" y="295.3846" width="187.3987" height="73.8462" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1045.1081" y="339.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" fill="var(--text)">Kernel</text>
  <line x1="951.4088" y1="331.4872" x2="879.3323" y2="331.4872" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="663.1031" y="295.3846" width="216.2293" height="73.8462" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="771.2178" y="328.2051" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text)">Completion</text>
  <text x="771.2178" y="352.8205" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text)">Queue (CQ)</text>
  <line x1="771.2178" y1="295.3846" x2="771.2178" y2="213.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="800.0483" y="262.5641" font-family="Arial, sans-serif" font-size="14.4153" fill="var(--primary-accent)">poll</text>
  <rect x="706.349" y="426.6667" width="403.628" height="49.2308" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5.7661 4.3245" />
  <text x="908.163" y="459.4872" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8568" fill="var(--ok-accent)">App continues working; no blocking needed</text>
  <rect x="72.0764" y="525.1282" width="1081.1464" height="106.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="612.6496" y="566.1539" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" font-weight="bold" fill="var(--text)">Key Advantages of io_uring</text>
  <text x="288.3057" y="607.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text-muted)">No per-op syscall overhead</text>
  <text x="612.6496" y="607.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text-muted)">Batched submissions</text>
  <text x="936.9935" y="607.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text-muted)">Shared memory rings</text>
</svg>
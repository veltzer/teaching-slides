<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="663.0769" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6091" font-weight="bold" fill="var(--text)">Traditional I/O vs io_uring</text>
  <text x="332.3078" y="96.3889" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.658" font-weight="bold" fill="var(--danger-accent)">Traditional I/O (Blocking)</text>
  <rect x="101.5385" y="120.5556" width="200" height="72.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="201.5386" y="164.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1824" fill="var(--text)">Application</text>
  <line x1="301.5385" y1="156" x2="370.7693" y2="156" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="336.9231" y="141.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7557" fill="var(--danger-accent)">syscall</text>
  <rect x="378.4617" y="120.5556" width="200" height="72.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="478.4616" y="164.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1824" fill="var(--text)">read() / write()</text>
  <line x1="478.4616" y1="193.0555" x2="478.4616" y2="273.6111" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="509.2309" y="241.3889" font-family="Arial, sans-serif" font-size="14.7557" fill="var(--danger-accent)">wait</text>
  <rect x="378.4617" y="281.6666" width="200" height="72.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="478.4616" y="325.1666" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1824" fill="var(--text)">Kernel</text>
  <path d="M 378.4617 317.1111 Q 55.3847 317.1111 55.3847 156 L 93.8462 156" fill="none" stroke="var(--primary-border)" stroke-width="2.8831" marker-end="url(#arrow)"/>
  <text x="40" y="241.3889" font-family="Arial, sans-serif" font-size="14.7557" fill="var(--primary-accent)">data</text>
  <rect x="163.0769" y="410.5556" width="384.6153" height="48.3334" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5.7661 4.3245" filter="url(#shadow)"/>
  <text x="355.3847" y="442.7778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2313" fill="var(--danger-accent)">Thread blocked during each I/O operation</text>
  <line x1="663.0769" y1="80.2777" x2="663.0769" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="8.6492 5.7661"/>
  <text x="993.8461" y="96.3889" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.658" font-weight="bold" fill="var(--ok-accent)">io_uring (Async, Batched)</text>
  <rect x="732.3077" y="120.5556" width="200" height="72.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.3078" y="164.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1824" fill="var(--text)">Application</text>
  <line x1="932.3077" y1="156" x2="1001.5384" y2="156" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="967.6923" y="141.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7557" fill="var(--ok-accent)">submit</text>
  <rect x="1009.2308" y="120.5556" width="230.7692" height="72.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.6153" y="152.7778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7069" fill="var(--text)">Submission</text>
  <text x="1124.6153" y="176.9445" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7069" fill="var(--text)">Queue (SQ)</text>
  <line x1="1124.6153" y1="193.0555" x2="1124.6153" y2="273.6111" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="1160" y="241.3889" font-family="Arial, sans-serif" font-size="14.7557" fill="var(--ok-accent)">batch</text>
  <rect x="1024.6154" y="281.6666" width="200" height="72.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.6153" y="325.1666" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1824" fill="var(--text)">Kernel</text>
  <line x1="1024.6154" y1="317.1111" x2="947.6922" y2="317.1111" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="716.9231" y="281.6666" width="230.7692" height="72.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.3078" y="313.8888" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7069" fill="var(--text)">Completion</text>
  <text x="832.3078" y="338.0555" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7069" fill="var(--text)">Queue (CQ)</text>
  <line x1="832.3078" y1="281.6666" x2="832.3078" y2="201.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="863.0769" y="249.4444" font-family="Arial, sans-serif" font-size="14.7557" fill="var(--primary-accent)">poll</text>
  <rect x="763.077" y="410.5556" width="430.7692" height="48.3334" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5.7661 4.3245" filter="url(#shadow)"/>
  <text x="978.4616" y="442.7778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2313" fill="var(--ok-accent)">App continues working; no blocking needed</text>
  <rect x="86.1539" y="507.2222" width="1153.8461" height="104.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="663.0769" y="547.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1824" font-weight="bold" fill="var(--text)">Key Advantages of io_uring</text>
  <text x="316.9231" y="587.7778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7069" fill="var(--text-muted)">No per-op syscall overhead</text>
  <text x="663.0769" y="587.7778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7069" fill="var(--text-muted)">Batched submissions</text>
  <text x="1009.2308" y="587.7778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7069" fill="var(--text-muted)">Shared memory rings</text>
</svg>

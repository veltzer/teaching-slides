<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="15.0588" markerHeight="12" refX="15.0588" refY="6" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowgreen" markerWidth="15.0588" markerHeight="12" refX="15.0588" refY="6" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#28a745" />
    </marker>
    <marker id="arrowred" markerWidth="15.0588" markerHeight="12" refX="15.0588" refY="6" orient="auto">
      <polygon points="0,17.1429 5.2706,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="612.6496" y="49.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0644" font-weight="bold" fill="var(--text-dark)">Traditional I/O vs io_uring</text>
  <text x="302.721" y="106.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1814" font-weight="bold" fill="var(--danger-bright)">Traditional I/O (Blocking)</text>
  <rect x="86.4917" y="131.2821" width="187.3987" height="73.8462" rx="7.2076" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8831" />
  <text x="180.1911" y="175.5898" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" fill="var(--text-dark)">Application</text>
  <line x1="273.8904" y1="167.3846" x2="338.7592" y2="167.3846" stroke="var(--danger-bright)" stroke-width="2.8831" marker-end="url(#arrow-danger)" />
  <text x="307.0455" y="152.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4153" fill="var(--danger-bright)">syscall</text>
  <rect x="345.9669" y="131.2821" width="187.3987" height="73.8462" rx="7.2076" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.8831" />
  <text x="439.6662" y="175.5898" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" fill="var(--text-dark)">read() / write()</text>
  <line x1="439.6662" y1="205.1282" x2="439.6662" y2="287.1795" stroke="var(--danger-bright)" stroke-width="2.8831" marker-end="url(#arrow-danger)" />
  <text x="468.4968" y="254.359" font-family="Arial, sans-serif" font-size="14.4153" fill="var(--danger-bright)">wait</text>
  <rect x="345.9669" y="295.3846" width="187.3987" height="73.8462" rx="7.2076" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8831" />
  <text x="439.6662" y="339.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" fill="var(--text-dark)">Kernel</text>
  <path d="M 345.9669 331.4872 Q 43.2459 331.4872 43.2459 167.3846 L 79.284 167.3846" fill="none" stroke="var(--primary-bright)" stroke-width="2.8831" marker-end="url(#arrow)" />
  <text x="28.8305" y="254.359" font-family="Arial, sans-serif" font-size="14.4153" fill="var(--primary-bright)">data</text>
  <rect x="144.1528" y="426.6667" width="360.3821" height="49.2308" rx="7.2076" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.4415" stroke-dasharray="5.7661 4.3245" />
  <text x="324.3439" y="459.4872" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8568" fill="var(--danger-bright)">Thread blocked during each I/O operation</text>
  <line x1="612.6496" y1="90.2564" x2="612.6496" y2="640" stroke="var(--border-faint)" stroke-width="2.8831" stroke-dasharray="8.6492 5.7661" />
  <text x="922.5782" y="106.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1814" font-weight="bold" fill="var(--ok-bright)">io_uring (Async, Batched)</text>
  <rect x="677.5184" y="131.2821" width="187.3987" height="73.8462" rx="7.2076" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8831" />
  <text x="771.2178" y="175.5898" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" fill="var(--text-dark)">Application</text>
  <line x1="864.9171" y1="167.3846" x2="929.7858" y2="167.3846" stroke="var(--ok-bright)" stroke-width="2.8831" marker-end="url(#arrow-ok)" />
  <text x="898.0722" y="152.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4153" fill="var(--ok-bright)">submit</text>
  <rect x="936.9935" y="131.2821" width="216.2293" height="73.8462" rx="7.2076" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8831" />
  <text x="1045.1081" y="164.1026" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text-dark)">Submission</text>
  <text x="1045.1081" y="188.718" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text-dark)">Queue (SQ)</text>
  <line x1="1045.1081" y1="205.1282" x2="1045.1081" y2="287.1795" stroke="var(--ok-bright)" stroke-width="2.8831" marker-end="url(#arrow-ok)" />
  <text x="1078.2633" y="254.359" font-family="Arial, sans-serif" font-size="14.4153" fill="var(--ok-bright)">batch</text>
  <rect x="951.4088" y="295.3846" width="187.3987" height="73.8462" rx="7.2076" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8831" />
  <text x="1045.1081" y="339.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" fill="var(--text-dark)">Kernel</text>
  <line x1="951.4088" y1="331.4872" x2="879.3323" y2="331.4872" stroke="var(--ok-bright)" stroke-width="2.8831" marker-end="url(#arrow-ok)" />
  <rect x="663.1031" y="295.3846" width="216.2293" height="73.8462" rx="7.2076" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8831" />
  <text x="771.2178" y="328.2051" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text-dark)">Completion</text>
  <text x="771.2178" y="352.8205" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text-dark)">Queue (CQ)</text>
  <line x1="771.2178" y1="295.3846" x2="771.2178" y2="213.3333" stroke="var(--primary-bright)" stroke-width="2.8831" marker-end="url(#arrow)" />
  <text x="800.0483" y="262.5641" font-family="Arial, sans-serif" font-size="14.4153" fill="var(--primary-bright)">poll</text>
  <rect x="706.349" y="426.6667" width="403.628" height="49.2308" rx="7.2076" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4415" stroke-dasharray="5.7661 4.3245" />
  <text x="908.163" y="459.4872" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8568" fill="var(--ok-bright)">App continues working; no blocking needed</text>
  <rect x="72.0764" y="525.1282" width="1081.1464" height="106.6667" rx="11.5323" fill="var(--surface-light)" stroke="var(--border)" stroke-width="1.4415" />
  <text x="612.6496" y="566.1539" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" font-weight="bold" fill="var(--text-dark)">Key Advantages of io_uring</text>
  <text x="288.3057" y="607.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text-muted)">No per-op syscall overhead</text>
  <text x="612.6496" y="607.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text-muted)">Batched submissions</text>
  <text x="936.9935" y="607.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2984" fill="var(--text-muted)">Shared memory rings</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="#333">epoll vs io_uring Comparison</text>
  <rect x="80" y="108" width="240" height="90" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="200" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">epoll</text>
  <rect x="448" y="99" width="320" height="64.8" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="608" y="140.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">Network I/O Only</text>
  <line x1="320" y1="135" x2="440" y2="131.4" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <rect x="448" y="189" width="320" height="64.8" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="608" y="230.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">Level/Edge Triggered</text>
  <line x1="320" y1="153" x2="440" y2="212.4" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <rect x="448" y="279" width="320" height="64.8" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="608" y="320.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">System Call Per Operation</text>
  <line x1="320" y1="171" x2="440" y2="302.4" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <line x1="80" y1="396" x2="1200" y2="396" stroke="#ccc" stroke-width="1.6" stroke-dasharray="8 8" />
  <rect x="80" y="450" width="240" height="90" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="200" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">io_uring</text>
  <rect x="448" y="432" width="320" height="64.8" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="608" y="473.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">All I/O Types (Universal)</text>
  <line x1="320" y1="477" x2="440" y2="464.4" stroke="#28a745" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <rect x="448" y="522" width="320" height="64.8" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="608" y="563.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">Ring Buffer (Efficient)</text>
  <line x1="320" y1="495" x2="440" y2="549" stroke="#28a745" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <rect x="448" y="612" width="320" height="64.8" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="608" y="653.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">Batching (High Perf)</text>
  <line x1="320" y1="513" x2="440" y2="639" stroke="#28a745" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <text x="848" y="140.4" font-family="Arial, sans-serif" font-size="19.2" fill="#ffc107" font-weight="bold">Limited Scope</text>
  <text x="848" y="230.4" font-family="Arial, sans-serif" font-size="19.2" fill="#4a90e2" font-weight="bold">Flexibility</text>
  <text x="848" y="320.4" font-family="Arial, sans-serif" font-size="19.2" fill="#dc3545" font-weight="bold">Overhead</text>
  <text x="848" y="473.4" font-family="Arial, sans-serif" font-size="19.2" fill="#28a745" font-weight="bold">Universal</text>
  <text x="848" y="563.4" font-family="Arial, sans-serif" font-size="19.2" fill="#28a745" font-weight="bold">Efficient</text>
  <text x="848" y="653.4" font-family="Arial, sans-serif" font-size="19.2" fill="#28a745" font-weight="bold">Performance</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="605.2009" y="51.0638" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.208" font-weight="bold" fill="var(--text)">epoll vs io_uring Comparison</text>
  <rect x="75.6501" y="102.1277" width="226.9504" height="85.1064" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="189.1253" y="153.1915" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695" font-weight="bold" fill="var(--text)">epoll</text>
  <rect x="423.6407" y="93.617" width="302.6005" height="61.2766" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="574.9409" y="132.766" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.156" fill="var(--text)">Network I/O Only</text>
  <line x1="302.6005" y1="127.6596" x2="416.0757" y2="124.2553" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="423.6407" y="178.7234" width="302.6005" height="61.2766" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="574.9409" y="217.8723" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.156" fill="var(--text)">Level/Edge Triggered</text>
  <line x1="302.6005" y1="144.6809" x2="416.0757" y2="200.8511" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="423.6407" y="263.8298" width="302.6005" height="61.2766" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="574.9409" y="302.9787" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.156" fill="var(--text)">System Call Per Operation</text>
  <line x1="302.6005" y1="161.7021" x2="416.0757" y2="285.9574" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="75.6501" y1="374.4681" x2="1134.7518" y2="374.4681" stroke="var(--border)" stroke-width="1.513" stroke-dasharray="7.565 7.565" />
  <rect x="75.6501" y="425.5319" width="226.9504" height="85.1064" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="189.1253" y="476.5957" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695" font-weight="bold" fill="var(--text)">io_uring</text>
  <rect x="423.6407" y="408.5106" width="302.6005" height="61.2766" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="574.9409" y="447.6596" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.156" fill="var(--text)">All I/O Types (Universal)</text>
  <line x1="302.6005" y1="451.0638" x2="416.0757" y2="439.1489" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="423.6407" y="493.617" width="302.6005" height="61.2766" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="574.9409" y="532.766" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.156" fill="var(--text)">Ring Buffer (Efficient)</text>
  <line x1="302.6005" y1="468.0851" x2="416.0757" y2="519.1489" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="423.6407" y="578.7234" width="302.6005" height="61.2766" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="574.9409" y="617.8723" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.156" fill="var(--text)">Batching (High Perf)</text>
  <line x1="302.6005" y1="485.1064" x2="416.0757" y2="604.2553" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="801.8913" y="132.766" font-family="Arial, sans-serif" font-size="18.156" fill="var(--warn-accent)" font-weight="bold">Limited Scope</text>
  <text x="801.8913" y="217.8723" font-family="Arial, sans-serif" font-size="18.156" fill="var(--primary-accent)" font-weight="bold">Flexibility</text>
  <text x="801.8913" y="302.9787" font-family="Arial, sans-serif" font-size="18.156" fill="var(--danger-accent)" font-weight="bold">Overhead</text>
  <text x="801.8913" y="447.6596" font-family="Arial, sans-serif" font-size="18.156" fill="var(--ok-accent)" font-weight="bold">Universal</text>
  <text x="801.8913" y="532.766" font-family="Arial, sans-serif" font-size="18.156" fill="var(--ok-accent)" font-weight="bold">Efficient</text>
  <text x="801.8913" y="617.8723" font-family="Arial, sans-serif" font-size="18.156" fill="var(--ok-accent)" font-weight="bold">Performance</text>
</svg>
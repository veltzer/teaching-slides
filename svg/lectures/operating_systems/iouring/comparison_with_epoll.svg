<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.5718" font-weight="bold" fill="var(--text)">epoll vs io_uring Comparison</text>
  <rect x="40" y="90.2891" width="257.1429" height="83.815" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.5714" y="140.5781" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9735" font-weight="bold" fill="var(--text)">epoll</text>
  <rect x="434.2858" y="81.9075" width="342.8572" height="60.3468" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="605.7143" y="120.4625" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1788" fill="var(--text)">Network I/O Only</text>
  <line x1="297.1429" y1="115.4336" x2="425.7143" y2="112.0809" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="434.2858" y="165.7226" width="342.8572" height="60.3468" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="605.7143" y="204.2774" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1788" fill="var(--text)">Level/Edge Triggered</text>
  <line x1="297.1429" y1="132.1966" x2="425.7143" y2="187.5145" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="434.2858" y="249.5376" width="342.8572" height="60.3468" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="605.7143" y="288.0925" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1788" fill="var(--text)">System Call Per Operation</text>
  <line x1="297.1429" y1="148.9595" x2="425.7143" y2="271.3295" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="40" y1="358.4971" x2="1240" y2="358.4971" stroke="var(--border)" stroke-width="1.513" stroke-dasharray="7.565 7.565"/>
  <rect x="40" y="408.7861" width="257.1429" height="83.815" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.5714" y="459.0751" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9735" font-weight="bold" fill="var(--text)">io_uring</text>
  <rect x="434.2858" y="392.0231" width="342.8572" height="60.3468" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="605.7143" y="430.5781" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1788" fill="var(--text)">All I/O Types (Universal)</text>
  <line x1="297.1429" y1="433.9306" x2="425.7143" y2="422.1965" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="434.2858" y="475.8381" width="342.8572" height="60.3468" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="605.7143" y="514.3931" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1788" fill="var(--text)">Ring Buffer (Efficient)</text>
  <line x1="297.1429" y1="450.6936" x2="425.7143" y2="500.9826" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="434.2858" y="559.6532" width="342.8572" height="60.3468" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="605.7143" y="598.2081" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1788" fill="var(--text)">Batching (High Perf)</text>
  <line x1="297.1429" y1="467.4567" x2="425.7143" y2="584.7977" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="862.8572" y="120.4625" font-family="Arial, sans-serif" font-size="19.1788" fill="var(--warn-accent)" font-weight="bold">Limited Scope</text>
  <text x="862.8572" y="204.2774" font-family="Arial, sans-serif" font-size="19.1788" fill="var(--primary-accent)" font-weight="bold">Flexibility</text>
  <text x="862.8572" y="288.0925" font-family="Arial, sans-serif" font-size="19.1788" fill="var(--danger-accent)" font-weight="bold">Overhead</text>
  <text x="862.8572" y="430.5781" font-family="Arial, sans-serif" font-size="19.1788" fill="var(--ok-accent)" font-weight="bold">Universal</text>
  <text x="862.8572" y="514.3931" font-family="Arial, sans-serif" font-size="19.1788" fill="var(--ok-accent)" font-weight="bold">Efficient</text>
  <text x="862.8572" y="598.2081" font-family="Arial, sans-serif" font-size="19.1788" fill="var(--ok-accent)" font-weight="bold">Performance</text>
</svg>

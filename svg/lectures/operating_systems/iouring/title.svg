<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Two rings representing the submission and completion queues -->
  <g transform="translate(300,155)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#e94560" stroke-width="4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#e94560" stroke-width="2" opacity="0.4"/>
    <text x="0" y="-5" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Submission</text>
    <text x="0" y="12" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Queue</text>
    <!-- Entry dots on ring -->
    <circle cx="0" cy="-70" r="5" fill="#e94560"/>
    <circle cx="60" cy="-35" r="5" fill="#e94560"/>
    <circle cx="60" cy="35" r="5" fill="#e94560"/>
    <circle cx="-60" cy="-35" r="5" fill="#e94560"/>
    <circle cx="-60" cy="35" r="5" fill="#e94560"/>
  </g>
  <g transform="translate(530,155)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#00d2ff" stroke-width="4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00d2ff" stroke-width="2" opacity="0.4"/>
    <text x="0" y="-5" text-anchor="middle" fill="#00d2ff" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Completion</text>
    <text x="0" y="12" text-anchor="middle" fill="#00d2ff" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Queue</text>
    <!-- Entry dots on ring -->
    <circle cx="0" cy="-70" r="5" fill="#00d2ff"/>
    <circle cx="60" cy="-35" r="5" fill="#00d2ff"/>
    <circle cx="60" cy="35" r="5" fill="#00d2ff"/>
    <circle cx="-60" cy="-35" r="5" fill="#00d2ff"/>
  </g>
  <!-- Shared memory arrow -->
  <path d="M370,155 L460,155" stroke="#888" stroke-width="2" stroke-dasharray="6"/>
  <text x="415" y="145" text-anchor="middle" fill="#666" font-family="Arial,sans-serif" font-size="10">shared</text>
  <!-- Kernel label -->
  <rect x="350" y="60" width="130" height="25" rx="5" fill="none" stroke="#533483" stroke-width="1.5"/>
  <text x="415" y="77" text-anchor="middle" fill="#533483" font-family="Arial,sans-serif" font-size="12">Linux Kernel 5.1+</text>
  <!-- Title -->
  <text x="400" y="300" text-anchor="middle" fill="#eee" font-family="Arial,sans-serif" font-size="32" font-weight="bold">io_uring</text>
  <text x="400" y="335" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="16">High-Performance Asynchronous I/O for Linux</text>
</svg>

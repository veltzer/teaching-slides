<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <g transform="translate(138.7,83.9)">
  <g transform="translate(300,155)">
    <circle cx="40" cy="40" r="97.3311" fill="none" stroke="var(--danger-border)" stroke-width="5.5652"/>
    <circle cx="40" cy="40" r="69.5221" fill="none" stroke="var(--danger-border)" stroke-width="2.7826" opacity="0.4"/>
    <text x="40" y="32.7501" text-anchor="middle" fill="var(--danger-accent)" font-size="18.0758" font-weight="bold" font-family="Arial, sans-serif">Submission</text>
    <text x="40" y="57.4001" text-anchor="middle" fill="var(--danger-accent)" font-size="18.0758" font-weight="bold" font-family="Arial, sans-serif">Queue</text>
    <circle cx="40" cy="-61.5" r="6.9522" fill="var(--danger-fill)"/>
    <circle cx="130.0001" cy="-10.75" r="6.9522" fill="var(--danger-fill)"/>
    <circle cx="130.0001" cy="90.75" r="6.9522" fill="var(--danger-fill)"/>
    <circle cx="-50" cy="-10.75" r="6.9522" fill="var(--danger-fill)"/>
    <circle cx="-50" cy="90.75" r="6.9522" fill="var(--danger-fill)"/>
  </g>
  <g transform="translate(530,155)">
    <circle cx="40" cy="40" r="97.3311" fill="none" stroke="var(--primary-border)" stroke-width="5.5652"/>
    <circle cx="40" cy="40" r="69.5221" fill="none" stroke="var(--primary-border)" stroke-width="2.7826" opacity="0.4"/>
    <text x="40" y="32.7501" text-anchor="middle" fill="var(--primary-accent)" font-size="18.0758" font-weight="bold" font-family="Arial, sans-serif">Completion</text>
    <text x="40" y="57.4001" text-anchor="middle" fill="var(--primary-accent)" font-size="18.0758" font-weight="bold" font-family="Arial, sans-serif">Queue</text>
    <circle cx="40" cy="-61.5" r="6.9522" fill="var(--primary-fill)"/>
    <circle cx="130.0001" cy="-10.75" r="6.9522" fill="var(--primary-fill)"/>
    <circle cx="130.0001" cy="90.75" r="6.9522" fill="var(--primary-fill)"/>
    <circle cx="-50" cy="-10.75" r="6.9522" fill="var(--primary-fill)"/>
  </g>
  <path d="M 595 264.75 L 730 264.75" stroke="var(--text-faint)" stroke-width="2.7826" stroke-dasharray="8.3478"/>
  <text x="662.5" y="250.25" text-anchor="middle" fill="var(--text-muted)" font-size="13.9043" font-family="Arial, sans-serif">shared</text>
  <rect x="565" y="127" width="195" height="36.2499" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <text x="662.5" y="151.65" text-anchor="middle" fill="var(--info-accent)" font-size="16.6854" font-family="Arial, sans-serif">Linux Kernel 5.1+</text>
  </g>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">io_uring</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Async I/O for the Modern Kernel</text>
</svg>

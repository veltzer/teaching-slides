<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1113.0435" height="626.087" fill="url(#bg)" rx="6"/>
  <g transform="translate(300,155)">
    <circle cx="0" cy="0" r="97.3913" fill="none" stroke="var(--danger-border)" stroke-width="5.5652" />
    <circle cx="0" cy="0" r="69.5652" fill="none" stroke="var(--danger-border)" stroke-width="2.7826" opacity="0.4" />
    <text x="0" y="-7.8261" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial,sans-serif" font-size="18.087" font-weight="bold">Submission</text>
    <text x="0" y="18.7826" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial,sans-serif" font-size="18.087" font-weight="bold">Queue</text>
    <circle cx="0" cy="-109.5652" r="6.9565" fill="var(--danger-fill)" />
    <circle cx="83.4783" cy="-54.7826" r="6.9565" fill="var(--danger-fill)" />
    <circle cx="83.4783" cy="54.7826" r="6.9565" fill="var(--danger-fill)" />
    <circle cx="-83.4783" cy="-54.7826" r="6.9565" fill="var(--danger-fill)" />
    <circle cx="-83.4783" cy="54.7826" r="6.9565" fill="var(--danger-fill)" />
  </g>
  <g transform="translate(530,155)">
    <circle cx="0" cy="0" r="97.3913" fill="none" stroke="var(--primary-border)" stroke-width="5.5652" />
    <circle cx="0" cy="0" r="69.5652" fill="none" stroke="var(--primary-border)" stroke-width="2.7826" opacity="0.4" />
    <text x="0" y="-7.8261" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="18.087" font-weight="bold">Completion</text>
    <text x="0" y="18.7826" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="18.087" font-weight="bold">Queue</text>
    <circle cx="0" cy="-109.5652" r="6.9565" fill="var(--primary-fill)" />
    <circle cx="83.4783" cy="-54.7826" r="6.9565" fill="var(--primary-fill)" />
    <circle cx="83.4783" cy="54.7826" r="6.9565" fill="var(--primary-fill)" />
    <circle cx="-83.4783" cy="-54.7826" r="6.9565" fill="var(--primary-fill)" />
  </g>
  <path d="M 514.7826 242.6087 L 640 242.6087" stroke="var(--text-faint)" stroke-width="2.7826" stroke-dasharray="8.3478" />
  <text x="577.3913" y="226.9565" text-anchor="middle" fill="var(--text-muted)" font-family="Arial,sans-serif" font-size="13.913">shared</text>
  <rect x="486.9565" y="93.913" width="180.8696" height="39.1304" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="577.3913" y="120.5217" text-anchor="middle" fill="var(--info-accent)" font-family="Arial,sans-serif" font-size="16.6957">Linux Kernel 5.1+</text>
  <text x="556.5217" y="469.5652" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="44.5217" font-weight="bold">io_uring</text>
  <text x="556.5217" y="524.3478" text-anchor="middle" fill="var(--text-faint)" font-family="Arial,sans-serif" font-size="22.2609">High-Performance Asynchronous I/O for Linux</text>
</svg>
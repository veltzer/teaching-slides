<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="585.454545" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.272282" font-weight="bold" fill="var(--text)">Relative throughput (higher is better)</text>

  <rect x="40" y="477.959184" width="240" height="142.040816" rx="6.818071" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="160" y="566.734694" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.544972" font-weight="bold" fill="var(--ok-text)">epoll</text>
  <text x="160" y="454.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.999592" font-weight="bold" fill="var(--ok-accent)">1.0x</text>

  <rect x="356.363636" y="335.918367" width="240" height="284.081633" rx="6.818071" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="476.363636" y="495.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.544972" font-weight="bold" fill="var(--primary-text)">aio</text>
  <text x="476.363636" y="312.244898" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.999592" font-weight="bold" fill="var(--primary-accent)">1.5x</text>

  <rect x="672.727273" y="99.183673" width="240" height="520.816327" rx="6.818071" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="792.727273" y="371.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.544972" font-weight="bold" fill="var(--warn-text)">io_uring</text>
  <text x="792.727273" y="75.510204" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.999592" font-weight="bold" fill="var(--warn-accent)">2.8x</text>

  <rect x="978.181818" y="170.204082" width="261.818182" height="449.795918" rx="6.818071" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1109.090909" y="217.55102" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.454212" font-weight="bold" fill="var(--text)">Why it wins</text>
  <text x="1109.090909" y="276.734694" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.908831" fill="var(--text-muted)">zero-syscall hot path</text>
  <text x="1109.090909" y="324.081633" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.908831" fill="var(--text-muted)">batched submissions</text>
  <text x="1109.090909" y="371.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.908831" fill="var(--text-muted)">shared-memory rings</text>
  <text x="1109.090909" y="418.77551" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.908831" fill="var(--text-muted)">kernel polls async</text>
  <text x="1109.090909" y="477.959184" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.908831" font-weight="bold" fill="var(--warn-accent)">Linux 5.1+</text>
</svg>

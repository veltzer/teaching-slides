<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#0d1117" />
      <stop offset="100%" style="stop-color:#161b22" />
    </linearGradient>
  </defs>
  <rect width="682.6667" height="384" fill="url(#bg)" rx="6"/>
  <g opacity="0.1" stroke="var(--primary-border)" stroke-width="0.8533">
    <path d="M 42.6667 96 L 170.6667 96 L 170.6667 48" />
    <path d="M 42.6667 192 L 128 192 L 128 288 L 213.3333 288" />
    <path d="M 512 48 L 512 144 L 597.3333 144" />
    <path d="M 469.3333 288 L 554.6667 288 L 554.6667 336 L 640 336" />
    <path d="M 256 48 L 256 96 L 341.3333 96" />
    <path d="M 426.6667 336 L 426.6667 288 L 384 288" />
  </g>
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="153.6" height="115.2" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.7" />
    <text x="76.8" y="24" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="11.0933" opacity="0.8">Guest VM</text>
    <rect x="25.6" y="43.2" width="34.1333" height="38.4" rx="6" fill="var(--primary-fill)" opacity="0.2" stroke="var(--primary-border)" stroke-width="2" />
    <rect x="34.1333" y="52.8" width="17.0667" height="19.2" rx="6" fill="var(--primary-fill)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="93.8667" y="43.2" width="34.1333" height="38.4" rx="6" fill="var(--primary-fill)" opacity="0.2" stroke="var(--primary-border)" stroke-width="2" />
    <circle cx="110.9333" cy="62.4" r="8.5333" fill="none" stroke="var(--primary-border)" stroke-width="1.28" opacity="0.4" />
    <circle cx="110.9333" cy="62.4" r="2.56" fill="var(--primary-fill)" opacity="0.4" />
  </g>
  <g transform="translate(320, 100)">
    <ellipse cx="68.2667" cy="48" rx="51.2" ry="21.3333" fill="none" stroke="var(--warn-border)" stroke-width="1.7067" opacity="0.6" />
    <ellipse cx="68.2667" cy="67.2" rx="51.2" ry="21.3333" fill="none" stroke="var(--warn-border)" stroke-width="1.7067" opacity="0.4" />
    <ellipse cx="68.2667" cy="86.4" rx="51.2" ry="21.3333" fill="none" stroke="var(--warn-border)" stroke-width="1.7067" opacity="0.3" />
    <rect x="38.4" y="36.48" width="10.24" height="7.68" rx="6" fill="var(--warn-fill)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="52.9067" y="28.8" width="10.24" height="7.68" rx="6" fill="var(--warn-fill)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="69.9733" y="26.88" width="10.24" height="7.68" rx="6" fill="var(--warn-fill)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="87.04" y="30.72" width="10.24" height="7.68" rx="6" fill="var(--warn-fill)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
    <line x1="-17.0667" y1="57.6" x2="8.5333" y2="57.6" stroke="var(--ok-border)" stroke-width="1.7067" marker-end="url(#arrowG)" />
    <line x1="128" y1="57.6" x2="149.3333" y2="57.6" stroke="var(--ok-border)" stroke-width="1.7067" marker-end="url(#arrowG)" />
    <text x="68.2667" y="124.8" text-anchor="middle" fill="var(--warn-accent)" font-family="monospace" font-size="10.24" opacity="0.7">virtqueue</text>
  </g>
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 12.8,5.4 0,10.8" fill="var(--ok-vivid)" />
    </marker>
  </defs>
  <g transform="translate(530, 80)">
    <rect x="0" y="0" width="153.6" height="115.2" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.7" />
    <text x="76.8" y="24" text-anchor="middle" fill="var(--ok-accent)" font-family="monospace" font-size="11.0933" opacity="0.8">Host / HV</text>
    <circle cx="42.6667" cy="67.2" r="12.8" fill="none" stroke="var(--ok-border)" stroke-width="1.28" opacity="0.4" />
    <ellipse cx="42.6667" cy="67.2" rx="12.8" ry="5.12" fill="none" stroke="var(--ok-border)" stroke-width="0.8533" opacity="0.3" />
    <line x1="42.6667" y1="52.8" x2="42.6667" y2="81.6" stroke="var(--ok-border)" stroke-width="0.8533" opacity="0.3" />
    <rect x="85.3333" y="48" width="42.6667" height="38.4" rx="6" fill="var(--ok-fill)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" />
    <text x="106.6667" y="71.04" text-anchor="middle" fill="var(--ok-accent)" font-family="monospace" font-size="10" opacity="0.6">HW</text>
  </g>
  <g transform="translate(200, 280)" opacity="0.4">
    <rect x="0" y="0" width="42.6667" height="24" rx="6" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="46.9333" y="0" width="42.6667" height="24" rx="6" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="93.8667" y="0" width="42.6667" height="24" rx="6" fill="var(--warn-fill)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="140.8" y="0" width="42.6667" height="24" rx="6" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="187.7333" y="0" width="42.6667" height="24" rx="6" fill="var(--ok-fill)" opacity="0.5" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="234.6667" y="0" width="42.6667" height="24" rx="6" fill="var(--warn-fill)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="281.6" y="0" width="42.6667" height="24" rx="6" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="166.4" y="43.2" text-anchor="middle" fill="var(--text-faint)" font-family="monospace" font-size="10">descriptor table</text>
  </g>
  <circle cx="25.6" cy="28.8" r="2.56" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="657.0667" cy="28.8" r="2.56" fill="var(--ok-fill)" opacity="0.3" />
  <circle cx="25.6" cy="355.2" r="2.56" fill="var(--warn-fill)" opacity="0.3" />
  <circle cx="657.0667" cy="355.2" r="2.56" fill="var(--primary-fill)" opacity="0.3" />
</svg>
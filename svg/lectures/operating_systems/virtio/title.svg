<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#0d1117" />
      <stop offset="100%" style="stop-color:#161b22" />
    </linearGradient>
  </defs>
  <rect width="888.8889" height="500" fill="url(#bg)" rx="7.8125"/>
  <g opacity="0.1" stroke="var(--primary-border)" stroke-width="0.8533">
    <path d="M 262.2223 205 L 428.8889 205 L 428.8889 142.5" />
    <path d="M 262.2223 330 L 373.3333 330 L 373.3333 455 L 484.4444 455" />
    <path d="M 873.3333 142.5 L 873.3333 267.5 L 984.4444 267.5" />
    <path d="M 817.7777 455 L 928.8889 455 L 928.8889 517.5 L 1040 517.5" />
    <path d="M 540 142.5 L 540 205 L 651.1111 205" />
    <path d="M 762.2223 517.5 L 762.2223 455 L 706.6667 455" />
  </g>
  <g transform="translate(100, 80)">
    <rect x="206.6667" y="80" width="200" height="150" rx="7.8125" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.7" />
    <text x="306.6667" y="111.25" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="14.4444" opacity="0.8">Guest VM</text>
    <rect x="240" y="136.25" width="44.4444" height="50" rx="7.8125" fill="var(--primary-fill)" opacity="0.2" stroke="var(--primary-border)" stroke-width="2" />
    <rect x="251.1111" y="148.75" width="22.2223" height="25" rx="7.8125" fill="var(--primary-fill)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="328.8889" y="136.25" width="44.4444" height="50" rx="7.8125" fill="var(--primary-fill)" opacity="0.2" stroke="var(--primary-border)" stroke-width="2" />
    <circle cx="351.1111" cy="161.25" r="11.1111" fill="none" stroke="var(--primary-border)" stroke-width="1.28" opacity="0.4" />
    <circle cx="351.1111" cy="161.25" r="3.3333" fill="var(--primary-fill)" opacity="0.4" />
  </g>
  <g transform="translate(320, 100)">
    <ellipse cx="295.5556" cy="142.5" rx="66.6667" ry="27.7777" fill="none" stroke="var(--warn-border)" stroke-width="1.7067" opacity="0.6" />
    <ellipse cx="295.5556" cy="167.5" rx="66.6667" ry="27.7777" fill="none" stroke="var(--warn-border)" stroke-width="1.7067" opacity="0.4" />
    <ellipse cx="295.5556" cy="192.5" rx="66.6667" ry="27.7777" fill="none" stroke="var(--warn-border)" stroke-width="1.7067" opacity="0.3" />
    <rect x="256.6667" y="127.5" width="13.3333" height="10" rx="7.8125" fill="var(--warn-fill)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="275.5556" y="117.5" width="13.3333" height="10" rx="7.8125" fill="var(--warn-fill)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="297.7777" y="115" width="13.3333" height="10" rx="7.8125" fill="var(--warn-fill)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="320" y="120" width="13.3333" height="10" rx="7.8125" fill="var(--warn-fill)" opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
    <line x1="184.4444" y1="155" x2="217.7777" y2="155" stroke="var(--ok-border)" stroke-width="1.7067" marker-end="url(#arrowG)" />
    <line x1="373.3333" y1="155" x2="401.1111" y2="155" stroke="var(--ok-border)" stroke-width="1.7067" marker-end="url(#arrowG)" />
    <text x="295.5556" y="242.5" text-anchor="middle" fill="var(--warn-accent)" font-family="monospace" font-size="13.3333" opacity="0.7">virtqueue</text>
  </g>
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 12.8,5.4 0,10.8" fill="var(--ok-vivid)" />
    </marker>
  </defs>
  <g transform="translate(530, 80)">
    <rect x="206.6667" y="80" width="200" height="150" rx="7.8125" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.7" />
    <text x="306.6667" y="111.25" text-anchor="middle" fill="var(--ok-accent)" font-family="monospace" font-size="14.4444" opacity="0.8">Host / HV</text>
    <circle cx="262.2223" cy="167.5" r="16.6667" fill="none" stroke="var(--ok-border)" stroke-width="1.28" opacity="0.4" />
    <ellipse cx="262.2223" cy="167.5" rx="16.6667" ry="6.6667" fill="none" stroke="var(--ok-border)" stroke-width="0.8533" opacity="0.3" />
    <line x1="262.2223" y1="148.75" x2="262.2223" y2="186.25" stroke="var(--ok-border)" stroke-width="0.8533" opacity="0.3" />
    <rect x="317.7777" y="142.5" width="55.5556" height="50" rx="7.8125" fill="var(--ok-fill)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" />
    <text x="345.5556" y="172.5" text-anchor="middle" fill="var(--ok-accent)" font-family="monospace" font-size="13.0208" opacity="0.6">HW</text>
  </g>
  <g transform="translate(200, 280)" opacity="0.4">
    <rect x="206.6667" y="80" width="55.5556" height="31.25" rx="7.8125" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="267.7777" y="80" width="55.5556" height="31.25" rx="7.8125" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="328.8889" y="80" width="55.5556" height="31.25" rx="7.8125" fill="var(--warn-fill)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="390" y="80" width="55.5556" height="31.25" rx="7.8125" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="451.1111" y="80" width="55.5556" height="31.25" rx="7.8125" fill="var(--ok-fill)" opacity="0.5" stroke="var(--ok-border)" stroke-width="2"/>
    <rect x="512.2223" y="80" width="55.5556" height="31.25" rx="7.8125" fill="var(--warn-fill)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="573.3333" y="80" width="55.5556" height="31.25" rx="7.8125" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="423.3333" y="136.25" text-anchor="middle" fill="var(--text-faint)" font-family="monospace" font-size="13.0208">descriptor table</text>
  </g>
  <circle cx="240" cy="117.5" r="3.3333" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="1062.2223" cy="117.5" r="3.3333" fill="var(--ok-fill)" opacity="0.3" />
  <circle cx="240" cy="542.5" r="3.3333" fill="var(--warn-fill)" opacity="0.3" />
  <circle cx="1062.2223" cy="542.5" r="3.3333" fill="var(--primary-fill)" opacity="0.3" />
</svg>
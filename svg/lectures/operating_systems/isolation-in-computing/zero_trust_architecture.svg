<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="350" y="40" width="580" height="580" rx="14" fill="none" stroke="var(--danger-border)" stroke-width="2.0539" stroke-dasharray="6.8465 3.4232"/>
  <text x="640.0002" y="108.501258" text-anchor="middle" font-size="30.933247" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Zero Trust Perimeter</text>
  <rect x="490.0002" y="256.166654" width="299.9999" height="88.599797" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="5.97489" filter="url(#shadow)"/>
  <text x="640.0002" y="307.850276" text-anchor="middle" font-size="27.066554" font-family="Arial, sans-serif" fill="var(--danger-text)">Resource</text>
  <rect x="40" y="300.466601" width="240" height="59.066498" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="5.97489" filter="url(#shadow)"/>
  <text x="160.0003" y="337.382975" text-anchor="middle" font-size="23.200061" font-family="Arial, sans-serif" fill="var(--primary-text)">User</text>
  <rect x="1000" y="300.466601" width="240" height="59.066498" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="5.97489" filter="url(#shadow)"/>
  <text x="1119.9999" y="337.382975" text-anchor="middle" font-size="23.200061" font-family="Arial, sans-serif" fill="var(--ok-text)">Service</text>
  <path d="M 280.0002 330 L 490.0002 300.466601" stroke="var(--black)" stroke-width="1.3693" marker-end="url(#arrow)"/>
  <path d="M 1000 330 L 790.0003 300.466601" stroke="var(--black)" stroke-width="1.3693" marker-end="url(#arrow)"/>
  <text x="385.0001" y="322.616525" font-size="19.333268" font-family="Arial, sans-serif" fill="var(--text)">Verify</text>
  <text x="894.9999" y="322.616525" font-size="19.333268" font-family="Arial, sans-serif" fill="var(--text)">Verify</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Isolated boxes/containers -->
  <g transform="translate(150,80)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="none" stroke="#e94560" stroke-width="3"/>
    <rect x="15" y="15" width="35" height="25" rx="3" fill="#e94560" opacity="0.3"/>
    <rect x="60" y="15" width="35" height="25" rx="3" fill="#e94560" opacity="0.3"/>
    <rect x="15" y="48" width="35" height="25" rx="3" fill="#e94560" opacity="0.3"/>
    <text x="60" y="105" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="12">Container</text>
  </g>
  <g transform="translate(340,80)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="none" stroke="#00d2ff" stroke-width="3"/>
    <rect x="15" y="15" width="35" height="25" rx="3" fill="#00d2ff" opacity="0.3"/>
    <rect x="60" y="15" width="35" height="25" rx="3" fill="#00d2ff" opacity="0.3"/>
    <text x="60" y="105" text-anchor="middle" fill="#00d2ff" font-family="Arial,sans-serif" font-size="12">VM</text>
  </g>
  <g transform="translate(530,80)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="none" stroke="#533483" stroke-width="3"/>
    <circle cx="60" cy="40" r="20" fill="none" stroke="#533483" stroke-width="2"/>
    <path d="M50,35 l5,10 l15,-15" fill="none" stroke="#533483" stroke-width="2.5"/>
    <text x="60" y="105" text-anchor="middle" fill="#533483" font-family="Arial,sans-serif" font-size="12">Sandbox</text>
  </g>
  <!-- Barriers/walls between them -->
  <line x1="285" y1="70" x2="285" y2="190" stroke="#ff9900" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="475" y1="70" x2="475" y2="190" stroke="#ff9900" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Shield icon -->
  <g transform="translate(370,200)">
    <path d="M0,-30 l30,-15 l30,15 v25 a35,35 0 0,1-60,0 z" fill="none" stroke="#0f3460" stroke-width="2.5"/>
    <path d="M20,-10 l5,8 l12,-15" fill="none" stroke="#0f3460" stroke-width="2.5"/>
  </g>
  <!-- Title -->
  <text x="400" y="310" text-anchor="middle" fill="#eee" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Isolation in Computing</text>
  <text x="400" y="345" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="16">Separation, Security, and Boundaries</text>
</svg>

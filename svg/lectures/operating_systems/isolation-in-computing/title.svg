<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1116.2791" height="539.5349" fill="url(#bg)" rx="6" x="123.7209" y="80.4651"/>
  <g transform="translate(150,80)">
    <rect x="123.7209" y="80.4651" width="167.4419" height="107.907" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <rect x="144.6511" y="100.6977" width="48.8372" height="33.7209" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2"/>
    <rect x="207.4418" y="100.6977" width="48.8372" height="33.7209" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2"/>
    <rect x="144.6511" y="145.2093" width="48.8372" height="33.7209" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2"/>
    <text x="207.4418" y="222.093" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial,sans-serif" font-size="15.5213">Container</text>
  </g>
  <g transform="translate(340,80)">
    <rect x="123.7209" y="80.4651" width="167.4419" height="107.907" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <rect x="144.6511" y="100.6977" width="48.8372" height="33.7209" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="207.4418" y="100.6977" width="48.8372" height="33.7209" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="207.4418" y="222.093" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="15.5213">VM</text>
  </g>
  <g transform="translate(530,80)">
    <rect x="123.7209" y="80.4651" width="167.4419" height="107.907" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <circle cx="207.4418" cy="134.4186" r="25.8687" fill="none" stroke="var(--info-border)" stroke-width="2.8444" />
    <path d="M 193.4883 127.6744 l 130.6976 93.9535 l 144.6511 60.2326" fill="none" stroke="var(--info-border)" stroke-width="3.5556" />
    <text x="207.4418" y="222.093" text-anchor="middle" fill="var(--info-accent)" font-family="Arial,sans-serif" font-size="15.5213">Sandbox</text>
  </g>
  <line x1="521.3953" y1="174.8837" x2="521.3953" y2="336.7442" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="11.3778 5.6889" />
  <line x1="786.5116" y1="174.8837" x2="786.5116" y2="336.7442" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="11.3778 5.6889" />
  <g transform="translate(370,200)">
    <path d="M 123.7209 40 l 165.5814 60.2326 l 165.5814 100.6977 v 162.9651 a 122.429 172.5581 80.4651 123.7209 81.3081 40 80.4651 z" fill="none" stroke="var(--primary-border)" stroke-width="3.5556" />
    <path d="M 151.6278 66.9767 l 130.6976 91.2558 l 140.4651 60.2326" fill="none" stroke="var(--primary-border)" stroke-width="3.5556" />
  </g>
  <text x="681.8604" y="498.6047" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="38.8031" font-weight="bold">Isolation in Computing</text>
  <text x="681.8604" y="545.814" text-anchor="middle" fill="var(--text-faint)" font-family="Arial,sans-serif" font-size="20.695">Separation, Security, and Boundaries</text>
</svg>
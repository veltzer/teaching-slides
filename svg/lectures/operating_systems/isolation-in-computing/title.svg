<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <g transform="translate(150,80)">
    <rect x="40" y="40" width="180" height="116" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <rect x="62.5" y="61.75" width="52.5" height="36.25" rx="6" fill="url(#grad-danger)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="130" y="61.75" width="52.5" height="36.25" rx="6" fill="url(#grad-danger)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="62.5" y="109.6" width="52.5" height="36.25" rx="6" fill="url(#grad-danger)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="130" y="192.25" text-anchor="middle" fill="var(--danger-accent)" font-size="16.6854" font-family="Arial, sans-serif">Container</text>
  </g>
  <g transform="translate(340,80)">
    <rect x="40" y="40" width="180" height="116" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <rect x="62.5" y="61.75" width="52.5" height="36.25" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="130" y="61.75" width="52.5" height="36.25" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="130" y="192.25" text-anchor="middle" fill="var(--primary-accent)" font-size="16.6854" font-family="Arial, sans-serif">VM</text>
  </g>
  <g transform="translate(530,80)">
    <rect x="40" y="40" width="180" height="116" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <circle cx="130" cy="98" r="27.8089" fill="none" stroke="var(--info-border)" stroke-width="2.8444"/>
    <path d="M 115 90.75 l 47.5 54.5 l 62.5 18.2501" fill="none" stroke="var(--info-border)" stroke-width="3.5556"/>
    <text x="130" y="192.25" text-anchor="middle" fill="var(--info-accent)" font-size="16.6854" font-family="Arial, sans-serif">Sandbox</text>
  </g>
  <line x1="467.5" y1="141.5" x2="467.5" y2="315.5" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="11.3778 5.6889"/>
  <line x1="752.5" y1="141.5" x2="752.5" y2="315.5" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="11.3778 5.6889"/>
  <g transform="translate(370,200)">
    <path d="M 40 -3.5 l 85 18.2501 l 85 61.75 v 82.1875 a 85.1112 92.5 40 40 40.9062 -50 40 z" fill="none" stroke="var(--primary-border)" stroke-width="3.5556"/>
    <path d="M 69.9999 25.5 l 47.5 51.6 l 58 18.2501" fill="none" stroke="var(--primary-border)" stroke-width="3.5556"/>
  </g>
  <text x="639.9999" y="489.5001" text-anchor="middle" fill="var(--surface)" font-size="41.7133" font-weight="bold" font-family="Arial, sans-serif">Isolation in Computing</text>
  <text x="639.9999" y="540.2501" text-anchor="middle" fill="var(--text-faint)" font-size="22.2471" font-family="Arial, sans-serif">Separation, Security, and Boundaries</text>
</svg>

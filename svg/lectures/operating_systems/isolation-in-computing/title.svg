<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <g transform="translate(168.8,10.7)">
  <g transform="translate(150,80)">
    <rect x="40" y="40" width="180" height="116" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <rect x="62.5" y="61.75" width="52.5" height="36.25" rx="6" fill="url(#grad-danger)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="130" y="61.75" width="52.5" height="36.25" rx="6" fill="url(#grad-danger)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="62.5" y="109.6" width="52.5" height="36.25" rx="6" fill="url(#grad-danger)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="130" y="192.25" text-anchor="middle" fill="var(--danger-accent)" font-size="16.6854" font-family="Arial, sans-serif">Container</text>
  </g>
  <g transform="translate(340,80)">
    <rect x="40" y="40" width="180" height="116" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <rect x="62.5" y="61.75" width="52.5" height="36.25" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="130" y="61.75" width="52.5" height="36.25" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="130" y="192.25" text-anchor="middle" fill="var(--primary-accent)" font-size="16.6854" font-family="Arial, sans-serif">VM</text>
  </g>
  <g transform="translate(530,80)">
    <rect x="40" y="40" width="180" height="116" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <circle cx="130" cy="98" r="27.8089" fill="none" stroke="var(--info-border)" stroke-width="2.8444"/>
    <path d="M 115 90.75 l 47.5 54.5 l 62.5 18.2501" fill="none" stroke="var(--info-border)" stroke-width="3.5556"/>
    <text x="130" y="192.25" text-anchor="middle" fill="var(--info-accent)" font-size="16.6854" font-family="Arial, sans-serif">Sandbox</text>
  </g>
  <line x1="467.5" y1="141.5" x2="467.5" y2="315.5" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="11.3778 5.6889"/>
  <line x1="752.5" y1="141.5" x2="752.5" y2="315.5" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="11.3778 5.6889"/>
  <g transform="translate(370,200)">
    <path d="M 40 -3.5 l 85 18.2501 l 85 61.75 v 82.1875 a 85.1112 92.5 40 40 40.9062 -50 40 z" fill="none" stroke="var(--primary-border)" stroke-width="3.5556"/>
    <path d="M 69.9999 25.5 l 47.5 51.6 l 58 18.2501" fill="none" stroke="var(--primary-border)" stroke-width="3.5556"/>
  </g>
  <text x="639.9999" y="540.2501" text-anchor="middle" fill="var(--text-faint)" font-size="22.2471" font-family="Arial, sans-serif">Separation, Security, and Boundaries</text>
  </g>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Isolation In Computing</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --border: #e0e0e0;
        --text: #212121; --text-muted: #555555; --text-faint: #888888;
        --code-bg: #1a1a2e; --shadow: #00000022; --black: #000000;
        --primary-fill: #2196f3; --primary-border: #1565c0; --primary-text: #ffffff; --primary-accent: #0d47a1;
        --ok-fill: #4caf50; --ok-border: #2e7d32; --ok-text: #ffffff; --ok-accent: #1b5e20;
        --warn-fill: #ff9800; --warn-border: #e65100; --warn-text: #ffffff; --warn-accent: #bf360c;
        --danger-fill: #e74c3c; --danger-border: #c62828; --danger-text: #ffffff; --danger-accent: #b71c1c;
        --info-fill: #9c27b0; --info-border: #6a1b9a; --info-text: #ffffff; --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="135" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="80" y="90" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--danger-text)">Ring 0 - kernel</text>
  <text x="80" y="130" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-text)">Full hardware access</text>
  <text x="80" y="160" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Page tables, interrupts, I/O ports</text>

  <rect x="40" y="185" width="1200" height="130" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="80" y="235" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--warn-text)">Ring 1 - reserved</text>
  <text x="80" y="275" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">Historical driver ring</text>
  <text x="80" y="305" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Unused on Linux, Windows, BSD</text>

  <rect x="40" y="325" width="1200" height="130" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="80" y="375" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--primary-text)">Ring 2 - reserved</text>
  <text x="80" y="415" font-family="Arial, sans-serif" font-size="20" fill="var(--primary-text)">Extended services slot</text>
  <text x="80" y="445" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Modern kernels skip it too</text>

  <rect x="40" y="465" width="1200" height="155" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="80" y="515" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--ok-text)">Ring 3 - user apps</text>
  <text x="80" y="555" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-text)">Restricted; syscall to enter kernel</text>
  <text x="80" y="600" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Most code lives here</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="213.3333" y="180" width="256" height="144" fill="#ffc107" stroke="black" stroke-width="3.6" />
  <text x="341.3333" y="261" text-anchor="middle" font-size="25.2">Auth Service</text>
  <rect x="533.3333" y="180" width="256" height="144" fill="#90caf9" stroke="black" stroke-width="3.6" />

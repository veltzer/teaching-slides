<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="110.8994" y="472.8572" width="1058.2012" height="107.1428" fill="var(--text)" stroke="var(--black)" stroke-width="3.3684" rx="6.3616"/>
  <text x="639.9999" y="535.3571" text-anchor="middle" fill="var(--bg)" font-size="28.5715">Physical Hardware</text>
  <rect x="110.8994" y="347.8571" width="1058.2012" height="107.1428" fill="var(--text-muted)" stroke="var(--black)" stroke-width="3.3684" rx="6.3616"/>
  <text x="639.9999" y="410.3571" text-anchor="middle" fill="var(--bg)" font-size="28.5715">Hypervisor (VMM)</text>
  <rect x="174.3914" y="80" width="296.2963" height="232.1429" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.3616"/>
  <text x="322.5396" y="124.6428" text-anchor="middle" font-size="25">VM 1</text>
  <rect x="216.7195" y="151.4286" width="211.6402" height="53.5714" fill="var(--warn-fill)" rx="6.3616" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="322.5396" y="183.5714" text-anchor="middle" font-size="21.4285">Guest OS</text>
  <rect x="216.7195" y="222.8571" width="211.6402" height="53.5714" fill="var(--ok-fill)" rx="6.3616" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="322.5396" y="255" text-anchor="middle" font-size="21.4285">Apps</text>
  <rect x="513.0158" y="80" width="296.2963" height="232.1429" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.3616"/>
  <text x="661.164" y="124.6428" text-anchor="middle" font-size="25">VM 2</text>
  <rect x="555.3439" y="151.4286" width="211.6402" height="53.5714" fill="var(--warn-fill)" rx="6.3616" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="661.164" y="183.5714" text-anchor="middle" font-size="21.4285">Guest OS</text>
  <rect x="555.3439" y="222.8571" width="211.6402" height="53.5714" fill="var(--ok-fill)" rx="6.3616" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="661.164" y="255" text-anchor="middle" font-size="21.4285">Apps</text>
  <rect x="851.6401" y="80" width="296.2963" height="232.1429" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.3616"/>
  <text x="999.7884" y="124.6428" text-anchor="middle" font-size="25">VM 3</text>
  <rect x="893.9683" y="151.4286" width="211.6402" height="53.5714" fill="var(--warn-fill)" rx="6.3616" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="999.7884" y="183.5714" text-anchor="middle" font-size="21.4285">Guest OS</text>
  <rect x="893.9683" y="222.8571" width="211.6402" height="53.5714" fill="var(--ok-fill)" rx="6.3616" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="999.7884" y="255" text-anchor="middle" font-size="21.4285">Apps</text>
</svg>
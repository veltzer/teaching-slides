<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#0d1117" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 12.8,5.4 0,10.8" fill="#4a90e2" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <g opacity="0.06" stroke="var(--bg)" stroke-width="0.7111">
    <line x1="0" y1="128" x2="1137.7778" y2="128" />
    <line x1="0" y1="256" x2="1137.7778" y2="256" />
    <line x1="0" y1="384" x2="1137.7778" y2="384" />
    <line x1="0" y1="512" x2="1137.7778" y2="512" />
    <line x1="227.5556" y1="0" x2="227.5556" y2="640" />
    <line x1="455.1111" y1="0" x2="455.1111" y2="640" />
    <line x1="682.6667" y1="0" x2="682.6667" y2="640" />
    <line x1="910.2222" y1="0" x2="910.2222" y2="640" />
  </g>
  <line x1="85.3333" y1="320" x2="1052.4444" y2="320" stroke="var(--text)" stroke-width="2" opacity="0.5" />
  <g opacity="0.7">
    <rect x="113.7778" y="300.8" width="49.7778" height="38.4" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <rect x="119.4667" y="307.2" width="14.2222" height="9.6" rx="6" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="136.5333" y="307.2" width="21.3333" height="25.6" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
  </g>
  <g transform="translate(200, 200)">
    <circle r="22.7556" fill="var(--danger-fill)" opacity="0.2" stroke="var(--danger-border)" stroke-width="2.8444" />
    <text y="64" text-anchor="middle" fill="var(--danger-accent)" font-family="monospace" font-size="14.2222" opacity="0.7">PRE_ROUTING</text>
    <line x1="0" y1="-25.6" x2="0" y2="-80" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5.6889 4.2667" />
    <rect x="-35.5556" y="-120" width="71.1111" height="32" rx="6" fill="var(--danger-fill)" opacity="0.15" stroke="var(--danger-border)" stroke-width="2" />
    <text y="-97.6" text-anchor="middle" fill="var(--danger-accent)" font-family="monospace" font-size="14.2222" opacity="0.7">hook fn</text>
  </g>
  <g transform="translate(400, 200)">
    <circle r="22.7556" fill="var(--warn-fill)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2.8444" />
    <text y="64" text-anchor="middle" fill="var(--warn-accent)" font-family="monospace" font-size="14.2222" opacity="0.7">FORWARD</text>
    <line x1="0" y1="-25.6" x2="0" y2="-80" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5.6889 4.2667" />
    <rect x="-35.5556" y="-120" width="71.1111" height="32" rx="6" fill="var(--warn-fill)" opacity="0.15" stroke="var(--warn-border)" stroke-width="2" />
    <text y="-97.6" text-anchor="middle" fill="var(--warn-accent)" font-family="monospace" font-size="14.2222" opacity="0.7">hook fn</text>
  </g>
  <g transform="translate(600, 200)">
    <circle r="22.7556" fill="var(--ok-fill)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2.8444" />
    <text y="64" text-anchor="middle" fill="var(--ok-accent)" font-family="monospace" font-size="14.2222" opacity="0.7">POST_ROUTING</text>
    <line x1="0" y1="-25.6" x2="0" y2="-80" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5.6889 4.2667" />
    <rect x="-35.5556" y="-120" width="71.1111" height="32" rx="6" fill="var(--ok-fill)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" />
    <text y="-97.6" text-anchor="middle" fill="var(--ok-accent)" font-family="monospace" font-size="14.2222" opacity="0.7">hook fn</text>
  </g>
  <polygon points="220.4444,310.4 234.6667,320 220.4444,329.6" fill="var(--primary-fill)" opacity="0.5" />
  <polygon points="455.1111,310.4 469.3333,320 455.1111,329.6" fill="var(--primary-fill)" opacity="0.5" />
  <polygon points="725.3333,310.4 739.5556,320 725.3333,329.6" fill="var(--primary-fill)" opacity="0.5" />
  <polygon points="981.3333,310.4 995.5556,320 981.3333,329.6" fill="var(--primary-fill)" opacity="0.5" />
  <g transform="translate(150, 290)" opacity="0.35">
    <rect x="0" y="0" width="711.1111" height="112" rx="6" fill="var(--code-bg)" stroke="var(--text)" stroke-width="1.4222" />
    <text x="21.3333" y="32" fill="var(--info-accent)" font-family="monospace" font-size="15.6444">static unsigned int</text>
    <text x="21.3333" y="57.6" fill="var(--primary-accent)" font-family="monospace" font-size="15.6444">hook_func(void *priv, struct sk_buff *skb,</text>
    <text x="21.3333" y="83.2" fill="var(--warn-accent)" font-family="monospace" font-size="15.6444">  const struct nf_hook_state *state)</text>
  </g>
  <g transform="translate(690, 60)" opacity="0.4">
    <path d="M 0 -48 L 35.5556 -28.8 L 35.5556 16 Q 35.5556 48 0 64 Q -35.5556 48 -35.5556 16 L -35.5556 -28.8 Z" fill="none" stroke="var(--danger-border)" stroke-width="2.8444" />
    <line x1="-14.2222" y1="0" x2="14.2222" y2="0" stroke="var(--danger-border)" stroke-width="2" />
    <line x1="0" y1="-16" x2="0" y2="16" stroke="var(--danger-border)" stroke-width="2" />
  </g>
  <circle cx="42.6667" cy="48" r="4.2667" fill="var(--danger-fill)" opacity="0.3" />
  <circle cx="1095.1111" cy="48" r="4.2667" fill="var(--ok-fill)" opacity="0.3" />
  <circle cx="42.6667" cy="592" r="4.2667" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="1095.1111" cy="592" r="4.2667" fill="var(--warn-fill)" opacity="0.3" />
</svg>
    <rect x="337.6002" y="429.824" width="12.6033" height="5.4858" rx="5.5915" fill="var(--primary-fill)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="352.7242" y="429.824" width="18.9049" height="14.6289" rx="5.5915" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
  </g>
  <g transform="translate(200, 200)">
    <circle r="16.1932" fill="var(--danger-fill)" opacity="0.2" stroke="var(--danger-border)" stroke-width="2.8444" />
    <text y="290.8493" text-anchor="middle" fill="var(--danger-accent)" font-family="monospace" font-size="10.1207" opacity="0.7">PRE_ROUTING</text>
    <line x1="231.7322" y1="239.648" x2="231.7322" y2="208.5615" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5.6889 4.2667" />
    <rect x="200.2236" y="185.7039" width="63.0167" height="18.2861" rx="5.5915" fill="var(--danger-fill)" opacity="0.15" stroke="var(--danger-border)" stroke-width="2" />
    <text y="198.5041" text-anchor="middle" fill="var(--danger-accent)" font-family="monospace" font-size="10.1207" opacity="0.7">hook fn</text>
  </g>
  <g transform="translate(400, 200)">
    <circle r="16.1932" fill="var(--warn-fill)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2.8444" />
    <text y="290.8493" text-anchor="middle" fill="var(--warn-accent)" font-family="monospace" font-size="10.1207" opacity="0.7">FORWARD</text>
    <line x1="231.7322" y1="239.648" x2="231.7322" y2="208.5615" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5.6889 4.2667" />
    <rect x="200.2236" y="185.7039" width="63.0167" height="18.2861" rx="5.5915" fill="var(--warn-fill)" opacity="0.15" stroke="var(--warn-border)" stroke-width="2" />
    <text y="198.5041" text-anchor="middle" fill="var(--warn-accent)" font-family="monospace" font-size="10.1207" opacity="0.7">hook fn</text>
  </g>
  <g transform="translate(600, 200)">

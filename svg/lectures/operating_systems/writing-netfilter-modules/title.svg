      <text x="62.4998" y="88.000289655134" fill="var(--info-accent)" font-size="18.84857107135" font-family="Courier New, monospace">static unsigned int</text>
      <text x="62.4998" y="110.400193103413" fill="var(--primary-accent)" font-size="18.84857107135" font-family="Courier New, monospace">hook_func(void *priv, struct sk_buff *skb,</text>
      <text x="62.4998" y="132.800289655138" fill="var(--warn-accent)" font-size="18.84857107135" font-family="Courier New, monospace">  const struct nf_hook_state *state)</text>
    </g>
    <g transform="translate(690, 60)" opacity="0.4">
      <path d="M 40 18.000579310301 L 77.5 34.800386206854 L 77.5 74.000482758581 Q 77.5 102.00038620686 40 116.000579310309 Q 2.4995 102.00038620686 2.4995 74.000482758581 L 2.4995 34.800386206854 Z" fill="none" stroke="var(--danger-border)" stroke-width="2.8444"/>
      <line x1="24.9999" y1="59.999999999961" x2="55" y2="59.999999999961" stroke="var(--danger-border)" stroke-width="2"/>
      <line x1="40" y1="46.000096551683" x2="40" y2="74.000482758581" stroke="var(--danger-border)" stroke-width="2"/>
    </g>
    <circle cx="84.9997" cy="102.00038620686" r="4.099143160761" fill="var(--danger-fill)" opacity="0.3"/>
    <circle cx="1194.9999" cy="102.00038620686" r="4.099143160761" fill="var(--ok-fill)" opacity="0.3"/>
    <circle cx="84.9997" cy="577.999613793101" r="4.099143160761" fill="var(--primary-fill)" opacity="0.3"/>
    <circle cx="1194.9999" cy="577.999613793101" r="4.099143160761" fill="var(--warn-fill)" opacity="0.3"/>
  </g>
    
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Writing Netfilter Modules</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Custom Packet Filtering</text>
</svg>

    <text y="290.8493" text-anchor="middle" fill="var(--ok-accent)" font-family="monospace" font-size="10.1207" opacity="0.7">POST_ROUTING</text>
    <line x1="231.7322" y1="239.648" x2="231.7322" y2="208.5615" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5.6889 4.2667" />
    <rect x="200.2236" y="185.7039" width="63.0167" height="18.2861" rx="5.5915" fill="var(--ok-fill)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" />

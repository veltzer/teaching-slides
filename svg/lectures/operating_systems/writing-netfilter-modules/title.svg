      <rect x="165.9999" y="328.800289655151" width="15" height="8.400193103449" rx="5.895644213287" fill="url(#grad-primary)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
      <rect x="183.9998" y="328.800289655151" width="22.4998" height="22.399903448276" rx="5.895644213287" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    </g>

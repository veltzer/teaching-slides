    <polygon points="272.4997,331.600096551703 287.5001,340.000193103428 272.4997,348.400193103429" fill="var(--primary-fill)" opacity="0.5"/>
    <polygon points="520.0001,331.600096551703 535.0001,340.000193103428 520.0001,348.400193103429" fill="var(--primary-fill)" opacity="0.5"/>
    <polygon points="804.9999,331.600096551703 819.9999,340.000193103428 804.9999,348.400193103429" fill="var(--primary-fill)" opacity="0.5"/>
    <polygon points="1074.9999,331.600096551703 1089.9999,340.000193103428 1074.9999,348.400193103429" fill="var(--primary-fill)" opacity="0.5"/>

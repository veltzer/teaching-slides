<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#e06c75"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#61afef"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Network grid background -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Packet flow with hook points -->
  <!-- Main packet path -->
  <line x1="60" y1="200" x2="740" y2="200" stroke="#333" stroke-width="3" opacity="0.5"/>
  <!-- Packets -->
  <g opacity="0.7">
    <rect x="80" y="188" width="35" height="24" rx="4" fill="none" stroke="#61afef" stroke-width="1.5"/>
    <rect x="84" y="192" width="10" height="6" rx="1" fill="#61afef" opacity="0.5"/>
    <rect x="96" y="192" width="15" height="16" rx="1" fill="#61afef" opacity="0.3"/>
  </g>
  <!-- Hook points along the path -->
  <!-- PRE_ROUTING -->
  <g transform="translate(200, 200)">
    <circle r="16" fill="#e06c75" opacity="0.2" stroke="#e06c75" stroke-width="2"/>
    <text y="40" text-anchor="middle" fill="#e06c75" font-family="monospace" font-size="9" opacity="0.7">PRE_ROUTING</text>
    <!-- Hook arrow up -->
    <line x1="0" y1="-16" x2="0" y2="-50" stroke="#e06c75" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="-25" y="-75" width="50" height="20" rx="4" fill="#e06c75" opacity="0.15" stroke="#e06c75" stroke-width="1"/>
    <text y="-61" text-anchor="middle" fill="#e06c75" font-family="monospace" font-size="8" opacity="0.7">hook fn</text>
  </g>
  <!-- FORWARD -->
  <g transform="translate(400, 200)">
    <circle r="16" fill="#e5c07b" opacity="0.2" stroke="#e5c07b" stroke-width="2"/>
    <text y="40" text-anchor="middle" fill="#e5c07b" font-family="monospace" font-size="9" opacity="0.7">FORWARD</text>
    <line x1="0" y1="-16" x2="0" y2="-50" stroke="#e5c07b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="-25" y="-75" width="50" height="20" rx="4" fill="#e5c07b" opacity="0.15" stroke="#e5c07b" stroke-width="1"/>
    <text y="-61" text-anchor="middle" fill="#e5c07b" font-family="monospace" font-size="8" opacity="0.7">hook fn</text>
  </g>
  <!-- POST_ROUTING -->
  <g transform="translate(600, 200)">
    <circle r="16" fill="#98c379" opacity="0.2" stroke="#98c379" stroke-width="2"/>
    <text y="40" text-anchor="middle" fill="#98c379" font-family="monospace" font-size="9" opacity="0.7">POST_ROUTING</text>
    <line x1="0" y1="-16" x2="0" y2="-50" stroke="#98c379" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="-25" y="-75" width="50" height="20" rx="4" fill="#98c379" opacity="0.15" stroke="#98c379" stroke-width="1"/>
    <text y="-61" text-anchor="middle" fill="#98c379" font-family="monospace" font-size="8" opacity="0.7">hook fn</text>
  </g>
  <!-- Direction arrows on packet path -->
  <polygon points="155,194 165,200 155,206" fill="#61afef" opacity="0.5"/>
  <polygon points="320,194 330,200 320,206" fill="#61afef" opacity="0.5"/>
  <polygon points="510,194 520,200 510,206" fill="#61afef" opacity="0.5"/>
  <polygon points="690,194 700,200 690,206" fill="#61afef" opacity="0.5"/>
  <!-- Kernel module code snippet hint -->
  <g transform="translate(150, 290)" opacity="0.35">
    <rect x="0" y="0" width="500" height="70" rx="6" fill="#1e2030" stroke="#333" stroke-width="1"/>
    <text x="15" y="20" fill="#c678dd" font-family="monospace" font-size="11">static unsigned int</text>
    <text x="15" y="36" fill="#61afef" font-family="monospace" font-size="11">hook_func(void *priv, struct sk_buff *skb,</text>
    <text x="15" y="52" fill="#e5c07b" font-family="monospace" font-size="11">  const struct nf_hook_state *state)</text>
  </g>
  <!-- Firewall shield icon -->
  <g transform="translate(690, 60)" opacity="0.4">
    <path d="M0,-30 L25,-18 L25,10 Q25,30 0,40 Q-25,30 -25,10 L-25,-18 Z" fill="none" stroke="#e06c75" stroke-width="2"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#e06c75" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#e06c75" stroke-width="2"/>
  </g>
  <!-- Decorative corners -->
  <circle cx="30" cy="30" r="3" fill="#e06c75" opacity="0.3"/>
  <circle cx="770" cy="30" r="3" fill="#98c379" opacity="0.3"/>
  <circle cx="30" cy="370" r="3" fill="#61afef" opacity="0.3"/>
  <circle cx="770" cy="370" r="3" fill="#e5c07b" opacity="0.3"/>
</svg>

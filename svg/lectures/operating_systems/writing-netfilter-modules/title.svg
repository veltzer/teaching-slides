      <line x1="40" y1="37.600193103408" x2="40" y2="-9.99990344832" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="5.6889 4.2667"/>
      <rect x="2.4995" y="-44.999420689702" width="75" height="27.999806896554" rx="5.895644213287" fill="url(#grad-warn)" opacity="0.15" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
      <text y="-25.399710344872" text-anchor="middle" fill="var(--warn-accent)" font-size="18.84857107135" opacity="0.7" font-family="Courier New, monospace">hook fn</text>

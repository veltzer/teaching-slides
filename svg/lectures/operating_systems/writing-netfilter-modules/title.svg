  <g transform="translate(150, 290)" opacity="0.35">
    <rect x="231.7322" y="254.2769" width="630.1675" height="64.0016" rx="5.5915" fill="var(--code-bg)" stroke="var(--text)" stroke-width="1.4222" />
    <text x="250.6371" y="272.563" fill="var(--info-accent)" font-family="monospace" font-size="11.1328">static unsigned int</text>
    <text x="250.6371" y="287.192" fill="var(--primary-accent)" font-family="monospace" font-size="11.1328">hook_func(void *priv, struct sk_buff *skb,</text>
    <text x="250.6371" y="301.8209" fill="var(--warn-accent)" font-family="monospace" font-size="11.1328">  const struct nf_hook_state *state)</text>
  </g>
  <g transform="translate(690, 60)" opacity="0.4">
    <path d="M 231.7322 226.8477 L 263.2406 237.8194 L 263.2406 263.42 Q 263.2406 281.7061 231.7322 290.8493 Q 200.2236 281.7061 200.2236 263.42 L 200.2236 237.8194 Z" fill="none" stroke="var(--danger-border)" stroke-width="2.8444" />
    <line x1="219.1287" y1="254.2769" x2="244.3355" y2="254.2769" stroke="var(--danger-border)" stroke-width="2" />
    <line x1="231.7322" y1="245.1338" x2="231.7322" y2="263.42" stroke="var(--danger-border)" stroke-width="2" />

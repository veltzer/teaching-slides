<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="380" height="340" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--warn-text)">Device Tree</text>
  <text x="230" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">DTS source</text>
  <text x="230" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">DTB binary blob</text>
  <text x="230" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">Passed by bootloader</text>
  <text x="230" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">Describes hardware</text>

  <rect x="450" y="40" width="380" height="340" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--ok-text)">OF Functions</text>
  <text x="640" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--ok-text)">of_irq_get()</text>
  <text x="640" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--ok-text)">of_irq_parse_one()</text>
  <text x="640" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--ok-text)">Walks node tree</text>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--ok-text)">Maps to virq</text>

  <rect x="860" y="40" width="380" height="340" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--primary-text)">Linux IRQ</text>
  <text x="1050" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">Virtual IRQ number</text>
  <text x="1050" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">request_irq()</text>
  <text x="1050" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">Handler runs</text>
  <text x="1050" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">Driver ready</text>

  <line x1="420" y1="210" x2="450" y2="210" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="830" y1="210" x2="860" y2="210" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="40" y="420" width="1200" height="200" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="475" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">interrupts = &lt;0 25 4&gt;;</text>
  <text x="640" y="525" text-anchor="middle" font-size="20" fill="var(--bg)" font-family="Courier New, monospace">GIC_SPI 25 IRQ_TYPE_LEVEL_HIGH</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--border)">DTS snippet: controller cell, hw number, trigger flags</text>
</svg>

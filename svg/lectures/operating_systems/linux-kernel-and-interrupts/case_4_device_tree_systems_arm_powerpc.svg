  <text x="240" y="198" text-anchor="middle" font-size="19.2">(DTS/DTB)</text>
  <rect x="480" y="90" width="320" height="180" fill="#ccffcc" stroke="black" />
  <text x="640" y="162" text-anchor="middle">OF Functions</text>
  <text x="640" y="198" text-anchor="middle" font-size="19.2">(of_irq_get)</text>

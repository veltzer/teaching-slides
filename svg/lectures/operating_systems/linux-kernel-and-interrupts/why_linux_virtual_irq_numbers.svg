</defs>
  <text x="683.0768" y="388.1539" text-anchor="middle" font-size="24.1231">Benefits:</text>
  <text x="683.0768" y="446.3077" text-anchor="middle" font-size="20.6769">• Hardware abstraction</text>
  <text x="683.0768" y="485.0769" text-anchor="middle" font-size="20.6769">• Dynamic allocation</text>
  <text x="683.0768" y="523.8461" text-anchor="middle" font-size="20.6769">• Sparse IRQ support</text>

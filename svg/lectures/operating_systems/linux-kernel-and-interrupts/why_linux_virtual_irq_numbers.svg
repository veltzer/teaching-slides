<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="80" y="90" width="240" height="144" fill="#ffcccc" stroke="black" />
  <text x="200" y="171" text-anchor="middle">Hardware IRQ</text>
  <text x="200" y="207" text-anchor="middle">(Platform)</text>
  <rect x="480" y="90" width="240" height="144" fill="#ccffcc" stroke="black" />
  <text x="600" y="171" text-anchor="middle">Virtual IRQ</text>
  <text x="600" y="207" text-anchor="middle">(Linux)</text>
  <rect x="880" y="90" width="240" height="144" fill="#ccccff" stroke="black" />
  <text x="1000" y="171" text-anchor="middle">IRQ Handler</text>
  <text x="1000" y="207" text-anchor="middle">(Driver)</text>
  <path d="M 320 162 L 480 162" stroke="black" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 720 162 L 880 162" stroke="black" stroke-width="3.2" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="18" refX="14.4" refY="5.4" orient="auto">
      <polygon points="0,18 4.8,0" fill="black" />
    </marker>
  </defs>
  <text x="640" y="360" text-anchor="middle" font-size="22.4">Benefits:</text>
  <text x="640" y="414" text-anchor="middle" font-size="19.2">• Hardware abstraction</text>
  <text x="640" y="450" text-anchor="middle" font-size="19.2">• Dynamic allocation</text>
  <text x="640" y="486" text-anchor="middle" font-size="19.2">• Sparse IRQ support</text>
  <text x="640" y="522" text-anchor="middle" font-size="19.2">• Runtime remapping</text>
</svg>
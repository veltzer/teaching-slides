  <text x="56.8889" y="328" text-anchor="middle" font-family="monospace" font-size="19.9111" fill="var(--ok-accent)">IRQ1</text>
  <text x="56.8889" y="392" text-anchor="middle" font-family="monospace" font-size="19.9111" fill="var(--ok-accent)">IRQ2</text>
  <polygon points="696.8889,240 753.7778,296 725.3333,296 768,368 711.1111,312 739.5556,312" fill="var(--danger-fill)" opacity="0.9" />
  <polygon points="810.6667,224 867.5556,280 839.1111,280 881.7778,352 824.8889,296 853.3333,296" fill="var(--danger-fill)" opacity="0.7" />
  <circle cx="967.1111" cy="320" r="64" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="967.1111" y="312" text-anchor="middle" font-family="serif" font-size="56.8889" fill="var(--ok-accent)">🐧</text>
  <rect x="490.6667" y="172.8" width="17.0667" height="22.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="526.2222" y="172.8" width="17.0667" height="22.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="561.7778" y="172.8" width="17.0667" height="22.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="597.3333" y="172.8" width="17.0667" height="22.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="632.8889" y="172.8" width="17.0667" height="22.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="490.6667" y="444.8" width="17.0667" height="22.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="526.2222" y="444.8" width="17.0667" height="22.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="561.7778" y="444.8" width="17.0667" height="22.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="597.3333" y="444.8" width="17.0667" height="22.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="632.8889" y="444.8" width="17.0667" height="22.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="568.8889" y="80" text-anchor="middle" font-family="sans-serif" font-size="36.9778" font-weight="bold" fill="var(--surface)">Linux Kernel &amp; Interrupts</text>
  <text x="568.8889" y="592" text-anchor="middle" font-family="monospace" font-size="19.9111" fill="var(--text-faint)">interrupt handling | IRQ mapping | driver development</text>
</svg>
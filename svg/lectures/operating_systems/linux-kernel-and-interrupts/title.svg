<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="520" y="214" width="240" height="232" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="4.2667" />
  <text x="640" y="344.5" text-anchor="middle" font-size="38.9324" font-weight="bold" fill="var(--danger-accent)" font-family="Courier New, monospace">CPU</text>
  <line x1="160" y1="272" x2="505" y2="301" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="11.3778 5.6889" />
  <line x1="160" y1="330" x2="505" y2="330" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="11.3778 5.6889" />
  <line x1="160" y1="388" x2="505" y2="359" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="11.3778 5.6889" />
  <text x="100" y="279.25" text-anchor="middle" font-size="19.4662" fill="var(--ok-accent)" font-family="Courier New, monospace">IRQ0</text>
  <text x="100" y="337.25" text-anchor="middle" font-size="19.4662" fill="var(--ok-accent)" font-family="Courier New, monospace">IRQ1</text>
  <text x="100" y="395.25" text-anchor="middle" font-size="19.4662" fill="var(--ok-accent)" font-family="Courier New, monospace">IRQ2</text>
  <polygon points="775,257.5 835,308.25 804.9999,308.25 850,373.5 790,322.75 820,322.75" fill="var(--danger-fill)" opacity="0.9" />
  <polygon points="895,243 955,293.75 925,293.75 970,359 910,308.25 939.9999,308.25" fill="var(--danger-fill)" opacity="0.7" />
  <circle cx="1060" cy="330" r="62.57" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="1060" y="322.75" text-anchor="middle" font-size="55.6178" fill="var(--ok-accent)" font-family="Arial, sans-serif">🐧</text>
  <rect x="557.5" y="196.6" width="18" height="20.3" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="595" y="196.6" width="18" height="20.3" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="632.5" y="196.6" width="18" height="20.3" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="670" y="196.6" width="18" height="20.3" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="707.5" y="196.6" width="18" height="20.3" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="557.5" y="443.1" width="18" height="20.3" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="595" y="443.1" width="18" height="20.3" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="632.5" y="443.1" width="18" height="20.3" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="670" y="443.1" width="18" height="20.3" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="707.5" y="443.1" width="18" height="20.3" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="112.5" text-anchor="middle" font-size="36.1516" font-weight="bold" fill="var(--surface)" font-family="Arial, sans-serif">Linux Kernel &amp; Interrupts</text>
  <text x="640" y="576.5" text-anchor="middle" font-size="19.4662" fill="var(--text-faint)" font-family="Courier New, monospace">interrupt handling | IRQ mapping | driver development</text>
</svg>
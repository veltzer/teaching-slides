<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--code-bg)" rx="6"/>
  <text x="184.8889" y="192" text-anchor="middle" font-family="sans-serif" font-size="17.0667" fill="var(--danger-accent)" opacity="0.6">Traditional</text>
  <rect x="85.3333" y="216" width="99.5556" height="56" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.1333" opacity="0.5" />
  <text x="135.1111" y="251.2" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)" opacity="0.6">Device</text>
  <line x1="199.1111" y1="243.2" x2="241.7778" y2="243.2" stroke="var(--danger-border)" stroke-width="1.4222" opacity="0.4" />
  <rect x="256" y="216" width="99.5556" height="56" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.1333" opacity="0.5" />
  <text x="305.7778" y="251.2" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)" opacity="0.6">Kernel</text>
  <line x1="369.7778" y1="243.2" x2="412.4444" y2="243.2" stroke="var(--danger-border)" stroke-width="1.4222" opacity="0.4" />
  <rect x="426.6667" y="216" width="99.5556" height="56" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.1333" opacity="0.5" />
  <text x="476.4444" y="251.2" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)" opacity="0.6">User</text>
  <line x1="540.4444" y1="243.2" x2="583.1111" y2="243.2" stroke="var(--danger-border)" stroke-width="1.4222" opacity="0.4" />
  <rect x="597.3333" y="216" width="99.5556" height="56" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.1333" opacity="0.5" />
  <text x="647.1111" y="251.2" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)" opacity="0.6">Kernel</text>
  <line x1="71.1111" y1="200" x2="711.1111" y2="280" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <line x1="71.1111" y1="280" x2="711.1111" y2="200" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <text x="568.8889" y="352" text-anchor="middle" font-family="sans-serif" font-size="19.9111" fill="var(--ok-accent)">Zero-Copy Path</text>
  <rect x="170.6667" y="384" width="142.2222" height="80" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="241.7778" y="432" text-anchor="middle" font-family="monospace" font-size="17.0667" fill="var(--ok-accent)">Device</text>
  <line x1="327.1111" y1="424" x2="654.2222" y2="424" stroke="var(--ok-border)" stroke-width="2" />
  <polygon points="654.2222,412.8 679.8222,424 654.2222,435.2" fill="var(--ok-fill)" />
  <text x="497.7778" y="408" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--ok-accent)">DMA / sendfile()</text>
  <rect x="682.6667" y="384" width="142.2222" height="80" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="753.7778" y="432" text-anchor="middle" font-family="monospace" font-size="17.0667" fill="var(--ok-accent)">Socket</text>
  <text x="967.1111" y="400" text-anchor="middle" font-family="sans-serif" font-size="51.2" font-weight="bold" fill="var(--ok-accent)" opacity="0.6">0</text>
  <text x="967.1111" y="440" text-anchor="middle" font-family="sans-serif" font-size="17.0667" fill="var(--text-faint)">copies</text>
  <rect x="853.3333" y="224" width="170.6667" height="48" rx="6" fill="var(--warn-fill)" opacity="0.15" stroke="var(--warn-border)" stroke-width="2" />
  <text x="938.6667" y="256" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--warn-accent)">kernel space</text>
  <text x="568.8889" y="80" text-anchor="middle" font-family="sans-serif" font-size="39.8222" font-weight="bold" fill="var(--surface)">Zero-Copy in Linux</text>
  <text x="568.8889" y="600" text-anchor="middle" font-family="monospace" font-size="18.4889" fill="var(--text-muted)">sendfile | splice | mmap | DMA</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <text x="235" y="214" text-anchor="middle" font-family="sans-serif" font-size="16.6854" fill="var(--danger-accent)" opacity="0.6">Traditional</text>
  <rect x="130" y="235.75" width="105" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.1333" opacity="0.5" />
  <text x="182.5" y="267.65" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--danger-accent)" opacity="0.6">Device</text>
  <line x1="250" y1="260.4" x2="295" y2="260.4" stroke="var(--danger-border)" stroke-width="1.4222" opacity="0.4" />
  <rect x="310" y="235.75" width="105" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.1333" opacity="0.5" />
  <text x="362.5" y="267.65" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--danger-accent)" opacity="0.6">Kernel</text>
  <line x1="430" y1="260.4" x2="474.9999" y2="260.4" stroke="var(--danger-border)" stroke-width="1.4222" opacity="0.4" />
  <rect x="490" y="235.75" width="105" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.1333" opacity="0.5" />
  <text x="542.4999" y="267.65" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--danger-accent)" opacity="0.6">User</text>
  <line x1="609.9999" y1="260.4" x2="655" y2="260.4" stroke="var(--danger-border)" stroke-width="1.4222" opacity="0.4" />
  <rect x="670" y="235.75" width="105" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.1333" opacity="0.5" />
  <text x="722.5" y="267.65" text-anchor="middle" font-family="monospace" font-size="13.9044" fill="var(--danger-accent)" opacity="0.6">Kernel</text>
  <line x1="115" y1="221.25" x2="790" y2="293.75" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <line x1="115" y1="293.75" x2="790" y2="221.25" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <text x="640" y="359" text-anchor="middle" font-family="sans-serif" font-size="19.4662" fill="var(--ok-accent)">Zero-Copy Path</text>
  <rect x="220" y="388" width="150" height="72.5" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="295" y="431.5" text-anchor="middle" font-family="monospace" font-size="16.6854" fill="var(--ok-accent)">Device</text>
  <line x1="385" y1="424.25" x2="730" y2="424.25" stroke="var(--ok-border)" stroke-width="2" />
  <polygon points="730,414.1 757,424.25 730,434.4" fill="var(--ok-fill)" />
  <text x="565" y="409.75" text-anchor="middle" font-family="monospace" font-size="15.2948" fill="var(--ok-accent)">DMA / sendfile()</text>
  <rect x="760" y="388" width="150" height="72.5" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="835" y="431.5" text-anchor="middle" font-family="monospace" font-size="16.6854" fill="var(--ok-accent)">Socket</text>
  <text x="1060" y="402.5" text-anchor="middle" font-family="sans-serif" font-size="50.056" font-weight="bold" fill="var(--ok-accent)" opacity="0.6">0</text>
  <text x="1060" y="438.75" text-anchor="middle" font-family="sans-serif" font-size="16.6854" fill="var(--text-faint)">copies</text>
  <rect x="939.9999" y="243" width="180" height="43.5" rx="6" fill="var(--warn-fill)" opacity="0.15" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="272" text-anchor="middle" font-family="monospace" font-size="15.2948" fill="var(--warn-accent)">kernel space</text>
  <text x="640" y="112.5" text-anchor="middle" font-family="sans-serif" font-size="38.9324" font-weight="bold" fill="var(--surface)">Zero-Copy in Linux</text>
  <text x="640" y="583.75" text-anchor="middle" font-family="monospace" font-size="18.0758" fill="var(--text-muted)">sendfile | splice | mmap | DMA</text>
</svg>
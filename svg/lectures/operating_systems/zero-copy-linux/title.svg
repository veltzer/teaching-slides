<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Traditional copy path (crossed out) -->
  <text x="130" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e94560" opacity="0.6">Traditional</text>
  <rect x="60" y="135" width="70" height="35" rx="4" fill="#0f3460" stroke="#e94560" stroke-width="1.5" opacity="0.5"/>
  <text x="95" y="157" text-anchor="middle" font-family="monospace" font-size="10" fill="#e94560" opacity="0.6">Device</text>
  <line x1="140" y1="152" x2="170" y2="152" stroke="#e94560" stroke-width="1" opacity="0.4"/>
  <rect x="180" y="135" width="70" height="35" rx="4" fill="#0f3460" stroke="#e94560" stroke-width="1.5" opacity="0.5"/>
  <text x="215" y="157" text-anchor="middle" font-family="monospace" font-size="10" fill="#e94560" opacity="0.6">Kernel</text>
  <line x1="260" y1="152" x2="290" y2="152" stroke="#e94560" stroke-width="1" opacity="0.4"/>
  <rect x="300" y="135" width="70" height="35" rx="4" fill="#0f3460" stroke="#e94560" stroke-width="1.5" opacity="0.5"/>
  <text x="335" y="157" text-anchor="middle" font-family="monospace" font-size="10" fill="#e94560" opacity="0.6">User</text>
  <line x1="380" y1="152" x2="410" y2="152" stroke="#e94560" stroke-width="1" opacity="0.4"/>
  <rect x="420" y="135" width="70" height="35" rx="4" fill="#0f3460" stroke="#e94560" stroke-width="1.5" opacity="0.5"/>
  <text x="455" y="157" text-anchor="middle" font-family="monospace" font-size="10" fill="#e94560" opacity="0.6">Kernel</text>
  <!-- Big X over traditional -->
  <line x1="50" y1="125" x2="500" y2="175" stroke="#e94560" stroke-width="3" opacity="0.6"/>
  <line x1="50" y1="175" x2="500" y2="125" stroke="#e94560" stroke-width="3" opacity="0.6"/>
  <!-- Zero-copy path -->
  <text x="400" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#16c79a">Zero-Copy Path</text>
  <rect x="120" y="240" width="100" height="50" rx="8" fill="#0f3460" stroke="#16c79a" stroke-width="2"/>
  <text x="170" y="270" text-anchor="middle" font-family="monospace" font-size="12" fill="#16c79a">Device</text>
  <!-- Direct arrow -->
  <line x1="230" y1="265" x2="460" y2="265" stroke="#16c79a" stroke-width="3"/>
  <polygon points="460,258 478,265 460,272" fill="#16c79a"/>
  <text x="350" y="255" text-anchor="middle" font-family="monospace" font-size="11" fill="#16c79a">DMA / sendfile()</text>
  <rect x="480" y="240" width="100" height="50" rx="8" fill="#0f3460" stroke="#16c79a" stroke-width="2"/>
  <text x="530" y="270" text-anchor="middle" font-family="monospace" font-size="12" fill="#16c79a">Socket</text>
  <!-- Speed indicator -->
  <text x="680" y="250" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#16c79a" opacity="0.6">0</text>
  <text x="680" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">copies</text>
  <!-- Kernel space label -->
  <rect x="600" y="140" width="120" height="30" rx="15" fill="#f5a623" opacity="0.15" stroke="#f5a623" stroke-width="1"/>
  <text x="660" y="160" text-anchor="middle" font-family="monospace" font-size="11" fill="#f5a623">kernel space</text>
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#eee">Zero-Copy in Linux</text>
  <text x="400" y="375" text-anchor="middle" font-family="monospace" font-size="13" fill="#666">sendfile | splice | mmap | DMA</text>
</svg>

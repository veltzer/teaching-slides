<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="170" width="200" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="226" text-anchor="middle" font-size="20" fill="var(--primary-text)" font-family="Arial, sans-serif">Draft</text>
  <text x="140" y="300" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">author writes</text>
  <line x1="242" y1="220" x2="286" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="290" y="170" width="200" height="100" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="390" y="213" text-anchor="middle" font-size="20" fill="var(--warn-text)" font-family="Arial, sans-serif">Technical</text>
  <text x="390" y="239" text-anchor="middle" font-size="20" fill="var(--warn-text)" font-family="Arial, sans-serif">review</text>
  <text x="390" y="300" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">findings supported?</text>
  <line x1="492" y1="220" x2="536" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="170" width="200" height="100" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="213" text-anchor="middle" font-size="20" fill="var(--warn-text)" font-family="Arial, sans-serif">Administrative</text>
  <text x="640" y="239" text-anchor="middle" font-size="20" fill="var(--warn-text)" font-family="Arial, sans-serif">review</text>
  <text x="640" y="300" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">form complete?</text>
  <line x1="742" y1="220" x2="786" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="790" y="170" width="200" height="100" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="890" y="213" text-anchor="middle" font-size="20" fill="var(--ok-text)" font-family="Arial, sans-serif">Sign and</text>
  <text x="890" y="239" text-anchor="middle" font-size="20" fill="var(--ok-text)" font-family="Arial, sans-serif">lock</text>
  <text x="890" y="300" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">PDF and hash</text>
  <line x1="992" y1="220" x2="1036" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1040" y="170" width="200" height="100" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1140" y="226" text-anchor="middle" font-size="20" fill="var(--info-text)" font-family="Arial, sans-serif">Release</text>
  <text x="1140" y="300" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">distribution list</text>
  <line x1="390" y1="170" x2="390" y2="40" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="640" y1="170" x2="640" y2="40" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="640" y1="40" x2="140" y2="40" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="140" y1="40" x2="140" y2="163" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">revise and review again</text>
  <line x1="1140" y1="310" x2="1140" y2="373" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="1020" y="350" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">new information</text>
  <rect x="1000" y="380" width="240" height="90" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1120" y="418" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">Supplementary</text>
  <text x="1120" y="442" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">report</text>
  <rect x="40" y="380" width="900" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="490" y="431" text-anchor="middle" font-size="20" fill="var(--text)" font-family="Arial, sans-serif">A released version is never edited</text>
  <rect x="40" y="540" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="586" text-anchor="middle" font-size="20" fill="var(--text)" font-family="Arial, sans-serif">Record each step: reviewer, date, outcome, version</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="270" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="175" y="76" text-anchor="middle" font-size="20" fill="var(--primary-text)" font-family="Arial, sans-serif">Front matter</text>
  <rect x="55" y="120" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="175" y="160" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Cover and control</text>
  <rect x="55" y="205" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="175" y="245" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Executive summary</text>
  <rect x="55" y="290" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="175" y="330" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Examiner details</text>
  <rect x="55" y="375" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="175" y="415" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Request and scope</text>
  <line x1="312" y1="70" x2="346" y2="70" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="350" y="40" width="270" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="485" y="76" text-anchor="middle" font-size="20" fill="var(--ok-text)" font-family="Arial, sans-serif">Evidence</text>
  <rect x="365" y="120" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="485" y="160" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Exhibit list</text>
  <rect x="365" y="205" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="485" y="245" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Chain of custody</text>
  <rect x="365" y="290" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="485" y="330" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Methodology and tools</text>
  <line x1="622" y1="70" x2="656" y2="70" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="40" width="270" height="60" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="795" y="76" text-anchor="middle" font-size="20" fill="var(--warn-text)" font-family="Arial, sans-serif">Results</text>
  <rect x="675" y="120" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="795" y="160" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Findings</text>
  <rect x="675" y="205" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="795" y="245" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Timeline</text>
  <rect x="675" y="290" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="795" y="330" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Conclusions</text>
  <rect x="675" y="375" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="795" y="415" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Limitations</text>
  <line x1="932" y1="70" x2="966" y2="70" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="970" y="40" width="270" height="60" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1105" y="76" text-anchor="middle" font-size="20" fill="var(--info-text)" font-family="Arial, sans-serif">Back matter</text>
  <rect x="985" y="120" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1105" y="160" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Declarations</text>
  <rect x="985" y="205" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1105" y="245" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Signature</text>
  <rect x="985" y="290" width="240" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1105" y="330" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">Appendices</text>
  <rect x="40" y="540" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="586" text-anchor="middle" font-size="20" fill="var(--text)" font-family="Arial, sans-serif">Every statement traces back to an exhibit and a note</text>
</svg>

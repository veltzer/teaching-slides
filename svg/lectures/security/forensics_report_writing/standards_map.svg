<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="360" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="220" y="76" text-anchor="middle" font-size="20" fill="var(--primary-text)" font-family="Arial, sans-serif">ISO/IEC standards</text>
  <rect x="60" y="120" width="320" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="220" y="153" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">27037 preservation</text>
  <rect x="60" y="192" width="320" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="220" y="225" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">27041 method assurance</text>
  <rect x="60" y="264" width="320" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="220" y="297" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">27042 analysis and reporting</text>
  <rect x="60" y="336" width="320" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="220" y="369" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">27043 investigation process</text>
  <rect x="60" y="408" width="320" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="220" y="441" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">17025 lab accreditation</text>
  <line x1="220.0" y1="485" x2="220.0" y2="533" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="440" y="40" width="400" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="76" text-anchor="middle" font-size="20" fill="var(--ok-text)" font-family="Arial, sans-serif">Practice guidelines</text>
  <rect x="460" y="120" width="360" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="153" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">NIST SP 800-86</text>
  <rect x="460" y="192" width="360" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="225" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">SWGDE report writing</text>
  <rect x="460" y="264" width="360" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="297" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">ACPO / NPCC guide</text>
  <rect x="460" y="336" width="360" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="369" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">ENFSI evaluative reporting</text>
  <rect x="460" y="408" width="360" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="441" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">FSR Code of Practice</text>
  <line x1="640.0" y1="485" x2="640" y2="533" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="880" y="40" width="360" height="60" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1060" y="76" text-anchor="middle" font-size="20" fill="var(--warn-text)" font-family="Arial, sans-serif">Legal rules</text>
  <rect x="900" y="120" width="320" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1060" y="153" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">FRE 702 and Daubert</text>
  <rect x="900" y="192" width="320" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1060" y="225" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">FRCP Rule 26</text>
  <rect x="900" y="264" width="320" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1060" y="297" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">CrimPR Part 19</text>
  <rect x="900" y="336" width="320" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1060" y="369" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">CPR Part 35</text>
  <rect x="900" y="408" width="320" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1060" y="441" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">local court rules</text>
  <line x1="1060.0" y1="485" x2="1060.0" y2="533" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <rect x="40" y="540" width="1200" height="80" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="586" text-anchor="middle" font-size="20" fill="var(--info-text)" font-family="Arial, sans-serif">Your laboratory SOP and report template</text>
</svg>

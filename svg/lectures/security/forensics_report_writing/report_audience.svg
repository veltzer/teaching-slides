<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <line x1="380" y1="120" x2="520" y2="300" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="380" y1="330" x2="520" y2="320" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="380" y1="540" x2="520" y2="340" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="900" y1="120" x2="760" y2="300" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="900" y1="330" x2="760" y2="320" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="900" y1="540" x2="760" y2="340" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="520" y="270" width="240" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="327" text-anchor="middle" font-size="22" fill="var(--primary-text)" font-family="Arial, sans-serif">Forensic report</text>
  <rect x="40" y="40" width="340" height="160" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="210" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Judge and jury</text>
  <text x="210" y="127" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">plain language</text>
  <text x="210" y="149" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">clear conclusions</text>
  <rect x="40" y="250" width="340" height="160" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="210" y="314" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Lawyers</text>
  <text x="210" y="337" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">facts versus opinion</text>
  <text x="210" y="359" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">scope and limits</text>
  <rect x="40" y="460" width="340" height="160" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="210" y="524" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Opposing expert</text>
  <text x="210" y="547" text-anchor="middle" font-size="16" fill="var(--danger-text)" font-family="Arial, sans-serif">method to reproduce</text>
  <text x="210" y="569" text-anchor="middle" font-size="16" fill="var(--danger-text)" font-family="Arial, sans-serif">every weakness</text>
  <rect x="900" y="40" width="340" height="160" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1070" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Investigators</text>
  <text x="1070" y="127" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">leads and timeline</text>
  <text x="1070" y="149" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">exhibit references</text>
  <rect x="900" y="250" width="340" height="160" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1070" y="314" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Management</text>
  <text x="1070" y="337" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">business impact</text>
  <text x="1070" y="359" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">one-page summary</text>
  <rect x="900" y="460" width="340" height="160" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1070" y="524" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Regulators</text>
  <text x="1070" y="547" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">compliance facts</text>
  <text x="1070" y="569" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">dates and scope</text>
  <text x="640" y="470" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">one document, many readers</text>
  <text x="640" y="500" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">write for the least technical one</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--code-bg)"/>
  <rect x="150" y="230" width="200" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250" y="265" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">Exhibits</text>
  <line x1="350" y1="260" x2="503" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="150" y="315" width="200" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="250" y="350" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">Findings</text>
  <line x1="350" y1="345" x2="503" y2="330" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="150" y="400" width="200" height="60" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="250" y="435" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">Opinions</text>
  <line x1="350" y1="430" x2="503" y2="330" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <rect x="510" y="210" width="260" height="250" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="250" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">REPORT</text>
  <line x1="545" y1="280" x2="735" y2="280" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="545" y1="302" x2="735" y2="302" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="545" y1="324" x2="675" y2="324" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="545" y1="346" x2="735" y2="346" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="545" y1="368" x2="735" y2="368" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="545" y1="390" x2="675" y2="390" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="700" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--danger-border)" font-family="Arial, sans-serif">signed</text>
  <line x1="770" y1="335" x2="923" y2="260" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="930" y="230" width="200" height="60" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1030" y="265" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">Court</text>
  <line x1="770" y1="335" x2="923" y2="345" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="930" y="315" width="200" height="60" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1030" y="350" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">Board</text>
  <line x1="770" y1="335" x2="923" y2="430" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="930" y="400" width="200" height="60" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1030" y="435" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">Regulator</text>
  <text x="640" y="120" text-anchor="middle" font-size="39" font-weight="bold" fill="var(--code-text)" font-family="Arial, sans-serif">Writing an Official Digital Forensics Report</text>
  <text x="640" y="163" text-anchor="middle" font-size="21" fill="var(--text-faint)" font-family="Arial, sans-serif">Standards, Structure, and Language of a Report That Stands Up</text>
  <text x="640" y="540" text-anchor="middle" font-size="18" fill="var(--text-muted)" font-family="Arial, sans-serif">Accurate, objective, reproducible, and clear</text>
</svg>

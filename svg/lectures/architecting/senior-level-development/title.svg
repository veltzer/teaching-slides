<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#f39c12" />
      <stop offset="100%" style="stop-color:#f1c40f" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <rect x="160" y="417" width="420" height="72.5" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="2.8444" />
  <text x="370" y="460.5" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial" font-size="18.0758">Infrastructure</text>
  <rect x="160" y="322.75" width="420" height="72.5" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="370" y="366.25" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial" font-size="18.0758">Services</text>
  <rect x="160" y="228.5" width="420" height="72.5" rx="6" fill="var(--text)" stroke="var(--danger-border)" stroke-width="2.8444" />
  <text x="370" y="272" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial" font-size="18.0758">Business Logic</text>
  <rect x="160" y="134.25" width="420" height="72.5" rx="6" fill="var(--text)" stroke="var(--info-border)" stroke-width="2.8444" />
  <text x="370" y="177.75" text-anchor="middle" fill="var(--info-accent)" font-family="Arial" font-size="18.0758">Presentation</text>
  <polygon points="865,127 883,177.75 939.9999,177.75 895,211.1 910,264.75 865,232.85 820,264.75 835,211.1 790,177.75 847,177.75" fill="url(#gold)" />
  <circle cx="790" cy="388" r="27.8088" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
  <circle cx="865" cy="344.5" r="27.8088" fill="none" stroke="var(--ok-border)" stroke-width="2.8444" />
  <circle cx="939.9999" cy="388" r="27.8088" fill="none" stroke="var(--danger-border)" stroke-width="2.8444" />
  <circle cx="865" cy="431.5" r="27.8088" fill="none" stroke="var(--info-border)" stroke-width="2.8444" />
  <line x1="820" y1="388" x2="835" y2="359" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="895" y1="359" x2="910" y2="388" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="835" y1="417" x2="820" y2="388" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="895" y1="417" x2="910" y2="388" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="835" y1="359" x2="835" y2="417" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="895" y1="359" x2="895" y2="417" stroke="var(--text-muted)" stroke-width="1.4222" />
  <text x="865" y="518.5" text-anchor="middle" fill="var(--text-faint)" font-family="Arial" font-size="16.6854">Leadership &amp; Architecture</text>
  <rect x="1060" y="156" width="135" height="130.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="1127.5" y="216.9" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial" font-size="15.2948" font-weight="bold">SENIOR</text>
  <text x="1127.5" y="240.1" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial" font-size="13.9044">LEVEL</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#f1c40f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Architecture diagram - layered boxes -->
  <rect x="80" y="260" width="280" height="50" rx="6" fill="#2c3e50" stroke="#3498db" stroke-width="2"/>
  <text x="220" y="290" text-anchor="middle" fill="#3498db" font-family="Arial" font-size="13">Infrastructure</text>
  <rect x="80" y="195" width="280" height="50" rx="6" fill="#2c3e50" stroke="#2ecc71" stroke-width="2"/>
  <text x="220" y="225" text-anchor="middle" fill="#2ecc71" font-family="Arial" font-size="13">Services</text>
  <rect x="80" y="130" width="280" height="50" rx="6" fill="#2c3e50" stroke="#e74c3c" stroke-width="2"/>
  <text x="220" y="160" text-anchor="middle" fill="#e74c3c" font-family="Arial" font-size="13">Business Logic</text>
  <rect x="80" y="65" width="280" height="50" rx="6" fill="#2c3e50" stroke="#9b59b6" stroke-width="2"/>
  <text x="220" y="95" text-anchor="middle" fill="#9b59b6" font-family="Arial" font-size="13">Presentation</text>
  <!-- Leadership star -->
  <polygon points="550,60 562,95 600,95 570,118 580,155 550,133 520,155 530,118 500,95 538,95" fill="url(#gold)"/>
  <!-- Team nodes -->
  <circle cx="500" cy="240" r="20" fill="none" stroke="#3498db" stroke-width="2"/>
  <circle cx="550" cy="210" r="20" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <circle cx="600" cy="240" r="20" fill="none" stroke="#e74c3c" stroke-width="2"/>
  <circle cx="550" cy="270" r="20" fill="none" stroke="#9b59b6" stroke-width="2"/>
  <!-- Connection lines -->
  <line x1="520" y1="240" x2="530" y2="220" stroke="#555" stroke-width="1"/>
  <line x1="570" y1="220" x2="580" y2="240" stroke="#555" stroke-width="1"/>
  <line x1="530" y1="260" x2="520" y2="240" stroke="#555" stroke-width="1"/>
  <line x1="570" y1="260" x2="580" y2="240" stroke="#555" stroke-width="1"/>
  <line x1="530" y1="220" x2="530" y2="260" stroke="#555" stroke-width="1"/>
  <line x1="570" y1="220" x2="570" y2="260" stroke="#555" stroke-width="1"/>
  <!-- Mentorship arrow -->
  <text x="550" y="330" text-anchor="middle" fill="#888" font-family="Arial" font-size="12">Leadership &amp; Architecture</text>
  <!-- Code quality badge -->
  <rect x="680" y="80" width="90" height="90" rx="45" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <text x="725" y="122" text-anchor="middle" fill="#f1c40f" font-family="Arial" font-size="11" font-weight="bold">SENIOR</text>
  <text x="725" y="138" text-anchor="middle" fill="#f1c40f" font-family="Arial" font-size="10">LEVEL</text>
</svg>
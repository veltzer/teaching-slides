<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#f39c12" />
      <stop offset="100%" style="stop-color:#f1c40f" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <rect x="160" y="417" width="420" height="72.5" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="2.8444" />
  <text x="370" y="460.5" text-anchor="middle" fill="var(--primary-accent)" font-size="18.0758" font-family="Arial, sans-serif">Infrastructure</text>
  <rect x="160" y="322.75" width="420" height="72.5" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="370" y="366.25" text-anchor="middle" fill="var(--ok-accent)" font-size="18.0758" font-family="Arial, sans-serif">Services</text>
  <rect x="160" y="228.5" width="420" height="72.5" rx="6" fill="var(--text)" stroke="var(--danger-border)" stroke-width="2.8444" />
  <text x="370" y="272" text-anchor="middle" fill="var(--danger-accent)" font-size="18.0758" font-family="Arial, sans-serif">Business Logic</text>
  <rect x="160" y="134.25" width="420" height="72.5" rx="6" fill="var(--text)" stroke="var(--info-border)" stroke-width="2.8444" />
  <text x="370" y="177.75" text-anchor="middle" fill="var(--info-accent)" font-size="18.0758" font-family="Arial, sans-serif">Presentation</text>
  <polygon points="865,127 883,177.75 939.9999,177.75 895,211.1 910,264.75 865,232.85 820,264.75 835,211.1 790,177.75 847,177.75" fill="url(#gold)" />
  <circle cx="790" cy="388" r="27.8088" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
  <circle cx="865" cy="344.5" r="27.8088" fill="none" stroke="var(--ok-border)" stroke-width="2.8444" />
  <circle cx="939.9999" cy="388" r="27.8088" fill="none" stroke="var(--danger-border)" stroke-width="2.8444" />
  <circle cx="865" cy="431.5" r="27.8088" fill="none" stroke="var(--info-border)" stroke-width="2.8444" />
  <line x1="820" y1="388" x2="835" y2="359" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="895" y1="359" x2="910" y2="388" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="835" y1="417" x2="820" y2="388" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="895" y1="417" x2="910" y2="388" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="835" y1="359" x2="835" y2="417" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="895" y1="359" x2="895" y2="417" stroke="var(--text-muted)" stroke-width="1.4222" />
  <text x="865" y="518.5" text-anchor="middle" fill="var(--text-faint)" font-size="16.6854" font-family="Arial, sans-serif">Leadership &amp; Architecture</text>
  <rect x="1060" y="156" width="135" height="130.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="1127.5" y="216.9" text-anchor="middle" fill="var(--warn-accent)" font-size="15.2948" font-weight="bold" font-family="Arial, sans-serif">SENIOR</text>
  <text x="1127.5" y="240.1" text-anchor="middle" fill="var(--warn-accent)" font-size="13.9044" font-family="Arial, sans-serif">LEVEL</text>
</svg>
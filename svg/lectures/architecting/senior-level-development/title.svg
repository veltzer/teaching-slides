<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#f39c12" />
      <stop offset="100%" style="stop-color:#f1c40f" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <rect x="113.7778" y="416" width="398.2222" height="80" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="2.8444" />
  <text x="312.8889" y="464" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial" font-size="18.4889">Infrastructure</text>
  <rect x="113.7778" y="312" width="398.2222" height="80" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="312.8889" y="360" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial" font-size="18.4889">Services</text>
  <rect x="113.7778" y="208" width="398.2222" height="80" rx="6" fill="var(--text)" stroke="var(--danger-border)" stroke-width="2.8444" />
  <text x="312.8889" y="256" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial" font-size="18.4889">Business Logic</text>
  <rect x="113.7778" y="104" width="398.2222" height="80" rx="6" fill="var(--text)" stroke="var(--info-border)" stroke-width="2.8444" />
  <text x="312.8889" y="152" text-anchor="middle" fill="var(--info-accent)" font-family="Arial" font-size="18.4889">Presentation</text>
  <polygon points="782.2222,96 799.2889,152 853.3333,152 810.6667,188.8 824.8889,248 782.2222,212.8 739.5556,248 753.7778,188.8 711.1111,152 765.1556,152" fill="url(#gold)" />
  <circle cx="711.1111" cy="384" r="28.4444" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
  <circle cx="782.2222" cy="336" r="28.4444" fill="none" stroke="var(--ok-border)" stroke-width="2.8444" />
  <circle cx="853.3333" cy="384" r="28.4444" fill="none" stroke="var(--danger-border)" stroke-width="2.8444" />
  <circle cx="782.2222" cy="432" r="28.4444" fill="none" stroke="var(--info-border)" stroke-width="2.8444" />
  <line x1="739.5556" y1="384" x2="753.7778" y2="352" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="810.6667" y1="352" x2="824.8889" y2="384" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="753.7778" y1="416" x2="739.5556" y2="384" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="810.6667" y1="416" x2="824.8889" y2="384" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="753.7778" y1="352" x2="753.7778" y2="416" stroke="var(--text-muted)" stroke-width="1.4222" />
  <line x1="810.6667" y1="352" x2="810.6667" y2="416" stroke="var(--text-muted)" stroke-width="1.4222" />
  <text x="782.2222" y="528" text-anchor="middle" fill="var(--text-faint)" font-family="Arial" font-size="17.0667">Leadership &amp; Architecture</text>
  <rect x="967.1111" y="128" width="128" height="144" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="1031.1111" y="195.2" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial" font-size="15.6444" font-weight="bold">SENIOR</text>
  <text x="1031.1111" y="220.8" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial" font-size="14.2222">LEVEL</text>
</svg>
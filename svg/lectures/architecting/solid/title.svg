<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="160" y="243" width="164.9999" height="174" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="3.5556" />
  <text x="242.5" y="301" text-anchor="middle" font-family="sans-serif" font-size="58.3986" font-weight="bold" fill="var(--danger-accent)">S</text>
  <text x="242.5" y="337.25" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--border)">Single</text>
  <text x="242.5" y="356.1" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--border)">Responsibility</text>
  <rect x="370" y="243" width="164.9999" height="174" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="3.5556" />
  <text x="452.5" y="301" text-anchor="middle" font-family="sans-serif" font-size="58.3986" font-weight="bold" fill="var(--ok-accent)">O</text>
  <text x="452.5" y="337.25" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--border)">Open</text>
  <text x="452.5" y="356.1" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--border)">Closed</text>
  <rect x="580" y="243" width="164.9999" height="174" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="3.5556" />
  <text x="662.5" y="301" text-anchor="middle" font-family="sans-serif" font-size="58.3986" font-weight="bold" fill="var(--warn-accent)">L</text>
  <text x="662.5" y="337.25" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--border)">Liskov</text>
  <text x="662.5" y="356.1" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--border)">Substitution</text>
  <rect x="790" y="243" width="164.9999" height="174" rx="6" fill="var(--primary-accent)" stroke="var(--info-border)" stroke-width="3.5556" />
  <text x="872.4999" y="301" text-anchor="middle" font-family="sans-serif" font-size="58.3986" font-weight="bold" fill="var(--info-accent)">I</text>
  <text x="872.4999" y="337.25" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--border)">Interface</text>
  <text x="872.4999" y="356.1" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--border)">Segregation</text>
  <rect x="1000" y="243" width="164.9999" height="174" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="3.5556" />
  <text x="1082.4999" y="301" text-anchor="middle" font-family="sans-serif" font-size="58.3986" font-weight="bold" fill="var(--primary-accent)">D</text>
  <text x="1082.4999" y="337.25" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--border)">Dependency</text>
  <text x="1082.4999" y="356.1" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--border)">Inversion</text>
  <line x1="160" y1="460.5" x2="1165" y2="460.5" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889 5.6889" />
  <text x="640" y="119.75" text-anchor="middle" font-family="sans-serif" font-size="38.9324" font-weight="bold" fill="var(--surface)">SOLID Principles</text>
  <text x="640" y="163.25" text-anchor="middle" font-family="sans-serif" font-size="20.8566" fill="var(--text-faint)">Object-Oriented Design Foundation</text>
  <text x="640" y="576.5" text-anchor="middle" font-family="monospace" font-size="18.0758" fill="var(--text-muted)">maintainable | testable | flexible | scalable</text>
</svg>
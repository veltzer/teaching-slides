<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Five blocks for SOLID -->
  <rect x="80" y="140" width="110" height="120" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2.5"/>
  <text x="135" y="180" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#e94560">S</text>
  <text x="135" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">Single</text>
  <text x="135" y="218" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">Responsibility</text>

  <rect x="220" y="140" width="110" height="120" rx="10" fill="#0f3460" stroke="#16c79a" stroke-width="2.5"/>
  <text x="275" y="180" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#16c79a">O</text>
  <text x="275" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">Open</text>
  <text x="275" y="218" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">Closed</text>

  <rect x="360" y="140" width="110" height="120" rx="10" fill="#0f3460" stroke="#f5a623" stroke-width="2.5"/>
  <text x="415" y="180" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#f5a623">L</text>
  <text x="415" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">Liskov</text>
  <text x="415" y="218" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">Substitution</text>

  <rect x="500" y="140" width="110" height="120" rx="10" fill="#0f3460" stroke="#a855f7" stroke-width="2.5"/>
  <text x="555" y="180" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#a855f7">I</text>
  <text x="555" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">Interface</text>
  <text x="555" y="218" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">Segregation</text>

  <rect x="640" y="140" width="110" height="120" rx="10" fill="#0f3460" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="695" y="180" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#3b82f6">D</text>
  <text x="695" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">Dependency</text>
  <text x="695" y="218" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">Inversion</text>

  <!-- Connecting line -->
  <line x1="80" y1="290" x2="750" y2="290" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Title -->
  <text x="400" y="55" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#eee">SOLID Principles</text>
  <text x="400" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#888">Object-Oriented Design Foundation</text>
  <text x="400" y="370" text-anchor="middle" font-family="monospace" font-size="13" fill="#666">maintainable | testable | flexible | scalable</text>
</svg>

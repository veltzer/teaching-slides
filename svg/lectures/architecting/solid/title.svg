<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="160" y="243" width="164.9999" height="174" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="3.5556"/>
  <text x="242.5" y="301" text-anchor="middle" font-size="58.3986" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">S</text>
  <text x="242.5" y="337.25" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Arial, sans-serif">Single</text>
  <text x="242.5" y="356.1" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Arial, sans-serif">Responsibility</text>
  <rect x="370" y="243" width="164.9999" height="174" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="3.5556"/>
  <text x="452.5" y="301" text-anchor="middle" font-size="58.3986" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">O</text>
  <text x="452.5" y="337.25" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Arial, sans-serif">Open</text>
  <text x="452.5" y="356.1" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Arial, sans-serif">Closed</text>
  <rect x="580" y="243" width="164.9999" height="174" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="3.5556"/>
  <text x="662.5" y="301" text-anchor="middle" font-size="58.3986" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">L</text>
  <text x="662.5" y="337.25" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Arial, sans-serif">Liskov</text>
  <text x="662.5" y="356.1" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Arial, sans-serif">Substitution</text>
  <rect x="790" y="243" width="164.9999" height="174" rx="6" fill="var(--primary-accent)" stroke="var(--info-border)" stroke-width="3.5556"/>
  <text x="872.4999" y="301" text-anchor="middle" font-size="58.3986" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">I</text>
  <text x="872.4999" y="337.25" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Arial, sans-serif">Interface</text>
  <text x="872.4999" y="356.1" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Arial, sans-serif">Segregation</text>
  <rect x="1000" y="243" width="164.9999" height="174" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="3.5556"/>
  <text x="1082.4999" y="301" text-anchor="middle" font-size="58.3986" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">D</text>
  <text x="1082.4999" y="337.25" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Arial, sans-serif">Dependency</text>
  <text x="1082.4999" y="356.1" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Arial, sans-serif">Inversion</text>
  <line x1="160" y1="460.5" x2="1165" y2="460.5" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889 5.6889"/>
  <text x="640" y="119.75" text-anchor="middle" font-size="38.9324" font-weight="bold" fill="var(--surface)" font-family="Arial, sans-serif">SOLID Principles</text>
  <text x="640" y="163.25" text-anchor="middle" font-size="20.8566" fill="var(--text-faint)" font-family="Arial, sans-serif">Object-Oriented Design Foundation</text>
  <text x="640" y="576.5" text-anchor="middle" font-size="18.0758" fill="var(--text-muted)" font-family="Courier New, monospace">maintainable | testable | flexible | scalable</text>
</svg>

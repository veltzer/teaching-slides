<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="283.1859" y="55.7522" width="226.5487" height="66.9027" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="396.4602" y="94.7788" text-anchor="middle" font-family="Arial" font-size="17.8407" font-weight="bold">AreaCalculator</text>
  <rect x="56.6372" y="223.0088" width="113.2743" height="55.7522" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="113.2743" y="256.4602" text-anchor="middle" font-family="Arial" font-size="15.6106">Rectangle</text>
  <rect x="226.5487" y="223.0088" width="113.2743" height="55.7522" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="283.1859" y="256.4602" text-anchor="middle" font-family="Arial" font-size="15.6106">Circle</text>
  <rect x="396.4602" y="223.0088" width="113.2743" height="55.7522" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="453.0973" y="256.4602" text-anchor="middle" font-family="Arial" font-size="15.6106">Triangle</text>
  <rect x="566.3716" y="223.0088" width="147.2566" height="55.7522" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" stroke-dasharray="5.5752 5.5752" />
  <text x="640" y="256.4602" text-anchor="middle" font-family="Arial" font-size="15.6106">Future Shapes...</text>
  <path d="M 339.823 122.6549 L 113.2743 223.0088" stroke="var(--danger-border)" stroke-width="2.2301" marker-end="url(#arrow-danger)" />
  <text x="203.8938" y="172.8319" font-family="Arial" font-size="12.2655" fill="var(--danger-accent)">instanceof</text>
  <path d="M 373.8053 122.6549 L 283.1859 223.0088" stroke="var(--danger-border)" stroke-width="2.2301" marker-end="url(#arrow-danger)" />
  <text x="317.1681" y="172.8319" font-family="Arial" font-size="12.2655" fill="var(--danger-accent)">instanceof</text>
  <path d="M 419.115 122.6549 L 453.0973 223.0088" stroke="var(--danger-border)" stroke-width="2.2301" marker-end="url(#arrow-danger)" />
  <text x="430.4424" y="172.8319" font-family="Arial" font-size="12.2655" fill="var(--danger-accent)">instanceof</text>
  <path d="M 475.7522 122.6549 L 640 223.0088" stroke="var(--warn-border)" stroke-width="2.2301" stroke-dasharray="5.5752 5.5752" marker-end="url(#arrow-warn)" />
  <text x="543.7168" y="172.8319" font-family="Arial" font-size="12.2655" fill="var(--warn-accent)">instanceof</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.4857,0" fill="#d32f2f" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.4857,0" fill="#f39c12" />
    </marker>
  </defs>
  <text x="396.4602" y="356.8141" text-anchor="middle" font-family="Arial" font-size="12.2655" fill="var(--danger-accent)">Must modify AreaCalculator for each new shape</text>
  <text x="396.4602" y="379.115" text-anchor="middle" font-family="Arial" font-size="12.2655" fill="var(--danger-accent)">Violation of Open/Closed Principle</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="453.7934" y="40" width="413.7934" height="120.0002" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="660.6898" y="110.0001" text-anchor="middle" font-size="32.2918" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">AreaCalculator</text>
  <rect x="40" y="340.0001" width="206.8967" height="100.0001" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="143.4481" y="400.0001" text-anchor="middle" font-size="28.2553" font-family="Arial, sans-serif" fill="var(--text)">Rectangle</text>
  <rect x="350.3449" y="340.0001" width="206.8967" height="100.0001" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="453.7934" y="400.0001" text-anchor="middle" font-size="28.2553" font-family="Arial, sans-serif" fill="var(--text)">Circle</text>
  <rect x="660.6898" y="340.0001" width="206.8967" height="100.0001" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="764.1379" y="400.0001" text-anchor="middle" font-size="28.2553" font-family="Arial, sans-serif" fill="var(--text)">Triangle</text>
  <rect x="971.0346" y="340.0001" width="268.9654" height="100.0001" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" stroke-dasharray="2.1355 2.1355" filter="url(#shadow)"/>
  <text x="1105.5176" y="400.0001" text-anchor="middle" font-size="28.2553" font-family="Arial, sans-serif" fill="var(--warn-text)">Future Shapes...</text>
  <path d="M 557.2414 160 L 143.4481 340.0001" stroke="var(--danger-border)" stroke-width="0.8542" marker-end="url(#arrow-danger)" />
  <text x="308.9654" y="250" font-size="22.2006" fill="var(--danger-accent)" font-family="Arial, sans-serif">instanceof</text>
  <path d="M 619.3104 160 L 453.7934 340.0001" stroke="var(--danger-border)" stroke-width="0.8542" marker-end="url(#arrow-danger)" />
  <text x="515.8621" y="250" font-size="22.2006" fill="var(--danger-accent)" font-family="Arial, sans-serif">instanceof</text>
  <path d="M 702.0691 160 L 764.1379 340.0001" stroke="var(--danger-border)" stroke-width="0.8542" marker-end="url(#arrow-danger)" />
  <text x="722.7586" y="250" font-size="22.2006" fill="var(--danger-accent)" font-family="Arial, sans-serif">instanceof</text>
  <path d="M 805.5174 160 L 1105.5176 340.0001" stroke="var(--warn-border)" stroke-width="0.8542" stroke-dasharray="2.1355 2.1355" marker-end="url(#arrow-warn)" />
  <text x="929.6555" y="250" font-size="22.2006" fill="var(--warn-accent)" font-family="Arial, sans-serif">instanceof</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="660.6898" y="579.9999" text-anchor="middle" font-size="22.2006" fill="var(--danger-accent)" font-family="Arial, sans-serif">Must modify AreaCalculator for each new shape</text>
  <text x="660.6898" y="620" text-anchor="middle" font-size="22.2006" fill="var(--danger-accent)" font-family="Arial, sans-serif">Violation of Open/Closed Principle</text>
</svg>
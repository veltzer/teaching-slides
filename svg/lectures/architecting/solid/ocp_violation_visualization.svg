<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="482.3647" y="80" width="350.3011" height="103.4484" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="9.2775" />
  <text x="657.5152" y="140.3449" text-anchor="middle" font-family="Arial" font-size="27.5862" font-weight="bold">AreaCalculator</text>
  <rect x="132.0636" y="338.6207" width="175.1505" height="86.2069" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.2775" />
  <text x="219.6387" y="390.3449" text-anchor="middle" font-family="Arial" font-size="24.1379">Rectangle</text>
  <rect x="394.7894" y="338.6207" width="175.1505" height="86.2069" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.2775" />
  <text x="482.3647" y="390.3449" text-anchor="middle" font-family="Arial" font-size="24.1379">Circle</text>
  <rect x="657.5152" y="338.6207" width="175.1505" height="86.2069" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.2775" />
  <text x="745.0903" y="390.3449" text-anchor="middle" font-family="Arial" font-size="24.1379">Triangle</text>
  <rect x="920.2408" y="338.6207" width="227.6956" height="86.2069" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="9.2775" stroke-dasharray="5.5752 5.5752" />
  <text x="1034.0888" y="390.3449" text-anchor="middle" font-family="Arial" font-size="24.1379">Future Shapes...</text>
  <path d="M 569.9398 183.4484 L 219.6387 338.6207" stroke="var(--danger-border)" stroke-width="2.2301" marker-end="url(#arrow-danger)" />
  <text x="359.7592" y="261.0346" font-family="Arial" font-size="18.9655" fill="var(--danger-accent)">instanceof</text>
  <path d="M 622.485 183.4484 L 482.3647 338.6207" stroke="var(--danger-border)" stroke-width="2.2301" marker-end="url(#arrow-danger)" />
  <text x="534.9097" y="261.0346" font-family="Arial" font-size="18.9655" fill="var(--danger-accent)">instanceof</text>
  <path d="M 692.5452 183.4484 L 745.0903 338.6207" stroke="var(--danger-border)" stroke-width="2.2301" marker-end="url(#arrow-danger)" />
  <text x="710.0602" y="261.0346" font-family="Arial" font-size="18.9655" fill="var(--danger-accent)">instanceof</text>
  <path d="M 780.1205 183.4484 L 1034.0888 338.6207" stroke="var(--warn-border)" stroke-width="2.2301" stroke-dasharray="5.5752 5.5752" marker-end="url(#arrow-warn)" />
  <text x="885.2108" y="261.0346" font-family="Arial" font-size="18.9655" fill="var(--warn-accent)">instanceof</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.4857,0" fill="#d32f2f" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.4857,0" fill="#f39c12" />
    </marker>
  </defs>
  <text x="657.5152" y="545.5172" text-anchor="middle" font-family="Arial" font-size="18.9655" fill="var(--danger-accent)">Must modify AreaCalculator for each new shape</text>
  <text x="657.5152" y="580" text-anchor="middle" font-family="Arial" font-size="18.9655" fill="var(--danger-accent)">Violation of Open/Closed Principle</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="367.2728" y="40" width="545.4546" height="140.6061" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" stroke-dasharray="3.3712 3.3712" filter="url(#shadow)"/>
  <text x="639.9997" y="83.9393" text-anchor="middle" font-size="24.1329" font-style="italic" font-family="Arial, sans-serif" fill="var(--primary-text)">«interface»</text>
  <text x="639.9997" y="119.0909" text-anchor="middle" font-size="32.1771" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Shape</text>
  <line x1="367.2728" y1="136.6667" x2="912.727" y2="136.6667" stroke="var(--primary-border)" stroke-width="0.6743" />
  <text x="639.9997" y="163.0304" text-anchor="middle" font-size="24.1329" font-family="Arial, sans-serif" fill="var(--primary-text)">+ calculateArea(): double</text>
  <rect x="40" y="338.7881" width="490.9092" height="210.9091" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="285.4546" y="391.5151" text-anchor="middle" font-size="32.1771" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Rectangle</text>
  <line x1="40" y1="409.0909" x2="530.909" y2="409.0909" stroke="var(--ok-border)" stroke-width="0.6743" />
  <text x="67.2727" y="444.2424" font-size="24.1329" font-family="Arial, sans-serif" fill="var(--ok-text)">- width: double</text>
  <text x="67.2727" y="479.3939" font-size="24.1329" font-family="Arial, sans-serif" fill="var(--ok-text)">- height: double</text>
  <line x1="40" y1="496.9697" x2="530.909" y2="496.9697" stroke="var(--ok-border)" stroke-width="0.6743" />
  <text x="67.2727" y="532.1212" font-size="24.1329" font-family="Arial, sans-serif" fill="var(--ok-text)">+ calculateArea(): double</text>
  <rect x="749.0908" y="338.7881" width="490.9092" height="210.9091" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="994.5452" y="391.5151" text-anchor="middle" font-size="32.1771" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Circle</text>
  <line x1="749.0908" y1="409.0909" x2="1239.9998" y2="409.0909" stroke="var(--ok-border)" stroke-width="0.6743" />
  <text x="776.3636" y="444.2424" font-size="24.1329" font-family="Arial, sans-serif" fill="var(--ok-text)">- radius: double</text>
  <line x1="749.0908" y1="496.9697" x2="1239.9998" y2="496.9697" stroke="var(--ok-border)" stroke-width="0.6743" />
  <text x="776.3636" y="532.1212" font-size="24.1329" font-family="Arial, sans-serif" fill="var(--ok-text)">+ calculateArea(): double</text>
  <path d="M 285.4546 338.7881 L 585.4544 180.6061" stroke="var(--ok-border)" stroke-width="1.3484" stroke-dasharray="3.3712 3.3712" />
  <polygon points="585.4544,180.6061 571.8182,198.182 599.0909,198.182" fill="none" stroke="var(--ok-border)" stroke-width="1.3484" />
  <path d="M 994.5452 338.7881 L 694.5454 180.6061" stroke="var(--ok-border)" stroke-width="1.3484" stroke-dasharray="3.3712 3.3712" />
  <polygon points="694.5454,180.6061 680.9089,198.182 708.1816,198.182" fill="none" stroke="var(--ok-border)" stroke-width="1.3484" />
  <text x="639.9997" y="620" text-anchor="middle" font-size="22.1219" fill="var(--ok-accent)" font-family="Arial, sans-serif">Open for extension, closed for modification</text>
</svg>
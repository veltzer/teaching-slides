  <path d="M 640 276.2791 L 476.2791 163.2558" stroke="var(--ok-border)" stroke-width="2.5116" stroke-dasharray="6.2791 6.2791" />
  <polygon points="476.2791,163.2558 468.8372,175.814 483.7209,175.814" fill="none" stroke="var(--ok-border)" stroke-width="2.5116" />
  <text x="446.5116" y="477.2093" text-anchor="middle" font-family="Arial" font-size="13.814" fill="var(--ok-accent)">Open for extension, closed for modification</text>
</svg>
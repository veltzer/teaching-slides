<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="497.7778" y="72" width="284.4444" height="144" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="640" y="115.2" text-anchor="middle" font-family="Arial" font-size="22.7556" font-weight="bold">Employee</text>
  <line x1="497.7778" y1="129.6" x2="782.2222" y2="129.6" stroke="var(--ok-border)" stroke-width="1.4222" />
  <text x="512" y="158.4" font-family="Arial" font-size="17.0667">- name: String</text>
  <text x="512" y="187.2" font-family="Arial" font-size="17.0667">- salary: double</text>
  <rect x="71.1111" y="360" width="227.5556" height="115.2" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="184.8889" y="403.2" text-anchor="middle" font-family="Arial" font-size="19.9111" font-weight="bold">PayrollCalculator</text>
  <line x1="71.1111" y1="417.6" x2="298.6667" y2="417.6" stroke="var(--primary-border)" stroke-width="1.4222" />
  <text x="85.3333" y="446.4" font-family="Arial" font-size="17.0667">+ calculatePay(Employee)</text>
  <rect x="355.5556" y="360" width="227.5556" height="115.2" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="469.3333" y="403.2" text-anchor="middle" font-family="Arial" font-size="19.9111" font-weight="bold">EmployeeRepository</text>
  <line x1="355.5556" y1="417.6" x2="583.1111" y2="417.6" stroke="var(--primary-border)" stroke-width="1.4222" />
  <text x="369.7778" y="446.4" font-family="Arial" font-size="17.0667">+ save(Employee)</text>
  <rect x="640" y="360" width="227.5556" height="115.2" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="753.7778" y="403.2" text-anchor="middle" font-family="Arial" font-size="19.9111" font-weight="bold">ReportGenerator</text>
  <line x1="640" y1="417.6" x2="867.5556" y2="417.6" stroke="var(--primary-border)" stroke-width="1.4222" />
  <text x="654.2222" y="446.4" font-family="Arial" font-size="17.0667">+ generateReport(Employee)</text>
  <rect x="924.4444" y="360" width="256" height="115.2" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="1052.4444" y="403.2" text-anchor="middle" font-family="Arial" font-size="19.9111" font-weight="bold">EmailService</text>
  <line x1="924.4444" y1="417.6" x2="1180.4444" y2="417.6" stroke="var(--primary-border)" stroke-width="1.4222" />
  <text x="938.6667" y="446.4" font-family="Arial" font-size="17.0667">+ sendEmail(String, String)</text>
  <line x1="184.8889" y1="360" x2="568.8889" y2="216" stroke="var(--ok-border)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <line x1="469.3333" y1="360" x2="611.5556" y2="216" stroke="var(--ok-border)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <line x1="753.7778" y1="360" x2="668.4444" y2="216" stroke="var(--ok-border)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 4.2667,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="640" y="576" text-anchor="middle" font-family="Arial" font-size="15.6444" fill="var(--ok-accent)">Single Responsibility: Each class has one job</text>
</svg>
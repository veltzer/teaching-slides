<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="501.5385" y="40" width="307.6923" height="165.7143" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="655.3846" y="89.7143" text-anchor="middle" font-size="25.3891" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Employee</text>
  <line x1="501.5385" y1="106.2857" x2="809.2308" y2="106.2857" stroke="var(--ok-border)" stroke-width="1.4222" />
  <text x="516.9231" y="139.4286" font-size="19.0418" font-family="Arial, sans-serif" fill="var(--ok-text)">- name: String</text>
  <text x="516.9231" y="172.5714" font-size="19.0418" font-family="Arial, sans-serif" fill="var(--ok-text)">- salary: double</text>
  <rect x="40" y="371.4286" width="246.1539" height="132.5714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="163.077" y="421.1429" text-anchor="middle" font-size="22.2154" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">PayrollCalculator</text>
  <line x1="40" y1="437.7143" x2="286.1539" y2="437.7143" stroke="var(--primary-border)" stroke-width="1.4222" />
  <text x="55.3846" y="470.8571" font-size="19.0418" font-family="Arial, sans-serif" fill="var(--primary-text)">+ calculatePay(Employee)</text>
  <rect x="347.6924" y="371.4286" width="246.1539" height="132.5714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="470.7692" y="421.1429" text-anchor="middle" font-size="22.2154" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">EmployeeRepository</text>
  <line x1="347.6924" y1="437.7143" x2="593.8462" y2="437.7143" stroke="var(--primary-border)" stroke-width="1.4222" />
  <text x="363.077" y="470.8571" font-size="19.0418" font-family="Arial, sans-serif" fill="var(--primary-text)">+ save(Employee)</text>
  <rect x="655.3846" y="371.4286" width="246.1539" height="132.5714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="778.4616" y="421.1429" text-anchor="middle" font-size="22.2154" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">ReportGenerator</text>
  <line x1="655.3846" y1="437.7143" x2="901.5385" y2="437.7143" stroke="var(--primary-border)" stroke-width="1.4222" />
  <text x="670.7692" y="470.8571" font-size="19.0418" font-family="Arial, sans-serif" fill="var(--primary-text)">+ generateReport(Employee)</text>
  <rect x="963.0769" y="371.4286" width="276.9231" height="132.5714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1101.5385" y="421.1429" text-anchor="middle" font-size="22.2154" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">EmailService</text>
  <line x1="963.0769" y1="437.7143" x2="1240" y2="437.7143" stroke="var(--primary-border)" stroke-width="1.4222" />
  <text x="978.4616" y="470.8571" font-size="19.0418" font-family="Arial, sans-serif" fill="var(--primary-text)">+ sendEmail(String, String)</text>
  <line x1="163.077" y1="371.4286" x2="578.4616" y2="205.7143" stroke="var(--ok-border)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <line x1="470.7692" y1="371.4286" x2="624.6155" y2="205.7143" stroke="var(--ok-border)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <line x1="778.4616" y1="371.4286" x2="686.1538" y2="205.7143" stroke="var(--ok-border)" stroke-width="1.4222" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="655.3846" y="620" text-anchor="middle" font-size="17.4549" fill="var(--ok-accent)" font-family="Arial, sans-serif">Single Responsibility: Each class has one job</text>
</svg>
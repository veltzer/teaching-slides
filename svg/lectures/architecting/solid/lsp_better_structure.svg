<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="380" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="80" text-anchor="middle" font-size="16" font-style="italic" fill="var(--primary-text)">«interface»</text>
  <text x="230" y="115" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-text)">Bird</text>
  <line x1="40" y1="135" x2="420" y2="135" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="230" y="170" text-anchor="middle" font-size="18" fill="var(--primary-text)">+ move()</text>

  <rect x="860" y="40" width="380" height="160" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="80" text-anchor="middle" font-size="16" font-style="italic" fill="var(--info-text)">«interface»</text>
  <text x="1050" y="115" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--info-text)">FlyingBird extends Bird</text>
  <line x1="860" y1="135" x2="1240" y2="135" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1050" y="170" text-anchor="middle" font-size="18" fill="var(--info-text)">+ fly()</text>

  <line x1="860" y1="120" x2="420" y2="120" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="640" y="112" text-anchor="middle" font-size="14" fill="var(--text-muted)">extends</text>

  <rect x="40" y="260" width="580" height="200" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="300" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)">Penguin implements Bird</text>
  <line x1="40" y1="320" x2="620" y2="320" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="330" y="360" text-anchor="middle" font-size="18" fill="var(--ok-text)">+ move() — waddle, swim</text>
  <text x="330" y="395" text-anchor="middle" font-size="15" fill="var(--ok-text)">Flightless; never promised fly()</text>
  <text x="330" y="425" text-anchor="middle" font-size="15" fill="var(--ok-text)">Safe substitution for any Bird</text>

  <rect x="660" y="260" width="580" height="200" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="300" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)">Sparrow implements FlyingBird</text>
  <line x1="660" y1="320" x2="1240" y2="320" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="950" y="360" text-anchor="middle" font-size="18" fill="var(--ok-text)">+ move(), + fly()</text>
  <text x="950" y="395" text-anchor="middle" font-size="15" fill="var(--ok-text)">Honors fly() contract</text>
  <text x="950" y="425" text-anchor="middle" font-size="15" fill="var(--ok-text)">Safe substitution for FlyingBird</text>

  <line x1="330" y1="260" x2="330" y2="200" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="950" y1="260" x2="950" y2="200" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <rect x="40" y="490" width="1200" height="130" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="525" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">LSP satisfied</text>
  <text x="640" y="560" text-anchor="middle" font-size="15" fill="var(--text-muted)">Capability split into two interfaces — every subtype keeps every method it inherits</text>
  <text x="640" y="590" text-anchor="middle" font-size="15" fill="var(--text-muted)">Code written against Bird or FlyingBird works for every subtype without surprises</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="380" height="160" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="80" text-anchor="middle" font-size="16" font-style="italic" fill="var(--primary-text)" font-family="Arial, sans-serif">«interface»</text>
  <text x="230" y="115" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Bird</text>
  <line x1="40" y1="135" x2="420" y2="135" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="230" y="170" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">+ move()</text>

  <rect x="860" y="40" width="380" height="160" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="80" text-anchor="middle" font-size="16" font-style="italic" fill="var(--info-text)" font-family="Arial, sans-serif">«interface»</text>
  <text x="1050" y="115" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">FlyingBird extends Bird</text>
  <line x1="860" y1="135" x2="1240" y2="135" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1050" y="170" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">+ fly()</text>

  <line x1="860" y1="120" x2="420" y2="120" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="640" y="112" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">extends</text>

  <rect x="40" y="260" width="580" height="200" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="300" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Penguin implements Bird</text>
  <line x1="40" y1="320" x2="620" y2="320" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="330" y="360" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">+ move() — waddle, swim</text>
  <text x="330" y="395" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">Flightless; never promised fly()</text>
  <text x="330" y="425" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">Safe substitution for any Bird</text>

  <rect x="660" y="260" width="580" height="200" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="300" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Sparrow implements FlyingBird</text>
  <line x1="660" y1="320" x2="1240" y2="320" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="950" y="360" text-anchor="middle" font-size="18" fill="var(--ok-text)" font-family="Arial, sans-serif">+ move(), + fly()</text>
  <text x="950" y="395" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">Honors fly() contract</text>
  <text x="950" y="425" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">Safe substitution for FlyingBird</text>

  <line x1="330" y1="260" x2="330" y2="200" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="950" y1="260" x2="950" y2="200" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <rect x="40" y="490" width="1200" height="130" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="525" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LSP satisfied</text>
  <text x="640" y="560" text-anchor="middle" font-size="15" fill="var(--text-muted)" font-family="Arial, sans-serif">Capability split into two interfaces — every subtype keeps every method it inherits</text>
  <text x="640" y="590" text-anchor="middle" font-size="15" fill="var(--text-muted)" font-family="Arial, sans-serif">Code written against Bird or FlyingBird works for every subtype without surprises</text>
</svg>

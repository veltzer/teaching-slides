<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="320" y="56" width="192" height="78.4" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" stroke-dasharray="5.6 5.6" />
  <text x="416" y="84" text-anchor="middle" font-family="Arial" font-size="13.44" font-style="italic">«interface»</text>
  <text x="416" y="106.4" text-anchor="middle" font-family="Arial" font-size="17.92" font-weight="bold">Bird</text>
  <line x1="320" y1="112" x2="512" y2="112" stroke="var(--primary-border)" stroke-width="1.12" />
  <text x="416" y="128.8" text-anchor="middle" font-family="Arial" font-size="13.44">+ move()</text>
  <rect x="576" y="156.8" width="192" height="100.8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" stroke-dasharray="5.6 5.6" />
  <text x="672" y="184.8" text-anchor="middle" font-family="Arial" font-size="13.44" font-style="italic">«interface»</text>
  <text x="672" y="207.2" text-anchor="middle" font-family="Arial" font-size="17.92" font-weight="bold">FlyingBird</text>
  <line x1="576" y1="218.4" x2="768" y2="218.4" stroke="var(--primary-border)" stroke-width="1.12" />
  <text x="672" y="235.2" text-anchor="middle" font-family="Arial" font-size="13.44">+ move()</text>
  <text x="672" y="252" text-anchor="middle" font-family="Arial" font-size="13.44">+ fly()</text>
  <rect x="486.4" y="313.6" width="153.6" height="112" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="563.2" y="341.6" text-anchor="middle" font-family="Arial" font-size="17.92" font-weight="bold">Sparrow</text>
  <line x1="486.4" y1="352.8" x2="640" y2="352.8" stroke="var(--ok-border)" stroke-width="1.12" />
  <text x="499.2" y="375.2" font-family="Arial" font-size="13.44">+ move()</text>
  <text x="499.2" y="397.6" font-family="Arial" font-size="13.44">+ fly()</text>
  <rect x="192" y="313.6" width="153.6" height="112" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="268.8" y="341.6" text-anchor="middle" font-family="Arial" font-size="17.92" font-weight="bold">Penguin</text>
  <line x1="192" y1="352.8" x2="345.6" y2="352.8" stroke="var(--ok-border)" stroke-width="1.12" />
  <text x="204.8" y="375.2" font-family="Arial" font-size="13.44">+ move()</text>
  <path d="M 512 134.4 L 576 156.8" stroke="var(--primary-border)" stroke-width="2.24" marker-end="url(#arrow-primary)" />
  <path d="M 563.2 313.6 L 640 257.6" stroke="var(--ok-border)" stroke-width="2.24" stroke-dasharray="5.6 5.6" />
  <polygon points="640,257.6 633.6,268.8 646.4,268.8" fill="none" stroke="var(--ok-border)" stroke-width="2.24" />
  <path d="M 268.8 313.6 L 371.2 134.4" stroke="var(--ok-border)" stroke-width="2.24" stroke-dasharray="5.6 5.6" />
  <polygon points="371.2,134.4 364.8,145.6 377.6,145.6" fill="none" stroke="var(--ok-border)" stroke-width="2.24" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.4857,0" fill="#0277bd" />
    </marker>
  </defs>
  <text x="448" y="470.4" text-anchor="middle" font-family="Arial" font-size="12.32" fill="var(--ok-accent)">Correct hierarchy - Penguins can substitute Birds</text>
  <text x="448" y="487.2" text-anchor="middle" font-family="Arial" font-size="12.32" fill="var(--ok-accent)">Sparrows can substitute FlyingBirds</text>
</svg>
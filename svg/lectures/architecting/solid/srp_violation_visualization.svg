<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="427.0967" y="40" width="580.6451" height="351.5151" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="717.4193" y="92.7273" text-anchor="middle" font-size="27.8224" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Employee</text>
  <line x1="427.0967" y1="110.303" x2="1007.7419" y2="110.303" stroke="var(--primary-border)" stroke-width="1.4971" />
  <text x="446.4516" y="145.4546" font-size="20.8668" font-family="Arial, sans-serif" fill="var(--text)">- name: String</text>
  <text x="446.4516" y="180.6061" font-size="20.8668" font-family="Arial, sans-serif" fill="var(--text)">- salary: double</text>
  <line x1="427.0967" y1="198.1819" x2="1007.7419" y2="198.1819" stroke="var(--primary-border)" stroke-width="1.4971" />
  <text x="446.4516" y="233.3334" font-size="20.8668" font-family="Arial, sans-serif" fill="var(--text)">+ calculatePay()</text>
  <text x="446.4516" y="268.4849" font-size="20.8668" font-family="Arial, sans-serif" fill="var(--text)">+ saveToDatabase()</text>
  <text x="446.4516" y="303.6364" font-size="20.8668" font-family="Arial, sans-serif" fill="var(--text)">+ generateReport()</text>
  <text x="446.4516" y="338.7879" font-size="20.8668" font-family="Arial, sans-serif" fill="var(--text)">+ sendEmail()</text>
  <rect x="40" y="479.394" width="232.258" height="70.303" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="156.1291" y="523.3333" text-anchor="middle" font-size="20.8668" font-family="Arial, sans-serif" fill="var(--danger-text)">PayrollDepartment</text>
  <rect x="427.0967" y="479.394" width="154.8387" height="70.303" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="504.516" y="523.3333" text-anchor="middle" font-size="20.8668" font-family="Arial, sans-serif" fill="var(--danger-text)">HR</text>
  <rect x="736.7742" y="479.394" width="193.5484" height="70.303" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="833.5484" y="523.3333" text-anchor="middle" font-size="20.8668" font-family="Arial, sans-serif" fill="var(--danger-text)">Reporting</text>
  <rect x="1085.1613" y="479.394" width="154.8387" height="70.303" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1162.5806" y="523.3333" text-anchor="middle" font-size="20.8668" font-family="Arial, sans-serif" fill="var(--danger-text)">IT</text>
  <line x1="272.258" y1="479.394" x2="620.6451" y2="391.5151" stroke="var(--danger-border)" stroke-width="1.4971" stroke-dasharray="7.4854 7.4854" />
  <line x1="504.516" y1="479.394" x2="678.7096" y2="391.5151" stroke="var(--danger-border)" stroke-width="1.4971" stroke-dasharray="7.4854 7.4854" />
  <line x1="833.5484" y1="479.394" x2="775.4838" y2="391.5151" stroke="var(--danger-border)" stroke-width="1.4971" stroke-dasharray="7.4854 7.4854" />
  <line x1="1085.1613" y1="514.5455" x2="872.258" y2="391.5151" stroke="var(--danger-border)" stroke-width="1.4971" stroke-dasharray="7.4854 7.4854" />
  <text x="717.4193" y="620" text-anchor="middle" font-size="19.1279" fill="var(--danger-accent)" font-family="Arial, sans-serif">Multiple responsibilities = Violation of SRP</text>
</svg>
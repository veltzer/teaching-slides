  <line x1="434.152" y1="505.2632" x2="568.8889" y2="421.0526" stroke="var(--danger-border)" stroke-width="1.4971" stroke-dasharray="7.4854 7.4854" />
  <line x1="688.655" y1="505.2632" x2="643.7427" y2="421.0526" stroke="var(--danger-border)" stroke-width="1.4971" stroke-dasharray="7.4854 7.4854" />
  <line x1="883.2749" y1="538.9474" x2="718.5965" y2="421.0526" stroke="var(--danger-border)" stroke-width="1.4971" stroke-dasharray="7.4854 7.4854" />
  <text x="598.8304" y="640" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--danger-accent)">Multiple responsibilities = Violation of SRP</text>
</svg>
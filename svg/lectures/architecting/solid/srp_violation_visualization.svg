  <line x1="504.516" y1="479.394" x2="678.7096" y2="391.5151" stroke="var(--danger-border)" stroke-width="1.4971" stroke-dasharray="7.4854 7.4854" />
  <line x1="833.5484" y1="479.394" x2="775.4838" y2="391.5151" stroke="var(--danger-border)" stroke-width="1.4971" stroke-dasharray="7.4854 7.4854" />
  <line x1="1085.1613" y1="514.5455" x2="872.258" y2="391.5151" stroke="var(--danger-border)" stroke-width="1.4971" stroke-dasharray="7.4854 7.4854" />
  <text x="717.4193" y="620" text-anchor="middle" font-family="Arial" font-size="19.1279" fill="var(--danger-accent)">Multiple responsibilities = Violation of SRP</text>
</svg>
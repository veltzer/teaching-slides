  <rect x="40" y="479.394" width="232.258" height="70.303" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="156.1291" y="523.3333" text-anchor="middle" font-family="Arial" font-size="20.8668">PayrollDepartment</text>

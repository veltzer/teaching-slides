<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="307.5075" y="172.973" width="615.015" height="345.9459" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="615.015" y="224.8649" text-anchor="middle" font-family="Arial" font-size="31.1351" font-weight="bold">Order</text>
  <line x1="307.5075" y1="242.1622" x2="922.5225" y2="242.1622" stroke="var(--danger-border)" stroke-width="1.7297" />
  <text x="328.008" y="276.7568" font-family="Arial" font-size="20.7568">- items: List&lt;Item&gt;</text>
  <line x1="307.5075" y1="294.0541" x2="922.5225" y2="294.0541" stroke="var(--danger-border)" stroke-width="1.7297" />
  <text x="328.008" y="328.6486" font-family="Arial" font-size="20.7568">+ addItem(Item)</text>
  <text x="328.008" y="363.2432" font-family="Arial" font-size="20.7568">+ calculateTotal()</text>
  <text x="328.008" y="397.8378" font-family="Arial" font-size="20.7568">+ processPayment()</text>
  <text x="328.008" y="432.4324" font-family="Arial" font-size="20.7568">+ saveToDatabase()</text>
  <text x="328.008" y="467.027" font-family="Arial" font-size="20.7568">+ sendConfirmationEmail()</text>
  <text x="328.008" y="501.6216" font-family="Arial" font-size="20.7568">+ generateInvoice()</text>
  <text x="615.015" y="86.4865" text-anchor="middle" font-family="Arial" font-size="34.5946" font-weight="bold" fill="var(--danger-accent)">God Class Anti-Pattern</text>
  <text x="615.015" y="588.1081" text-anchor="middle" font-family="Arial" font-size="19.027" fill="var(--danger-accent)">Multiple responsibilities in a single class</text>
  <text x="615.015" y="614.0541" text-anchor="middle" font-family="Arial" font-size="19.027" fill="var(--danger-accent)">Violates: SRP, OCP, DIP</text>
  <text x="615.015" y="640" text-anchor="middle" font-family="Arial" font-size="19.027" fill="var(--danger-accent)">Hard to test, maintain, and extend</text>
</svg>
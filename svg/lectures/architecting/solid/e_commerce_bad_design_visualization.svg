<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--danger-accent)">God Class Anti-Pattern</text>

  <rect x="40" y="90" width="1200" height="440" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--danger-text)">Order</text>
  <line x1="40" y1="165" x2="1240" y2="165" stroke="var(--danger-border)" stroke-width="2"/>

  <text x="80" y="210" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">- items: List&lt;Item&gt;</text>
  <text x="80" y="245" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">- customer: Customer</text>
  <line x1="40" y1="265" x2="1240" y2="265" stroke="var(--danger-border)" stroke-width="2"/>

  <text x="80" y="305" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">+ addItem(Item)                       inventory concern</text>
  <text x="80" y="340" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">+ calculateTotal()                    pricing concern</text>
  <text x="80" y="375" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">+ processPayment()              payment concern</text>
  <text x="80" y="410" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">+ saveToDatabase()               persistence concern</text>
  <text x="80" y="445" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">+ sendConfirmationEmail()   notification concern</text>
  <text x="80" y="480" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">+ generateInvoice()               reporting concern</text>
  <text x="80" y="515" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">+ shipOrder()                            logistics concern</text>

  <rect x="40" y="545" width="1200" height="75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-accent)">Violates SRP, OCP, DIP</text>
  <text x="640" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">One class touches every concern — hard to test, maintain, or extend</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.807319" font-weight="bold" fill="var(--danger-accent)">God Class Anti-Pattern</text>

  <rect x="40" y="61.090909" width="1200" height="464" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="119.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.807319" font-weight="bold" fill="var(--danger-text)">Order</text>
  <line x1="40" y1="140.181818" x2="1240" y2="140.181818" stroke="var(--danger-border)" stroke-width="2"/>

  <text x="80" y="187.636364" font-family="Arial, sans-serif" font-size="22.592034" fill="var(--danger-text)">- items: List&lt;Item&gt;</text>
  <text x="80" y="224.545455" font-family="Arial, sans-serif" font-size="22.592034" fill="var(--danger-text)">- customer: Customer</text>
  <line x1="40" y1="245.636364" x2="1240" y2="245.636364" stroke="var(--danger-border)" stroke-width="2"/>

  <text x="80" y="287.818182" font-family="Arial, sans-serif" font-size="22.592034" fill="var(--danger-text)">+ addItem(Item)                       inventory concern</text>
  <text x="80" y="324.727273" font-family="Arial, sans-serif" font-size="22.592034" fill="var(--danger-text)">+ calculateTotal()                    pricing concern</text>
  <text x="80" y="361.636364" font-family="Arial, sans-serif" font-size="22.592034" fill="var(--danger-text)">+ processPayment()              payment concern</text>
  <text x="80" y="398.545455" font-family="Arial, sans-serif" font-size="22.592034" fill="var(--danger-text)">+ saveToDatabase()               persistence concern</text>
  <text x="80" y="435.454545" font-family="Arial, sans-serif" font-size="22.592034" fill="var(--danger-text)">+ sendConfirmationEmail()   notification concern</text>
  <text x="80" y="472.363636" font-family="Arial, sans-serif" font-size="22.592034" fill="var(--danger-text)">+ generateInvoice()               reporting concern</text>
  <text x="80" y="509.272727" font-family="Arial, sans-serif" font-size="22.592034" fill="var(--danger-text)">+ shipOrder()                            logistics concern</text>

  <rect x="40" y="540.909091" width="1200" height="79.090909" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="572.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--danger-accent)">Violates SRP, OCP, DIP</text>
  <text x="640" y="604.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--text-muted)">One class touches every concern — hard to test, maintain, or extend</text>
</svg>

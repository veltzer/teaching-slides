  <text x="906.6667" y="106.6666" text-anchor="middle" font-family="Arial" font-size="14.6666" font-style="italic">«interface»</text>
  <text x="906.6667" y="126.6667" text-anchor="middle" font-family="Arial" font-size="18.6667" font-weight="bold">Sleepable</text>
  <line x1="826.6667" y1="133.3332" x2="986.6666" y2="133.3332" stroke="var(--primary-border)" stroke-width="1.1429" />
  <text x="906.6667" y="153.3333" text-anchor="middle" font-family="Arial" font-size="14.6666">+ sleep()</text>
  <rect x="426.6666" y="346.6667" width="200" height="146.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7"/>
  <text x="526.6666" y="380" text-anchor="middle" font-family="Arial" font-size="21.3333" font-weight="bold">Human</text>
  <line x1="426.6666" y1="393.3333" x2="626.6666" y2="393.3333" stroke="var(--ok-border)" stroke-width="1.1429" />

  <text x="526.6666" y="459.9999" text-anchor="middle" font-family="Arial" font-size="16">+ sleep()</text>
  <rect x="760" y="346.6667" width="200" height="106.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7"/>
  <text x="860" y="380" text-anchor="middle" font-family="Arial" font-size="21.3333" font-weight="bold">Robot</text>

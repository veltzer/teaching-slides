  <polygon points="479.9999,346.6667 473.3333,333.3333 486.6666,333.3333" fill="none" stroke="var(--ok-border)" stroke-width="2.2857" />
  <path d="M 640 160 L 546.6667 346.6667" stroke="var(--ok-border)" stroke-width="2.2857" stroke-dasharray="5.7143 5.7143" />
  <polygon points="546.6667,346.6667 540,333.3333 553.3333,333.3333" fill="none" stroke="var(--ok-border)" stroke-width="2.2857" />
  <path d="M 906.6667 160 L 573.3333 346.6667" stroke="var(--ok-border)" stroke-width="2.2857" stroke-dasharray="5.7143 5.7143" />
  <polygon points="573.3333,346.6667 566.6666,333.3333 580,333.3333" fill="none" stroke="var(--ok-border)" stroke-width="2.2857" />
  <path d="M 373.3332 160 L 813.3333 346.6667" stroke="var(--ok-border)" stroke-width="2.2857" stroke-dasharray="5.7143 5.7143" />
  <polygon points="813.3333,346.6667 806.6666,333.3333 820,333.3333" fill="none" stroke="var(--ok-border)" stroke-width="2.2857" />
  <text x="693.3334" y="559.9999" text-anchor="middle" font-family="Arial" font-size="14.6666" fill="var(--ok-accent)">Segregated interfaces - Classes only implement what they need</text>
  <text x="693.3334" y="580" text-anchor="middle" font-family="Arial" font-size="14.6666" fill="var(--ok-accent)">No forced implementations or exceptions</text>
</svg>
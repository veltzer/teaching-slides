<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="218.1817" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="149.0908" y="94.375" text-anchor="middle" font-family="Arial" font-size="27.6221" font-weight="bold">Client</text>
  <rect x="585.4545" y="40" width="218.1817" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="694.5455" y="94.375" text-anchor="middle" font-family="Arial" font-size="27.6221" font-weight="bold">Bird</text>
  <rect x="1021.8183" y="40" width="218.1817" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="1130.9092" y="94.375" text-anchor="middle" font-family="Arial" font-size="27.6221" font-weight="bold">Penguin</text>
  <line x1="258.1817" y1="166.875" x2="585.4545" y2="166.875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="421.8182" y="148.75" text-anchor="middle" font-family="Arial" font-size="21.703">fly()</text>
  <line x1="694.5455" y1="203.125" x2="694.5455" y2="239.375" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="629.091" y="239.375" width="130.9092" height="54.375" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="694.5455" y="275.625" text-anchor="middle" font-family="Arial" font-size="19.7301">Flies</text>
  <text x="694.5455" y="293.7499" text-anchor="middle" font-family="Arial" font-size="19.7301">successfully</text>
  <line x1="258.1817" y1="402.5" x2="1021.8183" y2="402.5" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="640.0001" y="384.375" text-anchor="middle" font-family="Arial" font-size="21.703">fly()</text>
  <line x1="1130.9092" y1="438.75" x2="258.1817" y2="438.75" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" stroke-dasharray="8.6486 8.6486" />
  <rect x="323.6364" y="456.875" width="436.3637" height="72.5" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="541.8182" y="484.0625" text-anchor="middle" font-family="Arial" font-size="21.703" font-weight="bold">Throws Exception!</text>
  <text x="541.8182" y="511.25" text-anchor="middle" font-family="Arial" font-size="19.7301">UnsupportedOperationException</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.4857,0" fill="#28a745" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.4857,0" fill="#d32f2f" />
    </marker>
  </defs>
  <text x="694.5455" y="620" text-anchor="middle" font-family="Arial" font-size="21.703" fill="var(--danger-accent)">Penguin cannot be substituted for Bird - LSP Violation</text>
</svg>
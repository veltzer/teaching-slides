<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="218.1817" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="149.0908" y="94.375" text-anchor="middle" font-size="27.6221" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Client</text>
  <rect x="585.4545" y="40" width="218.1817" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="694.5455" y="94.375" text-anchor="middle" font-size="27.6221" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Bird</text>
  <rect x="1021.8183" y="40" width="218.1817" height="543.75" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="1130.9092" y="94.375" text-anchor="middle" font-size="27.6221" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Penguin</text>
  <line x1="258.1817" y1="166.875" x2="585.4545" y2="166.875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="421.8182" y="148.75" text-anchor="middle" font-size="21.703" font-family="Arial, sans-serif" fill="var(--text)">fly()</text>
  <line x1="694.5455" y1="203.125" x2="694.5455" y2="239.375" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="629.091" y="239.375" width="130.9092" height="54.375" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="694.5455" y="275.625" text-anchor="middle" font-size="19.7301" font-family="Arial, sans-serif" fill="var(--ok-text)">Flies</text>
  <text x="694.5455" y="293.7499" text-anchor="middle" font-size="19.7301" font-family="Arial, sans-serif" fill="var(--ok-text)">successfully</text>
  <line x1="258.1817" y1="402.5" x2="1021.8183" y2="402.5" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="640.0001" y="384.375" text-anchor="middle" font-size="21.703" font-family="Arial, sans-serif" fill="var(--text)">fly()</text>
  <line x1="1130.9092" y1="438.75" x2="258.1817" y2="438.75" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" stroke-dasharray="8.6486 8.6486"/>
  <rect x="323.6364" y="456.875" width="436.3637" height="72.5" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="541.8182" y="484.0625" text-anchor="middle" font-size="21.703" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Throws Exception!</text>
  <text x="541.8182" y="511.25" text-anchor="middle" font-size="19.7301" font-family="Arial, sans-serif" fill="var(--danger-text)">UnsupportedOperationException</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="694.5455" y="620" text-anchor="middle" font-size="21.703" fill="var(--danger-accent)" font-family="Arial, sans-serif">Penguin cannot be substituted for Bird - LSP Violation</text>
</svg>

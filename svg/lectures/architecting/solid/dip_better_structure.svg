  <rect x="523.871" y="40" width="290.3224" height="120.5195" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" stroke-dasharray="2.4658 2.4658" filter="url(#shadow)"/>
  <text x="669.0321" y="77.6624" text-anchor="middle" font-size="20.4909" font-style="italic" font-family="Arial, sans-serif" fill="var(--primary-text)">«interface»</text>

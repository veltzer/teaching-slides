<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="414.9999" y="40" width="374.9999" height="193.3334" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" stroke-dasharray="3.4718 3.4718" filter="url(#shadow)"/>
  <text x="602.5" y="83.9394" text-anchor="middle" font-size="24.9569" font-style="italic" font-family="Arial, sans-serif" fill="var(--danger-text)">«interface»</text>
  <text x="602.5" y="119.091" text-anchor="middle" font-size="33.2757" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Worker</text>
  <line x1="414.9999" y1="136.6668" x2="790" y2="136.6668" stroke="var(--danger-border)" stroke-width="0.6943"/>
  <text x="602.5" y="163.0303" text-anchor="middle" font-size="24.9569" font-family="Arial, sans-serif" fill="var(--danger-text)">+ work()</text>
  <text x="602.5" y="189.394" text-anchor="middle" font-size="24.9569" font-family="Arial, sans-serif" fill="var(--danger-text)">+ eat()</text>
  <text x="602.5" y="215.7575" text-anchor="middle" font-size="24.9569" font-family="Arial, sans-serif" fill="var(--danger-text)">+ sleep()</text>
  <rect x="40" y="373.9395" width="374.9999" height="193.3334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="227.5001" y="417.8789" text-anchor="middle" font-size="33.2757" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Human</text>
  <line x1="40" y1="435.4545" x2="414.9999" y2="435.4545" stroke="var(--ok-border)" stroke-width="0.6943"/>
  <text x="227.5001" y="470.6061" text-anchor="middle" font-size="24.9569" font-family="Arial, sans-serif" fill="var(--ok-text)">+ work()</text>
  <text x="227.5001" y="496.9697" text-anchor="middle" font-size="24.9569" font-family="Arial, sans-serif" fill="var(--ok-text)">+ eat()</text>
  <text x="227.5001" y="523.3334" text-anchor="middle" font-size="24.9569" font-family="Arial, sans-serif" fill="var(--ok-text)">+ sleep()</text>
  <rect x="790" y="373.9395" width="450" height="193.3334" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1014.9998" y="417.8789" text-anchor="middle" font-size="33.2757" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Robot</text>
  <line x1="790" y1="435.4545" x2="1239.9996" y2="435.4545" stroke="var(--warn-border)" stroke-width="0.6943"/>
  <text x="1014.9998" y="470.6061" text-anchor="middle" font-size="24.9569" font-family="Arial, sans-serif" fill="var(--warn-text)">+ work()</text>
  <text x="839.9999" y="496.9697" font-size="24.9569" font-family="Arial, sans-serif" fill="var(--warn-text)">+ eat()</text>
  <text x="1114.9998" y="496.9697" font-size="24.9569" fill="var(--danger-accent)" font-family="Arial, sans-serif">✗ Exception</text>
  <text x="839.9999" y="523.3334" font-size="24.9569" font-family="Arial, sans-serif" fill="var(--warn-text)">+ sleep()</text>
  <text x="1114.9998" y="523.3334" font-size="24.9569" fill="var(--danger-accent)" font-family="Arial, sans-serif">✗ Exception</text>
  <path d="M 227.5001 373.9395 L 514.9999 233.3334" stroke="var(--ok-border)" stroke-width="1.3887" stroke-dasharray="3.4718 3.4718"/>
  <polygon points="514.9999,233.3334 502.4999,250.9091 527.5001,250.9091" fill="none" stroke="var(--ok-border)" stroke-width="1.3887"/>
  <path d="M 1014.9998 373.9395 L 690 233.3334" stroke="var(--warn-border)" stroke-width="1.3887" stroke-dasharray="3.4718 3.4718"/>
  <polygon points="690,233.3334 677.5,250.9091 702.5,250.9091" fill="none" stroke="var(--warn-border)" stroke-width="1.3887"/>
  <text x="602.5" y="620" text-anchor="middle" font-size="22.8771" fill="var(--danger-accent)" font-family="Arial, sans-serif">Robot forced to implement unnecessary methods - ISP Violation</text>
</svg>

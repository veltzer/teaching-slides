<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="109.1357" y="80" width="444.4445" height="238.0952" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="8.7963"/>
  <text x="331.358" y="151.4286" text-anchor="middle" font-family="Arial" font-size="38.0953" font-weight="bold">Switch</text>
  <line x1="109.1357" y1="175.2381" x2="553.5802" y2="175.2381" stroke="var(--danger-border)" stroke-width="1.624" />
  <text x="133.8272" y="222.8571" font-family="Arial" font-size="28.5714">- bulb: LightBulb</text>
  <line x1="109.1357" y1="246.6667" x2="553.5802" y2="246.6667" stroke="var(--danger-border)" stroke-width="1.624" />
  <text x="133.8272" y="294.2857" font-family="Arial" font-size="28.5714">+ operate()</text>
  <rect x="800.4939" y="80" width="370.3704" height="238.0952" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.7963"/>
  <text x="985.6791" y="151.4286" text-anchor="middle" font-family="Arial" font-size="38.0953" font-weight="bold">LightBulb</text>
  <line x1="800.4939" y1="175.2381" x2="1170.8643" y2="175.2381" stroke="var(--text-muted)" stroke-width="1.624" />
  <text x="825.1852" y="222.8571" font-family="Arial" font-size="28.5714">+ turnOn()</text>
  <text x="825.1852" y="270.4762" font-family="Arial" font-size="28.5714">+ turnOff()</text>
  <path d="M 553.5802 199.0476 L 800.4939 199.0476" stroke="var(--danger-border)" stroke-width="3.2481" marker-end="url(#arrow-red-direct)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-red-direct" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#d32f2f" />
    </marker>
  </defs>
  <text x="640" y="508.5714" text-anchor="middle" font-family="Arial" font-size="26.1905" fill="var(--danger-accent)">Direct dependency on concrete class</text>
  <text x="640" y="544.2857" text-anchor="middle" font-family="Arial" font-size="26.1905" fill="var(--danger-accent)">High-level module depends on low-level module</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial" font-size="26.1905" fill="var(--danger-accent)">Violation of Dependency Inversion Principle</text>
</svg>
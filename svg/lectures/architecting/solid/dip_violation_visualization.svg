<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="168.421" y="162.406" width="303.1579" height="162.406" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="320" y="211.1278" text-anchor="middle" font-family="Arial" font-size="25.985" font-weight="bold">Switch</text>
  <line x1="168.421" y1="227.3684" x2="471.5789" y2="227.3684" stroke="var(--danger-border)" stroke-width="1.624" />
  <text x="185.2632" y="259.8496" font-family="Arial" font-size="19.4887">- bulb: LightBulb</text>
  <line x1="168.421" y1="276.0902" x2="471.5789" y2="276.0902" stroke="var(--danger-border)" stroke-width="1.624" />
  <text x="185.2632" y="308.5714" font-family="Arial" font-size="19.4887">+ operate()</text>
  <rect x="640" y="162.406" width="252.6316" height="162.406" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="766.3158" y="211.1278" text-anchor="middle" font-family="Arial" font-size="25.985" font-weight="bold">LightBulb</text>
  <line x1="640" y1="227.3684" x2="892.6316" y2="227.3684" stroke="var(--text-muted)" stroke-width="1.624" />
  <text x="656.8421" y="259.8496" font-family="Arial" font-size="19.4887">+ turnOn()</text>
  <text x="656.8421" y="292.3308" font-family="Arial" font-size="19.4887">+ turnOff()</text>
  <path d="M 471.5789 243.609 L 640 243.609" stroke="var(--danger-border)" stroke-width="3.2481" marker-end="url(#arrow-red-direct)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-red-direct" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#d32f2f" />
    </marker>
  </defs>
  <text x="530.5263" y="454.7368" text-anchor="middle" font-family="Arial" font-size="17.8647" fill="var(--danger-accent)">Direct dependency on concrete class</text>
  <text x="530.5263" y="479.0977" text-anchor="middle" font-family="Arial" font-size="17.8647" fill="var(--danger-accent)">High-level module depends on low-level module</text>
  <text x="530.5263" y="503.4586" text-anchor="middle" font-family="Arial" font-size="17.8647" fill="var(--danger-accent)">Violation of Dependency Inversion Principle</text>
</svg>
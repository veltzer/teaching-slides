<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <g transform="translate(97.5,94.6)">
  <text x="640" y="170.5" text-anchor="middle" fill="var(--danger-accent)" font-size="50.056" font-style="italic" font-family="Arial, sans-serif">f(f(x)) = f(x)</text>
  <g transform="translate(150,140)">
    <rect x="40" y="69" width="120" height="72.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <text x="100" y="112.5" text-anchor="middle" fill="var(--primary-accent)" font-size="18.0758" font-family="Arial, sans-serif">Client</text>
    <rect x="565" y="69" width="120" height="72.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <text x="625" y="112.5" text-anchor="middle" fill="var(--info-accent)" font-size="18.0758" font-family="Arial, sans-serif">Server</text>
    <line x1="167.5" y1="83.5" x2="557.5" y2="83.5" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="167.5" y1="105.25" x2="557.5" y2="105.25" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="167.5" y1="127" x2="557.5" y2="127" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="362.5" y="71.9" text-anchor="middle" fill="var(--text-muted)" font-size="13.9044" font-family="Arial, sans-serif">retry 1</text>
    <text x="362.5" y="100.9" text-anchor="middle" fill="var(--text-muted)" font-size="13.9044" font-family="Arial, sans-serif">retry 2</text>
    <text x="362.5" y="148.75" text-anchor="middle" fill="var(--text-muted)" font-size="13.9044" font-family="Arial, sans-serif">retry 3</text>
    <text x="744.9999" y="112.5" text-anchor="start" fill="var(--primary-accent)" font-size="19.4662" font-weight="bold" font-family="Arial, sans-serif">Same</text>
    <text x="744.9999" y="138.6" text-anchor="start" fill="var(--primary-accent)" font-size="19.4662" font-weight="bold" font-family="Arial, sans-serif">Result</text>
  </g>
  <g transform="translate(620,170)">
    <rect x="40" y="40" width="45" height="8.7" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="57.4" width="45" height="8.7" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  </g>
  <text x="640" y="540.25" text-anchor="middle" fill="var(--text-faint)" font-size="22.2471" font-family="Arial, sans-serif">Building Reliable APIs and Services</text>
  </g>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Idempotency</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Building Reliable APIs and Services</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <text x="568.8889" y="144" text-anchor="middle" fill="var(--danger-accent)" font-family="Georgia,serif" font-size="51.2" font-style="italic">f(f(x)) = f(x)</text>
  <g transform="translate(150,140)">
    <rect x="0" y="32" width="113.7778" height="80" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="56.8889" y="80" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="18.4889">Client</text>
    <rect x="497.7778" y="32" width="113.7778" height="80" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="554.6667" y="80" text-anchor="middle" fill="var(--info-accent)" font-family="Arial,sans-serif" font-size="18.4889">Server</text>
    <line x1="120.8889" y1="48" x2="490.6667" y2="48" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="120.8889" y1="72" x2="490.6667" y2="72" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="120.8889" y1="96" x2="490.6667" y2="96" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
    <text x="305.7778" y="35.2" text-anchor="middle" fill="var(--text-muted)" font-family="Arial,sans-serif" font-size="14.2222">retry 1</text>
    <text x="305.7778" y="67.2" text-anchor="middle" fill="var(--text-muted)" font-family="Arial,sans-serif" font-size="14.2222">retry 2</text>
    <text x="305.7778" y="120" text-anchor="middle" fill="var(--text-muted)" font-family="Arial,sans-serif" font-size="14.2222">retry 3</text>
    <text x="668.4444" y="80" text-anchor="start" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="19.9111" font-weight="bold">Same</text>
    <text x="668.4444" y="108.8" text-anchor="start" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="19.9111" font-weight="bold">Result</text>
  </g>
  <g transform="translate(620,170)">
    <rect x="0" y="0" width="42.6667" height="9.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
    <rect x="0" y="19.2" width="42.6667" height="9.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  </g>
  <text x="568.8889" y="496" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="45.5111" font-weight="bold">Idempotency</text>
  <text x="568.8889" y="552" text-anchor="middle" fill="var(--text-faint)" font-family="Arial,sans-serif" font-size="22.7556">Building Reliable APIs and Services</text>
</svg>
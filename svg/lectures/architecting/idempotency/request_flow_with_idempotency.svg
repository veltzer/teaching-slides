<svg viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="53.3333" y="52.5" width="128" height="42" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="117.3334" y="78.75" text-anchor="middle" font-size="12.6">Receive Request</text>
  <rect x="53.3333" y="136.5" width="128" height="42" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="117.3334" y="162.75" text-anchor="middle" font-size="12.6">Extract Key</text>
  <rect x="266.6667" y="136.5" width="128" height="42" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="330.6666" y="162.75" text-anchor="middle" font-size="12.6">Check Cache</text>
  <rect x="480" y="84" width="128" height="42" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="544" y="110.25" text-anchor="middle" font-size="12.6">Return Cached</text>
  <rect x="480" y="189" width="128" height="42" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="544" y="215.25" text-anchor="middle" font-size="12.6">Process Request</text>
  <rect x="480" y="273" width="128" height="42" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="544" y="299.25" text-anchor="middle" font-size="12.6">Store Result</text>
  <rect x="266.6667" y="346.5" width="128" height="42" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="330.6666" y="372.75" text-anchor="middle" font-size="12.6">Return Response</text>
  <path d="M 117.3334 94.5 L 117.3334 136.5" stroke="var(--text)" stroke-width="2.1" marker-end="url(#arrow)" />
  <path d="M 181.3333 157.5 L 266.6667 157.5" stroke="var(--text)" stroke-width="2.1" marker-end="url(#arrow)" />
  <path d="M 394.6666 147 L 480 115.5" stroke="var(--ok-border)" stroke-width="2.1" marker-end="url(#arrow)" />
  <path d="M 394.6666 168 L 480 199.5" stroke="var(--danger-border)" stroke-width="2.1" marker-end="url(#arrow)" />
  <path d="M 544 231 L 544 273" stroke="var(--text)" stroke-width="2.1" marker-end="url(#arrow)" />
  <path d="M 480 294 L 394.6666 367.5" stroke="var(--text)" stroke-width="2.1" marker-end="url(#arrow)" />
  <path d="M 608 105 L 640 367.5" stroke="var(--text)" stroke-width="2.1" marker-end="url(#arrow)" />
  <text x="416" y="131.25" text-anchor="middle" font-size="10.5" fill="var(--ok-accent)">Found</text>
  <text x="416" y="183.75" text-anchor="middle" font-size="10.5" fill="var(--danger-accent)">Not Found</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.4,0" fill="#333" />
    </marker>
  </defs>
</svg>
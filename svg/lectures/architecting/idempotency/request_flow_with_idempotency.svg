<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="261.818" height="72.5" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="170.9096" y="85.3124" text-anchor="middle" font-size="23.6762" font-family="Arial, sans-serif" fill="var(--primary-text)">Receive Request</text>
  <rect x="40" y="184.9999" width="261.818" height="72.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="170.9096" y="230.3125" text-anchor="middle" font-size="23.6762" font-family="Arial, sans-serif" fill="var(--warn-text)">Extract Key</text>
  <rect x="476.364" y="184.9999" width="261.818" height="72.5" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="607.2727" y="230.3125" text-anchor="middle" font-size="23.6762" font-family="Arial, sans-serif" fill="var(--info-text)">Check Cache</text>
  <rect x="912.7273" y="94.375" width="261.818" height="72.5" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1043.6364" y="139.6875" text-anchor="middle" font-size="23.6762" font-family="Arial, sans-serif" fill="var(--ok-text)">Return Cached</text>
  <rect x="912.7273" y="275.625" width="261.818" height="72.5" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1043.6364" y="320.9376" text-anchor="middle" font-size="23.6762" font-family="Arial, sans-serif" fill="var(--danger-text)">Process Request</text>
  <rect x="912.7273" y="420.6251" width="261.818" height="72.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1043.6364" y="465.9375" text-anchor="middle" font-size="23.6762" font-family="Arial, sans-serif" fill="var(--warn-text)">Store Result</text>
  <rect x="476.364" y="547.5" width="261.818" height="72.5" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="607.2727" y="592.8126" text-anchor="middle" font-size="23.6762" font-family="Arial, sans-serif" fill="var(--primary-text)">Return Response</text>
  <path d="M 170.9096 112.5 L 170.9096 184.9999" stroke="var(--text)" stroke-width="0.7423" marker-end="url(#arrow)"/>
  <path d="M 301.8183 221.2499 L 476.364 221.2499" stroke="var(--text)" stroke-width="0.7423" marker-end="url(#arrow)"/>
  <path d="M 738.1818 203.1249 L 912.7273 148.7501" stroke="var(--ok-border)" stroke-width="0.7423" marker-end="url(#arrow)"/>
  <path d="M 738.1818 239.3749 L 912.7273 293.75" stroke="var(--danger-border)" stroke-width="0.7423" marker-end="url(#arrow)"/>
  <path d="M 1043.6364 348.125 L 1043.6364 420.6251" stroke="var(--text)" stroke-width="0.7423" marker-end="url(#arrow)"/>
  <path d="M 912.7273 456.8751 L 738.1818 583.75" stroke="var(--text)" stroke-width="0.7423" marker-end="url(#arrow)"/>
  <path d="M 1174.5453 130.6251 L 1240 583.75" stroke="var(--text)" stroke-width="0.7423" marker-end="url(#arrow)"/>
  <text x="781.8182" y="175.9375" text-anchor="middle" font-size="21.2396" fill="var(--ok-accent)" font-family="Arial, sans-serif">Found</text>
  <text x="781.8182" y="266.5626" text-anchor="middle" font-size="21.2396" fill="var(--danger-accent)" font-family="Arial, sans-serif">Not Found</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

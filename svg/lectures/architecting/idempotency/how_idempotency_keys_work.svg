<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="640" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">How Idempotency Keys Work</text>
  <rect x="40" y="90" width="240" height="530" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="160" y="140" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--primary-text)">Client</text>
  <rect x="1000" y="90" width="240" height="530" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1120" y="140" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--info-text)">Server</text>
  <line x1="160" y1="160" x2="160" y2="620" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="1120" y1="160" x2="1120" y2="620" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="290" y1="200" x2="990" y2="200" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="640" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">POST /payment + Idempotency-Key: abc</text>
  <line x1="990" y1="300" x2="290" y2="300" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="640" y="290" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">201 Created, key stored with result</text>
  <line x1="290" y1="430" x2="990" y2="430" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="420" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">Retry: POST /payment + same Key: abc</text>
  <line x1="990" y1="540" x2="290" y2="540" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="640" y="530" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">Same cached 201 response (no dup charge)</text>
  <rect x="320" y="580" width="640" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="607" text-anchor="middle" font-size="16" fill="var(--text-muted)">Same key -> same outcome</text>
</svg>

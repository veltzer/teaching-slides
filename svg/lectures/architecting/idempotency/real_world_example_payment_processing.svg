<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arr" markerWidth="25.6" markerHeight="24" refX="23.04" refY="12" orient="auto">
      <polygon points="0,34.2857 8.96,0" fill="#555555" />
    </marker>
  </defs>
  <rect x="25.6" y="34.2857" width="512" height="137.1429" fill="#e3f2fd" stroke="#333333" stroke-width="3.84" rx="10.24" />
  <text x="281.6" y="116.5714" text-anchor="middle" font-size="30.72" fill="#222222">User clicks "Pay $100"</text>
  <line x1="281.6" y1="171.4286" x2="281.6" y2="240" stroke="#555555" stroke-width="3.84" marker-end="url(#arr)" />
  <rect x="25.6" y="246.8571" width="512" height="137.1429" fill="#fff3e0" stroke="#e65100" stroke-width="3.84" rx="10.24" />
  <text x="281.6" y="329.1429" text-anchor="middle" font-size="30.72" fill="#e65100">Network timeout occurs</text>
  <line x1="281.6" y1="384" x2="281.6" y2="452.5714" stroke="#555555" stroke-width="3.84" marker-end="url(#arr)" />
  <rect x="25.6" y="459.4286" width="512" height="137.1429" fill="#fce4ec" stroke="#c62828" stroke-width="3.84" rx="10.24" />
  <text x="281.6" y="541.7143" text-anchor="middle" font-size="30.72" fill="#c62828">User clicks again (retry)</text>
  <line x1="537.6" y1="308.5714" x2="711.68" y2="308.5714" stroke="#c62828" stroke-width="5.12" stroke-dasharray="15.36 7.68" marker-end="url(#arr)" />
  <rect x="716.8" y="205.7143" width="512" height="274.2857" fill="#ffcdd2" stroke="#c62828" stroke-width="5.12" rx="10.24" />
  <text x="972.8" y="308.5714" text-anchor="middle" font-size="33.28" font-weight="bold" fill="#c62828">Two charges!</text>
  <text x="972.8" y="377.1429" text-anchor="middle" font-size="30.72" fill="#333333">$100 + $100 = $200</text>
  <text x="972.8" y="438.8571" text-anchor="middle" font-size="28.16" fill="#555555">Without idempotency</text>
</svg>
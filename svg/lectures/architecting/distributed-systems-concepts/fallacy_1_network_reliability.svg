<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="30.948314" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Fallacy #1: The Network is Reliable</text>

  <!-- Sender box -->
  <rect x="40" y="119.816514" width="300" height="361.834862" rx="6.189663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="226.238532" text-anchor="middle" font-size="30.948314" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Sender</text>
  <text x="190" y="300.733945" text-anchor="middle" font-size="18.568989" fill="var(--primary-text)" font-family="Arial, sans-serif">calls send(msg)</text>
  <text x="190" y="343.302752" text-anchor="middle" font-size="18.568989" fill="var(--primary-text)" font-family="Arial, sans-serif">no crash locally</text>
  <text x="190" y="385.87156" text-anchor="middle" font-size="18.568989" fill="var(--primary-text)" font-family="Arial, sans-serif">assumes delivery</text>
  <text x="190" y="439.082569" text-anchor="middle" font-size="16.505768" fill="var(--primary-text)" font-family="Arial, sans-serif">but cannot verify</text>

  <!-- Receiver box -->
  <rect x="940" y="119.816514" width="300" height="361.834862" rx="6.189663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="226.238532" text-anchor="middle" font-size="30.948314" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Receiver</text>
  <text x="1090" y="300.733945" text-anchor="middle" font-size="18.568989" fill="var(--primary-text)" font-family="Arial, sans-serif">may be down</text>
  <text x="1090" y="343.302752" text-anchor="middle" font-size="18.568989" fill="var(--primary-text)" font-family="Arial, sans-serif">partitioned</text>
  <text x="1090" y="385.87156" text-anchor="middle" font-size="18.568989" fill="var(--primary-text)" font-family="Arial, sans-serif">or slow</text>
  <text x="1090" y="439.082569" text-anchor="middle" font-size="16.505768" fill="var(--primary-text)" font-family="Arial, sans-serif">sender cannot tell</text>

  <!-- Successful message -->
  <line x1="340" y1="215.59633" x2="940" y2="215.59633" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <rect x="530" y="173.027523" width="220" height="34.055046" rx="6.189663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="198.568807" text-anchor="middle" font-size="16.505768" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">delivered — ack</text>

  <!-- Lost message -->
  <line x1="340" y1="396.513761" x2="700" y2="396.513761" stroke="var(--danger-border)" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="740" y="405.027523" font-size="41.264419" font-weight="bold" fill="var(--danger-border)" font-family="Arial, sans-serif">✗</text>
  <rect x="530" y="353.944954" width="220" height="34.055046" rx="6.189663" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="379.486239" text-anchor="middle" font-size="16.505768" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">dropped — no ack</text>

  <!-- Bottom guidance -->
  <rect x="40" y="513.577982" width="1200" height="106.422018" rx="6.189663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="550.825688" text-anchor="middle" font-size="18.568989" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Packets are lost, duplicated, or reordered. Links fail.</text>
  <text x="640" y="582.752294" text-anchor="middle" font-size="16.505768" fill="var(--text-muted)" font-family="Arial, sans-serif">Design for retries with timeouts, idempotent handlers, and explicit acks.</text>
  <text x="640" y="609.357798" text-anchor="middle" font-size="16.505768" fill="var(--text-muted)" font-family="Arial, sans-serif">Never assume send() means delivered.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="640" y="75" text-anchor="middle" font-size="30" font-weight="bold" fill="var(--text)">Fallacy #1: The Network is Reliable</text>

  <!-- Sender box -->
  <rect x="40" y="150" width="300" height="340" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="190" y="250" text-anchor="middle" font-size="30" font-weight="bold" fill="var(--primary-text)">Sender</text>
  <text x="190" y="320" text-anchor="middle" font-size="18" fill="var(--primary-text)">calls send(msg)</text>
  <text x="190" y="360" text-anchor="middle" font-size="18" fill="var(--primary-text)">no crash locally</text>
  <text x="190" y="400" text-anchor="middle" font-size="18" fill="var(--primary-text)">assumes delivery</text>
  <text x="190" y="450" text-anchor="middle" font-size="16" fill="var(--primary-text)">but cannot verify</text>

  <!-- Receiver box -->
  <rect x="940" y="150" width="300" height="340" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1090" y="250" text-anchor="middle" font-size="30" font-weight="bold" fill="var(--primary-text)">Receiver</text>
  <text x="1090" y="320" text-anchor="middle" font-size="18" fill="var(--primary-text)">may be down</text>
  <text x="1090" y="360" text-anchor="middle" font-size="18" fill="var(--primary-text)">partitioned</text>
  <text x="1090" y="400" text-anchor="middle" font-size="18" fill="var(--primary-text)">or slow</text>
  <text x="1090" y="450" text-anchor="middle" font-size="16" fill="var(--primary-text)">sender cannot tell</text>

  <!-- Successful message -->
  <line x1="340" y1="240" x2="940" y2="240" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <rect x="530" y="200" width="220" height="32" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="640" y="224" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-text)">delivered — ack</text>

  <!-- Lost message -->
  <line x1="340" y1="410" x2="700" y2="410" stroke="var(--danger-border)" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="740" y="418" font-size="40" font-weight="bold" fill="var(--danger-border)">✗</text>
  <rect x="530" y="370" width="220" height="32" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="640" y="394" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--danger-text)">dropped — no ack</text>

  <!-- Bottom guidance -->
  <rect x="40" y="520" width="1200" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="555" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">Packets are lost, duplicated, or reordered. Links fail.</text>
  <text x="640" y="585" text-anchor="middle" font-size="16" fill="var(--text-muted)">Design for retries with timeouts, idempotent handlers, and explicit acks.</text>
  <text x="640" y="610" text-anchor="middle" font-size="16" fill="var(--text-muted)">Never assume send() means delivered.</text>
</svg>

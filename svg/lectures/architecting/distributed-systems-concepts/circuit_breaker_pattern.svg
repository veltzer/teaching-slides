<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="370" height="370" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="var(--ok-text)">Closed</text>
  <text x="225" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Normal operation</text>
  <text x="225" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Requests pass through</text>
  <text x="225" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Breaker counts failures</text>
  <text x="225" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Threshold exceeded trips</text>

  <rect x="455" y="40" width="370" height="370" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="var(--danger-text)">Open</text>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">Fail fast</text>
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Requests short-circuit</text>
  <text x="640" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">No calls to dependency</text>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">After timeout tests again</text>

  <rect x="870" y="40" width="370" height="370" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="var(--warn-text)">Half-Open</text>
  <text x="1055" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">Trial window</text>
  <text x="1055" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Limited probe requests</text>
  <text x="1055" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Success closes breaker</text>
  <text x="1055" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Failure re-opens it</text>

  <line x1="410" y1="180" x2="453" y2="180" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="431" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-accent)">failures</text>

  <line x1="825" y1="180" x2="868" y2="180" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="846" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-accent)">timeout</text>

  <path d="M 870 270 L 410 270" fill="none" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="640" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">probe succeeds</text>

  <rect x="40" y="430" width="1200" height="190" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Why: stop cascading failure</text>
  <text x="640" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">A slow downstream ties up threads, which starves upstream, which tips the whole system over.</text>
  <text x="640" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">Breaker returns fast errors or a fallback and gives the dependency time to recover.</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">Tune: failure threshold, rolling window, open-state timeout, probe count.</text>
  <text x="640" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-faint)">Libraries: resilience4j, Polly, Hystrix (deprecated), Istio outlier detection.</text>
</svg>

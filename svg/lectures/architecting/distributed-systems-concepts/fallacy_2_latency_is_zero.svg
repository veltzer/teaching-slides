<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="98.7655" y="80" font-family="Arial, sans-serif" font-size="27.6544" font-weight="bold" fill="#333">Latency Comparison</ns0:text>
  <ns0:text x="98.7655" y="160" font-family="Arial, sans-serif" font-size="23.7037" fill="#333">Local Call (in-process):</ns0:text>
  <ns0:rect x="98.7655" y="186.6667" width="59.2593" height="53.3333" fill="#51cf66" rx="5.9259" />
  <ns0:text x="177.7778" y="226.6667" font-family="Arial, sans-serif" font-size="21.7284" fill="#888">~0.0001 ms</ns0:text>
  <ns0:text x="98.7655" y="306.6667" font-family="Arial, sans-serif" font-size="23.7037" fill="#333">Same datacenter:</ns0:text>
  <ns0:rect x="98.7655" y="333.3333" width="296.2963" height="53.3333" fill="#ffc107" rx="5.9259" />
  <ns0:text x="414.8148" y="373.3333" font-family="Arial, sans-serif" font-size="21.7284" fill="#888">~0.5 ms</ns0:text>
  <ns0:text x="98.7655" y="453.3333" font-family="Arial, sans-serif" font-size="23.7037" fill="#333">Cross-region:</ns0:text>
  <ns0:rect x="98.7655" y="480" width="790.1234" height="53.3333" fill="#ff6b6b" rx="5.9259" />
  <ns0:text x="908.6419" y="520" font-family="Arial, sans-serif" font-size="21.7284" fill="#888">~100 ms</ns0:text>
  <ns0:line x1="98.7655" y1="573.3333" x2="987.6544" y2="573.3333" stroke="#ccc" stroke-width="1.9753" />
  <ns0:text x="543.2099" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7037" fill="#333" font-weight="bold">Network calls can be 1,000,000x slower than local calls</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <circle cx="640" cy="228.5" r="34.7611" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" />
  <circle cx="460" cy="330" r="34.7611" fill="none" stroke="var(--primary-border)" stroke-width="4.2667" />
  <circle cx="820" cy="330" r="34.7611" fill="none" stroke="var(--primary-border)" stroke-width="4.2667" />
  <circle cx="339.9999" cy="228.5" r="27.8088" fill="none" stroke="var(--info-border)" stroke-width="2.8444" />
  <circle cx="939.9999" cy="228.5" r="27.8088" fill="none" stroke="var(--info-border)" stroke-width="2.8444" />
  <circle cx="550" cy="431.5" r="27.8088" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
  <circle cx="730" cy="431.5" r="27.8088" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
  <line x1="609.9999" y1="250.25" x2="490" y2="308.25" stroke="var(--text)" stroke-width="2" />
  <line x1="670" y1="250.25" x2="790" y2="308.25" stroke="var(--text)" stroke-width="2" />
  <line x1="460" y1="366.25" x2="550" y2="409.75" stroke="var(--text)" stroke-width="2" />
  <line x1="820" y1="366.25" x2="730" y2="409.75" stroke="var(--text)" stroke-width="2" />
  <line x1="490" y1="330" x2="790" y2="330" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.1111" />
  <line x1="370" y1="235.75" x2="602.5" y2="228.5" stroke="var(--text)" stroke-width="1.4222" />
  <line x1="910" y1="235.75" x2="677.4999" y2="228.5" stroke="var(--text)" stroke-width="1.4222" />
  <line x1="572.5" y1="431.5" x2="707.5" y2="431.5" stroke="var(--text)" stroke-width="1.4222" />
  <rect x="625" y="214" width="30" height="29" rx="6" fill="url(#grad-danger)" opacity="0.5" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="315.5" width="30" height="29" rx="6" fill="url(#grad-primary)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="804.9999" y="315.5" width="30" height="29" rx="6" fill="url(#grad-primary)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="533" text-anchor="middle" fill="var(--surface)" font-size="41.7133" font-weight="bold" font-family="Arial, sans-serif">Distributed Systems Concepts</text>
  <text x="640" y="576.5" text-anchor="middle" fill="var(--text-faint)" font-size="22.2471" font-family="Arial, sans-serif">Fundamentals of Distributed Computing</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <g transform="translate(0,60)">
  <circle cx="640" cy="228.5" r="34.7611" fill="none" stroke="var(--danger-border)" stroke-width="4.2667"/>
  <circle cx="460" cy="330" r="34.7611" fill="none" stroke="var(--primary-border)" stroke-width="4.2667"/>
  <circle cx="820" cy="330" r="34.7611" fill="none" stroke="var(--primary-border)" stroke-width="4.2667"/>
  <circle cx="339.9999" cy="228.5" r="27.8088" fill="none" stroke="var(--info-border)" stroke-width="2.8444"/>
  <circle cx="939.9999" cy="228.5" r="27.8088" fill="none" stroke="var(--info-border)" stroke-width="2.8444"/>
  <circle cx="550" cy="431.5" r="27.8088" fill="none" stroke="var(--primary-border)" stroke-width="2.8444"/>
  <circle cx="730" cy="431.5" r="27.8088" fill="none" stroke="var(--primary-border)" stroke-width="2.8444"/>
  <line x1="609.9999" y1="250.25" x2="490" y2="308.25" stroke="var(--text)" stroke-width="2"/>
  <line x1="670" y1="250.25" x2="790" y2="308.25" stroke="var(--text)" stroke-width="2"/>
  <line x1="460" y1="366.25" x2="550" y2="409.75" stroke="var(--text)" stroke-width="2"/>
  <line x1="820" y1="366.25" x2="730" y2="409.75" stroke="var(--text)" stroke-width="2"/>
  <line x1="490" y1="330" x2="790" y2="330" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.1111"/>
  <line x1="370" y1="235.75" x2="602.5" y2="228.5" stroke="var(--text)" stroke-width="1.4222"/>
  <line x1="910" y1="235.75" x2="677.4999" y2="228.5" stroke="var(--text)" stroke-width="1.4222"/>
  <line x1="572.5" y1="431.5" x2="707.5" y2="431.5" stroke="var(--text)" stroke-width="1.4222"/>
  <rect x="625" y="214" width="30" height="29" rx="6" fill="url(#grad-danger)" opacity="0.5" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="315.5" width="30" height="29" rx="6" fill="url(#grad-primary)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="804.9999" y="315.5" width="30" height="29" rx="6" fill="url(#grad-primary)" opacity="0.5" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="576.5" text-anchor="middle" fill="var(--text-faint)" font-size="22.2471" font-family="Arial, sans-serif">Fundamentals of Distributed Computing</text>
  </g>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Distributed Systems Concepts</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Consensus, Replication, and Failure</text>
</svg>

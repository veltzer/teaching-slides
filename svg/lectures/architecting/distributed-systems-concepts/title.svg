<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Network of nodes -->
  <circle cx="400" cy="130" r="25" fill="none" stroke="#e94560" stroke-width="3"/>
  <circle cx="280" cy="200" r="25" fill="none" stroke="#00d2ff" stroke-width="3"/>
  <circle cx="520" cy="200" r="25" fill="none" stroke="#00d2ff" stroke-width="3"/>
  <circle cx="200" cy="130" r="20" fill="none" stroke="#533483" stroke-width="2"/>
  <circle cx="600" cy="130" r="20" fill="none" stroke="#533483" stroke-width="2"/>
  <circle cx="340" cy="270" r="20" fill="none" stroke="#0f3460" stroke-width="2"/>
  <circle cx="460" cy="270" r="20" fill="none" stroke="#0f3460" stroke-width="2"/>
  <!-- Connection lines -->
  <line x1="380" y1="145" x2="300" y2="185" stroke="#444" stroke-width="1.5"/>
  <line x1="420" y1="145" x2="500" y2="185" stroke="#444" stroke-width="1.5"/>
  <line x1="280" y1="225" x2="340" y2="255" stroke="#444" stroke-width="1.5"/>
  <line x1="520" y1="225" x2="460" y2="255" stroke="#444" stroke-width="1.5"/>
  <line x1="300" y1="200" x2="500" y2="200" stroke="#444" stroke-width="1.5" stroke-dasharray="5"/>
  <line x1="220" y1="135" x2="375" y2="130" stroke="#444" stroke-width="1"/>
  <line x1="580" y1="135" x2="425" y2="130" stroke="#444" stroke-width="1"/>
  <line x1="355" y1="270" x2="445" y2="270" stroke="#444" stroke-width="1"/>
  <!-- Server icons inside nodes -->
  <rect x="390" y="120" width="20" height="20" rx="3" fill="#e94560" opacity="0.5"/>
  <rect x="270" y="190" width="20" height="20" rx="3" fill="#00d2ff" opacity="0.5"/>
  <rect x="510" y="190" width="20" height="20" rx="3" fill="#00d2ff" opacity="0.5"/>
  <!-- Title -->
  <text x="400" y="340" text-anchor="middle" fill="#eee" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Distributed Systems Concepts</text>
  <text x="400" y="370" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="16">Fundamentals of Distributed Computing</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <line x1="171.919334" y1="81.4286" x2="171.919334" y2="495.7142" stroke="var(--text)" stroke-width="2" />
  <line x1="699.59657" y1="81.4286" x2="699.59657" y2="495.7142" stroke="var(--text)" stroke-width="2" />
  <line x1="1227.274106" y1="81.4286" x2="1227.274106" y2="495.7142" stroke="var(--text)" stroke-width="2" />
  <rect x="159.19394" y="192.989" width="25.450587" height="25.4506" rx="12.725297" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <rect x="686.871677" y="275.846" width="25.450587" height="25.4506" rx="12.725297" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="1214.549413" y="151.56" width="25.450587" height="25.4506" rx="12.725297" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="171.919334" y="40" text-anchor="middle" font-size="27.995693" font-family="Arial, sans-serif" fill="var(--text)">Node A</text>
  <text x="699.59657" y="40" text-anchor="middle" font-size="27.995693" font-family="Arial, sans-serif" fill="var(--text)">Node B</text>
  <text x="1227.274106" y="40" text-anchor="middle" font-size="27.995693" font-family="Arial, sans-serif" fill="var(--text)">Node C</text>
  <text x="40" y="205.7142" font-size="25.450494" font-family="Arial, sans-serif" fill="var(--text)">Event 1</text>
  <text x="567.677236" y="288.5715" font-size="25.450494" font-family="Arial, sans-serif" fill="var(--text)">Event 2</text>
  <text x="1095.354672" y="164.2858" font-size="25.450494" font-family="Arial, sans-serif" fill="var(--text)">Event 3</text>
  <text x="699.59657" y="620" text-anchor="middle" font-size="30.540692" font-family="Arial, sans-serif" fill="var(--text)">Which happened first?</text>
</svg>
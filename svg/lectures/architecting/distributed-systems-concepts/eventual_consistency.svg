<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--text)">Time</text>
  <line x1="40" y1="72.830189" x2="1240" y2="72.830189" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="116.603774" width="230" height="503.396226" rx="6.276641" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="182.264151" text-anchor="middle" font-size="20.922138" font-weight="bold" fill="var(--danger-text)">t0 Write</text>
  <text x="155" y="379.245283" text-anchor="middle" font-size="18.829924" fill="var(--danger-text)">Node A: new</text>
  <text x="155" y="423.018868" text-anchor="middle" font-size="18.829924" fill="var(--danger-text)">Node B: stale</text>
  <text x="155" y="466.792453" text-anchor="middle" font-size="18.829924" fill="var(--danger-text)">Node C: stale</text>

  <rect x="290" y="116.603774" width="230" height="503.396226" rx="6.276641" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="405" y="182.264151" text-anchor="middle" font-size="20.922138" font-weight="bold" fill="var(--warn-text)">t1 Propagate</text>
  <text x="405" y="379.245283" text-anchor="middle" font-size="18.829924" fill="var(--warn-text)">Node A: new</text>
  <text x="405" y="423.018868" text-anchor="middle" font-size="18.829924" fill="var(--warn-text)">Node B: new</text>
  <text x="405" y="466.792453" text-anchor="middle" font-size="18.829924" fill="var(--warn-text)">Node C: stale</text>

  <rect x="540" y="116.603774" width="230" height="503.396226" rx="6.276641" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655" y="182.264151" text-anchor="middle" font-size="20.922138" font-weight="bold" fill="var(--ok-text)">t2 Catching up</text>
  <text x="655" y="379.245283" text-anchor="middle" font-size="18.829924" fill="var(--ok-text)">Node A: new</text>
  <text x="655" y="423.018868" text-anchor="middle" font-size="18.829924" fill="var(--ok-text)">Node B: new</text>
  <text x="655" y="466.792453" text-anchor="middle" font-size="18.829924" fill="var(--ok-text)">Node C: syncing</text>

  <rect x="790" y="116.603774" width="230" height="503.396226" rx="6.276641" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="905" y="182.264151" text-anchor="middle" font-size="20.922138" font-weight="bold" fill="var(--ok-text)">t3 Converged</text>
  <text x="905" y="379.245283" text-anchor="middle" font-size="18.829924" fill="var(--ok-text)">All nodes</text>
  <text x="905" y="423.018868" text-anchor="middle" font-size="18.829924" fill="var(--ok-text)">agree on</text>
  <text x="905" y="466.792453" text-anchor="middle" font-size="18.829924" fill="var(--ok-text)">latest value</text>

  <rect x="1040" y="116.603774" width="200" height="503.396226" rx="6.276641" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="182.264151" text-anchor="middle" font-size="20.922138" font-weight="bold" fill="var(--primary-text)">Steady State</text>
  <text x="1140" y="379.245283" text-anchor="middle" font-size="18.829924" fill="var(--primary-text)">reads safe</text>
  <text x="1140" y="423.018868" text-anchor="middle" font-size="18.829924" fill="var(--primary-text)">from any</text>
  <text x="1140" y="466.792453" text-anchor="middle" font-size="18.829924" fill="var(--primary-text)">replica</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="640" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">Saga Pattern: Compensating Transactions</text>
  <rect x="40" y="90" width="240" height="320" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="160.0" y="220" text-anchor="middle" font-size="56" font-weight="bold" fill="var(--ok-text)">T1</text>
  <text x="160.0" y="290" text-anchor="middle" font-size="22" fill="var(--ok-text)">Reserve</text>
  <line x1="284" y1="250" x2="276" y2="250" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="90" width="240" height="320" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="400.0" y="220" text-anchor="middle" font-size="56" font-weight="bold" fill="var(--ok-text)">T2</text>
  <text x="400.0" y="290" text-anchor="middle" font-size="22" fill="var(--ok-text)">Charge</text>
  <line x1="524" y1="250" x2="516" y2="250" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="90" width="240" height="320" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640.0" y="220" text-anchor="middle" font-size="56" font-weight="bold" fill="var(--danger-text)">T3</text>
  <text x="640.0" y="290" text-anchor="middle" font-size="22" fill="var(--danger-text)">Ship fails</text>
  <line x1="764" y1="250" x2="756" y2="250" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="760" y="90" width="240" height="320" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="880.0" y="220" text-anchor="middle" font-size="56" font-weight="bold" fill="var(--warn-text)">C2</text>
  <text x="880.0" y="290" text-anchor="middle" font-size="22" fill="var(--warn-text)">Refund</text>
  <line x1="1004" y1="250" x2="996" y2="250" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1000" y="90" width="240" height="320" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1120.0" y="220" text-anchor="middle" font-size="56" font-weight="bold" fill="var(--warn-text)">C1</text>
  <text x="1120.0" y="290" text-anchor="middle" font-size="22" fill="var(--warn-text)">Release</text>
  <rect x="40" y="450" width="1200" height="170" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="500" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">On failure, run compensating transactions in reverse</text>
  <text x="640" y="550" text-anchor="middle" font-size="18" fill="var(--text-muted)">Each step is locally atomic; the saga is eventually consistent</text>
  <text x="640" y="595" text-anchor="middle" font-size="18" fill="var(--text-muted)">Alternative to distributed two-phase commit</text>
</svg>

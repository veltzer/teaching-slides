<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.342872" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Saga Pattern: Compensating Transactions</text>
  <rect x="40" y="75.929204" width="240" height="328.495575" rx="6.079124" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="209.380531" text-anchor="middle" font-size="56.738493" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">T1</text>
  <text x="160" y="281.238938" text-anchor="middle" font-size="22.290122" fill="var(--ok-text)" font-family="Arial, sans-serif">Reserve</text>
  <line x1="284" y1="240.176991" x2="276" y2="240.176991" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="75.929204" width="240" height="328.495575" rx="6.079124" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="209.380531" text-anchor="middle" font-size="56.738493" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">T2</text>
  <text x="400" y="281.238938" text-anchor="middle" font-size="22.290122" fill="var(--ok-text)" font-family="Arial, sans-serif">Charge</text>
  <line x1="524" y1="240.176991" x2="516" y2="240.176991" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="75.929204" width="240" height="328.495575" rx="6.079124" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="209.380531" text-anchor="middle" font-size="56.738493" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">T3</text>
  <text x="640" y="281.238938" text-anchor="middle" font-size="22.290122" fill="var(--danger-text)" font-family="Arial, sans-serif">Ship fails</text>
  <line x1="764" y1="240.176991" x2="756" y2="240.176991" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="760" y="75.929204" width="240" height="328.495575" rx="6.079124" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="209.380531" text-anchor="middle" font-size="56.738493" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">C2</text>
  <text x="880" y="281.238938" text-anchor="middle" font-size="22.290122" fill="var(--warn-text)" font-family="Arial, sans-serif">Refund</text>
  <line x1="1004" y1="240.176991" x2="996" y2="240.176991" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1000" y="75.929204" width="240" height="328.495575" rx="6.079124" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="209.380531" text-anchor="middle" font-size="56.738493" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">C1</text>
  <text x="1120" y="281.238938" text-anchor="middle" font-size="22.290122" fill="var(--warn-text)" font-family="Arial, sans-serif">Release</text>
  <rect x="40" y="445.486726" width="1200" height="174.513274" rx="6.079124" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="496.814159" text-anchor="middle" font-size="22.290122" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">On failure, run compensating transactions in reverse</text>
  <text x="640" y="548.141593" text-anchor="middle" font-size="18.237373" fill="var(--text-muted)" font-family="Arial, sans-serif">Each step is locally atomic; the saga is eventually consistent</text>
  <text x="640" y="594.336283" text-anchor="middle" font-size="18.237373" fill="var(--text-muted)" font-family="Arial, sans-serif">Alternative to distributed two-phase commit</text>
</svg>

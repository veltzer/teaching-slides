<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
<text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579136" font-weight="bold" fill="var(--text)">Vector Clocks: Tracking Causality</text>
<rect x="40" y="66.126126" width="580" height="553.873874" rx="6.133647" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
<text x="330" y="107.927928" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490038" font-weight="bold" fill="var(--primary-accent)">Node A</text>
<rect x="660" y="66.126126" width="580" height="553.873874" rx="6.133647" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
<text x="950" y="107.927928" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490038" font-weight="bold" fill="var(--ok-accent)">Node B</text>
<rect x="80" y="160.18018" width="500" height="114.954955" rx="6.133647" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="330" y="207.207207" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490038" font-weight="bold" fill="var(--primary-text)">event a1</text>
<text x="330" y="249.009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.623685" font-weight="bold" fill="var(--primary-text)">[1,0,0]</text>
<rect x="80" y="316.936937" width="500" height="114.954955" rx="6.133647" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="330" y="363.963964" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490038" font-weight="bold" fill="var(--primary-text)">event a2</text>
<text x="330" y="405.765766" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.623685" font-weight="bold" fill="var(--primary-text)">[2,0,0]</text>
<rect x="80" y="473.693694" width="500" height="114.954955" rx="6.133647" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="330" y="520.720721" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490038" font-weight="bold" fill="var(--primary-text)">receive msg</text>
<text x="330" y="562.522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.623685" font-weight="bold" fill="var(--primary-text)">[3,2,0]</text>
<rect x="700" y="160.18018" width="500" height="114.954955" rx="6.133647" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="950" y="207.207207" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490038" font-weight="bold" fill="var(--ok-text)">event b1</text>
<text x="950" y="249.009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.623685" font-weight="bold" fill="var(--ok-text)">[0,1,0]</text>
<rect x="700" y="316.936937" width="500" height="114.954955" rx="6.133647" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="950" y="363.963964" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490038" font-weight="bold" fill="var(--ok-text)">send to A</text>
<text x="950" y="405.765766" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.623685" font-weight="bold" fill="var(--ok-text)">[0,2,0]</text>
<rect x="700" y="473.693694" width="500" height="114.954955" rx="6.133647" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
<text x="950" y="520.720721" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490038" font-weight="bold" fill="var(--ok-text)">event b3</text>
<text x="950" y="562.522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.623685" font-weight="bold" fill="var(--ok-text)">[0,3,0]</text>
<line x1="700" y1="374.414414" x2="580" y2="520.720721" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
<text x="640" y="442.342342" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391" font-weight="bold" fill="var(--text-muted)">message</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="921.8712" height="477.3269" fill="url(#bg)" rx="6" x="40" y="40"/>
  <line x1="548.5963" y1="375.3698" x2="1240" y2="375.3698" stroke="var(--danger-border)" stroke-width="0.9979" />
  <circle cx="606.2134" cy="375.3698" r="11.0559" fill="var(--danger-fill)" />
  <circle cx="779.0644" cy="375.3698" r="11.0559" fill="var(--danger-fill)" />
  <circle cx="1009.5321" cy="375.3698" r="11.0559" fill="var(--danger-fill)" />
  <circle cx="1182.383" cy="375.3698" r="11.0559" fill="var(--danger-fill)" />
  <path d="M 779.0644 375.3698 Q 836.6812 291.8378 894.2981 303.7709" fill="none" stroke="var(--primary-border)" stroke-width="1.6516" />
  <line x1="894.2981" y1="303.7709" x2="1067.1491" y2="303.7709" stroke="var(--primary-border)" stroke-width="0.9979" />
  <path d="M 1067.1491 303.7709 Q 1101.7192 315.704 1009.5321 375.3698" fill="none" stroke="var(--primary-border)" stroke-width="1.6516" stroke-dasharray="2.7528" />
  <circle cx="894.2981" cy="303.7709" r="8.8447" fill="var(--primary-fill)" />
  <circle cx="980.7235" cy="303.7709" r="8.8447" fill="var(--primary-fill)" />
  <circle cx="1067.1491" cy="303.7709" r="8.8447" fill="var(--primary-fill)" />
  <path d="M 779.0644 375.3698 Q 813.6345 446.9691 871.2513 458.9022" fill="none" stroke="var(--warn-border)" stroke-width="1.6516" />
  <line x1="871.2513" y1="458.9022" x2="940.3916" y2="458.9022" stroke="var(--warn-border)" stroke-width="0.9979" />
  <path d="M 940.3916 458.9022 Q 974.9619 435.0358 1009.5321 375.3698" fill="none" stroke="var(--warn-border)" stroke-width="1.6516" stroke-dasharray="2.7528" />
  <circle cx="871.2513" cy="458.9022" r="8.8447" fill="var(--warn-fill)" />
  <circle cx="940.3916" cy="458.9022" r="8.8447" fill="var(--warn-fill)" />
  <text x="1182.383" y="357.4701" text-anchor="middle" fill="var(--danger-accent)" font-size="15.9163" font-weight="bold" font-family="Arial, sans-serif">main</text>
  <text x="980.7235" y="289.451" text-anchor="middle" fill="var(--primary-accent)" font-size="15.9163" font-weight="bold" font-family="Arial, sans-serif">feature</text>
  <text x="905.8216" y="492.3151" text-anchor="middle" fill="var(--warn-accent)" font-size="15.9163" font-weight="bold" font-family="Arial, sans-serif">hotfix</text>
  <text x="894.2981" y="578.2339" text-anchor="middle" fill="var(--surface)" font-size="35.3787" font-weight="bold" font-family="Arial, sans-serif">Git Workflow Strategies</text>
  <text x="894.2981" y="620" text-anchor="middle" fill="var(--text-faint)" font-size="17.6895" font-family="Arial, sans-serif">Branch Management and Collaboration Patterns</text>
</svg>
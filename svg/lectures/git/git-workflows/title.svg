<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="888.8889" height="500" fill="url(#bg)" rx="6.0417"/>
  <line x1="306.6666" y1="267.5" x2="973.3334" y2="267.5" stroke="var(--danger-border)" stroke-width="2" />
  <circle cx="362.2222" cy="267.5" r="11.1111" fill="var(--danger-fill)" />
  <circle cx="528.8889" cy="267.5" r="11.1111" fill="var(--danger-fill)" />
  <circle cx="751.1111" cy="267.5" r="11.1111" fill="var(--danger-fill)" />
  <circle cx="917.7778" cy="267.5" r="11.1111" fill="var(--danger-fill)" />
  <path d="M 528.8889 267.5 Q 584.4445 180 640 192.5" fill="none" stroke="var(--primary-border)" stroke-width="3.3103" />
  <line x1="640" y1="192.5" x2="806.6667" y2="192.5" stroke="var(--primary-border)" stroke-width="2" />
  <path d="M 806.6667 192.5 Q 840 205 751.1111 267.5" fill="none" stroke="var(--primary-border)" stroke-width="3.3103" stroke-dasharray="5.5172" />
  <circle cx="640" cy="192.5" r="8.8889" fill="var(--primary-fill)" />
  <circle cx="723.3333" cy="192.5" r="8.8889" fill="var(--primary-fill)" />
  <circle cx="806.6667" cy="192.5" r="8.8889" fill="var(--primary-fill)" />
  <path d="M 528.8889 267.5 Q 562.2222 342.5001 617.7777 355" fill="none" stroke="var(--warn-border)" stroke-width="3.3103" />
  <line x1="617.7777" y1="355" x2="684.4444" y2="355" stroke="var(--warn-border)" stroke-width="2" />
  <path d="M 684.4444 355 Q 717.7778 330.0001 751.1111 267.5" fill="none" stroke="var(--warn-border)" stroke-width="3.3103" stroke-dasharray="5.5172" />
  <circle cx="617.7777" cy="355" r="8.8889" fill="var(--warn-fill)" />
  <circle cx="684.4444" cy="355" r="8.8889" fill="var(--warn-fill)" />
  <text x="917.7778" y="248.75" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial,sans-serif" font-size="13.3334" font-weight="bold">main</text>
  <text x="723.3333" y="177.5" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="13.3334" font-weight="bold">feature</text>
  <text x="651.1111" y="390" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial,sans-serif" font-size="13.3334" font-weight="bold">hotfix</text>
  <text x="640" y="480" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="35.5555" font-weight="bold">Git Workflow Strategies</text>
  <text x="640" y="523.7501" text-anchor="middle" fill="var(--text-faint)" font-family="Arial,sans-serif" font-size="17.7778">Branch Management and Collaboration Patterns</text>
</svg>
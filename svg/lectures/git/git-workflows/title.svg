<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Git branch visualization -->
  <!-- Main branch -->
  <line x1="100" y1="150" x2="700" y2="150" stroke="#e94560" stroke-width="4"/>
  <circle cx="150" cy="150" r="10" fill="#e94560"/>
  <circle cx="300" cy="150" r="10" fill="#e94560"/>
  <circle cx="500" cy="150" r="10" fill="#e94560"/>
  <circle cx="650" cy="150" r="10" fill="#e94560"/>
  <!-- Feature branch -->
  <path d="M300,150 Q350,80 400,90" fill="none" stroke="#00d2ff" stroke-width="3"/>
  <line x1="400" y1="90" x2="550" y2="90" stroke="#00d2ff" stroke-width="3"/>
  <path d="M550,90 Q580,100 500,150" fill="none" stroke="#00d2ff" stroke-width="3" stroke-dasharray="5"/>
  <circle cx="400" cy="90" r="8" fill="#00d2ff"/>
  <circle cx="475" cy="90" r="8" fill="#00d2ff"/>
  <circle cx="550" cy="90" r="8" fill="#00d2ff"/>
  <!-- Hotfix branch -->
  <path d="M300,150 Q330,210 380,220" fill="none" stroke="#ff9900" stroke-width="3"/>
  <line x1="380" y1="220" x2="440" y2="220" stroke="#ff9900" stroke-width="3"/>
  <path d="M440,220 Q470,200 500,150" fill="none" stroke="#ff9900" stroke-width="3" stroke-dasharray="5"/>
  <circle cx="380" cy="220" r="8" fill="#ff9900"/>
  <circle cx="440" cy="220" r="8" fill="#ff9900"/>
  <!-- Labels -->
  <text x="650" y="135" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="12" font-weight="bold">main</text>
  <text x="475" y="78" text-anchor="middle" fill="#00d2ff" font-family="Arial,sans-serif" font-size="12" font-weight="bold">feature</text>
  <text x="410" y="248" text-anchor="middle" fill="#ff9900" font-family="Arial,sans-serif" font-size="12" font-weight="bold">hotfix</text>
  <!-- Title -->
  <text x="400" y="320" text-anchor="middle" fill="#eee" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Git Workflow Strategies</text>
  <text x="400" y="355" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="16">Branch Management and Collaboration Patterns</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="882.7586" height="496.5517" fill="url(#bg)" rx="6"/>
  <line x1="110.3448" y1="186.2069" x2="772.4138" y2="186.2069" stroke="var(--danger-border)" stroke-width="2" />
  <circle cx="165.5172" cy="186.2069" r="11.0345" fill="var(--danger-fill)" />
  <circle cx="331.0345" cy="186.2069" r="11.0345" fill="var(--danger-fill)" />
  <circle cx="551.7241" cy="186.2069" r="11.0345" fill="var(--danger-fill)" />
  <circle cx="717.2414" cy="186.2069" r="11.0345" fill="var(--danger-fill)" />
  <path d="M 331.0345 186.2069 Q 386.2069 99.3103 441.3793 111.7241" fill="none" stroke="var(--primary-border)" stroke-width="3.3103" />
  <line x1="441.3793" y1="111.7241" x2="606.8966" y2="111.7241" stroke="var(--primary-border)" stroke-width="2" />
  <path d="M 606.8966 111.7241 Q 640 124.1379 551.7241 186.2069" fill="none" stroke="var(--primary-border)" stroke-width="3.3103" stroke-dasharray="5.5172" />
  <circle cx="441.3793" cy="111.7241" r="8.8276" fill="var(--primary-fill)" />
  <circle cx="524.1379" cy="111.7241" r="8.8276" fill="var(--primary-fill)" />
  <circle cx="606.8966" cy="111.7241" r="8.8276" fill="var(--primary-fill)" />
  <path d="M 331.0345 186.2069 Q 364.1379 260.6897 419.3103 273.1034" fill="none" stroke="var(--warn-border)" stroke-width="3.3103" />
  <line x1="419.3103" y1="273.1034" x2="485.5172" y2="273.1034" stroke="var(--warn-border)" stroke-width="2" />
  <path d="M 485.5172 273.1034 Q 518.6207 248.2759 551.7241 186.2069" fill="none" stroke="var(--warn-border)" stroke-width="3.3103" stroke-dasharray="5.5172" />
  <circle cx="419.3103" cy="273.1034" r="8.8276" fill="var(--warn-fill)" />
  <circle cx="485.5172" cy="273.1034" r="8.8276" fill="var(--warn-fill)" />
  <text x="717.2414" y="167.5862" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial,sans-serif" font-size="13.2414" font-weight="bold">main</text>
  <text x="524.1379" y="96.8276" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="13.2414" font-weight="bold">feature</text>
  <text x="452.4138" y="307.8621" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial,sans-serif" font-size="13.2414" font-weight="bold">hotfix</text>
  <text x="441.3793" y="397.2414" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="35.3103" font-weight="bold">Git Workflow Strategies</text>
  <text x="441.3793" y="440.6897" text-anchor="middle" fill="var(--text-faint)" font-family="Arial,sans-serif" font-size="17.6552">Branch Management and Collaboration Patterns</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.753498" font-weight="bold" fill="var(--text)">Git Flow Branching Model</text>

  <text x="50" y="103.272727" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--danger-accent)">main</text>
  <line x1="160" y1="98" x2="1240" y2="98" stroke="var(--danger-border)" stroke-width="3"/>
  <rect x="249.731" y="87.7309" width="20.5382" height="20.5382" rx="10.2691" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="669.731" y="87.7309" width="20.5382" height="20.5382" rx="10.2691" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1089.73" y="87.7309" width="20.5382" height="20.5382" rx="10.2691" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="76.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">v1.0</text>
  <text x="680" y="76.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">v1.1</text>
  <text x="1100" y="76.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">v2.0</text>

  <text x="50" y="240.363636" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--warn-accent)">release</text>
  <line x1="580" y1="229.818182" x2="1100" y2="229.818182" stroke="var(--warn-border)" stroke-width="3"/>
  <line x1="580" y1="229.818182" x2="580" y2="98" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="1100" y1="229.818182" x2="1100" y2="108.545455" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="810.758" y="220.576" width="18.4844" height="18.4844" rx="9.2422" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>

  <text x="50" y="377.454545" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--primary-accent)">develop</text>
  <line x1="200" y1="366.909091" x2="1240" y2="366.909091" stroke="var(--primary-border)" stroke-width="3"/>
  <line x1="580" y1="366.909091" x2="580" y2="229.818182" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="1100" y1="229.818182" x2="1240" y2="366.909091" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="329.731" y="356.64" width="20.5382" height="20.5382" rx="10.2691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="469.731" y="356.64" width="20.5382" height="20.5382" rx="10.2691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="889.731" y="356.64" width="20.5382" height="20.5382" rx="10.2691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

  <text x="50" y="535.636364" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--ok-accent)">feature</text>
  <line x1="340" y1="366.909091" x2="480" y2="525.090909" stroke="var(--ok-border)" stroke-width="2.5"/>
  <line x1="480" y1="525.090909" x2="780" y2="525.090909" stroke="var(--ok-border)" stroke-width="3"/>
  <line x1="780" y1="525.090909" x2="900" y2="366.909091" stroke="var(--ok-border)" stroke-width="2.5"/>
  <rect x="590.758" y="515.849" width="18.4844" height="18.4844" rx="9.2422" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="710.758" y="515.849" width="18.4844" height="18.4844" rx="9.2422" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

  <rect x="40" y="577.818182" width="1200" height="42.181818" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="607.345455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--text-muted)">features branch off develop, release stabilizes, main holds tagged versions</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Git Flow Branching Model</text>

  <text x="50" y="130" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-accent)">main</text>
  <line x1="160" y1="125" x2="1240" y2="125" stroke="var(--danger-border)" stroke-width="3"/>
  <circle cx="260" cy="125" r="10" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <circle cx="680" cy="125" r="10" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <circle cx="1100" cy="125" r="10" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="260" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">v1.0</text>
  <text x="680" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">v1.1</text>
  <text x="1100" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">v2.0</text>

  <text x="50" y="260" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-accent)">release</text>
  <line x1="580" y1="250" x2="1100" y2="250" stroke="var(--warn-border)" stroke-width="3"/>
  <line x1="580" y1="250" x2="580" y2="125" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="1100" y1="250" x2="1100" y2="135" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="820" cy="250" r="9" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>

  <text x="50" y="390" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-accent)">develop</text>
  <line x1="200" y1="380" x2="1240" y2="380" stroke="var(--primary-border)" stroke-width="3"/>
  <line x1="580" y1="380" x2="580" y2="250" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="1100" y1="250" x2="1240" y2="380" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="340" cy="380" r="10" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="480" cy="380" r="10" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <circle cx="900" cy="380" r="10" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>

  <text x="50" y="540" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-accent)">feature</text>
  <line x1="340" y1="380" x2="480" y2="530" stroke="var(--ok-border)" stroke-width="2.5"/>
  <line x1="480" y1="530" x2="780" y2="530" stroke="var(--ok-border)" stroke-width="3"/>
  <line x1="780" y1="530" x2="900" y2="380" stroke="var(--ok-border)" stroke-width="2.5"/>
  <circle cx="600" cy="530" r="9" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="720" cy="530" r="9" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>

  <rect x="40" y="580" width="1200" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">features branch off develop, release stabilizes, main holds tagged versions</text>
</svg>

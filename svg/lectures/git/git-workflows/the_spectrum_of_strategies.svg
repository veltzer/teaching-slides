<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>
  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Workflow Complexity Spectrum</text>

  <rect x="40" y="110" width="285" height="250" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="182.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Centralized</text>
  <text x="182.5" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Single shared branch</text>
  <text x="182.5" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Commits go straight to trunk</text>
  <text x="182.5" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Low ceremony, high risk</text>
  <text x="182.5" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Conflicts surface late</text>
  <text x="182.5" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Fits very small teams</text>

  <rect x="340" y="110" width="285" height="250" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="482.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Feature Branch</text>
  <text x="482.5" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Each change on its branch</text>
  <text x="482.5" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Merge to main when ready</text>
  <text x="482.5" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Review via pull request</text>
  <text x="482.5" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Isolation plus visibility</text>
  <text x="482.5" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Most common today</text>

  <rect x="640" y="110" width="285" height="250" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="782.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">GitHub Flow</text>
  <text x="782.5" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Main is always deployable</text>
  <text x="782.5" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Short-lived topic branches</text>
  <text x="782.5" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">CI/CD gates every merge</text>
  <text x="782.5" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Deploy after each PR</text>
  <text x="782.5" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Best for web / SaaS</text>

  <rect x="940" y="110" width="300" height="250" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1090" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Git Flow</text>
  <text x="1090" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">develop / main split</text>
  <text x="1090" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Release + hotfix branches</text>
  <text x="1090" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Long-lived integration</text>
  <text x="1090" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Heavy but disciplined</text>
  <text x="1090" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Versioned desktop / embedded</text>

  <rect x="40" y="395" width="1200" height="50" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <line x1="80" y1="420" x2="1200" y2="420" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="120" y="425" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">simple</text>
  <text x="1150" y="425" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">more process</text>

  <rect x="40" y="465" width="1200" height="155" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Picking a Strategy</text>
  <text x="640" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Match process to team size, deploy cadence, and risk tolerance.</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Shorter branches mean fewer conflicts and faster feedback.</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Heavier workflows pay off only when releases are versioned and audited.</text>
  <text x="640" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Start simple, add ceremony only when the team genuinely needs it.</text>
</svg>

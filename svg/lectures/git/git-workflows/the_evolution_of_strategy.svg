<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.683531" font-weight="bold" fill="var(--text)">Evolution of Branching Strategy</text>

  <rect x="40" y="73.461538" width="370" height="546.538462" rx="6.336706" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="140.384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.571296" font-weight="bold" fill="var(--warn-text)">1. Start Simple</text>
  <text x="225" y="207.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" fill="var(--warn-text)">Solo or tiny team</text>
  <text x="225" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" fill="var(--warn-text)">Commit straight to main</text>
  <text x="225" y="307.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" fill="var(--warn-text)">No ceremony needed</text>
  <text x="225" y="357.884615" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" fill="var(--warn-text)">Fast iteration</text>
  <text x="225" y="419.230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" font-weight="bold" fill="var(--warn-text)">Breaks down when:</text>
  <text x="225" y="463.846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001" fill="var(--warn-text)">team grows past 2–3</text>
  <text x="225" y="502.884615" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001" fill="var(--warn-text)">conflicts multiply</text>
  <text x="225" y="541.923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001" fill="var(--warn-text)">no review loop</text>
  <text x="225" y="580.961538" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001" fill="var(--warn-text)">releases hurt</text>

  <rect x="455" y="73.461538" width="370" height="546.538462" rx="6.336706" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="140.384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.571296" font-weight="bold" fill="var(--ok-text)">2. Add Structure</text>
  <text x="640" y="207.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" fill="var(--ok-text)">Feature branches</text>
  <text x="640" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" fill="var(--ok-text)">Pull request reviews</text>
  <text x="640" y="307.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" fill="var(--ok-text)">CI gates on merge</text>
  <text x="640" y="357.884615" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" fill="var(--ok-text)">Protected main</text>
  <text x="640" y="419.230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" font-weight="bold" fill="var(--ok-text)">Breaks down when:</text>
  <text x="640" y="463.846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001" fill="var(--ok-text)">releases need coordination</text>
  <text x="640" y="502.884615" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001" fill="var(--ok-text)">hotfixes get messy</text>
  <text x="640" y="541.923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001" fill="var(--ok-text)">long-lived work stalls</text>
  <text x="640" y="580.961538" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001" fill="var(--ok-text)">trunk drifts</text>

  <rect x="870" y="73.461538" width="370" height="546.538462" rx="6.336706" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="140.384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.571296" font-weight="bold" fill="var(--primary-text)">3. Optimize</text>
  <text x="1055" y="207.307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" fill="var(--primary-text)">Pick a named model</text>
  <text x="1055" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" fill="var(--primary-text)">trunk-based or git-flow</text>
  <text x="1055" y="307.692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" fill="var(--primary-text)">Release trains</text>
  <text x="1055" y="357.884615" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" fill="var(--primary-text)">Feature flags</text>
  <text x="1055" y="419.230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010119" font-weight="bold" fill="var(--primary-text)">Fits best when:</text>
  <text x="1055" y="463.846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001" fill="var(--primary-text)">multiple release channels</text>
  <text x="1055" y="502.884615" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001" fill="var(--primary-text)">dozens of contributors</text>
  <text x="1055" y="541.923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001" fill="var(--primary-text)">strict CI/CD pipelines</text>
  <text x="1055" y="580.961538" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001" fill="var(--primary-text)">continuous deploys</text>

  <line x1="410" y1="346.730769" x2="455" y2="346.730769" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="825" y1="346.730769" x2="870" y2="346.730769" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
</svg>

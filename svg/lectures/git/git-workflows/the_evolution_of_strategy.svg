<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--text)">Evolution of Branching Strategy</text>

  <rect x="40" y="100" width="370" height="490" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="225" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--warn-text)">1. Start Simple</text>
  <text x="225" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">Solo or tiny team</text>
  <text x="225" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">Commit straight to main</text>
  <text x="225" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">No ceremony needed</text>
  <text x="225" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">Fast iteration</text>
  <text x="225" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Breaks down when:</text>
  <text x="225" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--warn-text)">team grows past 2–3</text>
  <text x="225" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--warn-text)">conflicts multiply</text>
  <text x="225" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--warn-text)">no review loop</text>
  <text x="225" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--warn-text)">releases hurt</text>

  <rect x="455" y="100" width="370" height="490" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--ok-text)">2. Add Structure</text>
  <text x="640" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Feature branches</text>
  <text x="640" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Pull request reviews</text>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">CI gates on merge</text>
  <text x="640" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">Protected main</text>
  <text x="640" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Breaks down when:</text>
  <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-text)">releases need coordination</text>
  <text x="640" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-text)">hotfixes get messy</text>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-text)">long-lived work stalls</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-text)">trunk drifts</text>

  <rect x="870" y="100" width="370" height="490" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1055" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--primary-text)">3. Optimize</text>
  <text x="1055" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Pick a named model</text>
  <text x="1055" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">trunk-based or git-flow</text>
  <text x="1055" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Release trains</text>
  <text x="1055" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Feature flags</text>
  <text x="1055" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Fits best when:</text>
  <text x="1055" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">multiple release channels</text>
  <text x="1055" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">dozens of contributors</text>
  <text x="1055" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">strict CI/CD pipelines</text>
  <text x="1055" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">continuous deploys</text>

  <line x1="410" y1="345" x2="455" y2="345" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="825" y1="345" x2="870" y2="345" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
</svg>

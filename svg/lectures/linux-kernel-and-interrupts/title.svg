<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- CPU chip -->
  <rect x="320" y="120" width="160" height="160" rx="12" fill="#0f3460" stroke="#e94560" stroke-width="3"/>
  <text x="400" y="210" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#e94560">CPU</text>
  <!-- Interrupt lines coming in -->
  <line x1="80" y1="160" x2="310" y2="180" stroke="#16c79a" stroke-width="2.5" stroke-dasharray="8,4"/>
  <line x1="80" y1="200" x2="310" y2="200" stroke="#16c79a" stroke-width="2.5" stroke-dasharray="8,4"/>
  <line x1="80" y1="240" x2="310" y2="220" stroke="#16c79a" stroke-width="2.5" stroke-dasharray="8,4"/>
  <!-- IRQ labels -->
  <text x="40" y="165" text-anchor="middle" font-family="monospace" font-size="14" fill="#16c79a">IRQ0</text>
  <text x="40" y="205" text-anchor="middle" font-family="monospace" font-size="14" fill="#16c79a">IRQ1</text>
  <text x="40" y="245" text-anchor="middle" font-family="monospace" font-size="14" fill="#16c79a">IRQ2</text>
  <!-- Lightning bolts for interrupts -->
  <polygon points="490,150 530,185 510,185 540,230 500,195 520,195" fill="#e94560" opacity="0.9"/>
  <polygon points="570,140 610,175 590,175 620,220 580,185 600,185" fill="#e94560" opacity="0.7"/>
  <!-- Kernel symbol (Tux simplified) -->
  <circle cx="680" cy="200" r="45" fill="#0f3460" stroke="#16c79a" stroke-width="2"/>
  <text x="680" y="195" text-anchor="middle" font-family="serif" font-size="40" fill="#16c79a">&#x1F427;</text>
  <!-- Pin connections on CPU -->
  <rect x="345" y="108" width="12" height="14" fill="#e94560"/>
  <rect x="370" y="108" width="12" height="14" fill="#e94560"/>
  <rect x="395" y="108" width="12" height="14" fill="#e94560"/>
  <rect x="420" y="108" width="12" height="14" fill="#e94560"/>
  <rect x="445" y="108" width="12" height="14" fill="#e94560"/>
  <rect x="345" y="278" width="12" height="14" fill="#e94560"/>
  <rect x="370" y="278" width="12" height="14" fill="#e94560"/>
  <rect x="395" y="278" width="12" height="14" fill="#e94560"/>
  <rect x="420" y="278" width="12" height="14" fill="#e94560"/>
  <rect x="445" y="278" width="12" height="14" fill="#e94560"/>
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#eee">Linux Kernel &amp; Interrupts</text>
  <text x="400" y="370" text-anchor="middle" font-family="monospace" font-size="14" fill="#888">interrupt handling | IRQ mapping | driver development</text>
</svg>

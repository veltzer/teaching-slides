<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="spark-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e25a1c"/>
      <stop offset="100%" style="stop-color:#f39c12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Spark lightning bolt -->
  <polygon points="130,40 90,180 130,180 100,300 200,140 155,140 190,40" fill="url(#spark-orange)"/>
  <!-- DAG nodes -->
  <circle cx="350" cy="80" r="25" fill="#2c3e50" stroke="#e25a1c" stroke-width="3"/>
  <text x="350" y="85" text-anchor="middle" fill="#e25a1c" font-family="monospace" font-size="11">RDD</text>
  <circle cx="280" cy="170" r="25" fill="#2c3e50" stroke="#f39c12" stroke-width="3"/>
  <text x="280" y="175" text-anchor="middle" fill="#f39c12" font-family="monospace" font-size="10">map</text>
  <circle cx="420" cy="170" r="25" fill="#2c3e50" stroke="#f39c12" stroke-width="3"/>
  <text x="420" y="175" text-anchor="middle" fill="#f39c12" font-family="monospace" font-size="9">filter</text>
  <circle cx="350" cy="260" r="25" fill="#2c3e50" stroke="#2ecc71" stroke-width="3"/>
  <text x="350" y="265" text-anchor="middle" fill="#2ecc71" font-family="monospace" font-size="9">reduce</text>
  <!-- DAG edges -->
  <line x1="335" y1="103" x2="295" y2="147" stroke="#666" stroke-width="2"/>
  <line x1="365" y1="103" x2="405" y2="147" stroke="#666" stroke-width="2"/>
  <line x1="295" y1="193" x2="335" y2="237" stroke="#666" stroke-width="2"/>
  <line x1="405" y1="193" x2="365" y2="237" stroke="#666" stroke-width="2"/>
  <!-- Executor boxes -->
  <rect x="530" y="60" width="110" height="70" rx="6" fill="#2c3e50" stroke="#3498db" stroke-width="2"/>
  <text x="585" y="85" text-anchor="middle" fill="#3498db" font-family="Arial" font-size="11" font-weight="bold">Executor 1</text>
  <rect x="543" y="100" width="30" height="20" rx="3" fill="#3498db" opacity="0.3"/>
  <rect x="580" y="100" width="30" height="20" rx="3" fill="#3498db" opacity="0.3"/>
  <text x="558" y="114" text-anchor="middle" fill="#3498db" font-family="monospace" font-size="8">T1</text>
  <text x="595" y="114" text-anchor="middle" fill="#3498db" font-family="monospace" font-size="8">T2</text>
  <rect x="670" y="60" width="110" height="70" rx="6" fill="#2c3e50" stroke="#9b59b6" stroke-width="2"/>
  <text x="725" y="85" text-anchor="middle" fill="#9b59b6" font-family="Arial" font-size="11" font-weight="bold">Executor 2</text>
  <rect x="683" y="100" width="30" height="20" rx="3" fill="#9b59b6" opacity="0.3"/>
  <rect x="720" y="100" width="30" height="20" rx="3" fill="#9b59b6" opacity="0.3"/>
  <text x="698" y="114" text-anchor="middle" fill="#9b59b6" font-family="monospace" font-size="8">T3</text>
  <text x="735" y="114" text-anchor="middle" fill="#9b59b6" font-family="monospace" font-size="8">T4</text>
  <!-- Driver -->
  <rect x="600" y="170" width="120" height="50" rx="6" fill="#2c3e50" stroke="#e25a1c" stroke-width="2"/>
  <text x="660" y="200" text-anchor="middle" fill="#e25a1c" font-family="Arial" font-size="12" font-weight="bold">Driver</text>
  <!-- Shuffle arrows -->
  <path d="M530,280 Q580,250 630,280" fill="none" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M630,280 Q680,250 730,280" fill="none" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Stage boxes -->
  <rect x="500" y="280" width="80" height="40" rx="4" fill="#1a3c34" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="540" y="305" text-anchor="middle" fill="#2ecc71" font-family="Arial" font-size="11">Stage 0</text>
  <rect x="610" y="280" width="80" height="40" rx="4" fill="#1a3c34" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="650" y="305" text-anchor="middle" fill="#2ecc71" font-family="Arial" font-size="11">Stage 1</text>
  <rect x="720" y="280" width="80" height="40" rx="4" fill="#1a3c34" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="760" y="305" text-anchor="middle" fill="#2ecc71" font-family="Arial" font-size="11">Stage 2</text>
  <!-- Shuffle label -->
  <text x="630" y="265" text-anchor="middle" fill="#f39c12" font-family="Arial" font-size="10">shuffle</text>
  <text x="730" y="265" text-anchor="middle" fill="#f39c12" font-family="Arial" font-size="10">shuffle</text>
</svg>
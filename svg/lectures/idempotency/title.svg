<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- f(f(x)) = f(x) formula -->
  <text x="400" y="90" text-anchor="middle" fill="#e94560" font-family="Georgia,serif" font-size="36" font-style="italic">f(f(x)) = f(x)</text>
  <!-- Repeated request arrows -->
  <g transform="translate(150,140)">
    <!-- Client box -->
    <rect x="0" y="20" width="80" height="50" rx="6" fill="none" stroke="#00d2ff" stroke-width="2"/>
    <text x="40" y="50" text-anchor="middle" fill="#00d2ff" font-family="Arial,sans-serif" font-size="13">Client</text>
    <!-- Server box -->
    <rect x="350" y="20" width="80" height="50" rx="6" fill="none" stroke="#533483" stroke-width="2"/>
    <text x="390" y="50" text-anchor="middle" fill="#533483" font-family="Arial,sans-serif" font-size="13">Server</text>
    <!-- Multiple request arrows -->
    <line x1="85" y1="30" x2="345" y2="30" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="85" y1="45" x2="345" y2="45" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="85" y1="60" x2="345" y2="60" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Labels -->
    <text x="215" y="22" text-anchor="middle" fill="#666" font-family="Arial,sans-serif" font-size="10">retry 1</text>
    <text x="215" y="42" text-anchor="middle" fill="#666" font-family="Arial,sans-serif" font-size="10">retry 2</text>
    <text x="215" y="75" text-anchor="middle" fill="#666" font-family="Arial,sans-serif" font-size="10">retry 3</text>
    <!-- Same result -->
    <text x="470" y="50" text-anchor="start" fill="#00d2ff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Same</text>
    <text x="470" y="68" text-anchor="start" fill="#00d2ff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Result</text>
  </g>
  <!-- Equals signs -->
  <g transform="translate(620,170)">
    <rect x="0" y="0" width="30" height="6" rx="2" fill="#e94560"/>
    <rect x="0" y="12" width="30" height="6" rx="2" fill="#e94560"/>
  </g>
  <!-- Title -->
  <text x="400" y="310" text-anchor="middle" fill="#eee" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Idempotency</text>
  <text x="400" y="345" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="16">Building Reliable APIs and Services</text>
</svg>

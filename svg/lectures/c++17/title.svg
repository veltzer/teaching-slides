<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- C++ logo stylized -->
  <g transform="translate(400,160)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#659ad2" stroke-width="4"/>
    <text x="-35" y="20" fill="#659ad2" font-family="Arial,sans-serif" font-size="72" font-weight="bold">C</text>
    <line x1="25" y1="-20" x2="25" y2="20" stroke="#659ad2" stroke-width="5"/>
    <line x1="10" y1="0" x2="40" y2="0" stroke="#659ad2" stroke-width="5"/>
    <line x1="55" y1="-20" x2="55" y2="20" stroke="#659ad2" stroke-width="5"/>
    <line x1="40" y1="0" x2="70" y2="0" stroke="#659ad2" stroke-width="5"/>
  </g>
  <!-- 17 badge -->
  <g transform="translate(550,100)">
    <rect x="0" y="0" width="70" height="45" rx="8" fill="#e94560"/>
    <text x="35" y="33" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="bold">17</text>
  </g>
  <!-- Feature icons -->
  <g transform="translate(120,120)">
    <rect x="0" y="0" width="40" height="30" rx="4" fill="none" stroke="#00d2ff" stroke-width="2"/>
    <text x="20" y="20" text-anchor="middle" fill="#00d2ff" font-family="monospace" font-size="10">if</text>
    <text x="20" y="50" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="9">constexpr</text>
  </g>
  <g transform="translate(120,190)">
    <rect x="0" y="0" width="40" height="30" rx="4" fill="none" stroke="#00d2ff" stroke-width="2"/>
    <text x="20" y="20" text-anchor="middle" fill="#00d2ff" font-family="monospace" font-size="10">auto</text>
    <text x="20" y="50" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="9">structured</text>
  </g>
  <g transform="translate(630,180)">
    <rect x="0" y="0" width="40" height="30" rx="4" fill="none" stroke="#00d2ff" stroke-width="2"/>
    <text x="20" y="20" text-anchor="middle" fill="#00d2ff" font-family="monospace" font-size="8">opt</text>
    <text x="20" y="50" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="9">optional</text>
  </g>
  <!-- Title -->
  <text x="400" y="320" text-anchor="middle" fill="#eee" font-family="Arial,sans-serif" font-size="32" font-weight="bold">C++17 Features</text>
  <text x="400" y="355" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="16">Modern C++ Language and Library Improvements</text>
</svg>

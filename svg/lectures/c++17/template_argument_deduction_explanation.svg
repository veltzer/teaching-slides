<svg width="400" height="200" viewBox="0 0 400 200">
  <rect x="20" y="20" width="150" height="60" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5"/>
  <text x="95" y="40" text-anchor="middle" font-size="12" font-weight="bold">Before C++17</text>
  <text x="95" y="55" text-anchor="middle" font-size="10">Explicit types required</text>
  <text x="95" y="70" text-anchor="middle" font-size="10">vector&lt;int&gt; v = {1,2,3}</text>

  <rect x="230" y="20" width="150" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="305" y="40" text-anchor="middle" font-size="12" font-weight="bold">C++17</text>
  <text x="305" y="55" text-anchor="middle" font-size="10">Automatic deduction</text>
  <text x="305" y="70" text-anchor="middle" font-size="10">vector v = {1,2,3}</text>

  <path d="M 170 50 Q 200 30 230 50" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>

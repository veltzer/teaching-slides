<svg width="500" height="250" viewBox="0 0 500 250">
  <text x="250" y="30" text-anchor="middle" font-size="16" font-weight="bold">Folding Expression</text>
  <text x="250" y="50" text-anchor="middle" font-size="12">(args + ...)</text>

  <rect x="50" y="80" width="60" height="40" fill="#e3f2fd" stroke="#1976d2" rx="5"/>
  <text x="80" y="105" text-anchor="middle" font-size="12">arg1</text>

  <rect x="150" y="80" width="60" height="40" fill="#e3f2fd" stroke="#1976d2" rx="5"/>
  <text x="180" y="105" text-anchor="middle" font-size="12">arg2</text>

  <rect x="250" y="80" width="60" height="40" fill="#e3f2fd" stroke="#1976d2" rx="5"/>
  <text x="280" y="105" text-anchor="middle" font-size="12">arg3</text>

  <rect x="350" y="80" width="60" height="40" fill="#e3f2fd" stroke="#1976d2" rx="5"/>
  <text x="380" y="105" text-anchor="middle" font-size="12">arg4</text>

  <text x="125" y="105" text-anchor="middle" font-size="16" fill="#f44336">+</text>
  <text x="225" y="105" text-anchor="middle" font-size="16" fill="#f44336">+</text>
  <text x="325" y="105" text-anchor="middle" font-size="16" fill="#f44336">+</text>

  <text x="250" y="160" text-anchor="middle" font-size="12">Expands to:</text>
  <text x="250" y="180" text-anchor="middle" font-size="12">arg1 + arg2 + arg3 + arg4</text>
</svg>

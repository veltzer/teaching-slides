<svg width="500" height="300" viewBox="0 0 500 300">
  <text x="250" y="30" text-anchor="middle" font-size="16" font-weight="bold">Execution Policies</text>

  <rect x="50" y="60" width="120" height="60" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5"/>
  <text x="110" y="85" text-anchor="middle" font-size="12" font-weight="bold">seq</text>
  <text x="110" y="100" text-anchor="middle" font-size="10">Sequential</text>
  <text x="110" y="115" text-anchor="middle" font-size="10">Single thread</text>

  <rect x="190" y="60" width="120" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="250" y="85" text-anchor="middle" font-size="12" font-weight="bold">par</text>
  <text x="250" y="100" text-anchor="middle" font-size="10">Parallel</text>
  <text x="250" y="115" text-anchor="middle" font-size="10">Multiple threads</text>

  <rect x="330" y="60" width="120" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="390" y="85" text-anchor="middle" font-size="12" font-weight="bold">par_unseq</text>
  <text x="390" y="100" text-anchor="middle" font-size="10">Parallel +</text>
  <text x="390" y="115" text-anchor="middle" font-size="10">Vectorized</text>

  <rect x="50" y="150" width="400" height="40" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="250" y="175" text-anchor="middle" font-size="12">Choose based on data size and complexity</text>

  <text x="250" y="220" text-anchor="middle" font-size="12">Performance: seq &lt; par &lt; par_unseq</text>
  <text x="250" y="240" text-anchor="middle" font-size="10">(generally, but depends on workload)</text>
</svg>

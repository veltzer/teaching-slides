<svg width="450" height="200" viewBox="0 0 450 200">
  <rect x="20" y="20" width="120" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="80" y="40" text-anchor="middle" font-size="12" font-weight="bold">tuple&lt;int, string, double&gt;</text>
  <text x="80" y="55" text-anchor="middle" font-size="10">42</text>
  <text x="80" y="70" text-anchor="middle" font-size="10">"hello"</text>
  <text x="80" y="85" text-anchor="middle" font-size="10">3.14</text>

  <path d="M 140 60 L 200 60" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="170" y="50" text-anchor="middle" font-size="10">decompose</text>

  <rect x="220" y="20" width="60" height="30" fill="#e8f5e8" stroke="#4caf50" rx="3"/>
  <text x="250" y="40" text-anchor="middle" font-size="10">id: 42</text>

  <rect x="220" y="60" width="60" height="30" fill="#e8f5e8" stroke="#4caf50" rx="3"/>
  <text x="250" y="80" text-anchor="middle" font-size="10">name: "hello"</text>

  <rect x="220" y="100" width="60" height="30" fill="#e8f5e8" stroke="#4caf50" rx="3"/>
  <text x="250" y="120" text-anchor="middle" font-size="10">value: 3.14</text>

  <text x="350" y="40" font-size="12">auto [id, name, value]</text>
  <text x="350" y="55" font-size="12">= getData();</text>
</svg>

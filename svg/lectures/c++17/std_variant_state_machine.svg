<svg width="450" height="250" viewBox="0 0 450 250">
  <text x="225" y="30" text-anchor="middle" font-size="16" font-weight="bold">std::variant&lt;int, string, double&gt;</text>

  <circle cx="100" cy="100" r="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="100" y="105" text-anchor="middle" font-size="12">int</text>

  <circle cx="225" cy="100" r="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2"/>
  <text x="225" y="105" text-anchor="middle" font-size="12">string</text>

  <circle cx="350" cy="100" r="40" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="350" y="105" text-anchor="middle" font-size="12">double</text>

  <path d="M 140 100 L 185 100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 265 100 L 310 100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 310 80 L 265 80" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 185 80 L 140 80" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <text x="225" y="180" text-anchor="middle" font-size="12">Only one type active at a time</text>
  <text x="225" y="200" text-anchor="middle" font-size="10">Type-safe access with std::get or std::visit</text>
</svg>

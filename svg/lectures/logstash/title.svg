<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Pipeline visualization -->
  <!-- Input sources -->
  <rect x="60" y="130" width="100" height="40" rx="6" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="110" y="155" text-anchor="middle" font-family="monospace" font-size="12" fill="#e94560">logs</text>
  <rect x="60" y="185" width="100" height="40" rx="6" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="110" y="210" text-anchor="middle" font-family="monospace" font-size="12" fill="#e94560">metrics</text>
  <rect x="60" y="240" width="100" height="40" rx="6" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="110" y="265" text-anchor="middle" font-family="monospace" font-size="12" fill="#e94560">events</text>
  <!-- Arrows to filter -->
  <line x1="170" y1="150" x2="260" y2="200" stroke="#16c79a" stroke-width="2"/>
  <line x1="170" y1="205" x2="260" y2="200" stroke="#16c79a" stroke-width="2"/>
  <line x1="170" y1="260" x2="260" y2="200" stroke="#16c79a" stroke-width="2"/>
  <!-- Input stage -->
  <rect x="260" y="160" width="120" height="80" rx="10" fill="#16c79a" opacity="0.2" stroke="#16c79a" stroke-width="2"/>
  <text x="320" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16c79a">INPUT</text>
  <text x="320" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#16c79a">collect</text>
  <!-- Arrow -->
  <line x1="390" y1="200" x2="420" y2="200" stroke="#f5a623" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Filter stage -->
  <rect x="420" y="150" width="120" height="100" rx="10" fill="#f5a623" opacity="0.15" stroke="#f5a623" stroke-width="2"/>
  <text x="480" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f5a623">FILTER</text>
  <text x="480" y="210" text-anchor="middle" font-family="monospace" font-size="10" fill="#f5a623">grok | mutate</text>
  <text x="480" y="228" text-anchor="middle" font-family="monospace" font-size="10" fill="#f5a623">date | geoip</text>
  <!-- Arrow -->
  <line x1="550" y1="200" x2="580" y2="200" stroke="#e94560" stroke-width="3"/>
  <!-- Output stage -->
  <rect x="580" y="160" width="120" height="80" rx="10" fill="#e94560" opacity="0.15" stroke="#e94560" stroke-width="2"/>
  <text x="640" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e94560">OUTPUT</text>
  <text x="640" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#e94560">elasticsearch</text>
  <!-- Output destinations -->
  <line x1="710" y1="190" x2="760" y2="170" stroke="#e94560" stroke-width="1.5"/>
  <line x1="710" y1="200" x2="760" y2="200" stroke="#e94560" stroke-width="1.5"/>
  <line x1="710" y1="210" x2="760" y2="230" stroke="#e94560" stroke-width="1.5"/>
  <circle cx="770" cy="170" r="8" fill="#e94560" opacity="0.5"/>
  <circle cx="770" cy="200" r="8" fill="#e94560" opacity="0.5"/>
  <circle cx="770" cy="230" r="8" fill="#e94560" opacity="0.5"/>
  <!-- Title -->
  <text x="400" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#eee">Logstash</text>
  <text x="400" y="85" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#888">Data Processing Pipeline</text>
  <text x="400" y="370" text-anchor="middle" font-family="monospace" font-size="13" fill="#666">input | filter | output</text>
</svg>

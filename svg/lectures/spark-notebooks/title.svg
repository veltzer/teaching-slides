<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Notebook shape -->
  <rect x="250" y="90" width="300" height="220" rx="8" fill="#0f3460" stroke="#16c79a" stroke-width="2"/>
  <!-- Spiral binding -->
  <circle cx="265" cy="110" r="6" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="265" cy="140" r="6" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="265" cy="170" r="6" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="265" cy="200" r="6" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="265" cy="230" r="6" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="265" cy="260" r="6" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="265" cy="290" r="6" fill="none" stroke="#888" stroke-width="1.5"/>
  <!-- Code cell -->
  <rect x="285" y="105" width="250" height="50" rx="4" fill="#1a1a2e" stroke="#e94560" stroke-width="1"/>
  <text x="295" y="125" font-family="monospace" font-size="10" fill="#e94560">In [1]:</text>
  <text x="295" y="142" font-family="monospace" font-size="10" fill="#16c79a">df.groupBy("col").count()</text>
  <!-- Output cell -->
  <rect x="285" y="165" width="250" height="40" rx="4" fill="#16c79a" opacity="0.1" stroke="#16c79a" stroke-width="1"/>
  <text x="295" y="182" font-family="monospace" font-size="10" fill="#16c79a">Out[1]: DataFrame[col, count]</text>
  <!-- Chart cell -->
  <rect x="285" y="215" width="250" height="80" rx="4" fill="#1a1a2e" stroke="#f5a623" stroke-width="1"/>
  <rect x="305" y="240" width="18" height="40" fill="#e94560" opacity="0.6"/>
  <rect x="330" y="250" width="18" height="30" fill="#16c79a" opacity="0.6"/>
  <rect x="355" y="230" width="18" height="50" fill="#f5a623" opacity="0.6"/>
  <rect x="380" y="255" width="18" height="25" fill="#a855f7" opacity="0.6"/>
  <rect x="405" y="235" width="18" height="45" fill="#3b82f6" opacity="0.6"/>
  <!-- Spark logo hint -->
  <polygon points="640,170 660,150 680,170 660,190" fill="#e94560" opacity="0.5"/>
  <polygon points="650,180 670,160 690,180 670,200" fill="#f5a623" opacity="0.4"/>
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#eee">Spark Notebooks</text>
  <text x="400" y="370" text-anchor="middle" font-family="monospace" font-size="13" fill="#666">interactive | exploratory | data analysis</text>
</svg>

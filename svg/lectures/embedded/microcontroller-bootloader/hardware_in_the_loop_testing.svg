<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="218.1819" height="158.1818" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="149.091" y="105.9092" text-anchor="middle" font-size="23.8972" font-family="Arial, sans-serif" fill="var(--primary-text)">Test PC</text>
  <text x="149.091" y="145.4545" text-anchor="middle" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--primary-text)">Python Script</text>
  <rect x="367.2728" y="40" width="218.1819" height="158.1818" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="476.3636" y="105.9092" text-anchor="middle" font-size="23.8972" font-family="Arial, sans-serif" fill="var(--warn-text)">Debug Probe</text>
  <text x="476.3636" y="145.4545" text-anchor="middle" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--warn-text)">ST-Link/J-Link</text>
  <rect x="694.5453" y="40" width="218.1819" height="158.1818" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="803.6362" y="105.9092" text-anchor="middle" font-size="23.8972" font-family="Arial, sans-serif" fill="var(--info-text)">Target MCU</text>
  <text x="803.6362" y="145.4545" text-anchor="middle" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--info-text)">STM32</text>
  <rect x="1021.8181" y="40" width="218.1819" height="158.1818" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1130.909" y="105.9092" text-anchor="middle" font-size="23.8972" font-family="Arial, sans-serif" fill="var(--ok-text)">Power Supply</text>
  <text x="1130.909" y="145.4545" text-anchor="middle" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--ok-text)">Controllable</text>
  <path d="M 258.1819 119.0909 L 367.2728 119.0909" stroke="var(--text)" stroke-width="1.1229"/>
  <text x="312.7273" y="105.9092" text-anchor="middle" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">USB</text>
  <path d="M 585.4547 119.0909 L 694.5453 119.0909" stroke="var(--text)" stroke-width="1.1229"/>
  <text x="639.9999" y="105.9092" text-anchor="middle" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">SWD</text>
  <path d="M 912.7272 119.0909 L 1021.8181 119.0909" stroke="var(--text)" stroke-width="1.1229"/>
  <text x="967.2727" y="105.9092" text-anchor="middle" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">Power</text>
  <rect x="40" y="303.6363" width="1199.9996" height="316.3637" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="639.9999" y="356.3637" text-anchor="middle" font-size="26.0696" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Automated Test Cases</text>
  <text x="83.6364" y="409.0908" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">• Power-on reset behavior</text>
  <text x="83.6364" y="448.6363" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">• Bootloader timeout handling</text>
  <text x="83.6364" y="488.1817" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">• Firmware update via UART/USB</text>
  <text x="83.6364" y="527.7272" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">• Application validation &amp; launch</text>
  <text x="83.6364" y="567.2727" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">• Recovery from corrupted firmware</text>
  <text x="694.5453" y="409.0908" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">• Brown-out detection</text>
  <text x="694.5453" y="448.6363" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">• Watchdog reset scenarios</text>
  <text x="694.5453" y="488.1817" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">• Flash programming errors</text>
  <text x="694.5453" y="527.7272" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">• Communication protocol edge cases</text>
  <text x="694.5453" y="567.2727" font-size="21.7247" font-family="Arial, sans-serif" fill="var(--text)">• Multi-bank switching</text>
</svg>

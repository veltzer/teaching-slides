<svg viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="64" y="78" width="128" height="93.6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="128" y="117" text-anchor="middle" font-size="14.08">Test PC</text>
  <text x="128" y="140.4" text-anchor="middle" font-size="12.8">Python Script</text>
  <rect x="256" y="78" width="128" height="93.6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="320" y="117" text-anchor="middle" font-size="14.08">Debug Probe</text>
  <text x="320" y="140.4" text-anchor="middle" font-size="12.8">ST-Link/J-Link</text>
  <rect x="448" y="78" width="128" height="93.6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="512" y="117" text-anchor="middle" font-size="14.08">Target MCU</text>
  <text x="512" y="140.4" text-anchor="middle" font-size="12.8">STM32</text>
  <rect x="640" y="78" width="128" height="93.6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="704" y="117" text-anchor="middle" font-size="14.08">Power Supply</text>
  <text x="704" y="140.4" text-anchor="middle" font-size="12.8">Controllable</text>
  <path d="M 192 124.8 L 256 124.8" stroke="var(--text)" stroke-width="2.56" />
  <text x="224" y="117" text-anchor="middle" font-size="12.8">USB</text>
  <path d="M 384 124.8 L 448 124.8" stroke="var(--text)" stroke-width="2.56" />
  <text x="416" y="117" text-anchor="middle" font-size="12.8">SWD</text>
  <path d="M 576 124.8 L 640 124.8" stroke="var(--text)" stroke-width="2.56" />
  <text x="608" y="117" text-anchor="middle" font-size="12.8">Power</text>
  <rect x="64" y="234" width="704" height="187.2" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="416" y="265.2" text-anchor="middle" font-size="15.36" font-weight="bold">Automated Test Cases</text>
  <text x="89.6" y="296.4" font-size="12.8">• Power-on reset behavior</text>
  <text x="89.6" y="319.8" font-size="12.8">• Bootloader timeout handling</text>
  <text x="89.6" y="343.2" font-size="12.8">• Firmware update via UART/USB</text>
  <text x="89.6" y="366.6" font-size="12.8">• Application validation &amp; launch</text>
  <text x="89.6" y="390" font-size="12.8">• Recovery from corrupted firmware</text>
  <text x="448" y="296.4" font-size="12.8">• Brown-out detection</text>
  <text x="448" y="319.8" font-size="12.8">• Watchdog reset scenarios</text>
  <text x="448" y="343.2" font-size="12.8">• Flash programming errors</text>
  <text x="448" y="366.6" font-size="12.8">• Communication protocol edge cases</text>
  <text x="448" y="390" font-size="12.8">• Multi-bank switching</text>
</svg>
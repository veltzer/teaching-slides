<svg viewBox="0 0 1280 720">
  <ellipse cx="128" cy="144" rx="76.8" ry="51.2" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.56" />
  <text x="128" y="151.2" text-anchor="middle" font-size="15.36">Update Server</text>
  <path d="M 230.4 144 Q 320 86.4 409.6 144" stroke="#333" stroke-width="3.84" fill="none" />
  <path d="M 230.4 144 Q 320 115.2 409.6 144" stroke="#333" stroke-width="3.84" fill="none" />
  <path d="M 230.4 144 Q 320 172.8 409.6 144" stroke="#333" stroke-width="3.84" fill="none" />
  <text x="320" y="201.6" text-anchor="middle" font-size="12.8">WiFi/Cellular</text>
  <rect x="448" y="100.8" width="102.4" height="86.4" fill="#fff3e0" stroke="#f57c00" stroke-width="2.56" rx="6.4" />
  <text x="499.2" y="151.2" text-anchor="middle" font-size="15.36">IoT Device</text>
  <rect x="640" y="72" width="192" height="36" fill="#e8f5e8" stroke="#388e3c" stroke-width="1.28" rx="3.84" />
  <text x="736" y="96.48" text-anchor="middle" font-size="12.8">1. Check for updates</text>
  <rect x="640" y="115.2" width="192" height="36" fill="#fff3e0" stroke="#f57c00" stroke-width="1.28" rx="3.84" />
  <text x="736" y="139.68" text-anchor="middle" font-size="12.8">2. Download firmware</text>
  <rect x="640" y="158.4" width="192" height="36" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.28" rx="3.84" />
  <text x="736" y="182.88" text-anchor="middle" font-size="12.8">3. Verify signature</text>
  <rect x="640" y="201.6" width="192" height="36" fill="#ffebee" stroke="#d32f2f" stroke-width="1.28" rx="3.84" />
  <text x="736" y="226.08" text-anchor="middle" font-size="12.8">4. Install &amp; reboot</text>
  <rect x="640" y="244.8" width="192" height="36" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.28" rx="3.84" />
  <text x="736" y="269.28" text-anchor="middle" font-size="12.8">5. Confirm success</text>
  <path d="M 550.4 144 L 640 144" stroke="#333" stroke-width="2.56" marker-end="url(#arrow)" />
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead" markerWidth="18.2857" markerHeight="14.4" refX="16.4571" refY="7.2" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#333" />
    </marker>
  </defs>
</svg>
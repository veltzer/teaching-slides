<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="853.3333" height="480" fill="var(--code-bg)" rx="6"/>
  <rect x="298.6667" y="120" width="256" height="240" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="3.2" />
  <rect x="330.6667" y="105.6" width="8.5333" height="16.8" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="362.6667" y="105.6" width="8.5333" height="16.8" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="394.6667" y="105.6" width="8.5333" height="16.8" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="426.6667" y="105.6" width="8.5333" height="16.8" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="458.6667" y="105.6" width="8.5333" height="16.8" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="490.6667" y="105.6" width="8.5333" height="16.8" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="330.6667" y="357.6" width="8.5333" height="16.8" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="362.6667" y="357.6" width="8.5333" height="16.8" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="394.6667" y="357.6" width="8.5333" height="16.8" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="426.6667" y="357.6" width="8.5333" height="16.8" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="458.6667" y="357.6" width="8.5333" height="16.8" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="490.6667" y="357.6" width="8.5333" height="16.8" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="330.6667" y="144" width="192" height="48" rx="6" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" />
  <text x="426.6667" y="174" text-anchor="middle" font-family="monospace" font-size="13.8667" fill="var(--danger-accent)">BOOTLOADER</text>
  <rect x="330.6667" y="201.6" width="192" height="36" rx="6" fill="var(--warn-fill)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2" />
  <text x="426.6667" y="225.6" text-anchor="middle" font-family="monospace" font-size="11.7333" fill="var(--warn-accent)">VECTOR TABLE</text>
  <rect x="330.6667" y="247.2" width="192" height="84" rx="6" fill="var(--ok-fill)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" />
  <text x="426.6667" y="294" text-anchor="middle" font-family="monospace" font-size="13.8667" fill="var(--ok-accent)">APPLICATION</text>
  <path d="M 138.6667 240 L 288 240" stroke="var(--danger-border)" stroke-width="2.6667" stroke-dasharray="6.4 3.2" />
  <polygon points="288,232.8 300.8,240 288,247.2" fill="var(--danger-fill)" />
  <text x="138.6667" y="222" font-family="monospace" font-size="12.8" fill="var(--danger-accent)">RESET</text>
  <path d="M 576 174 C 640 174 640 288 576 288" stroke="var(--ok-border)" stroke-width="2.1333" fill="none" stroke-dasharray="4.2667 3.2" />
  <polygon points="576,280.8 563.2,288 576,295.2" fill="var(--ok-fill)" />
  <text x="650.6667" y="234" font-family="monospace" font-size="11.7333" fill="var(--text-faint)">jump to app</text>
  <polygon points="725.3333,156 746.6667,204 736,204 757.3333,252 714.6667,204 725.3333,204" fill="var(--warn-fill)" opacity="0.8" />
  <text x="736" y="288" text-anchor="middle" font-family="monospace" font-size="11.7333" fill="var(--warn-accent)">FLASH</text>
  <text x="426.6667" y="60" text-anchor="middle" font-family="sans-serif" font-size="27.7333" font-weight="bold" fill="var(--surface)">Microcontroller Bootloader</text>
  <text x="426.6667" y="444" text-anchor="middle" font-family="monospace" font-size="13.8667" fill="var(--text-muted)">reset vector | firmware update | application launch</text>
</svg>
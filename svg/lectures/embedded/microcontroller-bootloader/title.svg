  <rect x="673.3334" y="190" width="8.8889" height="17.5" fill="var(--ok-fill)" rx="6.25" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="706.6667" y="190" width="8.8889" height="17.5" fill="var(--ok-fill)" rx="6.25" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="540.0001" y="452.5" width="8.8889" height="17.5" fill="var(--ok-fill)" rx="6.25" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="573.3334" y="452.5" width="8.8889" height="17.5" fill="var(--ok-fill)" rx="6.25" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="606.6667" y="452.5" width="8.8889" height="17.5" fill="var(--ok-fill)" rx="6.25" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="640.0001" y="452.5" width="8.8889" height="17.5" fill="var(--ok-fill)" rx="6.25" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="673.3334" y="452.5" width="8.8889" height="17.5" fill="var(--ok-fill)" rx="6.25" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="706.6667" y="452.5" width="8.8889" height="17.5" fill="var(--ok-fill)" rx="6.25" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="540.0001" y="230" width="200" height="50" rx="6.25" fill="var(--danger-fill)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640.0001" y="261.25" text-anchor="middle" font-family="monospace" font-size="14.4445" fill="var(--danger-accent)">BOOTLOADER</text>
  <rect x="540.0001" y="290" width="200" height="37.5" rx="6.25" fill="var(--warn-fill)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.0001" y="315" text-anchor="middle" font-family="monospace" font-size="12.2222" fill="var(--warn-accent)">VECTOR TABLE</text>
  <rect x="540.0001" y="337.5" width="200" height="87.5" rx="6.25" fill="var(--ok-fill)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640.0001" y="386.25" text-anchor="middle" font-family="monospace" font-size="14.4445" fill="var(--ok-accent)">APPLICATION</text>
  <path d="M 340.0001 330 L 495.5556 330" stroke="var(--danger-border)" stroke-width="2.6667" stroke-dasharray="6.4 3.2" />
  <polygon points="495.5556,322.5 508.8889,330 495.5556,337.5" fill="var(--danger-fill)" />
  <text x="340.0001" y="311.25" font-family="monospace" font-size="13.3333" fill="var(--danger-accent)">RESET</text>
  <path d="M 795.5556 261.25 C 862.2222 261.25 862.2222 380 795.5556 380" stroke="var(--ok-border)" stroke-width="2.1333" fill="none" stroke-dasharray="4.2667 3.2" />
  <polygon points="795.5556,372.5 782.2222,380 795.5556,387.5" fill="var(--ok-fill)" />
  <text x="873.3334" y="323.75" font-family="monospace" font-size="12.2222" fill="var(--text-faint)">jump to app</text>
  <polygon points="951.1111,242.5 973.3334,292.5 962.2222,292.5 984.4444,342.5 940.0001,292.5 951.1111,292.5" fill="var(--warn-fill)" opacity="0.8" />
  <text x="962.2222" y="380" text-anchor="middle" font-family="monospace" font-size="12.2222" fill="var(--warn-accent)">FLASH</text>
  <text x="640.0001" y="142.5" text-anchor="middle" font-family="sans-serif" font-size="28.8889" font-weight="bold" fill="var(--surface)">Microcontroller Bootloader</text>
  <text x="640.0001" y="542.5" text-anchor="middle" font-family="monospace" font-size="14.4445" fill="var(--text-muted)">reset vector | firmware update | application launch</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="132.21822" height="132.218" rx="14.000012" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="0.8355" filter="url(#shadow)"/>
  <text x="106.10921" y="117.3036" text-anchor="middle" font-size="22.036518" font-family="Arial, sans-serif" fill="var(--primary-text)">IDLE</text>
  <rect x="395.927593" y="40" width="132.21822" height="132.218" rx="14.000012" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="0.8355" filter="url(#shadow)"/>
  <text x="462.037103" y="117.3036" text-anchor="middle" font-size="22.036518" font-family="Arial, sans-serif" fill="var(--warn-text)">SYNC</text>
  <rect x="751.855186" y="40" width="132.21822" height="132.218" rx="14.000012" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="0.8355" filter="url(#shadow)"/>
  <text x="817.964697" y="117.3036" text-anchor="middle" font-size="22.036518" font-family="Arial, sans-serif" fill="var(--info-text)">RECEIVE</text>
  <rect x="1107.78178" y="40" width="132.21822" height="132.218" rx="14.000012" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="0.8355" filter="url(#shadow)"/>
  <text x="1173.89279" y="117.3036" text-anchor="middle" font-size="22.036518" font-family="Arial, sans-serif" fill="var(--ok-text)">VERIFY</text>
  <rect x="751.855186" y="308.669" width="132.21822" height="132.218" rx="14.000012" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="0.8355" filter="url(#shadow)"/>
  <text x="817.964697" y="385.9726" text-anchor="middle" font-size="22.036518" font-family="Arial, sans-serif" fill="var(--danger-text)">ERROR</text>
  <rect x="395.927593" y="487.782" width="132.21822" height="132.218" rx="14.000012" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="0.8355" filter="url(#shadow)"/>
  <text x="462.037103" y="565.0853" text-anchor="middle" font-size="22.036518" font-family="Arial, sans-serif" fill="var(--ok-text)">COMPLETE</text>
  <path d="M 177.294629 106.1091 L 390.851385 106.1091" stroke="var(--text)" stroke-width="0.8355" marker-end="url(#arrow)" />
  <text x="284.073007" y="94.9147" text-anchor="middle" font-size="22.036518" font-family="Arial, sans-serif" fill="var(--text)">START</text>
  <path d="M 533.222422 106.1091 L 746.779378 106.1091" stroke="var(--text)" stroke-width="0.8355" marker-end="url(#arrow)" />
  <text x="640.0009" y="94.9147" text-anchor="middle" font-size="22.036518" font-family="Arial, sans-serif" fill="var(--text)">BEGIN</text>
  <path d="M 889.150315 106.1091 L 1102.707171 106.1091" stroke="var(--text)" stroke-width="0.8355" marker-end="url(#arrow)" />
  <text x="995.928793" y="94.9147" text-anchor="middle" font-size="22.036518" font-family="Arial, sans-serif" fill="var(--text)">END</text>
  <path d="M 817.964697 173.2764 L 817.964697 307.6109" stroke="var(--danger-border)" stroke-width="0.8355" marker-end="url(#arrow)" />
  <text x="877.286095" y="240.4436" text-anchor="middle" font-size="22.036518" font-family="Arial, sans-serif" fill="var(--text)">ERROR</text>
  <path d="M 1102.707171 106.1091 L 533.222422 553.8909" stroke="var(--ok-border)" stroke-width="0.8355" marker-end="url(#arrow)" />
  <text x="936.607594" y="285.222" text-anchor="middle" font-size="22.036518" font-family="Arial, sans-serif" fill="var(--text)">SUCCESS</text>
  <path d="M 746.779378 374.7782 L 177.294629 106.1091" stroke="var(--danger-border)" stroke-width="0.8355" marker-end="url(#arrow)" />
  <text x="343.394306" y="262.8326" text-anchor="middle" font-size="22.036518" font-family="Arial, sans-serif" fill="var(--text)">RETRY</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <circle cx="166.6272" cy="137.6923" r="57.6923" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.25" />
  <text x="166.6272" y="147.3077" text-anchor="middle" font-size="19.2308">IDLE</text>
  <circle cx="482.2091" cy="137.6923" r="57.6923" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.25" />
  <text x="482.2091" y="147.3077" text-anchor="middle" font-size="19.2308">SYNC</text>
  <circle cx="797.7909" cy="137.6923" r="57.6923" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.25" />
  <text x="797.7909" y="147.3077" text-anchor="middle" font-size="19.2308">RECEIVE</text>
  <circle cx="1113.3728" cy="137.6923" r="57.6923" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.25" />
  <text x="1113.3728" y="147.3077" text-anchor="middle" font-size="19.2308">VERIFY</text>
  <circle cx="797.7909" cy="368.4615" r="57.6923" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.25" />
  <text x="797.7909" y="378.0769" text-anchor="middle" font-size="19.2308">ERROR</text>
  <circle cx="482.2091" cy="522.3077" r="57.6923" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.25" />
  <text x="482.2091" y="531.9231" text-anchor="middle" font-size="19.2308">COMPLETE</text>
  <path d="M 229.7436 137.6923 L 419.0926 137.6923" stroke="var(--text)" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="324.4181" y="128.0769" text-anchor="middle" font-size="19.2308">START</text>
  <path d="M 545.3255 137.6923 L 734.6745 137.6923" stroke="var(--text)" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="640" y="128.0769" text-anchor="middle" font-size="19.2308">BEGIN</text>
  <path d="M 860.9072 137.6923 L 1050.2564 137.6923" stroke="var(--text)" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="955.5819" y="128.0769" text-anchor="middle" font-size="19.2308">END</text>
  <path d="M 797.7909 195.3846 L 797.7909 310.7692" stroke="var(--danger-border)" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="850.3879" y="253.0769" text-anchor="middle" font-size="19.2308">ERROR</text>
  <path d="M 1050.2564 137.6923 L 545.3255 522.3077" stroke="var(--ok-border)" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="902.9848" y="291.5385" text-anchor="middle" font-size="19.2308">SUCCESS</text>
  <path d="M 734.6745 368.4615 L 229.7436 137.6923" stroke="var(--danger-border)" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="377.0152" y="272.3077" text-anchor="middle" font-size="19.2308">RETRY</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.8923,0" fill="#333" />
    </marker>
  </defs>
</svg>
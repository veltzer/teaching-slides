<svg viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <circle cx="123.0769" cy="90" r="33.75" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.25" />
  <text x="123.0769" y="95.625" text-anchor="middle" font-size="11.25">IDLE</text>
  <circle cx="307.6923" cy="90" r="33.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.25" />
  <text x="307.6923" y="95.625" text-anchor="middle" font-size="11.25">SYNC</text>
  <circle cx="492.3077" cy="90" r="33.75" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.25" />
  <text x="492.3077" y="95.625" text-anchor="middle" font-size="11.25">RECEIVE</text>
  <circle cx="676.9231" cy="90" r="33.75" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.25" />
  <text x="676.9231" y="95.625" text-anchor="middle" font-size="11.25">VERIFY</text>
  <circle cx="492.3077" cy="225" r="33.75" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.25" />
  <text x="492.3077" y="230.625" text-anchor="middle" font-size="11.25">ERROR</text>
  <circle cx="307.6923" cy="315" r="33.75" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.25" />
  <text x="307.6923" y="320.625" text-anchor="middle" font-size="11.25">COMPLETE</text>
  <path d="M 160 90 L 270.7692 90" stroke="var(--text)" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="215.3846" y="84.375" text-anchor="middle" font-size="11.25">START</text>
  <path d="M 344.6154 90 L 455.3846 90" stroke="var(--text)" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="400" y="84.375" text-anchor="middle" font-size="11.25">BEGIN</text>
  <path d="M 529.2307 90 L 640 90" stroke="var(--text)" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="584.6154" y="84.375" text-anchor="middle" font-size="11.25">END</text>
  <path d="M 492.3077 123.75 L 492.3077 191.25" stroke="var(--danger-border)" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="523.0769" y="157.5" text-anchor="middle" font-size="11.25">ERROR</text>
  <path d="M 640 90 L 344.6154 315" stroke="var(--ok-border)" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="553.8461" y="180" text-anchor="middle" font-size="11.25">SUCCESS</text>
  <path d="M 455.3846 225 L 160 90" stroke="var(--danger-border)" stroke-width="2.25" marker-end="url(#arrow)" />
  <text x="246.1539" y="168.75" text-anchor="middle" font-size="11.25">RETRY</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.8923,0" fill="#333" />
    </marker>
  </defs>
</svg>
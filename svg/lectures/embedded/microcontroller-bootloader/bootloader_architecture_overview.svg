<svg viewBox="0 0 1280 720">
  <rect x="88.8889" y="75" width="266.6667" height="450" fill="#f5f5f5" stroke="#333" stroke-width="3" />
  <text x="222.2223" y="60" text-anchor="middle" font-size="21" font-weight="bold">Flash Memory</text>
  <rect x="106.6667" y="90" width="231.1111" height="90" fill="#ffcdd2" stroke="#d32f2f" stroke-width="3" />
  <text x="222.2223" y="127.5" text-anchor="middle" font-size="18">Bootloader</text>
  <text x="222.2223" y="157.5" text-anchor="middle" font-size="15">0x08000000</text>
  <rect x="106.6667" y="195" width="231.1111" height="180" fill="#c8e6c9" stroke="#388e3c" stroke-width="3" />
  <text x="222.2223" y="232.5" text-anchor="middle" font-size="18">Application</text>
  <text x="222.2223" y="262.5" text-anchor="middle" font-size="15">0x08004000</text>
  <rect x="106.6667" y="390" width="231.1111" height="120" fill="#fff3e0" stroke="#f57c00" stroke-width="3" />
  <text x="222.2223" y="427.5" text-anchor="middle" font-size="18">Config/Data</text>
  <text x="222.2223" y="457.5" text-anchor="middle" font-size="15">0x08080000</text>
  <rect x="533.3333" y="120" width="213.3333" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="7.5" />
  <text x="640" y="157.5" text-anchor="middle" font-size="16.5">Power On Reset</text>
  <rect x="533.3333" y="210" width="213.3333" height="60" fill="#fff3e0" stroke="#f57c00" stroke-width="3" rx="7.5" />
  <text x="640" y="247.5" text-anchor="middle" font-size="16.5">Hardware Init</text>
  <rect x="533.3333" y="300" width="213.3333" height="60" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="7.5" />
  <text x="640" y="337.5" text-anchor="middle" font-size="16.5">Check for Update</text>
  <rect x="533.3333" y="390" width="213.3333" height="60" fill="#e8f5e8" stroke="#388e3c" stroke-width="3" rx="7.5" />
  <text x="640" y="427.5" text-anchor="middle" font-size="16.5">Launch App</text>
  <path d="M 640 180 L 640 210" stroke="#333" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 640 270 L 640 300" stroke="#333" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 640 360 L 640 390" stroke="#333" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 355.5556 135 L 533.3333 150" stroke="#333" stroke-width="3" marker-end="url(#arrow)" />
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead" markerWidth="21.3333" markerHeight="12.6" refX="19.2" refY="6.3" orient="auto">
      <polygon points="0,18 7.4667,0" fill="#333" />

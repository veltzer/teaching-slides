<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="58.7096" width="486.4865" height="561.2904" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="283.2433" y="40" text-anchor="middle" font-size="31.678" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Flash Memory</text>
  <rect x="72.4325" y="77.4194" width="421.6216" height="112.258" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="283.2433" y="124.1935" text-anchor="middle" font-size="27.1526" font-family="Arial, sans-serif" fill="var(--danger-text)">Bootloader</text>
  <text x="283.2433" y="161.6129" text-anchor="middle" font-size="22.6271" font-family="Arial, sans-serif" fill="var(--danger-text)">0x08000000</text>
  <rect x="72.4325" y="208.3871" width="421.6216" height="224.5161" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="283.2433" y="255.1613" text-anchor="middle" font-size="27.1526" font-family="Arial, sans-serif" fill="var(--ok-text)">Application</text>
  <text x="283.2433" y="292.5807" text-anchor="middle" font-size="22.6271" font-family="Arial, sans-serif" fill="var(--ok-text)">0x08004000</text>
  <rect x="72.4325" y="451.6129" width="421.6216" height="149.6774" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="283.2433" y="498.3871" text-anchor="middle" font-size="27.1526" font-family="Arial, sans-serif" fill="var(--warn-text)">Config/Data</text>
  <text x="283.2433" y="535.8065" text-anchor="middle" font-size="22.6271" font-family="Arial, sans-serif" fill="var(--warn-text)">0x08080000</text>
  <rect x="850.8108" y="114.8386" width="389.1892" height="74.8386" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1045.4055" y="161.6129" text-anchor="middle" font-size="24.8898" font-family="Arial, sans-serif" fill="var(--primary-text)">Power On Reset</text>
  <rect x="850.8108" y="227.0967" width="389.1892" height="74.8386" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1045.4055" y="273.8711" text-anchor="middle" font-size="24.8898" font-family="Arial, sans-serif" fill="var(--warn-text)">Hardware Init</text>
  <rect x="850.8108" y="339.3549" width="389.1892" height="74.8386" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1045.4055" y="386.1291" text-anchor="middle" font-size="24.8898" font-family="Arial, sans-serif" fill="var(--info-text)">Check for Update</text>
  <rect x="850.8108" y="451.6129" width="389.1892" height="74.8386" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1045.4055" y="498.3871" text-anchor="middle" font-size="24.8898" font-family="Arial, sans-serif" fill="var(--ok-text)">Launch App</text>
  <path d="M 1045.4055 189.6774 L 1045.4055 227.0967" stroke="var(--text)" stroke-width="1.5906" marker-end="url(#arrow)"/>
  <path d="M 1045.4055 301.9355 L 1045.4055 339.3549" stroke="var(--text)" stroke-width="1.5906" marker-end="url(#arrow)"/>
  <path d="M 1045.4055 414.1935 L 1045.4055 451.6129" stroke="var(--text)" stroke-width="1.5906" marker-end="url(#arrow)"/>
  <path d="M 526.4865 133.5484 L 850.8108 152.258" stroke="var(--text)" stroke-width="1.5906" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

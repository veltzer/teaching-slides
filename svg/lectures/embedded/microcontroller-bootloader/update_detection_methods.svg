  <text x="785.1851" y="261.9444" text-anchor="middle" font-size="20.7408">Network updates</text>
  <rect x="951.1111" y="98.6112" width="248.8889" height="217.7777" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="10.3056" />
  <text x="1075.5554" y="166.6667" text-anchor="middle" font-size="22.8148" font-weight="bold">App Invalid</text>
  <text x="1075.5554" y="221.1111" text-anchor="middle" font-size="20.7408">CRC/checksum</text>
  <text x="1075.5554" y="261.9444" text-anchor="middle" font-size="20.7408">Automatic recovery</text>
  <rect x="494.8147" y="452.5" width="414.8147" height="108.8888" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="10.3056" />

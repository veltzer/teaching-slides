  <path d="M 494.8147 316.3889 L 660.7407 452.5" stroke="var(--text)" stroke-width="2.4151" marker-end="url(#arrow)" />
  <path d="M 785.1851 316.3889 L 743.7035 452.5" stroke="var(--text)" stroke-width="2.4151" marker-end="url(#arrow)" />
  <path d="M 1075.5554 316.3889 L 764.4443 452.5" stroke="var(--text)" stroke-width="2.4151" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;

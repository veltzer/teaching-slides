<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="62.3075" width="293.8776" height="557.6925" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="186.9389" y="40" text-anchor="middle" font-size="30.8512" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Bank 1</text>
  <rect x="407.3469" y="62.3075" width="293.8776" height="557.6925" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="554.2858" y="40" text-anchor="middle" font-size="30.8512" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Bank 2</text>
  <rect x="64.4899" y="84.6154" width="244.8979" height="89.2307" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="186.9389" y="140.3846" text-anchor="middle" font-size="24.2402" font-family="Arial, sans-serif" fill="var(--danger-text)">Bootloader</text>
  <rect x="431.8366" y="84.6154" width="244.8979" height="89.2307" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="554.2858" y="140.3846" text-anchor="middle" font-size="24.2402" font-family="Arial, sans-serif" fill="var(--danger-text)">Bootloader</text>
  <rect x="64.4899" y="196.1538" width="244.8979" height="178.4617" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="186.9389" y="251.9232" text-anchor="middle" font-size="24.2402" font-family="Arial, sans-serif" fill="var(--ok-text)">App v1.0</text>
  <text x="186.9389" y="296.5386" text-anchor="middle" font-size="22.0366" font-family="Arial, sans-serif" fill="var(--ok-text)">(Running)</text>
  <rect x="431.8366" y="196.1538" width="244.8979" height="178.4617" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="554.2858" y="251.9232" text-anchor="middle" font-size="24.2402" font-family="Arial, sans-serif" fill="var(--warn-text)">App v1.1</text>
  <text x="554.2858" y="296.5386" text-anchor="middle" font-size="22.0366" font-family="Arial, sans-serif" fill="var(--warn-text)">(Staging)</text>
  <rect x="897.1429" y="129.2309" width="342.8571" height="66.9232" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5715" y="173.8463" text-anchor="middle" font-size="24.2402" font-family="Arial, sans-serif" fill="var(--primary-text)">1. Download to Bank 2</text>
  <rect x="897.1429" y="218.4615" width="342.8571" height="66.9232" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5715" y="263.0769" text-anchor="middle" font-size="24.2402" font-family="Arial, sans-serif" fill="var(--warn-text)">2. Verify Integrity</text>
  <rect x="897.1429" y="307.6924" width="342.8571" height="66.9232" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5715" y="352.3078" text-anchor="middle" font-size="24.2402" font-family="Arial, sans-serif" fill="var(--info-text)">3. Update Boot Flag</text>
  <rect x="897.1429" y="396.9233" width="342.8571" height="66.9232" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5715" y="441.5383" text-anchor="middle" font-size="24.2402" font-family="Arial, sans-serif" fill="var(--ok-text)">4. Reboot to Bank 2</text>
  <path d="M 701.2245 285.3847 L 897.1429 162.6924" stroke="var(--text)" stroke-width="1.2647" marker-end="url(#arrow)" />
  <path d="M 1068.5715 196.1538 L 1068.5715 218.4615" stroke="var(--text)" stroke-width="1.2647" marker-end="url(#arrow)" />
  <path d="M 1068.5715 285.3847 L 1068.5715 307.6924" stroke="var(--text)" stroke-width="1.2647" marker-end="url(#arrow)" />
  <path d="M 1068.5715 374.6155 L 1068.5715 396.9233" stroke="var(--text)" stroke-width="1.2647" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
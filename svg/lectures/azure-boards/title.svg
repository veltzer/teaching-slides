<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="azure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4"/>
      <stop offset="100%" style="stop-color:#00bcf2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Kanban board columns -->
  <rect x="80" y="60" width="180" height="280" rx="8" fill="#0f3460" stroke="#0078d4" stroke-width="2"/>
  <rect x="80" y="60" width="180" height="40" rx="8" fill="#0078d4"/>
  <text x="170" y="86" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">TO DO</text>
  <rect x="100" y="115" width="140" height="35" rx="5" fill="#1a5276" stroke="#3498db" stroke-width="1"/>
  <rect x="100" y="160" width="140" height="35" rx="5" fill="#1a5276" stroke="#3498db" stroke-width="1"/>
  <rect x="100" y="205" width="140" height="35" rx="5" fill="#1a5276" stroke="#3498db" stroke-width="1"/>
  <!-- In Progress column -->
  <rect x="290" y="60" width="180" height="280" rx="8" fill="#0f3460" stroke="#f39c12" stroke-width="2"/>
  <rect x="290" y="60" width="180" height="40" rx="8" fill="#f39c12"/>
  <text x="380" y="86" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">IN PROGRESS</text>
  <rect x="310" y="115" width="140" height="35" rx="5" fill="#1a5276" stroke="#e67e22" stroke-width="1"/>
  <rect x="310" y="160" width="140" height="35" rx="5" fill="#1a5276" stroke="#e67e22" stroke-width="1"/>
  <!-- Done column -->
  <rect x="500" y="60" width="180" height="280" rx="8" fill="#0f3460" stroke="#27ae60" stroke-width="2"/>
  <rect x="500" y="60" width="180" height="40" rx="8" fill="#27ae60"/>
  <text x="590" y="86" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">DONE</text>
  <rect x="520" y="115" width="140" height="35" rx="5" fill="#1a5276" stroke="#2ecc71" stroke-width="1"/>
  <!-- Checkmarks on done items -->
  <text x="640" y="138" fill="#2ecc71" font-family="Arial" font-size="16">&#10003;</text>
  <!-- Sprint indicator -->
  <rect x="700" y="80" width="80" height="240" rx="8" fill="none" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="740" y="200" text-anchor="middle" fill="#9b59b6" font-family="Arial" font-size="11" transform="rotate(-90,740,200)">SPRINT 1</text>
  <!-- Progress bar at bottom -->
  <rect x="80" y="360" width="600" height="8" rx="4" fill="#0f3460"/>
  <rect x="80" y="360" width="400" height="8" rx="4" fill="url(#azure)"/>
  <text x="400" y="390" text-anchor="middle" fill="#888" font-family="Arial" font-size="11">67% Complete</text>
</svg>
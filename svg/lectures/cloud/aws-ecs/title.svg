<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--code-bg)"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--code-text)">AWS ECS</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Elastic Container Service</text>

  <rect x="170" y="280" width="270" height="230" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3"/>
  <text x="305" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Cluster</text>
  <rect x="200" y="365" width="210" height="55" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="305" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Task</text>
  <rect x="200" y="435" width="210" height="55" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="305" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Task</text>

  <rect x="505" y="370" width="270" height="60" rx="8" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3"/>
  <text x="640" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Service</text>

  <rect x="840" y="280" width="270" height="230" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3"/>
  <text x="975" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Cluster</text>
  <rect x="870" y="365" width="210" height="55" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="975" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Task</text>
  <rect x="870" y="435" width="210" height="55" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="975" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Task</text>

  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--text-faint)">Managed container orchestration on AWS</text>
</svg>

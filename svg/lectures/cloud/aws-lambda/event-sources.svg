<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>diagram</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="275" height="87.547169811321" rx="7.84580166545" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.5" y="94.716981132075" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.84503860726" font-weight="bold" fill="var(--warn-text)">API Gateway</text>

  <rect x="40" y="163.11320754717" width="275" height="87.547169811321" rx="7.84580166545" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.5" y="217.830188679245" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.84503860726" font-weight="bold" fill="var(--warn-text)">S3</text>

  <rect x="40" y="286.22641509434" width="275" height="87.547169811321" rx="7.84580166545" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.5" y="340.943396226415" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.84503860726" font-weight="bold" fill="var(--warn-text)">DynamoDB Streams</text>

  <rect x="40" y="409.339622641509" width="275" height="87.547169811321" rx="7.84580166545" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.5" y="464.056603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.84503860726" font-weight="bold" fill="var(--warn-text)">SQS / SNS</text>

  <rect x="40" y="532.452830188679" width="275" height="87.547169811321" rx="7.84580166545" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.5" y="587.169811320755" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.84503860726" font-weight="bold" fill="var(--warn-text)">EventBridge</text>

  <rect x="890" y="245.188679245283" width="350" height="191.509433962264" rx="13.076336109084" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="1065" y="327.264150943396" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.998473883619" font-weight="bold" fill="var(--primary-text)">Lambda</text>
  <text x="1065" y="379.245283018868" text-anchor="middle" font-family="Courier New, monospace" font-size="22.229771385443" fill="var(--primary-text)">handler(event, ctx)</text>

  <line x1="315" y1="83.77358490566" x2="883.75" y2="313.584905660377" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="206.88679245283" x2="883.75" y2="327.264150943396" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="330" x2="883.75" y2="340.943396226415" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="453.11320754717" x2="883.75" y2="354.622641509434" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="576.22641509434" x2="883.75" y2="368.301886792453" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

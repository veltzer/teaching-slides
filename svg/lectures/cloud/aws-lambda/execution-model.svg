<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>diagram</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="250.909090909091" width="222.222222222222" height="131.818181818182" rx="7.261354744624" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.111111111111" y="310.227272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.204515815413" font-weight="bold" fill="var(--warn-text)">Event Source</text>
  <text x="151.111111111111" y="345.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.15338686156" fill="var(--warn-text)">emits an event</text>

  <rect x="373.333333333333" y="40" width="533.333333333333" height="580" rx="12.102257907707" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="86.136363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.204515815413" font-weight="bold" fill="var(--text)">Lambda Service</text>

  <rect x="417.777777777778" y="132.272727272727" width="444.444444444444" height="105.454545454545" rx="7.261354744624" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="178.409090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.784064233872" font-weight="bold" fill="var(--primary-text)">1. Find or create environment</text>
  <text x="640" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.943161070789" fill="var(--primary-text)">a micro-VM with your code</text>

  <rect x="417.777777777778" y="277.272727272727" width="444.444444444444" height="105.454545454545" rx="7.261354744624" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="323.409090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.784064233872" font-weight="bold" fill="var(--primary-text)">2. Invoke handler(event, context)</text>
  <text x="640" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.943161070789" fill="var(--primary-text)">one request per environment</text>

  <rect x="417.777777777778" y="422.272727272727" width="444.444444444444" height="105.454545454545" rx="7.261354744624" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="468.409090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.784064233872" font-weight="bold" fill="var(--primary-text)">3. Return result, keep env warm</text>
  <text x="640" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.943161070789" fill="var(--primary-text)">reused for the next request</text>

  <rect x="1017.777777777778" y="250.909090909091" width="222.222222222222" height="131.818181818182" rx="7.261354744624" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1128.888888888889" y="310.227272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.204515815413" font-weight="bold" fill="var(--warn-text)">Caller</text>
  <text x="1128.888888888889" y="345.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.15338686156" fill="var(--warn-text)">gets result</text>

  <line x1="262.222222222222" y1="316.818181818182" x2="412.222222222222" y2="316.818181818182" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="906.666666666667" y1="475" x2="1012.222222222222" y2="356.363636363636" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

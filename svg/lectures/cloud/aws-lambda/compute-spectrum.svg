<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>diagram</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="276.923076923077" height="362.5" rx="8.676892389471" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.461538461538" y="121.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.815272094727" font-weight="bold" fill="var(--danger-text)">Bare Metal / VM</text>
  <text x="178.461538461538" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.692230973678" fill="var(--danger-text)">You manage the OS,</text>
  <text x="178.461538461538" y="235.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.692230973678" fill="var(--danger-text)">patching, scaling,</text>
  <text x="178.461538461538" y="277.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.692230973678" fill="var(--danger-text)">capacity planning</text>

  <rect x="363.076923076923" y="40" width="276.923076923077" height="362.5" rx="8.676892389471" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.538461538462" y="121.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.815272094727" font-weight="bold" fill="var(--warn-text)">Containers</text>
  <text x="501.538461538462" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.692230973678" fill="var(--warn-text)">You manage images</text>
  <text x="501.538461538462" y="235.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.692230973678" fill="var(--warn-text)">and the orchestrator;</text>
  <text x="501.538461538462" y="277.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.692230973678" fill="var(--warn-text)">cloud runs the hosts</text>

  <rect x="686.153846153846" y="40" width="276.923076923077" height="362.5" rx="8.676892389471" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="824.615384615385" y="121.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.815272094727" font-weight="bold" fill="var(--primary-text)">Lambda</text>
  <text x="824.615384615385" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.692230973678" fill="var(--primary-text)">You manage only</text>
  <text x="824.615384615385" y="235.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.692230973678" fill="var(--primary-text)">your function code;</text>
  <text x="824.615384615385" y="277.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.692230973678" fill="var(--primary-text)">AWS runs the rest</text>

  <rect x="1009.230769230769" y="40" width="230.769230769231" height="362.5" rx="8.676892389471" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.615384615384" y="121.5625" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.815272094727" font-weight="bold" fill="var(--ok-text)">SaaS</text>
  <text x="1124.615384615384" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.692230973678" fill="var(--ok-text)">You manage</text>
  <text x="1124.615384615384" y="235.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.692230973678" fill="var(--ok-text)">nothing — just</text>
  <text x="1124.615384615384" y="277.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.692230973678" fill="var(--ok-text)">use the service</text>

  <line x1="40" y1="547.5" x2="1240" y2="547.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="63.076923076923" y="620" text-anchor="start" font-family="Arial, sans-serif" font-size="26.030677168413" font-weight="bold" fill="var(--text)">more control, more ops work</text>
  <text x="1216.923076923077" y="620" text-anchor="end" font-family="Arial, sans-serif" font-size="26.030677168413" font-weight="bold" fill="var(--text)">less to manage</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>diagram</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="349.090909090909" height="235.135135135135" rx="10.461582932077" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.545454545455" y="110.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.769353063211" font-weight="bold" fill="var(--primary-text)">Synchronous</text>
  <text x="214.545454545455" y="168.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.615467997644" fill="var(--primary-text)">caller waits for the result</text>
  <text x="214.545454545455" y="212.432432432432" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.615467997644" fill="var(--primary-text)">e.g. API Gateway</text>

  <rect x="465.454545454545" y="40" width="349.090909090909" height="235.135135135135" rx="10.461582932077" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="110.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.769353063211" font-weight="bold" fill="var(--warn-text)">Asynchronous</text>
  <text x="640" y="168.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.615467997644" fill="var(--warn-text)">fire and forget, retried</text>
  <text x="640" y="212.432432432432" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.615467997644" fill="var(--warn-text)">e.g. S3, SNS</text>

  <rect x="890.909090909091" y="40" width="349.090909090909" height="235.135135135135" rx="10.461582932077" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065.454545454545" y="110.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.769353063211" font-weight="bold" fill="var(--info-text)">Stream / Poll</text>
  <text x="1065.454545454545" y="168.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.615467997644" fill="var(--info-text)">Lambda polls in batches</text>
  <text x="1065.454545454545" y="212.432432432432" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.615467997644" fill="var(--info-text)">e.g. SQS, Kinesis</text>

  <rect x="40" y="431.891891891892" width="349.090909090909" height="188.108108108108" rx="7.846187199057" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="214.545454545455" y="502.432432432433" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.923165864153" fill="var(--text)">caller → Lambda → caller</text>
  <text x="214.545454545455" y="557.297297297297" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.615467997644" fill="var(--text-muted)">response in band</text>

  <rect x="465.454545454545" y="431.891891891892" width="349.090909090909" height="188.108108108108" rx="7.846187199057" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="502.432432432433" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.923165864153" fill="var(--text)">caller → queue → Lambda</text>
  <text x="640" y="557.297297297297" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.615467997644" fill="var(--text-muted)">no response to caller</text>

  <rect x="890.909090909091" y="431.891891891892" width="349.090909090909" height="188.108108108108" rx="7.846187199057" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1065.454545454545" y="502.432432432433" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.923165864153" fill="var(--text)">source → batches → Lambda</text>
  <text x="1065.454545454545" y="557.297297297297" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.615467997644" fill="var(--text-muted)">ordered, checkpointed</text>

  <line x1="214.545454545455" y1="275.135135135135" x2="214.545454545455" y2="424.054054054054" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="275.135135135135" x2="640" y2="424.054054054054" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1065.454545454545" y1="275.135135135135" x2="1065.454545454545" y2="424.054054054054" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

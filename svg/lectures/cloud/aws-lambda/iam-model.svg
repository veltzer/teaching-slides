<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>diagram</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="452.5" y="40" width="375" height="154.666666666667" rx="12.69295517644" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="104.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.463092423456" font-weight="bold" fill="var(--primary-text)">Lambda Function</text>
  <text x="640" y="150.844444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.03943276466" fill="var(--primary-text)">assumes its execution role</text>

  <rect x="452.5" y="284.888888888889" width="375" height="128.888888888889" rx="10.154364141152" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="339.022222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.38591035288" font-weight="bold" fill="var(--warn-text)">IAM Execution Role</text>
  <text x="640" y="380.266666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.03943276466" fill="var(--warn-text)">least-privilege policy</text>

  <rect x="40" y="504" width="325" height="116" rx="7.615773105864" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.5" y="555.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.116614835236" font-weight="bold" fill="var(--ok-text)">S3 bucket</text>
  <text x="202.5" y="591.644444444445" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.770137247016" fill="var(--ok-text)">read only</text>

  <rect x="477.5" y="504" width="325" height="116" rx="7.615773105864" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="555.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.116614835236" font-weight="bold" fill="var(--ok-text)">DynamoDB</text>
  <text x="640" y="591.644444444445" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.770137247016" fill="var(--ok-text)">read / write</text>

  <rect x="915" y="504" width="325" height="116" rx="7.615773105864" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.5" y="555.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.116614835236" font-weight="bold" fill="var(--ok-text)">CloudWatch Logs</text>
  <text x="1077.5" y="591.644444444445" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.770137247016" fill="var(--ok-text)">write</text>

  <line x1="640" y1="194.666666666667" x2="640" y2="278.444444444444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="413.777777777778" x2="240" y2="497.555555555556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="413.777777777778" x2="640" y2="497.555555555556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="413.777777777778" x2="1040" y2="497.555555555556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

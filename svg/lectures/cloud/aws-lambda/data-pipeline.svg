<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>diagram</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="238.857142857143" width="211.764705882353" height="182.285714285714" rx="8.377641311824" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.882352941176" y="313.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.529197487443" font-weight="bold" fill="var(--warn-text)">S3</text>
  <text x="145.882352941176" y="363.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.547829727589" fill="var(--warn-text)">file uploaded</text>

  <rect x="345.882352941176" y="238.857142857143" width="235.294117647059" height="182.285714285714" rx="8.377641311824" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="463.529411764706" y="313.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.132923935472" font-weight="bold" fill="var(--primary-text)">Lambda</text>
  <text x="463.529411764706" y="363.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.547829727589" fill="var(--primary-text)">parse &amp; transform</text>

  <rect x="675.294117647059" y="238.857142857143" width="235.294117647059" height="182.285714285714" rx="8.377641311824" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.941176470588" y="313.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.132923935472" font-weight="bold" fill="var(--info-text)">SQS Queue</text>
  <text x="792.941176470588" y="363.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.547829727589" fill="var(--info-text)">buffer batches</text>

  <rect x="1004.705882352941" y="40" width="235.294117647059" height="182.285714285714" rx="8.377641311824" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.35294117647" y="114.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.132923935472" font-weight="bold" fill="var(--primary-text)">Lambda</text>
  <text x="1122.35294117647" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.547829727589" fill="var(--primary-text)">enrich &amp; load</text>

  <rect x="1004.705882352941" y="437.714285714286" width="235.294117647059" height="182.285714285714" rx="8.377641311824" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.35294117647" y="512.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.132923935472" font-weight="bold" fill="var(--ok-text)">Data Store</text>
  <text x="1122.35294117647" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.547829727589" fill="var(--ok-text)">warehouse / DB</text>

  <line x1="251.764705882353" y1="330" x2="340" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="581.176470588235" y1="330" x2="669.411764705882" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910.588235294118" y1="305.142857142857" x2="998.823529411765" y2="164.285714285714" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1122.35294117647" y1="222.285714285714" x2="1122.35294117647" y2="429.428571428572" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

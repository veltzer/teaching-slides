<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>diagram</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="616" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.262371545125" font-weight="bold" fill="var(--text-muted)">One slider sets memory — CPU and network scale with it</text>

  <line x1="40" y1="562.637362637363" x2="1240" y2="562.637362637363" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="40" y1="562.637362637363" x2="40" y2="129.230769230769" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="616" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.025573125951" fill="var(--text)">Memory allocated (128 MB → 10 GB)</text>
  <text x="110" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text)" transform="rotate(-90 110 370)">CPU / network</text>

  <rect x="136" y="460.659340659341" width="144" height="101.978021978022" rx="7.420790515042" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208" y="518.021978021978" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.788774706778" font-weight="bold" fill="var(--primary-text)">128 MB</text>

  <rect x="388" y="358.681318681319" width="144" height="203.956043956044" rx="7.420790515042" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="416.043956043956" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.788774706778" font-weight="bold" fill="var(--primary-text)">512 MB</text>

  <rect x="640" y="256.703296703297" width="144" height="305.934065934066" rx="7.420790515042" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="712" y="314.065934065934" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.788774706778" font-weight="bold" fill="var(--primary-text)">1.8 GB</text>

  <rect x="892" y="154.725274725275" width="144" height="407.912087912088" rx="7.420790515042" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="964" y="212.087912087912" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.788774706778" font-weight="bold" fill="var(--primary-text)">10 GB</text>

  <text x="688" y="103.736263736264" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.788774706778" fill="var(--text-muted)">More memory → more CPU → faster runs → often cheaper</text>
</svg>

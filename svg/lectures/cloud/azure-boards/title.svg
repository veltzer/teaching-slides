<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
    <linearGradient id="azure" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#0078d4" />
      <stop offset="100%" style="stop-color:#00bcf2" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <rect x="160" y="127" width="270" height="406" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.8444" />
  <rect x="160" y="127" width="270" height="58" rx="6" fill="var(--primary-accent)" />
  <text x="295" y="164.7" text-anchor="middle" fill="var(--bg)" font-family="Arial" font-size="19.4662" font-weight="bold">TO DO</text>
  <rect x="190" y="206.75" width="210" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1.4222" />
  <rect x="190" y="272" width="210" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1.4222" />
  <rect x="190" y="337.25" width="210" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1.4222" />
  <rect x="474.9999" y="127" width="270" height="406" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="2.8444" />
  <rect x="474.9999" y="127" width="270" height="58" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="609.9999" y="164.7" text-anchor="middle" fill="var(--bg)" font-family="Arial" font-size="19.4662" font-weight="bold">IN PROGRESS</text>
  <rect x="505" y="206.75" width="210" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="1.4222" />
  <rect x="505" y="272" width="210" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="1.4222" />
  <rect x="790" y="127" width="270" height="406" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <rect x="790" y="127" width="270" height="58" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="925" y="164.7" text-anchor="middle" fill="var(--bg)" font-family="Arial" font-size="19.4662" font-weight="bold">DONE</text>
  <rect x="820" y="206.75" width="210" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="1.4222" />
  <text x="1000" y="240.1" fill="var(--ok-accent)" font-family="Arial" font-size="22.2471">✓</text>
  <rect x="1090" y="156" width="120" height="348" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.1111 7.1111" />
  <text x="1149.9999" y="330" text-anchor="middle" fill="var(--info-accent)" font-family="Arial" font-size="15.2948" transform="rotate(-90,740,200)">SPRINT 1</text>
  <rect x="160" y="562" width="899.9999" height="11.6" rx="6" fill="var(--primary-accent)" />
  <rect x="160" y="562" width="600" height="11.6" rx="6" fill="url(#azure)" />
  <text x="640" y="605.5" text-anchor="middle" fill="var(--text-faint)" font-family="Arial" font-size="15.2948">67% Complete</text>
</svg>
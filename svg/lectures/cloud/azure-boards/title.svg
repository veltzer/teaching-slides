<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
    <linearGradient id="azure" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#0078d4" />
      <stop offset="100%" style="stop-color:#00bcf2" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <rect x="113.7778" y="96" width="256" height="448" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.8444" />
  <rect x="113.7778" y="96" width="256" height="64" rx="6" fill="var(--primary-accent)" />
  <text x="241.7778" y="137.6" text-anchor="middle" fill="var(--bg)" font-family="Arial" font-size="19.9111" font-weight="bold">TO DO</text>
  <rect x="142.2222" y="184" width="199.1111" height="56" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1.4222" />
  <rect x="142.2222" y="256" width="199.1111" height="56" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1.4222" />
  <rect x="142.2222" y="328" width="199.1111" height="56" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1.4222" />
  <rect x="412.4444" y="96" width="256" height="448" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="2.8444" />
  <rect x="412.4444" y="96" width="256" height="64" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="540.4444" y="137.6" text-anchor="middle" fill="var(--bg)" font-family="Arial" font-size="19.9111" font-weight="bold">IN PROGRESS</text>
  <rect x="440.8889" y="184" width="199.1111" height="56" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="1.4222" />
  <rect x="440.8889" y="256" width="199.1111" height="56" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="1.4222" />
  <rect x="711.1111" y="96" width="256" height="448" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <rect x="711.1111" y="96" width="256" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="839.1111" y="137.6" text-anchor="middle" fill="var(--bg)" font-family="Arial" font-size="19.9111" font-weight="bold">DONE</text>
  <rect x="739.5556" y="184" width="199.1111" height="56" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="1.4222" />
  <text x="910.2222" y="220.8" fill="var(--ok-accent)" font-family="Arial" font-size="22.7556">✓</text>
  <rect x="995.5556" y="128" width="113.7778" height="384" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.1111 7.1111" />
  <text x="1052.4444" y="320" text-anchor="middle" fill="var(--info-accent)" font-family="Arial" font-size="15.6444" transform="rotate(-90,740,200)">SPRINT 1</text>
  <rect x="113.7778" y="576" width="853.3333" height="12.8" rx="6" fill="var(--primary-accent)" />
  <rect x="113.7778" y="576" width="568.8889" height="12.8" rx="6" fill="url(#azure)" />
  <text x="568.8889" y="624" text-anchor="middle" fill="var(--text-faint)" font-family="Arial" font-size="15.6444">67% Complete</text>
</svg>
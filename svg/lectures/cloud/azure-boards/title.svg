<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
    <linearGradient id="azure" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#0078d4" />
      <stop offset="100%" style="stop-color:#00bcf2" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <rect x="160" y="127" width="270" height="406" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.8444" />
  <rect x="160" y="127" width="270" height="58" rx="6" fill="var(--primary-accent)" />
  <text x="295" y="164.7" text-anchor="middle" fill="var(--bg)" font-size="19.4662" font-weight="bold" font-family="Arial, sans-serif">TO DO</text>
  <rect x="190" y="206.75" width="210" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1.4222" />
  <rect x="190" y="272" width="210" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1.4222" />
  <rect x="190" y="337.25" width="210" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="1.4222" />
  <rect x="474.9999" y="127" width="270" height="406" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="2.8444" />
  <rect x="474.9999" y="127" width="270" height="58" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="609.9999" y="164.7" text-anchor="middle" fill="var(--bg)" font-size="19.4662" font-weight="bold" font-family="Arial, sans-serif">IN PROGRESS</text>
  <rect x="505" y="206.75" width="210" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="1.4222" />
  <rect x="505" y="272" width="210" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="1.4222" />
  <rect x="790" y="127" width="270" height="406" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <rect x="790" y="127" width="270" height="58" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="925" y="164.7" text-anchor="middle" fill="var(--bg)" font-size="19.4662" font-weight="bold" font-family="Arial, sans-serif">DONE</text>
  <rect x="820" y="206.75" width="210" height="50.75" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="1.4222" />
  <text x="1000" y="240.1" fill="var(--ok-accent)" font-size="22.2471" font-family="Arial, sans-serif">✓</text>
  <rect x="1090" y="156" width="120" height="348" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.1111 7.1111" />
  <text x="1149.9999" y="330" text-anchor="middle" fill="var(--info-accent)" font-size="15.2948" transform="rotate(-90,740,200)" font-family="Arial, sans-serif">SPRINT 1</text>
  <rect x="160" y="562" width="899.9999" height="11.6" rx="6" fill="var(--primary-accent)" />
  <rect x="160" y="562" width="600" height="11.6" rx="6" fill="url(#azure)" />
  <text x="640" y="605.5" text-anchor="middle" fill="var(--text-faint)" font-size="15.2948" font-family="Arial, sans-serif">67% Complete</text>
</svg>
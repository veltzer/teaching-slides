<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="470.0" y="240.0" width="340.0" height="140.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="294.0" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Agent core</text>
  <text x="640.0" y="315.6" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">LLM + instructions</text>
  <text x="640.0" y="337.2" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">(prompt, skills)</text>
  <rect x="40.0" y="270.0" width="280.0" height="80.0" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.0" y="304.8" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Trigger</text>
  <text x="180.0" y="326.4" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">what starts a run</text>
  <rect x="960.0" y="270.0" width="280.0" height="80.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.0" y="304.8" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Output</text>
  <text x="1100.0" y="326.4" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">answer, report, action</text>
  <rect x="160.0" y="40.0" width="320.0" height="90.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320.0" y="79.8" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Context &amp; memory</text>
  <text x="320.0" y="101.4" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">what it knows right now</text>
  <rect x="800.0" y="40.0" width="320.0" height="90.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960.0" y="79.8" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Knowledge (RAG)</text>
  <text x="960.0" y="101.4" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">our documents and data</text>
  <rect x="160.0" y="530.0" width="320.0" height="90.0" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320.0" y="569.8" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Guardrails</text>
  <text x="320.0" y="591.4" text-anchor="middle" font-size="16" fill="var(--danger-text)" font-family="Arial, sans-serif">limits, human approval</text>
  <rect x="800.0" y="530.0" width="320.0" height="90.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960.0" y="569.8" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Tools (MCP)</text>
  <text x="960.0" y="591.4" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">systems it can act on</text>
  <line x1="320.0" y1="310.0" x2="463.0" y2="310.0" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="810.0" y1="310.0" x2="953.0" y2="310.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="400.0" y1="130.0" x2="520.0" y2="233.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="880.0" y1="130.0" x2="760.0" y2="233.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="400.0" y1="530.0" x2="520.0" y2="387.0" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="760.0" y1="380.0" x2="880.0" y2="523.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
</svg>

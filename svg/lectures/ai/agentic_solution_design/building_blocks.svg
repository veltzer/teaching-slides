<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="1200.0" height="80.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="74.5" text-anchor="middle" font-size="19" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Agent</text>
  <text x="640.0" y="97.4" text-anchor="middle" font-size="17" fill="var(--primary-text)" font-family="Arial, sans-serif">the loop that combines all the blocks to reach a goal</text>
  <rect x="40.0" y="170.0" width="380.0" height="90.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="209.8" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Prompt</text>
  <text x="230.0" y="231.4" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">a one-off instruction</text>
  <rect x="40.0" y="290.0" width="380.0" height="90.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="329.8" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Command</text>
  <text x="230.0" y="351.4" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">a saved prompt, run by name</text>
  <rect x="40.0" y="410.0" width="380.0" height="90.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="449.8" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Skill</text>
  <text x="230.0" y="471.4" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">packaged know-how, loaded on demand</text>
  <rect x="860.0" y="170.0" width="380.0" height="90.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.0" y="209.8" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">RAG</text>
  <text x="1050.0" y="231.4" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">looks up our own documents</text>
  <rect x="860.0" y="290.0" width="380.0" height="90.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.0" y="329.8" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">MCP</text>
  <text x="1050.0" y="351.4" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">a standard plug into systems</text>
  <rect x="860.0" y="410.0" width="380.0" height="90.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.0" y="449.8" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Tool</text>
  <text x="1050.0" y="471.4" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">one action: search, read, update</text>
  <rect x="490.0" y="170.0" width="300.0" height="330.0" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="306.5" text-anchor="middle" font-size="19" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">LLM</text>
  <text x="640.0" y="329.5" text-anchor="middle" font-size="17" fill="var(--warn-text)" font-family="Arial, sans-serif">the engine:</text>
  <text x="640.0" y="352.4" text-anchor="middle" font-size="17" fill="var(--warn-text)" font-family="Arial, sans-serif">reads text,</text>
  <text x="640.0" y="375.4" text-anchor="middle" font-size="17" fill="var(--warn-text)" font-family="Arial, sans-serif">writes text</text>
  <line x1="420.0" y1="215.0" x2="483.0" y2="215.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="860.0" y1="215.0" x2="797.0" y2="215.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="420.0" y1="335.0" x2="483.0" y2="335.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="860.0" y1="335.0" x2="797.0" y2="335.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="420.0" y1="455.0" x2="483.0" y2="455.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="860.0" y1="455.0" x2="797.0" y2="455.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="40.0" y="550.0" width="1200.0" height="70.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="591.3" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Every block is a part. The agent is the assembly.</text>
  <text x="230.0" y="155.0" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">what to do</text>
  <text x="1050.0" y="155.0" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">what it knows and can do</text>
</svg>

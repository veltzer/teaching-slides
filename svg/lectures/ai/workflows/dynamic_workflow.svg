<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="150" width="200" height="80" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">scout</text>
  <text x="140" y="213" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">discover targets</text>
  <line x1="240" y1="190" x2="303" y2="190" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <rect x="310" y="140" width="210" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="415" y="180" text-anchor="middle" font-size="18" fill="var(--text)" font-family="Arial, sans-serif">work list</text>
  <text x="415" y="210" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">size unknown upfront</text>

  <rect x="600" y="40" width="220" height="70" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="710" y="82" text-anchor="middle" font-size="17" fill="var(--info-text)" font-family="Arial, sans-serif">worker: item 1</text>
  <rect x="600" y="155" width="220" height="70" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="710" y="197" text-anchor="middle" font-size="17" fill="var(--info-text)" font-family="Arial, sans-serif">worker: item 2</text>
  <rect x="600" y="270" width="220" height="70" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="710" y="312" text-anchor="middle" font-size="17" fill="var(--info-text)" font-family="Arial, sans-serif">worker: item 3</text>
  <text x="710" y="400" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">× N — count decided at runtime</text>

  <line x1="520" y1="165" x2="593" y2="85" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="190" x2="593" y2="190" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="215" x2="593" y2="295" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="900" y="150" width="180" height="80" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">merge</text>
  <text x="990" y="213" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">plain code</text>

  <line x1="820" y1="85" x2="893" y2="165" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="820" y1="190" x2="893" y2="190" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="820" y1="305" x2="893" y2="215" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <line x1="1080" y1="190" x2="1113" y2="190" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1120" y="155" width="120" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1180" y="197" text-anchor="middle" font-size="18" fill="var(--text)" font-family="Arial, sans-serif">report</text>

  <text x="640" y="490" text-anchor="middle" font-size="20" fill="var(--text-muted)" font-family="Arial, sans-serif">plan the orchestration step, not the whole task, in advance</text>

  <rect x="40" y="550" width="1200" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="593" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The script decides the shape at runtime — the model fills the nodes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="90" y="40" width="260" height="90" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="78" text-anchor="middle" font-size="19" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">round of finders</text>
  <text x="220" y="108" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">run in parallel</text>
  <line x1="350" y1="85" x2="453" y2="85" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="460" y="40" width="220" height="90" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="93" text-anchor="middle" font-size="19" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">anything new?</text>

  <line x1="680" y1="85" x2="783" y2="85" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="730" y="65" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">yes</text>

  <rect x="790" y="40" width="250" height="90" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915" y="78" text-anchor="middle" font-size="19" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">dedup vs seen</text>
  <text x="915" y="108" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">reset dry counter</text>

  <path d="M915,130 L915,260 L220,260 L220,137" fill="none" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="567" y="245" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">next round</text>

  <line x1="570" y1="130" x2="570" y2="343" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="320" text-anchor="start" font-size="16" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">no</text>

  <rect x="460" y="350" width="220" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="570" y="392" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">dry rounds + 1</text>
  <line x1="680" y1="385" x2="783" y2="385" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="790" y="350" width="250" height="70" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915" y="392" text-anchor="middle" font-size="17" fill="var(--ok-text)" font-family="Arial, sans-serif">two dry rounds: stop</text>

  <text x="640" y="490" text-anchor="middle" font-size="20" fill="var(--text-muted)" font-family="Arial, sans-serif">count what is new, not what is accepted — or it never converges</text>

  <rect x="40" y="550" width="1200" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="593" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Fixed counts miss the tail — loop until the well runs dry, under a hard cap</text>
</svg>

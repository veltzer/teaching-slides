<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="560" height="50" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <rect x="40" y="40" width="340" height="50" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="71" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">spent</text>
  <text x="490" y="71" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">remaining</text>
  <text x="320" y="130" text-anchor="middle" font-size="17" fill="var(--text-muted)" font-family="Arial, sans-serif">the budget is a hard ceiling enforced in code</text>

  <rect x="40" y="220" width="460" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="270" y="257" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">quick check: 3 workers, 1 round</text>
  <rect x="40" y="300" width="460" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="270" y="337" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">standard: 10 workers, dry-round loop</text>
  <rect x="40" y="380" width="460" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="270" y="417" text-anchor="middle" font-size="17" fill="var(--text)" font-family="Arial, sans-serif">audit: 30 workers + verification panel</text>

  <rect x="700" y="40" width="280" height="80" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="75" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">remaining budget</text>
  <text x="840" y="103" text-anchor="middle" font-size="17" fill="var(--primary-text)" font-family="Arial, sans-serif">&gt; cost of one round?</text>

  <line x1="840" y1="120" x2="840" y2="193" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="865" y="160" text-anchor="start" font-size="16" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">yes</text>

  <rect x="700" y="200" width="280" height="80" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="247" text-anchor="middle" font-size="17" fill="var(--info-text)" font-family="Arial, sans-serif">run another round</text>
  <path d="M700,240 L660,240 L660,80 L693,80" fill="none" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>

  <line x1="980" y1="80" x2="1033" y2="80" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1006" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">no</text>
  <rect x="1040" y="40" width="200" height="80" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="75" text-anchor="middle" font-size="17" fill="var(--ok-text)" font-family="Arial, sans-serif">finish + report</text>
  <text x="1140" y="103" text-anchor="middle" font-size="17" fill="var(--ok-text)" font-family="Arial, sans-serif">what was skipped</text>

  <rect x="40" y="550" width="1200" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="593" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Effort scales with the stated budget — never silently</text>
</svg>

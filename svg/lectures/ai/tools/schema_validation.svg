<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Stage 1: Schema -->
  <rect x="40" y="161.52380952381" width="250" height="116" rx="6.306459273747" fill="url(#grad-primary)" stroke="var(--primary-border)" filter="url(#shadow)"/>
  <text x="165" y="205.714285714286" text-anchor="middle" font-size="21.02153091249" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Schema</text>
  <text x="165" y="236.647619047619" text-anchor="middle" font-size="14.715071638743" fill="var(--primary-text)" font-family="Arial, sans-serif">Typed arguments,</text>
  <text x="165" y="258.742857142857" text-anchor="middle" font-size="14.715071638743" fill="var(--primary-text)" font-family="Arial, sans-serif">constraints, required fields</text>

  <!-- Arrow 1 -->
  <line x1="290" y1="218.971428571429" x2="355" y2="218.971428571429" stroke="var(--primary-border)" stroke-width="3" marker-end="url(#arrow-primary)"/>

  <!-- Stage 2: Model emits call -->
  <rect x="360" y="161.52380952381" width="250" height="116" rx="6.306459273747" fill="url(#grad-info)" stroke="var(--info-border)" filter="url(#shadow)"/>
  <text x="485" y="205.714285714286" text-anchor="middle" font-size="21.02153091249" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Model emits call</text>
  <text x="485" y="236.647619047619" text-anchor="middle" font-size="14.715071638743" fill="var(--info-text)" font-family="Arial, sans-serif">Well-formed JSON</text>
  <text x="485" y="258.742857142857" text-anchor="middle" font-size="14.715071638743" fill="var(--info-text)" font-family="Arial, sans-serif">guided by the schema</text>

  <!-- Arrow 2 -->
  <line x1="610" y1="218.971428571429" x2="675" y2="218.971428571429" stroke="var(--info-border)" stroke-width="3" marker-end="url(#arrow-info)"/>

  <!-- Stage 3: Validate -->
  <rect x="680" y="161.52380952381" width="250" height="116" rx="6.306459273747" fill="url(#grad-warn)" stroke="var(--warn-border)" filter="url(#shadow)"/>
  <text x="805" y="205.714285714286" text-anchor="middle" font-size="21.02153091249" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Validate</text>
  <text x="805" y="236.647619047619" text-anchor="middle" font-size="14.715071638743" fill="var(--warn-text)" font-family="Arial, sans-serif">Check types, ranges,</text>
  <text x="805" y="258.742857142857" text-anchor="middle" font-size="14.715071638743" fill="var(--warn-text)" font-family="Arial, sans-serif">required</text>

  <!-- Branch: valid -> Execute (top) -->
  <path d="M 930 194.666666666667 L 990 194.666666666667 L 990 84.190476190476 L 1010 84.190476190476" fill="none" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="985" y="128.380952380952" text-anchor="middle" font-size="15.766148184367" fill="var(--text-muted)" font-family="Arial, sans-serif">valid</text>

  <rect x="1015" y="40" width="225" height="88.380952380952" rx="6.306459273747" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="1127" y="93.028571428571" text-anchor="middle" font-size="21.02153091249" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Execute</text>

  <!-- Branch: invalid -> Reject (bottom) -->
  <path d="M 930 244.380952380952 L 990 244.380952380952 L 990 354.857142857143 L 1010 354.857142857143" fill="none" stroke="var(--danger-border)" stroke-width="3" marker-end="url(#arrow-danger)"/>
  <text x="985" y="313.980952380952" text-anchor="middle" font-size="15.766148184367" fill="var(--text-muted)" font-family="Arial, sans-serif">invalid</text>

  <rect x="1015" y="310.666666666667" width="225" height="88.380952380952" rx="6.306459273747" fill="url(#grad-danger)" stroke="var(--danger-border)" filter="url(#shadow)"/>
  <text x="1127" y="349.333333333333" text-anchor="middle" font-size="21.02153091249" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Reject +</text>
  <text x="1127" y="378.057142857143" text-anchor="middle" font-size="18.919377821241" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">ask to retry</text>

  <!-- Bottom summary bar -->
  <rect x="40" y="520.571428571429" width="1200" height="99.428571428571" rx="6.306459273747" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="564.761904761905" text-anchor="middle" font-size="19.970454366865" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A tight schema yields well-formed calls; validation catches the rest</text>
  <text x="640" y="597.904761904762" text-anchor="middle" font-size="16.817224729992" fill="var(--text-muted)" font-family="Arial, sans-serif">A vague schema yields vague, often wrong, calls</text>
</svg>

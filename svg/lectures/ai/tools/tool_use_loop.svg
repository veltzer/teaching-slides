<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Box A: You send prompt + tools (top-left) -->
  <rect x="80" y="40" width="280" height="117.064220183486" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="87.889908256881" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--primary-text)">You send</text>
  <text x="220" y="119.816513761468" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--primary-text)">prompt + tool definitions</text>

  <!-- Box B: Model returns a tool call (top-right) -->
  <rect x="920" y="40" width="280" height="117.064220183486" rx="6.189662883026" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="87.889908256881" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--info-text)">Model returns</text>
  <text x="1060" y="119.816513761468" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--info-text)">a tool call</text>

  <!-- Box C: Your code validates + executes (bottom-right) -->
  <rect x="920" y="337.981651376147" width="280" height="117.064220183486" rx="6.189662883026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="385.871559633028" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--warn-text)">Your code</text>
  <text x="1060" y="417.798165137615" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--warn-text)">validates + executes</text>

  <!-- Box D: You send the result back (bottom-left) -->
  <rect x="80" y="337.981651376147" width="280" height="117.064220183486" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="385.871559633028" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" fill="var(--ok-text)">You send</text>
  <text x="220" y="417.798165137615" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--ok-text)">the result back</text>

  <!-- Arrow A -> B (request) -->
  <line x1="360" y1="98.532110091743" x2="912" y2="98.532110091743" stroke="var(--primary-border)" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
  <text x="636" y="84.697247706422" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--text-muted)">request</text>

  <!-- Arrow B -> C (down, model wants a tool) -->
  <line x1="1060" y1="157.064220183486" x2="1060" y2="329.467889908257" stroke="var(--info-border)" stroke-width="2.5" marker-end="url(#arrow-info)"/>
  <text x="1130" y="247.522935779817" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--text-muted)">tool call</text>

  <!-- Arrow C -> D (result) -->
  <line x1="920" y1="396.51376146789" x2="368" y2="396.51376146789" stroke="var(--warn-border)" stroke-width="2.5" marker-end="url(#arrow-warn)"/>
  <text x="644" y="382.678899082569" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--text-muted)">result</text>

  <!-- Arrow D -> B (loop until done) -->
  <path d="M 220 337.981651376147 L 220 231.559633027523 L 1060 231.559633027523 L 1060 165.577981651376" fill="none" stroke="var(--ok-border)" stroke-width="2.5" marker-end="url(#arrow-ok)"/>
  <text x="600" y="220.917431192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" fill="var(--text-muted)">loop until done</text>

  <!-- Bottom summary bar -->
  <rect x="40" y="524.220183486239" width="1200" height="95.779816513761" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="566.788990825688" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.600599129581" font-weight="bold" fill="var(--text)">The model only ASKS — your runtime decides, executes, and returns</text>
  <text x="640" y="598.715596330275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--text-muted)">A tool call is a suggestion, not a command — you stay the gatekeeper</text>
</svg>

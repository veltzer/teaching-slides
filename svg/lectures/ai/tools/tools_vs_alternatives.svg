<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Card 1: Tool -->
  <rect x="40" y="40" width="285" height="457.614678899083" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="93.211009174312" font-family="Arial, sans-serif" font-size="24.758651532102" font-weight="bold" text-anchor="middle" fill="var(--primary-text)">Tool</text>
  <text x="182" y="135.779816513761" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" text-anchor="middle" fill="var(--primary-text)">What action can I take?</text>
  <text x="182" y="220.917431192661" font-family="Arial, sans-serif" font-size="15.474157207564" text-anchor="middle" fill="var(--primary-text)">A discrete action in the world</text>
  <text x="182" y="274.128440366972" font-family="Arial, sans-serif" font-size="15.474157207564" text-anchor="middle" fill="var(--primary-text)">Fresh/private data, exact compute</text>
  <text x="182" y="327.339449541284" font-family="Arial, sans-serif" font-size="15.474157207564" text-anchor="middle" fill="var(--primary-text)">Your code runs it</text>

  <!-- Card 2: Skill -->
  <rect x="345" y="40" width="285" height="457.614678899083" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="93.211009174312" font-family="Arial, sans-serif" font-size="24.758651532102" font-weight="bold" text-anchor="middle" fill="var(--ok-text)">Skill</text>
  <text x="487" y="135.779816513761" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" text-anchor="middle" fill="var(--ok-text)">How do I do this task?</text>
  <text x="487" y="220.917431192661" font-family="Arial, sans-serif" font-size="15.474157207564" text-anchor="middle" fill="var(--ok-text)">A procedure with steps</text>
  <text x="487" y="274.128440366972" font-family="Arial, sans-serif" font-size="15.474157207564" text-anchor="middle" fill="var(--ok-text)">Your team's conventions</text>
  <text x="487" y="327.339449541284" font-family="Arial, sans-serif" font-size="15.474157207564" text-anchor="middle" fill="var(--ok-text)">Loaded on demand, can call tools</text>

  <!-- Card 3: RAG -->
  <rect x="650" y="40" width="285" height="457.614678899083" rx="6.189662883026" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="93.211009174312" font-family="Arial, sans-serif" font-size="24.758651532102" font-weight="bold" text-anchor="middle" fill="var(--info-text)">RAG</text>
  <text x="792" y="135.779816513761" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" text-anchor="middle" fill="var(--info-text)">What facts are known?</text>
  <text x="792" y="220.917431192661" font-family="Arial, sans-serif" font-size="15.474157207564" text-anchor="middle" fill="var(--info-text)">Retrieve relevant documents</text>
  <text x="792" y="274.128440366972" font-family="Arial, sans-serif" font-size="15.474157207564" text-anchor="middle" fill="var(--info-text)">Large, changing bodies of fact</text>
  <text x="792" y="327.339449541284" font-family="Arial, sans-serif" font-size="15.474157207564" text-anchor="middle" fill="var(--info-text)">Pulled into context at run time</text>

  <!-- Card 4: Fine-tuning -->
  <rect x="955" y="40" width="285" height="457.614678899083" rx="6.189662883026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="93.211009174312" font-family="Arial, sans-serif" font-size="24.758651532102" font-weight="bold" text-anchor="middle" fill="var(--warn-text)">Fine-tuning</text>
  <text x="1097" y="135.779816513761" font-family="Arial, sans-serif" font-size="20.632209610085" font-weight="bold" text-anchor="middle" fill="var(--warn-text)">What is baked into the model?</text>
  <text x="1097" y="220.917431192661" font-family="Arial, sans-serif" font-size="15.474157207564" text-anchor="middle" fill="var(--warn-text)">Behaviour learned in weights</text>
  <text x="1097" y="274.128440366972" font-family="Arial, sans-serif" font-size="15.474157207564" text-anchor="middle" fill="var(--warn-text)">Slow, costly, opaque to change</text>
  <text x="1097" y="327.339449541284" font-family="Arial, sans-serif" font-size="15.474157207564" text-anchor="middle" fill="var(--warn-text)">Shapes instinct, not procedure</text>

  <!-- Bottom summary bar -->
  <rect x="40" y="518.899082568807" width="1200" height="101.100917431193" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="561.467889908257" font-family="Arial, sans-serif" font-size="19.600599129581" font-weight="bold" text-anchor="middle" fill="var(--text)">Four different questions — and they are complementary</text>
  <text x="640" y="595.522935779817" font-family="Arial, sans-serif" font-size="16.505767688068" text-anchor="middle" fill="var(--text-muted)">A skill calls a tool; a tool does retrieval; fine-tuning shapes the instinct</text>
</svg>

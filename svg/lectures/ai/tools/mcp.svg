<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- LEFT: hosts / clients -->
  <rect x="60" y="40" width="220" height="74.495412844037" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" filter="url(#shadow)"/>
  <text x="170" y="84.697247706422" text-anchor="middle" font-size="20.632209610085" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Claude Code</text>

  <rect x="60" y="178.348623853211" width="220" height="74.495412844037" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" filter="url(#shadow)"/>
  <text x="170" y="223.045871559633" text-anchor="middle" font-size="20.632209610085" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Agent SDK</text>

  <rect x="60" y="316.697247706422" width="220" height="74.495412844037" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" filter="url(#shadow)"/>
  <text x="170" y="361.394495412844" text-anchor="middle" font-size="20.632209610085" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Your harness</text>

  <text x="170" y="439.082568807339" text-anchor="middle" font-size="16.505767688068" fill="var(--text-muted)" font-family="Arial, sans-serif">MCP hosts / clients</text>

  <!-- CENTER: MCP protocol band -->
  <rect x="520" y="40" width="240" height="351.192660550459" rx="6.189662883026" fill="url(#grad-info)" stroke="var(--info-border)" filter="url(#shadow)"/>
  <text x="640" y="199.633027522936" text-anchor="middle" font-size="30.948314415128" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">MCP</text>
  <text x="640" y="233.688073394495" text-anchor="middle" font-size="16.505767688068" fill="var(--info-text)" font-family="Arial, sans-serif">open protocol</text>

  <!-- RIGHT: MCP servers -->
  <rect x="1000" y="40" width="220" height="74.495412844037" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="1110" y="84.697247706422" text-anchor="middle" font-size="19.600599129581" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">filesystem server</text>

  <rect x="1000" y="178.348623853211" width="220" height="74.495412844037" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="1110" y="223.045871559633" text-anchor="middle" font-size="19.600599129581" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">github server</text>

  <rect x="1000" y="316.697247706422" width="220" height="74.495412844037" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" filter="url(#shadow)"/>
  <text x="1110" y="361.394495412844" text-anchor="middle" font-size="19.600599129581" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">database server</text>

  <text x="1110" y="439.082568807339" text-anchor="middle" font-size="16.505767688068" fill="var(--text-muted)" font-family="Arial, sans-serif">MCP servers (tools)</text>

  <!-- Arrows: hosts -> MCP -->
  <line x1="280" y1="77.247706422018" x2="518" y2="135.779816513761" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="280" y1="215.596330275229" x2="518" y2="215.596330275229" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="280" y1="353.94495412844" x2="518" y2="295.412844036697" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <!-- Arrows: MCP -> servers -->
  <line x1="762" y1="135.779816513761" x2="998" y2="77.247706422018" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="762" y1="215.596330275229" x2="998" y2="215.596330275229" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="762" y1="295.412844036697" x2="998" y2="353.94495412844" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <!-- Bottom summary bar -->
  <rect x="40" y="524.220183486239" width="1200" height="95.779816513761" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="566.788990825688" text-anchor="middle" font-size="19.600599129581" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Write a tool once as an MCP server — every MCP host can call it</text>
  <text x="640" y="598.715596330275" text-anchor="middle" font-size="16.505767688068" fill="var(--text-muted)" font-family="Arial, sans-serif">Tools become portable across apps and models, like skills are portable</text>
</svg>

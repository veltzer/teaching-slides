<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="447.142857142857" y="40" width="428.571428571429" height="79.816513761468" rx="6.406909769273" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="661.428571428571" y="91.082568807339" text-anchor="middle" font-size="27.763275666852" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Common Pitfalls</text>

  <rect x="40" y="167.706422018349" width="600" height="122.385321100917" rx="6.406909769273" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="220.917431192661" text-anchor="middle" font-size="22.424184192457" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Kitchen-sink tool</text>
  <text x="340" y="256.036697247706" text-anchor="middle" font-size="16.017274423184" fill="var(--danger-text)" font-family="Arial, sans-serif">One tool, a mode flag, ten behaviours</text>

  <line x1="640" y1="228.366972477064" x2="725.714285714286" y2="228.366972477064" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="682.857142857143" y="217.724770642202" text-anchor="middle" font-size="14.949456128305" fill="var(--text-muted)" font-family="Arial, sans-serif">fix</text>

  <rect x="725.714285714286" y="167.706422018349" width="514.285714285714" height="122.385321100917" rx="6.406909769273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.857142857143" y="236.880733944954" text-anchor="middle" font-size="20.288547602699" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Split into single-purpose tools</text>

  <rect x="40" y="332.660550458716" width="600" height="122.385321100917" rx="6.406909769273" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="385.871559633028" text-anchor="middle" font-size="22.424184192457" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Too many tools</text>
  <text x="340" y="420.990825688073" text-anchor="middle" font-size="16.017274423184" fill="var(--danger-text)" font-family="Arial, sans-serif">Dozens of schemas bloat context, confuse picks</text>

  <line x1="640" y1="393.321100917431" x2="725.714285714286" y2="393.321100917431" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="682.857142857143" y="382.678899082569" text-anchor="middle" font-size="14.949456128305" fill="var(--text-muted)" font-family="Arial, sans-serif">fix</text>

  <rect x="725.714285714286" y="332.660550458716" width="514.285714285714" height="122.385321100917" rx="6.406909769273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.857142857143" y="401.834862385321" text-anchor="middle" font-size="20.288547602699" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Expose only what the task needs</text>

  <rect x="40" y="497.614678899083" width="600" height="122.385321100917" rx="6.406909769273" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="550.825688073395" text-anchor="middle" font-size="22.424184192457" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Unguarded destructive tool</text>
  <text x="340" y="585.94495412844" text-anchor="middle" font-size="16.017274423184" fill="var(--danger-text)" font-family="Arial, sans-serif">It can delete, spend, or send for real</text>

  <line x1="640" y1="558.275229357798" x2="725.714285714286" y2="558.275229357798" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="682.857142857143" y="547.633027522936" text-anchor="middle" font-size="14.949456128305" fill="var(--text-muted)" font-family="Arial, sans-serif">fix</text>

  <rect x="725.714285714286" y="497.614678899083" width="514.285714285714" height="122.385321100917" rx="6.406909769273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.857142857143" y="566.788990825688" text-anchor="middle" font-size="20.288547602699" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Validate, scope, confirm risky actions</text>
</svg>

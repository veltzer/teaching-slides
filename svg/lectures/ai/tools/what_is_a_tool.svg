<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="425" y="40" width="430" height="130" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="88" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">A Tool</text>
  <text x="640" y="125" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">A function you expose to the model,</text>
  <text x="640" y="152" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">which it can choose to call</text>

  <rect x="40" y="265" width="364" height="194" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222" y="308" text-anchor="middle" font-size="23" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">A capability</text>
  <text x="222" y="351" text-anchor="middle" font-size="17" fill="var(--ok-text)" font-family="Arial, sans-serif">"Read a file, send mail, do math"</text>
  <text x="222" y="389" text-anchor="middle" font-size="17" fill="var(--ok-text)" font-family="Arial, sans-serif">Reaches beyond the model's text</text>
  <text x="222" y="427" text-anchor="middle" font-size="17" fill="var(--ok-text)" font-family="Arial, sans-serif">Described by a name + schema</text>

  <rect x="458" y="265" width="364" height="194" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="308" text-anchor="middle" font-size="23" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Model decides</text>
  <text x="640" y="351" text-anchor="middle" font-size="17" fill="var(--info-text)" font-family="Arial, sans-serif">The model emits a call request</text>
  <text x="640" y="389" text-anchor="middle" font-size="17" fill="var(--info-text)" font-family="Arial, sans-serif">when the task calls for it</text>
  <text x="640" y="427" text-anchor="middle" font-size="17" fill="var(--info-text)" font-family="Arial, sans-serif">It judges relevance, not rules</text>

  <rect x="876" y="265" width="364" height="194" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058" y="308" text-anchor="middle" font-size="23" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Your code runs it</text>
  <text x="1058" y="351" text-anchor="middle" font-size="17" fill="var(--warn-text)" font-family="Arial, sans-serif">The runtime executes, not the model</text>
  <text x="1058" y="389" text-anchor="middle" font-size="17" fill="var(--warn-text)" font-family="Arial, sans-serif">You validate and stay in control</text>
  <text x="1058" y="427" text-anchor="middle" font-size="17" fill="var(--warn-text)" font-family="Arial, sans-serif">The result flows back in</text>

  <line x1="554" y1="170" x2="297" y2="260" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="640" y1="170" x2="640" y2="260" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="726" y1="170" x2="983" y2="260" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <rect x="40" y="513" width="1200" height="107" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="556" text-anchor="middle" font-size="19" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Not run by the model — your runtime executes it and returns the result</text>
  <text x="640" y="593" text-anchor="middle" font-size="17" fill="var(--text-muted)" font-family="Arial, sans-serif">The model supplies judgement; the tool supplies capability the model lacks</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="220" y="40" text-anchor="middle" font-size="22.80025990755" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">M hosts</text>
  <text x="1060" y="40" text-anchor="middle" font-size="22.80025990755" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">N tools</text>

  <!-- Hosts (left) -->
  <rect x="120" y="82.962962962963" width="200" height="64.444444444444" rx="6.218252702059" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="122.703703703704" text-anchor="middle" font-size="18.654758106178" fill="var(--primary-text)" font-family="Arial, sans-serif">Editor</text>
  <rect x="120" y="222.592592592593" width="200" height="64.444444444444" rx="6.218252702059" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="262.333333333333" text-anchor="middle" font-size="18.654758106178" fill="var(--primary-text)" font-family="Arial, sans-serif">Chatbot</text>
  <rect x="120" y="362.222222222222" width="200" height="64.444444444444" rx="6.218252702059" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="401.962962962963" text-anchor="middle" font-size="18.654758106178" fill="var(--primary-text)" font-family="Arial, sans-serif">Custom agent</text>

  <!-- MCP hub -->
  <rect x="560" y="158.148148148148" width="160" height="193.333333333333" rx="6.218252702059" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="249.444444444444" text-anchor="middle" font-size="35.236765311669" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">MCP</text>
  <text x="640" y="284.888888888889" text-anchor="middle" font-size="15.545631755148" fill="var(--info-text)" font-family="Arial, sans-serif">one interface</text>

  <!-- Tools (right) -->
  <rect x="960" y="82.962962962963" width="200" height="64.444444444444" rx="6.218252702059" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="122.703703703704" text-anchor="middle" font-size="18.654758106178" fill="var(--ok-text)" font-family="Arial, sans-serif">Files</text>
  <rect x="960" y="222.592592592593" width="200" height="64.444444444444" rx="6.218252702059" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="262.333333333333" text-anchor="middle" font-size="18.654758106178" fill="var(--ok-text)" font-family="Arial, sans-serif">GitHub</text>
  <rect x="960" y="362.222222222222" width="200" height="64.444444444444" rx="6.218252702059" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="401.962962962963" text-anchor="middle" font-size="18.654758106178" fill="var(--ok-text)" font-family="Arial, sans-serif">Database</text>

  <!-- Spokes: hosts -> MCP -->
  <line x1="320" y1="115.185185185185" x2="558" y2="211.851851851852" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="320" y1="254.814814814815" x2="558" y2="254.814814814815" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="320" y1="394.444444444444" x2="558" y2="297.777777777778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <!-- Spokes: MCP -> tools -->
  <line x1="720" y1="211.851851851852" x2="958" y2="115.185185185185" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="720" y1="254.814814814815" x2="958" y2="254.814814814815" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="720" y1="297.777777777778" x2="958" y2="394.444444444444" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <rect x="40" y="501.851851851852" width="1200" height="118.148148148148" rx="6.218252702059" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="553.407407407407" text-anchor="middle" font-size="24.873010808237" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">M + N connectors</text>
  <text x="640" y="593.148148148148" text-anchor="middle" font-size="18.654758106178" fill="var(--ok-text)" font-family="Arial, sans-serif">Each host speaks MCP once; each tool is written once — the explosion collapses</text>
</svg>

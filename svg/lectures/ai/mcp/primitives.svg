<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="23.407787770353" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">What an MCP server can offer</text>

  <!-- Tools -->
  <rect x="40" y="83.77358490566" width="372.413793103448" height="459.622641509434" rx="6.383942119187" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.206896551724" y="149.433962264151" text-anchor="middle" font-size="29.79172988954" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Tools</text>
  <text x="226.206896551724" y="215.094339622641" text-anchor="middle" font-size="20.215816710759" fill="var(--primary-text)" font-family="Arial, sans-serif">functions to call</text>
  <text x="226.206896551724" y="269.811320754717" text-anchor="middle" font-size="19.151826357562" fill="var(--primary-text)" font-family="Arial, sans-serif">act or fetch</text>
  <text x="226.206896551724" y="368.301886792453" text-anchor="middle" font-size="18.087836004364" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">model-controlled</text>
  <text x="226.206896551724" y="423.018867924528" text-anchor="middle" font-size="17.023845651166" fill="var(--primary-text)" font-family="Arial, sans-serif">the LLM decides</text>
  <text x="226.206896551724" y="450.377358490566" text-anchor="middle" font-size="17.023845651166" fill="var(--primary-text)" font-family="Arial, sans-serif">when to call</text>

  <!-- Resources -->
  <rect x="453.793103448276" y="83.77358490566" width="372.413793103448" height="459.622641509434" rx="6.383942119187" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="149.433962264151" text-anchor="middle" font-size="29.79172988954" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Resources</text>
  <text x="640" y="215.094339622641" text-anchor="middle" font-size="20.215816710759" fill="var(--ok-text)" font-family="Arial, sans-serif">data to read</text>
  <text x="640" y="269.811320754717" text-anchor="middle" font-size="19.151826357562" fill="var(--ok-text)" font-family="Arial, sans-serif">files, rows, docs</text>
  <text x="640" y="368.301886792453" text-anchor="middle" font-size="18.087836004364" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">app-controlled</text>
  <text x="640" y="423.018867924528" text-anchor="middle" font-size="17.023845651166" fill="var(--ok-text)" font-family="Arial, sans-serif">the host decides</text>
  <text x="640" y="450.377358490566" text-anchor="middle" font-size="17.023845651166" fill="var(--ok-text)" font-family="Arial, sans-serif">what to load</text>

  <!-- Prompts -->
  <rect x="867.586206896552" y="83.77358490566" width="372.413793103448" height="459.622641509434" rx="6.383942119187" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.793103448276" y="149.433962264151" text-anchor="middle" font-size="29.79172988954" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Prompts</text>
  <text x="1053.793103448276" y="215.094339622641" text-anchor="middle" font-size="20.215816710759" fill="var(--info-text)" font-family="Arial, sans-serif">templates to invoke</text>
  <text x="1053.793103448276" y="269.811320754717" text-anchor="middle" font-size="19.151826357562" fill="var(--info-text)" font-family="Arial, sans-serif">reusable workflows</text>
  <text x="1053.793103448276" y="368.301886792453" text-anchor="middle" font-size="18.087836004364" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">user-controlled</text>
  <text x="1053.793103448276" y="423.018867924528" text-anchor="middle" font-size="17.023845651166" fill="var(--info-text)" font-family="Arial, sans-serif">the user picks</text>
  <text x="1053.793103448276" y="450.377358490566" text-anchor="middle" font-size="17.023845651166" fill="var(--info-text)" font-family="Arial, sans-serif">e.g. a slash command</text>

  <rect x="40" y="565.283018867925" width="1200" height="54.716981132075" rx="6.383942119187" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="600.301886792453" text-anchor="middle" font-size="19.151826357562" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">One server may offer any mix of the three</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="30.700162866018" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MCP is the standard port between agents and the world</text>

  <rect x="40" y="148.75" width="323.076923076923" height="193.333333333333" rx="7.084652969081" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="201.538461538462" y="233.333333333333" text-anchor="middle" font-size="25.97706088663" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Host + model</text>
  <text x="201.538461538462" y="281.666666666667" text-anchor="middle" font-size="18.892407917549" fill="var(--primary-text)" font-family="Arial, sans-serif">supplies judgement</text>

  <rect x="478.461538461538" y="148.75" width="323.076923076923" height="193.333333333333" rx="7.084652969081" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="233.333333333333" text-anchor="middle" font-size="33.061713855711" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">MCP</text>
  <text x="640" y="281.666666666667" text-anchor="middle" font-size="18.892407917549" fill="var(--info-text)" font-family="Arial, sans-serif">the standard port</text>

  <rect x="916.923076923077" y="148.75" width="323.076923076923" height="193.333333333333" rx="7.084652969081" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1078.461538461539" y="233.333333333333" text-anchor="middle" font-size="25.97706088663" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Servers</text>
  <text x="1078.461538461539" y="281.666666666667" text-anchor="middle" font-size="18.892407917549" fill="var(--ok-text)" font-family="Arial, sans-serif">supply capability</text>

  <line x1="363.076923076923" y1="245.416666666667" x2="476.153846153846" y2="245.416666666667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="801.538461538461" y1="245.416666666667" x2="914.615384615385" y2="245.416666666667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="438.75" width="1200" height="181.25" rx="7.084652969081" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="499.166666666667" text-anchor="middle" font-size="23.615509896937" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Write a tool once; any host can speak to it</text>
  <text x="640" y="547.5" text-anchor="middle" font-size="20.073183412396" fill="var(--text-muted)" font-family="Arial, sans-serif">M × N bespoke connectors collapse into M + N — host, client, server, over one wire</text>
  <text x="640" y="589.791666666667" text-anchor="middle" font-size="20.073183412396" fill="var(--text-muted)" font-family="Arial, sans-serif">Tools, resources, prompts — discovered dynamically, reusable across models</text>
</svg>

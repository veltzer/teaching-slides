<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="257.142857142857" height="198.857142857143" rx="7.994896331219" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.571428571429" y="122.857142857143" text-anchor="middle" font-size="29.314619881136" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Model</text>
  <text x="168.571428571429" y="175.885714285714" text-anchor="middle" font-size="19.987240828047" fill="var(--primary-text)" font-family="Arial, sans-serif">decides to call</text>

  <rect x="511.428571428571" y="40" width="257.142857142857" height="198.857142857143" rx="7.994896331219" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="122.857142857143" text-anchor="middle" font-size="29.314619881136" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Host / client</text>
  <text x="640" y="175.885714285714" text-anchor="middle" font-size="19.987240828047" fill="var(--info-text)" font-family="Arial, sans-serif">validates + routes</text>

  <rect x="982.857142857143" y="40" width="257.142857142857" height="198.857142857143" rx="7.994896331219" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1111.428571428571" y="122.857142857143" text-anchor="middle" font-size="29.314619881136" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Server</text>
  <text x="1111.428571428571" y="175.885714285714" text-anchor="middle" font-size="19.987240828047" fill="var(--ok-text)" font-family="Arial, sans-serif">runs real code</text>

  <!-- request path -->
  <line x1="297.142857142857" y1="106.285714285714" x2="509.285714285714" y2="106.285714285714" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404.285714285714" y="81.428571428571" text-anchor="middle" font-size="18.654758106178" fill="var(--text-muted)" font-family="Arial, sans-serif">name + args</text>
  <line x1="768.571428571429" y1="106.285714285714" x2="980.714285714286" y2="106.285714285714" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="875.714285714286" y="81.428571428571" text-anchor="middle" font-size="18.654758106178" fill="var(--text-muted)" font-family="Arial, sans-serif">tools/call</text>

  <!-- result path -->
  <line x1="980.714285714286" y1="180.857142857143" x2="768.571428571429" y2="180.857142857143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="875.714285714286" y="218.971428571429" text-anchor="middle" font-size="18.654758106178" fill="var(--ok-accent)" font-family="Arial, sans-serif">result</text>
  <line x1="509.285714285714" y1="180.857142857143" x2="297.142857142857" y2="180.857142857143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="404.285714285714" y="218.971428571429" text-anchor="middle" font-size="18.654758106178" fill="var(--ok-accent)" font-family="Arial, sans-serif">into context</text>

  <rect x="40" y="371.428571428571" width="1200" height="248.571428571429" rx="7.994896331219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="446" text-anchor="middle" font-size="25.317171715527" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The model only asks — it never runs the server's code</text>
  <text x="640" y="507.314285714286" text-anchor="middle" font-size="22.652206271787" fill="var(--text-muted)" font-family="Arial, sans-serif">The host validates and routes; the server executes; the result flows back into context</text>
  <text x="640" y="568.628571428571" text-anchor="middle" font-size="22.652206271787" fill="var(--text-muted)" font-family="Arial, sans-serif">The model then continues — answering, or calling another tool</text>
</svg>

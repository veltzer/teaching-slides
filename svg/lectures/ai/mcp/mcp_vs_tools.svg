<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Plain tools panel -->
  <rect x="40" y="40" width="579.310344827586" height="528.316831683168" rx="6.540051775615" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="329.655172413793" y="85.940594059406" text-anchor="middle" font-size="26.160207102459" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Plain tools</text>

  <rect x="102.068965517241" y="131.881188118812" width="455.172413793103" height="321.584158415842" rx="6.540051775615" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="177.821782178218" text-anchor="middle" font-size="21.800172585383" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">One app</text>
  <rect x="153.793103448276" y="223.762376237624" width="155.172413793103" height="68.910891089109" rx="6.540051775615" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="266.257425742574" text-anchor="middle" font-size="17.440138068306" fill="var(--warn-text)" font-family="Arial, sans-serif">tool</text>
  <rect x="350.344827586207" y="223.762376237624" width="155.172413793103" height="68.910891089109" rx="6.540051775615" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="427.931034482759" y="266.257425742574" text-anchor="middle" font-size="17.440138068306" fill="var(--warn-text)" font-family="Arial, sans-serif">tool</text>
  <text x="329.655172413793" y="361.584158415842" text-anchor="middle" font-size="17.440138068306" fill="var(--primary-text)" font-family="Arial, sans-serif">Tools live inside the app's code</text>
  <text x="329.655172413793" y="396.039603960396" text-anchor="middle" font-size="17.440138068306" fill="var(--primary-text)" font-family="Arial, sans-serif">Bound to one host, one model</text>

  <text x="329.655172413793" y="522.376237623762" text-anchor="middle" font-size="18.530146697575" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast to start, hard to reuse</text>

  <!-- MCP panel -->
  <rect x="660.689655172414" y="40" width="579.310344827586" height="528.316831683168" rx="6.540051775615" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.344827586207" y="85.940594059406" text-anchor="middle" font-size="26.160207102459" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MCP tools</text>

  <rect x="712.413793103448" y="143.366336633663" width="186.206896551724" height="229.70297029703" rx="6.540051775615" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.51724137931" y="263.960396039604" text-anchor="middle" font-size="19.620155326845" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Any host</text>

  <rect x="1002.068965517241" y="143.366336633663" width="186.206896551724" height="229.70297029703" rx="6.540051775615" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172413793103" y="240.990099009901" text-anchor="middle" font-size="19.620155326845" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Server</text>
  <text x="1095.172413793103" y="275.445544554455" text-anchor="middle" font-size="16.350129439037" fill="var(--ok-text)" font-family="Arial, sans-serif">tools live here</text>

  <line x1="898.620689655172" y1="258.217821782178" x2="1000" y2="258.217821782178" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="950.344827586207" y="240.990099009901" text-anchor="middle" font-size="15.260120809768" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">MCP</text>

  <text x="950.344827586207" y="436.237623762376" text-anchor="middle" font-size="17.440138068306" fill="var(--text)" font-family="Arial, sans-serif">A separate, reusable server</text>
  <text x="950.344827586207" y="522.376237623762" text-anchor="middle" font-size="18.530146697575" fill="var(--text-muted)" font-family="Arial, sans-serif">Outlives any single app or model</text>

  <text x="640" y="620" text-anchor="middle" font-size="19.620155326845" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Same trust model — MCP standardizes the wire, not who runs the code</text>
</svg>

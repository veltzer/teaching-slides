<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="25.29701977954" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Two ways MCP setups go wrong</text>

  <rect x="40" y="89.36170212766" width="557.142857142857" height="530.63829787234" rx="6.899187212602" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="318.571428571429" y="163.404255319149" text-anchor="middle" font-size="27.596748850407" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Too many tools</text>
  <text x="318.571428571429" y="237.446808510638" text-anchor="middle" font-size="19.547697102372" fill="var(--danger-text)" font-family="Arial, sans-serif">A dozen chatty servers at once</text>
  <text x="318.571428571429" y="280.63829787234" text-anchor="middle" font-size="19.547697102372" fill="var(--danger-text)" font-family="Arial, sans-serif">Hundreds of schemas bloat context</text>
  <text x="318.571428571429" y="323.829787234043" text-anchor="middle" font-size="19.547697102372" fill="var(--danger-text)" font-family="Arial, sans-serif">The model picks slowly, and wrong</text>
  <rect x="82.857142857143" y="397.872340425532" width="471.428571428571" height="148.085106382979" rx="6.899187212602" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="318.571428571429" y="453.404255319149" text-anchor="middle" font-size="20.697561637806" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Fix</text>
  <text x="318.571428571429" y="499.063829787234" text-anchor="middle" font-size="18.397832566938" fill="var(--text)" font-family="Arial, sans-serif">Connect only the servers a task needs;</text>
  <text x="318.571428571429" y="527.446808510638" text-anchor="middle" font-size="18.397832566938" fill="var(--text)" font-family="Arial, sans-serif">group servers by agent</text>

  <rect x="682.857142857143" y="89.36170212766" width="557.142857142857" height="530.63829787234" rx="6.899187212602" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="961.428571428571" y="163.404255319149" text-anchor="middle" font-size="27.596748850407" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Vague descriptions</text>
  <text x="961.428571428571" y="237.446808510638" text-anchor="middle" font-size="19.547697102372" fill="var(--danger-text)" font-family="Arial, sans-serif">The model picks by reading them</text>
  <text x="961.428571428571" y="280.63829787234" text-anchor="middle" font-size="19.547697102372" fill="var(--danger-text)" font-family="Arial, sans-serif">A weak description never fires</text>
  <text x="961.428571428571" y="323.829787234043" text-anchor="middle" font-size="19.547697102372" fill="var(--danger-text)" font-family="Arial, sans-serif">The right tool sits unused</text>
  <rect x="725.714285714286" y="397.872340425532" width="471.428571428571" height="148.085106382979" rx="6.899187212602" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="961.428571428571" y="453.404255319149" text-anchor="middle" font-size="20.697561637806" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Fix</text>
  <text x="961.428571428571" y="499.063829787234" text-anchor="middle" font-size="18.397832566938" fill="var(--text)" font-family="Arial, sans-serif">State the capability and the trigger,</text>
  <text x="961.428571428571" y="527.446808510638" text-anchor="middle" font-size="18.397832566938" fill="var(--text)" font-family="Arial, sans-serif">just like plain tools</text>
</svg>

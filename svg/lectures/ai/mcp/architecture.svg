<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Host container -->
  <rect x="40" y="40" width="372.413793103448" height="503.396226415094" rx="6.383942119187" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="226.206896551724" y="78.301886792453" text-anchor="middle" font-size="23.407787770353" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Host (AI app)</text>

  <rect x="81.379310344828" y="105.660377358491" width="289.655172413793" height="76.603773584906" rx="6.383942119187" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.206896551724" y="152.716981132075" text-anchor="middle" font-size="21.279807063957" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">LLM</text>

  <rect x="81.379310344828" y="247.924528301887" width="289.655172413793" height="65.660377358491" rx="6.383942119187" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.206896551724" y="287.320754716981" text-anchor="middle" font-size="19.151826357562" fill="var(--info-text)" font-family="Arial, sans-serif">client A</text>
  <rect x="81.379310344828" y="390.188679245283" width="289.655172413793" height="65.660377358491" rx="6.383942119187" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.206896551724" y="429.584905660377" text-anchor="middle" font-size="19.151826357562" fill="var(--info-text)" font-family="Arial, sans-serif">client B</text>

  <line x1="226.206896551724" y1="182.264150943396" x2="226.206896551724" y2="245.735849056604" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="226.206896551724" y1="313.584905660377" x2="226.206896551724" y2="388" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Servers -->
  <rect x="640" y="226.037735849057" width="248.275862068966" height="109.433962264151" rx="6.383942119187" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764.137931034483" y="275.283018867925" text-anchor="middle" font-size="21.279807063957" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Server A</text>
  <text x="764.137931034483" y="304.830188679245" text-anchor="middle" font-size="15.959855297968" fill="var(--ok-text)" font-family="Arial, sans-serif">filesystem</text>

  <rect x="640" y="379.245283018868" width="248.275862068966" height="109.433962264151" rx="6.383942119187" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764.137931034483" y="428.490566037736" text-anchor="middle" font-size="21.279807063957" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Server B</text>
  <text x="764.137931034483" y="458.037735849057" text-anchor="middle" font-size="15.959855297968" fill="var(--ok-text)" font-family="Arial, sans-serif">github</text>

  <!-- Backends -->
  <rect x="1033.103448275862" y="236.981132075472" width="206.896551724138" height="87.547169811321" rx="6.383942119187" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.551724137931" y="287.320754716981" text-anchor="middle" font-size="19.151826357562" fill="var(--warn-text)" font-family="Arial, sans-serif">local files</text>
  <rect x="1033.103448275862" y="390.188679245283" width="206.896551724138" height="87.547169811321" rx="6.383942119187" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.551724137931" y="440.528301886792" text-anchor="middle" font-size="19.151826357562" fill="var(--warn-text)" font-family="Arial, sans-serif">GitHub API</text>

  <!-- client -> server over MCP -->
  <line x1="371.034482758621" y1="280.754716981132" x2="637.931034482759" y2="280.754716981132" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="371.034482758621" y1="423.018867924528" x2="637.931034482759" y2="433.962264150943" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="505.51724137931" y="264.339622641509" text-anchor="middle" font-size="15.959855297968" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">MCP</text>

  <!-- server -> backend -->
  <line x1="888.275862068966" y1="280.754716981132" x2="1031.034482758621" y2="280.754716981132" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="888.275862068966" y1="433.962264150943" x2="1031.034482758621" y2="433.962264150943" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <text x="764.137931034483" y="171.320754716981" text-anchor="middle" font-size="19.151826357562" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MCP servers</text>
  <text x="1136.551724137931" y="193.207547169811" text-anchor="middle" font-size="19.151826357562" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">real systems</text>

  <rect x="40" y="565.283018867925" width="1200" height="54.716981132075" rx="6.383942119187" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="600.301886792453" text-anchor="middle" font-size="19.151826357562" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">One client per server — the host runs the model, each server runs the real code</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="420" height="70" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250.0" y="82.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--primary-text)">Thread A</text>
  <rect x="480" y="40" width="320" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="82.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--text)">counter = 41</text>
  <rect x="820" y="40" width="420" height="70" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1030.0" y="82.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--warn-text)">Thread B</text>
  <rect x="40" y="135" width="420" height="50" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250.0" y="166.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">read counter: 41</text>
  <rect x="820" y="199" width="420" height="50" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1030.0" y="230.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">read counter: 41</text>
  <rect x="40" y="263" width="420" height="50" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250.0" y="294.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">add one: 42</text>
  <rect x="820" y="327" width="420" height="50" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1030.0" y="358.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">add one: 42</text>
  <rect x="40" y="391" width="420" height="50" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250.0" y="422.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">write counter = 42</text>
  <rect x="820" y="455" width="420" height="50" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1030.0" y="486.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">write counter = 42</text>
  <line x1="640" y1="130" x2="640" y2="510" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="640" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">time</text>
  <line x1="640" y1="330" x2="640" y2="420" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="540" width="1200" height="80" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640.0" y="573.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">Two increments, one lost update: counter = 42, not 43.</text>
  <text x="640.0" y="599.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">Passes every test that runs one thread at a time.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="360" height="150" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="220.0" y="98.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Specify</text>
  <text x="220.0" y="125.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">intent, constraints,</text>
  <text x="220.0" y="149.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">acceptance tests</text>
  <rect x="880" y="40" width="360" height="150" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1060.0" y="98.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Generate</text>
  <text x="1060.0" y="125.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--info-text)">a small, reviewable</text>
  <text x="1060.0" y="149.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--info-text)">step</text>
  <rect x="880" y="470" width="360" height="150" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1060.0" y="528.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Verify</text>
  <text x="1060.0" y="555.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--warn-text)">tests, review,</text>
  <text x="1060.0" y="579.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--warn-text)">measurement</text>
  <rect x="40" y="470" width="360" height="150" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="220.0" y="528.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Integrate</text>
  <text x="220.0" y="555.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-text)">merge working</text>
  <text x="220.0" y="579.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-text)">software</text>
  <line x1="400" y1="115" x2="877" y2="115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1060" y1="190" x2="1060" y2="467" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="545" x2="403" y2="545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="470" x2="220" y2="193" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="260" width="340" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="309.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--text)">You own:</text>
  <text x="640.0" y="337.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="var(--text)">direction, design,</text>
  <text x="640.0" y="364.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="var(--text)">and the definition of done</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="240" width="260" height="140" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="170.0" y="293.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Lock</text>
  <text x="170.0" y="320.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">pin current</text>
  <text x="170.0" y="344.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">behaviour</text>
  <rect x="353" y="240" width="260" height="140" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="483.0" y="293.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Rewrite</text>
  <text x="483.0" y="320.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--info-text)">the AI changes</text>
  <text x="483.0" y="344.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--info-text)">the code freely</text>
  <rect x="666" y="240" width="260" height="140" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="796.0" y="293.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Run tests</text>
  <text x="796.0" y="320.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--warn-text)">fast, deterministic,</text>
  <text x="796.0" y="344.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--warn-text)">isolated suite</text>
  <rect x="980" y="40" width="260" height="140" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1110.0" y="105.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Green</text>
  <text x="1110.0" y="132.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-text)">keep the change</text>
  <rect x="980" y="440" width="260" height="180" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1110.0" y="501.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Red</text>
  <text x="1110.0" y="527.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--danger-text)">discard and retry,</text>
  <text x="1110.0" y="552.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--danger-text)">never edit the test</text>
  <text x="1110.0" y="577.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--danger-text)">to pass</text>
  <line x1="300" y1="310" x2="350" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="613" y1="310" x2="663" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="926" y1="290" x2="978" y2="160" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="926" y1="330" x2="978" y2="470" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <path d="M1110,180 L1110,215 L483,215 L483,238" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">next change</text>
  <path d="M980,560 L483,560 L483,382" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">try again</text>
</svg>

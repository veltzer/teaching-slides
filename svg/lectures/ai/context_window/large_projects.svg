<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="30.319058082646" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The project never fits — work selectively</text>

  <rect x="40" y="94.716981132075" width="364.285714285714" height="459.622641509434" rx="6.49694101771" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="222.142857142857" y="138.490566037736" text-anchor="middle" font-size="21.656470059033" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">codebase</text>
  <text x="222.142857142857" y="169.132075471698" text-anchor="middle" font-size="17.325176047226" fill="var(--text-muted)" font-family="Arial, sans-serif">millions of tokens</text>
  <rect x="72.142857142857" y="193.207547169811" width="85.714285714286" height="54.716981132075" rx="6.49694101771" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="179.285714285714" y="193.207547169811" width="85.714285714286" height="54.716981132075" rx="6.49694101771" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="286.428571428571" y="193.207547169811" width="85.714285714286" height="54.716981132075" rx="6.49694101771" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="72.142857142857" y="269.811320754717" width="85.714285714286" height="54.716981132075" rx="6.49694101771" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="179.285714285714" y="269.811320754717" width="85.714285714286" height="54.716981132075" rx="6.49694101771" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="286.428571428571" y="269.811320754717" width="85.714285714286" height="54.716981132075" rx="6.49694101771" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="72.142857142857" y="346.415094339623" width="85.714285714286" height="54.716981132075" rx="6.49694101771" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="179.285714285714" y="346.415094339623" width="85.714285714286" height="54.716981132075" rx="6.49694101771" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="286.428571428571" y="346.415094339623" width="85.714285714286" height="54.716981132075" rx="6.49694101771" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="72.142857142857" y="423.018867924528" width="85.714285714286" height="54.716981132075" rx="6.49694101771" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="179.285714285714" y="423.018867924528" width="85.714285714286" height="54.716981132075" rx="6.49694101771" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <rect x="286.428571428571" y="423.018867924528" width="85.714285714286" height="54.716981132075" rx="6.49694101771" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="222.142857142857" y="526.981132075472" text-anchor="middle" font-size="17.325176047226" fill="var(--text-muted)" font-family="Arial, sans-serif">only one file matters now</text>

  <rect x="554.285714285714" y="105.660377358491" width="685.714285714286" height="109.433962264151" rx="6.49694101771" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="897.142857142857" y="151.622641509434" text-anchor="middle" font-size="21.656470059033" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">search first, read second</text>
  <text x="897.142857142857" y="184.452830188679" text-anchor="middle" font-size="17.325176047226" fill="var(--primary-text)" font-family="Arial, sans-serif">grep and glob locate the spots; read only those</text>

  <rect x="554.285714285714" y="269.811320754717" width="685.714285714286" height="109.433962264151" rx="6.49694101771" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="897.142857142857" y="315.77358490566" text-anchor="middle" font-size="21.656470059033" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">subagents explore</text>
  <text x="897.142857142857" y="348.603773584906" text-anchor="middle" font-size="17.325176047226" fill="var(--ok-text)" font-family="Arial, sans-serif">they burn their own windows, return short conclusions</text>

  <rect x="554.285714285714" y="433.962264150943" width="685.714285714286" height="109.433962264151" rx="6.49694101771" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="897.142857142857" y="479.924528301887" text-anchor="middle" font-size="21.656470059033" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">files as memory</text>
  <text x="897.142857142857" y="512.754716981132" text-anchor="middle" font-size="17.325176047226" fill="var(--warn-text)" font-family="Arial, sans-serif">plans, notes, decisions — they survive every reset</text>

  <line x1="409.642857142857" y1="204.150943396226" x2="548.928571428571" y2="165.849056603774" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="409.642857142857" y1="324.528301886792" x2="548.928571428571" y2="324.528301886792" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="409.642857142857" y1="444.905660377359" x2="548.928571428571" y2="483.207547169811" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <text x="640" y="620" text-anchor="middle" font-size="19.49082305313" fill="var(--text-muted)" font-family="Arial, sans-serif">The window is a workbench, not a warehouse</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="31.770542481823" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Six ways to keep the window lean</text>

  <rect x="40" y="85.490196078431" width="339.622641509434" height="90.980392156863" rx="6.807973388962" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.811320754717" y="125.294117647059" text-anchor="middle" font-size="22.693244629874" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">clear</text>
  <text x="209.811320754717" y="156" text-anchor="middle" font-size="18.154595703899" fill="var(--danger-text)" font-family="Arial, sans-serif">wipe and restart</text>

  <rect x="470.188679245283" y="85.490196078431" width="339.622641509434" height="90.980392156863" rx="6.807973388962" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.294117647059" text-anchor="middle" font-size="22.693244629874" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">summarize</text>
  <text x="640" y="156" text-anchor="middle" font-size="18.154595703899" fill="var(--warn-text)" font-family="Arial, sans-serif">fold old turns into a digest</text>

  <rect x="900.377358490566" y="85.490196078431" width="339.622641509434" height="90.980392156863" rx="6.807973388962" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.188679245283" y="125.294117647059" text-anchor="middle" font-size="22.693244629874" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">compact</text>
  <text x="1070.188679245283" y="156" text-anchor="middle" font-size="18.154595703899" fill="var(--info-text)" font-family="Arial, sans-serif">automatic, mid-task</text>

  <rect x="436.22641509434" y="301.56862745098" width="407.547169811321" height="125.098039215686" rx="6.807973388962" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="356.156862745098" text-anchor="middle" font-size="24.962569092861" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">the smallest context</text>
  <text x="640" y="392.549019607843" text-anchor="middle" font-size="24.962569092861" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">that still has everything</text>

  <rect x="40" y="529.019607843137" width="339.622641509434" height="90.980392156863" rx="6.807973388962" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.811320754717" y="568.823529411765" text-anchor="middle" font-size="22.693244629874" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">offload to files</text>
  <text x="209.811320754717" y="599.529411764706" text-anchor="middle" font-size="18.154595703899" fill="var(--ok-text)" font-family="Arial, sans-serif">notes, plans, decisions</text>

  <rect x="470.188679245283" y="529.019607843137" width="339.622641509434" height="90.980392156863" rx="6.807973388962" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="568.823529411765" text-anchor="middle" font-size="22.693244629874" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">subagents</text>
  <text x="640" y="599.529411764706" text-anchor="middle" font-size="18.154595703899" fill="var(--ok-text)" font-family="Arial, sans-serif">fresh windows, short answers</text>

  <rect x="900.377358490566" y="529.019607843137" width="339.622641509434" height="90.980392156863" rx="6.807973388962" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.188679245283" y="568.823529411765" text-anchor="middle" font-size="22.693244629874" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">retrieve on demand</text>
  <text x="1070.188679245283" y="599.529411764706" text-anchor="middle" font-size="18.154595703899" fill="var(--ok-text)" font-family="Arial, sans-serif">search and RAG, not preload</text>

  <line x1="243.77358490566" y1="182.156862745098" x2="492.830188679245" y2="295.882352941176" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="640" y1="182.156862745098" x2="640" y2="295.882352941176" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="1036.22641509434" y1="182.156862745098" x2="787.169811320755" y2="295.882352941176" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="243.77358490566" y1="523.333333333333" x2="492.830188679245" y2="432.352941176471" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="640" y1="523.333333333333" x2="640" y2="432.352941176471" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="1036.22641509434" y1="523.333333333333" x2="787.169811320755" y2="432.352941176471" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="618.571428571429" y="40" text-anchor="middle" font-size="30.03701420285" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Desk, shelf, library</text>

  <rect x="40" y="394.444444444444" width="300" height="150.37037037037" rx="6.436503043468" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="453.518518518519" text-anchor="middle" font-size="21.455010144893" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">context window</text>
  <text x="190" y="491.111111111111" text-anchor="middle" font-size="18.236758623159" fill="var(--primary-text)" font-family="Arial, sans-serif">the desk</text>
  <text x="190" y="335.37037037037" text-anchor="middle" font-size="19.309509130404" fill="var(--text-muted)" font-family="Arial, sans-serif">instant, tiny,</text>
  <text x="190" y="364.37037037037" text-anchor="middle" font-size="19.309509130404" fill="var(--text-muted)" font-family="Arial, sans-serif">everything in reach</text>

  <rect x="447.142857142857" y="287.037037037037" width="342.857142857143" height="257.777777777778" rx="6.436503043468" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="618.571428571429" y="394.444444444444" text-anchor="middle" font-size="21.455010144893" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">files and retrieval</text>
  <text x="618.571428571429" y="432.037037037037" text-anchor="middle" font-size="18.236758623159" fill="var(--ok-text)" font-family="Arial, sans-serif">the shelf</text>
  <text x="618.571428571429" y="227.962962962963" text-anchor="middle" font-size="19.309509130404" fill="var(--text-muted)" font-family="Arial, sans-serif">bigger, fetched</text>
  <text x="618.571428571429" y="256.962962962963" text-anchor="middle" font-size="19.309509130404" fill="var(--text-muted)" font-family="Arial, sans-serif">on demand</text>

  <rect x="897.142857142857" y="179.62962962963" width="342.857142857143" height="365.185185185185" rx="6.436503043468" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.571428571429" y="340.740740740741" text-anchor="middle" font-size="21.455010144893" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">model weights</text>
  <text x="1068.571428571429" y="378.333333333333" text-anchor="middle" font-size="18.236758623159" fill="var(--info-text)" font-family="Arial, sans-serif">the library</text>
  <text x="1068.571428571429" y="120.555555555556" text-anchor="middle" font-size="19.309509130404" fill="var(--text-muted)" font-family="Arial, sans-serif">vast, frozen</text>
  <text x="1068.571428571429" y="149.555555555556" text-anchor="middle" font-size="19.309509130404" fill="var(--text-muted)" font-family="Arial, sans-serif">at training time</text>

  <line x1="345.357142857143" y1="469.62962962963" x2="441.785714285714" y2="448.148148148148" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="795.357142857143" y1="415.925925925926" x2="891.785714285714" y2="394.444444444444" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>

  <text x="618.571428571429" y="620" text-anchor="middle" font-size="19.309509130404" fill="var(--text-muted)" font-family="Arial, sans-serif">Keep the desk tidy, fetch from the shelf, trust the library for general knowledge</text>
</svg>

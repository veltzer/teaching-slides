<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="30.609199220546" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A fuller window is pricier, slower, and dumber</text>

  <rect x="40" y="95.769230769231" width="364.285714285714" height="446.153846153846" rx="6.559114118688" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="222.142857142857" y="140.384615384615" text-anchor="middle" font-size="24.050085101858" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">cost</text>
  <rect x="93.571428571429" y="408.076923076923" width="75" height="89.230769230769" rx="6.559114118688" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="184.642857142857" y="330" width="75" height="167.307692307692" rx="6.559114118688" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="275.714285714286" y="229.615384615385" width="75" height="267.692307692308" rx="6.559114118688" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="222.142857142857" y="528.538461538462" text-anchor="middle" font-size="17.490970983169" fill="var(--text-muted)" font-family="Arial, sans-serif">you pay for every token, every turn</text>

  <rect x="457.857142857143" y="95.769230769231" width="364.285714285714" height="446.153846153846" rx="6.559114118688" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="140.384615384615" text-anchor="middle" font-size="24.050085101858" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">latency</text>
  <rect x="511.428571428571" y="408.076923076923" width="75" height="89.230769230769" rx="6.559114118688" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="602.5" y="330" width="75" height="167.307692307692" rx="6.559114118688" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="693.571428571429" y="229.615384615385" width="75" height="267.692307692308" rx="6.559114118688" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="528.538461538462" text-anchor="middle" font-size="17.490970983169" fill="var(--text-muted)" font-family="Arial, sans-serif">long context takes longer to process</text>

  <rect x="875.714285714286" y="95.769230769231" width="364.285714285714" height="446.153846153846" rx="6.559114118688" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1057.857142857143" y="140.384615384615" text-anchor="middle" font-size="24.050085101858" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">accuracy</text>
  <rect x="929.285714285714" y="229.615384615385" width="75" height="267.692307692308" rx="6.559114118688" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="1020.357142857143" y="330" width="75" height="167.307692307692" rx="6.559114118688" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="1111.428571428571" y="408.076923076923" width="75" height="89.230769230769" rx="6.559114118688" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1057.857142857143" y="528.538461538462" text-anchor="middle" font-size="17.490970983169" fill="var(--text-muted)" font-family="Arial, sans-serif">recall drops — lost in the middle</text>

  <text x="640" y="620" text-anchor="middle" font-size="19.677342356065" fill="var(--text-muted)" font-family="Arial, sans-serif">Quality degrades long before the hard token limit is reached</text>
</svg>

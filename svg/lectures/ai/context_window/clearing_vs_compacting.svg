<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="31.228767450859" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Two resets, two different jobs</text>

  <rect x="40" y="83.122676579926" width="530.769230769231" height="86.245353159851" rx="6.69187873947" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="305.384615384615" y="137.026022304833" text-anchor="middle" font-size="28.998141204369" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">clear</text>

  <rect x="40" y="196.31970260223" width="530.769230769231" height="80.855018587361" rx="6.69187873947" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="305.384615384615" y="244.832713754647" text-anchor="middle" font-size="20.07563621841" fill="var(--text)" font-family="Arial, sans-serif">wipes everything — zero tokens left</text>
  <rect x="40" y="293.345724907063" width="530.769230769231" height="80.855018587361" rx="6.69187873947" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="305.384615384615" y="341.85873605948" text-anchor="middle" font-size="20.07563621841" fill="var(--text)" font-family="Arial, sans-serif">use between unrelated tasks</text>
  <rect x="40" y="390.371747211896" width="530.769230769231" height="80.855018587361" rx="6.69187873947" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="305.384615384615" y="438.884758364312" text-anchor="middle" font-size="20.07563621841" fill="var(--text)" font-family="Arial, sans-serif">also cures a poisoned session</text>
  <rect x="40" y="487.397769516729" width="530.769230769231" height="80.855018587361" rx="6.69187873947" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="305.384615384615" y="535.910780669145" text-anchor="middle" font-size="20.07563621841" fill="var(--text)" font-family="Arial, sans-serif">save the keepers to a file first</text>

  <rect x="709.230769230769" y="83.122676579926" width="530.769230769231" height="86.245353159851" rx="6.69187873947" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="974.615384615385" y="137.026022304833" text-anchor="middle" font-size="28.998141204369" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">compact</text>

  <rect x="709.230769230769" y="196.31970260223" width="530.769230769231" height="80.855018587361" rx="6.69187873947" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="974.615384615385" y="244.832713754647" text-anchor="middle" font-size="20.07563621841" fill="var(--text)" font-family="Arial, sans-serif">keeps a summary plus recent turns</text>
  <rect x="709.230769230769" y="293.345724907063" width="530.769230769231" height="80.855018587361" rx="6.69187873947" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="974.615384615385" y="341.85873605948" text-anchor="middle" font-size="20.07563621841" fill="var(--text)" font-family="Arial, sans-serif">use mid-task — the work continues</text>
  <rect x="709.230769230769" y="390.371747211896" width="530.769230769231" height="80.855018587361" rx="6.69187873947" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="974.615384615385" y="438.884758364312" text-anchor="middle" font-size="20.07563621841" fill="var(--text)" font-family="Arial, sans-serif">often automatic, near the limit</text>
  <rect x="709.230769230769" y="487.397769516729" width="530.769230769231" height="80.855018587361" rx="6.69187873947" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="974.615384615385" y="535.910780669145" text-anchor="middle" font-size="20.07563621841" fill="var(--text)" font-family="Arial, sans-serif">lossy — re-read files for detail</text>

  <text x="640" y="620" text-anchor="middle" font-size="20.07563621841" fill="var(--text-muted)" font-family="Arial, sans-serif">Both beat limping along with a full, rotten window</text>
</svg>

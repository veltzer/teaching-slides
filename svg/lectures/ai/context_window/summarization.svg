<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="30.319058082646" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Fold the old turns into a short summary</text>

  <rect x="40" y="83.77358490566" width="300" height="481.509433962264" rx="6.49694101771" fill="none" stroke="var(--border)" stroke-width="1"/>
  <rect x="61.428571428571" y="105.660377358491" width="257.142857142857" height="43.77358490566" rx="6.49694101771" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="61.428571428571" y="160.377358490566" width="257.142857142857" height="43.77358490566" rx="6.49694101771" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="61.428571428571" y="215.094339622641" width="257.142857142857" height="43.77358490566" rx="6.49694101771" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="61.428571428571" y="269.811320754717" width="257.142857142857" height="43.77358490566" rx="6.49694101771" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="61.428571428571" y="324.528301886792" width="257.142857142857" height="43.77358490566" rx="6.49694101771" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="61.428571428571" y="379.245283018868" width="257.142857142857" height="43.77358490566" rx="6.49694101771" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="61.428571428571" y="433.962264150943" width="257.142857142857" height="43.77358490566" rx="6.49694101771" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="61.428571428571" y="488.679245283019" width="257.142857142857" height="43.77358490566" rx="6.49694101771" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="603.584905660377" text-anchor="middle" font-size="19.49082305313" fill="var(--text)" font-family="Arial, sans-serif">40K tokens of old turns</text>

  <rect x="490" y="258.867924528302" width="300" height="120.377358490566" rx="6.49694101771" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="311.396226415094" text-anchor="middle" font-size="23.822117064936" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">summarizer</text>
  <text x="640" y="346.415094339623" text-anchor="middle" font-size="19.49082305313" fill="var(--primary-text)" font-family="Arial, sans-serif">(an LLM call)</text>

  <rect x="940" y="149.433962264151" width="300" height="87.547169811321" rx="6.49694101771" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="187.735849056604" text-anchor="middle" font-size="19.49082305313" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">800-token summary</text>
  <text x="1090" y="217.283018867925" text-anchor="middle" font-size="17.325176047226" fill="var(--ok-text)" font-family="Arial, sans-serif">decisions, state, constraints</text>

  <rect x="940" y="291.698113207547" width="300" height="218.867924528302" rx="6.49694101771" fill="none" stroke="var(--border)" stroke-width="1"/>
  <rect x="961.428571428571" y="313.584905660377" width="257.142857142857" height="43.77358490566" rx="6.49694101771" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="961.428571428571" y="373.77358490566" width="257.142857142857" height="43.77358490566" rx="6.49694101771" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="961.428571428571" y="433.962264150943" width="257.142857142857" height="43.77358490566" rx="6.49694101771" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="548.867924528302" text-anchor="middle" font-size="19.49082305313" fill="var(--text)" font-family="Arial, sans-serif">recent turns kept verbatim</text>

  <line x1="345.357142857143" y1="319.056603773585" x2="484.642857142857" y2="319.056603773585" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="795.357142857143" y1="291.698113207547" x2="934.642857142857" y2="209.622641509434" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <text x="640" y="620" text-anchor="middle" font-size="19.49082305313" fill="var(--text-muted)" font-family="Arial, sans-serif">Decisions, state, and constraints survive — the chatter does not</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="29.89891225661" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Compaction fires as the window nears full</text>

  <rect x="40" y="93.211009174312" width="1200" height="63.853211009174" rx="6.406909769273" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="93.211009174312" width="1017.857142857143" height="63.853211009174" rx="6.406909769273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="1122.142857142857" y1="77.247706422018" x2="1122.142857142857" y2="173.02752293578" stroke="var(--danger-border)" stroke-width="3" stroke-dasharray="6,5"/>
  <text x="1122.142857142857" y="204.954128440367" text-anchor="middle" font-size="17.085092718063" fill="var(--danger-accent)" font-family="Arial, sans-serif">threshold</text>
  <text x="554.285714285714" y="133.651376146789" text-anchor="middle" font-size="19.22072930782" fill="var(--warn-text)" font-family="Arial, sans-serif">window usage</text>

  <text x="115" y="290.091743119266" text-anchor="end" font-size="19.22072930782" fill="var(--text)" font-family="Arial, sans-serif">before</text>
  <rect x="147.142857142857" y="252.844036697248" width="117.857142857143" height="63.853211009174" rx="6.406909769273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="275.714285714286" y="252.844036697248" width="117.857142857143" height="63.853211009174" rx="6.406909769273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="404.285714285714" y="252.844036697248" width="117.857142857143" height="63.853211009174" rx="6.406909769273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="532.857142857143" y="252.844036697248" width="117.857142857143" height="63.853211009174" rx="6.406909769273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="661.428571428571" y="252.844036697248" width="117.857142857143" height="63.853211009174" rx="6.406909769273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="790" y="252.844036697248" width="139.285714285714" height="63.853211009174" rx="6.406909769273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="252.844036697248" width="139.285714285714" height="63.853211009174" rx="6.406909769273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1090" y="252.844036697248" width="139.285714285714" height="63.853211009174" rx="6.406909769273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="463.214285714286" y="353.94495412844" text-anchor="middle" font-size="17.085092718063" fill="var(--text-muted)" font-family="Arial, sans-serif">old turns</text>
  <text x="1009.642857142857" y="353.94495412844" text-anchor="middle" font-size="17.085092718063" fill="var(--text-muted)" font-family="Arial, sans-serif">recent turns</text>

  <line x1="640" y1="375.229357798165" x2="640" y2="439.082568807339" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="115" y="502.935779816514" text-anchor="end" font-size="19.22072930782" fill="var(--text)" font-family="Arial, sans-serif">after</text>
  <rect x="147.142857142857" y="465.688073394495" width="235.714285714286" height="63.853211009174" rx="6.406909769273" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="265" y="505.064220183486" text-anchor="middle" font-size="19.22072930782" fill="var(--info-text)" font-family="Arial, sans-serif">summary</text>
  <rect x="790" y="465.688073394495" width="139.285714285714" height="63.853211009174" rx="6.406909769273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="465.688073394495" width="139.285714285714" height="63.853211009174" rx="6.406909769273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1090" y="465.688073394495" width="139.285714285714" height="63.853211009174" rx="6.406909769273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1009.642857142857" y="566.788990825688" text-anchor="middle" font-size="17.085092718063" fill="var(--text-muted)" font-family="Arial, sans-serif">recent turns kept</text>

  <text x="640" y="620" text-anchor="middle" font-size="19.22072930782" fill="var(--text-muted)" font-family="Arial, sans-serif">The agent keeps working straight through the boundary</text>
</svg>

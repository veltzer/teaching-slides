<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="32.831023532548" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Three ways context management goes wrong</text>

  <rect x="40" y="116.991150442478" width="364.285714285714" height="410.619469026549" rx="7.035219328403" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.142857142857" y="187.566371681416" text-anchor="middle" font-size="25.795804204144" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">hoarding</text>
  <text x="222.142857142857" y="270.973451327434" text-anchor="middle" font-size="19.933121430475" fill="var(--danger-text)" font-family="Arial, sans-serif">"keep it all, just in case"</text>
  <text x="222.142857142857" y="335.132743362832" text-anchor="middle" font-size="19.933121430475" fill="var(--danger-text)" font-family="Arial, sans-serif">cost up, attention down,</text>
  <text x="222.142857142857" y="371.061946902655" text-anchor="middle" font-size="19.933121430475" fill="var(--danger-text)" font-family="Arial, sans-serif">answers get worse</text>
  <text x="222.142857142857" y="585.353982300885" text-anchor="middle" font-size="19.933121430475" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">fix: curate — re-fetch</text>
  <text x="222.142857142857" y="620" text-anchor="middle" font-size="19.933121430475" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">beats carrying dead weight</text>

  <rect x="457.857142857143" y="116.991150442478" width="364.285714285714" height="410.619469026549" rx="7.035219328403" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="187.566371681416" text-anchor="middle" font-size="25.795804204144" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">lost constraint</text>
  <text x="640" y="270.973451327434" text-anchor="middle" font-size="19.933121430475" fill="var(--danger-text)" font-family="Arial, sans-serif">a key rule lived in one turn</text>
  <text x="640" y="335.132743362832" text-anchor="middle" font-size="19.933121430475" fill="var(--danger-text)" font-family="Arial, sans-serif">compaction dropped it —</text>
  <text x="640" y="371.061946902655" text-anchor="middle" font-size="19.933121430475" fill="var(--danger-text)" font-family="Arial, sans-serif">the agent now violates it</text>
  <text x="640" y="585.353982300885" text-anchor="middle" font-size="19.933121430475" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">fix: hard constraints go in</text>
  <text x="640" y="620" text-anchor="middle" font-size="19.933121430475" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">files or the system prompt</text>

  <rect x="875.714285714286" y="116.991150442478" width="364.285714285714" height="410.619469026549" rx="7.035219328403" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.857142857143" y="187.566371681416" text-anchor="middle" font-size="25.795804204144" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">false memory</text>
  <text x="1057.857142857143" y="270.973451327434" text-anchor="middle" font-size="19.933121430475" fill="var(--danger-text)" font-family="Arial, sans-serif">"I told it yesterday"</text>
  <text x="1057.857142857143" y="335.132743362832" text-anchor="middle" font-size="19.933121430475" fill="var(--danger-text)" font-family="Arial, sans-serif">yesterday's window is gone;</text>
  <text x="1057.857142857143" y="371.061946902655" text-anchor="middle" font-size="19.933121430475" fill="var(--danger-text)" font-family="Arial, sans-serif">new sessions start empty</text>
  <text x="1057.857142857143" y="585.353982300885" text-anchor="middle" font-size="19.933121430475" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">fix: durable knowledge lives</text>
  <text x="1057.857142857143" y="620" text-anchor="middle" font-size="19.933121430475" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">in files and instructions</text>
</svg>

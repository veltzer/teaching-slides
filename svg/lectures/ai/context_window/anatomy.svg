<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="31.215380824203" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Where the tokens actually go</text>

  <rect x="40" y="144.4" width="182.142857142857" height="139.2" rx="6.689010176615" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="222.142857142857" y="144.4" width="246.428571428571" height="139.2" rx="6.689010176615" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="468.571428571428" y="144.4" width="353.571428571429" height="139.2" rx="6.689010176615" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="822.142857142857" y="144.4" width="342.857142857143" height="139.2" rx="6.689010176615" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1165" y="144.4" width="75" height="139.2" rx="6.689010176615" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>

  <line x1="131.071428571429" y1="289.4" x2="131.071428571429" y2="359" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="131.071428571429" y="399.6" text-anchor="middle" font-size="20.067030529845" fill="var(--text)" font-family="Arial, sans-serif">system</text>
  <text x="131.071428571429" y="428.6" text-anchor="middle" font-size="20.067030529845" fill="var(--text)" font-family="Arial, sans-serif">prompt</text>

  <line x1="345.357142857143" y1="289.4" x2="345.357142857143" y2="451.8" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345.357142857143" y="492.4" text-anchor="middle" font-size="20.067030529845" fill="var(--text)" font-family="Arial, sans-serif">tool</text>
  <text x="345.357142857143" y="521.4" text-anchor="middle" font-size="20.067030529845" fill="var(--text)" font-family="Arial, sans-serif">schemas</text>

  <line x1="645.357142857143" y1="289.4" x2="645.357142857143" y2="359" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="645.357142857143" y="399.6" text-anchor="middle" font-size="20.067030529845" fill="var(--text)" font-family="Arial, sans-serif">conversation</text>
  <text x="645.357142857143" y="428.6" text-anchor="middle" font-size="20.067030529845" fill="var(--text)" font-family="Arial, sans-serif">history</text>

  <line x1="993.571428571429" y1="289.4" x2="993.571428571429" y2="451.8" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="993.571428571429" y="492.4" text-anchor="middle" font-size="20.067030529845" fill="var(--text)" font-family="Arial, sans-serif">files read,</text>
  <text x="993.571428571429" y="521.4" text-anchor="middle" font-size="20.067030529845" fill="var(--text)" font-family="Arial, sans-serif">tool results</text>

  <line x1="1202.5" y1="289.4" x2="1202.5" y2="359" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="1202.5" y="399.6" text-anchor="middle" font-size="20.067030529845" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">your</text>
  <text x="1202.5" y="428.6" text-anchor="middle" font-size="20.067030529845" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">question</text>

  <text x="640" y="620" text-anchor="middle" font-size="20.067030529845" fill="var(--text-muted)" font-family="Arial, sans-serif">The question you typed is often the smallest part of the window</text>
</svg>

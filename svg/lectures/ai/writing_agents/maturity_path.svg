<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="50.357142857143" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Each step must earn the next — do not skip</text>

  <rect x="40" y="516.428571428572" width="230" height="103.571428571429" rx="6.106202935189" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="155" y="559.928571428572" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Single call</text>
  <text x="155" y="591" text-anchor="middle" font-size="15.265507337973" fill="var(--text-muted)" font-family="Arial, sans-serif">one good prompt</text>

  <rect x="280" y="397.321428571429" width="230" height="103.571428571429" rx="6.106202935189" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="440.821428571429" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Workflow</text>
  <text x="395" y="471.892857142857" text-anchor="middle" font-size="15.265507337973" fill="var(--info-text)" font-family="Arial, sans-serif">a fixed graph of calls</text>

  <rect x="520" y="278.214285714286" width="230" height="103.571428571429" rx="6.106202935189" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635" y="321.714285714286" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Agent + tools</text>
  <text x="635" y="352.785714285714" text-anchor="middle" font-size="15.265507337973" fill="var(--primary-text)" font-family="Arial, sans-serif">the loop, with budgets</text>

  <rect x="760" y="159.107142857143" width="230" height="103.571428571429" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="875" y="202.607142857143" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Evals + tracing</text>
  <text x="875" y="233.678571428571" text-anchor="middle" font-size="15.265507337973" fill="var(--warn-text)" font-family="Arial, sans-serif">measured, observable</text>

  <rect x="1000" y="40" width="240" height="103.571428571429" rx="6.106202935189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="83.5" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Multi-agent</text>
  <text x="1120" y="114.571428571429" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">only when one is not enough</text>

  <line x1="155" y1="510.214285714286" x2="270" y2="451.178571428571" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="391.107142857143" x2="510" y2="332.071428571429" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="635" y1="272" x2="750" y2="212.964285714286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="875" y1="152.892857142857" x2="990" y2="93.857142857143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="290" y="133.214285714286" text-anchor="start" font-size="17.30090831637" fill="var(--text-muted)" font-family="Arial, sans-serif">complexity is a cost you pay,</text>
  <text x="290" y="166.357142857143" text-anchor="start" font-size="17.30090831637" fill="var(--text-muted)" font-family="Arial, sans-serif">not a badge you collect</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="345.762711864407" height="146.306306306306" rx="6.185408331337" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.881355932203" y="97.477477477477" text-anchor="middle" font-size="21.648929159681" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Eval set</text>
  <text x="212.881355932203" y="139.279279279279" text-anchor="middle" font-size="16.4944222169" fill="var(--primary-text)" font-family="Arial, sans-serif">real tasks + success criteria</text>

  <rect x="894.237288135593" y="40" width="345.762711864407" height="146.306306306306" rx="6.185408331337" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1067.118644067797" y="97.477477477477" text-anchor="middle" font-size="21.648929159681" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Run</text>
  <text x="1067.118644067797" y="139.279279279279" text-anchor="middle" font-size="16.4944222169" fill="var(--info-text)" font-family="Arial, sans-serif">the agent on every case</text>

  <rect x="894.237288135593" y="437.117117117117" width="345.762711864407" height="146.306306306306" rx="6.185408331337" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1067.118644067797" y="494.594594594595" text-anchor="middle" font-size="21.648929159681" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Grade</text>
  <text x="1067.118644067797" y="536.396396396396" text-anchor="middle" font-size="16.4944222169" fill="var(--warn-text)" font-family="Arial, sans-serif">exact checks, rubrics, judges</text>

  <rect x="40" y="437.117117117117" width="345.762711864407" height="146.306306306306" rx="6.185408331337" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="212.881355932203" y="494.594594594595" text-anchor="middle" font-size="21.648929159681" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Analyze</text>
  <text x="212.881355932203" y="536.396396396396" text-anchor="middle" font-size="16.4944222169" fill="var(--info-text)" font-family="Arial, sans-serif">read transcripts, find patterns</text>

  <rect x="477.28813559322" y="238.558558558559" width="345.762711864407" height="146.306306306306" rx="6.185408331337" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.169491525424" y="296.036036036036" text-anchor="middle" font-size="21.648929159681" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Improve</text>
  <text x="650.169491525424" y="337.837837837838" text-anchor="middle" font-size="16.4944222169" fill="var(--ok-text)" font-family="Arial, sans-serif">prompts, tools, harness</text>

  <line x1="390.847457627119" y1="113.153153153153" x2="887.118644067797" y2="113.153153153153" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="1067.118644067797" y1="191.531531531532" x2="1067.118644067797" y2="429.801801801802" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="887.118644067797" y1="510.27027027027" x2="392.881355932203" y2="510.27027027027" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="334.915254237288" y1="431.891891891892" x2="538.305084745763" y2="390.09009009009" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="538.305084745763" y1="233.333333333333" x2="334.915254237288" y2="191.531531531532" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <text x="406.101694915254" y="290" text-anchor="middle" font-size="15.463520828343" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">every failure</text>
  <text x="406.101694915254" y="318" text-anchor="middle" font-size="15.463520828343" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">becomes a case</text>

  <text x="650.169491525424" y="620" text-anchor="middle" font-size="17.525323605456" fill="var(--text-muted)" font-family="Arial, sans-serif">one run tells you almost nothing — distributions tell the truth</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="114.042553191489" width="340" height="271.489361702128" rx="6.66524807602" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="181.914893617021" text-anchor="middle" font-size="24.439242945408" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">The demo</text>
  <text x="210" y="237.446808510638" text-anchor="middle" font-size="17.773994869388" fill="var(--ok-text)" font-family="Arial, sans-serif">one happy path</text>
  <text x="210" y="280.63829787234" text-anchor="middle" font-size="17.773994869388" fill="var(--ok-text)" font-family="Arial, sans-serif">you are watching</text>
  <text x="210" y="323.829787234043" text-anchor="middle" font-size="17.773994869388" fill="var(--ok-text)" font-family="Arial, sans-serif">nothing at stake</text>

  <rect x="860" y="40" width="380" height="419.574468085106" rx="6.66524807602" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="107.872340425532" text-anchor="middle" font-size="24.439242945408" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Production</text>
  <text x="1050" y="169.574468085106" text-anchor="middle" font-size="17.773994869388" fill="var(--primary-text)" font-family="Arial, sans-serif">budgets, retries, checkpoints</text>
  <text x="1050" y="215.234042553192" text-anchor="middle" font-size="17.773994869388" fill="var(--primary-text)" font-family="Arial, sans-serif">sandboxing and approvals</text>
  <text x="1050" y="260.893617021277" text-anchor="middle" font-size="17.773994869388" fill="var(--primary-text)" font-family="Arial, sans-serif">tracing and evals</text>
  <text x="1050" y="306.553191489362" text-anchor="middle" font-size="17.773994869388" fill="var(--primary-text)" font-family="Arial, sans-serif">versioning and rollback</text>
  <text x="1050" y="352.212765957447" text-anchor="middle" font-size="17.773994869388" fill="var(--primary-text)" font-family="Arial, sans-serif">queues and rate limits</text>
  <text x="1050" y="397.872340425532" text-anchor="middle" font-size="17.773994869388" fill="var(--primary-text)" font-family="Arial, sans-serif">dashboards and alerts</text>

  <line x1="385" y1="249.787234042553" x2="853" y2="249.787234042553" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="206.595744680851" text-anchor="middle" font-size="19.995744228061" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">harness work</text>

  <line x1="40" y1="533.617021276596" x2="500" y2="533.617021276596" stroke="var(--text-muted)" stroke-width="3"/>
  <line x1="780" y1="533.617021276596" x2="1240" y2="533.617021276596" stroke="var(--text-muted)" stroke-width="3"/>
  <text x="640" y="545.957446808511" text-anchor="middle" font-size="18.884869548724" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">the gap</text>
  <text x="640" y="620" text-anchor="middle" font-size="18.884869548724" fill="var(--text-muted)" font-family="Arial, sans-serif">most agents fall here — the model is the same on both sides</text>
</svg>

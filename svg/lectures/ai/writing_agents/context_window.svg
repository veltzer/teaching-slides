<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="19.876030885808" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">One window — everything competes for it</text>
  <line x1="40" y1="78.301886792453" x2="1230" y2="78.301886792453" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="138.490566037736" width="190" height="153.207547169811" rx="6.27664133236" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="204.150943396226" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">System</text>
  <text x="135" y="234.792452830189" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">prompt</text>

  <rect x="230" y="138.490566037736" width="230" height="153.207547169811" rx="6.27664133236" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="345" y="204.150943396226" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Tool</text>
  <text x="345" y="234.792452830189" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">definitions</text>

  <rect x="460" y="138.490566037736" width="360" height="153.207547169811" rx="6.27664133236" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="204.150943396226" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Conversation</text>
  <text x="640" y="234.792452830189" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">history</text>

  <rect x="820" y="138.490566037736" width="420" height="153.207547169811" rx="6.27664133236" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="204.150943396226" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Tool results</text>
  <text x="1030" y="234.792452830189" text-anchor="middle" font-size="18.829923997081" fill="var(--danger-text)" font-family="Arial, sans-serif">biggest and noisiest</text>

  <line x1="40" y1="340.943396226415" x2="40" y2="362.830188679245" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="40" y1="362.830188679245" x2="460" y2="362.830188679245" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="460" y1="340.943396226415" x2="460" y2="362.830188679245" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="250" y="401.132075471698" text-anchor="middle" font-size="17.783817108354" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">fixed every call — cache it</text>

  <line x1="480" y1="340.943396226415" x2="480" y2="362.830188679245" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="480" y1="362.830188679245" x2="1240" y2="362.830188679245" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1240" y1="340.943396226415" x2="1240" y2="362.830188679245" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="860" y="401.132075471698" text-anchor="middle" font-size="17.783817108354" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">grows every turn — compact it</text>

  <rect x="40" y="466.792452830189" width="1200" height="153.207547169811" rx="6.27664133236" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="526.981132075472" text-anchor="middle" font-size="19.876030885808" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Every token here is re-sent on every call in the loop</text>
  <text x="640" y="571.849056603774" text-anchor="middle" font-size="17.783817108354" fill="var(--text-muted)" font-family="Arial, sans-serif">irrelevant context does not just cost money — it degrades decisions</text>
</svg>

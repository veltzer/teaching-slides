<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="360" height="232" rx="6.16146381663" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="92.727272727273" text-anchor="middle" font-size="24.645855266519" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Chatbot</text>
  <text x="220" y="140.181818181818" text-anchor="middle" font-size="17.457480813784" fill="var(--info-text)" font-family="Arial, sans-serif">Talks, answers questions</text>
  <text x="220" y="179.2" text-anchor="middle" font-size="17.457480813784" fill="var(--info-text)" font-family="Arial, sans-serif">No tools, no actions</text>
  <text x="220" y="218.218181818182" text-anchor="middle" font-size="17.457480813784" fill="var(--info-text)" font-family="Arial, sans-serif">The human drives every step</text>

  <rect x="460" y="40" width="360" height="232" rx="6.16146381663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="92.727272727273" text-anchor="middle" font-size="24.645855266519" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Workflow</text>
  <text x="640" y="140.181818181818" text-anchor="middle" font-size="17.457480813784" fill="var(--primary-text)" font-family="Arial, sans-serif">Model calls in a fixed graph</text>
  <text x="640" y="179.2" text-anchor="middle" font-size="17.457480813784" fill="var(--primary-text)" font-family="Arial, sans-serif">You chose the path in advance</text>
  <text x="640" y="218.218181818182" text-anchor="middle" font-size="17.457480813784" fill="var(--primary-text)" font-family="Arial, sans-serif">Predictable, testable, rigid</text>

  <rect x="880" y="40" width="360" height="232" rx="6.16146381663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="92.727272727273" text-anchor="middle" font-size="24.645855266519" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Agent</text>
  <text x="1060" y="140.181818181818" text-anchor="middle" font-size="17.457480813784" fill="var(--ok-text)" font-family="Arial, sans-serif">A loop with tools</text>
  <text x="1060" y="179.2" text-anchor="middle" font-size="17.457480813784" fill="var(--ok-text)" font-family="Arial, sans-serif">The model chooses the path</text>
  <text x="1060" y="218.218181818182" text-anchor="middle" font-size="17.457480813784" fill="var(--ok-text)" font-family="Arial, sans-serif">The goal decides the stop</text>

  <line x1="405" y1="156" x2="450" y2="156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="156" x2="870" y2="156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="220" y="335.272727272727" text-anchor="middle" font-size="19.511302085994" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">reactive</text>
  <text x="640" y="335.272727272727" text-anchor="middle" font-size="19.511302085994" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">scripted</text>
  <text x="1060" y="335.272727272727" text-anchor="middle" font-size="19.511302085994" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">autonomous</text>

  <rect x="40" y="398.545454545455" width="1200" height="137.090909090909" rx="6.16146381663" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="453.381818181818" text-anchor="middle" font-size="19.511302085994" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Same model underneath — what changes is who chooses the next step</text>
  <text x="640" y="496.618181818182" text-anchor="middle" font-size="17.457480813784" fill="var(--text-muted)" font-family="Arial, sans-serif">chatbot: the user decides — workflow: the author decided — agent: the model decides</text>

  <text x="640" y="593.636363636364" text-anchor="middle" font-size="17.457480813784" fill="var(--text-faint)" font-family="Arial, sans-serif">autonomy and flexibility grow</text>
  <line x1="40" y1="620" x2="1230" y2="620" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
</svg>

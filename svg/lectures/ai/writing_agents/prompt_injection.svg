<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="250" height="167.307692307692" rx="6.336706254344" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="101.346153846154" text-anchor="middle" font-size="21.122354181148" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Attacker</text>
  <text x="165" y="142.615384615385" text-anchor="middle" font-size="15.841765635861" fill="var(--danger-text)" font-family="Arial, sans-serif">plants instructions</text>
  <text x="165" y="173.846153846154" text-anchor="middle" font-size="15.841765635861" fill="var(--danger-text)" font-family="Arial, sans-serif">inside content</text>

  <rect x="360" y="40" width="280" height="167.307692307692" rx="6.336706254344" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="101.346153846154" text-anchor="middle" font-size="21.122354181148" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Fetched content</text>
  <text x="500" y="142.615384615385" text-anchor="middle" font-size="15.841765635861" fill="var(--warn-text)" font-family="Arial, sans-serif">looks like data,</text>
  <text x="500" y="173.846153846154" text-anchor="middle" font-size="15.841765635861" fill="var(--warn-text)" font-family="Arial, sans-serif">carries orders</text>

  <rect x="710" y="40" width="250" height="167.307692307692" rx="6.336706254344" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="835" y="101.346153846154" text-anchor="middle" font-size="21.122354181148" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Agent</text>
  <text x="835" y="142.615384615385" text-anchor="middle" font-size="15.841765635861" fill="var(--primary-text)" font-family="Arial, sans-serif">reads it as part</text>
  <text x="835" y="173.846153846154" text-anchor="middle" font-size="15.841765635861" fill="var(--primary-text)" font-family="Arial, sans-serif">of its context</text>

  <rect x="1030" y="40" width="210" height="167.307692307692" rx="6.336706254344" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="106.923076923077" text-anchor="middle" font-size="17.954001053976" font-weight="bold" fill="var(--danger-text)" font-family="Courier New, monospace">send_secrets()</text>
  <text x="1135" y="151.538461538462" text-anchor="middle" font-size="15.841765635861" fill="var(--danger-text)" font-family="Arial, sans-serif">attempted call</text>

  <line x1="295" y1="123.653846153846" x2="353" y2="123.653846153846" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="645" y1="123.653846153846" x2="703" y2="123.653846153846" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="965" y1="123.653846153846" x2="1023" y2="123.653846153846" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <rect x="680" y="385.769230769231" width="560" height="167.307692307692" rx="6.336706254344" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="443.769230769231" text-anchor="middle" font-size="21.122354181148" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">The harness gate</text>
  <text x="960" y="486.153846153846" text-anchor="middle" font-size="15.841765635861" fill="var(--ok-text)" font-family="Arial, sans-serif">dangerous tools sit behind approval —</text>
  <text x="960" y="517.384615384615" text-anchor="middle" font-size="15.841765635861" fill="var(--ok-text)" font-family="Arial, sans-serif">injected text never reaches them</text>

  <line x1="1135" y1="212.884615384615" x2="1000" y2="377.961538461538" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="1110" y="307.692307692308" text-anchor="start" font-size="16.897883344918" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">blocked</text>

  <rect x="40" y="385.769230769231" width="560" height="167.307692307692" rx="6.336706254344" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="320" y="452.692307692308" text-anchor="middle" font-size="19.010118763033" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Treat fetched text as data,</text>
  <text x="320" y="491.730769230769" text-anchor="middle" font-size="19.010118763033" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">never as instructions</text>

  <text x="640" y="620" text-anchor="middle" font-size="16.897883344918" fill="var(--text-faint)" font-family="Arial, sans-serif">assume some injection gets through — that is what least privilege is for</text>
</svg>

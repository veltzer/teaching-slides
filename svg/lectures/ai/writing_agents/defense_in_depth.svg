<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="185" width="220" height="227.857142857143" rx="6.106202935189" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="273.035714285714" text-anchor="middle" font-size="20.354009783964" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Hostile input</text>
  <text x="150" y="314.464285714286" text-anchor="middle" font-size="15.265507337973" fill="var(--danger-text)" font-family="Arial, sans-serif">web pages, files,</text>
  <text x="150" y="342.428571428571" text-anchor="middle" font-size="15.265507337973" fill="var(--danger-text)" font-family="Arial, sans-serif">tickets, mail</text>

  <rect x="330" y="71.071428571429" width="150" height="455.714285714286" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="405" y="278.214285714286" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Validate</text>
  <text x="405" y="309.285714285714" text-anchor="middle" font-size="14.247806848775" fill="var(--warn-text)" font-family="Arial, sans-serif">every call</text>

  <rect x="510" y="71.071428571429" width="150" height="455.714285714286" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="585" y="262.678571428571" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Least</text>
  <text x="585" y="291.678571428571" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">privilege</text>
  <text x="585" y="322.75" text-anchor="middle" font-size="14.247806848775" fill="var(--warn-text)" font-family="Arial, sans-serif">minimal keys</text>

  <rect x="690" y="71.071428571429" width="150" height="455.714285714286" rx="6.106202935189" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="278.214285714286" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Sandbox</text>
  <text x="765" y="309.285714285714" text-anchor="middle" font-size="14.247806848775" fill="var(--info-text)" font-family="Arial, sans-serif">contained blast</text>

  <rect x="870" y="71.071428571429" width="150" height="455.714285714286" rx="6.106202935189" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="262.678571428571" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Human</text>
  <text x="945" y="291.678571428571" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">approval</text>
  <text x="945" y="322.75" text-anchor="middle" font-size="14.247806848775" fill="var(--primary-text)" font-family="Arial, sans-serif">for big buttons</text>

  <rect x="1090" y="185" width="150" height="227.857142857143" rx="6.106202935189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1165" y="278.214285714286" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Your</text>
  <text x="1165" y="307.214285714286" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">systems</text>

  <line x1="265" y1="298.928571428571" x2="1083" y2="298.928571428571" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="557.857142857143" width="1200" height="62.142857142857" rx="6.106202935189" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="597.214285714286" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">No single layer is trusted — assume each one leaks a little</text>

  <text x="640" y="40" text-anchor="middle" font-size="18.318608805568" fill="var(--text-muted)" font-family="Arial, sans-serif">every action crosses every layer</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="460" y="40" width="360" height="147.636363636364" rx="6.16146381663" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="101.163636363636" text-anchor="middle" font-size="24.645855266519" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Thought</text>
  <text x="640" y="145.454545454545" text-anchor="middle" font-size="16.430570177679" fill="var(--info-text)" font-family="Arial, sans-serif">reason about the state, pick a step</text>

  <rect x="860" y="377.454545454545" width="380" height="158.181818181818" rx="6.16146381663" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="443.890909090909" text-anchor="middle" font-size="24.645855266519" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Action</text>
  <text x="1050" y="488.181818181818" text-anchor="middle" font-size="16.430570177679" fill="var(--warn-text)" font-family="Arial, sans-serif">call a tool with arguments</text>

  <rect x="40" y="377.454545454545" width="380" height="158.181818181818" rx="6.16146381663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="443.890909090909" text-anchor="middle" font-size="24.645855266519" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Observation</text>
  <text x="230" y="488.181818181818" text-anchor="middle" font-size="16.430570177679" fill="var(--ok-text)" font-family="Arial, sans-serif">read the result — new facts</text>

  <line x1="790" y1="192.909090909091" x2="1000" y2="369.018181818182" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="853" y1="456.545454545455" x2="428" y2="456.545454545455" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="280" y1="369.018181818182" x2="490" y2="192.909090909091" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>

  <text x="940" y="266.727272727273" text-anchor="start" font-size="16.430570177679" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">act</text>
  <text x="640" y="435.454545454545" text-anchor="middle" font-size="16.430570177679" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">observe</text>
  <text x="290" y="266.727272727273" text-anchor="end" font-size="16.430570177679" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">think again</text>

  <text x="640" y="620" text-anchor="middle" font-size="18.484391449889" fill="var(--text-muted)" font-family="Arial, sans-serif">thinking before every action — the transcript becomes your best debugging record</text>
</svg>

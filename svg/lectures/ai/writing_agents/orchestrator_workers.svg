<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="440" y="40" width="400" height="140" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="97" text-anchor="middle" font-size="23" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Orchestrator</text>
  <text x="640" y="138" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">owns the plan — writes briefs, merges results</text>

  <rect x="40" y="330" width="360" height="170" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="385" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Worker: research</text>
  <text x="220" y="425" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">fresh context, own tools</text>
  <text x="220" y="458" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">returns only the answer</text>

  <rect x="460" y="330" width="360" height="170" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="385" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Worker: code</text>
  <text x="640" y="425" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">isolated workspace</text>
  <text x="640" y="458" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">returns only the diff</text>

  <rect x="880" y="330" width="360" height="170" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="385" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Worker: review</text>
  <text x="1060" y="425" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">adversarial by design</text>
  <text x="1060" y="458" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">returns only the verdict</text>

  <line x1="500" y1="185" x2="250" y2="323" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="610" y1="185" x2="610" y2="323" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="780" y1="185" x2="1030" y2="323" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <line x1="290" y1="323" x2="540" y2="185" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="670" y1="323" x2="670" y2="185" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="1070" y1="323" x2="820" y2="185" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <text x="330" y="240" text-anchor="end" font-size="16" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">brief</text>
  <text x="950" y="240" text-anchor="start" font-size="16" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">result</text>

  <rect x="40" y="550" width="1200" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="593" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Briefs are contracts — a vague brief fails in parallel</text>
</svg>

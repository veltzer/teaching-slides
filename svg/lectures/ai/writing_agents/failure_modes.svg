<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="280" height="165.714285714286" rx="6.106202935189" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="180" y="96.964285714286" text-anchor="middle" font-size="21.371710273163" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Transient</text>
  <text x="180" y="138.392857142857" text-anchor="middle" font-size="15.265507337973" fill="var(--danger-text)" font-family="Arial, sans-serif">rate limit, timeout,</text>
  <text x="180" y="167.392857142857" text-anchor="middle" font-size="15.265507337973" fill="var(--danger-text)" font-family="Arial, sans-serif">provider outage</text>

  <rect x="347" y="40" width="280" height="165.714285714286" rx="6.106202935189" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="487" y="96.964285714286" text-anchor="middle" font-size="21.371710273163" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Tool error</text>
  <text x="487" y="138.392857142857" text-anchor="middle" font-size="15.265507337973" fill="var(--danger-text)" font-family="Arial, sans-serif">bad arguments,</text>
  <text x="487" y="167.392857142857" text-anchor="middle" font-size="15.265507337973" fill="var(--danger-text)" font-family="Arial, sans-serif">missing file</text>

  <rect x="654" y="40" width="280" height="165.714285714286" rx="6.106202935189" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="794" y="96.964285714286" text-anchor="middle" font-size="21.371710273163" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Reasoning</text>
  <text x="794" y="138.392857142857" text-anchor="middle" font-size="15.265507337973" fill="var(--danger-text)" font-family="Arial, sans-serif">wrong conclusion,</text>
  <text x="794" y="167.392857142857" text-anchor="middle" font-size="15.265507337973" fill="var(--danger-text)" font-family="Arial, sans-serif">repeating itself</text>

  <rect x="960" y="40" width="280" height="165.714285714286" rx="6.106202935189" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1100" y="96.964285714286" text-anchor="middle" font-size="21.371710273163" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Impossible</text>
  <text x="1100" y="138.392857142857" text-anchor="middle" font-size="15.265507337973" fill="var(--danger-text)" font-family="Arial, sans-serif">underspecified,</text>
  <text x="1100" y="167.392857142857" text-anchor="middle" font-size="15.265507337973" fill="var(--danger-text)" font-family="Arial, sans-serif">cannot be done</text>

  <line x1="180" y1="210.892857142857" x2="180" y2="312.392857142857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="487" y1="210.892857142857" x2="487" y2="312.392857142857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="794" y1="210.892857142857" x2="794" y2="312.392857142857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1100" y1="210.892857142857" x2="1100" y2="312.392857142857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="319.642857142857" width="280" height="165.714285714286" rx="6.106202935189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="180" y="376.607142857143" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Retry, backoff</text>
  <text x="180" y="418.035714285714" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">capped attempts,</text>
  <text x="180" y="447.035714285714" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">jitter, then fail loudly</text>

  <rect x="347" y="319.642857142857" width="280" height="165.714285714286" rx="6.106202935189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="487" y="376.607142857143" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Fix and re-call</text>
  <text x="487" y="418.035714285714" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">the error text</text>
  <text x="487" y="447.035714285714" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">guides the model</text>

  <rect x="654" y="319.642857142857" width="280" height="165.714285714286" rx="6.106202935189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="794" y="376.607142857143" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Reflect, change</text>
  <text x="794" y="418.035714285714" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">nudge after repeats,</text>
  <text x="794" y="447.035714285714" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">new approach</text>

  <rect x="960" y="319.642857142857" width="280" height="165.714285714286" rx="6.106202935189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1100" y="376.607142857143" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Stop and report</text>
  <text x="1100" y="418.035714285714" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">a good summary</text>
  <text x="1100" y="447.035714285714" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">is a success</text>

  <rect x="40" y="542.321428571429" width="1200" height="77.678571428571" rx="6.106202935189" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="588.928571428572" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Different failures need different responses — never treat them alike</text>
</svg>

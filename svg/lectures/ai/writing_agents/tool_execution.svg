<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="200" height="177.551020408163" rx="6.527805519312" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="99.183673469388" text-anchor="middle" font-size="21.75935173104" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Model</text>
  <text x="140" y="137.061224489796" text-anchor="middle" font-size="16.31951379828" fill="var(--primary-text)" font-family="Arial, sans-serif">emits a call:</text>
  <text x="140" y="172.571428571429" text-anchor="middle" font-size="16.31951379828" fill="var(--primary-text)" font-family="Arial, sans-serif">name + arguments</text>

  <rect x="290" y="40" width="200" height="177.551020408163" rx="6.527805519312" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="99.183673469388" text-anchor="middle" font-size="21.75935173104" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Validate</text>
  <text x="390" y="137.061224489796" text-anchor="middle" font-size="16.31951379828" fill="var(--warn-text)" font-family="Arial, sans-serif">schema, types,</text>
  <text x="390" y="172.571428571429" text-anchor="middle" font-size="16.31951379828" fill="var(--warn-text)" font-family="Arial, sans-serif">ranges, paths</text>

  <rect x="540" y="40" width="200" height="177.551020408163" rx="6.527805519312" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="99.183673469388" text-anchor="middle" font-size="21.75935173104" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Authorize</text>
  <text x="640" y="137.061224489796" text-anchor="middle" font-size="16.31951379828" fill="var(--danger-text)" font-family="Arial, sans-serif">permissions,</text>
  <text x="640" y="172.571428571429" text-anchor="middle" font-size="16.31951379828" fill="var(--danger-text)" font-family="Arial, sans-serif">approvals, limits</text>

  <rect x="790" y="40" width="200" height="177.551020408163" rx="6.527805519312" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="99.183673469388" text-anchor="middle" font-size="21.75935173104" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Execute</text>
  <text x="890" y="137.061224489796" text-anchor="middle" font-size="16.31951379828" fill="var(--info-text)" font-family="Arial, sans-serif">sandboxed,</text>
  <text x="890" y="172.571428571429" text-anchor="middle" font-size="16.31951379828" fill="var(--info-text)" font-family="Arial, sans-serif">with a timeout</text>

  <rect x="1040" y="40" width="200" height="177.551020408163" rx="6.527805519312" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="99.183673469388" text-anchor="middle" font-size="21.75935173104" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Result</text>
  <text x="1140" y="137.061224489796" text-anchor="middle" font-size="16.31951379828" fill="var(--ok-text)" font-family="Arial, sans-serif">clipped, labeled,</text>
  <text x="1140" y="172.571428571429" text-anchor="middle" font-size="16.31951379828" fill="var(--ok-text)" font-family="Arial, sans-serif">back to the model</text>

  <line x1="245" y1="128.775510204082" x2="283" y2="128.775510204082" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="495" y1="128.775510204082" x2="533" y2="128.775510204082" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="745" y1="128.775510204082" x2="783" y2="128.775510204082" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="995" y1="128.775510204082" x2="1033" y2="128.775510204082" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="395.102040816327" width="700" height="142.040816326531" rx="6.527805519312" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="451.918367346939" text-anchor="middle" font-size="19.583416557936" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Rejected? A clear message goes back instead</text>
  <text x="640" y="496.897959183673" text-anchor="middle" font-size="17.407481384832" fill="var(--text-muted)" font-family="Arial, sans-serif">the model reads the reason and corrects course</text>

  <line x1="390" y1="223.469387755102" x2="470" y2="389.183673469388" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="640" y1="223.469387755102" x2="640" y2="386.816326530612" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="285" y1="466.122448979592" x2="145" y2="227.020408163265" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <text x="640" y="620" text-anchor="middle" font-size="18.495448971384" fill="var(--text-faint)" font-family="Arial, sans-serif">result or rejection — the model always hears back, and the loop continues</text>
</svg>

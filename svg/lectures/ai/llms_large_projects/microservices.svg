<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="80" y="40" width="280" height="145" rx="6.106202935189" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="102.142857142857" text-anchor="middle" font-size="21.371710273163" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">orders service</text>
  <text x="220" y="138.392857142857" text-anchor="middle" font-size="15.265507337973" fill="var(--primary-text)" font-family="Arial, sans-serif">its own repo and team</text>

  <rect x="500" y="40" width="280" height="145" rx="6.106202935189" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="102.142857142857" text-anchor="middle" font-size="21.371710273163" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">billing service</text>
  <text x="640" y="138.392857142857" text-anchor="middle" font-size="15.265507337973" fill="var(--primary-text)" font-family="Arial, sans-serif">its own repo and team</text>

  <rect x="920" y="40" width="280" height="145" rx="6.106202935189" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="102.142857142857" text-anchor="middle" font-size="21.371710273163" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">shipping service</text>
  <text x="1060" y="138.392857142857" text-anchor="middle" font-size="15.265507337973" fill="var(--primary-text)" font-family="Arial, sans-serif">its own repo and team</text>

  <rect x="380" y="76.25" width="100" height="72.5" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="119.75" text-anchor="middle" font-size="15.265507337973" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">contract</text>

  <rect x="800" y="76.25" width="100" height="72.5" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="119.75" text-anchor="middle" font-size="15.265507337973" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">contract</text>

  <line x1="360" y1="112.5" x2="375" y2="112.5" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="480" y1="112.5" x2="495" y2="112.5" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="780" y1="112.5" x2="795" y2="112.5" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="900" y1="112.5" x2="915" y2="112.5" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <rect x="200" y="267.857142857143" width="880" height="82.857142857143" rx="6.106202935189" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="317.571428571429" text-anchor="middle" font-size="20.354009783964" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">one feature = changes in three repos, three reviews, three deploys</text>

  <rect x="40" y="433.571428571429" width="520" height="113.928571428571" rx="6.106202935189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="482.25" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">one service at a time</text>
  <text x="300" y="516.428571428571" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">the contract stays fixed while you work</text>

  <rect x="720" y="433.571428571429" width="520" height="113.928571428571" rx="6.106202935189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="482.25" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">contract tests guard both sides</text>
  <text x="980" y="516.428571428571" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">schema checks catch silent breakage</text>

  <text x="640" y="620" text-anchor="middle" font-size="18.318608805568" fill="var(--text-muted)" font-family="Arial, sans-serif">The contract is the source of truth — give the model the spec, not your memory of it</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="290" y="40" width="700" height="71.478873239437" rx="6.063049016813" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.908450704225" text-anchor="middle" font-size="20.210163389378" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">LLM writes a change</text>

  <rect x="290" y="131.901408450704" width="700" height="71.478873239437" rx="6.063049016813" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="175.80985915493" text-anchor="middle" font-size="20.210163389378" fill="var(--primary-text)" font-family="Arial, sans-serif">types and compiler</text>

  <rect x="290" y="223.802816901408" width="700" height="71.478873239437" rx="6.063049016813" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="267.711267605634" text-anchor="middle" font-size="20.210163389378" fill="var(--primary-text)" font-family="Arial, sans-serif">linters and formatters</text>

  <rect x="290" y="315.704225352113" width="700" height="71.478873239437" rx="6.063049016813" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="359.612676056338" text-anchor="middle" font-size="20.210163389378" fill="var(--warn-text)" font-family="Arial, sans-serif">tests — the executable specification</text>

  <rect x="290" y="407.605633802817" width="700" height="71.478873239437" rx="6.063049016813" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="451.514084507042" text-anchor="middle" font-size="20.210163389378" fill="var(--warn-text)" font-family="Arial, sans-serif">CI pipeline</text>

  <rect x="290" y="499.507042253521" width="700" height="71.478873239437" rx="6.063049016813" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="543.415492957747" text-anchor="middle" font-size="20.210163389378" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">human review — then merge</text>

  <line x1="640" y1="111.478873239437" x2="640" y2="126.795774647887" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="203.380281690141" x2="640" y2="218.697183098592" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="295.281690140845" x2="640" y2="310.598591549296" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="387.183098591549" x2="640" y2="402.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="479.084507042254" x2="640" y2="494.401408450704" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="254.43661971831" width="210" height="102.112676056338" rx="6.063049016813" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="145" y="297.323943661972" text-anchor="middle" font-size="16.168130711502" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">machines first</text>
  <text x="145" y="327.957746478873" text-anchor="middle" font-size="14.147114372565" fill="var(--text-muted)" font-family="Arial, sans-serif">instant and tireless</text>

  <rect x="1030" y="468.87323943662" width="210" height="102.112676056338" rx="6.063049016813" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1135" y="511.760563380282" text-anchor="middle" font-size="16.168130711502" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">humans last</text>
  <text x="1135" y="542.394366197183" text-anchor="middle" font-size="14.147114372565" fill="var(--text-muted)" font-family="Arial, sans-serif">judgment and intent</text>

  <text x="640" y="620" text-anchor="middle" font-size="18.18914705044" fill="var(--text-muted)" font-family="Arial, sans-serif">A red pipeline stops the merge — no matter who wrote the code</text>
</svg>

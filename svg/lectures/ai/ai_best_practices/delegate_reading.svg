<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="90" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="93" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">main thread — you and the AI decide here</text>
  <rect x="100" y="250" width="300" height="70" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250.0" y="291" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">subagent 1: read files</text>
  <line x1="250" y1="250" x2="250" y2="137" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="262" y="200" text-anchor="start" font-size="14" fill="var(--info-accent)" font-family="Arial, sans-serif">conclusion only</text>
  <rect x="130" y="400" width="70" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="165" y="450" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">file</text>
  <line x1="165" y1="400" x2="165" y2="327" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="220" y="400" width="70" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="255" y="450" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">file</text>
  <line x1="255" y1="400" x2="255" y2="327" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="310" y="400" width="70" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="345" y="450" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">file</text>
  <line x1="345" y1="400" x2="345" y2="327" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="490" y="250" width="300" height="70" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="291" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">subagent 2: read files</text>
  <line x1="640" y1="250" x2="640" y2="137" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="652" y="200" text-anchor="start" font-size="14" fill="var(--info-accent)" font-family="Arial, sans-serif">conclusion only</text>
  <rect x="520" y="400" width="70" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="555" y="450" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">file</text>
  <line x1="555" y1="400" x2="555" y2="327" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="610" y="400" width="70" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="645" y="450" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">file</text>
  <line x1="645" y1="400" x2="645" y2="327" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="700" y="400" width="70" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="735" y="450" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">file</text>
  <line x1="735" y1="400" x2="735" y2="327" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="880" y="250" width="300" height="70" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030.0" y="291" text-anchor="middle" font-size="18" fill="var(--info-text)" font-family="Arial, sans-serif">subagent 3: read files</text>
  <line x1="1030" y1="250" x2="1030" y2="137" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="1042" y="200" text-anchor="start" font-size="14" fill="var(--info-accent)" font-family="Arial, sans-serif">conclusion only</text>
  <rect x="910" y="400" width="70" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="945" y="450" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">file</text>
  <line x1="945" y1="400" x2="945" y2="327" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="1000" y="400" width="70" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1035" y="450" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">file</text>
  <line x1="1035" y1="400" x2="1035" y2="327" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="1090" y="400" width="70" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1125" y="450" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">file</text>
  <line x1="1125" y1="400" x2="1125" y2="327" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="640" y="525" text-anchor="middle" font-size="18" fill="var(--text-muted)" font-family="Arial, sans-serif">reading is cheap to delegate — judgment compounds, so keep it visible</text>
  <rect x="40" y="550" width="1200" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="593" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Delegate reading, keep deciding</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="220" height="98.490566037736" rx="6.27664133236" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="81.584905660377" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Documents</text>
  <text x="150" y="114.415094339623" text-anchor="middle" font-size="13.599389553447" fill="var(--warn-text)" font-family="Arial, sans-serif">PDF · HTML · Office</text>

  <rect x="330" y="40" width="220" height="98.490566037736" rx="6.27664133236" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="81.584905660377" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Parse</text>
  <text x="440" y="114.415094339623" text-anchor="middle" font-size="13.599389553447" fill="var(--warn-text)" font-family="Arial, sans-serif">unstructured · Docling</text>

  <rect x="620" y="40" width="220" height="98.490566037736" rx="6.27664133236" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="81.584905660377" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Chunk + embed</text>
  <text x="730" y="114.415094339623" text-anchor="middle" font-size="13.599389553447" fill="var(--warn-text)" font-family="Arial, sans-serif">split, then vectorize</text>

  <rect x="950" y="40" width="290" height="361.132075471698" rx="6.27664133236" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095" y="193.207547169811" text-anchor="middle" font-size="23.014351551988" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Vector DB</text>
  <text x="1095" y="231.509433962264" text-anchor="middle" font-size="15.691603330901" fill="var(--primary-text)" font-family="Arial, sans-serif">Chroma · Qdrant</text>
  <text x="1095" y="258.867924528302" text-anchor="middle" font-size="15.691603330901" fill="var(--primary-text)" font-family="Arial, sans-serif">pgvector</text>

  <rect x="40" y="302.641509433962" width="220" height="98.490566037736" rx="6.27664133236" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="344.22641509434" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Question</text>
  <text x="150" y="377.056603773585" text-anchor="middle" font-size="13.599389553447" fill="var(--ok-text)" font-family="Arial, sans-serif">from the user</text>

  <rect x="330" y="302.641509433962" width="220" height="98.490566037736" rx="6.27664133236" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="344.22641509434" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Embed query</text>
  <text x="440" y="377.056603773585" text-anchor="middle" font-size="13.599389553447" fill="var(--ok-text)" font-family="Arial, sans-serif">same embedding model</text>

  <rect x="520" y="488.679245283019" width="240" height="131.320754716981" rx="6.27664133236" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="543.396226415094" text-anchor="middle" font-size="23.014351551988" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">LLM</text>
  <text x="640" y="581.698113207547" text-anchor="middle" font-size="13.599389553447" fill="var(--info-text)" font-family="Arial, sans-serif">question + retrieved context</text>

  <rect x="40" y="488.679245283019" width="240" height="131.320754716981" rx="6.27664133236" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="543.396226415094" text-anchor="middle" font-size="20.922137774535" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Answer</text>
  <text x="160" y="581.698113207547" text-anchor="middle" font-size="13.599389553447" fill="var(--ok-text)" font-family="Arial, sans-serif">grounded in your data</text>

  <line x1="260" y1="89.245283018868" x2="325" y2="89.245283018868" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="550" y1="89.245283018868" x2="615" y2="89.245283018868" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="840" y1="89.245283018868" x2="945" y2="89.245283018868" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="260" y1="351.88679245283" x2="325" y2="351.88679245283" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="550" y1="351.88679245283" x2="945" y2="351.88679245283" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="740" y="335.471698113208" text-anchor="middle" font-size="14.645496442174" fill="var(--text-muted)" font-family="Arial, sans-serif">nearest-neighbor search</text>
  <line x1="1095" y1="401.132075471698" x2="765" y2="521.509433962264" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="990" y="466.792452830189" text-anchor="middle" font-size="14.645496442174" fill="var(--text-muted)" font-family="Arial, sans-serif">top-k chunks</text>
  <line x1="150" y1="401.132075471698" x2="515" y2="532.452830188679" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="520" y1="554.339622641509" x2="285" y2="554.339622641509" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
</svg>

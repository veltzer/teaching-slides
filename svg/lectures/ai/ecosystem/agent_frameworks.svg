<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="640" y1="68.712871287129" x2="70" y2="68.712871287129" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="68.712871287129" x2="1210" y2="68.712871287129" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="40" text-anchor="middle" font-size="17.147005627228" fill="var(--text-muted)" font-family="Arial, sans-serif">more control</text>
  <text x="1100" y="40" text-anchor="middle" font-size="17.147005627228" fill="var(--text-muted)" font-family="Arial, sans-serif">more machinery</text>

  <rect x="40" y="172.079207920792" width="260" height="229.70297029703" rx="6.430127110211" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="235.247524752475" text-anchor="middle" font-size="21.433757034035" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Raw SDK</text>
  <text x="170" y="281.188118811881" text-anchor="middle" font-size="15.003629923825" fill="var(--primary-text)" font-family="Arial, sans-serif">you own the loop</text>
  <text x="170" y="309.90099009901" text-anchor="middle" font-size="15.003629923825" fill="var(--primary-text)" font-family="Arial, sans-serif">nothing hidden</text>

  <rect x="340" y="172.079207920792" width="260" height="229.70297029703" rx="6.430127110211" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="235.247524752475" text-anchor="middle" font-size="21.433757034035" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Typed libraries</text>
  <text x="470" y="281.188118811881" text-anchor="middle" font-size="15.003629923825" fill="var(--ok-text)" font-family="Arial, sans-serif">Pydantic AI</text>
  <text x="470" y="309.90099009901" text-anchor="middle" font-size="15.003629923825" fill="var(--ok-text)" font-family="Arial, sans-serif">smolagents</text>

  <rect x="640" y="172.079207920792" width="260" height="229.70297029703" rx="6.430127110211" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="235.247524752475" text-anchor="middle" font-size="21.433757034035" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Toolkits</text>
  <text x="770" y="281.188118811881" text-anchor="middle" font-size="15.003629923825" fill="var(--warn-text)" font-family="Arial, sans-serif">LangChain · LangGraph</text>
  <text x="770" y="309.90099009901" text-anchor="middle" font-size="15.003629923825" fill="var(--warn-text)" font-family="Arial, sans-serif">LlamaIndex</text>

  <rect x="940" y="172.079207920792" width="300" height="229.70297029703" rx="6.430127110211" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="235.247524752475" text-anchor="middle" font-size="19.290381330632" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Multi-agent, low-code</text>
  <text x="1090" y="281.188118811881" text-anchor="middle" font-size="15.003629923825" fill="var(--info-text)" font-family="Arial, sans-serif">CrewAI · AutoGen</text>
  <text x="1090" y="309.90099009901" text-anchor="middle" font-size="15.003629923825" fill="var(--info-text)" font-family="Arial, sans-serif">Dify · Flowise</text>

  <rect x="240" y="505.148514851485" width="800" height="114.851485148515" rx="6.430127110211" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="570.613861386139" text-anchor="middle" font-size="18.21869347893" fill="var(--text)" font-family="Arial, sans-serif">Start at the left — move right only when measured pain demands it</text>
</svg>

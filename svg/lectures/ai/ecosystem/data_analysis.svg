<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="240" height="113.725490196078" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="88.901960784314" text-anchor="middle" font-size="20.262009268773" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Question</text>
  <text x="160" y="125.294117647059" text-anchor="middle" font-size="13.863480026003" fill="var(--info-text)" font-family="Arial, sans-serif">about your data</text>

  <rect x="520" y="40" width="240" height="136.470588235294" rx="6.39852924277" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="96.862745098039" text-anchor="middle" font-size="25.594116971082" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">LLM</text>
  <text x="640" y="136.666666666667" text-anchor="middle" font-size="14.929901566464" fill="var(--primary-text)" font-family="Arial, sans-serif">writes pandas / SQL</text>

  <rect x="980" y="40" width="260" height="136.470588235294" rx="6.39852924277" fill="var(--code-bg)"/>
  <text x="1110" y="96.862745098039" text-anchor="middle" font-size="14.929901566464" fill="var(--surface)" font-family="Courier New, monospace">df.groupby('region')</text>
  <text x="1110" y="125.294117647059" text-anchor="middle" font-size="14.929901566464" fill="var(--surface)" font-family="Courier New, monospace">.sales.sum().plot()</text>

  <rect x="980" y="324.313725490196" width="260" height="136.470588235294" rx="6.39852924277" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="381.176470588235" text-anchor="middle" font-size="21.328430809235" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Sandbox</text>
  <text x="1110" y="420.980392156863" text-anchor="middle" font-size="13.863480026003" fill="var(--warn-text)" font-family="Arial, sans-serif">runs the code, isolated</text>

  <rect x="520" y="347.058823529412" width="240" height="113.725490196078" rx="6.39852924277" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="409.607843137255" text-anchor="middle" font-size="15.996323106926" fill="var(--text)" font-family="Arial, sans-serif">results · errors · charts</text>

  <rect x="40" y="483.529411764706" width="240" height="136.470588235294" rx="6.39852924277" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="540.392156862745" text-anchor="middle" font-size="19.195587728311" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Answer + chart</text>
  <text x="160" y="580.196078431372" text-anchor="middle" font-size="13.863480026003" fill="var(--ok-text)" font-family="Arial, sans-serif">backed by executed code</text>

  <line x1="280" y1="96.862745098039" x2="515" y2="102.549019607843" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="760" y1="108.235294117647" x2="975" y2="108.235294117647" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="1110" y1="176.470588235294" x2="1110" y2="318.627450980392" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="398.235294117647" x2="765" y2="401.647058823529" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="640" y1="347.058823529412" x2="640" y2="182.156862745098" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="695" y="273.137254901961" text-anchor="middle" font-size="14.929901566464" fill="var(--text-muted)" font-family="Arial, sans-serif">iterate</text>
  <line x1="520" y1="438.039215686274" x2="285" y2="523.333333333333" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="420" y="500.588235294118" text-anchor="middle" font-size="13.863480026003" fill="var(--text-muted)" font-family="Arial, sans-serif">when it works</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="207.555555555556" width="240" height="154.666666666667" rx="6.811754546371" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="272" text-anchor="middle" font-size="21.570556063507" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Schema + prompt</text>
  <text x="160" y="317.111111111111" text-anchor="middle" font-size="15.894093941531" fill="var(--info-text)" font-family="Arial, sans-serif">a Pydantic model</text>

  <rect x="380" y="207.555555555556" width="180" height="154.666666666667" rx="6.811754546371" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="293.911111111111" text-anchor="middle" font-size="27.247018185482" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">LLM</text>

  <rect x="660" y="207.555555555556" width="200" height="154.666666666667" rx="6.811754546371" fill="var(--code-bg)"/>
  <text x="760" y="274.577777777778" text-anchor="middle" font-size="15.894093941531" fill="var(--surface)" font-family="Courier New, monospace">{"name": ...,</text>
  <text x="760" y="306.8" text-anchor="middle" font-size="15.894093941531" fill="var(--surface)" font-family="Courier New, monospace">"price": 12}</text>
  <text x="760" y="407.333333333333" text-anchor="middle" font-size="15.894093941531" fill="var(--text-muted)" font-family="Arial, sans-serif">JSON candidate</text>

  <rect x="960" y="207.555555555556" width="280" height="154.666666666667" rx="6.811754546371" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="272" text-anchor="middle" font-size="21.570556063507" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Validator</text>
  <text x="1100" y="317.111111111111" text-anchor="middle" font-size="15.894093941531" fill="var(--warn-text)" font-family="Arial, sans-serif">checks against the schema</text>

  <rect x="960" y="465.333333333333" width="280" height="154.666666666667" rx="6.811754546371" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="529.777777777778" text-anchor="middle" font-size="21.570556063507" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Typed object</text>
  <text x="1100" y="574.888888888889" text-anchor="middle" font-size="15.894093941531" fill="var(--ok-text)" font-family="Arial, sans-serif">guaranteed shape</text>

  <line x1="280" y1="284.888888888889" x2="375" y2="284.888888888889" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="560" y1="284.888888888889" x2="655" y2="284.888888888889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="860" y1="284.888888888889" x2="955" y2="284.888888888889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1100" y1="362.222222222222" x2="1100" y2="458.888888888889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="1140" y="420.222222222222" text-anchor="middle" font-size="15.894093941531" fill="var(--text-muted)" font-family="Arial, sans-serif">valid</text>

  <line x1="1100" y1="207.555555555556" x2="1100" y2="65.777777777778" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="1100" y1="65.777777777778" x2="470" y2="65.777777777778" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="470" y1="65.777777777778" x2="470" y2="201.111111111111" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="785" y="40" text-anchor="middle" font-size="17.029386365926" fill="var(--text-muted)" font-family="Arial, sans-serif">invalid — errors fed back, the model retries</text>
</svg>

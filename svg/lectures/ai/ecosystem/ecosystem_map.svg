<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="515" y="270" width="250" height="120" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="320" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">LLM</text>
  <text x="640" y="355" text-anchor="middle" font-size="15" fill="var(--primary-text)" font-family="Arial, sans-serif">tokens in, tokens out</text>

  <rect x="40" y="40" width="285" height="110" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="85" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Access + routing</text>
  <text x="182" y="120" text-anchor="middle" font-size="14" fill="var(--ok-text)" font-family="Arial, sans-serif">SDKs · gateways · Ollama</text>

  <rect x="345" y="40" width="285" height="110" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="85" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Agent frameworks</text>
  <text x="487" y="120" text-anchor="middle" font-size="14" fill="var(--info-text)" font-family="Arial, sans-serif">LangChain · CrewAI · SDKs</text>

  <rect x="650" y="40" width="285" height="110" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="85" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">RAG + retrieval</text>
  <text x="792" y="120" text-anchor="middle" font-size="14" fill="var(--warn-text)" font-family="Arial, sans-serif">parsers · vector databases</text>

  <rect x="955" y="40" width="285" height="110" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="85" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Structured output</text>
  <text x="1097" y="120" text-anchor="middle" font-size="14" fill="var(--primary-text)" font-family="Arial, sans-serif">Instructor · Outlines · MCP</text>

  <rect x="40" y="510" width="285" height="110" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="555" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Evals + tracing</text>
  <text x="182" y="590" text-anchor="middle" font-size="14" fill="var(--warn-text)" font-family="Arial, sans-serif">promptfoo · Langfuse</text>

  <rect x="345" y="510" width="285" height="110" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="555" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Guardrails</text>
  <text x="487" y="590" text-anchor="middle" font-size="14" fill="var(--danger-text)" font-family="Arial, sans-serif">validators · safety filters</text>

  <rect x="650" y="510" width="285" height="110" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="555" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Fine-tuning</text>
  <text x="792" y="590" text-anchor="middle" font-size="14" fill="var(--info-text)" font-family="Arial, sans-serif">LoRA · Axolotl · Unsloth</text>

  <rect x="955" y="510" width="285" height="110" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="555" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">UI + low-code</text>
  <text x="1097" y="590" text-anchor="middle" font-size="14" fill="var(--ok-text)" font-family="Arial, sans-serif">Gradio · Chainlit · Dify</text>

  <line x1="182" y1="155" x2="545" y2="265" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="487" y1="155" x2="600" y2="265" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="792" y1="155" x2="680" y2="265" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="1097" y1="155" x2="735" y2="265" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="182" y1="505" x2="545" y2="395" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="487" y1="505" x2="600" y2="395" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <line x1="792" y1="505" x2="680" y2="395" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="1097" y1="505" x2="735" y2="395" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
</svg>

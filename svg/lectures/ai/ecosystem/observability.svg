<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="256.078431372549" width="280" height="136.470588235294" rx="6.39852924277" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="312.941176470588" text-anchor="middle" font-size="21.328430809235" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Your LLM app</text>
  <text x="180" y="352.745098039216" text-anchor="middle" font-size="13.863480026003" fill="var(--primary-text)" font-family="Arial, sans-serif">every call · tool use · tokens</text>

  <rect x="480" y="256.078431372549" width="320" height="136.470588235294" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="312.941176470588" text-anchor="middle" font-size="21.328430809235" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Tracing platform</text>
  <text x="640" y="352.745098039216" text-anchor="middle" font-size="13.863480026003" fill="var(--info-text)" font-family="Arial, sans-serif">Langfuse · LangSmith · Phoenix</text>

  <rect x="960" y="40" width="280" height="102.352941176471" rx="6.39852924277" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1100" y="99.137254901961" text-anchor="middle" font-size="17.062744647388" fill="var(--text)" font-family="Arial, sans-serif">traces of every run</text>

  <rect x="960" y="199.21568627451" width="280" height="102.352941176471" rx="6.39852924277" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1100" y="258.352941176471" text-anchor="middle" font-size="17.062744647388" fill="var(--text)" font-family="Arial, sans-serif">evals + datasets</text>

  <rect x="960" y="358.43137254902" width="280" height="102.352941176471" rx="6.39852924277" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1100" y="417.56862745098" text-anchor="middle" font-size="17.062744647388" fill="var(--text)" font-family="Arial, sans-serif">prompt registry</text>

  <rect x="960" y="517.647058823529" width="280" height="102.352941176471" rx="6.39852924277" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1100" y="576.78431372549" text-anchor="middle" font-size="17.062744647388" fill="var(--text)" font-family="Arial, sans-serif">dashboards + alerts</text>

  <line x1="320" y1="324.313725490196" x2="475" y2="324.313725490196" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="400" y="301.56862745098" text-anchor="middle" font-size="13.863480026003" fill="var(--text-muted)" font-family="Arial, sans-serif">OpenTelemetry</text>
  <line x1="800" y1="295.882352941176" x2="955" y2="96.862745098039" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="800" y1="312.941176470588" x2="955" y2="253.803921568627" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="800" y1="335.686274509804" x2="955" y2="406.196078431373" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="800" y1="352.745098039216" x2="955" y2="563.137254901961" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
</svg>

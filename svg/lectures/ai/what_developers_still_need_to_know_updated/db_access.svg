<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="230" width="240" height="200" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="160.0" y="314.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Agent</text>
  <text x="160.0" y="341.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--info-text)">writes the query,</text>
  <text x="160.0" y="366.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--info-text)">reads the answer</text>
  <line x1="280" y1="330" x2="338" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="40" width="320" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="500.0" y="219.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Gate</text>
  <text x="500.0" y="245.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)"></text>
  <text x="500.0" y="271.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">read-only role</text>
  <text x="500.0" y="297.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">row limit</text>
  <text x="500.0" y="323.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">statement timeout</text>
  <text x="500.0" y="349.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">cost limit</text>
  <text x="500.0" y="375.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">masked columns</text>
  <text x="500.0" y="402.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)"></text>
  <text x="500.0" y="428.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">enforced by the database,</text>
  <text x="500.0" y="454.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">not by the prompt</text>
  <line x1="660" y1="200" x2="738" y2="140" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="660" y1="330" x2="738" y2="330" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="660" y1="460" x2="738" y2="520" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="740" y="40" width="500" height="180" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="990.0" y="126.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="var(--ok-text)">Schema</text>
  <text x="990.0" y="153.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-text)">names, types, comments, constraints</text>
  <rect x="740" y="240" width="500" height="180" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="990.0" y="314.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="var(--ok-text)">Data to query</text>
  <text x="990.0" y="340.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-text)">a replica or a masked copy</text>
  <text x="990.0" y="365.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-text)">samples and statistics</text>
  <rect x="740" y="440" width="500" height="180" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="990.0" y="514.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="var(--danger-text)">Never reachable</text>
  <text x="990.0" y="540.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--danger-text)">no production credentials</text>
  <text x="990.0" y="565.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--danger-text)">no writes, no personal data</text>
</svg>

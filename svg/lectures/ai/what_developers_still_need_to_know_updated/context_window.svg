<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="760" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="420.0" y="77.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--text)">One window, one budget</text>
  <rect x="40" y="120" width="760" height="70" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="420.0" y="150.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--info-text)">Instructions</text>
  <text x="420.0" y="176.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--info-text)">system prompt, instruction files, memory</text>
  <rect x="40" y="200" width="760" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="420.0" y="245.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--primary-text)">Files</text>
  <text x="420.0" y="271.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">whatever the agent chose to read</text>
  <rect x="40" y="310" width="760" height="120" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="420.0" y="365.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--warn-text)">Tool output</text>
  <text x="420.0" y="391.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--warn-text)">build logs, test runs, query results</text>
  <rect x="40" y="440" width="760" height="80" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="420.0" y="475.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--ok-text)">Conversation</text>
  <text x="420.0" y="501.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-text)">every request and every answer so far</text>
  <rect x="40" y="530" width="760" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="420.0" y="581.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text)">free space: where the next step has to fit</text>
  <rect x="860" y="40" width="380" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050.0" y="77.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="var(--text)">What it means</text>
  <rect x="860" y="120.0" width="380" height="117.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050.0" y="172.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Not in the window:</text>
  <text x="1050.0" y="198.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">the model does not know it</text>
  <rect x="860" y="247.5" width="380" height="117.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050.0" y="299.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Tool output is usually</text>
  <text x="1050.0" y="326.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">the biggest consumer</text>
  <rect x="860" y="375.0" width="380" height="117.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050.0" y="427.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Nearly full: early rules</text>
  <text x="1050.0" y="453.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">get forgotten</text>
  <rect x="860" y="502.5" width="380" height="117.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050.0" y="555.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">Compaction frees space</text>
  <text x="1050.0" y="581.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text)">and loses detail</text>
  <line x1="800" y1="330" x2="858" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="270" height="200" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="175.0" y="123.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--info-text)">Explore</text>
  <text x="175.0" y="152.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">read the code,</text>
  <text x="175.0" y="178.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--info-text)">change nothing</text>
  <line x1="310" y1="140" x2="348" y2="140" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="350" y="40" width="270" height="200" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="485.0" y="123.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--primary-text)">Plan</text>
  <text x="485.0" y="152.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">a written plan</text>
  <text x="485.0" y="178.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">you review</text>
  <line x1="620" y1="140" x2="658" y2="140" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="40" width="270" height="200" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="795.0" y="123.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--warn-text)">Implement</text>
  <text x="795.0" y="152.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">one small step</text>
  <text x="795.0" y="178.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--warn-text)">at a time</text>
  <line x1="930" y1="140" x2="968" y2="140" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="970" y="40" width="270" height="200" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1105.0" y="123.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--ok-text)">Verify</text>
  <text x="1105.0" y="152.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">tests, checks,</text>
  <text x="1105.0" y="178.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--ok-text)">then the diff</text>
  <path d="M1105,240 L1105,300 L795,300 L795,243" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="950" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">red: fix and verify again</text>
  <path d="M1105,300 L1105,370 L175,370 L175,243" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text-muted)">green: commit, then explore the next step</text>
  <rect x="40" y="440" width="585" height="180" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="332.5" y="512.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Same mistake twice?</text>
  <text x="332.5" y="539.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">restart the session</text>
  <text x="332.5" y="565.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--danger-text)">instead of correcting it again</text>
  <rect x="655" y="440" width="585" height="180" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="947.5" y="512.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Same correction twice?</text>
  <text x="947.5" y="539.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">write it down as documentation</text>
  <text x="947.5" y="565.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">or enforce it as a check</text>
</svg>

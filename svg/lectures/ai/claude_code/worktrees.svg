<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="222.592592592593" width="300" height="214.814814814815" rx="6.218252702059" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="297.777777777778" text-anchor="middle" font-size="22.80025990755" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">One repository</text>
  <text x="190" y="340.740740740741" text-anchor="middle" font-size="16.582007205491" fill="var(--primary-text)" font-family="Arial, sans-serif">one shared history,</text>
  <text x="190" y="370.814814814815" text-anchor="middle" font-size="16.582007205491" fill="var(--primary-text)" font-family="Arial, sans-serif">several checkouts</text>

  <rect x="480" y="40" width="400" height="161.111111111111" rx="6.218252702059" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="99.074074074074" text-anchor="middle" font-size="19.691133556521" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Worktree: feature-login</text>
  <text x="680" y="142.037037037037" text-anchor="middle" font-size="16.582007205491" fill="var(--info-text)" font-family="Courier New, monospace">claude session 1</text>

  <rect x="480" y="249.444444444444" width="400" height="161.111111111111" rx="6.218252702059" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="308.518518518519" text-anchor="middle" font-size="19.691133556521" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Worktree: bugfix-cache</text>
  <text x="680" y="351.481481481482" text-anchor="middle" font-size="16.582007205491" fill="var(--warn-text)" font-family="Courier New, monospace">claude session 2</text>

  <rect x="480" y="458.888888888889" width="400" height="161.111111111111" rx="6.218252702059" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="517.962962962963" text-anchor="middle" font-size="19.691133556521" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Worktree: refactor-io</text>
  <text x="680" y="560.925925925926" text-anchor="middle" font-size="16.582007205491" fill="var(--ok-text)" font-family="Courier New, monospace">claude session 3</text>

  <line x1="345" y1="276.296296296296" x2="473" y2="136.666666666667" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="345" y1="330" x2="473" y2="330" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="345" y1="383.703703703704" x2="473" y2="523.333333333333" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <rect x="960" y="222.592592592593" width="280" height="214.814814814815" rx="6.218252702059" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1100" y="292.407407407407" text-anchor="middle" font-size="18.654758106178" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Three agents,</text>
  <text x="1100" y="330" text-anchor="middle" font-size="18.654758106178" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">three branches,</text>
  <text x="1100" y="367.592592592593" text-anchor="middle" font-size="18.654758106178" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">zero conflicts</text>
</svg>

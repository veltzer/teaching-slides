<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="216.071428571429" width="240" height="176.071428571429" rx="6.106202935189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="283.392857142857" text-anchor="middle" font-size="22.389410762361" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">You</text>
  <text x="160" y="324.821428571429" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">a goal, in plain</text>
  <text x="160" y="352.785714285714" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">language</text>

  <rect x="360" y="185" width="300" height="238.214285714286" rx="6.106202935189" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="252.321428571429" text-anchor="middle" font-size="22.389410762361" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Claude Code</text>
  <text x="510" y="293.75" text-anchor="middle" font-size="15.265507337973" fill="var(--primary-text)" font-family="Arial, sans-serif">model + harness in a loop</text>
  <text x="510" y="322.75" text-anchor="middle" font-size="15.265507337973" fill="var(--primary-text)" font-family="Arial, sans-serif">decides the next action,</text>
  <text x="510" y="351.75" text-anchor="middle" font-size="15.265507337973" fill="var(--primary-text)" font-family="Arial, sans-serif">observes the result</text>

  <rect x="730" y="216.071428571429" width="160" height="176.071428571429" rx="6.106202935189" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="810" y="283.392857142857" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Permission</text>
  <text x="810" y="312.392857142857" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">gate</text>
  <text x="810" y="350.714285714286" text-anchor="middle" font-size="14.247806848775" fill="var(--danger-text)" font-family="Arial, sans-serif">asks you first</text>

  <rect x="960" y="40" width="280" height="93.214285714286" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="96.964285714286" text-anchor="middle" font-size="17.30090831637" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Read / Write / Edit</text>
  <rect x="960" y="159.107142857143" width="280" height="93.214285714286" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="216.071428571429" text-anchor="middle" font-size="17.30090831637" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Grep / Glob</text>
  <rect x="960" y="278.214285714286" width="280" height="93.214285714286" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="335.178571428571" text-anchor="middle" font-size="17.30090831637" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Bash — build, test, git</text>
  <rect x="960" y="397.321428571429" width="280" height="93.214285714286" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="454.285714285714" text-anchor="middle" font-size="17.30090831637" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Web + MCP tools</text>

  <line x1="285" y1="304.107142857143" x2="353" y2="304.107142857143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="665" y1="304.107142857143" x2="723" y2="304.107142857143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="895" y1="257.5" x2="953" y2="122.857142857143" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="895" y1="283.392857142857" x2="953" y2="216.071428571429" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="895" y1="324.821428571429" x2="953" y2="324.821428571429" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="895" y1="355.892857142857" x2="953" y2="438.75" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <rect x="40" y="516.428571428572" width="1200" height="103.571428571429" rx="6.106202935189" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="559.928571428572" text-anchor="middle" font-size="18.318608805568" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Your working directory is the agent's world</text>
  <text x="640" y="595.142857142857" text-anchor="middle" font-size="16.283207827171" fill="var(--text-muted)" font-family="Arial, sans-serif">every change lands in files you can see — git diff shows it all</text>

  <line x1="1100" y1="495.714285714286" x2="1000" y2="513.321428571429" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- ===== LEFT: PURE ADVICE ===== -->
  <rect x="40" y="40" width="569.491525423729" height="62.477558348294" rx="12.348586965176" fill="url(#grad-ok)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="324.745762711864" y="79.569120287253" font-size="24.697173930352" font-weight="bold" text-anchor="middle" fill="var(--ok-text)" font-family="Arial, sans-serif">Pure advice</text>

  <rect x="70.508474576271" y="128.50987432675" width="152.542372881356" height="62.477558348294" rx="8.232391310117" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="146.779661016949" y="168.078994614004" font-size="17.493831533999" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">summarize</text>
  <rect x="248.474576271186" y="128.50987432675" width="152.542372881356" height="62.477558348294" rx="8.232391310117" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="324.745762711864" y="168.078994614004" font-size="17.493831533999" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">classify</text>
  <rect x="426.440677966102" y="128.50987432675" width="152.542372881356" height="62.477558348294" rx="8.232391310117" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="502.71186440678" y="168.078994614004" font-size="17.493831533999" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">rewrite</text>

  <text x="324.745762711864" y="227.432675044883" font-size="18.522880447764" font-weight="bold" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">re-run is free</text>
  <text x="324.745762711864" y="251.382405745063" font-size="14.406684792705" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">no external state touched — try again anytime</text>

  <!-- ===== RIGHT: EFFECTFUL ===== -->
  <rect x="670.508474576271" y="40" width="569.491525423729" height="62.477558348294" rx="12.348586965176" fill="url(#grad-danger)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="955.254237288136" y="79.569120287253" font-size="24.697173930352" font-weight="bold" text-anchor="middle" fill="var(--danger-text)" font-family="Arial, sans-serif">Effectful</text>

  <rect x="701.016949152542" y="128.50987432675" width="152.542372881356" height="62.477558348294" rx="8.232391310117" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="777.28813559322" y="168.078994614004" font-size="17.493831533999" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">deploy</text>
  <rect x="878.983050847458" y="128.50987432675" width="152.542372881356" height="62.477558348294" rx="8.232391310117" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="955.254237288136" y="168.078994614004" font-size="17.493831533999" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">send mail</text>
  <rect x="1056.949152542373" y="128.50987432675" width="152.542372881356" height="62.477558348294" rx="8.232391310117" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1133.220338983051" y="168.078994614004" font-size="17.493831533999" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">charge card</text>

  <text x="955.254237288136" y="227.432675044883" font-size="18.522880447764" font-weight="bold" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif">re-run can be catastrophic</text>
  <text x="955.254237288136" y="251.382405745063" font-size="14.406684792705" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">duplicate charges, double sends, half-done deploys</text>

  <!-- divider -->
  <line x1="640" y1="40" x2="640" y2="284.703770197487" stroke="var(--border)" stroke-width="1"/>

  <!-- ===== PARTIAL FAILURE BAND ===== -->
  <text x="640" y="326.355475763016" font-size="20.580978275293" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Partial failure: a multi-step effectful run dies mid-way</text>
  <text x="640" y="355.511669658887" font-size="13.377635878941" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">steps 1–2 already changed the world before step 3 crashed</text>

  <!-- state-left-behind band -->
  <rect x="40" y="399.245960502693" width="508.474576271186" height="41.65170556553" rx="8.232391310117" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" opacity="0.35" filter="url(#shadow)"/>
  <text x="294.237288135593" y="426.319569120287" font-size="14.406684792705" font-weight="bold" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif">state left behind (steps 1–2 committed)</text>

  <!-- step chain y=470..560 -->
  <!-- step 1 (shaded) -->
  <rect x="45.084745762712" y="492.962298025135" width="193.220338983051" height="57.271095152603" rx="8.232391310117" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="141.694915254237" y="528.366247755835" font-size="17.493831533999" font-weight="bold" text-anchor="middle" fill="var(--warn-text)" font-family="Arial, sans-serif">step 1</text>
  <line x1="238.305084745763" y1="521.077199281867" x2="289.152542372881" y2="521.077199281867" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- step 2 (shaded) -->
  <rect x="294.237288135593" y="492.962298025135" width="193.220338983051" height="57.271095152603" rx="8.232391310117" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="390.847457627119" y="528.366247755835" font-size="17.493831533999" font-weight="bold" text-anchor="middle" fill="var(--warn-text)" font-family="Arial, sans-serif">step 2</text>
  <line x1="487.457627118644" y1="521.077199281867" x2="538.305084745763" y2="521.077199281867" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- step 3 (dies) -->
  <rect x="543.389830508475" y="492.962298025135" width="193.220338983051" height="57.271095152603" rx="8.232391310117" fill="url(#grad-danger)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="528.366247755835" font-size="17.493831533999" font-weight="bold" text-anchor="middle" fill="var(--danger-text)" font-family="Arial, sans-serif">step 3</text>
  <text x="640" y="480.466786355476" font-size="15.43573370647" font-weight="bold" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif">✗ dies here</text>
  <line x1="736.610169491525" y1="521.077199281867" x2="787.457627118644" y2="521.077199281867" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <!-- step 4 (not reached) -->
  <rect x="792.542372881356" y="492.962298025135" width="193.220338983051" height="57.271095152603" rx="8.232391310117" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.5"/>
  <text x="889.152542372881" y="528.366247755835" font-size="17.493831533999" font-weight="bold" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">step 4</text>
  <line x1="985.762711864407" y1="521.077199281867" x2="1036.610169491525" y2="521.077199281867" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <!-- step 5 (not reached) -->
  <rect x="1041.694915254237" y="492.962298025135" width="193.220338983051" height="57.271095152603" rx="8.232391310117" fill="var(--surface)" stroke="var(--border)" stroke-width="1" opacity="0.5"/>
  <text x="1138.305084745763" y="528.366247755835" font-size="17.493831533999" font-weight="bold" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">step 5</text>

  <!-- idempotency note -->
  <text x="640" y="588.761220825853" font-size="14.406684792705" font-weight="bold" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">idempotency: re-run reaches same end state safely</text>

  <!-- caption -->
  <text x="640" y="620" font-size="18.522880447764" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Know which skills change the world — design for partial failure</text>
</svg>

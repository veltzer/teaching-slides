<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Connectors from center to corners (drawn first, behind boxes) -->
  <line x1="551.111111111111" y1="248.349514563107" x2="340" y2="130.097087378641" stroke="var(--ok-border)" stroke-width="2.5" marker-end="url(#arrow-ok)"/>
  <line x1="728.888888888889" y1="248.349514563107" x2="940" y2="130.097087378641" stroke="var(--info-border)" stroke-width="2.5" marker-end="url(#arrow-info)"/>
  <line x1="551.111111111111" y1="327.184466019417" x2="340" y2="445.436893203883" stroke="var(--warn-border)" stroke-width="2.5" marker-end="url(#arrow-warn)"/>
  <line x1="728.888888888889" y1="327.184466019417" x2="940" y2="445.436893203883" stroke="var(--danger-border)" stroke-width="2.5" marker-end="url(#arrow-danger)"/>

  <!-- Center box (primary) -->
  <rect x="462.222222222222" y="231.456310679612" width="355.555555555556" height="112.621359223301" rx="15.660916110485" fill="url(#grad-primary)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="282.135922330097" text-anchor="middle" font-size="24.610011030761" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Skill Library</text>
  <text x="640" y="315.922330097087" text-anchor="middle" font-size="24.610011030761" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">= Software</text>

  <!-- Top-left: Measure (ok) -->
  <rect x="40" y="40" width="355.555555555556" height="123.883495145631" rx="15.660916110485" fill="url(#grad-ok)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="217.777777777778" y="90.679611650485" text-anchor="middle" font-size="24.610011030761" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Measure</text>
  <text x="217.777777777778" y="130.097087378641" text-anchor="middle" font-size="16.779552975519" fill="var(--ok-text)" font-family="Arial, sans-serif">evals catch silent regressions</text>

  <!-- Top-right: Scope (info) -->
  <rect x="884.444444444444" y="40" width="355.555555555556" height="123.883495145631" rx="15.660916110485" fill="url(#grad-info)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1062.222222222222" y="90.679611650485" text-anchor="middle" font-size="24.610011030761" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Scope</text>
  <text x="1062.222222222222" y="130.097087378641" text-anchor="middle" font-size="16.779552975519" fill="var(--info-text)" font-family="Arial, sans-serif">least privilege, know side effects</text>

  <!-- Bottom-left: Version (warn) -->
  <rect x="40" y="411.650485436893" width="355.555555555556" height="123.883495145631" rx="15.660916110485" fill="url(#grad-warn)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="217.777777777778" y="462.330097087379" text-anchor="middle" font-size="24.610011030761" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Version</text>
  <text x="217.777777777778" y="501.747572815534" text-anchor="middle" font-size="16.779552975519" fill="var(--warn-text)" font-family="Arial, sans-serif">semver + owners + lifecycle</text>

  <!-- Bottom-right: Review (danger) -->
  <rect x="884.444444444444" y="411.650485436893" width="355.555555555556" height="123.883495145631" rx="15.660916110485" fill="url(#grad-danger)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1062.222222222222" y="462.330097087379" text-anchor="middle" font-size="24.610011030761" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Review</text>
  <text x="1062.222222222222" y="501.747572815534" text-anchor="middle" font-size="16.779552975519" fill="var(--danger-text)" font-family="Arial, sans-serif">trusted dependency, audit it</text>

  <!-- Bottom caption -->
  <text x="640" y="620" text-anchor="middle" font-size="20.135463570623" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Simple artifact, complex interactions — engineer the library</text>
</svg>

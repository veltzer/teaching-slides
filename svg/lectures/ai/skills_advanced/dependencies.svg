<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- arrows (dependent -> dependency) drawn first, behind boxes -->
  <!-- generate-invoice (top-left, center ~290,160) -> validate-customer (mid-left, center ~330,400) -->
  <line x1="236.153846153846" y1="180.606060606061" x2="282.307692307692" y2="321.212121212121" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- generate-invoice -> csv-parsing (mid-right, center ~870,400) -->
  <line x1="340" y1="133.737373737374" x2="755.384615384615" y2="356.363636363636" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- monthly-report (top-right, center ~990,160) -> csv-parsing -->
  <line x1="1020.769230769231" y1="180.606060606061" x2="951.538461538462" y2="321.212121212121" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- arrow labels -->
  <text x="213.076923076923" y="262.626262626263" text-anchor="middle" font-size="15.115715281946" fill="var(--text-muted)" font-family="Arial, sans-serif">needs</text>
  <text x="576.538461538461" y="221.616161616162" text-anchor="middle" font-size="15.115715281946" fill="var(--text-muted)" font-family="Arial, sans-serif">needs</text>
  <text x="1015" y="262.626262626263" text-anchor="middle" font-size="15.115715281946" fill="var(--text-muted)" font-family="Arial, sans-serif">needs</text>

  <!-- top-level skills -->
  <g>
    <rect x="40" y="40" width="392.307692307692" height="117.171717171717" rx="18.603957270087" fill="url(#grad-primary)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="236.153846153846" y="92.727272727273" text-anchor="middle" font-size="27.905935905131" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">generate-invoice</text>
    <text x="236.153846153846" y="127.878787878788" text-anchor="middle" font-size="16.278462611326" fill="var(--primary-text)" font-family="Arial, sans-serif">high-level skill</text>
  </g>
  <g>
    <rect x="847.692307692308" y="40" width="392.307692307692" height="117.171717171717" rx="18.603957270087" fill="url(#grad-primary)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="1043.846153846154" y="92.727272727273" text-anchor="middle" font-size="27.905935905131" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">monthly-report</text>
    <text x="1043.846153846154" y="127.878787878788" text-anchor="middle" font-size="16.278462611326" fill="var(--primary-text)" font-family="Arial, sans-serif">high-level skill</text>
  </g>

  <!-- shared helpers -->
  <g>
    <rect x="86.153846153846" y="321.212121212121" width="392.307692307692" height="128.888888888889" rx="18.603957270087" fill="url(#grad-info)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
    <text x="282.307692307692" y="377.454545454545" text-anchor="middle" font-size="26.74318857575" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">validate-customer</text>
    <text x="282.307692307692" y="412.606060606061" text-anchor="middle" font-size="16.278462611326" fill="var(--info-text)" font-family="Arial, sans-serif">helper skill</text>
  </g>
  <g>
    <rect x="709.230769230769" y="321.212121212121" width="392.307692307692" height="128.888888888889" rx="18.603957270087" fill="url(#grad-ok)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
    <text x="905.384615384615" y="377.454545454545" text-anchor="middle" font-size="27.905935905131" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">csv-parsing</text>
    <text x="905.384615384615" y="412.606060606061" text-anchor="middle" font-size="16.278462611326" fill="var(--ok-text)" font-family="Arial, sans-serif">helper skill</text>
  </g>

  <!-- shared helper annotation -->
  <text x="905.384615384615" y="502.828282828283" text-anchor="middle" font-size="17.441209940707" font-style="italic" fill="var(--text-muted)" font-family="Arial, sans-serif">shared helper — used by two skills</text>

  <!-- caption -->
  <text x="640" y="620" text-anchor="middle" font-size="20.929451928848" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A high-level skill reuses lower-level ones — DRY for procedures</text>
</svg>

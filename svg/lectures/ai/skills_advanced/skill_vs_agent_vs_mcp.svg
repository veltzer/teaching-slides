<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Col 1: Skill (primary) -->
  <rect x="40" y="40" width="386.440677966102" height="515.555555555556" rx="16.721942236646" fill="url(#grad-primary)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="233.220338983051" y="102.296296296296" text-anchor="middle" font-size="27.17315613455" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Skill</text>
  <line x1="80.677966101695" y1="125.925925925926" x2="385.762711864407" y2="125.925925925926" stroke="var(--primary-text)" stroke-width="1" opacity="0.5"/>
  <text x="233.220338983051" y="201.111111111111" text-anchor="middle" font-size="18.812185016227" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Procedure</text>
  <text x="233.220338983051" y="287.037037037037" text-anchor="middle" font-size="16.721942236646" fill="var(--primary-text)" font-family="Arial, sans-serif">Loaded into current agent</text>
  <text x="233.220338983051" y="372.962962962963" text-anchor="middle" font-size="16.721942236646" fill="var(--primary-text)" font-family="Arial, sans-serif">How to do the task</text>
  <text x="233.220338983051" y="458.888888888889" text-anchor="middle" font-size="16.721942236646" fill="var(--primary-text)" font-family="Arial, sans-serif">No own context</text>

  <!-- Col 2: Sub-Agent (info) -->
  <rect x="446.779661016949" y="40" width="386.440677966102" height="515.555555555556" rx="16.721942236646" fill="url(#grad-info)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="102.296296296296" text-anchor="middle" font-size="27.17315613455" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Sub-Agent</text>
  <line x1="487.457627118644" y1="125.925925925926" x2="792.542372881356" y2="125.925925925926" stroke="var(--info-text)" stroke-width="1" opacity="0.5"/>
  <text x="640" y="201.111111111111" text-anchor="middle" font-size="18.812185016227" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Procedure + own loop</text>
  <text x="640" y="287.037037037037" text-anchor="middle" font-size="16.721942236646" fill="var(--info-text)" font-family="Arial, sans-serif">Its own context window</text>
  <text x="640" y="372.962962962963" text-anchor="middle" font-size="16.721942236646" fill="var(--info-text)" font-family="Arial, sans-serif">Delegated work</text>
  <text x="640" y="458.888888888889" text-anchor="middle" font-size="16.721942236646" fill="var(--info-text)" font-family="Arial, sans-serif">Focused, isolated</text>

  <!-- Col 3: MCP Server (ok) -->
  <rect x="853.559322033898" y="40" width="386.440677966102" height="515.555555555556" rx="16.721942236646" fill="url(#grad-ok)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1046.779661016949" y="102.296296296296" text-anchor="middle" font-size="27.17315613455" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">MCP Server</text>
  <line x1="894.237288135593" y1="125.925925925926" x2="1199.322033898305" y2="125.925925925926" stroke="var(--ok-text)" stroke-width="1" opacity="0.5"/>
  <text x="1046.779661016949" y="201.111111111111" text-anchor="middle" font-size="18.812185016227" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Capability</text>
  <text x="1046.779661016949" y="287.037037037037" text-anchor="middle" font-size="16.721942236646" fill="var(--ok-text)" font-family="Arial, sans-serif">Live tools + service</text>
  <text x="1046.779661016949" y="372.962962962963" text-anchor="middle" font-size="16.721942236646" fill="var(--ok-text)" font-family="Arial, sans-serif">Holds credentials</text>
  <text x="1046.779661016949" y="458.888888888889" text-anchor="middle" font-size="16.721942236646" fill="var(--ok-text)" font-family="Arial, sans-serif">An action in the world</text>

  <!-- Bottom caption -->
  <text x="629.830508474576" y="620" text-anchor="middle" font-size="18.812185016227" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Different pressures → different answers; mature systems layer all three</text>
</svg>

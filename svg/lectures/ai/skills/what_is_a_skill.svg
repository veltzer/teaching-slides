<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="425.714285714286" y="40" width="428.571428571429" height="128.888888888889" rx="6.436503043468" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="88.333333333333" text-anchor="middle" font-size="27.891513188361" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">A Skill</text>
  <text x="640" y="125.925925925926" text-anchor="middle" font-size="18.236758623159" fill="var(--primary-text)" font-family="Arial, sans-serif">A folder of instructions + assets</text>
  <text x="640" y="152.777777777778" text-anchor="middle" font-size="18.236758623159" fill="var(--primary-text)" font-family="Arial, sans-serif">an agent loads only when relevant</text>

  <rect x="40" y="265.555555555556" width="364.285714285714" height="193.333333333333" rx="6.436503043468" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.142857142857" y="308.518518518519" text-anchor="middle" font-size="23.600511159382" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Procedural knowledge</text>
  <text x="222.142857142857" y="351.481481481482" text-anchor="middle" font-size="17.164008115914" fill="var(--ok-text)" font-family="Arial, sans-serif">"How to do X, step by step"</text>
  <text x="222.142857142857" y="389.074074074074" text-anchor="middle" font-size="17.164008115914" fill="var(--ok-text)" font-family="Arial, sans-serif">Captured once, reused forever</text>
  <text x="222.142857142857" y="426.666666666667" text-anchor="middle" font-size="17.164008115914" fill="var(--ok-text)" font-family="Arial, sans-serif">Written in plain Markdown</text>

  <rect x="457.857142857143" y="265.555555555556" width="364.285714285714" height="193.333333333333" rx="6.436503043468" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="308.518518518519" text-anchor="middle" font-size="23.600511159382" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Loaded on demand</text>
  <text x="640" y="351.481481481482" text-anchor="middle" font-size="17.164008115914" fill="var(--info-text)" font-family="Arial, sans-serif">Only its name + description</text>
  <text x="640" y="389.074074074074" text-anchor="middle" font-size="17.164008115914" fill="var(--info-text)" font-family="Arial, sans-serif">sit in context until needed</text>
  <text x="640" y="426.666666666667" text-anchor="middle" font-size="17.164008115914" fill="var(--info-text)" font-family="Arial, sans-serif">Saves tokens, scales to many</text>

  <rect x="875.714285714286" y="265.555555555556" width="364.285714285714" height="193.333333333333" rx="6.436503043468" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.857142857143" y="308.518518518519" text-anchor="middle" font-size="23.600511159382" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Composable</text>
  <text x="1057.857142857143" y="351.481481481482" text-anchor="middle" font-size="17.164008115914" fill="var(--warn-text)" font-family="Arial, sans-serif">Share, version, swap</text>
  <text x="1057.857142857143" y="389.074074074074" text-anchor="middle" font-size="17.164008115914" fill="var(--warn-text)" font-family="Arial, sans-serif">Stack many on one agent</text>
  <text x="1057.857142857143" y="426.666666666667" text-anchor="middle" font-size="17.164008115914" fill="var(--warn-text)" font-family="Arial, sans-serif">Model-agnostic idea</text>

  <line x1="554.285714285714" y1="168.888888888889" x2="297.142857142857" y2="260.185185185185" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="640" y1="168.888888888889" x2="640" y2="260.185185185185" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="725.714285714286" y1="168.888888888889" x2="982.857142857143" y2="260.185185185185" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <rect x="40" y="512.592592592593" width="1200" height="107.407407407407" rx="6.436503043468" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="555.555555555556" text-anchor="middle" font-size="19.309509130404" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Not a model change — not training, not fine-tuning</text>
  <text x="640" y="593.148148148148" text-anchor="middle" font-size="17.164008115914" fill="var(--text-muted)" font-family="Arial, sans-serif">A skill teaches the agent at run time, the same way a runbook teaches a new hire</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="382.758620689655" height="262.641509433962" rx="6.383942119187" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="83.77358490566" text-anchor="middle" font-size="21.279807063957" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Kitchen-sink skill</text>
  <text x="231.379310344828" y="133.018867924528" text-anchor="middle" font-size="15.959855297968" fill="var(--danger-text)" font-family="Arial, sans-serif">One skill that "does everything"</text>
  <text x="231.379310344828" y="171.320754716981" text-anchor="middle" font-size="15.959855297968" fill="var(--danger-text)" font-family="Arial, sans-serif">Vague trigger, bloated body</text>
  <text x="231.379310344828" y="220.566037735849" text-anchor="middle" font-size="15.959855297968" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Fix: split by single purpose</text>
  <text x="231.379310344828" y="258.867924528302" text-anchor="middle" font-size="15.959855297968" fill="var(--danger-text)" font-family="Arial, sans-serif">one skill, one job</text>

  <rect x="448.620689655172" y="40" width="382.758620689655" height="262.641509433962" rx="6.383942119187" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.77358490566" text-anchor="middle" font-size="21.279807063957" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Overlapping skills</text>
  <text x="640" y="133.018867924528" text-anchor="middle" font-size="15.959855297968" fill="var(--danger-text)" font-family="Arial, sans-serif">Two descriptions both match</text>
  <text x="640" y="171.320754716981" text-anchor="middle" font-size="15.959855297968" fill="var(--danger-text)" font-family="Arial, sans-serif">Agent picks unpredictably</text>
  <text x="640" y="220.566037735849" text-anchor="middle" font-size="15.959855297968" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Fix: make boundaries crisp</text>
  <text x="640" y="258.867924528302" text-anchor="middle" font-size="15.959855297968" fill="var(--danger-text)" font-family="Arial, sans-serif">disjoint "use when" lines</text>

  <rect x="857.241379310345" y="40" width="382.758620689655" height="262.641509433962" rx="6.383942119187" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="83.77358490566" text-anchor="middle" font-size="21.279807063957" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Untrusted skills</text>
  <text x="1048.620689655173" y="133.018867924528" text-anchor="middle" font-size="15.959855297968" fill="var(--danger-text)" font-family="Arial, sans-serif">A skill can run code &amp;</text>
  <text x="1048.620689655173" y="171.320754716981" text-anchor="middle" font-size="15.959855297968" fill="var(--danger-text)" font-family="Arial, sans-serif">inject instructions</text>
  <text x="1048.620689655173" y="220.566037735849" text-anchor="middle" font-size="15.959855297968" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Fix: review before install</text>
  <text x="1048.620689655173" y="258.867924528302" text-anchor="middle" font-size="15.959855297968" fill="var(--danger-text)" font-family="Arial, sans-serif">treat like a dependency</text>

  <rect x="143.448275862069" y="357.358490566038" width="993.103448275862" height="262.641509433962" rx="6.383942119187" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="401.132075471698" text-anchor="middle" font-size="23.407787770353" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Habits that keep skills healthy</text>
  <text x="640" y="450.377358490566" text-anchor="middle" font-size="17.023845651166" fill="var(--ok-text)" font-family="Arial, sans-serif">Version skills in git; review diffs like code</text>
  <text x="640" y="488.679245283019" text-anchor="middle" font-size="17.023845651166" fill="var(--ok-text)" font-family="Arial, sans-serif">Keep each body lean; push detail to linked files</text>
  <text x="640" y="526.981132075472" text-anchor="middle" font-size="17.023845651166" fill="var(--ok-text)" font-family="Arial, sans-serif">Sandbox what bundled scripts may touch</text>
  <text x="640" y="565.283018867925" text-anchor="middle" font-size="17.023845651166" fill="var(--ok-text)" font-family="Arial, sans-serif">Re-test descriptions when you add a skill</text>
  <text x="640" y="603.584905660377" text-anchor="middle" font-size="17.023845651166" fill="var(--ok-text)" font-family="Arial, sans-serif">Prefer many small skills over a few broad ones</text>
</svg>

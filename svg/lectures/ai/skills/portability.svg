<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="484.827586206897" y="40" width="310.344827586207" height="174.436090225564" rx="6.371930928643" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="105.413533834586" text-anchor="middle" font-size="25.487723714572" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">code-review/</text>
  <text x="640" y="149.022556390977" text-anchor="middle" font-size="16.991815809715" fill="var(--warn-text)" font-family="Arial, sans-serif">One Markdown skill folder</text>
  <text x="640" y="181.729323308271" text-anchor="middle" font-size="16.991815809715" fill="var(--warn-text)" font-family="Arial, sans-serif">No vendor lock-in</text>

  <rect x="40" y="334.360902255639" width="268.965517241379" height="185.338345864662" rx="6.371930928643" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="174.48275862069" y="388.872180451128" text-anchor="middle" font-size="21.239769762144" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Claude Code</text>
  <text x="174.48275862069" y="432.481203007519" text-anchor="middle" font-size="15.929827321608" fill="var(--primary-text)" font-family="Arial, sans-serif">drop in .claude/skills</text>
  <text x="174.48275862069" y="470.639097744361" text-anchor="middle" font-size="15.929827321608" fill="var(--primary-text)" font-family="Arial, sans-serif">Reads SKILL.md</text>

  <rect x="340" y="334.360902255639" width="268.965517241379" height="185.338345864662" rx="6.371930928643" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="474.48275862069" y="388.872180451128" text-anchor="middle" font-size="21.239769762144" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Claude API</text>
  <text x="474.48275862069" y="432.481203007519" text-anchor="middle" font-size="15.929827321608" fill="var(--primary-text)" font-family="Arial, sans-serif">Agent SDK loads it</text>
  <text x="474.48275862069" y="470.639097744361" text-anchor="middle" font-size="15.929827321608" fill="var(--primary-text)" font-family="Arial, sans-serif">as a skill source</text>

  <rect x="640" y="334.360902255639" width="268.965517241379" height="185.338345864662" rx="6.371930928643" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="774.48275862069" y="388.872180451128" text-anchor="middle" font-size="21.239769762144" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Other LLM agent</text>
  <text x="774.48275862069" y="432.481203007519" text-anchor="middle" font-size="15.929827321608" fill="var(--info-text)" font-family="Arial, sans-serif">Inject description,</text>
  <text x="774.48275862069" y="470.639097744361" text-anchor="middle" font-size="15.929827321608" fill="var(--info-text)" font-family="Arial, sans-serif">read body on match</text>

  <rect x="940" y="334.360902255639" width="300" height="185.338345864662" rx="6.371930928643" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="388.872180451128" text-anchor="middle" font-size="21.239769762144" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Your own harness</text>
  <text x="1090" y="432.481203007519" text-anchor="middle" font-size="15.929827321608" fill="var(--info-text)" font-family="Arial, sans-serif">Parse front matter,</text>
  <text x="1090" y="470.639097744361" text-anchor="middle" font-size="15.929827321608" fill="var(--info-text)" font-family="Arial, sans-serif">load files on demand</text>

  <line x1="598.620689655172" y1="214.436090225564" x2="205.51724137931" y2="332.18045112782" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="614.137931034483" y1="214.436090225564" x2="484.827586206897" y2="332.18045112782" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="665.862068965517" y1="214.436090225564" x2="764.137931034483" y2="332.18045112782" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="691.724137931035" y1="214.436090225564" x2="1074.48275862069" y2="332.18045112782" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="579.661654135338" text-anchor="middle" font-size="19.115792785929" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A skill is just files + a convention — any agent that reads files can use it</text>
  <text x="640" y="620" text-anchor="middle" font-size="15.929827321608" fill="var(--text-muted)" font-family="Arial, sans-serif">The loading mechanism differs per platform; the artifact does not</text>
</svg>

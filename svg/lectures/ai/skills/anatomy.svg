<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="434.48275862069" height="580" rx="6.210590034081" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="257.241379310345" y="81.428571428571" text-anchor="middle" font-size="22.772163458298" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">pdf-processing/</text>
  <text x="81.379310344828" y="133.214285714286" font-size="18.631770102244" fill="var(--text)" font-family="Courier New, monospace">SKILL.md</text>
  <text x="81.379310344828" y="195.357142857143" font-size="18.631770102244" fill="var(--text-muted)" font-family="Courier New, monospace">reference.md</text>
  <text x="81.379310344828" y="257.5" font-size="18.631770102244" fill="var(--text-muted)" font-family="Courier New, monospace">forms.md</text>
  <text x="81.379310344828" y="319.642857142857" font-size="18.631770102244" fill="var(--text-muted)" font-family="Courier New, monospace">scripts/fill.py</text>
  <text x="81.379310344828" y="381.785714285714" font-size="18.631770102244" fill="var(--text-muted)" font-family="Courier New, monospace">scripts/split.py</text>
  <text x="81.379310344828" y="443.928571428572" font-size="18.631770102244" fill="var(--text-muted)" font-family="Courier New, monospace">templates/w2.pdf</text>
  <text x="257.241379310345" y="547.5" text-anchor="middle" font-size="15.526475085203" fill="var(--text-faint)" font-family="Arial, sans-serif">One self-contained folder</text>
  <text x="257.241379310345" y="576.5" text-anchor="middle" font-size="15.526475085203" fill="var(--text-faint)" font-family="Arial, sans-serif">that you can copy, zip, or commit</text>

  <rect x="536.551724137931" y="40" width="703.448275862069" height="186.428571428571" rx="6.210590034081" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="888.275862068966" y="81.428571428571" text-anchor="middle" font-size="22.772163458298" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">SKILL.md — the entry point (required)</text>
  <text x="888.275862068966" y="122.857142857143" text-anchor="middle" font-size="17.59667176323" fill="var(--primary-text)" font-family="Arial, sans-serif">YAML front matter: name + description</text>
  <text x="888.275862068966" y="159.107142857143" text-anchor="middle" font-size="17.59667176323" fill="var(--primary-text)" font-family="Arial, sans-serif">Body: the actual instructions in Markdown</text>
  <text x="888.275862068966" y="195.357142857143" text-anchor="middle" font-size="17.59667176323" fill="var(--primary-text)" font-family="Arial, sans-serif">Links to other files for the deep detail</text>

  <rect x="536.551724137931" y="267.857142857143" width="341.379310344828" height="155.357142857143" rx="6.210590034081" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="707.241379310345" y="309.285714285714" text-anchor="middle" font-size="20.701966780271" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Linked docs</text>
  <text x="707.241379310345" y="350.714285714286" text-anchor="middle" font-size="16.561573424217" fill="var(--info-text)" font-family="Arial, sans-serif">reference.md, forms.md</text>
  <text x="707.241379310345" y="386.964285714286" text-anchor="middle" font-size="16.561573424217" fill="var(--info-text)" font-family="Arial, sans-serif">Read only when needed</text>

  <rect x="898.620689655172" y="267.857142857143" width="341.379310344828" height="155.357142857143" rx="6.210590034081" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1069.310344827586" y="309.285714285714" text-anchor="middle" font-size="20.701966780271" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Bundled assets</text>
  <text x="1069.310344827586" y="350.714285714286" text-anchor="middle" font-size="16.561573424217" fill="var(--ok-text)" font-family="Arial, sans-serif">Scripts, templates, data</text>
  <text x="1069.310344827586" y="386.964285714286" text-anchor="middle" font-size="16.561573424217" fill="var(--ok-text)" font-family="Arial, sans-serif">Executed, not read into context</text>

  <rect x="536.551724137931" y="464.642857142857" width="703.448275862069" height="155.357142857143" rx="6.210590034081" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="888.275862068966" y="506.071428571429" text-anchor="middle" font-size="20.701966780271" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Key idea: layered detail</text>
  <text x="888.275862068966" y="547.5" text-anchor="middle" font-size="16.561573424217" fill="var(--warn-text)" font-family="Arial, sans-serif">The agent reads SKILL.md first, then follows links only</text>
  <text x="888.275862068966" y="583.75" text-anchor="middle" font-size="16.561573424217" fill="var(--warn-text)" font-family="Arial, sans-serif">as far down as the task actually requires</text>

  <line x1="474.48275862069" y1="128.035714285714" x2="531.379310344828" y2="128.035714285714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
</svg>

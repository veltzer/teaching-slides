<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="579.310344827586" height="262.641509433962" rx="6.383942119187" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="89.245283018868" text-anchor="middle" font-size="23.407787770353" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Weak description</text>
  <text x="329.655172413793" y="143.962264150943" text-anchor="middle" font-size="19.151826357562" fill="var(--danger-text)" font-family="Courier New, monospace">"Helps with documents"</text>
  <text x="329.655172413793" y="204.150943396226" text-anchor="middle" font-size="17.023845651166" fill="var(--danger-text)" font-family="Arial, sans-serif">No trigger words</text>
  <text x="329.655172413793" y="242.452830188679" text-anchor="middle" font-size="17.023845651166" fill="var(--danger-text)" font-family="Arial, sans-serif">Agent cannot tell when to use it</text>
  <text x="329.655172413793" y="280.754716981132" text-anchor="middle" font-size="17.023845651166" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Skill silently never fires</text>

  <rect x="660.689655172414" y="40" width="579.310344827586" height="262.641509433962" rx="6.383942119187" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="89.245283018868" text-anchor="middle" font-size="23.407787770353" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Strong description</text>
  <text x="950.344827586207" y="138.490566037736" text-anchor="middle" font-size="15.959855297968" fill="var(--ok-text)" font-family="Courier New, monospace">"Fill, split, and extract text from</text>
  <text x="950.344827586207" y="165.849056603774" text-anchor="middle" font-size="15.959855297968" fill="var(--ok-text)" font-family="Courier New, monospace">PDF forms. Use when the user</text>
  <text x="950.344827586207" y="193.207547169811" text-anchor="middle" font-size="15.959855297968" fill="var(--ok-text)" font-family="Courier New, monospace">mentions PDFs or form fields."</text>
  <text x="950.344827586207" y="242.452830188679" text-anchor="middle" font-size="17.023845651166" fill="var(--ok-text)" font-family="Arial, sans-serif">States what it does + when to use it</text>
  <text x="950.344827586207" y="280.754716981132" text-anchor="middle" font-size="17.023845651166" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Fires reliably on the right tasks</text>

  <rect x="143.448275862069" y="368.301886792453" width="993.103448275862" height="251.698113207547" rx="6.383942119187" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="412.075471698113" text-anchor="middle" font-size="21.279807063957" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Write the description for the matcher</text>
  <text x="640" y="461.320754716981" text-anchor="middle" font-size="18.087836004364" fill="var(--text-muted)" font-family="Arial, sans-serif">1. State the capability in concrete terms</text>
  <text x="640" y="499.622641509434" text-anchor="middle" font-size="18.087836004364" fill="var(--text-muted)" font-family="Arial, sans-serif">2. List the triggers users would say</text>
  <text x="640" y="537.924528301887" text-anchor="middle" font-size="18.087836004364" fill="var(--text-muted)" font-family="Arial, sans-serif">3. Add "use when…" so the model knows the boundary</text>
  <text x="640" y="581.698113207547" text-anchor="middle" font-size="17.023845651166" font-style="italic" fill="var(--text-faint)" font-family="Arial, sans-serif">A great body is useless if the description never wins the match</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="140" y="40" width="350" height="122.692307692308" rx="7.084652969081" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315" y="90.192307692308" text-anchor="middle" font-size="23.615509896937" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">1. Do it once by hand</text>
  <text x="315" y="129.230769230769" text-anchor="middle" font-size="17.711632422702" fill="var(--primary-text)" font-family="Arial, sans-serif">Watch what the agent struggles with</text>

  <rect x="790" y="40" width="350" height="122.692307692308" rx="7.084652969081" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965" y="90.192307692308" text-anchor="middle" font-size="23.615509896937" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">2. Capture the steps</text>
  <text x="965" y="129.230769230769" text-anchor="middle" font-size="17.711632422702" fill="var(--info-text)" font-family="Arial, sans-serif">Write SKILL.md + a sharp description</text>

  <rect x="790" y="285.384615384615" width="350" height="122.692307692308" rx="7.084652969081" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965" y="335.576923076923" text-anchor="middle" font-size="23.615509896937" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">3. Test on real tasks</text>
  <text x="965" y="374.615384615385" text-anchor="middle" font-size="17.711632422702" fill="var(--warn-text)" font-family="Arial, sans-serif">Does it fire? Does it succeed?</text>

  <rect x="140" y="285.384615384615" width="350" height="122.692307692308" rx="7.084652969081" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315" y="335.576923076923" text-anchor="middle" font-size="23.615509896937" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">4. Refine &amp; trim</text>
  <text x="315" y="374.615384615385" text-anchor="middle" font-size="17.711632422702" fill="var(--ok-text)" font-family="Arial, sans-serif">Cut noise, move detail to linked files</text>

  <line x1="490" y1="101.346153846154" x2="783.75" y2="101.346153846154" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="965" y1="162.692307692308" x2="965" y2="279.807692307692" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="346.730769230769" x2="496.25" y2="346.730769230769" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="285.384615384615" x2="315" y2="168.269230769231" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="235.192307692308" text-anchor="middle" font-size="17.711632422702" font-style="italic" fill="var(--text-faint)" font-family="Arial, sans-serif">iterate until reliable</text>

  <rect x="40" y="463.846153846154" width="1200" height="156.153846153846" rx="7.084652969081" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="508.461538461539" text-anchor="middle" font-size="22.43473440209" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Treat a skill like documentation, not like code</text>
  <text x="640" y="553.076923076923" text-anchor="middle" font-size="18.892407917549" fill="var(--text-muted)" font-family="Arial, sans-serif">Write for the agent as a capable but forgetful colleague</text>
  <text x="640" y="592.115384615385" text-anchor="middle" font-size="18.892407917549" fill="var(--text-muted)" font-family="Arial, sans-serif">Shorter and clearer beats longer and exhaustive</text>
</svg>

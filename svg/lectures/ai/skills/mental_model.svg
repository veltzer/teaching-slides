<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="372.142857142857" y="40" width="535.714285714286" height="128.888888888889" rx="6.436503043468" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="93.703703703704" text-anchor="middle" font-size="27.891513188361" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">A skill = onboarding a colleague</text>
  <text x="640" y="136.666666666667" text-anchor="middle" font-size="18.236758623159" fill="var(--primary-text)" font-family="Arial, sans-serif">Capable generalist + a good runbook = reliable specialist</text>

  <rect x="40" y="244.074074074074" width="375" height="182.592592592593" rx="6.436503043468" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.5" y="292.407407407407" text-anchor="middle" font-size="21.455010144893" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">The model</text>
  <text x="227.5" y="335.37037037037" text-anchor="middle" font-size="17.164008115914" fill="var(--ok-text)" font-family="Arial, sans-serif">General intelligence</text>
  <text x="227.5" y="372.962962962963" text-anchor="middle" font-size="17.164008115914" fill="var(--ok-text)" font-family="Arial, sans-serif">Knows how to think</text>
  <text x="227.5" y="405.185185185185" text-anchor="middle" font-size="17.164008115914" fill="var(--ok-text)" font-family="Arial, sans-serif">Lacks your specifics</text>

  <rect x="452.5" y="244.074074074074" width="375" height="182.592592592593" rx="6.436503043468" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="292.407407407407" text-anchor="middle" font-size="21.455010144893" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">The skill</text>
  <text x="640" y="335.37037037037" text-anchor="middle" font-size="17.164008115914" fill="var(--info-text)" font-family="Arial, sans-serif">Your procedure</text>
  <text x="640" y="372.962962962963" text-anchor="middle" font-size="17.164008115914" fill="var(--info-text)" font-family="Arial, sans-serif">Loaded on demand</text>
  <text x="640" y="405.185185185185" text-anchor="middle" font-size="17.164008115914" fill="var(--info-text)" font-family="Arial, sans-serif">Edited like docs</text>

  <rect x="865" y="244.074074074074" width="375" height="182.592592592593" rx="6.436503043468" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.5" y="292.407407407407" text-anchor="middle" font-size="21.455010144893" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">The result</text>
  <text x="1052.5" y="335.37037037037" text-anchor="middle" font-size="17.164008115914" fill="var(--warn-text)" font-family="Arial, sans-serif">Task done your way</text>
  <text x="1052.5" y="372.962962962963" text-anchor="middle" font-size="17.164008115914" fill="var(--warn-text)" font-family="Arial, sans-serif">Repeatable, sharable</text>
  <text x="1052.5" y="405.185185185185" text-anchor="middle" font-size="17.164008115914" fill="var(--warn-text)" font-family="Arial, sans-serif">No retraining</text>

  <line x1="415" y1="335.37037037037" x2="450.357142857143" y2="335.37037037037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="827.5" y1="335.37037037037" x2="862.857142857143" y2="335.37037037037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="227.5" y1="244.074074074074" x2="490" y2="174.259259259259" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="244.074074074074" x2="640" y2="174.259259259259" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="125.714285714286" y="480.37037037037" width="1028.571428571428" height="139.62962962963" rx="6.436503043468" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="523.333333333333" text-anchor="middle" font-size="19.309509130404" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Skills move expertise out of people's heads and into versioned, reusable files</text>
  <text x="640" y="566.296296296296" text-anchor="middle" font-size="17.164008115914" fill="var(--text-muted)" font-family="Arial, sans-serif">Start small: capture one repetitive task you do today as a single SKILL.md</text>
  <text x="640" y="603.888888888889" text-anchor="middle" font-size="17.164008115914" fill="var(--text-muted)" font-family="Arial, sans-serif">Grow a library; let your agents specialize without ever touching the weights</text>
</svg>

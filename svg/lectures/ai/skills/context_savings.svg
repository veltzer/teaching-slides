<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="270.769230769231" y="40" text-anchor="middle" font-size="25.58044124637" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Stuff everything in the prompt</text>
  <rect x="40" y="63.434343434343" width="461.538461538461" height="503.838383838384" rx="6.976483976283" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="270.769230769231" y="122.020202020202" text-anchor="middle" font-size="19.766704599468" fill="var(--danger-text)" font-family="Arial, sans-serif">All 30 procedures, always</text>
  <text x="270.769230769231" y="180.606060606061" text-anchor="middle" font-size="19.766704599468" fill="var(--danger-text)" font-family="Arial, sans-serif">~80k tokens before the task</text>
  <text x="270.769230769231" y="239.191919191919" text-anchor="middle" font-size="19.766704599468" fill="var(--danger-text)" font-family="Arial, sans-serif">Slower, pricier per call</text>
  <text x="270.769230769231" y="297.777777777778" text-anchor="middle" font-size="19.766704599468" fill="var(--danger-text)" font-family="Arial, sans-serif">Irrelevant detail distracts</text>
  <text x="270.769230769231" y="356.363636363636" text-anchor="middle" font-size="19.766704599468" fill="var(--danger-text)" font-family="Arial, sans-serif">Hits the context window</text>
  <text x="270.769230769231" y="414.949494949495" text-anchor="middle" font-size="19.766704599468" fill="var(--danger-text)" font-family="Arial, sans-serif">Hard to maintain one blob</text>
  <text x="270.769230769231" y="496.969696969697" text-anchor="middle" font-size="22.092199258228" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Does not scale</text>

  <text x="1009.230769230769" y="40" text-anchor="middle" font-size="25.58044124637" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Skills with progressive disclosure</text>
  <rect x="778.461538461538" y="63.434343434343" width="461.538461538461" height="503.838383838384" rx="6.976483976283" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1009.230769230769" y="122.020202020202" text-anchor="middle" font-size="19.766704599468" fill="var(--ok-text)" font-family="Arial, sans-serif">30 one-line descriptions</text>
  <text x="1009.230769230769" y="180.606060606061" text-anchor="middle" font-size="19.766704599468" fill="var(--ok-text)" font-family="Arial, sans-serif">~1k tokens at rest</text>
  <text x="1009.230769230769" y="239.191919191919" text-anchor="middle" font-size="19.766704599468" fill="var(--ok-text)" font-family="Arial, sans-serif">Load the 1 you need</text>
  <text x="1009.230769230769" y="297.777777777778" text-anchor="middle" font-size="19.766704599468" fill="var(--ok-text)" font-family="Arial, sans-serif">Focused, relevant context</text>
  <text x="1009.230769230769" y="356.363636363636" text-anchor="middle" font-size="19.766704599468" fill="var(--ok-text)" font-family="Arial, sans-serif">Room left for the real work</text>
  <text x="1009.230769230769" y="414.949494949495" text-anchor="middle" font-size="19.766704599468" fill="var(--ok-text)" font-family="Arial, sans-serif">Each skill edited alone</text>
  <text x="1009.230769230769" y="496.969696969697" text-anchor="middle" font-size="22.092199258228" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Scales to hundreds</text>

  <line x1="507.307692307692" y1="315.353535353535" x2="772.692307692308" y2="315.353535353535" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="640" y="620" text-anchor="middle" font-size="18.603957270087" font-style="italic" fill="var(--text-muted)" font-family="Arial, sans-serif">Token counts are illustrative — the point is the gap, not the exact numbers</text>
</svg>

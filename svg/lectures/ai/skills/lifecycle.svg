<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="203.389830508475" height="151.304347826087" rx="6.794162824757" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="141.694915254237" y="96.739130434783" text-anchor="middle" font-size="22.647209415858" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. Discover</text>
  <text x="141.694915254237" y="138.347826086957" text-anchor="middle" font-size="15.8530465911" fill="var(--text-muted)" font-family="Arial, sans-serif">Agent sees all</text>
  <text x="141.694915254237" y="163.565217391304" text-anchor="middle" font-size="15.8530465911" fill="var(--text-muted)" font-family="Arial, sans-serif">skill descriptions</text>

  <rect x="294.237288135593" y="40" width="203.389830508475" height="151.304347826087" rx="6.794162824757" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395.932203389831" y="96.739130434783" text-anchor="middle" font-size="22.647209415858" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">2. Match</text>
  <text x="395.932203389831" y="138.347826086957" text-anchor="middle" font-size="15.8530465911" fill="var(--primary-text)" font-family="Arial, sans-serif">User request maps</text>
  <text x="395.932203389831" y="163.565217391304" text-anchor="middle" font-size="15.8530465911" fill="var(--primary-text)" font-family="Arial, sans-serif">to a description</text>

  <rect x="548.474576271186" y="40" width="203.389830508475" height="151.304347826087" rx="6.794162824757" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.169491525424" y="96.739130434783" text-anchor="middle" font-size="22.647209415858" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">3. Load</text>
  <text x="650.169491525424" y="138.347826086957" text-anchor="middle" font-size="15.8530465911" fill="var(--info-text)" font-family="Arial, sans-serif">SKILL.md body</text>
  <text x="650.169491525424" y="163.565217391304" text-anchor="middle" font-size="15.8530465911" fill="var(--info-text)" font-family="Arial, sans-serif">enters context</text>

  <rect x="802.71186440678" y="40" width="203.389830508475" height="151.304347826087" rx="6.794162824757" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="904.406779661017" y="96.739130434783" text-anchor="middle" font-size="22.647209415858" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">4. Execute</text>
  <text x="904.406779661017" y="138.347826086957" text-anchor="middle" font-size="15.8530465911" fill="var(--warn-text)" font-family="Arial, sans-serif">Follow steps,</text>
  <text x="904.406779661017" y="163.565217391304" text-anchor="middle" font-size="15.8530465911" fill="var(--warn-text)" font-family="Arial, sans-serif">run scripts</text>

  <rect x="1056.949152542373" y="40" width="183.050847457627" height="151.304347826087" rx="6.794162824757" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1148.474576271186" y="96.739130434783" text-anchor="middle" font-size="22.647209415858" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">5. Result</text>
  <text x="1148.474576271186" y="138.347826086957" text-anchor="middle" font-size="15.8530465911" fill="var(--ok-text)" font-family="Arial, sans-serif">Task done the</text>
  <text x="1148.474576271186" y="163.565217391304" text-anchor="middle" font-size="15.8530465911" fill="var(--ok-text)" font-family="Arial, sans-serif">prescribed way</text>

  <line x1="243.389830508475" y1="115.652173913043" x2="292.203389830509" y2="115.652173913043" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="497.627118644068" y1="115.652173913043" x2="546.440677966102" y2="115.652173913043" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="751.864406779661" y1="115.652173913043" x2="800.677966101695" y2="115.652173913043" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1006.101694915254" y1="115.652173913043" x2="1054.915254237288" y2="115.652173913043" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="192.542372881356" y="342.608695652174" width="894.915254237288" height="277.391304347826" rx="6.794162824757" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="393.04347826087" text-anchor="middle" font-size="22.647209415858" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The model decides — no rule engine</text>
  <text x="640" y="449.782608695652" text-anchor="middle" font-size="19.250128003479" fill="var(--text-muted)" font-family="Arial, sans-serif">Matching is semantic: the LLM reads the descriptions and judges fit</text>
  <text x="640" y="493.913043478261" text-anchor="middle" font-size="19.250128003479" fill="var(--text-muted)" font-family="Arial, sans-serif">So the description is the single most important field you write</text>
  <text x="640" y="550.652173913043" text-anchor="middle" font-size="19.250128003479" fill="var(--text-muted)" font-family="Arial, sans-serif">A vague description means a skill that never fires</text>
  <text x="640" y="592.260869565217" text-anchor="middle" font-size="16.985407061893" font-style="italic" fill="var(--text-faint)" font-family="Arial, sans-serif">Steps 3–5 may repeat as the agent pulls in deeper files</text>
</svg>

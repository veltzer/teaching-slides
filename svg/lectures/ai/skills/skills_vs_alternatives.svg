<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="289.830508474576" height="580" rx="6.270728338742" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.406779661017" y="82.962962962963" text-anchor="middle" font-size="22.992670575388" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Skill</text>
  <text x="184.406779661017" y="136.666666666667" text-anchor="middle" font-size="15.676820846856" fill="var(--primary-text)" font-family="Arial, sans-serif">Teaches a procedure:</text>
  <text x="184.406779661017" y="168.888888888889" text-anchor="middle" font-size="15.676820846856" fill="var(--primary-text)" font-family="Arial, sans-serif">"how to do the task"</text>
  <text x="184.406779661017" y="233.333333333333" text-anchor="middle" font-size="15.676820846856" fill="var(--primary-text)" font-family="Arial, sans-serif">Markdown + assets</text>
  <text x="184.406779661017" y="297.777777777778" text-anchor="middle" font-size="15.676820846856" fill="var(--primary-text)" font-family="Arial, sans-serif">Loaded on demand</text>
  <text x="184.406779661017" y="362.222222222222" text-anchor="middle" font-size="15.676820846856" fill="var(--primary-text)" font-family="Arial, sans-serif">Author with no code</text>
  <text x="184.406779661017" y="426.666666666667" text-anchor="middle" font-size="15.676820846856" fill="var(--primary-text)" font-family="Arial, sans-serif">Portable folder</text>

  <rect x="350.169491525424" y="40" width="289.830508474576" height="580" rx="6.270728338742" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="494.576271186441" y="82.962962962963" text-anchor="middle" font-size="22.992670575388" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Tool / MCP</text>
  <text x="494.576271186441" y="136.666666666667" text-anchor="middle" font-size="15.676820846856" fill="var(--info-text)" font-family="Arial, sans-serif">Gives a capability:</text>
  <text x="494.576271186441" y="168.888888888889" text-anchor="middle" font-size="15.676820846856" fill="var(--info-text)" font-family="Arial, sans-serif">"can call this action"</text>
  <text x="494.576271186441" y="233.333333333333" text-anchor="middle" font-size="15.676820846856" fill="var(--info-text)" font-family="Arial, sans-serif">Code / API endpoint</text>
  <text x="494.576271186441" y="297.777777777778" text-anchor="middle" font-size="15.676820846856" fill="var(--info-text)" font-family="Arial, sans-serif">Schema always loaded</text>
  <text x="494.576271186441" y="362.222222222222" text-anchor="middle" font-size="15.676820846856" fill="var(--info-text)" font-family="Arial, sans-serif">Needs a server / runtime</text>
  <text x="494.576271186441" y="426.666666666667" text-anchor="middle" font-size="15.676820846856" fill="var(--info-text)" font-family="Arial, sans-serif">Skills often call tools</text>

  <rect x="660.338983050847" y="40" width="289.830508474576" height="580" rx="6.270728338742" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="804.745762711864" y="82.962962962963" text-anchor="middle" font-size="22.992670575388" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">RAG</text>
  <text x="804.745762711864" y="136.666666666667" text-anchor="middle" font-size="15.676820846856" fill="var(--ok-text)" font-family="Arial, sans-serif">Supplies facts:</text>
  <text x="804.745762711864" y="168.888888888889" text-anchor="middle" font-size="15.676820846856" fill="var(--ok-text)" font-family="Arial, sans-serif">"what is true / known"</text>
  <text x="804.745762711864" y="233.333333333333" text-anchor="middle" font-size="15.676820846856" fill="var(--ok-text)" font-family="Arial, sans-serif">Vector search results</text>
  <text x="804.745762711864" y="297.777777777778" text-anchor="middle" font-size="15.676820846856" fill="var(--ok-text)" font-family="Arial, sans-serif">Retrieved per query</text>
  <text x="804.745762711864" y="362.222222222222" text-anchor="middle" font-size="15.676820846856" fill="var(--ok-text)" font-family="Arial, sans-serif">Declarative knowledge</text>
  <text x="804.745762711864" y="426.666666666667" text-anchor="middle" font-size="15.676820846856" fill="var(--ok-text)" font-family="Arial, sans-serif">Not step-by-step</text>

  <rect x="970.508474576271" y="40" width="269.491525423729" height="580" rx="6.270728338742" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1104.745762711864" y="82.962962962963" text-anchor="middle" font-size="22.992670575388" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Fine-tuning</text>
  <text x="1104.745762711864" y="136.666666666667" text-anchor="middle" font-size="15.676820846856" fill="var(--warn-text)" font-family="Arial, sans-serif">Reshapes the model:</text>
  <text x="1104.745762711864" y="168.888888888889" text-anchor="middle" font-size="15.676820846856" fill="var(--warn-text)" font-family="Arial, sans-serif">"baked-in behaviour"</text>
  <text x="1104.745762711864" y="233.333333333333" text-anchor="middle" font-size="15.676820846856" fill="var(--warn-text)" font-family="Arial, sans-serif">Weights change</text>
  <text x="1104.745762711864" y="297.777777777778" text-anchor="middle" font-size="15.676820846856" fill="var(--warn-text)" font-family="Arial, sans-serif">Costly, slow to update</text>
  <text x="1104.745762711864" y="362.222222222222" text-anchor="middle" font-size="15.676820846856" fill="var(--warn-text)" font-family="Arial, sans-serif">Hard to inspect</text>
  <text x="1104.745762711864" y="426.666666666667" text-anchor="middle" font-size="15.676820846856" fill="var(--warn-text)" font-family="Arial, sans-serif">Opaque to a reader</text>

  <text x="640" y="577.037037037037" text-anchor="middle" font-size="18.812185016227" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Complementary — a good agent uses all four</text>
  <text x="640" y="614.62962962963" text-anchor="middle" font-size="15.676820846856" fill="var(--text-muted)" font-family="Arial, sans-serif">Skills = procedure; tools = hands; RAG = memory; fine-tuning = instinct</text>
</svg>

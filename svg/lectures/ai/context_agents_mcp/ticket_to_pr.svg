<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="360" height="160" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="112.4" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">ticket</text>
  <text x="220" y="144.4" text-anchor="middle" font-size="22" fill="var(--warn-text)" font-family="Arial, sans-serif">read the acceptance criteria</text>
  <rect x="460" y="40" width="360" height="160" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="112.4" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">plan and edit</text>
  <text x="640" y="144.4" text-anchor="middle" font-size="22" fill="var(--primary-text)" font-family="Arial, sans-serif">under repo conventions</text>
  <rect x="880" y="40" width="360" height="160" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="112.4" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">test locally</text>
  <text x="1060" y="144.4" text-anchor="middle" font-size="22" fill="var(--ok-text)" font-family="Arial, sans-serif">iterate until green</text>
  <rect x="40" y="460" width="360" height="160" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="532.4" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">merge</text>
  <text x="220" y="564.4" text-anchor="middle" font-size="22" fill="var(--ok-text)" font-family="Arial, sans-serif">ticket closes itself</text>
  <rect x="460" y="460" width="360" height="160" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="532.4" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">CI and review</text>
  <text x="640" y="564.4" text-anchor="middle" font-size="22" fill="var(--info-text)" font-family="Arial, sans-serif">address every comment</text>
  <rect x="880" y="460" width="360" height="160" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="532.4" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">open PR</text>
  <text x="1060" y="564.4" text-anchor="middle" font-size="22" fill="var(--primary-text)" font-family="Arial, sans-serif">verification listed</text>
  <line x1="400" y1="120" x2="453" y2="120" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="820" y1="120" x2="873" y2="120" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="1060" y1="200" x2="1060" y2="453" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="880" y1="540" x2="827" y2="540" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="460" y1="540" x2="407" y2="540" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="640" y1="460" x2="640" y2="207" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-info)"/>
  <text x="660" y="340" text-anchor="start" font-size="15" fill="var(--text-muted)" font-family="Arial, sans-serif">review comments go back to edit</text>
  <rect x="40" y="280" width="460" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="270" y="323.3" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">a human approves the merge</text>
  <text x="270" y="349.3" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Arial, sans-serif">the agent never writes to main</text>
</svg>

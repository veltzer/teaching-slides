<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="280" height="80" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="75" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Medicine</text>
  <text x="180" y="100" text-anchor="middle" font-size="13" fill="var(--ok-text)" font-family="Arial, sans-serif">reads the scans</text>

  <rect x="347" y="40" width="280" height="80" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="75" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Finance</text>
  <text x="487" y="100" text-anchor="middle" font-size="13" fill="var(--primary-text)" font-family="Arial, sans-serif">spots the fraud</text>

  <rect x="653" y="40" width="280" height="80" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="793" y="75" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Law</text>
  <text x="793" y="100" text-anchor="middle" font-size="13" fill="var(--info-text)" font-family="Arial, sans-serif">reviews the contracts</text>

  <rect x="960" y="40" width="280" height="80" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="75" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Education</text>
  <text x="1100" y="100" text-anchor="middle" font-size="13" fill="var(--warn-text)" font-family="Arial, sans-serif">tutors every student</text>

  <rect x="40" y="190" width="280" height="90" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="228" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Art</text>
  <text x="180" y="253" text-anchor="middle" font-size="13" fill="var(--info-text)" font-family="Arial, sans-serif">paints on demand</text>

  <rect x="40" y="350" width="280" height="90" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="388" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Music</text>
  <text x="180" y="413" text-anchor="middle" font-size="13" fill="var(--warn-text)" font-family="Arial, sans-serif">composes and restores</text>

  <rect x="960" y="190" width="280" height="90" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="228" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Film</text>
  <text x="1100" y="253" text-anchor="middle" font-size="13" fill="var(--primary-text)" font-family="Arial, sans-serif">de-ages the stars</text>

  <rect x="960" y="350" width="280" height="90" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="388" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Sports</text>
  <text x="1100" y="413" text-anchor="middle" font-size="13" fill="var(--ok-text)" font-family="Arial, sans-serif">calls the lines</text>

  <rect x="40" y="540" width="280" height="80" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="575" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Science</text>
  <text x="180" y="600" text-anchor="middle" font-size="13" fill="var(--primary-text)" font-family="Arial, sans-serif">folds the proteins</text>

  <rect x="347" y="540" width="280" height="80" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="575" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Climate</text>
  <text x="487" y="600" text-anchor="middle" font-size="13" fill="var(--ok-text)" font-family="Arial, sans-serif">forecasts the weather</text>

  <rect x="653" y="540" width="280" height="80" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="793" y="575" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Agriculture</text>
  <text x="793" y="600" text-anchor="middle" font-size="13" fill="var(--warn-text)" font-family="Arial, sans-serif">sees every weed</text>

  <rect x="960" y="540" width="280" height="80" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="575" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Software</text>
  <text x="1100" y="600" text-anchor="middle" font-size="13" fill="var(--info-text)" font-family="Arial, sans-serif">just one of many!</text>

  <rect x="560" y="280" width="160" height="110" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="330" text-anchor="middle" font-size="36" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">AI</text>
  <text x="640" y="365" text-anchor="middle" font-size="13" fill="var(--primary-text)" font-family="Arial, sans-serif">one engine</text>

  <line x1="555" y1="310" x2="325" y2="240" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="555" y1="360" x2="325" y2="395" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="725" y1="310" x2="955" y2="240" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="725" y1="360" x2="955" y2="395" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="275" x2="490" y2="125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="275" x2="790" y2="125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="395" x2="490" y2="535" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="395" x2="790" y2="535" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="214" width="175.862068965517" height="116" rx="6.572670690062" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="127.931034482759" y="266.2" text-anchor="middle" font-size="24.099792530227" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">You</text>
  <text x="127.931034482759" y="301" text-anchor="middle" font-size="15.336231610145" fill="var(--ok-text)" font-family="Arial, sans-serif">write a prompt</text>

  <rect x="40" y="40" width="175.862068965517" height="92.8" rx="6.572670690062" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="127.931034482759" y="80.6" text-anchor="middle" font-size="19.718012070186" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Skill</text>
  <text x="127.931034482759" y="109.6" text-anchor="middle" font-size="14.240786495134" fill="var(--info-text)" font-family="Arial, sans-serif">packaged instructions</text>

  <rect x="288.275862068966" y="40" width="341.379310344828" height="440.8" rx="6.572670690062" fill="none" stroke="var(--border)" stroke-width="1"/>
  <text x="458.965517241379" y="80.6" text-anchor="middle" font-size="21.908902300207" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Context window</text>
  <text x="458.965517241379" y="107.28" text-anchor="middle" font-size="14.240786495134" fill="var(--text-muted)" font-family="Arial, sans-serif">everything the model can see</text>

  <rect x="314.137931034483" y="132.8" width="289.655172413793" height="92.8" rx="6.572670690062" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="458.965517241379" y="173.4" text-anchor="middle" font-size="19.718012070186" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Instructions</text>
  <text x="458.965517241379" y="202.4" text-anchor="middle" font-size="14.240786495134" fill="var(--info-text)" font-family="Arial, sans-serif">the system role</text>

  <rect x="314.137931034483" y="243" width="289.655172413793" height="92.8" rx="6.572670690062" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="458.965517241379" y="283.6" text-anchor="middle" font-size="19.718012070186" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Conversation</text>
  <text x="458.965517241379" y="312.6" text-anchor="middle" font-size="14.240786495134" fill="var(--info-text)" font-family="Arial, sans-serif">user and assistant turns</text>

  <rect x="314.137931034483" y="353.2" width="289.655172413793" height="92.8" rx="6.572670690062" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="458.965517241379" y="393.8" text-anchor="middle" font-size="19.718012070186" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Retrieved facts</text>
  <text x="458.965517241379" y="422.8" text-anchor="middle" font-size="14.240786495134" fill="var(--info-text)" font-family="Arial, sans-serif">RAG: your documents</text>

  <rect x="702.068965517242" y="190.8" width="206.896551724138" height="150.8" rx="6.572670690062" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.51724137931" y="260.4" text-anchor="middle" font-size="28.481572990269" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Model</text>
  <text x="805.51724137931" y="295.2" text-anchor="middle" font-size="15.336231610145" fill="var(--primary-text)" font-family="Arial, sans-serif">the LLM</text>

  <rect x="1033.103448275862" y="208.2" width="206.896551724138" height="116" rx="6.572670690062" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.551724137931" y="260.4" text-anchor="middle" font-size="24.099792530227" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Answer</text>
  <text x="1136.551724137931" y="292.88" text-anchor="middle" font-size="14.240786495134" fill="var(--ok-text)" font-family="Arial, sans-serif">text, images, actions</text>

  <rect x="640" y="527.2" width="165.51724137931" height="92.8" rx="6.572670690062" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="722.758620689655" y="567.8" text-anchor="middle" font-size="17.527121840165" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Files</text>
  <text x="722.758620689655" y="594.48" text-anchor="middle" font-size="13.145341380124" fill="var(--warn-text)" font-family="Arial, sans-serif">read and write</text>

  <rect x="826.206896551724" y="527.2" width="165.51724137931" height="92.8" rx="6.572670690062" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.965517241379" y="567.8" text-anchor="middle" font-size="17.527121840165" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Web search</text>
  <text x="908.965517241379" y="594.48" text-anchor="middle" font-size="13.145341380124" fill="var(--warn-text)" font-family="Arial, sans-serif">fresh knowledge</text>

  <rect x="1012.413793103448" y="527.2" width="165.51724137931" height="92.8" rx="6.572670690062" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172413793103" y="567.8" text-anchor="middle" font-size="17.527121840165" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Databases</text>
  <text x="1095.172413793103" y="594.48" text-anchor="middle" font-size="13.145341380124" fill="var(--warn-text)" font-family="Arial, sans-serif">your systems</text>

  <text x="908.965517241379" y="509.8" text-anchor="middle" font-size="15.336231610145" fill="var(--text-muted)" font-family="Arial, sans-serif">Tools — connected over MCP</text>
  <text x="308.965517241379" y="573.6" text-anchor="start" font-size="17.527121840165" fill="var(--text-muted)" font-family="Arial, sans-serif">Agent = a model in a loop:</text>
  <text x="308.965517241379" y="602.6" text-anchor="start" font-size="17.527121840165" fill="var(--text-muted)" font-family="Arial, sans-serif">plan, act, check, repeat</text>

  <line x1="215.862068965517" y1="272" x2="283.103448275862" y2="272" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="215.862068965517" y1="98" x2="283.103448275862" y2="132.8" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="629.655172413793" y1="260.4" x2="696.896551724138" y2="260.4" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="908.965517241379" y1="266.2" x2="1027.931034482759" y2="266.2" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="774.48275862069" y1="341.6" x2="733.103448275862" y2="521.4" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="908.965517241379" y1="521.4" x2="836.551724137931" y2="347.4" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="27.960946985591" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Four roles label every message</text>

  <rect x="40" y="85.490196078431" width="284.745762711864" height="534.509803921569" rx="6.452526227444" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.372881355932" y="148.039215686274" text-anchor="middle" font-size="25.810104909776" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">system</text>
  <text x="182.372881355932" y="233.333333333333" text-anchor="middle" font-size="18.282157644425" fill="var(--primary-text)" font-family="Arial, sans-serif">Rules, persona,</text>
  <text x="182.372881355932" y="261.764705882353" text-anchor="middle" font-size="18.282157644425" fill="var(--primary-text)" font-family="Arial, sans-serif">constraints</text>
  <text x="182.372881355932" y="347.058823529412" text-anchor="middle" font-size="18.282157644425" fill="var(--primary-text)" font-family="Arial, sans-serif">Set by the</text>
  <text x="182.372881355932" y="375.490196078431" text-anchor="middle" font-size="18.282157644425" fill="var(--primary-text)" font-family="Arial, sans-serif">developer</text>
  <text x="182.372881355932" y="460.78431372549" text-anchor="middle" font-size="18.282157644425" fill="var(--primary-text)" font-family="Arial, sans-serif">Highest</text>
  <text x="182.372881355932" y="489.21568627451" text-anchor="middle" font-size="18.282157644425" fill="var(--primary-text)" font-family="Arial, sans-serif">authority</text>

  <rect x="345.084745762712" y="85.490196078431" width="284.745762711864" height="534.509803921569" rx="6.452526227444" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.457627118644" y="148.039215686274" text-anchor="middle" font-size="25.810104909776" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">user</text>
  <text x="487.457627118644" y="233.333333333333" text-anchor="middle" font-size="18.282157644425" fill="var(--ok-text)" font-family="Arial, sans-serif">The human's</text>
  <text x="487.457627118644" y="261.764705882353" text-anchor="middle" font-size="18.282157644425" fill="var(--ok-text)" font-family="Arial, sans-serif">request</text>
  <text x="487.457627118644" y="347.058823529412" text-anchor="middle" font-size="18.282157644425" fill="var(--ok-text)" font-family="Arial, sans-serif">The "prompt"</text>
  <text x="487.457627118644" y="375.490196078431" text-anchor="middle" font-size="18.282157644425" fill="var(--ok-text)" font-family="Arial, sans-serif">you think of</text>
  <text x="487.457627118644" y="460.78431372549" text-anchor="middle" font-size="18.282157644425" fill="var(--ok-text)" font-family="Arial, sans-serif">Untrusted</text>
  <text x="487.457627118644" y="489.21568627451" text-anchor="middle" font-size="18.282157644425" fill="var(--ok-text)" font-family="Arial, sans-serif">by default</text>

  <rect x="650.169491525424" y="85.490196078431" width="284.745762711864" height="534.509803921569" rx="6.452526227444" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.542372881356" y="148.039215686274" text-anchor="middle" font-size="25.810104909776" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">assistant</text>
  <text x="792.542372881356" y="233.333333333333" text-anchor="middle" font-size="18.282157644425" fill="var(--info-text)" font-family="Arial, sans-serif">The model's</text>
  <text x="792.542372881356" y="261.764705882353" text-anchor="middle" font-size="18.282157644425" fill="var(--info-text)" font-family="Arial, sans-serif">own replies</text>
  <text x="792.542372881356" y="347.058823529412" text-anchor="middle" font-size="18.282157644425" fill="var(--info-text)" font-family="Arial, sans-serif">Fed back in</text>
  <text x="792.542372881356" y="375.490196078431" text-anchor="middle" font-size="18.282157644425" fill="var(--info-text)" font-family="Arial, sans-serif">as memory</text>
  <text x="792.542372881356" y="460.78431372549" text-anchor="middle" font-size="18.282157644425" fill="var(--info-text)" font-family="Arial, sans-serif">Can be</text>
  <text x="792.542372881356" y="489.21568627451" text-anchor="middle" font-size="18.282157644425" fill="var(--info-text)" font-family="Arial, sans-serif">pre-filled</text>

  <rect x="955.254237288136" y="85.490196078431" width="284.745762711864" height="534.509803921569" rx="6.452526227444" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097.627118644068" y="148.039215686274" text-anchor="middle" font-size="25.810104909776" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">tool</text>
  <text x="1097.627118644068" y="233.333333333333" text-anchor="middle" font-size="18.282157644425" fill="var(--warn-text)" font-family="Arial, sans-serif">Result of a</text>
  <text x="1097.627118644068" y="261.764705882353" text-anchor="middle" font-size="18.282157644425" fill="var(--warn-text)" font-family="Arial, sans-serif">tool call</text>
  <text x="1097.627118644068" y="347.058823529412" text-anchor="middle" font-size="18.282157644425" fill="var(--warn-text)" font-family="Arial, sans-serif">Returns data</text>
  <text x="1097.627118644068" y="375.490196078431" text-anchor="middle" font-size="18.282157644425" fill="var(--warn-text)" font-family="Arial, sans-serif">to the model</text>
  <text x="1097.627118644068" y="460.78431372549" text-anchor="middle" font-size="18.282157644425" fill="var(--warn-text)" font-family="Arial, sans-serif">a.k.a. function</text>
  <text x="1097.627118644068" y="489.21568627451" text-anchor="middle" font-size="18.282157644425" fill="var(--warn-text)" font-family="Arial, sans-serif">or observation</text>
</svg>

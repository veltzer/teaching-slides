<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="29.544972166749" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A persona narrows the model's frame</text>

  <rect x="40" y="99.183673469388" width="349.090909090909" height="189.387755102041" rx="6.818070500019" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.545454545455" y="152.448979591837" text-anchor="middle" font-size="22.72690166673" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">The role prompt</text>
  <text x="214.545454545455" y="199.795918367347" text-anchor="middle" font-size="19.31786641672" fill="var(--primary-text)" font-family="Arial, sans-serif">"You are an experienced</text>
  <text x="214.545454545455" y="231.755102040816" text-anchor="middle" font-size="19.31786641672" fill="var(--primary-text)" font-family="Arial, sans-serif">Python code reviewer."</text>

  <rect x="465.454545454545" y="99.183673469388" width="349.090909090909" height="189.387755102041" rx="6.818070500019" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="152.448979591837" text-anchor="middle" font-size="22.72690166673" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The model</text>
  <text x="640" y="199.795918367347" text-anchor="middle" font-size="19.31786641672" fill="var(--text-muted)" font-family="Arial, sans-serif">picks the matching region</text>
  <text x="640" y="231.755102040816" text-anchor="middle" font-size="19.31786641672" fill="var(--text-muted)" font-family="Arial, sans-serif">of its training</text>

  <rect x="890.909090909091" y="99.183673469388" width="349.090909090909" height="189.387755102041" rx="6.818070500019" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065.454545454545" y="152.448979591837" text-anchor="middle" font-size="22.72690166673" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">The answer shifts</text>
  <text x="1065.454545454545" y="199.795918367347" text-anchor="middle" font-size="19.31786641672" fill="var(--ok-text)" font-family="Arial, sans-serif">Right tone, vocabulary,</text>
  <text x="1065.454545454545" y="231.755102040816" text-anchor="middle" font-size="19.31786641672" fill="var(--ok-text)" font-family="Arial, sans-serif">depth, and format</text>

  <line x1="389.090909090909" y1="193.877551020408" x2="460" y2="193.877551020408" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="814.545454545455" y1="193.877551020408" x2="885.454545454545" y2="193.877551020408" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <rect x="105.454545454545" y="359.591836734694" width="480" height="260.408163265306" rx="6.818070500019" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="345.454545454545" y="406.938775510204" text-anchor="middle" font-size="21.590556583393" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">What it changes</text>
  <text x="345.454545454545" y="460.204081632653" text-anchor="middle" font-size="19.31786641672" fill="var(--text)" font-family="Arial, sans-serif">Tone and register</text>
  <text x="345.454545454545" y="501.632653061224" text-anchor="middle" font-size="19.31786641672" fill="var(--text)" font-family="Arial, sans-serif">Level of detail</text>
  <text x="345.454545454545" y="543.061224489796" text-anchor="middle" font-size="19.31786641672" fill="var(--text)" font-family="Arial, sans-serif">Vocabulary and format</text>
  <text x="345.454545454545" y="584.489795918367" text-anchor="middle" font-size="19.31786641672" fill="var(--text)" font-family="Arial, sans-serif">What it chooses to ignore</text>

  <rect x="694.545454545455" y="359.591836734694" width="480" height="260.408163265306" rx="6.818070500019" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="934.545454545455" y="406.938775510204" text-anchor="middle" font-size="21.590556583393" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">What it does NOT change</text>
  <text x="934.545454545455" y="460.204081632653" text-anchor="middle" font-size="19.31786641672" fill="var(--text)" font-family="Arial, sans-serif">The facts it knows</text>
  <text x="934.545454545455" y="501.632653061224" text-anchor="middle" font-size="19.31786641672" fill="var(--text)" font-family="Arial, sans-serif">Its actual accuracy</text>
  <text x="934.545454545455" y="543.061224489796" text-anchor="middle" font-size="19.31786641672" fill="var(--text)" font-family="Arial, sans-serif">Its reasoning ability</text>
  <text x="934.545454545455" y="584.489795918367" text-anchor="middle" font-size="19.31786641672" fill="var(--text)" font-family="Arial, sans-serif">Its truthfulness</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="28.200959516425" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Role prompts: sharp vs. theatrical</text>

  <rect x="40" y="85.490196078431" width="579.310344827586" height="534.509803921569" rx="6.50791373456" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="140.078431372549" text-anchor="middle" font-size="23.862350360052" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Do — concrete and useful</text>

  <rect x="81.379310344828" y="176.470588235294" width="496.551724137931" height="113.725490196078" rx="6.50791373456" fill="var(--code-bg)"/>
  <text x="329.655172413793" y="221.960784313725" text-anchor="middle" font-size="18.439088914586" fill="var(--surface)" font-family="Courier New, monospace">You are a senior Python reviewer.</text>
  <text x="329.655172413793" y="258.352941176471" text-anchor="middle" font-size="18.439088914586" fill="var(--surface)" font-family="Courier New, monospace">Be blunt; flag bugs and cite lines.</text>

  <text x="329.655172413793" y="352.745098039216" text-anchor="middle" font-size="19.523741203679" fill="var(--ok-text)" font-family="Arial, sans-serif">Names the task, not just a title</text>
  <text x="329.655172413793" y="409.607843137255" text-anchor="middle" font-size="19.523741203679" fill="var(--ok-text)" font-family="Arial, sans-serif">States audience and format</text>
  <text x="329.655172413793" y="466.470588235294" text-anchor="middle" font-size="19.523741203679" fill="var(--ok-text)" font-family="Arial, sans-serif">Implies what to focus on</text>
  <text x="329.655172413793" y="523.333333333333" text-anchor="middle" font-size="19.523741203679" fill="var(--ok-text)" font-family="Arial, sans-serif">Beats a plain prompt on this task</text>

  <rect x="660.689655172414" y="85.490196078431" width="579.310344827586" height="534.509803921569" rx="6.50791373456" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="140.078431372549" text-anchor="middle" font-size="23.862350360052" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Don't — empty theatre</text>

  <rect x="702.068965517241" y="176.470588235294" width="496.551724137931" height="113.725490196078" rx="6.50791373456" fill="var(--code-bg)"/>
  <text x="950.344827586207" y="221.960784313725" text-anchor="middle" font-size="18.439088914586" fill="var(--surface)" font-family="Courier New, monospace">You are a brilliant Nobel-winning</text>
  <text x="950.344827586207" y="258.352941176471" text-anchor="middle" font-size="18.439088914586" fill="var(--surface)" font-family="Courier New, monospace">genius. Answer perfectly.</text>

  <text x="950.344827586207" y="352.745098039216" text-anchor="middle" font-size="19.523741203679" fill="var(--danger-text)" font-family="Arial, sans-serif">Grants no knowledge it lacks</text>
  <text x="950.344827586207" y="409.607843137255" text-anchor="middle" font-size="19.523741203679" fill="var(--danger-text)" font-family="Arial, sans-serif">Does not fix wrong answers</text>
  <text x="950.344827586207" y="466.470588235294" text-anchor="middle" font-size="19.523741203679" fill="var(--danger-text)" font-family="Arial, sans-serif">Sounds confident, not correct</text>
  <text x="950.344827586207" y="523.333333333333" text-anchor="middle" font-size="19.523741203679" fill="var(--danger-text)" font-family="Arial, sans-serif">Flattery just burns tokens</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="661.428571428571" y="40" text-anchor="middle" font-size="28.700130295725" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Who controls each role — and how much to trust it</text>

  <text x="168.571428571429" y="113.921568627451" text-anchor="middle" font-size="19.869320973964" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Role</text>
  <text x="511.428571428571" y="113.921568627451" text-anchor="middle" font-size="19.869320973964" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Controlled by</text>
  <text x="993.571428571428" y="113.921568627451" text-anchor="middle" font-size="19.869320973964" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Trust level</text>

  <rect x="40" y="142.352941176471" width="257.142857142857" height="102.352941176471" rx="6.623106991321" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.571428571429" y="204.901960784314" text-anchor="middle" font-size="24.284725634844" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">system</text>
  <text x="511.428571428571" y="204.901960784314" text-anchor="middle" font-size="22.077023304404" fill="var(--text)" font-family="Arial, sans-serif">you, the developer</text>
  <rect x="832.857142857143" y="162.823529411765" width="407.142857142857" height="61.411764705882" rx="6.623106991321" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036.428571428572" y="202.627450980392" text-anchor="middle" font-size="20.973172139184" fill="var(--ok-text)" font-family="Arial, sans-serif">most trusted</text>

  <rect x="40" y="267.450980392157" width="257.142857142857" height="102.352941176471" rx="6.623106991321" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.571428571429" y="330" text-anchor="middle" font-size="24.284725634844" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">assistant</text>
  <text x="511.428571428571" y="330" text-anchor="middle" font-size="22.077023304404" fill="var(--text)" font-family="Arial, sans-serif">the model itself</text>
  <rect x="832.857142857143" y="287.921568627451" width="321.428571428571" height="61.411764705882" rx="6.623106991321" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="993.571428571428" y="327.725490196078" text-anchor="middle" font-size="20.973172139184" fill="var(--ok-text)" font-family="Arial, sans-serif">moderate</text>

  <rect x="40" y="392.549019607843" width="257.142857142857" height="102.352941176471" rx="6.623106991321" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.571428571429" y="455.098039215686" text-anchor="middle" font-size="24.284725634844" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">tool</text>
  <text x="511.428571428571" y="455.098039215686" text-anchor="middle" font-size="22.077023304404" fill="var(--text)" font-family="Arial, sans-serif">the outside world</text>
  <rect x="832.857142857143" y="413.019607843137" width="235.714285714286" height="61.411764705882" rx="6.623106991321" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="452.823529411765" text-anchor="middle" font-size="20.973172139184" fill="var(--warn-text)" font-family="Arial, sans-serif">low</text>

  <rect x="40" y="517.647058823529" width="257.142857142857" height="102.352941176471" rx="6.623106991321" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.571428571429" y="580.196078431372" text-anchor="middle" font-size="24.284725634844" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">user</text>
  <text x="511.428571428571" y="580.196078431372" text-anchor="middle" font-size="22.077023304404" fill="var(--text)" font-family="Arial, sans-serif">the human</text>
  <rect x="832.857142857143" y="538.117647058824" width="171.428571428571" height="61.411764705882" rx="6.623106991321" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="918.571428571428" y="577.921568627451" text-anchor="middle" font-size="20.973172139184" fill="var(--danger-text)" font-family="Arial, sans-serif">untrusted</text>
</svg>

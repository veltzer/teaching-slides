<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="28.560469465483" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The mental model</text>

  <rect x="318.571428571429" y="85.04854368932" width="642.857142857143" height="123.883495145631" rx="6.590877568958" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="135.728155339806" text-anchor="middle" font-size="24.166551086178" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">A role = a scoped job + a level of trust</text>
  <text x="640" y="175.145631067961" text-anchor="middle" font-size="18.674153112046" fill="var(--primary-text)" font-family="Arial, sans-serif">Use the lightest structure that gets the work done</text>

  <rect x="40" y="276.504854368932" width="364.285714285714" height="281.553398058252" rx="6.590877568958" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.142857142857" y="327.184466019417" text-anchor="middle" font-size="21.969591896525" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Inside one model</text>
  <text x="222.142857142857" y="383.495145631068" text-anchor="middle" font-size="18.674153112046" fill="var(--ok-text)" font-family="Arial, sans-serif">system · user</text>
  <text x="222.142857142857" y="417.281553398058" text-anchor="middle" font-size="18.674153112046" fill="var(--ok-text)" font-family="Arial, sans-serif">assistant · tool</text>
  <text x="222.142857142857" y="473.592233009709" text-anchor="middle" font-size="18.674153112046" fill="var(--ok-text)" font-family="Arial, sans-serif">+ persona for tone</text>
  <text x="222.142857142857" y="524.271844660194" text-anchor="middle" font-size="16.477193922394" fill="var(--ok-text)" font-family="Arial, sans-serif">a trust gradient — guard it</text>

  <rect x="875.714285714286" y="276.504854368932" width="364.285714285714" height="281.553398058252" rx="6.590877568958" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.857142857143" y="327.184466019417" text-anchor="middle" font-size="21.969591896525" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Across many models</text>
  <text x="1057.857142857143" y="383.495145631068" text-anchor="middle" font-size="18.674153112046" fill="var(--warn-text)" font-family="Arial, sans-serif">planner · worker</text>
  <text x="1057.857142857143" y="417.281553398058" text-anchor="middle" font-size="18.674153112046" fill="var(--warn-text)" font-family="Arial, sans-serif">critic · router · judge</text>
  <text x="1057.857142857143" y="473.592233009709" text-anchor="middle" font-size="18.674153112046" fill="var(--warn-text)" font-family="Arial, sans-serif">one job per agent</text>
  <text x="1057.857142857143" y="524.271844660194" text-anchor="middle" font-size="16.477193922394" fill="var(--warn-text)" font-family="Arial, sans-serif">split only when work demands</text>

  <line x1="490" y1="208.932038834951" x2="297.142857142857" y2="270.873786407767" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="208.932038834951" x2="982.857142857143" y2="270.873786407767" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="620" text-anchor="middle" font-size="19.772632706873" fill="var(--text-muted)" font-family="Arial, sans-serif">Match the structure to the problem — no more, no less</text>
</svg>

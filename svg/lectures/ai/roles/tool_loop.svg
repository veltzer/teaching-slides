<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="28.42282784765" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Roles take turns in a tool-use loop</text>

  <rect x="40" y="95.769230769231" width="321.428571428571" height="89.230769230769" rx="6.559114118688" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200.714285714286" y="132.576923076923" text-anchor="middle" font-size="21.863713728961" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">system</text>
  <text x="200.714285714286" y="162.692307692308" text-anchor="middle" font-size="17.490970983169" fill="var(--primary-text)" font-family="Arial, sans-serif">sets the rules</text>

  <rect x="40" y="229.615384615385" width="321.428571428571" height="89.230769230769" rx="6.559114118688" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200.714285714286" y="266.423076923077" text-anchor="middle" font-size="21.863713728961" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">user</text>
  <text x="200.714285714286" y="296.538461538462" text-anchor="middle" font-size="17.490970983169" fill="var(--ok-text)" font-family="Arial, sans-serif">asks a question</text>

  <rect x="479.285714285714" y="162.692307692308" width="321.428571428571" height="89.230769230769" rx="6.559114118688" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="199.5" text-anchor="middle" font-size="21.863713728961" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">assistant</text>
  <text x="640" y="229.615384615385" text-anchor="middle" font-size="17.490970983169" fill="var(--info-text)" font-family="Arial, sans-serif">requests a tool call</text>

  <rect x="918.571428571429" y="296.538461538462" width="321.428571428571" height="89.230769230769" rx="6.559114118688" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1079.285714285714" y="333.346153846154" text-anchor="middle" font-size="21.863713728961" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">tool</text>
  <text x="1079.285714285714" y="363.461538461538" text-anchor="middle" font-size="17.490970983169" fill="var(--warn-text)" font-family="Arial, sans-serif">returns the result</text>

  <rect x="479.285714285714" y="430.384615384615" width="321.428571428571" height="89.230769230769" rx="6.559114118688" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="467.192307692308" text-anchor="middle" font-size="21.863713728961" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">assistant</text>
  <text x="640" y="497.307692307692" text-anchor="middle" font-size="17.490970983169" fill="var(--info-text)" font-family="Arial, sans-serif">answers the user</text>

  <line x1="361.428571428571" y1="140.384615384615" x2="473.928571428571" y2="185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="361.428571428571" y1="274.230769230769" x2="473.928571428571" y2="218.461538461538" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800.714285714286" y1="212.884615384615" x2="913.214285714286" y2="318.846153846154" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="918.571428571429" y1="357.884615384615" x2="800.714285714286" y2="463.846153846154" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <path d="M 640 430.384615384615 Q 640 341.153846153846 640 257.5" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="704.285714285714" y="346.730769230769" text-anchor="middle" font-size="16.397785296721" fill="var(--text-faint)" font-family="Arial, sans-serif">loop until done</text>

  <rect x="40" y="558.653846153846" width="1200" height="61.346153846154" rx="6.559114118688" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="597.692307692308" text-anchor="middle" font-size="19.677342356065" fill="var(--text-muted)" font-family="Arial, sans-serif">The whole conversation is just an alternating stack of role-labelled messages</text>
</svg>

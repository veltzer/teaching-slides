<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="28.985710765331" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Both senses are really about scope &amp; authority</text>

  <rect x="40" y="98" width="535.714285714286" height="208.8" rx="6.689010176615" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.857142857143" y="156" text-anchor="middle" font-size="24.526370647588" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Conversation role</text>
  <text x="307.857142857143" y="208.2" text-anchor="middle" font-size="20.067030529845" fill="var(--primary-text)" font-family="Arial, sans-serif">scopes one message:</text>
  <text x="307.857142857143" y="246.48" text-anchor="middle" font-size="20.067030529845" fill="var(--primary-text)" font-family="Arial, sans-serif">what may it do, whom</text>
  <text x="307.857142857143" y="278.96" text-anchor="middle" font-size="20.067030529845" fill="var(--primary-text)" font-family="Arial, sans-serif">does it serve?</text>

  <rect x="704.285714285714" y="98" width="535.714285714286" height="208.8" rx="6.689010176615" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="972.142857142857" y="156" text-anchor="middle" font-size="24.526370647588" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Agent role</text>
  <text x="972.142857142857" y="208.2" text-anchor="middle" font-size="20.067030529845" fill="var(--warn-text)" font-family="Arial, sans-serif">scopes a whole model:</text>
  <text x="972.142857142857" y="246.48" text-anchor="middle" font-size="20.067030529845" fill="var(--warn-text)" font-family="Arial, sans-serif">what may it do, whom</text>
  <text x="972.142857142857" y="278.96" text-anchor="middle" font-size="20.067030529845" fill="var(--warn-text)" font-family="Arial, sans-serif">does it serve?</text>

  <line x1="307.857142857143" y1="364.8" x2="618.571428571429" y2="434.4" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="972.142857142857" y1="364.8" x2="661.428571428571" y2="434.4" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="318.571428571429" y="446" width="642.857142857143" height="174" rx="6.689010176615" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="501.68" text-anchor="middle" font-size="24.526370647588" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Same question, two levels</text>
  <text x="640" y="550.4" text-anchor="middle" font-size="20.067030529845" fill="var(--text-muted)" font-family="Arial, sans-serif">A role draws a boundary and assigns authority</text>
  <text x="640" y="585.2" text-anchor="middle" font-size="20.067030529845" fill="var(--text-muted)" font-family="Arial, sans-serif">Get the boundaries right and the system stays legible</text>
</svg>

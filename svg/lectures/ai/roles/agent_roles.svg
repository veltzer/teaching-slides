<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="27.795169158892" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Five agent roles in a team</text>

  <rect x="40" y="84.190476190476" width="362.068965517241" height="220.952380952381" rx="6.414269805898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.034482758621" y="139.428571428571" text-anchor="middle" font-size="25.657079223593" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Planner</text>
  <text x="221.034482758621" y="194.666666666667" text-anchor="middle" font-size="19.242809417695" fill="var(--primary-text)" font-family="Arial, sans-serif">Breaks the goal into</text>
  <text x="221.034482758621" y="225.6" text-anchor="middle" font-size="19.242809417695" fill="var(--primary-text)" font-family="Arial, sans-serif">ordered sub-tasks</text>
  <text x="221.034482758621" y="269.790476190476" text-anchor="middle" font-size="17.104719482395" fill="var(--primary-text)" font-family="Arial, sans-serif">decides what, not how</text>

  <rect x="458.965517241379" y="84.190476190476" width="362.068965517241" height="220.952380952381" rx="6.414269805898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="139.428571428571" text-anchor="middle" font-size="25.657079223593" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Worker</text>
  <text x="640" y="194.666666666667" text-anchor="middle" font-size="19.242809417695" fill="var(--ok-text)" font-family="Arial, sans-serif">Executes one scoped</text>
  <text x="640" y="225.6" text-anchor="middle" font-size="19.242809417695" fill="var(--ok-text)" font-family="Arial, sans-serif">sub-task</text>
  <text x="640" y="269.790476190476" text-anchor="middle" font-size="17.104719482395" fill="var(--ok-text)" font-family="Arial, sans-serif">runs in parallel</text>

  <rect x="877.931034482759" y="84.190476190476" width="362.068965517241" height="220.952380952381" rx="6.414269805898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.965517241379" y="139.428571428571" text-anchor="middle" font-size="25.657079223593" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Critic</text>
  <text x="1058.965517241379" y="194.666666666667" text-anchor="middle" font-size="19.242809417695" fill="var(--warn-text)" font-family="Arial, sans-serif">Reviews output before</text>
  <text x="1058.965517241379" y="225.6" text-anchor="middle" font-size="19.242809417695" fill="var(--warn-text)" font-family="Arial, sans-serif">it is accepted</text>
  <text x="1058.965517241379" y="269.790476190476" text-anchor="middle" font-size="17.104719482395" fill="var(--warn-text)" font-family="Arial, sans-serif">a quality gate</text>

  <rect x="231.379310344828" y="349.333333333333" width="362.068965517241" height="220.952380952381" rx="6.414269805898" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="412.413793103448" y="404.571428571429" text-anchor="middle" font-size="25.657079223593" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Router</text>
  <text x="412.413793103448" y="459.809523809524" text-anchor="middle" font-size="19.242809417695" fill="var(--info-text)" font-family="Arial, sans-serif">Dispatches a request</text>
  <text x="412.413793103448" y="490.742857142857" text-anchor="middle" font-size="19.242809417695" fill="var(--info-text)" font-family="Arial, sans-serif">to the right specialist</text>
  <text x="412.413793103448" y="534.933333333333" text-anchor="middle" font-size="17.104719482395" fill="var(--info-text)" font-family="Arial, sans-serif">often a cheap model</text>

  <rect x="686.551724137931" y="349.333333333333" width="362.068965517241" height="220.952380952381" rx="6.414269805898" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="867.586206896552" y="404.571428571429" text-anchor="middle" font-size="25.657079223593" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Judge</text>
  <text x="867.586206896552" y="459.809523809524" text-anchor="middle" font-size="19.242809417695" fill="var(--danger-text)" font-family="Arial, sans-serif">Scores candidates and</text>
  <text x="867.586206896552" y="490.742857142857" text-anchor="middle" font-size="19.242809417695" fill="var(--danger-text)" font-family="Arial, sans-serif">picks the best</text>
  <text x="867.586206896552" y="534.933333333333" text-anchor="middle" font-size="17.104719482395" fill="var(--danger-text)" font-family="Arial, sans-serif">chooses between options</text>

  <text x="640" y="620" text-anchor="middle" font-size="18.173764450045" fill="var(--text-muted)" font-family="Arial, sans-serif">Each is its own LLM with a narrow prompt, its own tools, and one clear job</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="290" y="40" width="700" height="50" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="73.5" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="var(--text)">.kiro/specs/&lt;feature&gt;/  -  you approve each file before the next</text>
  <rect x="40" y="150" width="200" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="140" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--text)">one sentence</text>
  <text x="140" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">"export filtered</text>
  <text x="140" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">orders as CSV"</text>
  <rect x="290" y="150" width="200" height="220" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="390" y="245" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="var(--primary-text)">requirements.md</text>
  <text x="390" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">user stories</text>
  <text x="390" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">EARS criteria</text>
  <rect x="540" y="150" width="200" height="220" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="245" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="var(--warn-text)">design.md</text>
  <text x="640" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">interfaces, data model</text>
  <text x="640" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">sequence diagrams</text>
  <rect x="790" y="150" width="200" height="220" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="890" y="245" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="var(--ok-text)">tasks.md</text>
  <text x="890" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">checkbox tasks</text>
  <text x="890" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">linked to requirements</text>
  <rect x="1040" y="150" width="200" height="220" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1140" y="245" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="var(--info-text)">code + tests</text>
  <text x="1140" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">one task at a time</text>
  <text x="1140" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">diff reviewed</text>
  <line x1="240" y1="260" x2="282" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="260" x2="532" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="260" x2="782" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="260" x2="1032" y2="260" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="142" x2="390" y2="92" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="142" x2="640" y2="92" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="890" y1="142" x2="890" y2="92" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="470" width="580" height="150" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="330" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Start task</text>
  <text x="330" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">implement, run tests, tick the box</text>
  <rect x="660" y="470" width="580" height="150" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="950" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Update tasks</text>
  <text x="950" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">requirements changed: re-plan the rest</text>
  <line x1="850" y1="370" x2="520" y2="462" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="660" y="405" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">execute</text>
  <line x1="930" y1="470" x2="930" y2="378" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="945" y="430" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">re-plan</text>
</svg>

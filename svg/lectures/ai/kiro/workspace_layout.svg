<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="220" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="150" y="342" text-anchor="middle" font-family="Courier New, monospace" font-size="24" font-weight="bold" fill="var(--text)">.kiro/</text>
  <rect x="330" y="40" width="300" height="92" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="480" y="95" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="var(--primary-text)">specs/&lt;feature&gt;/</text>
  <rect x="690" y="40" width="550" height="92" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="965" y="71" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--text)">requirements.md</text>
  <text x="965" y="94" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--text)">design.md</text>
  <text x="965" y="117" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--text)">tasks.md</text>
  <line x1="260" y1="86" x2="322" y2="86" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="86" x2="682" y2="86" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="330" y="162" width="300" height="92" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="480" y="217" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="var(--ok-text)">steering/</text>
  <rect x="690" y="162" width="550" height="92" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="965" y="193" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--text)">product.md</text>
  <text x="965" y="216" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--text)">tech.md</text>
  <text x="965" y="239" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--text)">structure.md</text>
  <line x1="260" y1="208" x2="322" y2="208" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="208" x2="682" y2="208" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="330" y="284" width="300" height="92" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="480" y="339" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="var(--info-text)">hooks/</text>
  <rect x="690" y="284" width="550" height="92" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="965" y="338" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--text)">keep-tests-in-sync.kiro.hook</text>
  <line x1="260" y1="330" x2="322" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="330" x2="682" y2="330" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="330" y="406" width="300" height="92" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="480" y="461" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="var(--warn-text)">settings/mcp.json</text>
  <rect x="690" y="406" width="550" height="92" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="965" y="460" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--text)">mcpServers: aws-docs, github</text>
  <line x1="260" y1="452" x2="322" y2="452" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="452" x2="682" y2="452" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <rect x="330" y="528" width="300" height="92" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="480" y="583" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="var(--danger-text)">agents/</text>
  <rect x="690" y="528" width="550" height="92" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="965" y="582" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--text)">reviewer.json</text>
  <line x1="260" y1="574" x2="322" y2="574" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="574" x2="682" y2="574" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
</svg>

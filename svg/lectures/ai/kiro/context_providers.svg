<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">type # in the chat to attach context</text>
  <rect x="40" y="140" width="276" height="150" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="178" y="212.5" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--primary-text)">#File</text>
  <text x="178" y="242.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">one file</text>
  <line x1="178" y1="100" x2="178" y2="132" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="178" y1="290" x2="178" y2="322" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="348" y="140" width="276" height="150" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="486" y="212.5" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--primary-text)">#Folder</text>
  <text x="486" y="242.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">a directory</text>
  <line x1="486" y1="100" x2="486" y2="132" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="486" y1="290" x2="486" y2="322" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="656" y="140" width="276" height="150" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="794" y="212.5" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--primary-text)">#Codebase</text>
  <text x="794" y="242.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">search the repo</text>
  <line x1="794" y1="100" x2="794" y2="132" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="794" y1="290" x2="794" y2="322" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="964" y="140" width="276" height="150" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1102" y="212.5" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--warn-text)">#Problems</text>
  <text x="1102" y="242.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">diagnostics panel</text>
  <line x1="1102" y1="100" x2="1102" y2="132" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1102" y1="290" x2="1102" y2="322" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <rect x="40" y="330" width="276" height="150" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="178" y="402.5" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--warn-text)">#Terminal</text>
  <text x="178" y="432.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">last command output</text>
  <line x1="178" y1="480" x2="178" y2="532" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <rect x="348" y="330" width="276" height="150" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="486" y="402.5" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--warn-text)">#Git Diff</text>
  <text x="486" y="432.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">uncommitted changes</text>
  <line x1="486" y1="480" x2="486" y2="532" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <rect x="656" y="330" width="276" height="150" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="794" y="402.5" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--info-text)">#URL</text>
  <text x="794" y="432.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">a web page</text>
  <line x1="794" y1="480" x2="794" y2="532" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="964" y="330" width="276" height="150" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1102" y="402.5" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--info-text)">#Steering</text>
  <text x="1102" y="432.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">a manual steering file</text>
  <line x1="1102" y1="480" x2="1102" y2="532" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="40" y="540" width="1200" height="80" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">the model's context for this turn</text>
</svg>

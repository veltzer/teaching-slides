<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="360" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="220" y="133.5" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="var(--text)">~/.kiro/settings/mcp.json</text>
  <text x="220" y="159.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">user scope</text>
  <text x="220" y="182.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">your personal servers</text>
  <rect x="40" y="400" width="360" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="220" y="493.5" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="var(--text)">.kiro/settings/mcp.json</text>
  <text x="220" y="519.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">workspace scope</text>
  <text x="220" y="542.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">committed with the repo</text>
  <line x1="220" y1="260" x2="220" y2="392" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="330" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">workspace wins on conflict</text>
  <rect x="500" y="230" width="280" height="200" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="316.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Kiro agent</text>
  <text x="640" y="348.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">tools appear</text>
  <text x="640" y="371.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">in the chat</text>
  <line x1="400" y1="150" x2="492" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="510" x2="492" y2="360" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="880" y="40" width="360" height="160" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1060" y="107" text-anchor="middle" font-family="Courier New, monospace" font-size="19" font-weight="bold" fill="var(--info-text)">aws-docs</text>
  <text x="1060" y="136" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="var(--info-text)">command: uvx</text>
  <text x="1060" y="157" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="var(--info-text)">autoApprove: search</text>
  <line x1="780" y1="330" x2="872" y2="120" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="880" y="250" width="360" height="160" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1060" y="317" text-anchor="middle" font-family="Courier New, monospace" font-size="19" font-weight="bold" fill="var(--info-text)">github</text>
  <text x="1060" y="346" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="var(--info-text)">command: npx</text>
  <text x="1060" y="367" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="var(--info-text)">tools: issues, prs</text>
  <line x1="780" y1="330" x2="872" y2="330" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="880" y="460" width="360" height="160" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1060" y="527" text-anchor="middle" font-family="Courier New, monospace" font-size="19" font-weight="bold" fill="var(--info-text)">internal-api</text>
  <text x="1060" y="556" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="var(--info-text)">url: https://...</text>
  <text x="1060" y="577" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="var(--info-text)">disabled: true</text>
  <line x1="780" y1="330" x2="872" y2="540" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
</svg>

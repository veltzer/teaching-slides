<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Infinity loop (DevOps symbol) -->
  <g transform="translate(400,160)">
    <path d="M-60,0 C-60,-50 -20,-50 0,-25 C20,-50 60,-50 60,0 C60,50 20,50 0,25 C-20,50 -60,50 -60,0 Z" fill="none" stroke="#e94560" stroke-width="4"/>
    <text x="-40" y="5" fill="#00d2ff" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Dev</text>
    <text x="12" y="5" fill="#0f3460" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Ops</text>
  </g>
  <!-- CI/CD pipeline arrows -->
  <g transform="translate(130,100)">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="none" stroke="#533483" stroke-width="2"/>
    <text x="30" y="20" text-anchor="middle" fill="#533483" font-family="Arial,sans-serif" font-size="11">Plan</text>
  </g>
  <g transform="translate(130,160)">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="none" stroke="#533483" stroke-width="2"/>
    <text x="30" y="20" text-anchor="middle" fill="#533483" font-family="Arial,sans-serif" font-size="11">Code</text>
  </g>
  <g transform="translate(130,220)">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="none" stroke="#533483" stroke-width="2"/>
    <text x="30" y="20" text-anchor="middle" fill="#533483" font-family="Arial,sans-serif" font-size="11">Build</text>
  </g>
  <g transform="translate(610,100)">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="none" stroke="#0f3460" stroke-width="2"/>
    <text x="30" y="20" text-anchor="middle" fill="#0f3460" font-family="Arial,sans-serif" font-size="11">Deploy</text>
  </g>
  <g transform="translate(610,160)">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="none" stroke="#0f3460" stroke-width="2"/>
    <text x="30" y="20" text-anchor="middle" fill="#0f3460" font-family="Arial,sans-serif" font-size="11">Monitor</text>
  </g>
  <g transform="translate(610,220)">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="none" stroke="#0f3460" stroke-width="2"/>
    <text x="30" y="20" text-anchor="middle" fill="#0f3460" font-family="Arial,sans-serif" font-size="11">Operate</text>
  </g>
  <!-- Gear icons -->
  <circle cx="400" cy="90" r="20" fill="none" stroke="#444" stroke-width="2"/>
  <circle cx="400" cy="90" r="8" fill="#444"/>
  <!-- Title -->
  <text x="400" y="320" text-anchor="middle" fill="#eee" font-family="Arial,sans-serif" font-size="32" font-weight="bold">DevOps Practices</text>
  <text x="400" y="355" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="16">Bridging Development and Operations</text>
</svg>

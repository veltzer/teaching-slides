<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Microcontroller chip -->
  <rect x="280" y="100" width="240" height="200" rx="8" fill="#0f3460" stroke="#16c79a" stroke-width="3"/>
  <!-- Pins -->
  <rect x="310" y="88" width="8" height="14" fill="#16c79a"/>
  <rect x="340" y="88" width="8" height="14" fill="#16c79a"/>
  <rect x="370" y="88" width="8" height="14" fill="#16c79a"/>
  <rect x="400" y="88" width="8" height="14" fill="#16c79a"/>
  <rect x="430" y="88" width="8" height="14" fill="#16c79a"/>
  <rect x="460" y="88" width="8" height="14" fill="#16c79a"/>
  <rect x="310" y="298" width="8" height="14" fill="#16c79a"/>
  <rect x="340" y="298" width="8" height="14" fill="#16c79a"/>
  <rect x="370" y="298" width="8" height="14" fill="#16c79a"/>
  <rect x="400" y="298" width="8" height="14" fill="#16c79a"/>
  <rect x="430" y="298" width="8" height="14" fill="#16c79a"/>
  <rect x="460" y="298" width="8" height="14" fill="#16c79a"/>
  <!-- Memory map inside chip -->
  <rect x="310" y="120" width="180" height="40" rx="4" fill="#e94560" opacity="0.3" stroke="#e94560" stroke-width="1.5"/>
  <text x="400" y="145" text-anchor="middle" font-family="monospace" font-size="13" fill="#e94560">BOOTLOADER</text>
  <rect x="310" y="168" width="180" height="30" rx="4" fill="#f5a623" opacity="0.2" stroke="#f5a623" stroke-width="1"/>
  <text x="400" y="188" text-anchor="middle" font-family="monospace" font-size="11" fill="#f5a623">VECTOR TABLE</text>
  <rect x="310" y="206" width="180" height="70" rx="4" fill="#16c79a" opacity="0.15" stroke="#16c79a" stroke-width="1"/>
  <text x="400" y="245" text-anchor="middle" font-family="monospace" font-size="13" fill="#16c79a">APPLICATION</text>
  <!-- Boot arrow -->
  <path d="M130 200 L270 200" stroke="#e94560" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="270,194 282,200 270,206" fill="#e94560"/>
  <text x="130" y="185" font-family="monospace" font-size="12" fill="#e94560">RESET</text>
  <!-- Arrow from bootloader to app -->
  <path d="M540 145 C600 145 600 240 540 240" stroke="#16c79a" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="540,234 528,240 540,246" fill="#16c79a"/>
  <text x="610" y="195" font-family="monospace" font-size="11" fill="#888">jump to app</text>
  <!-- Flash icon -->
  <polygon points="680,130 700,170 690,170 710,210 670,170 680,170" fill="#f5a623" opacity="0.8"/>
  <text x="690" y="240" text-anchor="middle" font-family="monospace" font-size="11" fill="#f5a623">FLASH</text>
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#eee">Microcontroller Bootloader</text>
  <text x="400" y="370" text-anchor="middle" font-family="monospace" font-size="13" fill="#666">reset vector | firmware update | application launch</text>
</svg>

<svg viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="48" font-family="Arial" font-size="32" font-weight="bold" text-anchor="middle" fill="var(--text)">EKS Security Layers</text>
  <polygon points="274.2857,608 1005.7143,608 914.2857,512 365.7143,512" fill="var(--danger-fill)" stroke="var(--warn-border)" stroke-width="3.2" />
  <text x="640" y="568" font-family="Arial" font-size="22.4" font-weight="bold" text-anchor="middle" fill="var(--bg)">Infrastructure Security</text>
  <text x="640" y="592" font-family="Arial" font-size="16" text-anchor="middle" fill="var(--bg)">VPC, Security Groups, NACLs, IAM</text>
  <polygon points="365.7143,512 914.2857,512 822.8571,416 457.1429,416" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.2" />
  <text x="640" y="472" font-family="Arial" font-size="22.4" font-weight="bold" text-anchor="middle" fill="var(--bg)">Cluster Security</text>
  <text x="640" y="496" font-family="Arial" font-size="16" text-anchor="middle" fill="var(--bg)">RBAC, Pod Security, Network Policies</text>
  <polygon points="457.1429,416 822.8571,416 731.4286,320 548.5714,320" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.2" />
  <text x="640" y="376" font-family="Arial" font-size="22.4" font-weight="bold" text-anchor="middle" fill="var(--bg)">Workload Security</text>
  <text x="640" y="400" font-family="Arial" font-size="16" text-anchor="middle" fill="var(--bg)">Image Scanning, Admission Controllers</text>
  <polygon points="548.5714,320 731.4286,320 685.7143,224 594.2857,224" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.2" />
  <text x="640" y="280" font-family="Arial" font-size="22.4" font-weight="bold" text-anchor="middle" fill="var(--bg)">Application</text>
  <text x="640" y="304" font-family="Arial" font-size="16" text-anchor="middle" fill="var(--bg)">Secrets, Encryption</text>
  <polygon points="594.2857,224 685.7143,224 640,128 640,128" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.2" />
  <text x="640" y="184" font-family="Arial" font-size="22.4" font-weight="bold" text-anchor="middle" fill="var(--bg)">Data</text>
  <rect x="1042.2857" y="128" width="219.4286" height="480" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1152" y="168" font-family="Arial" font-size="19.2" font-weight="bold" text-anchor="middle" fill="var(--text)">Security Features</text>
  <circle cx="1078.8571" cy="208" r="12.8" fill="var(--danger-fill)" />
  <text x="1115.4286" y="216" font-family="Arial" font-size="16" fill="var(--text)">IAM Roles</text>
  <circle cx="1078.8571" cy="240" r="12.8" fill="var(--warn-fill)" />
  <text x="1115.4286" y="248" font-family="Arial" font-size="16" fill="var(--text)">RBAC</text>
  <circle cx="1078.8571" cy="272" r="12.8" fill="var(--warn-fill)" />
  <text x="1115.4286" y="280" font-family="Arial" font-size="16" fill="var(--text)">Pod Security</text>
  <circle cx="1078.8571" cy="304" r="12.8" fill="var(--ok-fill)" />
  <text x="1115.4286" y="312" font-family="Arial" font-size="16" fill="var(--text)">Network Policies</text>
  <circle cx="1078.8571" cy="336" r="12.8" fill="var(--primary-fill)" />
  <text x="1115.4286" y="344" font-family="Arial" font-size="16" fill="var(--text)">Secrets Manager</text>
</svg>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="48" font-family="Arial" font-size="32" font-weight="bold" text-anchor="middle" fill="var(--text-dark)">EKS Security Layers</text>
  <polygon points="274.2857,608 1005.7143,608 914.2857,512 365.7143,512" fill="var(--danger-vivid)" stroke="var(--warn-dk)" stroke-width="3.2" />
  <text x="640" y="568" font-family="Arial" font-size="22.4" font-weight="bold" text-anchor="middle" fill="var(--bg)">Infrastructure Security</text>
  <text x="640" y="592" font-family="Arial" font-size="16" text-anchor="middle" fill="var(--bg)">VPC, Security Groups, NACLs, IAM</text>
  <polygon points="365.7143,512 914.2857,512 822.8571,416 457.1429,416" fill="var(--warn-orange)" stroke="var(--warn-mid)" stroke-width="3.2" />
  <text x="640" y="472" font-family="Arial" font-size="22.4" font-weight="bold" text-anchor="middle" fill="var(--bg)">Cluster Security</text>
  <text x="640" y="496" font-family="Arial" font-size="16" text-anchor="middle" fill="var(--bg)">RBAC, Pod Security, Network Policies</text>
  <polygon points="457.1429,416 822.8571,416 731.4286,320 548.5714,320" fill="var(--warn-yellow)" stroke="var(--warn)" stroke-width="3.2" />
  <text x="640" y="376" font-family="Arial" font-size="22.4" font-weight="bold" text-anchor="middle" fill="var(--bg)">Workload Security</text>
  <text x="640" y="400" font-family="Arial" font-size="16" text-anchor="middle" fill="var(--bg)">Image Scanning, Admission Controllers</text>
  <polygon points="548.5714,320 731.4286,320 685.7143,224 594.2857,224" fill="var(--ok-light)" stroke="var(--ok-mid)" stroke-width="3.2" />
  <text x="640" y="280" font-family="Arial" font-size="22.4" font-weight="bold" text-anchor="middle" fill="var(--bg)">Application</text>
  <text x="640" y="304" font-family="Arial" font-size="16" text-anchor="middle" fill="var(--bg)">Secrets, Encryption</text>
  <polygon points="594.2857,224 685.7143,224 640,128 640,128" fill="var(--primary-vivid)" stroke="var(--primary-mid)" stroke-width="3.2" />
  <text x="640" y="184" font-family="Arial" font-size="22.4" font-weight="bold" text-anchor="middle" fill="var(--bg)">Data</text>
  <rect x="1042.2857" y="128" width="219.4286" height="480" fill="var(--surface-light)" stroke="var(--border)" stroke-width="1.6" rx="8" />
  <text x="1152" y="168" font-family="Arial" font-size="19.2" font-weight="bold" text-anchor="middle" fill="var(--text-dark)">Security Features</text>
  <circle cx="1078.8571" cy="208" r="12.8" fill="var(--danger-vivid)" />
  <text x="1115.4286" y="216" font-family="Arial" font-size="16" fill="var(--text-dark)">IAM Roles</text>
  <circle cx="1078.8571" cy="240" r="12.8" fill="var(--warn-orange)" />
  <text x="1115.4286" y="248" font-family="Arial" font-size="16" fill="var(--text-dark)">RBAC</text>
  <circle cx="1078.8571" cy="272" r="12.8" fill="var(--warn-yellow)" />
  <text x="1115.4286" y="280" font-family="Arial" font-size="16" fill="var(--text-dark)">Pod Security</text>
  <circle cx="1078.8571" cy="304" r="12.8" fill="var(--ok-light)" />
  <text x="1115.4286" y="312" font-family="Arial" font-size="16" fill="var(--text-dark)">Network Policies</text>
  <circle cx="1078.8571" cy="336" r="12.8" fill="var(--primary-vivid)" />
  <text x="1115.4286" y="344" font-family="Arial" font-size="16" fill="var(--text-dark)">Secrets Manager</text>
</svg>
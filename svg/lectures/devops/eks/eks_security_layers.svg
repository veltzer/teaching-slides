<svg viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="484.4444" y="40" font-family="Arial" font-size="35.9011" font-weight="bold" text-anchor="middle" fill="var(--text)">EKS Security Layers</text>
  <polygon points="40,620 928.8889,620 817.7778,520.5714 151.1111,520.5714" fill="var(--danger-fill)" stroke="var(--warn-border)" stroke-width="3.2" />
  <text x="484.4444" y="578.5714" font-family="Arial" font-size="25.1308" font-weight="bold" text-anchor="middle" fill="var(--bg)">Infrastructure Security</text>
  <text x="484.4444" y="603.4286" font-family="Arial" font-size="17.9505" text-anchor="middle" fill="var(--bg)">VPC, Security Groups, NACLs, IAM</text>
  <polygon points="151.1111,520.5714 817.7778,520.5714 706.6666,421.1429 262.2223,421.1429" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.2" />
  <text x="484.4444" y="479.1429" font-family="Arial" font-size="25.1308" font-weight="bold" text-anchor="middle" fill="var(--bg)">Cluster Security</text>
  <text x="484.4444" y="504" font-family="Arial" font-size="17.9505" text-anchor="middle" fill="var(--bg)">RBAC, Pod Security, Network Policies</text>
  <polygon points="262.2223,421.1429 706.6666,421.1429 595.5556,321.7143 373.3333,321.7143" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.2" />
  <text x="484.4444" y="379.7143" font-family="Arial" font-size="25.1308" font-weight="bold" text-anchor="middle" fill="var(--bg)">Workload Security</text>
  <text x="484.4444" y="404.5714" font-family="Arial" font-size="17.9505" text-anchor="middle" fill="var(--bg)">Image Scanning, Admission Controllers</text>
  <polygon points="373.3333,321.7143 595.5556,321.7143 540,222.2857 428.8889,222.2857" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.2" />
  <text x="484.4444" y="280.2857" font-family="Arial" font-size="25.1308" font-weight="bold" text-anchor="middle" fill="var(--bg)">Application</text>
  <text x="484.4444" y="305.1429" font-family="Arial" font-size="17.9505" text-anchor="middle" fill="var(--bg)">Secrets, Encryption</text>
  <polygon points="428.8889,222.2857 540,222.2857 484.4444,122.8571 484.4444,122.8571" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.2" />
  <text x="484.4444" y="180.8571" font-family="Arial" font-size="25.1308" font-weight="bold" text-anchor="middle" fill="var(--bg)">Data</text>
  <rect x="973.3333" y="122.8571" width="266.6667" height="497.1429" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1106.6667" y="164.2857" font-family="Arial" font-size="21.5407" font-weight="bold" text-anchor="middle" fill="var(--text)">Security Features</text>
  <rect x="1003.42" y="191.354" width="28.7208" height="28.7208" rx="14" fill="var(--danger-fill)" filter="url(#shadow)"/>
  <text x="1062.2222" y="214" font-family="Arial" font-size="17.9505" fill="var(--text)">IAM Roles</text>
  <rect x="1003.42" y="224.497" width="28.7208" height="28.7208" rx="14" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="1062.2222" y="247.1429" font-family="Arial" font-size="17.9505" fill="var(--text)">RBAC</text>
  <rect x="1003.42" y="257.64" width="28.7208" height="28.7208" rx="14" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="1062.2222" y="280.2857" font-family="Arial" font-size="17.9505" fill="var(--text)">Pod Security</text>
  <rect x="1003.42" y="290.782" width="28.7208" height="28.7208" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
  <text x="1062.2222" y="313.4286" font-family="Arial" font-size="17.9505" fill="var(--text)">Network Policies</text>
  <rect x="1003.42" y="323.925" width="28.7208" height="28.7208" rx="14" fill="var(--primary-fill)" filter="url(#shadow)"/>
  <text x="1062.2222" y="346.5714" font-family="Arial" font-size="17.9505" fill="var(--text)">Secrets Manager</text>
</svg>
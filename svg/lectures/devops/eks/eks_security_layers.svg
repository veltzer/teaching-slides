<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="484.4444" y="40" font-size="35.9011" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">EKS Security Layers</text>
  <polygon points="40,620 928.8889,620 817.7778,520.5714 151.1111,520.5714" fill="var(--danger-fill)" stroke="var(--warn-border)" stroke-width="3.2" />
  <text x="484.4444" y="578.5714" font-size="25.1308" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Infrastructure Security</text>
  <text x="484.4444" y="603.4286" font-size="17.9505" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">VPC, Security Groups, NACLs, IAM</text>
  <polygon points="151.1111,520.5714 817.7778,520.5714 706.6666,421.1429 262.2223,421.1429" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.2" />
  <text x="484.4444" y="479.1429" font-size="25.1308" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Cluster Security</text>
  <text x="484.4444" y="504" font-size="17.9505" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">RBAC, Pod Security, Network Policies</text>
  <polygon points="262.2223,421.1429 706.6666,421.1429 595.5556,321.7143 373.3333,321.7143" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.2" />
  <text x="484.4444" y="379.7143" font-size="25.1308" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Workload Security</text>
  <text x="484.4444" y="404.5714" font-size="17.9505" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Image Scanning, Admission Controllers</text>
  <polygon points="373.3333,321.7143 595.5556,321.7143 540,222.2857 428.8889,222.2857" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.2" />
  <text x="484.4444" y="280.2857" font-size="25.1308" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Application</text>
  <text x="484.4444" y="305.1429" font-size="17.9505" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Secrets, Encryption</text>
  <polygon points="428.8889,222.2857 540,222.2857 484.4444,122.8571 484.4444,122.8571" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.2" />
  <text x="484.4444" y="180.8571" font-size="25.1308" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Data</text>
  <rect x="973.3333" y="122.8571" width="266.6667" height="497.1429" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1106.6667" y="164.2857" font-size="21.5407" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Security Features</text>
  <rect x="1003.42" y="191.354" width="28.7208" height="28.7208" rx="14" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="1062.2222" y="214" font-size="17.9505" fill="var(--text)" font-family="Arial, sans-serif">IAM Roles</text>
  <rect x="1003.42" y="224.497" width="28.7208" height="28.7208" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="1062.2222" y="247.1429" font-size="17.9505" fill="var(--text)" font-family="Arial, sans-serif">RBAC</text>
  <rect x="1003.42" y="257.64" width="28.7208" height="28.7208" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="1062.2222" y="280.2857" font-size="17.9505" fill="var(--text)" font-family="Arial, sans-serif">Pod Security</text>
  <rect x="1003.42" y="290.782" width="28.7208" height="28.7208" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="1062.2222" y="313.4286" font-size="17.9505" fill="var(--text)" font-family="Arial, sans-serif">Network Policies</text>
  <rect x="1003.42" y="323.925" width="28.7208" height="28.7208" rx="14" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="1062.2222" y="346.5714" font-size="17.9505" fill="var(--text)" font-family="Arial, sans-serif">Secrets Manager</text>
</svg>
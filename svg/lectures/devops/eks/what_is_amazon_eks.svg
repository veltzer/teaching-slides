<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="45.996687177055" y="45.288904303284" width="199.772435334276" height="172.580179205049" rx="22.197533056121" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <polygon points="145.882393079578,70.526331301936 181.176410380633,116.315754570643 181.176410380633,146.84208587258 145.882393079578,192.631656509681 110.588205190317,146.84208587258 110.588205190317,116.315754570643" fill="var(--bg)"/>
  <text x="322.352820761267" y="162.105325207745" font-size="123.786128625533" fill="var(--text-muted)" font-family="Arial, sans-serif">+</text>
  <rect x="463.529401730106" y="40" width="211.76461557095" height="183.157840443223" fill="url(#grad-warn)" rx="9.513228452623" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="516.470598269894" y="146.84208587258" font-size="37.13583858766" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">AWS</text>
  <text x="745.882222491372" y="162.105325207745" font-size="123.786128625533" fill="var(--text-muted)" font-family="Arial, sans-serif">=</text>
  <rect x="887.058803460211" y="40" width="352.941196539789" height="183.157840443223" fill="var(--text)" rx="9.513228452623"/>
  <text x="975.294017301056" y="146.84208587258" font-size="49.514292896406" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">EKS</text>
  <text x="40" y="345.263165650968" font-size="55.70375788149" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Managed Kubernetes Service</text>
  <text x="40" y="436.842159556777" font-size="43.325145018937" fill="var(--text-muted)" font-family="Arial, sans-serif">• Fully managed control plane</text>
  <text x="40" y="497.894674792255" font-size="43.325145018937" fill="var(--text-muted)" font-family="Arial, sans-serif">• AWS native integrations</text>
  <text x="40" y="558.947337396128" font-size="43.325145018937" fill="var(--text-muted)" font-family="Arial, sans-serif">• High availability and security</text>
  <text x="40" y="620" font-size="43.325145018937" fill="var(--text-muted)" font-family="Arial, sans-serif">• Automatic scaling and updates</text>
</svg>

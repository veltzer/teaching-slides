<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <g>
    <rect x="40" y="40" width="360" height="185.6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="220" y="97.9999" font-size="31.0877" font-weight="bold" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">Managed</text>
    <text x="220" y="132.8" font-size="31.0877" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">Control Plane</text>
    <rect x="199.275" y="158.475" width="41.4502" height="41.4502" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>
    <rect x="459.9999" y="40" width="360" height="185.6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="639.9999" y="97.9999" font-size="31.0877" font-weight="bold" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif">AWS</text>
    <text x="639.9999" y="132.8" font-size="31.0877" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif">Integration</text>
    <polygon points="639.9999,156 655,179.1999 625,179.1999" fill="var(--warn-fill)"/>
    <rect x="880" y="40" width="360" height="185.6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="1060" y="97.9999" font-size="31.0877" font-weight="bold" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial, sans-serif">High</text>
    <text x="1060" y="132.8" font-size="31.0877" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial, sans-serif">Availability</text>
    <rect x="1030" y="156" width="60" height="23.2" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="271.9999" width="360" height="185.6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="220" y="329.9999" font-size="31.0877" font-weight="bold" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif">Security</text>
    <text x="220" y="364.8" font-size="31.0877" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif">&amp; Compliance</text>
    <rect x="199.275" y="390.475" width="41.4502" height="41.4502" rx="14" fill="url(#grad-danger)" filter="url(#shadow)"/>
    <text x="220" y="422.7999" font-size="25.9064" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">🔒</text>
    <rect x="459.9999" y="271.9999" width="360" height="185.6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="639.9999" y="329.9999" font-size="31.0877" font-weight="bold" text-anchor="middle" fill="var(--info-accent)" font-family="Arial, sans-serif">Auto</text>
    <text x="639.9999" y="364.8" font-size="31.0877" text-anchor="middle" fill="var(--info-accent)" font-family="Arial, sans-serif">Scaling</text>
    <polygon points="610,399.6 639.9999,422.7999 670,399.6" fill="var(--info-fill)"/>
    <rect x="880" y="271.9999" width="360" height="185.6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="1060" y="329.9999" font-size="31.0877" font-weight="bold" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cost</text>
    <text x="1060" y="364.8" font-size="31.0877" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">Optimization</text>
    <text x="1060" y="422.7999" font-size="41.4503" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">$</text>
    <text x="880" y="550.4" font-size="46.6316" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Key Benefits of Amazon EKS</text>
    <text x="880" y="620" font-size="36.269" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Simplified Kubernetes management with enterprise-grade features</text>
  </g>
</svg>

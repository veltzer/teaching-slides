<svg viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <g>
    <rect x="42.6667" y="41.1429" width="256" height="164.5714" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
    <text x="170.6667" y="92.5714" font-family="Arial" font-size="24.6857" font-weight="bold" text-anchor="middle" fill="var(--ok-accent)">Managed</text>
    <text x="170.6667" y="123.4286" font-family="Arial" font-size="24.6857" text-anchor="middle" fill="var(--ok-accent)">Control Plane</text>
    <circle cx="170.6667" cy="164.5714" r="16.4571" fill="var(--ok-fill)" />
    <rect x="341.3333" y="41.1429" width="256" height="164.5714" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
    <text x="469.3333" y="92.5714" font-family="Arial" font-size="24.6857" font-weight="bold" text-anchor="middle" fill="var(--warn-accent)">AWS</text>
    <text x="469.3333" y="123.4286" font-family="Arial" font-size="24.6857" text-anchor="middle" fill="var(--warn-accent)">Integration</text>
    <polygon points="469.3333,144 480,164.5714 458.6667,164.5714" fill="var(--warn-fill)" />
    <rect x="640" y="41.1429" width="256" height="164.5714" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
    <text x="768" y="92.5714" font-family="Arial" font-size="24.6857" font-weight="bold" text-anchor="middle" fill="var(--primary-accent)">High</text>
    <text x="768" y="123.4286" font-family="Arial" font-size="24.6857" text-anchor="middle" fill="var(--primary-accent)">Availability</text>
    <rect x="746.6667" y="144" width="42.6667" height="20.5714" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
    <rect x="42.6667" y="246.8571" width="256" height="164.5714" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
    <text x="170.6667" y="298.2857" font-family="Arial" font-size="24.6857" font-weight="bold" text-anchor="middle" fill="var(--danger-accent)">Security</text>
    <text x="170.6667" y="329.1429" font-family="Arial" font-size="24.6857" text-anchor="middle" fill="var(--danger-accent)">&amp; Compliance</text>
    <circle cx="170.6667" cy="370.2857" r="16.4571" fill="var(--danger-fill)" />
    <text x="170.6667" y="380.5714" font-family="Arial" font-size="20.5714" text-anchor="middle" fill="var(--bg)">🔒</text>
    <rect x="341.3333" y="246.8571" width="256" height="164.5714" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
    <text x="469.3333" y="298.2857" font-family="Arial" font-size="24.6857" font-weight="bold" text-anchor="middle" fill="var(--info-accent)">Auto</text>
    <text x="469.3333" y="329.1429" font-family="Arial" font-size="24.6857" text-anchor="middle" fill="var(--info-accent)">Scaling</text>
    <polygon points="448,360 469.3333,380.5714 490.6667,360" fill="var(--info-fill)" />
    <rect x="640" y="246.8571" width="256" height="164.5714" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
    <text x="768" y="298.2857" font-family="Arial" font-size="24.6857" font-weight="bold" text-anchor="middle" fill="var(--ok-accent)">Cost</text>
    <text x="768" y="329.1429" font-family="Arial" font-size="24.6857" text-anchor="middle" fill="var(--ok-accent)">Optimization</text>
    <text x="768" y="380.5714" font-family="Arial" font-size="32.9143" text-anchor="middle" fill="var(--ok-accent)">$</text>
    <text x="640" y="493.7143" font-family="Arial" font-size="37.0286" font-weight="bold" text-anchor="middle" fill="var(--text)">Key Benefits of Amazon EKS</text>
    <text x="640" y="555.4286" font-family="Arial" font-size="28.8" text-anchor="middle" fill="var(--text-muted)">Simplified Kubernetes management with enterprise-grade features</text>
  </g>
</svg>
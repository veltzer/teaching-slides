<svg viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <g>
    <rect x="40" y="40" width="360" height="185.6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="220" y="97.9999" font-family="Arial" font-size="31.0877" font-weight="bold" text-anchor="middle" fill="var(--ok-accent)">Managed</text>
    <text x="220" y="132.8" font-family="Arial" font-size="31.0877" text-anchor="middle" fill="var(--ok-accent)">Control Plane</text>
    <rect x="199.275" y="158.475" width="41.4502" height="41.4502" rx="14" fill="var(--ok-fill)" filter="url(#shadow)"/>
    <rect x="459.9999" y="40" width="360" height="185.6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="639.9999" y="97.9999" font-family="Arial" font-size="31.0877" font-weight="bold" text-anchor="middle" fill="var(--warn-accent)">AWS</text>
    <text x="639.9999" y="132.8" font-family="Arial" font-size="31.0877" text-anchor="middle" fill="var(--warn-accent)">Integration</text>
    <polygon points="639.9999,156 655,179.1999 625,179.1999" fill="var(--warn-fill)" />
    <rect x="880" y="40" width="360" height="185.6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="1060" y="97.9999" font-family="Arial" font-size="31.0877" font-weight="bold" text-anchor="middle" fill="var(--primary-accent)">High</text>
    <text x="1060" y="132.8" font-family="Arial" font-size="31.0877" text-anchor="middle" fill="var(--primary-accent)">Availability</text>
    <rect x="1030" y="156" width="60" height="23.2" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="271.9999" width="360" height="185.6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="220" y="329.9999" font-family="Arial" font-size="31.0877" font-weight="bold" text-anchor="middle" fill="var(--danger-accent)">Security</text>
    <text x="220" y="364.8" font-family="Arial" font-size="31.0877" text-anchor="middle" fill="var(--danger-accent)">&amp; Compliance</text>
    <rect x="199.275" y="390.475" width="41.4502" height="41.4502" rx="14" fill="var(--danger-fill)" filter="url(#shadow)"/>
    <text x="220" y="422.7999" font-family="Arial" font-size="25.9064" text-anchor="middle" fill="var(--bg)">🔒</text>
    <rect x="459.9999" y="271.9999" width="360" height="185.6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="639.9999" y="329.9999" font-family="Arial" font-size="31.0877" font-weight="bold" text-anchor="middle" fill="var(--info-accent)">Auto</text>
    <text x="639.9999" y="364.8" font-family="Arial" font-size="31.0877" text-anchor="middle" fill="var(--info-accent)">Scaling</text>
    <polygon points="610,399.6 639.9999,422.7999 670,399.6" fill="var(--info-fill)" />
    <rect x="880" y="271.9999" width="360" height="185.6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <text x="1060" y="329.9999" font-family="Arial" font-size="31.0877" font-weight="bold" text-anchor="middle" fill="var(--ok-accent)">Cost</text>
    <text x="1060" y="364.8" font-family="Arial" font-size="31.0877" text-anchor="middle" fill="var(--ok-accent)">Optimization</text>
    <text x="1060" y="422.7999" font-family="Arial" font-size="41.4503" text-anchor="middle" fill="var(--ok-accent)">$</text>
    <text x="880" y="550.4" font-family="Arial" font-size="46.6316" font-weight="bold" text-anchor="middle" fill="var(--text)">Key Benefits of Amazon EKS</text>
    <text x="880" y="620" font-family="Arial" font-size="36.269" text-anchor="middle" fill="var(--text-muted)">Simplified Kubernetes management with enterprise-grade features</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <g transform="translate(300,160)">
    <circle cx="0" cy="0" r="78.2222" fill="none" stroke="var(--primary-border)" stroke-width="4.2667" />
    <circle cx="0" cy="0" r="21.3333" fill="var(--primary-fill)" opacity="0.4" />
    <line x1="0" y1="-88" x2="0" y2="-32" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="0" y1="32" x2="0" y2="88" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="-68.2667" y1="-44.8" x2="-24.1778" y2="-16" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="24.1778" y1="16" x2="68.2667" y2="44.8" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="-68.2667" y1="44.8" x2="-24.1778" y2="16" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="24.1778" y1="-16" x2="68.2667" y2="-44.8" stroke="var(--primary-border)" stroke-width="2" />
    <circle cx="0" cy="-88" r="8.5333" fill="var(--primary-fill)" />
    <circle cx="0" cy="88" r="8.5333" fill="var(--primary-fill)" />
    <circle cx="-68.2667" cy="-44.8" r="8.5333" fill="var(--primary-fill)" />
    <circle cx="68.2667" cy="44.8" r="8.5333" fill="var(--primary-fill)" />
    <circle cx="-68.2667" cy="44.8" r="8.5333" fill="var(--primary-fill)" />
    <circle cx="68.2667" cy="-44.8" r="8.5333" fill="var(--primary-fill)" />
  </g>
  <g transform="translate(530,130)">
    <path d="M -56.8889 32 a 42.6667 42.6667 0 0 1 7.1111 -64 a 49.7778 49.7778 0 0 1 85.3333 -8 a 35.5556 35.5556 0 0 1 28.4444 48 a 28.4444 28.4444 0 0 1 -21.3333 32 z" fill="none" stroke="var(--warn-border)" stroke-width="4.2667" />
    <text x="14.2222" y="24" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial,sans-serif" font-size="25.6" font-weight="bold">AWS</text>
  </g>
  <line x1="512" y1="256" x2="682.6667" y2="232" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.5333" />
  <rect x="668.4444" y="304" width="142.2222" height="64" rx="6" fill="var(--warn-fill)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2" />
  <text x="739.5556" y="344" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial,sans-serif" font-size="28.4444" font-weight="bold">EKS</text>
  <text x="568.8889" y="496" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="42.6667" font-weight="bold">Amazon EKS Deep Dive</text>
  <text x="568.8889" y="552" text-anchor="middle" fill="var(--text-faint)" font-family="Arial,sans-serif" font-size="22.7556">Elastic Kubernetes Service on AWS</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1122.807" height="503.9826" fill="url(#bg)" rx="6" x="117.193" y="116.0174"/>
  <g transform="translate(300,160)">
    <circle cx="117.193" cy="116.0174" r="68.9559" fill="none" stroke="var(--primary-border)" stroke-width="4.2667" />
    <circle cx="117.193" cy="116.0174" r="18.8061" fill="var(--primary-fill)" opacity="0.4" />
    <line x1="117.193" y1="46.7197" x2="117.193" y2="90.8182" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="117.193" y1="141.2165" x2="117.193" y2="185.315" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="49.8245" y1="80.7386" x2="93.3333" y2="103.4178" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="141.0526" y1="128.6169" x2="184.5614" y2="151.2961" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="49.8245" y1="151.2961" x2="93.3333" y2="128.6169" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="141.0526" y1="103.4178" x2="184.5614" y2="80.7386" stroke="var(--primary-border)" stroke-width="2" />
    <circle cx="117.193" cy="46.7197" r="7.5224" fill="var(--primary-fill)" />
    <circle cx="117.193" cy="185.315" r="7.5224" fill="var(--primary-fill)" />
    <circle cx="49.8245" cy="80.7386" r="7.5224" fill="var(--primary-fill)" />
    <circle cx="184.5614" cy="151.2961" r="7.5224" fill="var(--primary-fill)" />
    <circle cx="49.8245" cy="151.2961" r="7.5224" fill="var(--primary-fill)" />
    <circle cx="184.5614" cy="80.7386" r="7.5224" fill="var(--primary-fill)" />
  </g>
  <g transform="translate(530,130)">
    <path d="M 61.0526 141.2165 a 159.2983 149.6162 117.193 116.0174 118.1798 121.6172 54.0351 a 155.216 166.3158 116.0174 117.193 116.8048 201.4035 109.7176 a 152.2807 144.0164 117.193 116.0174 118.1798 138.4165 164.5614 a 138.4165 145.2631 116.0174 117.193 116.8048 96.1404 141.2165 z" fill="none" stroke="var(--warn-border)" stroke-width="4.2667" />
    <text x="131.228" y="134.9167" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial,sans-serif" font-size="22.5674" font-weight="bold">AWS</text>
  </g>
  <line x1="622.4561" y1="317.6104" x2="790.8772" y2="298.7111" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.5333" />
  <rect x="776.842" y="355.4091" width="140.3509" height="50.3983" rx="6" fill="var(--warn-fill)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2" />
  <text x="847.0176" y="386.908" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial,sans-serif" font-size="25.0749" font-weight="bold">EKS</text>
  <text x="678.5965" y="506.6039" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="37.6124" font-weight="bold">Amazon EKS Deep Dive</text>
  <text x="678.5965" y="550.7024" text-anchor="middle" fill="var(--text-faint)" font-family="Arial,sans-serif" font-size="20.06">Elastic Kubernetes Service on AWS</text>
</svg>
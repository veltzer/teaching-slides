<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <!-- AWS cloud shape behind the wheel -->
  <rect x="440" y="250" width="400" height="260" rx="40" fill="var(--warn-border)" opacity="0.12" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="490" cy="250" r="50" fill="var(--warn-border)" opacity="0.12"/>
  <circle cx="640" cy="230" r="70" fill="var(--warn-border)" opacity="0.12"/>
  <circle cx="780" cy="250" r="55" fill="var(--warn-border)" opacity="0.12"/>
  <rect x="440" y="250" width="400" height="30" fill="var(--warn-border)" opacity="0.12"/>

  <!-- Kubernetes wheel: center at 640, 390 -->
  <!-- Outer ring -->
  <circle cx="640" cy="390" r="100" fill="none" stroke="var(--primary-border)" stroke-width="3.5"/>
  <!-- Inner hub -->
  <circle cx="640" cy="390" r="28" fill="var(--primary-fill)" opacity="0.35"/>
  <circle cx="640" cy="390" r="28" fill="none" stroke="var(--primary-border)" stroke-width="2.5"/>
  <!-- 7 spokes (heptagonal for K8s style) -->
  <!-- Spoke 1: up -->
  <line x1="640" y1="362" x2="640" y2="290" stroke="var(--primary-border)" stroke-width="3"/>
  <circle cx="640" cy="285" r="12" fill="var(--primary-fill)"/>
  <!-- Spoke 2: upper-right -->
  <line x1="662" y1="369" x2="723" y2="323" stroke="var(--primary-border)" stroke-width="3"/>
  <circle cx="728" cy="319" r="12" fill="var(--primary-fill)"/>
  <!-- Spoke 3: lower-right -->
  <line x1="665" y1="405" x2="726" y2="451" stroke="var(--primary-border)" stroke-width="3"/>
  <circle cx="731" cy="455" r="12" fill="var(--primary-fill)"/>
  <!-- Spoke 4: down -->
  <line x1="640" y1="418" x2="640" y2="490" stroke="var(--primary-border)" stroke-width="3"/>
  <circle cx="640" cy="495" r="12" fill="var(--primary-fill)"/>
  <!-- Spoke 5: lower-left -->
  <line x1="615" y1="405" x2="554" y2="451" stroke="var(--primary-border)" stroke-width="3"/>
  <circle cx="549" cy="455" r="12" fill="var(--primary-fill)"/>
  <!-- Spoke 6: upper-left -->
  <line x1="618" y1="369" x2="557" y2="323" stroke="var(--primary-border)" stroke-width="3"/>
  <circle cx="552" cy="319" r="12" fill="var(--primary-fill)"/>

  <!-- Pod rectangles scattered around -->
  <rect x="200" y="300" width="70" height="45" rx="6" fill="none" stroke="var(--ok-border)" stroke-width="2" opacity="0.4"/>
  <rect x="210" y="310" width="14" height="14" rx="2" fill="var(--ok-border)" opacity="0.4"/>

  <rect x="280" y="430" width="70" height="45" rx="6" fill="none" stroke="var(--ok-border)" stroke-width="2" opacity="0.4"/>
  <rect x="290" y="440" width="14" height="14" rx="2" fill="var(--ok-border)" opacity="0.4"/>

  <rect x="930" y="310" width="70" height="45" rx="6" fill="none" stroke="var(--ok-border)" stroke-width="2" opacity="0.4"/>
  <rect x="940" y="320" width="14" height="14" rx="2" fill="var(--ok-border)" opacity="0.4"/>

  <rect x="1010" y="440" width="70" height="45" rx="6" fill="none" stroke="var(--ok-border)" stroke-width="2" opacity="0.4"/>
  <rect x="1020" y="450" width="14" height="14" rx="2" fill="var(--ok-border)" opacity="0.4"/>

  <rect x="170" y="480" width="70" height="45" rx="6" fill="none" stroke="var(--ok-border)" stroke-width="2" opacity="0.4"/>
  <rect x="180" y="490" width="14" height="14" rx="2" fill="var(--ok-border)" opacity="0.4"/>

  <rect x="1050" y="280" width="70" height="45" rx="6" fill="none" stroke="var(--ok-border)" stroke-width="2" opacity="0.4"/>
  <rect x="1060" y="290" width="14" height="14" rx="2" fill="var(--ok-border)" opacity="0.4"/>

  <!-- Thin connecting lines from pods toward center -->
  <line x1="270" y1="322" x2="440" y2="370" stroke="var(--ok-border)" stroke-width="1" opacity="0.25"/>
  <line x1="350" y1="452" x2="540" y2="420" stroke="var(--ok-border)" stroke-width="1" opacity="0.25"/>
  <line x1="930" y1="332" x2="840" y2="370" stroke="var(--ok-border)" stroke-width="1" opacity="0.25"/>
  <line x1="1010" y1="462" x2="840" y2="420" stroke="var(--ok-border)" stroke-width="1" opacity="0.25"/>

  <!-- Title and subtitle -->
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Eks</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Managed Kubernetes on AWS</text>
</svg>

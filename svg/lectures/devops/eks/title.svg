<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Kubernetes wheel -->
  <g transform="translate(300,160)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#326ce5" stroke-width="3"/>
    <circle cx="0" cy="0" r="15" fill="#326ce5" opacity="0.4"/>
    <line x1="0" y1="-55" x2="0" y2="-20" stroke="#326ce5" stroke-width="3"/>
    <line x1="0" y1="20" x2="0" y2="55" stroke="#326ce5" stroke-width="3"/>
    <line x1="-48" y1="-28" x2="-17" y2="-10" stroke="#326ce5" stroke-width="3"/>
    <line x1="17" y1="10" x2="48" y2="28" stroke="#326ce5" stroke-width="3"/>
    <line x1="-48" y1="28" x2="-17" y2="10" stroke="#326ce5" stroke-width="3"/>
    <line x1="17" y1="-10" x2="48" y2="-28" stroke="#326ce5" stroke-width="3"/>
    <!-- Pod dots at ends -->
    <circle cx="0" cy="-55" r="6" fill="#326ce5"/>
    <circle cx="0" cy="55" r="6" fill="#326ce5"/>
    <circle cx="-48" cy="-28" r="6" fill="#326ce5"/>
    <circle cx="48" cy="28" r="6" fill="#326ce5"/>
    <circle cx="-48" cy="28" r="6" fill="#326ce5"/>
    <circle cx="48" cy="-28" r="6" fill="#326ce5"/>
  </g>
  <!-- AWS cloud shape -->
  <g transform="translate(530,130)">
    <path d="M-40,20 a30,30 0 0,1 5,-40 a35,35 0 0,1 60,-5 a25,25 0 0,1 20,30 a20,20 0 0,1-15,20 z" fill="none" stroke="#ff9900" stroke-width="3"/>
    <text x="10" y="15" text-anchor="middle" fill="#ff9900" font-family="Arial,sans-serif" font-size="18" font-weight="bold">AWS</text>
  </g>
  <!-- Arrow connecting K8s to AWS -->
  <line x1="360" y1="160" x2="480" y2="145" stroke="#888" stroke-width="2" stroke-dasharray="6"/>
  <!-- EKS badge -->
  <rect x="470" y="190" width="100" height="40" rx="8" fill="#ff9900" opacity="0.2" stroke="#ff9900" stroke-width="2"/>
  <text x="520" y="215" text-anchor="middle" fill="#ff9900" font-family="Arial,sans-serif" font-size="20" font-weight="bold">EKS</text>
  <!-- Title -->
  <text x="400" y="310" text-anchor="middle" fill="#eee" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Amazon EKS Deep Dive</text>
  <text x="400" y="345" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="16">Elastic Kubernetes Service on AWS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <g transform="translate(300,160)">
    <circle cx="40" cy="40" r="76.4743" fill="none" stroke="var(--primary-border)" stroke-width="4.2667" />
    <circle cx="40" cy="40" r="20.8566" fill="var(--primary-fill)" opacity="0.4" />
    <line x1="40" y1="-39.7501" x2="40" y2="10.9999" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="40" y1="69" x2="40" y2="119.75" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="-32.0001" y1="-0.6" x2="14.4999" y2="25.5" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="65.4999" y1="54.4999" x2="112" y2="80.5999" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="-32.0001" y1="80.5999" x2="14.4999" y2="54.4999" stroke="var(--primary-border)" stroke-width="2" />
    <line x1="65.4999" y1="25.5" x2="112" y2="-0.6" stroke="var(--primary-border)" stroke-width="2" />
    <circle cx="40" cy="-39.7501" r="8.3426" fill="var(--primary-fill)" />
    <circle cx="40" cy="119.75" r="8.3426" fill="var(--primary-fill)" />
    <circle cx="-32.0001" cy="-0.6" r="8.3426" fill="var(--primary-fill)" />
    <circle cx="112" cy="80.5999" r="8.3426" fill="var(--primary-fill)" />
    <circle cx="-32.0001" cy="80.5999" r="8.3426" fill="var(--primary-fill)" />
    <circle cx="112" cy="-0.6" r="8.3426" fill="var(--primary-fill)" />
  </g>
  <g transform="translate(530,130)">
    <path d="M -20.0001 69 a 85 78.6666 40 40 41.0546 46.4444 -27.5 a 85.1111 92.5 40 40 40.9062 130 32.75 a 77.5 72.2222 40 40 41.0546 65.7776 90.625 a 65.7776 69.9999 40 40 40.9062 17.5 69 z" fill="none" stroke="var(--warn-border)" stroke-width="4.2667" />
    <text x="54.9999" y="61.7499" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial,sans-serif" font-size="25.028" font-weight="bold">AWS</text>
  </g>
  <line x1="579.9999" y1="272" x2="760" y2="250.25" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.5333" />
  <rect x="744.9999" y="315.5" width="150" height="58" rx="6" fill="var(--warn-fill)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2" />
  <text x="820.0001" y="351.7499" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial,sans-serif" font-size="27.8089" font-weight="bold">EKS</text>
  <text x="640" y="489.5" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="41.7134" font-weight="bold">Amazon EKS Deep Dive</text>
  <text x="640" y="540.25" text-anchor="middle" fill="var(--text-faint)" font-family="Arial,sans-serif" font-size="22.2472">Elastic Kubernetes Service on AWS</text>
</svg>
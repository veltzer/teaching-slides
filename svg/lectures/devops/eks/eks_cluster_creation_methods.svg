  <text x="166.3159" y="533" font-size="19.0208" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">★★★★★</text>
  <text x="482.1052" y="533" font-size="19.0208" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif">★★★☆☆</text>
  <text x="797.8948" y="533" font-size="19.0208" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">★★★★☆</text>
  <text x="1113.6843" y="533" font-size="19.0208" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif">★★☆☆☆</text>
  <text x="82.1052" y="571.6667" font-size="19.0208" fill="var(--text-muted)" font-family="Arial, sans-serif">Automation:</text>
  <text x="166.3159" y="571.6667" font-size="19.0208" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif">★☆☆☆☆</text>
  <text x="482.1052" y="571.6667" font-size="19.0208" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">★★★★☆</text>
  <text x="797.8948" y="571.6667" font-size="19.0208" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">★★★★☆</text>
  <text x="1113.6843" y="571.6667" font-size="19.0208" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">★★★★★</text>
  <text x="82.1052" y="600.6667" font-size="19.0208" fill="var(--text-muted)" font-family="Arial, sans-serif">Version Control:</text>
  <text x="166.3159" y="600.6667" font-size="19.0208" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif">★☆☆☆☆</text>
  <text x="482.1052" y="600.6667" font-size="19.0208" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif">★★★☆☆</text>
  <text x="797.8948" y="600.6667" font-size="19.0208" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif">★★★☆☆</text>
  <text x="1113.6843" y="600.6667" font-size="19.0208" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">★★★★★</text>
</svg>
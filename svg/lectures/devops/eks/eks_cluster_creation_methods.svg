  <rect x="120.6734" y="203.6364" width="103.4344" height="9.697" fill="var(--bg)" rx="6" />
  <rect x="120.6734" y="223.0303" width="120.6734" height="9.697" fill="var(--bg)" rx="6" />
  <text x="189.6297" y="271.5152" font-family="Arial" font-size="17.239" text-anchor="middle" fill="var(--bg)">Web Interface</text>

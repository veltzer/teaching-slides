  <text x="475.4286" y="174.8571" font-family="Arial" font-size="21.9429" font-weight="bold" text-anchor="middle" fill="#FF9900">AWS CLI</text>
  <text x="475.4286" y="205.7143" font-family="monospace" font-size="18.2857" text-anchor="middle" fill="#00FF00">$ aws eks</text>
  <text x="475.4286" y="236.5714" font-family="monospace" font-size="18.2857" text-anchor="middle" fill="#00FF00">create-cluster</text>
  <text x="475.4286" y="267.4286" font-family="monospace" font-size="18.2857" text-anchor="middle" fill="#00FF00">--name my-cluster</text>

<svg viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="671.5789" y="40" font-family="Arial" font-size="38.0417" font-weight="bold" text-anchor="middle" fill="var(--text)">Ways to Create EKS Clusters</text>
  <rect x="40" y="98.0001" width="252.6316" height="193.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="166.3159" y="146.3334" font-family="Arial" font-size="22.8251" font-weight="bold" text-anchor="middle" fill="var(--bg)">AWS Console</text>
  <rect x="82.1052" y="165.6668" width="168.4211" height="9.6667" fill="var(--bg)" rx="6" />
  <rect x="82.1052" y="185" width="126.3159" height="9.6667" fill="var(--bg)" rx="6" />
  <rect x="82.1052" y="204.3333" width="147.3684" height="9.6667" fill="var(--bg)" rx="6" />
  <text x="166.3159" y="252.6667" font-family="Arial" font-size="19.0208" text-anchor="middle" fill="var(--bg)">Web Interface</text>
  <text x="166.3159" y="320.3334" font-family="Arial" font-size="19.0208" text-anchor="middle" fill="var(--text)">• Easy to use</text>
  <text x="166.3159" y="349.3333" font-family="Arial" font-size="19.0208" text-anchor="middle" fill="var(--text)">• Visual interface</text>
  <rect x="355.7895" y="98.0001" width="252.6316" height="193.3333" fill="var(--text)" stroke="var(--code-bg)" stroke-width="3.4478" rx="6" />
  <text x="482.1052" y="146.3334" font-family="Arial" font-size="22.8251" font-weight="bold" text-anchor="middle" fill="var(--warn-accent)">AWS CLI</text>
  <text x="482.1052" y="175.3334" font-family="monospace" font-size="19.0208" text-anchor="middle" fill="var(--ok-accent)">$ aws eks</text>
  <text x="482.1052" y="204.3333" font-family="monospace" font-size="19.0208" text-anchor="middle" fill="var(--ok-accent)">create-cluster</text>
  <text x="482.1052" y="233.3334" font-family="monospace" font-size="19.0208" text-anchor="middle" fill="var(--ok-accent)">--name my-cluster</text>
  <text x="482.1052" y="320.3334" font-family="Arial" font-size="19.0208" text-anchor="middle" fill="var(--text)">• Command line</text>
  <text x="482.1052" y="349.3333" font-family="Arial" font-size="19.0208" text-anchor="middle" fill="var(--text)">• Scriptable</text>
  <rect x="671.5789" y="98.0001" width="252.6316" height="193.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="797.8948" y="146.3334" font-family="Arial" font-size="22.8251" font-weight="bold" text-anchor="middle" fill="var(--bg)">eksctl</text>
  <text x="797.8948" y="175.3334" font-family="monospace" font-size="19.0208" text-anchor="middle" fill="var(--primary-accent)">$ eksctl create</text>
  <text x="797.8948" y="204.3333" font-family="monospace" font-size="19.0208" text-anchor="middle" fill="var(--primary-accent)">cluster --name</text>
  <text x="797.8948" y="233.3334" font-family="monospace" font-size="19.0208" text-anchor="middle" fill="var(--primary-accent)">my-cluster</text>
  <text x="797.8948" y="320.3334" font-family="Arial" font-size="19.0208" text-anchor="middle" fill="var(--text)">• Kubernetes native</text>
  <text x="797.8948" y="349.3333" font-family="Arial" font-size="19.0208" text-anchor="middle" fill="var(--text)">• Simple commands</text>
  <rect x="987.3684" y="98.0001" width="252.6316" height="193.3333" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1113.6843" y="146.3334" font-family="Arial" font-size="22.8251" font-weight="bold" text-anchor="middle" fill="var(--bg)">Terraform</text>
  <text x="1113.6843" y="175.3334" font-family="monospace" font-size="19.0208" text-anchor="middle" fill="var(--info-fill)">resource</text>
  <text x="1113.6843" y="204.3333" font-family="monospace" font-size="19.0208" text-anchor="middle" fill="var(--info-fill)">"aws_eks_cluster"</text>
  <text x="1113.6843" y="233.3334" font-family="monospace" font-size="19.0208" text-anchor="middle" fill="var(--info-fill)">"main" {}</text>
  <text x="1113.6843" y="320.3334" font-family="Arial" font-size="19.0208" text-anchor="middle" fill="var(--text)">• Infrastructure as Code</text>
  <text x="1113.6843" y="349.3333" font-family="Arial" font-size="19.0208" text-anchor="middle" fill="var(--text)">• Reproducible</text>
  <rect x="40" y="407.3334" width="1200" height="212.6666" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="639.9999" y="446.0001" font-family="Arial" font-size="26.6292" font-weight="bold" text-anchor="middle" fill="var(--text)">Comparison</text>

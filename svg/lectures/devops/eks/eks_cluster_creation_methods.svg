  <text x="475.4286" y="390.8571" font-family="Arial" font-size="18.2857" text-anchor="middle" fill="#333">• Scriptable</text>
  <rect x="640" y="123.4286" width="219.4286" height="205.7143" fill="#326CE5" stroke="#1E4A73" stroke-width="3.6571" rx="14.6286" />
  <text x="749.7143" y="174.8571" font-family="Arial" font-size="21.9429" font-weight="bold" text-anchor="middle" fill="white">eksctl</text>
  <text x="749.7143" y="205.7143" font-family="monospace" font-size="18.2857" text-anchor="middle" fill="#E8F4FD">$ eksctl create</text>
  <text x="749.7143" y="236.5714" font-family="monospace" font-size="18.2857" text-anchor="middle" fill="#E8F4FD">cluster --name</text>
  <text x="749.7143" y="267.4286" font-family="monospace" font-size="18.2857" text-anchor="middle" fill="#E8F4FD">my-cluster</text>
  <text x="749.7143" y="360" font-family="Arial" font-size="18.2857" text-anchor="middle" fill="#333">• Kubernetes native</text>
  <text x="749.7143" y="390.8571" font-family="Arial" font-size="18.2857" text-anchor="middle" fill="#333">• Simple commands</text>
  <rect x="914.2857" y="123.4286" width="219.4286" height="205.7143" fill="#623CE4" stroke="#4B2DB8" stroke-width="3.6571" rx="14.6286" />
  <text x="1024" y="174.8571" font-family="Arial" font-size="21.9429" font-weight="bold" text-anchor="middle" fill="white">Terraform</text>

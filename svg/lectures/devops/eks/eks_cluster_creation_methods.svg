  <rect x="344.7812" y="116.3637" width="206.8687" height="193.9394" fill="var(--text)" stroke="var(--code-bg)" stroke-width="3.4478" rx="6" />
  <text x="448.2155" y="164.8485" font-family="Arial" font-size="20.6869" font-weight="bold" text-anchor="middle" fill="var(--warn-accent)">AWS CLI</text>
  <text x="448.2155" y="193.9394" font-family="monospace" font-size="17.239" text-anchor="middle" fill="var(--ok-accent)">$ aws eks</text>
  <text x="448.2155" y="223.0303" font-family="monospace" font-size="17.239" text-anchor="middle" fill="var(--ok-accent)">create-cluster</text>
  <text x="448.2155" y="252.1213" font-family="monospace" font-size="17.239" text-anchor="middle" fill="var(--ok-accent)">--name my-cluster</text>
  <text x="448.2155" y="339.394" font-family="Arial" font-size="17.239" text-anchor="middle" fill="var(--text)">• Command line</text>
  <text x="448.2155" y="368.4848" font-family="Arial" font-size="17.239" text-anchor="middle" fill="var(--text)">• Scriptable</text>
  <rect x="603.367" y="116.3637" width="206.8687" height="193.9394" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="706.8014" y="164.8485" font-family="Arial" font-size="20.6869" font-weight="bold" text-anchor="middle" fill="var(--bg)">eksctl</text>
  <text x="706.8014" y="193.9394" font-family="monospace" font-size="17.239" text-anchor="middle" fill="var(--primary-accent)">$ eksctl create</text>
  <text x="706.8014" y="223.0303" font-family="monospace" font-size="17.239" text-anchor="middle" fill="var(--primary-accent)">cluster --name</text>
  <text x="706.8014" y="252.1213" font-family="monospace" font-size="17.239" text-anchor="middle" fill="var(--primary-accent)">my-cluster</text>
  <text x="706.8014" y="339.394" font-family="Arial" font-size="17.239" text-anchor="middle" fill="var(--text)">• Kubernetes native</text>
  <text x="706.8014" y="368.4848" font-family="Arial" font-size="17.239" text-anchor="middle" fill="var(--text)">• Simple commands</text>
  <rect x="861.9529" y="116.3637" width="206.8687" height="193.9394" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="965.3873" y="164.8485" font-family="Arial" font-size="20.6869" font-weight="bold" text-anchor="middle" fill="var(--bg)">Terraform</text>
  <text x="965.3873" y="193.9394" font-family="monospace" font-size="17.239" text-anchor="middle" fill="var(--info-fill)">resource</text>
  <text x="965.3873" y="223.0303" font-family="monospace" font-size="17.239" text-anchor="middle" fill="var(--info-fill)">"aws_eks_cluster"</text>
  <text x="965.3873" y="252.1213" font-family="monospace" font-size="17.239" text-anchor="middle" fill="var(--info-fill)">"main" {}</text>
  <text x="965.3873" y="339.394" font-family="Arial" font-size="17.239" text-anchor="middle" fill="var(--text)">• Infrastructure as Code</text>
  <text x="965.3873" y="368.4848" font-family="Arial" font-size="17.239" text-anchor="middle" fill="var(--text)">• Reproducible</text>
  <rect x="86.1953" y="426.6667" width="982.6263" height="213.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />

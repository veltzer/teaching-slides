<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="671.5789" y="40" font-size="38.0417" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Ways to Create EKS Clusters</text>
  <rect x="40" y="98.0001" width="252.6316" height="193.3333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="166.3159" y="146.3334" font-size="22.8251" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">AWS Console</text>
  <rect x="82.1052" y="165.6668" width="168.4211" height="9.6667" fill="var(--bg)" rx="6" />
  <rect x="82.1052" y="185" width="126.3159" height="9.6667" fill="var(--bg)" rx="6" />
  <rect x="82.1052" y="204.3333" width="147.3684" height="9.6667" fill="var(--bg)" rx="6" />
  <text x="166.3159" y="252.6667" font-size="19.0208" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Web Interface</text>
  <text x="166.3159" y="320.3334" font-size="19.0208" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">• Easy to use</text>
  <text x="166.3159" y="349.3333" font-size="19.0208" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">• Visual interface</text>
  <rect x="355.7895" y="98.0001" width="252.6316" height="193.3333" fill="var(--text)" stroke="var(--code-bg)" stroke-width="3.4478" rx="6" />
  <text x="482.1052" y="146.3334" font-size="22.8251" font-weight="bold" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif">AWS CLI</text>
  <text x="482.1052" y="175.3334" font-size="19.0208" text-anchor="middle" fill="var(--ok-accent)" font-family="Courier New, monospace">$ aws eks</text>
  <text x="482.1052" y="204.3333" font-size="19.0208" text-anchor="middle" fill="var(--ok-accent)" font-family="Courier New, monospace">create-cluster</text>
  <text x="482.1052" y="233.3334" font-size="19.0208" text-anchor="middle" fill="var(--ok-accent)" font-family="Courier New, monospace">--name my-cluster</text>
  <text x="482.1052" y="320.3334" font-size="19.0208" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">• Command line</text>
  <text x="482.1052" y="349.3333" font-size="19.0208" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">• Scriptable</text>
  <rect x="671.5789" y="98.0001" width="252.6316" height="193.3333" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="797.8948" y="146.3334" font-size="22.8251" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">eksctl</text>
  <text x="797.8948" y="175.3334" font-size="19.0208" text-anchor="middle" fill="var(--primary-accent)" font-family="Courier New, monospace">$ eksctl create</text>
  <text x="797.8948" y="204.3333" font-size="19.0208" text-anchor="middle" fill="var(--primary-accent)" font-family="Courier New, monospace">cluster --name</text>
  <text x="797.8948" y="233.3334" font-size="19.0208" text-anchor="middle" fill="var(--primary-accent)" font-family="Courier New, monospace">my-cluster</text>
  <text x="797.8948" y="320.3334" font-size="19.0208" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">• Kubernetes native</text>
  <text x="797.8948" y="349.3333" font-size="19.0208" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">• Simple commands</text>
  <rect x="987.3684" y="98.0001" width="252.6316" height="193.3333" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1113.6843" y="146.3334" font-size="22.8251" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Terraform</text>
  <text x="1113.6843" y="175.3334" font-size="19.0208" text-anchor="middle" fill="var(--info-fill)" font-family="Courier New, monospace">resource</text>
  <text x="1113.6843" y="204.3333" font-size="19.0208" text-anchor="middle" fill="var(--info-fill)" font-family="Courier New, monospace">"aws_eks_cluster"</text>
  <text x="1113.6843" y="233.3334" font-size="19.0208" text-anchor="middle" fill="var(--info-fill)" font-family="Courier New, monospace">"main" {}</text>
  <text x="1113.6843" y="320.3334" font-size="19.0208" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">• Infrastructure as Code</text>
  <text x="1113.6843" y="349.3333" font-size="19.0208" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">• Reproducible</text>
  <rect x="40" y="407.3334" width="1200" height="212.6666" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="639.9999" y="446.0001" font-size="26.6292" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Comparison</text>
  <line x1="82.1052" y1="465.3334" x2="1197.8948" y2="465.3334" stroke="var(--border)" stroke-width="1.7239" />
  <text x="166.3159" y="494.3334" font-size="19.0208" font-weight="bold" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Console</text>
  <text x="482.1052" y="494.3334" font-size="19.0208" font-weight="bold" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">CLI</text>
  <text x="797.8948" y="494.3334" font-size="19.0208" font-weight="bold" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">eksctl</text>
  <text x="1113.6843" y="494.3334" font-size="19.0208" font-weight="bold" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Terraform</text>

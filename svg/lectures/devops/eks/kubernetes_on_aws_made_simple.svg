<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#232F3E" rx="32" />
  <!-- AWS background panel -->
  <rect x="80" y="80" width="500" height="560" fill="#1a2332" rx="16" opacity="0.8" />
  <!-- Kubernetes logo circle -->
  <circle cx="330" cy="300" r="140" fill="#326CE5" />
  <polygon points="330,192 384,270 384,330 330,408 276,330 276,270" fill="white" />
  <!-- Wheel spokes -->
  <line x1="330" y1="160" x2="330" y2="192" stroke="white" stroke-width="8" />
  <line x1="330" y1="408" x2="330" y2="440" stroke="white" stroke-width="8" />
  <line x1="190" y1="300" x2="222" y2="300" stroke="white" stroke-width="8" />
  <line x1="438" y1="300" x2="470" y2="300" stroke="white" stroke-width="8" />
  <!-- Labels -->
  <text x="330" y="490" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Kubernetes</text>
  <!-- AWS EKS panel -->
  <rect x="650" y="200" width="550" height="320" fill="#FF9900" rx="12" opacity="0.15" />
  <text x="925" y="310" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#FF9900" text-anchor="middle">EKS</text>
  <text x="925" y="390" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle">Elastic Kubernetes Service</text>
  <text x="925" y="450" font-family="Arial, sans-serif" font-size="22" fill="#aaaaaa" text-anchor="middle">Managed Kubernetes on AWS</text>
  <!-- Connection arrow -->
  <line x1="490" y1="300" x2="640" y2="300" stroke="#FF9900" stroke-width="4" stroke-dasharray="12,6" />
  <polygon points="640,290 660,300 640,310" fill="#FF9900" />
  <!-- Title -->
  <text x="640" y="660" font-family="Arial, sans-serif" font-size="24" fill="#888888" text-anchor="middle">Amazon EKS — Kubernetes on AWS Made Simple</text>
</svg>

    <text x="866.229497" y="251.745925" font-size="18.882777" text-anchor="middle" fill="var(--text-muted)" font-family="Arial, sans-serif">Pods</text>
    <rect x="1003.934525" y="122.857143" width="196.721229" height="147.301654" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.957887" filter="url(#shadow)"/>
    <text x="1102.295084" y="159.682526" font-size="22.659286" font-weight="bold" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial, sans-serif">Worker Node 3</text>
    <rect x="1044.07" y="186.832" width="37.7656" height="37.7656" rx="14" fill="url(#grad-ok)" filter="url(#shadow)"/>

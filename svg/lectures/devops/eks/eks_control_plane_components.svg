  <rect x="94.545340909091" y="527.200033600002" width="1090.908977272727" height="92.799966399998" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.006490739057" filter="url(#shadow)"/>
  <text x="639.999886363637" y="573.600076800005" font-size="27.726552251978" font-weight="bold" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">✓ Fully Managed ✓ High Availability ✓ Auto Updates ✓ AWS Integration</text>

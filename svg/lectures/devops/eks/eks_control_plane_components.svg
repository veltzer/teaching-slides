  <rect x="694.545454545455" y="318.400019200001" width="545.454545454545" height="139.200009600001" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.006490739057" filter="url(#shadow)"/>
  <text x="967.272613636364" y="376.399983199999" font-size="32.347683218923" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Scheduler</text>

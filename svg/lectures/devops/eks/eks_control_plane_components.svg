<svg viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" fill="var(--text)" stroke="var(--warn-border)" stroke-width="5.4" rx="6" />
  <text x="639.9999" y="98" font-family="Arial" font-size="35.6154" font-weight="bold" text-anchor="middle" fill="var(--warn-accent)">EKS Control Plane (Managed by AWS)</text>
  <rect x="112" y="156" width="480" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="352" y="204.3333" font-family="Arial" font-size="27.7009" font-weight="bold" text-anchor="middle" fill="var(--bg)">Kubernetes API Server</text>
  <text x="352" y="243" font-family="Arial" font-size="19.7864" text-anchor="middle" fill="var(--bg)">RESTful API, Authentication, Authorization</text>
  <rect x="688" y="156" width="480" height="116" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="927.9999" y="204.3333" font-family="Arial" font-size="27.7009" font-weight="bold" text-anchor="middle" fill="var(--bg)">etcd Database</text>
  <text x="927.9999" y="243" font-family="Arial" font-size="19.7864" text-anchor="middle" fill="var(--bg)">Distributed key-value store</text>
  <rect x="112" y="330" width="480" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="352" y="378.3333" font-family="Arial" font-size="27.7009" font-weight="bold" text-anchor="middle" fill="var(--bg)">Controller Manager</text>
  <text x="352" y="417" font-family="Arial" font-size="19.7864" text-anchor="middle" fill="var(--bg)">Watches cluster state, makes changes</text>
  <rect x="688" y="330" width="480" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="927.9999" y="378.3333" font-family="Arial" font-size="27.7009" font-weight="bold" text-anchor="middle" fill="var(--bg)">Scheduler</text>
  <text x="927.9999" y="417" font-family="Arial" font-size="19.7864" text-anchor="middle" fill="var(--bg)">Assigns pods to nodes</text>
  <line x1="352" y1="272" x2="352" y2="330" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="927.9999" y1="272" x2="927.9999" y2="330" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="591.9999" y1="214" x2="688" y2="214" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="591.9999" y1="388" x2="688" y2="388" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 7.4667,0" fill="#f9a825" />
    </marker>
  </defs>
  <rect x="159.9999" y="504" width="959.9999" height="77.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="542.6667" font-family="Arial" font-size="23.7436" font-weight="bold" text-anchor="middle" fill="var(--ok-accent)">✓ Fully Managed ✓ High Availability ✓ Auto Updates ✓ AWS Integration</text>
</svg>
  <rect x="694.545454545455" y="109.6000048" width="545.454545454545" height="139.200009600001" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.006490739057" filter="url(#shadow)"/>
  <text x="967.272613636364" y="167.599968799998" font-size="32.347683218923" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">etcd Database</text>

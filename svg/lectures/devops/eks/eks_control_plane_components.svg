<svg viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="106.6667" y="90" width="1066.6667" height="540" fill="var(--text)" stroke="var(--warn-border)" stroke-width="5.4" rx="6" />
  <text x="640" y="144" font-family="Arial" font-size="32.4" font-weight="bold" text-anchor="middle" fill="var(--warn-accent)">EKS Control Plane (Managed by AWS)</text>
  <rect x="170.6667" y="198" width="426.6667" height="108" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="384" y="243" font-family="Arial" font-size="25.2" font-weight="bold" text-anchor="middle" fill="var(--bg)">Kubernetes API Server</text>
  <text x="384" y="279" font-family="Arial" font-size="18" text-anchor="middle" fill="var(--bg)">RESTful API, Authentication, Authorization</text>
  <rect x="682.6667" y="198" width="426.6667" height="108" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="896" y="243" font-family="Arial" font-size="25.2" font-weight="bold" text-anchor="middle" fill="var(--bg)">etcd Database</text>
  <text x="896" y="279" font-family="Arial" font-size="18" text-anchor="middle" fill="var(--bg)">Distributed key-value store</text>
  <rect x="170.6667" y="360" width="426.6667" height="108" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="384" y="405" font-family="Arial" font-size="25.2" font-weight="bold" text-anchor="middle" fill="var(--bg)">Controller Manager</text>
  <text x="384" y="441" font-family="Arial" font-size="18" text-anchor="middle" fill="var(--bg)">Watches cluster state, makes changes</text>
  <rect x="682.6667" y="360" width="426.6667" height="108" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="896" y="405" font-family="Arial" font-size="25.2" font-weight="bold" text-anchor="middle" fill="var(--bg)">Scheduler</text>
  <text x="896" y="441" font-family="Arial" font-size="18" text-anchor="middle" fill="var(--bg)">Assigns pods to nodes</text>
  <line x1="384" y1="306" x2="384" y2="360" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="896" y1="306" x2="896" y2="360" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="597.3333" y1="252" x2="682.6667" y2="252" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="597.3333" y1="414" x2="682.6667" y2="414" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 7.4667,0" fill="#f9a825" />
    </marker>
  </defs>
  <rect x="213.3333" y="522" width="853.3333" height="72" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="640" y="558" font-family="Arial" font-size="21.6" font-weight="bold" text-anchor="middle" fill="var(--ok-accent)">✓ Fully Managed ✓ High Availability ✓ Auto Updates ✓ AWS Integration</text>
</svg>
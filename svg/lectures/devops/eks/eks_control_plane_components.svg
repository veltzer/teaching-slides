<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="1200" height="580" fill="var(--text)" stroke="var(--warn-border)" stroke-width="5.4" rx="6"/>
  <text x="639.9999" y="98" font-size="35.6154" font-weight="bold" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif">EKS Control Plane (Managed by AWS)</text>
  <rect x="112" y="156" width="480" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="352" y="204.3333" font-size="27.7009" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Kubernetes API Server</text>
  <text x="352" y="243" font-size="19.7864" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">RESTful API, Authentication, Authorization</text>
  <rect x="688" y="156" width="480" height="116" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="927.9999" y="204.3333" font-size="27.7009" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">etcd Database</text>
  <text x="927.9999" y="243" font-size="19.7864" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Distributed key-value store</text>
  <rect x="112" y="330" width="480" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="352" y="378.3333" font-size="27.7009" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Controller Manager</text>
  <text x="352" y="417" font-size="19.7864" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Watches cluster state, makes changes</text>
  <rect x="688" y="330" width="480" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="927.9999" y="378.3333" font-size="27.7009" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Scheduler</text>
  <text x="927.9999" y="417" font-size="19.7864" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Assigns pods to nodes</text>
  <line x1="352" y1="272" x2="352" y2="330" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="927.9999" y1="272" x2="927.9999" y2="330" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="591.9999" y1="214" x2="688" y2="214" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="591.9999" y1="388" x2="688" y2="388" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="159.9999" y="504" width="959.9999" height="77.3333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="542.6667" font-size="23.7436" font-weight="bold" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif">✓ Fully Managed ✓ High Availability ✓ Auto Updates ✓ AWS Integration</text>
</svg>

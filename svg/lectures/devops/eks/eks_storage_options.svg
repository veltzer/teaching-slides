  <polygon points="839.9999,189.1429 889.9999,214 939.9999,189.1429 889.9999,230.5714" fill="var(--bg)" />
  <text x="889.9999" y="214" font-family="Arial" font-size="18.0624" text-anchor="middle" fill="var(--info-accent)">⚡</text>
  <text x="889.9999" y="255.4286" font-family="Arial" font-size="18.0624" text-anchor="middle" fill="var(--bg)">• Lustre/NetApp</text>
  <text x="889.9999" y="280.2857" font-family="Arial" font-size="18.0624" text-anchor="middle" fill="var(--bg)">• HPC workloads</text>

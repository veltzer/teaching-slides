<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" font-size="36.1248" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">EKS Storage Solutions</text>
  <rect x="40" y="89.7143" width="300" height="198.8572" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="190" y="131.1429" font-size="25.2873" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Amazon EBS</text>
  <text x="190" y="164.2857" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Block Storage</text>
  <rect x="140" y="180.8571" width="100" height="49.7143" fill="var(--text)" stroke="var(--code-bg)" stroke-width="1.6842" rx="6"/>
  <rect x="175.55" y="191.264" width="28.8998" height="28.8998" rx="14" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="190" y="255.4286" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">• Single AZ</text>
  <text x="190" y="280.2857" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">• High IOPS</text>
  <rect x="390" y="89.7143" width="300" height="198.8572" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="540" y="131.1429" font-size="25.2873" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Amazon EFS</text>
  <text x="540" y="164.2857" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">File Storage</text>
  <rect x="475.55" y="191.264" width="28.8998" height="28.8998" rx="14" fill="var(--bg)"/>
  <rect x="525.55" y="191.264" width="28.8998" height="28.8998" rx="14" fill="var(--bg)"/>
  <rect x="575.55" y="191.264" width="28.8998" height="28.8998" rx="14" fill="var(--bg)"/>
  <line x1="490" y1="205.7143" x2="589.9999" y2="205.7143" stroke="var(--bg)" stroke-width="2"/>
  <text x="540" y="255.4286" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">• Multi-AZ</text>
  <text x="540" y="280.2857" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">• Shared access</text>
  <rect x="739.9999" y="89.7143" width="300" height="198.8572" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="889.9999" y="131.1429" font-size="25.2873" font-weight="bold" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Amazon FSx</text>
  <text x="889.9999" y="164.2857" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">High Performance</text>
  <polygon points="839.9999,189.1429 889.9999,214 939.9999,189.1429 889.9999,230.5714" fill="var(--bg)"/>
  <text x="889.9999" y="214" font-size="18.0624" text-anchor="middle" fill="var(--info-accent)" font-family="Arial, sans-serif">⚡</text>
  <text x="889.9999" y="255.4286" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">• Lustre/NetApp</text>
  <text x="889.9999" y="280.2857" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">• HPC workloads</text>
  <rect x="40" y="321.7143" width="999.9999" height="132.5714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="540" y="363.1429" font-size="28.8999" font-weight="bold" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial, sans-serif">Container Storage Interface (CSI) Drivers</text>
  <rect x="100" y="388" width="200" height="41.4286" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="200" y="412.8572" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">EBS CSI Driver</text>
  <rect x="340" y="388" width="200" height="41.4286" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="440" y="412.8572" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">EFS CSI Driver</text>
  <rect x="580" y="388" width="200" height="41.4286" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="680" y="412.8572" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">FSx CSI Driver</text>
  <rect x="819.9999" y="388" width="200" height="41.4286" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="920" y="412.8572" font-size="18.0624" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif">Snapshot CSI</text>
  <rect x="40" y="487.4286" width="1200" height="132.5714" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="639.9999" y="520.5715" font-size="25.2873" font-weight="bold" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif">Storage Class Examples</text>
  <text x="80" y="553.7143" font-size="18.0624" fill="var(--primary-accent)" font-family="Courier New, monospace">apiVersion: storage.k8s.io/v1</text>
  <text x="80" y="578.5714" font-size="18.0624" fill="var(--primary-accent)" font-family="Courier New, monospace">kind: StorageClass</text>
  <text x="80" y="603.4286" font-size="18.0624" fill="var(--primary-accent)" font-family="Courier New, monospace">provisioner: ebs.csi.aws.com</text>
  <text x="639.9999" y="553.7143" font-size="18.0624" fill="var(--ok-accent)" font-family="Courier New, monospace">apiVersion: storage.k8s.io/v1</text>
  <text x="639.9999" y="578.5714" font-size="18.0624" fill="var(--ok-accent)" font-family="Courier New, monospace">kind: StorageClass</text>
  <text x="639.9999" y="603.4286" font-size="18.0624" fill="var(--ok-accent)" font-family="Courier New, monospace">provisioner: efs.csi.aws.com</text>
</svg>

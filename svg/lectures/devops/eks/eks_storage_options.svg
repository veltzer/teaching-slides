  <text x="190" y="280.2857" font-family="Arial" font-size="18.0624" text-anchor="middle" fill="var(--bg)">• High IOPS</text>
  <rect x="390" y="89.7143" width="300" height="198.8572" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="540" y="131.1429" font-family="Arial" font-size="25.2873" font-weight="bold" text-anchor="middle" fill="var(--bg)">Amazon EFS</text>
  <text x="540" y="164.2857" font-family="Arial" font-size="18.0624" text-anchor="middle" fill="var(--bg)">File Storage</text>
  <rect x="475.55" y="191.264" width="28.8998" height="28.8998" rx="14" fill="var(--bg)"/>
  <rect x="525.55" y="191.264" width="28.8998" height="28.8998" rx="14" fill="var(--bg)"/>
  <rect x="575.55" y="191.264" width="28.8998" height="28.8998" rx="14" fill="var(--bg)"/>
  <line x1="490" y1="205.7143" x2="589.9999" y2="205.7143" stroke="var(--bg)" stroke-width="2" />
  <text x="540" y="255.4286" font-family="Arial" font-size="18.0624" text-anchor="middle" fill="var(--bg)">• Multi-AZ</text>
  <text x="540" y="280.2857" font-family="Arial" font-size="18.0624" text-anchor="middle" fill="var(--bg)">• Shared access</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--code-bg)" rx="6"/>
  <rect x="85.3333" y="208" width="142.2222" height="64" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.8444" />
  <text x="156.4444" y="248" text-anchor="middle" font-family="monospace" font-size="17.0667" fill="var(--danger-accent)">logs</text>
  <rect x="85.3333" y="296" width="142.2222" height="64" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.8444" />
  <text x="156.4444" y="336" text-anchor="middle" font-family="monospace" font-size="17.0667" fill="var(--danger-accent)">metrics</text>
  <rect x="85.3333" y="384" width="142.2222" height="64" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.8444" />
  <text x="156.4444" y="424" text-anchor="middle" font-family="monospace" font-size="17.0667" fill="var(--danger-accent)">events</text>
  <line x1="241.7778" y1="240" x2="369.7778" y2="320" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="241.7778" y1="328" x2="369.7778" y2="320" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="241.7778" y1="416" x2="369.7778" y2="320" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="369.7778" y="256" width="170.6667" height="128" rx="6" fill="var(--ok-fill)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" />
  <text x="455.1111" y="312" text-anchor="middle" font-family="sans-serif" font-size="19.9111" font-weight="bold" fill="var(--ok-accent)">INPUT</text>
  <text x="455.1111" y="344" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)">collect</text>
  <line x1="554.6667" y1="320" x2="597.3333" y2="320" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="597.3333" y="240" width="170.6667" height="160" rx="6" fill="var(--warn-fill)" opacity="0.15" stroke="var(--warn-border)" stroke-width="2" />
  <text x="682.6667" y="304" text-anchor="middle" font-family="sans-serif" font-size="19.9111" font-weight="bold" fill="var(--warn-accent)">FILTER</text>
  <text x="682.6667" y="336" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)">grok | mutate</text>
  <text x="682.6667" y="364.8" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)">date | geoip</text>
  <line x1="782.2222" y1="320" x2="824.8889" y2="320" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="824.8889" y="256" width="170.6667" height="128" rx="6" fill="var(--danger-fill)" opacity="0.15" stroke="var(--danger-border)" stroke-width="2" />
  <text x="910.2222" y="312" text-anchor="middle" font-family="sans-serif" font-size="19.9111" font-weight="bold" fill="var(--danger-accent)">OUTPUT</text>
  <text x="910.2222" y="344" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)">elasticsearch</text>
  <line x1="1009.7778" y1="304" x2="1080.8889" y2="272" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="1009.7778" y1="320" x2="1080.8889" y2="320" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="1009.7778" y1="336" x2="1080.8889" y2="368" stroke="var(--danger-border)" stroke-width="2" />
  <circle cx="1095.1111" cy="272" r="11.3778" fill="var(--danger-fill)" opacity="0.5" />
  <circle cx="1095.1111" cy="320" r="11.3778" fill="var(--danger-fill)" opacity="0.5" />
  <circle cx="1095.1111" cy="368" r="11.3778" fill="var(--danger-fill)" opacity="0.5" />
  <text x="568.8889" y="88" text-anchor="middle" font-family="sans-serif" font-size="42.6667" font-weight="bold" fill="var(--surface)">Logstash</text>
  <text x="568.8889" y="136" text-anchor="middle" font-family="sans-serif" font-size="22.7556" fill="var(--text-faint)">Data Processing Pipeline</text>
  <text x="568.8889" y="592" text-anchor="middle" font-family="monospace" font-size="18.4889" fill="var(--text-muted)">input | filter | output</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="130" y="228.5" width="150" height="58" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.8444" />
  <text x="204.9999" y="264.75" text-anchor="middle" font-size="16.6854" fill="var(--danger-accent)" font-family="Courier New, monospace">logs</text>
  <rect x="130" y="308.25" width="150" height="58" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.8444" />
  <text x="204.9999" y="344.5" text-anchor="middle" font-size="16.6854" fill="var(--danger-accent)" font-family="Courier New, monospace">metrics</text>
  <rect x="130" y="388" width="150" height="58" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.8444" />
  <text x="204.9999" y="424.25" text-anchor="middle" font-size="16.6854" fill="var(--danger-accent)" font-family="Courier New, monospace">events</text>
  <line x1="295" y1="257.5" x2="430" y2="330" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="295" y1="337.25" x2="430" y2="330" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="295" y1="417" x2="430" y2="330" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="430" y="272" width="180" height="116" rx="6" fill="url(#grad-ok)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="322.75" text-anchor="middle" font-size="19.4662" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">INPUT</text>
  <text x="520" y="351.75" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">collect</text>
  <line x1="625" y1="330" x2="670" y2="330" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="670" y="257.5" width="180" height="145" rx="6" fill="url(#grad-warn)" opacity="0.15" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="315.5" text-anchor="middle" font-size="19.4662" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">FILTER</text>
  <text x="760" y="344.5" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Courier New, monospace">grok | mutate</text>
  <text x="760" y="370.6" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Courier New, monospace">date | geoip</text>
  <line x1="865" y1="330" x2="910" y2="330" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="910" y="272" width="180" height="116" rx="6" fill="url(#grad-danger)" opacity="0.15" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="322.75" text-anchor="middle" font-size="19.4662" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">OUTPUT</text>
  <text x="1000" y="351.75" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">elasticsearch</text>
  <line x1="1105" y1="315.5" x2="1180" y2="286.5" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="1105" y1="330" x2="1180" y2="330" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="1105" y1="344.5" x2="1180" y2="373.5" stroke="var(--danger-border)" stroke-width="2" />
  <circle cx="1195" cy="286.5" r="11.1236" fill="var(--danger-fill)" opacity="0.5" />
  <circle cx="1195" cy="330" r="11.1236" fill="var(--danger-fill)" opacity="0.5" />
  <circle cx="1195" cy="373.5" r="11.1236" fill="var(--danger-fill)" opacity="0.5" />
  <text x="640" y="119.75" text-anchor="middle" font-size="41.7133" font-weight="bold" fill="var(--surface)" font-family="Arial, sans-serif">Logstash</text>
  <text x="640" y="163.25" text-anchor="middle" font-size="22.2471" fill="var(--text-faint)" font-family="Arial, sans-serif">Data Processing Pipeline</text>
  <text x="640" y="576.5" text-anchor="middle" font-size="18.0758" fill="var(--text-muted)" font-family="Courier New, monospace">input | filter | output</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
  <rect x="116.3636" y="65.4545" width="174.5455" height="78.5455" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="203.6364" y="111.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6182" font-weight="bold" fill="var(--bg)">Agile Principles</text>
  <path d="M 290.9091 104.7273 L 407.2727 196.3636" stroke="var(--text)" stroke-width="2.3273" marker-end="url(#arrowhead7)" />
  <rect x="116.3636" y="196.3636" width="174.5455" height="78.5455" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="203.6364" y="242.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6182" font-weight="bold" fill="var(--bg)">Lean Practices</text>
  <path d="M 290.9091 235.6364 L 407.2727 235.6364" stroke="var(--text)" stroke-width="2.3273" marker-end="url(#arrowhead7)" />
  <rect x="407.2727" y="170.1818" width="116.3636" height="78.5455" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="465.4545" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6182" font-weight="bold" fill="var(--bg)">DevOps</text>
  <path d="M 523.6364 209.4545 L 640 130.9091" stroke="var(--text)" stroke-width="2.3273" marker-end="url(#arrowhead7)" />
  <rect x="640" y="91.6364" width="209.4545" height="65.4545" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="744.7273" y="117.8182" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2909" fill="var(--bg)">Continuous</text>
  <text x="744.7273" y="141.3818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2909" fill="var(--bg)">Integration</text>
  <path d="M 523.6364 209.4545 L 640 209.4545" stroke="var(--text)" stroke-width="2.3273" marker-end="url(#arrowhead7)" />
  <rect x="640" y="176.7273" width="209.4545" height="65.4545" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="744.7273" y="202.9091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2909" fill="var(--bg)">Continuous</text>
  <text x="744.7273" y="226.4727" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2909" fill="var(--bg)">Delivery</text>
  <path d="M 523.6364 209.4545 L 640 288" stroke="var(--text)" stroke-width="2.3273" marker-end="url(#arrowhead7)" />
  <rect x="640" y="261.8182" width="209.4545" height="65.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="744.7273" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2909" fill="var(--bg)">Infrastructure</text>
  <text x="744.7273" y="311.5636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2909" fill="var(--bg)">as Code</text>
  <path d="M 523.6364 235.6364 L 640 366.5455" stroke="var(--text)" stroke-width="2.3273" marker-end="url(#arrowhead7)" />
  <rect x="640" y="346.9091" width="209.4545" height="65.4545" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="744.7273" y="373.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2909" fill="var(--bg)">Continuous</text>
  <text x="744.7273" y="396.6545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2909" fill="var(--bg)">Monitoring</text>
</svg>
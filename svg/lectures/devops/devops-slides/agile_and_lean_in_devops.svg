<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
  <rect x="111.6981" y="80" width="251.5724" height="113.2076" rx="8.6478" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="237.4844" y="146.0378" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.8344" font-weight="bold" fill="var(--bg)">Agile Principles</text>
  <path d="M 363.2705 136.6039 L 530.9853 268.6793" stroke="var(--text)" stroke-width="2.3273" marker-end="url(#arrowhead7)" />
  <rect x="111.6981" y="268.6793" width="251.5724" height="113.2076" rx="8.6478" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="237.4844" y="334.717" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.8344" font-weight="bold" fill="var(--bg)">Lean Practices</text>
  <path d="M 363.2705 325.2831 L 530.9853 325.2831" stroke="var(--text)" stroke-width="2.3273" marker-end="url(#arrowhead7)" />
  <rect x="530.9853" y="230.9434" width="167.7148" height="113.2076" rx="8.6478" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="614.8428" y="296.9812" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.8344" font-weight="bold" fill="var(--bg)">DevOps</text>
  <path d="M 698.7003 287.5472 L 866.4151 174.3397" stroke="var(--text)" stroke-width="2.3273" marker-end="url(#arrowhead7)" />
  <rect x="866.4151" y="117.736" width="301.8867" height="94.3396" rx="8.6478" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1017.3586" y="155.4718" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4801" fill="var(--bg)">Continuous</text>
  <text x="1017.3586" y="189.434" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4801" fill="var(--bg)">Integration</text>
  <path d="M 698.7003 287.5472 L 866.4151 287.5472" stroke="var(--text)" stroke-width="2.3273" marker-end="url(#arrowhead7)" />
  <rect x="866.4151" y="240.3775" width="301.8867" height="94.3396" rx="8.6478" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1017.3586" y="278.1133" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4801" fill="var(--bg)">Continuous</text>
  <text x="1017.3586" y="312.0755" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4801" fill="var(--bg)">Delivery</text>
  <path d="M 698.7003 287.5472 L 866.4151 400.7548" stroke="var(--text)" stroke-width="2.3273" marker-end="url(#arrowhead7)" />
  <rect x="866.4151" y="363.019" width="301.8867" height="94.3396" rx="8.6478" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1017.3586" y="400.7548" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4801" fill="var(--bg)">Infrastructure</text>
  <text x="1017.3586" y="434.717" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4801" fill="var(--bg)">as Code</text>
  <path d="M 698.7003 325.2831 L 866.4151 513.9624" stroke="var(--text)" stroke-width="2.3273" marker-end="url(#arrowhead7)" />
  <rect x="866.4151" y="485.6604" width="301.8867" height="94.3396" rx="8.6478" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1017.3586" y="523.3963" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4801" fill="var(--bg)">Continuous</text>
  <text x="1017.3586" y="557.3585" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4801" fill="var(--bg)">Monitoring</text>
</svg>
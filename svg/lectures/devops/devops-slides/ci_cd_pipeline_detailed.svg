<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <text x="640" y="70" text-anchor="middle" font-size="30" font-weight="bold" fill="var(--primary-accent)">CI/CD Pipeline Flow</text>

  <rect x="40" y="100" width="160" height="130" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="120" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--primary-text)">Code</text>
  <line x1="200" y1="165" x2="215" y2="165" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="100" width="160" height="130" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="300" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)">Build</text>
  <line x1="380" y1="165" x2="395" y2="165" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="100" width="200" height="130" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="500" y="155" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)">Unit</text>
  <text x="500" y="190" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)">Tests</text>
  <line x1="600" y1="165" x2="615" y2="165" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="100" width="220" height="130" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="730" y="155" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--info-text)">Integration</text>
  <text x="730" y="190" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--info-text)">Tests</text>
  <line x1="840" y1="165" x2="855" y2="165" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="860" y="100" width="180" height="130" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="950" y="155" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--danger-text)">Security</text>
  <text x="950" y="190" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--danger-text)">Scan</text>
  <line x1="1040" y1="165" x2="1055" y2="165" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1060" y="100" width="180" height="130" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1150" y="155" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">Quality</text>
  <text x="1150" y="190" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">Gate</text>

  <line x1="1150" y1="230" x2="1150" y2="315" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1000" y="320" width="240" height="130" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1120" y="395" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--ok-text)">Deploy</text>

  <line x1="1000" y1="385" x2="270" y2="385" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="635" y="370" text-anchor="middle" font-size="18" fill="var(--text-muted)">promote to production</text>

  <rect x="40" y="320" width="220" height="130" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="150" y="395" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--danger-text)">Monitor</text>

  <line x1="150" y1="320" x2="150" y2="235" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="170" y="285" font-size="18" fill="var(--text-muted)">Feedback loop</text>

  <rect x="40" y="475" width="1200" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="525" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)">Every stage fails fast and gives developers quick feedback</text>
  <text x="640" y="575" text-anchor="middle" font-size="18" fill="var(--text-muted)">Push to deploy in minutes, observability closes the loop</text>
</svg>

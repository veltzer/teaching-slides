<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead8" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
  <rect x="80" y="150" width="128" height="89.9999" rx="10.65" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="144.0001" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="var(--bg)">Code</text>
  <path d="M 208 195 L 271.9999 195" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="271.9999" y="150" width="128" height="89.9999" rx="10.65" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="336.0001" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="var(--bg)">Build</text>
  <path d="M 400 195 L 464.0001 195" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="464.0001" y="150" width="128" height="89.9999" rx="10.65" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="528" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="var(--bg)">Unit</text>
  <text x="528" y="222.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="var(--bg)">Test</text>
  <path d="M 591.9999 195 L 656 195" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="656" y="150" width="144.0001" height="89.9999" rx="10.65" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="727.9999" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--bg)">Integration</text>
  <text x="727.9999" y="212.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--bg)">Test</text>
  <path d="M 799.9999 195 L 864 195" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="864" y="150" width="144.0001" height="89.9999" rx="10.65" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="935.9998" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--bg)">Security</text>
  <text x="935.9998" y="212.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--bg)">Scan</text>
  <path d="M 1007.9999 195 L 1072 195" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="1072" y="150" width="128" height="89.9999" rx="10.65" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1135.9999" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--bg)">Quality</text>
  <text x="1135.9999" y="212.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="var(--bg)">Gate</text>
  <path d="M 1135.9999 240 L 1135.9999 329.9999" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="1072" y="329.9999" width="128" height="89.9999" rx="10.65" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1135.9999" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="var(--bg)">Deploy</text>
  <path d="M 1072 374.9999 L 208 374.9999" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="80" y="329.9999" width="128" height="89.9999" rx="10.65" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="144.0001" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="var(--bg)">Monitor</text>
  <path d="M 144.0001 329.9999 L 144.0001 240" stroke="var(--text)" stroke-width="1.8028" stroke-dasharray="4.507 4.507" marker-end="url(#arrowhead8)" />
  <text x="80" y="284.9999" text-anchor="start" font-family="Arial, sans-serif" font-size="19.2" fill="var(--text-muted)">Feedback</text>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.5999" font-weight="bold" fill="var(--primary-accent)">CI/CD Pipeline Flow</text>
</svg>
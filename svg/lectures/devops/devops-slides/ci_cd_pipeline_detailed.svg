<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.807319" font-weight="bold" fill="var(--primary-accent)">CI/CD Pipeline Flow</text>

  <rect x="40" y="71.636364" width="160" height="137.090909" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="150.727273" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--primary-text)">Code</text>
  <line x1="200" y1="140.181818" x2="215" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="71.636364" width="160" height="137.090909" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="150.727273" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--ok-text)">Build</text>
  <line x1="380" y1="140.181818" x2="395" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="71.636364" width="200" height="137.090909" rx="6.161464" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="129.636364" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--warn-text)">Unit</text>
  <text x="500" y="166.545455" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--warn-text)">Tests</text>
  <line x1="600" y1="140.181818" x2="615" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="71.636364" width="220" height="137.090909" rx="6.161464" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="129.636364" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--info-text)">Integration</text>
  <text x="730" y="166.545455" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--info-text)">Tests</text>
  <line x1="840" y1="140.181818" x2="855" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="860" y="71.636364" width="180" height="137.090909" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="129.636364" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--danger-text)">Security</text>
  <text x="950" y="166.545455" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--danger-text)">Scan</text>
  <line x1="1040" y1="140.181818" x2="1055" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1060" y="71.636364" width="180" height="137.090909" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="129.636364" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--primary-text)">Quality</text>
  <text x="1150" y="166.545455" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--primary-text)">Gate</text>

  <line x1="1150" y1="208.727273" x2="1150" y2="298.363636" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1000" y="303.636364" width="240" height="137.090909" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="382.727273" text-anchor="middle" font-size="26.699677" font-weight="bold" fill="var(--ok-text)">Deploy</text>

  <line x1="1000" y1="372.181818" x2="270" y2="372.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="635" y="356.363636" text-anchor="middle" font-size="18.484391" fill="var(--text-muted)">promote to production</text>

  <rect x="40" y="303.636364" width="220" height="137.090909" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="382.727273" text-anchor="middle" font-size="26.699677" font-weight="bold" fill="var(--danger-text)">Monitor</text>

  <line x1="150" y1="303.636364" x2="150" y2="214" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="170" y="266.727273" font-size="18.484391" fill="var(--text-muted)">Feedback loop</text>

  <rect x="40" y="467.090909" width="1200" height="152.909091" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="519.818182" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--text)">Every stage fails fast and gives developers quick feedback</text>
  <text x="640" y="572.545455" text-anchor="middle" font-size="18.484391" fill="var(--text-muted)">Push to deploy in minutes, observability closes the loop</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.807319" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">CI/CD Pipeline Flow</text>

  <rect x="40" y="71.636364" width="160" height="137.090909" rx="6.161464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="150.727273" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Code</text>
  <line x1="200" y1="140.181818" x2="215" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="71.636364" width="160" height="137.090909" rx="6.161464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="150.727273" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Build</text>
  <line x1="380" y1="140.181818" x2="395" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="71.636364" width="200" height="137.090909" rx="6.161464" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="129.636364" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Unit</text>
  <text x="500" y="166.545455" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Tests</text>
  <line x1="600" y1="140.181818" x2="615" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="71.636364" width="220" height="137.090909" rx="6.161464" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="129.636364" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Integration</text>
  <text x="730" y="166.545455" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Tests</text>
  <line x1="840" y1="140.181818" x2="855" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="860" y="71.636364" width="180" height="137.090909" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="129.636364" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Security</text>
  <text x="950" y="166.545455" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Scan</text>
  <line x1="1040" y1="140.181818" x2="1055" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1060" y="71.636364" width="180" height="137.090909" rx="6.161464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="129.636364" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Quality</text>
  <text x="1150" y="166.545455" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Gate</text>

  <line x1="1150" y1="208.727273" x2="1150" y2="298.363636" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1000" y="303.636364" width="240" height="137.090909" rx="6.161464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="382.727273" text-anchor="middle" font-size="26.699677" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Deploy</text>

  <line x1="1000" y1="372.181818" x2="270" y2="372.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="635" y="356.363636" text-anchor="middle" font-size="18.484391" fill="var(--text-muted)" font-family="Arial, sans-serif">promote to production</text>

  <rect x="40" y="303.636364" width="220" height="137.090909" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="382.727273" text-anchor="middle" font-size="26.699677" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Monitor</text>

  <line x1="150" y1="303.636364" x2="150" y2="214" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="170" y="266.727273" font-size="18.484391" fill="var(--text-muted)" font-family="Arial, sans-serif">Feedback loop</text>

  <rect x="40" y="467.090909" width="1200" height="152.909091" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="519.818182" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Every stage fails fast and gives developers quick feedback</text>
  <text x="640" y="572.545455" text-anchor="middle" font-size="18.484391" fill="var(--text-muted)" font-family="Arial, sans-serif">Push to deploy in minutes, observability closes the loop</text>
</svg>

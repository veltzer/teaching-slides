<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead8" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 4.8,0" fill="#333" />
    </marker>
  </defs>
  <rect x="45.0704" y="152.1127" width="72.1127" height="50.7042" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="81.1268" y="182.5352" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6197" font-weight="bold" fill="var(--bg)">Code</text>
  <path d="M 117.1831 177.4648 L 153.2394 177.4648" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="153.2394" y="152.1127" width="72.1127" height="50.7042" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="189.2958" y="182.5352" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6197" font-weight="bold" fill="var(--bg)">Build</text>
  <path d="M 225.3521 177.4648 L 261.4085 177.4648" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="261.4085" y="152.1127" width="72.1127" height="50.7042" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="297.4648" y="177.4648" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7183" font-weight="bold" fill="var(--bg)">Unit</text>
  <text x="297.4648" y="192.6761" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7183" font-weight="bold" fill="var(--bg)">Test</text>
  <path d="M 333.5211 177.4648 L 369.5775 177.4648" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="369.5775" y="152.1127" width="81.1268" height="50.7042" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="410.1408" y="172.3944" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8169" font-weight="bold" fill="var(--bg)">Integration</text>
  <text x="410.1408" y="187.6056" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8169" font-weight="bold" fill="var(--bg)">Test</text>
  <path d="M 450.7042 177.4648 L 486.7606 177.4648" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="486.7606" y="152.1127" width="81.1268" height="50.7042" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="527.3239" y="172.3944" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8169" font-weight="bold" fill="var(--bg)">Security</text>
  <text x="527.3239" y="187.6056" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8169" font-weight="bold" fill="var(--bg)">Scan</text>
  <path d="M 567.8873 177.4648 L 603.9437 177.4648" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="603.9437" y="152.1127" width="72.1127" height="50.7042" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="172.3944" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8169" font-weight="bold" fill="var(--bg)">Quality</text>
  <text x="640" y="187.6056" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8169" font-weight="bold" fill="var(--bg)">Gate</text>
  <path d="M 640 202.8169 L 640 253.5211" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="603.9437" y="253.5211" width="72.1127" height="50.7042" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="283.9437" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6197" font-weight="bold" fill="var(--bg)">Deploy</text>
  <path d="M 603.9437 278.8732 L 117.1831 278.8732" stroke="var(--text)" stroke-width="1.8028" marker-end="url(#arrowhead8)" />
  <rect x="45.0704" y="253.5211" width="72.1127" height="50.7042" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="81.1268" y="283.9437" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.6197" font-weight="bold" fill="var(--bg)">Monitor</text>
  <path d="M 81.1268 253.5211 L 81.1268 202.8169" stroke="var(--text)" stroke-width="1.8028" stroke-dasharray="4.507 4.507" marker-end="url(#arrowhead8)" />
  <text x="45.0704" y="228.169" text-anchor="start" font-family="Arial, sans-serif" font-size="10.8169" fill="var(--text-muted)">Feedback</text>
  <text x="360.5634" y="354.9296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4225" font-weight="bold" fill="var(--primary-accent)">CI/CD Pipeline Flow</text>
</svg>
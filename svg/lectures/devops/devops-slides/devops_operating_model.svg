<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,12 4.8,0" fill="#333" />
    </marker>
  </defs>
  <rect x="103.2258" y="38.7097" width="123.871" height="46.4516" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="165.1613" y="65.8065" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3871" font-weight="bold" fill="var(--bg)">Plan</text>
  <path d="M 227.0968 61.9355 L 340.6452 61.9355" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="340.6452" y="38.7097" width="123.871" height="46.4516" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="402.5806" y="65.8065" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3871" font-weight="bold" fill="var(--bg)">Code</text>
  <path d="M 464.5161 61.9355 L 578.0645 61.9355" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="578.0645" y="38.7097" width="123.871" height="46.4516" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="65.8065" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3871" font-weight="bold" fill="var(--bg)">Build</text>
  <path d="M 640 85.1613 L 640 131.6129" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="578.0645" y="131.6129" width="123.871" height="46.4516" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="158.7097" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3871" font-weight="bold" fill="var(--bg)">Test</text>
  <path d="M 578.0645 154.8387 L 464.5161 154.8387" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="340.6452" y="131.6129" width="123.871" height="46.4516" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="402.5806" y="158.7097" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3871" font-weight="bold" fill="var(--bg)">Release</text>
  <path d="M 340.6452 154.8387 L 227.0968 154.8387" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="103.2258" y="131.6129" width="123.871" height="46.4516" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="165.1613" y="158.7097" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3871" font-weight="bold" fill="var(--bg)">Deploy</text>
  <path d="M 165.1613 178.0645 L 165.1613 224.5161" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="103.2258" y="224.5161" width="123.871" height="46.4516" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="165.1613" y="251.6129" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3871" font-weight="bold" fill="var(--bg)">Operate</text>
  <path d="M 227.0968 247.7419 L 340.6452 247.7419" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="340.6452" y="224.5161" width="123.871" height="46.4516" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="402.5806" y="251.6129" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3871" font-weight="bold" fill="var(--bg)">Monitor</text>
  <path d="M 402.5806 224.5161 L 165.1613 85.1613" stroke="var(--text)" stroke-width="1.5484" stroke-dasharray="3.871 3.871" marker-end="url(#arrowhead6)" />
  <ellipse cx="412.9032" cy="348.3871" rx="232.2581" ry="77.4194" fill="none" stroke="var(--primary-border)" stroke-width="1.5484" stroke-dasharray="7.7419 3.871" opacity="0.3" />
  <text x="412.9032" y="356.129" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9355" font-weight="bold" fill="var(--primary-accent)" opacity="0.5">Continuous Feedback Loop</text>
</svg>
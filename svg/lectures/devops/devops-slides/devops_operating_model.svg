<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="248.2758" height="69.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1379" y="80.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Plan</text>
  <path d="M 288.2761 74.8 L 515.862 74.8" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrow)"/>
  <rect x="515.862" y="40" width="248.2758" height="69.6" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9997" y="80.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Code</text>
  <path d="M 764.138 74.8 L 991.7242 74.8" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrow)"/>
  <rect x="991.7242" y="40" width="248.2758" height="69.6" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115.8619" y="80.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Build</text>
  <path d="M 1115.8619 109.6 L 1115.8619 179.2001" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrow)"/>
  <rect x="991.7242" y="179.2001" width="248.2758" height="69.6" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115.8619" y="219.8001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Test</text>
  <path d="M 991.7242 213.9999 L 764.138 213.9999" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrow)"/>
  <rect x="515.862" y="179.2001" width="248.2758" height="69.6" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9997" y="219.8001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Release</text>
  <path d="M 515.862 213.9999 L 288.2761 213.9999" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrow)"/>
  <rect x="40" y="179.2001" width="248.2758" height="69.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1379" y="219.8001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Deploy</text>
  <path d="M 164.1379 248.7999 L 164.1379 318.3999" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrow)"/>
  <rect x="40" y="318.3999" width="248.2758" height="69.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1379" y="358.9998" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Operate</text>
  <path d="M 288.2761 353.2 L 515.862 353.2" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrow)"/>
  <rect x="515.862" y="318.3999" width="248.2758" height="69.6" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9997" y="358.9998" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Monitor</text>
  <path d="M 639.9997 318.3999 L 164.1379 109.6" stroke="var(--text)" stroke-width="0.7077" stroke-dasharray="1.7692 1.7692" marker-end="url(#arrow)"/>
  <ellipse cx="660.6893" cy="503.9999" rx="465.5172" ry="116.0001" fill="none" stroke="var(--primary-border)" stroke-width="0.7077" stroke-dasharray="3.5385 1.7692" opacity="0.3"/>
  <text x="660.6893" y="515.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.1495" font-weight="bold" fill="var(--primary-accent)" opacity="0.5">Continuous Feedback Loop</text>
</svg>

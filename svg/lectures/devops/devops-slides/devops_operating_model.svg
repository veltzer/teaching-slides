<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,12 4.8,0" fill="#333" />
    </marker>
  </defs>
  <rect x="253.3333" y="80" width="160" height="60" rx="7.75" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="333.3334" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Plan</text>
  <path d="M 413.3334 110 L 560 110" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="560" y="80" width="160" height="60" rx="7.75" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="639.9999" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Code</text>
  <path d="M 720 110 L 866.6666 110" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="866.6666" y="80" width="160" height="60" rx="7.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="946.6666" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Build</text>
  <path d="M 946.6666 140 L 946.6666 200" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="866.6666" y="200" width="160" height="60" rx="7.75" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="946.6666" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Test</text>
  <path d="M 866.6666 229.9999 L 720 229.9999" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="560" y="200" width="160" height="60" rx="7.75" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="639.9999" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Release</text>
  <path d="M 560 229.9999 L 413.3334 229.9999" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="253.3333" y="200" width="160" height="60" rx="7.75" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="333.3334" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Deploy</text>
  <path d="M 333.3334 259.9999 L 333.3334 319.9999" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="253.3333" y="319.9999" width="160" height="60" rx="7.75" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="333.3334" y="354.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Operate</text>
  <path d="M 413.3334 349.9999 L 560 349.9999" stroke="var(--text)" stroke-width="1.5484" marker-end="url(#arrowhead6)" />
  <rect x="560" y="319.9999" width="160" height="60" rx="7.75" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="639.9999" y="354.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Monitor</text>
  <path d="M 639.9999 319.9999 L 333.3334 140" stroke="var(--text)" stroke-width="1.5484" stroke-dasharray="3.871 3.871" marker-end="url(#arrowhead6)" />
  <ellipse cx="653.3333" cy="479.9999" rx="300" ry="100.0001" fill="none" stroke="var(--primary-border)" stroke-width="1.5484" stroke-dasharray="7.7419 3.871" opacity="0.3" />
  <text x="653.3333" y="489.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)" opacity="0.5">Continuous Feedback Loop</text>
</svg>
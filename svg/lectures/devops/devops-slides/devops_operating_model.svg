<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,12 4.8,0" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="248.2758" height="69.6" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1379" y="80.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Plan</text>
  <path d="M 288.2761 74.8 L 515.862 74.8" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrowhead6)" />
  <rect x="515.862" y="40" width="248.2758" height="69.6" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9997" y="80.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Code</text>
  <path d="M 764.138 74.8 L 991.7242 74.8" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrowhead6)" />
  <rect x="991.7242" y="40" width="248.2758" height="69.6" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115.8619" y="80.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Build</text>
  <path d="M 1115.8619 109.6 L 1115.8619 179.2001" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrowhead6)" />
  <rect x="991.7242" y="179.2001" width="248.2758" height="69.6" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115.8619" y="219.8001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Test</text>
  <path d="M 991.7242 213.9999 L 764.138 213.9999" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrowhead6)" />
  <rect x="515.862" y="179.2001" width="248.2758" height="69.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9997" y="219.8001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Release</text>
  <path d="M 515.862 213.9999 L 288.2761 213.9999" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrowhead6)" />
  <rect x="40" y="179.2001" width="248.2758" height="69.6" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1379" y="219.8001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Deploy</text>
  <path d="M 164.1379 248.7999 L 164.1379 318.3999" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrowhead6)" />
  <rect x="40" y="318.3999" width="248.2758" height="69.6" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.1379" y="358.9998" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Operate</text>
  <path d="M 288.2761 353.2 L 515.862 353.2" stroke="var(--text)" stroke-width="0.7077" marker-end="url(#arrowhead6)" />
  <rect x="515.862" y="318.3999" width="248.2758" height="69.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9997" y="358.9998" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4662" font-weight="bold" fill="var(--bg)">Monitor</text>
  <path d="M 639.9997 318.3999 L 164.1379 109.6" stroke="var(--text)" stroke-width="0.7077" stroke-dasharray="1.7692 1.7692" marker-end="url(#arrowhead6)" />
  <ellipse cx="660.6893" cy="503.9999" rx="465.5172" ry="116.0001" fill="none" stroke="var(--primary-border)" stroke-width="0.7077" stroke-dasharray="3.5385 1.7692" opacity="0.3" />
  <text x="660.6893" y="515.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.1495" font-weight="bold" fill="var(--primary-accent)" opacity="0.5">Continuous Feedback Loop</text>
</svg>
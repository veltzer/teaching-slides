<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="568.921" y="278.538" width="142.157" height="142.157" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3.4595" filter="url(#shadow)"/>
  <text x="639.9999" y="358.0988" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3236" font-weight="bold" fill="var(--bg)">DevOps</text>
  <line x1="639.9999" y1="285.9964" x2="639.9999" y2="137.5503" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="592.614" y="68.9581" width="94.7714" height="94.7714" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2.3063" filter="url(#shadow)"/>
  <text x="639.9999" y="121.6453" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5849" font-weight="bold" fill="var(--bg)">People</text>
  <line x1="639.9999" y1="73.9305" x2="463.5294" y2="52.724" stroke="var(--text-faint)" stroke-width="1.1532"/>
  <text x="428.2352" y="50.6034" text-anchor="end" font-family="Arial, sans-serif" font-size="14.2157" fill="var(--text)">Culture</text>
  <line x1="639.9999" y1="73.9305" x2="639.9999" y2="42.1207" stroke="var(--text-faint)" stroke-width="1.1532"/>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2157" fill="var(--text)">Skills</text>
  <line x1="639.9999" y1="73.9305" x2="816.4706" y2="52.724" stroke="var(--text-faint)" stroke-width="1.1532"/>
  <text x="851.7646" y="50.6034" text-anchor="start" font-family="Arial, sans-serif" font-size="14.2157" fill="var(--text)">Roles</text>
  <line x1="534.1176" y1="381.4259" x2="287.0588" y2="508.6654" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="204.379" y="482.486" width="94.7714" height="94.7714" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2.3063" filter="url(#shadow)"/>
  <text x="251.7647" y="535.1736" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5849" font-weight="bold" fill="var(--bg)">Process</text>
  <line x1="181.1765" y1="561.6819" x2="75.2941" y2="582.8884" stroke="var(--text-faint)" stroke-width="1.1532"/>
  <text x="40" y="588.1901" text-anchor="end" font-family="Arial, sans-serif" font-size="14.2157" fill="var(--text)">Automation</text>
  <line x1="251.7647" y1="572.2852" x2="251.7647" y2="604.0951" stroke="var(--text-faint)" stroke-width="1.1532"/>
  <text x="251.7647" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2157" fill="var(--text)">Workflows</text>
  <line x1="322.3529" y1="561.6819" x2="428.2352" y2="582.8884" stroke="var(--text-faint)" stroke-width="1.1532"/>
  <text x="463.5294" y="588.1901" text-anchor="start" font-family="Arial, sans-serif" font-size="14.2157" fill="var(--text)">Standards</text>
  <line x1="745.8824" y1="381.4259" x2="992.9411" y2="508.6654" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="980.85" y="482.486" width="94.7714" height="94.7714" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2.3063" filter="url(#shadow)"/>
  <text x="1028.2353" y="535.1736" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5849" font-weight="bold" fill="var(--bg)">Technology</text>
  <line x1="957.6471" y1="561.6819" x2="851.7646" y2="582.8884" stroke="var(--text-faint)" stroke-width="1.1532"/>
  <text x="816.4706" y="588.1901" text-anchor="end" font-family="Arial, sans-serif" font-size="14.2157" fill="var(--text)">Tools</text>
  <line x1="1028.2353" y1="572.2852" x2="1028.2353" y2="604.0951" stroke="var(--text-faint)" stroke-width="1.1532"/>
  <text x="1028.2353" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2157" fill="var(--text)">Platforms</text>
  <line x1="1098.8235" y1="561.6819" x2="1204.7058" y2="582.8884" stroke="var(--text-faint)" stroke-width="1.1532"/>
  <text x="1240" y="588.1901" text-anchor="start" font-family="Arial, sans-serif" font-size="14.2157" fill="var(--text)">Infrastructure</text>
</svg>

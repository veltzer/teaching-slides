<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <circle cx="615.015" cy="345.9459" r="69.1892" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.4595" />
  <text x="615.015" y="355.1712" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7568" font-weight="bold" fill="var(--bg)">DevOps</text>
  <line x1="615.015" y1="276.7568" x2="615.015" y2="115.3153" stroke="var(--text-muted)" stroke-width="2" />
  <circle cx="615.015" cy="92.2523" r="46.1261" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.3063" />
  <text x="615.015" y="98.018" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1441" font-weight="bold" fill="var(--bg)">People</text>
  <line x1="615.015" y1="46.1261" x2="461.2613" y2="23.0631" stroke="var(--text-faint)" stroke-width="1.1532" />
  <text x="430.5105" y="20.7568" text-anchor="end" font-family="Arial, sans-serif" font-size="13.8378" fill="var(--text)">Culture</text>
  <line x1="615.015" y1="46.1261" x2="615.015" y2="11.5315" stroke="var(--text-faint)" stroke-width="1.1532" />
  <text x="615.015" y="9.2252" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8378" fill="var(--text)">Skills</text>
  <line x1="615.015" y1="46.1261" x2="768.7688" y2="23.0631" stroke="var(--text-faint)" stroke-width="1.1532" />
  <text x="799.5195" y="20.7568" text-anchor="start" font-family="Arial, sans-serif" font-size="13.8378" fill="var(--text)">Roles</text>
  <line x1="522.7628" y1="380.5405" x2="307.5075" y2="518.9189" stroke="var(--text-muted)" stroke-width="2" />
  <circle cx="276.7568" cy="541.982" r="46.1261" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.3063" />
  <text x="276.7568" y="547.7477" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1441" font-weight="bold" fill="var(--bg)">Process</text>
  <line x1="215.2553" y1="576.5766" x2="123.003" y2="599.6396" stroke="var(--text-faint)" stroke-width="1.1532" />
  <text x="92.2523" y="605.4054" text-anchor="end" font-family="Arial, sans-serif" font-size="13.8378" fill="var(--text)">Automation</text>
  <line x1="276.7568" y1="588.1081" x2="276.7568" y2="622.7027" stroke="var(--text-faint)" stroke-width="1.1532" />
  <text x="276.7568" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8378" fill="var(--text)">Workflows</text>
  <line x1="338.2583" y1="576.5766" x2="430.5105" y2="599.6396" stroke="var(--text-faint)" stroke-width="1.1532" />
  <text x="461.2613" y="605.4054" text-anchor="start" font-family="Arial, sans-serif" font-size="13.8378" fill="var(--text)">Standards</text>
  <line x1="707.2673" y1="380.5405" x2="922.5225" y2="518.9189" stroke="var(--text-muted)" stroke-width="2" />
  <circle cx="953.2733" cy="541.982" r="46.1261" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2.3063" />
  <text x="953.2733" y="547.7477" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1441" font-weight="bold" fill="var(--bg)">Technology</text>
  <line x1="891.7718" y1="576.5766" x2="799.5195" y2="599.6396" stroke="var(--text-faint)" stroke-width="1.1532" />
  <text x="768.7688" y="605.4054" text-anchor="end" font-family="Arial, sans-serif" font-size="13.8378" fill="var(--text)">Tools</text>
  <line x1="953.2733" y1="588.1081" x2="953.2733" y2="622.7027" stroke="var(--text-faint)" stroke-width="1.1532" />
  <text x="953.2733" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8378" fill="var(--text)">Platforms</text>
  <line x1="1014.7748" y1="576.5766" x2="1107.027" y2="599.6396" stroke="var(--text-faint)" stroke-width="1.1532" />
  <text x="1137.7778" y="605.4054" text-anchor="start" font-family="Arial, sans-serif" font-size="13.8378" fill="var(--text)">Infrastructure</text>
</svg>
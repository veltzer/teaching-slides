  <text x="393.8462" y="266.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5077" font-weight="bold" fill="var(--bg)">Rolling</text>
  <path d="M 393.8462 128.3077 L 492.3076 228" stroke="var(--text)" stroke-width="0.7271" marker-end="url(#arrowhead9)" />
  <rect x="418.4615" y="228" width="147.6923" height="66.4615" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.2308" />
  <text x="492.3076" y="266.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5077" font-weight="bold" fill="var(--bg)">Shadow</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead9" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 4.8,0" fill="#333" />
    </marker>
  </defs>
  <rect x="425.7142" y="40" width="428.5714" height="136.4704" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="96.8629" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.5106" font-weight="bold" fill="var(--bg)">Deployment</text>
  <text x="640.0001" y="142.353" text-anchor="middle" font-family="Arial, sans-serif" font-size="33.5106" font-weight="bold" fill="var(--bg)">Strategies</text>
  <path d="M 640.0001 176.4706 L 211.4283 381.1764" stroke="var(--text)" stroke-width="0.7271" marker-end="url(#arrowhead9)" />
  <rect x="40" y="381.1764" width="257.1429" height="136.4704" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.5713" y="460.7841" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.3218" font-weight="bold" fill="var(--bg)">Blue/Green</text>
  <path d="M 640.0001 176.4706 L 468.5714 381.1764" stroke="var(--text)" stroke-width="0.7271" marker-end="url(#arrowhead9)" />
  <rect x="339.9999" y="381.1764" width="257.1429" height="136.4704" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="468.5714" y="460.7841" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.3218" font-weight="bold" fill="var(--bg)">Canary</text>
  <path d="M 640.0001 176.4706 L 640.0001 381.1764" stroke="var(--text)" stroke-width="0.7271" marker-end="url(#arrowhead9)" />
  <rect x="511.4286" y="381.1764" width="257.1429" height="136.4704" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="460.7841" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.3218" font-weight="bold" fill="var(--bg)">Rolling</text>
  <path d="M 640.0001 176.4706 L 811.4284 381.1764" stroke="var(--text)" stroke-width="0.7271" marker-end="url(#arrowhead9)" />
  <rect x="682.8571" y="381.1764" width="257.1429" height="136.4704" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="811.4284" y="460.7841" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.3218" font-weight="bold" fill="var(--bg)">Shadow</text>
  <path d="M 640.0001 176.4706 L 1068.5715 381.1764" stroke="var(--text)" stroke-width="0.7271" marker-end="url(#arrowhead9)" />
  <rect x="982.8571" y="381.1764" width="257.1429" height="136.4704" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1111.4285" y="460.7841" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.3218" font-weight="bold" fill="var(--bg)">A/B Testing</text>
  <text x="168.5713" y="585.8821" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0385" fill="var(--text-muted)">Zero downtime</text>
  <text x="168.5713" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0385" fill="var(--text-muted)">Instant rollback</text>
  <text x="468.5714" y="585.8821" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0385" fill="var(--text-muted)">Gradual rollout</text>
  <text x="468.5714" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0385" fill="var(--text-muted)">Risk mitigation</text>
  <text x="640.0001" y="585.8821" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0385" fill="var(--text-muted)">Progressive</text>
  <text x="640.0001" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0385" fill="var(--text-muted)">replacement</text>
  <text x="811.4284" y="585.8821" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0385" fill="var(--text-muted)">Live traffic</text>
  <text x="811.4284" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0385" fill="var(--text-muted)">testing</text>
  <text x="1111.4285" y="585.8821" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0385" fill="var(--text-muted)">Feature</text>
  <text x="1111.4285" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0385" fill="var(--text-muted)">comparison</text>
</svg>
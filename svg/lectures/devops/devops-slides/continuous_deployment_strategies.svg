<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead9" markerWidth="16" markerHeight="14.4" refX="14.4" refY="4.32" orient="auto">
      <polygon points="0,14.4 4.8,0" fill="#333" />
    </marker>
  </defs>
  <rect x="320" y="48" width="213.3333" height="57.6" rx="4.8" fill="var(--primary-bright)" stroke="var(--primary-indigo)" stroke-width="1.92" />
  <text x="426.6667" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.36" font-weight="bold" fill="var(--bg)">Deployment</text>
  <text x="426.6667" y="91.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.36" font-weight="bold" fill="var(--bg)">Strategies</text>
  <path d="M 426.6667 105.6 L 213.3333 192" stroke="var(--text-dark)" stroke-width="1.92" marker-end="url(#arrowhead9)" />
  <rect x="128" y="192" width="128" height="57.6" rx="4.8" fill="var(--ok-light)" stroke="var(--ok-light)" stroke-width="1.92" />
  <text x="192" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.44" font-weight="bold" fill="var(--bg)">Blue/Green</text>
  <path d="M 426.6667 105.6 L 341.3333 192" stroke="var(--text-dark)" stroke-width="1.92" marker-end="url(#arrowhead9)" />
  <rect x="277.3333" y="192" width="128" height="57.6" rx="4.8" fill="var(--warn-orange)" stroke="var(--warn-mid)" stroke-width="1.92" />
  <text x="341.3333" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.44" font-weight="bold" fill="var(--bg)">Canary</text>
  <path d="M 426.6667 105.6 L 426.6667 192" stroke="var(--text-dark)" stroke-width="1.92" marker-end="url(#arrowhead9)" />
  <rect x="362.6667" y="192" width="128" height="57.6" rx="4.8" fill="var(--info-light)" stroke="var(--info-mid)" stroke-width="1.92" />
  <text x="426.6667" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.44" font-weight="bold" fill="var(--bg)">Rolling</text>
  <path d="M 426.6667 105.6 L 512 192" stroke="var(--text-dark)" stroke-width="1.92" marker-end="url(#arrowhead9)" />
  <rect x="448" y="192" width="128" height="57.6" rx="4.8" fill="var(--danger-vivid)" stroke="var(--danger-mid)" stroke-width="1.92" />
  <text x="512" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.44" font-weight="bold" fill="var(--bg)">Shadow</text>
  <path d="M 426.6667 105.6 L 640 192" stroke="var(--text-dark)" stroke-width="1.92" marker-end="url(#arrowhead9)" />
  <rect x="597.3333" y="192" width="128" height="57.6" rx="4.8" fill="var(--primary-vivid)" stroke="var(--primary-mid)" stroke-width="1.92" />
  <text x="661.3333" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.44" font-weight="bold" fill="var(--bg)">A/B Testing</text>
  <text x="192" y="278.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.56" fill="var(--text-mid)">Zero downtime</text>
  <text x="192" y="292.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.56" fill="var(--text-mid)">Instant rollback</text>
  <text x="341.3333" y="278.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.56" fill="var(--text-mid)">Gradual rollout</text>
  <text x="341.3333" y="292.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.56" fill="var(--text-mid)">Risk mitigation</text>
  <text x="426.6667" y="278.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.56" fill="var(--text-mid)">Progressive</text>
  <text x="426.6667" y="292.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.56" fill="var(--text-mid)">replacement</text>
  <text x="512" y="278.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.56" fill="var(--text-mid)">Live traffic</text>
  <text x="512" y="292.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.56" fill="var(--text-mid)">testing</text>
  <text x="661.3333" y="278.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.56" fill="var(--text-mid)">Feature</text>
  <text x="661.3333" y="292.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.56" fill="var(--text-mid)">comparison</text>
</svg>
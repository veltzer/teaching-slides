  <text x="393.8462" y="344.3078" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1846" fill="var(--text-muted)">replacement</text>
  <text x="492.3076" y="327.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1846" fill="var(--text-muted)">Live traffic</text>
  <text x="492.3076" y="344.3078" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1846" fill="var(--text-muted)">testing</text>
  <text x="664.6153" y="327.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1846" fill="var(--text-muted)">Feature</text>

  <text x="1118.2609" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Improved Security</text>
  <path d="M 648.6957 160.0001 L 213.9128 519.9999" stroke="var(--text)" stroke-width="0.6535" marker-end="url(#arrowhead4)" />

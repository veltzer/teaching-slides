<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="474.7825" y="40" width="347.8261" height="119.9999" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.6957" y="110.0002" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.3089" font-weight="bold" fill="var(--bg)">DevOps Implementation</text>
  <path d="M 648.6957 160.0001 L 213.9128 299.9998" stroke="var(--text)" stroke-width="0.6535" marker-end="url(#arrow)" />
  <rect x="40" y="299.9998" width="243.4784" height="100.0001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="161.7388" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Faster Delivery</text>
  <path d="M 648.6957 160.0001 L 387.8259 299.9998" stroke="var(--text)" stroke-width="0.6535" marker-end="url(#arrow)" />
  <rect x="318.2606" y="299.9998" width="243.4784" height="100.0001" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="439.9999" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Better Quality</text>
  <path d="M 648.6957 160.0001 L 648.6957 299.9998" stroke="var(--text)" stroke-width="0.6535" marker-end="url(#arrow)" />
  <rect x="526.9565" y="299.9998" width="243.4784" height="100.0001" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.6957" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Increased Reliability</text>
  <path d="M 648.6957 160.0001 L 909.5653 299.9998" stroke="var(--text)" stroke-width="0.6535" marker-end="url(#arrow)" />
  <rect x="787.8261" y="299.9998" width="243.4784" height="100.0001" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="909.5653" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Better Scalability</text>
  <path d="M 648.6957 160.0001 L 1083.4782 299.9998" stroke="var(--text)" stroke-width="0.6535" marker-end="url(#arrow)" />
  <rect x="996.5216" y="299.9998" width="243.4784" height="100.0001" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.2609" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Improved Security</text>
  <path d="M 648.6957 160.0001 L 213.9128 519.9999" stroke="var(--text)" stroke-width="0.6535" marker-end="url(#arrow)" />
  <rect x="92.1738" y="519.9999" width="243.4784" height="100.0001" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="213.9128" y="579.9997" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Reduced Costs</text>
  <path d="M 648.6957 160.0001 L 648.6957 519.9999" stroke="var(--text)" stroke-width="0.6535" marker-end="url(#arrow)" />
  <rect x="526.9565" y="519.9999" width="243.4784" height="100.0001" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.6957" y="579.9997" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Increased Innovation</text>
  <path d="M 648.6957 160.0001 L 1083.4782 519.9999" stroke="var(--text)" stroke-width="0.6535" marker-end="url(#arrow)" />
  <rect x="926.9564" y="519.9999" width="313.0436" height="100.0001" rx="6" fill="var(--text-muted)" stroke="var(--text-muted)" stroke-width="0.6535" />
  <text x="1083.4782" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Better Customer</text>
  <text x="1083.4782" y="599.9998" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Satisfaction</text>
</svg>
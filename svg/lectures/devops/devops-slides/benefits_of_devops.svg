  <rect x="318.2606" y="299.9998" width="243.4784" height="100.0001" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="439.9999" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Better Quality</text>

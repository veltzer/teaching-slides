<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 4.8,0" fill="#333" />
    </marker>
  </defs>
  <rect x="485.797" y="118.1739" width="324.6377" height="87.6521" rx="9.8913" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="648.116" y="169.3044" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.374" font-weight="bold" fill="var(--bg)">DevOps Implementation</text>
  <path d="M 648.116 205.826 L 242.3188 308.087" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="80" y="308.087" width="227.2465" height="73.0435" rx="9.8913" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="193.6231" y="351.913" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4523" fill="var(--bg)">Faster Delivery</text>
  <path d="M 648.116 205.826 L 404.6376 308.087" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="339.71" y="308.087" width="227.2465" height="73.0435" rx="9.8913" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="453.3333" y="351.913" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4523" fill="var(--bg)">Better Quality</text>
  <path d="M 648.116 205.826 L 648.116 308.087" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="534.4928" y="308.087" width="227.2465" height="73.0435" rx="9.8913" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="648.116" y="351.913" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4523" fill="var(--bg)">Increased Reliability</text>
  <path d="M 648.116 205.826 L 891.5942 308.087" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="777.971" y="308.087" width="227.2465" height="73.0435" rx="9.8913" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="891.5942" y="351.913" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4523" fill="var(--bg)">Better Scalability</text>
  <path d="M 648.116 205.826 L 1053.913 308.087" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="972.7535" y="308.087" width="227.2465" height="73.0435" rx="9.8913" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1086.3768" y="351.913" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4523" fill="var(--bg)">Improved Security</text>
  <path d="M 648.116 205.826 L 242.3188 468.7826" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="128.6956" y="468.7826" width="227.2465" height="73.0435" rx="9.8913" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="242.3188" y="512.6086" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4523" fill="var(--bg)">Reduced Costs</text>
  <path d="M 648.116 205.826 L 648.116 468.7826" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="534.4928" y="468.7826" width="227.2465" height="73.0435" rx="9.8913" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="648.116" y="512.6086" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4523" fill="var(--bg)">Increased Innovation</text>
  <path d="M 648.116 205.826 L 1053.913 468.7826" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="907.826" y="468.7826" width="292.174" height="73.0435" rx="9.8913" fill="var(--text-muted)" stroke="var(--text-muted)" stroke-width="1.7723" />
  <text x="1053.913" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4523" fill="var(--bg)">Better Customer</text>
  <text x="1053.913" y="527.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4523" fill="var(--bg)">Satisfaction</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 4.8,0" fill="#333" />
    </marker>
  </defs>
  <rect x="295.3846" y="44.3077" width="196.9231" height="53.1692" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="393.8462" y="75.3231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1785" font-weight="bold" fill="var(--bg)">DevOps Implementation</text>
  <path d="M 393.8462 97.4769 L 147.6923 159.5077" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="49.2308" y="159.5077" width="137.8462" height="44.3077" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="118.1538" y="186.0923" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4062" fill="var(--bg)">Faster Delivery</text>
  <path d="M 393.8462 97.4769 L 246.1538 159.5077" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="206.7692" y="159.5077" width="137.8462" height="44.3077" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="275.6923" y="186.0923" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4062" fill="var(--bg)">Better Quality</text>
  <path d="M 393.8462 97.4769 L 393.8462 159.5077" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="324.9231" y="159.5077" width="137.8462" height="44.3077" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="393.8462" y="186.0923" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4062" fill="var(--bg)">Increased Reliability</text>
  <path d="M 393.8462 97.4769 L 541.5385 159.5077" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="472.6154" y="159.5077" width="137.8462" height="44.3077" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="541.5385" y="186.0923" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4062" fill="var(--bg)">Better Scalability</text>
  <path d="M 393.8462 97.4769 L 640 159.5077" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="590.7692" y="159.5077" width="137.8462" height="44.3077" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="659.6923" y="186.0923" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4062" fill="var(--bg)">Improved Security</text>
  <path d="M 393.8462 97.4769 L 147.6923 256.9846" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="78.7692" y="256.9846" width="137.8462" height="44.3077" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="147.6923" y="283.5692" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4062" fill="var(--bg)">Reduced Costs</text>
  <path d="M 393.8462 97.4769 L 393.8462 256.9846" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="324.9231" y="256.9846" width="137.8462" height="44.3077" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="393.8462" y="283.5692" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4062" fill="var(--bg)">Increased Innovation</text>
  <path d="M 393.8462 97.4769 L 640 256.9846" stroke="var(--text)" stroke-width="1.7723" marker-end="url(#arrowhead4)" />
  <rect x="551.3846" y="256.9846" width="177.2308" height="44.3077" rx="6" fill="var(--text-muted)" stroke="var(--text-muted)" stroke-width="1.7723" />
  <text x="640" y="274.7077" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4062" fill="var(--bg)">Better Customer</text>
  <text x="640" y="292.4308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4062" fill="var(--bg)">Satisfaction</text>
</svg>
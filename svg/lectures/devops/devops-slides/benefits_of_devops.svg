  <text x="648.6957" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Increased Reliability</text>
  <path d="M 648.6957 160.0001 L 909.5653 299.9998" stroke="var(--text)" stroke-width="0.6535" marker-end="url(#arrowhead4)" />
  <rect x="787.8261" y="299.9998" width="243.4784" height="100.0001" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="909.5653" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Better Scalability</text>
  <path d="M 648.6957 160.0001 L 1083.4782 299.9998" stroke="var(--text)" stroke-width="0.6535" marker-end="url(#arrowhead4)" />

  <path d="M 648.6957 160.0001 L 1083.4782 519.9999" stroke="var(--text)" stroke-width="0.6535" marker-end="url(#arrowhead4)" />
  <rect x="926.9564" y="519.9999" width="313.0436" height="100.0001" rx="6" fill="var(--text-muted)" stroke="var(--text-muted)" stroke-width="0.6535" />
  <text x="1083.4782" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Better Customer</text>
  <text x="1083.4782" y="599.9998" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7704" fill="var(--bg)">Satisfaction</text>

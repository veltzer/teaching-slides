<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="233.3334" width="141.1764" height="96.6666" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110.5881" y="291.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3804" font-weight="bold" fill="var(--bg)">Plan</text>
  <path d="M 181.1764 281.6668 L 251.7647 281.6668" stroke="var(--text)" stroke-width="0.6024" marker-end="url(#arrow)"/>
  <rect x="251.7647" y="233.3334" width="141.1764" height="96.6666" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="322.3528" y="291.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3804" font-weight="bold" fill="var(--bg)">Code</text>
  <path d="M 392.9411 281.6668 L 463.5294 281.6668" stroke="var(--text)" stroke-width="0.6024" marker-end="url(#arrow)"/>
  <rect x="463.5294" y="233.3334" width="141.1764" height="96.6666" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="534.1173" y="291.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3804" font-weight="bold" fill="var(--bg)">Build</text>
  <path d="M 604.7058 281.6668 L 675.2942 281.6668" stroke="var(--text)" stroke-width="0.6024" marker-end="url(#arrow)"/>
  <rect x="675.2942" y="233.3334" width="141.1764" height="96.6666" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="745.8825" y="291.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3804" font-weight="bold" fill="var(--bg)">Test</text>
  <path d="M 816.4706 281.6668 L 887.0587 281.6668" stroke="var(--text)" stroke-width="0.6024" marker-end="url(#arrow)"/>
  <rect x="887.0587" y="233.3334" width="141.1764" height="96.6666" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="957.647" y="291.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3804" font-weight="bold" fill="var(--bg)">Deploy</text>
  <path d="M 1028.2355 281.6668 L 1098.8236 281.6668" stroke="var(--text)" stroke-width="0.6024" marker-end="url(#arrow)"/>
  <rect x="1098.8236" y="233.3334" width="141.1764" height="96.6666" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1169.4119" y="291.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3804" font-weight="bold" fill="var(--bg)">Monitor</text>
  <rect x="481.1764" y="40" width="176.4707" height="77.3332" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="569.4116" y="88.3336" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3804" font-weight="bold" fill="var(--bg)">Security</text>
  <path d="M 569.4116 117.3336 L 110.5881 233.3334" stroke="var(--danger-border)" stroke-width="0.6024" stroke-dasharray="1.5061 1.5061" marker-end="url(#arrow)"/>
  <path d="M 569.4116 117.3336 L 322.3528 233.3334" stroke="var(--danger-border)" stroke-width="0.6024" stroke-dasharray="1.5061 1.5061" marker-end="url(#arrow)"/>
  <path d="M 569.4116 117.3336 L 534.1173 233.3334" stroke="var(--danger-border)" stroke-width="0.6024" stroke-dasharray="1.5061 1.5061" marker-end="url(#arrow)"/>
  <path d="M 569.4116 117.3336 L 745.8825 233.3334" stroke="var(--danger-border)" stroke-width="0.6024" stroke-dasharray="1.5061 1.5061" marker-end="url(#arrow)"/>
  <path d="M 569.4116 117.3336 L 957.647 233.3334" stroke="var(--danger-border)" stroke-width="0.6024" stroke-dasharray="1.5061 1.5061" marker-end="url(#arrow)"/>
  <path d="M 569.4116 117.3336 L 1169.4119 233.3334" stroke="var(--danger-border)" stroke-width="0.6024" stroke-dasharray="1.5061 1.5061" marker-end="url(#arrow)"/>
  <text x="110.5881" y="388.0002" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1356" fill="var(--text-muted)">Threat modeling</text>
  <text x="322.3528" y="388.0002" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1356" fill="var(--text-muted)">SAST</text>
  <text x="534.1173" y="388.0002" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1356" fill="var(--text-muted)">SCA</text>
  <text x="745.8825" y="388.0002" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1356" fill="var(--text-muted)">DAST</text>
  <text x="957.647" y="388.0002" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1356" fill="var(--text-muted)">Config scan</text>
  <text x="1169.4119" y="388.0002" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1356" fill="var(--text-muted)">Runtime protection</text>
  <text x="569.4116" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.8632" font-weight="bold" fill="var(--danger-accent)">Security Integrated at Every Stage</text>
</svg>

  <rect x="294.0541" y="145.9459" width="69.1892" height="48.6486" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="328.6486" y="175.1351" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1081" font-weight="bold" fill="var(--bg)">Build</text>
  <path d="M 363.2432 170.2703 L 397.8378 170.2703" stroke="var(--text)" stroke-width="1.7297" marker-end="url(#arrowhead11)" />
  <rect x="397.8378" y="145.9459" width="69.1892" height="48.6486" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="432.4324" y="175.1351" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1081" font-weight="bold" fill="var(--bg)">Test</text>
  <path d="M 467.027 170.2703 L 501.6216 170.2703" stroke="var(--text)" stroke-width="1.7297" marker-end="url(#arrowhead11)" />
  <rect x="501.6216" y="145.9459" width="69.1892" height="48.6486" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="536.2162" y="175.1351" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1081" font-weight="bold" fill="var(--bg)">Deploy</text>
  <path d="M 570.8108 170.2703 L 605.4054 170.2703" stroke="var(--text)" stroke-width="1.7297" marker-end="url(#arrowhead11)" />
  <rect x="605.4054" y="145.9459" width="69.1892" height="48.6486" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="175.1351" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1081" font-weight="bold" fill="var(--bg)">Monitor</text>
  <rect x="302.7027" y="48.6486" width="86.4865" height="38.9189" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="345.9459" y="72.973" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1081" font-weight="bold" fill="var(--bg)">Security</text>
  <path d="M 345.9459 87.5676 L 121.0811 145.9459" stroke="var(--danger-border)" stroke-width="1.7297" stroke-dasharray="4.3243 4.3243" marker-end="url(#arrowhead11)" />
  <path d="M 345.9459 87.5676 L 224.8649 145.9459" stroke="var(--danger-border)" stroke-width="1.7297" stroke-dasharray="4.3243 4.3243" marker-end="url(#arrowhead11)" />
  <path d="M 345.9459 87.5676 L 328.6486 145.9459" stroke="var(--danger-border)" stroke-width="1.7297" stroke-dasharray="4.3243 4.3243" marker-end="url(#arrowhead11)" />
  <path d="M 345.9459 87.5676 L 432.4324 145.9459" stroke="var(--danger-border)" stroke-width="1.7297" stroke-dasharray="4.3243 4.3243" marker-end="url(#arrowhead11)" />
  <path d="M 345.9459 87.5676 L 536.2162 145.9459" stroke="var(--danger-border)" stroke-width="1.7297" stroke-dasharray="4.3243 4.3243" marker-end="url(#arrowhead11)" />
  <path d="M 345.9459 87.5676 L 640 145.9459" stroke="var(--danger-border)" stroke-width="1.7297" stroke-dasharray="4.3243 4.3243" marker-end="url(#arrowhead11)" />
  <text x="121.0811" y="223.7838" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Threat modeling</text>
  <text x="224.8649" y="223.7838" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">SAST</text>
  <text x="328.6486" y="223.7838" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">SCA</text>
  <text x="432.4324" y="223.7838" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">DAST</text>
  <text x="536.2162" y="223.7838" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Config scan</text>
  <text x="640" y="223.7838" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Runtime protection</text>
  <text x="345.9459" y="340.5405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8378" font-weight="bold" fill="var(--danger-accent)">Security Integrated at Every Stage</text>
</svg>
  <rect x="669.6295" y="246.6667" width="118.5185" height="83.3332" rx="10.2778" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="728.8888" y="296.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7407" font-weight="bold" fill="var(--bg)">Test</text>
  <path d="M 788.1481 288.3335 L 847.4073 288.3335" stroke="var(--text)" stroke-width="1.7297" marker-end="url(#arrowhead11)" />
  <rect x="847.4073" y="246.6667" width="118.5185" height="83.3332" rx="10.2778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="906.6666" y="296.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7407" font-weight="bold" fill="var(--bg)">Deploy</text>
  <path d="M 965.9259 288.3335 L 1025.1851 288.3335" stroke="var(--text)" stroke-width="1.7297" marker-end="url(#arrowhead11)" />
  <rect x="1025.1851" y="246.6667" width="118.5185" height="83.3332" rx="10.2778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1084.4444" y="296.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7407" font-weight="bold" fill="var(--bg)">Monitor</text>
  <rect x="506.6666" y="80" width="148.1482" height="66.6666" rx="10.2778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="580.7406" y="121.6668" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7407" font-weight="bold" fill="var(--bg)">Security</text>
  <path d="M 580.7406 146.6668 L 195.5556 246.6667" stroke="var(--danger-border)" stroke-width="1.7297" stroke-dasharray="4.3243 4.3243" marker-end="url(#arrowhead11)" />
  <path d="M 580.7406 146.6668 L 373.3334 246.6667" stroke="var(--danger-border)" stroke-width="1.7297" stroke-dasharray="4.3243 4.3243" marker-end="url(#arrowhead11)" />
  <path d="M 580.7406 146.6668 L 551.111 246.6667" stroke="var(--danger-border)" stroke-width="1.7297" stroke-dasharray="4.3243 4.3243" marker-end="url(#arrowhead11)" />
  <path d="M 580.7406 146.6668 L 728.8888 246.6667" stroke="var(--danger-border)" stroke-width="1.7297" stroke-dasharray="4.3243 4.3243" marker-end="url(#arrowhead11)" />
  <path d="M 580.7406 146.6668 L 906.6666 246.6667" stroke="var(--danger-border)" stroke-width="1.7297" stroke-dasharray="4.3243 4.3243" marker-end="url(#arrowhead11)" />
  <path d="M 580.7406 146.6668 L 1084.4444 246.6667" stroke="var(--danger-border)" stroke-width="1.7297" stroke-dasharray="4.3243 4.3243" marker-end="url(#arrowhead11)" />
  <text x="195.5556" y="380.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1296" fill="var(--text-muted)">Threat modeling</text>
  <text x="373.3334" y="380.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1296" fill="var(--text-muted)">SAST</text>
  <text x="551.111" y="380.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1296" fill="var(--text-muted)">SCA</text>
  <text x="728.8888" y="380.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1296" fill="var(--text-muted)">DAST</text>
  <text x="906.6666" y="380.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1296" fill="var(--text-muted)">Config scan</text>
  <text x="1084.4444" y="380.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1296" fill="var(--text-muted)">Runtime protection</text>
  <text x="580.7406" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7036" font-weight="bold" fill="var(--danger-accent)">Security Integrated at Every Stage</text>
</svg>
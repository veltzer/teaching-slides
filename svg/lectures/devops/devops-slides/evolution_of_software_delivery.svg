<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#333">Software Delivery Evolution</text>
  <line x1="160" y1="180" x2="1120" y2="180" stroke="#666" stroke-width="4.8" />
  <circle cx="160" cy="180" r="8" fill="#666" />
  <circle cx="480" cy="180" r="8" fill="#666" />
  <circle cx="800" cy="180" r="8" fill="#666" />
  <circle cx="1120" cy="180" r="8" fill="#666" />
  <text x="160" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#333">Traditional</text>
  <text x="800" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#333">Modern</text>
  <rect x="80" y="234" width="320" height="108" rx="8" fill="#ffebee" stroke="#f44336" stroke-width="3.2" />
  <text x="240" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#333">Waterfall</text>
  <text x="240" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#666">Months/Years cycles</text>
  <rect x="80" y="360" width="320" height="108" rx="8" fill="#ffebee" stroke="#f44336" stroke-width="3.2" />
  <text x="240" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#333">Silos</text>
  <text x="240" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#666">Separate teams</text>
  <rect x="480" y="234" width="288" height="108" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="3.2" />
  <text x="624" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#333">Agile</text>
  <text x="624" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#666">Weeks cycles</text>
  <rect x="800" y="234" width="288" height="108" rx="8" fill="#e3f2fd" stroke="#2196f3" stroke-width="3.2" />
  <text x="944" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#333">DevOps</text>
  <text x="944" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#666">Days/Hours cycles</text>
  <rect x="800" y="360" width="288" height="108" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="3.2" />
  <text x="944" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#333">DevSecOps</text>
  <text x="944" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#666">Security integration</text>
</svg>
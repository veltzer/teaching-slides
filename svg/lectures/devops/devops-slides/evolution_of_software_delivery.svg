<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="678.4733" y="108.7786" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.1985" font-weight="bold" fill="var(--text)">Software Delivery Evolution</text>
  <line x1="165.4962" y1="243.4351" x2="1191.4504" y2="243.4351" stroke="var(--text-muted)" stroke-width="2" />
  <circle cx="165.4962" cy="243.4351" r="8.5496" fill="var(--text-muted)" />
  <circle cx="507.4809" cy="243.4351" r="8.5496" fill="var(--text-muted)" />
  <circle cx="849.4656" cy="243.4351" r="8.5496" fill="var(--text-muted)" />
  <circle cx="1191.4504" cy="243.4351" r="8.5496" fill="var(--text-muted)" />
  <text x="165.4962" y="204.9618" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9389" font-weight="bold" fill="var(--text)">Traditional</text>
  <text x="849.4656" y="204.9618" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9389" font-weight="bold" fill="var(--text)">Modern</text>
  <rect x="80" y="301.145" width="341.9847" height="115.4198" rx="6.4122" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="250.9924" y="349.2366" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9389" font-weight="bold" fill="var(--text)">Waterfall</text>
  <text x="250.9924" y="387.7099" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5191" fill="var(--text-muted)">Months/Years cycles</text>
  <rect x="80" y="435.8015" width="341.9847" height="115.4198" rx="6.4122" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="250.9924" y="483.8931" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9389" font-weight="bold" fill="var(--text)">Silos</text>
  <text x="250.9924" y="522.3664" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5191" fill="var(--text-muted)">Separate teams</text>
  <rect x="507.4809" y="301.145" width="307.7863" height="115.4198" rx="6.4122" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="661.374" y="349.2366" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9389" font-weight="bold" fill="var(--text)">Agile</text>
  <text x="661.374" y="387.7099" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5191" fill="var(--text-muted)">Weeks cycles</text>
  <rect x="849.4656" y="301.145" width="307.7863" height="115.4198" rx="6.4122" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1003.3588" y="349.2366" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9389" font-weight="bold" fill="var(--text)">DevOps</text>
  <text x="1003.3588" y="387.7099" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5191" fill="var(--text-muted)">Days/Hours cycles</text>
  <rect x="849.4656" y="435.8015" width="307.7863" height="115.4198" rx="6.4122" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1003.3588" y="483.8931" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9389" font-weight="bold" fill="var(--text)">DevSecOps</text>
  <text x="1003.3588" y="522.3664" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5191" fill="var(--text-muted)">Security integration</text>
</svg>
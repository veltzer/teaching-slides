<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="681.2214" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="40.5298" font-weight="bold" fill="var(--text)">Software Delivery Evolution</text>
  <line x1="131.6031" y1="216.5218" x2="1230.8397" y2="216.5218" stroke="var(--text-muted)" stroke-width="2" />
  <circle cx="131.6031" cy="216.5218" r="10.1324" fill="var(--text-muted)" />
  <circle cx="498.0152" cy="216.5218" r="10.1324" fill="var(--text-muted)" />
  <circle cx="864.4274" cy="216.5218" r="10.1324" fill="var(--text-muted)" />
  <circle cx="1230.8397" cy="216.5218" r="10.1324" fill="var(--text-muted)" />
  <text x="131.6031" y="166.087" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.3708" font-weight="bold" fill="var(--text)">Traditional</text>
  <text x="864.4274" y="166.087" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.3708" font-weight="bold" fill="var(--text)">Modern</text>
  <rect x="40" y="292.1739" width="366.4122" height="151.3043" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="223.2061" y="355.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.3708" font-weight="bold" fill="var(--text)">Waterfall</text>
  <text x="223.2061" y="405.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3179" fill="var(--text-muted)">Months/Years cycles</text>
  <rect x="40" y="468.6957" width="366.4122" height="151.3043" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="223.2061" y="531.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.3708" font-weight="bold" fill="var(--text)">Silos</text>
  <text x="223.2061" y="582.1739" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3179" fill="var(--text-muted)">Separate teams</text>
  <rect x="498.0152" y="292.1739" width="329.771" height="151.3043" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="662.9007" y="355.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.3708" font-weight="bold" fill="var(--text)">Agile</text>
  <text x="662.9007" y="405.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3179" fill="var(--text-muted)">Weeks cycles</text>
  <rect x="864.4274" y="292.1739" width="329.771" height="151.3043" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1029.313" y="355.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.3708" font-weight="bold" fill="var(--text)">DevOps</text>
  <text x="1029.313" y="405.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3179" fill="var(--text-muted)">Days/Hours cycles</text>
  <rect x="864.4274" y="468.6957" width="329.771" height="151.3043" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1029.313" y="531.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.3708" font-weight="bold" fill="var(--text)">DevSecOps</text>
  <text x="1029.313" y="582.1739" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3179" fill="var(--text-muted)">Security integration</text>
</svg>
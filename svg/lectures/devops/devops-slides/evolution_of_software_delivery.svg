<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="680.702015" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="40.513357" font-weight="bold" fill="var(--text)">Software Delivery Evolution</text>
  <line x1="131.528959" y1="216.5218" x2="1229.875071" y2="216.5218" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="121.400231" y="206.394" width="20.256657" height="20.2566" rx="10.128314" fill="var(--text-muted)"/>
  <rect x="487.516268" y="206.394" width="20.256657" height="20.2566" rx="10.128314" fill="var(--text-muted)"/>
  <rect x="853.631305" y="206.394" width="20.256657" height="20.2566" rx="10.128314" fill="var(--text-muted)"/>
  <rect x="1219.743343" y="206.394" width="20.256657" height="20.2566" rx="10.128314" fill="var(--text-muted)"/>
  <text x="131.528959" y="166.087" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.35934" font-weight="bold" fill="var(--text)">Traditional</text>
  <text x="863.759634" y="166.087" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.35934" font-weight="bold" fill="var(--text)">Modern</text>
  <rect x="40" y="292.1739" width="366.115337" height="151.3043" rx="5.997608" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.057719" y="355.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.35934" font-weight="bold" fill="var(--text)">Waterfall</text>
  <text x="223.057719" y="405.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.308134" fill="var(--text-muted)">Months/Years cycles</text>
  <rect x="40" y="468.6957" width="366.115337" height="151.3043" rx="5.997608" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.057719" y="531.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.35934" font-weight="bold" fill="var(--text)">Silos</text>
  <text x="223.057719" y="582.1739" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.308134" fill="var(--text-muted)">Separate teams</text>
  <rect x="497.644197" y="292.1739" width="329.503934" height="151.3043" rx="5.997608" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="662.396163" y="355.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.35934" font-weight="bold" fill="var(--text)">Agile</text>
  <text x="662.396163" y="405.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.308134" fill="var(--text-muted)">Weeks cycles</text>
  <rect x="863.759634" y="292.1739" width="329.503934" height="151.3043" rx="5.997608" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1028.511601" y="355.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.35934" font-weight="bold" fill="var(--text)">DevOps</text>
  <text x="1028.511601" y="405.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.308134" fill="var(--text-muted)">Days/Hours cycles</text>
  <rect x="863.759634" y="468.6957" width="329.503934" height="151.3043" rx="5.997608" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1028.511601" y="531.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.35934" font-weight="bold" fill="var(--text)">DevSecOps</text>
  <text x="1028.511601" y="582.1739" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.308134" fill="var(--text-muted)">Security integration</text>
</svg>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">Software Delivery Evolution</text>
  <line x1="100" y1="100" x2="700" y2="100" stroke="#666" stroke-width="3"/>
  <circle cx="100" cy="100" r="5" fill="#666"/>
  <circle cx="300" cy="100" r="5" fill="#666"/>
  <circle cx="500" cy="100" r="5" fill="#666"/>
  <circle cx="700" cy="100" r="5" fill="#666"/>
  <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Traditional</text>
  <text x="500" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Modern</text>
  <rect x="50" y="130" width="200" height="60" rx="5" fill="#ffebee" stroke="#f44336" stroke-width="2"/>
  <text x="150" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Waterfall</text>
  <text x="150" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Months/Years cycles</text>
  <rect x="50" y="200" width="200" height="60" rx="5" fill="#ffebee" stroke="#f44336" stroke-width="2"/>
  <text x="150" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Silos</text>
  <text x="150" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Separate teams</text>
  <rect x="300" y="130" width="180" height="60" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="390" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Agile</text>
  <text x="390" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Weeks cycles</text>
  <rect x="500" y="130" width="180" height="60" rx="5" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="590" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">DevOps</text>
  <text x="590" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Days/Hours cycles</text>
  <rect x="500" y="200" width="180" height="60" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="590" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">DevSecOps</text>
  <text x="590" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Security integration</text>

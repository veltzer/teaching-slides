<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <g transform="translate(400,160)">
    <path d="M -50 40 C -50 -32.4999 10.0001 -32.4999 40 3.75 C 69.9999 -32.4999 130 -32.4999 130 40 C 130 112.5001 69.9999 112.5001 40 76.2501 C 10.0001 112.5001 -50 112.5001 -50 40 Z" fill="none" stroke="var(--danger-border)" stroke-width="5.6889" />
    <text x="-20" y="47.2501" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="22.2471" font-weight="bold">Dev</text>
    <text x="58" y="47.2501" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="22.2471" font-weight="bold">Ops</text>
  </g>
  <g transform="translate(130,100)">
    <rect x="40" y="40" width="90" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="85" y="69" text-anchor="middle" fill="var(--info-accent)" font-family="Arial,sans-serif" font-size="15.2948">Plan</text>
  </g>
  <g transform="translate(130,160)">
    <rect x="40" y="40" width="90" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="85" y="69" text-anchor="middle" fill="var(--info-accent)" font-family="Arial,sans-serif" font-size="15.2948">Code</text>
  </g>
  <g transform="translate(130,220)">
    <rect x="40" y="40" width="90" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="85" y="69" text-anchor="middle" fill="var(--info-accent)" font-family="Arial,sans-serif" font-size="15.2948">Build</text>
  </g>
  <g transform="translate(610,100)">
    <rect x="40" y="40" width="90" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="85" y="69" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="15.2948">Deploy</text>
  </g>
  <g transform="translate(610,160)">
    <rect x="40" y="40" width="90" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="85" y="69" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="15.2948">Monitor</text>
  </g>
  <g transform="translate(610,220)">
    <rect x="40" y="40" width="90" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="85" y="69" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="15.2948">Operate</text>
  </g>
  <circle cx="639.9999" cy="170.5" r="27.8088" fill="none" stroke="var(--text)" stroke-width="2.8444" />
  <circle cx="639.9999" cy="170.5" r="11.1235" fill="var(--text)" />
  <text x="639.9999" y="504" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="44.4942" font-weight="bold">DevOps Practices</text>
  <text x="639.9999" y="554.75" text-anchor="middle" fill="var(--text-faint)" font-family="Arial,sans-serif" font-size="22.2471">Bridging Development and Operations</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <g transform="translate(400,160)">
    <path d="M -50 40 C -50 -32.4999 10.0001 -32.4999 40 3.75 C 69.9999 -32.4999 130 -32.4999 130 40 C 130 112.5001 69.9999 112.5001 40 76.2501 C 10.0001 112.5001 -50 112.5001 -50 40 Z" fill="none" stroke="var(--danger-border)" stroke-width="5.6889" />
    <text x="-20" y="47.2501" fill="var(--primary-accent)" font-size="22.2471" font-weight="bold" font-family="Arial, sans-serif">Dev</text>
    <text x="58" y="47.2501" fill="var(--primary-accent)" font-size="22.2471" font-weight="bold" font-family="Arial, sans-serif">Ops</text>
  </g>
  <g transform="translate(130,100)">
    <rect x="40" y="40" width="90" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="85" y="69" text-anchor="middle" fill="var(--info-accent)" font-size="15.2948" font-family="Arial, sans-serif">Plan</text>
  </g>
  <g transform="translate(130,160)">
    <rect x="40" y="40" width="90" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="85" y="69" text-anchor="middle" fill="var(--info-accent)" font-size="15.2948" font-family="Arial, sans-serif">Code</text>
  </g>
  <g transform="translate(130,220)">
    <rect x="40" y="40" width="90" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="85" y="69" text-anchor="middle" fill="var(--info-accent)" font-size="15.2948" font-family="Arial, sans-serif">Build</text>
  </g>
  <g transform="translate(610,100)">
    <rect x="40" y="40" width="90" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="85" y="69" text-anchor="middle" fill="var(--primary-accent)" font-size="15.2948" font-family="Arial, sans-serif">Deploy</text>
  </g>
  <g transform="translate(610,160)">
    <rect x="40" y="40" width="90" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="85" y="69" text-anchor="middle" fill="var(--primary-accent)" font-size="15.2948" font-family="Arial, sans-serif">Monitor</text>
  </g>
  <g transform="translate(610,220)">
    <rect x="40" y="40" width="90" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
    <text x="85" y="69" text-anchor="middle" fill="var(--primary-accent)" font-size="15.2948" font-family="Arial, sans-serif">Operate</text>
  </g>
  <circle cx="639.9999" cy="170.5" r="27.8088" fill="none" stroke="var(--text)" stroke-width="2.8444" />
  <circle cx="639.9999" cy="170.5" r="11.1235" fill="var(--text)" />
  <text x="639.9999" y="504" text-anchor="middle" fill="var(--surface)" font-size="44.4942" font-weight="bold" font-family="Arial, sans-serif">DevOps Practices</text>
  <text x="639.9999" y="554.75" text-anchor="middle" fill="var(--text-faint)" font-size="22.2471" font-family="Arial, sans-serif">Bridging Development and Operations</text>
</svg>
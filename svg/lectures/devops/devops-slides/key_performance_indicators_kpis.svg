<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Central hub -->
  <rect x="490" y="285" width="300" height="150" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="335" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-text)">KPIs</text>
  <text x="640" y="375" text-anchor="middle" font-size="18" fill="var(--primary-text)">Key Performance</text>
  <text x="640" y="405" text-anchor="middle" font-size="18" fill="var(--primary-text)">Indicators</text>

  <!-- Connectors to four surrounding cards -->
  <line x1="490" y1="310" x2="340" y2="200" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="310" x2="940" y2="200" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="410" x2="340" y2="520" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="410" x2="940" y2="520" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Top-left: Technical -->
  <rect x="40" y="40" width="300" height="220" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="190" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)">Technical</text>
  <text x="190" y="130" text-anchor="middle" font-size="16" fill="var(--ok-text)">latency p95/p99</text>
  <text x="190" y="160" text-anchor="middle" font-size="16" fill="var(--ok-text)">error rate</text>
  <text x="190" y="190" text-anchor="middle" font-size="16" fill="var(--ok-text)">throughput</text>
  <text x="190" y="225" text-anchor="middle" font-size="16" fill="var(--ok-text)">uptime / SLO</text>

  <!-- Top-right: Business -->
  <rect x="940" y="40" width="300" height="220" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1090" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--warn-text)">Business</text>
  <text x="1090" y="130" text-anchor="middle" font-size="16" fill="var(--warn-text)">active users</text>
  <text x="1090" y="160" text-anchor="middle" font-size="16" fill="var(--warn-text)">conversion rate</text>
  <text x="1090" y="190" text-anchor="middle" font-size="16" fill="var(--warn-text)">revenue / order</text>
  <text x="1090" y="225" text-anchor="middle" font-size="16" fill="var(--warn-text)">customer satisfaction</text>

  <!-- Bottom-left: DORA -->
  <rect x="40" y="460" width="300" height="160" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="190" y="505" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--info-text)">DORA</text>
  <text x="190" y="540" text-anchor="middle" font-size="15" fill="var(--info-text)">deploy frequency</text>
  <text x="190" y="565" text-anchor="middle" font-size="15" fill="var(--info-text)">lead time, MTTR</text>
  <text x="190" y="590" text-anchor="middle" font-size="15" fill="var(--info-text)">change-fail rate</text>

  <!-- Bottom-right: ROI -->
  <rect x="940" y="460" width="300" height="160" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1090" y="505" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--danger-text)">ROI</text>
  <text x="1090" y="540" text-anchor="middle" font-size="15" fill="var(--danger-text)">cost per request</text>
  <text x="1090" y="565" text-anchor="middle" font-size="15" fill="var(--danger-text)">infra spend</text>
  <text x="1090" y="590" text-anchor="middle" font-size="15" fill="var(--danger-text)">eng productivity</text>

  <!-- Bottom band -->
  <rect x="380" y="470" width="520" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="510" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">Pick few, track them, act on them.</text>
  <text x="640" y="545" text-anchor="middle" font-size="14" fill="var(--text-muted)">Technical metrics feed business metrics.</text>
  <text x="640" y="575" text-anchor="middle" font-size="14" fill="var(--text-muted)">Every KPI needs an owner and a target.</text>
  <text x="640" y="605" text-anchor="middle" font-size="14" fill="var(--text-muted)">Alert on user-visible symptoms, not causes.</text>
</svg>

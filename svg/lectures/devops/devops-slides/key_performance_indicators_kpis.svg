<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Central hub -->
  <rect x="490" y="285" width="300" height="150" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="335" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">KPIs</text>
  <text x="640" y="375" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">Key Performance</text>
  <text x="640" y="405" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">Indicators</text>

  <!-- Connectors to four surrounding cards -->
  <line x1="490" y1="310" x2="340" y2="200" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="310" x2="940" y2="200" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="410" x2="340" y2="520" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="410" x2="940" y2="520" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Top-left: Technical -->
  <rect x="40" y="40" width="300" height="220" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Technical</text>
  <text x="190" y="130" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">latency p95/p99</text>
  <text x="190" y="160" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">error rate</text>
  <text x="190" y="190" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">throughput</text>
  <text x="190" y="225" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">uptime / SLO</text>

  <!-- Top-right: Business -->
  <rect x="940" y="40" width="300" height="220" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Business</text>
  <text x="1090" y="130" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">active users</text>
  <text x="1090" y="160" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">conversion rate</text>
  <text x="1090" y="190" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">revenue / order</text>
  <text x="1090" y="225" text-anchor="middle" font-size="16" fill="var(--warn-text)" font-family="Arial, sans-serif">customer satisfaction</text>

  <!-- Bottom-left: DORA -->
  <rect x="40" y="460" width="300" height="160" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="505" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">DORA</text>
  <text x="190" y="540" text-anchor="middle" font-size="15" fill="var(--info-text)" font-family="Arial, sans-serif">deploy frequency</text>
  <text x="190" y="565" text-anchor="middle" font-size="15" fill="var(--info-text)" font-family="Arial, sans-serif">lead time, MTTR</text>
  <text x="190" y="590" text-anchor="middle" font-size="15" fill="var(--info-text)" font-family="Arial, sans-serif">change-fail rate</text>

  <!-- Bottom-right: ROI -->
  <rect x="940" y="460" width="300" height="160" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="505" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">ROI</text>
  <text x="1090" y="540" text-anchor="middle" font-size="15" fill="var(--danger-text)" font-family="Arial, sans-serif">cost per request</text>
  <text x="1090" y="565" text-anchor="middle" font-size="15" fill="var(--danger-text)" font-family="Arial, sans-serif">infra spend</text>
  <text x="1090" y="590" text-anchor="middle" font-size="15" fill="var(--danger-text)" font-family="Arial, sans-serif">eng productivity</text>

  <!-- Bottom band -->
  <rect x="380" y="470" width="520" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="510" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pick few, track them, act on them.</text>
  <text x="640" y="545" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Technical metrics feed business metrics.</text>
  <text x="640" y="575" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Every KPI needs an owner and a target.</text>
  <text x="640" y="605" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Alert on user-visible symptoms, not causes.</text>
</svg>

  <text x="732.4812" y="548.7949" text-anchor="middle" fill="var(--ok-accent)" font-size="17.694" font-family="Courier New, monospace">reduce</text>
  <line x1="715.5637" y1="339.0625" x2="670.4509" y2="396.0269" stroke="var(--text-muted)" stroke-width="0.6459" />
  <line x1="749.3985" y1="339.0625" x2="794.5112" y2="396.0269" stroke="var(--text-muted)" stroke-width="0.6459" />
  <line x1="670.4509" y1="455.5804" x2="715.5637" y2="512.5447" stroke="var(--text-muted)" stroke-width="0.6459" />
  <line x1="794.5112" y1="455.5804" x2="749.3985" y2="512.5447" stroke="var(--text-muted)" stroke-width="0.6459" />
  <rect x="935.4886" y="283.3928" width="124.0601" height="90.625" rx="6" fill="var(--text)" stroke="var(--primary-border)" stroke-width="0.6459" />
  <text x="997.5188" y="315.7589" text-anchor="middle" fill="var(--primary-accent)" font-size="17.694" font-weight="bold" font-family="Arial, sans-serif">Executor 1</text>
  <rect x="950.1504" y="335.1786" width="33.8346" height="25.8928" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="991.8799" y="335.1786" width="33.8346" height="25.8928" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="967.0676" y="353.3037" text-anchor="middle" fill="var(--primary-accent)" font-size="17.694" font-family="Courier New, monospace">T1</text>
  <text x="1008.7969" y="353.3037" text-anchor="middle" fill="var(--primary-accent)" font-size="17.694" font-family="Courier New, monospace">T2</text>
  <rect x="1093.3835" y="283.3928" width="124.0601" height="90.625" rx="6" fill="var(--text)" stroke="var(--info-border)" stroke-width="0.6459" />
  <text x="1155.4136" y="315.7589" text-anchor="middle" fill="var(--info-accent)" font-size="17.694" font-weight="bold" font-family="Arial, sans-serif">Executor 2</text>
  <rect x="1108.0451" y="335.1786" width="33.8346" height="25.8928" rx="6" fill="url(#grad-info)" opacity="0.3" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1149.7745" y="335.1786" width="33.8346" height="25.8928" rx="6" fill="url(#grad-info)" opacity="0.3" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.9623" y="353.3037" text-anchor="middle" fill="var(--info-accent)" font-size="17.694" font-family="Courier New, monospace">T3</text>
  <text x="1166.6917" y="353.3037" text-anchor="middle" fill="var(--info-accent)" font-size="17.694" font-family="Courier New, monospace">T4</text>

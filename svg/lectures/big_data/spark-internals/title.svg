  <rect x="1149.7745" y="568.2144" width="90.2255" height="51.7856" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="0.4845" />
  <text x="1194.8873" y="600.5803" text-anchor="middle" fill="var(--ok-accent)" font-size="17.694" font-family="Arial, sans-serif">Stage 2</text>
  <text x="1048.2706" y="548.7949" text-anchor="middle" fill="var(--warn-accent)" font-size="17.694" font-family="Arial, sans-serif">shuffle</text>

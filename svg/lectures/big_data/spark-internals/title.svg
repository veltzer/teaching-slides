  <path d="M 1048.2706 568.2144 Q 1104.6616 529.375 1161.0527 568.2144" fill="none" stroke="var(--warn-border)" stroke-width="0.6459" stroke-dasharray="1.6149 0.9689" />
  <rect x="901.6542" y="568.2144" width="90.2255" height="51.7856" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="0.4845" />
  <text x="946.767" y="600.5803" text-anchor="middle" fill="var(--ok-accent)" font-size="17.694" font-family="Arial, sans-serif">Stage 0</text>
  <rect x="1025.7141" y="568.2144" width="90.2255" height="51.7856" rx="6" fill="var(--text)" stroke="var(--ok-border)" stroke-width="0.4845" />

    <line x1="261.2122" y1="523.1818" x2="1069.2929" y2="523.1818" />
    <line x1="362.2223" y1="125.4546" x2="362.2223" y2="580" />
    <line x1="463.2323" y1="125.4546" x2="463.2323" y2="580" />
    <line x1="564.2424" y1="125.4546" x2="564.2424" y2="580" />
    <line x1="665.2525" y1="125.4546" x2="665.2525" y2="580" />
    <line x1="766.2626" y1="125.4546" x2="766.2626" y2="580" />
    <line x1="867.2727" y1="125.4546" x2="867.2727" y2="580" />
    <line x1="968.2828" y1="125.4546" x2="968.2828" y2="580" />
  </g>
  <g transform="translate(150, 80)">
    <polygon points="321.8182,125.4546 281.4142,227.7273 311.7172,227.7273 291.5152,307.2727 362.2223,193.6364 326.8688,193.6364 352.1212,125.4546" fill="url(#spark)" opacity="0.9" />
  </g>
  <g transform="translate(550, 100)">
    <circle cx="301.6162" cy="159.5454" r="28.2828" fill="none" stroke="var(--primary-border)" stroke-width="5.4857" opacity="0.8" />
    <circle cx="342.0203" cy="205" r="28.2828" fill="none" stroke="var(--warn-border)" stroke-width="5.4857" opacity="0.8" />

    <path d="M 342.0203 173.1819 L 342.0203 159.5454 Q 342.0203 127.7273 313.7375 127.7273 L 301.6162 127.7273" fill="none" stroke="var(--warn-border)" stroke-width="5.4857" opacity="0.8" />

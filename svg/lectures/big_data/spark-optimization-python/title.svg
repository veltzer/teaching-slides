  <g opacity="0.3">
    <path d="M 362.2223 466.3636 Q 463.2323 443.6364 564.2424 466.3636 Q 665.2525 489.0909 766.2626 466.3636 Q 867.2727 443.6364 968.2828 466.3636" fill="none" stroke="var(--ok-border)" stroke-width="1.8286" />

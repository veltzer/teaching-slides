    <path d="M 210.7071 125.4546 A 311.7172 175.9596 261.2122 125.4546 262.317 160.8081 220.3031" fill="none" stroke="var(--ok-border)" stroke-width="7.3143" stroke-linecap="round" />
    <line x1="261.2122" y1="125.4546" x2="286.4646" y2="80" stroke="var(--danger-border)" stroke-width="2" stroke-linecap="round" />

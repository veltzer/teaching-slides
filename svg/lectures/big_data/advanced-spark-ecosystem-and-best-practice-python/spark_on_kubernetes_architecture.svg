<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="height: 400px; display: block; margin: auto;">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="56.571429" width="1200" height="563.428571" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.0952 6.0952" rx="6.857143"/>

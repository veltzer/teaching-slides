    <text x="91.4286" y="34.2857" font-family="Arial, sans-serif" font-size="17.0667" text-anchor="middle" fill="var(--bg)" font-weight="bold">Executor Pod 2</text>
    <rect x="12.1905" y="48" width="158.4762" height="48" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="91.4286" y="79.5429" font-family="Arial, sans-serif" font-size="14.6286" text-anchor="middle" fill="var(--bg)">Spark Executor</text>
  </g>
  <g transform="translate(450, 240)">
    <rect x="0" y="0" width="182.8571" height="109.7143" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="91.4286" y="34.2857" font-family="Arial, sans-serif" font-size="17.0667" text-anchor="middle" fill="var(--bg)" font-weight="bold">Executor Pod N</text>
    <rect x="12.1905" y="48" width="158.4762" height="48" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="91.4286" y="79.5429" font-family="Arial, sans-serif" font-size="14.6286" text-anchor="middle" fill="var(--bg)">Spark Executor</text>

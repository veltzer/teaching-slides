<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg);height: 300px; display: block; margin: auto;">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect width="987.6544" height="473.2141" fill="var(--surface)" rx="5.986" x="40" y="40"/>
  <g transform="translate(50, 50)">
    <rect x="506.872" y="258.014" width="182.305" height="182.305" rx="14" fill="url(#grad-warn)" opacity="0.8" filter="url(#shadow)"/>
    <text x="598.0246" y="341.2798" font-family="Arial, sans-serif" font-size="20.5096" font-weight="bold" text-anchor="middle" fill="var(--bg)">BRONZE</text>
    <text x="598.0246" y="372.8273" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--bg)">Raw Data</text>
    <text x="598.0246" y="522.6784" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--text-muted)">• Ingestion</text>
    <text x="598.0246" y="546.3391" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--text-muted)">• Historical</text>
    <text x="598.0246" y="570" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--text-muted)">• Unvalidated</text>
  </g>
  <g transform="translate(300, 50)">
    <rect x="506.872" y="258.014" width="182.305" height="182.305" rx="14" fill="var(--border)" opacity="0.8"/>
    <text x="598.0246" y="341.2798" font-family="Arial, sans-serif" font-size="20.5096" font-weight="bold" text-anchor="middle" fill="var(--bg)">SILVER</text>
    <text x="598.0246" y="372.8273" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--bg)">Refined Data</text>
    <text x="598.0246" y="522.6784" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--text-muted)">• Cleaned</text>
    <text x="598.0246" y="546.3391" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--text-muted)">• Deduplicated</text>
    <text x="598.0246" y="570" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--text-muted)">• Validated</text>
  </g>
  <g transform="translate(550, 50)">
    <rect x="506.872" y="258.014" width="182.305" height="182.305" rx="14" fill="url(#grad-warn)" opacity="0.8" filter="url(#shadow)"/>
    <text x="598.0246" y="341.2798" font-family="Arial, sans-serif" font-size="20.5096" font-weight="bold" text-anchor="middle" fill="var(--bg)">GOLD</text>
    <text x="598.0246" y="372.8273" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--bg)">Business Data</text>
    <text x="598.0246" y="522.6784" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--text-muted)">• Aggregated</text>
    <text x="598.0246" y="546.3391" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--text-muted)">• Features</text>
    <text x="598.0246" y="570" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--text-muted)">• Analytics</text>
  </g>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <path d="M 758.5187 428.0358 L 931.3579 428.0358" stroke="var(--text)" stroke-width="1.3279" marker-end="url(#arrow)"/>
  <path d="M 1067.1604 428.0358 L 1240 428.0358" stroke="var(--text)" stroke-width="1.3279" marker-end="url(#arrow)"/>
  <text x="844.9383" y="420.1489" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--text-muted)">Clean &amp; Validate</text>
  <text x="1153.5801" y="420.1489" font-family="Arial, sans-serif" font-size="17.3049" text-anchor="middle" fill="var(--text-muted)">Aggregate</text>
  <text x="968.3948" y="238.7501" font-family="Arial, sans-serif" font-size="18.2305" font-weight="bold" text-anchor="middle" fill="var(--text)">Delta Lake Medallion Architecture</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="height: 300px; display: block; margin: auto;">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect width="888.889" height="500" fill="var(--surface)" rx="6.4583"/>
  <g transform="translate(50, 50)">
    <circle cx="306.6666" cy="246.6667" r="88.8888" fill="var(--warn-fill)" opacity="0.8" />
    <text x="306.6666" y="238.3334" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="var(--bg)">BRONZE</text>
    <text x="306.6666" y="271.6667" font-family="Arial, sans-serif" font-size="13.3333" text-anchor="middle" fill="var(--bg)">Raw Data</text>
    <text x="306.6666" y="430" font-family="Arial, sans-serif" font-size="12.2222" text-anchor="middle" fill="var(--text-muted)">• Ingestion</text>
    <text x="306.6666" y="455" font-family="Arial, sans-serif" font-size="12.2222" text-anchor="middle" fill="var(--text-muted)">• Historical</text>
    <text x="306.6666" y="480" font-family="Arial, sans-serif" font-size="12.2222" text-anchor="middle" fill="var(--text-muted)">• Unvalidated</text>
  </g>
  <g transform="translate(300, 50)">
    <circle cx="306.6666" cy="246.6667" r="88.8888" fill="var(--border)" opacity="0.8" />
    <text x="306.6666" y="238.3334" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="var(--bg)">SILVER</text>
    <text x="306.6666" y="271.6667" font-family="Arial, sans-serif" font-size="13.3333" text-anchor="middle" fill="var(--bg)">Refined Data</text>
    <text x="306.6666" y="430" font-family="Arial, sans-serif" font-size="12.2222" text-anchor="middle" fill="var(--text-muted)">• Cleaned</text>
    <text x="306.6666" y="455" font-family="Arial, sans-serif" font-size="12.2222" text-anchor="middle" fill="var(--text-muted)">• Deduplicated</text>
    <text x="306.6666" y="480" font-family="Arial, sans-serif" font-size="12.2222" text-anchor="middle" fill="var(--text-muted)">• Validated</text>
  </g>
  <g transform="translate(550, 50)">
    <circle cx="306.6666" cy="246.6667" r="88.8888" fill="var(--warn-fill)" opacity="0.8" />
    <text x="306.6666" y="238.3334" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="var(--bg)">GOLD</text>
    <text x="306.6666" y="271.6667" font-family="Arial, sans-serif" font-size="13.3333" text-anchor="middle" fill="var(--bg)">Business Data</text>
    <text x="306.6666" y="430" font-family="Arial, sans-serif" font-size="12.2222" text-anchor="middle" fill="var(--text-muted)">• Aggregated</text>
    <text x="306.6666" y="455" font-family="Arial, sans-serif" font-size="12.2222" text-anchor="middle" fill="var(--text-muted)">• Features</text>
    <text x="306.6666" y="480" font-family="Arial, sans-serif" font-size="12.2222" text-anchor="middle" fill="var(--text-muted)">• Analytics</text>
  </g>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowBSG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 16 12 L 0 24 z" fill="#333" />
    </marker>
  </defs>
  <path d="M 451.1111 330.0001 L 606.6667 330.0001" stroke="var(--text)" stroke-width="3.0968" marker-end="url(#arrowBSG)" />
  <path d="M 728.8889 330.0001 L 884.4444 330.0001" stroke="var(--text)" stroke-width="3.0968" marker-end="url(#arrowBSG)" />
  <text x="528.8888" y="321.6667" font-family="Arial, sans-serif" font-size="12.2222" text-anchor="middle" fill="var(--text-muted)">Clean &amp; Validate</text>
  <text x="806.6666" y="321.6667" font-family="Arial, sans-serif" font-size="12.2222" text-anchor="middle" fill="var(--text-muted)">Aggregate</text>
  <text x="639.9999" y="130" font-family="Arial, sans-serif" font-size="17.7777" font-weight="bold" text-anchor="middle" fill="var(--text)">Delta Lake Medallion Architecture</text>
</svg>
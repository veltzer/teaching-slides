<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="515.5556" fill="url(#bg)" rx="6" x="40" y="104.4444"/>
  <polygon points="565,181.7778 505,336.4444 580,336.4444 520,491.1111 670,297.7778 595,297.7778 640,181.7778" fill="var(--danger-fill)" opacity="0.9" />
  <g transform="translate(550,100)">
    <path d="M 40 52.8889 Q 40 40 55 40 L 85 40 Q 100 40 100 52.8889 L 100 91.5556 Q 100 104.4444 85 104.4444 L 55 104.4444 Q 40 104.4444 40 117.3333 L 40 156 Q 40 168.8889 55 168.8889 L 85 168.8889 Q 100 168.8889 100 156 L 100 117.3333 Q 100 104.4444 85 104.4444" fill="none" stroke="var(--info-border)" stroke-width="5.6889" />
    <circle cx="58" cy="59.3333" r="5.2437" fill="var(--warn-fill)" />
    <circle cx="82" cy="149.5556" r="5.2437" fill="var(--info-fill)" />
  </g>
  <circle cx="265" cy="297.7778" r="39.3277" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
  <text x="265" y="304.2222" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="13.1092">Delta</text>
  <circle cx="190" cy="426.6667" r="39.3277" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
  <text x="190" y="433.1111" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="13.1092">K8s</text>
  <circle cx="370" cy="452.4444" r="39.3277" fill="none" stroke="var(--info-border)" stroke-width="2.8444" />
  <text x="370" y="458.8889" text-anchor="middle" fill="var(--info-accent)" font-family="Arial,sans-serif" font-size="13.1092">MLflow</text>
  <line x1="295" y1="323.5556" x2="505" y2="336.4444" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889" />
  <line x1="220" y1="446" x2="505" y2="362.2222" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889" />
  <line x1="400" y1="439.5556" x2="520" y2="375.1111" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889" />
  <text x="640" y="555.5556" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="34.084" font-weight="bold">Advanced Spark Ecosystem</text>
  <text x="640" y="594.2222" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial,sans-serif" font-size="23.5966">Best Practices with Python</text>
</svg>
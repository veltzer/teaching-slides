<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <polygon points="497.7778,96 440.8889,288 512,288 455.1111,480 597.3333,240 526.2222,240 568.8889,96" fill="var(--danger-fill)" opacity="0.9" />
  <g transform="translate(550,100)">
    <path d="M 0 -64 Q 0 -80 14.2222 -80 L 42.6667 -80 Q 56.8889 -80 56.8889 -64 L 56.8889 -16 Q 56.8889 0 42.6667 0 L 14.2222 0 Q 0 0 0 16 L 0 64 Q 0 80 14.2222 80 L 42.6667 80 Q 56.8889 80 56.8889 64 L 56.8889 16 Q 56.8889 0 42.6667 0" fill="none" stroke="var(--info-border)" stroke-width="5.6889" />
    <circle cx="17.0667" cy="-56" r="5.6889" fill="var(--warn-fill)" />
    <circle cx="39.8222" cy="56" r="5.6889" fill="var(--info-fill)" />
  </g>
  <circle cx="213.3333" cy="240" r="42.6667" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
  <text x="213.3333" y="248" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="14.2222">Delta</text>
  <circle cx="142.2222" cy="400" r="42.6667" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
  <text x="142.2222" y="408" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="14.2222">K8s</text>
  <circle cx="312.8889" cy="432" r="42.6667" fill="none" stroke="var(--info-border)" stroke-width="2.8444" />
  <text x="312.8889" y="440" text-anchor="middle" fill="var(--info-accent)" font-family="Arial,sans-serif" font-size="14.2222">MLflow</text>
  <line x1="241.7778" y1="272" x2="440.8889" y2="288" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889" />
  <line x1="170.6667" y1="424" x2="440.8889" y2="320" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889" />
  <line x1="341.3333" y1="416" x2="455.1111" y2="336" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889" />
  <text x="568.8889" y="560" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="36.9778" font-weight="bold">Advanced Spark Ecosystem</text>
  <text x="568.8889" y="608" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial,sans-serif" font-size="25.6">Best Practices with Python</text>
</svg>
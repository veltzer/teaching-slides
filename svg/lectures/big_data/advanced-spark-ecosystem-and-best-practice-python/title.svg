<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <polygon points="565,127.0001 505,301 580,301 520,475 670,257.5001 595,257.5001 640,127.0001" fill="var(--danger-fill)" opacity="0.9"/>
  <g transform="translate(550,100)">
    <path d="M 40 -17.9999 Q 40 -32.4999 55 -32.4999 L 85 -32.4999 Q 100 -32.4999 100 -17.9999 L 100 25.5001 Q 100 40 85 40 L 55 40 Q 40 40 40 54.5 L 40 98 Q 40 112.5001 55 112.5001 L 85 112.5001 Q 100 112.5001 100 98 L 100 54.5 Q 100 40 85 40" fill="none" stroke="var(--info-border)" stroke-width="5.6889"/>
    <circle cx="58" cy="-10.75" r="5.5618" fill="var(--warn-fill)"/>
    <circle cx="82" cy="90.7501" r="5.5618" fill="var(--info-fill)"/>
  </g>
  <circle cx="265" cy="257.5001" r="41.7133" fill="none" stroke="var(--primary-border)" stroke-width="2.8444"/>
  <text x="265" y="264.75" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Arial, sans-serif">Delta</text>
  <circle cx="190" cy="402.5001" r="41.7133" fill="none" stroke="var(--primary-border)" stroke-width="2.8444"/>
  <text x="190" y="409.75" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Arial, sans-serif">K8s</text>
  <circle cx="370" cy="431.5" r="41.7133" fill="none" stroke="var(--info-border)" stroke-width="2.8444"/>
  <text x="370" y="438.75" text-anchor="middle" fill="var(--info-accent)" font-size="13.9044" font-family="Arial, sans-serif">MLflow</text>
  <line x1="295" y1="286.5001" x2="505" y2="301" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889"/>
  <line x1="220" y1="424.25" x2="505" y2="330" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889"/>
  <line x1="400" y1="417.0001" x2="520" y2="344.5" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889"/>
  <text x="640" y="547.5001" text-anchor="middle" fill="var(--surface)" font-size="36.1515" font-weight="bold" font-family="Arial, sans-serif">Advanced Spark Ecosystem</text>
  <text x="640" y="591" text-anchor="middle" fill="var(--warn-accent)" font-size="25.028" font-family="Arial, sans-serif">Best Practices with Python</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="160" y="257.5" width="195" height="72.5" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.8444"/>
  <text x="257.5" y="301" text-anchor="middle" font-size="15.2948" fill="var(--danger-accent)" font-family="Courier New, monospace">SQL Query</text>
  <line x1="370" y1="293.75" x2="430" y2="293.75" stroke="var(--text-faint)" stroke-width="2"/>
  <polygon points="430,286.5 447.9999,293.75 430,301" fill="var(--text-faint)"/>
  <rect x="460" y="257.5" width="195" height="72.5" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="2.8444"/>
  <text x="557.5" y="289.4" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Courier New, monospace">Catalyst</text>
  <text x="557.5" y="309.7" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Courier New, monospace">Optimizer</text>
  <line x1="670" y1="293.75" x2="730" y2="293.75" stroke="var(--text-faint)" stroke-width="2"/>
  <polygon points="730,286.5 748,293.75 730,301" fill="var(--text-faint)"/>
  <rect x="760" y="257.5" width="195" height="72.5" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444"/>
  <text x="857.5" y="289.4" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">Optimized</text>
  <text x="857.5" y="309.7" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">Plan</text>
  <line x1="970" y1="293.75" x2="1030" y2="293.75" stroke="var(--text-faint)" stroke-width="2"/>
  <polygon points="1030,286.5 1047.9999,293.75 1030,301" fill="var(--text-faint)"/>
  <rect x="1060" y="257.5" width="120" height="72.5" rx="6" fill="url(#grad-ok)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="301" text-anchor="middle" font-size="15.2948" fill="var(--ok-accent)" font-family="Courier New, monospace">RDDs</text>
  <path d="M 565 460.5 A 130 117.3333 40 40 41.0547 620 529.375" fill="none" stroke="var(--text-faint)" stroke-width="4.2667"/>
  <path d="M 580 460.5 A 115 104.4444 40 40 41.0547 607.1111 529.375" fill="none" stroke="var(--ok-border)" stroke-width="8.5333" stroke-linecap="round" stroke-dasharray="113.7778 284.4444"/>
  <line x1="640" y1="460.5" x2="685" y2="417" stroke="var(--danger-border)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="640" cy="460.5" r="6.9522" fill="var(--danger-fill)"/>
  <text x="640" y="504" text-anchor="middle" font-size="16.6854" fill="var(--ok-accent)" font-family="Arial, sans-serif">FAST</text>
  <text x="250" y="431.5" font-size="18.0758" fill="var(--warn-accent)" font-family="Courier New, monospace">Python</text>
  <text x="250" y="460.5" font-size="15.2948" fill="var(--text-faint)" font-family="Courier New, monospace">PySpark</text>
  <text x="640" y="112.5" text-anchor="middle" font-size="33.3706" font-weight="bold" fill="var(--surface)" font-family="Arial, sans-serif">Spark SQL Optimization</text>
  <text x="640" y="156" text-anchor="middle" font-size="22.2471" fill="var(--warn-accent)" font-family="Arial, sans-serif">with Python</text>
  <text x="640" y="583.75" text-anchor="middle" font-size="18.0758" fill="var(--text-muted)" font-family="Courier New, monospace">catalyst | query plans | partitioning | caching</text>
</svg>

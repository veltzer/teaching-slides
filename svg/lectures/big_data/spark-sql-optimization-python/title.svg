<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Query plan stages -->
  <rect x="80" y="150" width="130" height="50" rx="8" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="145" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="#e94560">SQL Query</text>
  <line x1="220" y1="175" x2="260" y2="175" stroke="#888" stroke-width="2"/>
  <polygon points="260,170 272,175 260,180" fill="#888"/>
  <rect x="280" y="150" width="130" height="50" rx="8" fill="#0f3460" stroke="#f5a623" stroke-width="2"/>
  <text x="345" y="172" text-anchor="middle" font-family="monospace" font-size="10" fill="#f5a623">Catalyst</text>
  <text x="345" y="186" text-anchor="middle" font-family="monospace" font-size="10" fill="#f5a623">Optimizer</text>
  <line x1="420" y1="175" x2="460" y2="175" stroke="#888" stroke-width="2"/>
  <polygon points="460,170 472,175 460,180" fill="#888"/>
  <rect x="480" y="150" width="130" height="50" rx="8" fill="#0f3460" stroke="#16c79a" stroke-width="2"/>
  <text x="545" y="172" text-anchor="middle" font-family="monospace" font-size="10" fill="#16c79a">Optimized</text>
  <text x="545" y="186" text-anchor="middle" font-family="monospace" font-size="10" fill="#16c79a">Plan</text>
  <line x1="620" y1="175" x2="660" y2="175" stroke="#888" stroke-width="2"/>
  <polygon points="660,170 672,175 660,180" fill="#888"/>
  <rect x="680" y="150" width="80" height="50" rx="8" fill="#16c79a" opacity="0.2" stroke="#16c79a" stroke-width="2"/>
  <text x="720" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="#16c79a">RDDs</text>
  <!-- Speed gauge -->
  <path d="M350 290 A60 60 0 0 1 450 290" fill="none" stroke="#888" stroke-width="3"/>
  <path d="M360 290 A50 50 0 0 1 440 290" fill="none" stroke="#16c79a" stroke-width="6" stroke-linecap="round" stroke-dasharray="80,200"/>
  <line x1="400" y1="290" x2="430" y2="260" stroke="#e94560" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="400" cy="290" r="5" fill="#e94560"/>
  <text x="400" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#16c79a">FAST</text>
  <!-- Python hint -->
  <text x="140" y="270" font-family="monospace" font-size="13" fill="#f5a623">Python</text>
  <text x="140" y="290" font-family="monospace" font-size="11" fill="#888">PySpark</text>
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#eee">Spark SQL Optimization</text>
  <text x="400" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f5a623">with Python</text>
  <text x="400" y="375" text-anchor="middle" font-family="monospace" font-size="13" fill="#666">catalyst | query plans | partitioning | caching</text>
</svg>

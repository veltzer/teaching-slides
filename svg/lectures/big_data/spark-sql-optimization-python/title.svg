<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--code-bg)" rx="6"/>
  <rect x="113.7778" y="240" width="184.8889" height="80" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.8444" />
  <text x="206.2222" y="288" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--danger-accent)">SQL Query</text>
  <line x1="312.8889" y1="280" x2="369.7778" y2="280" stroke="var(--text-faint)" stroke-width="2" />
  <polygon points="369.7778,272 386.8444,280 369.7778,288" fill="var(--text-faint)" />
  <rect x="398.2222" y="240" width="184.8889" height="80" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="2.8444" />
  <text x="490.6667" y="275.2" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)">Catalyst</text>
  <text x="490.6667" y="297.6" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)">Optimizer</text>
  <line x1="597.3333" y1="280" x2="654.2222" y2="280" stroke="var(--text-faint)" stroke-width="2" />
  <polygon points="654.2222,272 671.2889,280 654.2222,288" fill="var(--text-faint)" />
  <rect x="682.6667" y="240" width="184.8889" height="80" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="775.1111" y="275.2" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)">Optimized</text>
  <text x="775.1111" y="297.6" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)">Plan</text>
  <line x1="881.7778" y1="280" x2="938.6667" y2="280" stroke="var(--text-faint)" stroke-width="2" />
  <polygon points="938.6667,272 955.7333,280 938.6667,288" fill="var(--text-faint)" />
  <rect x="967.1111" y="240" width="113.7778" height="80" rx="6" fill="var(--ok-fill)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1024" y="288" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--ok-accent)">RDDs</text>
  <path d="M 497.7778 464 A 85.3333 85.3333 0 0 1 640 464" fill="none" stroke="var(--text-faint)" stroke-width="4.2667" />
  <path d="M 512 464 A 71.1111 71.1111 0 0 1 625.7778 464" fill="none" stroke="var(--ok-border)" stroke-width="8.5333" stroke-linecap="round" stroke-dasharray="113.7778 284.4444" />
  <line x1="568.8889" y1="464" x2="611.5556" y2="416" stroke="var(--danger-border)" stroke-width="2" stroke-linecap="round" />
  <circle cx="568.8889" cy="464" r="7.1111" fill="var(--danger-fill)" />
  <text x="568.8889" y="512" text-anchor="middle" font-family="sans-serif" font-size="17.0667" fill="var(--ok-accent)">FAST</text>
  <text x="199.1111" y="432" font-family="monospace" font-size="18.4889" fill="var(--warn-accent)">Python</text>
  <text x="199.1111" y="464" font-family="monospace" font-size="15.6444" fill="var(--text-faint)">PySpark</text>
  <text x="568.8889" y="80" text-anchor="middle" font-family="sans-serif" font-size="34.1333" font-weight="bold" fill="var(--surface)">Spark SQL Optimization</text>
  <text x="568.8889" y="128" text-anchor="middle" font-family="sans-serif" font-size="22.7556" fill="var(--warn-accent)">with Python</text>
  <text x="568.8889" y="600" text-anchor="middle" font-family="monospace" font-size="18.4889" fill="var(--text-muted)">catalyst | query plans | partitioning | caching</text>
</svg>
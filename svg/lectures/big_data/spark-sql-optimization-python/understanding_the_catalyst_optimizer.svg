<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead" markerWidth="16" markerHeight="50.4" refX="14.4" refY="25.2" orient="auto">
      <polygon points="0,72 5.6,0" fill="#333" />
    </marker>
  </defs>
  <rect x="16" y="216" width="192" height="288" rx="8" fill="#e1f5fe" stroke="#0d47a1" stroke-width="3.2" />
  <text x="112" y="396" font-family="Arial, sans-serif" font-size="22.4" text-anchor="middle" fill="#0d47a1">SQL/DataFrame</text>
  <line x1="208" y1="360" x2="272" y2="360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="288" y="216" width="192" height="288" rx="8" fill="#e1f5fe" stroke="#0d47a1" stroke-width="3.2" />
  <text x="384" y="396" font-family="Arial, sans-serif" font-size="22.4" text-anchor="middle" fill="#0d47a1">Unresolved Plan</text>
  <line x1="480" y1="360" x2="544" y2="360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="560" y="216" width="176" height="288" rx="8" fill="#e1f5fe" stroke="#0d47a1" stroke-width="3.2" />
  <text x="648" y="396" font-family="Arial, sans-serif" font-size="22.4" text-anchor="middle" fill="#0d47a1">Analyzed Plan</text>
  <line x1="736" y1="360" x2="800" y2="360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="816" y="216" width="176" height="288" rx="8" fill="#e1f5fe" stroke="#0d47a1" stroke-width="3.2" />
  <text x="904" y="396" font-family="Arial, sans-serif" font-size="22.4" text-anchor="middle" fill="#0d47a1">Optimized Plan</text>
  <line x1="992" y1="360" x2="1056" y2="360" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="1072" y="216" width="160" height="288" rx="8" fill="#e1f5fe" stroke="#0d47a1" stroke-width="3.2" />
  <text x="1152" y="396" font-family="Arial, sans-serif" font-size="22.4" text-anchor="middle" fill="#0d47a1">Physical Plan</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="230" height="113.928571" rx="6.106203" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="155" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" font-weight="bold" fill="var(--text)">SQL / DataFrame</text>
  <text x="155" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--text-muted)">user query</text>

  <rect x="290" y="40" width="230" height="113.928571" rx="6.106203" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="405" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" font-weight="bold" fill="var(--primary-text)">Analyzer</text>
  <text x="405" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--primary-text)">resolve columns</text>

  <rect x="540" y="40" width="230" height="113.928571" rx="6.106203" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" font-weight="bold" fill="var(--ok-text)">Logical opt</text>
  <text x="655" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--ok-text)">rule rewrites</text>

  <rect x="790" y="40" width="230" height="113.928571" rx="6.106203" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="905" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" font-weight="bold" fill="var(--warn-text)">Physical plans</text>
  <text x="905" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--warn-text)">cost-based pick</text>

  <rect x="1040" y="40" width="200" height="113.928571" rx="6.106203" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" font-weight="bold" fill="var(--info-text)">Codegen</text>
  <text x="1140" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--info-text)">RDDs / JVM</text>

  <line x1="270" y1="96.964286" x2="290" y2="96.964286" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="520" y1="96.964286" x2="540" y2="96.964286" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="770" y1="96.964286" x2="790" y2="96.964286" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1020" y1="96.964286" x2="1040" y2="96.964286" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="40" y="195.357143" width="590" height="201.964286" rx="6.106203" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="236.785714" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389411" font-weight="bold" fill="var(--ok-text)">Logical rules</text>
  <text x="335" y="278.214286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283208" fill="var(--ok-text)">Predicate pushdown</text>
  <text x="335" y="309.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283208" fill="var(--ok-text)">Column pruning</text>
  <text x="335" y="340.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283208" fill="var(--ok-text)">Constant folding</text>
  <text x="335" y="376.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-style="italic" fill="var(--ok-text)">pattern matching</text>

  <rect x="650" y="195.357143" width="590" height="201.964286" rx="6.106203" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="236.785714" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389411" font-weight="bold" fill="var(--warn-text)">Physical choices</text>
  <text x="945" y="278.214286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283208" fill="var(--warn-text)">Broadcast vs shuffle join</text>
  <text x="945" y="309.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283208" fill="var(--warn-text)">Sort-merge vs hash</text>
  <text x="945" y="340.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283208" fill="var(--warn-text)">Partition and bucket use</text>
  <text x="945" y="376.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-style="italic" fill="var(--warn-text)">stats-driven</text>

  <rect x="40" y="423.214286" width="1200" height="196.785714" rx="6.106203" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424812" font-weight="bold" fill="var(--info-text)">AQE at runtime</text>
  <text x="640" y="521.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--info-text)">Re-plans using actual stage stats</text>
  <text x="640" y="563.035714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--info-text)">Coalesces partitions, handles skew</text>
  <text x="640" y="604.464286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507" font-style="italic" fill="var(--info-text)">enabled in Spark 3+</text>
</svg>

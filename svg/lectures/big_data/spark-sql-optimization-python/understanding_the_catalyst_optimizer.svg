<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --border: #e0e0e0;
        --text: #212121; --text-muted: #555555; --text-faint: #888888;
        --code-bg: #1a1a2e; --shadow: #00000022; --black: #000000;
        --primary-fill: #2196f3; --primary-border: #1565c0; --primary-text: #ffffff; --primary-accent: #0d47a1;
        --ok-fill: #4caf50; --ok-border: #2e7d32; --ok-text: #ffffff; --ok-accent: #1b5e20;
        --warn-fill: #ff9800; --warn-border: #e65100; --warn-text: #ffffff; --warn-accent: #bf360c;
        --danger-fill: #e74c3c; --danger-border: #c62828; --danger-text: #ffffff; --danger-accent: #b71c1c;
        --info-fill: #9c27b0; --info-border: #6a1b9a; --info-text: #ffffff; --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="230" height="113.928571" rx="6.106203" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="155" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" font-weight="bold" fill="var(--text)">SQL / DataFrame</text>
  <text x="155" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--text-muted)">user query</text>

  <rect x="290" y="40" width="230" height="113.928571" rx="6.106203" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="405" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" font-weight="bold" fill="var(--primary-text)">Analyzer</text>
  <text x="405" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--primary-text)">resolve columns</text>

  <rect x="540" y="40" width="230" height="113.928571" rx="6.106203" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="655" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" font-weight="bold" fill="var(--ok-text)">Logical opt</text>
  <text x="655" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--ok-text)">rule rewrites</text>

  <rect x="790" y="40" width="230" height="113.928571" rx="6.106203" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="905" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" font-weight="bold" fill="var(--warn-text)">Physical plans</text>
  <text x="905" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--warn-text)">cost-based pick</text>

  <rect x="1040" y="40" width="200" height="113.928571" rx="6.106203" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1140" y="86.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" font-weight="bold" fill="var(--info-text)">Codegen</text>
  <text x="1140" y="122.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--info-text)">RDDs / JVM</text>

  <line x1="270" y1="96.964286" x2="290" y2="96.964286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="96.964286" x2="540" y2="96.964286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="96.964286" x2="790" y2="96.964286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1020" y1="96.964286" x2="1040" y2="96.964286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="195.357143" width="590" height="201.964286" rx="6.106203" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="335" y="236.785714" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389411" font-weight="bold" fill="var(--ok-text)">Logical rules</text>
  <text x="335" y="278.214286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283208" fill="var(--ok-text)">Predicate pushdown</text>
  <text x="335" y="309.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283208" fill="var(--ok-text)">Column pruning</text>
  <text x="335" y="340.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283208" fill="var(--ok-text)">Constant folding</text>
  <text x="335" y="376.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-style="italic" fill="var(--ok-text)">pattern matching</text>

  <rect x="650" y="195.357143" width="590" height="201.964286" rx="6.106203" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="945" y="236.785714" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389411" font-weight="bold" fill="var(--warn-text)">Physical choices</text>
  <text x="945" y="278.214286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283208" fill="var(--warn-text)">Broadcast vs shuffle join</text>
  <text x="945" y="309.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283208" fill="var(--warn-text)">Sort-merge vs hash</text>
  <text x="945" y="340.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.283208" fill="var(--warn-text)">Partition and bucket use</text>
  <text x="945" y="376.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-style="italic" fill="var(--warn-text)">stats-driven</text>

  <rect x="40" y="423.214286" width="1200" height="196.785714" rx="6.106203" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424812" font-weight="bold" fill="var(--info-text)">AQE at runtime</text>
  <text x="640" y="521.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--info-text)">Re-plans using actual stage stats</text>
  <text x="640" y="563.035714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--info-text)">Coalesces partitions, handles skew</text>
  <text x="640" y="604.464286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507" font-style="italic" fill="var(--info-text)">enabled in Spark 3+</text>
</svg>

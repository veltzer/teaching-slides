<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_intro.yaml -->

  <rect x="40" y="100" width="1200" height="200" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="var(--primary-text)">Spark Optimization</text>
  <text x="640" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="var(--primary-text)">Understanding Data Skew</text>
  <text x="640" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--primary-text)">Scala edition</text>

  <rect x="240" y="360" width="800" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Data skew</text>
  <text x="640" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">One partition holds most of the rows — one task blocks the stage.</text>

  <rect x="240" y="480" width="800" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Fixes</text>
  <text x="640" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">AQE skew join · salting · broadcast · filter hot keys</text>
</svg>

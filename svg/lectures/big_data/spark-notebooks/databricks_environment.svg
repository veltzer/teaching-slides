<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#212121"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.807319" font-weight="bold" fill="var(--primary-accent)">Databricks Notebook Execution Flow</text>

  <!-- Notebook -->
  <rect x="40" y="103.272727" width="260" height="379.636364" rx="8.215285" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="170" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.753498" font-weight="bold" fill="var(--ok-text)">Notebook</text>
  <text x="170" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Interactive UI</text>
  <text x="170" y="240.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Python / SQL / Scala / R</text>
  <text x="170" y="277.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Cells = code units</text>
  <text x="170" y="314.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Markdown + charts</text>
  <text x="170" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Version controlled</text>
  <text x="170" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Shared with team</text>
  <text x="170" y="435.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--ok-text)" font-style="italic">Submits each cell</text>

  <!-- Arrow -->
  <line x1="300" y1="293.090909" x2="356" y2="293.090909" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Cluster -->
  <rect x="360" y="103.272727" width="260" height="379.636364" rx="8.215285" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="490" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.753498" font-weight="bold" fill="var(--warn-text)">Cluster</text>
  <text x="490" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--warn-text)">Driver + workers</text>
  <text x="490" y="240.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--warn-text)">Auto-scaling</text>
  <text x="490" y="277.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--warn-text)">Managed VMs</text>
  <text x="490" y="314.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--warn-text)">Runtime presets</text>
  <text x="490" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--warn-text)">GPU optional</text>
  <text x="490" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--warn-text)">Idle shutdown</text>
  <text x="490" y="435.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--warn-text)" font-style="italic">Dispatches tasks</text>

  <!-- Arrow -->
  <line x1="620" y1="293.090909" x2="676" y2="293.090909" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Computation -->
  <rect x="680" y="103.272727" width="260" height="379.636364" rx="8.215285" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="810" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.753498" font-weight="bold" fill="var(--danger-text)">Computation</text>
  <text x="810" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--danger-text)">Spark engine</text>
  <text x="810" y="240.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--danger-text)">DAG scheduling</text>
  <text x="810" y="277.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--danger-text)">Lazy evaluation</text>
  <text x="810" y="314.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--danger-text)">Shuffle + caching</text>
  <text x="810" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--danger-text)">Photon / MLflow</text>
  <text x="810" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--danger-text)">Delta Lake I/O</text>
  <text x="810" y="435.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--danger-text)" font-style="italic">Runs in parallel</text>

  <!-- Arrow -->
  <line x1="940" y1="293.090909" x2="996" y2="293.090909" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Results -->
  <rect x="1000" y="103.272727" width="240" height="379.636364" rx="8.215285" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="1120" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.753498" font-weight="bold" fill="var(--primary-text)">Results</text>
  <text x="1120" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--primary-text)">Tables / charts</text>
  <text x="1120" y="240.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--primary-text)">Inline plots</text>
  <text x="1120" y="277.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--primary-text)">Dashboards</text>
  <text x="1120" y="314.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--primary-text)">Job schedules</text>
  <text x="1120" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--primary-text)">Delta output</text>
  <text x="1120" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--primary-text)">Notebook cache</text>
  <text x="1120" y="435.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--primary-text)" font-style="italic">Returned to user</text>

  <!-- Bottom banner -->
  <rect x="40" y="519.818182" width="1200" height="100.181818" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="556.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--text)">One workspace: write, run, scale, and share</text>
  <text x="640" y="586.254545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--text-muted)">Cells in a notebook are submitted to a managed Spark cluster; results stream back</text>
  <text x="640" y="609.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--text-muted)">Collaboration, secrets, ACLs, and billing handled by the Databricks platform</text>
</svg>

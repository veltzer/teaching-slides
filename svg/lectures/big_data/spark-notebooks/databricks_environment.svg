<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.807319" font-weight="bold" fill="var(--primary-accent)">Databricks Notebook Execution Flow</text>

  <!-- Notebook -->
  <rect x="40" y="103.272727" width="260" height="379.636364" rx="8.215285" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="170" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.753498" font-weight="bold" fill="var(--ok-text)">Notebook</text>
  <text x="170" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Interactive UI</text>
  <text x="170" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Python/SQL/Scala/R</text>
  <text x="170" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Cells = code</text>
  <text x="170" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Markdown + charts</text>
  <text x="170" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--ok-text)">Versioned, shared</text>
  <text x="170" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--ok-text)" font-style="italic">Submits cells</text>

  <!-- Arrow -->
  <line x1="300" y1="293.090909" x2="356" y2="293.090909" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Cluster -->
  <rect x="360" y="103.272727" width="260" height="379.636364" rx="8.215285" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="490" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.753498" font-weight="bold" fill="var(--warn-text)">Cluster</text>
  <text x="490" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--warn-text)">Driver + workers</text>
  <text x="490" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--warn-text)">Auto-scaling VMs</text>
  <text x="490" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--warn-text)">Runtime presets</text>
  <text x="490" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--warn-text)">GPU optional</text>
  <text x="490" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--warn-text)">Idle shutdown</text>
  <text x="490" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--warn-text)" font-style="italic">Dispatches tasks</text>

  <!-- Arrow -->
  <line x1="620" y1="293.090909" x2="676" y2="293.090909" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Computation -->
  <rect x="680" y="103.272727" width="260" height="379.636364" rx="8.215285" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="810" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.753498" font-weight="bold" fill="var(--danger-text)">Computation</text>
  <text x="810" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--danger-text)">Spark engine</text>
  <text x="810" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--danger-text)">DAG scheduling</text>
  <text x="810" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--danger-text)">Lazy eval</text>
  <text x="810" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--danger-text)">Shuffle + cache</text>
  <text x="810" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--danger-text)">Photon/MLflow</text>
  <text x="810" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--danger-text)" font-style="italic">Runs parallel</text>

  <!-- Arrow -->
  <line x1="940" y1="293.090909" x2="996" y2="293.090909" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Results -->
  <rect x="1000" y="103.272727" width="240" height="379.636364" rx="8.215285" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="1120" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.753498" font-weight="bold" fill="var(--primary-text)">Results</text>
  <text x="1120" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--primary-text)">Tables/charts</text>
  <text x="1120" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--primary-text)">Inline plots</text>
  <text x="1120" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--primary-text)">Dashboards</text>
  <text x="1120" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--primary-text)">Schedules</text>
  <text x="1120" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457481" fill="var(--primary-text)">Delta output</text>
  <text x="1120" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" fill="var(--primary-text)" font-style="italic">Returned</text>

  <!-- Bottom banner -->
  <rect x="40" y="519.818182" width="1200" height="100.181818" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="556.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--text)">One workspace: write, run, share</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--text-muted)">Cells run on managed Spark; results stream back</text>
  <text x="640" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" fill="var(--text-muted)">Platform handles secrets, ACLs, billing</text>
</svg>

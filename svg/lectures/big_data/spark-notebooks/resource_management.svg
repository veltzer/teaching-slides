<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.885093" font-weight="bold" fill="var(--text)">Resource Management</text>

  <rect x="40" y="77.247706" width="340" height="542.752294" rx="6.189663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="119.816514" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695431" font-weight="bold" fill="var(--ok-text)">Session</text>
  <text x="210" y="157.06422" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--ok-text)">One per kernel</text>
  <text x="210" y="188.990826" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--ok-text)">Driver, executors</text>
  <text x="210" y="220.917431" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--ok-text)">Shared</text>
  <text x="210" y="263.486239" text-anchor="middle" font-size="14.442547" fill="var(--ok-text)" font-family="Courier New, monospace">SparkSession.builder</text>
  <text x="210" y="290.091743" text-anchor="middle" font-size="14.442547" fill="var(--ok-text)" font-family="Courier New, monospace">.getOrCreate()</text>
  <text x="210" y="332.66055" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--ok-text)">Until kernel</text>

  <text x="210" y="364.587156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--ok-text)">or spark.stop()</text>
  <text x="210" y="407.155963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--ok-text)">Configs at create</text>
  <text x="210" y="439.082569" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--ok-text)">Mostly immutable</text>
  <text x="210" y="481.651376" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--ok-text)">Restart to change</text>
  <text x="210" y="513.577982" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--ok-text)">resources</text>
  <text x="210" y="556.146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--ok-text)">Idle = held slots</text>
  <text x="210" y="588.073394" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--ok-text)">Stop when done</text>

  <line x1="380" y1="178.348624" x2="420" y2="178.348624" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="380" y1="348.623853" x2="420" y2="348.623853" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="380" y1="518.899083" x2="420" y2="518.899083" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="430" y="77.247706" width="400" height="170.275229" rx="6.189663" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="114.495413" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.63221" font-weight="bold" fill="var(--warn-text)">Memory</text>
  <text x="630" y="151.743119" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--warn-text)">Driver heap: results</text>
  <text x="630" y="178.348624" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--warn-text)">Executor heap: shuffle</text>
  <text x="630" y="210.275229" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--warn-text)">Watch collect, toPandas</text>
  <text x="630" y="236.880734" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--warn-text)">Unpersist caches</text>

  <rect x="430" y="258.165138" width="400" height="170.275229" rx="6.189663" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="295.412844" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.63221" font-weight="bold" fill="var(--danger-text)">CPU</text>
  <text x="630" y="332.66055" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--danger-text)">Parallel tasks</text>
  <text x="630" y="359.266055" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--danger-text)">Cores tune throughput</text>
  <text x="630" y="391.192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--danger-text)">Partitions = cores</text>
  <text x="630" y="417.798165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--danger-text)">Share fairly</text>

  <rect x="430" y="439.082569" width="400" height="180.917431" rx="6.189663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="476.330275" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.63221" font-weight="bold" fill="var(--primary-text)">Storage</text>
  <text x="630" y="513.577982" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--primary-text)">Cache hot DataFrames</text>
  <text x="630" y="540.183486" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--primary-text)">Disk spill on OOM</text>
  <text x="630" y="572.110092" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--primary-text)">Checkpoint lineages</text>
  <text x="630" y="598.715596" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--primary-text)">Clear caches</text>

  <rect x="850" y="77.247706" width="390" height="542.752294" rx="6.189663" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="119.816514" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695431" font-weight="bold" fill="var(--info-text)">Habits</text>
  <text x="1045" y="162.385321" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">Use SparkUI</text>
  <text x="1045" y="188.990826" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">Port 4040</text>
  <text x="1045" y="231.559633" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">Sample + limit first</text>
  <text x="1045" y="258.165138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">Scale after logic</text>
  <text x="1045" y="300.733945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">Tune partitions</text>
  <text x="1045" y="327.33945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">200 is poor</text>
  <text x="1045" y="369.908257" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">Stop idle kernels</text>
  <text x="1045" y="396.513761" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">Leaks waste</text>
  <text x="1045" y="439.082569" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">Dynamic alloc</text>
  <text x="1045" y="465.688073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">for bursty loads</text>
  <text x="1045" y="508.256881" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">explain(true)</text>
  <text x="1045" y="534.862385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">Fix skew first</text>
  <text x="1045" y="577.431193" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">Log metrics</text>
  <text x="1045" y="604.036697" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442547" fill="var(--info-text)">easy to forget</text>
</svg>

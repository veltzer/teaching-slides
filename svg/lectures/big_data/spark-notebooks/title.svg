  <circle cx="376.8889" cy="464" r="8.5333" fill="none" stroke="var(--text-faint)" stroke-width="2.1333" />
  <rect x="405.3333" y="168" width="355.5556" height="80" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="1.4222" />
  <text x="419.5556" y="200" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)">In [1]:</text>
  <text x="419.5556" y="227.2" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)">df.groupBy("col").count()</text>

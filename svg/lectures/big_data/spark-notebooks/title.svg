<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="415" y="170.5" width="450" height="319" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444"/>
  <circle cx="437.5" cy="199.5" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <circle cx="437.5" cy="243" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <circle cx="437.5" cy="286.5" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <circle cx="437.5" cy="330" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <circle cx="437.5" cy="373.5" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <circle cx="437.5" cy="417" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <circle cx="437.5" cy="460.5" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <rect x="467.5" y="192.25" width="375" height="72.5" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="1.4222"/>
  <text x="482.5" y="221.25" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">In [1]:</text>
  <text x="482.5" y="245.9" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">df.groupBy("col").count()</text>
  <rect x="467.5" y="279.25" width="375" height="58" rx="6" fill="url(#grad-ok)" opacity="0.1" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482.5" y="303.9" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">Out[1]: DataFrame[col, count]</text>
  <rect x="467.5" y="351.75" width="375" height="116" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="1.4222"/>
  <rect x="497.5" y="388" width="27" height="58" fill="url(#grad-danger)" opacity="0.6" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="535" y="402.5" width="27" height="43.5" fill="url(#grad-ok)" opacity="0.6" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="572.5" y="373.5" width="27" height="72.5" fill="url(#grad-warn)" opacity="0.6" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="609.9999" y="409.75" width="27" height="36.25" fill="url(#grad-info)" opacity="0.6" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="647.5" y="380.75" width="27" height="65.25" fill="url(#grad-primary)" opacity="0.6" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <polygon points="1000,286.5 1030,257.5 1060,286.5 1030,315.5" fill="var(--danger-fill)" opacity="0.5"/>
  <polygon points="1014.9999,301 1045,272 1074.9999,301 1045,330" fill="var(--warn-fill)" opacity="0.4"/>
  <text x="640" y="112.5" text-anchor="middle" font-size="38.9324" font-weight="bold" fill="var(--surface)" font-family="Arial, sans-serif">Spark Notebooks</text>
  <text x="640" y="576.5" text-anchor="middle" font-size="18.0758" fill="var(--text-muted)" font-family="Courier New, monospace">interactive | exploratory | data analysis</text>
</svg>

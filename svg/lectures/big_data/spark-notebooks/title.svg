<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <g transform="translate(-105.0,45.5)">
  <rect x="415" y="170.5" width="450" height="319" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444"/>
  <circle cx="437.5" cy="199.5" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <circle cx="437.5" cy="243" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <circle cx="437.5" cy="286.5" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <circle cx="437.5" cy="330" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <circle cx="437.5" cy="373.5" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <circle cx="437.5" cy="417" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <circle cx="437.5" cy="460.5" r="8.3426" fill="none" stroke="var(--text-faint)" stroke-width="2.1333"/>
  <rect x="467.5" y="192.25" width="375" height="72.5" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="1.4222"/>
  <text x="482.5" y="221.25" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">In [1]:</text>
  <text x="482.5" y="245.9" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">df.groupBy("col").count()</text>
  <rect x="467.5" y="279.25" width="375" height="58" rx="6" fill="url(#grad-ok)" opacity="0.1" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482.5" y="303.9" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">Out[1]: DataFrame[col, count]</text>
  <rect x="467.5" y="351.75" width="375" height="116" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="1.4222"/>
  <rect x="497.5" y="388" width="27" height="58" fill="url(#grad-danger)" opacity="0.6" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="535" y="402.5" width="27" height="43.5" fill="url(#grad-ok)" opacity="0.6" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="572.5" y="373.5" width="27" height="72.5" fill="url(#grad-warn)" opacity="0.6" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="609.9999" y="409.75" width="27" height="36.25" fill="url(#grad-info)" opacity="0.6" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="647.5" y="380.75" width="27" height="65.25" fill="url(#grad-primary)" opacity="0.6" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <polygon points="1000,286.5 1030,257.5 1060,286.5 1030,315.5" fill="var(--danger-fill)" opacity="0.5"/>
  <polygon points="1014.9999,301 1045,272 1074.9999,301 1045,330" fill="var(--warn-fill)" opacity="0.4"/>
  <text x="640" y="576.5" text-anchor="middle" font-size="18.0758" fill="var(--text-muted)" font-family="Courier New, monospace">interactive | exploratory | data analysis</text>
  </g>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Spark Notebooks</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Interactive Data Exploration</text>
</svg>

  <polygon points="924.4444,288 952.8889,256 981.3333,288 952.8889,320" fill="var(--warn-fill)" opacity="0.4" />
  <text x="568.8889" y="80" text-anchor="middle" font-family="sans-serif" font-size="39.8222" font-weight="bold" fill="var(--surface)">Spark Notebooks</text>
  <text x="568.8889" y="592" text-anchor="middle" font-family="monospace" font-size="18.4889" fill="var(--text-muted)">interactive | exploratory | data analysis</text>
</svg>
  <rect x="433.7778" y="384" width="25.6" height="64" fill="var(--danger-fill)" opacity="0.6" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="469.3333" y="400" width="25.6" height="48" fill="var(--ok-fill)" opacity="0.6" rx="6" stroke="var(--ok-border)" stroke-width="2"/>

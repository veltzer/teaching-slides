<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="26.699677" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Spark Notebook Best Practices</text>

  <rect x="40" y="82.181818" width="390" height="253.090909" rx="6.161464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="129.636364" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Clear Documentation</text>
  <text x="235" y="171.818182" text-anchor="middle" font-size="15.40366" fill="var(--primary-text)" font-family="Arial, sans-serif">Markdown per step</text>
  <text x="235" y="203.454545" text-anchor="middle" font-size="15.40366" fill="var(--primary-text)" font-family="Arial, sans-serif">State I/O</text>
  <text x="235" y="235.090909" text-anchor="middle" font-size="15.40366" fill="var(--primary-text)" font-family="Arial, sans-serif">Cluster sizing</text>
  <text x="235" y="266.727273" text-anchor="middle" font-size="15.40366" fill="var(--primary-text)" font-family="Arial, sans-serif">Link source</text>
  <text x="235" y="303.636364" text-anchor="middle" font-size="14.376749" font-style="italic" fill="var(--primary-text)" font-family="Arial, sans-serif">Readers win</text>

  <rect x="445" y="82.181818" width="390" height="253.090909" rx="6.161464" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="129.636364" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Memory Management</text>
  <text x="640" y="171.818182" text-anchor="middle" font-size="15.40366" fill="var(--info-text)" font-family="Arial, sans-serif">cache() hot only</text>
  <text x="640" y="203.454545" text-anchor="middle" font-size="15.40366" fill="var(--info-text)" font-family="Arial, sans-serif">unpersist()</text>
  <text x="640" y="235.090909" text-anchor="middle" font-size="15.40366" fill="var(--info-text)" font-family="Arial, sans-serif">Filter early</text>
  <text x="640" y="266.727273" text-anchor="middle" font-size="15.40366" fill="var(--info-text)" font-family="Arial, sans-serif">Avoid toPandas()</text>
  <text x="640" y="303.636364" text-anchor="middle" font-size="14.376749" font-style="italic" fill="var(--info-text)" font-family="Arial, sans-serif">Watch Spark UI</text>

  <rect x="850" y="82.181818" width="390" height="253.090909" rx="6.161464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="129.636364" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Code Organization</text>
  <text x="1045" y="171.818182" text-anchor="middle" font-size="15.40366" fill="var(--ok-text)" font-family="Arial, sans-serif">Functions in .py</text>
  <text x="1045" y="203.454545" text-anchor="middle" font-size="15.40366" fill="var(--ok-text)" font-family="Arial, sans-serif">One step per cell</text>
  <text x="1045" y="235.090909" text-anchor="middle" font-size="15.40366" fill="var(--ok-text)" font-family="Arial, sans-serif">Checkpoint tables</text>
  <text x="1045" y="266.727273" text-anchor="middle" font-size="15.40366" fill="var(--ok-text)" font-family="Arial, sans-serif">Pin versions</text>
  <text x="1045" y="303.636364" text-anchor="middle" font-size="14.376749" font-style="italic" fill="var(--ok-text)" font-family="Arial, sans-serif">Not a scratchpad</text>

  <rect x="40" y="366.909091" width="600" height="253.090909" rx="6.161464" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="414.363636" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Reproducibility</text>
  <text x="340" y="456.545455" text-anchor="middle" font-size="15.40366" fill="var(--warn-text)" font-family="Arial, sans-serif">Run All before sharing</text>
  <text x="340" y="488.181818" text-anchor="middle" font-size="15.40366" fill="var(--warn-text)" font-family="Arial, sans-serif">Parameterise paths/dates</text>
  <text x="340" y="519.818182" text-anchor="middle" font-size="15.40366" fill="var(--warn-text)" font-family="Arial, sans-serif">Seed random ops</text>
  <text x="340" y="551.454545" text-anchor="middle" font-size="15.40366" fill="var(--warn-text)" font-family="Arial, sans-serif">Version notebook + inputs</text>
  <text x="340" y="588.363636" text-anchor="middle" font-size="14.376749" font-style="italic" fill="var(--warn-text)" font-family="Arial, sans-serif">No re-run = a guess</text>

  <rect x="660" y="366.909091" width="580" height="253.090909" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="414.363636" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Move to Production</text>
  <text x="950" y="456.545455" text-anchor="middle" font-size="15.40366" fill="var(--danger-text)" font-family="Arial, sans-serif">Promote to job script</text>
  <text x="950" y="488.181818" text-anchor="middle" font-size="15.40366" fill="var(--danger-text)" font-family="Arial, sans-serif">Schedule via Airflow</text>
  <text x="950" y="519.818182" text-anchor="middle" font-size="15.40366" fill="var(--danger-text)" font-family="Arial, sans-serif">Test on samples</text>
  <text x="950" y="551.454545" text-anchor="middle" font-size="15.40366" fill="var(--danger-text)" font-family="Arial, sans-serif">Monitor failures, drift</text>
  <text x="950" y="588.363636" text-anchor="middle" font-size="14.376749" font-style="italic" fill="var(--danger-text)" font-family="Arial, sans-serif">Explore vs run</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="26.699677" font-weight="bold" fill="var(--text)">Spark Notebook Best Practices</text>

  <rect x="40" y="82.181818" width="390" height="253.090909" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="235" y="129.636364" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--primary-text)">Clear Documentation</text>
  <text x="235" y="171.818182" text-anchor="middle" font-size="15.40366" fill="var(--primary-text)">Markdown above each step</text>
  <text x="235" y="203.454545" text-anchor="middle" font-size="15.40366" fill="var(--primary-text)">State inputs and outputs</text>
  <text x="235" y="235.090909" text-anchor="middle" font-size="15.40366" fill="var(--primary-text)">Record cluster sizing</text>
  <text x="235" y="266.727273" text-anchor="middle" font-size="15.40366" fill="var(--primary-text)">Link the source dataset</text>
  <text x="235" y="303.636364" text-anchor="middle" font-size="14.376749" font-style="italic" fill="var(--primary-text)">Readers beat re-runs</text>

  <rect x="445" y="82.181818" width="390" height="253.090909" rx="6.161464" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="129.636364" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--info-text)">Memory Management</text>
  <text x="640" y="171.818182" text-anchor="middle" font-size="15.40366" fill="var(--info-text)">cache() only hot DataFrames</text>
  <text x="640" y="203.454545" text-anchor="middle" font-size="15.40366" fill="var(--info-text)">unpersist() when done</text>
  <text x="640" y="235.090909" text-anchor="middle" font-size="15.40366" fill="var(--info-text)">Filter early, project narrow</text>
  <text x="640" y="266.727273" text-anchor="middle" font-size="15.40366" fill="var(--info-text)">Avoid toPandas() on big data</text>
  <text x="640" y="303.636364" text-anchor="middle" font-size="14.376749" font-style="italic" fill="var(--info-text)">Watch the Spark UI</text>

  <rect x="850" y="82.181818" width="390" height="253.090909" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1045" y="129.636364" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--ok-text)">Code Organization</text>
  <text x="1045" y="171.818182" text-anchor="middle" font-size="15.40366" fill="var(--ok-text)">Functions in imported .py</text>
  <text x="1045" y="203.454545" text-anchor="middle" font-size="15.40366" fill="var(--ok-text)">One logical step per cell</text>
  <text x="1045" y="235.090909" text-anchor="middle" font-size="15.40366" fill="var(--ok-text)">Checkpoint intermediate tables</text>
  <text x="1045" y="266.727273" text-anchor="middle" font-size="15.40366" fill="var(--ok-text)">Pin library versions</text>
  <text x="1045" y="303.636364" text-anchor="middle" font-size="14.376749" font-style="italic" fill="var(--ok-text)">Notebook ≠ scratchpad</text>

  <rect x="40" y="366.909091" width="600" height="253.090909" rx="6.161464" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="340" y="414.363636" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--warn-text)">Reproducibility</text>
  <text x="340" y="456.545455" text-anchor="middle" font-size="15.40366" fill="var(--warn-text)">Run All before sharing — no hidden state</text>
  <text x="340" y="488.181818" text-anchor="middle" font-size="15.40366" fill="var(--warn-text)">Parameterise paths and dates at the top</text>
  <text x="340" y="519.818182" text-anchor="middle" font-size="15.40366" fill="var(--warn-text)">Seed every random operation</text>
  <text x="340" y="551.454545" text-anchor="middle" font-size="15.40366" fill="var(--warn-text)">Version the notebook and its inputs together</text>
  <text x="340" y="588.363636" text-anchor="middle" font-size="14.376749" font-style="italic" fill="var(--warn-text)">A result you cannot re-run is a guess</text>

  <rect x="660" y="366.909091" width="580" height="253.090909" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="950" y="414.363636" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--danger-text)">Move to Production</text>
  <text x="950" y="456.545455" text-anchor="middle" font-size="15.40366" fill="var(--danger-text)">Promote stable cells into a job script</text>
  <text x="950" y="488.181818" text-anchor="middle" font-size="15.40366" fill="var(--danger-text)">Schedule via Airflow or workflow tool</text>
  <text x="950" y="519.818182" text-anchor="middle" font-size="15.40366" fill="var(--danger-text)">Write tests on sample input</text>
  <text x="950" y="551.454545" text-anchor="middle" font-size="15.40366" fill="var(--danger-text)">Monitor runtime, failures, drift</text>
  <text x="950" y="588.363636" text-anchor="middle" font-size="14.376749" font-style="italic" fill="var(--danger-text)">Notebooks explore, jobs run</text>
</svg>

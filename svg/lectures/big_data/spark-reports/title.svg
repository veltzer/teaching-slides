<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="490" y="170.5" width="299.9999" height="362.5" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <rect x="520" y="199.5" width="240" height="29" rx="6" fill="url(#grad-ok)" opacity="0.3" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="535" y1="272" x2="535" y2="373.5" stroke="var(--text-faint)" stroke-width="1.4222" />
  <line x1="535" y1="373.5" x2="730" y2="373.5" stroke="var(--text-faint)" stroke-width="1.4222" />
  <polyline points="550,359 595,322.75 640,344.5 685,293.75 715,308.25" fill="none" stroke="var(--danger-border)" stroke-width="2.8444" />
  <circle cx="550" cy="359" r="4.1714" fill="var(--danger-fill)" />
  <circle cx="595" cy="322.75" r="4.1714" fill="var(--danger-fill)" />
  <circle cx="640" cy="344.5" r="4.1714" fill="var(--danger-fill)" />
  <circle cx="685" cy="293.75" r="4.1714" fill="var(--danger-fill)" />
  <circle cx="715" cy="308.25" r="4.1714" fill="var(--danger-fill)" />
  <rect x="520" y="402.5" width="240" height="14.5" rx="6" fill="var(--text-faint)" opacity="0.2" />
  <rect x="520" y="424.25" width="240" height="14.5" rx="6" fill="var(--text-faint)" opacity="0.15" />
  <rect x="520" y="446" width="240" height="14.5" rx="6" fill="var(--text-faint)" opacity="0.1" />
  <rect x="520" y="467.75" width="240" height="14.5" rx="6" fill="var(--text-faint)" opacity="0.08" />
  <polygon points="250,330 295,286.5 339.9999,330 295,373.5" fill="none" stroke="var(--warn-border)" stroke-width="2.8444" />
  <polygon points="265,330 295,301 325,330 295,359" fill="var(--warn-fill)" opacity="0.3" />
  <line x1="355" y1="330" x2="474.9999" y2="330" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.5333 4.2667" />
  <polygon points="474.9999,322.75 493,330 474.9999,337.25" fill="var(--warn-fill)" />
  <line x1="804.9999" y1="301" x2="910" y2="257.5" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="804.9999" y1="330" x2="910" y2="330" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="804.9999" y1="359" x2="910" y2="402.5" stroke="var(--ok-border)" stroke-width="2" />
  <text x="970" y="264.75" text-anchor="middle" font-size="15.2948" fill="var(--text-faint)" font-family="Courier New, monospace">PDF</text>
  <text x="970" y="337.25" text-anchor="middle" font-size="15.2948" fill="var(--text-faint)" font-family="Courier New, monospace">HTML</text>
  <text x="970" y="409.75" text-anchor="middle" font-size="15.2948" fill="var(--text-faint)" font-family="Courier New, monospace">Dashboard</text>
  <text x="640" y="105.25" text-anchor="middle" font-size="38.9324" font-weight="bold" fill="var(--surface)" font-family="Arial, sans-serif">Spark Reports</text>
  <text x="640" y="583.75" text-anchor="middle" font-size="18.0758" fill="var(--text-muted)" font-family="Courier New, monospace">processing | analysis | visualization | monitoring</text>
</svg>
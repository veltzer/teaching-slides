  <text x="881.7778" y="248" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--text-faint)">PDF</text>
  <text x="881.7778" y="328" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--text-faint)">HTML</text>
  <text x="881.7778" y="408" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--text-faint)">Dashboard</text>
  <text x="568.8889" y="72" text-anchor="middle" font-family="sans-serif" font-size="39.8222" font-weight="bold" fill="var(--surface)">Spark Reports</text>
  <text x="568.8889" y="600" text-anchor="middle" font-family="monospace" font-size="18.4889" fill="var(--text-muted)">processing | analysis | visualization | monitoring</text>
</svg>
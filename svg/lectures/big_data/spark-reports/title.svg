<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Report document -->
  <rect x="300" y="90" width="200" height="250" rx="6" fill="#0f3460" stroke="#16c79a" stroke-width="2"/>
  <!-- Header bar -->
  <rect x="320" y="110" width="160" height="20" rx="3" fill="#16c79a" opacity="0.3"/>
  <!-- Chart area -->
  <line x1="330" y1="160" x2="330" y2="230" stroke="#888" stroke-width="1"/>
  <line x1="330" y1="230" x2="460" y2="230" stroke="#888" stroke-width="1"/>
  <polyline points="340,220 370,195 400,210 430,175 450,185" fill="none" stroke="#e94560" stroke-width="2"/>
  <circle cx="340" cy="220" r="3" fill="#e94560"/>
  <circle cx="370" cy="195" r="3" fill="#e94560"/>
  <circle cx="400" cy="210" r="3" fill="#e94560"/>
  <circle cx="430" cy="175" r="3" fill="#e94560"/>
  <circle cx="450" cy="185" r="3" fill="#e94560"/>
  <!-- Table rows -->
  <rect x="320" y="250" width="160" height="10" rx="2" fill="#888" opacity="0.2"/>
  <rect x="320" y="265" width="160" height="10" rx="2" fill="#888" opacity="0.15"/>
  <rect x="320" y="280" width="160" height="10" rx="2" fill="#888" opacity="0.1"/>
  <rect x="320" y="295" width="160" height="10" rx="2" fill="#888" opacity="0.08"/>
  <!-- Spark diamond -->
  <polygon points="140,200 170,170 200,200 170,230" fill="none" stroke="#f5a623" stroke-width="2"/>
  <polygon points="150,200 170,180 190,200 170,220" fill="#f5a623" opacity="0.3"/>
  <!-- Arrow from spark to report -->
  <line x1="210" y1="200" x2="290" y2="200" stroke="#f5a623" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="290,195 302,200 290,205" fill="#f5a623"/>
  <!-- Output icons -->
  <line x1="510" y1="180" x2="580" y2="150" stroke="#16c79a" stroke-width="1.5"/>
  <line x1="510" y1="200" x2="580" y2="200" stroke="#16c79a" stroke-width="1.5"/>
  <line x1="510" y1="220" x2="580" y2="250" stroke="#16c79a" stroke-width="1.5"/>
  <text x="620" y="155" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">PDF</text>
  <text x="620" y="205" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">HTML</text>
  <text x="620" y="255" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">Dashboard</text>
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#eee">Spark Reports</text>
  <text x="400" y="375" text-anchor="middle" font-family="monospace" font-size="13" fill="#666">processing | analysis | visualization | monitoring</text>
</svg>

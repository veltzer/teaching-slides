  <circle cx="611.5556" cy="280" r="4.2667" fill="var(--danger-fill)" />
  <circle cx="640" cy="296" r="4.2667" fill="var(--danger-fill)" />
  <rect x="455.1111" y="400" width="227.5556" height="16" rx="6" fill="var(--text-faint)" opacity="0.2" />
  <rect x="455.1111" y="424" width="227.5556" height="16" rx="6" fill="var(--text-faint)" opacity="0.15" />
  <rect x="455.1111" y="448" width="227.5556" height="16" rx="6" fill="var(--text-faint)" opacity="0.1" />
  <rect x="455.1111" y="472" width="227.5556" height="16" rx="6" fill="var(--text-faint)" opacity="0.08" />

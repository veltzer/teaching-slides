  <polygon points="213.3333,320 241.7778,288 270.2222,320 241.7778,352" fill="var(--warn-fill)" opacity="0.3" />
  <line x1="298.6667" y1="320" x2="412.4444" y2="320" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.5333 4.2667" />
  <polygon points="412.4444,312 429.5111,320 412.4444,328" fill="var(--warn-fill)" />
  <line x1="725.3333" y1="288" x2="824.8889" y2="240" stroke="var(--ok-border)" stroke-width="2" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.807319" font-weight="bold" fill="var(--text)">Spark Processing Capabilities</text>

  <!-- Pipeline -->
  <rect x="40" y="82.181818" width="220" height="126.545455" rx="8.215285" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--danger-text)">Input</text>
  <text x="150" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">HDFS, S3, Kafka</text>
  <text x="150" y="189.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">JDBC, files, streams</text>

  <rect x="285" y="82.181818" width="220" height="126.545455" rx="8.215285" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--primary-text)">Transform</text>
  <text x="395" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">map, filter, select</text>
  <text x="395" y="189.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">lazy, planned lazily</text>

  <rect x="530" y="82.181818" width="220" height="126.545455" rx="8.215285" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--info-text)">Process</text>
  <text x="640" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">joins, windows</text>
  <text x="640" y="189.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">SQL, UDFs</text>

  <rect x="775" y="82.181818" width="220" height="126.545455" rx="8.215285" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="885" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--ok-text)">Aggregate</text>
  <text x="885" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">groupBy, rollup</text>
  <text x="885" y="189.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">approx metrics</text>

  <rect x="1020" y="82.181818" width="220" height="126.545455" rx="8.215285" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--warn-text)">Output</text>
  <text x="1130" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">Parquet, Delta</text>
  <text x="1130" y="189.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">JDBC, dashboards</text>

  <line x1="260" y1="145.454545" x2="285" y2="145.454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505" y1="145.454545" x2="530" y2="145.454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="145.454545" x2="775" y2="145.454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="995" y1="145.454545" x2="1020" y2="145.454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Capability matrix -->
  <rect x="40" y="250.909091" width="290" height="179.272727" rx="8.215285" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="287.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--primary-accent)">Batch</text>
  <text x="185" y="324.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">DataFrame, Spark SQL</text>
  <text x="185" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">ETL at TB scale</text>
  <text x="185" y="377.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Parquet / ORC / Delta</text>
  <text x="185" y="403.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Scheduled pipelines</text>

  <rect x="350" y="250.909091" width="290" height="179.272727" rx="8.215285" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="495" y="287.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--warn-accent)">Streaming</text>
  <text x="495" y="324.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Structured Streaming</text>
  <text x="495" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Exactly-once sinks</text>
  <text x="495" y="377.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Watermarks, windows</text>
  <text x="495" y="403.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Kafka source/sink</text>

  <rect x="660" y="250.909091" width="290" height="179.272727" rx="8.215285" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="805" y="287.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--ok-accent)">ML &amp; MLlib</text>
  <text x="805" y="324.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Pipelines API</text>
  <text x="805" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Classification, clustering</text>
  <text x="805" y="377.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Feature engineering</text>
  <text x="805" y="403.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Distributed training</text>

  <rect x="970" y="250.909091" width="270" height="179.272727" rx="8.215285" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1105" y="287.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--info-accent)">Graph</text>
  <text x="1105" y="324.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">GraphX / GraphFrames</text>
  <text x="1105" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">PageRank, components</text>
  <text x="1105" y="377.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Shortest paths</text>
  <text x="1105" y="403.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Motif finding</text>

  <!-- Bottom summary -->
  <rect x="40" y="461.818182" width="1200" height="158.181818" rx="8.215285" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="498.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--text)">Unified engine, four workloads</text>
  <text x="640" y="530.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">One runtime handles ETL, streaming, ML, and graph — same DataFrame, same cluster.</text>
  <text x="640" y="556.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Catalyst optimizer rewrites your query; Tungsten generates code for tight CPU loops.</text>
  <text x="640" y="588.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Scales linearly on commodity nodes — from laptop to thousands of executors.</text>
</svg>

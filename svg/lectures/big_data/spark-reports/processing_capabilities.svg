<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.807319" font-weight="bold" fill="var(--text)">Spark Capabilities</text>

  <!-- Pipeline -->
  <rect x="40" y="82.181818" width="220" height="126.545455" rx="8.215285" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--danger-text)">Input</text>
  <text x="150" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">HDFS, S3, Kafka</text>
  <text x="150" y="189.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">JDBC, files</text>

  <rect x="285" y="82.181818" width="220" height="126.545455" rx="8.215285" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--primary-text)">Transform</text>
  <text x="395" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">map, filter</text>
  <text x="395" y="189.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">lazy planned</text>

  <rect x="530" y="82.181818" width="220" height="126.545455" rx="8.215285" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--info-text)">Process</text>
  <text x="640" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">joins, windows</text>
  <text x="640" y="189.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">SQL, UDFs</text>

  <rect x="775" y="82.181818" width="220" height="126.545455" rx="8.215285" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="885" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--ok-text)">Aggregate</text>
  <text x="885" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">groupBy, rollup</text>
  <text x="885" y="189.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">approx metrics</text>

  <rect x="1020" y="82.181818" width="220" height="126.545455" rx="8.215285" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--warn-text)">Output</text>
  <text x="1130" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">Parquet, Delta</text>
  <text x="1130" y="189.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">JDBC</text>

  <line x1="260" y1="145.454545" x2="285" y2="145.454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505" y1="145.454545" x2="530" y2="145.454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="145.454545" x2="775" y2="145.454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="995" y1="145.454545" x2="1020" y2="145.454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Capability matrix -->
  <rect x="40" y="250.909091" width="290" height="179.272727" rx="8.215285" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="287.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--primary-accent)">Batch</text>
  <text x="185" y="324.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">DataFrame, SQL</text>
  <text x="185" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">TB-scale ETL</text>
  <text x="185" y="377.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Parquet/Delta</text>
  <text x="185" y="403.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Scheduled</text>

  <rect x="350" y="250.909091" width="290" height="179.272727" rx="8.215285" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="495" y="287.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--warn-accent)">Streaming</text>
  <text x="495" y="324.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Structured</text>
  <text x="495" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Exactly-once</text>
  <text x="495" y="377.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Watermarks</text>
  <text x="495" y="403.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Kafka I/O</text>

  <rect x="660" y="250.909091" width="290" height="179.272727" rx="8.215285" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="805" y="287.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--ok-accent)">ML &amp; MLlib</text>
  <text x="805" y="324.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Pipelines</text>
  <text x="805" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Classify, cluster</text>
  <text x="805" y="377.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Features</text>
  <text x="805" y="403.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Distributed training</text>

  <rect x="970" y="250.909091" width="270" height="179.272727" rx="8.215285" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1105" y="287.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--info-accent)">Graph</text>
  <text x="1105" y="324.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">GraphX/Frames</text>
  <text x="1105" y="351.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">PageRank</text>
  <text x="1105" y="377.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Shortest paths</text>
  <text x="1105" y="403.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Motifs</text>

  <!-- Bottom summary -->
  <rect x="40" y="461.818182" width="1200" height="158.181818" rx="8.215285" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="498.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--text)">Unified engine</text>
  <text x="640" y="530.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">ETL, streaming, ML, graph in one runtime</text>
  <text x="640" y="556.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Catalyst plans, Tungsten codegens</text>
  <text x="640" y="588.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Scales laptop to thousands</text>
</svg>

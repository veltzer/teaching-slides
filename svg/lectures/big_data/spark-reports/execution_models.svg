<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.645855" font-weight="bold" fill="var(--text)">Spark Execution Models for Reports</text>

  <rect x="40" y="82.181818" width="390" height="274.181818" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="124.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--ok-text)">Batch</text>
  <text x="235" y="161.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">Scheduled periodic job</text>
  <text x="235" y="187.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">Full dataset scan</text>
  <text x="235" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">Heavy transformations</text>
  <text x="235" y="240.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">Write to warehouse / lake</text>
  <text x="235" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">Latency: minutes to hours</text>
  <text x="235" y="308.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--ok-text)">Daily/hourly dashboards,</text>
  <text x="235" y="335.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--ok-text)">historical reports</text>

  <rect x="445" y="82.181818" width="390" height="274.181818" rx="6.161464" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="124.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--warn-text)">Micro-Batch Streaming</text>
  <text x="640" y="161.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--warn-text)">Structured Streaming</text>
  <text x="640" y="187.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--warn-text)">Small batches every trigger</text>
  <text x="640" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--warn-text)">Incremental updates</text>
  <text x="640" y="240.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--warn-text)">Exactly-once checkpoints</text>
  <text x="640" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--warn-text)">Latency: seconds</text>
  <text x="640" y="308.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--warn-text)">Near-real-time KPIs,</text>
  <text x="640" y="335.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--warn-text)">live aggregations</text>

  <rect x="850" y="82.181818" width="390" height="274.181818" rx="6.161464" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="124.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--info-text)">Interactive / Ad-hoc</text>
  <text x="1045" y="161.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">Long-running context</text>
  <text x="1045" y="187.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">Cached DataFrames</text>
  <text x="1045" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">Thrift Server / JDBC</text>
  <text x="1045" y="240.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">BI tool connections</text>
  <text x="1045" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">Latency: sub-second to s</text>
  <text x="1045" y="308.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--info-text)">Analyst exploration,</text>
  <text x="1045" y="335.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--info-text)">drill-down reports</text>

  <rect x="40" y="388" width="1200" height="232" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="424.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" font-weight="bold" fill="var(--text)">Choosing a model</text>
  <text x="640" y="461.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Report freshness SLA drives the choice — batch is cheapest per row</text>
  <text x="640" y="493.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Streaming pays for lower latency with more complex state, checkpoints, failure modes</text>
  <text x="640" y="525.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Interactive serves humans — keep queries under 10s for good UX</text>
  <text x="640" y="556.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Lambda architecture: batch correctness + streaming freshness, merged at read</text>
  <text x="640" y="593.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--text-faint)">Delta / Iceberg enable incremental batch — midway between batch and streaming</text>
</svg>

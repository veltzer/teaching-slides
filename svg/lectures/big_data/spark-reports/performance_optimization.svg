<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.807319" font-weight="bold" fill="var(--text)">Spark Performance Optimization</text>

  <!-- Row 1: pipeline -->
  <rect x="40" y="82.181818" width="220" height="116" rx="8.215285" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="150" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--ok-text)">Input</text>
  <text x="150" y="161.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">Parquet, ORC</text>
  <text x="150" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">predicate pushdown</text>

  <rect x="285" y="82.181818" width="220" height="116" rx="8.215285" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="395" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--warn-text)">Cache</text>
  <text x="395" y="161.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">persist reused RDDs</text>
  <text x="395" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">MEMORY_AND_DISK</text>

  <rect x="530" y="82.181818" width="220" height="116" rx="8.215285" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--info-text)">Process</text>
  <text x="640" y="161.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">avoid wide shuffles</text>
  <text x="640" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">broadcast small joins</text>

  <rect x="775" y="82.181818" width="220" height="116" rx="8.215285" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="885" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--primary-text)">Tune</text>
  <text x="885" y="161.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">partitions, executors</text>
  <text x="885" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">AQE enabled</text>

  <rect x="1020" y="82.181818" width="220" height="116" rx="8.215285" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1130" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" font-weight="bold" fill="var(--danger-text)">Output</text>
  <text x="1130" y="161.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">coalesce, partition</text>
  <text x="1130" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">avoid small files</text>

  <line x1="260" y1="140.181818" x2="285" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505" y1="140.181818" x2="530" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="140.181818" x2="775" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="995" y1="140.181818" x2="1020" y2="140.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Four levers -->
  <rect x="40" y="240.363636" width="290" height="179.272727" rx="8.215285" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="277.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--primary-accent)">Partitioning</text>
  <text x="185" y="314.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Size 128-256 MB per part</text>
  <text x="185" y="340.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Repartition for skew</text>
  <text x="185" y="366.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Coalesce on write</text>
  <text x="185" y="393.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Salt keys when hot</text>

  <rect x="350" y="240.363636" width="290" height="179.272727" rx="8.215285" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="495" y="277.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--ok-accent)">Caching</text>
  <text x="495" y="314.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Cache reused datasets</text>
  <text x="495" y="340.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Use DISK fallback</text>
  <text x="495" y="366.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Unpersist when done</text>
  <text x="495" y="393.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Avoid caching once-read</text>

  <rect x="660" y="240.363636" width="290" height="179.272727" rx="8.215285" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="805" y="277.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--warn-accent)">Shuffle &amp; Joins</text>
  <text x="805" y="314.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Broadcast small tables</text>
  <text x="805" y="340.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Bucket frequent joins</text>
  <text x="805" y="366.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Push filters early</text>
  <text x="805" y="393.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Prefer DataFrame API</text>

  <rect x="970" y="240.363636" width="270" height="179.272727" rx="8.215285" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1105" y="277.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--info-accent)">Resources</text>
  <text x="1105" y="314.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Right-size executors</text>
  <text x="1105" y="340.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">4-5 cores per executor</text>
  <text x="1105" y="366.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Reserve memory overhead</text>
  <text x="1105" y="393.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Dynamic allocation on</text>

  <!-- Bottom: signals & AQE -->
  <rect x="40" y="451.272727" width="1200" height="168.727273" rx="8.215285" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="488.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--text)">Measure first, then tune</text>
  <text x="640" y="519.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Read the Spark UI: stage time, shuffle read/write, spill, skew, and GC.</text>
  <text x="640" y="546.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Enable Adaptive Query Execution — coalesces partitions and switches join strategies at runtime.</text>
  <text x="640" y="572.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Columnar formats + partition pruning avoid reading data you do not need.</text>
  <text x="640" y="604.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--text-faint)">Rule of thumb: fix skew and shuffle before touching executor counts.</text>
</svg>

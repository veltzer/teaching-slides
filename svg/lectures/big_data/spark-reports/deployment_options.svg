  <line x1="606.3157" y1="347.3684" x2="718.5965" y2="347.3684" stroke="var(--text-dark)" stroke-width="4.4912" marker-end="url(#arrowhead15)" />
  <line x1="943.1578" y1="347.3684" x2="1055.4386" y2="347.3684" stroke="var(--text-dark)" stroke-width="4.4912" marker-end="url(#arrowhead15)" />

  <rect x="44.9123" y="260.5263" width="224.5614" height="173.6842" rx="11.2281" fill="var(--ok-vivid)" stroke="var(--ok-soft)" stroke-width="4.4912" />
  <text x="157.193" y="364.7368" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="31.4386">Dev</text>
  <rect x="381.7544" y="260.5263" width="224.5614" height="173.6842" rx="11.2281" fill="var(--primary-soft)" stroke="var(--primary-mid)" stroke-width="4.4912" />
  <text x="494.0351" y="364.7368" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="31.4386">Test</text>
  <rect x="718.5965" y="260.5263" width="224.5614" height="173.6842" rx="11.2281" fill="var(--warn-gold)" stroke="var(--warn-gold)" stroke-width="4.4912" />
  <text x="830.8772" y="364.7368" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="31.4386">Staging</text>
  <rect x="1055.4386" y="260.5263" width="224.5614" height="173.6842" rx="11.2281" fill="var(--danger-light)" stroke="var(--danger-dk)" stroke-width="4.4912" />
  <text x="1167.7192" y="364.7368" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="31.4386" font-weight="bold">Prod</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead0" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 7.4667,0" fill="#333" />
    </marker>
  </defs>
  <rect x="421.3992" y="284.4444" width="421.3992" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="632.0988" y="346.6667" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="28.4444" font-weight="bold">Spark Reports</text>
  <rect x="105.3498" y="71.1111" width="316.0494" height="88.8889" rx="6" fill="var(--text-faint)" stroke="var(--text-muted)" stroke-width="3.5556" />
  <text x="263.3745" y="124.4444" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="24.8889">Data Sources</text>
  <rect x="842.7983" y="71.1111" width="316.0494" height="88.8889" rx="6" fill="var(--text-faint)" stroke="var(--text-muted)" stroke-width="3.5556" />
  <text x="1000.823" y="124.4444" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="24.8889">Processing Engine</text>
  <rect x="105.3498" y="551.1111" width="316.0494" height="88.8889" rx="6" fill="var(--text-faint)" stroke="var(--text-muted)" stroke-width="3.5556" />
  <text x="263.3745" y="604.4444" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="24.8889">Output Generation</text>
  <rect x="842.7983" y="551.1111" width="316.0494" height="88.8889" rx="6" fill="var(--text-faint)" stroke="var(--text-muted)" stroke-width="3.5556" />
  <text x="1000.823" y="604.4444" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="24.8889">Distribution</text>
  <line x1="526.7489" y1="284.4444" x2="316.0494" y2="160" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowhead0)" />
  <line x1="737.4486" y1="284.4444" x2="948.1481" y2="160" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowhead0)" />
  <line x1="526.7489" y1="391.1111" x2="316.0494" y2="551.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowhead0)" />
  <line x1="737.4486" y1="391.1111" x2="948.1481" y2="551.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowhead0)" />
</svg>
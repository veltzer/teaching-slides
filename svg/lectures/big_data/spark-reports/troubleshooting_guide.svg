<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.807319" font-weight="bold" fill="var(--text)">Spark Troubleshooting Guide</text>

  <!-- Workflow -->
  <rect x="40" y="82.181818" width="275" height="126.545455" rx="8.215285" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="177" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--danger-text)">Issue</text>
  <text x="177" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">OOM, slow stage,</text>
  <text x="177" y="187.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">task failure, skew</text>

  <rect x="340" y="82.181818" width="275" height="126.545455" rx="8.215285" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="477" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--warn-text)">Analyze</text>
  <text x="477" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">Spark UI, logs,</text>
  <text x="477" y="187.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">event timeline, plan</text>

  <rect x="640" y="82.181818" width="275" height="126.545455" rx="8.215285" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="777" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--primary-text)">Resolve</text>
  <text x="777" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">repartition, broadcast,</text>
  <text x="777" y="187.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">bump memory, cache</text>

  <rect x="940" y="82.181818" width="300" height="126.545455" rx="8.215285" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1090" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--ok-text)">Prevent</text>
  <text x="1090" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">alerts, tests,</text>
  <text x="1090" y="187.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">data-quality checks</text>

  <line x1="315" y1="145.454545" x2="340" y2="145.454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="615" y1="145.454545" x2="640" y2="145.454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="915" y1="145.454545" x2="940" y2="145.454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Common problems table -->
  <rect x="40" y="250.909091" width="1200" height="369.090909" rx="8.215285" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="287.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--text)">Common symptoms and first fixes</text>

  <!-- headers -->
  <rect x="60" y="308.909091" width="380" height="35.854545" fill="var(--primary-fill)"/>
  <rect x="440" y="308.909091" width="380" height="35.854545" fill="var(--primary-fill)"/>
  <rect x="820" y="308.909091" width="400" height="35.854545" fill="var(--primary-fill)"/>
  <text x="250" y="333.163636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--primary-text)">Symptom</text>
  <text x="630" y="333.163636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--primary-text)">Likely cause</text>
  <text x="1020" y="333.163636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--primary-text)">First fix</text>

  <!-- rows -->
  <text x="250" y="372.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Executor OOM</text>
  <text x="630" y="372.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Wide rows, big shuffle</text>
  <text x="1020" y="372.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Repartition; raise overhead</text>

  <text x="250" y="409.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">One slow task</text>
  <text x="630" y="409.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Data skew on a key</text>
  <text x="1020" y="409.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Salt keys; enable AQE skew</text>

  <text x="250" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Huge shuffle write</text>
  <text x="630" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Missing broadcast / filter</text>
  <text x="1020" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Broadcast small side; push filter</text>

  <text x="250" y="482.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Lost executors</text>
  <text x="630" y="482.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">YARN/K8s kill, preemption</text>
  <text x="1020" y="482.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Raise memory overhead</text>

  <text x="250" y="519.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Small files on write</text>
  <text x="630" y="519.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Too many partitions</text>
  <text x="1020" y="519.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">coalesce() before write</text>

  <text x="250" y="556.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text)">Driver OOM</text>
  <text x="630" y="556.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">collect() on big set</text>
  <text x="1020" y="556.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--text-muted)">Stream to sink; sample first</text>

  <text x="640" y="598.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--text-faint)">Start in the Spark UI — the slowest stage almost always tells you which knob to turn.</text>
</svg>

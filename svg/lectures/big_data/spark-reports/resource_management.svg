<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)">Resource Management</text>

  <rect x="200" y="140" width="880" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Cluster Manager</text>
  <text x="640" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">YARN · Kubernetes · Standalone</text>

  <line x1="640" y1="240" x2="640" y2="275" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="280" width="340" height="120" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="250" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Executor Count</text>
  <text x="250" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">spark.executor.instances</text>
  <text x="250" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">or dynamic allocation</text>

  <rect x="470" y="280" width="340" height="120" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Cores per Executor</text>
  <text x="640" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">spark.executor.cores</text>
  <text x="640" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">task parallelism per JVM</text>

  <rect x="860" y="280" width="340" height="120" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1030" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Memory per Executor</text>
  <text x="1030" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">spark.executor.memory</text>
  <text x="1030" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">watch for OOM / GC pauses</text>

  <rect x="200" y="460" width="880" height="110" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Rule of thumb</text>
  <text x="640" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">5 cores per executor · leave 1 core and ~10% memory for OS &amp; daemons</text>
  <text x="640" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Enable dynamic allocation so idle executors release back to the pool</text>
</svg>

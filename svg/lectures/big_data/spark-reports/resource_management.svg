<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.0277" font-weight="bold" fill="var(--text)">Resource Management</text>

  <rect x="168.5714" y="111.0204" width="942.8571" height="118.3673" rx="6.7569" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="152.449" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2708" font-weight="bold" fill="var(--primary-text)">Cluster Manager</text>
  <text x="640" y="193.8776" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7661" fill="var(--primary-text)">YARN · Kubernetes · Standalone</text>

  <line x1="640" y1="229.3878" x2="640" y2="270.8163" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="276.7347" width="364.2857" height="142.0408" rx="6.7569" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.1429" y="318.1633" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2708" font-weight="bold" fill="var(--ok-text)">Executor Count</text>
  <text x="222.1429" y="353.6735" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.64" fill="var(--ok-text)">spark.executor.instances</text>
  <text x="222.1429" y="389.1837" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.64" fill="var(--ok-text)">or dynamic allocation</text>

  <rect x="457.8571" y="276.7347" width="364.2857" height="142.0408" rx="6.7569" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="318.1633" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2708" font-weight="bold" fill="var(--warn-text)">Cores per Executor</text>
  <text x="640" y="353.6735" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.64" fill="var(--warn-text)">spark.executor.cores</text>
  <text x="640" y="389.1837" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.64" fill="var(--warn-text)">task parallelism per JVM</text>

  <rect x="875.7143" y="276.7347" width="364.2857" height="142.0408" rx="6.7569" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.8571" y="318.1633" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2708" font-weight="bold" fill="var(--info-text)">Memory per Executor</text>
  <text x="1057.8571" y="353.6735" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.64" fill="var(--info-text)">spark.executor.memory</text>
  <text x="1057.8571" y="389.1837" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.64" fill="var(--info-text)">watch for OOM / GC pauses</text>

  <rect x="168.5714" y="489.7959" width="942.8571" height="130.2041" rx="6.7569" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="531.2245" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0185" font-weight="bold" fill="var(--text)">Rule of thumb</text>
  <text x="640" y="566.7347" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.64" fill="var(--text-muted)">5 cores per executor · leave 1 core and ~10% memory for OS &amp; daemons</text>
  <text x="640" y="596.3265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.64" fill="var(--text-muted)">Enable dynamic allocation so idle executors release back to the pool</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead4" markerWidth="16" markerHeight="25.2" refX="14.4" refY="12.6" orient="auto">
      <polygon points="0,36 5.6,0" fill="#333" />
    </marker>
  </defs>
  <rect x="80" y="270" width="160" height="180" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="160" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" fill="#333">Map</text>
  <rect x="400" y="270" width="208" height="180" rx="8" fill="#fff9c4" stroke="#f57c00" stroke-width="3.2" />
  <text x="504" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" fill="#333">Shuffle Write</text>
  <rect x="720" y="270" width="208" height="180" rx="8" fill="#fff9c4" stroke="#f57c00" stroke-width="3.2" />
  <text x="824" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" fill="#333">Shuffle Read</text>
  <rect x="1040" y="270" width="160" height="180" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="1120" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" fill="#333">Reduce</text>
  <line x1="240" y1="360" x2="400" y2="360" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead4)" />
  <line x1="608" y1="360" x2="720" y2="360" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead4)" />
  <line x1="928" y1="360" x2="1040" y2="360" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead4)" />
  <text x="320" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#666">write</text>
  <text x="664" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#666">network</text>
  <text x="984" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#666">process</text>
</svg>
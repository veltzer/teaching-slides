<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Browser window -->
  <rect x="150" y="90" width="500" height="260" rx="8" fill="#0f3460" stroke="#16c79a" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="150" y="90" width="500" height="30" rx="8" fill="#16c79a" opacity="0.15"/>
  <circle cx="175" cy="105" r="5" fill="#e94560" opacity="0.8"/>
  <circle cx="195" cy="105" r="5" fill="#f5a623" opacity="0.8"/>
  <circle cx="215" cy="105" r="5" fill="#16c79a" opacity="0.8"/>
  <text x="400" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">localhost:4040</text>
  <!-- Tab bar -->
  <rect x="165" y="128" width="55" height="20" rx="3" fill="#e94560" opacity="0.3"/>
  <text x="192" y="142" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#e94560">Jobs</text>
  <rect x="225" y="128" width="55" height="20" rx="3" fill="#16c79a" opacity="0.2"/>
  <text x="252" y="142" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#16c79a">Stages</text>
  <rect x="285" y="128" width="60" height="20" rx="3" fill="#f5a623" opacity="0.2"/>
  <text x="315" y="142" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#f5a623">Storage</text>
  <rect x="350" y="128" width="70" height="20" rx="3" fill="#a855f7" opacity="0.2"/>
  <text x="385" y="142" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#a855f7">Executors</text>
  <rect x="425" y="128" width="45" height="20" rx="3" fill="#3b82f6" opacity="0.2"/>
  <text x="447" y="142" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#3b82f6">SQL</text>
  <!-- DAG visualization -->
  <circle cx="230" cy="195" r="15" fill="none" stroke="#e94560" stroke-width="2"/>
  <text x="230" y="199" text-anchor="middle" font-family="monospace" font-size="8" fill="#e94560">S0</text>
  <circle cx="320" cy="180" r="15" fill="none" stroke="#16c79a" stroke-width="2"/>
  <text x="320" y="184" text-anchor="middle" font-family="monospace" font-size="8" fill="#16c79a">S1</text>
  <circle cx="320" cy="220" r="15" fill="none" stroke="#16c79a" stroke-width="2"/>
  <text x="320" y="224" text-anchor="middle" font-family="monospace" font-size="8" fill="#16c79a">S2</text>
  <circle cx="410" cy="200" r="15" fill="none" stroke="#f5a623" stroke-width="2"/>
  <text x="410" y="204" text-anchor="middle" font-family="monospace" font-size="8" fill="#f5a623">S3</text>
  <line x1="245" y1="190" x2="305" y2="183" stroke="#888" stroke-width="1.5"/>
  <line x1="245" y1="200" x2="305" y2="217" stroke="#888" stroke-width="1.5"/>
  <line x1="335" y1="185" x2="395" y2="197" stroke="#888" stroke-width="1.5"/>
  <line x1="335" y1="215" x2="395" y2="203" stroke="#888" stroke-width="1.5"/>
  <!-- Progress bars -->
  <rect x="180" y="265" width="200" height="12" rx="3" fill="#888" opacity="0.2"/>
  <rect x="180" y="265" width="160" height="12" rx="3" fill="#16c79a" opacity="0.5"/>
  <text x="180" y="258" font-family="monospace" font-size="9" fill="#888">Tasks: 160/200</text>
  <rect x="180" y="295" width="200" height="12" rx="3" fill="#888" opacity="0.2"/>
  <rect x="180" y="295" width="100" height="12" rx="3" fill="#f5a623" opacity="0.5"/>
  <text x="180" y="288" font-family="monospace" font-size="9" fill="#888">Shuffle: 50%</text>
  <!-- Spark diamond -->
  <polygon points="540" fill="none"/>
  <polygon points="530,250 545,235 560,250 545,265" fill="#f5a623" opacity="0.4"/>
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#eee">Spark Web UI</text>
  <text x="400" y="375" text-anchor="middle" font-family="monospace" font-size="13" fill="#666">monitoring | DAG | stages | executors | SQL</text>
</svg>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="265" y="170.5" width="750" height="377" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444"/>
  <rect x="265" y="170.5" width="750" height="43.5" rx="6" fill="url(#grad-ok)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="302.5" cy="192.25" r="6.9522" fill="var(--danger-fill)" opacity="0.8"/>
  <circle cx="332.5" cy="192.25" r="6.9522" fill="var(--warn-fill)" opacity="0.8"/>
  <circle cx="362.5" cy="192.25" r="6.9522" fill="var(--ok-fill)" opacity="0.8"/>
  <text x="640" y="199.5" text-anchor="middle" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">localhost:4040</text>

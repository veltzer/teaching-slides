  <rect x="377.5" y="225.6" width="82.5" height="29" rx="6" fill="url(#grad-ok)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418" y="245.9" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Arial, sans-serif">Stages</text>
  <rect x="467.5" y="225.6" width="90" height="29" rx="6" fill="url(#grad-warn)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="512.5" y="245.9" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Arial, sans-serif">Storage</text>
  <rect x="565" y="225.6" width="105" height="29" rx="6" fill="url(#grad-info)" opacity="0.2" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="617.5" y="245.9" text-anchor="middle" font-size="13.9044" fill="var(--info-accent)" font-family="Arial, sans-serif">Executors</text>
  <rect x="677.4999" y="225.6" width="67.5" height="29" rx="6" fill="url(#grad-primary)" opacity="0.2" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="710.5" y="245.9" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)" font-family="Arial, sans-serif">SQL</text>
  <circle cx="385" cy="322.75" r="20.8566" fill="none" stroke="var(--danger-border)" stroke-width="2.8444"/>
  <text x="385" y="328.55" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">S0</text>
  <circle cx="520" cy="301" r="20.8566" fill="none" stroke="var(--ok-border)" stroke-width="2.8444"/>
  <text x="520" y="306.8" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">S1</text>
  <circle cx="520" cy="359" r="20.8566" fill="none" stroke="var(--ok-border)" stroke-width="2.8444"/>
  <text x="520" y="364.8" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">S2</text>
  <circle cx="655" cy="330" r="20.8566" fill="none" stroke="var(--warn-border)" stroke-width="2.8444"/>
  <text x="655" y="335.8" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Courier New, monospace">S3</text>
  <line x1="407.4999" y1="315.5" x2="497.5" y2="305.35" stroke="var(--text-faint)" stroke-width="2"/>
  <line x1="407.4999" y1="330" x2="497.5" y2="354.65" stroke="var(--text-faint)" stroke-width="2"/>
  <line x1="542.4999" y1="308.25" x2="632.5" y2="325.65" stroke="var(--text-faint)" stroke-width="2"/>
  <line x1="542.4999" y1="351.75" x2="632.5" y2="334.35" stroke="var(--text-faint)" stroke-width="2"/>
  <rect x="310" y="424.25" width="299.9999" height="17.4" rx="6" fill="var(--text-faint)" opacity="0.2"/>
  <rect x="310" y="424.25" width="240" height="17.4" rx="6" fill="url(#grad-ok)" opacity="0.5" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="414.1" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">Tasks: 160/200</text>
  <rect x="310" y="467.75" width="299.9999" height="17.4" rx="6" fill="var(--text-faint)" opacity="0.2"/>
  <rect x="310" y="467.75" width="150" height="17.4" rx="6" fill="url(#grad-warn)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="457.6" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">Shuffle: 50%</text>
  <polygon points="" fill="none"/>
  <polygon points="835,402.5 857.5,380.75 879.9999,402.5 857.5,424.25" fill="var(--warn-fill)" opacity="0.4"/>
  <text x="640" y="583.75" text-anchor="middle" font-size="18.0758" fill="var(--text-muted)" font-family="Courier New, monospace">monitoring | DAG | stages | executors | SQL</text>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Spark UI</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Reading the Execution Dashboard</text>
</svg>

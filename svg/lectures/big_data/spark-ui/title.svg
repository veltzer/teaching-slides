<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="265" y="170.5" width="750" height="377" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444"/>
  <rect x="265" y="170.5" width="750" height="43.5" rx="6" fill="url(#grad-ok)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="302.5" cy="192.25" r="6.9522" fill="var(--danger-fill)" opacity="0.8"/>
  <circle cx="332.5" cy="192.25" r="6.9522" fill="var(--warn-fill)" opacity="0.8"/>
  <circle cx="362.5" cy="192.25" r="6.9522" fill="var(--ok-fill)" opacity="0.8"/>
  <text x="640" y="199.5" text-anchor="middle" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">localhost:4040</text>
  <rect x="287.5" y="225.6" width="82.5" height="29" rx="6" fill="url(#grad-danger)" opacity="0.3" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="328" y="245.9" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Arial, sans-serif">Jobs</text>
  <rect x="377.5" y="225.6" width="82.5" height="29" rx="6" fill="url(#grad-ok)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418" y="245.9" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Arial, sans-serif">Stages</text>
  <rect x="467.5" y="225.6" width="90" height="29" rx="6" fill="url(#grad-warn)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="512.5" y="245.9" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Arial, sans-serif">Storage</text>
  <rect x="565" y="225.6" width="105" height="29" rx="6" fill="url(#grad-info)" opacity="0.2" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="617.5" y="245.9" text-anchor="middle" font-size="13.9044" fill="var(--info-accent)" font-family="Arial, sans-serif">Executors</text>
  <rect x="677.4999" y="225.6" width="67.5" height="29" rx="6" fill="url(#grad-primary)" opacity="0.2" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="710.5" y="245.9" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)" font-family="Arial, sans-serif">SQL</text>
  <circle cx="385" cy="322.75" r="20.8566" fill="none" stroke="var(--danger-border)" stroke-width="2.8444"/>
  <text x="385" y="328.55" text-anchor="middle" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">S0</text>
  <circle cx="520" cy="301" r="20.8566" fill="none" stroke="var(--ok-border)" stroke-width="2.8444"/>
  <text x="520" y="306.8" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">S1</text>
  <circle cx="520" cy="359" r="20.8566" fill="none" stroke="var(--ok-border)" stroke-width="2.8444"/>
  <text x="520" y="364.8" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">S2</text>
  <circle cx="655" cy="330" r="20.8566" fill="none" stroke="var(--warn-border)" stroke-width="2.8444"/>
  <text x="655" y="335.8" text-anchor="middle" font-size="13.9044" fill="var(--warn-accent)" font-family="Courier New, monospace">S3</text>
  <line x1="407.4999" y1="315.5" x2="497.5" y2="305.35" stroke="var(--text-faint)" stroke-width="2"/>
  <line x1="407.4999" y1="330" x2="497.5" y2="354.65" stroke="var(--text-faint)" stroke-width="2"/>
  <line x1="542.4999" y1="308.25" x2="632.5" y2="325.65" stroke="var(--text-faint)" stroke-width="2"/>
  <line x1="542.4999" y1="351.75" x2="632.5" y2="334.35" stroke="var(--text-faint)" stroke-width="2"/>
  <rect x="310" y="424.25" width="299.9999" height="17.4" rx="6" fill="var(--text-faint)" opacity="0.2"/>
  <rect x="310" y="424.25" width="240" height="17.4" rx="6" fill="url(#grad-ok)" opacity="0.5" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="414.1" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">Tasks: 160/200</text>
  <rect x="310" y="467.75" width="299.9999" height="17.4" rx="6" fill="var(--text-faint)" opacity="0.2"/>
  <rect x="310" y="467.75" width="150" height="17.4" rx="6" fill="url(#grad-warn)" opacity="0.5" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="457.6" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">Shuffle: 50%</text>
  <polygon points="" fill="none"/>
  <polygon points="835,402.5 857.5,380.75 879.9999,402.5 857.5,424.25" fill="var(--warn-fill)" opacity="0.4"/>
  <text x="640" y="112.5" text-anchor="middle" font-size="38.9324" font-weight="bold" fill="var(--surface)" font-family="Arial, sans-serif">Spark Web UI</text>
  <text x="640" y="583.75" text-anchor="middle" font-size="18.0758" fill="var(--text-muted)" font-family="Courier New, monospace">monitoring | DAG | stages | executors | SQL</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead2" markerWidth="16" markerHeight="16.8" refX="14.4" refY="8.4" orient="auto">
      <polygon points="0,24 5.6,0" fill="#333" />
    </marker>
  </defs>
  <rect x="80" y="300" width="192" height="120" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.2" />
  <text x="176" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="#333">Storage</text>
  <rect x="400" y="120" width="192" height="108" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2" />
  <text x="496" y="184.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" fill="#333">Memory</text>
  <rect x="400" y="480" width="192" height="108" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="3.2" />
  <text x="496" y="544.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" fill="#333">Disk</text>
  <rect x="720" y="120" width="224" height="108" rx="8" fill="#bbdefb" stroke="#0d47a1" stroke-width="3.2" />
  <text x="832" y="184.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" fill="#333">Cached RDDs</text>
  <rect x="720" y="480" width="224" height="108" rx="8" fill="#ffcdd2" stroke="#c2185b" stroke-width="3.2" />
  <text x="832" y="544.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" fill="#333">Spilled Data</text>
  <line x1="272" y1="336" x2="400" y2="172.8" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead2)" />
  <line x1="272" y1="384" x2="400" y2="532.8" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead2)" />
  <line x1="592" y1="172.8" x2="720" y2="172.8" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead2)" />
  <line x1="592" y1="532.8" x2="720" y2="532.8" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead2)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.6,0" fill="#333" />
    </marker>
  </defs>
  <rect x="178.4615" y="272.3077" width="205.1282" height="128.2051" rx="6.4103" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="281.0256" y="349.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.3504" font-weight="bold" fill="var(--text)">Storage</text>
  <rect x="520.3419" y="80" width="205.1282" height="115.3846" rx="6.4103" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="622.906" y="149.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9316" fill="var(--text)">Memory</text>
  <rect x="520.3419" y="464.6154" width="205.1282" height="115.3846" rx="6.4103" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="622.906" y="533.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9316" fill="var(--text)">Disk</text>
  <rect x="862.2222" y="80" width="239.3162" height="115.3846" rx="6.4103" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="981.8803" y="149.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9316" fill="var(--text)">Cached RDDs</text>
  <rect x="862.2222" y="464.6154" width="239.3162" height="115.3846" rx="6.4103" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="981.8803" y="533.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9316" fill="var(--text)">Spilled Data</text>
  <line x1="383.5897" y1="310.7692" x2="520.3419" y2="136.4103" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowhead2)" />
  <line x1="383.5897" y1="362.0513" x2="520.3419" y2="521.0256" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowhead2)" />
  <line x1="725.4701" y1="136.4103" x2="862.2222" y2="136.4103" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowhead2)" />
  <line x1="725.4701" y1="521.0256" x2="862.2222" y2="521.0256" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowhead2)" />
</svg>
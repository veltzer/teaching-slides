<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="360" height="560" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="220" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--primary-text)">Spark Driver</text>
  <text x="220" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--primary-text)">spark-submit</text>
  <text x="220" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--primary-text)">pyspark shell</text>
  <text x="220" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--primary-text)">spark-shell</text>
  <text x="220" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Each running app</text>
  <text x="220" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">starts its own UI</text>
  <text x="220" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Auto-increments</text>
  <text x="220" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">port if in use</text>
  <text x="220" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Open browser to:</text>

  <rect x="720" y="40" width="520" height="160" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="980" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="var(--warn-text)">localhost:4040</text>
  <text x="980" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">First Spark application</text>

  <rect x="720" y="240" width="520" height="160" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="980" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="var(--warn-text)">localhost:4041</text>
  <text x="980" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">Second application</text>

  <rect x="720" y="440" width="520" height="160" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="980" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="var(--warn-text)">localhost:4042</text>
  <text x="980" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--warn-text)">Third application</text>

  <line x1="400" y1="200" x2="720" y2="120" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="320" x2="720" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="440" x2="720" y2="520" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

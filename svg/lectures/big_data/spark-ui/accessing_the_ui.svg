<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="360" height="580" rx="6.106203" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.531015" font-weight="bold" fill="var(--primary-text)">Spark Driver</text>
  <text x="220" y="174.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" fill="var(--primary-text)">spark-submit</text>
  <text x="220" y="226.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" fill="var(--primary-text)">pyspark shell</text>
  <text x="220" y="278.214286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" fill="var(--primary-text)">spark-shell</text>
  <text x="220" y="371.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--primary-text)">Each running app</text>
  <text x="220" y="407.678571" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--primary-text)">starts its own UI</text>
  <text x="220" y="464.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--primary-text)">Auto-increments</text>
  <text x="220" y="500.892857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--primary-text)">port if in use</text>
  <text x="220" y="573.392857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" fill="var(--primary-text)">Open browser to:</text>

  <rect x="720" y="40" width="520" height="165.714286" rx="6.106203" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.601817" font-weight="bold" fill="var(--warn-text)">localhost:4040</text>
  <text x="980" y="169.464286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" fill="var(--warn-text)">First Spark application</text>

  <rect x="720" y="247.142857" width="520" height="165.714286" rx="6.106203" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="319.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.601817" font-weight="bold" fill="var(--warn-text)">localhost:4041</text>
  <text x="980" y="376.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" fill="var(--warn-text)">Second application</text>

  <rect x="720" y="454.285714" width="520" height="165.714286" rx="6.106203" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="526.785714" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.601817" font-weight="bold" fill="var(--warn-text)">localhost:4042</text>
  <text x="980" y="583.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.35401" fill="var(--warn-text)">Third application</text>

  <line x1="400" y1="205.714286" x2="720" y2="122.857143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="330" x2="720" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="454.285714" x2="720" y2="537.142857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

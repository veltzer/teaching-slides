<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <!-- Full-area brand tile -->
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--warn-accent)" stroke="var(--warn-border)" stroke-width="4"/>

  <!-- Left panel: icon block -->
  <rect x="80" y="80" width="460" height="500" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="230" text-anchor="middle" font-size="120" font-weight="bold" fill="var(--warn-text)">G</text>
  <rect x="160" y="290" width="300" height="40" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <rect x="160" y="350" width="240" height="40" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <rect x="160" y="410" width="180" height="40" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <rect x="160" y="470" width="260" height="40" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="310" y="555" text-anchor="middle" font-size="18" fill="var(--warn-text)">dashboards</text>

  <!-- Right panel: wordmark + tagline -->
  <text x="600" y="260" font-size="140" font-weight="bold" fill="var(--warn-text)">Grafana</text>
  <rect x="600" y="290" width="600" height="8" rx="4" fill="var(--warn-text)"/>
  <text x="600" y="360" font-size="38" font-weight="bold" fill="var(--warn-text)">observability platform</text>
  <text x="600" y="420" font-size="26" fill="var(--warn-text)">metrics · logs · traces</text>
  <text x="600" y="470" font-size="24" fill="var(--warn-text)">datasource plugins</text>
  <text x="600" y="510" font-size="24" fill="var(--warn-text)">alerting and SLOs</text>
  <text x="600" y="560" font-size="20" fill="var(--warn-text)">open source · grafana.com</text>
</svg>

  <circle cx="72" cy="72" r="56" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <!-- Gauge marks -->
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.8">

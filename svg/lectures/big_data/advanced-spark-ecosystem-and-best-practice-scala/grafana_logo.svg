<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Full-area brand tile -->

  <!-- Left panel: icon block -->
  <rect x="40" y="40" width="492.857142857143" height="580" rx="6.689010176615" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="286.428571428571" y="214" text-anchor="middle" font-size="133.780203532297" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">G</text>
  <rect x="125.714285714286" y="283.6" width="321.428571428571" height="46.4" rx="6.689010176615" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <rect x="125.714285714286" y="353.2" width="257.142857142857" height="46.4" rx="6.689010176615" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <rect x="125.714285714286" y="422.8" width="192.857142857143" height="46.4" rx="6.689010176615" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <rect x="125.714285714286" y="492.4" width="278.571428571429" height="46.4" rx="6.689010176615" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="286.428571428571" y="591" text-anchor="middle" font-size="20.067030529845" fill="var(--warn-text)" font-family="Arial, sans-serif">dashboards</text>

  <!-- Right panel: wordmark + tagline -->
  <text x="597.142857142857" y="248.8" font-size="156.076904121013" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Grafana</text>
  <rect x="597.142857142857" y="283.6" width="642.857142857143" height="9.28" rx="4.459340117743" fill="var(--warn-text)"/>
  <text x="597.142857142857" y="364.8" font-size="42.363731118561" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">observability platform</text>
  <text x="597.142857142857" y="434.4" font-size="28.985710765331" fill="var(--warn-text)" font-family="Arial, sans-serif">metrics · logs · traces</text>
  <text x="597.142857142857" y="492.4" font-size="26.756040706459" fill="var(--warn-text)" font-family="Arial, sans-serif">datasource plugins</text>
  <text x="597.142857142857" y="538.8" font-size="26.756040706459" fill="var(--warn-text)" font-family="Arial, sans-serif">alerting and SLOs</text>
  <text x="597.142857142857" y="596.8" font-size="22.296700588716" fill="var(--warn-text)" font-family="Arial, sans-serif">open source · grafana.com</text>
</svg>

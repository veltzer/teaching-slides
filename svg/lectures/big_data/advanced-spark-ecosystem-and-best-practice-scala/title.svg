<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Spark lightning bolt -->
  <polygon points="350,60 310,180 360,180 320,300 420,150 370,150 400,60" fill="#e94560" opacity="0.9"/>
  <!-- Scala logo stylized staircase -->
  <g transform="translate(540,90)">
    <rect x="0" y="0" width="60" height="15" rx="2" fill="#dc322f"/>
    <rect x="0" y="20" width="60" height="15" rx="2" fill="#dc322f"/>
    <rect x="0" y="40" width="60" height="15" rx="2" fill="#dc322f"/>
    <rect x="0" y="60" width="60" height="15" rx="2" fill="#dc322f"/>
    <text x="30" y="100" text-anchor="middle" fill="#dc322f" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Scala</text>
  </g>
  <!-- Ecosystem nodes -->
  <circle cx="150" cy="150" r="30" fill="none" stroke="#00d2ff" stroke-width="2"/>
  <text x="150" y="155" text-anchor="middle" fill="#00d2ff" font-family="Arial,sans-serif" font-size="10">Delta</text>
  <circle cx="100" cy="250" r="30" fill="none" stroke="#0f3460" stroke-width="2"/>
  <text x="100" y="255" text-anchor="middle" fill="#0f3460" font-family="Arial,sans-serif" font-size="10">K8s</text>
  <circle cx="220" cy="270" r="30" fill="none" stroke="#533483" stroke-width="2"/>
  <text x="220" y="275" text-anchor="middle" fill="#533483" font-family="Arial,sans-serif" font-size="10">MLflow</text>
  <!-- Connecting lines -->
  <line x1="170" y1="170" x2="310" y2="180" stroke="#444" stroke-width="1" stroke-dasharray="4"/>
  <line x1="120" y1="265" x2="310" y2="200" stroke="#444" stroke-width="1" stroke-dasharray="4"/>
  <line x1="240" y1="260" x2="320" y2="210" stroke="#444" stroke-width="1" stroke-dasharray="4"/>
  <!-- Title -->
  <text x="400" y="350" text-anchor="middle" fill="#eee" font-family="Arial,sans-serif" font-size="26" font-weight="bold">Advanced Spark Ecosystem</text>
  <text x="400" y="380" text-anchor="middle" fill="#dc322f" font-family="Arial,sans-serif" font-size="18">Best Practices with Scala</text>
</svg>

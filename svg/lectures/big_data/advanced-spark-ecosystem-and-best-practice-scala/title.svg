<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <polygon points="565,127 505,301 580,301 520,475 670,257.5 595,257.5 640,127" fill="var(--danger-fill)" opacity="0.9"/>
  <g transform="translate(540,90)">
    <rect x="40" y="40" width="90" height="21.75" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="69" width="90" height="21.75" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="98" width="90" height="21.75" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="127" width="90" height="21.75" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="85" y="185" text-anchor="middle" fill="var(--danger-accent)" font-size="22.2471" font-weight="bold" font-family="Arial, sans-serif">Scala</text>
  </g>
  <circle cx="265" cy="257.5" r="41.7133" fill="none" stroke="var(--primary-border)" stroke-width="2.8444"/>
  <text x="265" y="264.75" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Arial, sans-serif">Delta</text>
  <circle cx="190" cy="402.5" r="41.7133" fill="none" stroke="var(--primary-border)" stroke-width="2.8444"/>
  <text x="190" y="409.75" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Arial, sans-serif">K8s</text>
  <circle cx="370" cy="431.5" r="41.7133" fill="none" stroke="var(--info-border)" stroke-width="2.8444"/>
  <text x="370" y="438.75" text-anchor="middle" fill="var(--info-accent)" font-size="13.9044" font-family="Arial, sans-serif">MLflow</text>
  <line x1="295" y1="286.5" x2="505" y2="301" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889"/>
  <line x1="220" y1="424.25" x2="505" y2="330" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889"/>
  <line x1="400" y1="417" x2="520" y2="344.5" stroke="var(--text)" stroke-width="1.4222" stroke-dasharray="5.6889"/>
  <text x="640" y="547.5" text-anchor="middle" fill="var(--surface)" font-size="36.1516" font-weight="bold" font-family="Arial, sans-serif">Advanced Spark Ecosystem</text>
  <text x="640" y="591" text-anchor="middle" fill="var(--danger-accent)" font-size="25.028" font-family="Arial, sans-serif">Best Practices with Scala</text>
</svg>

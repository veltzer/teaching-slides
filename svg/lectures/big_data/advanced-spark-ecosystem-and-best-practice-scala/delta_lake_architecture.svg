<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.873" font-weight="bold" fill="var(--text)">Delta Lake Architecture</text>

  <rect x="40" y="82.963" width="1200" height="96.6667" rx="6.2183" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" fill="var(--primary-text)">Spark DataFrame API</text>
  <text x="640" y="152.7778" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5093" fill="var(--primary-text)">df.write.format("delta").save(path)</text>

  <line x1="640" y1="179.6296" x2="640" y2="217.2222" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="222.5926" width="1200" height="118.1481" rx="6.2183" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="260.1852" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" fill="var(--ok-text)">Transaction Log (_delta_log/)</text>
  <text x="640" y="292.4074" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5093" fill="var(--ok-text)">ordered JSON commits: adds, removes, schema, stats</text>
  <text x="640" y="319.2593" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5093" fill="var(--ok-text)">readers see a consistent snapshot at commit N</text>

  <line x1="640" y1="340.7407" x2="640" y2="378.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="383.7037" width="1200" height="118.1481" rx="6.2183" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="421.2963" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6548" font-weight="bold" fill="var(--warn-text)">Parquet Data Files</text>
  <text x="640" y="453.5185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5093" fill="var(--warn-text)">immutable, column-chunked, stats-indexed</text>
  <text x="640" y="480.3704" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5093" fill="var(--warn-text)">writes create new files; old files stay until VACUUM</text>

  <rect x="40" y="534.0741" width="1200" height="85.9259" rx="6.2183" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="571.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5093" fill="var(--text)">ACID transactions · time travel · schema evolution · upserts · CDC</text>
  <text x="640" y="598.5185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.4729" fill="var(--text-muted)">Built on open Parquet — no vendor lock-in</text>
</svg>

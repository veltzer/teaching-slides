<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)">Delta Lake Architecture</text>

  <rect x="40" y="120" width="1200" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Spark DataFrame API</text>
  <text x="640" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">df.write.format("delta").save(path)</text>

  <line x1="640" y1="210" x2="640" y2="245" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="250" width="1200" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Transaction Log (_delta_log/)</text>
  <text x="640" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">ordered JSON commits: adds, removes, schema, stats</text>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">readers see a consistent snapshot at commit N</text>

  <line x1="640" y1="360" x2="640" y2="395" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="400" width="1200" height="110" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Parquet Data Files</text>
  <text x="640" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">immutable, column-chunked, stats-indexed</text>
  <text x="640" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">writes create new files; old files stay until VACUUM</text>

  <rect x="40" y="540" width="1200" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">ACID transactions · time travel · schema evolution · upserts · CDC</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Built on open Parquet — no vendor lock-in</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="39.047482" font-weight="bold" fill="var(--primary-accent)">Delta Lake Medallion Architecture</text>

  <!-- Bronze tier -->
  <rect x="40" y="130.980392" width="372.413793" height="432.156863" rx="15.185132" fill="var(--warn-accent)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="226.206897" y="199.215686" text-anchor="middle" font-family="Arial, sans-serif" font-size="43.386092" font-weight="bold" fill="var(--warn-text)">BRONZE</text>
  <text x="226.206897" y="244.705882" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.86235" fill="var(--warn-text)">Raw Data</text>
  <text x="226.206897" y="335.686275" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.693046" fill="var(--warn-text)">• Ingestion</text>
  <text x="226.206897" y="381.176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.693046" fill="var(--warn-text)">• Historical record</text>
  <text x="226.206897" y="426.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.693046" fill="var(--warn-text)">• Unvalidated</text>
  <text x="226.206897" y="506.27451" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.523741" font-style="italic" fill="var(--warn-text)">As-received from sources</text>

  <!-- Silver tier -->
  <rect x="453.793103" y="130.980392" width="372.413793" height="432.156863" rx="15.185132" fill="var(--border)" stroke="var(--text)" stroke-width="2"/>
  <text x="640" y="199.215686" text-anchor="middle" font-family="Arial, sans-serif" font-size="43.386092" font-weight="bold" fill="var(--bg)">SILVER</text>
  <text x="640" y="244.705882" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.86235" fill="var(--bg)">Refined Data</text>
  <text x="640" y="335.686275" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.693046" fill="var(--bg)">• Cleaned</text>
  <text x="640" y="381.176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.693046" fill="var(--bg)">• Deduplicated</text>
  <text x="640" y="426.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.693046" fill="var(--bg)">• Validated</text>
  <text x="640" y="506.27451" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.523741" font-style="italic" fill="var(--bg)">Joined &amp; conformed</text>

  <!-- Gold tier -->
  <rect x="867.586207" y="130.980392" width="372.413793" height="432.156863" rx="15.185132" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.793103" y="199.215686" text-anchor="middle" font-family="Arial, sans-serif" font-size="43.386092" font-weight="bold" fill="var(--warn-text)">GOLD</text>
  <text x="1053.793103" y="244.705882" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.86235" fill="var(--warn-text)">Business Data</text>
  <text x="1053.793103" y="335.686275" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.693046" fill="var(--warn-text)">• Aggregated</text>
  <text x="1053.793103" y="381.176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.693046" fill="var(--warn-text)">• Feature engineered</text>
  <text x="1053.793103" y="426.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.693046" fill="var(--warn-text)">• Analytics-ready</text>
  <text x="1053.793103" y="506.27451" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.523741" font-style="italic" fill="var(--warn-text)">Consumed by BI &amp; ML</text>

  <!-- Flow arrows between tiers -->
  <line x1="417.586207" y1="347.058824" x2="448.62069" y2="347.058824" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="831.37931" y1="347.058824" x2="862.413793" y2="347.058824" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="433.103448" y="324.313725" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.185132" fill="var(--text-muted)">clean</text>
  <text x="846.896552" y="324.313725" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.185132" fill="var(--text-muted)">aggregate</text>

  <!-- Bottom legend -->
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.693046" fill="var(--text-muted)">Each tier is a Delta Lake table; data flows left to right with increasing quality &amp; semantics.</text>
</svg>

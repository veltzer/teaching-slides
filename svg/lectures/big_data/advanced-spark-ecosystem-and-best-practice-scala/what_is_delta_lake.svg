<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="var(--primary-text)">Delta Lake</text>
  <text x="640" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Open-source storage layer that brings ACID transactions to data lakes</text>

  <rect x="40" y="160" width="390" height="220" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">ACID Transactions</text>
  <text x="235" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Atomic commits via transaction log</text>
  <text x="235" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Concurrent readers and writers</text>
  <text x="235" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Snapshot isolation out of the box</text>
  <text x="235" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Crash-safe upserts and deletes</text>

  <rect x="445" y="160" width="390" height="220" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Time Travel</text>
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Query any past version by id</text>
  <text x="640" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Query by timestamp</text>
  <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Audit changes, reproduce reports</text>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Rollback in one command</text>

  <rect x="850" y="160" width="390" height="220" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Schema Evolution</text>
  <text x="1045" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Enforce schema on write</text>
  <text x="1045" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Evolve safely with mergeSchema</text>
  <text x="1045" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Bad data never lands silently</text>
  <text x="1045" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Column adds, renames, type widening</text>

  <rect x="40" y="400" width="590" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Built on Parquet + JSON Log</text>
  <text x="335" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Parquet data files stay readable by any engine</text>
  <text x="335" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">_delta_log records every transaction as JSON</text>
  <text x="335" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Periodic checkpoints keep metadata fast</text>
  <text x="335" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Stats enable data skipping and Z-order</text>
  <text x="335" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Works on S3, ADLS, GCS, HDFS, local disk</text>

  <rect x="650" y="400" width="590" height="220" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Unified Batch + Streaming</text>
  <text x="945" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Same table serves both workloads</text>
  <text x="945" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Structured Streaming reads changes</text>
  <text x="945" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">MERGE INTO for upserts and CDC</text>
  <text x="945" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Exactly-once semantics on writes</text>
  <text x="945" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Foundation of the lakehouse pattern</text>
</svg>

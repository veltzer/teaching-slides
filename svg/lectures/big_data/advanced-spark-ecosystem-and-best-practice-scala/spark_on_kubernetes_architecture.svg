<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg);height: 400px; display: block; margin: auto;">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="56.571429" width="1200" height="563.428571" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.0952 6.0952" rx="6.857143"/>
  <text x="639.999886" y="40" font-family="Arial, sans-serif" font-size="25.425257" font-weight="bold" text-anchor="middle" fill="var(--primary-accent)">Kubernetes Cluster</text>
  <rect x="125.714286" y="106.285714" width="205.714286" height="82.857143" fill="url(#grad-primary)" rx="6.857143" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.571429" y="156" font-family="Arial, sans-serif" font-size="22.247086" text-anchor="middle" fill="var(--bg)">API Server</text>
  <g transform="translate(300, 120)">
    <rect x="-45.714286" y="6.857143" width="342.857143" height="132.571429" fill="url(#grad-danger)" rx="6.857143" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="125.714286" y="48.285714" font-family="Arial, sans-serif" font-size="22.247086" text-anchor="middle" fill="var(--bg)" font-weight="bold">Driver Pod</text>
    <rect x="-28.571429" y="64.857143" width="308.571429" height="58" fill="url(#grad-danger)" rx="6.857143" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="125.714286" y="102.971429" font-family="Arial, sans-serif" font-size="19.069029" text-anchor="middle" fill="var(--bg)">Spark Driver</text>
  </g>
  <g transform="translate(100, 240)">
    <rect x="-45.714286" y="6.857143" width="257.142743" height="132.571429" fill="url(#grad-primary)" rx="6.857143" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="82.857143" y="48.285714" font-family="Arial, sans-serif" font-size="22.247086" text-anchor="middle" fill="var(--bg)" font-weight="bold">Executor Pod 1</text>
    <rect x="-28.571429" y="64.857143" width="222.857143" height="58" fill="url(#grad-primary)" rx="6.857143" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="82.857143" y="102.971429" font-family="Arial, sans-serif" font-size="19.069029" text-anchor="middle" fill="var(--bg)">Spark Executor</text>
  </g>
  <g transform="translate(275, 240)">
    <rect x="-45.714286" y="6.857143" width="257.142743" height="132.571429" fill="url(#grad-primary)" rx="6.857143" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="82.857143" y="48.285714" font-family="Arial, sans-serif" font-size="22.247086" text-anchor="middle" fill="var(--bg)" font-weight="bold">Executor Pod 2</text>
    <rect x="-28.571429" y="64.857143" width="222.857143" height="58" fill="url(#grad-primary)" rx="6.857143" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="82.857143" y="102.971429" font-family="Arial, sans-serif" font-size="19.069029" text-anchor="middle" fill="var(--bg)">Spark Executor</text>
  </g>
  <g transform="translate(450, 240)">
    <rect x="-45.714286" y="6.857143" width="257.142743" height="132.571429" fill="url(#grad-primary)" rx="6.857143" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="82.857143" y="48.285714" font-family="Arial, sans-serif" font-size="22.247086" text-anchor="middle" fill="var(--bg)" font-weight="bold">Executor Pod N</text>
    <rect x="-28.571429" y="64.857143" width="222.857143" height="58" fill="url(#grad-primary)" rx="6.857143" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="82.857143" y="102.971429" font-family="Arial, sans-serif" font-size="19.069029" text-anchor="middle" fill="var(--bg)">Spark Executor</text>
  </g>
  <path d="M 331.428571 147.714286 L 468.571429 238.857143" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <path d="M 639.999886 338.285714 L 254.285714 404.571543" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <path d="M 639.999886 338.285714 L 554.285714 404.571543" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <path d="M 639.999886 338.285714 L 854.285714 404.571543" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="382.857143" y="189.142857" font-family="Arial, sans-serif" font-size="17.479886" fill="var(--text-muted)">Submit</text>
  <text x="502.857143" y="379.714286" font-family="Arial, sans-serif" font-size="17.479886" fill="var(--text-muted)">Schedule</text>
</svg>
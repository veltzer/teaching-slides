<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="height: 400px; display: block; margin: auto;">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect width="1200" height="580" fill="var(--surface)" rx="6" x="40" y="40"/>
  <rect x="115" y="83.5" width="1050" height="493" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6.0952 6.0952" rx="6"/>
  <text x="639.9999" y="69" font-family="Arial, sans-serif" font-size="22.2471" font-weight="bold" text-anchor="middle" fill="var(--primary-accent)">Kubernetes Cluster</text>
  <rect x="190" y="127" width="180" height="72.5" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="280" y="170.5" font-family="Arial, sans-serif" font-size="19.4662" text-anchor="middle" fill="var(--bg)">API Server</text>
  <g transform="translate(300, 120)">
    <rect x="40" y="40" width="300" height="116" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
    <text x="190" y="76.25" font-family="Arial, sans-serif" font-size="19.4662" text-anchor="middle" fill="var(--bg)" font-weight="bold">Driver Pod</text>
    <rect x="55" y="90.75" width="270" height="50.75" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
    <text x="190" y="124.1" font-family="Arial, sans-serif" font-size="16.6854" text-anchor="middle" fill="var(--bg)">Spark Driver</text>
  </g>
  <g transform="translate(100, 240)">
    <rect x="40" y="40" width="224.9999" height="116" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="152.5" y="76.25" font-family="Arial, sans-serif" font-size="19.4662" text-anchor="middle" fill="var(--bg)" font-weight="bold">Executor Pod 1</text>
    <rect x="55" y="90.75" width="195" height="50.75" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="152.5" y="124.1" font-family="Arial, sans-serif" font-size="16.6854" text-anchor="middle" fill="var(--bg)">Spark Executor</text>
  </g>
  <g transform="translate(275, 240)">
    <rect x="40" y="40" width="224.9999" height="116" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="152.5" y="76.25" font-family="Arial, sans-serif" font-size="19.4662" text-anchor="middle" fill="var(--bg)" font-weight="bold">Executor Pod 2</text>
    <rect x="55" y="90.75" width="195" height="50.75" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="152.5" y="124.1" font-family="Arial, sans-serif" font-size="16.6854" text-anchor="middle" fill="var(--bg)">Spark Executor</text>
  </g>
  <g transform="translate(450, 240)">
    <rect x="40" y="40" width="224.9999" height="116" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="152.5" y="76.25" font-family="Arial, sans-serif" font-size="19.4662" text-anchor="middle" fill="var(--bg)" font-weight="bold">Executor Pod N</text>
    <rect x="55" y="90.75" width="195" height="50.75" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
    <text x="152.5" y="124.1" font-family="Arial, sans-serif" font-size="16.6854" text-anchor="middle" fill="var(--bg)">Spark Executor</text>
  </g>
  <path d="M 370 163.25 L 490 243" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <path d="M 639.9999 330 L 302.5 388.0001" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <path d="M 639.9999 330 L 565 388.0001" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <path d="M 639.9999 330 L 827.5 388.0001" stroke="var(--text)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="415" y="199.5" font-family="Arial, sans-serif" font-size="15.2949" fill="var(--text-muted)">Submit</text>
  <text x="520" y="366.25" font-family="Arial, sans-serif" font-size="15.2949" fill="var(--text-muted)">Schedule</text>
</svg>
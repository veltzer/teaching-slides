<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <g transform="translate(130,140)">
    <rect width="150" height="43.5" rx="6" fill="url(#grad-danger)" opacity="0.8" stroke="var(--danger-border)" stroke-width="2" x="40" y="40" filter="url(#shadow)"/>
    <rect y="90.75" width="150" height="43.5" rx="6" fill="url(#grad-danger)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2" x="40" filter="url(#shadow)"/>
    <rect y="141.5" width="150" height="43.5" rx="6" fill="url(#grad-danger)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2" x="40" filter="url(#shadow)"/>
    <text x="115" y="156" text-anchor="middle" font-size="16.6854" fill="var(--surface)" font-family="Arial, sans-serif">Scala</text>
  </g>
  <line x1="415" y1="330" x2="505" y2="330" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.1111 4.2667" />
  <polygon points="505,322.75 523,330 505,337.25" fill="var(--ok-fill)" />
  <rect x="535" y="199.5" width="375" height="261" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="722.5" y="235.75" text-anchor="middle" font-size="16.6854" fill="var(--ok-accent)" font-family="Courier New, monospace">Dataset[Person]</text>
  <line x1="550" y1="250.25" x2="895" y2="250.25" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.5" />
  <text x="595" y="279.25" text-anchor="middle" font-size="15.2948" fill="var(--warn-accent)" font-family="Courier New, monospace">name</text>
  <text x="715" y="279.25" text-anchor="middle" font-size="15.2948" fill="var(--warn-accent)" font-family="Courier New, monospace">age</text>
  <text x="835" y="279.25" text-anchor="middle" font-size="15.2948" fill="var(--warn-accent)" font-family="Courier New, monospace">city</text>
  <line x1="550" y1="293.75" x2="895" y2="293.75" stroke="var(--text-faint)" stroke-width="0.7111" />
  <text x="595" y="322.75" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Courier New, monospace">"Alice"</text>
  <text x="715" y="322.75" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Courier New, monospace">30</text>
  <text x="835" y="322.75" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Courier New, monospace">"NYC"</text>
  <text x="595" y="351.75" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Courier New, monospace">"Bob"</text>
  <text x="715" y="351.75" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Courier New, monospace">25</text>
  <text x="835" y="351.75" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Courier New, monospace">"SF"</text>
  <text x="595" y="380.75" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Courier New, monospace">"Eve"</text>
  <text x="715" y="380.75" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Courier New, monospace">28</text>
  <text x="835" y="380.75" text-anchor="middle" font-size="13.9044" fill="var(--border)" font-family="Courier New, monospace">"LA"</text>
  <rect x="557.5" y="409.75" width="120" height="31.9" rx="6" fill="url(#grad-ok)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="617.5" y="431.5" text-anchor="middle" font-size="13.9044" fill="var(--ok-accent)" font-family="Courier New, monospace">type-safe</text>
  <polygon points="1030,301 1067.5,264.75 1105,301 1067.5,337.25" fill="none" stroke="var(--warn-border)" stroke-width="2.8444" />
  <polygon points="1041.9999,301 1067.5,276.35 1093,301 1067.5,325.65" fill="var(--warn-fill)" opacity="0.3" />
  <text x="640" y="112.5" text-anchor="middle" font-size="36.1516" font-weight="bold" fill="var(--surface)" font-family="Arial, sans-serif">Spark Scala Datasets</text>
  <text x="640" y="583.75" text-anchor="middle" font-size="18.0758" fill="var(--text-muted)" font-family="Courier New, monospace">typed collections | compile-time safety | distributed</text>
</svg>
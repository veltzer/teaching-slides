<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--code-bg)" rx="6"/>
  <g transform="translate(130,140)">
    <rect width="142.2222" height="48" rx="6" fill="var(--danger-fill)" opacity="0.8" stroke="var(--danger-border)" stroke-width="2"/>
    <rect y="56" width="142.2222" height="48" rx="6" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2"/>
    <rect y="112" width="142.2222" height="48" rx="6" fill="var(--danger-fill)" opacity="0.4" stroke="var(--danger-border)" stroke-width="2"/>
    <text x="71.1111" y="128" text-anchor="middle" font-family="sans-serif" font-size="17.0667" fill="var(--surface)">Scala</text>
  </g>
  <line x1="355.5556" y1="320" x2="440.8889" y2="320" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.1111 4.2667" />
  <polygon points="440.8889,312 457.9556,320 440.8889,328" fill="var(--ok-fill)" />
  <rect x="469.3333" y="176" width="355.5556" height="288" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="647.1111" y="216" text-anchor="middle" font-family="monospace" font-size="17.0667" fill="var(--ok-accent)">Dataset[Person]</text>
  <line x1="483.5556" y1="232" x2="810.6667" y2="232" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.5" />
  <text x="526.2222" y="264" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--warn-accent)">name</text>
  <text x="640" y="264" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--warn-accent)">age</text>
  <text x="753.7778" y="264" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--warn-accent)">city</text>
  <line x1="483.5556" y1="280" x2="810.6667" y2="280" stroke="var(--text-faint)" stroke-width="0.7111" />
  <text x="526.2222" y="312" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--border)">"Alice"</text>
  <text x="640" y="312" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--border)">30</text>
  <text x="753.7778" y="312" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--border)">"NYC"</text>
  <text x="526.2222" y="344" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--border)">"Bob"</text>
  <text x="640" y="344" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--border)">25</text>
  <text x="753.7778" y="344" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--border)">"SF"</text>
  <text x="526.2222" y="376" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--border)">"Eve"</text>
  <text x="640" y="376" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--border)">28</text>
  <text x="753.7778" y="376" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--border)">"LA"</text>
  <rect x="490.6667" y="408" width="113.7778" height="35.2" rx="6" fill="var(--ok-fill)" opacity="0.2" stroke="var(--ok-border)" stroke-width="2" />
  <text x="547.5556" y="432" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)">type-safe</text>
  <polygon points="938.6667,288 974.2222,248 1009.7778,288 974.2222,328" fill="none" stroke="var(--warn-border)" stroke-width="2.8444" />
  <polygon points="950.0444,288 974.2222,260.8 998.4,288 974.2222,315.2" fill="var(--warn-fill)" opacity="0.3" />
  <text x="568.8889" y="80" text-anchor="middle" font-family="sans-serif" font-size="36.9778" font-weight="bold" fill="var(--surface)">Spark Scala Datasets</text>
  <text x="568.8889" y="600" text-anchor="middle" font-family="monospace" font-size="18.4889" fill="var(--text-muted)">typed collections | compile-time safety | distributed</text>
</svg>
<svg width="600" height="250" xmlns="http://www.w3.org/2000/svg">
  <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Latency Comparison</text>
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="12" fill="#333">Local Call (in-process):</text>
  <rect x="50" y="70" width="30" height="20" fill="#51cf66" rx="3"/>
  <text x="90" y="85" font-family="Arial, sans-serif" font-size="11" fill="#888">~0.0001 ms</text>
  <text x="50" y="115" font-family="Arial, sans-serif" font-size="12" fill="#333">Same datacenter:</text>
  <rect x="50" y="125" width="150" height="20" fill="#ffc107" rx="3"/>
  <text x="210" y="140" font-family="Arial, sans-serif" font-size="11" fill="#888">~0.5 ms</text>
  <text x="50" y="170" font-family="Arial, sans-serif" font-size="12" fill="#333">Cross-region:</text>
  <rect x="50" y="180" width="400" height="20" fill="#ff6b6b" rx="3"/>
  <text x="460" y="195" font-family="Arial, sans-serif" font-size="11" fill="#888">~100 ms</text>
  <line x1="50" y1="215" x2="500" y2="215" stroke="#ccc" stroke-width="1"/>
  <text x="275" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333" font-weight="bold">Network calls can be 1,000,000x slower than local calls</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- GCC Logo stylized gear -->
  <circle cx="150" cy="200" r="70" fill="none" stroke="#e74c3c" stroke-width="4"/>
  <circle cx="150" cy="200" r="45" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <circle cx="150" cy="200" r="20" fill="#e74c3c" opacity="0.3"/>
  <!-- Gear teeth -->
  <rect x="135" y="120" width="30" height="20" rx="3" fill="#e74c3c"/>
  <rect x="135" y="260" width="30" height="20" rx="3" fill="#e74c3c"/>
  <rect x="70" y="185" width="20" height="30" rx="3" fill="#e74c3c"/>
  <rect x="210" y="185" width="20" height="30" rx="3" fill="#e74c3c"/>
  <!-- Optimization levels as ascending bars -->
  <rect x="300" y="300" width="80" height="60" rx="4" fill="#2ecc71" opacity="0.4"/>
  <text x="340" y="340" text-anchor="middle" fill="white" font-family="monospace" font-size="16">-O0</text>
  <rect x="400" y="240" width="80" height="120" rx="4" fill="#2ecc71" opacity="0.6"/>
  <text x="440" y="340" text-anchor="middle" fill="white" font-family="monospace" font-size="16">-O1</text>
  <rect x="500" y="170" width="80" height="190" rx="4" fill="#2ecc71" opacity="0.8"/>
  <text x="540" y="340" text-anchor="middle" fill="white" font-family="monospace" font-size="16">-O2</text>
  <rect x="600" y="100" width="80" height="260" rx="4" fill="#2ecc71"/>
  <text x="640" y="340" text-anchor="middle" fill="white" font-family="monospace" font-size="16">-O3</text>
  <!-- Speed arrow -->
  <line x1="280" y1="80" x2="720" y2="80" stroke="#f39c12" stroke-width="2"/>
  <polygon points="720,80 705,72 705,88" fill="#f39c12"/>
  <text x="500" y="70" text-anchor="middle" fill="#f39c12" font-family="Arial" font-size="13">Performance</text>
  <!-- CPU icon -->
  <rect x="700" y="140" width="60" height="60" rx="4" fill="none" stroke="#3498db" stroke-width="2"/>
  <rect x="712" y="152" width="36" height="36" rx="2" fill="#3498db" opacity="0.3"/>
  <!-- CPU pins -->
  <line x1="710" y1="130" x2="710" y2="140" stroke="#3498db" stroke-width="2"/>
  <line x1="730" y1="130" x2="730" y2="140" stroke="#3498db" stroke-width="2"/>
  <line x1="750" y1="130" x2="750" y2="140" stroke="#3498db" stroke-width="2"/>
  <line x1="710" y1="200" x2="710" y2="210" stroke="#3498db" stroke-width="2"/>
  <line x1="730" y1="200" x2="730" y2="210" stroke="#3498db" stroke-width="2"/>
  <line x1="750" y1="200" x2="750" y2="210" stroke="#3498db" stroke-width="2"/>
</svg>
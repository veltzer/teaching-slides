<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#0d1117" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <circle cx="213.3333" cy="320" r="99.5556" fill="none" stroke="var(--danger-border)" stroke-width="5.6889" />
  <circle cx="213.3333" cy="320" r="64" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" />
  <circle cx="213.3333" cy="320" r="28.4444" fill="var(--danger-fill)" opacity="0.3" />
  <rect x="192" y="192" width="42.6667" height="32" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="192" y="416" width="42.6667" height="32" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="99.5556" y="296" width="28.4444" height="48" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="298.6667" y="296" width="28.4444" height="48" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="426.6667" y="480" width="113.7778" height="96" rx="6" fill="var(--ok-fill)" opacity="0.4" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="483.5556" y="544" text-anchor="middle" fill="var(--bg)" font-family="monospace" font-size="22.7556">-O0</text>
  <rect x="568.8889" y="384" width="113.7778" height="192" rx="6" fill="var(--ok-fill)" opacity="0.6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="625.7778" y="544" text-anchor="middle" fill="var(--bg)" font-family="monospace" font-size="22.7556">-O1</text>
  <rect x="711.1111" y="272" width="113.7778" height="304" rx="6" fill="var(--ok-fill)" opacity="0.8" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="768" y="544" text-anchor="middle" fill="var(--bg)" font-family="monospace" font-size="22.7556">-O2</text>
  <rect x="853.3333" y="160" width="113.7778" height="416" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="910.2222" y="544" text-anchor="middle" fill="var(--bg)" font-family="monospace" font-size="22.7556">-O3</text>
  <line x1="398.2222" y1="128" x2="1024" y2="128" stroke="var(--warn-border)" stroke-width="2" />
  <polygon points="1024,128 1002.6667,115.2 1002.6667,140.8" fill="var(--warn-fill)" />
  <text x="711.1111" y="112" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial" font-size="18.4889">Performance</text>
  <rect x="995.5556" y="224" width="85.3333" height="96" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <rect x="1012.6222" y="243.2" width="51.2" height="57.6" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1009.7778" y1="208" x2="1009.7778" y2="224" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1038.2222" y1="208" x2="1038.2222" y2="224" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1066.6667" y1="208" x2="1066.6667" y2="224" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1009.7778" y1="320" x2="1009.7778" y2="336" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1038.2222" y1="320" x2="1038.2222" y2="336" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1066.6667" y1="320" x2="1066.6667" y2="336" stroke="var(--primary-border)" stroke-width="2" />
</svg>
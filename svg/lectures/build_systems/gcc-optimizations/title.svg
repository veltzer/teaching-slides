<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <circle cx="265" cy="330" r="97.3311" fill="none" stroke="var(--danger-border)" stroke-width="5.6889"/>
  <circle cx="265" cy="330" r="62.57" fill="none" stroke="var(--danger-border)" stroke-width="4.2667"/>
  <circle cx="265" cy="330" r="27.8088" fill="var(--danger-fill)" opacity="0.3"/>
  <rect x="242.5" y="214" width="45" height="29" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="242.5" y="417" width="45" height="29" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="145" y="308.25" width="30" height="43.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="355" y="308.25" width="30" height="43.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="490" y="475" width="120" height="87" rx="6" fill="url(#grad-ok)" opacity="0.4" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="533" text-anchor="middle" fill="var(--bg)" font-size="22.2471" font-family="Courier New, monospace">-O0</text>
  <rect x="640" y="388" width="120" height="174" rx="6" fill="url(#grad-ok)" opacity="0.6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="533" text-anchor="middle" fill="var(--bg)" font-size="22.2471" font-family="Courier New, monospace">-O1</text>
  <rect x="790" y="286.5" width="120" height="275.5" rx="6" fill="url(#grad-ok)" opacity="0.8" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="533" text-anchor="middle" fill="var(--bg)" font-size="22.2471" font-family="Courier New, monospace">-O2</text>
  <rect x="939.9999" y="185" width="120" height="377" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="533" text-anchor="middle" fill="var(--bg)" font-size="22.2471" font-family="Courier New, monospace">-O3</text>
  <line x1="460" y1="156" x2="1120" y2="156" stroke="var(--warn-border)" stroke-width="2"/>
  <polygon points="1120,156 1097.5,144.4 1097.5,167.6" fill="var(--warn-fill)"/>
  <text x="790" y="141.5" text-anchor="middle" fill="var(--warn-accent)" font-size="18.0758" font-family="Arial, sans-serif">Performance</text>
  <rect x="1090" y="243" width="90" height="87" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <rect x="1108" y="260.4" width="54" height="52.2" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="1105" y1="228.5" x2="1105" y2="243" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1135" y1="228.5" x2="1135" y2="243" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1165" y1="228.5" x2="1165" y2="243" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1105" y1="330" x2="1105" y2="344.5" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1135" y1="330" x2="1135" y2="344.5" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1165" y1="330" x2="1165" y2="344.5" stroke="var(--primary-border)" stroke-width="2"/>
</svg>

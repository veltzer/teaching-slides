<svg viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Traditional I/O vs io_uring</text>
  <!-- Traditional I/O section -->
  <text x="210" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc3545">Traditional I/O (Blocking)</text>
  <rect x="60" y="80" width="130" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="125" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Application</text>
  <!-- Arrow: App -> read/write (system call) -->
  <line x1="190" y1="102" x2="235" y2="102" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="213" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">syscall</text>
  <rect x="240" y="80" width="130" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="305" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">read() / write()</text>
  <!-- Arrow: read/write -> Kernel (wait) -->
  <line x1="305" y1="125" x2="305" y2="175" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="325" y="155" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">wait</text>
  <rect x="240" y="180" width="130" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="305" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Kernel</text>
  <!-- Arrow: Kernel -> Application (data, loops back) -->
  <path d="M 240,202 Q 30,202 30,102 L 55,102" fill="none" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="20" y="155" font-family="Arial, sans-serif" font-size="10" fill="#4a90e2">data</text>
  <!-- Blocking indicator -->
  <rect x="100" y="260" width="250" height="30" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="225" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc3545">Thread blocked during each I/O operation</text>
  <!-- Divider -->
  <line x1="425" y1="55" x2="425" y2="390" stroke="#ccc" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- io_uring section -->
  <text x="640" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#28a745">io_uring (Async, Batched)</text>
  <rect x="470" y="80" width="130" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="535" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Application</text>
  <!-- Arrow: App -> SQ (submit) -->
  <line x1="600" y1="102" x2="645" y2="102" stroke="#28a745" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <text x="623" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#28a745">submit</text>
  <rect x="650" y="80" width="150" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="725" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Submission</text>
  <text x="725" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Queue (SQ)</text>
  <!-- Arrow: SQ -> Kernel (batch) -->
  <line x1="725" y1="125" x2="725" y2="175" stroke="#28a745" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <text x="748" y="155" font-family="Arial, sans-serif" font-size="10" fill="#28a745">batch</text>
  <rect x="660" y="180" width="130" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="725" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Kernel</text>
  <!-- Arrow: Kernel -> CQ (complete) -->
  <line x1="660" y1="202" x2="610" y2="202" stroke="#28a745" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <rect x="460" y="180" width="150" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="535" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Completion</text>
  <text x="535" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Queue (CQ)</text>
  <!-- Arrow: CQ -> Application (poll) -->
  <line x1="535" y1="180" x2="535" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="555" y="160" font-family="Arial, sans-serif" font-size="10" fill="#4a90e2">poll</text>
  <!-- Async indicator -->
  <rect x="490" y="260" width="280" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="630" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">App continues working; no blocking needed</text>
  <!-- Key differences at bottom -->
  <rect x="50" y="320" width="750" height="65" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="425" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Key Advantages of io_uring</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">No per-op syscall overhead</text>
  <text x="425" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Batched submissions</text>
  <text x="650" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Shared memory rings</text>
</svg>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Scala logo stylized -->
  <g transform="translate(130,140)">
    <rect width="100" height="30" rx="3" fill="#e94560" opacity="0.8"/>
    <rect y="35" width="100" height="30" rx="3" fill="#e94560" opacity="0.6"/>
    <rect y="70" width="100" height="30" rx="3" fill="#e94560" opacity="0.4"/>
    <text x="50" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#eee">Scala</text>
  </g>
  <!-- Arrow -->
  <line x1="250" y1="200" x2="310" y2="200" stroke="#16c79a" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="310,195 322,200 310,205" fill="#16c79a"/>
  <!-- Dataset table -->
  <rect x="330" y="110" width="250" height="180" rx="8" fill="#0f3460" stroke="#16c79a" stroke-width="2"/>
  <text x="455" y="135" text-anchor="middle" font-family="monospace" font-size="12" fill="#16c79a">Dataset[Person]</text>
  <line x1="340" y1="145" x2="570" y2="145" stroke="#16c79a" stroke-width="1" opacity="0.5"/>
  <!-- Column headers -->
  <text x="370" y="165" text-anchor="middle" font-family="monospace" font-size="11" fill="#f5a623">name</text>
  <text x="450" y="165" text-anchor="middle" font-family="monospace" font-size="11" fill="#f5a623">age</text>
  <text x="530" y="165" text-anchor="middle" font-family="monospace" font-size="11" fill="#f5a623">city</text>
  <line x1="340" y1="175" x2="570" y2="175" stroke="#888" stroke-width="0.5"/>
  <!-- Rows -->
  <text x="370" y="195" text-anchor="middle" font-family="monospace" font-size="10" fill="#ccc">"Alice"</text>
  <text x="450" y="195" text-anchor="middle" font-family="monospace" font-size="10" fill="#ccc">30</text>
  <text x="530" y="195" text-anchor="middle" font-family="monospace" font-size="10" fill="#ccc">"NYC"</text>
  <text x="370" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#ccc">"Bob"</text>
  <text x="450" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#ccc">25</text>
  <text x="530" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#ccc">"SF"</text>
  <text x="370" y="235" text-anchor="middle" font-family="monospace" font-size="10" fill="#ccc">"Eve"</text>
  <text x="450" y="235" text-anchor="middle" font-family="monospace" font-size="10" fill="#ccc">28</text>
  <text x="530" y="235" text-anchor="middle" font-family="monospace" font-size="10" fill="#ccc">"LA"</text>
  <!-- Type safety badge -->
  <rect x="345" y="255" width="80" height="22" rx="11" fill="#16c79a" opacity="0.2" stroke="#16c79a" stroke-width="1"/>
  <text x="385" y="270" text-anchor="middle" font-family="monospace" font-size="10" fill="#16c79a">type-safe</text>
  <!-- Spark diamond -->
  <polygon points="660,180 685,155 710,180 685,205" fill="none" stroke="#f5a623" stroke-width="2"/>
  <polygon points="668,180 685,163 702,180 685,197" fill="#f5a623" opacity="0.3"/>
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#eee">Spark Scala Datasets</text>
  <text x="400" y="375" text-anchor="middle" font-family="monospace" font-size="13" fill="#666">typed collections | compile-time safety | distributed</text>
</svg>

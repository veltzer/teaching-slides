<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.6528" font-weight="bold" fill="var(--text)">AP Systems (Availability + Partition Tolerance)</text>
  <rect x="500" y="70.9334" width="280" height="69.6001" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="114.24" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8412" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="40" y="225.6001" width="320" height="123.7334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="200" y="268.9067" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--ok-accent)">Node A</text>
  <text x="200" y="299.84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7323" fill="var(--text-muted)">Data v1</text>
  <text x="200" y="330.7733" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0294" fill="var(--ok-accent)">AVAILABLE</text>
  <rect x="479.9999" y="225.6001" width="320" height="123.7334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="268.9067" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--ok-accent)">Node B</text>
  <text x="640" y="299.84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7323" fill="var(--text-muted)">Data v1</text>
  <text x="640" y="330.7733" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0294" fill="var(--ok-accent)">AVAILABLE</text>
  <rect x="920" y="225.6001" width="320" height="123.7334" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1079.9999" y="268.9067" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--ok-accent)">Node C</text>
  <text x="1079.9999" y="299.84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7323" fill="var(--text-muted)">Data v1 (stale)</text>
  <text x="1079.9999" y="330.7733" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0294" fill="var(--ok-accent)">AVAILABLE</text>
  <line x1="560" y1="140.5333" x2="239.9999" y2="222.5067" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="140.5333" x2="640" y2="222.5067" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="140.5333" x2="1040" y2="222.5067" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="359.9999" y1="279.7334" x2="475.9999" y2="279.7334" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.9012 4.7408" marker-end="url(#arrow)"/>
  <line x1="800" y1="279.7334" x2="916" y2="279.7334" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.9012 4.7408" marker-end="url(#arrow)"/>
  <rect x="819.9999" y="256.5334" width="80" height="30.9333" fill="var(--bg)" stroke="none" rx="6"/>
  <text x="860" y="278.1867" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.2471" fill="var(--danger-accent)">X</text>
  <text x="860" y="217.8667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0294" fill="var(--danger-accent)">partition</text>
  <rect x="239.9999" y="411.1999" width="800" height="85.0667" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="446.7733" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--warn-accent)">Eventual Consistency</text>
  <text x="640" y="477.7067" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7323" fill="var(--text-muted)">All nodes converge to same state after partition heals</text>
  <rect x="99.9999" y="542.6666" width="300" height="77.3334" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="249.9999" y="589.0667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--text)">Cassandra</text>
  <rect x="479.9999" y="542.6666" width="300" height="77.3334" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.9999" y="589.0667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--text)">DynamoDB</text>
  <rect x="860" y="542.6666" width="300" height="77.3334" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1009.9999" y="589.0667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--text)">CouchDB</text>
</svg>

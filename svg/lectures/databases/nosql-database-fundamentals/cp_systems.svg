<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-cp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="sync-cp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.4,0" fill="#4caf50" />
    </marker>
  </defs>
  <text x="589.9589" y="47.4074" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.4444" font-weight="bold" fill="var(--text)">CP Systems (Consistency + Partition Tolerance)</text>
  <rect x="471.9671" y="79.0124" width="235.9835" height="71.1112" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="589.9589" y="123.2593" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1235" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="84.2799" y="237.0371" width="269.6955" height="126.4198" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="219.1276" y="276.5432" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5432" font-weight="bold" fill="var(--primary-accent)">Leader Node</text>
  <text x="219.1276" y="312.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" fill="var(--text-muted)">Data v2 (latest)</text>
  <text x="219.1276" y="344.4938" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--primary-accent)">CONSISTENT</text>
  <rect x="455.1111" y="237.0371" width="269.6955" height="126.4198" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="589.9589" y="276.5432" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5432" font-weight="bold" fill="var(--primary-accent)">Follower Node</text>
  <text x="589.9589" y="312.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" fill="var(--text-muted)">Data v2 (synced)</text>
  <text x="589.9589" y="344.4938" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--primary-accent)">CONSISTENT</text>
  <rect x="825.9424" y="237.0371" width="269.6955" height="126.4198" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="960.7901" y="276.5432" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5432" font-weight="bold" fill="var(--danger-accent)">Follower Node</text>
  <text x="960.7901" y="312.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" fill="var(--text-muted)">Data v1 (stale)</text>
  <text x="960.7901" y="344.4938" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--danger-accent)">UNAVAILABLE</text>
  <line x1="522.535" y1="150.1234" x2="252.8395" y2="233.8766" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-cp)" />
  <line x1="657.3828" y1="150.1234" x2="927.0782" y2="233.8766" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.9012 4.7408" />
  <text x="859.6543" y="181.7284" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--danger-accent)">rejected</text>
  <line x1="353.9753" y1="292.3457" x2="451.7399" y2="292.3457" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#sync-cp)" />
  <text x="404.5432" y="276.5432" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--ok-accent)">sync</text>
  <rect x="741.6625" y="268.642" width="67.4239" height="31.6049" fill="var(--bg)" stroke="none" rx="6"/>
  <text x="775.3745" y="290.7655" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.284" fill="var(--danger-accent)">X</text>
  <text x="775.3745" y="229.1358" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8025" fill="var(--danger-accent)">partition</text>
  <rect x="252.8395" y="426.6666" width="674.2387" height="86.9136" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="589.9589" y="463.0123" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5432" font-weight="bold" fill="var(--primary-accent)">Strong Consistency</text>
  <text x="589.9589" y="494.6173" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3827" fill="var(--text-muted)">Refuses requests to partitioned nodes to guarantee consistency</text>
  <rect x="134.8477" y="560.9876" width="252.8395" height="79.0124" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="261.2675" y="608.3951" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5432" font-weight="bold" fill="var(--text)">MongoDB</text>
  <rect x="455.1111" y="560.9876" width="252.8395" height="79.0124" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="581.5308" y="608.3951" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5432" font-weight="bold" fill="var(--text)">HBase</text>
  <rect x="775.3745" y="560.9876" width="252.8395" height="79.0124" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="901.7942" y="608.3951" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5432" font-weight="bold" fill="var(--text)">Redis</text>
</svg>
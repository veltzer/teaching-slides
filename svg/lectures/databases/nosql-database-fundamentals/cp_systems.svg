<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-cp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="sync-cp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 6.4,0" fill="#4caf50" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.6528" font-weight="bold" fill="var(--text)">CP Systems (Consistency + Partition Tolerance)</text>
  <rect x="500" y="70.9334" width="280" height="69.6001" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="640" y="114.24" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8412" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="40" y="225.6001" width="320" height="123.7334" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="200" y="264.2667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--primary-accent)">Leader Node</text>
  <text x="200" y="299.84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7323" fill="var(--text-muted)">Data v2 (latest)</text>
  <text x="200" y="330.7733" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0294" fill="var(--primary-accent)">CONSISTENT</text>
  <rect x="479.9999" y="225.6001" width="320" height="123.7334" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="640" y="264.2667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--primary-accent)">Follower Node</text>
  <text x="640" y="299.84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7323" fill="var(--text-muted)">Data v2 (synced)</text>
  <text x="640" y="330.7733" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0294" fill="var(--primary-accent)">CONSISTENT</text>
  <rect x="920" y="225.6001" width="320" height="123.7334" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1079.9999" y="264.2667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--danger-accent)">Follower Node</text>
  <text x="1079.9999" y="299.84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7323" fill="var(--text-muted)">Data v1 (stale)</text>
  <text x="1079.9999" y="330.7733" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0294" fill="var(--danger-accent)">UNAVAILABLE</text>
  <line x1="560" y1="140.5333" x2="239.9999" y2="222.5067" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-cp)" />
  <line x1="720" y1="140.5333" x2="1040" y2="222.5067" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.9012 4.7408" />
  <text x="959.9999" y="171.4667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0294" fill="var(--danger-accent)">rejected</text>
  <line x1="359.9999" y1="279.7334" x2="475.9999" y2="279.7334" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#sync-cp)" />
  <text x="419.9999" y="264.2667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0294" fill="var(--ok-accent)">sync</text>
  <rect x="819.9999" y="256.5334" width="80" height="30.9333" fill="var(--bg)" stroke="none" rx="6"/>
  <text x="860" y="278.1867" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.2471" fill="var(--danger-accent)">X</text>
  <text x="860" y="217.8667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0294" fill="var(--danger-accent)">partition</text>
  <rect x="239.9999" y="411.1999" width="800" height="85.0667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="640" y="446.7733" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--primary-accent)">Strong Consistency</text>
  <text x="640" y="477.7067" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7323" fill="var(--text-muted)">Refuses requests to partitioned nodes to guarantee consistency</text>
  <rect x="99.9999" y="542.6666" width="300" height="77.3334" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="249.9999" y="589.0667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--text)">MongoDB</text>
  <rect x="479.9999" y="542.6666" width="300" height="77.3334" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="629.9999" y="589.0667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--text)">HBase</text>
  <rect x="860" y="542.6666" width="300" height="77.3334" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1009.9999" y="589.0667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1382" font-weight="bold" fill="var(--text)">Redis</text>
</svg>
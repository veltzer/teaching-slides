<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="541.1765" height="580" fill="var(--bg)" stroke="var(--text)" stroke-width="4.2667" rx="6"/>
  <text x="310.5882" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.475" font-weight="bold" fill="var(--text)">Document (JSON)</text>
  <text x="87.0588" y="199.5" font-size="24.7304" font-family="Courier New, monospace" fill="var(--text)">{ "id": "123",</text>
  <text x="87.0588" y="257.5" font-size="24.7304" font-family="Courier New, monospace" fill="var(--text)">  "name": "John",</text>
  <text x="87.0588" y="315.5" font-size="24.7304" font-family="Courier New, monospace" fill="var(--text)">  "email": "j@ex.com",</text>
  <text x="87.0588" y="373.5" font-size="24.7304" font-family="Courier New, monospace" fill="var(--text)">  "address": {</text>
  <text x="87.0588" y="431.5" font-size="24.7304" font-family="Courier New, monospace" fill="var(--text)">    "city": "NYC",</text>
  <text x="87.0588" y="489.5" font-size="24.7304" font-family="Courier New, monospace" fill="var(--text)">    "zip": "10001"</text>
  <text x="87.0588" y="547.5" font-size="24.7304" font-family="Courier New, monospace" fill="var(--text)">  } }</text>
  <rect x="698.8235" y="40" width="541.1765" height="261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="969.4117" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.2267" font-weight="bold" fill="var(--primary-text)">Key Features</text>
  <text x="734.1176" y="185" font-family="Arial, sans-serif" font-size="24.7304" fill="var(--primary-text)">Nested structures</text>
  <text x="734.1176" y="243" font-family="Arial, sans-serif" font-size="24.7304" fill="var(--primary-text)">Schema-flexible</text>
  <rect x="698.8235" y="359" width="541.1765" height="261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="969.4117" y="431.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.2267" font-weight="bold" fill="var(--ok-text)">Examples</text>
  <text x="734.1176" y="504" font-family="Arial, sans-serif" font-size="24.7304" fill="var(--ok-text)">MongoDB, CouchDB</text>
  <text x="734.1176" y="562" font-family="Arial, sans-serif" font-size="24.7304" fill="var(--ok-text)">Firestore, DynamoDB</text>
</svg>

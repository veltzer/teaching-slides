<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="100" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--primary-text)">Polyglot Persistence</text>

  <rect x="40" y="150" width="285" height="310" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="205" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-text)">User Data</text>
  <text x="182" y="260" text-anchor="middle" font-size="20" fill="var(--primary-text)">RDBMS</text>
  <text x="182" y="320" text-anchor="middle" font-size="16" fill="var(--primary-text)">Strong schema</text>
  <text x="182" y="360" text-anchor="middle" font-size="16" fill="var(--primary-text)">ACID transactions</text>
  <text x="182" y="400" text-anchor="middle" font-size="16" fill="var(--primary-text)">SQL joins</text>

  <rect x="355" y="150" width="285" height="310" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497" y="205" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--info-text)">Sessions</text>
  <text x="497" y="260" text-anchor="middle" font-size="20" fill="var(--info-text)">Key-Value</text>
  <text x="497" y="320" text-anchor="middle" font-size="16" fill="var(--info-text)">Redis, Memcached</text>
  <text x="497" y="360" text-anchor="middle" font-size="16" fill="var(--info-text)">Sub-ms reads</text>
  <text x="497" y="400" text-anchor="middle" font-size="16" fill="var(--info-text)">TTL expiry</text>

  <rect x="670" y="150" width="285" height="310" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="812" y="205" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--ok-text)">Products</text>
  <text x="812" y="260" text-anchor="middle" font-size="20" fill="var(--ok-text)">Document</text>
  <text x="812" y="320" text-anchor="middle" font-size="16" fill="var(--ok-text)">MongoDB</text>
  <text x="812" y="360" text-anchor="middle" font-size="16" fill="var(--ok-text)">Flexible fields</text>
  <text x="812" y="400" text-anchor="middle" font-size="16" fill="var(--ok-text)">Nested attrs</text>

  <rect x="985" y="150" width="255" height="310" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="205" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--warn-text)">Search</text>
  <text x="1112" y="260" text-anchor="middle" font-size="20" fill="var(--warn-text)">Inverted Index</text>
  <text x="1112" y="320" text-anchor="middle" font-size="16" fill="var(--warn-text)">Elasticsearch</text>
  <text x="1112" y="360" text-anchor="middle" font-size="16" fill="var(--warn-text)">Full-text queries</text>
  <text x="1112" y="400" text-anchor="middle" font-size="16" fill="var(--warn-text)">Relevance ranking</text>

  <rect x="40" y="480" width="1200" height="140" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="535" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">Use the right tool for each job</text>
  <text x="640" y="585" text-anchor="middle" font-size="18" fill="var(--text-muted)">One service owns each store; events sync across stores as needed</text>
</svg>

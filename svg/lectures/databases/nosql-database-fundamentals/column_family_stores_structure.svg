<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="26.821872" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Column-Family Stores: Structure</text>

  <rect x="40" y="77.247706" width="1200" height="85.137615" rx="6.189663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="114.495413" text-anchor="middle" font-size="20.63221" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Keyspace</text>
  <text x="640" y="146.422018" text-anchor="middle" font-size="15.474157" fill="var(--primary-text)" font-family="Arial, sans-serif">Top-level namespace, holds replication settings</text>

  <rect x="40" y="183.669725" width="380" height="436.330275" rx="6.189663" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="224.110092" text-anchor="middle" font-size="20.63221" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Row Key</text>
  <text x="230" y="268.807339" text-anchor="middle" font-size="15.474157" fill="var(--info-text)" font-family="Arial, sans-serif">user:42</text>
  <text x="230" y="322.018349" text-anchor="middle" font-size="15.474157" fill="var(--info-text)" font-family="Arial, sans-serif">Partitions data</text>
  <text x="230" y="364.587156" text-anchor="middle" font-size="15.474157" fill="var(--info-text)" font-family="Arial, sans-serif">Hash maps to node</text>
  <text x="230" y="417.798165" text-anchor="middle" font-size="15.474157" fill="var(--info-text)" font-family="Arial, sans-serif">Unique per table</text>
  <text x="230" y="471.009174" text-anchor="middle" font-size="15.474157" fill="var(--info-text)" font-family="Arial, sans-serif">Stored sorted</text>
  <text x="230" y="524.220183" text-anchor="middle" font-size="15.474157" fill="var(--info-text)" font-family="Arial, sans-serif">Range scans possible</text>
  <text x="230" y="577.431193" text-anchor="middle" font-size="15.474157" fill="var(--info-text)" font-family="Arial, sans-serif">Wide rows common</text>

  <rect x="440" y="183.669725" width="380" height="436.330275" rx="6.189663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="224.110092" text-anchor="middle" font-size="20.63221" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Column Family</text>
  <text x="630" y="268.807339" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">profile / posts / likes</text>
  <text x="630" y="322.018349" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">Logical grouping</text>
  <text x="630" y="364.587156" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">Own SSTable files</text>
  <text x="630" y="417.798165" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">Independent compaction</text>
  <text x="630" y="471.009174" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">Schema stays flexible</text>
  <text x="630" y="524.220183" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">Add columns anytime</text>
  <text x="630" y="577.431193" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">Akin to a table</text>

  <rect x="840" y="183.669725" width="400" height="436.330275" rx="6.189663" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="224.110092" text-anchor="middle" font-size="20.63221" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Column / Cell</text>
  <text x="1040" y="268.807339" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">name : value : timestamp</text>
  <text x="1040" y="322.018349" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">Triple stored together</text>
  <text x="1040" y="364.587156" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">Sorted by column name</text>
  <text x="1040" y="417.798165" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">Versioned by time</text>
  <text x="1040" y="471.009174" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">TTL supported</text>
  <text x="1040" y="524.220183" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">Tombstones on delete</text>
  <text x="1040" y="577.431193" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">Cassandra, HBase</text>
</svg>

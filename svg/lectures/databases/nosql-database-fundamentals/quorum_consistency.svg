<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="592.5926" y="60" text-anchor="middle" font-size="25.679" font-weight="bold">Quorum: W + R &gt; N = Strong Consistency</ns0:text>
  <ns0:rect x="79.0123" y="116.6667" width="296.2963" height="233.3333" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.9506" rx="5.9259" />
  <ns0:text x="227.1605" y="183.3333" text-anchor="middle" font-size="21.7284" font-weight="bold" fill="#2e7d32">Write Quorum (W=2)</ns0:text>
  <ns0:text x="227.1605" y="240" text-anchor="middle" font-size="19.7531" fill="#2e7d32">Replica A: Written</ns0:text>
  <ns0:text x="227.1605" y="290" text-anchor="middle" font-size="19.7531" fill="#2e7d32">Replica B: Written</ns0:text>
  <ns0:text x="227.1605" y="333.3333" text-anchor="middle" font-size="19.7531" fill="#999">Replica C: Pending</ns0:text>
  <ns0:rect x="444.4444" y="116.6667" width="296.2963" height="233.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.9506" rx="5.9259" />
  <ns0:text x="592.5926" y="183.3333" text-anchor="middle" font-size="21.7284" font-weight="bold" fill="#1565c0">Read Quorum (R=2)</ns0:text>
  <ns0:text x="592.5926" y="240" text-anchor="middle" font-size="19.7531" fill="#1565c0">Replica A: v2</ns0:text>
  <ns0:text x="592.5926" y="290" text-anchor="middle" font-size="19.7531" fill="#1565c0">Replica C: v1 (stale)</ns0:text>
  <ns0:text x="592.5926" y="333.3333" text-anchor="middle" font-size="19.7531" fill="#1565c0">Pick latest: v2</ns0:text>
  <ns0:rect x="809.8766" y="116.6667" width="335.8025" height="233.3333" fill="#fff3e0" stroke="#e65100" stroke-width="3.9506" rx="5.9259" />
  <ns0:text x="977.7778" y="183.3333" text-anchor="middle" font-size="21.7284" font-weight="bold" fill="#e65100">Overlap Guarantee</ns0:text>
  <ns0:text x="977.7778" y="240" text-anchor="middle" font-size="19.7531">W + R = 2 + 2 = 4</ns0:text>
  <ns0:text x="977.7778" y="290" text-anchor="middle" font-size="19.7531">N = 3 replicas</ns0:text>
  <ns0:text x="977.7778" y="333.3333" text-anchor="middle" font-size="19.7531" fill="#2e7d32">4 &gt; 3: Overlap exists</ns0:text>
  <ns0:rect x="197.5308" y="400" width="790.1234" height="100" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.9753" rx="5.9259" />
  <ns0:text x="592.5926" y="466.6667" text-anchor="middle" font-size="19.7531" fill="#7b1fa2">At least one node in Read set saw the latest Write = consistency guaranteed</ns0:text>
  <ns0:text x="592.5926" y="583.3333" text-anchor="middle" font-size="19.7531" fill="#666">Tuning W and R: higher W+R = stronger consistency, lower = faster but weaker</ns0:text>
  <ns0:text x="592.5926" y="640" text-anchor="middle" font-size="19.7531" fill="#666">Common configs: W=1,R=N (fast writes) | W=N,R=1 (fast reads) | W=R=majority (balanced)</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="617.7778" y="40" text-anchor="middle" font-size="27.2367" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Quorum: W + R &gt; N = Strong Consistency</text>
  <rect x="40" y="96.6667" width="333.3333" height="233.3333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="206.6667" y="163.3333" text-anchor="middle" font-size="23.0464" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Write Quorum (W=2)</text>
  <text x="206.6667" y="220" text-anchor="middle" font-size="20.9513" fill="var(--ok-accent)" font-family="Arial, sans-serif">Replica A: Written</text>
  <text x="206.6667" y="270" text-anchor="middle" font-size="20.9513" fill="var(--ok-accent)" font-family="Arial, sans-serif">Replica B: Written</text>
  <text x="206.6667" y="313.3333" text-anchor="middle" font-size="20.9513" fill="var(--text-faint)" font-family="Arial, sans-serif">Replica C: Pending</text>
  <rect x="451.1111" y="96.6667" width="333.3333" height="233.3333" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="617.7778" y="163.3333" text-anchor="middle" font-size="23.0464" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Read Quorum (R=2)</text>
  <text x="617.7778" y="220" text-anchor="middle" font-size="20.9513" fill="var(--primary-accent)" font-family="Arial, sans-serif">Replica A: v2</text>
  <text x="617.7778" y="270" text-anchor="middle" font-size="20.9513" fill="var(--primary-accent)" font-family="Arial, sans-serif">Replica C: v1 (stale)</text>
  <text x="617.7778" y="313.3333" text-anchor="middle" font-size="20.9513" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pick latest: v2</text>
  <rect x="862.2222" y="96.6667" width="377.7778" height="233.3333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1051.1111" y="163.3333" text-anchor="middle" font-size="23.0464" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Overlap Guarantee</text>
  <text x="1051.1111" y="220" text-anchor="middle" font-size="20.9513" font-family="Arial, sans-serif" fill="var(--warn-text)">W + R = 2 + 2 = 4</text>
  <text x="1051.1111" y="270" text-anchor="middle" font-size="20.9513" font-family="Arial, sans-serif" fill="var(--warn-text)">N = 3 replicas</text>
  <text x="1051.1111" y="313.3333" text-anchor="middle" font-size="20.9513" fill="var(--ok-accent)" font-family="Arial, sans-serif">4 &gt; 3: Overlap exists</text>
  <rect x="173.3333" y="380" width="888.8887" height="100" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="617.7778" y="446.6667" text-anchor="middle" font-size="20.9513" fill="var(--info-accent)" font-family="Arial, sans-serif">At least one node in Read set saw the latest Write = consistency guaranteed</text>
  <text x="617.7778" y="563.3333" text-anchor="middle" font-size="20.9513" fill="var(--text-muted)" font-family="Arial, sans-serif">Tuning W and R: higher W+R = stronger consistency, lower = faster but weaker</text>
  <text x="617.7778" y="620" text-anchor="middle" font-size="20.9513" fill="var(--text-muted)" font-family="Arial, sans-serif">Common configs: W=1,R=N (fast writes) | W=N,R=1 (fast reads) | W=R=majority (balanced)</text>
</svg>

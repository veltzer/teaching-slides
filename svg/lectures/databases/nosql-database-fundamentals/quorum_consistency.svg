<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="617.7778" y="40" text-anchor="middle" font-size="27.2367" font-weight="bold">Quorum: W + R &gt; N = Strong Consistency</text>
  <rect x="40" y="96.6667" width="333.3333" height="233.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="206.6667" y="163.3333" text-anchor="middle" font-size="23.0464" font-weight="bold" fill="var(--ok-accent)">Write Quorum (W=2)</text>
  <text x="206.6667" y="220" text-anchor="middle" font-size="20.9513" fill="var(--ok-accent)">Replica A: Written</text>
  <text x="206.6667" y="270" text-anchor="middle" font-size="20.9513" fill="var(--ok-accent)">Replica B: Written</text>
  <text x="206.6667" y="313.3333" text-anchor="middle" font-size="20.9513" fill="var(--text-faint)">Replica C: Pending</text>
  <rect x="451.1111" y="96.6667" width="333.3333" height="233.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="617.7778" y="163.3333" text-anchor="middle" font-size="23.0464" font-weight="bold" fill="var(--primary-accent)">Read Quorum (R=2)</text>
  <text x="617.7778" y="220" text-anchor="middle" font-size="20.9513" fill="var(--primary-accent)">Replica A: v2</text>
  <text x="617.7778" y="270" text-anchor="middle" font-size="20.9513" fill="var(--primary-accent)">Replica C: v1 (stale)</text>
  <text x="617.7778" y="313.3333" text-anchor="middle" font-size="20.9513" fill="var(--primary-accent)">Pick latest: v2</text>
  <rect x="862.2222" y="96.6667" width="377.7778" height="233.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1051.1111" y="163.3333" text-anchor="middle" font-size="23.0464" font-weight="bold" fill="var(--warn-accent)">Overlap Guarantee</text>
  <text x="1051.1111" y="220" text-anchor="middle" font-size="20.9513">W + R = 2 + 2 = 4</text>
  <text x="1051.1111" y="270" text-anchor="middle" font-size="20.9513">N = 3 replicas</text>
  <text x="1051.1111" y="313.3333" text-anchor="middle" font-size="20.9513" fill="var(--ok-accent)">4 &gt; 3: Overlap exists</text>
  <rect x="173.3333" y="380" width="888.8887" height="100" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="617.7778" y="446.6667" text-anchor="middle" font-size="20.9513" fill="var(--info-accent)">At least one node in Read set saw the latest Write = consistency guaranteed</text>
  <text x="617.7778" y="563.3333" text-anchor="middle" font-size="20.9513" fill="var(--text-muted)">Tuning W and R: higher W+R = stronger consistency, lower = faster but weaker</text>
  <text x="617.7778" y="620" text-anchor="middle" font-size="20.9513" fill="var(--text-muted)">Common configs: W=1,R=N (fast writes) | W=N,R=1 (fast reads) | W=R=majority (balanced)</text>
</svg>
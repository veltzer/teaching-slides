<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="390" height="443.826087" rx="6.02603" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="140.869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="120.52061" font-weight="bold" fill="var(--danger-text)">C</text>
  <text x="235" y="221.565217" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.130152" font-weight="bold" fill="var(--danger-text)">Consistency</text>
  <text x="235" y="292.173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.078091" fill="var(--danger-text)">Every read sees the</text>
  <text x="235" y="322.434783" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.078091" fill="var(--danger-text)">most recent write</text>
  <text x="235" y="393.043478" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.078091" fill="var(--danger-text)">or an error</text>
  <text x="235" y="453.565217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" fill="var(--danger-text)">CP: MongoDB, HBase</text>

  <rect x="445" y="40" width="390" height="443.826087" rx="6.02603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="140.869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="120.52061" font-weight="bold" fill="var(--ok-text)">A</text>
  <text x="640" y="221.565217" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.130152" font-weight="bold" fill="var(--ok-text)">Availability</text>
  <text x="640" y="292.173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.078091" fill="var(--ok-text)">Every request gets</text>
  <text x="640" y="322.434783" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.078091" fill="var(--ok-text)">a non-error response</text>
  <text x="640" y="393.043478" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.078091" fill="var(--ok-text)">maybe stale</text>
  <text x="640" y="453.565217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" fill="var(--ok-text)">AP: Cassandra, Dynamo</text>

  <rect x="850" y="40" width="390" height="443.826087" rx="6.02603" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="140.869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="120.52061" font-weight="bold" fill="var(--primary-text)">P</text>
  <text x="1045" y="221.565217" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.130152" font-weight="bold" fill="var(--primary-text)">Partition tolerance</text>
  <text x="1045" y="292.173913" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.078091" fill="var(--primary-text)">System keeps running</text>
  <text x="1045" y="322.434783" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.078091" fill="var(--primary-text)">despite network splits</text>
  <text x="1045" y="393.043478" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.078091" fill="var(--primary-text)">non-negotiable</text>
  <text x="1045" y="453.565217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" fill="var(--primary-text)">in any real network</text>

  <rect x="40" y="514.086957" width="1200" height="105.913043" rx="6.02603" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="549.391304" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445" font-weight="bold" fill="var(--text)">Pick at most two. P is forced, so the real choice is C or A.</text>
  <text x="640" y="584.695652" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073753" fill="var(--text-muted)">During a partition: CP refuses writes to stay consistent; AP accepts writes and reconciles later.</text>
  <text x="640" y="614.956522" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073753" fill="var(--text-muted)">Outside partitions, modern systems tune latency vs consistency dynamically (PACELC).</text>
</svg>

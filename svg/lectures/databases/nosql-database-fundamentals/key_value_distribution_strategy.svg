<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="629.0909" y="40" text-anchor="middle" font-size="26.9107" font-weight="bold">Key-Value Distribution via Consistent Hashing</text>
  <rect x="40" y="89.7143" width="218.1818" height="132.5714" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="149.0909" y="146.0572" text-anchor="middle" font-size="20.7006" font-weight="bold">Hash(key)</text>
  <text x="149.0909" y="195.7714" text-anchor="middle" font-size="20.7006" fill="var(--text-muted)">0 - 2^32</text>
  <line x1="258.1818" y1="156.0001" x2="323.6364" y2="156.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowkv)" />
  <rect x="323.6364" y="89.7143" width="218.1818" height="132.5714" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="432.7273" y="146.0572" text-anchor="middle" font-size="20.7006" font-weight="bold" fill="var(--ok-accent)">Partition A</text>
  <text x="432.7273" y="195.7714" text-anchor="middle" font-size="20.7006" fill="var(--text-muted)">Keys 0-99</text>
  <rect x="585.4546" y="89.7143" width="218.1818" height="132.5714" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="694.5455" y="146.0572" text-anchor="middle" font-size="20.7006" font-weight="bold" fill="var(--warn-accent)">Partition B</text>
  <text x="694.5455" y="195.7714" text-anchor="middle" font-size="20.7006" fill="var(--text-muted)">Keys 100-199</text>
  <rect x="847.2727" y="89.7143" width="218.1818" height="132.5714" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="146.0572" text-anchor="middle" font-size="20.7006" font-weight="bold" fill="var(--info-accent)">Partition C</text>
  <text x="956.3636" y="195.7714" text-anchor="middle" font-size="20.7006" fill="var(--text-muted)">Keys 200-299</text>
  <rect x="1109.0909" y="89.7143" width="130.9091" height="132.5714" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1174.5454" y="172.5715" text-anchor="middle" font-size="20.7006">...</text>
  <rect x="323.6364" y="288.5714" width="218.1818" height="116" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="432.7273" y="361.4858" text-anchor="middle" font-size="20.7006">Server 1</text>
  <rect x="585.4546" y="288.5714" width="218.1818" height="116" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="694.5455" y="361.4858" text-anchor="middle" font-size="20.7006">Server 2</text>
  <rect x="847.2727" y="288.5714" width="218.1818" height="116" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="361.4858" text-anchor="middle" font-size="20.7006">Server 3</text>
  <line x1="432.7273" y1="222.2858" x2="432.7273" y2="281.9429" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="694.5455" y1="222.2858" x2="694.5455" y2="281.9429" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="956.3636" y1="222.2858" x2="956.3636" y2="281.9429" stroke="var(--info-border)" stroke-width="2" />
  <text x="629.0909" y="487.4286" text-anchor="middle" font-size="20.7006" fill="var(--text-muted)">Adding/removing a server only remaps nearby keys</text>
  <rect x="236.3637" y="520.5715" width="785.4545" height="99.4285" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.0909" y="586.8572" text-anchor="middle" font-size="20.7006" fill="var(--primary-accent)">Minimal redistribution = high availability during scaling</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowkv" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
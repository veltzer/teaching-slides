<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="25.9493" font-weight="bold">Key-Value Distribution via Consistent Hashing</text>
  <rect x="59.883" y="101.0526" width="199.6101" height="134.7368" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="159.6881" y="158.3158" text-anchor="middle" font-size="19.961" font-weight="bold">Hash(key)</text>
  <text x="159.6881" y="208.8421" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">0 - 2^32</text>
  <line x1="259.4931" y1="168.4211" x2="319.3762" y2="168.4211" stroke="var(--text)" stroke-width="2" marker-end="url(#arrowkv)" />
  <rect x="319.3762" y="101.0526" width="199.6101" height="134.7368" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="419.1813" y="158.3158" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--ok-accent)">Partition A</text>
  <text x="419.1813" y="208.8421" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Keys 0-99</text>
  <rect x="558.9084" y="101.0526" width="199.6101" height="134.7368" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="658.7135" y="158.3158" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--warn-accent)">Partition B</text>
  <text x="658.7135" y="208.8421" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Keys 100-199</text>
  <rect x="798.4405" y="101.0526" width="199.6101" height="134.7368" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="898.2456" y="158.3158" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--info-accent)">Partition C</text>
  <text x="898.2456" y="208.8421" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Keys 200-299</text>
  <rect x="1037.9727" y="101.0526" width="119.7661" height="134.7368" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1097.8557" y="185.2632" text-anchor="middle" font-size="19.961">...</text>
  <rect x="319.3762" y="303.1579" width="199.6101" height="117.8947" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="419.1813" y="377.2632" text-anchor="middle" font-size="19.961">Server 1</text>
  <rect x="558.9084" y="303.1579" width="199.6101" height="117.8947" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="658.7135" y="377.2632" text-anchor="middle" font-size="19.961">Server 2</text>
  <rect x="798.4405" y="303.1579" width="199.6101" height="117.8947" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="898.2456" y="377.2632" text-anchor="middle" font-size="19.961">Server 3</text>
  <line x1="419.1813" y1="235.7895" x2="419.1813" y2="296.4211" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="658.7135" y1="235.7895" x2="658.7135" y2="296.4211" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="898.2456" y1="235.7895" x2="898.2456" y2="296.4211" stroke="var(--info-border)" stroke-width="2" />
  <text x="598.8304" y="505.2632" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Adding/removing a server only remaps nearby keys</text>
  <rect x="239.5322" y="538.9474" width="718.5965" height="101.0526" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="606.3158" text-anchor="middle" font-size="19.961" fill="var(--primary-accent)">Minimal redistribution = high availability during scaling</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowkv" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
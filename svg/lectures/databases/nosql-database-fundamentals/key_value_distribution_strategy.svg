  <text x="419.1813" y="377.2632" text-anchor="middle" font-size="19.961">Server 1</text>
  <rect x="558.9084" y="303.1579" width="199.6101" height="117.8947" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="1.9961" rx="5.9883" />
  <text x="658.7135" y="377.2632" text-anchor="middle" font-size="19.961">Server 2</text>
  <rect x="798.4405" y="303.1579" width="199.6101" height="117.8947" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="1.9961" rx="5.9883" />
  <text x="898.2456" y="377.2632" text-anchor="middle" font-size="19.961">Server 3</text>
  <line x1="419.1813" y1="235.7895" x2="419.1813" y2="296.4211" stroke="var(--ok-dk)" stroke-width="2.9942" />
  <line x1="658.7135" y1="235.7895" x2="658.7135" y2="296.4211" stroke="var(--warn-dk)" stroke-width="2.9942" />
  <line x1="898.2456" y1="235.7895" x2="898.2456" y2="296.4211" stroke="var(--info-mid)" stroke-width="2.9942" />
  <text x="598.8304" y="505.2632" text-anchor="middle" font-size="19.961" fill="var(--text-mid)">Adding/removing a server only remaps nearby keys</text>
  <rect x="239.5322" y="538.9474" width="718.5965" height="101.0526" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.9961" rx="5.9883" />
  <text x="598.8304" y="606.3158" text-anchor="middle" font-size="19.961" fill="var(--primary-dk)">Minimal redistribution = high availability during scaling</text>

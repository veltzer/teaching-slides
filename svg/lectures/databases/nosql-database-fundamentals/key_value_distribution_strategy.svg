<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="629.0909" y="40" text-anchor="middle" font-size="26.9107" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Key-Value Distribution via Consistent Hashing</text>
  <rect x="40" y="89.7143" width="218.1818" height="132.5714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="149.0909" y="146.0572" text-anchor="middle" font-size="20.7006" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Hash(key)</text>
  <text x="149.0909" y="195.7714" text-anchor="middle" font-size="20.7006" fill="var(--text-muted)" font-family="Arial, sans-serif">0 - 2^32</text>
  <line x1="258.1818" y1="156.0001" x2="323.6364" y2="156.0001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="323.6364" y="89.7143" width="218.1818" height="132.5714" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="432.7273" y="146.0572" text-anchor="middle" font-size="20.7006" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Partition A</text>
  <text x="432.7273" y="195.7714" text-anchor="middle" font-size="20.7006" fill="var(--text-muted)" font-family="Arial, sans-serif">Keys 0-99</text>
  <rect x="585.4546" y="89.7143" width="218.1818" height="132.5714" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="694.5455" y="146.0572" text-anchor="middle" font-size="20.7006" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Partition B</text>
  <text x="694.5455" y="195.7714" text-anchor="middle" font-size="20.7006" fill="var(--text-muted)" font-family="Arial, sans-serif">Keys 100-199</text>
  <rect x="847.2727" y="89.7143" width="218.1818" height="132.5714" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="146.0572" text-anchor="middle" font-size="20.7006" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Partition C</text>
  <text x="956.3636" y="195.7714" text-anchor="middle" font-size="20.7006" fill="var(--text-muted)" font-family="Arial, sans-serif">Keys 200-299</text>
  <rect x="1109.0909" y="89.7143" width="130.9091" height="132.5714" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1174.5454" y="172.5715" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--danger-text)">...</text>
  <rect x="323.6364" y="288.5714" width="218.1818" height="116" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="432.7273" y="361.4858" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--ok-text)">Server 1</text>
  <rect x="585.4546" y="288.5714" width="218.1818" height="116" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="694.5455" y="361.4858" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--warn-text)">Server 2</text>
  <rect x="847.2727" y="288.5714" width="218.1818" height="116" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="956.3636" y="361.4858" text-anchor="middle" font-size="20.7006" font-family="Arial, sans-serif" fill="var(--info-text)">Server 3</text>
  <line x1="432.7273" y1="222.2858" x2="432.7273" y2="281.9429" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="694.5455" y1="222.2858" x2="694.5455" y2="281.9429" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="956.3636" y1="222.2858" x2="956.3636" y2="281.9429" stroke="var(--info-border)" stroke-width="2"/>
  <text x="629.0909" y="487.4286" text-anchor="middle" font-size="20.7006" fill="var(--text-muted)" font-family="Arial, sans-serif">Adding/removing a server only remaps nearby keys</text>
  <rect x="236.3637" y="520.5715" width="785.4545" height="99.4285" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="629.0909" y="586.8572" text-anchor="middle" font-size="20.7006" fill="var(--primary-accent)" font-family="Arial, sans-serif">Minimal redistribution = high availability during scaling</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

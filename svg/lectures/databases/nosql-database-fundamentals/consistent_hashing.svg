<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="582.465753" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.104974" font-weight="bold" fill="var(--text)">Consistent Hashing</text>

  <!-- Ring diagram on the left -->
  <g>
    <rect x="51.1389" y="107.627" width="470.873" height="470.873" rx="14" fill="none" stroke="var(--text)" stroke-width="3"/>

    <!-- Nodes on ring -->
    <rect x="269.453" y="96.0305" width="34.2453" height="34.2453" rx="14" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="286.575342" y="87.027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.052487" font-weight="bold" fill="var(--text)">Node A</text>

    <rect x="477.672" y="210.985" width="34.2453" height="34.2453" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="533.150685" y="226.018018" text-anchor="start" font-family="Arial, sans-serif" font-size="16.052487" font-weight="bold" fill="var(--text)">Node B</text>

    <rect x="411.918" y="482.697" width="34.2453" height="34.2453" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="450.958904" y="531.171171" text-anchor="start" font-family="Arial, sans-serif" font-size="16.052487" font-weight="bold" fill="var(--text)">Node C</text>

    <rect x="126.987" y="482.697" width="34.2453" height="34.2453" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="122.191781" y="531.171171" text-anchor="end" font-family="Arial, sans-serif" font-size="16.052487" font-weight="bold" fill="var(--text)">Node D</text>

    <rect x="61.2335" y="210.985" width="34.2453" height="34.2453" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="40" y="226.018018" text-anchor="end" font-family="Arial, sans-serif" font-size="16.052487" font-weight="bold" fill="var(--text)">Node E</text>

    <!-- Keys on ring -->
    <rect x="377.714" y="137.013" width="14.9823" height="14.9823" rx="7.49116" fill="var(--text)"/>
    <text x="393.972603" y="134.054054" text-anchor="start" font-family="Arial, sans-serif" font-size="12.84199" fill="var(--text-muted)">k1</text>

    <rect x="498.262" y="377.374" width="14.9823" height="14.9823" rx="7.49116" fill="var(--text)"/>
    <text x="522.191781" y="384.864865" text-anchor="start" font-family="Arial, sans-serif" font-size="12.84199" fill="var(--text-muted)">k2</text>

    <rect x="279.084" y="565.482" width="14.9823" height="14.9823" rx="7.49116" fill="var(--text)"/>
    <text x="286.575342" y="599.099099" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.84199" fill="var(--text-muted)">k3</text>

    <rect x="59.9061" y="377.374" width="14.9823" height="14.9823" rx="7.49116" fill="var(--text)"/>
    <text x="50.958904" y="384.864865" text-anchor="end" font-family="Arial, sans-serif" font-size="12.84199" fill="var(--text-muted)">k4</text>

    <rect x="169.495" y="137.013" width="14.9823" height="14.9823" rx="7.49116" fill="var(--text)"/>
    <text x="168.219178" y="134.054054" text-anchor="end" font-family="Arial, sans-serif" font-size="12.84199" fill="var(--text-muted)">k5</text>

    <text x="286.575342" y="348.288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.982321" fill="var(--text-faint)">hash ring</text>
    <text x="286.575342" y="369.189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.982321" fill="var(--text-faint)">0 → 2^32-1</text>
  </g>

  <!-- Right side explanation panel -->
  <rect x="604.383562" y="81.801802" width="635.616438" height="229.90991" rx="8.561326" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="922.191781" y="118.378378" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.262984" font-weight="bold" fill="var(--primary-accent)">How it works</text>
  <text x="626.30137" y="154.954955" font-family="Arial, sans-serif" font-size="14.982321" fill="var(--text)">1. Hash nodes and keys on same ring.</text>
  <text x="626.30137" y="186.306306" font-family="Arial, sans-serif" font-size="14.982321" fill="var(--text)">2. Key owned by next node clockwise.</text>
  <text x="626.30137" y="217.657658" font-family="Arial, sans-serif" font-size="14.982321" fill="var(--text)">3. On change: only neighbour's</text>
  <text x="626.30137" y="238.558559" font-family="Arial, sans-serif" font-size="14.982321" fill="var(--text)">   keys move.</text>
  <text x="626.30137" y="275.135135" font-family="Arial, sans-serif" font-size="14.982321" fill="var(--text)">4. Virtual nodes smooth load —</text>
  <text x="626.30137" y="296.036036" font-family="Arial, sans-serif" font-size="14.982321" fill="var(--text)">   many positions per node.</text>

  <!-- Benefits -->
  <rect x="604.383562" y="332.612613" width="306.849315" height="135.855856" rx="8.561326" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="757.808219" y="369.189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.122653" font-weight="bold" fill="var(--ok-text)">Benefits</text>
  <text x="757.808219" y="400.540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912155" fill="var(--ok-text)">Minimal reshuffling</text>
  <text x="757.808219" y="424.576577" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912155" fill="var(--ok-text)">Horizontal scaling</text>
  <text x="757.808219" y="448.612613" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912155" fill="var(--ok-text)">Fault tolerance</text>

  <rect x="933.150685" y="332.612613" width="306.849315" height="135.855856" rx="8.561326" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.575342" y="369.189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.122653" font-weight="bold" fill="var(--warn-text)">Watch out</text>
  <text x="1086.575342" y="400.540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912155" fill="var(--warn-text)">Hot keys</text>
  <text x="1086.575342" y="424.576577" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912155" fill="var(--warn-text)">Uneven tokens</text>
  <text x="1086.575342" y="448.612613" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912155" fill="var(--warn-text)">Rebalance cost</text>

  <!-- Used by -->
  <rect x="604.383562" y="489.369369" width="635.616438" height="125.405405" rx="8.561326" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="922.191781" y="525.945946" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.122653" font-weight="bold" fill="var(--info-text)">Used by</text>
  <text x="922.191781" y="557.297297" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.982321" fill="var(--info-text)">Cassandra, Dynamo, Riak, Redis</text>
  <text x="922.191781" y="583.423423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.982321" fill="var(--info-text)">CDN edge routing</text>

  <text x="582.465753" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912155" fill="var(--text-faint)">Adding node moves ~1/N of keys.</text>
</svg>

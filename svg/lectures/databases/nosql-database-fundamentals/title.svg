<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Document store -->
  <rect x="80" y="130" width="120" height="90" rx="8" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="140" y="165" text-anchor="middle" font-family="monospace" font-size="11" fill="#e94560">{ "key":</text>
  <text x="140" y="182" text-anchor="middle" font-family="monospace" font-size="11" fill="#e94560">  "value" }</text>
  <text x="140" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">Document</text>
  <!-- Key-Value store -->
  <rect x="240" y="130" width="120" height="90" rx="8" fill="#0f3460" stroke="#16c79a" stroke-width="2"/>
  <text x="300" y="160" text-anchor="middle" font-family="monospace" font-size="11" fill="#16c79a">K -> V</text>
  <text x="300" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="#16c79a">K -> V</text>
  <text x="300" y="200" text-anchor="middle" font-family="monospace" font-size="11" fill="#16c79a">K -> V</text>
  <text x="300" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">Key-Value</text>
  <!-- Column store -->
  <rect x="440" y="130" width="120" height="90" rx="8" fill="#0f3460" stroke="#f5a623" stroke-width="2"/>
  <rect x="455" y="145" width="25" height="60" rx="2" fill="#f5a623" opacity="0.3"/>
  <rect x="485" y="145" width="25" height="60" rx="2" fill="#f5a623" opacity="0.2"/>
  <rect x="515" y="145" width="25" height="60" rx="2" fill="#f5a623" opacity="0.15"/>
  <text x="500" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">Column</text>
  <!-- Graph store -->
  <rect x="600" y="130" width="120" height="90" rx="8" fill="#0f3460" stroke="#a855f7" stroke-width="2"/>
  <circle cx="640" cy="160" r="10" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="690" cy="155" r="10" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="660" cy="195" r="10" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <line x1="648" y1="163" x2="682" y2="158" stroke="#a855f7" stroke-width="1"/>
  <line x1="644" y1="168" x2="655" y2="187" stroke="#a855f7" stroke-width="1"/>
  <line x1="668" y1="192" x2="685" y2="163" stroke="#a855f7" stroke-width="1"/>
  <text x="660" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">Graph</text>
  <!-- Horizontal scaling arrows -->
  <line x1="200" y1="300" x2="600" y2="300" stroke="#16c79a" stroke-width="1.5" opacity="0.4"/>
  <polygon points="600,296 612,300 600,304" fill="#16c79a" opacity="0.5"/>
  <text x="400" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#16c79a" opacity="0.6">horizontal scalability</text>
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#eee">NoSQL Database Fundamentals</text>
  <text x="400" y="80" text-anchor="middle" font-family="monospace" font-size="14" fill="#888">flexible schemas | distributed | scalable</text>
  <text x="400" y="375" text-anchor="middle" font-family="monospace" font-size="12" fill="#555">document | key-value | column | graph</text>
</svg>

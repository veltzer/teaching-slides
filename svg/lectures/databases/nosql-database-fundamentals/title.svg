<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="160" y="228.5" width="180" height="130.5" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.8444"/>
  <text x="250" y="279.25" text-anchor="middle" font-size="15.2948" fill="var(--danger-accent)" font-family="Courier New, monospace">{ "key":</text>
  <text x="250" y="303.9" text-anchor="middle" font-size="15.2948" fill="var(--danger-accent)" font-family="Courier New, monospace">  "value" }</text>
  <text x="250" y="388" text-anchor="middle" font-size="16.6854" fill="var(--text-faint)" font-family="Arial, sans-serif">Document</text>
  <rect x="400" y="228.5" width="180" height="130.5" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444"/>
  <text x="490" y="272" text-anchor="middle" font-size="15.2948" fill="var(--ok-accent)" font-family="Courier New, monospace">K -&gt; V</text>
  <text x="490" y="301" text-anchor="middle" font-size="15.2948" fill="var(--ok-accent)" font-family="Courier New, monospace">K -&gt; V</text>
  <text x="490" y="330" text-anchor="middle" font-size="15.2948" fill="var(--ok-accent)" font-family="Courier New, monospace">K -&gt; V</text>
  <text x="490" y="388" text-anchor="middle" font-size="16.6854" fill="var(--text-faint)" font-family="Arial, sans-serif">Key-Value</text>
  <rect x="700" y="228.5" width="180" height="130.5" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="2.8444"/>
  <rect x="722.5" y="250.25" width="37.5" height="87" rx="6" fill="url(#grad-warn)" opacity="0.3" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="767.5" y="250.25" width="37.5" height="87" rx="6" fill="url(#grad-warn)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="812.4999" y="250.25" width="37.5" height="87" rx="6" fill="url(#grad-warn)" opacity="0.15" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="388" text-anchor="middle" font-size="16.6854" fill="var(--text-faint)" font-family="Arial, sans-serif">Column</text>
  <rect x="939.9999" y="228.5" width="180" height="130.5" rx="6" fill="var(--primary-accent)" stroke="var(--info-border)" stroke-width="2.8444"/>
  <circle cx="1000" cy="272" r="13.9044" fill="none" stroke="var(--info-border)" stroke-width="2.1333"/>
  <circle cx="1074.9999" cy="264.75" r="13.9044" fill="none" stroke="var(--info-border)" stroke-width="2.1333"/>
  <circle cx="1030" cy="322.75" r="13.9044" fill="none" stroke="var(--info-border)" stroke-width="2.1333"/>
  <line x1="1012" y1="276.35" x2="1063" y2="269.1" stroke="var(--info-border)" stroke-width="1.4222"/>
  <line x1="1006" y1="283.6" x2="1022.5" y2="311.15" stroke="var(--info-border)" stroke-width="1.4222"/>
  <line x1="1041.9999" y1="318.4" x2="1067.5" y2="276.35" stroke="var(--info-border)" stroke-width="1.4222"/>
  <text x="1030" y="388" text-anchor="middle" font-size="16.6854" fill="var(--text-faint)" font-family="Arial, sans-serif">Graph</text>
  <line x1="339.9999" y1="475" x2="939.9999" y2="475" stroke="var(--ok-border)" stroke-width="2" opacity="0.4"/>
  <polygon points="939.9999,469.2 958,475 939.9999,480.8" fill="var(--ok-fill)" opacity="0.5"/>
  <text x="640" y="504" text-anchor="middle" font-size="16.6854" fill="var(--ok-accent)" opacity="0.6" font-family="Arial, sans-serif">horizontal scalability</text>
  <text x="640" y="112.5" text-anchor="middle" font-size="38.9324" font-weight="bold" fill="var(--surface)" font-family="Arial, sans-serif">NoSQL Database Fundamentals</text>
  <text x="640" y="156" text-anchor="middle" font-size="19.4662" fill="var(--text-faint)" font-family="Courier New, monospace">flexible schemas | distributed | scalable</text>
  <text x="640" y="583.75" text-anchor="middle" font-size="16.6854" fill="var(--text-muted)" font-family="Courier New, monospace">document | key-value | column | graph</text>
</svg>

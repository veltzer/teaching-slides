  <text x="199.1111" y="384" text-anchor="middle" font-family="sans-serif" font-size="17.0667" fill="var(--text-faint)">Document</text>
  <rect x="341.3333" y="208" width="170.6667" height="144" rx="6" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444" />
  <text x="426.6667" y="256" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--ok-accent)">K -&gt; V</text>
  <text x="426.6667" y="288" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--ok-accent)">K -&gt; V</text>
  <text x="426.6667" y="320" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--ok-accent)">K -&gt; V</text>
  <text x="426.6667" y="384" text-anchor="middle" font-family="sans-serif" font-size="17.0667" fill="var(--text-faint)">Key-Value</text>
  <rect x="625.7778" y="208" width="170.6667" height="144" rx="6" fill="var(--primary-accent)" stroke="var(--warn-border)" stroke-width="2.8444" />
  <rect x="647.1111" y="232" width="35.5556" height="96" rx="6" fill="var(--warn-fill)" opacity="0.3" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="689.7778" y="232" width="35.5556" height="96" rx="6" fill="var(--warn-fill)" opacity="0.2" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="732.4444" y="232" width="35.5556" height="96" rx="6" fill="var(--warn-fill)" opacity="0.15" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="711.1111" y="384" text-anchor="middle" font-family="sans-serif" font-size="17.0667" fill="var(--text-faint)">Column</text>
  <rect x="853.3333" y="208" width="170.6667" height="144" rx="6" fill="var(--primary-accent)" stroke="var(--info-border)" stroke-width="2.8444" />
  <circle cx="910.2222" cy="256" r="14.2222" fill="none" stroke="var(--info-border)" stroke-width="2.1333" />
  <circle cx="981.3333" cy="248" r="14.2222" fill="none" stroke="var(--info-border)" stroke-width="2.1333" />
  <circle cx="938.6667" cy="312" r="14.2222" fill="none" stroke="var(--info-border)" stroke-width="2.1333" />
  <line x1="921.6" y1="260.8" x2="969.9556" y2="252.8" stroke="var(--info-border)" stroke-width="1.4222" />
  <line x1="915.9111" y1="268.8" x2="931.5556" y2="299.2" stroke="var(--info-border)" stroke-width="1.4222" />
  <line x1="950.0444" y1="307.2" x2="974.2222" y2="260.8" stroke="var(--info-border)" stroke-width="1.4222" />
  <text x="938.6667" y="384" text-anchor="middle" font-family="sans-serif" font-size="17.0667" fill="var(--text-faint)">Graph</text>
  <line x1="284.4444" y1="480" x2="853.3333" y2="480" stroke="var(--ok-border)" stroke-width="2" opacity="0.4" />
  <polygon points="853.3333,473.6 870.4,480 853.3333,486.4" fill="var(--ok-fill)" opacity="0.5" />
  <text x="568.8889" y="512" text-anchor="middle" font-family="sans-serif" font-size="17.0667" fill="var(--ok-accent)" opacity="0.6">horizontal scalability</text>
  <text x="568.8889" y="80" text-anchor="middle" font-family="sans-serif" font-size="39.8222" font-weight="bold" fill="var(--surface)">NoSQL Database Fundamentals</text>
  <text x="568.8889" y="128" text-anchor="middle" font-family="monospace" font-size="19.9111" fill="var(--text-faint)">flexible schemas | distributed | scalable</text>
  <text x="568.8889" y="600" text-anchor="middle" font-family="monospace" font-size="17.0667" fill="var(--text-muted)">document | key-value | column | graph</text>
</svg>
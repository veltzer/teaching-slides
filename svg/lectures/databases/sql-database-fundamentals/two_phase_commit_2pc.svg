<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Two-Phase Commit Protocol (2PC)</ns0:text>
  <ns0:rect x="459.1033" y="84.2105" width="279.4542" height="117.8947" fill="#ffebee" stroke="#c62828" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="598.8304" y="158.3158" text-anchor="middle" font-size="21.9571" font-weight="bold" fill="#c62828">Coordinator</ns0:text>
  <ns0:rect x="59.883" y="303.1579" width="239.5322" height="117.8947" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="179.6491" y="377.2632" text-anchor="middle" font-size="19.961" fill="#1565c0">Participant A</ns0:text>
  <ns0:rect x="479.0643" y="303.1579" width="239.5322" height="117.8947" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="598.8304" y="377.2632" text-anchor="middle" font-size="19.961" fill="#1565c0">Participant B</ns0:text>
  <ns0:rect x="898.2456" y="303.1579" width="239.5322" height="117.8947" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="1018.0117" y="377.2632" text-anchor="middle" font-size="19.961" fill="#1565c0">Participant C</ns0:text>
  <ns0:line x1="538.9474" y1="202.1053" x2="179.6491" y2="296.4211" stroke="#e65100" stroke-width="2.9942" marker-end="url(#arrow2pc)" />
  <ns0:line x1="598.8304" y1="202.1053" x2="598.8304" y2="296.4211" stroke="#e65100" stroke-width="2.9942" marker-end="url(#arrow2pc)" />
  <ns0:line x1="658.7135" y1="202.1053" x2="1018.0117" y2="296.4211" stroke="#e65100" stroke-width="2.9942" marker-end="url(#arrow2pc)" />
  <ns0:text x="299.4152" y="252.6316" text-anchor="middle" font-size="19.961" fill="#e65100">PREPARE?</ns0:text>
  <ns0:text x="898.2456" y="252.6316" text-anchor="middle" font-size="19.961" fill="#e65100">PREPARE?</ns0:text>
  <ns0:rect x="59.883" y="454.7368" width="339.3373" height="185.2632" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="229.5516" y="512" text-anchor="middle" font-size="19.961" font-weight="bold" fill="#2e7d32">Phase 1: Prepare</ns0:text>
  <ns0:text x="229.5516" y="562.5263" text-anchor="middle" font-size="19.961">Each node votes YES/NO</ns0:text>
  <ns0:text x="229.5516" y="613.0526" text-anchor="middle" font-size="19.961">Locks resources, writes log</ns0:text>
  <ns0:rect x="459.1033" y="454.7368" width="339.3373" height="185.2632" fill="#fff3e0" stroke="#e65100" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="628.7719" y="512" text-anchor="middle" font-size="19.961" font-weight="bold" fill="#e65100">Phase 2: Commit</ns0:text>
  <ns0:text x="628.7719" y="562.5263" text-anchor="middle" font-size="19.961">All YES: COMMIT</ns0:text>
  <ns0:text x="628.7719" y="613.0526" text-anchor="middle" font-size="19.961">Any NO: ROLLBACK all</ns0:text>
  <ns0:rect x="858.3236" y="454.7368" width="319.3762" height="185.2632" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="1018.0117" y="512" text-anchor="middle" font-size="19.961" font-weight="bold" fill="#7b1fa2">Trade-off</ns0:text>
  <ns0:text x="1018.0117" y="562.5263" text-anchor="middle" font-size="19.961">Strong consistency</ns0:text>
  <ns0:text x="1018.0117" y="613.0526" text-anchor="middle" font-size="19.961">But: blocking protocol</ns0:text>
  <ns0:defs>
    <ns0:marker id="arrow2pc" markerWidth="19.961" markerHeight="33.6842" refX="17.9649" refY="10.1053" orient="auto">
      <ns0:path d="M 0 0 L 0 20.2105 L 17.9649 10.1053 z" fill="#e65100" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
  <!-- palette: resources/palette_diagram.yaml -->
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Two-Phase Commit Protocol (2PC)</ns0:text>
  <ns0:rect x="459.1033" y="84.2105" width="279.4542" height="117.8947" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="598.8304" y="158.3158" text-anchor="middle" font-size="21.9571" font-weight="bold" fill="var(--danger-dk)">Coordinator</ns0:text>
  <ns0:rect x="59.883" y="303.1579" width="239.5322" height="117.8947" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="179.6491" y="377.2632" text-anchor="middle" font-size="19.961" fill="var(--primary-dk)">Participant A</ns0:text>
  <ns0:rect x="479.0643" y="303.1579" width="239.5322" height="117.8947" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="598.8304" y="377.2632" text-anchor="middle" font-size="19.961" fill="var(--primary-dk)">Participant B</ns0:text>
  <ns0:rect x="898.2456" y="303.1579" width="239.5322" height="117.8947" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="3.9922" rx="5.9883" />
  <ns0:text x="1018.0117" y="377.2632" text-anchor="middle" font-size="19.961" fill="var(--primary-dk)">Participant C</ns0:text>
  <ns0:line x1="538.9474" y1="202.1053" x2="179.6491" y2="296.4211" stroke="var(--warn-dk)" stroke-width="2.9942" marker-end="url(#arrow2pc)" />
  <ns0:line x1="598.8304" y1="202.1053" x2="598.8304" y2="296.4211" stroke="var(--warn-dk)" stroke-width="2.9942" marker-end="url(#arrow2pc)" />
  <ns0:line x1="658.7135" y1="202.1053" x2="1018.0117" y2="296.4211" stroke="var(--warn-dk)" stroke-width="2.9942" marker-end="url(#arrow2pc)" />
  <ns0:text x="299.4152" y="252.6316" text-anchor="middle" font-size="19.961" fill="var(--warn-dk)">PREPARE?</ns0:text>
  <ns0:text x="898.2456" y="252.6316" text-anchor="middle" font-size="19.961" fill="var(--warn-dk)">PREPARE?</ns0:text>
  <ns0:rect x="59.883" y="454.7368" width="339.3373" height="185.2632" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="229.5516" y="512" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--ok-dk)">Phase 1: Prepare</ns0:text>
  <ns0:text x="229.5516" y="562.5263" text-anchor="middle" font-size="19.961">Each node votes YES/NO</ns0:text>
  <ns0:text x="229.5516" y="613.0526" text-anchor="middle" font-size="19.961">Locks resources, writes log</ns0:text>
  <ns0:rect x="459.1033" y="454.7368" width="339.3373" height="185.2632" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="628.7719" y="512" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--warn-dk)">Phase 2: Commit</ns0:text>
  <ns0:text x="628.7719" y="562.5263" text-anchor="middle" font-size="19.961">All YES: COMMIT</ns0:text>
  <ns0:text x="628.7719" y="613.0526" text-anchor="middle" font-size="19.961">Any NO: ROLLBACK all</ns0:text>
  <ns0:rect x="858.3236" y="454.7368" width="319.3762" height="185.2632" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="1.9961" rx="5.9883" />
  <ns0:text x="1018.0117" y="512" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--info-mid)">Trade-off</ns0:text>
  <ns0:text x="1018.0117" y="562.5263" text-anchor="middle" font-size="19.961">Strong consistency</ns0:text>
  <ns0:text x="1018.0117" y="613.0526" text-anchor="middle" font-size="19.961">But: blocking protocol</ns0:text>

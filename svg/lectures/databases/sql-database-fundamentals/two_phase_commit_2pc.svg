<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="618.5714" y="40" text-anchor="middle" font-size="24.6179" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Two-Phase Commit Protocol (2PC)</text>
  <rect x="468.5714" y="73.1428" width="300" height="116" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="618.5714" y="146.0572" text-anchor="middle" font-size="22.5664" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Coordinator</text>
  <rect x="40" y="288.5714" width="257.1429" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5714" y="361.4858" text-anchor="middle" font-size="20.5149" fill="var(--primary-accent)" font-family="Arial, sans-serif">Participant A</text>
  <rect x="490" y="288.5714" width="257.1429" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="618.5714" y="361.4858" text-anchor="middle" font-size="20.5149" fill="var(--primary-accent)" font-family="Arial, sans-serif">Participant B</text>
  <rect x="940" y="288.5714" width="257.1429" height="116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5714" y="361.4858" text-anchor="middle" font-size="20.5149" fill="var(--primary-accent)" font-family="Arial, sans-serif">Participant C</text>
  <line x1="554.2858" y1="189.1429" x2="168.5714" y2="281.9429" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="618.5714" y1="189.1429" x2="618.5714" y2="281.9429" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="682.8572" y1="189.1429" x2="1068.5714" y2="281.9429" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="297.1429" y="238.8572" text-anchor="middle" font-size="20.5149" fill="var(--warn-accent)" font-family="Arial, sans-serif">PREPARE?</text>
  <text x="940" y="238.8572" text-anchor="middle" font-size="20.5149" fill="var(--warn-accent)" font-family="Arial, sans-serif">PREPARE?</text>
  <rect x="40" y="437.7142" width="364.2858" height="182.2858" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="222.1428" y="494.0571" text-anchor="middle" font-size="20.5149" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Phase 1: Prepare</text>
  <text x="222.1428" y="543.7714" text-anchor="middle" font-size="20.5149" font-family="Arial, sans-serif" fill="var(--ok-text)">Each node votes YES/NO</text>
  <text x="222.1428" y="593.4857" text-anchor="middle" font-size="20.5149" font-family="Arial, sans-serif" fill="var(--ok-text)">Locks resources, writes log</text>
  <rect x="468.5714" y="437.7142" width="364.2858" height="182.2858" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="650.7143" y="494.0571" text-anchor="middle" font-size="20.5149" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Phase 2: Commit</text>
  <text x="650.7143" y="543.7714" text-anchor="middle" font-size="20.5149" font-family="Arial, sans-serif" fill="var(--warn-text)">All YES: COMMIT</text>
  <text x="650.7143" y="593.4857" text-anchor="middle" font-size="20.5149" font-family="Arial, sans-serif" fill="var(--warn-text)">Any NO: ROLLBACK all</text>
  <rect x="897.1429" y="437.7142" width="342.8571" height="182.2858" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5714" y="494.0571" text-anchor="middle" font-size="20.5149" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Trade-off</text>
  <text x="1068.5714" y="543.7714" text-anchor="middle" font-size="20.5149" font-family="Arial, sans-serif" fill="var(--info-text)">Strong consistency</text>
  <text x="1068.5714" y="593.4857" text-anchor="middle" font-size="20.5149" font-family="Arial, sans-serif" fill="var(--info-text)">But: blocking protocol</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

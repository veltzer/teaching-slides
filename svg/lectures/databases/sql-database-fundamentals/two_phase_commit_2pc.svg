<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Two-Phase Commit Protocol (2PC)</text>
  <rect x="459.1033" y="84.2105" width="279.4542" height="117.8947" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="158.3158" text-anchor="middle" font-size="21.9571" font-weight="bold" fill="var(--danger-accent)">Coordinator</text>
  <rect x="59.883" y="303.1579" width="239.5322" height="117.8947" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="179.6491" y="377.2632" text-anchor="middle" font-size="19.961" fill="var(--primary-accent)">Participant A</text>
  <rect x="479.0643" y="303.1579" width="239.5322" height="117.8947" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="598.8304" y="377.2632" text-anchor="middle" font-size="19.961" fill="var(--primary-accent)">Participant B</text>
  <rect x="898.2456" y="303.1579" width="239.5322" height="117.8947" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1018.0117" y="377.2632" text-anchor="middle" font-size="19.961" fill="var(--primary-accent)">Participant C</text>
  <line x1="538.9474" y1="202.1053" x2="179.6491" y2="296.4211" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow2pc)" />
  <line x1="598.8304" y1="202.1053" x2="598.8304" y2="296.4211" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow2pc)" />
  <line x1="658.7135" y1="202.1053" x2="1018.0117" y2="296.4211" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow2pc)" />
  <text x="299.4152" y="252.6316" text-anchor="middle" font-size="19.961" fill="var(--warn-accent)">PREPARE?</text>
  <text x="898.2456" y="252.6316" text-anchor="middle" font-size="19.961" fill="var(--warn-accent)">PREPARE?</text>
  <rect x="59.883" y="454.7368" width="339.3373" height="185.2632" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="229.5516" y="512" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--ok-accent)">Phase 1: Prepare</text>
  <text x="229.5516" y="562.5263" text-anchor="middle" font-size="19.961">Each node votes YES/NO</text>
  <text x="229.5516" y="613.0526" text-anchor="middle" font-size="19.961">Locks resources, writes log</text>
  <rect x="459.1033" y="454.7368" width="339.3373" height="185.2632" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="628.7719" y="512" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--warn-accent)">Phase 2: Commit</text>
  <text x="628.7719" y="562.5263" text-anchor="middle" font-size="19.961">All YES: COMMIT</text>
  <text x="628.7719" y="613.0526" text-anchor="middle" font-size="19.961">Any NO: ROLLBACK all</text>
  <rect x="858.3236" y="454.7368" width="319.3762" height="185.2632" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1018.0117" y="512" text-anchor="middle" font-size="19.961" font-weight="bold" fill="var(--info-accent)">Trade-off</text>
  <text x="1018.0117" y="562.5263" text-anchor="middle" font-size="19.961">Strong consistency</text>
  <text x="1018.0117" y="613.0526" text-anchor="middle" font-size="19.961">But: blocking protocol</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2pc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#e65100" />
    </marker>
  </defs>
</svg>
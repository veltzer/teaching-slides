<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="618.5714" y="40" text-anchor="middle" font-size="24.6179" font-weight="bold">Two-Phase Commit Protocol (2PC)</text>
  <rect x="468.5714" y="73.1428" width="300" height="116" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="618.5714" y="146.0572" text-anchor="middle" font-size="22.5664" font-weight="bold" fill="var(--danger-accent)">Coordinator</text>
  <rect x="40" y="288.5714" width="257.1429" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="168.5714" y="361.4858" text-anchor="middle" font-size="20.5149" fill="var(--primary-accent)">Participant A</text>
  <rect x="490" y="288.5714" width="257.1429" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="618.5714" y="361.4858" text-anchor="middle" font-size="20.5149" fill="var(--primary-accent)">Participant B</text>
  <rect x="940" y="288.5714" width="257.1429" height="116" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1068.5714" y="361.4858" text-anchor="middle" font-size="20.5149" fill="var(--primary-accent)">Participant C</text>
  <line x1="554.2858" y1="189.1429" x2="168.5714" y2="281.9429" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow2pc)" />
  <line x1="618.5714" y1="189.1429" x2="618.5714" y2="281.9429" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow2pc)" />
  <line x1="682.8572" y1="189.1429" x2="1068.5714" y2="281.9429" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow2pc)" />
  <text x="297.1429" y="238.8572" text-anchor="middle" font-size="20.5149" fill="var(--warn-accent)">PREPARE?</text>
  <text x="940" y="238.8572" text-anchor="middle" font-size="20.5149" fill="var(--warn-accent)">PREPARE?</text>
  <rect x="40" y="437.7142" width="364.2858" height="182.2858" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="222.1428" y="494.0571" text-anchor="middle" font-size="20.5149" font-weight="bold" fill="var(--ok-accent)">Phase 1: Prepare</text>
  <text x="222.1428" y="543.7714" text-anchor="middle" font-size="20.5149">Each node votes YES/NO</text>
  <text x="222.1428" y="593.4857" text-anchor="middle" font-size="20.5149">Locks resources, writes log</text>
  <rect x="468.5714" y="437.7142" width="364.2858" height="182.2858" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="650.7143" y="494.0571" text-anchor="middle" font-size="20.5149" font-weight="bold" fill="var(--warn-accent)">Phase 2: Commit</text>
  <text x="650.7143" y="543.7714" text-anchor="middle" font-size="20.5149">All YES: COMMIT</text>
  <text x="650.7143" y="593.4857" text-anchor="middle" font-size="20.5149">Any NO: ROLLBACK all</text>
  <rect x="897.1429" y="437.7142" width="342.8571" height="182.2858" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="1068.5714" y="494.0571" text-anchor="middle" font-size="20.5149" font-weight="bold" fill="var(--info-accent)">Trade-off</text>
  <text x="1068.5714" y="543.7714" text-anchor="middle" font-size="20.5149">Strong consistency</text>
  <text x="1068.5714" y="593.4857" text-anchor="middle" font-size="20.5149">But: blocking protocol</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2pc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#e65100" />
    </marker>
  </defs>
</svg>
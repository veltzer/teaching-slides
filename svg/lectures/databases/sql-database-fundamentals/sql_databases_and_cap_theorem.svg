<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="390" height="443.826087" rx="6.02603" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="4" filter="url(#shadow)"/>
  <text x="235" y="140.869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="120.52061" font-weight="bold" fill="var(--danger-text)">C</text>
  <text x="235" y="221.565217" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.130152" font-weight="bold" fill="var(--danger-text)">Consistency</text>
  <text x="235" y="302.26087" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768" fill="var(--danger-text)">ACID transactions</text>
  <text x="235" y="352.695652" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768" fill="var(--danger-text)">strong guarantees</text>
  <text x="235" y="443.478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768" font-weight="bold" fill="var(--danger-text)">SQL picks this</text>

  <rect x="445" y="40" width="390" height="443.826087" rx="6.02603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="4" filter="url(#shadow)"/>
  <text x="640" y="140.869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="120.52061" font-weight="bold" fill="var(--ok-text)">A</text>
  <text x="640" y="221.565217" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.130152" font-weight="bold" fill="var(--ok-text)">Availability</text>
  <text x="640" y="302.26087" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768" fill="var(--ok-text)">Replicas serve reads</text>
  <text x="640" y="352.695652" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768" fill="var(--ok-text)">primary handles writes</text>
  <text x="640" y="443.478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768" font-weight="bold" fill="var(--ok-text)">Degrades on partition</text>

  <rect x="850" y="40" width="390" height="443.826087" rx="6.02603" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8,6" filter="url(#shadow)"/>
  <text x="1045" y="140.869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="120.52061" font-weight="bold" fill="var(--primary-text)">P</text>
  <text x="1045" y="221.565217" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.130152" font-weight="bold" fill="var(--primary-text)">Partition tolerance</text>
  <text x="1045" y="302.26087" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768" fill="var(--primary-text)">Traditional SQL</text>
  <text x="1045" y="352.695652" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768" fill="var(--primary-text)">runs on one node</text>
  <text x="1045" y="443.478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768" font-weight="bold" fill="var(--primary-text)">Sacrificed - CA system</text>

  <rect x="40" y="514.086957" width="1200" height="105.913043" rx="6.02603" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="549.391304" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445" font-weight="bold" fill="var(--primary-accent)">Traditional SQL = CA</text>
  <text x="640" y="584.695652" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073753" fill="var(--text-muted)">Single-node Postgres or MySQL assumes no network partition inside the box.</text>
  <text x="640" y="614.956522" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073753" fill="var(--text-muted)">Distributed SQL (CockroachDB, Spanner) trades latency for CP to regain partition tolerance.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="23.9532" font-weight="bold">Raft Consensus: Leader-Based Replication</text>
  <rect x="419.1813" y="84.2105" width="199.6101" height="134.7368" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="518.9864" y="141.4737" text-anchor="middle" font-size="21.9571" font-weight="bold" fill="var(--danger-accent)">Leader</text>
  <text x="518.9864" y="192" text-anchor="middle" font-size="19.961">Handles writes</text>
  <rect x="99.8051" y="303.1579" width="199.6101" height="134.7368" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="199.6101" y="360.4211" text-anchor="middle" font-size="21.9571" fill="var(--primary-accent)">Follower A</text>
  <text x="199.6101" y="410.9474" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Replicates log</text>
  <rect x="419.1813" y="303.1579" width="199.6101" height="134.7368" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="518.9864" y="360.4211" text-anchor="middle" font-size="21.9571" fill="var(--primary-accent)">Follower B</text>
  <text x="518.9864" y="410.9474" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Replicates log</text>
  <rect x="738.5575" y="303.1579" width="199.6101" height="134.7368" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="838.3626" y="360.4211" text-anchor="middle" font-size="21.9571" fill="var(--primary-accent)">Follower C</text>
  <text x="838.3626" y="410.9474" text-anchor="middle" font-size="19.961" fill="var(--text-muted)">Replicates log</text>
  <line x1="459.1033" y1="218.9474" x2="239.5322" y2="296.4211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowraft)" />
  <line x1="518.9864" y1="218.9474" x2="518.9864" y2="296.4211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowraft)" />
  <line x1="578.8694" y1="218.9474" x2="798.4405" y2="296.4211" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowraft)" />
  <text x="339.3373" y="262.7368" font-size="19.961" fill="var(--ok-accent)">AppendEntries</text>
  <rect x="199.6101" y="488.4211" width="638.7525" height="67.3684" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="518.9864" y="535.5789" text-anchor="middle" font-size="19.961" fill="var(--ok-accent)">Majority ACK (2/3) required to commit entry</text>
  <rect x="199.6101" y="572.6316" width="638.7525" height="67.3684" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="518.9864" y="619.7895" text-anchor="middle" font-size="19.961" fill="var(--warn-accent)">Leader fails? Election selects new leader with latest log</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowraft" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#2e7d32" />
    </marker>
  </defs>
</svg>
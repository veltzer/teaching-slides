<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="754.2857" y="40" text-anchor="middle" font-size="28.4263" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Raft Consensus: Leader-Based Replication</text>
  <rect x="497.1429" y="73.1428" width="285.7143" height="132.5714" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="129.4857" text-anchor="middle" font-size="26.0574" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Leader</text>
  <text x="640.0001" y="179.2" text-anchor="middle" font-size="23.6886" font-family="Arial, sans-serif" fill="var(--danger-text)">Handles writes</text>
  <rect x="40" y="288.5714" width="285.7143" height="132.5714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="182.8571" y="344.9143" text-anchor="middle" font-size="26.0574" fill="var(--primary-accent)" font-family="Arial, sans-serif">Follower A</text>
  <text x="182.8571" y="394.6286" text-anchor="middle" font-size="23.6886" fill="var(--text-muted)" font-family="Arial, sans-serif">Replicates log</text>
  <rect x="497.1429" y="288.5714" width="285.7143" height="132.5714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="344.9143" text-anchor="middle" font-size="26.0574" fill="var(--primary-accent)" font-family="Arial, sans-serif">Follower B</text>
  <text x="640.0001" y="394.6286" text-anchor="middle" font-size="23.6886" fill="var(--text-muted)" font-family="Arial, sans-serif">Replicates log</text>
  <rect x="954.2857" y="288.5714" width="285.7143" height="132.5714" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1097.1429" y="344.9143" text-anchor="middle" font-size="26.0574" fill="var(--primary-accent)" font-family="Arial, sans-serif">Follower C</text>
  <text x="1097.1429" y="394.6286" text-anchor="middle" font-size="23.6886" fill="var(--text-muted)" font-family="Arial, sans-serif">Replicates log</text>
  <line x1="554.2857" y1="205.7143" x2="240" y2="281.9429" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640.0001" y1="205.7143" x2="640.0001" y2="281.9429" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="725.7143" y1="205.7143" x2="1040" y2="281.9429" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="382.8572" y="248.8" font-size="23.6886" fill="var(--ok-accent)" font-family="Arial, sans-serif">AppendEntries</text>
  <rect x="182.8571" y="470.8572" width="914.2859" height="66.2857" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="517.2571" text-anchor="middle" font-size="23.6886" fill="var(--ok-accent)" font-family="Arial, sans-serif">Majority ACK (2/3) required to commit entry</text>
  <rect x="182.8571" y="553.7143" width="914.2859" height="66.2857" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="600.1143" text-anchor="middle" font-size="23.6886" fill="var(--warn-accent)" font-family="Arial, sans-serif">Leader fails? Election selects new leader with latest log</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
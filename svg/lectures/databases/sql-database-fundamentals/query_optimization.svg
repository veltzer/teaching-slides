<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">SELECT ... FROM orders JOIN customers ON ...</text>
  <text x="640" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Planner considers candidate join algorithms and picks the cheapest</text>

  <rect x="40" y="160" width="390" height="260" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="235" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Plan A: Nested Loop</text>
  <text x="235" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">For each outer row,</text>
  <text x="235" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">scan inner table</text>
  <text x="235" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Good for small outer</text>
  <text x="235" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">and indexed inner</text>
  <text x="235" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Cost: 1000</text>

  <rect x="445" y="160" width="390" height="260" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Plan B: Hash Join</text>
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Build hash on smaller</text>
  <text x="640" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">table, probe with other</text>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Best for equality joins</text>
  <text x="640" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">on large unsorted data</text>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Cost: 100  chosen</text>

  <rect x="850" y="160" width="390" height="260" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1045" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Plan C: Merge Join</text>
  <text x="1045" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Sort both inputs,</text>
  <text x="1045" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">then walk in lockstep</text>
  <text x="1045" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Wins when both sides</text>
  <text x="1045" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">already sorted on key</text>
  <text x="1045" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Cost: 500</text>

  <rect x="40" y="450" width="1200" height="170" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Cost-based optimization</text>
  <text x="640" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Cost uses statistics: row counts, distinct values, index selectivity.</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Stale stats lead to bad plans; ANALYZE refreshes them.</text>
  <text x="640" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">EXPLAIN shows the chosen plan; EXPLAIN ANALYZE adds real timings.</text>
</svg>

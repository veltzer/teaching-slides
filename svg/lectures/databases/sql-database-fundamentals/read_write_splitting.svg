<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.807319" font-weight="bold" fill="var(--text)">Read / Write Splitting</text>

  <rect x="40" y="71.636364" width="360" height="263.636364" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="220" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.699677" font-weight="bold" fill="var(--danger-text)">Write Path</text>
  <text x="220" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" fill="var(--danger-text)">INSERT / UPDATE / DELETE</text>
  <text x="220" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" fill="var(--danger-text)">Master only</text>
  <text x="220" y="266.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" fill="var(--danger-text)">Strongly consistent</text>
  <text x="220" y="308.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" fill="var(--danger-text)">Single point of truth</text>

  <rect x="460" y="71.636364" width="360" height="263.636364" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.699677" font-weight="bold" fill="var(--primary-text)">Master DB</text>
  <text x="640" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" fill="var(--primary-text)">Accepts all writes</text>
  <text x="640" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" fill="var(--primary-text)">Streams replication log</text>
  <text x="640" y="266.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" fill="var(--primary-text)">May also serve reads</text>
  <text x="640" y="308.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" fill="var(--primary-text)">Failover target</text>

  <rect x="880" y="71.636364" width="360" height="263.636364" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="129.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.699677" font-weight="bold" fill="var(--ok-text)">Read Path</text>
  <text x="1060" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" fill="var(--ok-text)">SELECT queries</text>
  <text x="1060" y="224.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" fill="var(--ok-text)">Any replica serves</text>
  <text x="1060" y="266.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" fill="var(--ok-text)">Scales horizontally</text>
  <text x="1060" y="308.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538213" fill="var(--ok-text)">May lag master</text>

  <line x1="400" y1="203.454545" x2="460" y2="203.454545" stroke="var(--danger-border)" stroke-width="3" marker-end="url(#arrow-danger)"/>
  <line x1="820" y1="203.454545" x2="880" y2="203.454545" stroke="var(--ok-border)" stroke-width="3" marker-end="url(#arrow-ok)"/>

  <rect x="40" y="377.454545" width="1200" height="242.545455" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="419.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--text)">Why split?</text>
  <text x="640" y="461.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--text-muted)">Read workloads typically outnumber writes by 10x or more.</text>
  <text x="640" y="498.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--text-muted)">Adding replicas scales read throughput without touching write correctness.</text>
  <text x="640" y="540.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--text-muted)">Applications must tolerate replication lag — stale reads are normal.</text>
  <text x="640" y="583.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" fill="var(--text-muted)">Use read-your-writes routing when freshness matters for a specific flow.</text>
</svg>

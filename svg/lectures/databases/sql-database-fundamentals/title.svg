  <text x="955" y="237.2" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">id</text>
  <text x="1007.4999" y="237.2" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">name</text>
  <text x="1090" y="237.2" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">dept</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <ellipse cx="640" cy="228.5" rx="180" ry="38.6667" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444"/>
  <rect x="460" y="228.5" width="360" height="203" fill="var(--primary-accent)" rx="6"/>
  <line x1="460" y1="228.5" x2="460" y2="431.5" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="820" y1="228.5" x2="820" y2="431.5" stroke="var(--ok-border)" stroke-width="2"/>
  <ellipse cx="640" cy="431.5" rx="180" ry="38.6667" fill="var(--primary-accent)" stroke="var(--ok-border)" stroke-width="2.8444"/>
  <ellipse cx="640" cy="293.75" rx="164.9999" ry="19.3333" fill="none" stroke="var(--ok-border)" stroke-width="1.1378" opacity="0.4"/>
  <ellipse cx="640" cy="359" rx="164.9999" ry="19.3333" fill="none" stroke="var(--ok-border)" stroke-width="1.1378" opacity="0.3"/>
  <rect x="910" y="214" width="240" height="159.5" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.1333"/>
  <rect x="910" y="214" width="240" height="31.9" rx="6" fill="url(#grad-danger)" opacity="0.2" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955" y="237.2" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">id</text>
  <text x="1007.4999" y="237.2" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">name</text>
  <text x="1090" y="237.2" font-size="13.9044" fill="var(--danger-accent)" font-family="Courier New, monospace">dept</text>
  <line x1="910" y1="245.9" x2="1149.9999" y2="245.9" stroke="var(--danger-border)" stroke-width="0.7111" opacity="0.5"/>
  <text x="955" y="269.1" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">1</text>
  <text x="1007.4999" y="269.1" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">Alice</text>
  <text x="1090" y="269.1" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">Eng</text>
  <text x="955" y="293.75" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">2</text>
  <text x="1007.4999" y="293.75" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">Bob</text>
  <text x="1090" y="293.75" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">Sales</text>
  <text x="955" y="318.4" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">3</text>
  <text x="1007.4999" y="318.4" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">Eve</text>
  <text x="1090" y="318.4" font-size="13.9044" fill="var(--text-faint)" font-family="Courier New, monospace">Eng</text>
  <text x="220" y="293.75" text-anchor="middle" font-size="16.6854" fill="var(--warn-accent)" font-family="Courier New, monospace">SELECT *</text>
  <text x="220" y="322.75" text-anchor="middle" font-size="16.6854" fill="var(--warn-accent)" font-family="Courier New, monospace">FROM users</text>
  <text x="220" y="351.75" text-anchor="middle" font-size="16.6854" fill="var(--warn-accent)" font-family="Courier New, monospace">WHERE ...</text>
  <line x1="925" y1="402.5" x2="985" y2="446" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="1090" y1="402.5" x2="1030" y2="446" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1030" y="475" text-anchor="middle" font-size="13.9044" fill="var(--info-accent)" font-family="Courier New, monospace">JOIN</text>
  <rect x="535" y="489.5" width="210" height="40.6" rx="6" fill="url(#grad-ok)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="517.05" text-anchor="middle" font-size="16.6854" font-weight="bold" fill="var(--ok-accent)" font-family="Courier New, monospace">A C I D</text>
  <text x="640" y="112.5" text-anchor="middle" font-size="38.9324" font-weight="bold" fill="var(--surface)" font-family="Arial, sans-serif">SQL Database Fundamentals</text>
  <text x="640" y="591" text-anchor="middle" font-size="18.0758" fill="var(--text-muted)" font-family="Courier New, monospace">relational | structured | ACID | normalized</text>
</svg>

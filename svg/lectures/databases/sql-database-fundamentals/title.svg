  <text x="220" y="322.75" text-anchor="middle" font-size="16.6854" fill="var(--warn-accent)" font-family="Courier New, monospace">FROM users</text>
  <text x="220" y="351.75" text-anchor="middle" font-size="16.6854" fill="var(--warn-accent)" font-family="Courier New, monospace">WHERE ...</text>
  <line x1="925" y1="402.5" x2="985" y2="446" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="1090" y1="402.5" x2="1030" y2="446" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1030" y="475" text-anchor="middle" font-size="13.9044" fill="var(--info-accent)" font-family="Courier New, monospace">JOIN</text>
  <rect x="535" y="489.5" width="210" height="40.6" rx="6" fill="url(#grad-ok)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="517.05" text-anchor="middle" font-size="16.6854" font-weight="bold" fill="var(--ok-accent)" font-family="Courier New, monospace">A C I D</text>
  <text x="640" y="112.5" text-anchor="middle" font-size="38.9324" font-weight="bold" fill="var(--surface)" font-family="Arial, sans-serif">SQL Database Fundamentals</text>
  <text x="640" y="591" text-anchor="middle" font-size="18.0758" fill="var(--text-muted)" font-family="Courier New, monospace">relational | structured | ACID | normalized</text>
</svg>

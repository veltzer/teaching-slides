  <ellipse cx="568.8889" cy="352" rx="156.4444" ry="21.3333" fill="none" stroke="var(--ok-border)" stroke-width="1.1378" opacity="0.3" />
  <rect x="824.8889" y="192" width="227.5556" height="176" rx="6" fill="var(--primary-accent)" stroke="var(--danger-border)" stroke-width="2.1333" />
  <rect x="824.8889" y="192" width="227.5556" height="35.2" rx="6" fill="var(--danger-fill)" opacity="0.2" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="867.5556" y="217.6" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)">id</text>
  <text x="917.3333" y="217.6" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)">name</text>
  <text x="995.5556" y="217.6" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)">dept</text>

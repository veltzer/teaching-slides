  <text x="867.5556" y="252.8" font-family="monospace" font-size="14.2222" fill="var(--text-faint)">1</text>
  <text x="917.3333" y="252.8" font-family="monospace" font-size="14.2222" fill="var(--text-faint)">Alice</text>
  <text x="995.5556" y="252.8" font-family="monospace" font-size="14.2222" fill="var(--text-faint)">Eng</text>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Database cylinder -->
  <ellipse cx="400" cy="130" rx="120" ry="30" fill="#0f3460" stroke="#16c79a" stroke-width="2"/>
  <rect x="280" y="130" width="240" height="140" fill="#0f3460"/>
  <line x1="280" y1="130" x2="280" y2="270" stroke="#16c79a" stroke-width="2"/>
  <line x1="520" y1="130" x2="520" y2="270" stroke="#16c79a" stroke-width="2"/>
  <ellipse cx="400" cy="270" rx="120" ry="30" fill="#0f3460" stroke="#16c79a" stroke-width="2"/>
  <!-- Table lines inside -->
  <ellipse cx="400" cy="175" rx="110" ry="15" fill="none" stroke="#16c79a" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="400" cy="220" rx="110" ry="15" fill="none" stroke="#16c79a" stroke-width="0.8" opacity="0.3"/>
  <!-- Table visualization on the right -->
  <rect x="580" y="120" width="160" height="110" rx="4" fill="#0f3460" stroke="#e94560" stroke-width="1.5"/>
  <rect x="580" y="120" width="160" height="22" rx="4" fill="#e94560" opacity="0.2"/>
  <text x="610" y="136" font-family="monospace" font-size="10" fill="#e94560">id</text>
  <text x="645" y="136" font-family="monospace" font-size="10" fill="#e94560">name</text>
  <text x="700" y="136" font-family="monospace" font-size="10" fill="#e94560">dept</text>
  <line x1="580" y1="142" x2="740" y2="142" stroke="#e94560" stroke-width="0.5" opacity="0.5"/>
  <text x="610" y="158" font-family="monospace" font-size="10" fill="#888">1</text>
  <text x="645" y="158" font-family="monospace" font-size="10" fill="#888">Alice</text>
  <text x="700" y="158" font-family="monospace" font-size="10" fill="#888">Eng</text>
  <text x="610" y="175" font-family="monospace" font-size="10" fill="#888">2</text>
  <text x="645" y="175" font-family="monospace" font-size="10" fill="#888">Bob</text>
  <text x="700" y="175" font-family="monospace" font-size="10" fill="#888">Sales</text>
  <text x="610" y="192" font-family="monospace" font-size="10" fill="#888">3</text>
  <text x="645" y="192" font-family="monospace" font-size="10" fill="#888">Eve</text>
  <text x="700" y="192" font-family="monospace" font-size="10" fill="#888">Eng</text>
  <!-- SQL query -->
  <text x="120" y="175" text-anchor="middle" font-family="monospace" font-size="12" fill="#f5a623">SELECT *</text>
  <text x="120" y="195" text-anchor="middle" font-family="monospace" font-size="12" fill="#f5a623">FROM users</text>
  <text x="120" y="215" text-anchor="middle" font-family="monospace" font-size="12" fill="#f5a623">WHERE ...</text>
  <!-- Relationship arrows -->
  <line x1="590" y1="250" x2="630" y2="280" stroke="#a855f7" stroke-width="1.5"/>
  <line x1="700" y1="250" x2="660" y2="280" stroke="#a855f7" stroke-width="1.5"/>
  <text x="660" y="300" text-anchor="middle" font-family="monospace" font-size="10" fill="#a855f7">JOIN</text>
  <!-- ACID badge -->
  <rect x="330" y="310" width="140" height="28" rx="14" fill="#16c79a" opacity="0.15" stroke="#16c79a" stroke-width="1"/>
  <text x="400" y="329" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#16c79a">A C I D</text>
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#eee">SQL Database Fundamentals</text>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="13" fill="#666">relational | structured | ACID | normalized</text>
</svg>

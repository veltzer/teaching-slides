  <text x="995.5556" y="307.2" font-family="monospace" font-size="14.2222" fill="var(--text-faint)">Eng</text>
  <text x="170.6667" y="280" text-anchor="middle" font-family="monospace" font-size="17.0667" fill="var(--warn-accent)">SELECT *</text>
  <text x="170.6667" y="312" text-anchor="middle" font-family="monospace" font-size="17.0667" fill="var(--warn-accent)">FROM users</text>
  <text x="170.6667" y="344" text-anchor="middle" font-family="monospace" font-size="17.0667" fill="var(--warn-accent)">WHERE ...</text>
  <line x1="839.1111" y1="400" x2="896" y2="448" stroke="var(--info-border)" stroke-width="2" />
  <line x1="995.5556" y1="400" x2="938.6667" y2="448" stroke="var(--info-border)" stroke-width="2" />
  <text x="938.6667" y="480" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--info-accent)">JOIN</text>
  <rect x="469.3333" y="496" width="199.1111" height="44.8" rx="6" fill="var(--ok-fill)" opacity="0.15" stroke="var(--ok-border)" stroke-width="2" />
  <text x="568.8889" y="526.4" text-anchor="middle" font-family="monospace" font-size="17.0667" font-weight="bold" fill="var(--ok-accent)">A C I D</text>
  <text x="568.8889" y="80" text-anchor="middle" font-family="sans-serif" font-size="39.8222" font-weight="bold" fill="var(--surface)">SQL Database Fundamentals</text>
  <text x="568.8889" y="608" text-anchor="middle" font-family="monospace" font-size="18.4889" fill="var(--text-muted)">relational | structured | ACID | normalized</text>
</svg>
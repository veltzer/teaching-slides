<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="213.3333" y="180" width="384" height="360" fill="#ffe0e0" stroke="#333" stroke-width="4.2667" />
  <rect x="682.6667" y="180" width="384" height="360" fill="#e0ffe0" stroke="#333" stroke-width="4.2667" />
  <text x="405.3333" y="108" text-anchor="middle" font-size="25.6" font-weight="bold">Pessimistic</text>
  <text x="874.6667" y="108" text-anchor="middle" font-size="25.6" font-weight="bold">Optimistic</text>
  <text x="405.3333" y="324" text-anchor="middle" font-size="23.4667">Lock first</text>
  <text x="405.3333" y="396" text-anchor="middle" font-size="23.4667">Then modify</text>
  <text x="405.3333" y="468" text-anchor="middle" font-size="23.4667">Prevents conflicts</text>
  <text x="874.6667" y="324" text-anchor="middle" font-size="23.4667">Modify freely</text>
  <text x="874.6667" y="396" text-anchor="middle" font-size="23.4667">Check at commit</text>
  <text x="874.6667" y="468" text-anchor="middle" font-size="23.4667">Retry if conflict</text>

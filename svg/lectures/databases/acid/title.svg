<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <ellipse cx="568.8889" cy="192" rx="113.7778" ry="35.5556" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" />
  <path d="M 455.1111 192 v 96 a 113.7778 35.5556 0 0 0 227.5556 0 v -96" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" />
  <ellipse cx="568.8889" cy="288" rx="113.7778" ry="35.5556" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" opacity="0.5" />
  <path d="M 455.1111 288 v 96 a 113.7778 35.5556 0 0 0 227.5556 0 v -96" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" />
  <ellipse cx="568.8889" cy="384" rx="113.7778" ry="35.5556" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" opacity="0.3" />
  <path d="M 213.3333 256 l 56.8889 -48 l 56.8889 48 v 80 a 56.8889 56.8889 0 0 1 -113.7778 0 z" fill="none" stroke="var(--primary-border)" stroke-width="4.2667" />
  <circle cx="270.2222" cy="312" r="11.3778" fill="var(--danger-fill)" />
  <rect x="265.9556" y="312" width="8.5333" height="24" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <g transform="translate(570,130)">
    <circle cx="0" cy="0" r="21.3333" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
    <path d="M -8.5333 0 l 5.6889 8 l 12.8 -16" fill="none" stroke="var(--primary-border)" stroke-width="3.5556" />
    <text x="31.2889" y="8" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="19.9111" font-weight="bold">Atomicity</text>
  </g>
  <g transform="translate(570,170)">
    <circle cx="0" cy="0" r="21.3333" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
    <path d="M -8.5333 0 l 5.6889 8 l 12.8 -16" fill="none" stroke="var(--primary-border)" stroke-width="3.5556" />
    <text x="31.2889" y="8" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="19.9111" font-weight="bold">Consistency</text>
  </g>
  <g transform="translate(570,210)">
    <circle cx="0" cy="0" r="21.3333" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
    <path d="M -8.5333 0 l 5.6889 8 l 12.8 -16" fill="none" stroke="var(--primary-border)" stroke-width="3.5556" />
    <text x="31.2889" y="8" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="19.9111" font-weight="bold">Isolation</text>
  </g>
  <g transform="translate(570,250)">
    <circle cx="0" cy="0" r="21.3333" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
    <path d="M -8.5333 0 l 5.6889 8 l 12.8 -16" fill="none" stroke="var(--primary-border)" stroke-width="3.5556" />
    <text x="31.2889" y="8" fill="var(--primary-accent)" font-family="Arial,sans-serif" font-size="19.9111" font-weight="bold">Durability</text>
  </g>
  <text x="568.8889" y="544" text-anchor="middle" fill="var(--surface)" font-family="Arial,sans-serif" font-size="45.5111" font-weight="bold">Database ACID Guarantees</text>
  <text x="568.8889" y="592" text-anchor="middle" fill="var(--text-faint)" font-family="Arial,sans-serif" font-size="22.7556">Reliable Transaction Processing</text>
</svg>
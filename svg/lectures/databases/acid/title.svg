<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1090.9091" height="539.5349" fill="url(#bg)" rx="6" x="149.0909" y="80.4651"/>
  <ellipse cx="694.5455" cy="242.3256" rx="109.0909" ry="29.9742" fill="none" stroke="var(--danger-border)" stroke-width="4.2667"/>
  <path d="M 585.4545 242.3256 v 241.1364 a 176.3824 183.1819 80.4651 149.0909 80.4651 367.2728 80.4651 v 57.0455" fill="none" stroke="var(--danger-border)" stroke-width="4.2667"/>
  <ellipse cx="694.5455" cy="323.2558" rx="109.0909" ry="29.9742" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" opacity="0.5"/>
  <path d="M 585.4545 323.2558 v 241.1364 a 176.3824 183.1819 80.4651 149.0909 80.4651 367.2728 80.4651 v 57.0455" fill="none" stroke="var(--danger-border)" stroke-width="4.2667"/>
  <ellipse cx="694.5455" cy="404.186" rx="109.0909" ry="29.9742" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" opacity="0.3"/>
  <path d="M 353.6363 296.2791 l 203.6364 40 l 203.6364 120.9302 v 225.7955 a 128.4238 203.6364 80.4651 149.0909 81.3081 40 80.4651 z" fill="none" stroke="var(--primary-border)" stroke-width="4.2667"/>
  <circle cx="408.1818" cy="343.4884" r="10.2292" fill="var(--danger-fill)"/>
  <rect x="404.091" y="343.4884" width="8.1818" height="20.2326" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <g transform="translate(570,130)">
    <circle cx="149.0909" cy="80.4651" r="19.1798" fill="none" stroke="var(--primary-border)" stroke-width="2.8444"/>
    <path d="M 140.9091 80.4651 l 154.5455 87.2093 l 161.3637 66.9767" fill="none" stroke="var(--primary-border)" stroke-width="3.5556"/>
    <text x="179.0909" y="87.2093" fill="var(--primary-accent)" font-size="17.9011" font-weight="bold" font-family="Arial, sans-serif">Atomicity</text>
  </g>
  <g transform="translate(570,170)">
    <circle cx="149.0909" cy="80.4651" r="19.1798" fill="none" stroke="var(--primary-border)" stroke-width="2.8444"/>
    <path d="M 140.9091 80.4651 l 154.5455 87.2093 l 161.3637 66.9767" fill="none" stroke="var(--primary-border)" stroke-width="3.5556"/>
    <text x="179.0909" y="87.2093" fill="var(--primary-accent)" font-size="17.9011" font-weight="bold" font-family="Arial, sans-serif">Consistency</text>
  </g>
  <g transform="translate(570,210)">
    <circle cx="149.0909" cy="80.4651" r="19.1798" fill="none" stroke="var(--primary-border)" stroke-width="2.8444"/>
    <path d="M 140.9091 80.4651 l 154.5455 87.2093 l 161.3637 66.9767" fill="none" stroke="var(--primary-border)" stroke-width="3.5556"/>
    <text x="179.0909" y="87.2093" fill="var(--primary-accent)" font-size="17.9011" font-weight="bold" font-family="Arial, sans-serif">Isolation</text>
  </g>
  <g transform="translate(570,250)">
    <circle cx="149.0909" cy="80.4651" r="19.1798" fill="none" stroke="var(--primary-border)" stroke-width="2.8444"/>
    <path d="M 140.9091 80.4651 l 154.5455 87.2093 l 161.3637 66.9767" fill="none" stroke="var(--primary-border)" stroke-width="3.5556"/>
    <text x="179.0909" y="87.2093" fill="var(--primary-accent)" font-size="17.9011" font-weight="bold" font-family="Arial, sans-serif">Durability</text>
  </g>
  <text x="694.5455" y="539.0698" text-anchor="middle" fill="var(--surface)" font-size="40.9169" font-weight="bold" font-family="Arial, sans-serif">Database ACID Guarantees</text>
  <text x="694.5455" y="579.5349" text-anchor="middle" fill="var(--text-faint)" font-size="20.4585" font-family="Arial, sans-serif">Reliable Transaction Processing</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <g transform="translate(0,60)">
  <!-- Central database cylinder -->
  <ellipse cx="640" cy="240" rx="80" ry="25" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2" opacity="0.8"/>
  <rect x="560" y="240" width="160" height="120" fill="var(--primary-accent)" stroke="none" opacity="0.8"/>
  <line x1="560" y1="240" x2="560" y2="360" stroke="var(--primary-border)" stroke-width="2" opacity="0.8"/>
  <line x1="720" y1="240" x2="720" y2="360" stroke="var(--primary-border)" stroke-width="2" opacity="0.8"/>
  <ellipse cx="640" cy="280" rx="80" ry="25" fill="none" stroke="var(--primary-border)" stroke-width="2" opacity="0.4"/>
  <ellipse cx="640" cy="320" rx="80" ry="25" fill="none" stroke="var(--primary-border)" stroke-width="2" opacity="0.3"/>
  <ellipse cx="640" cy="360" rx="80" ry="25" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2" opacity="0.8"/>
  <!-- A - Atomicity (top-left) -->
  <rect x="160" y="120" width="200" height="80" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" opacity="0.8"/>
  <text x="260" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Atomicity</text>
  <line x1="360" y1="160" x2="560" y2="260" stroke="var(--danger-border)" stroke-width="2" opacity="0.5"/>
  <!-- C - Consistency (top-right) -->
  <rect x="920" y="120" width="200" height="80" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" opacity="0.8"/>
  <text x="1020" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Consistency</text>
  <line x1="920" y1="160" x2="720" y2="260" stroke="var(--warn-border)" stroke-width="2" opacity="0.5"/>
  <!-- I - Isolation (bottom-left) -->
  <rect x="160" y="400" width="200" height="80" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" opacity="0.8"/>
  <text x="260" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Isolation</text>
  <line x1="360" y1="440" x2="560" y2="340" stroke="var(--info-border)" stroke-width="2" opacity="0.5"/>
  <!-- D - Durability (bottom-right) -->
  <rect x="920" y="400" width="200" height="80" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" opacity="0.8"/>
  <text x="1020" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Durability</text>
  <line x1="920" y1="440" x2="720" y2="340" stroke="var(--ok-border)" stroke-width="2" opacity="0.5"/>
  <!-- Corner accents -->
  <rect x="100" y="100" width="10" height="10" rx="6" fill="var(--danger-border)" opacity="0.3"/>
  <rect x="1170" y="100" width="10" height="10" rx="6" fill="var(--warn-border)" opacity="0.3"/>
  <rect x="100" y="500" width="10" height="10" rx="6" fill="var(--info-border)" opacity="0.3"/>
  <rect x="1170" y="500" width="10" height="10" rx="6" fill="var(--ok-border)" opacity="0.3"/>
  </g>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Database ACID Guarantees</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Reliable Transaction Processing</text>
</svg>

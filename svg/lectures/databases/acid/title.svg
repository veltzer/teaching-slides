<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Database icon -->
  <ellipse cx="400" cy="120" rx="80" ry="25" fill="none" stroke="#e94560" stroke-width="3"/>
  <path d="M320 120 v60 a80,25 0 0,0 160,0 v-60" fill="none" stroke="#e94560" stroke-width="3"/>
  <ellipse cx="400" cy="180" rx="80" ry="25" fill="none" stroke="#e94560" stroke-width="3" opacity="0.5"/>
  <path d="M320 180 v60 a80,25 0 0,0 160,0 v-60" fill="none" stroke="#e94560" stroke-width="3"/>
  <ellipse cx="400" cy="240" rx="80" ry="25" fill="none" stroke="#e94560" stroke-width="3" opacity="0.3"/>
  <!-- Shield / lock icon for guarantees -->
  <path d="M150 160 l40-30 l40 30 v50 a40,40 0 0,1-80,0 z" fill="none" stroke="#0f3460" stroke-width="3"/>
  <circle cx="190" cy="195" r="8" fill="#e94560"/>
  <rect x="187" y="195" width="6" height="15" rx="2" fill="#e94560"/>
  <!-- Checkmark icons for each guarantee -->
  <g transform="translate(570,130)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#00d2ff" stroke-width="2"/>
    <path d="M-6 0 l4 5 l9-10" fill="none" stroke="#00d2ff" stroke-width="2.5"/>
    <text x="22" y="5" fill="#00d2ff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Atomicity</text>
  </g>
  <g transform="translate(570,170)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#00d2ff" stroke-width="2"/>
    <path d="M-6 0 l4 5 l9-10" fill="none" stroke="#00d2ff" stroke-width="2.5"/>
    <text x="22" y="5" fill="#00d2ff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Consistency</text>
  </g>
  <g transform="translate(570,210)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#00d2ff" stroke-width="2"/>
    <path d="M-6 0 l4 5 l9-10" fill="none" stroke="#00d2ff" stroke-width="2.5"/>
    <text x="22" y="5" fill="#00d2ff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Isolation</text>
  </g>
  <g transform="translate(570,250)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#00d2ff" stroke-width="2"/>
    <path d="M-6 0 l4 5 l9-10" fill="none" stroke="#00d2ff" stroke-width="2.5"/>
    <text x="22" y="5" fill="#00d2ff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Durability</text>
  </g>
  <!-- Title -->
  <text x="400" y="340" text-anchor="middle" fill="#eee" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Database ACID Guarantees</text>
  <text x="400" y="370" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="16">Reliable Transaction Processing</text>
</svg>

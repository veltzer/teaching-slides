<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f9f9f9" stroke="#ddd" stroke-width="1.6" />
  <text x="640" y="48" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="#333" text-anchor="middle">Durability: Surviving System Failures</text>
  <text x="240" y="96" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#2196F3">Normal Operation</text>
  <rect x="80" y="128" width="192" height="64" rx="8" fill="#2196F3" stroke="#1976D2" stroke-width="3.2" />
  <text x="176" y="168" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Client: COMMIT</text>
  <path d="M 272 160 L 368 160" stroke="#333" stroke-width="3.2" fill="none" marker-end="url(#arrow5)" />
  <rect x="368" y="128" width="288" height="64" rx="8" fill="#4CAF50" stroke="#388E3C" stroke-width="3.2" />
  <text x="512" y="168" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Write to Transaction Log</text>
  <path d="M 656 160 L 752 160" stroke="#333" stroke-width="3.2" fill="none" marker-end="url(#arrow5)" />
  <rect x="752" y="128" width="256" height="64" rx="8" fill="#4CAF50" stroke="#388E3C" stroke-width="3.2" />
  <text x="880" y="168" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">ACK to Client</text>
  <path d="M 512 192 L 512 240" stroke="#333" stroke-width="3.2" fill="none" marker-end="url(#arrow5)" />
  <rect x="336" y="240" width="352" height="64" rx="8" fill="#FF9800" stroke="#F57C00" stroke-width="3.2" />
  <text x="512" y="280" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20.8">Async Write to Data Files</text>
  <line x1="80" y1="352" x2="1200" y2="352" stroke="#666" stroke-width="1.6" stroke-dasharray="8 8" />
  <text x="240" y="400" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#F44336">Crash Recovery</text>
  <g transform="translate(50, 270)">
    <rect width="192" height="64" rx="8" fill="#F44336" stroke="#D32F2F" stroke-width="3.2" />
    <text x="96" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">System Crash</text>
    <path d="M 64 8 L 80 24 L 72 24 L 88 40 L 72 24 L 80 24" fill="yellow" stroke="none" />
    <path d="M 112 8 L 128 24 L 120 24 L 136 40 L 120 24 L 128 24" fill="yellow" stroke="none" />
  </g>
  <path d="M 272 464 L 368 464" stroke="#333" stroke-width="3.2" fill="none" marker-end="url(#arrow5)" />
  <rect x="368" y="432" width="224" height="64" rx="8" fill="#9C27B0" stroke="#7B1FA2" stroke-width="3.2" />
  <text x="480" y="472" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Recovery Process</text>
  <path d="M 592 464 L 688 464" stroke="#333" stroke-width="3.2" fill="none" marker-end="url(#arrow5)" />
  <rect x="688" y="432" width="256" height="64" rx="8" fill="#9C27B0" stroke="#7B1FA2" stroke-width="3.2" />
  <text x="816" y="472" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Read Transaction Log</text>
  <path d="M 816 496 L 816 544" stroke="#333" stroke-width="3.2" fill="none" marker-end="url(#arrow5)" />
  <rect x="656" y="544" width="320" height="64" rx="8" fill="#9C27B0" stroke="#7B1FA2" stroke-width="3.2" />
  <text x="816" y="584" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Replay Committed Transactions</text>
  <path d="M 656 576 L 560 576" stroke="#333" stroke-width="3.2" fill="none" marker-end="url(#arrow5)" />
  <rect x="240" y="544" width="320" height="64" rx="8" fill="#4CAF50" stroke="#388E3C" stroke-width="3.2" />
  <text x="400" y="576" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold">Database Restored to</text>
  <text x="400" y="600" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold">Consistent State</text>
  <rect x="1040" y="128" width="208" height="176" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.6" />
  <text x="1144" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" font-weight="bold" fill="#1976D2">Key Points:</text>
  <text x="1048" y="192" font-family="Arial, sans-serif" font-size="16" fill="#666">• Log written first</text>
  <text x="1048" y="216" font-family="Arial, sans-serif" font-size="16" fill="#666">• Then ACK sent</text>
  <text x="1048" y="240" font-family="Arial, sans-serif" font-size="16" fill="#666">• Data files later</text>
  <text x="1048" y="264" font-family="Arial, sans-serif" font-size="16" fill="#666">• Log enables</text>
  <text x="1064" y="288" font-family="Arial, sans-serif" font-size="16" fill="#666">recovery</text>
  <rect x="80" y="640" width="1120" height="64" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="3.2" />
  <text x="640" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#2E7D32">Durability Guarantee: All committed transactions survive system failures through Write-Ahead Logging (WAL)</text>
  <defs>
    <marker id="arrow5" markerWidth="16" markerHeight="16" refX="14.4" refY="8" orient="auto">
      <polygon points="0,16 8,0" fill="#333" />
    </marker>
  </defs>
</svg>
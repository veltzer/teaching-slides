<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="631.025642" y="40" font-family="Arial, sans-serif" font-size="24.09072" font-weight="bold" fill="var(--text)" text-anchor="middle">Durability: Surviving System Failures</text>
  <text x="230.384616" y="82.438947" font-family="Arial, sans-serif" font-size="21.079367" font-weight="bold" fill="var(--primary-accent)">Normal Operation</text>
  <rect x="70.128205" y="110.731761" width="192.307692" height="56.585409" rx="6.497221" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.282052" y="146.097477" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.573636" font-weight="bold">Client: COMMIT</text>
  <path d="M 262.435898 139.024355 L 358.589744 139.024355" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="358.589744" y="110.731761" width="288.461538" height="56.585409" rx="6.497221" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="502.820514" y="146.097477" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.573636" font-weight="bold">Write to Transaction Log</text>
  <path d="M 647.051282 139.024355 L 743.205129 139.024355" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="743.205129" y="110.731761" width="256.410257" height="56.585409" rx="6.497221" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="871.410256" y="146.097477" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.573636" font-weight="bold">ACK to Client</text>
  <path d="M 502.820514 167.31695 L 502.820514 209.756007" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="326.538462" y="209.756007" width="352.564102" height="56.585409" rx="6.497221" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="502.820514" y="245.121832" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.573636">Async Write to Data Files</text>
  <line x1="70.128205" y1="308.780362" x2="1191.923077" y2="308.780362" stroke="var(--text-muted)" stroke-width="1.2549" stroke-dasharray="6.2745 6.2745" />
  <text x="230.384616" y="351.219419" font-family="Arial, sans-serif" font-size="21.079367" font-weight="bold" fill="var(--danger-accent)">Crash Recovery</text>
  <g transform="translate(50, 270)">
    <rect width="192.307692" height="56.585409" rx="6.497221" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" x="-10" y="-2.439057" filter="url(#shadow)"/>
    <text x="86.153848" y="32.926769" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.573636" font-weight="bold">System Crash</text>
    <path d="M 54.102565 4.634065 L 70.128205 18.780417 L 62.115386 18.780417 L 78.141027 32.926769 L 62.115386 18.780417 L 70.128205 18.780417" fill="var(--warn-fill)" stroke="none" />
    <path d="M 102.179487 4.634065 L 118.205129 18.780417 L 110.192202 18.780417 L 126.217949 32.926769 L 110.192202 18.780417 L 118.205129 18.780417" fill="var(--warn-fill)" stroke="none" />
  </g>
  <path d="M 262.435898 407.804827 L 358.589744 407.804827" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="358.589744" y="379.512123" width="224.358974" height="56.585409" rx="6.497221" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470.769232" y="414.877948" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.573636" font-weight="bold">Recovery Process</text>
  <path d="M 582.948719 407.804827 L 679.102457 407.804827" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="679.102457" y="379.512123" width="256.410257" height="56.585409" rx="6.497221" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="807.307693" y="414.877948" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.573636" font-weight="bold">Read Transaction Log</text>
  <path d="M 807.307693 436.097422 L 807.307693 478.536478" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="647.051282" y="478.536478" width="320.51282" height="56.585409" rx="6.497221" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="807.307693" y="513.902304" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.573636" font-weight="bold">Replay Committed Transactions</text>
  <path d="M 647.051282 506.829183 L 550.897436 506.829183" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="230.384616" y="478.536478" width="320.51282" height="56.585409" rx="6.497221" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390.641026" y="506.829183" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="18.068013" font-weight="bold">Database Restored to</text>
  <text x="390.641026" y="528.048656" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="18.068013" font-weight="bold">Consistent State</text>
  <rect x="1031.666667" y="110.731761" width="208.333333" height="155.609764" rx="6.497221" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135.833334" y="139.024355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.56239" font-weight="bold" fill="var(--primary-accent)">Key Points:</text>
  <text x="1039.679487" y="167.31695" font-family="Arial, sans-serif" font-size="15.05666" fill="var(--text-muted)">• Log written first</text>
  <text x="1039.679487" y="188.536533" font-family="Arial, sans-serif" font-size="15.05666" fill="var(--text-muted)">• Then ACK sent</text>
  <text x="1039.679487" y="209.756007" font-family="Arial, sans-serif" font-size="15.05666" fill="var(--text-muted)">• Data files later</text>
  <text x="1039.679487" y="230.97548" font-family="Arial, sans-serif" font-size="15.05666" fill="var(--text-muted)">• Log enables</text>
  <text x="1055.705129" y="252.195063" font-family="Arial, sans-serif" font-size="15.05666" fill="var(--text-muted)">recovery</text>
  <rect x="70.128205" y="563.414591" width="1121.794871" height="56.585409" rx="6.497221" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.025642" y="598.780307" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.068013" font-weight="bold" fill="var(--ok-accent)">Durability Guarantee: All committed transactions survive system failures through Write-Ahead Logging (WAL)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 8,0" fill="#333" />
    </marker>
  </defs>
</svg>
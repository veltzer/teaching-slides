<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect width="1200" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" x="40" y="40"/>
  <text x="640" y="78.6667" font-family="Arial, sans-serif" font-size="22.2471" font-weight="bold" fill="var(--text)" text-anchor="middle">Durability: Surviving System Failures</text>
  <text x="265" y="117.3333" font-family="Arial, sans-serif" font-size="19.4662" font-weight="bold" fill="var(--primary-accent)">Normal Operation</text>
  <rect x="115" y="143.1112" width="180" height="51.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="205" y="175.3333" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="18.0757" font-weight="bold">Client: COMMIT</text>
  <path d="M 295 168.8889 L 385 168.8889" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="385" y="143.1112" width="270" height="51.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="520" y="175.3333" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="18.0757" font-weight="bold">Write to Transaction Log</text>
  <path d="M 655 168.8889 L 745 168.8889" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="745" y="143.1112" width="240" height="51.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="865" y="175.3333" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="18.0757" font-weight="bold">ACK to Client</text>
  <path d="M 520 194.6666 L 520 233.3333" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="355" y="233.3333" width="330" height="51.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="520" y="265.5555" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="18.0757">Async Write to Data Files</text>
  <line x1="115" y1="323.5555" x2="1165" y2="323.5555" stroke="var(--text-muted)" stroke-width="1.2549" stroke-dasharray="6.2745 6.2745" />
  <text x="265" y="362.2222" font-family="Arial, sans-serif" font-size="19.4662" font-weight="bold" fill="var(--danger-accent)">Crash Recovery</text>
  <g transform="translate(50, 270)">
    <rect width="180" height="51.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" x="40" y="40"/>
    <text x="130" y="72.2222" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="18.0757" font-weight="bold">System Crash</text>
    <path d="M 100 46.4444 L 115 59.3333 L 107.5 59.3333 L 122.5 72.2222 L 107.5 59.3333 L 115 59.3333" fill="var(--warn-fill)" stroke="none" />
    <path d="M 145 46.4444 L 160 59.3333 L 152.4999 59.3333 L 167.5 72.2222 L 152.4999 59.3333 L 160 59.3333" fill="var(--warn-fill)" stroke="none" />
  </g>
  <path d="M 295 413.7778 L 385 413.7778" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="385" y="388" width="210" height="51.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="490" y="420.2222" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="18.0757" font-weight="bold">Recovery Process</text>
  <path d="M 595 413.7778 L 684.9999 413.7778" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="684.9999" y="388" width="240" height="51.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="805" y="420.2222" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="18.0757" font-weight="bold">Read Transaction Log</text>
  <path d="M 805 439.5555 L 805 478.2222" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="655" y="478.2222" width="300" height="51.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="805" y="510.4444" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="18.0757" font-weight="bold">Replay Committed Transactions</text>
  <path d="M 655 504 L 565 504" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="265" y="478.2222" width="300" height="51.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="415" y="504" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.6853" font-weight="bold">Database Restored to</text>
  <text x="415" y="523.3333" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.6853" font-weight="bold">Consistent State</text>
  <rect x="1015" y="143.1112" width="195" height="141.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1112.5" y="168.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2949" font-weight="bold" fill="var(--primary-accent)">Key Points:</text>
  <text x="1022.5" y="194.6666" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--text-muted)">• Log written first</text>
  <text x="1022.5" y="214" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--text-muted)">• Then ACK sent</text>
  <text x="1022.5" y="233.3333" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--text-muted)">• Data files later</text>
  <text x="1022.5" y="252.6666" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--text-muted)">• Log enables</text>
  <text x="1037.5" y="272" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--text-muted)">recovery</text>
  <rect x="115" y="555.5556" width="1050" height="51.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="587.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6853" font-weight="bold" fill="var(--ok-accent)">Durability Guarantee: All committed transactions survive system failures through Write-Ahead Logging (WAL)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 8,0" fill="#333" />
    </marker>
  </defs>
</svg>
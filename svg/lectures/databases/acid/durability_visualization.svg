<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect width="1003.9216" height="564.7059" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="501.9608" y="37.6471" font-family="Arial, sans-serif" font-size="20.0784" font-weight="bold" fill="var(--text)" text-anchor="middle">Durability: Surviving System Failures</text>
  <text x="188.2353" y="75.2941" font-family="Arial, sans-serif" font-size="17.5686" font-weight="bold" fill="var(--primary-accent)">Normal Operation</text>
  <rect x="62.7451" y="100.3922" width="150.5882" height="50.1961" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="138.0392" y="131.7647" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.3137" font-weight="bold">Client: COMMIT</text>
  <path d="M 213.3333 125.4902 L 288.6275 125.4902" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="288.6275" y="100.3922" width="225.8824" height="50.1961" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="401.5686" y="131.7647" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.3137" font-weight="bold">Write to Transaction Log</text>
  <path d="M 514.5098 125.4902 L 589.8039 125.4902" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="589.8039" y="100.3922" width="200.7843" height="50.1961" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="690.1961" y="131.7647" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.3137" font-weight="bold">ACK to Client</text>
  <path d="M 401.5686 150.5882 L 401.5686 188.2353" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="263.5294" y="188.2353" width="276.0784" height="50.1961" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="401.5686" y="219.6078" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.3137">Async Write to Data Files</text>
  <line x1="62.7451" y1="276.0784" x2="941.1765" y2="276.0784" stroke="var(--text-muted)" stroke-width="1.2549" stroke-dasharray="6.2745 6.2745" />
  <text x="188.2353" y="313.7255" font-family="Arial, sans-serif" font-size="17.5686" font-weight="bold" fill="var(--danger-accent)">Crash Recovery</text>
  <g transform="translate(50, 270)">
    <rect width="150.5882" height="50.1961" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
    <text x="75.2941" y="31.3725" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.3137" font-weight="bold">System Crash</text>
    <path d="M 50.1961 6.2745 L 62.7451 18.8235 L 56.4706 18.8235 L 69.0196 31.3725 L 56.4706 18.8235 L 62.7451 18.8235" fill="var(--warn-fill)" stroke="none" />
    <path d="M 87.8431 6.2745 L 100.3922 18.8235 L 94.1176 18.8235 L 106.6667 31.3725 L 94.1176 18.8235 L 100.3922 18.8235" fill="var(--warn-fill)" stroke="none" />
  </g>
  <path d="M 213.3333 363.9216 L 288.6275 363.9216" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="288.6275" y="338.8235" width="175.6863" height="50.1961" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="376.4706" y="370.1961" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.3137" font-weight="bold">Recovery Process</text>
  <path d="M 464.3137 363.9216 L 539.6078 363.9216" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="539.6078" y="338.8235" width="200.7843" height="50.1961" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="370.1961" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.3137" font-weight="bold">Read Transaction Log</text>
  <path d="M 640 389.0196 L 640 426.6667" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="514.5098" y="426.6667" width="250.9804" height="50.1961" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="458.0392" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.3137" font-weight="bold">Replay Committed Transactions</text>
  <path d="M 514.5098 451.7647 L 439.2157 451.7647" stroke="var(--text)" stroke-width="2.5098" fill="none" marker-end="url(#arrow)" />
  <rect x="188.2353" y="426.6667" width="250.9804" height="50.1961" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="313.7255" y="451.7647" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="15.0588" font-weight="bold">Database Restored to</text>
  <text x="313.7255" y="470.5882" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="15.0588" font-weight="bold">Consistent State</text>
  <rect x="815.6863" y="100.3922" width="163.1373" height="138.0392" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="897.2549" y="125.4902" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8039" font-weight="bold" fill="var(--primary-accent)">Key Points:</text>
  <text x="821.9608" y="150.5882" font-family="Arial, sans-serif" font-size="12.549" fill="var(--text-muted)">• Log written first</text>
  <text x="821.9608" y="169.4118" font-family="Arial, sans-serif" font-size="12.549" fill="var(--text-muted)">• Then ACK sent</text>
  <text x="821.9608" y="188.2353" font-family="Arial, sans-serif" font-size="12.549" fill="var(--text-muted)">• Data files later</text>
  <text x="821.9608" y="207.0588" font-family="Arial, sans-serif" font-size="12.549" fill="var(--text-muted)">• Log enables</text>
  <text x="834.5098" y="225.8824" font-family="Arial, sans-serif" font-size="12.549" fill="var(--text-muted)">recovery</text>
  <rect x="62.7451" y="501.9608" width="878.4314" height="50.1961" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="501.9608" y="533.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588" font-weight="bold" fill="var(--ok-accent)">Durability Guarantee: All committed transactions survive system failures through Write-Ahead Logging (WAL)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 8,0" fill="#333" />
    </marker>
  </defs>
</svg>
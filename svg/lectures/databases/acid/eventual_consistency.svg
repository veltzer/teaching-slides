<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect width="1200" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" x="40" y="40"/>
  <text x="640" y="83.5" font-family="Arial, sans-serif" font-size="22.2471" font-weight="bold" fill="var(--text)" text-anchor="middle">Eventual Consistency in Distributed Systems</text>
  <rect x="114.9999" y="257.5" width="180" height="58" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="204.9999" y="293.75" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.4662" font-weight="bold">Write Operation</text>
  <path d="M 295 286.5 L 415 214" stroke="var(--text)" stroke-width="2.8444" fill="none" marker-end="url(#arrow6)" />
  <path d="M 295 286.5 L 415 286.5" stroke="var(--text)" stroke-width="2.8444" fill="none" marker-end="url(#arrow6)" />
  <path d="M 295 286.5 L 415 359" stroke="var(--text)" stroke-width="2.8444" fill="none" marker-end="url(#arrow6)" />
  <g>
    <circle cx="460" cy="214" r="41.7133" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.8444" />
    <text x="460" y="221.25" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.6854" font-weight="bold">DB Primary</text>
    <rect x="415" y="170.5" width="90" height="87" fill="none" stroke="var(--border)" rx="6" stroke-width="1"/>
  </g>
  <g>
    <circle cx="460" cy="330" r="41.7133" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.8444" />
    <text x="460" y="337.25" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.6854" font-weight="bold">Replica A</text>
    <rect x="415" y="286.5" width="90" height="87" fill="none" stroke="var(--border)" rx="6" stroke-width="1"/>
  </g>
  <g>
    <circle cx="460" cy="446" r="41.7133" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2.8444" />
    <text x="460" y="453.25" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.6854" font-weight="bold">Replica B</text>
    <rect x="415" y="402.5" width="90" height="87" fill="none" stroke="var(--border)" rx="6" stroke-width="1"/>
  </g>
  <path d="M 482.5 250.25 Q 520 286.5 482.5 293.75" stroke="var(--warn-border)" stroke-width="2.8444" stroke-dasharray="4.2667 4.2667" fill="none" marker-end="url(#arrow7)" />
  <text x="534.9999" y="279.25" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--warn-accent)">Sync</text>
  <path d="M 482.5 366.25 Q 520 402.5 482.5 409.75" stroke="var(--warn-border)" stroke-width="2.8444" stroke-dasharray="4.2667 4.2667" fill="none" marker-end="url(#arrow7)" />
  <text x="534.9999" y="395.25" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--warn-accent)">Sync</text>
  <path d="M 437.4999 409.75 Q 400 315.5 437.4999 250.25" stroke="var(--warn-border)" stroke-width="2.8444" stroke-dasharray="4.2667 4.2667" fill="none" marker-end="url(#arrow7)" />
  <text x="377.4999" y="330" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--warn-accent)">Sync</text>
  <path d="M 505 214 L 714.9999 286.5" stroke="var(--text)" stroke-width="2.8444" fill="none" marker-end="url(#arrow6)" />
  <path d="M 505 330 L 714.9999 330" stroke="var(--text)" stroke-width="2.8444" fill="none" marker-end="url(#arrow6)" />
  <path d="M 505 446 L 714.9999 373.5" stroke="var(--text)" stroke-width="2.8444" fill="none" marker-end="url(#arrow6)" />
  <rect x="714.9999" y="286.5" width="240" height="87" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="835" y="322.75" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.4662" font-weight="bold">Eventually</text>
  <text x="835" y="351.75" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.4662" font-weight="bold">Consistent</text>
  <g transform="translate(650, 100)">
    <text x="40" y="40" font-family="Arial, sans-serif" font-size="16.6854" font-weight="bold" fill="var(--text-muted)">Timeline</text>
    <path d="M 40 69 L 40 330" stroke="var(--text-muted)" stroke-width="2.8444" fill="none" marker-end="url(#arrow8)" />
    <text x="54.9999" y="351.75" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--text-muted)">Time</text>
    <circle cx="40" cy="98" r="5.5618" fill="var(--danger-fill)" />
    <text x="62.4999" y="105.25" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--text-muted)">Write occurs</text>
    <circle cx="40" cy="156" r="5.5618" fill="var(--warn-fill)" />
    <text x="62.4999" y="163.25" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--text-muted)">Inconsistent</text>
    <circle cx="40" cy="214" r="5.5618" fill="var(--warn-fill)" />
    <text x="62.4999" y="221.25" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--text-muted)">Syncing...</text>
    <circle cx="40" cy="272" r="5.5618" fill="var(--ok-fill)" />
    <text x="62.4999" y="279.25" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--text-muted)">Consistent</text>
  </g>
  <rect x="114.9999" y="533" width="1050" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6854" font-weight="bold" fill="var(--warn-accent)">BASE Model: Eventually all nodes converge to the same state</text>
  <text x="640" y="588.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2948" fill="var(--text-muted)">Trade-off: Higher availability and partition tolerance at the cost of immediate consistency</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="#333" />
    </marker>
    <marker id="arrow7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 6.4,0" fill="#FF9800" />
    </marker>
    <marker id="arrow8" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 6.4,0" fill="#666" />
    </marker>
  </defs>
</svg>
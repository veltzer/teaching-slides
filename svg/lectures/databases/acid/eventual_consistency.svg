  <path d="M 440.8889 320 L 640 320" stroke="var(--text)" stroke-width="2.8444" fill="none" marker-end="url(#arrow6)" />
  <path d="M 440.8889 448 L 640 368" stroke="var(--text)" stroke-width="2.8444" fill="none" marker-end="url(#arrow6)" />

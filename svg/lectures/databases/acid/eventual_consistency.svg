  <text x="469.3333" y="264" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--warn-accent)">Sync</text>
  <path d="M 419.5556 360 Q 455.1111 400 419.5556 408" stroke="var(--warn-border)" stroke-width="2.8444" stroke-dasharray="4.2667 4.2667" fill="none" marker-end="url(#arrow7)" />
  <text x="469.3333" y="392" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--warn-accent)">Sync</text>
  <path d="M 376.8889 408 Q 341.3333 304 376.8889 232" stroke="var(--warn-border)" stroke-width="2.8444" stroke-dasharray="4.2667 4.2667" fill="none" marker-end="url(#arrow7)" />
  <text x="320" y="320" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--warn-accent)">Sync</text>

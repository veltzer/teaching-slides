  <text x="620.000064" y="434.399986" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="21.105547" font-style="italic">Violates Rules</text>
  <rect x="440.000044" y="480.800019" width="240.000027" height="139.199981" rx="7.589466" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.1111 7.1111" filter="url(#shadow)"/>
  <text x="560.000058" y="561.999928" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="24.623011" font-weight="bold">Invalid State</text>
  <path d="M 440.000044 550.40001 Q 240.000022 550.40001 159.99988 364.799995" stroke="var(--danger-border)" stroke-width="2.8444" fill="none" marker-end="url(#arrow)" />

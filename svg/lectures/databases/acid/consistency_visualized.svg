<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="225.600014" width="240.000027" height="139.199981" rx="7.589466" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.99988" y="306.800043" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="24.623011" font-weight="bold">Valid State 1</text>
  <path d="M 280.000027 295.200005 L 440.000044 295.200005" stroke="var(--text)" stroke-width="2.8444" fill="none" marker-end="url(#arrow)" />
  <rect x="440.000044" y="225.600014" width="240.000027" height="139.199981" rx="7.589466" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560.000058" y="306.800043" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="24.623011" font-weight="bold">Transaction</text>
  <path d="M 680.000071 295.200005 L 840.000089 295.200005" stroke="var(--text)" stroke-width="2.8444" fill="none" marker-end="url(#arrow)" />
  <rect x="840.000089" y="225.600014" width="240.000027" height="139.199981" rx="7.589466" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="959.999969" y="306.800043" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="24.623011" font-weight="bold">Valid State 2</text>
  <path d="M 560.000058 364.799995 L 560.000058 480.800019" stroke="var(--danger-border)" stroke-width="2.8444" stroke-dasharray="7.1111 7.1111" fill="none" marker-end="url(#arrow)" />
  <text x="620.000064" y="434.399986" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="21.105547" font-style="italic">Violates Rules</text>
  <rect x="440.000044" y="480.800019" width="240.000027" height="139.199981" rx="7.589466" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.1111 7.1111" filter="url(#shadow)"/>
  <text x="560.000058" y="561.999928" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="24.623011" font-weight="bold">Invalid State</text>
  <path d="M 440.000044 550.40001 Q 240.000022 550.40001 159.99988 364.799995" stroke="var(--danger-border)" stroke-width="2.8444" fill="none" marker-end="url(#arrow)" />
  <text x="240.000022" y="515.600014" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="21.105547" font-weight="bold">Rejected</text>
  <text x="740.000078" y="40" font-family="Arial, sans-serif" font-size="28.140603" font-weight="bold" fill="var(--text)" text-anchor="middle">Database Consistency: Only Valid State Transitions Allowed</text>
  <text x="1240" y="225.600014" font-family="Arial, sans-serif" font-size="21.105547" fill="var(--text-muted)">Rules enforced:</text>
  <text x="1240" y="272.000048" font-family="Arial, sans-serif" font-size="19.346561" fill="var(--text-muted)">• Constraints</text>
  <text x="1240" y="306.800043" font-family="Arial, sans-serif" font-size="19.346561" fill="var(--text-muted)">• Referential integrity</text>
  <text x="1240" y="341.600038" font-family="Arial, sans-serif" font-size="19.346561" fill="var(--text-muted)">• Business rules</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect width="1200" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" x="40" y="40"/>
  <rect x="115" y="272" width="180" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="204.9999" y="339.6667" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.4662" font-weight="bold">Valid State 1</text>
  <path d="M 295 330 L 415 330" stroke="var(--text)" stroke-width="2.8444" fill="none" marker-end="url(#arrow)" />
  <rect x="415" y="272" width="180" height="116" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="505" y="339.6667" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.4662" font-weight="bold">Transaction</text>
  <path d="M 595 330 L 715 330" stroke="var(--text)" stroke-width="2.8444" fill="none" marker-end="url(#arrow)" />
  <rect x="715" y="272" width="180" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="804.9999" y="339.6667" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="19.4662" font-weight="bold">Valid State 2</text>
  <path d="M 505 388 L 505 484.6667" stroke="var(--danger-border)" stroke-width="2.8444" stroke-dasharray="7.1111 7.1111" fill="none" marker-end="url(#arrow)" />
  <text x="550" y="446" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="16.6854" font-style="italic">Violates Rules</text>
  <rect x="415" y="484.6667" width="180" height="116" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.1111 7.1111" />
  <text x="505" y="552.3333" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="19.4662" font-weight="bold">Invalid State</text>
  <path d="M 415 542.6667 Q 265 542.6667 204.9999 388" stroke="var(--danger-border)" stroke-width="2.8444" fill="none" marker-end="url(#arrow)" />
  <text x="265" y="513.6667" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="16.6854" font-weight="bold">Rejected</text>
  <text x="640" y="117.3333" font-family="Arial, sans-serif" font-size="22.2471" font-weight="bold" fill="var(--text)" text-anchor="middle">Database Consistency: Only Valid State Transitions Allowed</text>
  <text x="1014.9999" y="272" font-family="Arial, sans-serif" font-size="16.6854" fill="var(--text-muted)">Rules enforced:</text>
  <text x="1014.9999" y="310.6667" font-family="Arial, sans-serif" font-size="15.2948" fill="var(--text-muted)">• Constraints</text>
  <text x="1014.9999" y="339.6667" font-family="Arial, sans-serif" font-size="15.2948" fill="var(--text-muted)">• Referential integrity</text>
  <text x="1014.9999" y="368.6667" font-family="Arial, sans-serif" font-size="15.2948" fill="var(--text-muted)">• Business rules</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 8,0" fill="#333" />
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 8,0" fill="#F44336" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect width="800" height="450" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="400" y="27" font-family="Arial, sans-serif" font-size="14.4" font-weight="bold" fill="var(--text)" text-anchor="middle">Dirty Read Problem - Isolation Violation</text>
  <rect x="100" y="54" width="120" height="36" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="160" y="76.5" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="12.6" font-weight="bold">Transaction 1</text>
  <line x1="160" y1="90" x2="160" y2="423" stroke="var(--primary-border)" stroke-width="1.8" stroke-dasharray="1.8 1.8" />
  <rect x="340" y="54" width="120" height="36" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="400" y="76.5" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="12.6" font-weight="bold">Database</text>
  <line x1="400" y1="90" x2="400" y2="423" stroke="var(--ok-border)" stroke-width="1.8" stroke-dasharray="1.8 1.8" />
  <rect x="580" y="54" width="120" height="36" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="76.5" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="12.6" font-weight="bold">Transaction 2</text>
  <line x1="640" y1="90" x2="640" y2="423" stroke="var(--info-border)" stroke-width="1.8" stroke-dasharray="1.8 1.8" />
  <path d="M 160 108 L 400 108" stroke="var(--text)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="200" y="94.5" width="150" height="22.5" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="0.9" />
  <text x="275" y="109.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8">BEGIN TRANSACTION</text>
  <path d="M 640 135 L 400 135" stroke="var(--text)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="450" y="121.5" width="150" height="22.5" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="0.9" />
  <text x="525" y="136.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8">BEGIN TRANSACTION</text>
  <path d="M 160 162 L 400 162" stroke="var(--text)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="210" y="148.5" width="130" height="22.5" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="0.9" />
  <text x="275" y="163.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8">Read A = 100</text>
  <path d="M 160 189 L 400 189" stroke="var(--text)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="210" y="175.5" width="130" height="22.5" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="0.9" />
  <text x="275" y="190.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8">Write A = 50</text>
  <path d="M 640 225 L 400 225" stroke="var(--danger-border)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="440" y="211.5" width="170" height="22.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="525" y="226.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8" fill="var(--danger-accent)" font-weight="bold">Read A = 50 (Dirty Read!)</text>
  <circle cx="620" cy="225" r="10.8" fill="var(--danger-fill)" stroke="none" />
  <text x="620" y="229.5" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="14.4" font-weight="bold">!</text>
  <path d="M 160 261 L 400 261" stroke="var(--danger-border)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="230" y="247.5" width="90" height="22.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="275" y="262.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8" fill="var(--danger-accent)" font-weight="bold">ROLLBACK</text>
  <path d="M 640 297 L 400 297" stroke="var(--danger-border)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="410" y="283.5" width="210" height="22.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="515" y="298.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-accent)">Decision based on A=50 (Incorrect!)</text>
  <path d="M 640 333 L 400 333" stroke="var(--text)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="490" y="319.5" width="90" height="22.5" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="0.9" />
  <text x="535" y="334.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8">COMMIT</text>
  <rect x="50" y="369" width="700" height="63" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="400" y="391.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7" font-weight="bold" fill="var(--warn-accent)">Problem: Transaction 2 reads uncommitted data from Transaction 1</text>
  <text x="400" y="409.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8" fill="var(--text-muted)">When T1 rolls back, T2 has already made decisions based on invalid data (A=50 instead of A=100).</text>
  <text x="400" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8" fill="var(--text-muted)">This violates isolation and can lead to data inconsistency.</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 8,0" fill="#333" />
    </marker>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 8,0" fill="#F44336" />
    </marker>
  </defs>
</svg>
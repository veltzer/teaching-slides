<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect width="800" height="450" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="0.9" />
  <text x="400" y="27" font-family="Arial, sans-serif" font-size="14.4" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Dirty Read Problem - Isolation Violation</text>
  <rect x="100" y="54" width="120" height="36" rx="4.5" fill="var(--primary-vivid)" stroke="var(--primary-mid)" stroke-width="1.8" />
  <text x="160" y="76.5" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="12.6" font-weight="bold">Transaction 1</text>
  <line x1="160" y1="90" x2="160" y2="423" stroke="var(--primary-vivid)" stroke-width="1.8" stroke-dasharray="1.8 1.8" />
  <rect x="340" y="54" width="120" height="36" rx="4.5" fill="var(--ok-light)" stroke="var(--ok-mid)" stroke-width="1.8" />
  <text x="400" y="76.5" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="12.6" font-weight="bold">Database</text>
  <line x1="400" y1="90" x2="400" y2="423" stroke="var(--ok-light)" stroke-width="1.8" stroke-dasharray="1.8 1.8" />
  <rect x="580" y="54" width="120" height="36" rx="4.5" fill="var(--info-light)" stroke="var(--info-mid)" stroke-width="1.8" />
  <text x="640" y="76.5" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="12.6" font-weight="bold">Transaction 2</text>
  <line x1="640" y1="90" x2="640" y2="423" stroke="var(--info-light)" stroke-width="1.8" stroke-dasharray="1.8 1.8" />
  <path d="M 160 108 L 400 108" stroke="var(--text-dark)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="200" y="94.5" width="150" height="22.5" rx="2.7" fill="var(--bg)" stroke="var(--text-dark)" stroke-width="0.9" />
  <text x="275" y="109.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8">BEGIN TRANSACTION</text>
  <path d="M 640 135 L 400 135" stroke="var(--text-dark)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="450" y="121.5" width="150" height="22.5" rx="2.7" fill="var(--bg)" stroke="var(--text-dark)" stroke-width="0.9" />
  <text x="525" y="136.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8">BEGIN TRANSACTION</text>
  <path d="M 160 162 L 400 162" stroke="var(--text-dark)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="210" y="148.5" width="130" height="22.5" rx="2.7" fill="var(--bg)" stroke="var(--text-dark)" stroke-width="0.9" />
  <text x="275" y="163.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8">Read A = 100</text>
  <path d="M 160 189 L 400 189" stroke="var(--text-dark)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="210" y="175.5" width="130" height="22.5" rx="2.7" fill="var(--bg)" stroke="var(--text-dark)" stroke-width="0.9" />
  <text x="275" y="190.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8">Write A = 50</text>
  <path d="M 640 225 L 400 225" stroke="var(--danger-vivid)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="440" y="211.5" width="170" height="22.5" rx="2.7" fill="var(--danger-pale)" stroke="var(--danger-vivid)" stroke-width="1.8" />
  <text x="525" y="226.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8" fill="var(--danger-vivid)" font-weight="bold">Read A = 50 (Dirty Read!)</text>
  <circle cx="620" cy="225" r="10.8" fill="var(--danger-vivid)" stroke="none" />
  <text x="620" y="229.5" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="14.4" font-weight="bold">!</text>
  <path d="M 160 261 L 400 261" stroke="var(--danger-vivid)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="230" y="247.5" width="90" height="22.5" rx="2.7" fill="var(--danger-pale)" stroke="var(--danger-vivid)" stroke-width="1.8" />
  <text x="275" y="262.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8" fill="var(--danger-vivid)" font-weight="bold">ROLLBACK</text>
  <path d="M 640 297 L 400 297" stroke="var(--danger-vivid)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="410" y="283.5" width="210" height="22.5" rx="2.7" fill="var(--danger-pale)" stroke="var(--danger-vivid)" stroke-width="1.8" />
  <text x="515" y="298.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--danger-vivid)">Decision based on A=50 (Incorrect!)</text>
  <path d="M 640 333 L 400 333" stroke="var(--text-dark)" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <rect x="490" y="319.5" width="90" height="22.5" rx="2.7" fill="var(--bg)" stroke="var(--text-dark)" stroke-width="0.9" />
  <text x="535" y="334.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8">COMMIT</text>
  <rect x="50" y="369" width="700" height="63" rx="4.5" fill="var(--warn-pale)" stroke="var(--warn-orange)" stroke-width="1.8" />
  <text x="400" y="391.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7" font-weight="bold" fill="var(--warn-dk)">Problem: Transaction 2 reads uncommitted data from Transaction 1</text>
  <text x="400" y="409.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8" fill="var(--text-mid)">When T1 rolls back, T2 has already made decisions based on invalid data (A=50 instead of A=100).</text>
  <text x="400" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8" fill="var(--text-mid)">This violates isolation and can lead to data inconsistency.</text>
  <defs>

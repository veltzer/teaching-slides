  <text x="860.9797" y="597.6786" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1648" fill="var(--text-muted)">When T1 rolls back, T2 has already made decisions based on invalid data (A=50 instead of A=100).</text>

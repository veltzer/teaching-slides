<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect width="866.3322" height="446.4287" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" x="40" y="40"/>
  <text x="860.9797" y="218.2144" font-family="Arial, sans-serif" font-size="16.1648" font-weight="bold" fill="var(--text)" text-anchor="middle">Dirty Read Problem - Isolation Violation</text>
  <rect x="536.105" y="245" width="129.9497" height="35.7143" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="601.0801" y="267.3216" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.1648" font-weight="bold">Transaction 1</text>
  <line x1="601.0801" y1="280.7143" x2="601.0801" y2="611.0717" stroke="var(--primary-border)" stroke-width="0.8212" stroke-dasharray="0.8212 0.8212"/>
  <rect x="796.0047" y="245" width="129.9497" height="35.7143" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860.9797" y="267.3216" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.1648" font-weight="bold">Database</text>
  <line x1="860.9797" y1="280.7143" x2="860.9797" y2="611.0717" stroke="var(--ok-border)" stroke-width="0.8212" stroke-dasharray="0.8212 0.8212"/>
  <rect x="1055.9045" y="245" width="129.9497" height="35.7143" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120.8793" y="267.3216" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.1648" font-weight="bold">Transaction 2</text>
  <line x1="1120.8793" y1="280.7143" x2="1120.8793" y2="611.0717" stroke="var(--info-border)" stroke-width="0.8212" stroke-dasharray="0.8212 0.8212"/>
  <path d="M 601.0801 298.5715 L 860.9797 298.5715" stroke="var(--text)" stroke-width="0.8212" fill="none" marker-end="url(#arrow)"/>
  <rect x="644.3966" y="285.1786" width="162.4374" height="22.3216" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="0.4106"/>
  <text x="725.6154" y="300.3571" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1648" fill="var(--text)">BEGIN TRANSACTION</text>
  <path d="M 1120.8793 325.3571 L 860.9797 325.3571" stroke="var(--text)" stroke-width="0.8212" fill="none" marker-end="url(#arrow)"/>
  <rect x="915.1255" y="311.9644" width="162.4374" height="22.3216" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="0.4106"/>
  <text x="996.3441" y="327.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1648" fill="var(--text)">BEGIN TRANSACTION</text>
  <path d="M 601.0801 352.1429 L 860.9797 352.1429" stroke="var(--text)" stroke-width="0.8212" fill="none" marker-end="url(#arrow)"/>
  <rect x="655.2257" y="338.75" width="140.779" height="22.3216" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="0.4106"/>
  <text x="725.6154" y="353.9287" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1648" fill="var(--text)">Read A = 100</text>
  <path d="M 601.0801 378.9287 L 860.9797 378.9287" stroke="var(--text)" stroke-width="0.8212" fill="none" marker-end="url(#arrow)"/>
  <rect x="655.2257" y="365.5358" width="140.779" height="22.3216" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="0.4106"/>
  <text x="725.6154" y="380.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1648" fill="var(--text)">Write A = 50</text>
  <path d="M 1120.8793 414.643 L 860.9797 414.643" stroke="var(--danger-border)" stroke-width="0.8212" fill="none" marker-end="url(#arrow)"/>
  <rect x="904.2963" y="401.2501" width="184.0955" height="22.3216" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="996.3441" y="416.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1648" fill="var(--danger-accent)" font-weight="bold">Read A = 50 (Dirty Read!)</text>
  <rect x="1088.03" y="403.449" width="22.3882" height="22.3882" rx="11.1941" fill="url(#grad-danger)" stroke="none" filter="url(#shadow)"/>
  <text x="1099.221" y="419.1073" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.1648" font-weight="bold">!</text>
  <path d="M 601.0801 450.3573 L 860.9797 450.3573" stroke="var(--danger-border)" stroke-width="0.8212" fill="none" marker-end="url(#arrow)"/>
  <rect x="676.8842" y="436.9644" width="97.4624" height="22.3216" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="725.6154" y="452.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1648" fill="var(--danger-accent)" font-weight="bold">ROLLBACK</text>
  <path d="M 1120.8793 486.0716 L 860.9797 486.0716" stroke="var(--danger-border)" stroke-width="0.8212" fill="none" marker-end="url(#arrow)"/>
  <rect x="871.8088" y="472.6786" width="227.4123" height="22.3216" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="985.5149" y="487.8572" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1648" fill="var(--danger-accent)">Decision based on A=50 (Incorrect!)</text>
  <path d="M 1120.8793 521.7858 L 860.9797 521.7858" stroke="var(--text)" stroke-width="0.8212" fill="none" marker-end="url(#arrow)"/>
  <rect x="958.4421" y="508.3929" width="97.4624" height="22.3216" rx="6" fill="var(--bg)" stroke="var(--text)" stroke-width="0.4106"/>
  <text x="1007.1732" y="523.5715" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1648" fill="var(--text)">COMMIT</text>
  <rect x="481.9592" y="557.5001" width="758.0408" height="62.4999" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860.9797" y="579.8215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1648" font-weight="bold" fill="var(--warn-accent)">Problem: Transaction 2 reads uncommitted data from Transaction 1</text>
  <text x="860.9797" y="597.6786" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1648" fill="var(--text-muted)">When T1 rolls back, T2 has already made decisions based on invalid data (A=50 instead of A=100).</text>
  <text x="860.9797" y="611.0717" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1648" fill="var(--text-muted)">This violates isolation and can lead to data inconsistency.</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

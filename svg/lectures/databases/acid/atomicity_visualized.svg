  <path d="M 521.4815 156.6666 L 521.4815 181.6667" stroke="var(--text)" stroke-width="1.1209" fill="none" marker-end="url(#arrow)" />
  <rect x="440" y="181.6667" width="162.963" height="33.3333" rx="5.25" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="521.4815" y="202.5" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="10.3704">Operation 1: Withdraw $100</text>
  <path d="M 521.4815 215 L 521.4815 239.9999" stroke="var(--text)" stroke-width="1.1209" fill="none" marker-end="url(#arrow)" />

  <text x="672" y="477" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="19.2">All Operations</text>
  <text x="672" y="504" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="19.2">Successful?</text>
  <path d="M 832 486 L 928 486" stroke="#333" stroke-width="3.2" fill="none" marker-end="url(#arrowhead)" />
  <text x="880" y="468" text-anchor="middle" fill="#4CAF50" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold">Yes</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect width="882.7586" height="496.5517" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="386.2069" y="24.8276" width="154.4828" height="49.6552" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="463.4483" y="55.8621" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="15.4483" font-weight="bold">Start Transaction</text>
  <path d="M 463.4483 74.4828 L 463.4483 111.7241" stroke="var(--text)" stroke-width="2.2069" fill="none" marker-end="url(#arrow)" />
  <rect x="342.069" y="111.7241" width="242.7586" height="49.6552" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="463.4483" y="142.7586" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="15.4483">Operation 1: Withdraw $100</text>
  <path d="M 463.4483 161.3793 L 463.4483 198.6207" stroke="var(--text)" stroke-width="2.2069" fill="none" marker-end="url(#arrow)" />
  <rect x="342.069" y="198.6207" width="242.7586" height="49.6552" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="463.4483" y="229.6552" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="15.4483">Operation 2: Deposit $100</text>
  <path d="M 463.4483 248.2759 L 463.4483 285.5172" stroke="var(--text)" stroke-width="2.2069" fill="none" marker-end="url(#arrow)" />
  <path d="M 463.4483 285.5172 L 573.7931 335.1724 L 463.4483 384.8276 L 353.1034 335.1724 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2069" />
  <text x="463.4483" y="328.9655" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif" font-size="13.2414">All Operations</text>
  <text x="463.4483" y="347.5862" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif" font-size="13.2414">Successful?</text>
  <path d="M 573.7931 335.1724 L 640 335.1724" stroke="var(--text)" stroke-width="2.2069" fill="none" marker-end="url(#arrow)" />
  <text x="606.8966" y="322.7586" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif" font-size="13.2414" font-weight="bold">Yes</text>
  <rect x="640" y="310.3448" width="198.6207" height="49.6552" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="739.3103" y="341.3793" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="15.4483" font-weight="bold">COMMIT: All changes saved</text>
  <path d="M 353.1034 335.1724 L 286.8966 335.1724" stroke="var(--text)" stroke-width="2.2069" fill="none" marker-end="url(#arrow)" />
  <text x="320" y="322.7586" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="13.2414" font-weight="bold">No</text>
  <rect x="88.2759" y="310.3448" width="198.6207" height="49.6552" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="187.5862" y="341.3793" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="15.4483" font-weight="bold">ROLLBACK: No changes made</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="#333" />
    </marker>
  </defs>
</svg>
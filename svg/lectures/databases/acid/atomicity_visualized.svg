  <path d="M 521.4815 273.3333 L 521.4815 298.3333" stroke="var(--text)" stroke-width="1.1209" fill="none" marker-end="url(#arrow)" />
  <path d="M 521.4815 298.3333 L 595.5555 331.6666 L 521.4815 365 L 447.4074 331.6666 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1209" />
  <text x="521.4815" y="327.4999" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif" font-size="10">All Operations</text>
  <text x="521.4815" y="339.9999" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif" font-size="10">Successful?</text>
  <path d="M 595.5555 331.6666 L 640 331.6666" stroke="var(--text)" stroke-width="1.1209" fill="none" marker-end="url(#arrow)" />
  <text x="617.7778" y="323.3333" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Yes</text>
  <rect x="640" y="315" width="133.3334" height="33.3333" rx="5.25" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="706.6667" y="335.8333" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="10.3704" font-weight="bold">COMMIT: All changes saved</text>
  <path d="M 447.4074 331.6666 L 402.963 331.6666" stroke="var(--text)" stroke-width="1.1209" fill="none" marker-end="url(#arrow)" />
  <text x="425.1852" y="323.3333" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="10" font-weight="bold">No</text>
  <rect x="269.6297" y="315" width="133.3334" height="33.3333" rx="5.25" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="336.2963" y="335.8333" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="10.3704" font-weight="bold">ROLLBACK: No changes made</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect width="888.8889" height="500" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.0417"/>
  <rect x="584.4445" y="105" width="155.5556" height="50" rx="6.0417" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="662.2223" y="136.25" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="15.5556" font-weight="bold">Start Transaction</text>
  <path d="M 662.2223 155 L 662.2223 192.5" stroke="var(--text)" stroke-width="2.2069" fill="none" marker-end="url(#arrow)" />
  <rect x="540" y="192.5" width="244.4444" height="50" rx="6.0417" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="662.2223" y="223.75" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="15.5556">Operation 1: Withdraw $100</text>
  <path d="M 662.2223 242.5 L 662.2223 280" stroke="var(--text)" stroke-width="2.2069" fill="none" marker-end="url(#arrow)" />
  <rect x="540" y="280" width="244.4444" height="50" rx="6.0417" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="662.2223" y="311.25" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="15.5556">Operation 2: Deposit $100</text>
  <path d="M 662.2223 330.0001 L 662.2223 367.5" stroke="var(--text)" stroke-width="2.2069" fill="none" marker-end="url(#arrow)" />
  <path d="M 662.2223 367.5 L 773.3333 417.5 L 662.2223 467.5 L 551.1111 417.5 Z" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2069" />
  <text x="662.2223" y="411.25" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif" font-size="13.3334">All Operations</text>
  <text x="662.2223" y="430" text-anchor="middle" fill="var(--text)" font-family="Arial, sans-serif" font-size="13.3334">Successful?</text>
  <path d="M 773.3333 417.5 L 840 417.5" stroke="var(--text)" stroke-width="2.2069" fill="none" marker-end="url(#arrow)" />
  <text x="806.6667" y="405" text-anchor="middle" fill="var(--ok-accent)" font-family="Arial, sans-serif" font-size="13.3334" font-weight="bold">Yes</text>
  <rect x="840" y="392.5" width="200" height="50" rx="6.0417" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="940" y="423.75" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="15.5556" font-weight="bold">COMMIT: All changes saved</text>
  <path d="M 551.1111 417.5 L 484.4445 417.5" stroke="var(--text)" stroke-width="2.2069" fill="none" marker-end="url(#arrow)" />
  <text x="517.7778" y="405" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="13.3334" font-weight="bold">No</text>
  <rect x="284.4445" y="392.5" width="200" height="50" rx="6.0417" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="384.4444" y="423.75" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="15.5556" font-weight="bold">ROLLBACK: No changes made</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 8,0" fill="#333" />
    </marker>
  </defs>
</svg>
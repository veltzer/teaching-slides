<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="28.753498" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Row-Oriented vs Column-Oriented</text>

  <rect x="40" y="71.636364" width="590" height="94.909091" rx="6.161464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="129.636364" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Row Storage (CSV, JSON)</text>

  <rect x="40" y="177.090909" width="590" height="73.818182" rx="6.161464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="224.545455" text-anchor="middle" font-size="20.538213" fill="var(--primary-text)" font-family="Arial, sans-serif">Alice | 30 | New York</text>
  <rect x="40" y="261.454545" width="590" height="73.818182" rx="6.161464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="308.909091" text-anchor="middle" font-size="20.538213" fill="var(--primary-text)" font-family="Arial, sans-serif">Bob | 25 | San Francisco</text>
  <rect x="40" y="345.818182" width="590" height="73.818182" rx="6.161464" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="393.272727" text-anchor="middle" font-size="20.538213" fill="var(--primary-text)" font-family="Arial, sans-serif">Carol | 35 | Chicago</text>

  <rect x="40" y="430.181818" width="590" height="189.818182" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335" y="472.363636" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Read entire row per record</text>
  <text x="335" y="514.545455" text-anchor="middle" font-size="17.457481" fill="var(--text-muted)" font-family="Arial, sans-serif">Good for OLTP: fetch full objects</text>
  <text x="335" y="551.454545" text-anchor="middle" font-size="17.457481" fill="var(--text-muted)" font-family="Arial, sans-serif">Bad for analytics: reads unused fields</text>
  <text x="335" y="588.363636" text-anchor="middle" font-size="17.457481" fill="var(--text-muted)" font-family="Arial, sans-serif">Poor compression: mixed types per page</text>

  <rect x="650" y="71.636364" width="590" height="94.909091" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="129.636364" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Column Storage (Parquet)</text>

  <rect x="650" y="177.090909" width="590" height="73.818182" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="224.545455" text-anchor="middle" font-size="20.538213" fill="var(--danger-text)" font-family="Arial, sans-serif">name: Alice | Bob | Carol</text>
  <rect x="650" y="261.454545" width="590" height="73.818182" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="308.909091" text-anchor="middle" font-size="20.538213" fill="var(--danger-text)" font-family="Arial, sans-serif">age: 30 | 25 | 35</text>
  <rect x="650" y="345.818182" width="590" height="73.818182" rx="6.161464" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="393.272727" text-anchor="middle" font-size="20.538213" fill="var(--danger-text)" font-family="Arial, sans-serif">city: NY | SF | Chicago</text>

  <rect x="650" y="430.181818" width="590" height="189.818182" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="945" y="472.363636" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Read only needed columns</text>
  <text x="945" y="514.545455" text-anchor="middle" font-size="17.457481" fill="var(--text-muted)" font-family="Arial, sans-serif">Great for OLAP: scan one field of many</text>
  <text x="945" y="551.454545" text-anchor="middle" font-size="17.457481" fill="var(--text-muted)" font-family="Arial, sans-serif">Strong compression: uniform types</text>
  <text x="945" y="588.363636" text-anchor="middle" font-size="17.457481" fill="var(--text-muted)" font-family="Arial, sans-serif">Predicate pushdown skips whole pages</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="51.4286" text-anchor="middle" font-weight="bold" font-size="29.8667">Row-Oriented vs Column-Oriented</text>
  <rect x="42.6667" y="102.8571" width="533.3333" height="77.1429" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" />
  <text x="309.3333" y="154.2857" text-anchor="middle" font-size="23.4667" font-weight="bold">Row Storage (CSV, JSON)</text>
  <rect x="42.6667" y="180" width="533.3333" height="51.4286" fill="#bbdefb" stroke="#333" stroke-width="2.1333" />
  <text x="309.3333" y="216" text-anchor="middle" font-size="21.3333">Alice | 30 | New York</text>
  <rect x="42.6667" y="231.4286" width="533.3333" height="51.4286" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" />
  <text x="309.3333" y="267.4286" text-anchor="middle" font-size="21.3333">Bob | 25 | San Francisco</text>
  <rect x="42.6667" y="282.8571" width="533.3333" height="51.4286" fill="#bbdefb" stroke="#333" stroke-width="2.1333" />
  <text x="309.3333" y="318.8571" text-anchor="middle" font-size="21.3333">Carol | 35 | Chicago</text>
  <rect x="704" y="102.8571" width="533.3333" height="77.1429" fill="#fce4ec" stroke="#333" stroke-width="2.1333" />
  <text x="970.6667" y="154.2857" text-anchor="middle" font-size="23.4667" font-weight="bold">Column Storage (Parquet)</text>
  <rect x="704" y="180" width="533.3333" height="51.4286" fill="#ffcdd2" stroke="#333" stroke-width="2.1333" />
  <text x="970.6667" y="216" text-anchor="middle" font-size="21.3333">name: Alice | Bob | Carol</text>
  <rect x="704" y="231.4286" width="533.3333" height="51.4286" fill="#fce4ec" stroke="#333" stroke-width="2.1333" />
  <text x="970.6667" y="267.4286" text-anchor="middle" font-size="21.3333">age: 30 | 25 | 35</text>
  <rect x="704" y="282.8571" width="533.3333" height="51.4286" fill="#ffcdd2" stroke="#333" stroke-width="2.1333" />
  <text x="970.6667" y="318.8571" text-anchor="middle" font-size="21.3333">city: NY | SF | Chicago</text>
  <text x="309.3333" y="411.4286" text-anchor="middle" font-size="23.4667" fill="#555">Read all fields per record</text>
  <text x="970.6667" y="411.4286" text-anchor="middle" font-size="23.4667" fill="#555">Read only needed columns</text>
</svg>
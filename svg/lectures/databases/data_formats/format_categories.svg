<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="17.415" y="45.7143" width="348.2993" height="594.2857" rx="17.415" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.483" />
  <ns0:text x="191.5647" y="114.2857" text-anchor="middle" font-weight="bold" font-size="24.381">Text-Based</ns0:text>
  <ns0:text x="191.5647" y="182.8571" text-anchor="middle" font-size="20.898">CSV, INI, JSON</ns0:text>
  <ns0:text x="191.5647" y="228.5714" text-anchor="middle" font-size="20.898">YAML, TOML, XML</ns0:text>
  <ns0:text x="191.5647" y="274.2857" text-anchor="middle" font-size="20.898">JSON Lines</ns0:text>
  <ns0:text x="191.5647" y="365.7143" text-anchor="middle" font-size="19.1565" fill="#555">Human-readable</ns0:text>
  <ns0:text x="191.5647" y="411.4286" text-anchor="middle" font-size="19.1565" fill="#555">Easy to edit</ns0:text>
  <ns0:text x="191.5647" y="457.1429" text-anchor="middle" font-size="19.1565" fill="#555">Larger file size</ns0:text>
  <ns0:text x="191.5647" y="502.8571" text-anchor="middle" font-size="19.1565" fill="#555">Slower to parse</ns0:text>
  <ns0:rect x="435.3742" y="45.7143" width="348.2993" height="594.2857" rx="17.415" fill="#fce4ec" stroke="#c62828" stroke-width="3.483" />
  <ns0:text x="609.5238" y="114.2857" text-anchor="middle" font-weight="bold" font-size="24.381">Binary</ns0:text>
  <ns0:text x="609.5238" y="182.8571" text-anchor="middle" font-size="20.898">Parquet, SQLite</ns0:text>
  <ns0:text x="609.5238" y="228.5714" text-anchor="middle" font-size="20.898">MessagePack, Protobuf</ns0:text>
  <ns0:text x="609.5238" y="365.7143" text-anchor="middle" font-size="19.1565" fill="#555">Not human-readable</ns0:text>
  <ns0:text x="609.5238" y="411.4286" text-anchor="middle" font-size="19.1565" fill="#555">Compact storage</ns0:text>
  <ns0:text x="609.5238" y="457.1429" text-anchor="middle" font-size="19.1565" fill="#555">Fast to parse</ns0:text>
  <ns0:text x="609.5238" y="502.8571" text-anchor="middle" font-size="19.1565" fill="#555">Needs special tools</ns0:text>
  <ns0:rect x="853.3333" y="45.7143" width="348.2993" height="594.2857" rx="17.415" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.483" />
  <ns0:text x="1027.483" y="114.2857" text-anchor="middle" font-weight="bold" font-size="24.381">Database-Like</ns0:text>
  <ns0:text x="1027.483" y="182.8571" text-anchor="middle" font-size="20.898">SQLite, Parquet</ns0:text>
  <ns0:text x="1027.483" y="365.7143" text-anchor="middle" font-size="19.1565" fill="#555">Queryable</ns0:text>
  <ns0:text x="1027.483" y="411.4286" text-anchor="middle" font-size="19.1565" fill="#555">Indexed access</ns0:text>
  <ns0:text x="1027.483" y="457.1429" text-anchor="middle" font-size="19.1565" fill="#555">Schema enforcement</ns0:text>
  <ns0:text x="1027.483" y="502.8571" text-anchor="middle" font-size="19.1565" fill="#555">Partial reads</ns0:text>
</ns0:svg>
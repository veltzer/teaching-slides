<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="17.415" y="45.7143" width="348.2993" height="594.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="191.5647" y="114.2857" text-anchor="middle" font-weight="bold" font-size="24.381">Text-Based</text>
  <text x="191.5647" y="182.8571" text-anchor="middle" font-size="20.898">CSV, INI, JSON</text>
  <text x="191.5647" y="228.5714" text-anchor="middle" font-size="20.898">YAML, TOML, XML</text>
  <text x="191.5647" y="274.2857" text-anchor="middle" font-size="20.898">JSON Lines</text>
  <text x="191.5647" y="365.7143" text-anchor="middle" font-size="19.1565" fill="var(--text-muted)">Human-readable</text>
  <text x="191.5647" y="411.4286" text-anchor="middle" font-size="19.1565" fill="var(--text-muted)">Easy to edit</text>
  <text x="191.5647" y="457.1429" text-anchor="middle" font-size="19.1565" fill="var(--text-muted)">Larger file size</text>
  <text x="191.5647" y="502.8571" text-anchor="middle" font-size="19.1565" fill="var(--text-muted)">Slower to parse</text>
  <rect x="435.3742" y="45.7143" width="348.2993" height="594.2857" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="609.5238" y="114.2857" text-anchor="middle" font-weight="bold" font-size="24.381">Binary</text>
  <text x="609.5238" y="182.8571" text-anchor="middle" font-size="20.898">Parquet, SQLite</text>
  <text x="609.5238" y="228.5714" text-anchor="middle" font-size="20.898">MessagePack, Protobuf</text>
  <text x="609.5238" y="365.7143" text-anchor="middle" font-size="19.1565" fill="var(--text-muted)">Not human-readable</text>
  <text x="609.5238" y="411.4286" text-anchor="middle" font-size="19.1565" fill="var(--text-muted)">Compact storage</text>
  <text x="609.5238" y="457.1429" text-anchor="middle" font-size="19.1565" fill="var(--text-muted)">Fast to parse</text>
  <text x="609.5238" y="502.8571" text-anchor="middle" font-size="19.1565" fill="var(--text-muted)">Needs special tools</text>
  <rect x="853.3333" y="45.7143" width="348.2993" height="594.2857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1027.483" y="114.2857" text-anchor="middle" font-weight="bold" font-size="24.381">Database-Like</text>
  <text x="1027.483" y="182.8571" text-anchor="middle" font-size="20.898">SQLite, Parquet</text>
  <text x="1027.483" y="365.7143" text-anchor="middle" font-size="19.1565" fill="var(--text-muted)">Queryable</text>
  <text x="1027.483" y="411.4286" text-anchor="middle" font-size="19.1565" fill="var(--text-muted)">Indexed access</text>
  <text x="1027.483" y="457.1429" text-anchor="middle" font-size="19.1565" fill="var(--text-muted)">Schema enforcement</text>
  <text x="1027.483" y="502.8571" text-anchor="middle" font-size="19.1565" fill="var(--text-muted)">Partial reads</text>
</svg>
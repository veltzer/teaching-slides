<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="352.9412" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="216.4706" y="106.9231" text-anchor="middle" font-weight="bold" font-size="24.2461" font-family="Arial, sans-serif" fill="var(--primary-text)">Text-Based</text>
  <text x="216.4706" y="173.8461" text-anchor="middle" font-size="20.7824" font-family="Arial, sans-serif" fill="var(--primary-text)">CSV, INI, JSON</text>
  <text x="216.4706" y="218.4615" text-anchor="middle" font-size="20.7824" font-family="Arial, sans-serif" fill="var(--primary-text)">YAML, TOML, XML</text>
  <text x="216.4706" y="263.0769" text-anchor="middle" font-size="20.7824" font-family="Arial, sans-serif" fill="var(--primary-text)">JSON Lines</text>
  <text x="216.4706" y="352.3077" text-anchor="middle" font-size="19.0505" fill="var(--text-muted)" font-family="Arial, sans-serif">Human-readable</text>
  <text x="216.4706" y="396.9231" text-anchor="middle" font-size="19.0505" fill="var(--text-muted)" font-family="Arial, sans-serif">Easy to edit</text>
  <text x="216.4706" y="441.5385" text-anchor="middle" font-size="19.0505" fill="var(--text-muted)" font-family="Arial, sans-serif">Larger file size</text>
  <text x="216.4706" y="486.1538" text-anchor="middle" font-size="19.0505" fill="var(--text-muted)" font-family="Arial, sans-serif">Slower to parse</text>
  <rect x="463.5295" y="40" width="352.9412" height="580" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="106.9231" text-anchor="middle" font-weight="bold" font-size="24.2461" font-family="Arial, sans-serif" fill="var(--danger-text)">Binary</text>
  <text x="640" y="173.8461" text-anchor="middle" font-size="20.7824" font-family="Arial, sans-serif" fill="var(--danger-text)">Parquet, SQLite</text>
  <text x="640" y="218.4615" text-anchor="middle" font-size="20.7824" font-family="Arial, sans-serif" fill="var(--danger-text)">MessagePack, Protobuf</text>
  <text x="640" y="352.3077" text-anchor="middle" font-size="19.0505" fill="var(--text-muted)" font-family="Arial, sans-serif">Not human-readable</text>
  <text x="640" y="396.9231" text-anchor="middle" font-size="19.0505" fill="var(--text-muted)" font-family="Arial, sans-serif">Compact storage</text>
  <text x="640" y="441.5385" text-anchor="middle" font-size="19.0505" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast to parse</text>
  <text x="640" y="486.1538" text-anchor="middle" font-size="19.0505" fill="var(--text-muted)" font-family="Arial, sans-serif">Needs special tools</text>
  <rect x="887.0588" y="40" width="352.9412" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.5295" y="106.9231" text-anchor="middle" font-weight="bold" font-size="24.2461" font-family="Arial, sans-serif" fill="var(--ok-text)">Database-Like</text>
  <text x="1063.5295" y="173.8461" text-anchor="middle" font-size="20.7824" font-family="Arial, sans-serif" fill="var(--ok-text)">SQLite, Parquet</text>
  <text x="1063.5295" y="352.3077" text-anchor="middle" font-size="19.0505" fill="var(--text-muted)" font-family="Arial, sans-serif">Queryable</text>
  <text x="1063.5295" y="396.9231" text-anchor="middle" font-size="19.0505" fill="var(--text-muted)" font-family="Arial, sans-serif">Indexed access</text>
  <text x="1063.5295" y="441.5385" text-anchor="middle" font-size="19.0505" fill="var(--text-muted)" font-family="Arial, sans-serif">Schema enforcement</text>
  <text x="1063.5295" y="486.1538" text-anchor="middle" font-size="19.0505" fill="var(--text-muted)" font-family="Arial, sans-serif">Partial reads</text>
</svg>
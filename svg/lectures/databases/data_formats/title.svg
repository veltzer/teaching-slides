<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="160%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <g stroke="var(--bg)" stroke-opacity="0.05" stroke-width="1.4222">
    <line x1="0" y1="128" x2="1137.7778" y2="128" />
    <line x1="0" y1="256" x2="1137.7778" y2="256" />
    <line x1="0" y1="384" x2="1137.7778" y2="384" />
    <line x1="0" y1="512" x2="1137.7778" y2="512" />
    <line x1="227.5556" y1="0" x2="227.5556" y2="640" />
    <line x1="455.1111" y1="0" x2="455.1111" y2="640" />
    <line x1="682.6667" y1="0" x2="682.6667" y2="640" />
    <line x1="910.2222" y1="0" x2="910.2222" y2="640" />
  </g>
  <g transform="translate(60, 60)">
    <rect width="142.2222" height="192" rx="6" fill="var(--danger-fill)" fill-opacity="0.15" stroke="var(--danger-border)" stroke-width="2" />
    <text x="71.1111" y="64" text-anchor="middle" fill="var(--danger-accent)" font-family="monospace" font-size="19.9111" font-weight="bold">{ }</text>
    <text x="71.1111" y="104" text-anchor="middle" fill="var(--danger-accent)" font-family="monospace" font-size="14.2222">"key":</text>
    <text x="71.1111" y="131.2" text-anchor="middle" fill="var(--danger-accent)" font-family="monospace" font-size="14.2222">"val"</text>
    <text x="71.1111" y="176" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">JSON</text>
  </g>
  <g transform="translate(200, 220)">
    <rect width="142.2222" height="192" rx="6" fill="var(--primary-fill)" fill-opacity="0.15" stroke="var(--primary-border)" stroke-width="2" />
    <text x="71.1111" y="56" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="14.2222">a,b,c</text>
    <text x="71.1111" y="83.2" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="14.2222">1,2,3</text>
    <text x="71.1111" y="110.4" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="14.2222">4,5,6</text>
    <text x="71.1111" y="176" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">CSV</text>
  </g>
  <g transform="translate(200, 50)">
    <rect width="142.2222" height="192" rx="6" fill="var(--primary-fill)" fill-opacity="0.15" stroke="var(--primary-border)" stroke-width="2" />
    <text x="71.1111" y="56" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="14.2222">name: val</text>
    <text x="71.1111" y="83.2" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="14.2222">list:</text>
    <text x="71.1111" y="110.4" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="14.2222">  - item</text>
    <text x="71.1111" y="176" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">YAML</text>
  </g>
  <g transform="translate(60, 230)">
    <rect width="142.2222" height="192" rx="6" fill="var(--text-faint)" fill-opacity="0.15" stroke="var(--text-faint)" stroke-width="2.8444" />
    <text x="71.1111" y="56" text-anchor="middle" fill="var(--text-faint)" font-family="monospace" font-size="14.2222">[section]</text>
    <text x="71.1111" y="83.2" text-anchor="middle" fill="var(--text-faint)" font-family="monospace" font-size="14.2222">key = "v"</text>
    <text x="71.1111" y="110.4" text-anchor="middle" fill="var(--text-faint)" font-family="monospace" font-size="14.2222">n = 42</text>
    <text x="71.1111" y="176" text-anchor="middle" fill="var(--text-faint)" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">TOML</text>
  </g>
  <g transform="translate(630, 50)">
    <rect width="156.4444" height="192" rx="6" fill="var(--warn-fill)" fill-opacity="0.15" stroke="var(--warn-border)" stroke-width="2" />
    <rect x="21.3333" y="40" width="25.6" height="88" rx="6" fill="var(--warn-fill)" fill-opacity="0.5" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="54.0444" y="40" width="25.6" height="88" rx="6" fill="var(--warn-fill)" fill-opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="86.7556" y="40" width="25.6" height="88" rx="6" fill="var(--warn-fill)" fill-opacity="0.5" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="119.4667" y="40" width="25.6" height="88" rx="6" fill="var(--warn-fill)" fill-opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="78.2222" y="176" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Parquet</text>
  </g>
  <g transform="translate(640, 230)">
    <rect width="156.4444" height="192" rx="6" fill="var(--info-fill)" fill-opacity="0.15" stroke="var(--info-border)" stroke-width="2" />
    <ellipse cx="78.2222" cy="56" rx="42.6667" ry="14.2222" fill="none" stroke="var(--info-border)" stroke-width="2.1333" />
    <line x1="35.5556" y1="56" x2="35.5556" y2="104" stroke="var(--info-border)" stroke-width="2" />
    <line x1="120.8889" y1="56" x2="120.8889" y2="104" stroke="var(--info-border)" stroke-width="2" />
    <ellipse cx="78.2222" cy="104" rx="42.6667" ry="14.2222" fill="none" stroke="var(--info-border)" stroke-width="2.1333" />
    <text x="78.2222" y="176" text-anchor="middle" fill="var(--info-accent)" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">SQLite</text>
  </g>
  <g transform="translate(500, 230)">
    <rect width="142.2222" height="192" rx="6" fill="var(--info-fill)" fill-opacity="0.15" stroke="var(--info-border)" stroke-width="2" />
    <text x="71.1111" y="56" text-anchor="middle" fill="var(--info-accent)" font-family="monospace" font-size="14.2222">&lt;root&gt;</text>
    <text x="71.1111" y="83.2" text-anchor="middle" fill="var(--info-accent)" font-family="monospace" font-size="14.2222"> &lt;el/&gt;</text>
    <text x="71.1111" y="110.4" text-anchor="middle" fill="var(--info-accent)" font-family="monospace" font-size="14.2222">&lt;/root&gt;</text>
    <text x="71.1111" y="176" text-anchor="middle" fill="var(--info-accent)" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">XML</text>
  </g>
  <g transform="translate(500, 50)">
    <rect width="142.2222" height="192" rx="6" fill="var(--warn-fill)" fill-opacity="0.15" stroke="var(--warn-border)" stroke-width="2" />
    <text x="71.1111" y="56" text-anchor="middle" fill="var(--warn-accent)" font-family="monospace" font-size="14.2222">[db]</text>
    <text x="71.1111" y="83.2" text-anchor="middle" fill="var(--warn-accent)" font-family="monospace" font-size="14.2222">host=srv</text>
    <text x="71.1111" y="110.4" text-anchor="middle" fill="var(--warn-accent)" font-family="monospace" font-size="14.2222">port=5432</text>
    <text x="71.1111" y="176" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">INI</text>
  </g>
  <rect x="469.3333" y="192" width="284.4444" height="256" rx="6" fill="url(#glow)" fill-opacity="0.6" stroke="var(--bg)" stroke-width="1.4222" stroke-opacity="0.3" />
  <text x="611.5556" y="280" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="39.8222" font-weight="bold">Data</text>
  <text x="611.5556" y="344" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="39.8222" font-weight="bold">Formats</text>
  <text x="611.5556" y="400" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="17.0667" fill-opacity="0.6">choosing the right one</text>
  <g stroke="var(--bg)" stroke-opacity="0.08" stroke-width="1.4222">
    <line x1="227.5556" y1="192" x2="469.3333" y2="288" />
    <line x1="426.6667" y1="176" x2="469.3333" y2="272" />
    <line x1="227.5556" y1="464" x2="469.3333" y2="352" />
    <line x1="426.6667" y1="448" x2="469.3333" y2="352" />
    <line x1="782.2222" y1="176" x2="753.7778" y2="272" />
    <line x1="853.3333" y1="176" x2="753.7778" y2="288" />
    <line x1="782.2222" y1="464" x2="753.7778" y2="352" />
    <line x1="988.4444" y1="464" x2="753.7778" y2="352" />
  </g>
</svg>
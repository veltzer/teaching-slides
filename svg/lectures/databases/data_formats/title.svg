<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="160%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <g stroke="var(--bg)" stroke-opacity="0.05" stroke-width="1.4222">
    <line x1="40" y1="156" x2="1240" y2="156" />
    <line x1="40" y1="272" x2="1240" y2="272" />
    <line x1="40" y1="388" x2="1240" y2="388" />
    <line x1="40" y1="504" x2="1240" y2="504" />
    <line x1="280" y1="40" x2="280" y2="620" />
    <line x1="520" y1="40" x2="520" y2="620" />
    <line x1="760" y1="40" x2="760" y2="620" />
    <line x1="1000" y1="40" x2="1000" y2="620" />
  </g>
  <g transform="translate(60, 60)">
    <rect width="150" height="174" rx="6" fill="var(--danger-fill)" fill-opacity="0.15" stroke="var(--danger-border)" stroke-width="2" x="40" y="40"/>
    <text x="115" y="98" text-anchor="middle" fill="var(--danger-accent)" font-family="monospace" font-size="19.4662" font-weight="bold">{ }</text>
    <text x="115" y="134.25" text-anchor="middle" fill="var(--danger-accent)" font-family="monospace" font-size="13.9044">"key":</text>
    <text x="115" y="158.9" text-anchor="middle" fill="var(--danger-accent)" font-family="monospace" font-size="13.9044">"val"</text>
    <text x="115" y="199.5" text-anchor="middle" fill="var(--danger-accent)" font-family="Arial, sans-serif" font-size="18.0758" font-weight="bold">JSON</text>
  </g>
  <g transform="translate(200, 220)">
    <rect width="150" height="174" rx="6" fill="var(--primary-fill)" fill-opacity="0.15" stroke="var(--primary-border)" stroke-width="2" x="40" y="40"/>
    <text x="115" y="90.75" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="13.9044">a,b,c</text>
    <text x="115" y="115.4" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="13.9044">1,2,3</text>
    <text x="115" y="140.05" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="13.9044">4,5,6</text>
    <text x="115" y="199.5" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial, sans-serif" font-size="18.0758" font-weight="bold">CSV</text>
  </g>
  <g transform="translate(200, 50)">
    <rect width="150" height="174" rx="6" fill="var(--primary-fill)" fill-opacity="0.15" stroke="var(--primary-border)" stroke-width="2" x="40" y="40"/>
    <text x="115" y="90.75" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="13.9044">name: val</text>
    <text x="115" y="115.4" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="13.9044">list:</text>
    <text x="115" y="140.05" text-anchor="middle" fill="var(--primary-accent)" font-family="monospace" font-size="13.9044">  - item</text>
    <text x="115" y="199.5" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial, sans-serif" font-size="18.0758" font-weight="bold">YAML</text>
  </g>
  <g transform="translate(60, 230)">
    <rect width="150" height="174" rx="6" fill="var(--text-faint)" fill-opacity="0.15" stroke="var(--text-faint)" stroke-width="2.8444" x="40" y="40"/>
    <text x="115" y="90.75" text-anchor="middle" fill="var(--text-faint)" font-family="monospace" font-size="13.9044">[section]</text>
    <text x="115" y="115.4" text-anchor="middle" fill="var(--text-faint)" font-family="monospace" font-size="13.9044">key = "v"</text>
    <text x="115" y="140.05" text-anchor="middle" fill="var(--text-faint)" font-family="monospace" font-size="13.9044">n = 42</text>
    <text x="115" y="199.5" text-anchor="middle" fill="var(--text-faint)" font-family="Arial, sans-serif" font-size="18.0758" font-weight="bold">TOML</text>
  </g>
  <g transform="translate(630, 50)">
    <rect width="164.9999" height="174" rx="6" fill="var(--warn-fill)" fill-opacity="0.15" stroke="var(--warn-border)" stroke-width="2" x="40" y="40"/>
    <rect x="62.5" y="76.25" width="27" height="79.75" rx="6" fill="var(--warn-fill)" fill-opacity="0.5" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="97" y="76.25" width="27" height="79.75" rx="6" fill="var(--warn-fill)" fill-opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="131.5" y="76.25" width="27" height="79.75" rx="6" fill="var(--warn-fill)" fill-opacity="0.5" stroke="var(--warn-border)" stroke-width="2"/>
    <rect x="166" y="76.25" width="27" height="79.75" rx="6" fill="var(--warn-fill)" fill-opacity="0.7" stroke="var(--warn-border)" stroke-width="2"/>
    <text x="122.5" y="199.5" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif" font-size="18.0758" font-weight="bold">Parquet</text>
  </g>
  <g transform="translate(640, 230)">
    <rect width="164.9999" height="174" rx="6" fill="var(--info-fill)" fill-opacity="0.15" stroke="var(--info-border)" stroke-width="2" x="40" y="40"/>
    <ellipse cx="122.5" cy="90.75" rx="45" ry="12.8889" fill="none" stroke="var(--info-border)" stroke-width="2.1333" />
    <line x1="77.5" y1="90.75" x2="77.5" y2="134.25" stroke="var(--info-border)" stroke-width="2" />
    <line x1="167.5" y1="90.75" x2="167.5" y2="134.25" stroke="var(--info-border)" stroke-width="2" />
    <ellipse cx="122.5" cy="134.25" rx="45" ry="12.8889" fill="none" stroke="var(--info-border)" stroke-width="2.1333" />
    <text x="122.5" y="199.5" text-anchor="middle" fill="var(--info-accent)" font-family="Arial, sans-serif" font-size="18.0758" font-weight="bold">SQLite</text>
  </g>
  <g transform="translate(500, 230)">
    <rect width="150" height="174" rx="6" fill="var(--info-fill)" fill-opacity="0.15" stroke="var(--info-border)" stroke-width="2" x="40" y="40"/>
    <text x="115" y="90.75" text-anchor="middle" fill="var(--info-accent)" font-family="monospace" font-size="13.9044">&lt;root&gt;</text>
    <text x="115" y="115.4" text-anchor="middle" fill="var(--info-accent)" font-family="monospace" font-size="13.9044"> &lt;el/&gt;</text>
    <text x="115" y="140.05" text-anchor="middle" fill="var(--info-accent)" font-family="monospace" font-size="13.9044">&lt;/root&gt;</text>
    <text x="115" y="199.5" text-anchor="middle" fill="var(--info-accent)" font-family="Arial, sans-serif" font-size="18.0758" font-weight="bold">XML</text>
  </g>
  <g transform="translate(500, 50)">
    <rect width="150" height="174" rx="6" fill="var(--warn-fill)" fill-opacity="0.15" stroke="var(--warn-border)" stroke-width="2" x="40" y="40"/>
    <text x="115" y="90.75" text-anchor="middle" fill="var(--warn-accent)" font-family="monospace" font-size="13.9044">[db]</text>
    <text x="115" y="115.4" text-anchor="middle" fill="var(--warn-accent)" font-family="monospace" font-size="13.9044">host=srv</text>
    <text x="115" y="140.05" text-anchor="middle" fill="var(--warn-accent)" font-family="monospace" font-size="13.9044">port=5432</text>
    <text x="115" y="199.5" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial, sans-serif" font-size="18.0758" font-weight="bold">INI</text>
  </g>
  <rect x="535" y="214" width="299.9999" height="232" rx="6" fill="url(#glow)" fill-opacity="0.6" stroke="var(--bg)" stroke-width="1.4222" stroke-opacity="0.3" />
  <text x="685" y="293.75" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="38.9324" font-weight="bold">Data</text>
  <text x="685" y="351.75" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="38.9324" font-weight="bold">Formats</text>
  <text x="685" y="402.5" text-anchor="middle" fill="var(--bg)" font-family="Arial, sans-serif" font-size="16.6854" fill-opacity="0.6">choosing the right one</text>
  <g stroke="var(--bg)" stroke-opacity="0.08" stroke-width="1.4222">
    <line x1="280" y1="214" x2="535" y2="301" />
    <line x1="490" y1="199.5" x2="535" y2="286.5" />
    <line x1="280" y1="460.5" x2="535" y2="359" />
    <line x1="490" y1="446" x2="535" y2="359" />
    <line x1="865" y1="199.5" x2="835" y2="286.5" />
    <line x1="939.9999" y1="199.5" x2="835" y2="301" />
    <line x1="865" y1="460.5" x2="835" y2="359" />
    <line x1="1082.4999" y1="460.5" x2="835" y2="359" />
  </g>
</svg>
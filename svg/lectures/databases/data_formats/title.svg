<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- JSON icon -->
  <g transform="translate(60, 60)">
    <rect width="100" height="120" rx="8" fill="#e94560" fill-opacity="0.15" stroke="#e94560" stroke-width="2"/>
    <text x="50" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="14" font-weight="bold">{ }</text>
    <text x="50" y="65" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="10">"key":</text>
    <text x="50" y="82" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="10">"val"</text>
    <text x="50" y="110" text-anchor="middle" fill="#e94560" font-family="Arial, sans-serif" font-size="13" font-weight="bold">JSON</text>
  </g>

  <!-- CSV icon -->
  <g transform="translate(200, 220)">
    <rect width="100" height="120" rx="8" fill="#00b4d8" fill-opacity="0.15" stroke="#00b4d8" stroke-width="2"/>
    <text x="50" y="35" text-anchor="middle" fill="#00b4d8" font-family="monospace" font-size="10">a,b,c</text>
    <text x="50" y="52" text-anchor="middle" fill="#00b4d8" font-family="monospace" font-size="10">1,2,3</text>
    <text x="50" y="69" text-anchor="middle" fill="#00b4d8" font-family="monospace" font-size="10">4,5,6</text>
    <text x="50" y="110" text-anchor="middle" fill="#00b4d8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">CSV</text>
  </g>

  <!-- YAML icon -->
  <g transform="translate(200, 50)">
    <rect width="100" height="120" rx="8" fill="#48bfe3" fill-opacity="0.15" stroke="#48bfe3" stroke-width="2"/>
    <text x="50" y="35" text-anchor="middle" fill="#48bfe3" font-family="monospace" font-size="10">name: val</text>
    <text x="50" y="52" text-anchor="middle" fill="#48bfe3" font-family="monospace" font-size="10">list:</text>
    <text x="50" y="69" text-anchor="middle" fill="#48bfe3" font-family="monospace" font-size="10">  - item</text>
    <text x="50" y="110" text-anchor="middle" fill="#48bfe3" font-family="Arial, sans-serif" font-size="13" font-weight="bold">YAML</text>
  </g>

  <!-- TOML icon -->
  <g transform="translate(60, 230)">
    <rect width="100" height="120" rx="8" fill="#90be6d" fill-opacity="0.15" stroke="#90be6d" stroke-width="2"/>
    <text x="50" y="35" text-anchor="middle" fill="#90be6d" font-family="monospace" font-size="10">[section]</text>
    <text x="50" y="52" text-anchor="middle" fill="#90be6d" font-family="monospace" font-size="10">key = "v"</text>
    <text x="50" y="69" text-anchor="middle" fill="#90be6d" font-family="monospace" font-size="10">n = 42</text>
    <text x="50" y="110" text-anchor="middle" fill="#90be6d" font-family="Arial, sans-serif" font-size="13" font-weight="bold">TOML</text>
  </g>

  <!-- Parquet icon -->
  <g transform="translate(630, 50)">
    <rect width="110" height="120" rx="8" fill="#f9c74f" fill-opacity="0.15" stroke="#f9c74f" stroke-width="2"/>
    <!-- Column bars -->
    <rect x="15" y="25" width="18" height="55" rx="3" fill="#f9c74f" fill-opacity="0.5"/>
    <rect x="38" y="25" width="18" height="55" rx="3" fill="#f9c74f" fill-opacity="0.7"/>
    <rect x="61" y="25" width="18" height="55" rx="3" fill="#f9c74f" fill-opacity="0.5"/>
    <rect x="84" y="25" width="18" height="55" rx="3" fill="#f9c74f" fill-opacity="0.7"/>
    <text x="55" y="110" text-anchor="middle" fill="#f9c74f" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Parquet</text>
  </g>

  <!-- SQLite icon -->
  <g transform="translate(640, 230)">
    <rect width="110" height="120" rx="8" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="2"/>
    <!-- DB cylinder -->
    <ellipse cx="55" cy="35" rx="30" ry="10" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="25" y1="35" x2="25" y2="65" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="85" y1="35" x2="85" y2="65" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="55" cy="65" rx="30" ry="10" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="55" y="110" text-anchor="middle" fill="#a78bfa" font-family="Arial, sans-serif" font-size="13" font-weight="bold">SQLite</text>
  </g>

  <!-- XML icon -->
  <g transform="translate(500, 230)">
    <rect width="100" height="120" rx="8" fill="#ff8fab" fill-opacity="0.15" stroke="#ff8fab" stroke-width="2"/>
    <text x="50" y="35" text-anchor="middle" fill="#ff8fab" font-family="monospace" font-size="10">&lt;root&gt;</text>
    <text x="50" y="52" text-anchor="middle" fill="#ff8fab" font-family="monospace" font-size="10"> &lt;el/&gt;</text>
    <text x="50" y="69" text-anchor="middle" fill="#ff8fab" font-family="monospace" font-size="10">&lt;/root&gt;</text>
    <text x="50" y="110" text-anchor="middle" fill="#ff8fab" font-family="Arial, sans-serif" font-size="13" font-weight="bold">XML</text>
  </g>

  <!-- INI icon -->
  <g transform="translate(500, 50)">
    <rect width="100" height="120" rx="8" fill="#ffd166" fill-opacity="0.15" stroke="#ffd166" stroke-width="2"/>
    <text x="50" y="35" text-anchor="middle" fill="#ffd166" font-family="monospace" font-size="10">[db]</text>
    <text x="50" y="52" text-anchor="middle" fill="#ffd166" font-family="monospace" font-size="10">host=srv</text>
    <text x="50" y="69" text-anchor="middle" fill="#ffd166" font-family="monospace" font-size="10">port=5432</text>
    <text x="50" y="110" text-anchor="middle" fill="#ffd166" font-family="Arial, sans-serif" font-size="13" font-weight="bold">INI</text>
  </g>

  <!-- Central title area -->
  <rect x="330" y="120" width="200" height="160" rx="12" fill="url(#glow)" fill-opacity="0.6" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="430" y="175" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Data</text>
  <text x="430" y="215" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Formats</text>
  <text x="430" y="250" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" fill-opacity="0.6">choosing the right one</text>

  <!-- Connecting lines from icons to center -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="160" y1="120" x2="330" y2="180"/>
    <line x1="300" y1="110" x2="330" y2="170"/>
    <line x1="160" y1="290" x2="330" y2="220"/>
    <line x1="300" y1="280" x2="330" y2="220"/>
    <line x1="550" y1="110" x2="530" y2="170"/>
    <line x1="600" y1="110" x2="530" y2="180"/>
    <line x1="550" y1="290" x2="530" y2="220"/>
    <line x1="695" y1="290" x2="530" y2="220"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="440.0001" y="40" width="307.6923" height="70.0001" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="593.8462" y="85.9998" text-anchor="middle" font-size="20.381" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Is it configuration?</text>
  <line x1="440.0001" y1="73.9999" x2="286.1538" y2="159.9999" stroke="var(--text)" stroke-width="2"/>
  <text x="340" y="113.9998" font-size="16.9842" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <line x1="747.6923" y1="73.9999" x2="901.5385" y2="159.9999" stroke="var(--text)" stroke-width="2"/>
  <text x="840" y="113.9998" font-size="16.9842" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="132.3077" y="159.9999" width="307.6923" height="70.0001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="286.1538" y="206" text-anchor="middle" font-size="20.381" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Nested structure?</text>
  <line x1="132.3077" y1="194" x2="86.1538" y2="279.9999" stroke="var(--text)" stroke-width="2"/>
  <text x="86.1538" y="239.9998" font-size="16.9842" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <line x1="440.0001" y1="194" x2="455.3846" y2="279.9999" stroke="var(--text)" stroke-width="2"/>
  <text x="467.6923" y="239.9998" font-size="16.9842" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <rect x="40" y="279.9999" width="107.6923" height="60.0001" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="93.8462" y="320" text-anchor="middle" font-size="18.6825" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">INI</text>
  <rect x="393.8462" y="279.9999" width="138.4615" height="60.0001" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="463.077" y="320" text-anchor="middle" font-size="18.6825" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">TOML/YAML</text>
  <rect x="747.6923" y="159.9999" width="307.6923" height="70.0001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="901.5385" y="206" text-anchor="middle" font-size="20.381" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Is it tabular data?</text>
  <line x1="747.6923" y1="194" x2="640" y2="299.9999" stroke="var(--text)" stroke-width="2"/>
  <text x="670.7693" y="245.9999" font-size="16.9842" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <line x1="1055.3846" y1="194" x2="1070.7692" y2="299.9999" stroke="var(--text)" stroke-width="2"/>
  <text x="1083.0769" y="245.9999" font-size="16.9842" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <rect x="563.077" y="299.9999" width="184.6154" height="70.0001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655.3846" y="346" text-anchor="middle" font-size="20.381" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Web API?</text>
  <line x1="563.077" y1="334" x2="532.3076" y2="419.9999" stroke="var(--text)" stroke-width="2"/>
  <text x="524.6154" y="380" font-size="16.9842" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <line x1="747.6923" y1="334" x2="763.077" y2="419.9999" stroke="var(--text)" stroke-width="2"/>
  <text x="775.3846" y="380" font-size="16.9842" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="470.7693" y="419.9999" width="107.6923" height="60.0001" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="524.6154" y="460" text-anchor="middle" font-size="18.6825" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">JSON</text>
  <rect x="716.9231" y="419.9999" width="107.6923" height="60.0001" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770.7692" y="460" text-anchor="middle" font-size="18.6825" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">XML</text>
  <rect x="978.4615" y="299.9999" width="200" height="70.0001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1078.4615" y="346" text-anchor="middle" font-size="20.381" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Large dataset?</text>
  <line x1="978.4615" y1="334" x2="916.9231" y2="439.9999" stroke="var(--text)" stroke-width="2"/>
  <text x="924.6154" y="389.9999" font-size="16.9842" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <line x1="1078.4615" y1="370" x2="1078.4615" y2="439.9999" stroke="var(--text)" stroke-width="2"/>
  <text x="1101.5385" y="409.9999" font-size="16.9842" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <rect x="855.3845" y="439.9999" width="107.6923" height="60.0001" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="909.2308" y="479.9999" text-anchor="middle" font-size="18.6825" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">CSV</text>
  <rect x="993.8462" y="439.9999" width="184.6154" height="70.0001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.1539" y="486" text-anchor="middle" font-size="20.381" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Need queries?</text>
  <line x1="993.8462" y1="474" x2="932.3077" y2="559.9999" stroke="var(--text)" stroke-width="2"/>
  <text x="940" y="520" font-size="16.9842" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <line x1="1178.4615" y1="474" x2="1178.4615" y2="559.9999" stroke="var(--text)" stroke-width="2"/>
  <text x="1201.5384" y="520" font-size="16.9842" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <rect x="863.077" y="559.9999" width="138.4615" height="60.0001" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="932.3077" y="600" text-anchor="middle" font-size="18.6825" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Parquet</text>
  <rect x="1116.9231" y="559.9999" width="123.0769" height="60.0001" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1178.4615" y="600" text-anchor="middle" font-size="18.6825" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">SQLite</text>
</svg>

<svg width="600" height="250" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="20" width="230" height="200" fill="#fff" stroke="#333" stroke-width="2" rx="5"/>
  <text x="165" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Document (JSON)</text>
  <text x="70" y="75" font-family="monospace" font-size="11">{ "id": "123",</text>
  <text x="70" y="95" font-family="monospace" font-size="11">  "name": "John",</text>
  <text x="70" y="115" font-family="monospace" font-size="11">  "email": "j@ex.com",</text>
  <text x="70" y="135" font-family="monospace" font-size="11">  "address": {</text>
  <text x="70" y="155" font-family="monospace" font-size="11">    "city": "NYC",</text>
  <text x="70" y="175" font-family="monospace" font-size="11">    "zip": "10001"</text>
  <text x="70" y="195" font-family="monospace" font-size="11">  } }</text>
  <rect x="330" y="20" width="230" height="90" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2" rx="5"/>
  <text x="445" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Key Features</text>
  <text x="345" y="70" font-family="Arial, sans-serif" font-size="11">Nested structures</text>
  <text x="345" y="90" font-family="Arial, sans-serif" font-size="11">Schema-flexible</text>
  <rect x="330" y="130" width="230" height="90" fill="#d4edda" stroke="#28a745" stroke-width="2" rx="5"/>
  <text x="445" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Examples</text>
  <text x="345" y="180" font-family="Arial, sans-serif" font-size="11">MongoDB, CouchDB</text>
  <text x="345" y="200" font-family="Arial, sans-serif" font-size="11">Firestore, DynamoDB</text>
</svg>

  <line x1="50" y1="270" x2="230" y2="270" stroke="#16a34a" stroke-width="1"/>
  <text x="60" y="290" font-family="Arial" font-size="12">+ operate()</text>

  <rect x="320" y="300" width="150" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Corner libraries -->
  <rect x="40" y="40" width="320" height="111.149825783972" rx="8.041703149647" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="90.522648083624" text-anchor="middle" font-size="22.114683661529" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">pandas</text>
  <text x="200" y="124.878048780488" text-anchor="middle" font-size="14.072980511882" fill="var(--warn-text)" font-family="Arial, sans-serif">plots, legacy libraries</text>

  <rect x="920" y="40" width="320" height="111.149825783972" rx="8.041703149647" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="90.522648083624" text-anchor="middle" font-size="22.114683661529" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">NumPy</text>
  <text x="1080" y="124.878048780488" text-anchor="middle" font-size="14.072980511882" fill="var(--ok-text)" font-family="Arial, sans-serif">arrays for ML libraries</text>

  <rect x="40" y="474.494773519164" width="320" height="111.149825783972" rx="8.041703149647" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="525.017421602787" text-anchor="middle" font-size="22.114683661529" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">SQL</text>
  <text x="200" y="559.372822299651" text-anchor="middle" font-size="14.072980511882" fill="var(--info-text)" font-family="Arial, sans-serif">queries on frames in scope</text>

  <rect x="920" y="474.494773519164" width="320" height="111.149825783972" rx="8.041703149647" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="525.017421602787" text-anchor="middle" font-size="22.114683661529" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Apache Arrow</text>
  <text x="1080" y="559.372822299651" text-anchor="middle" font-size="14.072980511882" fill="var(--danger-text)" font-family="Arial, sans-serif">shared with the ecosystem</text>

  <!-- Center -->
  <rect x="490" y="252.195121951219" width="300" height="141.463414634146" rx="8.041703149647" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="314.843205574913" text-anchor="middle" font-size="28.145961023764" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Polars</text>
  <text x="640" y="351.219512195122" text-anchor="middle" font-size="15.078193405588" fill="var(--primary-text)" font-family="Arial, sans-serif">keep the pipeline here</text>

  <!-- Edges with conversion labels -->
  <line x1="520" y1="257.247386759582" x2="370" y2="156.202090592334" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="400" y="223.90243902439" text-anchor="middle" font-size="14.072980511882" fill="var(--text-muted)" font-family="Arial, sans-serif">to_pandas / from_pandas</text>

  <line x1="760" y1="257.247386759582" x2="910" y2="156.202090592334" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="880" y="223.90243902439" text-anchor="middle" font-size="14.072980511882" fill="var(--text-muted)" font-family="Arial, sans-serif">to_numpy()</text>

  <line x1="520" y1="388.606271777003" x2="370" y2="489.651567944251" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="400" y="436.09756097561" text-anchor="middle" font-size="14.072980511882" fill="var(--text-muted)" font-family="Arial, sans-serif">pl.sql(...)</text>

  <line x1="760" y1="388.606271777003" x2="910" y2="489.651567944251" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="885" y="436.09756097561" text-anchor="middle" font-size="14.072980511882" fill="var(--text-muted)" font-family="Arial, sans-serif">to_arrow(), zero-copy</text>

  <text x="640" y="620" text-anchor="middle" font-size="18.093832086705" fill="var(--text)" font-family="Arial, sans-serif">Arrow memory makes conversion cheap — convert at the edges only</text>
</svg>

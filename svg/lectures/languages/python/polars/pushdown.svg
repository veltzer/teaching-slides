<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- The Parquet file -->
  <rect x="40" y="40" width="440" height="440" rx="8" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="260" y="82" text-anchor="middle" font-size="19" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">events.parquet: 80 columns</text>

  <rect x="70" y="110" width="70" height="300" rx="4" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="105" y="140" text-anchor="middle" font-size="14" fill="var(--ok-text)" font-family="Arial, sans-serif">city</text>
  <rect x="152" y="110" width="70" height="300" rx="4" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187" y="140" text-anchor="middle" font-size="14" fill="var(--ok-text)" font-family="Arial, sans-serif">amount</text>
  <rect x="234" y="110" width="70" height="300" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="269" y="140" text-anchor="middle" font-size="14" fill="var(--text-faint)" font-family="Arial, sans-serif">ts</text>
  <rect x="316" y="110" width="70" height="300" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="351" y="140" text-anchor="middle" font-size="14" fill="var(--text-faint)" font-family="Arial, sans-serif">user</text>
  <rect x="398" y="110" width="52" height="300" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="424" y="140" text-anchor="middle" font-size="14" fill="var(--text-faint)" font-family="Arial, sans-serif">...</text>

  <text x="146" y="446" text-anchor="middle" font-size="15" fill="var(--text-muted)" font-family="Arial, sans-serif">read: 2 columns</text>
  <text x="350" y="446" text-anchor="middle" font-size="15" fill="var(--text-muted)" font-family="Arial, sans-serif">never touched: 78</text>

  <!-- Scan -->
  <line x1="480" y1="280" x2="596" y2="280" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="600" y="210" width="300" height="140" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="272" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">scan_parquet</text>
  <text x="750" y="308" text-anchor="middle" font-size="15" fill="var(--primary-text)" font-family="Arial, sans-serif">filter and projection pushed here</text>

  <!-- Result -->
  <line x1="900" y1="280" x2="1016" y2="280" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1020" y="225" width="220" height="110" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="275" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">small frame</text>
  <text x="1130" y="308" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">matching rows only</text>

  <rect x="40" y="530" width="1200" height="90" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="570" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">The fastest work is the work that never happens</text>
  <text x="640" y="602" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">columns and row blocks are skipped inside the file scan itself</text>
</svg>

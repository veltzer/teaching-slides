<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- One expression on top -->
  <rect x="390" y="40" width="500" height="100" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">pl.col("salary").mean()</text>
  <text x="640" y="120" text-anchor="middle" font-size="15" fill="var(--info-text)" font-family="Arial, sans-serif">an expression: a description of work, not a result</text>

  <!-- Arrows to the four contexts -->
  <line x1="480" y1="145" x2="185" y2="295" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="580" y1="145" x2="490" y2="295" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="700" y1="145" x2="790" y2="295" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="800" y1="145" x2="1095" y2="295" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>

  <!-- The four contexts -->
  <rect x="40" y="300" width="270" height="120" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175" y="352" text-anchor="middle" font-size="21" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">select</text>
  <text x="175" y="390" text-anchor="middle" font-size="15" fill="var(--primary-text)" font-family="Arial, sans-serif">picks columns</text>

  <rect x="350" y="300" width="270" height="120" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="352" text-anchor="middle" font-size="21" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">filter</text>
  <text x="485" y="390" text-anchor="middle" font-size="15" fill="var(--primary-text)" font-family="Arial, sans-serif">keeps rows</text>

  <rect x="660" y="300" width="270" height="120" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="352" text-anchor="middle" font-size="21" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">with_columns</text>
  <text x="795" y="390" text-anchor="middle" font-size="15" fill="var(--primary-text)" font-family="Arial, sans-serif">adds columns</text>

  <rect x="970" y="300" width="270" height="120" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="352" text-anchor="middle" font-size="21" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">group_by.agg</text>
  <text x="1105" y="390" text-anchor="middle" font-size="15" fill="var(--primary-text)" font-family="Arial, sans-serif">aggregates groups</text>

  <!-- Arrows to the payoff -->
  <line x1="175" y1="420" x2="175" y2="516" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="485" y1="420" x2="485" y2="516" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="795" y1="420" x2="795" y2="516" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="1105" y1="420" x2="1105" y2="516" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <rect x="40" y="520" width="1200" height="100" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="565" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Write it once — every context runs it in parallel</text>
  <text x="640" y="598" text-anchor="middle" font-size="16" fill="var(--ok-text)" font-family="Arial, sans-serif">one expression language across the whole API</text>
</svg>

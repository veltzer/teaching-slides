<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Eager row -->
  <text x="40" y="40" font-size="22.429499264941" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Eager: every step executes now</text>

  <rect x="40" y="69.10394265233" width="210" height="103.942652329749" rx="8.156181550888" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145" y="128.351254480287" text-anchor="middle" font-size="18.351408489497" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">read_parquet</text>
  <rect x="370" y="69.10394265233" width="210" height="103.942652329749" rx="8.156181550888" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="128.351254480287" text-anchor="middle" font-size="18.351408489497" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">filter</text>
  <rect x="700" y="69.10394265233" width="210" height="103.942652329749" rx="8.156181550888" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="128.351254480287" text-anchor="middle" font-size="18.351408489497" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">group_by.agg</text>
  <rect x="1030" y="69.10394265233" width="210" height="103.942652329749" rx="8.156181550888" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="128.351254480287" text-anchor="middle" font-size="18.351408489497" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">result</text>

  <line x1="250" y1="121.075268817204" x2="366" y2="121.075268817204" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="580" y1="121.075268817204" x2="696" y2="121.075268817204" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="910" y1="121.075268817204" x2="1026" y2="121.075268817204" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <text x="145" y="206.308243727599" text-anchor="middle" font-size="15.292840407914" fill="var(--text-muted)" font-family="Arial, sans-serif">loads every row</text>
  <text x="475" y="206.308243727599" text-anchor="middle" font-size="15.292840407914" fill="var(--text-muted)" font-family="Arial, sans-serif">full copy in memory</text>
  <text x="805" y="206.308243727599" text-anchor="middle" font-size="15.292840407914" fill="var(--text-muted)" font-family="Arial, sans-serif">another full copy</text>
  <text x="1135" y="206.308243727599" text-anchor="middle" font-size="15.292840407914" fill="var(--text-muted)" font-family="Arial, sans-serif">finally used</text>

  <!-- Lazy row -->
  <text x="40" y="310.250896057348" font-size="22.429499264941" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Lazy: build a plan, run once</text>

  <rect x="40" y="339.354838709677" width="210" height="103.942652329749" rx="8.156181550888" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145" y="398.602150537634" text-anchor="middle" font-size="18.351408489497" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">scan_parquet</text>
  <rect x="370" y="339.354838709677" width="210" height="103.942652329749" rx="8.156181550888" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="398.602150537634" text-anchor="middle" font-size="18.351408489497" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">filter</text>
  <rect x="700" y="339.354838709677" width="210" height="103.942652329749" rx="8.156181550888" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="398.602150537634" text-anchor="middle" font-size="18.351408489497" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">group_by.agg</text>
  <rect x="1030" y="339.354838709677" width="210" height="103.942652329749" rx="8.156181550888" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="398.602150537634" text-anchor="middle" font-size="18.351408489497" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">collect()</text>

  <line x1="250" y1="391.326164874552" x2="366" y2="391.326164874552" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="580" y1="391.326164874552" x2="696" y2="391.326164874552" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="910" y1="391.326164874552" x2="1026" y2="391.326164874552" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <text x="145" y="476.559139784946" text-anchor="middle" font-size="15.292840407914" fill="var(--text-muted)" font-family="Arial, sans-serif">reads nothing yet</text>
  <text x="475" y="476.559139784946" text-anchor="middle" font-size="15.292840407914" fill="var(--text-muted)" font-family="Arial, sans-serif">grows the plan</text>
  <text x="805" y="476.559139784946" text-anchor="middle" font-size="15.292840407914" fill="var(--text-muted)" font-family="Arial, sans-serif">grows the plan</text>
  <text x="1135" y="476.559139784946" text-anchor="middle" font-size="15.292840407914" fill="var(--text-muted)" font-family="Arial, sans-serif">optimize, then execute</text>

  <rect x="40" y="526.451612903226" width="1200" height="93.548387096774" rx="8.156181550888" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="568.028673835125" text-anchor="middle" font-size="22.429499264941" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">The optimizer sees the whole query before any work starts</text>
  <text x="640" y="601.290322580645" text-anchor="middle" font-size="16.312363101775" fill="var(--info-text)" font-family="Arial, sans-serif">pushdown, reordering, shared subexpressions</text>
</svg>

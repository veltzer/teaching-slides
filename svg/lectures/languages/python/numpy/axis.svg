<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- axis=1 results on the left -->
  <text x="235" y="40" text-anchor="middle" font-size="17.783817108354" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">sum(axis=1) — shape (3,)</text>
  <rect x="180" y="72.830188679245" width="110" height="76.603773584906" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="180" y="160.377358490566" width="110" height="76.603773584906" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="180" y="247.924528301887" width="110" height="76.603773584906" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>

  <line x1="430" y1="111.132075471698" x2="300" y2="111.132075471698" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="430" y1="198.679245283019" x2="300" y2="198.679245283019" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="430" y1="286.22641509434" x2="300" y2="286.22641509434" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <!-- The (3,4) matrix -->
  <text x="635" y="40" text-anchor="middle" font-size="17.783817108354" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">shape (3, 4)</text>
  <rect x="440" y="72.830188679245" width="90" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="540" y="72.830188679245" width="90" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="72.830188679245" width="90" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="740" y="72.830188679245" width="90" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="440" y="160.377358490566" width="90" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="540" y="160.377358490566" width="90" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="160.377358490566" width="90" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="740" y="160.377358490566" width="90" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="440" y="247.924528301887" width="90" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="540" y="247.924528301887" width="90" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="247.924528301887" width="90" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="740" y="247.924528301887" width="90" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

  <!-- axis=0 results below -->
  <line x1="485" y1="335.471698113208" x2="485" y2="407.698113207547" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="585" y1="335.471698113208" x2="585" y2="407.698113207547" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="685" y1="335.471698113208" x2="685" y2="407.698113207547" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="785" y1="335.471698113208" x2="785" y2="407.698113207547" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <rect x="440" y="412.075471698113" width="90" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="540" y="412.075471698113" width="90" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="412.075471698113" width="90" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="740" y="412.075471698113" width="90" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635" y="521.509433962264" text-anchor="middle" font-size="17.783817108354" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">sum(axis=0) — shape (4,)</text>

  <!-- Reminder panel -->
  <rect x="920" y="72.830188679245" width="320" height="251.698113207547" rx="8.368855109814" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1080" y="116.603773584906" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Remember</text>
  <text x="1080" y="165.849056603774" text-anchor="middle" font-size="16.737710219628" fill="var(--text-muted)" font-family="Arial, sans-serif">axis=0 collapses the rows</text>
  <text x="1080" y="209.622641509434" text-anchor="middle" font-size="16.737710219628" fill="var(--text-muted)" font-family="Arial, sans-serif">axis=1 collapses the columns</text>
  <text x="1080" y="253.396226415094" text-anchor="middle" font-size="16.737710219628" fill="var(--text-muted)" font-family="Arial, sans-serif">the named axis disappears</text>

  <rect x="40" y="554.339622641509" width="1200" height="65.660377358491" rx="8.368855109814" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="595.924528301887" text-anchor="middle" font-size="20.922137774535" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">axis names the dimension that disappears from the result</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- The base buffer -->
  <rect x="340" y="40" width="100" height="82.857142857143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="88.678571428571" text-anchor="middle" font-size="17.30090831637" fill="var(--primary-text)" font-family="Arial, sans-serif">0</text>
  <rect x="440" y="40" width="100" height="82.857142857143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="88.678571428571" text-anchor="middle" font-size="17.30090831637" fill="var(--primary-text)" font-family="Arial, sans-serif">1</text>
  <rect x="540" y="40" width="100" height="82.857142857143" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="88.678571428571" text-anchor="middle" font-size="17.30090831637" fill="var(--ok-text)" font-family="Arial, sans-serif">2</text>
  <rect x="640" y="40" width="100" height="82.857142857143" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="690" y="88.678571428571" text-anchor="middle" font-size="17.30090831637" fill="var(--ok-text)" font-family="Arial, sans-serif">3</text>
  <rect x="740" y="40" width="100" height="82.857142857143" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="88.678571428571" text-anchor="middle" font-size="17.30090831637" fill="var(--ok-text)" font-family="Arial, sans-serif">4</text>
  <rect x="840" y="40" width="100" height="82.857142857143" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="88.678571428571" text-anchor="middle" font-size="17.30090831637" fill="var(--primary-text)" font-family="Arial, sans-serif">5</text>
  <text x="640" y="169.464285714286" text-anchor="middle" font-size="16.283207827171" fill="var(--text-muted)" font-family="Arial, sans-serif">base = np.arange(6) — one buffer in memory</text>

  <!-- View -->
  <rect x="40" y="267.857142857143" width="520" height="124.285714285714" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="321.714285714286" text-anchor="middle" font-size="21.371710273163" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">view = base[2:5]</text>
  <text x="300" y="359" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">no data copied — a window into the buffer</text>

  <line x1="240" y1="267.857142857143" x2="580" y2="131.142857142857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="300" y1="267.857142857143" x2="680" y2="131.142857142857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="360" y1="267.857142857143" x2="780" y2="131.142857142857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <text x="300" y="454.285714285714" text-anchor="middle" font-size="16.283207827171" fill="var(--text-muted)" font-family="Arial, sans-serif">view[0] = 99 changes base[2] as well</text>

  <!-- Copy -->
  <rect x="720" y="267.857142857143" width="520" height="124.285714285714" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="321.714285714286" text-anchor="middle" font-size="21.371710273163" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">copy = base[2:5].copy()</text>
  <text x="980" y="359" text-anchor="middle" font-size="15.265507337973" fill="var(--warn-text)" font-family="Arial, sans-serif">a new buffer — fully independent</text>

  <line x1="980" y1="392.142857142857" x2="980" y2="429.428571428571" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <rect x="830" y="433.571428571429" width="100" height="72.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="477.071428571429" text-anchor="middle" font-size="16.283207827171" fill="var(--warn-text)" font-family="Arial, sans-serif">2</text>
  <rect x="930" y="433.571428571429" width="100" height="72.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="477.071428571429" text-anchor="middle" font-size="16.283207827171" fill="var(--warn-text)" font-family="Arial, sans-serif">3</text>
  <rect x="1030" y="433.571428571429" width="100" height="72.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="477.071428571429" text-anchor="middle" font-size="16.283207827171" fill="var(--warn-text)" font-family="Arial, sans-serif">4</text>

  <rect x="40" y="547.5" width="1200" height="72.5" rx="8.141603913586" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="592.035714285714" text-anchor="middle" font-size="21.371710273163" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Slices are views — mutations travel; call .copy() when you need to own the data</text>
</svg>

  <rect x="60" y="158.188679245283" width="70" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="138" y="158.188679245283" width="70" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="216" y="158.188679245283" width="70" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="294" y="158.188679245283" width="70" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="243.547169811321" width="70" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="138" y="243.547169811321" width="70" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="216" y="243.547169811321" width="70" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="294" y="243.547169811321" width="70" height="76.603773584906" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

  <text x="430" y="209.622641509434" text-anchor="middle" font-size="41.844275549069" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">+</text>

  <!-- (4,) row vector with virtual stretch -->
  <text x="650" y="40" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">shape (4,)</text>
  <rect x="496" y="158.188679245283" width="70" height="76.603773584906" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="574" y="158.188679245283" width="70" height="76.603773584906" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="652" y="158.188679245283" width="70" height="76.603773584906" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="730" y="158.188679245283" width="70" height="76.603773584906" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="496" y="72.830188679245" width="70" height="76.603773584906" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="574" y="72.830188679245" width="70" height="76.603773584906" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="652" y="72.830188679245" width="70" height="76.603773584906" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="730" y="72.830188679245" width="70" height="76.603773584906" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="496" y="243.547169811321" width="70" height="76.603773584906" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="574" y="243.547169811321" width="70" height="76.603773584906" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="652" y="243.547169811321" width="70" height="76.603773584906" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="730" y="243.547169811321" width="70" height="76.603773584906" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="648" y="379.245283018868" text-anchor="middle" font-size="16.737710219628" fill="var(--text-muted)" font-family="Arial, sans-serif">stretched virtually, never copied</text>

  <text x="866" y="209.622641509434" text-anchor="middle" font-size="41.844275549069" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">=</text>

  <!-- result (3,4) -->
  <text x="1087" y="40" text-anchor="middle" font-size="18.829923997081" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">shape (3, 4)</text>
  <rect x="932" y="72.830188679245" width="70" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1010" y="72.830188679245" width="70" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1088" y="72.830188679245" width="70" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1166" y="72.830188679245" width="70" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="932" y="158.188679245283" width="70" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1010" y="158.188679245283" width="70" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1088" y="158.188679245283" width="70" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1166" y="158.188679245283" width="70" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="932" y="243.547169811321" width="70" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1010" y="243.547169811321" width="70" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1088" y="243.547169811321" width="70" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1166" y="243.547169811321" width="70" height="76.603773584906" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

  <rect x="40" y="455.849056603774" width="1200" height="164.150943396226" rx="8.368855109814" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="521.509433962264" text-anchor="middle" font-size="23.014351551988" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Align shapes from the right — each dimension must match or be 1</text>
  <text x="640" y="563.094339622641" text-anchor="middle" font-size="17.783817108354" fill="var(--info-text)" font-family="Arial, sans-serif">size-1 dimensions stretch to fit, with no copying and no loops</text>
</svg>

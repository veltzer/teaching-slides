<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Libraries on top -->
  <rect x="40" y="40" width="270" height="110" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175" y="90" text-anchor="middle" font-size="21" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">pandas</text>
  <text x="175" y="124" text-anchor="middle" font-size="14" fill="var(--primary-text)" font-family="Arial, sans-serif">labeled tables</text>
  <rect x="350" y="40" width="270" height="110" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="90" text-anchor="middle" font-size="21" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">SciPy</text>
  <text x="485" y="124" text-anchor="middle" font-size="14" fill="var(--primary-text)" font-family="Arial, sans-serif">scientific algorithms</text>
  <rect x="660" y="40" width="270" height="110" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="90" text-anchor="middle" font-size="21" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">scikit-learn</text>
  <text x="795" y="124" text-anchor="middle" font-size="14" fill="var(--primary-text)" font-family="Arial, sans-serif">machine learning</text>
  <rect x="970" y="40" width="270" height="110" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="90" text-anchor="middle" font-size="21" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Matplotlib</text>
  <text x="1105" y="124" text-anchor="middle" font-size="14" fill="var(--primary-text)" font-family="Arial, sans-serif">plotting</text>

  <line x1="175" y1="150" x2="175" y2="246" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="485" y1="150" x2="485" y2="246" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="795" y1="150" x2="795" y2="246" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1105" y1="150" x2="1105" y2="246" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- NumPy layer -->
  <rect x="40" y="250" width="1200" height="150" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="315" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">NumPy</text>
  <text x="640" y="355" text-anchor="middle" font-size="17" fill="var(--ok-text)" font-family="Arial, sans-serif">the ndarray — the array every library exchanges</text>

  <line x1="640" y1="400" x2="640" y2="456" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Native layer -->
  <rect x="40" y="460" width="1200" height="160" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="530" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">C loops, BLAS and LAPACK, SIMD</text>
  <text x="640" y="570" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">compiled code does the arithmetic — Python just orchestrates</text>
</svg>

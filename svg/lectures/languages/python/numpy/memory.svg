<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Python list: pointers to scattered objects -->
  <rect x="40" y="40" width="560" height="400" rx="8" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="320" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Python list</text>

  <rect x="80" y="110" width="110" height="60" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="146" text-anchor="middle" font-size="15" fill="var(--info-text)" font-family="Arial, sans-serif">ptr</text>
  <rect x="210" y="110" width="110" height="60" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="265" y="146" text-anchor="middle" font-size="15" fill="var(--info-text)" font-family="Arial, sans-serif">ptr</text>
  <rect x="340" y="110" width="110" height="60" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="146" text-anchor="middle" font-size="15" fill="var(--info-text)" font-family="Arial, sans-serif">ptr</text>
  <rect x="470" y="110" width="110" height="60" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="525" y="146" text-anchor="middle" font-size="15" fill="var(--info-text)" font-family="Arial, sans-serif">ptr</text>

  <rect x="80" y="230" width="150" height="70" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="272" text-anchor="middle" font-size="15" fill="var(--warn-text)" font-family="Arial, sans-serif">object 1.0</text>
  <rect x="400" y="250" width="150" height="70" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="292" text-anchor="middle" font-size="15" fill="var(--warn-text)" font-family="Arial, sans-serif">object 2.5</text>
  <rect x="150" y="340" width="150" height="70" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="382" text-anchor="middle" font-size="15" fill="var(--warn-text)" font-family="Arial, sans-serif">object 3.7</text>
  <rect x="380" y="350" width="150" height="60" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="455" y="387" text-anchor="middle" font-size="15" fill="var(--warn-text)" font-family="Arial, sans-serif">object 4.2</text>

  <line x1="135" y1="170" x2="150" y2="226" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="170" x2="450" y2="246" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="170" x2="240" y2="336" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="525" y1="170" x2="465" y2="346" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ndarray: one contiguous buffer -->
  <rect x="680" y="40" width="560" height="400" rx="8" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="960" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">NumPy ndarray</text>
  <text x="960" y="150" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">dtype=float64, shape=(6,)</text>

  <rect x="712" y="200" width="82" height="80" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="753" y="247" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">1.0</text>
  <rect x="794" y="200" width="82" height="80" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="835" y="247" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">2.5</text>
  <rect x="876" y="200" width="82" height="80" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="917" y="247" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">3.7</text>
  <rect x="958" y="200" width="82" height="80" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999" y="247" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">4.2</text>
  <rect x="1040" y="200" width="82" height="80" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1081" y="247" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">5.1</text>
  <rect x="1122" y="200" width="82" height="80" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1163" y="247" text-anchor="middle" font-size="15" fill="var(--ok-text)" font-family="Arial, sans-serif">6.3</text>

  <text x="960" y="340" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">one contiguous block, 8 bytes per element</text>

  <rect x="40" y="530" width="1200" height="90" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="570" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Typed contiguous memory is what makes everything else fast</text>
  <text x="640" y="602" text-anchor="middle" font-size="16" fill="var(--info-text)" font-family="Arial, sans-serif">no boxes, no pointer chasing, cache-friendly scans</text>
</svg>

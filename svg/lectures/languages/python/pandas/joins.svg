<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Left table -->
  <rect x="40" y="40" width="340" height="62.142857142857" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="77.285714285714" text-anchor="middle" font-size="17.30090831637" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">orders</text>
  <rect x="40" y="102.142857142857" width="340" height="51.785714285714" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="210" y="134.25" text-anchor="middle" font-size="15.265507337973" fill="var(--text)" font-family="Arial, sans-serif">customer_id = 1</text>
  <rect x="40" y="153.928571428571" width="340" height="51.785714285714" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="210" y="186.035714285714" text-anchor="middle" font-size="15.265507337973" fill="var(--text)" font-family="Arial, sans-serif">customer_id = 2</text>
  <rect x="40" y="205.714285714286" width="340" height="51.785714285714" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="210" y="237.821428571429" text-anchor="middle" font-size="15.265507337973" fill="var(--text)" font-family="Arial, sans-serif">customer_id = 3</text>
  <rect x="40" y="257.5" width="340" height="51.785714285714" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="210" y="289.607142857143" text-anchor="middle" font-size="15.265507337973" fill="var(--text)" font-family="Arial, sans-serif">customer_id = 4</text>

  <!-- Right table -->
  <rect x="900" y="40" width="340" height="62.142857142857" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="77.285714285714" text-anchor="middle" font-size="17.30090831637" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">customers</text>
  <rect x="900" y="102.142857142857" width="340" height="51.785714285714" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="1070" y="134.25" text-anchor="middle" font-size="15.265507337973" fill="var(--text)" font-family="Arial, sans-serif">customer_id = 1</text>
  <rect x="900" y="153.928571428571" width="340" height="51.785714285714" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="1070" y="186.035714285714" text-anchor="middle" font-size="15.265507337973" fill="var(--text)" font-family="Arial, sans-serif">customer_id = 2</text>
  <rect x="900" y="205.714285714286" width="340" height="51.785714285714" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="1070" y="237.821428571429" text-anchor="middle" font-size="15.265507337973" fill="var(--text)" font-family="Arial, sans-serif">customer_id = 5</text>

  <!-- Merge box -->
  <rect x="520" y="122.857142857143" width="240" height="124.285714285714" rx="8.141603913586" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="176.714285714286" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">merge</text>
  <text x="640" y="214" text-anchor="middle" font-size="14.247806848775" fill="var(--info-text)" font-family="Arial, sans-serif">on="customer_id"</text>

  <line x1="380" y1="179.821428571429" x2="516" y2="179.821428571429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="900" y1="179.821428571429" x2="764" y2="179.821428571429" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <!-- Outcomes -->
  <rect x="40" y="392.142857142857" width="380" height="103.571428571429" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="435.642857142857" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">inner</text>
  <text x="230" y="470.857142857143" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">only 1 and 2 — matched on both sides</text>

  <rect x="450" y="392.142857142857" width="380" height="103.571428571429" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="435.642857142857" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">left</text>
  <text x="640" y="470.857142857143" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">1, 2, 3, 4 — unmatched get NaN</text>

  <rect x="860" y="392.142857142857" width="380" height="103.571428571429" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="435.642857142857" text-anchor="middle" font-size="19.336309294766" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">outer</text>
  <text x="1050" y="470.857142857143" text-anchor="middle" font-size="15.265507337973" fill="var(--ok-text)" font-family="Arial, sans-serif">1, 2, 3, 4, 5 — everyone survives</text>

  <line x1="560" y1="247.142857142857" x2="280" y2="388" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="640" y1="247.142857142857" x2="640" y2="388" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="720" y1="247.142857142857" x2="1000" y2="388" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>

  <rect x="40" y="547.5" width="1200" height="72.5" rx="8.141603913586" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="592.035714285714" text-anchor="middle" font-size="21.371710273163" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">how= decides whose unmatched rows survive the merge</text>
</svg>

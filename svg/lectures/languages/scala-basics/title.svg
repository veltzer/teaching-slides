<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
    <linearGradient id="scala-red" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#dc322f" />
      <stop offset="100%" style="stop-color:#ff4136" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <g transform="translate(100,80)">
    <rect x="0" y="320" width="170.6667" height="48" rx="6" fill="url(#scala-red)" />
    <rect x="0" y="336" width="170.6667" height="32" rx="6" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2"/>
    <rect x="0" y="240" width="170.6667" height="48" rx="6" fill="url(#scala-red)" />
    <rect x="0" y="256" width="170.6667" height="32" rx="6" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2"/>
    <rect x="0" y="160" width="170.6667" height="48" rx="6" fill="url(#scala-red)" />
    <rect x="0" y="176" width="170.6667" height="32" rx="6" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2"/>
    <rect x="0" y="80" width="170.6667" height="48" rx="6" fill="url(#scala-red)" />
    <rect x="0" y="96" width="170.6667" height="32" rx="6" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2"/>
  </g>
  <g font-family="monospace" font-size="19.9111">
    <text x="426.6667" y="160" fill="var(--danger-accent)">val</text>
    <text x="469.3333" y="160" fill="var(--primary-accent)"> greeting</text>
    <text x="604.4444" y="160" fill="var(--bg)"> = </text>
    <text x="632.8889" y="160" fill="var(--ok-accent)">"Hello, Scala!"</text>
    <text x="426.6667" y="224" fill="var(--danger-accent)">def</text>
    <text x="469.3333" y="224" fill="var(--primary-accent)"> add</text>
    <text x="519.1111" y="224" fill="var(--bg)">(a: Int, b: Int): Int =</text>
    <text x="455.1111" y="264" fill="var(--warn-accent)">  a + b</text>
    <text x="426.6667" y="336" fill="var(--danger-accent)">case class</text>
    <text x="561.7778" y="336" fill="var(--primary-accent)"> Person</text>
    <text x="654.2222" y="336" fill="var(--bg)">(name: String)</text>
    <text x="426.6667" y="416" fill="var(--info-accent)">List</text>
    <text x="469.3333" y="416" fill="var(--bg)">(1, 2, 3)</text>
    <text x="426.6667" y="456" fill="var(--bg)">  .map(_ * 2)</text>
    <text x="426.6667" y="496" fill="var(--bg)">  .filter(_ &gt; 2)</text>
  </g>
  <rect x="881.7778" y="480" width="199.1111" height="80" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="981.3333" y="528" text-anchor="middle" fill="var(--warn-accent)" font-family="Arial" font-size="22.7556" font-weight="bold">JVM</text>
  <circle cx="924.4444" cy="192" r="56.8889" fill="none" stroke="var(--info-border)" stroke-width="2.8444" />
  <text x="924.4444" y="184" text-anchor="middle" fill="var(--info-accent)" font-family="Arial" font-size="15.6444">FP</text>
  <text x="924.4444" y="211.2" text-anchor="middle" fill="var(--info-accent)" font-family="Arial" font-size="14.2222">functional</text>
  <circle cx="1024" cy="192" r="56.8889" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" />
  <text x="1024" y="184" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial" font-size="15.6444">OOP</text>
  <text x="1024" y="211.2" text-anchor="middle" fill="var(--primary-accent)" font-family="Arial" font-size="14.2222">objects</text>
</svg>
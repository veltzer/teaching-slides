  <text x="924.4444" y="211.2" text-anchor="middle" fill="var(--info-soft)" font-family="Arial" font-size="14.2222">functional</text>
  <circle cx="1024" cy="192" r="56.8889" fill="none" stroke="var(--primary-soft)" stroke-width="2.8444" />

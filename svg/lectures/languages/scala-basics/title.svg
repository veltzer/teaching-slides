<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#16213e" />
    </linearGradient>
    <linearGradient id="scala-red" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#dc322f" />
      <stop offset="100%" style="stop-color:#ff4136" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)" />
  <g transform="translate(100,80)">
    <rect x="0" y="360" width="192" height="54" rx="6.4" fill="url(#scala-red)" />
    <rect x="0" y="378" width="192" height="36" rx="6.4" fill="#dc322f" opacity="0.6" />
    <rect x="0" y="270" width="192" height="54" rx="6.4" fill="url(#scala-red)" />
    <rect x="0" y="288" width="192" height="36" rx="6.4" fill="#dc322f" opacity="0.6" />
    <rect x="0" y="180" width="192" height="54" rx="6.4" fill="url(#scala-red)" />
    <rect x="0" y="198" width="192" height="36" rx="6.4" fill="#dc322f" opacity="0.6" />
    <rect x="0" y="90" width="192" height="54" rx="6.4" fill="url(#scala-red)" />
    <rect x="0" y="108" width="192" height="36" rx="6.4" fill="#dc322f" opacity="0.6" />
  </g>
  <g font-family="monospace" font-size="22.4">
    <text x="480" y="180" fill="#e74c3c">val</text>
    <text x="528" y="180" fill="#3498db"> greeting</text>
    <text x="680" y="180" fill="white"> = </text>
    <text x="712" y="180" fill="#2ecc71">"Hello, Scala!"</text>
    <text x="480" y="252" fill="#e74c3c">def</text>
    <text x="528" y="252" fill="#3498db"> add</text>
    <text x="584" y="252" fill="white">(a: Int, b: Int): Int =</text>
    <text x="512" y="297" fill="#f39c12">  a + b</text>
    <text x="480" y="378" fill="#e74c3c">case class</text>
    <text x="632" y="378" fill="#3498db"> Person</text>
    <text x="736" y="378" fill="white">(name: String)</text>
    <text x="480" y="468" fill="#9b59b6">List</text>
    <text x="528" y="468" fill="white">(1, 2, 3)</text>
    <text x="480" y="513" fill="white">  .map(_ * 2)</text>
    <text x="480" y="558" fill="white">  .filter(_ &gt; 2)</text>
  </g>
  <rect x="992" y="540" width="224" height="90" rx="40" fill="none" stroke="#f39c12" stroke-width="3.2" />
  <text x="1104" y="594" text-anchor="middle" fill="#f39c12" font-family="Arial" font-size="25.6" font-weight="bold">JVM</text>
  <circle cx="1040" cy="216" r="64" fill="none" stroke="#9b59b6" stroke-width="3.2" />
  <text x="1040" y="207" text-anchor="middle" fill="#9b59b6" font-family="Arial" font-size="17.6">FP</text>
  <text x="1040" y="237.6" text-anchor="middle" fill="#9b59b6" font-family="Arial" font-size="16">functional</text>
  <circle cx="1152" cy="216" r="64" fill="none" stroke="#3498db" stroke-width="3.2" />
  <text x="1152" y="207" text-anchor="middle" fill="#3498db" font-family="Arial" font-size="17.6">OOP</text>
  <text x="1152" y="237.6" text-anchor="middle" fill="#3498db" font-family="Arial" font-size="16">objects</text>

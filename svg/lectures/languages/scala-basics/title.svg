<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <g transform="translate(100,80)">
    <rect x="40" y="330" width="180" height="43.5" rx="6" fill="url(#scala-red)"/>
    <rect x="40" y="344.5" width="180" height="29" rx="6" fill="url(#grad-danger)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="257.5" width="180" height="43.5" rx="6" fill="url(#scala-red)"/>
    <rect x="40" y="272" width="180" height="29" rx="6" fill="url(#grad-danger)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="185" width="180" height="43.5" rx="6" fill="url(#scala-red)"/>
    <rect x="40" y="199.5" width="180" height="29" rx="6" fill="url(#grad-danger)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="112.5" width="180" height="43.5" rx="6" fill="url(#scala-red)"/>
    <rect x="40" y="127" width="180" height="29" rx="6" fill="url(#grad-danger)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  </g>
  <g font-family="monospace" font-size="19.9111">
    <text x="490" y="185" fill="var(--danger-accent)" font-family="Arial, sans-serif">val</text>
    <text x="535" y="185" fill="var(--primary-accent)" font-family="Arial, sans-serif"> greeting</text>
    <text x="677.4999" y="185" fill="var(--bg)" font-family="Arial, sans-serif"> = </text>
    <text x="707.5" y="185" fill="var(--ok-accent)" font-family="Arial, sans-serif">"Hello, Scala!"</text>
    <text x="490" y="243" fill="var(--danger-accent)" font-family="Arial, sans-serif">def</text>
    <text x="535" y="243" fill="var(--primary-accent)" font-family="Arial, sans-serif"> add</text>
    <text x="587.5" y="243" fill="var(--bg)" font-family="Arial, sans-serif">(a: Int, b: Int): Int =</text>
    <text x="520" y="279.25" fill="var(--warn-accent)" font-family="Arial, sans-serif">  a + b</text>
    <text x="490" y="344.5" fill="var(--danger-accent)" font-family="Arial, sans-serif">case class</text>
    <text x="632.5" y="344.5" fill="var(--primary-accent)" font-family="Arial, sans-serif"> Person</text>
    <text x="730" y="344.5" fill="var(--bg)" font-family="Arial, sans-serif">(name: String)</text>
    <text x="490" y="417" fill="var(--info-accent)" font-family="Arial, sans-serif">List</text>
    <text x="535" y="417" fill="var(--bg)" font-family="Arial, sans-serif">(1, 2, 3)</text>
    <text x="490" y="453.25" fill="var(--bg)" font-family="Arial, sans-serif">  .map(_ * 2)</text>
    <text x="490" y="489.5" fill="var(--bg)" font-family="Arial, sans-serif">  .filter(_ &gt; 2)</text>
  </g>
  <rect x="970" y="475" width="210" height="72.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <text x="1074.9999" y="518.5" text-anchor="middle" fill="var(--warn-accent)" font-size="22.2471" font-weight="bold" font-family="Arial, sans-serif">JVM</text>
  <circle cx="1014.9999" cy="214" r="55.6178" fill="none" stroke="var(--info-border)" stroke-width="2.8444"/>
  <text x="1014.9999" y="206.75" text-anchor="middle" fill="var(--info-accent)" font-size="15.2948" font-family="Arial, sans-serif">FP</text>
  <text x="1014.9999" y="231.4" text-anchor="middle" fill="var(--info-accent)" font-size="13.9044" font-family="Arial, sans-serif">functional</text>
  <circle cx="1120" cy="214" r="55.6178" fill="none" stroke="var(--primary-border)" stroke-width="2.8444"/>
  <text x="1120" y="206.75" text-anchor="middle" fill="var(--primary-accent)" font-size="15.2948" font-family="Arial, sans-serif">OOP</text>
  <text x="1120" y="231.4" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Arial, sans-serif">objects</text>
</svg>

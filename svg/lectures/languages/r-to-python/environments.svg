<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="30.948314415128" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Toolchain Maps Across</text>

  <text x="230" y="93.211009174312" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">R World</text>
  <text x="1050" y="93.211009174312" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Python World</text>

  <rect x="40" y="114.495412844037" width="380" height="85.137614678899" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="165.577981651376" text-anchor="middle" font-size="24.758651532102" fill="var(--primary-text)" font-family="Arial, sans-serif">RStudio</text>
  <line x1="430" y1="157.064220183486" x2="850" y2="157.064220183486" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="860" y="114.495412844037" width="380" height="85.137614678899" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="165.577981651376" text-anchor="middle" font-size="22.695430571094" fill="var(--ok-text)" font-family="Arial, sans-serif">VS Code / PyCharm</text>

  <rect x="40" y="220.917431192661" width="380" height="85.137614678899" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="272" text-anchor="middle" font-size="24.758651532102" fill="var(--primary-text)" font-family="Arial, sans-serif">R console</text>
  <line x1="430" y1="263.48623853211" x2="850" y2="263.48623853211" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="860" y="220.917431192661" width="380" height="85.137614678899" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="272" text-anchor="middle" font-size="24.758651532102" fill="var(--ok-text)" font-family="Arial, sans-serif">python / IPython</text>

  <rect x="40" y="327.339449541284" width="380" height="85.137614678899" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="378.422018348624" text-anchor="middle" font-size="22.695430571094" fill="var(--primary-text)" font-family="Arial, sans-serif">R Markdown / Quarto</text>
  <line x1="430" y1="369.908256880734" x2="850" y2="369.908256880734" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="860" y="327.339449541284" width="380" height="85.137614678899" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="378.422018348624" text-anchor="middle" font-size="22.695430571094" fill="var(--ok-text)" font-family="Arial, sans-serif">Jupyter notebooks</text>

  <rect x="40" y="433.761467889908" width="380" height="85.137614678899" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="484.844036697248" text-anchor="middle" font-size="22.695430571094" fill="var(--primary-text)" font-family="Arial, sans-serif">.RData workspace</text>
  <line x1="430" y1="476.330275229358" x2="850" y2="476.330275229358" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="860" y="433.761467889908" width="380" height="85.137614678899" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="484.844036697248" text-anchor="middle" font-size="20.632209610085" fill="var(--ok-text)" font-family="Arial, sans-serif">pickle / parquet / CSV</text>

  <rect x="40" y="540.183486238532" width="1200" height="79.816513761468" rx="6.189662883026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="588.073394495413" text-anchor="middle" font-size="21.66382009059" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Prefer explicit files over invisible workspaces — reproducibility improves</text>
</svg>

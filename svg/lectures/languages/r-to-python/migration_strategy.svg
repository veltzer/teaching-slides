<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="30.948314415128" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A Four-Step Migration Path</text>

  <rect x="40" y="87.889908256881" width="270" height="244.770642201835" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175" y="141.100917431193" text-anchor="middle" font-size="26.821872493111" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Step 1</text>
  <text x="175" y="194.311926605505" text-anchor="middle" font-size="21.66382009059" fill="var(--primary-text)" font-family="Arial, sans-serif">Set up a venv</text>
  <text x="175" y="231.559633027523" text-anchor="middle" font-size="21.66382009059" fill="var(--primary-text)" font-family="Arial, sans-serif">Install pandas,</text>
  <text x="175" y="268.807339449541" text-anchor="middle" font-size="21.66382009059" fill="var(--primary-text)" font-family="Arial, sans-serif">NumPy, Jupyter</text>

  <line x1="315" y1="210.275229357798" x2="365" y2="210.275229357798" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="370" y="87.889908256881" width="270" height="244.770642201835" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="505" y="141.100917431193" text-anchor="middle" font-size="26.821872493111" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Step 2</text>
  <text x="505" y="194.311926605505" text-anchor="middle" font-size="21.66382009059" fill="var(--ok-text)" font-family="Arial, sans-serif">Port one real</text>
  <text x="505" y="231.559633027523" text-anchor="middle" font-size="21.66382009059" fill="var(--ok-text)" font-family="Arial, sans-serif">analysis end</text>
  <text x="505" y="268.807339449541" text-anchor="middle" font-size="21.66382009059" fill="var(--ok-text)" font-family="Arial, sans-serif">to end</text>

  <line x1="645" y1="210.275229357798" x2="695" y2="210.275229357798" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="87.889908256881" width="270" height="244.770642201835" rx="6.189662883026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="835" y="141.100917431193" text-anchor="middle" font-size="26.821872493111" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Step 3</text>
  <text x="835" y="194.311926605505" text-anchor="middle" font-size="21.66382009059" fill="var(--warn-text)" font-family="Arial, sans-serif">Learn the</text>
  <text x="835" y="231.559633027523" text-anchor="middle" font-size="21.66382009059" fill="var(--warn-text)" font-family="Arial, sans-serif">fit / predict</text>
  <text x="835" y="268.807339449541" text-anchor="middle" font-size="21.66382009059" fill="var(--warn-text)" font-family="Arial, sans-serif">pattern</text>

  <line x1="975" y1="210.275229357798" x2="1025" y2="210.275229357798" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1030" y="87.889908256881" width="210" height="244.770642201835" rx="6.189662883026" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="141.100917431193" text-anchor="middle" font-size="26.821872493111" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Step 4</text>
  <text x="1135" y="194.311926605505" text-anchor="middle" font-size="21.66382009059" fill="var(--info-text)" font-family="Arial, sans-serif">Keep R for</text>
  <text x="1135" y="231.559633027523" text-anchor="middle" font-size="21.66382009059" fill="var(--info-text)" font-family="Arial, sans-serif">interop until</text>
  <text x="1135" y="268.807339449541" text-anchor="middle" font-size="21.66382009059" fill="var(--info-text)" font-family="Arial, sans-serif">fluent</text>

  <rect x="40" y="364.587155963303" width="1200" height="117.064220183486" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="412.477064220184" text-anchor="middle" font-size="23.727041051598" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Do not rewrite everything at once</text>
  <text x="640" y="455.045871559633" text-anchor="middle" font-size="20.632209610085" fill="var(--text-muted)" font-family="Arial, sans-serif">Convert one pipeline stage at a time; validate results against the R version</text>

  <rect x="40" y="513.577981651376" width="1200" height="106.422018348624" rx="6.189662883026" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="556.146788990826" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Share data as parquet or feather, not RDS</text>
  <text x="640" y="595.522935779817" text-anchor="middle" font-size="19.600599129581" fill="var(--danger-text)" font-family="Arial, sans-serif">Both languages read these formats fast and losslessly</text>
</svg>

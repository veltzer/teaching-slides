<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="30.948314415128" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">What This Lecture Covers</text>

  <rect x="40" y="77.247706422018" width="285" height="159.633027522936" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="130.45871559633" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Language</text>
  <text x="182" y="167.706422018349" text-anchor="middle" font-size="19.600599129581" fill="var(--primary-text)" font-family="Arial, sans-serif">syntax, types</text>
  <text x="182" y="199.633027522936" text-anchor="middle" font-size="19.600599129581" fill="var(--primary-text)" font-family="Arial, sans-serif">indexing, scope</text>

  <rect x="345" y="77.247706422018" width="285" height="159.633027522936" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="130.45871559633" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Data</text>
  <text x="487" y="167.706422018349" text-anchor="middle" font-size="19.600599129581" fill="var(--ok-text)" font-family="Arial, sans-serif">vectors, frames</text>
  <text x="487" y="199.633027522936" text-anchor="middle" font-size="19.600599129581" fill="var(--ok-text)" font-family="Arial, sans-serif">NumPy, pandas</text>

  <rect x="650" y="77.247706422018" width="285" height="159.633027522936" rx="6.189662883026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="130.45871559633" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Libraries</text>
  <text x="792" y="167.706422018349" text-anchor="middle" font-size="19.600599129581" fill="var(--warn-text)" font-family="Arial, sans-serif">dplyr, ggplot2</text>
  <text x="792" y="199.633027522936" text-anchor="middle" font-size="19.600599129581" fill="var(--warn-text)" font-family="Arial, sans-serif">equivalents</text>

  <rect x="955" y="77.247706422018" width="285" height="159.633027522936" rx="6.189662883026" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="130.45871559633" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Modeling</text>
  <text x="1097" y="167.706422018349" text-anchor="middle" font-size="19.600599129581" fill="var(--info-text)" font-family="Arial, sans-serif">lm, caret</text>
  <text x="1097" y="199.633027522936" text-anchor="middle" font-size="19.600599129581" fill="var(--info-text)" font-family="Arial, sans-serif">sklearn, stats</text>

  <rect x="40" y="300.733944954128" width="580" height="159.633027522936" rx="6.189662883026" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="353.94495412844" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Gotchas and Pitfalls</text>
  <text x="330" y="391.192660550459" text-anchor="middle" font-size="19.600599129581" fill="var(--danger-text)" font-family="Arial, sans-serif">0-based indexing, mutability, copy vs view</text>
  <text x="330" y="423.119266055046" text-anchor="middle" font-size="19.600599129581" fill="var(--danger-text)" font-family="Arial, sans-serif">NA vs NaN vs None, integer division</text>

  <rect x="660" y="300.733944954128" width="580" height="159.633027522936" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="353.94495412844" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Migration and Interop</text>
  <text x="950" y="391.192660550459" text-anchor="middle" font-size="19.600599129581" fill="var(--primary-text)" font-family="Arial, sans-serif">virtual environments, one analysis first</text>
  <text x="950" y="423.119266055046" text-anchor="middle" font-size="19.600599129581" fill="var(--primary-text)" font-family="Arial, sans-serif">rpy2 / reticulate during transition</text>

  <rect x="40" y="513.577981651376" width="1200" height="106.422018348624" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="561.467889908257" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Goal: keep your R instincts, swap the syntax and libraries</text>
  <text x="640" y="598.715596330275" text-anchor="middle" font-size="19.600599129581" fill="var(--text-muted)" font-family="Arial, sans-serif">The ideas transfer directly — only the mechanics change</text>
</svg>

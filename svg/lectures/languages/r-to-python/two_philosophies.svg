<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="31.683531271721" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">R and Python: Two Philosophies</text>

  <rect x="40" y="84.615384615385" width="580" height="535.384615384615" rx="6.336706254344" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="145.961538461538" text-anchor="middle" font-size="31.683531271721" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">R</text>
  <text x="330" y="201.730769230769" text-anchor="middle" font-size="23.234589599262" fill="var(--primary-text)" font-family="Arial, sans-serif">Built by statisticians</text>
  <text x="330" y="251.923076923077" text-anchor="middle" font-size="23.234589599262" fill="var(--primary-text)" font-family="Arial, sans-serif">Vector-first design</text>
  <text x="330" y="302.115384615385" text-anchor="middle" font-size="23.234589599262" fill="var(--primary-text)" font-family="Arial, sans-serif">Data frames are builtin</text>
  <text x="330" y="352.307692307692" text-anchor="middle" font-size="23.234589599262" fill="var(--primary-text)" font-family="Arial, sans-serif">Copy-on-modify semantics</text>
  <text x="330" y="402.5" text-anchor="middle" font-size="23.234589599262" fill="var(--primary-text)" font-family="Arial, sans-serif">Many dialects (tidyverse)</text>
  <text x="330" y="452.692307692308" text-anchor="middle" font-size="23.234589599262" fill="var(--primary-text)" font-family="Arial, sans-serif">1-based indexing</text>
  <text x="330" y="502.884615384615" text-anchor="middle" font-size="23.234589599262" fill="var(--primary-text)" font-family="Arial, sans-serif">Formula interface (y ~ x)</text>
  <text x="330" y="569.807692307692" text-anchor="middle" font-size="21.122354181148" fill="var(--primary-text)" font-family="Arial, sans-serif">Optimized for interactive</text>
  <text x="330" y="601.038461538462" text-anchor="middle" font-size="21.122354181148" fill="var(--primary-text)" font-family="Arial, sans-serif">statistical analysis</text>

  <rect x="660" y="84.615384615385" width="580" height="535.384615384615" rx="6.336706254344" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="145.961538461538" text-anchor="middle" font-size="31.683531271721" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Python</text>
  <text x="950" y="201.730769230769" text-anchor="middle" font-size="23.234589599262" fill="var(--ok-text)" font-family="Arial, sans-serif">Built as general-purpose</text>
  <text x="950" y="251.923076923077" text-anchor="middle" font-size="23.234589599262" fill="var(--ok-text)" font-family="Arial, sans-serif">Object-first design</text>
  <text x="950" y="302.115384615385" text-anchor="middle" font-size="23.234589599262" fill="var(--ok-text)" font-family="Arial, sans-serif">Data frames via pandas</text>
  <text x="950" y="352.307692307692" text-anchor="middle" font-size="23.234589599262" fill="var(--ok-text)" font-family="Arial, sans-serif">Mutable, reference semantics</text>
  <text x="950" y="402.5" text-anchor="middle" font-size="23.234589599262" fill="var(--ok-text)" font-family="Arial, sans-serif">One obvious way</text>
  <text x="950" y="452.692307692308" text-anchor="middle" font-size="23.234589599262" fill="var(--ok-text)" font-family="Arial, sans-serif">0-based indexing</text>
  <text x="950" y="502.884615384615" text-anchor="middle" font-size="23.234589599262" fill="var(--ok-text)" font-family="Arial, sans-serif">Explicit method calls</text>
  <text x="950" y="569.807692307692" text-anchor="middle" font-size="21.122354181148" fill="var(--ok-text)" font-family="Arial, sans-serif">Optimized for building</text>
  <text x="950" y="601.038461538462" text-anchor="middle" font-size="21.122354181148" fill="var(--ok-text)" font-family="Arial, sans-serif">general software</text>
</svg>

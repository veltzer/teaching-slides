<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="31.930099436112" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Library Map</text>

  <rect x="40" y="68.3203125" width="360" height="62.3046875" rx="6.386019887222" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="110.234375" text-anchor="middle" font-size="23.415406253149" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">R package</text>
  <rect x="420" y="68.3203125" width="440" height="62.3046875" rx="6.386019887222" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="110.234375" text-anchor="middle" font-size="23.415406253149" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Python equivalent</text>
  <rect x="880" y="68.3203125" width="360" height="62.3046875" rx="6.386019887222" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="110.234375" text-anchor="middle" font-size="23.415406253149" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Purpose</text>

  <rect x="40" y="141.953125" width="360" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="186.1328125" font-size="22.351069605278" fill="var(--text)" font-family="Courier New, monospace">dplyr, data.table</text>
  <rect x="420" y="141.953125" width="440" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="440" y="186.1328125" font-size="22.351069605278" fill="var(--text)" font-family="Courier New, monospace">pandas, polars</text>
  <rect x="880" y="141.953125" width="360" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="900" y="186.1328125" font-size="21.286732957408" fill="var(--text)" font-family="Arial, sans-serif">data wrangling</text>

  <rect x="40" y="223.515625" width="360" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="267.6953125" font-size="22.351069605278" fill="var(--text)" font-family="Courier New, monospace">ggplot2</text>
  <rect x="420" y="223.515625" width="440" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="440" y="267.6953125" font-size="22.351069605278" fill="var(--text)" font-family="Courier New, monospace">matplotlib, seaborn</text>
  <rect x="880" y="223.515625" width="360" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="900" y="267.6953125" font-size="21.286732957408" fill="var(--text)" font-family="Arial, sans-serif">plotting</text>

  <rect x="40" y="305.078125" width="360" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="349.2578125" font-size="22.351069605278" fill="var(--text)" font-family="Courier New, monospace">lm, glm</text>
  <rect x="420" y="305.078125" width="440" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="440" y="349.2578125" font-size="22.351069605278" fill="var(--text)" font-family="Courier New, monospace">statsmodels</text>
  <rect x="880" y="305.078125" width="360" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="900" y="349.2578125" font-size="21.286732957408" fill="var(--text)" font-family="Arial, sans-serif">inferential stats</text>

  <rect x="40" y="386.640625" width="360" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="430.8203125" font-size="22.351069605278" fill="var(--text)" font-family="Courier New, monospace">caret, tidymodels</text>
  <rect x="420" y="386.640625" width="440" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="440" y="430.8203125" font-size="22.351069605278" fill="var(--text)" font-family="Courier New, monospace">scikit-learn</text>
  <rect x="880" y="386.640625" width="360" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="900" y="430.8203125" font-size="21.286732957408" fill="var(--text)" font-family="Arial, sans-serif">machine learning</text>

  <rect x="40" y="468.203125" width="360" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="512.3828125" font-size="22.351069605278" fill="var(--text)" font-family="Courier New, monospace">stringr, lubridate</text>
  <rect x="420" y="468.203125" width="440" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="440" y="512.3828125" font-size="22.351069605278" fill="var(--text)" font-family="Courier New, monospace">str methods, datetime</text>
  <rect x="880" y="468.203125" width="360" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="900" y="512.3828125" font-size="21.286732957408" fill="var(--text)" font-family="Arial, sans-serif">strings, dates</text>

  <rect x="40" y="549.765625" width="360" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="593.9453125" font-size="22.351069605278" fill="var(--text)" font-family="Courier New, monospace">shiny</text>
  <rect x="420" y="549.765625" width="440" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="440" y="593.9453125" font-size="22.351069605278" fill="var(--text)" font-family="Courier New, monospace">streamlit, dash</text>
  <rect x="880" y="549.765625" width="360" height="70.234375" rx="6.386019887222" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="900" y="593.9453125" font-size="21.286732957408" fill="var(--text)" font-family="Arial, sans-serif">interactive apps</text>
</svg>

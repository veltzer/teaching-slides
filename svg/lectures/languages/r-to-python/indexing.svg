<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="30.948314415128" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Indexing: The 1 vs 0 Trap</text>

  <text x="40" y="109.174311926606" font-size="24.758651532102" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">R: 1-based, end-inclusive</text>
  <rect x="40" y="130.45871559633" width="220" height="95.779816513761" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="188.990825688073" text-anchor="middle" font-size="30.948314415128" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">10</text>
  <text x="150" y="103.853211009174" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">1</text>
  <rect x="270" y="130.45871559633" width="220" height="95.779816513761" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="188.990825688073" text-anchor="middle" font-size="30.948314415128" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">20</text>
  <text x="380" y="103.853211009174" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">2</text>
  <rect x="500" y="130.45871559633" width="220" height="95.779816513761" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="188.990825688073" text-anchor="middle" font-size="30.948314415128" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">30</text>
  <text x="610" y="103.853211009174" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">3</text>
  <rect x="730" y="130.45871559633" width="220" height="95.779816513761" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="188.990825688073" text-anchor="middle" font-size="30.948314415128" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">40</text>
  <text x="840" y="103.853211009174" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">4</text>
  <rect x="960" y="130.45871559633" width="220" height="95.779816513761" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="188.990825688073" text-anchor="middle" font-size="30.948314415128" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">50</text>
  <text x="1070" y="103.853211009174" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">5</text>

  <text x="40" y="322.018348623853" font-size="24.758651532102" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Python: 0-based, end-exclusive</text>
  <rect x="40" y="343.302752293578" width="220" height="95.779816513761" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="401.834862385321" text-anchor="middle" font-size="30.948314415128" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">10</text>
  <text x="150" y="316.697247706422" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--ok-accent)" font-family="Courier New, monospace">0</text>
  <rect x="270" y="343.302752293578" width="220" height="95.779816513761" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="401.834862385321" text-anchor="middle" font-size="30.948314415128" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">20</text>
  <text x="380" y="316.697247706422" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--ok-accent)" font-family="Courier New, monospace">1</text>
  <rect x="500" y="343.302752293578" width="220" height="95.779816513761" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="401.834862385321" text-anchor="middle" font-size="30.948314415128" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">30</text>
  <text x="610" y="316.697247706422" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--ok-accent)" font-family="Courier New, monospace">2</text>
  <rect x="730" y="343.302752293578" width="220" height="95.779816513761" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="401.834862385321" text-anchor="middle" font-size="30.948314415128" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">40</text>
  <text x="840" y="316.697247706422" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--ok-accent)" font-family="Courier New, monospace">3</text>
  <rect x="960" y="343.302752293578" width="220" height="95.779816513761" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="401.834862385321" text-anchor="middle" font-size="30.948314415128" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">50</text>
  <text x="1070" y="316.697247706422" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--ok-accent)" font-family="Courier New, monospace">4</text>

  <rect x="40" y="481.651376146789" width="580" height="138.348623853211" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="330" y="524.220183486239" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Slices</text>
  <text x="330" y="564.660550458716" text-anchor="middle" font-size="20.632209610085" fill="var(--text)" font-family="Courier New, monospace">R  v[2:4] = 20 30 40</text>
  <text x="330" y="601.908256880734" text-anchor="middle" font-size="20.632209610085" fill="var(--text)" font-family="Courier New, monospace">Py v[1:4] = [20,30,40]</text>

  <rect x="660" y="481.651376146789" width="580" height="138.348623853211" rx="6.189662883026" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="524.220183486239" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Negative index differs!</text>
  <text x="950" y="564.660550458716" text-anchor="middle" font-size="20.632209610085" fill="var(--danger-text)" font-family="Courier New, monospace">R  v[-1] drops first</text>
  <text x="950" y="601.908256880734" text-anchor="middle" font-size="20.632209610085" fill="var(--danger-text)" font-family="Courier New, monospace">Py v[-1] is the last</text>
</svg>

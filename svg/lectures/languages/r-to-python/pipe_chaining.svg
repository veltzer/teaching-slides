<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="31.992646213852" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The Pipe Becomes Method Chaining</text>

  <text x="230" y="91.176470588235" text-anchor="middle" font-size="25.594116971082" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">R: %&gt;% pipe</text>
  <rect x="40" y="113.921568627451" width="380" height="79.607843137255" rx="6.39852924277" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="162.823529411765" text-anchor="middle" font-size="23.461273890158" fill="var(--primary-text)" font-family="Courier New, monospace">df</text>
  <line x1="230" y1="199.21568627451" x2="230" y2="244.705882352941" stroke="var(--primary-accent)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="40" y="256.078431372549" width="380" height="79.607843137255" rx="6.39852924277" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="304.980392156863" text-anchor="middle" font-size="21.328430809235" fill="var(--primary-text)" font-family="Courier New, monospace">filter(age &gt; 25)</text>
  <line x1="230" y1="341.372549019608" x2="230" y2="386.862745098039" stroke="var(--primary-accent)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="40" y="398.235294117647" width="380" height="79.607843137255" rx="6.39852924277" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="447.137254901961" text-anchor="middle" font-size="21.328430809235" fill="var(--primary-text)" font-family="Courier New, monospace">group_by(city)</text>
  <line x1="230" y1="483.529411764706" x2="230" y2="529.019607843137" stroke="var(--primary-accent)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="40" y="540.392156862745" width="380" height="79.607843137255" rx="6.39852924277" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="589.294117647059" text-anchor="middle" font-size="21.328430809235" fill="var(--primary-text)" font-family="Courier New, monospace">summarise(...)</text>

  <text x="1050" y="91.176470588235" text-anchor="middle" font-size="25.594116971082" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Python: .method()</text>
  <rect x="860" y="113.921568627451" width="380" height="79.607843137255" rx="6.39852924277" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="162.823529411765" text-anchor="middle" font-size="23.461273890158" fill="var(--ok-text)" font-family="Courier New, monospace">df</text>
  <line x1="1050" y1="199.21568627451" x2="1050" y2="244.705882352941" stroke="var(--ok-accent)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="860" y="256.078431372549" width="380" height="79.607843137255" rx="6.39852924277" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="304.980392156863" text-anchor="middle" font-size="21.328430809235" fill="var(--ok-text)" font-family="Courier New, monospace">[df.age &gt; 25]</text>
  <line x1="1050" y1="341.372549019608" x2="1050" y2="386.862745098039" stroke="var(--ok-accent)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="860" y="398.235294117647" width="380" height="79.607843137255" rx="6.39852924277" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="447.137254901961" text-anchor="middle" font-size="21.328430809235" fill="var(--ok-text)" font-family="Courier New, monospace">.groupby("city")</text>
  <line x1="1050" y1="483.529411764706" x2="1050" y2="529.019607843137" stroke="var(--ok-accent)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="860" y="540.392156862745" width="380" height="79.607843137255" rx="6.39852924277" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="589.294117647059" text-anchor="middle" font-size="21.328430809235" fill="var(--ok-text)" font-family="Courier New, monospace">.agg(...)</text>

  <rect x="470" y="267.450980392157" width="340" height="227.450980392157" rx="6.39852924277" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="318.627450980392" text-anchor="middle" font-size="23.461273890158" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Same idea</text>
  <text x="640" y="369.803921568627" text-anchor="middle" font-size="20.262009268773" fill="var(--text)" font-family="Arial, sans-serif">Chain steps, each</text>
  <text x="640" y="403.921568627451" text-anchor="middle" font-size="20.262009268773" fill="var(--text)" font-family="Arial, sans-serif">acting on the result</text>
  <text x="640" y="438.039215686274" text-anchor="middle" font-size="20.262009268773" fill="var(--text)" font-family="Arial, sans-serif">of the previous.</text>
  <text x="640" y="477.843137254902" text-anchor="middle" font-size="20.262009268773" fill="var(--text-muted)" font-family="Arial, sans-serif">Wrap in ( ) to break lines</text>
</svg>

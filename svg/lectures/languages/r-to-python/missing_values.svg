<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="30.948314415128" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Missing Values: One NA vs Three Nulls</text>

  <rect x="40" y="77.247706422018" width="560" height="244.770642201835" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="130.45871559633" text-anchor="middle" font-size="26.821872493111" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">R</text>
  <text x="320" y="183.669724770642" text-anchor="middle" font-size="22.695430571094" fill="var(--primary-text)" font-family="Arial, sans-serif">One first-class NA</text>
  <text x="320" y="226.238532110092" text-anchor="middle" font-size="22.695430571094" fill="var(--primary-text)" font-family="Arial, sans-serif">Woven into every op</text>
  <text x="320" y="268.807339449541" text-anchor="middle" font-size="20.632209610085" fill="var(--primary-text)" font-family="Courier New, monospace">mean(x, na.rm = TRUE)</text>
  <text x="320" y="306.05504587156" text-anchor="middle" font-size="20.632209610085" fill="var(--primary-text)" font-family="Courier New, monospace">is.na(x)</text>

  <rect x="680" y="77.247706422018" width="560" height="244.770642201835" rx="6.189662883026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="130.45871559633" text-anchor="middle" font-size="26.821872493111" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Python</text>
  <text x="960" y="178.348623853211" text-anchor="middle" font-size="21.66382009059" fill="var(--warn-text)" font-family="Courier New, monospace">None</text>
  <text x="960" y="210.275229357798" text-anchor="middle" font-size="18.568988649077" fill="var(--warn-text)" font-family="Arial, sans-serif">absence of a value</text>
  <text x="960" y="247.522935779817" text-anchor="middle" font-size="21.66382009059" fill="var(--warn-text)" font-family="Courier New, monospace">float('nan')</text>
  <text x="960" y="279.449541284404" text-anchor="middle" font-size="18.568988649077" fill="var(--warn-text)" font-family="Arial, sans-serif">numeric missing</text>
  <text x="960" y="313.504587155963" text-anchor="middle" font-size="21.66382009059" fill="var(--warn-text)" font-family="Courier New, monospace">pd.NA (pandas)</text>

  <rect x="40" y="353.94495412844" width="1200" height="117.064220183486" rx="6.189662883026" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="401.834862385321" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Trap: NaN is never equal to itself</text>
  <text x="640" y="444.403669724771" text-anchor="middle" font-size="21.66382009059" fill="var(--danger-text)" font-family="Courier New, monospace">nan == nan  is  False   →   use  pd.isna(x)</text>

  <rect x="40" y="502.935779816514" width="1200" height="117.064220183486" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="550.825688073395" text-anchor="middle" font-size="21.66382009059" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Good news: pandas skips NaN in mean() and sum() by default</text>
  <text x="640" y="591.266055045872" text-anchor="middle" font-size="19.600599129581" fill="var(--text-muted)" font-family="Arial, sans-serif">This mirrors R's na.rm = TRUE — but always test with real missing data</text>
</svg>

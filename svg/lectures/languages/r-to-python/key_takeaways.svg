<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="30.948314415128" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Takeaways</text>

  <rect x="40" y="77.247706422018" width="1200" height="122.385321100917" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="125.137614678899" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">The ideas transfer — only syntax and libraries change</text>
  <text x="640" y="170.899082568807" text-anchor="middle" font-size="20.632209610085" fill="var(--ok-text)" font-family="Arial, sans-serif">Your statistical thinking is fully portable to Python</text>

  <rect x="40" y="215.596330275229" width="1200" height="111.743119266055" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="260.293577981651" text-anchor="middle" font-size="23.727041051598" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">pandas + NumPy + scikit-learn cover most R workflows</text>
  <text x="640" y="303.926605504587" text-anchor="middle" font-size="20.632209610085" fill="var(--primary-text)" font-family="Arial, sans-serif">Add statsmodels when you need R-style inference and summaries</text>

  <rect x="40" y="343.302752293578" width="1200" height="111.743119266055" rx="6.189662883026" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="388" text-anchor="middle" font-size="23.727041051598" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Mind 0-based indexing and mutable, shared objects</text>
  <text x="640" y="431.633027522936" text-anchor="middle" font-size="20.632209610085" fill="var(--danger-text)" font-family="Arial, sans-serif">These two differences cause most early bugs</text>

  <rect x="40" y="471.009174311927" width="1200" height="111.743119266055" rx="6.189662883026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="515.706422018349" text-anchor="middle" font-size="23.727041051598" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Isolate projects with virtual environments from day one</text>
  <text x="640" y="559.339449541284" text-anchor="middle" font-size="20.632209610085" fill="var(--warn-text)" font-family="Arial, sans-serif">Keep R alive via rpy2 while you build fluency</text>

  <text x="640" y="620" text-anchor="middle" font-size="20.632209610085" font-style="italic" fill="var(--text-muted)" font-family="Arial, sans-serif">Port one real R script this week — that is how the shift sticks.</text>
</svg>

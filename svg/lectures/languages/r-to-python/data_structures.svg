<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="30.948314415128" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Structures: R to Python</text>

  <rect x="40" y="71.926605504587" width="290" height="244.770642201835" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="119.816513761468" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">vector c()</text>
  <text x="185" y="173.02752293578" text-anchor="middle" font-size="20.632209610085" fill="var(--primary-text)" font-family="Arial, sans-serif">homogeneous</text>
  <text x="185" y="210.275229357798" text-anchor="middle" font-size="20.632209610085" fill="var(--primary-text)" font-family="Arial, sans-serif">numeric block</text>
  <line x1="185" y1="236.880733944954" x2="185" y2="284.770642201835" stroke="var(--primary-text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="185" y="306.05504587156" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--primary-text)" font-family="Courier New, monospace">np.array</text>

  <rect x="345" y="71.926605504587" width="290" height="244.770642201835" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="119.816513761468" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">list()</text>
  <text x="490" y="173.02752293578" text-anchor="middle" font-size="20.632209610085" fill="var(--ok-text)" font-family="Arial, sans-serif">named, mixed</text>
  <text x="490" y="210.275229357798" text-anchor="middle" font-size="20.632209610085" fill="var(--ok-text)" font-family="Arial, sans-serif">key-value pairs</text>
  <line x1="490" y1="236.880733944954" x2="490" y2="284.770642201835" stroke="var(--ok-text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="306.05504587156" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--ok-text)" font-family="Courier New, monospace">dict</text>

  <rect x="650" y="71.926605504587" width="290" height="244.770642201835" rx="6.189662883026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="119.816513761468" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">unnamed list</text>
  <text x="795" y="173.02752293578" text-anchor="middle" font-size="20.632209610085" fill="var(--warn-text)" font-family="Arial, sans-serif">ordered, mixed</text>
  <text x="795" y="210.275229357798" text-anchor="middle" font-size="20.632209610085" fill="var(--warn-text)" font-family="Arial, sans-serif">by position</text>
  <line x1="795" y1="236.880733944954" x2="795" y2="284.770642201835" stroke="var(--warn-text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="306.05504587156" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--warn-text)" font-family="Courier New, monospace">list</text>

  <rect x="955" y="71.926605504587" width="285" height="244.770642201835" rx="6.189662883026" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="119.816513761468" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">factor</text>
  <text x="1097" y="173.02752293578" text-anchor="middle" font-size="20.632209610085" fill="var(--info-text)" font-family="Arial, sans-serif">categorical</text>
  <text x="1097" y="210.275229357798" text-anchor="middle" font-size="20.632209610085" fill="var(--info-text)" font-family="Arial, sans-serif">fixed levels</text>
  <line x1="1097" y1="236.880733944954" x2="1097" y2="284.770642201835" stroke="var(--info-text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1097" y="306.05504587156" text-anchor="middle" font-size="20.632209610085" font-weight="bold" fill="var(--info-text)" font-family="Courier New, monospace">Categorical</text>

  <rect x="40" y="348.623853211009" width="1200" height="127.706422018349" rx="6.189662883026" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="396.51376146789" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">data.frame  →  pandas.DataFrame</text>
  <text x="640" y="439.082568807339" text-anchor="middle" font-size="20.632209610085" fill="var(--danger-text)" font-family="Arial, sans-serif">The workhorse of both worlds — a table of typed columns</text>

  <rect x="40" y="508.256880733945" width="1200" height="111.743119266055" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="550.825688073395" text-anchor="middle" font-size="21.66382009059" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key shift: R uses one type (vector) for everything numeric</text>
  <text x="640" y="590.201834862385" text-anchor="middle" font-size="19.600599129581" fill="var(--text-muted)" font-family="Arial, sans-serif">Python separates list, dict, set, tuple, and NumPy array by purpose</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="31.236211911489" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Basic Types: R to Python</text>

  <rect x="40" y="67.102803738318" width="400" height="70.467289719626" rx="6.247242382298" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="112.635514018692" text-anchor="middle" font-size="24.988969529191" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">R type</text>
  <rect x="460" y="67.102803738318" width="380" height="70.467289719626" rx="6.247242382298" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="112.635514018692" text-anchor="middle" font-size="24.988969529191" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Python type</text>
  <rect x="860" y="67.102803738318" width="380" height="70.467289719626" rx="6.247242382298" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="112.635514018692" text-anchor="middle" font-size="24.988969529191" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Note</text>

  <rect x="40" y="148.411214953271" width="400" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="195.028037383178" font-size="22.906555401759" fill="var(--text)" font-family="Courier New, monospace">numeric</text>
  <rect x="460" y="148.411214953271" width="380" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="480" y="195.028037383178" font-size="22.906555401759" fill="var(--text)" font-family="Courier New, monospace">float</text>
  <rect x="860" y="148.411214953271" width="380" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="880" y="195.028037383178" font-size="20.824141274326" fill="var(--text)" font-family="Arial, sans-serif">double precision</text>

  <rect x="40" y="235.140186915888" width="400" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="281.757009345794" font-size="22.906555401759" fill="var(--text)" font-family="Courier New, monospace">integer (1L)</text>
  <rect x="460" y="235.140186915888" width="380" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="480" y="281.757009345794" font-size="22.906555401759" fill="var(--text)" font-family="Courier New, monospace">int</text>
  <rect x="860" y="235.140186915888" width="380" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="880" y="281.757009345794" font-size="20.824141274326" fill="var(--text)" font-family="Arial, sans-serif">arbitrary precision</text>

  <rect x="40" y="321.869158878505" width="400" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="368.485981308411" font-size="22.906555401759" fill="var(--text)" font-family="Courier New, monospace">character</text>
  <rect x="460" y="321.869158878505" width="380" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="480" y="368.485981308411" font-size="22.906555401759" fill="var(--text)" font-family="Courier New, monospace">str</text>
  <rect x="860" y="321.869158878505" width="380" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="880" y="368.485981308411" font-size="20.824141274326" fill="var(--text)" font-family="Arial, sans-serif">immutable text</text>

  <rect x="40" y="408.598130841121" width="400" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="455.214953271028" font-size="22.906555401759" fill="var(--text)" font-family="Courier New, monospace">logical</text>
  <rect x="460" y="408.598130841121" width="380" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="480" y="455.214953271028" font-size="22.906555401759" fill="var(--text)" font-family="Courier New, monospace">bool</text>
  <rect x="860" y="408.598130841121" width="380" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="880" y="455.214953271028" font-size="20.824141274326" fill="var(--text)" font-family="Arial, sans-serif">True / False</text>

  <rect x="40" y="495.327102803738" width="400" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="541.943925233645" font-size="22.906555401759" fill="var(--text)" font-family="Courier New, monospace">NULL / NA</text>
  <rect x="460" y="495.327102803738" width="380" height="75.88785046729" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="480" y="541.943925233645" font-size="22.906555401759" fill="var(--text)" font-family="Courier New, monospace">None / NaN</text>
  <rect x="860" y="495.327102803738" width="380" height="75.88785046729" rx="6.247242382298" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="541.943925233645" text-anchor="middle" font-size="20.824141274326" fill="var(--danger-text)" font-family="Arial, sans-serif">watch this closely</text>

  <text x="40" y="620" font-size="20.824141274326" fill="var(--text-muted)" font-family="Arial, sans-serif">R folds NA into every type; Python splits the idea across None, NaN, and pd.NA.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="30.948314415128" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Two Roads for Statistics and ML</text>

  <rect x="40" y="77.247706422018" width="580" height="255.412844036697" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="130.45871559633" text-anchor="middle" font-size="26.821872493111" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">statsmodels</text>
  <text x="330" y="178.348623853211" text-anchor="middle" font-size="21.66382009059" fill="var(--primary-text)" font-family="Arial, sans-serif">For inference, like R's lm</text>
  <text x="330" y="220.917431192661" text-anchor="middle" font-size="20.632209610085" fill="var(--primary-text)" font-family="Arial, sans-serif">Formula interface, p-values</text>
  <text x="330" y="263.48623853211" text-anchor="middle" font-size="20.632209610085" fill="var(--primary-text)" font-family="Arial, sans-serif">Rich summary() output</text>
  <text x="330" y="309.247706422018" text-anchor="middle" font-size="19.600599129581" fill="var(--primary-text)" font-family="Courier New, monospace">smf.ols("y ~ x", df)</text>

  <rect x="660" y="77.247706422018" width="580" height="255.412844036697" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="130.45871559633" text-anchor="middle" font-size="26.821872493111" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">scikit-learn</text>
  <text x="950" y="178.348623853211" text-anchor="middle" font-size="21.66382009059" fill="var(--ok-text)" font-family="Arial, sans-serif">For prediction, like caret</text>
  <text x="950" y="220.917431192661" text-anchor="middle" font-size="20.632209610085" fill="var(--ok-text)" font-family="Arial, sans-serif">Uniform fit / predict API</text>
  <text x="950" y="263.48623853211" text-anchor="middle" font-size="20.632209610085" fill="var(--ok-text)" font-family="Arial, sans-serif">Pipelines, cross-validation</text>
  <text x="950" y="309.247706422018" text-anchor="middle" font-size="19.600599129581" fill="var(--ok-text)" font-family="Courier New, monospace">model.fit(X, y)</text>

  <rect x="40" y="364.587155963303" width="1200" height="85.137614678899" rx="6.189662883026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="415.669724770642" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Rule of thumb: statsmodels to explain, scikit-learn to predict</text>

  <rect x="40" y="481.651376146789" width="380" height="138.348623853211" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="529.54128440367" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">The estimator API</text>
  <text x="230" y="568.917431192661" text-anchor="middle" font-size="19.600599129581" fill="var(--text)" font-family="Courier New, monospace">.fit()</text>
  <text x="230" y="601.908256880734" text-anchor="middle" font-size="19.600599129581" fill="var(--text)" font-family="Courier New, monospace">.predict()</text>

  <rect x="450" y="481.651376146789" width="380" height="138.348623853211" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="529.54128440367" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Deep learning</text>
  <text x="640" y="568.917431192661" text-anchor="middle" font-size="19.600599129581" fill="var(--text)" font-family="Arial, sans-serif">PyTorch, TensorFlow</text>
  <text x="640" y="601.908256880734" text-anchor="middle" font-size="19.600599129581" fill="var(--text-muted)" font-family="Arial, sans-serif">no real R equivalent</text>

  <rect x="860" y="481.651376146789" width="380" height="138.348623853211" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050" y="529.54128440367" text-anchor="middle" font-size="22.695430571094" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Time series</text>
  <text x="1050" y="568.917431192661" text-anchor="middle" font-size="19.600599129581" fill="var(--text)" font-family="Arial, sans-serif">statsmodels.tsa</text>
  <text x="1050" y="601.908256880734" text-anchor="middle" font-size="19.600599129581" fill="var(--text-muted)" font-family="Arial, sans-serif">ARIMA, seasonal</text>
</svg>

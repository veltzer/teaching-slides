<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="30.948314415128" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">data.frame Operations Map to pandas</text>

  <rect x="40" y="71.926605504587" width="560" height="58.532110091743" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="111.302752293578" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">R data.frame</text>
  <rect x="680" y="71.926605504587" width="560" height="58.532110091743" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="111.302752293578" text-anchor="middle" font-size="24.758651532102" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">pandas DataFrame</text>

  <rect x="40" y="146.422018348624" width="560" height="63.853211009174" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="186.862385321101" font-size="21.66382009059" fill="var(--text)" font-family="Courier New, monospace">df$age</text>
  <rect x="680" y="146.422018348624" width="560" height="63.853211009174" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="700" y="186.862385321101" font-size="21.66382009059" fill="var(--text)" font-family="Courier New, monospace">df["age"]</text>

  <rect x="40" y="220.917431192661" width="560" height="63.853211009174" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="261.357798165138" font-size="21.66382009059" fill="var(--text)" font-family="Courier New, monospace">nrow(df) / ncol(df)</text>
  <rect x="680" y="220.917431192661" width="560" height="63.853211009174" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="700" y="261.357798165138" font-size="21.66382009059" fill="var(--text)" font-family="Courier New, monospace">df.shape</text>

  <rect x="40" y="295.412844036697" width="560" height="63.853211009174" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="335.853211009174" font-size="21.66382009059" fill="var(--text)" font-family="Courier New, monospace">head(df)</text>
  <rect x="680" y="295.412844036697" width="560" height="63.853211009174" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="700" y="335.853211009174" font-size="21.66382009059" fill="var(--text)" font-family="Courier New, monospace">df.head()</text>

  <rect x="40" y="369.908256880734" width="560" height="63.853211009174" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="410.348623853211" font-size="21.66382009059" fill="var(--text)" font-family="Courier New, monospace">df[df$age &gt; 30, ]</text>
  <rect x="680" y="369.908256880734" width="560" height="63.853211009174" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="700" y="410.348623853211" font-size="21.66382009059" fill="var(--text)" font-family="Courier New, monospace">df[df["age"] &gt; 30]</text>

  <rect x="40" y="444.403669724771" width="560" height="63.853211009174" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="484.844036697248" font-size="21.66382009059" fill="var(--text)" font-family="Courier New, monospace">summary(df)</text>
  <rect x="680" y="444.403669724771" width="560" height="63.853211009174" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="700" y="484.844036697248" font-size="21.66382009059" fill="var(--text)" font-family="Courier New, monospace">df.describe()</text>

  <rect x="40" y="529.54128440367" width="1200" height="90.45871559633" rx="6.189662883026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="568.917431192661" text-anchor="middle" font-size="21.66382009059" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Row selection uses a boolean mask in both — but pandas needs no trailing comma</text>
  <text x="640" y="601.908256880734" text-anchor="middle" font-size="19.600599129581" fill="var(--warn-text)" font-family="Arial, sans-serif">Use .loc for labels and .iloc for integer positions to stay unambiguous</text>
</svg>

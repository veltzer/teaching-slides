<svg width="450" height="200" viewBox="0 0 450 200">
  <text x="225" y="30" text-anchor="middle" font-size="16" font-weight="bold">Node Splicing Benefits</text>

  <rect x="20" y="60" width="180" height="40" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5"/>
  <text x="110" y="85" text-anchor="middle" font-size="12" font-weight="bold">Traditional Copy</text>

  <rect x="250" y="60" width="180" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="340" y="85" text-anchor="middle" font-size="12" font-weight="bold">C++17 Splicing</text>

  <text x="110" y="130" text-anchor="middle" font-size="10">• Allocate new node</text>
  <text x="110" y="145" text-anchor="middle" font-size="10">• Copy construct</text>
  <text x="110" y="160" text-anchor="middle" font-size="10">• Deallocate old node</text>

  <text x="340" y="130" text-anchor="middle" font-size="10">• Move node pointer</text>
  <text x="340" y="145" text-anchor="middle" font-size="10">• No allocation</text>
  <text x="340" y="160" text-anchor="middle" font-size="10">• No copying</text>

  <path d="M 200 80 L 250 80" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="225" y="75" text-anchor="middle" font-size="10">faster!</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="51.3935" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Node Splicing Benefits</text>
  <rect x="40" y="173.8462" width="526.8293" height="178.4616" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="303.4147" y="285.3846" text-anchor="middle" font-size="38.5451" font-weight="bold" font-family="Arial, sans-serif" fill="var(--danger-text)">Traditional Copy</text>
  <rect x="713.1707" y="173.8462" width="526.8293" height="178.4616" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="976.5853" y="285.3846" text-anchor="middle" font-size="38.5451" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">C++17 Splicing</text>
  <text x="303.4147" y="486.154" text-anchor="middle" font-size="32.121" font-family="Arial, sans-serif" fill="var(--text)">• Allocate new node</text>
  <text x="303.4147" y="553.0771" text-anchor="middle" font-size="32.121" font-family="Arial, sans-serif" fill="var(--text)">• Copy construct</text>
  <text x="303.4147" y="620" text-anchor="middle" font-size="32.121" font-family="Arial, sans-serif" fill="var(--text)">• Deallocate old node</text>
  <text x="976.5853" y="486.154" text-anchor="middle" font-size="32.121" font-family="Arial, sans-serif" fill="var(--text)">• Move node pointer</text>
  <text x="976.5853" y="553.0771" text-anchor="middle" font-size="32.121" font-family="Arial, sans-serif" fill="var(--text)">• No allocation</text>
  <text x="976.5853" y="620" text-anchor="middle" font-size="32.121" font-family="Arial, sans-serif" fill="var(--text)">• No copying</text>
  <path d="M 566.8293 263.0769 L 713.1707 263.0769" stroke="var(--text-muted)" stroke-width="6.2704" marker-end="url(#arrow)"/>
  <text x="640" y="240.7693" text-anchor="middle" font-size="32.121" font-family="Arial, sans-serif" fill="var(--text)">faster!</text>
</svg>

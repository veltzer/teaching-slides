    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="86.4" text-anchor="middle" font-size="40.96" font-weight="bold">Performance Tips</text>
  <rect x="128" y="172.8" width="460.8" height="172.8" fill="#e8f5e8" stroke="#4caf50" stroke-width="5.12" rx="12.8" />
  <text x="358.4" y="244.8" text-anchor="middle" font-size="30.72" font-weight="bold">Fast ✓</text>
  <text x="358.4" y="288" text-anchor="middle" font-size="25.6">• string_view for parameters</text>
  <text x="358.4" y="331.2" text-anchor="middle" font-size="25.6">• Structured bindings</text>
  <rect x="691.2" y="172.8" width="460.8" height="172.8" fill="#ffebee" stroke="#f44336" stroke-width="5.12" rx="12.8" />
  <text x="921.6" y="244.8" text-anchor="middle" font-size="30.72" font-weight="bold">Potentially Slow ⚠</text>
  <text x="921.6" y="288" text-anchor="middle" font-size="25.6">• std::any (type erasure)</text>
  <text x="921.6" y="331.2" text-anchor="middle" font-size="25.6">• std::variant visits</text>
  <rect x="409.6" y="403.2" width="460.8" height="172.8" fill="#e3f2fd" stroke="#1976d2" stroke-width="5.12" rx="12.8" />
  <text x="640" y="475.2" text-anchor="middle" font-size="30.72" font-weight="bold">Zero-cost Abstractions</text>
  <text x="640" y="518.4" text-anchor="middle" font-size="25.6">• constexpr if</text>
  <text x="640" y="561.6" text-anchor="middle" font-size="25.6">• Template argument deduction</text>
</svg>
  <path d="M 327.7047 278.8236 L 493.0376 278.8236" stroke="var(--text-muted)" stroke-width="2.15" marker-end="url(#arrow)" />
  <path d="M 786.9624 278.8236 L 952.2953 278.8236" stroke="var(--text-muted)" stroke-width="2.15" marker-end="url(#arrow)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="43.727427" font-weight="bold"
        fill="var(--primary-accent)">std::variant&lt;int, string, double&gt;</text>

  <!-- Three type states -->
  <rect x="40" y="129.230769" width="300" height="267.692308" rx="15.3046"
        fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="251.923077" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="30.609199" font-weight="bold" fill="var(--primary-text)">holds</text>
  <text x="190" y="307.692308" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="48.10017" font-weight="bold" fill="var(--primary-text)">int</text>

  <rect x="490" y="129.230769" width="300" height="267.692308" rx="15.3046"
        fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="251.923077" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="30.609199" font-weight="bold" fill="var(--ok-text)">holds</text>
  <text x="640" y="307.692308" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="48.10017" font-weight="bold" fill="var(--ok-text)">string</text>

  <rect x="940" y="129.230769" width="300" height="267.692308" rx="15.3046"
        fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="251.923077" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="30.609199" font-weight="bold" fill="var(--warn-text)">holds</text>
  <text x="1090" y="307.692308" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="48.10017" font-weight="bold" fill="var(--warn-text)">double</text>

  <!-- Bidirectional transitions between adjacent states -->
  <path d="M 345.357143 229.615385 L 484.642857 229.615385" stroke="var(--text-muted)" stroke-width="2.5"
        marker-end="url(#arrow)"/>
  <path d="M 484.642857 296.538462 L 345.357143 296.538462" stroke="var(--text-muted)" stroke-width="2.5"
        marker-end="url(#arrow)"/>
  <path d="M 795.357143 229.615385 L 934.642857 229.615385" stroke="var(--text-muted)" stroke-width="2.5"
        marker-end="url(#arrow)"/>
  <path d="M 934.642857 296.538462 L 795.357143 296.538462" stroke="var(--text-muted)" stroke-width="2.5"
        marker-end="url(#arrow)"/>

  <text x="415" y="218.461538" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="17.490971" fill="var(--text-muted)">assign</text>
  <text x="865" y="218.461538" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="17.490971" fill="var(--text-muted)">assign</text>

  <text x="640" y="497.307692" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="34.981942" font-weight="bold" fill="var(--text)">Only one type active at a time</text>
  <text x="640" y="564.230769" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="26.236456" fill="var(--text-muted)">Type-safe access via std::get&lt;T&gt; or std::visit</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="21.863714" fill="var(--text-faint)">A wrong std::get throws std::bad_variant_access</text>
</svg>

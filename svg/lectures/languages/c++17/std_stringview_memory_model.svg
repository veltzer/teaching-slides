<svg width="500" height="200" viewBox="0 0 500 200">
  <text x="250" y="30" text-anchor="middle" font-size="16" font-weight="bold">std::string_view</text>

  <rect x="50" y="60" width="200" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="150" y="85" text-anchor="middle" font-size="12">Original String Data</text>

  <rect x="300" y="60" width="150" height="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <rect x="310" y="70" width="60" height="20" fill="#ffcdd2" stroke="#f44336" rx="2"/>
  <text x="340" y="83" text-anchor="middle" font-size="10">char* ptr</text>
  <rect x="380" y="70" width="60" height="20" fill="#fff3e0" stroke="#ff9800" rx="2"/>
  <text x="410" y="83" text-anchor="middle" font-size="10">size_t len</text>

  <path d="M 310 80 L 150 80" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <text x="230" y="75" text-anchor="middle" font-size="10">points to</text>

  <text x="250" y="140" text-anchor="middle" font-size="12">No ownership, no allocation</text>
  <text x="250" y="160" text-anchor="middle" font-size="10">Danger: Original data must outlive the view!</text>
</svg>

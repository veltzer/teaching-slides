<svg viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="80" y="93.75" width="407.2727" height="343.6364" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.1591" />
  <text x="283.6364" y="179.6591" text-anchor="middle" font-size="40.7272" font-weight="bold">tuple&lt;int, string, double&gt;</text>
  <text x="283.6364" y="244.0909" text-anchor="middle" font-size="33.9393">42</text>
  <text x="283.6364" y="308.5227" text-anchor="middle" font-size="33.9393">"hello"</text>
  <text x="283.6364" y="372.9545" text-anchor="middle" font-size="33.9393">3.14</text>
  <path d="M 487.2727 265.5682 L 690.9091 265.5682" stroke="var(--text-muted)" stroke-width="5.6889" marker-end="url(#arrow)" />
  <text x="589.0909" y="222.6136" text-anchor="middle" font-size="33.9393">decompose</text>
  <rect x="758.7879" y="93.75" width="203.6364" height="128.8636" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="7.1591" stroke-width="2"/>
  <text x="860.606" y="179.6591" text-anchor="middle" font-size="33.9393">id: 42</text>
  <rect x="758.7879" y="265.5682" width="203.6364" height="128.8636" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="7.1591" stroke-width="2"/>
  <text x="860.606" y="351.4773" text-anchor="middle" font-size="33.9393">name: "hello"</text>
  <rect x="758.7879" y="437.3864" width="203.6364" height="128.8636" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="7.1591" stroke-width="2"/>
  <text x="860.606" y="523.2954" text-anchor="middle" font-size="33.9393">value: 3.14</text>
  <text x="1200" y="179.6591" font-size="40.7272">auto [id, name, value]</text>
  <text x="1200" y="244.0909" font-size="40.7272">= getData();</text>
</svg>
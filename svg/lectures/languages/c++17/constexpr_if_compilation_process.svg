  <text x="264.9998" y="191.9048" text-anchor="middle" font-size="33.445">Template instantiation</text>
  <rect x="40" y="288.5716" width="1200" height="165.7142" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="343.8094" text-anchor="middle" font-size="33.445">if constexpr (condition)</text>
  <text x="640.0001" y="399.0476" text-anchor="middle" font-size="27.8708">Only true branch is compiled</text>
  <rect x="40" y="509.5238" width="450" height="110.4762" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="264.9998" y="578.5714" text-anchor="middle" font-size="33.445">Optimized code</text>
  <rect x="790" y="509.5238" width="450" height="110.4762" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1014.9998" y="578.5714" text-anchor="middle" font-size="33.445">Discarded branches</text>
  <path d="M 264.9998 233.3334 L 264.9998 288.5716" stroke="var(--text-muted)" stroke-width="1.4298" marker-end="url(#arrow)" />
  <path d="M 489.9997 371.4284 L 264.9998 509.5238" stroke="var(--ok-border)" stroke-width="1.4298" marker-end="url(#arrow)" />
  <path d="M 790 371.4284 L 1014.9998 509.5238" stroke="var(--danger-border)" stroke-width="1.4298" marker-end="url(#arrow)" />

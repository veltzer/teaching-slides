<svg viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="80" text-anchor="middle" font-size="38.0952" font-weight="bold">constexpr if at Compile Time</text>
  <rect x="132.0635" y="151.4286" width="380.9524" height="95.2381" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="8.9286" />
  <text x="322.5397" y="210.9524" text-anchor="middle" font-size="28.5714">Template instantiation</text>
  <rect x="132.0635" y="294.2857" width="1015.8731" height="142.8571" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="8.9286" />
  <text x="640.0001" y="341.9048" text-anchor="middle" font-size="28.5714">if constexpr (condition)</text>
  <text x="640.0001" y="389.5238" text-anchor="middle" font-size="23.8095">Only true branch is compiled</text>
  <rect x="132.0635" y="484.7619" width="380.9524" height="95.2381" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.9286" />
  <text x="322.5397" y="544.2857" text-anchor="middle" font-size="28.5714">Optimized code</text>
  <rect x="766.9842" y="484.7619" width="380.9524" height="95.2381" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="8.9286" />
  <text x="957.4603" y="544.2857" text-anchor="middle" font-size="28.5714">Discarded branches</text>
  <path d="M 322.5397 246.6667 L 322.5397 294.2857" stroke="var(--text-muted)" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 513.0158 365.7143 L 322.5397 484.7619" stroke="var(--ok-border)" stroke-width="3.2" marker-end="url(#arrow)" />
  <path d="M 766.9842 365.7143 L 957.4603 484.7619" stroke="var(--danger-border)" stroke-width="3.2" marker-end="url(#arrow)" />
</svg>
<svg width="500" height="300" viewBox="0 0 500 300">
  <text x="250" y="30" text-anchor="middle" font-size="16" font-weight="bold">constexpr if at Compile Time</text>

  <rect x="50" y="60" width="150" height="40" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="125" y="85" text-anchor="middle" font-size="12">Template instantiation</text>

  <rect x="50" y="120" width="400" height="60" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="5"/>
  <text x="250" y="140" text-anchor="middle" font-size="12">if constexpr (condition)</text>
  <text x="250" y="160" text-anchor="middle" font-size="10">Only true branch is compiled</text>

  <rect x="50" y="200" width="150" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="125" y="225" text-anchor="middle" font-size="12">Optimized code</text>

  <rect x="300" y="200" width="150" height="40" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5"/>
  <text x="375" y="225" text-anchor="middle" font-size="12">Discarded branches</text>

  <path d="M 125 100 L 125 120" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 200 150 L 125 200" stroke="#4caf50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 300 150 L 375 200" stroke="#f44336" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>

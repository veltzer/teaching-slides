<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="43.2148" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Adopting C++17</text>
  <rect x="40" y="115.6522" width="342.8571" height="100.8695" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="211.4284" y="178.6956" text-anchor="middle" font-size="32.4112" font-family="Arial, sans-serif" fill="var(--primary-text)">Phase 1</text>
  <rect x="468.5715" y="115.6522" width="342.8571" height="100.8695" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="639.9999" y="178.6956" text-anchor="middle" font-size="32.4112" font-family="Arial, sans-serif" fill="var(--ok-text)">Phase 2</text>
  <rect x="897.1429" y="115.6522" width="342.8571" height="100.8695" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1068.5716" y="178.6956" text-anchor="middle" font-size="32.4112" font-family="Arial, sans-serif" fill="var(--warn-text)">Phase 3</text>
  <text x="211.4284" y="279.5652" text-anchor="middle" font-size="27.0093" font-family="Arial, sans-serif" fill="var(--text)">• Update compiler</text>
  <text x="211.4284" y="317.3913" text-anchor="middle" font-size="27.0093" font-family="Arial, sans-serif" fill="var(--text)">• Enable C++17</text>
  <text x="211.4284" y="355.2174" text-anchor="middle" font-size="27.0093" font-family="Arial, sans-serif" fill="var(--text)">• Basic features</text>
  <text x="639.9999" y="279.5652" text-anchor="middle" font-size="27.0093" font-family="Arial, sans-serif" fill="var(--text)">• Replace patterns</text>
  <text x="639.9999" y="317.3913" text-anchor="middle" font-size="27.0093" font-family="Arial, sans-serif" fill="var(--text)">• Use std::optional</text>
  <text x="639.9999" y="355.2174" text-anchor="middle" font-size="27.0093" font-family="Arial, sans-serif" fill="var(--text)">• string_view</text>
  <text x="1068.5716" y="279.5652" text-anchor="middle" font-size="27.0093" font-family="Arial, sans-serif" fill="var(--text)">• Advanced features</text>
  <text x="1068.5716" y="317.3913" text-anchor="middle" font-size="27.0093" font-family="Arial, sans-serif" fill="var(--text)">• Parallel algorithms</text>
  <text x="1068.5716" y="355.2174" text-anchor="middle" font-size="27.0093" font-family="Arial, sans-serif" fill="var(--text)">• Template features</text>
  <path d="M 382.8571 166.087 L 468.5715 166.087" stroke="var(--text-muted)" stroke-width="2.1238" marker-end="url(#arrow)"/>
  <path d="M 811.4287 166.087 L 897.1429 166.087" stroke="var(--text-muted)" stroke-width="2.1238" marker-end="url(#arrow)"/>
  <rect x="40" y="418.2609" width="1200" height="201.7391" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="639.9999" y="481.3043" text-anchor="middle" font-size="37.813" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Best Practices</text>
  <text x="639.9999" y="531.7391" text-anchor="middle" font-size="27.0093" font-family="Arial, sans-serif" fill="var(--text)">• Start with safer features (optional, string_view)</text>
  <text x="639.9999" y="569.5652" text-anchor="middle" font-size="27.0093" font-family="Arial, sans-serif" fill="var(--text)">• Use structured bindings for readability</text>
  <text x="639.9999" y="607.3911" text-anchor="middle" font-size="27.0093" font-family="Arial, sans-serif" fill="var(--text)">• Leverage template argument deduction</text>
</svg>

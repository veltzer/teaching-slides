<svg viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="43.2148" font-weight="bold">Adopting C++17</text>
  <rect x="40" y="115.6522" width="342.8571" height="100.8695" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="211.4284" y="178.6956" text-anchor="middle" font-size="32.4112">Phase 1</text>
  <rect x="468.5715" y="115.6522" width="342.8571" height="100.8695" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="639.9999" y="178.6956" text-anchor="middle" font-size="32.4112">Phase 2</text>
  <rect x="897.1429" y="115.6522" width="342.8571" height="100.8695" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1068.5716" y="178.6956" text-anchor="middle" font-size="32.4112">Phase 3</text>
  <text x="211.4284" y="279.5652" text-anchor="middle" font-size="27.0093">• Update compiler</text>
  <text x="211.4284" y="317.3913" text-anchor="middle" font-size="27.0093">• Enable C++17</text>
  <text x="211.4284" y="355.2174" text-anchor="middle" font-size="27.0093">• Basic features</text>
  <text x="639.9999" y="279.5652" text-anchor="middle" font-size="27.0093">• Replace patterns</text>
  <text x="639.9999" y="317.3913" text-anchor="middle" font-size="27.0093">• Use std::optional</text>
  <text x="639.9999" y="355.2174" text-anchor="middle" font-size="27.0093">• string_view</text>
  <text x="1068.5716" y="279.5652" text-anchor="middle" font-size="27.0093">• Advanced features</text>
  <text x="1068.5716" y="317.3913" text-anchor="middle" font-size="27.0093">• Parallel algorithms</text>
  <text x="1068.5716" y="355.2174" text-anchor="middle" font-size="27.0093">• Template features</text>
  <path d="M 382.8571 166.087 L 468.5715 166.087" stroke="var(--text-muted)" stroke-width="2.1238" marker-end="url(#arrow)" />
  <path d="M 811.4287 166.087 L 897.1429 166.087" stroke="var(--text-muted)" stroke-width="2.1238" marker-end="url(#arrow)" />
  <rect x="40" y="418.2609" width="1200" height="201.7391" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="639.9999" y="481.3043" text-anchor="middle" font-size="37.813" font-weight="bold">Best Practices</text>
  <text x="639.9999" y="531.7391" text-anchor="middle" font-size="27.0093">• Start with safer features (optional, string_view)</text>
  <text x="639.9999" y="569.5652" text-anchor="middle" font-size="27.0093">• Use structured bindings for readability</text>
  <text x="639.9999" y="607.3911" text-anchor="middle" font-size="27.0093">• Leverage template argument deduction</text>
</svg>
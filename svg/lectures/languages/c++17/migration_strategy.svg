  <text x="491.5769" y="61.4471" text-anchor="middle" font-size="26.7161" font-weight="bold">Adopting C++17</text>
  <rect x="145.2566" y="111.5399" width="197.8973" height="66.7903" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.5362" rx="6" />
  <text x="244.2052" y="153.2838" text-anchor="middle" font-size="20.0371">Phase 1</text>
  <rect x="392.6283" y="111.5399" width="197.8973" height="66.7903" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.5362" rx="6" />
  <text x="491.5769" y="153.2838" text-anchor="middle" font-size="20.0371">Phase 2</text>
  <rect x="640" y="111.5399" width="197.8973" height="66.7903" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.5362" rx="6" />
  <text x="738.9487" y="153.2838" text-anchor="middle" font-size="20.0371">Phase 3</text>
  <text x="244.2052" y="220.0742" text-anchor="middle" font-size="16.6976">• Update compiler</text>
  <text x="244.2052" y="245.1206" text-anchor="middle" font-size="16.6976">• Enable C++17</text>
  <text x="244.2052" y="270.167" text-anchor="middle" font-size="16.6976">• Basic features</text>
  <text x="491.5769" y="220.0742" text-anchor="middle" font-size="16.6976">• Replace patterns</text>
  <text x="491.5769" y="245.1206" text-anchor="middle" font-size="16.6976">• Use std::optional</text>
  <text x="491.5769" y="270.167" text-anchor="middle" font-size="16.6976">• string_view</text>
  <text x="738.9487" y="220.0742" text-anchor="middle" font-size="16.6976">• Advanced features</text>
  <text x="738.9487" y="245.1206" text-anchor="middle" font-size="16.6976">• Parallel algorithms</text>
  <text x="738.9487" y="270.167" text-anchor="middle" font-size="16.6976">• Template features</text>
  <path d="M 343.1539 144.9351 L 392.6283 144.9351" stroke="var(--text-muted)" stroke-width="2.1238" marker-end="url(#arrow)" />
  <path d="M 590.5257 144.9351 L 640 144.9351" stroke="var(--text-muted)" stroke-width="2.1238" marker-end="url(#arrow)" />
  <rect x="145.2566" y="311.911" width="692.6407" height="133.5807" fill="var(--surface)" stroke="var(--border)" stroke-width="0.7681" rx="6" />
  <text x="491.5769" y="353.6549" text-anchor="middle" font-size="23.3766" font-weight="bold">Best Practices</text>
  <text x="491.5769" y="387.0501" text-anchor="middle" font-size="16.6976">• Start with safer features (optional, string_view)</text>
  <text x="491.5769" y="412.0965" text-anchor="middle" font-size="16.6976">• Use structured bindings for readability</text>
  <text x="491.5769" y="437.1428" text-anchor="middle" font-size="16.6976">• Leverage template argument deduction</text>
</svg>
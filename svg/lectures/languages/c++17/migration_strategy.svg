<svg width="450" height="300" viewBox="0 0 450 300">
  <text x="225" y="30" text-anchor="middle" font-size="16" font-weight="bold">Adopting C++17</text>

  <rect x="50" y="60" width="100" height="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="100" y="85" text-anchor="middle" font-size="12">Phase 1</text>

  <rect x="175" y="60" width="100" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="225" y="85" text-anchor="middle" font-size="12">Phase 2</text>

  <rect x="300" y="60" width="100" height="40" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="350" y="85" text-anchor="middle" font-size="12">Phase 3</text>

  <text x="100" y="125" text-anchor="middle" font-size="10">• Update compiler</text>
  <text x="100" y="140" text-anchor="middle" font-size="10">• Enable C++17</text>
  <text x="100" y="155" text-anchor="middle" font-size="10">• Basic features</text>

  <text x="225" y="125" text-anchor="middle" font-size="10">• Replace patterns</text>
  <text x="225" y="140" text-anchor="middle" font-size="10">• Use std::optional</text>
  <text x="225" y="155" text-anchor="middle" font-size="10">• string_view</text>

  <text x="350" y="125" text-anchor="middle" font-size="10">• Advanced features</text>
  <text x="350" y="140" text-anchor="middle" font-size="10">• Parallel algorithms</text>
  <text x="350" y="155" text-anchor="middle" font-size="10">• Template features</text>

  <path d="M 150 80 L 175 80" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 275 80 L 300 80" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="50" y="180" width="350" height="80" fill="#f8f9fa" stroke="#333" stroke-width="1" rx="5"/>
  <text x="225" y="205" text-anchor="middle" font-size="14" font-weight="bold">Best Practices</text>
  <text x="225" y="225" text-anchor="middle" font-size="10">• Start with safer features (optional, string_view)</text>
  <text x="225" y="240" text-anchor="middle" font-size="10">• Use structured bindings for readability</text>
  <text x="225" y="255" text-anchor="middle" font-size="10">• Leverage template argument deduction</text>
</svg>

<svg viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="480" y="54" text-anchor="middle" font-size="28.8" font-weight="bold">Adopting C++17</text>
  <rect x="106.6667" y="108" width="213.3333" height="72" fill="#e3f2fd" stroke="#1976d2" stroke-width="3.6" rx="9" />
  <text x="213.3333" y="153" text-anchor="middle" font-size="21.6">Phase 1</text>
  <rect x="373.3334" y="108" width="213.3333" height="72" fill="#e8f5e8" stroke="#4caf50" stroke-width="3.6" rx="9" />
  <text x="480" y="153" text-anchor="middle" font-size="21.6">Phase 2</text>
  <rect x="640" y="108" width="213.3333" height="72" fill="#fff3e0" stroke="#ff9800" stroke-width="3.6" rx="9" />
  <text x="746.6667" y="153" text-anchor="middle" font-size="21.6">Phase 3</text>
  <text x="213.3333" y="225" text-anchor="middle" font-size="18">• Update compiler</text>
  <text x="213.3333" y="252" text-anchor="middle" font-size="18">• Enable C++17</text>
  <text x="213.3333" y="279" text-anchor="middle" font-size="18">• Basic features</text>
  <text x="480" y="225" text-anchor="middle" font-size="18">• Replace patterns</text>
  <text x="480" y="252" text-anchor="middle" font-size="18">• Use std::optional</text>
  <text x="480" y="279" text-anchor="middle" font-size="18">• string_view</text>
  <text x="746.6667" y="225" text-anchor="middle" font-size="18">• Advanced features</text>
  <text x="746.6667" y="252" text-anchor="middle" font-size="18">• Parallel algorithms</text>
  <text x="746.6667" y="279" text-anchor="middle" font-size="18">• Template features</text>
  <path d="M 320 144 L 373.3334 144" stroke="#666" stroke-width="3.6" marker-end="url(#arrow)" />
  <path d="M 586.6667 144 L 640 144" stroke="#666" stroke-width="3.6" marker-end="url(#arrow)" />
  <rect x="106.6667" y="324" width="746.6667" height="144" fill="#f9f9f9" stroke="#333" stroke-width="1.8" rx="9" />
  <text x="480" y="369" text-anchor="middle" font-size="25.2" font-weight="bold">Best Practices</text>
  <text x="480" y="405" text-anchor="middle" font-size="18">• Start with safer features (optional, string_view)</text>
  <text x="480" y="432" text-anchor="middle" font-size="18">• Use structured bindings for readability</text>
  <text x="480" y="459" text-anchor="middle" font-size="18">• Leverage template argument deduction</text>
</svg>
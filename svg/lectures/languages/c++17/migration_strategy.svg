<svg viewBox="0 0 1280 720">
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Adopting C++17</text>
  <rect x="142.2222" y="144" width="284.4444" height="96" fill="#e3f2fd" stroke="#1976d2" stroke-width="4.8" rx="12" />
  <text x="284.4444" y="204" text-anchor="middle" font-size="28.8">Phase 1</text>

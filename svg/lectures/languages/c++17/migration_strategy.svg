  <rect x="853.3333" y="144" width="284.4444" height="96" fill="#fff3e0" stroke="#ff9800" stroke-width="4.8" rx="12" />
  <text x="995.5556" y="204" text-anchor="middle" font-size="28.8">Phase 3</text>
  <text x="284.4444" y="300" text-anchor="middle" font-size="24">• Update compiler</text>
  <text x="284.4444" y="336" text-anchor="middle" font-size="24">• Enable C++17</text>
  <text x="284.4444" y="372" text-anchor="middle" font-size="24">• Basic features</text>
  <text x="640" y="300" text-anchor="middle" font-size="24">• Replace patterns</text>
  <text x="640" y="336" text-anchor="middle" font-size="24">• Use std::optional</text>
  <text x="640" y="372" text-anchor="middle" font-size="24">• string_view</text>
  <text x="995.5556" y="300" text-anchor="middle" font-size="24">• Advanced features</text>
  <text x="995.5556" y="336" text-anchor="middle" font-size="24">• Parallel algorithms</text>
  <text x="995.5556" y="372" text-anchor="middle" font-size="24">• Template features</text>
  <path d="M 426.6667 192 L 497.7778 192" stroke="#666" stroke-width="4.8" marker-end="url(#arrowhead)" />
  <path d="M 782.2222 192 L 853.3333 192" stroke="#666" stroke-width="4.8" marker-end="url(#arrowhead)" />
  <rect x="142.2222" y="432" width="995.5556" height="192" fill="#f8f9fa" stroke="#333" stroke-width="2.4" rx="12" />
  <text x="640" y="492" text-anchor="middle" font-size="33.6" font-weight="bold">Best Practices</text>
  <text x="640" y="540" text-anchor="middle" font-size="24">• Start with safer features (optional, string_view)</text>
  <text x="640" y="576" text-anchor="middle" font-size="24">• Use structured bindings for readability</text>
  <text x="640" y="612" text-anchor="middle" font-size="24">• Leverage template argument deduction</text>

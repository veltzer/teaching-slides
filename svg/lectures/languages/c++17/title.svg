<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <g transform="translate(400,160)">
    <circle cx="40" cy="40" r="111.2355" fill="none" stroke="var(--primary-border)" stroke-width="5.6889"/>
    <text x="-12.5" y="69" fill="var(--primary-accent)" font-size="100.1119" font-weight="bold" font-family="Arial, sans-serif">C</text>
    <line x1="77.5001" y1="10.9999" x2="77.5001" y2="69" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="55.0001" y1="40" x2="100.0001" y2="40" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="122.5" y1="10.9999" x2="122.5" y2="69" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="100.0001" y1="40" x2="145.0001" y2="40" stroke="var(--primary-border)" stroke-width="2"/>
  </g>
  <g transform="translate(550,100)">
    <rect x="40" y="40" width="105.0001" height="65.25" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="92.5" y="87.8499" text-anchor="middle" fill="var(--bg)" font-size="41.7133" font-weight="bold" font-family="Arial, sans-serif">17</text>
  </g>
  <g transform="translate(120,120)">
    <rect x="40" y="40" width="60.0001" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <text x="69.9999" y="69" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Courier New, monospace">if</text>
    <text x="69.9999" y="112.5" text-anchor="middle" fill="var(--text-faint)" font-size="13.9044" font-family="Arial, sans-serif">constexpr</text>
  </g>
  <g transform="translate(120,190)">
    <rect x="40" y="40" width="60.0001" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <text x="69.9999" y="69" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Courier New, monospace">auto</text>
    <text x="69.9999" y="112.5" text-anchor="middle" fill="var(--text-faint)" font-size="13.9044" font-family="Arial, sans-serif">structured</text>
  </g>
  <g transform="translate(630,180)">
    <rect x="40" y="40" width="60.0001" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <text x="69.9999" y="69" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Courier New, monospace">opt</text>
    <text x="69.9999" y="112.5" text-anchor="middle" fill="var(--text-faint)" font-size="13.9044" font-family="Arial, sans-serif">optional</text>
  </g>
  <text x="640.0001" y="504" text-anchor="middle" fill="var(--surface)" font-size="44.4942" font-weight="bold" font-family="Arial, sans-serif">C++17 Features</text>
  <text x="640.0001" y="554.75" text-anchor="middle" fill="var(--text-faint)" font-size="22.2472" font-family="Arial, sans-serif">Modern C++ Language and Library Improvements</text>
</svg>

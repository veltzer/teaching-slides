<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <g transform="translate(195.0,68.2)">
  <g transform="translate(400,160)">
    <circle cx="40" cy="40" r="111.2355" fill="none" stroke="var(--primary-border)" stroke-width="5.6889"/>
    <text x="-12.5" y="69" fill="var(--primary-accent)" font-size="100.1119" font-weight="bold" font-family="Arial, sans-serif">C</text>
    <line x1="77.5001" y1="10.9999" x2="77.5001" y2="69" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="55.0001" y1="40" x2="100.0001" y2="40" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="122.5" y1="10.9999" x2="122.5" y2="69" stroke="var(--primary-border)" stroke-width="2"/>
    <line x1="100.0001" y1="40" x2="145.0001" y2="40" stroke="var(--primary-border)" stroke-width="2"/>
  </g>
  <g transform="translate(550,100)">
    <rect x="40" y="40" width="105.0001" height="65.25" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="92.5" y="87.8499" text-anchor="middle" fill="var(--bg)" font-size="41.7133" font-weight="bold" font-family="Arial, sans-serif">17</text>
  </g>
  <g transform="translate(120,120)">
    <rect x="40" y="40" width="60.0001" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <text x="69.9999" y="69" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Courier New, monospace">if</text>
    <text x="69.9999" y="112.5" text-anchor="middle" fill="var(--text-faint)" font-size="13.9044" font-family="Arial, sans-serif">constexpr</text>
  </g>
  <g transform="translate(120,190)">
    <rect x="40" y="40" width="60.0001" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <text x="69.9999" y="69" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Courier New, monospace">auto</text>
    <text x="69.9999" y="112.5" text-anchor="middle" fill="var(--text-faint)" font-size="13.9044" font-family="Arial, sans-serif">structured</text>
  </g>
  <g transform="translate(630,180)">
    <rect x="40" y="40" width="60.0001" height="43.5" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
    <text x="69.9999" y="69" text-anchor="middle" fill="var(--primary-accent)" font-size="13.9044" font-family="Courier New, monospace">opt</text>
    <text x="69.9999" y="112.5" text-anchor="middle" fill="var(--text-faint)" font-size="13.9044" font-family="Arial, sans-serif">optional</text>
  </g>
  <text x="640.0001" y="554.75" text-anchor="middle" fill="var(--text-faint)" font-size="22.2472" font-family="Arial, sans-serif">Modern C++ Language and Library Improvements</text>
  </g>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">C++17 Features</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Modern Language Features</text>
</svg>

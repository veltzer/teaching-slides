<svg viewBox="0 0 1280 720">
  <rect x="64" y="72" width="480" height="216" fill="#ffebee" stroke="#f44336" stroke-width="6.4" rx="16" />
  <text x="304" y="144" text-anchor="middle" font-size="38.4" font-weight="bold">Before C++17</text>
  <text x="304" y="198" text-anchor="middle" font-size="32">Explicit types required</text>
  <text x="304" y="252" text-anchor="middle" font-size="32">vector&lt;int&gt; v = {1,2,3}</text>
  <rect x="736" y="72" width="480" height="216" fill="#e8f5e8" stroke="#4caf50" stroke-width="6.4" rx="16" />
  <text x="976" y="144" text-anchor="middle" font-size="38.4" font-weight="bold">C++17</text>
  <text x="976" y="198" text-anchor="middle" font-size="32">Automatic deduction</text>
  <text x="976" y="252" text-anchor="middle" font-size="32">vector v = {1,2,3}</text>
  <path d="M 544 180 Q 640 108 736 180" stroke="#666" stroke-width="6.4" fill="none" marker-end="url(#arrowhead)" />
  <defs>
    <marker id="arrowhead" markerWidth="32" markerHeight="25.2" refX="28.8" refY="12.6" orient="auto">
      <polygon points="0,36 11.2,0" fill="#666" />
    </marker>
  </defs>
</svg>
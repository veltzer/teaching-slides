<svg viewBox="0 0 1280 720">
  <rect x="55.6522" y="62.6087" width="417.3913" height="187.8261" fill="#ffebee" stroke="#f44336" stroke-width="5.5652" rx="13.913" />
  <text x="264.3478" y="125.2174" text-anchor="middle" font-size="33.3913" font-weight="bold">Before C++17</text>
  <text x="264.3478" y="172.1739" text-anchor="middle" font-size="27.8261">Explicit types required</text>
  <text x="264.3478" y="219.1304" text-anchor="middle" font-size="27.8261">vector&lt;int&gt; v = {1,2,3}</text>
  <rect x="640" y="62.6087" width="417.3913" height="187.8261" fill="#e8f5e8" stroke="#4caf50" stroke-width="5.5652" rx="13.913" />
  <text x="848.6957" y="125.2174" text-anchor="middle" font-size="33.3913" font-weight="bold">C++17</text>
  <text x="848.6957" y="172.1739" text-anchor="middle" font-size="27.8261">Automatic deduction</text>
  <text x="848.6957" y="219.1304" text-anchor="middle" font-size="27.8261">vector v = {1,2,3}</text>
  <path d="M 473.0435 156.5217 Q 556.5217 93.913 640 156.5217" stroke="#666" stroke-width="5.5652" fill="none" marker-end="url(#arrow)" />
  <defs>

    <!-- Gradients -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <line x1="40" y1="340.357143" x2="1240" y2="340.357143" stroke="var(--text-muted)" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="40" y="40" width="280" height="580" rx="6.106203" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="122.857143" text-anchor="middle" font-size="48.849623" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">C++14</text>
  <text x="180" y="185" text-anchor="middle" font-size="36.637218" fill="var(--primary-text)" font-family="Arial, sans-serif">2014</text>
  <text x="180" y="257.5" text-anchor="middle" font-size="16.283208" fill="var(--primary-text)" font-family="Arial, sans-serif">generic lambdas</text>
  <text x="180" y="288.571429" text-anchor="middle" font-size="16.283208" fill="var(--primary-text)" font-family="Arial, sans-serif">auto return types</text>
  <text x="180" y="319.642857" text-anchor="middle" font-size="16.283208" fill="var(--primary-text)" font-family="Arial, sans-serif">variable templates</text>
  <text x="180" y="412.857143" text-anchor="middle" font-size="16.283208" fill="var(--primary-text)" font-family="Arial, sans-serif">relaxed constexpr</text>
  <text x="180" y="443.928571" text-anchor="middle" font-size="16.283208" fill="var(--primary-text)" font-family="Arial, sans-serif">binary literals</text>
  <text x="180" y="475" text-anchor="middle" font-size="16.283208" fill="var(--primary-text)" font-family="Arial, sans-serif">digit separators</text>

  <rect x="340" y="40" width="600" height="580" rx="6.106203" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="122.857143" text-anchor="middle" font-size="61.062029" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">C++17</text>
  <text x="640" y="185" text-anchor="middle" font-size="40.70802" fill="var(--warn-text)" font-family="Arial, sans-serif">2017</text>
  <text x="640" y="267.857143" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">structured bindings</text>
  <text x="640" y="298.928571" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">if constexpr</text>
  <text x="640" y="330" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">fold expressions</text>
  <text x="640" y="361.071429" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">std::optional, std::variant</text>
  <text x="640" y="392.142857" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">std::filesystem</text>
  <text x="640" y="423.214286" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">parallel algorithms</text>
  <text x="640" y="454.285714" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">std::string_view</text>
  <text x="640" y="485.357143" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">inline variables</text>
  <text x="640" y="516.428571" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">guaranteed copy elision</text>

  <rect x="960" y="40" width="280" height="580" rx="6.106203" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="122.857143" text-anchor="middle" font-size="48.849623" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">C++20</text>
  <text x="1100" y="185" text-anchor="middle" font-size="36.637218" fill="var(--danger-text)" font-family="Arial, sans-serif">2020</text>
  <text x="1100" y="257.5" text-anchor="middle" font-size="16.283208" fill="var(--danger-text)" font-family="Arial, sans-serif">concepts</text>
  <text x="1100" y="288.571429" text-anchor="middle" font-size="16.283208" fill="var(--danger-text)" font-family="Arial, sans-serif">ranges</text>
  <text x="1100" y="319.642857" text-anchor="middle" font-size="16.283208" fill="var(--danger-text)" font-family="Arial, sans-serif">coroutines</text>
  <text x="1100" y="412.857143" text-anchor="middle" font-size="16.283208" fill="var(--danger-text)" font-family="Arial, sans-serif">modules</text>
  <text x="1100" y="443.928571" text-anchor="middle" font-size="16.283208" fill="var(--danger-text)" font-family="Arial, sans-serif">spaceship operator</text>
  <text x="1100" y="475" text-anchor="middle" font-size="16.283208" fill="var(--danger-text)" font-family="Arial, sans-serif">std::format</text>
</svg>

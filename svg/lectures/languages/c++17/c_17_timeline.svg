<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <line x1="40" y1="340.357143" x2="1240" y2="340.357143" stroke="var(--text-muted)" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="40" y="40" width="280" height="580" rx="6.106203" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="122.857143" text-anchor="middle" font-size="48.849623" font-weight="bold" fill="var(--primary-text)">C++14</text>
  <text x="180" y="185" text-anchor="middle" font-size="36.637218" fill="var(--primary-text)">2014</text>
  <text x="180" y="257.5" text-anchor="middle" font-size="16.283208" fill="var(--primary-text)">generic lambdas</text>
  <text x="180" y="288.571429" text-anchor="middle" font-size="16.283208" fill="var(--primary-text)">auto return types</text>
  <text x="180" y="319.642857" text-anchor="middle" font-size="16.283208" fill="var(--primary-text)">variable templates</text>
  <text x="180" y="412.857143" text-anchor="middle" font-size="16.283208" fill="var(--primary-text)">relaxed constexpr</text>
  <text x="180" y="443.928571" text-anchor="middle" font-size="16.283208" fill="var(--primary-text)">binary literals</text>
  <text x="180" y="475" text-anchor="middle" font-size="16.283208" fill="var(--primary-text)">digit separators</text>

  <rect x="340" y="40" width="600" height="580" rx="6.106203" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="122.857143" text-anchor="middle" font-size="61.062029" font-weight="bold" fill="var(--warn-text)">C++17</text>
  <text x="640" y="185" text-anchor="middle" font-size="40.70802" fill="var(--warn-text)">2017</text>
  <text x="640" y="267.857143" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">structured bindings</text>
  <text x="640" y="298.928571" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">if constexpr</text>
  <text x="640" y="330" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">fold expressions</text>
  <text x="640" y="361.071429" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">std::optional, std::variant</text>
  <text x="640" y="392.142857" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">std::filesystem</text>
  <text x="640" y="423.214286" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">parallel algorithms</text>
  <text x="640" y="454.285714" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">std::string_view</text>
  <text x="640" y="485.357143" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">inline variables</text>
  <text x="640" y="516.428571" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">guaranteed copy elision</text>

  <rect x="960" y="40" width="280" height="580" rx="6.106203" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="122.857143" text-anchor="middle" font-size="48.849623" font-weight="bold" fill="var(--danger-text)">C++20</text>
  <text x="1100" y="185" text-anchor="middle" font-size="36.637218" fill="var(--danger-text)">2020</text>
  <text x="1100" y="257.5" text-anchor="middle" font-size="16.283208" fill="var(--danger-text)">concepts</text>
  <text x="1100" y="288.571429" text-anchor="middle" font-size="16.283208" fill="var(--danger-text)">ranges</text>
  <text x="1100" y="319.642857" text-anchor="middle" font-size="16.283208" fill="var(--danger-text)">coroutines</text>
  <text x="1100" y="412.857143" text-anchor="middle" font-size="16.283208" fill="var(--danger-text)">modules</text>
  <text x="1100" y="443.928571" text-anchor="middle" font-size="16.283208" fill="var(--danger-text)">spaceship operator</text>
  <text x="1100" y="475" text-anchor="middle" font-size="16.283208" fill="var(--danger-text)">std::format</text>
</svg>

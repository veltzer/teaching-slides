<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="390" height="580" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="235" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="var(--primary-text)">Language</text>
  <text x="235" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">Syntax &amp; semantics</text>
  <text x="235" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">Type system</text>
  <text x="235" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">constexpr, lambdas</text>
  <text x="235" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">structured bindings</text>
  <text x="235" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">if-constexpr, fold</text>
  <text x="235" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-text)">class template args</text>

  <rect x="445" y="40" width="390" height="580" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="var(--danger-text)">Library</text>
  <text x="640" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">std::optional</text>
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">std::variant, any</text>
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">std::string_view</text>
  <text x="640" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">std::filesystem</text>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">parallel algorithms</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--danger-text)">shared_mutex</text>

  <rect x="850" y="40" width="390" height="580" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="var(--warn-text)">Practice</text>
  <text x="1045" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">Idioms, RAII</text>
  <text x="1045" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">Error handling</text>
  <text x="1045" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">Build systems</text>
  <text x="1045" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">Testing, fuzzing</text>
  <text x="1045" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">Sanitizers, tooling</text>
  <text x="1045" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-text)">Migration from C++11</text>
</svg>

<svg viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="38.4" font-weight="bold">Execution Policies</text>
  <rect x="128" y="144" width="307.2" height="144" fill="#ffebee" stroke="#f44336" stroke-width="4.8" rx="12" />
  <text x="281.6" y="204" text-anchor="middle" font-size="28.8" font-weight="bold">seq</text>
  <text x="281.6" y="240" text-anchor="middle" font-size="24">Sequential</text>
  <text x="281.6" y="276" text-anchor="middle" font-size="24">Single thread</text>
  <rect x="486.4" y="144" width="307.2" height="144" fill="#e8f5e8" stroke="#4caf50" stroke-width="4.8" rx="12" />
  <text x="640" y="204" text-anchor="middle" font-size="28.8" font-weight="bold">par</text>
  <text x="640" y="240" text-anchor="middle" font-size="24">Parallel</text>
  <text x="640" y="276" text-anchor="middle" font-size="24">Multiple threads</text>
  <rect x="844.8" y="144" width="307.2" height="144" fill="#e3f2fd" stroke="#1976d2" stroke-width="4.8" rx="12" />
  <text x="998.4" y="204" text-anchor="middle" font-size="28.8" font-weight="bold">par_unseq</text>
  <text x="998.4" y="240" text-anchor="middle" font-size="24">Parallel +</text>
  <text x="998.4" y="276" text-anchor="middle" font-size="24">Vectorized</text>
  <rect x="128" y="360" width="1024" height="96" fill="#fff3e0" stroke="#ff9800" stroke-width="4.8" rx="12" />
  <text x="640" y="420" text-anchor="middle" font-size="28.8">Choose based on data size and complexity</text>
  <text x="640" y="528" text-anchor="middle" font-size="28.8">Performance: seq &lt; par &lt; par_unseq</text>
  <text x="640" y="576" text-anchor="middle" font-size="24">(generally, but depends on workload)</text>
</svg>
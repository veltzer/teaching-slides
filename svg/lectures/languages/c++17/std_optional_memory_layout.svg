      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="108" text-anchor="middle" font-size="51.2" font-weight="bold">std::optional&lt;int&gt;</text>

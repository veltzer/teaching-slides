<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Input bar -->
  <rect x="20" y="20" width="1240" height="72" rx="8" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="40" y="64" font-family="monospace" font-size="22" fill="#a5d6a7">Input:  echo "hello world" &gt; output.txt</text>

  <!-- Step 1: Tokenize -->
  <rect x="20" y="110" width="1240" height="88" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="40" y="155" font-family="monospace" font-size="22" font-weight="bold" fill="#1565c0">Step 1: Tokenize</text>
  <text x="310" y="155" font-family="monospace" font-size="21" fill="#222">&#x2192;  [echo]  ["hello world"]  [&gt;]  [output.txt]</text>
  <text x="40" y="186" font-family="monospace" font-size="16" fill="#555">Split input into tokens by whitespace and operators</text>

  <!-- Step 2: Alias expansion -->
  <rect x="20" y="212" width="1240" height="88" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="40" y="257" font-family="monospace" font-size="22" font-weight="bold" fill="#1565c0">Step 2: Alias expansion</text>
  <text x="310" y="257" font-family="monospace" font-size="21" fill="#222">&#x2192;  echo is not an alias — no change</text>
  <text x="40" y="288" font-family="monospace" font-size="16" fill="#555">Replace alias names with their definition text</text>

  <!-- Step 3: Parameter / variable expansion -->
  <rect x="20" y="314" width="1240" height="88" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="40" y="359" font-family="monospace" font-size="22" font-weight="bold" fill="#1565c0">Step 3: Parameter expansion</text>
  <text x="310" y="359" font-family="monospace" font-size="21" fill="#222">&#x2192;  expand $VAR, $(cmd), $((math))</text>
  <text x="40" y="390" font-family="monospace" font-size="16" fill="#555">Substitute variable values and command substitutions</text>

  <!-- Step 4: Glob / pathname expansion -->
  <rect x="20" y="416" width="1240" height="88" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="40" y="461" font-family="monospace" font-size="22" font-weight="bold" fill="#1565c0">Step 4: Glob expansion</text>
  <text x="310" y="461" font-family="monospace" font-size="21" fill="#222">&#x2192;  *.txt expanded to matching filenames</text>
  <text x="40" y="492" font-family="monospace" font-size="16" fill="#555">Match patterns like *, ?, [...] against the filesystem</text>

  <!-- Step 5: Execute -->
  <rect x="20" y="518" width="1240" height="88" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="40" y="563" font-family="monospace" font-size="22" font-weight="bold" fill="#1565c0">Step 5: Execute</text>
  <text x="310" y="563" font-family="monospace" font-size="21" fill="#222">&#x2192;  run /usr/bin/echo with "hello world",  redirect stdout &#x2192; output.txt</text>
  <text x="40" y="594" font-family="monospace" font-size="16" fill="#555">Set up redirections, fork + exec, or invoke built-in</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="71.262807" rx="6.757139" fill="var(--code-bg)" />
  <text x="59.354839" y="83.549561" font-size="21.531173" fill="var(--ok-accent)" font-family="Courier New, monospace">Input:  echo "hello world" &gt; output.txt</text>
  <rect x="40" y="129.078509" width="1200" height="87.099" rx="6.757139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="59.354839" y="173.617763" font-size="21.531173" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">Step 1: Tokenize</text>
  <text x="320.645161" y="173.617763" font-size="20.552514" fill="var(--text)" font-family="Courier New, monospace">→  [echo]  ["hello world"]  [&gt;]  [output.txt]</text>
  <text x="59.354839" y="204.300333" font-size="15.658994" fill="var(--text-muted)" font-family="Courier New, monospace">Split input into tokens by whitespace and operators</text>
  <rect x="40" y="230.03407" width="1200" height="87.099" rx="6.757139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="59.354839" y="274.573325" font-size="21.531173" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">Step 2: Alias expansion</text>
  <text x="320.645161" y="274.573325" font-size="20.552514" fill="var(--text)" font-family="Courier New, monospace">→  echo is not an alias — no change</text>
  <text x="59.354839" y="305.256018" font-size="15.658994" fill="var(--text-muted)" font-family="Courier New, monospace">Replace alias names with their definition text</text>
  <rect x="40" y="330.989754" width="1200" height="87.099" rx="6.757139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="59.354839" y="375.529009" font-size="21.531173" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">Step 3: Parameter expansion</text>
  <text x="320.645161" y="375.529009" font-size="20.552514" fill="var(--text)" font-family="Courier New, monospace">→  expand $VAR, $(cmd), $((math))</text>
  <text x="59.354839" y="406.211702" font-size="15.658994" fill="var(--text-muted)" font-family="Courier New, monospace">Substitute variable values and command substitutions</text>
  <rect x="40" y="431.945439" width="1200" height="87.099" rx="6.757139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="59.354839" y="476.484693" font-size="21.531173" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">Step 4: Glob expansion</text>
  <text x="320.645161" y="476.484693" font-size="20.552514" fill="var(--text)" font-family="Courier New, monospace">→  *.txt expanded to matching filenames</text>
  <text x="59.354839" y="507.167263" font-size="15.658994" fill="var(--text-muted)" font-family="Courier New, monospace">Match patterns like *, ?, [...] against the filesystem</text>
  <rect x="40" y="532.901" width="1200" height="87.099" rx="6.757139" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="59.354839" y="577.440254" font-size="21.531173" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">Step 5: Execute</text>
  <text x="320.645161" y="577.440254" font-size="20.552514" fill="var(--text)" font-family="Courier New, monospace">→  run /usr/bin/echo with "hello world",  redirect stdout → output.txt</text>
  <text x="59.354839" y="608.122947" font-size="15.658994" fill="var(--text-muted)" font-family="Courier New, monospace">Set up redirections, fork + exec, or invoke built-in</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="71.262807" rx="6.757139" fill="var(--code-bg)" filter="url(#shadow)" />
  <text x="59.354839" y="83.549561" font-family="monospace" font-size="21.531173" fill="var(--ok-accent)">Input:  echo "hello world" &gt; output.txt</text>
  <rect x="40" y="129.078509" width="1200" height="87.099" rx="6.757139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="59.354839" y="173.617763" font-family="monospace" font-size="21.531173" font-weight="bold" fill="var(--primary-accent)">Step 1: Tokenize</text>
  <text x="320.645161" y="173.617763" font-family="monospace" font-size="20.552514" fill="var(--text)">→  [echo]  ["hello world"]  [&gt;]  [output.txt]</text>
  <text x="59.354839" y="204.300333" font-family="monospace" font-size="15.658994" fill="var(--text-muted)">Split input into tokens by whitespace and operators</text>
  <rect x="40" y="230.03407" width="1200" height="87.099" rx="6.757139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="59.354839" y="274.573325" font-family="monospace" font-size="21.531173" font-weight="bold" fill="var(--primary-accent)">Step 2: Alias expansion</text>
  <text x="320.645161" y="274.573325" font-family="monospace" font-size="20.552514" fill="var(--text)">→  echo is not an alias — no change</text>
  <text x="59.354839" y="305.256018" font-family="monospace" font-size="15.658994" fill="var(--text-muted)">Replace alias names with their definition text</text>
  <rect x="40" y="330.989754" width="1200" height="87.099" rx="6.757139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="59.354839" y="375.529009" font-family="monospace" font-size="21.531173" font-weight="bold" fill="var(--primary-accent)">Step 3: Parameter expansion</text>
  <text x="320.645161" y="375.529009" font-family="monospace" font-size="20.552514" fill="var(--text)">→  expand $VAR, $(cmd), $((math))</text>
  <text x="59.354839" y="406.211702" font-family="monospace" font-size="15.658994" fill="var(--text-muted)">Substitute variable values and command substitutions</text>
  <rect x="40" y="431.945439" width="1200" height="87.099" rx="6.757139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="59.354839" y="476.484693" font-family="monospace" font-size="21.531173" font-weight="bold" fill="var(--primary-accent)">Step 4: Glob expansion</text>
  <text x="320.645161" y="476.484693" font-family="monospace" font-size="20.552514" fill="var(--text)">→  *.txt expanded to matching filenames</text>
  <text x="59.354839" y="507.167263" font-family="monospace" font-size="15.658994" fill="var(--text-muted)">Match patterns like *, ?, [...] against the filesystem</text>
  <rect x="40" y="532.901" width="1200" height="87.099" rx="6.757139" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="59.354839" y="577.440254" font-family="monospace" font-size="21.531173" font-weight="bold" fill="var(--primary-accent)">Step 5: Execute</text>
  <text x="320.645161" y="577.440254" font-family="monospace" font-size="20.552514" fill="var(--text)">→  run /usr/bin/echo with "hello world",  redirect stdout → output.txt</text>
  <text x="59.354839" y="608.122947" font-family="monospace" font-size="15.658994" fill="var(--text-muted)">Set up redirections, fork + exec, or invoke built-in</text>
</svg>
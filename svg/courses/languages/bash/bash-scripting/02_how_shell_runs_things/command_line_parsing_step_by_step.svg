<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-3.5556%" y="-7.1111%" width="96%" height="110.2222%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="17.7778" y="17.7778" width="1102.2222" height="64" rx="7.1111" fill="#1a1a2e" filter="url(#shadow)" />
  <ns0:text x="35.5556" y="56.8889" font-family="monospace" font-size="19.5556" fill="#a5d6a7">Input:  echo "hello world" &gt; output.txt</ns0:text>
  <ns0:rect x="17.7778" y="97.7778" width="1102.2222" height="78.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="35.5556" y="137.7778" font-family="monospace" font-size="19.5556" font-weight="bold" fill="#1565c0">Step 1: Tokenize</ns0:text>
  <ns0:text x="275.5556" y="137.7778" font-family="monospace" font-size="18.6667" fill="#222">→  [echo]  ["hello world"]  [&gt;]  [output.txt]</ns0:text>
  <ns0:text x="35.5556" y="165.3333" font-family="monospace" font-size="14.2222" fill="#555">Split input into tokens by whitespace and operators</ns0:text>
  <ns0:rect x="17.7778" y="188.4444" width="1102.2222" height="78.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="35.5556" y="228.4444" font-family="monospace" font-size="19.5556" font-weight="bold" fill="#1565c0">Step 2: Alias expansion</ns0:text>
  <ns0:text x="275.5556" y="228.4444" font-family="monospace" font-size="18.6667" fill="#222">→  echo is not an alias — no change</ns0:text>
  <ns0:text x="35.5556" y="256" font-family="monospace" font-size="14.2222" fill="#555">Replace alias names with their definition text</ns0:text>
  <ns0:rect x="17.7778" y="279.1111" width="1102.2222" height="78.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="35.5556" y="319.1111" font-family="monospace" font-size="19.5556" font-weight="bold" fill="#1565c0">Step 3: Parameter expansion</ns0:text>
  <ns0:text x="275.5556" y="319.1111" font-family="monospace" font-size="18.6667" fill="#222">→  expand $VAR, $(cmd), $((math))</ns0:text>
  <ns0:text x="35.5556" y="346.6667" font-family="monospace" font-size="14.2222" fill="#555">Substitute variable values and command substitutions</ns0:text>
  <ns0:rect x="17.7778" y="369.7778" width="1102.2222" height="78.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="35.5556" y="409.7778" font-family="monospace" font-size="19.5556" font-weight="bold" fill="#1565c0">Step 4: Glob expansion</ns0:text>
  <ns0:text x="275.5556" y="409.7778" font-family="monospace" font-size="18.6667" fill="#222">→  *.txt expanded to matching filenames</ns0:text>
  <ns0:text x="35.5556" y="437.3333" font-family="monospace" font-size="14.2222" fill="#555">Match patterns like *, ?, [...] against the filesystem</ns0:text>
  <ns0:rect x="17.7778" y="460.4444" width="1102.2222" height="78.2222" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="35.5556" y="500.4444" font-family="monospace" font-size="19.5556" font-weight="bold" fill="#1565c0">Step 5: Execute</ns0:text>
  <ns0:text x="275.5556" y="500.4444" font-family="monospace" font-size="18.6667" fill="#222">→  run /usr/bin/echo with "hello world",  redirect stdout → output.txt</ns0:text>
  <ns0:text x="35.5556" y="528" font-family="monospace" font-size="14.2222" fill="#555">Set up redirections, fork + exec, or invoke built-in</ns0:text>
</ns0:svg>
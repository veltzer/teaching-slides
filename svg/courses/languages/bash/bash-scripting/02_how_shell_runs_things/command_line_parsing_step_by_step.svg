<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="20" y="22.5" width="1240" height="85.5" rx="8" fill="#333" stroke="#333" stroke-width="3" />
  <text x="40" y="76.5" font-family="monospace" font-size="26" fill="#a5d6a7">Input: echo "hello world" &gt; output.txt</text>
  <rect x="20" y="135" width="1240" height="101.25" rx="8" fill="#f0f4f8" stroke="#555" stroke-width="3" />
  <text x="40" y="175.5" font-family="monospace" font-size="24" font-weight="bold" fill="#1565c0">Step 1: Tokenize</text>
  <text x="320" y="175.5" font-family="monospace" font-size="24" fill="#222">→  [echo]  ["hello world"]  [&gt;]  [output.txt]</text>
  <rect x="20" y="258.75" width="1240" height="146.25" rx="8" fill="#f0f4f8" stroke="#555" stroke-width="3" />
  <text x="40" y="299.25" font-family="monospace" font-size="24" font-weight="bold" fill="#1565c0">Step 2: Identify</text>
  <text x="320" y="299.25" font-family="monospace" font-size="24" fill="#222">→  command:  echo</text>
  <text x="320" y="339.75" font-family="monospace" font-size="24" fill="#222">   args:     "hello world"</text>
  <text x="320" y="380.25" font-family="monospace" font-size="24" fill="#222">   redirect: &gt; output.txt</text>
  <rect x="20" y="427.5" width="1240" height="101.25" rx="8" fill="#f0f4f8" stroke="#555" stroke-width="3" />
  <text x="40" y="468" font-family="monospace" font-size="24" font-weight="bold" fill="#1565c0">Step 3: Expand</text>
  <text x="320" y="468" font-family="monospace" font-size="24" fill="#555">→  no expansions needed</text>
  <rect x="20" y="551.25" width="1240" height="101.25" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" />
  <text x="40" y="591.75" font-family="monospace" font-size="24" font-weight="bold" fill="#1565c0">Step 4: Execute</text>
  <text x="320" y="591.75" font-family="monospace" font-size="24" fill="#222">→  run /usr/bin/echo with arg</text>
  <rect x="20" y="675" width="1240" height="101.25" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" />
  <text x="40" y="715.5" font-family="monospace" font-size="24" font-weight="bold" fill="#1565c0">Step 5: Redirect</text>
  <text x="320" y="715.5" font-family="monospace" font-size="24" fill="#222">→  send stdout to output.txt</text>
</svg>
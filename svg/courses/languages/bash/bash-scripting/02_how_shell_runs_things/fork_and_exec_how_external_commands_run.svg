<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="64.1667" width="468.7499" height="88.6111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="302.5" y="106.0556" font-family="monospace" font-size="24.3328" fill="var(--bg)" text-anchor="middle" font-weight="bold">Shell Process</text>
  <text x="302.5" y="136.6667" font-family="monospace" font-size="19.1186" fill="var(--primary-accent)" text-anchor="middle">(PID 100)</text>
  <line x1="302.5" y1="152.7777" x2="302.5" y2="201.1111" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="302.5" y1="201.1111" x2="752.5" y2="201.1111" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="752.5" y1="201.1111" x2="752.5" y2="249.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="499.375" y="193.0556" font-family="monospace" font-size="19.1186" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">fork()</text>
  <line x1="302.5" y1="201.1111" x2="302.5" y2="450.8333" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="518.125" y="249.4444" width="506.25" height="88.6111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="771.25" y="291.3333" font-family="monospace" font-size="22.5947" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Child Process</text>
  <text x="771.25" y="320.3333" font-family="monospace" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">(PID 101 — copy of shell)</text>
  <line x1="752.5" y1="338.0556" x2="752.5" y2="386.3889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="790" y="368.6667" font-family="monospace" font-size="17.3806" fill="var(--text-muted)">exec()</text>
  <rect x="518.125" y="386.3889" width="506.25" height="80.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="771.25" y="425.0556" font-family="monospace" font-size="19.1186" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">exec("/usr/bin/ls", ...)</text>
  <text x="771.25" y="452.4444" font-family="sans-serif" font-size="15.6425" fill="var(--text-muted)" text-anchor="middle">child image replaced by ls binary</text>
  <line x1="752.5" y1="466.9444" x2="752.5" y2="507.2223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="518.125" y="507.2223" width="506.25" height="56.3889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="771.25" y="541.8611" font-family="monospace" font-size="19.1186" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">ls runs and exits (status 0)</text>
  <rect x="68.125" y="450.8333" width="468.7499" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="302.5" y="489.5" font-family="monospace" font-size="19.1186" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">wait() — collect exit status</text>
  <line x1="302.5" y1="515.2777" x2="302.5" y2="547.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="68.125" y="547.5" width="468.7499" height="48.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="302.5" y="578.1111" font-family="monospace" font-size="17.3806" fill="var(--ok-accent)" text-anchor="middle">ready for next command</text>
</svg>
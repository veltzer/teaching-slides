<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="588.235169" height="96.666667" rx="7.020216" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="334.117647" y="85.696988" font-family="monospace" font-size="28.470251" fill="var(--bg)" text-anchor="middle" font-weight="bold">Shell Process</text>
  <text x="334.117647" y="119.090919" font-family="monospace" font-size="22.369449" fill="var(--primary-accent)" text-anchor="middle">(PID 100)</text>
  <line x1="334.117647" y1="136.666558" x2="334.117647" y2="189.39391" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="334.117647" y1="189.39391" x2="898.823529" y2="189.39391" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="898.823529" y1="189.39391" x2="898.823529" y2="242.121153" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="581.176471" y="180.60609" font-family="monospace" font-size="22.369449" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">fork()</text>
  <line x1="334.117647" y1="189.39391" x2="334.117647" y2="461.818162" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="604.705882" y="242.121153" width="635.294118" height="96.666667" rx="7.020216" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="922.352941" y="287.81814" font-family="monospace" font-size="26.436611" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Child Process</text>
  <text x="922.352941" y="319.454508" font-family="monospace" font-size="20.335927" fill="var(--text-muted)" text-anchor="middle">(PID 101 — copy of shell)</text>
  <line x1="898.823529" y1="338.787928" x2="898.823529" y2="391.515171" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="945.882353" y="372.18186" font-family="monospace" font-size="20.335927" fill="var(--text-muted)">exec()</text>
  <rect x="604.705882" y="391.515171" width="635.294118" height="87.878847" rx="7.020216" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="922.352941" y="433.697031" font-family="monospace" font-size="22.369449" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">exec("/usr/bin/ls", ...)</text>
  <text x="922.352941" y="463.575726" font-family="sans-serif" font-size="18.302287" fill="var(--text-muted)" text-anchor="middle">child image replaced by ls binary</text>
  <line x1="898.823529" y1="479.39391" x2="898.823529" y2="523.333442" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="604.705882" y="523.333442" width="635.294118" height="61.515171" rx="7.020216" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="922.352941" y="561.121229" font-family="monospace" font-size="22.369449" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">ls runs and exits (status 0)</text>
  <rect x="40" y="461.818162" width="588.235169" height="70.302991" rx="7.020216" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="334.117647" y="504.000022" font-family="monospace" font-size="22.369449" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">wait() — collect exit status</text>
  <line x1="334.117647" y1="532.121153" x2="334.117647" y2="567.272757" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="567.272757" width="588.235169" height="52.727243" rx="7.020216" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="334.117647" y="600.666688" font-family="monospace" font-size="20.335927" fill="var(--ok-accent)" text-anchor="middle">ready for next command</text>
</svg>
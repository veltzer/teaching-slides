<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.342871951533" font-weight="bold" fill="var(--primary-accent)">Alias Expansion</text>

  <!-- Flow pipeline -->
  <rect x="40" y="75.929203539823" width="220" height="82.12389380531" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="106.725663716814" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--bg)">Type</text>
  <text x="150" y="135.469026548673" text-anchor="middle" font-family="Courier New, monospace" font-size="18.237372889523" fill="var(--bg)">ll</text>
  <line x1="265" y1="116.991150442478" x2="305" y2="116.991150442478" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="75.929203539823" width="260" height="82.12389380531" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="106.725663716814" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--bg)">Alias Lookup</text>
  <text x="440" y="135.469026548673" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--bg)">ll -&gt; ls -la</text>
  <line x1="575" y1="116.991150442478" x2="615" y2="116.991150442478" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="75.929203539823" width="260" height="82.12389380531" rx="8.10549906201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="106.725663716814" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--bg)">Substituted</text>
  <text x="750" y="135.469026548673" text-anchor="middle" font-family="Courier New, monospace" font-size="16.21099812402" fill="var(--bg)">ls -la</text>
  <line x1="885" y1="116.991150442478" x2="925" y2="116.991150442478" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="930" y="75.929203539823" width="310" height="82.12389380531" rx="8.10549906201" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085" y="106.725663716814" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--bg)">Parsed + Executed</text>
  <text x="1085" y="135.469026548673" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--bg)">/bin/ls -la</text>

  <!-- Alias table -->
  <rect x="40" y="188.849557522124" width="570" height="277.16814159292" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325" y="219.646017699115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--bg)">Alias Table</text>
  <text x="150" y="260.70796460177" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">Name</text>
  <text x="420" y="260.70796460177" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">Value</text>
  <line x1="60" y1="270.973451327434" x2="590" y2="270.973451327434" stroke="var(--bg)" stroke-width="1"/>
  <text x="150" y="296.637168141593" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">ll</text>
  <text x="420" y="296.637168141593" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">ls -la</text>
  <text x="150" y="322.300884955752" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">gs</text>
  <text x="420" y="322.300884955752" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">git status</text>
  <text x="150" y="347.964601769912" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">..</text>
  <text x="420" y="347.964601769912" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">cd ..</text>
  <text x="150" y="373.628318584071" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">rm</text>
  <text x="420" y="373.628318584071" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">rm -i</text>
  <text x="325" y="440" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">alias name='value'  /  unalias</text>

  <!-- Behaviors -->
  <rect x="630" y="188.849557522124" width="610" height="82.12389380531" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="217.592920353982" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--bg)">Interactive only</text>
  <text x="650" y="250" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">shopt -s expand_aliases in scripts</text>

  <rect x="630" y="286.371681415929" width="610" height="82.12389380531" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="315.115044247788" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--bg)">Pure text substitution</text>
  <text x="650" y="345" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">ll -h /tmp -&gt; ls -la -h /tmp</text>

  <rect x="630" y="383.893805309735" width="610" height="82.12389380531" rx="8.10549906201" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="412.637168141593" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--bg)">No positional params</text>
  <text x="650" y="438.300884955752" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">BAD: alias bak='cp $1 $1.bak'</text>
  <text x="650" y="457.805309734513" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">OK: bak() { cp "$1" "$1.bak"; }</text>

  <!-- Permanent aliases -->
  <rect x="40" y="486.548672566372" width="1200" height="133.451327433628" rx="8.10549906201" fill="var(--code-bg)"/>
  <text x="640" y="517.345132743363" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--bg)">Make Permanent (~/.bashrc or ~/.bash_aliases)</text>
  <text x="70" y="553.274336283186" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--bg)">alias ll='ls -la'</text>
  <text x="420" y="553.274336283186" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--bg)">alias gs='git status'</text>
  <text x="800" y="553.274336283186" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--bg)">alias ..='cd ..'</text>
  <text x="70" y="584.070796460177" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--bg)">source ~/.bashrc</text>
  <text x="420" y="584.070796460177" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--bg)">Bypass: \ll  or  command ll</text>
</svg>

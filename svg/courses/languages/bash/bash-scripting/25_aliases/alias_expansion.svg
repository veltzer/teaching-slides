<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" x="40" y="40"/>

  <!-- Top flow: alias expansion pipeline -->
  <!-- Step 1: User types command -->
  <rect x="77.5" y="67.1875" width="196.875" height="72.5" rx="6" fill="var(--primary-accent)" filter="url(#shadow)"/>
  <text x="175.9375" y="96.1875" font-family="sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">User Types</text>
  <text x="175.9375" y="114.3125" font-family="monospace" font-size="16.5914" fill="var(--warn-accent)" text-anchor="middle">ll</text>
  <text x="175.9375" y="130.625" font-family="sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle">interactive shell</text>

  <!-- Arrow 1 -->
  <line x1="274.375" y1="103.4375" x2="330.625" y2="103.4375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Alias table lookup -->
  <rect x="330.625" y="67.1875" width="225" height="72.5" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="443.125" y="87.125" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Alias Table Lookup</text>
  <text x="443.125" y="105.25" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">ll → ls -la</text>
  <text x="443.125" y="121.5625" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">gs → git status</text>
  <text x="443.125" y="135.1562" font-family="monospace" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">(hash map in shell memory)</text>

  <!-- Arrow 2 -->
  <line x1="555.625" y1="103.4375" x2="621.25" y2="103.4375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="588.4375" y="96.1875" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">found!</text>

  <!-- Step 3: Substituted text -->
  <rect x="621.25" y="67.1875" width="196.875" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="719.6875" y="87.125" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Substituted Text</text>
  <text x="719.6875" y="107.9688" font-family="monospace" font-size="16.5914" fill="var(--ok-accent)" text-anchor="middle">ls -la</text>
  <text x="719.6875" y="130.625" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">+ any trailing args</text>

  <!-- Arrow 3 -->
  <line x1="818.125" y1="103.4375" x2="883.75" y2="103.4375" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <!-- Step 4: Parsed and executed -->
  <rect x="883.75" y="67.1875" width="196.875" height="72.5" rx="6" fill="var(--ok-accent)" filter="url(#shadow)"/>
  <text x="982.1875" y="89.8438" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)" text-anchor="middle">Parsed and</text>
  <text x="982.1875" y="106.1562" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)" text-anchor="middle">Executed</text>
  <text x="982.1875" y="130.625" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">runs /bin/ls -la .</text>

  <!-- NOT FOUND path from alias table -->
  <line x1="443.125" y1="139.6875" x2="443.125" y2="166.875" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="471.25" y="157.8125" font-family="sans-serif" font-size="10.1392" fill="var(--danger-accent)">not found</text>
  <rect x="368.125" y="166.875" width="150" height="32.625" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="443.125" y="187.7188" font-family="sans-serif" font-size="11.0609" fill="var(--danger-accent)" text-anchor="middle">use as-is (no expansion)</text>

  <!-- Middle section: alias table visual -->
  <rect x="77.5" y="221.25" width="450" height="253.75" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="77.5" y="221.25" width="450" height="39.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="77.5" y="250.25" width="450" height="10.875" fill="var(--primary-accent)" rx="6"/>
  <text x="302.5" y="248.4375" font-family="sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">Alias Table (in shell memory)</text>

  <!-- Table header -->
  <rect x="91.5625" y="272" width="187.5" height="25.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="297.8125" y="272" width="215.625" height="25.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185.3125" y="289.2188" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Alias Name</text>
  <text x="405.625" y="289.2188" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Expanded Value</text>

  <!-- Table rows -->
  <line x1="91.5625" y1="297.375" x2="508.75" y2="297.375" stroke="var(--border)" stroke-width="1"/>
  <text x="185.3125" y="315.5" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">ll</text>
  <text x="405.625" y="315.5" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">ls -la</text>
  <line x1="91.5625" y1="322.75" x2="508.75" y2="322.75" stroke="var(--surface)" stroke-width="1"/>
  <text x="185.3125" y="340.875" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">gs</text>
  <text x="405.625" y="340.875" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">git status</text>
  <line x1="91.5625" y1="348.125" x2="508.75" y2="348.125" stroke="var(--surface)" stroke-width="1"/>
  <text x="185.3125" y="366.25" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">..</text>
  <text x="405.625" y="366.25" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">cd ..</text>
  <line x1="91.5625" y1="373.5" x2="508.75" y2="373.5" stroke="var(--surface)" stroke-width="1"/>
  <text x="185.3125" y="391.625" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">rm</text>
  <text x="405.625" y="391.625" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">rm -i</text>
  <line x1="91.5625" y1="398.875" x2="508.75" y2="398.875" stroke="var(--surface)" stroke-width="1"/>
  <text x="185.3125" y="417" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">update</text>
  <text x="405.625" y="417" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">sudo apt update &amp;&amp; sudo apt upgrade</text>
  <line x1="91.5625" y1="424.25" x2="508.75" y2="424.25" stroke="var(--surface)" stroke-width="1"/>
  <text x="185.3125" y="442.375" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">topcpu</text>
  <text x="405.625" y="442.375" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">ps aux --sort=-%cpu | head -10</text>
  <line x1="91.5625" y1="449.625" x2="508.75" y2="449.625" stroke="var(--surface)" stroke-width="1"/>
  <text x="91.5625" y="467.75" font-family="sans-serif" font-size="10.1392" fill="var(--text-faint)">Defined with:  alias name='value'    Removed with:  unalias name</text>

  <!-- Right side: important behaviors -->
  <rect x="565" y="221.25" width="637.5" height="253.75" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="565" y="221.25" width="637.5" height="39.875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="565" y="250.25" width="637.5" height="10.875" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="883.75" y="248.4375" font-family="sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">Important Behaviors</text>

  <!-- Behavior 1: Interactive only -->
  <rect x="579.0625" y="272" width="609.375" height="61.625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="597.8125" y="291.9375" font-family="sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Interactive shells only (by default)</text>
  <text x="597.8125" y="310.0625" font-family="sans-serif" font-size="11.9827" fill="var(--text-muted)">Aliases are NOT expanded in scripts — use functions instead.</text>
  <text x="597.8125" y="325.4688" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">shopt -s expand_aliases  ← force in script (not recommended)</text>

  <!-- Behavior 2: Text substitution -->
  <rect x="579.0625" y="342.6875" width="609.375" height="61.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="597.8125" y="362.625" font-family="sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Pure text substitution — happens before parsing</text>
  <text x="597.8125" y="380.75" font-family="sans-serif" font-size="11.9827" fill="var(--text-muted)">ll -h /tmp   →   ls -la -h /tmp   (args appended after expansion)</text>
  <text x="597.8125" y="398.875" font-family="sans-serif" font-size="11.9827" fill="var(--text-muted)">Cannot inject args in the middle — use a function for that.</text>

  <!-- Behavior 3: Cannot take args in middle -->
  <rect x="579.0625" y="413.375" width="609.375" height="54.375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="597.8125" y="433.3125" font-family="sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">No $1, $2 inside alias definitions</text>
  <text x="597.8125" y="451.4375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">alias backup='cp $1 $1.bak'   ← WRONG ($1 is not alias param)</text>
  <text x="597.8125" y="464.125" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">backup() { cp "$1" "$1.bak"; }  ← RIGHT (use a function)</text>

  <!-- Bottom: persistent aliases -->
  <rect x="77.5" y="493.125" width="1125" height="99.6875" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <rect x="77.5" y="493.125" width="1125" height="34.4375" rx="6" fill="var(--ok-accent)"/>
  <rect x="77.5" y="516.6875" width="1125" height="10.875" fill="var(--ok-accent)" rx="6"/>
  <text x="640" y="515.7812" font-family="sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">Making Aliases Permanent — add to ~/.bashrc or ~/.bash_aliases</text>
  <text x="105.625" y="547.5" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># ~/.bash_aliases</text>
  <text x="105.625" y="563.8125" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">alias</text>
  <text x="141.25" y="563.8125" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> ll='ls -la'</text>
  <text x="311.875" y="563.8125" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">   alias</text>
  <text x="362.5" y="563.8125" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> gs='git status'</text>
  <text x="565" y="563.8125" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">   alias</text>
  <text x="615.625" y="563.8125" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> ..='cd ..'</text>
  <text x="105.625" y="581.9375" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Reload:   </text>
  <text x="199.375" y="581.9375" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">source</text>
  <text x="244.375" y="581.9375" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> ~/.bashrc</text>
  <text x="405.625" y="581.9375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">   # Bypass alias:   \ll   or   command ll</text>
</svg>

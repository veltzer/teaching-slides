<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- Top flow: alias expansion pipeline -->
  <!-- Step 1: User types command -->
  <rect x="40" y="40" width="210" height="80" rx="6.50941" fill="var(--primary-accent)"/>
  <text x="145" y="72" font-size="14.000004" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">User Types</text>
  <text x="145" y="92" font-size="18.000037" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">ll</text>
  <text x="145" y="110" font-size="11.000034" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">interactive shell</text>

  <!-- Arrow 1 -->
  <line x1="250" y1="80" x2="310" y2="80" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Alias table lookup -->
  <rect x="310" y="40" width="240" height="80" rx="6.50941" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="430" y="62" font-size="13.00005" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Alias Table Lookup</text>
  <text x="430" y="82" font-size="11.999988" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">ll → ls -la</text>
  <text x="430" y="100" font-size="11.999988" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">gs → git status</text>
  <text x="430" y="114.999945" font-size="11.000034" fill="var(--text-faint)" text-anchor="middle" font-family="Courier New, monospace">(hash map in shell memory)</text>

  <!-- Arrow 2 -->
  <line x1="550" y1="80" x2="620" y2="80" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="585" y="72" font-size="11.000034" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">found!</text>

  <!-- Step 3: Substituted text -->
  <rect x="620" y="40" width="210" height="80" rx="6.50941" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="725" y="62" font-size="13.00005" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">Substituted Text</text>
  <text x="725" y="85.000055" font-size="18.000037" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">ls -la</text>
  <text x="725" y="110" font-size="11.000034" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">+ any trailing args</text>

  <!-- Arrow 3 -->
  <line x1="830" y1="80" x2="900" y2="80" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <!-- Step 4: Parsed and executed -->
  <rect x="900" y="40" width="210" height="80" rx="6.50941" fill="var(--ok-accent)"/>
  <text x="1005" y="65.000055" font-size="13.00005" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Parsed and</text>
  <text x="1005" y="82.999945" font-size="13.00005" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Executed</text>
  <text x="1005" y="110" font-size="11.000034" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">runs /bin/ls -la .</text>

  <!-- NOT FOUND path from alias table -->
  <line x1="430" y1="120" x2="430" y2="150" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="460" y="140" font-size="11.000034" fill="var(--danger-accent)" font-family="Arial, sans-serif">not found</text>
  <rect x="350" y="150" width="160" height="36" rx="6.50941" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="173.000055" font-size="11.999988" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">use as-is (no expansion)</text>

  <!-- Middle section: alias table visual -->
  <rect x="40" y="210" width="480" height="280" rx="6.50941" fill="var(--bg)"/>
  <rect x="40" y="210" width="480" height="44" rx="6.50941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="242" width="480" height="12" fill="var(--primary-accent)" rx="6.50941"/>
  <text x="280" y="240" font-size="16.999974" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Alias Table (in shell memory)</text>

  <!-- Table header -->
  <rect x="55" y="266" width="200" height="28" rx="6.50941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="275" y="266" width="230" height="28" rx="6.50941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="285.000055" font-size="13.00005" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Alias Name</text>
  <text x="390" y="285.000055" font-size="13.00005" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Expanded Value</text>

  <!-- Table rows -->
  <line x1="55" y1="294" x2="500" y2="294" stroke="var(--border)" stroke-width="1"/>
  <text x="155" y="314" font-size="14.000004" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">ll</text>
  <text x="390" y="314" font-size="13.00005" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">ls -la</text>
  <line x1="55" y1="322" x2="500" y2="322" stroke="var(--surface)" stroke-width="1"/>
  <text x="155" y="342" font-size="14.000004" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">gs</text>
  <text x="390" y="342" font-size="13.00005" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">git status</text>
  <line x1="55" y1="350" x2="500" y2="350" stroke="var(--surface)" stroke-width="1"/>
  <text x="155" y="370" font-size="14.000004" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">..</text>
  <text x="390" y="370" font-size="13.00005" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">cd ..</text>
  <line x1="55" y1="378" x2="500" y2="378" stroke="var(--surface)" stroke-width="1"/>
  <text x="155" y="398" font-size="14.000004" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">rm</text>
  <text x="390" y="398" font-size="13.00005" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">rm -i</text>
  <line x1="55" y1="406" x2="500" y2="406" stroke="var(--surface)" stroke-width="1"/>
  <text x="155" y="426" font-size="14.000004" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">update</text>
  <text x="390" y="426" font-size="13.00005" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">sudo apt update &amp;&amp; sudo apt upgrade</text>
  <line x1="55" y1="434" x2="500" y2="434" stroke="var(--surface)" stroke-width="1"/>
  <text x="155" y="454" font-size="14.000004" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">topcpu</text>
  <text x="390" y="454" font-size="13.00005" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">ps aux --sort=-%cpu | head -10</text>
  <line x1="55" y1="462" x2="500" y2="462" stroke="var(--surface)" stroke-width="1"/>
  <text x="55" y="482" font-size="11.000034" fill="var(--text-faint)" font-family="Arial, sans-serif">Defined with:  alias name='value'    Removed with:  unalias name</text>

  <!-- Right side: important behaviors -->
  <rect x="560" y="210" width="680" height="280" rx="6.50941" fill="var(--bg)"/>
  <rect x="560" y="210" width="680" height="44" rx="6.50941" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="560" y="242" width="680" height="12" fill="url(#grad-warn)" rx="6.50941" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="240" font-size="16.999974" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Important Behaviors</text>

  <!-- Behavior 1: Interactive only -->
  <rect x="575" y="266" width="650" height="68" rx="6.50941" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="595" y="288" font-size="14.000004" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Interactive shells only (by default)</text>
  <text x="595" y="308" font-size="13.00005" fill="var(--text-muted)" font-family="Arial, sans-serif">Aliases are NOT expanded in scripts — use functions instead.</text>
  <text x="595" y="325.000055" font-size="11.999988" fill="var(--text-muted)" font-family="Courier New, monospace">shopt -s expand_aliases  ← force in script (not recommended)</text>

  <!-- Behavior 2: Text substitution -->
  <rect x="575" y="344" width="650" height="68" rx="6.50941" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="595" y="366" font-size="14.000004" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pure text substitution — happens before parsing</text>
  <text x="595" y="386" font-size="13.00005" fill="var(--text-muted)" font-family="Arial, sans-serif">ll -h /tmp   →   ls -la -h /tmp   (args appended after expansion)</text>
  <text x="595" y="406" font-size="13.00005" fill="var(--text-muted)" font-family="Arial, sans-serif">Cannot inject args in the middle — use a function for that.</text>

  <!-- Behavior 3: Cannot take args in middle -->
  <rect x="575" y="422" width="650" height="60" rx="6.50941" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="595" y="444" font-size="14.000004" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">No $1, $2 inside alias definitions</text>
  <text x="595" y="464" font-size="11.999988" fill="var(--text-muted)" font-family="Courier New, monospace">alias backup='cp $1 $1.bak'   ← WRONG ($1 is not alias param)</text>
  <text x="595" y="478" font-size="11.999988" fill="var(--ok-accent)" font-family="Courier New, monospace">backup() { cp "$1" "$1.bak"; }  ← RIGHT (use a function)</text>

  <!-- Bottom: persistent aliases -->
  <rect x="40" y="510" width="1200" height="110" rx="6.50941" fill="var(--code-bg)"/>
  <rect x="40" y="510" width="1200" height="38" rx="6.50941" fill="var(--ok-accent)"/>
  <rect x="40" y="536" width="1200" height="12" fill="var(--ok-accent)" rx="6.50941"/>
  <text x="640" y="534.999945" font-size="16.00002" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Making Aliases Permanent — add to ~/.bashrc or ~/.bash_aliases</text>
  <text x="70" y="570" font-size="13.00005" fill="var(--text-muted)" font-family="Courier New, monospace"># ~/.bash_aliases</text>
  <text x="70" y="588" font-size="13.00005" fill="var(--ok-accent)" font-family="Courier New, monospace">alias</text>
  <text x="108" y="588" font-size="13.00005" fill="var(--primary-accent)" font-family="Courier New, monospace"> ll='ls -la'</text>
  <text x="290" y="588" font-size="13.00005" fill="var(--ok-accent)" font-family="Courier New, monospace">   alias</text>
  <text x="344" y="588" font-size="13.00005" fill="var(--primary-accent)" font-family="Courier New, monospace"> gs='git status'</text>
  <text x="560" y="588" font-size="13.00005" fill="var(--ok-accent)" font-family="Courier New, monospace">   alias</text>
  <text x="614" y="588" font-size="13.00005" fill="var(--primary-accent)" font-family="Courier New, monospace"> ..='cd ..'</text>
  <text x="70" y="608" font-size="13.00005" fill="var(--text-muted)" font-family="Courier New, monospace"># Reload:   </text>
  <text x="170" y="608" font-size="13.00005" fill="var(--ok-accent)" font-family="Courier New, monospace">source</text>
  <text x="218" y="608" font-size="13.00005" fill="var(--primary-accent)" font-family="Courier New, monospace"> ~/.bashrc</text>
  <text x="390" y="608" font-size="11.999988" fill="var(--text-muted)" font-family="Courier New, monospace">   # Bypass alias:   \ll   or   command ll</text>
</svg>

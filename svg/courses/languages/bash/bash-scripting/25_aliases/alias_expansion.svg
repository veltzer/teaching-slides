<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Flow pipeline -->
  <rect x="40" y="40" width="220" height="87.547169811321" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="72.830188679245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" font-weight="bold" fill="var(--bg)">Type</text>
  <text x="150" y="103.471698113208" text-anchor="middle" font-family="Courier New, monospace" font-size="18.829923997081" fill="var(--bg)">ll</text>
  <line x1="265" y1="83.77358490566" x2="305" y2="83.77358490566" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="310" y="40" width="260" height="87.547169811321" rx="8.368855109814" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="72.830188679245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" font-weight="bold" fill="var(--bg)">Alias Lookup</text>
  <text x="440" y="103.471698113208" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--bg)">ll -&gt; ls -la</text>
  <line x1="575" y1="83.77358490566" x2="615" y2="83.77358490566" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="620" y="40" width="260" height="87.547169811321" rx="8.368855109814" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="72.830188679245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" font-weight="bold" fill="var(--bg)">Substituted</text>
  <text x="750" y="103.471698113208" text-anchor="middle" font-family="Courier New, monospace" font-size="16.737710219627" fill="var(--bg)">ls -la</text>
  <line x1="885" y1="83.77358490566" x2="925" y2="83.77358490566" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="930" y="40" width="310" height="87.547169811321" rx="8.368855109814" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085" y="72.830188679245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" font-weight="bold" fill="var(--bg)">Parsed + Executed</text>
  <text x="1085" y="103.471698113208" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--bg)">/bin/ls -la</text>

  <!-- Alias table -->
  <rect x="40" y="160.377358490566" width="570" height="295.471698113207" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325" y="193.207547169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--bg)">Alias Table</text>
  <text x="150" y="236.981132075472" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" font-weight="bold" fill="var(--bg)">Name</text>
  <text x="420" y="236.981132075472" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" font-weight="bold" fill="var(--bg)">Value</text>
  <line x1="60" y1="247.924528301887" x2="590" y2="247.924528301887" stroke="var(--bg)" stroke-width="1"/>
  <text x="150" y="275.283018867925" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">ll</text>
  <text x="420" y="275.283018867925" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">ls -la</text>
  <text x="150" y="302.641509433962" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">gs</text>
  <text x="420" y="302.641509433962" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">git status</text>
  <text x="150" y="330.000000000001" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">..</text>
  <text x="420" y="330.000000000001" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">cd ..</text>
  <text x="150" y="357.358490566038" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">rm</text>
  <text x="420" y="357.358490566038" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">rm -i</text>
  <text x="325" y="428.11320754717" text-anchor="middle" font-family="Courier New, monospace" font-size="13.422383445517" fill="var(--bg)">alias name='value'  /  unalias</text>

  <!-- Behaviors -->
  <rect x="630" y="160.377358490566" width="610" height="87.547169811321" rx="8.368855109814" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="191.018867924528" font-family="Arial, sans-serif" font-size="15.691603330901" font-weight="bold" fill="var(--bg)">Interactive only</text>
  <text x="650" y="225.566037735849" font-family="Courier New, monospace" font-size="12.389892411247" fill="var(--bg)">shopt -s expand_aliases in scripts</text>

  <rect x="630" y="264.339622641509" width="610" height="87.547169811321" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="294.981132075472" font-family="Arial, sans-serif" font-size="15.691603330901" font-weight="bold" fill="var(--bg)">Pure text substitution</text>
  <text x="650" y="326.839622641509" font-family="Courier New, monospace" font-size="13.422383445517" fill="var(--bg)">ll -h /tmp -&gt; ls -la -h /tmp</text>

  <rect x="630" y="368.301886792453" width="610" height="87.547169811321" rx="8.368855109814" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="398.943396226415" font-family="Arial, sans-serif" font-size="15.691603330901" font-weight="bold" fill="var(--bg)">No positional params</text>
  <text x="650" y="426.301886792453" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">BAD: alias bak='cp $1 $1.bak'</text>
  <text x="650" y="447.094339622641" font-family="Courier New, monospace" font-size="12.55328266472" fill="var(--bg)">OK: bak() { cp "$1" "$1.bak"; }</text>

  <!-- Permanent aliases -->
  <rect x="40" y="477.735849056604" width="1200" height="142.264150943396" rx="8.368855109814" fill="var(--code-bg)"/>
  <text x="640" y="510.566037735849" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--bg)">Make Permanent (~/.bashrc or ~/.bash_aliases)</text>
  <text x="70" y="548.867924528302" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--bg)">alias ll='ls -la'</text>
  <text x="420" y="548.867924528302" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--bg)">alias gs='git status'</text>
  <text x="800" y="548.867924528302" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--bg)">alias ..='cd ..'</text>
  <text x="70" y="581.698113207547" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--bg)">source ~/.bashrc</text>
  <text x="420" y="581.698113207547" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--bg)">Bypass: \ll  or  command ll</text>
</svg>

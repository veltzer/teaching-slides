<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--surface-light)"/>

  <!-- Top flow: alias expansion pipeline -->
  <!-- Step 1: User types command -->
  <rect x="40" y="30" width="210" height="80" rx="10" fill="var(--primary-dk)" filter="url(#shadow)"/>
  <text x="145" y="62" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">User Types</text>
  <text x="145" y="82" font-family="monospace" font-size="18" fill="var(--warn-lt)" text-anchor="middle">ll</text>
  <text x="145" y="100" font-family="sans-serif" font-size="11" fill="var(--primary-lt)" text-anchor="middle">interactive shell</text>

  <!-- Arrow 1 -->
  <line x1="250" y1="70" x2="310" y2="70" stroke="var(--primary)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Alias table lookup -->
  <rect x="310" y="30" width="240" height="80" rx="10" fill="var(--bg)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="52" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Alias Table Lookup</text>
  <text x="430" y="72" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">ll → ls -la</text>
  <text x="430" y="90" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">gs → git status</text>
  <text x="430" y="105" font-family="monospace" font-size="11" fill="var(--text-faint)" text-anchor="middle">(hash map in shell memory)</text>

  <!-- Arrow 2 -->
  <line x1="550" y1="70" x2="620" y2="70" stroke="var(--primary)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="585" y="62" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">found!</text>

  <!-- Step 3: Substituted text -->
  <rect x="620" y="30" width="210" height="80" rx="10" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="725" y="52" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Substituted Text</text>
  <text x="725" y="75" font-family="monospace" font-size="18" fill="var(--ok-deep)" text-anchor="middle">ls -la</text>
  <text x="725" y="100" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">+ any trailing args</text>

  <!-- Arrow 3 -->
  <line x1="830" y1="70" x2="900" y2="70" stroke="var(--ok-dk)" stroke-width="2.5" marker-end="url(#arrow-ok)"/>

  <!-- Step 4: Parsed and executed -->
  <rect x="900" y="30" width="210" height="80" rx="10" fill="var(--ok-dk)" filter="url(#shadow)"/>
  <text x="1005" y="55" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Parsed and</text>
  <text x="1005" y="73" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Executed</text>
  <text x="1005" y="100" font-family="monospace" font-size="11" fill="var(--ok-lt)" text-anchor="middle">runs /bin/ls -la .</text>

  <!-- NOT FOUND path from alias table -->
  <line x1="430" y1="110" x2="430" y2="140" stroke="var(--danger)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="460" y="130" font-family="sans-serif" font-size="11" fill="var(--danger)">not found</text>
  <rect x="350" y="140" width="160" height="36" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="430" y="163" font-family="sans-serif" font-size="12" fill="var(--danger)" text-anchor="middle">use as-is (no expansion)</text>

  <!-- Middle section: alias table visual -->
  <rect x="40" y="200" width="480" height="280" rx="12" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="40" y="200" width="480" height="44" rx="12" fill="url(#grad-primary)"/>
  <rect x="40" y="232" width="480" height="12" fill="var(--primary-dk)"/>
  <text x="280" y="230" font-family="sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">Alias Table (in shell memory)</text>

  <!-- Table header -->
  <rect x="55" y="256" width="200" height="28" rx="4" fill="var(--primary-pale)"/>
  <rect x="275" y="256" width="230" height="28" rx="4" fill="var(--primary-pale)"/>
  <text x="155" y="275" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Alias Name</text>
  <text x="390" y="275" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Expanded Value</text>

  <!-- Table rows -->
  <line x1="55" y1="284" x2="500" y2="284" stroke="var(--border)" stroke-width="1"/>
  <text x="155" y="304" font-family="monospace" font-size="14" fill="var(--primary)" text-anchor="middle">ll</text>
  <text x="390" y="304" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">ls -la</text>
  <line x1="55" y1="312" x2="500" y2="312" stroke="var(--surface-dark)" stroke-width="1"/>
  <text x="155" y="332" font-family="monospace" font-size="14" fill="var(--primary)" text-anchor="middle">gs</text>
  <text x="390" y="332" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">git status</text>
  <line x1="55" y1="340" x2="500" y2="340" stroke="var(--surface-dark)" stroke-width="1"/>
  <text x="155" y="360" font-family="monospace" font-size="14" fill="var(--primary)" text-anchor="middle">..</text>
  <text x="390" y="360" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">cd ..</text>
  <line x1="55" y1="368" x2="500" y2="368" stroke="var(--surface-dark)" stroke-width="1"/>
  <text x="155" y="388" font-family="monospace" font-size="14" fill="var(--primary)" text-anchor="middle">rm</text>
  <text x="390" y="388" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">rm -i</text>
  <line x1="55" y1="396" x2="500" y2="396" stroke="var(--surface-dark)" stroke-width="1"/>
  <text x="155" y="416" font-family="monospace" font-size="14" fill="var(--primary)" text-anchor="middle">update</text>
  <text x="390" y="416" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">sudo apt update &amp;&amp; sudo apt upgrade</text>
  <line x1="55" y1="424" x2="500" y2="424" stroke="var(--surface-dark)" stroke-width="1"/>
  <text x="155" y="444" font-family="monospace" font-size="14" fill="var(--primary)" text-anchor="middle">topcpu</text>
  <text x="390" y="444" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">ps aux --sort=-%cpu | head -10</text>
  <line x1="55" y1="452" x2="500" y2="452" stroke="var(--surface-dark)" stroke-width="1"/>
  <text x="55" y="472" font-family="sans-serif" font-size="11" fill="var(--text-faint)">Defined with:  alias name='value'    Removed with:  unalias name</text>

  <!-- Right side: important behaviors -->
  <rect x="560" y="200" width="680" height="280" rx="12" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="560" y="200" width="680" height="44" rx="12" fill="var(--warn-mid)"/>
  <rect x="560" y="232" width="680" height="12" fill="var(--warn-mid)"/>
  <text x="900" y="230" font-family="sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">Important Behaviors</text>

  <!-- Behavior 1: Interactive only -->
  <rect x="575" y="256" width="650" height="68" rx="8" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="1.5"/>
  <text x="595" y="278" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)">Interactive shells only (by default)</text>
  <text x="595" y="298" font-family="sans-serif" font-size="13" fill="var(--text-muted)">Aliases are NOT expanded in scripts — use functions instead.</text>
  <text x="595" y="315" font-family="monospace" font-size="12" fill="var(--text-muted)">shopt -s expand_aliases  ← force in script (not recommended)</text>

  <!-- Behavior 2: Text substitution -->
  <rect x="575" y="334" width="650" height="68" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="595" y="356" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">Pure text substitution — happens before parsing</text>
  <text x="595" y="376" font-family="sans-serif" font-size="13" fill="var(--text-muted)">ll -h /tmp   →   ls -la -h /tmp   (args appended after expansion)</text>
  <text x="595" y="396" font-family="sans-serif" font-size="13" fill="var(--text-muted)">Cannot inject args in the middle — use a function for that.</text>

  <!-- Behavior 3: Cannot take args in middle -->
  <rect x="575" y="412" width="650" height="60" rx="8" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="595" y="434" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--danger)">No $1, $2 inside alias definitions</text>
  <text x="595" y="454" font-family="monospace" font-size="12" fill="var(--text-muted)">alias backup='cp $1 $1.bak'   ← WRONG ($1 is not alias param)</text>
  <text x="595" y="468" font-family="monospace" font-size="12" fill="var(--ok-dk)">backup() { cp "$1" "$1.bak"; }  ← RIGHT (use a function)</text>

  <!-- Bottom: persistent aliases -->
  <rect x="40" y="500" width="1200" height="110" rx="12" fill="var(--code-bg)" filter="url(#shadow)"/>
  <rect x="40" y="500" width="1200" height="38" rx="12" fill="var(--ok-dk)"/>
  <rect x="40" y="526" width="1200" height="12" fill="var(--ok-dk)"/>
  <text x="640" y="525" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Making Aliases Permanent — add to ~/.bashrc or ~/.bash_aliases</text>
  <text x="70" y="560" font-family="monospace" font-size="13" fill="var(--text-mid)"># ~/.bash_aliases</text>
  <text x="70" y="578" font-family="monospace" font-size="13" fill="var(--ok-tint)">alias</text>
  <text x="108" y="578" font-family="monospace" font-size="13" fill="var(--primary-lt)"> ll='ls -la'</text>
  <text x="290" y="578" font-family="monospace" font-size="13" fill="var(--ok-tint)">   alias</text>
  <text x="344" y="578" font-family="monospace" font-size="13" fill="var(--primary-lt)"> gs='git status'</text>
  <text x="560" y="578" font-family="monospace" font-size="13" fill="var(--ok-tint)">   alias</text>
  <text x="614" y="578" font-family="monospace" font-size="13" fill="var(--primary-lt)"> ..='cd ..'</text>
  <text x="70" y="598" font-family="monospace" font-size="13" fill="var(--text-mid)"># Reload:   </text>
  <text x="170" y="598" font-family="monospace" font-size="13" fill="var(--ok-tint)">source</text>
  <text x="218" y="598" font-family="monospace" font-size="13" fill="var(--primary-lt)"> ~/.bashrc</text>
  <text x="390" y="598" font-family="monospace" font-size="12" fill="var(--text-mid)">   # Bypass alias:   \ll   or   command ll</text>
</svg>

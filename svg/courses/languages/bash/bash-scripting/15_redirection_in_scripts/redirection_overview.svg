<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Column headers -->
  <rect x="40" y="20" width="370" height="50" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="225" y="52" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)" text-anchor="middle" font-weight="bold">Output Redirection</text>

  <rect x="455" y="20" width="370" height="50" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="52" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)" text-anchor="middle" font-weight="bold">Error Redirection</text>

  <rect x="870" y="20" width="370" height="50" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="1055" y="52" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)" text-anchor="middle" font-weight="bold">Input Redirection</text>

  <!-- Output redirection items -->
  <rect x="40" y="90" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="115" font-family="monospace" font-size="16" fill="var(--primary-dk)" font-weight="bold">cmd &gt; file</text>
  <text x="60" y="138" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">write stdout to file (overwrite)</text>
  <text x="60" y="153" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">creates file if missing; truncates if exists</text>

  <rect x="40" y="175" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="200" font-family="monospace" font-size="16" fill="var(--primary-dk)" font-weight="bold">cmd &gt;&gt; file</text>
  <text x="60" y="222" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">append stdout to file</text>
  <text x="60" y="238" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">useful for log accumulation</text>

  <rect x="40" y="260" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="var(--info)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="285" font-family="monospace" font-size="16" fill="var(--info-dk)" font-weight="bold">cmd &amp;&gt; file</text>
  <text x="60" y="307" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">redirect both stdout and stderr</text>
  <text x="60" y="323" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">bash shorthand for 2&gt;&amp;1</text>

  <rect x="40" y="345" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="370" font-family="monospace" font-size="15" fill="var(--ok-dk)" font-weight="bold">cmd | tee file</text>
  <text x="60" y="393" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">write to file AND show on terminal</text>
  <text x="60" y="409" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">tee -a file to append</text>

  <rect x="40" y="430" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="var(--text-muted)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="455" font-family="monospace" font-size="15" fill="var(--text-dark)" font-weight="bold">cmd &gt; /dev/null</text>
  <text x="60" y="477" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">discard all stdout output</text>
  <text x="60" y="493" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">/dev/null is the "black hole"</text>

  <!-- Error redirection items -->
  <rect x="455" y="90" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="var(--danger)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="115" font-family="monospace" font-size="16" fill="var(--danger-deep)" font-weight="bold">cmd 2&gt; err.log</text>
  <text x="475" y="137" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">redirect stderr to a file</text>
  <text x="475" y="153" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">stdout still goes to terminal</text>

  <rect x="455" y="175" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="var(--danger)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="200" font-family="monospace" font-size="16" fill="var(--danger-deep)" font-weight="bold">cmd 2&gt;&amp;1</text>
  <text x="475" y="222" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">redirect stderr to stdout</text>
  <text x="475" y="238" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">order matters: stdout must be set first</text>

  <rect x="455" y="260" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="var(--danger)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="285" font-family="monospace" font-size="15" fill="var(--danger-deep)" font-weight="bold">cmd &gt; out 2&gt; err</text>
  <text x="475" y="307" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">split stdout and stderr</text>
  <text x="475" y="323" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">into separate files</text>

  <rect x="455" y="345" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="var(--text-muted)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="370" font-family="monospace" font-size="14" fill="var(--text-dark)" font-weight="bold">cmd 2&gt; /dev/null</text>
  <text x="475" y="392" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">silence all error output</text>
  <text x="475" y="408" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">common for quiet scripts</text>

  <!-- exec redirection -->
  <rect x="455" y="430" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="var(--info)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="455" font-family="monospace" font-size="14" fill="var(--info-dk)" font-weight="bold">exec &gt; log 2&gt;&amp;1</text>
  <text x="475" y="477" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">redirect entire script output</text>
  <text x="475" y="493" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">all subsequent output goes to log</text>

  <!-- Input redirection items -->
  <rect x="870" y="90" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="890" y="115" font-family="monospace" font-size="16" fill="var(--warn-dk)" font-weight="bold">cmd &lt; file</text>
  <text x="890" y="137" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">use file as stdin</text>
  <text x="890" y="153" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">while read -r line; do ... done &lt; f</text>

  <rect x="870" y="175" width="370" height="90" rx="6" fill="url(#grad-surface)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="890" y="200" font-family="monospace" font-size="16" fill="var(--warn-dk)" font-weight="bold">here-doc  &lt;&lt;EOF</text>
  <text x="890" y="220" font-family="monospace" font-size="13" fill="var(--text-dark)">cat &lt;&lt;EOF</text>
  <text x="890" y="238" font-family="monospace" font-size="13" fill="var(--text-dark)">  multi-line text</text>
  <text x="890" y="256" font-family="monospace" font-size="13" fill="var(--text-dark)">EOF</text>

  <rect x="870" y="280" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="890" y="305" font-family="monospace" font-size="16" fill="var(--warn-dk)" font-weight="bold">here-string  &lt;&lt;&lt;</text>
  <text x="890" y="327" font-family="monospace" font-size="13" fill="var(--text-dark)">grep "x" &lt;&lt;&lt; "$var"</text>
  <text x="890" y="343" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">feed single string as stdin</text>

  <!-- File descriptors box -->
  <rect x="870" y="370" width="370" height="145" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="398" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">File Descriptor Tricks</text>
  <text x="890" y="422" font-family="monospace" font-size="13" fill="var(--text-dark)">exec 3&gt; custom.log</text>
  <text x="890" y="442" font-family="monospace" font-size="13" fill="var(--text-dark)">echo "msg" &gt;&amp;3</text>
  <text x="890" y="462" font-family="monospace" font-size="13" fill="var(--text-dark)">exec 3&gt;&amp;-  # close fd 3</text>
  <text x="890" y="485" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">open custom fds for multi-stream</text>
  <text x="890" y="503" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">logging in complex scripts</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- Column headers -->
  <rect x="40" y="40" width="370" height="58.585865" rx="7.046168" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="77.494954" font-family="Arial, sans-serif" font-size="19.4843" fill="var(--bg)" text-anchor="middle" font-weight="bold">Output Redirection</text>

  <rect x="455" y="40" width="370" height="58.585865" rx="7.046168" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.494954" font-family="Arial, sans-serif" font-size="19.4843" fill="var(--bg)" text-anchor="middle" font-weight="bold">Error Redirection</text>

  <rect x="870" y="40" width="370" height="58.585865" rx="7.046168" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="77.494954" font-family="Arial, sans-serif" font-size="19.4843" fill="var(--bg)" text-anchor="middle" font-weight="bold">Input Redirection</text>

  <!-- Output redirection items -->
  <rect x="40" y="122.020211" width="370" height="82.020211" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="151.313208" font-size="17.319365" fill="var(--primary-accent)" font-weight="bold" font-family="Courier New, monospace">cmd &gt; file</text>
  <text x="60" y="178.262642" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">write stdout to file (overwrite)</text>
  <text x="60" y="195.838337" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">creates file if missing; truncates if exists</text>

  <rect x="40" y="221.616247" width="370" height="82.020211" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="250.909114" font-size="17.319365" fill="var(--primary-accent)" font-weight="bold" font-family="Courier New, monospace">cmd &gt;&gt; file</text>
  <text x="60" y="276.686895" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">append stdout to file</text>
  <text x="60" y="295.434372" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">useful for log accumulation</text>

  <rect x="40" y="321.212153" width="370" height="82.020211" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="350.50502" font-size="17.319365" fill="var(--info-accent)" font-weight="bold" font-family="Courier New, monospace">cmd &amp;&gt; file</text>
  <text x="60" y="376.28293" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">redirect both stdout and stderr</text>
  <text x="60" y="395.030407" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">bash shorthand for 2&gt;&amp;1</text>

  <rect x="40" y="420.808059" width="370" height="82.020211" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="450.101056" font-size="16.236838" fill="var(--ok-accent)" font-weight="bold" font-family="Courier New, monospace">cmd | tee file</text>
  <text x="60" y="477.050489" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">write to file AND show on terminal</text>
  <text x="60" y="495.797966" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">tee -a file to append</text>

  <rect x="40" y="520.404094" width="370" height="82.020211" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="549.697091" font-size="16.236838" fill="var(--text)" font-weight="bold" font-family="Courier New, monospace">cmd &gt; /dev/null</text>
  <text x="60" y="575.474743" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">discard all stdout output</text>
  <text x="60" y="594.222219" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">/dev/null is the "black hole"</text>

  <!-- Error redirection items -->
  <rect x="455" y="122.020211" width="370" height="82.020211" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="475" y="151.313208" font-size="17.319365" fill="var(--danger-accent)" font-weight="bold" font-family="Courier New, monospace">cmd 2&gt; err.log</text>
  <text x="475" y="177.09086" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">redirect stderr to a file</text>
  <text x="475" y="195.838337" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">stdout still goes to terminal</text>

  <rect x="455" y="221.616247" width="370" height="82.020211" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="475" y="250.909114" font-size="17.319365" fill="var(--danger-accent)" font-weight="bold" font-family="Courier New, monospace">cmd 2&gt;&amp;1</text>
  <text x="475" y="276.686895" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">redirect stderr to stdout</text>
  <text x="475" y="295.434372" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">order matters: stdout must be set first</text>

  <rect x="455" y="321.212153" width="370" height="82.020211" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="475" y="350.50502" font-size="16.236838" fill="var(--danger-accent)" font-weight="bold" font-family="Courier New, monospace">cmd &gt; out 2&gt; err</text>
  <text x="475" y="376.28293" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">split stdout and stderr</text>
  <text x="475" y="395.030407" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">into separate files</text>

  <rect x="455" y="420.808059" width="370" height="82.020211" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="475" y="450.101056" font-size="15.154429" fill="var(--text)" font-weight="bold" font-family="Courier New, monospace">cmd 2&gt; /dev/null</text>
  <text x="475" y="475.878836" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">silence all error output</text>
  <text x="475" y="494.626313" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">common for quiet scripts</text>

  <!-- exec redirection -->
  <rect x="455" y="520.404094" width="370" height="82.020211" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="475" y="549.697091" font-size="15.154429" fill="var(--info-accent)" font-weight="bold" font-family="Courier New, monospace">exec &gt; log 2&gt;&amp;1</text>
  <text x="475" y="575.474743" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">redirect entire script output</text>
  <text x="475" y="594.222219" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">all subsequent output goes to log</text>

  <!-- Input redirection items -->
  <rect x="870" y="122.020211" width="370" height="82.020211" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="890" y="151.313208" font-size="17.319365" fill="var(--warn-accent)" font-weight="bold" font-family="Courier New, monospace">cmd &lt; file</text>
  <text x="890" y="177.09086" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">use file as stdin</text>
  <text x="890" y="195.838337" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">while read -r line; do ... done &lt; f</text>

  <rect x="870" y="221.616247" width="370" height="105.454557" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="890" y="250.909114" font-size="17.319365" fill="var(--warn-accent)" font-weight="bold" font-family="Courier New, monospace">here-doc  &lt;&lt;EOF</text>
  <text x="890" y="274.34346" font-size="14.072021" fill="var(--text)" font-family="Courier New, monospace">cat &lt;&lt;EOF</text>
  <text x="890" y="295.434372" font-size="14.072021" fill="var(--text)" font-family="Courier New, monospace">  multi-line text</text>
  <text x="890" y="316.525283" font-size="14.072021" fill="var(--text)" font-family="Courier New, monospace">EOF</text>

  <rect x="870" y="344.646499" width="370" height="82.020211" rx="7.046168" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="890" y="373.939367" font-size="17.319365" fill="var(--warn-accent)" font-weight="bold" font-family="Courier New, monospace">here-string  &lt;&lt;&lt;</text>
  <text x="890" y="399.717276" font-size="14.072021" fill="var(--text)" font-family="Courier New, monospace">grep "x" &lt;&lt;&lt; "$var"</text>
  <text x="890" y="418.464753" font-family="Arial, sans-serif" font-size="14.072021" fill="var(--text-muted)">feed single string as stdin</text>

  <!-- File descriptors box -->
  <rect x="870" y="450.101056" width="370" height="169.898944" rx="7.046168" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="482.90914" font-family="Arial, sans-serif" font-size="16.236838" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">File Descriptor Tricks</text>
  <text x="890" y="511.030356" font-size="14.072021" fill="var(--text)" font-family="Courier New, monospace">exec 3&gt; custom.log</text>
  <text x="890" y="534.464702" font-size="14.072021" fill="var(--text)" font-family="Courier New, monospace">echo "msg" &gt;&amp;3</text>
  <text x="890" y="557.899048" font-size="14.072021" fill="var(--text)" font-family="Courier New, monospace">exec 3&gt;&amp;-  # close fd 3</text>
  <text x="890" y="584.848481" font-family="Arial, sans-serif" font-size="12.989494" fill="var(--text-muted)">open custom fds for multi-stream</text>
  <text x="890" y="605.939522" font-family="Arial, sans-serif" font-size="12.989494" fill="var(--text-muted)">logging in complex scripts</text>
</svg>

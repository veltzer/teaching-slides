<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Column headers -->
  <rect x="40" y="20" width="370" height="50" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="225" y="52" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Output Redirection</text>

  <rect x="455" y="20" width="370" height="50" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="52" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Error Redirection</text>

  <rect x="870" y="20" width="370" height="50" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1055" y="52" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Input Redirection</text>

  <!-- Output redirection items -->
  <rect x="40" y="90" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="115" font-family="monospace" font-size="16" fill="#1565c0" font-weight="bold">cmd &gt; file</text>
  <text x="60" y="138" font-family="Arial, sans-serif" font-size="13" fill="#555555">write stdout to file (overwrite)</text>
  <text x="60" y="153" font-family="Arial, sans-serif" font-size="13" fill="#555555">creates file if missing; truncates if exists</text>

  <rect x="40" y="175" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="200" font-family="monospace" font-size="16" fill="#1565c0" font-weight="bold">cmd &gt;&gt; file</text>
  <text x="60" y="222" font-family="Arial, sans-serif" font-size="13" fill="#555555">append stdout to file</text>
  <text x="60" y="238" font-family="Arial, sans-serif" font-size="13" fill="#555555">useful for log accumulation</text>

  <rect x="40" y="260" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="#8e24aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="285" font-family="monospace" font-size="16" fill="#6a1b9a" font-weight="bold">cmd &amp;&gt; file</text>
  <text x="60" y="307" font-family="Arial, sans-serif" font-size="13" fill="#555555">redirect both stdout and stderr</text>
  <text x="60" y="323" font-family="Arial, sans-serif" font-size="13" fill="#555555">bash shorthand for 2&gt;&amp;1</text>

  <rect x="40" y="345" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="370" font-family="monospace" font-size="15" fill="#2e7d32" font-weight="bold">cmd | tee file</text>
  <text x="60" y="393" font-family="Arial, sans-serif" font-size="13" fill="#555555">write to file AND show on terminal</text>
  <text x="60" y="409" font-family="Arial, sans-serif" font-size="13" fill="#555555">tee -a file to append</text>

  <rect x="40" y="430" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="#555555" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="455" font-family="monospace" font-size="15" fill="#333333" font-weight="bold">cmd &gt; /dev/null</text>
  <text x="60" y="477" font-family="Arial, sans-serif" font-size="13" fill="#555555">discard all stdout output</text>
  <text x="60" y="493" font-family="Arial, sans-serif" font-size="13" fill="#555555">/dev/null is the "black hole"</text>

  <!-- Error redirection items -->
  <rect x="455" y="90" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="#e53935" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="115" font-family="monospace" font-size="16" fill="#b71c1c" font-weight="bold">cmd 2&gt; err.log</text>
  <text x="475" y="137" font-family="Arial, sans-serif" font-size="13" fill="#555555">redirect stderr to a file</text>
  <text x="475" y="153" font-family="Arial, sans-serif" font-size="13" fill="#555555">stdout still goes to terminal</text>

  <rect x="455" y="175" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="#e53935" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="200" font-family="monospace" font-size="16" fill="#b71c1c" font-weight="bold">cmd 2&gt;&amp;1</text>
  <text x="475" y="222" font-family="Arial, sans-serif" font-size="13" fill="#555555">redirect stderr to stdout</text>
  <text x="475" y="238" font-family="Arial, sans-serif" font-size="13" fill="#555555">order matters: stdout must be set first</text>

  <rect x="455" y="260" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="#e53935" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="285" font-family="monospace" font-size="15" fill="#b71c1c" font-weight="bold">cmd &gt; out 2&gt; err</text>
  <text x="475" y="307" font-family="Arial, sans-serif" font-size="13" fill="#555555">split stdout and stderr</text>
  <text x="475" y="323" font-family="Arial, sans-serif" font-size="13" fill="#555555">into separate files</text>

  <rect x="455" y="345" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="#555555" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="370" font-family="monospace" font-size="14" fill="#333333" font-weight="bold">cmd 2&gt; /dev/null</text>
  <text x="475" y="392" font-family="Arial, sans-serif" font-size="13" fill="#555555">silence all error output</text>
  <text x="475" y="408" font-family="Arial, sans-serif" font-size="13" fill="#555555">common for quiet scripts</text>

  <!-- exec redirection -->
  <rect x="455" y="430" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="#8e24aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="455" font-family="monospace" font-size="14" fill="#6a1b9a" font-weight="bold">exec &gt; log 2&gt;&amp;1</text>
  <text x="475" y="477" font-family="Arial, sans-serif" font-size="13" fill="#555555">redirect entire script output</text>
  <text x="475" y="493" font-family="Arial, sans-serif" font-size="13" fill="#555555">all subsequent output goes to log</text>

  <!-- Input redirection items -->
  <rect x="870" y="90" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="#fb8c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="890" y="115" font-family="monospace" font-size="16" fill="#e65100" font-weight="bold">cmd &lt; file</text>
  <text x="890" y="137" font-family="Arial, sans-serif" font-size="13" fill="#555555">use file as stdin</text>
  <text x="890" y="153" font-family="Arial, sans-serif" font-size="13" fill="#555555">while read -r line; do ... done &lt; f</text>

  <rect x="870" y="175" width="370" height="90" rx="6" fill="url(#grad-surface)" stroke="#fb8c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="890" y="200" font-family="monospace" font-size="16" fill="#e65100" font-weight="bold">here-doc  &lt;&lt;EOF</text>
  <text x="890" y="220" font-family="monospace" font-size="13" fill="#333333">cat &lt;&lt;EOF</text>
  <text x="890" y="238" font-family="monospace" font-size="13" fill="#333333">  multi-line text</text>
  <text x="890" y="256" font-family="monospace" font-size="13" fill="#333333">EOF</text>

  <rect x="870" y="280" width="370" height="70" rx="6" fill="url(#grad-surface)" stroke="#fb8c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="890" y="305" font-family="monospace" font-size="16" fill="#e65100" font-weight="bold">here-string  &lt;&lt;&lt;</text>
  <text x="890" y="327" font-family="monospace" font-size="13" fill="#333333">grep "x" &lt;&lt;&lt; "$var"</text>
  <text x="890" y="343" font-family="Arial, sans-serif" font-size="13" fill="#555555">feed single string as stdin</text>

  <!-- File descriptors box -->
  <rect x="870" y="370" width="370" height="145" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="398" font-family="Arial, sans-serif" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">File Descriptor Tricks</text>
  <text x="890" y="422" font-family="monospace" font-size="13" fill="#333333">exec 3&gt; custom.log</text>
  <text x="890" y="442" font-family="monospace" font-size="13" fill="#333333">echo "msg" &gt;&amp;3</text>
  <text x="890" y="462" font-family="monospace" font-size="13" fill="#333333">exec 3&gt;&amp;-  # close fd 3</text>
  <text x="890" y="485" font-family="Arial, sans-serif" font-size="12" fill="#555555">open custom fds for multi-stream</text>
  <text x="890" y="503" font-family="Arial, sans-serif" font-size="12" fill="#555555">logging in complex scripts</text>
</svg>

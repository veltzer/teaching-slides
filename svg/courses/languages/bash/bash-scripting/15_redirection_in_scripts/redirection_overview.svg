<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Column headers -->
  <rect x="77.5" y="58.125" width="346.875" height="45.3125" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250.9375" y="87.125" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--bg)" text-anchor="middle" font-weight="bold">Output Redirection</text>

  <rect x="466.5625" y="58.125" width="346.875" height="45.3125" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="87.125" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--bg)" text-anchor="middle" font-weight="bold">Error Redirection</text>

  <rect x="855.625" y="58.125" width="346.875" height="45.3125" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1029.0625" y="87.125" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--bg)" text-anchor="middle" font-weight="bold">Input Redirection</text>

  <!-- Output redirection items -->
  <rect x="77.5" y="121.5625" width="346.875" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="96.25" y="144.2188" font-family="monospace" font-size="14.7479" fill="var(--primary-accent)" font-weight="bold">cmd &gt; file</text>
  <text x="96.25" y="165.0625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">write stdout to file (overwrite)</text>
  <text x="96.25" y="178.6562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">creates file if missing; truncates if exists</text>

  <rect x="77.5" y="198.5938" width="346.875" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="96.25" y="221.25" font-family="monospace" font-size="14.7479" fill="var(--primary-accent)" font-weight="bold">cmd &gt;&gt; file</text>
  <text x="96.25" y="241.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">append stdout to file</text>
  <text x="96.25" y="255.6875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">useful for log accumulation</text>

  <rect x="77.5" y="275.625" width="346.875" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="96.25" y="298.2812" font-family="monospace" font-size="14.7479" fill="var(--info-accent)" font-weight="bold">cmd &amp;&gt; file</text>
  <text x="96.25" y="318.2188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">redirect both stdout and stderr</text>
  <text x="96.25" y="332.7188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">bash shorthand for 2&gt;&amp;1</text>

  <rect x="77.5" y="352.6562" width="346.875" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="96.25" y="375.3125" font-family="monospace" font-size="13.8261" fill="var(--ok-accent)" font-weight="bold">cmd | tee file</text>
  <text x="96.25" y="396.1562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">write to file AND show on terminal</text>
  <text x="96.25" y="410.6562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">tee -a file to append</text>

  <rect x="77.5" y="429.6875" width="346.875" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="96.25" y="452.3438" font-family="monospace" font-size="13.8261" fill="var(--text)" font-weight="bold">cmd &gt; /dev/null</text>
  <text x="96.25" y="472.2812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">discard all stdout output</text>
  <text x="96.25" y="486.7812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">/dev/null is the "black hole"</text>

  <!-- Error redirection items -->
  <rect x="466.5625" y="121.5625" width="346.875" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="485.3125" y="144.2188" font-family="monospace" font-size="14.7479" fill="var(--danger-accent)" font-weight="bold">cmd 2&gt; err.log</text>
  <text x="485.3125" y="164.1562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">redirect stderr to a file</text>
  <text x="485.3125" y="178.6562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">stdout still goes to terminal</text>

  <rect x="466.5625" y="198.5938" width="346.875" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="485.3125" y="221.25" font-family="monospace" font-size="14.7479" fill="var(--danger-accent)" font-weight="bold">cmd 2&gt;&amp;1</text>
  <text x="485.3125" y="241.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">redirect stderr to stdout</text>
  <text x="485.3125" y="255.6875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">order matters: stdout must be set first</text>

  <rect x="466.5625" y="275.625" width="346.875" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="485.3125" y="298.2812" font-family="monospace" font-size="13.8261" fill="var(--danger-accent)" font-weight="bold">cmd &gt; out 2&gt; err</text>
  <text x="485.3125" y="318.2188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">split stdout and stderr</text>
  <text x="485.3125" y="332.7188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">into separate files</text>

  <rect x="466.5625" y="352.6562" width="346.875" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="485.3125" y="375.3125" font-family="monospace" font-size="12.9044" fill="var(--text)" font-weight="bold">cmd 2&gt; /dev/null</text>
  <text x="485.3125" y="395.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">silence all error output</text>
  <text x="485.3125" y="409.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">common for quiet scripts</text>

  <!-- exec redirection -->
  <rect x="466.5625" y="429.6875" width="346.875" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="485.3125" y="452.3438" font-family="monospace" font-size="12.9044" fill="var(--info-accent)" font-weight="bold">exec &gt; log 2&gt;&amp;1</text>
  <text x="485.3125" y="472.2812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">redirect entire script output</text>
  <text x="485.3125" y="486.7812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">all subsequent output goes to log</text>

  <!-- Input redirection items -->
  <rect x="855.625" y="121.5625" width="346.875" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="874.375" y="144.2188" font-family="monospace" font-size="14.7479" fill="var(--warn-accent)" font-weight="bold">cmd &lt; file</text>
  <text x="874.375" y="164.1562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">use file as stdin</text>
  <text x="874.375" y="178.6562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">while read -r line; do ... done &lt; f</text>

  <rect x="855.625" y="198.5938" width="346.875" height="81.5625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="874.375" y="221.25" font-family="monospace" font-size="14.7479" fill="var(--warn-accent)" font-weight="bold">here-doc  &lt;&lt;EOF</text>
  <text x="874.375" y="239.375" font-family="monospace" font-size="11.9827" fill="var(--text)">cat &lt;&lt;EOF</text>
  <text x="874.375" y="255.6875" font-family="monospace" font-size="11.9827" fill="var(--text)">  multi-line text</text>
  <text x="874.375" y="272" font-family="monospace" font-size="11.9827" fill="var(--text)">EOF</text>

  <rect x="855.625" y="293.75" width="346.875" height="63.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="874.375" y="316.4062" font-family="monospace" font-size="14.7479" fill="var(--warn-accent)" font-weight="bold">here-string  &lt;&lt;&lt;</text>
  <text x="874.375" y="336.3438" font-family="monospace" font-size="11.9827" fill="var(--text)">grep "x" &lt;&lt;&lt; "$var"</text>
  <text x="874.375" y="350.8438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">feed single string as stdin</text>

  <!-- File descriptors box -->
  <rect x="855.625" y="375.3125" width="346.875" height="131.4062" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1029.0625" y="400.6875" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">File Descriptor Tricks</text>
  <text x="874.375" y="422.4375" font-family="monospace" font-size="11.9827" fill="var(--text)">exec 3&gt; custom.log</text>
  <text x="874.375" y="440.5625" font-family="monospace" font-size="11.9827" fill="var(--text)">echo "msg" &gt;&amp;3</text>
  <text x="874.375" y="458.6875" font-family="monospace" font-size="11.9827" fill="var(--text)">exec 3&gt;&amp;-  # close fd 3</text>
  <text x="874.375" y="479.5312" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">open custom fds for multi-stream</text>
  <text x="874.375" y="495.8438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">logging in complex scripts</text>
</svg>

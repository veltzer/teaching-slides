<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.699676538728" font-weight="bold" fill="var(--primary-accent)">Bash Redirection Overview</text>

  <!-- Column headers -->
  <rect x="40" y="76.909090909091" width="390" height="47.454545454545" rx="8.21528508884" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="108.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--primary-text)">Output</text>

  <rect x="445" y="76.909090909091" width="390" height="47.454545454545" rx="8.21528508884" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="108.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--danger-text)">Errors</text>

  <rect x="850" y="76.909090909091" width="390" height="47.454545454545" rx="8.21528508884" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="108.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--warn-text)">Input</text>

  <!-- Output column -->
  <rect x="40" y="140.181818181818" width="390" height="479.818181818182" rx="10.269106361049" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="171.818181818182" font-family="Courier New, monospace" font-size="17.457480813784" font-weight="bold" fill="var(--primary-accent)">cmd &gt; file</text>
  <text x="60" y="196.072727272727" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">overwrite stdout</text>

  <text x="60" y="240.363636363636" font-family="Courier New, monospace" font-size="17.457480813784" font-weight="bold" fill="var(--primary-accent)">cmd &gt;&gt; file</text>
  <text x="60" y="264.618181818182" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">append stdout</text>

  <text x="60" y="308.909090909091" font-family="Courier New, monospace" font-size="17.457480813784" font-weight="bold" fill="var(--info-accent)">cmd &amp;&gt; file</text>
  <text x="60" y="333.163636363636" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">both streams</text>

  <text x="60" y="377.454545454545" font-family="Courier New, monospace" font-size="17.457480813784" font-weight="bold" fill="var(--ok-accent)">cmd | tee file</text>
  <text x="60" y="401.709090909091" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">file + terminal</text>

  <text x="60" y="446" font-family="Courier New, monospace" font-size="16.430570177679" font-weight="bold" fill="var(--text)">cmd &gt; /dev/null</text>
  <text x="60" y="470.254545454545" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">discard output</text>

  <!-- Errors column -->
  <rect x="445" y="140.181818181818" width="390" height="479.818181818182" rx="10.269106361049" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="465" y="171.818181818182" font-family="Courier New, monospace" font-size="17.457480813784" font-weight="bold" fill="var(--danger-accent)">cmd 2&gt; err.log</text>
  <text x="465" y="196.072727272727" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">stderr to file</text>

  <text x="465" y="240.363636363636" font-family="Courier New, monospace" font-size="17.457480813784" font-weight="bold" fill="var(--danger-accent)">cmd 2&gt;&amp;1</text>
  <text x="465" y="264.618181818182" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">stderr to stdout</text>

  <text x="465" y="308.909090909091" font-family="Courier New, monospace" font-size="16.430570177679" font-weight="bold" fill="var(--danger-accent)">cmd &gt; out 2&gt; err</text>
  <text x="465" y="333.163636363636" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">split streams</text>

  <text x="465" y="377.454545454545" font-family="Courier New, monospace" font-size="16.430570177679" font-weight="bold" fill="var(--text)">cmd 2&gt; /dev/null</text>
  <text x="465" y="401.709090909091" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">silence errors</text>

  <text x="465" y="446" font-family="Courier New, monospace" font-size="16.430570177679" font-weight="bold" fill="var(--info-accent)">exec &gt; log 2&gt;&amp;1</text>
  <text x="465" y="470.254545454545" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">script-wide</text>

  <!-- Input column -->
  <rect x="850" y="140.181818181818" width="390" height="479.818181818182" rx="10.269106361049" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="870" y="171.818181818182" font-family="Courier New, monospace" font-size="17.457480813784" font-weight="bold" fill="var(--warn-accent)">cmd &lt; file</text>
  <text x="870" y="196.072727272727" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">file as stdin</text>

  <text x="870" y="240.363636363636" font-family="Courier New, monospace" font-size="17.457480813784" font-weight="bold" fill="var(--warn-accent)">&lt;&lt;EOF</text>
  <text x="870" y="264.618181818182" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">here-doc</text>

  <text x="870" y="308.909090909091" font-family="Courier New, monospace" font-size="17.457480813784" font-weight="bold" fill="var(--warn-accent)">cmd &lt;&lt;&lt; x</text>
  <text x="870" y="333.163636363636" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">here-string</text>

  <text x="870" y="377.454545454545" font-family="Courier New, monospace" font-size="16.430570177679" font-weight="bold" fill="var(--primary-accent)">exec 3&gt; log</text>
  <text x="870" y="401.709090909091" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">open fd</text>

  <text x="870" y="446" font-family="Courier New, monospace" font-size="16.430570177679" font-weight="bold" fill="var(--primary-accent)">echo &gt;&amp;3</text>
  <text x="870" y="470.254545454545" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">write fd</text>
</svg>

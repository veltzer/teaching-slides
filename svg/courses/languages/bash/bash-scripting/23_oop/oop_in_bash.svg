<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Title bar -->
  <rect x="40" y="20" width="1200" height="55" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="54" font-family="Arial, sans-serif" font-size="22" fill="var(--bg)" text-anchor="middle" font-weight="bold">OOP Patterns in Bash using Associative Arrays</text>

  <!-- OOP concept mapping - left side -->
  <rect x="40" y="100" width="300" height="280" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="128" font-family="Arial, sans-serif" font-size="16" fill="var(--info-dk)" text-anchor="middle" font-weight="bold">OOP Concept Mapping</text>
  <text x="60" y="158" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)" font-weight="bold">OOP           Bash</text>
  <line x1="60" y1="168" x2="320" y2="168" stroke="var(--info)" stroke-width="1"/>
  <text x="60" y="192" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">class      -&gt;  prefix convention</text>
  <text x="60" y="214" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">object     -&gt;  assoc array</text>
  <text x="60" y="236" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">field      -&gt;  array key</text>
  <text x="60" y="258" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">method     -&gt;  function</text>
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">this/self  -&gt;  nameref (-n)</text>
  <text x="60" y="302" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">inherit.   -&gt;  not supported</text>
  <text x="60" y="324" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">new Obj()  -&gt;  declare -A name</text>
  <text x="60" y="346" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" font-style="italic">  + init function</text>
  <text x="60" y="366" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">destructor -&gt;  cleanup function</text>

  <!-- Object definition example -->
  <rect x="380" y="100" width="540" height="225" rx="8" fill="url(#grad-surface)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="128" font-family="Arial, sans-serif" font-size="16" fill="var(--info-dk)" text-anchor="middle" font-weight="bold">Defining an Object</text>
  <text x="400" y="155" font-family="monospace" font-size="13" fill="var(--text-dark)"># "Constructor" - creates and initializes</text>
  <text x="400" y="175" font-family="monospace" font-size="13" fill="var(--text-dark)">person_new() {</text>
  <text x="400" y="195" font-family="monospace" font-size="13" fill="var(--text-dark)">  local -n _self=$1</text>
  <text x="400" y="215" font-family="monospace" font-size="13" fill="var(--text-dark)">  _self[name]="${2:-unknown}"</text>
  <text x="400" y="235" font-family="monospace" font-size="13" fill="var(--text-dark)">  _self[age]="${3:-0}"</text>
  <text x="400" y="255" font-family="monospace" font-size="13" fill="var(--text-dark)">  _self[email]="${4:-}"</text>
  <text x="400" y="275" font-family="monospace" font-size="13" fill="var(--text-dark)">}</text>
  <text x="400" y="300" font-family="monospace" font-size="13" fill="var(--text-dark)">declare -A alice</text>
  <text x="400" y="320" font-family="monospace" font-size="13" fill="var(--text-dark)">person_new alice "Alice" 30 "a@x.com"</text>

  <!-- Methods example -->
  <rect x="380" y="345" width="540" height="230" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="373" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Defining Methods</text>
  <text x="400" y="400" font-family="monospace" font-size="13" fill="var(--text-dark)"># "Method" - takes object by nameref</text>
  <text x="400" y="420" font-family="monospace" font-size="13" fill="var(--text-dark)">person_greet() {</text>
  <text x="400" y="440" font-family="monospace" font-size="13" fill="var(--text-dark)">  local -n _self=$1</text>
  <text x="400" y="460" font-family="monospace" font-size="13" fill="var(--text-dark)">  echo "Hi, I am ${_self[name]}"</text>
  <text x="400" y="480" font-family="monospace" font-size="13" fill="var(--text-dark)">  echo "Age: ${_self[age]}"</text>
  <text x="400" y="500" font-family="monospace" font-size="13" fill="var(--text-dark)">}</text>
  <text x="400" y="525" font-family="monospace" font-size="13" fill="var(--text-dark)"># "Method call"</text>
  <text x="400" y="545" font-family="monospace" font-size="13" fill="var(--text-dark)">person_greet alice</text>
  <text x="400" y="565" font-family="monospace" font-size="13" fill="var(--text-lighter)"># -&gt; Hi, I am Alice</text>

  <!-- Limitations and advice -->
  <rect x="960" y="100" width="280" height="215" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="128" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">Limitations</text>
  <text x="978" y="155" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- No encapsulation</text>
  <text x="978" y="177" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- No inheritance</text>
  <text x="978" y="199" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- No polymorphism</text>
  <text x="978" y="221" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Nameref bugs with</text>
  <text x="978" y="241" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">  local var names</text>
  <text x="978" y="263" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Hard to debug</text>
  <text x="978" y="285" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Slower than compiled</text>
  <text x="978" y="307" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" font-style="italic">  languages</text>

  <rect x="960" y="335" width="280" height="135" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="363" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">When to Use</text>
  <text x="978" y="390" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Complex scripts that</text>
  <text x="978" y="410" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">  need data grouping</text>
  <text x="978" y="430" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- When Python/Perl are</text>
  <text x="978" y="450" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">  not available</text>
  <text x="978" y="470" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" font-style="italic">- Otherwise: use Python</text>

  <!-- Naming convention note -->
  <rect x="960" y="490" width="280" height="85" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Naming Convention</text>
  <text x="978" y="538" font-family="monospace" font-size="13" fill="var(--text-dark)">classname_method()</text>
  <text x="978" y="558" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">e.g. person_greet</text>
  <text x="978" y="568" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">     stack_push, stack_pop</text>
</svg>

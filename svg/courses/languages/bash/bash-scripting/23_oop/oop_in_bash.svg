<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Title bar -->
  <rect x="77.5" y="58.125" width="1125" height="49.8438" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="88.9375" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--bg)" text-anchor="middle" font-weight="bold">OOP Patterns in Bash using Associative Arrays</text>

  <!-- OOP concept mapping - left side -->
  <rect x="77.5" y="130.625" width="281.25" height="253.75" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.125" y="156" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">OOP Concept Mapping</text>
  <text x="96.25" y="183.1875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)" font-weight="bold">OOP           Bash</text>
  <line x1="96.25" y1="192.25" x2="340" y2="192.25" stroke="var(--info-border)" stroke-width="1"/>
  <text x="96.25" y="214" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">class      -&gt;  prefix convention</text>
  <text x="96.25" y="233.9375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">object     -&gt;  assoc array</text>
  <text x="96.25" y="253.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">field      -&gt;  array key</text>
  <text x="96.25" y="273.8125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">method     -&gt;  function</text>
  <text x="96.25" y="293.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">this/self  -&gt;  nameref (-n)</text>
  <text x="96.25" y="313.6875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">inherit.   -&gt;  not supported</text>
  <text x="96.25" y="333.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">new Obj()  -&gt;  declare -A name</text>
  <text x="96.25" y="353.5625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" font-style="italic">  + init function</text>
  <text x="96.25" y="371.6875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">destructor -&gt;  cleanup function</text>

  <!-- Object definition example -->
  <rect x="396.25" y="130.625" width="506.25" height="203.9062" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="649.375" y="156" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Defining an Object</text>
  <text x="415" y="180.4688" font-family="monospace" font-size="11.9827" fill="var(--text)"># "Constructor" - creates and initializes</text>
  <text x="415" y="198.5938" font-family="monospace" font-size="11.9827" fill="var(--text)">person_new() {</text>
  <text x="415" y="216.7188" font-family="monospace" font-size="11.9827" fill="var(--text)">  local -n _self=$1</text>
  <text x="415" y="234.8438" font-family="monospace" font-size="11.9827" fill="var(--text)">  _self[name]="${2:-unknown}"</text>
  <text x="415" y="252.9688" font-family="monospace" font-size="11.9827" fill="var(--text)">  _self[age]="${3:-0}"</text>
  <text x="415" y="271.0938" font-family="monospace" font-size="11.9827" fill="var(--text)">  _self[email]="${4:-}"</text>
  <text x="415" y="289.2188" font-family="monospace" font-size="11.9827" fill="var(--text)">}</text>
  <text x="415" y="311.875" font-family="monospace" font-size="11.9827" fill="var(--text)">declare -A alice</text>
  <text x="415" y="330" font-family="monospace" font-size="11.9827" fill="var(--text)">person_new alice "Alice" 30 "a@x.com"</text>

  <!-- Methods example -->
  <rect x="396.25" y="352.6562" width="506.25" height="208.4375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="649.375" y="378.0312" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Defining Methods</text>
  <text x="415" y="402.5" font-family="monospace" font-size="11.9827" fill="var(--text)"># "Method" - takes object by nameref</text>
  <text x="415" y="420.625" font-family="monospace" font-size="11.9827" fill="var(--text)">person_greet() {</text>
  <text x="415" y="438.75" font-family="monospace" font-size="11.9827" fill="var(--text)">  local -n _self=$1</text>
  <text x="415" y="456.875" font-family="monospace" font-size="11.9827" fill="var(--text)">  echo "Hi, I am ${_self[name]}"</text>
  <text x="415" y="475" font-family="monospace" font-size="11.9827" fill="var(--text)">  echo "Age: ${_self[age]}"</text>
  <text x="415" y="493.125" font-family="monospace" font-size="11.9827" fill="var(--text)">}</text>
  <text x="415" y="515.7812" font-family="monospace" font-size="11.9827" fill="var(--text)"># "Method call"</text>
  <text x="415" y="533.9062" font-family="monospace" font-size="11.9827" fill="var(--text)">person_greet alice</text>
  <text x="415" y="552.0312" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># -&gt; Hi, I am Alice</text>

  <!-- Limitations and advice -->
  <rect x="940" y="130.625" width="262.5" height="194.8438" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1071.25" y="156" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Limitations</text>
  <text x="956.875" y="180.4688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">- No encapsulation</text>
  <text x="956.875" y="200.4062" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">- No inheritance</text>
  <text x="956.875" y="220.3438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">- No polymorphism</text>
  <text x="956.875" y="240.2812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">- Nameref bugs with</text>
  <text x="956.875" y="258.4062" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">  local var names</text>
  <text x="956.875" y="278.3438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">- Hard to debug</text>
  <text x="956.875" y="298.2812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">- Slower than compiled</text>
  <text x="956.875" y="318.2188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" font-style="italic">  languages</text>

  <rect x="940" y="343.5938" width="262.5" height="122.3438" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1071.25" y="368.9688" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">When to Use</text>
  <text x="956.875" y="393.4375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">- Complex scripts that</text>
  <text x="956.875" y="411.5625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">  need data grouping</text>
  <text x="956.875" y="429.6875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">- When Python/Perl are</text>
  <text x="956.875" y="447.8125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">  not available</text>
  <text x="956.875" y="465.9375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" font-style="italic">- Otherwise: use Python</text>

  <!-- Naming convention note -->
  <rect x="940" y="484.0625" width="262.5" height="77.0312" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1071.25" y="506.7188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Naming Convention</text>
  <text x="956.875" y="527.5625" font-family="monospace" font-size="11.9827" fill="var(--text)">classname_method()</text>
  <text x="956.875" y="545.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">e.g. person_greet</text>
  <text x="956.875" y="554.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">     stack_push, stack_pop</text>
</svg>

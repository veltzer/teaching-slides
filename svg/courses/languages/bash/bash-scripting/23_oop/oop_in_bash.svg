<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Title bar -->
  <rect x="40" y="40" width="1200" height="57.477541" rx="6.654403" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.531535" font-family="Arial, sans-serif" font-size="22.489998" fill="var(--bg)" text-anchor="middle" font-weight="bold">OOP in Bash via Assoc Arrays</text>

  <!-- OOP concept mapping - left side -->
  <rect x="40" y="123.603612" width="300" height="292.612642" rx="6.654403" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="152.864876" font-family="Arial, sans-serif" font-size="16.356413" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Concept Mapping</text>
  <text x="60" y="184.216231" font-family="Arial, sans-serif" font-size="14.311847" fill="var(--text)" font-weight="bold">OOP      Bash</text>
  <line x1="60" y1="194.666682" x2="320" y2="194.666682" stroke="var(--info-border)" stroke-width="1"/>
  <text x="60" y="219.747766" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">class  prefix</text>
  <text x="60" y="242.738759" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">object array</text>
  <text x="60" y="265.729752" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">field  key</text>
  <text x="60" y="288.720745" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">method fn</text>
  <text x="60" y="311.711739" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">self   -n</text>
  <text x="60" y="334.702732" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">inherit none</text>
  <text x="60" y="357.693725" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">new    declare</text>
  <text x="60" y="401.585622" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">destr  cleanup</text>

  <!-- Object definition example -->
  <rect x="380" y="123.603612" width="540" height="235.135101" rx="6.654403" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650" y="152.864876" font-family="Arial, sans-serif" font-size="16.356413" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Defining an Object</text>
  <text x="400" y="201.982056" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">person_new() {</text>
  <text x="400" y="222.882959" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">  local -n _s=$1</text>
  <text x="400" y="243.783862" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">  _s[name]=$2</text>
  <text x="400" y="264.684765" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">  _s[age]=$3</text>
  <text x="400" y="306.486571" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">}</text>
  <text x="400" y="332.612642" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">declare -A alice</text>
  <text x="400" y="353.513545" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">person_new alice</text>

  <!-- Methods example -->
  <rect x="380" y="379.639616" width="540" height="240.360384" rx="6.654403" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650" y="408.90088" font-family="Arial, sans-serif" font-size="16.356413" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Defining Methods</text>
  <text x="400" y="458.01806" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">person_greet() {</text>
  <text x="400" y="478.918963" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">  local -n _s=$1</text>
  <text x="400" y="499.819866" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">  echo ${_s[name]}</text>
  <text x="400" y="541.621671" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">}</text>
  <text x="400" y="588.648646" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">person_greet alice</text>

  <!-- Limitations and advice -->
  <rect x="960" y="123.603612" width="280" height="224.684765" rx="6.654403" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="152.864876" font-family="Arial, sans-serif" font-size="15.334075" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Limitations</text>
  <text x="978" y="181.081153" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">- No encapsulation</text>
  <text x="978" y="204.072031" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">- No inheritance</text>
  <text x="978" y="227.063139" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">- No polymorphism</text>
  <text x="978" y="250.054017" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">- Nameref bugs</text>
  <text x="978" y="270.95492" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">- Slow</text>

  <rect x="960" y="369.18928" width="280" height="141.081153" rx="6.654403" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="398.450544" font-family="Arial, sans-serif" font-size="15.334075" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">When to Use</text>
  <text x="978" y="426.666705" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">- Data grouping</text>
  <text x="978" y="447.567608" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text)">- No Python</text>
  <text x="978" y="510.270317" font-family="Arial, sans-serif" font-size="13.28962" fill="var(--text-muted)" font-style="italic">- Else Python</text>

  <!-- Naming convention note -->
  <rect x="960" y="531.17122" width="280" height="88.82878" rx="6.654403" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="557.297406" font-family="Arial, sans-serif" font-size="14.311847" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Naming</text>
  <text x="978" y="581.333387" font-size="13.28962" fill="var(--text)" font-family="Courier New, monospace">class_method()</text>
  <text x="978" y="602.23429" font-family="Arial, sans-serif" font-size="12.267282" fill="var(--text-muted)">person_greet</text>
</svg>

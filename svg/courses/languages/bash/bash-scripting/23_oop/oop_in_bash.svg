<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Title bar -->
  <rect x="40" y="20" width="1200" height="55" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="54" font-family="Arial, sans-serif" font-size="22" fill="var(--bg)" text-anchor="middle" font-weight="bold">OOP Patterns in Bash using Associative Arrays</text>

  <!-- OOP concept mapping - left side -->
  <rect x="40" y="100" width="300" height="280" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="128" font-family="Arial, sans-serif" font-size="16" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">OOP Concept Mapping</text>
  <text x="60" y="158" font-family="Arial, sans-serif" font-size="14" fill="var(--text)" font-weight="bold">OOP           Bash</text>
  <line x1="60" y1="168" x2="320" y2="168" stroke="var(--info-border)" stroke-width="1"/>
  <text x="60" y="192" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">class      -&gt;  prefix convention</text>
  <text x="60" y="214" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">object     -&gt;  assoc array</text>
  <text x="60" y="236" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">field      -&gt;  array key</text>
  <text x="60" y="258" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">method     -&gt;  function</text>
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">this/self  -&gt;  nameref (-n)</text>
  <text x="60" y="302" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">inherit.   -&gt;  not supported</text>
  <text x="60" y="324" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">new Obj()  -&gt;  declare -A name</text>
  <text x="60" y="346" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" font-style="italic">  + init function</text>
  <text x="60" y="366" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">destructor -&gt;  cleanup function</text>

  <!-- Object definition example -->
  <rect x="380" y="100" width="540" height="225" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="650" y="128" font-family="Arial, sans-serif" font-size="16" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Defining an Object</text>
  <text x="400" y="155" font-family="monospace" font-size="13" fill="var(--text)"># "Constructor" - creates and initializes</text>
  <text x="400" y="175" font-family="monospace" font-size="13" fill="var(--text)">person_new() {</text>
  <text x="400" y="195" font-family="monospace" font-size="13" fill="var(--text)">  local -n _self=$1</text>
  <text x="400" y="215" font-family="monospace" font-size="13" fill="var(--text)">  _self[name]="${2:-unknown}"</text>
  <text x="400" y="235" font-family="monospace" font-size="13" fill="var(--text)">  _self[age]="${3:-0}"</text>
  <text x="400" y="255" font-family="monospace" font-size="13" fill="var(--text)">  _self[email]="${4:-}"</text>
  <text x="400" y="275" font-family="monospace" font-size="13" fill="var(--text)">}</text>
  <text x="400" y="300" font-family="monospace" font-size="13" fill="var(--text)">declare -A alice</text>
  <text x="400" y="320" font-family="monospace" font-size="13" fill="var(--text)">person_new alice "Alice" 30 "a@x.com"</text>

  <!-- Methods example -->
  <rect x="380" y="345" width="540" height="230" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="650" y="373" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Defining Methods</text>
  <text x="400" y="400" font-family="monospace" font-size="13" fill="var(--text)"># "Method" - takes object by nameref</text>
  <text x="400" y="420" font-family="monospace" font-size="13" fill="var(--text)">person_greet() {</text>
  <text x="400" y="440" font-family="monospace" font-size="13" fill="var(--text)">  local -n _self=$1</text>
  <text x="400" y="460" font-family="monospace" font-size="13" fill="var(--text)">  echo "Hi, I am ${_self[name]}"</text>
  <text x="400" y="480" font-family="monospace" font-size="13" fill="var(--text)">  echo "Age: ${_self[age]}"</text>
  <text x="400" y="500" font-family="monospace" font-size="13" fill="var(--text)">}</text>
  <text x="400" y="525" font-family="monospace" font-size="13" fill="var(--text)"># "Method call"</text>
  <text x="400" y="545" font-family="monospace" font-size="13" fill="var(--text)">person_greet alice</text>
  <text x="400" y="565" font-family="monospace" font-size="13" fill="var(--text-muted)"># -&gt; Hi, I am Alice</text>

  <!-- Limitations and advice -->
  <rect x="960" y="100" width="280" height="215" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="128" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Limitations</text>
  <text x="978" y="155" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- No encapsulation</text>
  <text x="978" y="177" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- No inheritance</text>
  <text x="978" y="199" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- No polymorphism</text>
  <text x="978" y="221" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Nameref bugs with</text>
  <text x="978" y="241" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">  local var names</text>
  <text x="978" y="263" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Hard to debug</text>
  <text x="978" y="285" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Slower than compiled</text>
  <text x="978" y="307" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" font-style="italic">  languages</text>

  <rect x="960" y="335" width="280" height="135" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="363" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">When to Use</text>
  <text x="978" y="390" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Complex scripts that</text>
  <text x="978" y="410" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">  need data grouping</text>
  <text x="978" y="430" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- When Python/Perl are</text>
  <text x="978" y="450" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">  not available</text>
  <text x="978" y="470" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" font-style="italic">- Otherwise: use Python</text>

  <!-- Naming convention note -->
  <rect x="960" y="490" width="280" height="85" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Naming Convention</text>
  <text x="978" y="538" font-family="monospace" font-size="13" fill="var(--text)">classname_method()</text>
  <text x="978" y="558" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">e.g. person_greet</text>
  <text x="978" y="568" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">     stack_push, stack_pop</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="40" y="20" width="1200" height="55" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="54" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">OOP Patterns in Bash using Associative Arrays</text>

  <!-- OOP concept mapping - left side -->
  <rect x="40" y="100" width="300" height="280" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="128" font-family="Arial, sans-serif" font-size="16" fill="#6a1b9a" text-anchor="middle" font-weight="bold">OOP Concept Mapping</text>
  <text x="60" y="158" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">OOP           Bash</text>
  <line x1="60" y1="168" x2="320" y2="168" stroke="#8e24aa" stroke-width="1"/>
  <text x="60" y="192" font-family="Arial, sans-serif" font-size="13" fill="#333333">class      -&gt;  prefix convention</text>
  <text x="60" y="214" font-family="Arial, sans-serif" font-size="13" fill="#333333">object     -&gt;  assoc array</text>
  <text x="60" y="236" font-family="Arial, sans-serif" font-size="13" fill="#333333">field      -&gt;  array key</text>
  <text x="60" y="258" font-family="Arial, sans-serif" font-size="13" fill="#333333">method     -&gt;  function</text>
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="13" fill="#333333">this/self  -&gt;  nameref (-n)</text>
  <text x="60" y="302" font-family="Arial, sans-serif" font-size="13" fill="#333333">inherit.   -&gt;  not supported</text>
  <text x="60" y="324" font-family="Arial, sans-serif" font-size="13" fill="#333333">new Obj()  -&gt;  declare -A name</text>
  <text x="60" y="346" font-family="Arial, sans-serif" font-size="13" fill="#555555" font-style="italic">  + init function</text>
  <text x="60" y="366" font-family="Arial, sans-serif" font-size="13" fill="#333333">destructor -&gt;  cleanup function</text>

  <!-- Object definition example -->
  <rect x="380" y="100" width="540" height="225" rx="8" fill="url(#grad-surface)" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="128" font-family="Arial, sans-serif" font-size="16" fill="#6a1b9a" text-anchor="middle" font-weight="bold">Defining an Object</text>
  <text x="400" y="155" font-family="monospace" font-size="13" fill="#333333"># "Constructor" - creates and initializes</text>
  <text x="400" y="175" font-family="monospace" font-size="13" fill="#333333">person_new() {</text>
  <text x="400" y="195" font-family="monospace" font-size="13" fill="#333333">  local -n _self=$1</text>
  <text x="400" y="215" font-family="monospace" font-size="13" fill="#333333">  _self[name]="${2:-unknown}"</text>
  <text x="400" y="235" font-family="monospace" font-size="13" fill="#333333">  _self[age]="${3:-0}"</text>
  <text x="400" y="255" font-family="monospace" font-size="13" fill="#333333">  _self[email]="${4:-}"</text>
  <text x="400" y="275" font-family="monospace" font-size="13" fill="#333333">}</text>
  <text x="400" y="300" font-family="monospace" font-size="13" fill="#333333">declare -A alice</text>
  <text x="400" y="320" font-family="monospace" font-size="13" fill="#333333">person_new alice "Alice" 30 "a@x.com"</text>

  <!-- Methods example -->
  <rect x="380" y="345" width="540" height="230" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="373" font-family="Arial, sans-serif" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">Defining Methods</text>
  <text x="400" y="400" font-family="monospace" font-size="13" fill="#333333"># "Method" - takes object by nameref</text>
  <text x="400" y="420" font-family="monospace" font-size="13" fill="#333333">person_greet() {</text>
  <text x="400" y="440" font-family="monospace" font-size="13" fill="#333333">  local -n _self=$1</text>
  <text x="400" y="460" font-family="monospace" font-size="13" fill="#333333">  echo "Hi, I am ${_self[name]}"</text>
  <text x="400" y="480" font-family="monospace" font-size="13" fill="#333333">  echo "Age: ${_self[age]}"</text>
  <text x="400" y="500" font-family="monospace" font-size="13" fill="#333333">}</text>
  <text x="400" y="525" font-family="monospace" font-size="13" fill="#333333"># "Method call"</text>
  <text x="400" y="545" font-family="monospace" font-size="13" fill="#333333">person_greet alice</text>
  <text x="400" y="565" font-family="monospace" font-size="13" fill="#777777"># -&gt; Hi, I am Alice</text>

  <!-- Limitations and advice -->
  <rect x="960" y="100" width="280" height="215" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="128" font-family="Arial, sans-serif" font-size="15" fill="#e65100" text-anchor="middle" font-weight="bold">Limitations</text>
  <text x="978" y="155" font-family="Arial, sans-serif" font-size="13" fill="#333333">- No encapsulation</text>
  <text x="978" y="177" font-family="Arial, sans-serif" font-size="13" fill="#333333">- No inheritance</text>
  <text x="978" y="199" font-family="Arial, sans-serif" font-size="13" fill="#333333">- No polymorphism</text>
  <text x="978" y="221" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Nameref bugs with</text>
  <text x="978" y="241" font-family="Arial, sans-serif" font-size="13" fill="#333333">  local var names</text>
  <text x="978" y="263" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Hard to debug</text>
  <text x="978" y="285" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Slower than compiled</text>
  <text x="978" y="307" font-family="Arial, sans-serif" font-size="13" fill="#555555" font-style="italic">  languages</text>

  <rect x="960" y="335" width="280" height="135" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="363" font-family="Arial, sans-serif" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">When to Use</text>
  <text x="978" y="390" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Complex scripts that</text>
  <text x="978" y="410" font-family="Arial, sans-serif" font-size="13" fill="#333333">  need data grouping</text>
  <text x="978" y="430" font-family="Arial, sans-serif" font-size="13" fill="#333333">- When Python/Perl are</text>
  <text x="978" y="450" font-family="Arial, sans-serif" font-size="13" fill="#333333">  not available</text>
  <text x="978" y="470" font-family="Arial, sans-serif" font-size="13" fill="#555555" font-style="italic">- Otherwise: use Python</text>

  <!-- Naming convention note -->
  <rect x="960" y="490" width="280" height="85" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="515" font-family="Arial, sans-serif" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">Naming Convention</text>
  <text x="978" y="538" font-family="monospace" font-size="13" fill="#333333">classname_method()</text>
  <text x="978" y="558" font-family="Arial, sans-serif" font-size="12" fill="#555555">e.g. person_greet</text>
  <text x="978" y="568" font-family="Arial, sans-serif" font-size="12" fill="#555555">     stack_push, stack_pop</text>
</svg>

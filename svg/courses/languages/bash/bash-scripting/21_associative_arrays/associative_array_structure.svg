<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--surface)" rx="6"/>

  <!-- Declaration banner -->
  <rect x="40" y="18" width="1200" height="52" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="70" y="50" font-family="monospace" font-size="20" fill="var(--ok-accent)">declare</text>
  <text x="148" y="50" font-family="monospace" font-size="20" fill="var(--primary-accent)"> -A</text>
  <text x="186" y="50" font-family="monospace" font-size="20" fill="var(--primary-accent)"> user</text>
  <text x="280" y="50" font-family="monospace" font-size="14" fill="var(--text-muted)">    ← MUST use declare -A (without it, becomes an indexed array!)</text>

  <!-- Hash map visual -->
  <!-- Hash table container -->
  <rect x="40" y="90" width="520" height="490" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="40" y="90" width="520" height="48" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="126" width="520" height="12" fill="var(--primary-accent)" rx="6"/>
  <text x="300" y="122" font-family="sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hash Map Structure</text>

  <!-- KV rows -->
  <!-- [name] -> "Alice" -->
  <rect x="60" y="156" width="160" height="52" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="174" font-family="monospace" font-size="13" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[name]</text>
  <text x="140" y="194" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="220" y1="182" x2="320" y2="182" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="156" width="220" height="52" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="430" y="188" font-family="monospace" font-size="16" fill="var(--ok-accent)" text-anchor="middle">"Alice"</text>

  <!-- [age] -> "30" -->
  <rect x="60" y="228" width="160" height="52" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="246" font-family="monospace" font-size="13" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[age]</text>
  <text x="140" y="266" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="220" y1="254" x2="320" y2="254" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="228" width="220" height="52" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="430" y="260" font-family="monospace" font-size="16" fill="var(--ok-accent)" text-anchor="middle">"30"</text>

  <!-- [email] -> "alice@example.com" -->
  <rect x="60" y="300" width="160" height="52" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="318" font-family="monospace" font-size="13" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[email]</text>
  <text x="140" y="338" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="220" y1="326" x2="320" y2="326" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="300" width="220" height="52" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="430" y="330" font-family="monospace" font-size="14" fill="var(--ok-accent)" text-anchor="middle">"alice@example.com"</text>

  <!-- [role] -> "admin" -->
  <rect x="60" y="372" width="160" height="52" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="390" font-family="monospace" font-size="13" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[role]</text>
  <text x="140" y="410" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="220" y1="398" x2="320" y2="398" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="372" width="220" height="52" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="430" y="402" font-family="monospace" font-size="16" fill="var(--ok-accent)" text-anchor="middle">"admin"</text>

  <!-- Important note -->
  <rect x="60" y="440" width="480" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="300" y="462" font-family="sans-serif" font-size="13" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Order is NOT guaranteed!</text>
  <text x="300" y="480" font-family="sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">Associative arrays are hash tables — iteration order is random</text>

  <!-- Right panel: syntax -->
  <rect x="590" y="90" width="650" height="490" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="590" y="90" width="650" height="48" rx="6" fill="var(--ok-accent)"/>
  <rect x="590" y="126" width="650" height="12" fill="var(--ok-accent)" rx="6"/>
  <text x="915" y="122" font-family="sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Syntax Reference</text>

  <rect x="610" y="152" width="610" height="80" rx="6" fill="var(--code-bg)"/>
  <text x="630" y="174" font-family="monospace" font-size="12" fill="var(--text-muted)"># Declaration and initialization</text>
  <text x="630" y="193" font-family="monospace" font-size="13" fill="var(--ok-accent)">declare</text>
  <text x="689" y="193" font-family="monospace" font-size="13" fill="var(--primary-accent)"> -A user=([name]="Alice" [age]="30")</text>
  <text x="630" y="213" font-family="monospace" font-size="13" fill="var(--primary-accent)">user[email]="alice@example.com"</text>

  <rect x="610" y="248" width="610" height="80" rx="6" fill="var(--code-bg)"/>
  <text x="630" y="270" font-family="monospace" font-size="12" fill="var(--text-muted)"># Access and default value</text>
  <text x="630" y="289" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="669" y="289" font-family="monospace" font-size="13" fill="var(--primary-accent)"> "${user[name]}"</text>
  <text x="820" y="289" font-family="monospace" font-size="12" fill="var(--text-muted)">       # Alice</text>
  <text x="630" y="309" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="669" y="309" font-family="monospace" font-size="13" fill="var(--primary-accent)"> "${user[phone]:-N/A}"</text>
  <text x="820" y="309" font-family="monospace" font-size="12" fill="var(--text-muted)">  # N/A (missing key)</text>

  <rect x="610" y="344" width="610" height="96" rx="6" fill="var(--code-bg)"/>
  <text x="630" y="366" font-family="monospace" font-size="12" fill="var(--text-muted)"># Iterate over keys and values</text>
  <text x="630" y="385" font-family="monospace" font-size="13" fill="var(--ok-accent)">for</text>
  <text x="655" y="385" font-family="monospace" font-size="13" fill="var(--primary-accent)"> key in "${!user[@]}"; </text>
  <text x="800" y="385" font-family="monospace" font-size="13" fill="var(--ok-accent)">do</text>
  <text x="630" y="405" font-family="monospace" font-size="13" fill="var(--primary-accent)">  echo "$key = ${user[$key]}"</text>
  <text x="630" y="425" font-family="monospace" font-size="13" fill="var(--ok-accent)">done</text>
  <text x="630" y="430" font-family="monospace" font-size="12" fill="var(--text-muted)">       # all keys</text>

  <rect x="610" y="456" width="610" height="96" rx="6" fill="var(--code-bg)"/>
  <text x="630" y="478" font-family="monospace" font-size="12" fill="var(--text-muted)"># Check key / count / delete</text>
  <text x="630" y="497" font-family="monospace" font-size="13" fill="var(--ok-accent)">if</text>
  <text x="650" y="497" font-family="monospace" font-size="13" fill="var(--primary-accent)"> [[ -v user[name] ]]; </text>
  <text x="780" y="497" font-family="monospace" font-size="13" fill="var(--ok-accent)">then</text>
  <text x="813" y="497" font-family="monospace" font-size="13" fill="var(--text-muted)"> echo "has name"</text>
  <text x="630" y="517" font-family="monospace" font-size="13" fill="var(--ok-accent)">fi</text>
  <text x="630" y="537" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="669" y="537" font-family="monospace" font-size="13" fill="var(--primary-accent)"> "${#user[@]}"</text>
  <text x="790" y="537" font-family="monospace" font-size="12" fill="var(--text-muted)">          # count pairs</text>
  <text x="630" y="537" font-family="monospace" font-size="12" fill="var(--text-muted)">           # count pairs</text>
  <text x="630" y="540" font-family="monospace" font-size="13" fill="var(--ok-accent)">unset</text>
  <text x="676" y="540" font-family="monospace" font-size="13" fill="var(--primary-accent)"> 'user[age]'</text>
  <text x="800" y="540" font-family="monospace" font-size="12" fill="var(--text-muted)">       # delete key</text>

  <!-- vs indexed array note -->
  <rect x="610" y="562" width="610" height="16" rx="6" fill="transparent"/>
  <text x="630" y="574" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="669" y="574" font-family="monospace" font-size="13" fill="var(--primary-accent)"> "${!user[@]}"</text>
  <text x="800" y="574" font-family="monospace" font-size="12" fill="var(--text-muted)">           # all keys</text>
</svg>

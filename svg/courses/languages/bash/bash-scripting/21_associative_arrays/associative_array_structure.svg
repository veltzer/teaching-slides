<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--surface-light)"/>

  <!-- Declaration banner -->
  <rect x="40" y="18" width="1200" height="52" rx="10" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="70" y="50" font-family="monospace" font-size="20" fill="var(--ok-tint)">declare</text>
  <text x="148" y="50" font-family="monospace" font-size="20" fill="var(--primary-lt)"> -A</text>
  <text x="186" y="50" font-family="monospace" font-size="20" fill="var(--primary-tint)"> user</text>
  <text x="280" y="50" font-family="monospace" font-size="14" fill="var(--text-mid)">    ← MUST use declare -A (without it, becomes an indexed array!)</text>

  <!-- Hash map visual -->
  <!-- Hash table container -->
  <rect x="40" y="90" width="520" height="490" rx="12" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="40" y="90" width="520" height="48" rx="12" fill="url(#grad-primary)"/>
  <rect x="40" y="126" width="520" height="12" fill="var(--primary-dk)"/>
  <text x="300" y="122" font-family="sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hash Map Structure</text>

  <!-- KV rows -->
  <!-- [name] -> "Alice" -->
  <rect x="60" y="156" width="160" height="52" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
  <text x="140" y="174" font-family="monospace" font-size="13" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">[name]</text>
  <text x="140" y="194" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="220" y1="182" x2="320" y2="182" stroke="var(--primary)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="320" y="156" width="220" height="52" rx="8" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="430" y="188" font-family="monospace" font-size="16" fill="var(--ok-dk)" text-anchor="middle">"Alice"</text>

  <!-- [age] -> "30" -->
  <rect x="60" y="228" width="160" height="52" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
  <text x="140" y="246" font-family="monospace" font-size="13" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">[age]</text>
  <text x="140" y="266" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="220" y1="254" x2="320" y2="254" stroke="var(--primary)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="320" y="228" width="220" height="52" rx="8" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="430" y="260" font-family="monospace" font-size="16" fill="var(--ok-dk)" text-anchor="middle">"30"</text>

  <!-- [email] -> "alice@example.com" -->
  <rect x="60" y="300" width="160" height="52" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
  <text x="140" y="318" font-family="monospace" font-size="13" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">[email]</text>
  <text x="140" y="338" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="220" y1="326" x2="320" y2="326" stroke="var(--primary)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="320" y="300" width="220" height="52" rx="8" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="430" y="330" font-family="monospace" font-size="14" fill="var(--ok-dk)" text-anchor="middle">"alice@example.com"</text>

  <!-- [role] -> "admin" -->
  <rect x="60" y="372" width="160" height="52" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
  <text x="140" y="390" font-family="monospace" font-size="13" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">[role]</text>
  <text x="140" y="410" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="220" y1="398" x2="320" y2="398" stroke="var(--primary)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="320" y="372" width="220" height="52" rx="8" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="430" y="402" font-family="monospace" font-size="16" fill="var(--ok-dk)" text-anchor="middle">"admin"</text>

  <!-- Important note -->
  <rect x="60" y="440" width="480" height="50" rx="8" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="1.5"/>
  <text x="300" y="462" font-family="sans-serif" font-size="13" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">Order is NOT guaranteed!</text>
  <text x="300" y="480" font-family="sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">Associative arrays are hash tables — iteration order is random</text>

  <!-- Right panel: syntax -->
  <rect x="590" y="90" width="650" height="490" rx="12" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="590" y="90" width="650" height="48" rx="12" fill="var(--ok-dk)"/>
  <rect x="590" y="126" width="650" height="12" fill="var(--ok-dk)"/>
  <text x="915" y="122" font-family="sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Syntax Reference</text>

  <rect x="610" y="152" width="610" height="80" rx="8" fill="var(--code-bg)"/>
  <text x="630" y="174" font-family="monospace" font-size="12" fill="var(--text-mid)"># Declaration and initialization</text>
  <text x="630" y="193" font-family="monospace" font-size="13" fill="var(--ok-tint)">declare</text>
  <text x="689" y="193" font-family="monospace" font-size="13" fill="var(--primary-lt)"> -A user=([name]="Alice" [age]="30")</text>
  <text x="630" y="213" font-family="monospace" font-size="13" fill="var(--primary-lt)">user[email]="alice@example.com"</text>

  <rect x="610" y="248" width="610" height="80" rx="8" fill="var(--code-bg)"/>
  <text x="630" y="270" font-family="monospace" font-size="12" fill="var(--text-mid)"># Access and default value</text>
  <text x="630" y="289" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="669" y="289" font-family="monospace" font-size="13" fill="var(--primary-lt)"> "${user[name]}"</text>
  <text x="820" y="289" font-family="monospace" font-size="12" fill="var(--text-mid)">       # Alice</text>
  <text x="630" y="309" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="669" y="309" font-family="monospace" font-size="13" fill="var(--primary-lt)"> "${user[phone]:-N/A}"</text>
  <text x="820" y="309" font-family="monospace" font-size="12" fill="var(--text-mid)">  # N/A (missing key)</text>

  <rect x="610" y="344" width="610" height="96" rx="8" fill="var(--code-bg)"/>
  <text x="630" y="366" font-family="monospace" font-size="12" fill="var(--text-mid)"># Iterate over keys and values</text>
  <text x="630" y="385" font-family="monospace" font-size="13" fill="var(--ok-tint)">for</text>
  <text x="655" y="385" font-family="monospace" font-size="13" fill="var(--primary-lt)"> key in "${!user[@]}"; </text>
  <text x="800" y="385" font-family="monospace" font-size="13" fill="var(--ok-tint)">do</text>
  <text x="630" y="405" font-family="monospace" font-size="13" fill="var(--primary-lt)">  echo "$key = ${user[$key]}"</text>
  <text x="630" y="425" font-family="monospace" font-size="13" fill="var(--ok-tint)">done</text>
  <text x="630" y="430" font-family="monospace" font-size="12" fill="var(--text-mid)">       # all keys</text>

  <rect x="610" y="456" width="610" height="96" rx="8" fill="var(--code-bg)"/>
  <text x="630" y="478" font-family="monospace" font-size="12" fill="var(--text-mid)"># Check key / count / delete</text>
  <text x="630" y="497" font-family="monospace" font-size="13" fill="var(--ok-tint)">if</text>
  <text x="650" y="497" font-family="monospace" font-size="13" fill="var(--primary-lt)"> [[ -v user[name] ]]; </text>
  <text x="780" y="497" font-family="monospace" font-size="13" fill="var(--ok-tint)">then</text>
  <text x="813" y="497" font-family="monospace" font-size="13" fill="var(--text-mid)"> echo "has name"</text>
  <text x="630" y="517" font-family="monospace" font-size="13" fill="var(--ok-tint)">fi</text>
  <text x="630" y="537" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="669" y="537" font-family="monospace" font-size="13" fill="var(--primary-lt)"> "${#user[@]}"</text>
  <text x="790" y="537" font-family="monospace" font-size="12" fill="var(--text-mid)">          # count pairs</text>
  <text x="630" y="537" font-family="monospace" font-size="12" fill="var(--text-mid)">           # count pairs</text>
  <text x="630" y="540" font-family="monospace" font-size="13" fill="var(--ok-tint)">unset</text>
  <text x="676" y="540" font-family="monospace" font-size="13" fill="var(--primary-lt)"> 'user[age]'</text>
  <text x="800" y="540" font-family="monospace" font-size="12" fill="var(--text-mid)">       # delete key</text>

  <!-- vs indexed array note -->
  <rect x="610" y="562" width="610" height="16" rx="4" fill="transparent"/>
  <text x="630" y="574" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="669" y="574" font-family="monospace" font-size="13" fill="var(--primary-lt)"> "${!user[@]}"</text>
  <text x="800" y="574" font-family="monospace" font-size="12" fill="var(--text-mid)">           # all keys</text>
</svg>

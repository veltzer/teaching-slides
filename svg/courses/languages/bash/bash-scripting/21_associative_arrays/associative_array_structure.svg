<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Declaration banner -->
  <rect x="40" y="40" width="1200" height="53.66548" rx="6.612831" fill="var(--code-bg)"/>
  <text x="70" y="73.024911" font-size="20.317814" fill="var(--ok-accent)" font-family="Courier New, monospace">declare</text>
  <text x="148" y="73.024911" font-size="20.317814" fill="var(--primary-accent)" font-family="Courier New, monospace"> -A</text>
  <text x="186" y="73.024911" font-size="20.317814" fill="var(--primary-accent)" font-family="Courier New, monospace"> user</text>
  <text x="280" y="73.024911" font-size="14.222437" fill="var(--text-muted)" font-family="Courier New, monospace">    ← declare -A required (else indexed!)</text>

  <!-- Hash map visual -->
  <!-- Hash table container -->
  <rect x="40" y="114.30605" width="520" height="505.69395" rx="6.612831" fill="var(--bg)"/>
  <rect x="40" y="114.30605" width="520" height="49.537367" rx="6.612831" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="151.459075" width="520" height="12.384342" fill="var(--primary-accent)" rx="6.612831"/>
  <text x="300" y="147.330961" font-size="18.286021" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Hash Map Structure</text>

  <!-- KV rows -->
  <!-- [name] -> "Alice" -->
  <rect x="60" y="182.419929" width="160" height="53.66548" rx="6.612831" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="200.996441" font-size="13.206596" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">[name]</text>
  <line x1="220" y1="209.252669" x2="320" y2="209.252669" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="182.419929" width="220" height="53.66548" rx="6.612831" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="215.44484" font-size="16.254229" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">"Alice"</text>

  <!-- [age] -> "30" -->
  <rect x="60" y="256.725979" width="160" height="53.66548" rx="6.612831" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="275.302491" font-size="13.206596" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">[age]</text>
  <text x="140" y="295.94306" font-size="11.174803" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif"/>
  <line x1="220" y1="283.558719" x2="320" y2="283.558719" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="256.725979" width="220" height="53.66548" rx="6.612831" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="289.75089" font-size="16.254229" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">"30"</text>

  <!-- [email] -> "alice@example.com" -->
  <rect x="60" y="331.032028" width="160" height="53.66548" rx="6.612831" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="349.608541" font-size="13.206596" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">[email]</text>
  <text x="140" y="370.24911" font-size="11.174803" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif"/>
  <line x1="220" y1="357.864769" x2="320" y2="357.864769" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="331.032028" width="220" height="53.66548" rx="6.612831" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="361.992883" font-size="14.222437" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">"a@x.com"</text>

  <!-- [role] -> "admin" -->
  <rect x="60" y="405.338078" width="160" height="53.66548" rx="6.612831" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="423.914591" font-size="13.206596" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">[role]</text>
  <text x="140" y="444.55516" font-size="11.174803" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif"/>
  <line x1="220" y1="432.170819" x2="320" y2="432.170819" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="405.338078" width="220" height="53.66548" rx="6.612831" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="436.298932" font-size="16.254229" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">"admin"</text>

  <!-- Important note -->
  <rect x="60" y="475.516014" width="480" height="51.601423" rx="6.612831" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="498.220641" font-size="13.206596" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Order is NOT guaranteed!</text>
  <text x="300" y="516.797153" font-size="12.190644" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Hash table — iteration order random</text>

  <!-- Right panel: syntax -->
  <rect x="590" y="114.30605" width="650" height="505.69395" rx="6.612831" fill="var(--bg)"/>
  <rect x="590" y="114.30605" width="650" height="49.537367" rx="6.612831" fill="var(--ok-accent)"/>
  <rect x="590" y="151.459075" width="650" height="12.384342" fill="var(--ok-accent)" rx="6.612831"/>
  <text x="915" y="147.330961" font-size="18.286021" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Syntax Reference</text>

  <rect x="610" y="178.291815" width="610" height="82.562278" rx="6.612831" fill="var(--code-bg)"/>
  <text x="630" y="200.996441" font-size="12.190644" fill="var(--text-muted)" font-family="Courier New, monospace"># Declare + init</text>
  <text x="630" y="220.604925" font-size="13.206596" fill="var(--ok-accent)" font-family="Courier New, monospace">declare</text>
  <text x="689" y="220.604925" font-size="13.206596" fill="var(--primary-accent)" font-family="Courier New, monospace"> -A user=([name]="Alice")</text>
  <text x="630" y="241.245495" font-size="13.206596" fill="var(--primary-accent)" font-family="Courier New, monospace">user[age]="30"</text>

  <rect x="610" y="277.366548" width="610" height="82.562278" rx="6.612831" fill="var(--code-bg)"/>
  <text x="630" y="300.071174" font-size="12.190644" fill="var(--text-muted)" font-family="Courier New, monospace"># Access</text>
  <text x="630" y="319.679658" font-size="13.206596" fill="var(--ok-accent)" font-family="Courier New, monospace">echo</text>
  <text x="669" y="319.679658" font-size="13.206596" fill="var(--primary-accent)" font-family="Courier New, monospace"> "${user[name]}"</text>
  <text x="820" y="319.679658" font-size="12.190644" fill="var(--text-muted)" font-family="Courier New, monospace">       # Alice</text>
  <text x="630" y="340.320228" font-size="13.206596" fill="var(--ok-accent)" font-family="Courier New, monospace">echo</text>
  <text x="669" y="340.320228" font-size="13.206596" fill="var(--primary-accent)" font-family="Courier New, monospace"> "${user[phone]:-N/A}"</text>

  <rect x="610" y="376.441281" width="610" height="99.074733" rx="6.612831" fill="var(--code-bg)"/>
  <text x="630" y="399.145907" font-size="12.190644" fill="var(--text-muted)" font-family="Courier New, monospace"># Iterate</text>
  <text x="630" y="418.754391" font-size="13.206596" fill="var(--primary-accent)" font-family="Courier New, monospace">for k in "${!user[@]}"; do</text>
  <text x="630" y="439.394961" font-size="13.206596" fill="var(--primary-accent)" font-family="Courier New, monospace">  echo "$k=${user[$k]}"</text>
  <text x="630" y="460.03553" font-size="13.206596" fill="var(--ok-accent)" font-family="Courier New, monospace">done</text>
  <text x="630" y="465.19573" font-size="12.190644" fill="var(--text-muted)" font-family="Courier New, monospace"/>

  <rect x="610" y="492.02847" width="610" height="99.074733" rx="6.612831" fill="var(--code-bg)"/>
  <text x="630" y="514.733096" font-size="12.190644" fill="var(--text-muted)" font-family="Courier New, monospace"># Check/count/delete</text>
  <text x="630" y="534.34158" font-size="13.206596" fill="var(--primary-accent)" font-family="Courier New, monospace">[[ -v user[name] ]]</text>
  <text x="630" y="575.622719" font-size="13.206596" fill="var(--ok-accent)" font-family="Courier New, monospace">echo</text>
  <text x="669" y="575.622719" font-size="13.206596" fill="var(--primary-accent)" font-family="Courier New, monospace"> "${#user[@]}"</text>
  <text x="790" y="575.622719" font-size="12.190644" fill="var(--text-muted)" font-family="Courier New, monospace">          # count</text>
  <text x="630" y="575.622719" font-size="12.190644" fill="var(--text-muted)" font-family="Courier New, monospace"/>
  <text x="630" y="578.718861" font-size="13.206596" fill="var(--ok-accent)" font-family="Courier New, monospace">unset</text>
  <text x="676" y="578.718861" font-size="13.206596" fill="var(--primary-accent)" font-family="Courier New, monospace"> 'user[age]'</text>
  <text x="800" y="578.718861" font-size="12.190644" fill="var(--text-muted)" font-family="Courier New, monospace">       # delete</text>

  <!-- vs indexed array note -->
  <rect x="610" y="601.423488" width="610" height="16.512456" rx="6.612831" fill="transparent"/>
  <text x="630" y="613.807829" font-size="13.206596" fill="var(--ok-accent)" font-family="Courier New, monospace">echo</text>
  <text x="669" y="613.807829" font-size="13.206596" fill="var(--primary-accent)" font-family="Courier New, monospace"> "${!user[@]}"</text>
</svg>

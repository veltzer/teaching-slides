<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#f8f9fa"/>

  <!-- Declaration banner -->
  <rect x="40" y="18" width="1200" height="52" rx="10" fill="#1e1e2e" filter="url(#shadow)"/>
  <text x="70" y="50" font-family="monospace" font-size="20" fill="#a6e3a1">declare</text>
  <text x="148" y="50" font-family="monospace" font-size="20" fill="#cdd6f4"> -A</text>
  <text x="186" y="50" font-family="monospace" font-size="20" fill="#89dceb"> user</text>
  <text x="280" y="50" font-family="monospace" font-size="14" fill="#585b70">    ← MUST use declare -A (without it, becomes an indexed array!)</text>

  <!-- Hash map visual -->
  <!-- Hash table container -->
  <rect x="40" y="90" width="520" height="490" rx="12" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="40" y="90" width="520" height="48" rx="12" fill="url(#grad-accent)"/>
  <rect x="40" y="126" width="520" height="12" fill="#1565c0"/>
  <text x="300" y="122" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Hash Map Structure</text>

  <!-- KV rows -->
  <!-- [name] -> "Alice" -->
  <rect x="60" y="156" width="160" height="52" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="140" y="174" font-family="monospace" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold">[name]</text>
  <text x="140" y="194" font-family="sans-serif" font-size="11" fill="#555555" text-anchor="middle">string key</text>
  <line x1="220" y1="182" x2="320" y2="182" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="320" y="156" width="220" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="430" y="188" font-family="monospace" font-size="16" fill="#2e7d32" text-anchor="middle">"Alice"</text>

  <!-- [age] -> "30" -->
  <rect x="60" y="228" width="160" height="52" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="140" y="246" font-family="monospace" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold">[age]</text>
  <text x="140" y="266" font-family="sans-serif" font-size="11" fill="#555555" text-anchor="middle">string key</text>
  <line x1="220" y1="254" x2="320" y2="254" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="320" y="228" width="220" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="430" y="260" font-family="monospace" font-size="16" fill="#2e7d32" text-anchor="middle">"30"</text>

  <!-- [email] -> "alice@example.com" -->
  <rect x="60" y="300" width="160" height="52" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="140" y="318" font-family="monospace" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold">[email]</text>
  <text x="140" y="338" font-family="sans-serif" font-size="11" fill="#555555" text-anchor="middle">string key</text>
  <line x1="220" y1="326" x2="320" y2="326" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="320" y="300" width="220" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="430" y="330" font-family="monospace" font-size="14" fill="#2e7d32" text-anchor="middle">"alice@example.com"</text>

  <!-- [role] -> "admin" -->
  <rect x="60" y="372" width="160" height="52" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="140" y="390" font-family="monospace" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold">[role]</text>
  <text x="140" y="410" font-family="sans-serif" font-size="11" fill="#555555" text-anchor="middle">string key</text>
  <line x1="220" y1="398" x2="320" y2="398" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="320" y="372" width="220" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="430" y="402" font-family="monospace" font-size="16" fill="#2e7d32" text-anchor="middle">"admin"</text>

  <!-- Important note -->
  <rect x="60" y="440" width="480" height="50" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="300" y="462" font-family="sans-serif" font-size="13" fill="#e65100" text-anchor="middle" font-weight="bold">Order is NOT guaranteed!</text>
  <text x="300" y="480" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">Associative arrays are hash tables — iteration order is random</text>

  <!-- Right panel: syntax -->
  <rect x="590" y="90" width="650" height="490" rx="12" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="590" y="90" width="650" height="48" rx="12" fill="#2e7d32"/>
  <rect x="590" y="126" width="650" height="12" fill="#2e7d32"/>
  <text x="915" y="122" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Syntax Reference</text>

  <rect x="610" y="152" width="610" height="80" rx="8" fill="#1e1e2e"/>
  <text x="630" y="174" font-family="monospace" font-size="12" fill="#585b70"># Declaration and initialization</text>
  <text x="630" y="193" font-family="monospace" font-size="13" fill="#a6e3a1">declare</text>
  <text x="689" y="193" font-family="monospace" font-size="13" fill="#cdd6f4"> -A user=([name]="Alice" [age]="30")</text>
  <text x="630" y="213" font-family="monospace" font-size="13" fill="#cdd6f4">user[email]="alice@example.com"</text>

  <rect x="610" y="248" width="610" height="80" rx="8" fill="#1e1e2e"/>
  <text x="630" y="270" font-family="monospace" font-size="12" fill="#585b70"># Access and default value</text>
  <text x="630" y="289" font-family="monospace" font-size="13" fill="#a6e3a1">echo</text>
  <text x="669" y="289" font-family="monospace" font-size="13" fill="#cdd6f4"> "${user[name]}"</text>
  <text x="820" y="289" font-family="monospace" font-size="12" fill="#585b70">       # Alice</text>
  <text x="630" y="309" font-family="monospace" font-size="13" fill="#a6e3a1">echo</text>
  <text x="669" y="309" font-family="monospace" font-size="13" fill="#cdd6f4"> "${user[phone]:-N/A}"</text>
  <text x="820" y="309" font-family="monospace" font-size="12" fill="#585b70">  # N/A (missing key)</text>

  <rect x="610" y="344" width="610" height="96" rx="8" fill="#1e1e2e"/>
  <text x="630" y="366" font-family="monospace" font-size="12" fill="#585b70"># Iterate over keys and values</text>
  <text x="630" y="385" font-family="monospace" font-size="13" fill="#a6e3a1">for</text>
  <text x="655" y="385" font-family="monospace" font-size="13" fill="#cdd6f4"> key in "${!user[@]}"; </text>
  <text x="800" y="385" font-family="monospace" font-size="13" fill="#a6e3a1">do</text>
  <text x="630" y="405" font-family="monospace" font-size="13" fill="#cdd6f4">  echo "$key = ${user[$key]}"</text>
  <text x="630" y="425" font-family="monospace" font-size="13" fill="#a6e3a1">done</text>
  <text x="630" y="430" font-family="monospace" font-size="12" fill="#585b70">       # all keys</text>

  <rect x="610" y="456" width="610" height="96" rx="8" fill="#1e1e2e"/>
  <text x="630" y="478" font-family="monospace" font-size="12" fill="#585b70"># Check key / count / delete</text>
  <text x="630" y="497" font-family="monospace" font-size="13" fill="#a6e3a1">if</text>
  <text x="650" y="497" font-family="monospace" font-size="13" fill="#cdd6f4"> [[ -v user[name] ]]; </text>
  <text x="780" y="497" font-family="monospace" font-size="13" fill="#a6e3a1">then</text>
  <text x="813" y="497" font-family="monospace" font-size="13" fill="#585b70"> echo "has name"</text>
  <text x="630" y="517" font-family="monospace" font-size="13" fill="#a6e3a1">fi</text>
  <text x="630" y="537" font-family="monospace" font-size="13" fill="#a6e3a1">echo</text>
  <text x="669" y="537" font-family="monospace" font-size="13" fill="#cdd6f4"> "${#user[@]}"</text>
  <text x="790" y="537" font-family="monospace" font-size="12" fill="#585b70">          # count pairs</text>
  <text x="630" y="537" font-family="monospace" font-size="12" fill="#585b70">           # count pairs</text>
  <text x="630" y="540" font-family="monospace" font-size="13" fill="#a6e3a1">unset</text>
  <text x="676" y="540" font-family="monospace" font-size="13" fill="#cdd6f4"> 'user[age]'</text>
  <text x="800" y="540" font-family="monospace" font-size="12" fill="#585b70">       # delete key</text>

  <!-- vs indexed array note -->
  <rect x="610" y="562" width="610" height="16" rx="4" fill="transparent"/>
  <text x="630" y="574" font-family="monospace" font-size="13" fill="#a6e3a1">echo</text>
  <text x="669" y="574" font-family="monospace" font-size="13" fill="#cdd6f4"> "${!user[@]}"</text>
  <text x="800" y="574" font-family="monospace" font-size="12" fill="#585b70">           # all keys</text>
</svg>

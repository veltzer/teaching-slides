<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" x="40" y="40"/>

  <!-- Declaration banner -->
  <rect x="77.5" y="56.3125" width="1125" height="47.125" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="105.625" y="85.3125" font-family="monospace" font-size="18.4349" fill="var(--ok-accent)">declare</text>
  <text x="178.75" y="85.3125" font-family="monospace" font-size="18.4349" fill="var(--primary-accent)"> -A</text>
  <text x="214.375" y="85.3125" font-family="monospace" font-size="18.4349" fill="var(--primary-accent)"> user</text>
  <text x="302.5" y="85.3125" font-family="monospace" font-size="12.9044" fill="var(--text-muted)">    ← MUST use declare -A (without it, becomes an indexed array!)</text>

  <!-- Hash map visual -->
  <!-- Hash table container -->
  <rect x="77.5" y="121.5625" width="487.5" height="444.0625" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="77.5" y="121.5625" width="487.5" height="43.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="77.5" y="154.1875" width="487.5" height="10.875" fill="var(--primary-accent)" rx="6"/>
  <text x="321.25" y="150.5625" font-family="sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hash Map Structure</text>

  <!-- KV rows -->
  <!-- [name] -> "Alice" -->
  <rect x="96.25" y="181.375" width="150" height="47.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="171.25" y="197.6875" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[name]</text>
  <text x="171.25" y="215.8125" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="246.25" y1="204.9375" x2="340" y2="204.9375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="181.375" width="206.25" height="47.125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="443.125" y="210.375" font-family="monospace" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle">"Alice"</text>

  <!-- [age] -> "30" -->
  <rect x="96.25" y="246.625" width="150" height="47.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="171.25" y="262.9375" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[age]</text>
  <text x="171.25" y="281.0625" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="246.25" y1="270.1875" x2="340" y2="270.1875" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="246.625" width="206.25" height="47.125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="443.125" y="275.625" font-family="monospace" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle">"30"</text>

  <!-- [email] -> "alice@example.com" -->
  <rect x="96.25" y="311.875" width="150" height="47.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="171.25" y="328.1875" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[email]</text>
  <text x="171.25" y="346.3125" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="246.25" y1="335.4375" x2="340" y2="335.4375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="311.875" width="206.25" height="47.125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="443.125" y="339.0625" font-family="monospace" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">"alice@example.com"</text>

  <!-- [role] -> "admin" -->
  <rect x="96.25" y="377.125" width="150" height="47.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="171.25" y="393.4375" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[role]</text>
  <text x="171.25" y="411.5625" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="246.25" y1="400.6875" x2="340" y2="400.6875" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="377.125" width="206.25" height="47.125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="443.125" y="404.3125" font-family="monospace" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle">"admin"</text>

  <!-- Important note -->
  <rect x="96.25" y="438.75" width="450" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="321.25" y="458.6875" font-family="sans-serif" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Order is NOT guaranteed!</text>
  <text x="321.25" y="475" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Associative arrays are hash tables — iteration order is random</text>

  <!-- Right panel: syntax -->
  <rect x="593.125" y="121.5625" width="609.375" height="444.0625" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="593.125" y="121.5625" width="609.375" height="43.5" rx="6" fill="var(--ok-accent)"/>
  <rect x="593.125" y="154.1875" width="609.375" height="10.875" fill="var(--ok-accent)" rx="6"/>
  <text x="897.8125" y="150.5625" font-family="sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">Syntax Reference</text>

  <rect x="611.875" y="177.75" width="571.875" height="72.5" rx="6" fill="var(--code-bg)"/>
  <text x="630.625" y="197.6875" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Declaration and initialization</text>
  <text x="630.625" y="214.9062" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">declare</text>
  <text x="685.9375" y="214.9062" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> -A user=([name]="Alice" [age]="30")</text>
  <text x="630.625" y="233.0312" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">user[email]="alice@example.com"</text>

  <rect x="611.875" y="264.75" width="571.875" height="72.5" rx="6" fill="var(--code-bg)"/>
  <text x="630.625" y="284.6875" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Access and default value</text>
  <text x="630.625" y="301.9062" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="667.1875" y="301.9062" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> "${user[name]}"</text>
  <text x="808.75" y="301.9062" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">       # Alice</text>
  <text x="630.625" y="320.0312" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="667.1875" y="320.0312" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> "${user[phone]:-N/A}"</text>
  <text x="808.75" y="320.0312" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">  # N/A (missing key)</text>

  <rect x="611.875" y="351.75" width="571.875" height="87" rx="6" fill="var(--code-bg)"/>
  <text x="630.625" y="371.6875" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Iterate over keys and values</text>
  <text x="630.625" y="388.9062" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">for</text>
  <text x="654.0625" y="388.9062" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> key in "${!user[@]}"; </text>
  <text x="790" y="388.9062" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">do</text>
  <text x="630.625" y="407.0312" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">  echo "$key = ${user[$key]}"</text>
  <text x="630.625" y="425.1562" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">done</text>
  <text x="630.625" y="429.6875" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">       # all keys</text>

  <rect x="611.875" y="453.25" width="571.875" height="87" rx="6" fill="var(--code-bg)"/>
  <text x="630.625" y="473.1875" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Check key / count / delete</text>
  <text x="630.625" y="490.4062" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">if</text>
  <text x="649.375" y="490.4062" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> [[ -v user[name] ]]; </text>
  <text x="771.25" y="490.4062" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">then</text>
  <text x="802.1875" y="490.4062" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"> echo "has name"</text>
  <text x="630.625" y="508.5312" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">fi</text>
  <text x="630.625" y="526.6562" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="667.1875" y="526.6562" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> "${#user[@]}"</text>
  <text x="780.625" y="526.6562" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">          # count pairs</text>
  <text x="630.625" y="526.6562" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">           # count pairs</text>
  <text x="630.625" y="529.375" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">unset</text>
  <text x="673.75" y="529.375" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> 'user[age]'</text>
  <text x="790" y="529.375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">       # delete key</text>

  <!-- vs indexed array note -->
  <rect x="611.875" y="549.3125" width="571.875" height="14.5" rx="6" fill="transparent"/>
  <text x="630.625" y="560.1875" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="667.1875" y="560.1875" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> "${!user[@]}"</text>
  <text x="790" y="560.1875" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">           # all keys</text>
</svg>

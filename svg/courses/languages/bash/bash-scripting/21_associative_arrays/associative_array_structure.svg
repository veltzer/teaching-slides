<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- Declaration banner -->
  <rect x="40" y="40" width="1200" height="53.66548" rx="6.612831" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="70" y="73.024911" font-family="monospace" font-size="20.317814" fill="var(--ok-accent)">declare</text>
  <text x="148" y="73.024911" font-family="monospace" font-size="20.317814" fill="var(--primary-accent)"> -A</text>
  <text x="186" y="73.024911" font-family="monospace" font-size="20.317814" fill="var(--primary-accent)"> user</text>
  <text x="280" y="73.024911" font-family="monospace" font-size="14.222437" fill="var(--text-muted)">    ← MUST use declare -A (without it, becomes an indexed array!)</text>

  <!-- Hash map visual -->
  <!-- Hash table container -->
  <rect x="40" y="114.30605" width="520" height="505.69395" rx="6.612831" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="40" y="114.30605" width="520" height="49.537367" rx="6.612831" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="151.459075" width="520" height="12.384342" fill="var(--primary-accent)" rx="6.612831"/>
  <text x="300" y="147.330961" font-family="sans-serif" font-size="18.286021" font-weight="bold" fill="var(--bg)" text-anchor="middle">Hash Map Structure</text>

  <!-- KV rows -->
  <!-- [name] -> "Alice" -->
  <rect x="60" y="182.419929" width="160" height="53.66548" rx="6.612831" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="200.996441" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[name]</text>
  <text x="140" y="221.637011" font-family="sans-serif" font-size="11.174803" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="220" y1="209.252669" x2="320" y2="209.252669" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="182.419929" width="220" height="53.66548" rx="6.612831" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="430" y="215.44484" font-family="monospace" font-size="16.254229" fill="var(--ok-accent)" text-anchor="middle">"Alice"</text>

  <!-- [age] -> "30" -->
  <rect x="60" y="256.725979" width="160" height="53.66548" rx="6.612831" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="275.302491" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[age]</text>
  <text x="140" y="295.94306" font-family="sans-serif" font-size="11.174803" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="220" y1="283.558719" x2="320" y2="283.558719" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="256.725979" width="220" height="53.66548" rx="6.612831" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="430" y="289.75089" font-family="monospace" font-size="16.254229" fill="var(--ok-accent)" text-anchor="middle">"30"</text>

  <!-- [email] -> "alice@example.com" -->
  <rect x="60" y="331.032028" width="160" height="53.66548" rx="6.612831" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="349.608541" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[email]</text>
  <text x="140" y="370.24911" font-family="sans-serif" font-size="11.174803" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="220" y1="357.864769" x2="320" y2="357.864769" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="331.032028" width="220" height="53.66548" rx="6.612831" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="430" y="361.992883" font-family="monospace" font-size="14.222437" fill="var(--ok-accent)" text-anchor="middle">"alice@example.com"</text>

  <!-- [role] -> "admin" -->
  <rect x="60" y="405.338078" width="160" height="53.66548" rx="6.612831" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="423.914591" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[role]</text>
  <text x="140" y="444.55516" font-family="sans-serif" font-size="11.174803" fill="var(--text-muted)" text-anchor="middle">string key</text>
  <line x1="220" y1="432.170819" x2="320" y2="432.170819" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="405.338078" width="220" height="53.66548" rx="6.612831" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="430" y="436.298932" font-family="monospace" font-size="16.254229" fill="var(--ok-accent)" text-anchor="middle">"admin"</text>

  <!-- Important note -->
  <rect x="60" y="475.516014" width="480" height="51.601423" rx="6.612831" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="300" y="498.220641" font-family="sans-serif" font-size="13.206596" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Order is NOT guaranteed!</text>
  <text x="300" y="516.797153" font-family="sans-serif" font-size="12.190644" fill="var(--text-muted)" text-anchor="middle">Associative arrays are hash tables — iteration order is random</text>

  <!-- Right panel: syntax -->
  <rect x="590" y="114.30605" width="650" height="505.69395" rx="6.612831" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="590" y="114.30605" width="650" height="49.537367" rx="6.612831" fill="var(--ok-accent)"/>
  <rect x="590" y="151.459075" width="650" height="12.384342" fill="var(--ok-accent)" rx="6.612831"/>
  <text x="915" y="147.330961" font-family="sans-serif" font-size="18.286021" font-weight="bold" fill="var(--bg)" text-anchor="middle">Syntax Reference</text>

  <rect x="610" y="178.291815" width="610" height="82.562278" rx="6.612831" fill="var(--code-bg)"/>
  <text x="630" y="200.996441" font-family="monospace" font-size="12.190644" fill="var(--text-muted)"># Declaration and initialization</text>
  <text x="630" y="220.604925" font-family="monospace" font-size="13.206596" fill="var(--ok-accent)">declare</text>
  <text x="689" y="220.604925" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)"> -A user=([name]="Alice" [age]="30")</text>
  <text x="630" y="241.245495" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)">user[email]="alice@example.com"</text>

  <rect x="610" y="277.366548" width="610" height="82.562278" rx="6.612831" fill="var(--code-bg)"/>
  <text x="630" y="300.071174" font-family="monospace" font-size="12.190644" fill="var(--text-muted)"># Access and default value</text>
  <text x="630" y="319.679658" font-family="monospace" font-size="13.206596" fill="var(--ok-accent)">echo</text>
  <text x="669" y="319.679658" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)"> "${user[name]}"</text>
  <text x="820" y="319.679658" font-family="monospace" font-size="12.190644" fill="var(--text-muted)">       # Alice</text>
  <text x="630" y="340.320228" font-family="monospace" font-size="13.206596" fill="var(--ok-accent)">echo</text>
  <text x="669" y="340.320228" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)"> "${user[phone]:-N/A}"</text>
  <text x="820" y="340.320228" font-family="monospace" font-size="12.190644" fill="var(--text-muted)">  # N/A (missing key)</text>

  <rect x="610" y="376.441281" width="610" height="99.074733" rx="6.612831" fill="var(--code-bg)"/>
  <text x="630" y="399.145907" font-family="monospace" font-size="12.190644" fill="var(--text-muted)"># Iterate over keys and values</text>
  <text x="630" y="418.754391" font-family="monospace" font-size="13.206596" fill="var(--ok-accent)">for</text>
  <text x="655" y="418.754391" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)"> key in "${!user[@]}"; </text>
  <text x="800" y="418.754391" font-family="monospace" font-size="13.206596" fill="var(--ok-accent)">do</text>
  <text x="630" y="439.394961" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)">  echo "$key = ${user[$key]}"</text>
  <text x="630" y="460.03553" font-family="monospace" font-size="13.206596" fill="var(--ok-accent)">done</text>
  <text x="630" y="465.19573" font-family="monospace" font-size="12.190644" fill="var(--text-muted)">       # all keys</text>

  <rect x="610" y="492.02847" width="610" height="99.074733" rx="6.612831" fill="var(--code-bg)"/>
  <text x="630" y="514.733096" font-family="monospace" font-size="12.190644" fill="var(--text-muted)"># Check key / count / delete</text>
  <text x="630" y="534.34158" font-family="monospace" font-size="13.206596" fill="var(--ok-accent)">if</text>
  <text x="650" y="534.34158" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)"> [[ -v user[name] ]]; </text>
  <text x="780" y="534.34158" font-family="monospace" font-size="13.206596" fill="var(--ok-accent)">then</text>
  <text x="813" y="534.34158" font-family="monospace" font-size="13.206596" fill="var(--text-muted)"> echo "has name"</text>
  <text x="630" y="554.982149" font-family="monospace" font-size="13.206596" fill="var(--ok-accent)">fi</text>
  <text x="630" y="575.622719" font-family="monospace" font-size="13.206596" fill="var(--ok-accent)">echo</text>
  <text x="669" y="575.622719" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)"> "${#user[@]}"</text>
  <text x="790" y="575.622719" font-family="monospace" font-size="12.190644" fill="var(--text-muted)">          # count pairs</text>
  <text x="630" y="575.622719" font-family="monospace" font-size="12.190644" fill="var(--text-muted)">           # count pairs</text>
  <text x="630" y="578.718861" font-family="monospace" font-size="13.206596" fill="var(--ok-accent)">unset</text>
  <text x="676" y="578.718861" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)"> 'user[age]'</text>
  <text x="800" y="578.718861" font-family="monospace" font-size="12.190644" fill="var(--text-muted)">       # delete key</text>

  <!-- vs indexed array note -->
  <rect x="610" y="601.423488" width="610" height="16.512456" rx="6.612831" fill="transparent"/>
  <text x="630" y="613.807829" font-family="monospace" font-size="13.206596" fill="var(--ok-accent)">echo</text>
  <text x="669" y="613.807829" font-family="monospace" font-size="13.206596" fill="var(--primary-accent)"> "${!user[@]}"</text>
  <text x="800" y="613.807829" font-family="monospace" font-size="12.190644" fill="var(--text-muted)">           # all keys</text>
</svg>

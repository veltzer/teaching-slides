<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Title banner -->
  <rect x="30" y="15" width="1220" height="50" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="640" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Bash Expansion Order — Applied Left to Right Before Command Execution</text>

  <!-- Input box -->
  <rect x="30" y="85" width="220" height="60" rx="10" fill="var(--text-dark)" filter="url(#shadow)"/>
  <text x="140" y="108" font-family="Arial, sans-serif" font-size="14" fill="var(--border-strong)" text-anchor="middle">Raw command line</text>
  <text x="140" y="132" font-family="monospace" font-size="16" font-weight="bold" fill="var(--ok-tint)" text-anchor="middle">echo {a,b}~/*.txt</text>

  <!-- Arrow 0 -->
  <line x1="250" y1="115" x2="278" y2="115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step boxes - arranged horizontally with two rows -->
  <!-- Row 1: steps 1-5 -->

  <!-- Step 1: Brace -->
  <rect x="280" y="80" width="170" height="70" rx="10" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="365" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-deep)" text-anchor="middle">① Brace Expansion</text>
  <text x="365" y="123" font-family="monospace" font-size="13" fill="var(--ok-dk)" text-anchor="middle">{a,b,c}</text>
  <text x="365" y="141" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">→  a  b  c</text>

  <!-- Arrow 1-2 -->
  <line x1="450" y1="115" x2="478" y2="115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Tilde -->
  <rect x="480" y="80" width="165" height="70" rx="10" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="563" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-deep)" text-anchor="middle">② Tilde Expansion</text>
  <text x="563" y="123" font-family="monospace" font-size="13" fill="var(--ok-dk)" text-anchor="middle">~  ~user</text>
  <text x="563" y="141" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">→  /home/mark</text>

  <!-- Arrow 2-3 -->
  <line x1="645" y1="115" x2="673" y2="115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Parameter -->
  <rect x="675" y="80" width="175" height="70" rx="10" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-deep)" text-anchor="middle">③ Parameter Expansion</text>
  <text x="763" y="123" font-family="monospace" font-size="13" fill="var(--primary-dk)" text-anchor="middle">$var  ${var}</text>
  <text x="763" y="141" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">→  value of var</text>

  <!-- Arrow 3-4 -->
  <line x1="850" y1="115" x2="878" y2="115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Command subst -->
  <rect x="880" y="80" width="175" height="70" rx="10" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="968" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-deep)" text-anchor="middle">④ Command Substitution</text>
  <text x="968" y="123" font-family="monospace" font-size="13" fill="var(--primary-dk)" text-anchor="middle">$(cmd)</text>
  <text x="968" y="141" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">→  stdout of cmd</text>

  <!-- Arrow 4-5 -->
  <line x1="1055" y1="115" x2="1083" y2="115" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Arithmetic -->
  <rect x="1085" y="80" width="165" height="70" rx="10" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1168" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-deep)" text-anchor="middle">⑤ Arithmetic Expansion</text>
  <text x="1168" y="123" font-family="monospace" font-size="13" fill="var(--primary-dk)" text-anchor="middle">$((expr))</text>
  <text x="1168" y="141" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">→  numeric result</text>

  <!-- Arrow down from step 5 -->
  <line x1="1168" y1="150" x2="1168" y2="178" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2 (right to left): steps 6-9 -->

  <!-- Step 6: Process subst -->
  <rect x="1085" y="180" width="165" height="70" rx="10" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1168" y="205" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">⑥ Process Substitution</text>
  <text x="1168" y="223" font-family="monospace" font-size="13" fill="var(--warn-mid)" text-anchor="middle">&lt;(cmd) &gt;(cmd)</text>
  <text x="1168" y="241" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">→  /dev/fd/N</text>

  <!-- Arrow 6-7 -->
  <line x1="1085" y1="215" x2="1057" y2="215" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 7: Word splitting -->
  <rect x="880" y="180" width="175" height="70" rx="10" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="2" filter="url(#shadow)"/>
  <text x="968" y="205" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">⑦ Word Splitting</text>
  <text x="968" y="223" font-family="monospace" font-size="13" fill="var(--warn-mid)" text-anchor="middle">$IFS chars</text>
  <text x="968" y="241" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">splits unquoted results</text>

  <!-- Arrow 7-8 -->
  <line x1="880" y1="215" x2="852" y2="215" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 8: Filename expansion -->
  <rect x="675" y="180" width="175" height="70" rx="10" fill="var(--danger-pale3)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763" y="205" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-deep)" text-anchor="middle">⑧ Filename Expansion</text>
  <text x="763" y="223" font-family="monospace" font-size="13" fill="var(--danger)" text-anchor="middle">*.txt  ?.sh</text>
  <text x="763" y="241" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">→  matching filenames</text>

  <!-- Arrow 8-9 -->
  <line x1="675" y1="215" x2="647" y2="215" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 9: Quote removal -->
  <rect x="480" y="180" width="165" height="70" rx="10" fill="var(--danger-pale3)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="563" y="205" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-deep)" text-anchor="middle">⑨ Quote Removal</text>
  <text x="563" y="223" font-family="monospace" font-size="13" fill="var(--danger)" text-anchor="middle">" ' \</text>
  <text x="563" y="241" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">removes quoting chars</text>

  <!-- Arrow 9 → execute -->
  <line x1="480" y1="215" x2="452" y2="215" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Execute box -->
  <rect x="280" y="180" width="170" height="70" rx="10" fill="var(--text-dark)" filter="url(#shadow)"/>
  <text x="365" y="208" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-tint)" text-anchor="middle">Command</text>
  <text x="365" y="228" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-tint)" text-anchor="middle">Execution</text>
  <text x="365" y="246" font-family="Arial, sans-serif" font-size="12" fill="var(--border-strong)" text-anchor="middle">fork + exec</text>

  <!-- KEY NOTES section -->
  <rect x="30" y="275" width="1220" height="325" rx="12" fill="var(--surface-light)" filter="url(#shadow)"/>
  <text x="640" y="302" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Key Rules &amp; Examples</text>

  <!-- Rule boxes -->
  <!-- Rule 1 -->
  <rect x="50" y="315" width="560" height="120" rx="10" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1"/>
  <text x="330" y="338" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-deep)" text-anchor="middle">Brace expansion BEFORE variable expansion</text>
  <text x="70" y="362" font-family="monospace" font-size="14" fill="var(--text-dark)">x=3</text>
  <text x="70" y="382" font-family="monospace" font-size="14" fill="var(--danger)">echo {1..$x}    # WRONG: prints literal {1..3}</text>
  <text x="70" y="402" font-family="monospace" font-size="14" fill="var(--ok-dk)">seq 1 "$x"       # CORRECT: prints 1 2 3</text>
  <text x="70" y="422" font-family="monospace" font-size="14" fill="var(--ok-dk)">eval "echo {1..$x}"  # also works</text>

  <!-- Rule 2 -->
  <rect x="650" y="315" width="580" height="120" rx="10" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1"/>
  <text x="940" y="338" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-deep)" text-anchor="middle">Quoting prevents most expansions</text>
  <text x="670" y="362" font-family="monospace" font-size="14" fill="var(--text-dark)">var="*.txt"</text>
  <text x="670" y="382" font-family="monospace" font-size="14" fill="var(--warn-mid)">echo $var      # expands glob → file1.txt file2.txt</text>
  <text x="670" y="402" font-family="monospace" font-size="14" fill="var(--ok-dk)">echo "$var"    # prints literal: *.txt</text>
  <text x="670" y="422" font-family="monospace" font-size="14" fill="var(--ok-dk)">echo '$var'    # prints literal: $var</text>

  <!-- Rule 3 -->
  <rect x="50" y="450" width="560" height="130" rx="10" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="1"/>
  <text x="330" y="472" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Word splitting splits on $IFS (default: space, tab, newline)</text>
  <text x="70" y="496" font-family="monospace" font-size="14" fill="var(--text-dark)">files=$(ls *.txt)       # one string</text>
  <text x="70" y="516" font-family="monospace" font-size="14" fill="var(--danger)">for f in $files; do    # splits on spaces → BUGGY</text>
  <text x="70" y="536" font-family="monospace" font-size="14" fill="var(--ok-dk)">mapfile -t files &lt; &lt;(ls *.txt)  # SAFE</text>
  <text x="70" y="556" font-family="monospace" font-size="14" fill="var(--ok-dk)">for f in "${files[@]}"; do         # SAFE</text>
  <text x="70" y="574" font-family="monospace" font-size="14" fill="var(--text-dark)">done</text>

  <!-- Rule 4 -->
  <rect x="650" y="450" width="580" height="130" rx="10" fill="var(--danger-pale3)" stroke="var(--danger)" stroke-width="1"/>
  <text x="940" y="472" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-deep)" text-anchor="middle">Filename expansion only matches existing files</text>
  <text x="670" y="496" font-family="monospace" font-size="14" fill="var(--text-dark)">echo *.txt   # if no .txt files exist:</text>
  <text x="670" y="516" font-family="monospace" font-size="14" fill="var(--danger)">             # prints literal *.txt  (not empty!)</text>
  <text x="670" y="536" font-family="monospace" font-size="14" fill="var(--ok-dk)">shopt -s nullglob   # → prints nothing</text>
  <text x="670" y="556" font-family="monospace" font-size="14" fill="var(--ok-dk)">shopt -s failglob   # → error on no match</text>
</svg>

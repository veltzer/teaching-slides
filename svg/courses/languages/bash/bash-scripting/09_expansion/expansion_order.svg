<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.460212719154" font-weight="bold" fill="var(--primary-accent)">Bash Expansion Order</text>

  <!-- Row 1: steps 1-5 -->
  <rect x="40" y="86.607142857143" width="230" height="93.214285714286" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="117.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--ok-text)">1. Brace</text>
  <text x="155" y="148.75" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--ok-text)">{a,b,c}</text>

  <rect x="280" y="86.607142857143" width="230" height="93.214285714286" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="117.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--ok-text)">2. Tilde</text>
  <text x="395" y="148.75" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--ok-text)">~user</text>

  <rect x="520" y="86.607142857143" width="230" height="93.214285714286" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635" y="117.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--primary-text)">3. Parameter</text>
  <text x="635" y="148.75" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--primary-text)">$var  ${var}</text>

  <rect x="760" y="86.607142857143" width="230" height="93.214285714286" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="875" y="117.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--primary-text)">4. Command</text>
  <text x="875" y="148.75" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--primary-text)">$(cmd)</text>

  <rect x="1000" y="86.607142857143" width="240" height="93.214285714286" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="117.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--primary-text)">5. Arithmetic</text>
  <text x="1120" y="148.75" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--primary-text)">$((expr))</text>

  <!-- Row 2: 6-9 -->
  <rect x="40" y="210.892857142857" width="230" height="93.214285714286" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--warn-text)">6. Process Sub</text>
  <text x="155" y="273.035714285714" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--warn-text)">&lt;(cmd)</text>

  <rect x="280" y="210.892857142857" width="230" height="93.214285714286" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--warn-text)">7. Word Split</text>
  <text x="395" y="273.035714285714" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--warn-text)">on $IFS</text>

  <rect x="520" y="210.892857142857" width="230" height="93.214285714286" rx="8.141603913586" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--danger-text)">8. Filename</text>
  <text x="635" y="273.035714285714" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--danger-text)">*.txt  ?.sh</text>

  <rect x="760" y="210.892857142857" width="230" height="93.214285714286" rx="8.141603913586" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="875" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--danger-text)">9. Quote Remove</text>
  <text x="875" y="273.035714285714" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--danger-text)">strip " ' \</text>

  <rect x="1000" y="210.892857142857" width="240" height="93.214285714286" rx="8.141603913586" fill="var(--text)"/>
  <text x="1120" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--ok-accent)">Execute</text>
  <text x="1120" y="273.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--border)">fork + exec</text>

  <!-- Key Rules -->
  <rect x="40" y="330" width="590" height="134.642857142857" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--ok-text)">Brace before variable</text>
  <text x="60" y="400" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--ok-text)">{1..$x}    broken</text>
  <text x="60" y="435" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--ok-text)">seq 1 "$x" ok</text>

  <rect x="650" y="330" width="590" height="134.642857142857" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="361.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--primary-text)">Quoting blocks expansions</text>
  <text x="670" y="400" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--primary-text)">"$var" literal</text>
  <text x="670" y="435" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--primary-text)">'$var' raw</text>

  <rect x="40" y="485.357142857143" width="590" height="134.642857142857" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="516.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--warn-text)">Word splitting on $IFS</text>
  <text x="60" y="555" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--warn-text)">for f in $files broken</text>
  <text x="60" y="590" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--warn-text)">use "${arr[@]}"</text>

  <rect x="650" y="485.357142857143" width="590" height="134.642857142857" rx="8.141603913586" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="516.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--danger-text)">Glob matches existing</text>
  <text x="670" y="555" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--danger-text)">shopt -s nullglob</text>
  <text x="670" y="590" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--danger-text)">shopt -s failglob</text>
</svg>

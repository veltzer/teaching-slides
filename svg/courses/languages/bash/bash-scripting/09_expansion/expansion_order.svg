<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Row 1: steps 1-5 -->
  <rect x="40" y="40" width="230" height="101.359223300971" rx="8.489856883536" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="73.78640776699" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--ok-text)">1. Brace</text>
  <text x="155" y="107.57281553398" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--ok-text)">{a,b,c}</text>

  <rect x="280" y="40" width="230" height="101.359223300971" rx="8.489856883536" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="73.78640776699" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--ok-text)">2. Tilde</text>
  <text x="395" y="107.57281553398" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--ok-text)">~user</text>

  <rect x="520" y="40" width="230" height="101.359223300971" rx="8.489856883536" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635" y="73.78640776699" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--primary-text)">3. Parameter</text>
  <text x="635" y="107.57281553398" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--primary-text)">$var  ${var}</text>

  <rect x="760" y="40" width="230" height="101.359223300971" rx="8.489856883536" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="875" y="73.78640776699" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--primary-text)">4. Command</text>
  <text x="875" y="107.57281553398" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--primary-text)">$(cmd)</text>

  <rect x="1000" y="40" width="240" height="101.359223300971" rx="8.489856883536" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="73.78640776699" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--primary-text)">5. Arithmetic</text>
  <text x="1120" y="107.57281553398" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--primary-text)">$((expr))</text>

  <!-- Row 2: 6-9 -->
  <rect x="40" y="175.145631067961" width="230" height="101.359223300971" rx="8.489856883536" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="208.932038834952" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--warn-text)">6. Process Sub</text>
  <text x="155" y="242.718446601941" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--warn-text)">&lt;(cmd)</text>

  <rect x="280" y="175.145631067961" width="230" height="101.359223300971" rx="8.489856883536" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="208.932038834952" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--warn-text)">7. Word Split</text>
  <text x="395" y="242.718446601941" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--warn-text)">on $IFS</text>

  <rect x="520" y="175.145631067961" width="230" height="101.359223300971" rx="8.489856883536" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635" y="208.932038834952" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--danger-text)">8. Filename</text>
  <text x="635" y="242.718446601941" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--danger-text)">*.txt  ?.sh</text>

  <rect x="760" y="175.145631067961" width="230" height="101.359223300971" rx="8.489856883536" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="875" y="208.932038834952" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--danger-text)">9. Quote Remove</text>
  <text x="875" y="242.718446601941" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--danger-text)">strip " ' \</text>

  <rect x="1000" y="175.145631067961" width="240" height="101.359223300971" rx="8.489856883536" fill="var(--text)"/>
  <text x="1120" y="208.932038834952" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--ok-accent)">Execute</text>
  <text x="1120" y="242.718446601941" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--border)">fork + exec</text>

  <!-- Key Rules -->
  <rect x="40" y="304.660194174757" width="590" height="146.407766990291" rx="8.489856883536" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="338.446601941748" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--ok-text)">Brace before variable</text>
  <text x="60" y="380.776699029126" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--ok-text)">{1..$x}    broken</text>
  <text x="60" y="418.834951456311" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--ok-text)">seq 1 "$x" ok</text>

  <rect x="650" y="304.660194174757" width="590" height="146.407766990291" rx="8.489856883536" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="338.446601941748" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--primary-text)">Quoting blocks expansions</text>
  <text x="670" y="380.776699029126" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--primary-text)">"$var" literal</text>
  <text x="670" y="418.834951456311" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--primary-text)">'$var' raw</text>

  <rect x="40" y="473.592233009709" width="590" height="146.407766990291" rx="8.489856883536" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="507.3786407767" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--warn-text)">Word splitting on $IFS</text>
  <text x="60" y="549.320388349515" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--warn-text)">for f in $files broken</text>
  <text x="60" y="587.378640776699" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--warn-text)">use "${arr[@]}"</text>

  <rect x="650" y="473.592233009709" width="590" height="146.407766990291" rx="8.489856883536" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="507.3786407767" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--danger-text)">Glob matches existing</text>
  <text x="670" y="549.320388349515" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--danger-text)">shopt -s nullglob</text>
  <text x="670" y="587.378640776699" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--danger-text)">shopt -s failglob</text>
</svg>

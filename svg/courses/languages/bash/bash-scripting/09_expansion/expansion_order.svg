<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <!-- Title banner -->
  <rect x="40" y="40" width="1200" height="49.572654" rx="6.428185" fill="url(#blueGrad)"/>
  <text x="640" y="72.717897" font-family="Arial, sans-serif" font-size="21.725445" font-weight="bold" fill="var(--bg)" text-anchor="middle">Bash Expansion Order — Applied Left to Right Before Command Execution</text>

  <!-- Input box -->
  <rect x="40" y="109.401607" width="216.393443" height="59.487185" rx="6.428185" fill="var(--text)"/>
  <text x="148.196721" y="132.205082" font-family="Arial, sans-serif" font-size="13.825313" fill="var(--border)" text-anchor="middle">Raw command line</text>
  <text x="148.196721" y="155.999956" font-size="15.800373" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">echo {a,b}~/*.txt</text>

  <!-- Arrow 0 -->
  <line x1="256.393443" y1="139.145308" x2="283.934426" y2="139.145308" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step boxes - arranged horizontally with two rows -->
  <!-- Row 1: steps 1-5 -->

  <!-- Step 1: Brace -->
  <rect x="285.901639" y="104.444396" width="167.213115" height="69.401716" rx="6.428185" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="369.508197" y="129.230668" font-family="Arial, sans-serif" font-size="12.837836" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">① Brace Expansion</text>
  <text x="369.508197" y="147.076933" font-size="12.837836" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">{a,b,c}</text>
  <text x="369.508197" y="164.922979" font-size="11.850253" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">→  a  b  c</text>

  <!-- Arrow 1-2 -->
  <line x1="453.114754" y1="139.145308" x2="480.655738" y2="139.145308" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Tilde -->
  <rect x="482.622951" y="104.444396" width="162.295082" height="69.401716" rx="6.428185" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="564.262295" y="129.230668" font-family="Arial, sans-serif" font-size="12.837836" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">② Tilde Expansion</text>
  <text x="564.262295" y="147.076933" font-size="12.837836" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">~  ~user</text>
  <text x="564.262295" y="164.922979" font-size="11.850253" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">→  /home/mark</text>

  <!-- Arrow 2-3 -->
  <line x1="644.918033" y1="139.145308" x2="672.459016" y2="139.145308" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Parameter -->
  <rect x="674.42623" y="104.444396" width="172.131148" height="69.401716" rx="6.428185" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760.983607" y="129.230668" font-family="Arial, sans-serif" font-size="12.837836" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">③ Parameter Expansion</text>
  <text x="760.983607" y="147.076933" font-size="12.837836" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">$var  ${var}</text>
  <text x="760.983607" y="164.922979" font-size="11.850253" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">→  value of var</text>

  <!-- Arrow 3-4 -->
  <line x1="846.557377" y1="139.145308" x2="874.098361" y2="139.145308" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Command subst -->
  <rect x="876.065574" y="104.444396" width="172.131148" height="69.401716" rx="6.428185" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="962.622951" y="129.230668" font-family="Arial, sans-serif" font-size="12.837836" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">④ Command Substitution</text>
  <text x="962.622951" y="147.076933" font-size="12.837836" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">$(cmd)</text>
  <text x="962.622951" y="164.922979" font-size="11.850253" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">→  stdout of cmd</text>

  <!-- Arrow 4-5 -->
  <line x1="1048.196721" y1="139.145308" x2="1075.737705" y2="139.145308" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Arithmetic -->
  <rect x="1077.704918" y="104.444396" width="162.295082" height="69.401716" rx="6.428185" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1159.344262" y="129.230668" font-family="Arial, sans-serif" font-size="12.837836" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">⑤ Arithmetic Expansion</text>
  <text x="1159.344262" y="147.076933" font-size="12.837836" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">$((expr))</text>
  <text x="1159.344262" y="164.922979" font-size="11.850253" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">→  numeric result</text>

  <!-- Arrow down from step 5 -->
  <line x1="1159.344262" y1="173.846112" x2="1159.344262" y2="201.606798" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2 (right to left): steps 6-9 -->

  <!-- Step 6: Process subst -->
  <rect x="1077.704918" y="203.589704" width="162.295082" height="69.401716" rx="6.428185" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1159.344262" y="228.375977" font-family="Arial, sans-serif" font-size="12.837836" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">⑥ Process Substitution</text>
  <text x="1159.344262" y="246.222242" font-size="12.837836" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">&lt;(cmd) &gt;(cmd)</text>
  <text x="1159.344262" y="264.068288" font-size="11.850253" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">→  /dev/fd/N</text>

  <!-- Arrow 6-7 -->
  <line x1="1077.704918" y1="238.290617" x2="1050.163934" y2="238.290617" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 7: Word splitting -->
  <rect x="876.065574" y="203.589704" width="172.131148" height="69.401716" rx="6.428185" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="962.622951" y="228.375977" font-family="Arial, sans-serif" font-size="12.837836" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">⑦ Word Splitting</text>
  <text x="962.622951" y="246.222242" font-size="12.837836" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">$IFS chars</text>
  <text x="962.622951" y="264.068288" font-size="11.850253" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">splits unquoted results</text>

  <!-- Arrow 7-8 -->
  <line x1="876.065574" y1="238.290617" x2="848.52459" y2="238.290617" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 8: Filename expansion -->
  <rect x="674.42623" y="203.589704" width="172.131148" height="69.401716" rx="6.428185" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760.983607" y="228.375977" font-family="Arial, sans-serif" font-size="12.837836" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">⑧ Filename Expansion</text>
  <text x="760.983607" y="246.222242" font-size="12.837836" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">*.txt  ?.sh</text>
  <text x="760.983607" y="264.068288" font-size="11.850253" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">→  matching filenames</text>

  <!-- Arrow 8-9 -->
  <line x1="674.42623" y1="238.290617" x2="646.885246" y2="238.290617" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 9: Quote removal -->
  <rect x="482.622951" y="203.589704" width="162.295082" height="69.401716" rx="6.428185" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="564.262295" y="228.375977" font-family="Arial, sans-serif" font-size="12.837836" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">⑨ Quote Removal</text>
  <text x="564.262295" y="246.222242" font-size="12.837836" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">" ' \</text>
  <text x="564.262295" y="264.068288" font-size="11.850253" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">removes quoting chars</text>

  <!-- Arrow 9 → execute -->
  <line x1="482.622951" y1="238.290617" x2="455.081967" y2="238.290617" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Execute box -->
  <rect x="285.901639" y="203.589704" width="167.213115" height="69.401716" rx="6.428185" fill="var(--text)"/>
  <text x="369.508197" y="231.350391" font-family="Arial, sans-serif" font-size="13.825313" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Command</text>
  <text x="369.508197" y="251.179452" font-family="Arial, sans-serif" font-size="13.825313" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Execution</text>
  <text x="369.508197" y="269.025608" font-family="Arial, sans-serif" font-size="11.850253" fill="var(--border)" text-anchor="middle">fork + exec</text>

  <!-- KEY NOTES section -->
  <rect x="40" y="297.777802" width="1200" height="322.222198" rx="6.428185" fill="var(--surface)"/>
  <text x="640" y="324.546981" font-family="Arial, sans-serif" font-size="17.775433" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Key Rules &amp; Examples</text>

  <!-- Rule boxes -->
  <!-- Rule 1 -->
  <rect x="59.672131" y="337.435925" width="550.819672" height="118.97437" rx="6.428185" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.081967" y="360.239292" font-family="Arial, sans-serif" font-size="14.812789" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Brace expansion BEFORE variable expansion</text>
  <text x="79.344262" y="384.034166" font-size="13.825313" fill="var(--text)" font-family="Courier New, monospace">x=3</text>
  <text x="79.344262" y="403.863227" font-size="13.825313" fill="var(--danger-accent)" font-family="Courier New, monospace">echo {1..$x}    # WRONG: prints literal {1..3}</text>
  <text x="79.344262" y="423.692289" font-size="13.825313" fill="var(--ok-accent)" font-family="Courier New, monospace">seq 1 "$x"       # CORRECT: prints 1 2 3</text>
  <text x="79.344262" y="443.521351" font-size="13.825313" fill="var(--ok-accent)" font-family="Courier New, monospace">eval "echo {1..$x}"  # also works</text>

  <!-- Rule 2 -->
  <rect x="649.836066" y="337.435925" width="570.491803" height="118.97437" rx="6.428185" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.081967" y="360.239292" font-family="Arial, sans-serif" font-size="14.812789" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Quoting prevents most expansions</text>
  <text x="669.508197" y="384.034166" font-size="13.825313" fill="var(--text)" font-family="Courier New, monospace">var="*.txt"</text>
  <text x="669.508197" y="403.863227" font-size="13.825313" fill="var(--warn-accent)" font-family="Courier New, monospace">echo $var      # expands glob → file1.txt file2.txt</text>
  <text x="669.508197" y="423.692289" font-size="13.825313" fill="var(--ok-accent)" font-family="Courier New, monospace">echo "$var"    # prints literal: *.txt</text>
  <text x="669.508197" y="443.521351" font-size="13.825313" fill="var(--ok-accent)" font-family="Courier New, monospace">echo '$var'    # prints literal: $var</text>

  <!-- Rule 3 -->
  <rect x="59.672131" y="471.282037" width="550.819672" height="128.888901" rx="6.428185" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.081967" y="493.094005" font-family="Arial, sans-serif" font-size="14.812789" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Word splitting splits on $IFS (default: space, tab, newline)</text>
  <text x="79.344262" y="516.888879" font-size="13.825313" fill="var(--text)" font-family="Courier New, monospace">files=$(ls *.txt)       # one string</text>
  <text x="79.344262" y="536.717941" font-size="13.825313" fill="var(--danger-accent)" font-family="Courier New, monospace">for f in $files; do    # splits on spaces → BUGGY</text>
  <text x="79.344262" y="556.547003" font-size="13.825313" fill="var(--ok-accent)" font-family="Courier New, monospace">mapfile -t files &lt; &lt;(ls *.txt)  # SAFE</text>
  <text x="79.344262" y="576.376064" font-size="13.825313" fill="var(--ok-accent)" font-family="Courier New, monospace">for f in "${files[@]}"; do         # SAFE</text>
  <text x="79.344262" y="594.22222" font-size="13.825313" fill="var(--text)" font-family="Courier New, monospace">done</text>

  <!-- Rule 4 -->
  <rect x="649.836066" y="471.282037" width="570.491803" height="128.888901" rx="6.428185" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.081967" y="493.094005" font-family="Arial, sans-serif" font-size="14.812789" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Filename expansion only matches existing files</text>
  <text x="669.508197" y="516.888879" font-size="13.825313" fill="var(--text)" font-family="Courier New, monospace">echo *.txt   # if no .txt files exist:</text>
  <text x="669.508197" y="536.717941" font-size="13.825313" fill="var(--danger-accent)" font-family="Courier New, monospace">             # prints literal *.txt  (not empty!)</text>
  <text x="669.508197" y="556.547003" font-size="13.825313" fill="var(--ok-accent)" font-family="Courier New, monospace">shopt -s nullglob   # → prints nothing</text>
  <text x="669.508197" y="576.376064" font-size="13.825313" fill="var(--ok-accent)" font-family="Courier New, monospace">shopt -s failglob   # → error on no match</text>
</svg>

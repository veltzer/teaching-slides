<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Top: three standard streams -->
  <rect x="40" y="20" width="340" height="80" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="48" font-family="Arial, sans-serif" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">stdin  (fd 0)</text>
  <text x="210" y="70" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">keyboard / file / pipe</text>
  <text x="210" y="90" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="middle">default: terminal input</text>

  <rect x="470" y="20" width="340" height="80" rx="8" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="48" font-family="Arial, sans-serif" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="bold">stdout  (fd 1)</text>
  <text x="640" y="70" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">terminal / file / pipe</text>
  <text x="640" y="90" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="middle">default: terminal output</text>

  <rect x="900" y="20" width="340" height="80" rx="8" fill="url(#grad-surface)" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="48" font-family="Arial, sans-serif" font-size="16" fill="#b71c1c" text-anchor="middle" font-weight="bold">stderr  (fd 2)</text>
  <text x="1070" y="70" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">terminal / file</text>
  <text x="1070" y="90" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="middle">errors and diagnostics</text>

  <!-- Arrows from streams down to process -->
  <line x1="210" y1="100" x2="210" y2="155" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="100" x2="640" y2="155" stroke="#43a047" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1070" y1="100" x2="1070" y2="155" stroke="#e53935" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Process box -->
  <rect x="380" y="155" width="520" height="65" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="183" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Script / Process</text>
  <text x="640" y="207" font-family="Arial, sans-serif" font-size="14" fill="#bbdefb" text-anchor="middle">reads from stdin, writes to stdout/stderr</text>

  <!-- OUTPUT methods section -->
  <rect x="40" y="260" width="580" height="330" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="288" font-family="Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="bold">Output Commands</text>

  <text x="60" y="315" font-family="monospace" font-size="14" fill="#1565c0" font-weight="bold">echo</text>
  <text x="60" y="335" font-family="monospace" font-size="13" fill="#333333">echo "Hello, World!"</text>
  <text x="60" y="353" font-family="monospace" font-size="13" fill="#333333">echo -n "no newline"</text>
  <text x="60" y="371" font-family="Arial, sans-serif" font-size="12" fill="#555555">simple output, adds newline</text>

  <line x1="60" y1="385" x2="590" y2="385" stroke="#c8e6c9" stroke-width="1"/>

  <text x="60" y="408" font-family="monospace" font-size="14" fill="#1565c0" font-weight="bold">printf</text>
  <text x="60" y="428" font-family="monospace" font-size="13" fill="#333333">printf "Name: %s\n" "$name"</text>
  <text x="60" y="448" font-family="monospace" font-size="13" fill="#333333">printf "%05d\n" 42</text>
  <text x="60" y="466" font-family="Arial, sans-serif" font-size="12" fill="#555555">formatted output, portable</text>

  <line x1="60" y1="480" x2="590" y2="480" stroke="#c8e6c9" stroke-width="1"/>

  <text x="60" y="503" font-family="monospace" font-size="14" fill="#1565c0" font-weight="bold">echo to stderr</text>
  <text x="60" y="523" font-family="monospace" font-size="13" fill="#333333">echo "Error!" &gt;&amp;2</text>
  <text x="60" y="543" font-family="monospace" font-size="13" fill="#333333">printf "Warn: %s\n" "$msg" &gt;&amp;2</text>
  <text x="60" y="561" font-family="Arial, sans-serif" font-size="12" fill="#555555">write errors to fd 2</text>
  <text x="60" y="578" font-family="Arial, sans-serif" font-size="12" fill="#555555">keeps stdout clean</text>

  <!-- INPUT methods section -->
  <rect x="660" y="260" width="580" height="330" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="288" font-family="Arial, sans-serif" font-size="17" fill="#1565c0" text-anchor="middle" font-weight="bold">Input Commands</text>

  <text x="680" y="315" font-family="monospace" font-size="14" fill="#1565c0" font-weight="bold">read</text>
  <text x="680" y="335" font-family="monospace" font-size="13" fill="#333333">read -r line         # one line</text>
  <text x="680" y="355" font-family="monospace" font-size="13" fill="#333333">read -r -p "Name: " n</text>
  <text x="680" y="375" font-family="monospace" font-size="13" fill="#333333">read -r -s password  # silent</text>
  <text x="680" y="393" font-family="Arial, sans-serif" font-size="12" fill="#555555">reads from stdin into variable</text>

  <line x1="680" y1="407" x2="1210" y2="407" stroke="#bbdefb" stroke-width="1"/>

  <text x="680" y="430" font-family="monospace" font-size="14" fill="#1565c0" font-weight="bold">here-doc</text>
  <text x="680" y="450" font-family="monospace" font-size="13" fill="#333333">cat &lt;&lt;EOF</text>
  <text x="680" y="470" font-family="monospace" font-size="13" fill="#333333">  line one</text>
  <text x="680" y="490" font-family="monospace" font-size="13" fill="#333333">  line two</text>
  <text x="680" y="510" font-family="monospace" font-size="13" fill="#333333">EOF</text>
  <text x="680" y="528" font-family="Arial, sans-serif" font-size="12" fill="#555555">inline multi-line input</text>

  <line x1="680" y1="542" x2="1210" y2="542" stroke="#bbdefb" stroke-width="1"/>

  <text x="680" y="560" font-family="monospace" font-size="14" fill="#1565c0" font-weight="bold">here-string</text>
  <text x="680" y="580" font-family="monospace" font-size="13" fill="#333333">grep "word" &lt;&lt;&lt; "$var"</text>
</svg>

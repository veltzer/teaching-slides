<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Top: three standard streams -->
  <rect x="40" y="20" width="340" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="210" y="48" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">stdin  (fd 0)</text>
  <text x="210" y="70" font-family="monospace" font-size="14" fill="var(--text)" text-anchor="middle">keyboard / file / pipe</text>
  <text x="210" y="90" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">default: terminal input</text>

  <rect x="470" y="20" width="340" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="48" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">stdout  (fd 1)</text>
  <text x="640" y="70" font-family="monospace" font-size="14" fill="var(--text)" text-anchor="middle">terminal / file / pipe</text>
  <text x="640" y="90" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">default: terminal output</text>

  <rect x="900" y="20" width="340" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1070" y="48" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">stderr  (fd 2)</text>
  <text x="1070" y="70" font-family="monospace" font-size="14" fill="var(--text)" text-anchor="middle">terminal / file</text>
  <text x="1070" y="90" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">errors and diagnostics</text>

  <!-- Arrows from streams down to process -->
  <line x1="210" y1="100" x2="210" y2="155" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="100" x2="640" y2="155" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1070" y1="100" x2="1070" y2="155" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Process box -->
  <rect x="380" y="155" width="520" height="65" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="183" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)" text-anchor="middle" font-weight="bold">Script / Process</text>
  <text x="640" y="207" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)" text-anchor="middle">reads from stdin, writes to stdout/stderr</text>

  <!-- OUTPUT methods section -->
  <rect x="40" y="260" width="580" height="330" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="288" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Output Commands</text>

  <text x="60" y="315" font-family="monospace" font-size="14" fill="var(--primary-accent)" font-weight="bold">echo</text>
  <text x="60" y="335" font-family="monospace" font-size="13" fill="var(--text)">echo "Hello, World!"</text>
  <text x="60" y="353" font-family="monospace" font-size="13" fill="var(--text)">echo -n "no newline"</text>
  <text x="60" y="371" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">simple output, adds newline</text>

  <line x1="60" y1="385" x2="590" y2="385" stroke="var(--ok-border)" stroke-width="1"/>

  <text x="60" y="408" font-family="monospace" font-size="14" fill="var(--primary-accent)" font-weight="bold">printf</text>
  <text x="60" y="428" font-family="monospace" font-size="13" fill="var(--text)">printf "Name: %s\n" "$name"</text>
  <text x="60" y="448" font-family="monospace" font-size="13" fill="var(--text)">printf "%05d\n" 42</text>
  <text x="60" y="466" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">formatted output, portable</text>

  <line x1="60" y1="480" x2="590" y2="480" stroke="var(--ok-border)" stroke-width="1"/>

  <text x="60" y="503" font-family="monospace" font-size="14" fill="var(--primary-accent)" font-weight="bold">echo to stderr</text>
  <text x="60" y="523" font-family="monospace" font-size="13" fill="var(--text)">echo "Error!" &gt;&amp;2</text>
  <text x="60" y="543" font-family="monospace" font-size="13" fill="var(--text)">printf "Warn: %s\n" "$msg" &gt;&amp;2</text>
  <text x="60" y="561" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">write errors to fd 2</text>
  <text x="60" y="578" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">keeps stdout clean</text>

  <!-- INPUT methods section -->
  <rect x="660" y="260" width="580" height="330" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="288" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Input Commands</text>

  <text x="680" y="315" font-family="monospace" font-size="14" fill="var(--primary-accent)" font-weight="bold">read</text>
  <text x="680" y="335" font-family="monospace" font-size="13" fill="var(--text)">read -r line         # one line</text>
  <text x="680" y="355" font-family="monospace" font-size="13" fill="var(--text)">read -r -p "Name: " n</text>
  <text x="680" y="375" font-family="monospace" font-size="13" fill="var(--text)">read -r -s password  # silent</text>
  <text x="680" y="393" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">reads from stdin into variable</text>

  <line x1="680" y1="407" x2="1210" y2="407" stroke="var(--primary-border)" stroke-width="1"/>

  <text x="680" y="430" font-family="monospace" font-size="14" fill="var(--primary-accent)" font-weight="bold">here-doc</text>
  <text x="680" y="450" font-family="monospace" font-size="13" fill="var(--text)">cat &lt;&lt;EOF</text>
  <text x="680" y="470" font-family="monospace" font-size="13" fill="var(--text)">  line one</text>
  <text x="680" y="490" font-family="monospace" font-size="13" fill="var(--text)">  line two</text>
  <text x="680" y="510" font-family="monospace" font-size="13" fill="var(--text)">EOF</text>
  <text x="680" y="528" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">inline multi-line input</text>

  <line x1="680" y1="542" x2="1210" y2="542" stroke="var(--primary-border)" stroke-width="1"/>

  <text x="680" y="560" font-family="monospace" font-size="14" fill="var(--primary-accent)" font-weight="bold">here-string</text>
  <text x="680" y="580" font-family="monospace" font-size="13" fill="var(--text)">grep "word" &lt;&lt;&lt; "$var"</text>
</svg>

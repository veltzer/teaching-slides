<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Top: three standard streams -->
  <rect x="77.5" y="58.125" width="318.75" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="236.875" y="83.5" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">stdin  (fd 0)</text>
  <text x="236.875" y="103.4375" font-family="monospace" font-size="12.9044" fill="var(--text)" text-anchor="middle">keyboard / file / pipe</text>
  <text x="236.875" y="121.5625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">default: terminal input</text>

  <rect x="480.625" y="58.125" width="318.75" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="83.5" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">stdout  (fd 1)</text>
  <text x="640" y="103.4375" font-family="monospace" font-size="12.9044" fill="var(--text)" text-anchor="middle">terminal / file / pipe</text>
  <text x="640" y="121.5625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">default: terminal output</text>

  <rect x="883.75" y="58.125" width="318.75" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1043.125" y="83.5" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">stderr  (fd 2)</text>
  <text x="1043.125" y="103.4375" font-family="monospace" font-size="12.9044" fill="var(--text)" text-anchor="middle">terminal / file</text>
  <text x="1043.125" y="121.5625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">errors and diagnostics</text>

  <!-- Arrows from streams down to process -->
  <line x1="236.875" y1="130.625" x2="236.875" y2="180.4688" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="130.625" x2="640" y2="180.4688" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1043.125" y1="130.625" x2="1043.125" y2="180.4688" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Process box -->
  <rect x="396.25" y="180.4688" width="487.5" height="58.9062" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="205.8438" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--bg)" text-anchor="middle" font-weight="bold">Script / Process</text>
  <text x="640" y="227.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">reads from stdin, writes to stdout/stderr</text>

  <!-- OUTPUT methods section -->
  <rect x="77.5" y="275.625" width="543.75" height="299.0625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="349.375" y="301" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Output Commands</text>

  <text x="96.25" y="325.4688" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" font-weight="bold">echo</text>
  <text x="96.25" y="343.5938" font-family="monospace" font-size="11.9827" fill="var(--text)">echo "Hello, World!"</text>
  <text x="96.25" y="359.9062" font-family="monospace" font-size="11.9827" fill="var(--text)">echo -n "no newline"</text>
  <text x="96.25" y="376.2188" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">simple output, adds newline</text>

  <line x1="96.25" y1="388.9062" x2="593.125" y2="388.9062" stroke="var(--ok-border)" stroke-width="1"/>

  <text x="96.25" y="409.75" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" font-weight="bold">printf</text>
  <text x="96.25" y="427.875" font-family="monospace" font-size="11.9827" fill="var(--text)">printf "Name: %s\n" "$name"</text>
  <text x="96.25" y="446" font-family="monospace" font-size="11.9827" fill="var(--text)">printf "%05d\n" 42</text>
  <text x="96.25" y="462.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">formatted output, portable</text>

  <line x1="96.25" y1="475" x2="593.125" y2="475" stroke="var(--ok-border)" stroke-width="1"/>

  <text x="96.25" y="495.8438" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" font-weight="bold">echo to stderr</text>
  <text x="96.25" y="513.9688" font-family="monospace" font-size="11.9827" fill="var(--text)">echo "Error!" &gt;&amp;2</text>
  <text x="96.25" y="532.0938" font-family="monospace" font-size="11.9827" fill="var(--text)">printf "Warn: %s\n" "$msg" &gt;&amp;2</text>
  <text x="96.25" y="548.4062" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">write errors to fd 2</text>
  <text x="96.25" y="563.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">keeps stdout clean</text>

  <!-- INPUT methods section -->
  <rect x="658.75" y="275.625" width="543.75" height="299.0625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.625" y="301" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Input Commands</text>

  <text x="677.5" y="325.4688" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" font-weight="bold">read</text>
  <text x="677.5" y="343.5938" font-family="monospace" font-size="11.9827" fill="var(--text)">read -r line         # one line</text>
  <text x="677.5" y="361.7188" font-family="monospace" font-size="11.9827" fill="var(--text)">read -r -p "Name: " n</text>
  <text x="677.5" y="379.8438" font-family="monospace" font-size="11.9827" fill="var(--text)">read -r -s password  # silent</text>
  <text x="677.5" y="396.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">reads from stdin into variable</text>

  <line x1="677.5" y1="408.8438" x2="1174.375" y2="408.8438" stroke="var(--primary-border)" stroke-width="1"/>

  <text x="677.5" y="429.6875" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" font-weight="bold">here-doc</text>
  <text x="677.5" y="447.8125" font-family="monospace" font-size="11.9827" fill="var(--text)">cat &lt;&lt;EOF</text>
  <text x="677.5" y="465.9375" font-family="monospace" font-size="11.9827" fill="var(--text)">  line one</text>
  <text x="677.5" y="484.0625" font-family="monospace" font-size="11.9827" fill="var(--text)">  line two</text>
  <text x="677.5" y="502.1875" font-family="monospace" font-size="11.9827" fill="var(--text)">EOF</text>
  <text x="677.5" y="518.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">inline multi-line input</text>

  <line x1="677.5" y1="531.1875" x2="1174.375" y2="531.1875" stroke="var(--primary-border)" stroke-width="1"/>

  <text x="677.5" y="547.5" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" font-weight="bold">here-string</text>
  <text x="677.5" y="565.625" font-family="monospace" font-size="11.9827" fill="var(--text)">grep "word" &lt;&lt;&lt; "$var"</text>
</svg>

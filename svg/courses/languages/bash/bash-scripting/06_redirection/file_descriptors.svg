<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="56.1111" width="1162.5" height="58" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="77.5" y="91.5556" font-size="19.1186" font-weight="bold" fill="var(--bg)">Every process has three standard file descriptors:</text>
  <rect x="58.75" y="128.6111" width="150" height="58" rx="6" fill="var(--primary-accent)" />
  <rect x="208.75" y="128.6111" width="187.5" height="58" fill="var(--primary-accent)" rx="6"/>
  <rect x="396.25" y="128.6111" width="225" height="58" fill="var(--primary-accent)" rx="6"/>
  <rect x="621.25" y="128.6111" width="600" height="58" fill="var(--primary-accent)" rx="6"/>
  <text x="77.5" y="165.6667" font-size="19.1186" font-weight="bold" fill="var(--bg)">FD</text>
  <text x="227.5" y="165.6667" font-size="19.1186" font-weight="bold" fill="var(--bg)">Name</text>
  <text x="415" y="165.6667" font-size="19.1186" font-weight="bold" fill="var(--bg)">Default</text>
  <text x="640" y="165.6667" font-size="19.1186" font-weight="bold" fill="var(--bg)">C equivalent</text>
  <rect x="58.75" y="186.6111" width="150" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <rect x="208.75" y="186.6111" width="187.5" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <rect x="396.25" y="186.6111" width="225" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <rect x="621.25" y="186.6111" width="600" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="77.5" y="229.3056" font-size="24.3328" font-weight="bold" fill="var(--primary-accent)">0</text>
  <text x="227.5" y="225.2777" font-size="19.1186" fill="var(--text)">stdin</text>
  <text x="227.5" y="247.8333" font-size="13.9044" fill="var(--text-muted)">standard input</text>
  <text x="415" y="229.3056" font-size="19.1186" fill="var(--text)">keyboard</text>
  <text x="640" y="229.3056" font-size="17.3806" fill="var(--text)" font-family="monospace">stdin / scanf()</text>
  <rect x="58.75" y="259.1111" width="150" height="72.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="208.75" y="259.1111" width="187.5" height="72.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="396.25" y="259.1111" width="225" height="72.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <rect x="621.25" y="259.1111" width="600" height="72.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="77.5" y="301.8056" font-size="24.3328" font-weight="bold" fill="var(--primary-accent)">1</text>
  <text x="227.5" y="297.7777" font-size="19.1186" fill="var(--text)">stdout</text>
  <text x="227.5" y="320.3333" font-size="13.9044" fill="var(--text-muted)">standard output</text>
  <text x="415" y="301.8056" font-size="19.1186" fill="var(--text)">terminal</text>
  <text x="640" y="301.8056" font-size="17.3806" fill="var(--text)" font-family="monospace">stdout / printf()</text>
  <rect x="58.75" y="331.6111" width="150" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <rect x="208.75" y="331.6111" width="187.5" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <rect x="396.25" y="331.6111" width="225" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <rect x="621.25" y="331.6111" width="600" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="77.5" y="374.3056" font-size="24.3328" font-weight="bold" fill="var(--danger-accent)">2</text>
  <text x="227.5" y="370.2777" font-size="19.1186" fill="var(--text)">stderr</text>
  <text x="227.5" y="392.8333" font-size="13.9044" fill="var(--text-muted)">standard error</text>
  <text x="415" y="374.3056" font-size="19.1186" fill="var(--text)">terminal</text>
  <text x="640" y="374.3056" font-size="17.3806" fill="var(--text)" font-family="monospace">stderr / fprintf(stderr)</text>
  <rect x="58.75" y="426.6667" width="1162.5" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="77.5" y="458.8889" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">Common redirections:</text>
  <text x="77.5" y="489.5" font-size="17.3806" fill="var(--text)" font-family="monospace">cmd &gt; file       redirect stdout to file (overwrite)</text>
  <text x="77.5" y="517.6944" font-size="17.3806" fill="var(--text)" font-family="monospace">cmd &gt;&gt; file      redirect stdout to file (append)</text>
  <text x="77.5" y="545.8889" font-size="17.3806" fill="var(--text)" font-family="monospace">cmd 2&gt; file      redirect stderr to file</text>
</svg>
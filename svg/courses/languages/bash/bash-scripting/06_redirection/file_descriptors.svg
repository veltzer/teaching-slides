<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="65.249994" rx="6.465791" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="59.354839" y="79.875059" font-size="20.602811" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Every process has three standard file descriptors:</text>
  <rect x="40" y="121.562493" width="154.83871" height="65.249994" rx="6.465791" fill="var(--primary-accent)"/>
  <rect x="194.83871" y="121.562493" width="193.548387" height="65.249994" fill="var(--primary-accent)" rx="6.465791"/>
  <rect x="388.387097" y="121.562493" width="232.258065" height="65.249994" fill="var(--primary-accent)" rx="6.465791"/>
  <rect x="620.645161" y="121.562493" width="619.354839" height="65.249994" fill="var(--primary-accent)" rx="6.465791"/>
  <text x="59.354839" y="163.250039" font-size="20.602811" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">FD</text>
  <text x="214.193548" y="163.250039" font-size="20.602811" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Name</text>
  <text x="407.741935" y="163.250039" font-size="20.602811" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Default</text>
  <text x="640" y="163.250039" font-size="20.602811" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">C equivalent</text>
  <rect x="40" y="186.812487" width="154.83871" height="81.562493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <rect x="194.83871" y="186.812487" width="193.548387" height="81.562493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <rect x="388.387097" y="186.812487" width="232.258065" height="81.562493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <rect x="620.645161" y="186.812487" width="619.354839" height="81.562493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <text x="59.354839" y="234.843796" font-size="26.221798" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">0</text>
  <text x="214.193548" y="230.312409" font-size="20.602811" fill="var(--text)" font-family="Arial, sans-serif">stdin</text>
  <text x="214.193548" y="255.687456" font-size="14.983823" fill="var(--text-muted)" font-family="Arial, sans-serif">standard input</text>
  <text x="407.741935" y="234.843796" font-size="20.602811" fill="var(--text)" font-family="Arial, sans-serif">keyboard</text>
  <text x="640" y="234.843796" font-size="18.729887" fill="var(--text)" font-family="Courier New, monospace">stdin / scanf()</text>
  <rect x="40" y="268.37498" width="154.83871" height="81.562493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.465791"/>
  <rect x="194.83871" y="268.37498" width="193.548387" height="81.562493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.465791"/>
  <rect x="388.387097" y="268.37498" width="232.258065" height="81.562493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.465791"/>
  <rect x="620.645161" y="268.37498" width="619.354839" height="81.562493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.465791"/>
  <text x="59.354839" y="316.406289" font-size="26.221798" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1</text>
  <text x="214.193548" y="311.874902" font-size="20.602811" fill="var(--text)" font-family="Arial, sans-serif">stdout</text>
  <text x="214.193548" y="337.249949" font-size="14.983823" fill="var(--text-muted)" font-family="Arial, sans-serif">standard output</text>
  <text x="407.741935" y="316.406289" font-size="20.602811" fill="var(--text)" font-family="Arial, sans-serif">terminal</text>
  <text x="640" y="316.406289" font-size="18.729887" fill="var(--text)" font-family="Courier New, monospace">stdout / printf()</text>
  <rect x="40" y="349.937473" width="154.83871" height="81.562493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <rect x="194.83871" y="349.937473" width="193.548387" height="81.562493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <rect x="388.387097" y="349.937473" width="232.258065" height="81.562493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <rect x="620.645161" y="349.937473" width="619.354839" height="81.562493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <text x="59.354839" y="397.968782" font-size="26.221798" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2</text>
  <text x="214.193548" y="393.437395" font-size="20.602811" fill="var(--text)" font-family="Arial, sans-serif">stderr</text>
  <text x="214.193548" y="418.812442" font-size="14.983823" fill="var(--text-muted)" font-family="Arial, sans-serif">standard error</text>
  <text x="407.741935" y="397.968782" font-size="20.602811" fill="var(--text)" font-family="Arial, sans-serif">terminal</text>
  <text x="640" y="397.968782" font-size="18.729887" fill="var(--text)" font-family="Courier New, monospace">stderr / fprintf(stderr)</text>
  <rect x="40" y="456.875014" width="1200" height="163.124986" rx="6.465791" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="59.354839" y="493.124986" font-size="20.602811" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Common redirections:</text>
  <text x="59.354839" y="527.56247" font-size="18.729887" fill="var(--text)" font-family="Courier New, monospace">cmd &gt; file       redirect stdout to file (overwrite)</text>
  <text x="59.354839" y="559.281168" font-size="18.729887" fill="var(--text)" font-family="Courier New, monospace">cmd &gt;&gt; file      redirect stdout to file (append)</text>
  <text x="59.354839" y="590.999978" font-size="18.729887" fill="var(--text)" font-family="Courier New, monospace">cmd 2&gt; file      redirect stderr to file</text>
</svg>

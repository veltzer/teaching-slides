<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="65.249994" rx="6.465791" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="59.354839" y="79.875059" font-size="20.602811" font-weight="bold" fill="var(--bg)">Every process has three standard file descriptors:</text>
  <rect x="40" y="121.562493" width="154.83871" height="65.249994" rx="6.465791" fill="var(--primary-accent)" />
  <rect x="194.83871" y="121.562493" width="193.548387" height="65.249994" fill="var(--primary-accent)" rx="6.465791"/>
  <rect x="388.387097" y="121.562493" width="232.258065" height="65.249994" fill="var(--primary-accent)" rx="6.465791"/>
  <rect x="620.645161" y="121.562493" width="619.354839" height="65.249994" fill="var(--primary-accent)" rx="6.465791"/>
  <text x="59.354839" y="163.250039" font-size="20.602811" font-weight="bold" fill="var(--bg)">FD</text>
  <text x="214.193548" y="163.250039" font-size="20.602811" font-weight="bold" fill="var(--bg)">Name</text>
  <text x="407.741935" y="163.250039" font-size="20.602811" font-weight="bold" fill="var(--bg)">Default</text>
  <text x="640" y="163.250039" font-size="20.602811" font-weight="bold" fill="var(--bg)">C equivalent</text>
  <rect x="40" y="186.812487" width="154.83871" height="81.562493" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <rect x="194.83871" y="186.812487" width="193.548387" height="81.562493" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <rect x="388.387097" y="186.812487" width="232.258065" height="81.562493" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <rect x="620.645161" y="186.812487" width="619.354839" height="81.562493" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <text x="59.354839" y="234.843796" font-size="26.221798" font-weight="bold" fill="var(--primary-accent)">0</text>
  <text x="214.193548" y="230.312409" font-size="20.602811" fill="var(--text)">stdin</text>
  <text x="214.193548" y="255.687456" font-size="14.983823" fill="var(--text-muted)">standard input</text>
  <text x="407.741935" y="234.843796" font-size="20.602811" fill="var(--text)">keyboard</text>
  <text x="640" y="234.843796" font-size="18.729887" fill="var(--text)" font-family="monospace">stdin / scanf()</text>
  <rect x="40" y="268.37498" width="154.83871" height="81.562493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.465791"/>
  <rect x="194.83871" y="268.37498" width="193.548387" height="81.562493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.465791"/>
  <rect x="388.387097" y="268.37498" width="232.258065" height="81.562493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.465791"/>
  <rect x="620.645161" y="268.37498" width="619.354839" height="81.562493" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.465791"/>
  <text x="59.354839" y="316.406289" font-size="26.221798" font-weight="bold" fill="var(--primary-accent)">1</text>
  <text x="214.193548" y="311.874902" font-size="20.602811" fill="var(--text)">stdout</text>
  <text x="214.193548" y="337.249949" font-size="14.983823" fill="var(--text-muted)">standard output</text>
  <text x="407.741935" y="316.406289" font-size="20.602811" fill="var(--text)">terminal</text>
  <text x="640" y="316.406289" font-size="18.729887" fill="var(--text)" font-family="monospace">stdout / printf()</text>
  <rect x="40" y="349.937473" width="154.83871" height="81.562493" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <rect x="194.83871" y="349.937473" width="193.548387" height="81.562493" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <rect x="388.387097" y="349.937473" width="232.258065" height="81.562493" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <rect x="620.645161" y="349.937473" width="619.354839" height="81.562493" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.465791" filter="url(#shadow)"/>
  <text x="59.354839" y="397.968782" font-size="26.221798" font-weight="bold" fill="var(--danger-accent)">2</text>
  <text x="214.193548" y="393.437395" font-size="20.602811" fill="var(--text)">stderr</text>
  <text x="214.193548" y="418.812442" font-size="14.983823" fill="var(--text-muted)">standard error</text>
  <text x="407.741935" y="397.968782" font-size="20.602811" fill="var(--text)">terminal</text>
  <text x="640" y="397.968782" font-size="18.729887" fill="var(--text)" font-family="monospace">stderr / fprintf(stderr)</text>
  <rect x="40" y="456.875014" width="1200" height="163.124986" rx="6.465791" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="59.354839" y="493.124986" font-size="20.602811" font-weight="bold" fill="var(--primary-accent)">Common redirections:</text>
  <text x="59.354839" y="527.56247" font-size="18.729887" fill="var(--text)" font-family="monospace">cmd &gt; file       redirect stdout to file (overwrite)</text>
  <text x="59.354839" y="559.281168" font-size="18.729887" fill="var(--text)" font-family="monospace">cmd &gt;&gt; file      redirect stdout to file (append)</text>
  <text x="59.354839" y="590.999978" font-size="18.729887" fill="var(--text)" font-family="monospace">cmd 2&gt; file      redirect stderr to file</text>
</svg>
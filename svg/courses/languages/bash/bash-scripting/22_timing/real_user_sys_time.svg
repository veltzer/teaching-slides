<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-real" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#4a90e2"/>
    </linearGradient>
    <linearGradient id="grad-user" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </linearGradient>
    <linearGradient id="grad-sys" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--surface-light)"/>

  <!-- Title banner -->
  <rect x="40" y="18" width="1200" height="52" rx="10" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Understanding time Output: real vs user vs sys</text>

  <!-- Timeline diagram area -->
  <rect x="40" y="90" width="1200" height="340" rx="12" fill="var(--bg)" filter="url(#shadow)"/>

  <!-- Time axis -->
  <line x1="150" y1="390" x2="1210" y2="390" stroke="var(--border-faint)" stroke-width="1.5"/>
  <text x="150" y="410" font-family="sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">t=0</text>
  <text x="1190" y="410" font-family="sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">t=end</text>
  <!-- tick marks -->
  <line x1="150" y1="385" x2="150" y2="395" stroke="var(--text-faint)" stroke-width="1.5"/>
  <line x1="1190" y1="385" x2="1190" y2="395" stroke="var(--text-faint)" stroke-width="1.5"/>

  <!-- Row label column -->
  <text x="140" y="152" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)" text-anchor="end">real</text>
  <text x="140" y="240" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)" text-anchor="end">user</text>
  <text x="140" y="328" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--warn-mid)" text-anchor="end">sys</text>

  <!-- real time bar: full width -->
  <rect x="150" y="128" width="1040" height="44" rx="8" fill="url(#grad-real)" opacity="0.85"/>
  <text x="670" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Wall clock time (stopwatch from start to finish)</text>
  <!-- real braces -->
  <line x1="150" y1="180" x2="1190" y2="180" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- user time segments -->
  <!-- segment 1: 150-480 -->
  <rect x="150" y="216" width="330" height="44" rx="4" fill="url(#grad-user)" opacity="0.85"/>
  <text x="315" y="243" font-family="sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">CPU (user code)</text>
  <!-- gap: IO wait -->
  <rect x="480" y="216" width="200" height="44" rx="4" fill="var(--surface-dark)" stroke="var(--border-softer)" stroke-width="1"/>
  <text x="580" y="243" font-family="sans-serif" font-size="12" fill="var(--text-placeholder)" text-anchor="middle">I/O wait</text>
  <!-- segment 2: 680-900 -->
  <rect x="680" y="216" width="220" height="44" rx="4" fill="url(#grad-user)" opacity="0.85"/>
  <text x="790" y="243" font-family="sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">CPU (user code)</text>
  <!-- gap2 -->
  <rect x="900" y="216" width="130" height="44" rx="4" fill="var(--surface-dark)" stroke="var(--border-softer)" stroke-width="1"/>
  <text x="965" y="243" font-family="sans-serif" font-size="12" fill="var(--text-placeholder)" text-anchor="middle">I/O wait</text>
  <!-- segment 3: 1030-1190 -->
  <rect x="1030" y="216" width="160" height="44" rx="4" fill="url(#grad-user)" opacity="0.85"/>
  <text x="1110" y="243" font-family="sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">CPU (user)</text>

  <!-- sys time segments -->
  <!-- at 300, brief sys call -->
  <rect x="300" y="304" width="80" height="44" rx="4" fill="url(#grad-sys)" opacity="0.85"/>
  <text x="340" y="330" font-family="sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">kernel</text>
  <!-- at 560, sys call during io -->
  <rect x="560" y="304" width="60" height="44" rx="4" fill="url(#grad-sys)" opacity="0.85"/>
  <text x="590" y="330" font-family="sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">sys</text>
  <!-- at 820 -->
  <rect x="820" y="304" width="100" height="44" rx="4" fill="url(#grad-sys)" opacity="0.85"/>
  <text x="870" y="330" font-family="sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">kernel</text>
  <!-- at 1070 -->
  <rect x="1070" y="304" width="60" height="44" rx="4" fill="url(#grad-sys)" opacity="0.85"/>
  <text x="1100" y="330" font-family="sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">sys</text>

  <!-- Relationship notes / legend -->
  <rect x="40" y="450" width="580" height="160" rx="12" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="40" y="450" width="580" height="40" rx="12" fill="var(--primary-dk)"/>
  <rect x="40" y="478" width="580" height="12" fill="var(--primary-dk)"/>
  <text x="330" y="476" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Key Relationships</text>
  <text x="65" y="510" font-family="monospace" font-size="14" fill="var(--text-dark)">real</text>
  <text x="120" y="510" font-family="sans-serif" font-size="13" fill="var(--text-muted)"> = total elapsed wall time (always ≥ user + sys)</text>
  <text x="65" y="532" font-family="monospace" font-size="14" fill="var(--text-dark)">user</text>
  <text x="120" y="532" font-family="sans-serif" font-size="13" fill="var(--text-muted)"> = time your code ran on CPU in user mode</text>
  <text x="65" y="554" font-family="monospace" font-size="14" fill="var(--text-dark)">sys</text>
  <text x="120" y="554" font-family="sans-serif" font-size="13" fill="var(--text-muted)">  = time kernel ran on behalf of your code</text>
  <text x="65" y="576" font-family="monospace" font-size="13" fill="var(--danger)">I/O wait</text>
  <text x="135" y="576" font-family="sans-serif" font-size="13" fill="var(--text-muted)"> = the gap — real - (user + sys)</text>
  <text x="65" y="596" font-family="sans-serif" font-size="12" fill="var(--text-faint)">multi-core: real can be &lt; user + sys (parallel execution)</text>

  <!-- Right side: example output and scenarios -->
  <rect x="650" y="450" width="590" height="160" rx="12" fill="var(--code-bg)" filter="url(#shadow)"/>
  <rect x="650" y="450" width="590" height="40" rx="12" fill="var(--ok-dk)"/>
  <rect x="650" y="478" width="590" height="12" fill="var(--ok-dk)"/>
  <text x="945" y="476" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Example Scenarios</text>
  <text x="675" y="508" font-family="monospace" font-size="12" fill="var(--text-mid)"># CPU-bound:   real ≈ user + sys</text>
  <text x="675" y="526" font-family="monospace" font-size="12" fill="var(--primary-lt)">real 0m5.2s  user 0m5.1s  sys 0m0.1s</text>
  <text x="675" y="546" font-family="monospace" font-size="12" fill="var(--text-mid)"># I/O-bound:   real >> user + sys</text>
  <text x="675" y="564" font-family="monospace" font-size="12" fill="var(--primary-lt)">real 0m8.3s  user 0m0.2s  sys 0m0.3s</text>
  <text x="675" y="584" font-family="monospace" font-size="12" fill="var(--text-mid)"># Parallel:    real &lt; user + sys</text>
  <text x="675" y="602" font-family="monospace" font-size="12" fill="var(--primary-lt)">real 0m2.1s  user 0m7.8s  sys 0m0.2s</text>
</svg>

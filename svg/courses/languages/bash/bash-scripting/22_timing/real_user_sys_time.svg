<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-real" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#4a90e2"/>
    </linearGradient>
    <linearGradient id="grad-user" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </linearGradient>
    <linearGradient id="grad-sys" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" x="40" y="40"/>

  <!-- Title banner -->
  <rect x="77.5" y="56.3125" width="1125" height="47.125" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="85.3125" font-family="sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Understanding time Output: real vs user vs sys</text>

  <!-- Timeline diagram area -->
  <rect x="77.5" y="121.5625" width="1125" height="308.125" rx="6" fill="var(--bg)" filter="url(#shadow)"/>

  <!-- Time axis -->
  <line x1="180.625" y1="393.4375" x2="1174.375" y2="393.4375" stroke="var(--border)" stroke-width="1.5"/>
  <text x="180.625" y="411.5625" font-family="sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">t=0</text>
  <text x="1155.625" y="411.5625" font-family="sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">t=end</text>
  <!-- tick marks -->
  <line x1="180.625" y1="388.9062" x2="180.625" y2="397.9688" stroke="var(--text-faint)" stroke-width="1.5"/>
  <line x1="1155.625" y1="388.9062" x2="1155.625" y2="397.9688" stroke="var(--text-faint)" stroke-width="1.5"/>

  <!-- Row label column -->
  <text x="171.25" y="177.75" font-family="sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="end">real</text>
  <text x="171.25" y="257.5" font-family="sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)" text-anchor="end">user</text>
  <text x="171.25" y="337.25" font-family="sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="end">sys</text>

  <!-- real time bar: full width -->
  <rect x="180.625" y="156" width="975" height="39.875" rx="6" fill="url(#grad-real)" opacity="0.85"/>
  <text x="668.125" y="180.4688" font-family="sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Wall clock time (stopwatch from start to finish)</text>
  <!-- real braces -->
  <line x1="180.625" y1="203.125" x2="1155.625" y2="203.125" stroke="var(--primary-border)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- user time segments -->
  <!-- segment 1: 150-480 -->
  <rect x="180.625" y="235.75" width="309.375" height="39.875" rx="6" fill="url(#grad-user)" opacity="0.85"/>
  <text x="335.3125" y="260.2188" font-family="sans-serif" font-size="11.0609" fill="var(--bg)" text-anchor="middle">CPU (user code)</text>
  <!-- gap: IO wait -->
  <rect x="490" y="235.75" width="187.5" height="39.875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="583.75" y="260.2188" font-family="sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">I/O wait</text>
  <!-- segment 2: 680-900 -->
  <rect x="677.5" y="235.75" width="206.25" height="39.875" rx="6" fill="url(#grad-user)" opacity="0.85"/>
  <text x="780.625" y="260.2188" font-family="sans-serif" font-size="11.0609" fill="var(--bg)" text-anchor="middle">CPU (user code)</text>
  <!-- gap2 -->
  <rect x="883.75" y="235.75" width="121.875" height="39.875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="944.6875" y="260.2188" font-family="sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">I/O wait</text>
  <!-- segment 3: 1030-1190 -->
  <rect x="1005.625" y="235.75" width="150" height="39.875" rx="6" fill="url(#grad-user)" opacity="0.85"/>
  <text x="1080.625" y="260.2188" font-family="sans-serif" font-size="11.0609" fill="var(--bg)" text-anchor="middle">CPU (user)</text>

  <!-- sys time segments -->
  <!-- at 300, brief sys call -->
  <rect x="321.25" y="315.5" width="75" height="39.875" rx="6" fill="url(#grad-sys)" opacity="0.85"/>
  <text x="358.75" y="339.0625" font-family="sans-serif" font-size="10.1392" fill="var(--bg)" text-anchor="middle">kernel</text>
  <!-- at 560, sys call during io -->
  <rect x="565" y="315.5" width="56.25" height="39.875" rx="6" fill="url(#grad-sys)" opacity="0.85"/>
  <text x="593.125" y="339.0625" font-family="sans-serif" font-size="10.1392" fill="var(--bg)" text-anchor="middle">sys</text>
  <!-- at 820 -->
  <rect x="808.75" y="315.5" width="93.75" height="39.875" rx="6" fill="url(#grad-sys)" opacity="0.85"/>
  <text x="855.625" y="339.0625" font-family="sans-serif" font-size="10.1392" fill="var(--bg)" text-anchor="middle">kernel</text>
  <!-- at 1070 -->
  <rect x="1043.125" y="315.5" width="56.25" height="39.875" rx="6" fill="url(#grad-sys)" opacity="0.85"/>
  <text x="1071.25" y="339.0625" font-family="sans-serif" font-size="10.1392" fill="var(--bg)" text-anchor="middle">sys</text>

  <!-- Relationship notes / legend -->
  <rect x="77.5" y="447.8125" width="543.75" height="145" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="77.5" y="447.8125" width="543.75" height="36.25" rx="6" fill="var(--primary-accent)"/>
  <rect x="77.5" y="473.1875" width="543.75" height="10.875" fill="var(--primary-accent)" rx="6"/>
  <text x="349.375" y="471.375" font-family="sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">Key Relationships</text>
  <text x="100.9375" y="502.1875" font-family="monospace" font-size="12.9044" fill="var(--text)">real</text>
  <text x="152.5" y="502.1875" font-family="sans-serif" font-size="11.9827" fill="var(--text-muted)"> = total elapsed wall time (always ≥ user + sys)</text>
  <text x="100.9375" y="522.125" font-family="monospace" font-size="12.9044" fill="var(--text)">user</text>
  <text x="152.5" y="522.125" font-family="sans-serif" font-size="11.9827" fill="var(--text-muted)"> = time your code ran on CPU in user mode</text>
  <text x="100.9375" y="542.0625" font-family="monospace" font-size="12.9044" fill="var(--text)">sys</text>
  <text x="152.5" y="542.0625" font-family="sans-serif" font-size="11.9827" fill="var(--text-muted)">  = time kernel ran on behalf of your code</text>
  <text x="100.9375" y="562" font-family="monospace" font-size="11.9827" fill="var(--danger-accent)">I/O wait</text>
  <text x="166.5625" y="562" font-family="sans-serif" font-size="11.9827" fill="var(--text-muted)"> = the gap — real - (user + sys)</text>
  <text x="100.9375" y="580.125" font-family="sans-serif" font-size="11.0609" fill="var(--text-faint)">multi-core: real can be &lt; user + sys (parallel execution)</text>

  <!-- Right side: example output and scenarios -->
  <rect x="649.375" y="447.8125" width="553.125" height="145" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <rect x="649.375" y="447.8125" width="553.125" height="36.25" rx="6" fill="var(--ok-accent)"/>
  <rect x="649.375" y="473.1875" width="553.125" height="10.875" fill="var(--ok-accent)" rx="6"/>
  <text x="925.9375" y="471.375" font-family="sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">Example Scenarios</text>
  <text x="672.8125" y="500.375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># CPU-bound:   real ≈ user + sys</text>
  <text x="672.8125" y="516.6875" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">real 0m5.2s  user 0m5.1s  sys 0m0.1s</text>
  <text x="672.8125" y="534.8125" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># I/O-bound:   real >> user + sys</text>
  <text x="672.8125" y="551.125" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">real 0m8.3s  user 0m0.2s  sys 0m0.3s</text>
  <text x="672.8125" y="569.25" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Parallel:    real &lt; user + sys</text>
  <text x="672.8125" y="585.5625" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">real 0m2.1s  user 0m7.8s  sys 0m0.2s</text>
</svg>

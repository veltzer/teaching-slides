<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Center hub -->
  <rect x="499.375" y="266.5625" width="281.25" height="72.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="299.1875" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--bg)" text-anchor="middle" font-weight="bold">Basic Shell Features</text>
  <text x="640" y="326.375" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--primary-accent)" text-anchor="middle">core building blocks</text>

  <!-- Pipes -->
  <rect x="77.5" y="76.25" width="225" height="99.6875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="190" y="101.625" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Pipes</text>
  <text x="91.5625" y="123.375" font-family="monospace" font-size="11.9827" fill="var(--text)">cmd1 | cmd2</text>
  <text x="91.5625" y="141.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">stdout of cmd1 becomes</text>
  <text x="91.5625" y="157.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">stdin of cmd2</text>
  <!-- arrow to center -->
  <line x1="302.5" y1="126.0938" x2="499.375" y2="284.6875" stroke="var(--primary-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Redirection -->
  <rect x="77.5" y="221.25" width="225" height="108.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="190" y="246.625" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Redirection</text>
  <text x="91.5625" y="268.375" font-family="monospace" font-size="11.9827" fill="var(--text)">cmd &gt; file</text>
  <text x="91.5625" y="286.5" font-family="monospace" font-size="11.9827" fill="var(--text)">cmd &gt;&gt; file</text>
  <text x="91.5625" y="304.625" font-family="monospace" font-size="11.9827" fill="var(--text)">cmd 2&gt; err.log</text>
  <!-- arrow to center -->
  <line x1="302.5" y1="275.625" x2="499.375" y2="298.2812" stroke="var(--info-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Variables -->
  <rect x="77.5" y="384.375" width="225" height="99.6875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="190" y="409.75" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Variables</text>
  <text x="91.5625" y="431.5" font-family="monospace" font-size="11.9827" fill="var(--text)">name="Alice"</text>
  <text x="91.5625" y="449.625" font-family="monospace" font-size="11.9827" fill="var(--text)">echo $name</text>
  <text x="91.5625" y="467.75" font-family="monospace" font-size="11.9827" fill="var(--text)">echo ${name:-default}</text>
  <!-- arrow to center -->
  <line x1="302.5" y1="434.2188" x2="499.375" y2="330" stroke="var(--ok-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Quoting -->
  <rect x="977.5" y="76.25" width="225" height="108.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1090" y="101.625" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Quoting</text>
  <text x="991.5625" y="123.375" font-family="monospace" font-size="11.9827" fill="var(--text)">'literal string'</text>
  <text x="991.5625" y="141.5" font-family="monospace" font-size="11.9827" fill="var(--text)">"interpolated $var"</text>
  <text x="991.5625" y="159.625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">controls word splitting</text>
  <!-- arrow to center -->
  <line x1="977.5" y1="130.625" x2="780.625" y2="284.6875" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Wildcards / Globbing -->
  <rect x="977.5" y="230.3125" width="225" height="108.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1090" y="255.6875" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Wildcards</text>
  <text x="991.5625" y="277.4375" font-family="monospace" font-size="11.9827" fill="var(--text)">*  matches anything</text>
  <text x="991.5625" y="295.5625" font-family="monospace" font-size="11.9827" fill="var(--text)">?  matches one char</text>
  <text x="991.5625" y="313.6875" font-family="monospace" font-size="11.9827" fill="var(--text)">[abc] char class</text>
  <!-- arrow to center -->
  <line x1="977.5" y1="284.6875" x2="780.625" y2="302.8125" stroke="var(--primary-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Command substitution -->
  <rect x="977.5" y="384.375" width="225" height="99.6875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1090" y="409.75" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Cmd Substitution</text>
  <text x="991.5625" y="431.5" font-family="monospace" font-size="11.9827" fill="var(--text)">$(command)</text>
  <text x="991.5625" y="449.625" font-family="monospace" font-size="11.9827" fill="var(--text)">now=$(date)</text>
  <text x="991.5625" y="467.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">captures command output</text>
  <!-- arrow to center -->
  <line x1="977.5" y1="434.2188" x2="780.625" y2="330" stroke="var(--info-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Logical operators -->
  <rect x="443.125" y="520.3125" width="393.75" height="77.0312" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="545.6875" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Logical Operators</text>
  <text x="640" y="567.4375" font-family="monospace" font-size="12.9044" fill="var(--text)" text-anchor="middle">&amp;&amp;  (and)     ||  (or)     ;  (sequence)</text>
  <text x="640" y="585.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">control command execution flow</text>
  <!-- arrow from center -->
  <line x1="640" y1="339.0625" x2="640" y2="520.3125" stroke="var(--ok-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
</svg>

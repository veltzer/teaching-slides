<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Center hub -->
  <rect x="490" y="250" width="300" height="80" rx="12" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="286" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">Basic Shell Features</text>
  <text x="640" y="316" font-family="Arial, sans-serif" font-size="15" fill="#bbdefb" text-anchor="middle">core building blocks</text>

  <!-- Pipes -->
  <rect x="40" y="40" width="240" height="110" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="68" font-family="Arial, sans-serif" font-size="17" fill="#1565c0" text-anchor="middle" font-weight="bold">Pipes</text>
  <text x="55" y="92" font-family="monospace" font-size="13" fill="#333333">cmd1 | cmd2</text>
  <text x="55" y="112" font-family="Arial, sans-serif" font-size="12" fill="#555555">stdout of cmd1 becomes</text>
  <text x="55" y="130" font-family="Arial, sans-serif" font-size="12" fill="#555555">stdin of cmd2</text>
  <!-- arrow to center -->
  <line x1="280" y1="95" x2="490" y2="270" stroke="#1e88e5" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Redirection -->
  <rect x="40" y="200" width="240" height="120" rx="8" fill="url(#grad-surface)" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="228" font-family="Arial, sans-serif" font-size="17" fill="#6a1b9a" text-anchor="middle" font-weight="bold">Redirection</text>
  <text x="55" y="252" font-family="monospace" font-size="13" fill="#333333">cmd &gt; file</text>
  <text x="55" y="272" font-family="monospace" font-size="13" fill="#333333">cmd &gt;&gt; file</text>
  <text x="55" y="292" font-family="monospace" font-size="13" fill="#333333">cmd 2&gt; err.log</text>
  <!-- arrow to center -->
  <line x1="280" y1="260" x2="490" y2="285" stroke="#8e24aa" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Variables -->
  <rect x="40" y="380" width="240" height="110" rx="8" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="408" font-family="Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="bold">Variables</text>
  <text x="55" y="432" font-family="monospace" font-size="13" fill="#333333">name="Alice"</text>
  <text x="55" y="452" font-family="monospace" font-size="13" fill="#333333">echo $name</text>
  <text x="55" y="472" font-family="monospace" font-size="13" fill="#333333">echo ${name:-default}</text>
  <!-- arrow to center -->
  <line x1="280" y1="435" x2="490" y2="320" stroke="#43a047" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Quoting -->
  <rect x="1000" y="40" width="240" height="120" rx="8" fill="url(#grad-surface)" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="68" font-family="Arial, sans-serif" font-size="17" fill="#e65100" text-anchor="middle" font-weight="bold">Quoting</text>
  <text x="1015" y="92" font-family="monospace" font-size="13" fill="#333333">'literal string'</text>
  <text x="1015" y="112" font-family="monospace" font-size="13" fill="#333333">"interpolated $var"</text>
  <text x="1015" y="132" font-family="Arial, sans-serif" font-size="12" fill="#555555">controls word splitting</text>
  <!-- arrow to center -->
  <line x1="1000" y1="100" x2="790" y2="270" stroke="#fb8c00" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Wildcards / Globbing -->
  <rect x="1000" y="210" width="240" height="120" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="238" font-family="Arial, sans-serif" font-size="17" fill="#1565c0" text-anchor="middle" font-weight="bold">Wildcards</text>
  <text x="1015" y="262" font-family="monospace" font-size="13" fill="#333333">*  matches anything</text>
  <text x="1015" y="282" font-family="monospace" font-size="13" fill="#333333">?  matches one char</text>
  <text x="1015" y="302" font-family="monospace" font-size="13" fill="#333333">[abc] char class</text>
  <!-- arrow to center -->
  <line x1="1000" y1="270" x2="790" y2="290" stroke="#1e88e5" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Command substitution -->
  <rect x="1000" y="380" width="240" height="110" rx="8" fill="url(#grad-surface)" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="408" font-family="Arial, sans-serif" font-size="17" fill="#6a1b9a" text-anchor="middle" font-weight="bold">Cmd Substitution</text>
  <text x="1015" y="432" font-family="monospace" font-size="13" fill="#333333">$(command)</text>
  <text x="1015" y="452" font-family="monospace" font-size="13" fill="#333333">now=$(date)</text>
  <text x="1015" y="472" font-family="Arial, sans-serif" font-size="12" fill="#555555">captures command output</text>
  <!-- arrow to center -->
  <line x1="1000" y1="435" x2="790" y2="320" stroke="#8e24aa" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Logical operators -->
  <rect x="430" y="530" width="420" height="85" rx="8" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="558" font-family="Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="bold">Logical Operators</text>
  <text x="640" y="582" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">&amp;&amp;  (and)     ||  (or)     ;  (sequence)</text>
  <text x="640" y="602" font-family="Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">control command execution flow</text>
  <!-- arrow from center -->
  <line x1="640" y1="330" x2="640" y2="530" stroke="#43a047" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- Center hub -->
  <rect x="490" y="251.826107" width="300" height="80.69566" rx="6.53765" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="288.139154" font-family="Arial, sans-serif" font-size="22.095406" fill="var(--bg)" text-anchor="middle" font-weight="bold">Basic Shell Features</text>
  <text x="640" y="318.400027" font-family="Arial, sans-serif" font-size="15.065035" fill="var(--primary-accent)" text-anchor="middle">core building blocks</text>

  <!-- Pipes -->
  <rect x="40" y="40" width="240" height="110.956532" rx="6.53765" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="160" y="68.243481" font-family="Arial, sans-serif" font-size="17.073728" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Pipes</text>
  <text x="55" y="92.452179" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">cmd1 | cmd2</text>
  <text x="55" y="112.626094" font-family="Arial, sans-serif" font-size="12.05205" fill="var(--text-muted)">stdout of cmd1 becomes</text>
  <text x="55" y="130.782617" font-family="Arial, sans-serif" font-size="12.05205" fill="var(--text-muted)">stdin of cmd2</text>
  <!-- arrow to center -->
  <line x1="280" y1="95.478322" x2="490" y2="272.000022" stroke="var(--primary-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Redirection -->
  <rect x="40" y="201.39132" width="240" height="121.04349" rx="6.53765" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="160" y="229.634801" font-family="Arial, sans-serif" font-size="17.073728" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Redirection</text>
  <text x="55" y="253.843499" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">cmd &gt; file</text>
  <text x="55" y="274.017414" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">cmd &gt;&gt; file</text>
  <text x="55" y="294.191329" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">cmd 2&gt; err.log</text>
  <!-- arrow to center -->
  <line x1="280" y1="261.913065" x2="490" y2="287.130403" stroke="var(--info-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Variables -->
  <rect x="40" y="382.956555" width="240" height="110.956532" rx="6.53765" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="160" y="411.200036" font-family="Arial, sans-serif" font-size="17.073728" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Variables</text>
  <text x="55" y="435.408734" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">name="Alice"</text>
  <text x="55" y="455.582649" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">echo $name</text>
  <text x="55" y="475.756564" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">echo ${name:-default}</text>
  <!-- arrow to center -->
  <line x1="280" y1="438.434876" x2="490" y2="322.43481" stroke="var(--ok-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Quoting -->
  <rect x="1000" y="40" width="240" height="121.04349" rx="6.53765" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1120" y="68.243481" font-family="Arial, sans-serif" font-size="17.073728" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Quoting</text>
  <text x="1015" y="92.452179" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">'literal string'</text>
  <text x="1015" y="112.626094" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">"interpolated $var"</text>
  <text x="1015" y="132.800009" font-family="Arial, sans-serif" font-size="12.05205" fill="var(--text-muted)">controls word splitting</text>
  <!-- arrow to center -->
  <line x1="1000" y1="100.521745" x2="790" y2="272.000022" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Wildcards / Globbing -->
  <rect x="1000" y="211.478277" width="240" height="121.04349" rx="6.53765" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1120" y="239.721758" font-family="Arial, sans-serif" font-size="17.073728" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Wildcards</text>
  <text x="1015" y="263.930456" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">*  matches anything</text>
  <text x="1015" y="284.104371" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">?  matches one char</text>
  <text x="1015" y="304.278286" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">[abc] char class</text>
  <!-- arrow to center -->
  <line x1="1000" y1="272.000022" x2="790" y2="292.173937" stroke="var(--primary-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Command substitution -->
  <rect x="1000" y="382.956555" width="240" height="110.956532" rx="6.53765" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1120" y="411.200036" font-family="Arial, sans-serif" font-size="17.073728" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Cmd Substitution</text>
  <text x="1015" y="435.408734" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">$(command)</text>
  <text x="1015" y="455.582649" font-size="13.056451" fill="var(--text)" font-family="Courier New, monospace">now=$(date)</text>
  <text x="1015" y="475.756564" font-family="Arial, sans-serif" font-size="12.05205" fill="var(--text-muted)">captures command output</text>
  <!-- arrow to center -->
  <line x1="1000" y1="438.434876" x2="790" y2="322.43481" stroke="var(--info-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Logical operators -->
  <rect x="430" y="534.260917" width="420" height="85.739083" rx="6.53765" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="562.504398" font-family="Arial, sans-serif" font-size="17.073728" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Logical Operators</text>
  <text x="640" y="586.713096" font-size="14.060743" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">&amp;&amp;  (and)     ||  (or)     ;  (sequence)</text>
  <text x="640" y="606.887011" font-family="Arial, sans-serif" font-size="12.05205" fill="var(--text-muted)" text-anchor="middle">control command execution flow</text>
  <!-- arrow from center -->
  <line x1="640" y1="332.521767" x2="640" y2="534.260917" stroke="var(--ok-border)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Center hub -->
  <rect x="490" y="250" width="300" height="80" rx="12" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="286" font-family="Arial, sans-serif" font-size="22" fill="var(--bg)" text-anchor="middle" font-weight="bold">Basic Shell Features</text>
  <text x="640" y="316" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-lt)" text-anchor="middle">core building blocks</text>

  <!-- Pipes -->
  <rect x="40" y="40" width="240" height="110" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="68" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Pipes</text>
  <text x="55" y="92" font-family="monospace" font-size="13" fill="var(--text-dark)">cmd1 | cmd2</text>
  <text x="55" y="112" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">stdout of cmd1 becomes</text>
  <text x="55" y="130" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">stdin of cmd2</text>
  <!-- arrow to center -->
  <line x1="280" y1="95" x2="490" y2="270" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Redirection -->
  <rect x="40" y="200" width="240" height="120" rx="8" fill="url(#grad-surface)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="228" font-family="Arial, sans-serif" font-size="17" fill="var(--info-dk)" text-anchor="middle" font-weight="bold">Redirection</text>
  <text x="55" y="252" font-family="monospace" font-size="13" fill="var(--text-dark)">cmd &gt; file</text>
  <text x="55" y="272" font-family="monospace" font-size="13" fill="var(--text-dark)">cmd &gt;&gt; file</text>
  <text x="55" y="292" font-family="monospace" font-size="13" fill="var(--text-dark)">cmd 2&gt; err.log</text>
  <!-- arrow to center -->
  <line x1="280" y1="260" x2="490" y2="285" stroke="var(--info)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Variables -->
  <rect x="40" y="380" width="240" height="110" rx="8" fill="url(#grad-surface)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="408" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Variables</text>
  <text x="55" y="432" font-family="monospace" font-size="13" fill="var(--text-dark)">name="Alice"</text>
  <text x="55" y="452" font-family="monospace" font-size="13" fill="var(--text-dark)">echo $name</text>
  <text x="55" y="472" font-family="monospace" font-size="13" fill="var(--text-dark)">echo ${name:-default}</text>
  <!-- arrow to center -->
  <line x1="280" y1="435" x2="490" y2="320" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Quoting -->
  <rect x="1000" y="40" width="240" height="120" rx="8" fill="url(#grad-surface)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="68" font-family="Arial, sans-serif" font-size="17" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">Quoting</text>
  <text x="1015" y="92" font-family="monospace" font-size="13" fill="var(--text-dark)">'literal string'</text>
  <text x="1015" y="112" font-family="monospace" font-size="13" fill="var(--text-dark)">"interpolated $var"</text>
  <text x="1015" y="132" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">controls word splitting</text>
  <!-- arrow to center -->
  <line x1="1000" y1="100" x2="790" y2="270" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Wildcards / Globbing -->
  <rect x="1000" y="210" width="240" height="120" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="238" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Wildcards</text>
  <text x="1015" y="262" font-family="monospace" font-size="13" fill="var(--text-dark)">*  matches anything</text>
  <text x="1015" y="282" font-family="monospace" font-size="13" fill="var(--text-dark)">?  matches one char</text>
  <text x="1015" y="302" font-family="monospace" font-size="13" fill="var(--text-dark)">[abc] char class</text>
  <!-- arrow to center -->
  <line x1="1000" y1="270" x2="790" y2="290" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Command substitution -->
  <rect x="1000" y="380" width="240" height="110" rx="8" fill="url(#grad-surface)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="408" font-family="Arial, sans-serif" font-size="17" fill="var(--info-dk)" text-anchor="middle" font-weight="bold">Cmd Substitution</text>
  <text x="1015" y="432" font-family="monospace" font-size="13" fill="var(--text-dark)">$(command)</text>
  <text x="1015" y="452" font-family="monospace" font-size="13" fill="var(--text-dark)">now=$(date)</text>
  <text x="1015" y="472" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">captures command output</text>
  <!-- arrow to center -->
  <line x1="1000" y1="435" x2="790" y2="320" stroke="var(--info)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Logical operators -->
  <rect x="430" y="530" width="420" height="85" rx="8" fill="url(#grad-surface)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="558" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Logical Operators</text>
  <text x="640" y="582" font-family="monospace" font-size="14" fill="var(--text-dark)" text-anchor="middle">&amp;&amp;  (and)     ||  (or)     ;  (sequence)</text>
  <text x="640" y="602" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">control command execution flow</text>
  <!-- arrow from center -->
  <line x1="640" y1="330" x2="640" y2="530" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
</svg>

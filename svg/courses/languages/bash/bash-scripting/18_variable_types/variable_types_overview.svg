<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Card 1: String (default) -->
  <rect x="40" y="30" width="280" height="560" rx="12" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="40" y="30" width="280" height="56" rx="12" fill="#1e88e5"/>
  <rect x="40" y="74" width="280" height="12" fill="#1e88e5"/>
  <text x="180" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">String</text>

  <text x="180" y="108" font-family="monospace" font-size="14" fill="#555555" text-anchor="middle">declare (default)</text>

  <rect x="55" y="122" width="250" height="110" rx="8" fill="#1e1e2e"/>
  <text x="70" y="146" font-family="monospace" font-size="13" fill="#585b70"># default assignment</text>
  <text x="70" y="166" font-family="monospace" font-size="13" fill="#cdd6f4">x="hello"</text>
  <text x="70" y="186" font-family="monospace" font-size="13" fill="#cdd6f4">name=Alice</text>
  <text x="70" y="206" font-family="monospace" font-size="13" fill="#cdd6f4">count=42</text>
  <text x="70" y="220" font-family="monospace" font-size="11" fill="#585b70"># (stored as string)</text>

  <text x="55" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Behavior:</text>
  <text x="55" y="278" font-family="sans-serif" font-size="12" fill="#333333">• All values are strings</text>
  <text x="55" y="298" font-family="sans-serif" font-size="12" fill="#333333">• Can hold any text</text>
  <text x="55" y="318" font-family="sans-serif" font-size="12" fill="#333333">• Arithmetic needs $(( ))</text>
  <text x="55" y="338" font-family="sans-serif" font-size="12" fill="#333333">• Length: ${#x}</text>

  <rect x="55" y="355" width="250" height="100" rx="8" fill="#1e1e2e"/>
  <text x="70" y="375" font-family="monospace" font-size="12" fill="#585b70"># string operations</text>
  <text x="70" y="393" font-family="monospace" font-size="12" fill="#a6e3a1">echo</text>
  <text x="105" y="393" font-family="monospace" font-size="12" fill="#cdd6f4"> "${x^^}"</text>
  <text x="70" y="411" font-family="monospace" font-size="12" fill="#585b70"># HELLO</text>
  <text x="70" y="429" font-family="monospace" font-size="12" fill="#a6e3a1">echo</text>
  <text x="105" y="429" font-family="monospace" font-size="12" fill="#cdd6f4"> "${x:0:3}"</text>
  <text x="70" y="447" font-family="monospace" font-size="12" fill="#585b70"># hel</text>

  <rect x="55" y="470" width="250" height="36" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="180" y="493" font-family="sans-serif" font-size="13" fill="#1565c0" text-anchor="middle">Default for all variables</text>

  <!-- Card 2: Integer -->
  <rect x="345" y="30" width="280" height="560" rx="12" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="345" y="30" width="280" height="56" rx="12" fill="#2e7d32"/>
  <rect x="345" y="74" width="280" height="12" fill="#2e7d32"/>
  <text x="485" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Integer</text>

  <text x="485" y="108" font-family="monospace" font-size="14" fill="#555555" text-anchor="middle">declare -i</text>

  <rect x="360" y="122" width="250" height="110" rx="8" fill="#1e1e2e"/>
  <text x="375" y="146" font-family="monospace" font-size="13" fill="#585b70"># integer declaration</text>
  <text x="375" y="166" font-family="monospace" font-size="13" fill="#a6e3a1">declare</text>
  <text x="434" y="166" font-family="monospace" font-size="13" fill="#cdd6f4"> -i num</text>
  <text x="375" y="186" font-family="monospace" font-size="13" fill="#cdd6f4">num=5+3</text>
  <text x="375" y="206" font-family="monospace" font-size="13" fill="#a6e3a1">echo</text>
  <text x="414" y="206" font-family="monospace" font-size="13" fill="#cdd6f4"> $num</text>
  <text x="375" y="220" font-family="monospace" font-size="11" fill="#585b70"># 8  (auto arithmetic)</text>

  <text x="360" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">Behavior:</text>
  <text x="360" y="278" font-family="sans-serif" font-size="12" fill="#333333">• Assignments evaluated as math</text>
  <text x="360" y="298" font-family="sans-serif" font-size="12" fill="#333333">• Strings become 0</text>
  <text x="360" y="318" font-family="sans-serif" font-size="12" fill="#333333">• Integer division truncates</text>
  <text x="360" y="338" font-family="sans-serif" font-size="12" fill="#333333">• Stored as string internally</text>

  <rect x="360" y="355" width="250" height="100" rx="8" fill="#1e1e2e"/>
  <text x="375" y="375" font-family="monospace" font-size="12" fill="#a6e3a1">declare</text>
  <text x="434" y="375" font-family="monospace" font-size="12" fill="#cdd6f4"> -i a=5 b=3 c</text>
  <text x="375" y="393" font-family="monospace" font-size="12" fill="#cdd6f4">c=a+b</text>
  <text x="375" y="411" font-family="monospace" font-size="12" fill="#a6e3a1">echo</text>
  <text x="414" y="411" font-family="monospace" font-size="12" fill="#cdd6f4"> $c</text>
  <text x="375" y="429" font-family="monospace" font-size="12" fill="#585b70"># 8</text>
  <text x="375" y="447" font-family="monospace" font-size="12" fill="#cdd6f4">num="hello"</text>
  <text x="375" y="447" font-family="monospace" font-size="12" fill="#585b70"> → 0</text>

  <rect x="360" y="470" width="250" height="36" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="485" y="493" font-family="sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle">For counters and math vars</text>

  <!-- Card 3: Readonly -->
  <rect x="650" y="30" width="280" height="560" rx="12" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="650" y="30" width="280" height="56" rx="12" fill="#e53935"/>
  <rect x="650" y="74" width="280" height="12" fill="#e53935"/>
  <text x="790" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Readonly</text>

  <text x="790" y="108" font-family="monospace" font-size="14" fill="#555555" text-anchor="middle">declare -r</text>

  <rect x="665" y="122" width="250" height="110" rx="8" fill="#1e1e2e"/>
  <text x="680" y="146" font-family="monospace" font-size="13" fill="#585b70"># readonly constant</text>
  <text x="680" y="166" font-family="monospace" font-size="13" fill="#a6e3a1">declare</text>
  <text x="739" y="166" font-family="monospace" font-size="13" fill="#cdd6f4"> -r MAX=100</text>
  <text x="680" y="186" font-family="monospace" font-size="13" fill="#585b70"># or:</text>
  <text x="680" y="206" font-family="monospace" font-size="13" fill="#a6e3a1">readonly</text>
  <text x="746" y="206" font-family="monospace" font-size="13" fill="#cdd6f4"> PI=3.14159</text>
  <text x="680" y="222" font-family="monospace" font-size="11" fill="#f38ba8">MAX=200  # error!</text>

  <text x="665" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e53935">Behavior:</text>
  <text x="665" y="278" font-family="sans-serif" font-size="12" fill="#333333">• Cannot be reassigned</text>
  <text x="665" y="298" font-family="sans-serif" font-size="12" fill="#333333">• Cannot be unset</text>
  <text x="665" y="318" font-family="sans-serif" font-size="12" fill="#333333">• Error if modified</text>
  <text x="665" y="338" font-family="sans-serif" font-size="12" fill="#333333">• Persists for shell lifetime</text>

  <rect x="665" y="355" width="250" height="100" rx="8" fill="#1e1e2e"/>
  <text x="680" y="375" font-family="monospace" font-size="12" fill="#a6e3a1">readonly</text>
  <text x="746" y="375" font-family="monospace" font-size="12" fill="#cdd6f4"> CONFIG="/etc/app"</text>
  <text x="680" y="393" font-family="monospace" font-size="12" fill="#a6e3a1">readonly</text>
  <text x="746" y="393" font-family="monospace" font-size="12" fill="#cdd6f4"> VERSION="1.0"</text>
  <text x="680" y="411" font-family="monospace" font-size="12" fill="#585b70"># attempt to change:</text>
  <text x="680" y="429" font-family="monospace" font-size="12" fill="#cdd6f4">VERSION="2.0"</text>
  <text x="680" y="447" font-family="monospace" font-size="12" fill="#f38ba8"># readonly variable</text>

  <rect x="665" y="470" width="250" height="36" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <text x="790" y="493" font-family="sans-serif" font-size="13" fill="#e53935" text-anchor="middle">For constants and config</text>

  <!-- Card 4: Array -->
  <rect x="955" y="30" width="285" height="560" rx="12" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="955" y="30" width="285" height="56" rx="12" fill="#f57c00"/>
  <rect x="955" y="74" width="285" height="12" fill="#f57c00"/>
  <text x="1097" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Array</text>

  <text x="1097" y="108" font-family="monospace" font-size="14" fill="#555555" text-anchor="middle">declare -a / declare -A</text>

  <rect x="970" y="122" width="255" height="110" rx="8" fill="#1e1e2e"/>
  <text x="985" y="146" font-family="monospace" font-size="12" fill="#585b70"># indexed array</text>
  <text x="985" y="164" font-family="monospace" font-size="12" fill="#cdd6f4">arr=(a b c d)</text>
  <text x="985" y="182" font-family="monospace" font-size="12" fill="#a6e3a1">echo</text>
  <text x="1024" y="182" font-family="monospace" font-size="12" fill="#cdd6f4"> "${arr[0]}"</text>
  <text x="985" y="200" font-family="monospace" font-size="12" fill="#585b70"># a</text>
  <text x="985" y="218" font-family="monospace" font-size="12" fill="#585b70"># assoc: declare -A map</text>

  <text x="970" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e65100">Two types:</text>
  <text x="970" y="278" font-family="sans-serif" font-size="12" fill="#333333">• Indexed (-a): numbered keys</text>
  <text x="970" y="298" font-family="sans-serif" font-size="12" fill="#333333">• Associative (-A): string keys</text>
  <text x="970" y="318" font-family="sans-serif" font-size="12" fill="#333333">• ${arr[@]} = all elements</text>
  <text x="970" y="338" font-family="sans-serif" font-size="12" fill="#333333">• ${#arr[@]} = count</text>

  <rect x="970" y="355" width="255" height="100" rx="8" fill="#1e1e2e"/>
  <text x="985" y="375" font-family="monospace" font-size="12" fill="#a6e3a1">declare</text>
  <text x="1044" y="375" font-family="monospace" font-size="12" fill="#cdd6f4"> -A user</text>
  <text x="985" y="393" font-family="monospace" font-size="12" fill="#cdd6f4">user[name]="Alice"</text>
  <text x="985" y="411" font-family="monospace" font-size="12" fill="#cdd6f4">user[age]=30</text>
  <text x="985" y="429" font-family="monospace" font-size="12" fill="#a6e3a1">echo</text>
  <text x="1024" y="429" font-family="monospace" font-size="12" fill="#cdd6f4"> "${user[name]}"</text>
  <text x="985" y="447" font-family="monospace" font-size="12" fill="#585b70"># Alice</text>

  <rect x="970" y="470" width="255" height="36" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="1097" y="493" font-family="sans-serif" font-size="13" fill="#e65100" text-anchor="middle">For collections of values</text>
</svg>

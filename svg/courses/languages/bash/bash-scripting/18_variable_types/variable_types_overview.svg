<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- Card 1: String (default) -->
  <rect x="40" y="40" width="280" height="580" rx="6.624629" fill="var(--surface)"/>
  <rect x="40" y="40" width="280" height="58" rx="6.624629" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="85.571429" width="280" height="12.428571" fill="url(#grad-primary)" rx="6.624629" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="77.285714" font-size="20.354063" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">String</text>

  <text x="180" y="120.785714" font-size="14.247811" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">declare (default)</text>

  <rect x="55" y="135.285714" width="250" height="113.928571" rx="6.624629" fill="var(--code-bg)"/>
  <text x="70" y="160.142857" font-size="13.230158" fill="var(--text-muted)" font-family="Courier New, monospace"># default assignment</text>
  <text x="70" y="180.857143" font-size="13.230158" fill="var(--primary-accent)" font-family="Courier New, monospace">x="hello"</text>
  <text x="70" y="201.571429" font-size="13.230158" fill="var(--primary-accent)" font-family="Courier New, monospace">name=Alice</text>
  <text x="70" y="222.285714" font-size="13.230158" fill="var(--primary-accent)" font-family="Courier New, monospace">count=42</text>
  <text x="70" y="236.785714" font-size="11.19474" fill="var(--text-muted)" font-family="Courier New, monospace"># (stored as string)</text>

  <text x="55" y="276.142857" font-size="13.230158" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Behavior:</text>
  <text x="55" y="296.857143" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• All values are strings</text>
  <text x="55" y="317.571429" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Can hold any text</text>
  <text x="55" y="338.285714" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Arithmetic needs $(( ))</text>
  <text x="55" y="359" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Length: ${#x}</text>

  <rect x="55" y="376.6072" width="250" height="103.571429" rx="6.624629" fill="var(--code-bg)"/>
  <text x="70" y="397.321486" font-size="12.212394" fill="var(--text-muted)" font-family="Courier New, monospace"># string operations</text>
  <text x="70" y="415.964229" font-size="12.212394" fill="var(--ok-accent)" font-family="Courier New, monospace">echo</text>
  <text x="105" y="415.964229" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace"> "${x^^}"</text>
  <text x="70" y="434.6072" font-size="12.212394" fill="var(--text-muted)" font-family="Courier New, monospace"># HELLO</text>
  <text x="70" y="453.249943" font-size="12.212394" fill="var(--ok-accent)" font-family="Courier New, monospace">echo</text>
  <text x="105" y="453.249943" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace"> "${x:0:3}"</text>
  <text x="70" y="471.892914" font-size="12.212394" fill="var(--text-muted)" font-family="Courier New, monospace"># hel</text>

  <rect x="55" y="495.714286" width="250" height="37.285714" rx="6.624629" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="519.535657" font-size="13.230158" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Default for all variables</text>

  <!-- Card 2: Integer -->
  <rect x="345" y="40" width="280" height="580" rx="6.624629" fill="var(--surface)"/>
  <rect x="345" y="40" width="280" height="58" rx="6.624629" fill="var(--ok-accent)"/>
  <rect x="345" y="85.571429" width="280" height="12.428571" fill="var(--ok-accent)" rx="6.624629"/>
  <text x="485" y="77.285714" font-size="20.354063" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Integer</text>

  <text x="485" y="120.785714" font-size="14.247811" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">declare -i</text>

  <rect x="360" y="135.285714" width="250" height="113.928571" rx="6.624629" fill="var(--code-bg)"/>
  <text x="375" y="160.142857" font-size="13.230158" fill="var(--text-muted)" font-family="Courier New, monospace"># integer declaration</text>
  <text x="375" y="180.857143" font-size="13.230158" fill="var(--ok-accent)" font-family="Courier New, monospace">declare</text>
  <text x="434" y="180.857143" font-size="13.230158" fill="var(--primary-accent)" font-family="Courier New, monospace"> -i num</text>
  <text x="375" y="201.571429" font-size="13.230158" fill="var(--primary-accent)" font-family="Courier New, monospace">num=5+3</text>
  <text x="375" y="222.285714" font-size="13.230158" fill="var(--ok-accent)" font-family="Courier New, monospace">echo</text>
  <text x="414" y="222.285714" font-size="13.230158" fill="var(--primary-accent)" font-family="Courier New, monospace"> $num</text>
  <text x="375" y="236.785714" font-size="11.19474" fill="var(--text-muted)" font-family="Courier New, monospace"># 8  (auto arithmetic)</text>

  <text x="360" y="276.142857" font-size="13.230158" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Behavior:</text>
  <text x="360" y="296.857143" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Assignments evaluated as math</text>
  <text x="360" y="317.571429" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Strings become 0</text>
  <text x="360" y="338.285714" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Integer division truncates</text>
  <text x="360" y="359" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Stored as string internally</text>

  <rect x="360" y="376.6072" width="250" height="103.571429" rx="6.624629" fill="var(--code-bg)"/>
  <text x="375" y="397.321486" font-size="12.212394" fill="var(--ok-accent)" font-family="Courier New, monospace">declare</text>
  <text x="434" y="397.321486" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace"> -i a=5 b=3 c</text>
  <text x="375" y="415.964229" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace">c=a+b</text>
  <text x="375" y="434.6072" font-size="12.212394" fill="var(--ok-accent)" font-family="Courier New, monospace">echo</text>
  <text x="414" y="434.6072" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace"> $c</text>
  <text x="375" y="453.249943" font-size="12.212394" fill="var(--text-muted)" font-family="Courier New, monospace"># 8</text>
  <text x="375" y="471.892914" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace">num="hello"</text>
  <text x="375" y="471.892914" font-size="12.212394" fill="var(--text-muted)" font-family="Courier New, monospace"> → 0</text>

  <rect x="360" y="495.714286" width="250" height="37.285714" rx="6.624629" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="519.535657" font-size="13.230158" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">For counters and math vars</text>

  <!-- Card 3: Readonly -->
  <rect x="650" y="40" width="280" height="580" rx="6.624629" fill="var(--surface)"/>
  <rect x="650" y="40" width="280" height="58" rx="6.624629" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="650" y="85.571429" width="280" height="12.428571" fill="url(#grad-danger)" rx="6.624629" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="77.285714" font-size="20.354063" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Readonly</text>

  <text x="790" y="120.785714" font-size="14.247811" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">declare -r</text>

  <rect x="665" y="135.285714" width="250" height="113.928571" rx="6.624629" fill="var(--code-bg)"/>
  <text x="680" y="160.142857" font-size="13.230158" fill="var(--text-muted)" font-family="Courier New, monospace"># readonly constant</text>
  <text x="680" y="180.857143" font-size="13.230158" fill="var(--ok-accent)" font-family="Courier New, monospace">declare</text>
  <text x="739" y="180.857143" font-size="13.230158" fill="var(--primary-accent)" font-family="Courier New, monospace"> -r MAX=100</text>
  <text x="680" y="201.571429" font-size="13.230158" fill="var(--text-muted)" font-family="Courier New, monospace"># or:</text>
  <text x="680" y="222.285714" font-size="13.230158" fill="var(--ok-accent)" font-family="Courier New, monospace">readonly</text>
  <text x="746" y="222.285714" font-size="13.230158" fill="var(--primary-accent)" font-family="Courier New, monospace"> PI=3.14159</text>
  <text x="680" y="238.857143" font-size="11.19474" fill="var(--info-accent)" font-family="Courier New, monospace">MAX=200  # error!</text>

  <text x="665" y="276.142857" font-size="13.230158" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Behavior:</text>
  <text x="665" y="296.857143" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Cannot be reassigned</text>
  <text x="665" y="317.571429" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Cannot be unset</text>
  <text x="665" y="338.285714" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Error if modified</text>
  <text x="665" y="359" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Persists for shell lifetime</text>

  <rect x="665" y="376.6072" width="250" height="103.571429" rx="6.624629" fill="var(--code-bg)"/>
  <text x="680" y="397.321486" font-size="12.212394" fill="var(--ok-accent)" font-family="Courier New, monospace">readonly</text>
  <text x="746" y="397.321486" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace"> CONFIG="/etc/app"</text>
  <text x="680" y="415.964229" font-size="12.212394" fill="var(--ok-accent)" font-family="Courier New, monospace">readonly</text>
  <text x="746" y="415.964229" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace"> VERSION="1.0"</text>
  <text x="680" y="434.6072" font-size="12.212394" fill="var(--text-muted)" font-family="Courier New, monospace"># attempt to change:</text>
  <text x="680" y="453.249943" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace">VERSION="2.0"</text>
  <text x="680" y="471.892914" font-size="12.212394" fill="var(--info-accent)" font-family="Courier New, monospace"># readonly variable</text>

  <rect x="665" y="495.714286" width="250" height="37.285714" rx="6.624629" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="519.535657" font-size="13.230158" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">For constants and config</text>

  <!-- Card 4: Array -->
  <rect x="955" y="40" width="285" height="580" rx="6.624629" fill="var(--surface)"/>
  <rect x="955" y="40" width="285" height="58" rx="6.624629" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="955" y="85.571429" width="285" height="12.428571" fill="url(#grad-warn)" rx="6.624629" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="77.285714" font-size="20.354063" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Array</text>

  <text x="1097" y="120.785714" font-size="14.247811" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">declare -a / declare -A</text>

  <rect x="970" y="135.285714" width="255" height="113.928571" rx="6.624629" fill="var(--code-bg)"/>
  <text x="985" y="160.142857" font-size="12.212394" fill="var(--text-muted)" font-family="Courier New, monospace"># indexed array</text>
  <text x="985" y="178.785714" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace">arr=(a b c d)</text>
  <text x="985" y="197.428571" font-size="12.212394" fill="var(--ok-accent)" font-family="Courier New, monospace">echo</text>
  <text x="1024" y="197.428571" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace"> "${arr[0]}"</text>
  <text x="985" y="216.071429" font-size="12.212394" fill="var(--text-muted)" font-family="Courier New, monospace"># a</text>
  <text x="985" y="234.714286" font-size="12.212394" fill="var(--text-muted)" font-family="Courier New, monospace"># assoc: declare -A map</text>

  <text x="970" y="276.142857" font-size="13.230158" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Two types:</text>
  <text x="970" y="296.857143" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Indexed (-a): numbered keys</text>
  <text x="970" y="317.571429" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• Associative (-A): string keys</text>
  <text x="970" y="338.285714" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• ${arr[@]} = all elements</text>
  <text x="970" y="359" font-size="12.212394" fill="var(--text)" font-family="Arial, sans-serif">• ${#arr[@]} = count</text>

  <rect x="970" y="376.6072" width="255" height="103.571429" rx="6.624629" fill="var(--code-bg)"/>
  <text x="985" y="397.321486" font-size="12.212394" fill="var(--ok-accent)" font-family="Courier New, monospace">declare</text>
  <text x="1044" y="397.321486" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace"> -A user</text>
  <text x="985" y="415.964229" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace">user[name]="Alice"</text>
  <text x="985" y="434.6072" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace">user[age]=30</text>
  <text x="985" y="453.249943" font-size="12.212394" fill="var(--ok-accent)" font-family="Courier New, monospace">echo</text>
  <text x="1024" y="453.249943" font-size="12.212394" fill="var(--primary-accent)" font-family="Courier New, monospace"> "${user[name]}"</text>
  <text x="985" y="471.892914" font-size="12.212394" fill="var(--text-muted)" font-family="Courier New, monospace"># Alice</text>

  <rect x="970" y="495.714286" width="255" height="37.285714" rx="6.624629" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="519.535657" font-size="13.230158" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">For collections of values</text>
</svg>

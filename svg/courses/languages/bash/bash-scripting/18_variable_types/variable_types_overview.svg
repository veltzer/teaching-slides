<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Card 1: String (default) -->
  <rect x="40" y="30" width="280" height="560" rx="12" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="40" y="30" width="280" height="56" rx="12" fill="var(--primary)"/>
  <rect x="40" y="74" width="280" height="12" fill="var(--primary)"/>
  <text x="180" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">String</text>

  <text x="180" y="108" font-family="monospace" font-size="14" fill="var(--text-muted)" text-anchor="middle">declare (default)</text>

  <rect x="55" y="122" width="250" height="110" rx="8" fill="var(--code-bg)"/>
  <text x="70" y="146" font-family="monospace" font-size="13" fill="var(--text-mid)"># default assignment</text>
  <text x="70" y="166" font-family="monospace" font-size="13" fill="var(--primary-lt)">x="hello"</text>
  <text x="70" y="186" font-family="monospace" font-size="13" fill="var(--primary-lt)">name=Alice</text>
  <text x="70" y="206" font-family="monospace" font-size="13" fill="var(--primary-lt)">count=42</text>
  <text x="70" y="220" font-family="monospace" font-size="11" fill="var(--text-mid)"># (stored as string)</text>

  <text x="55" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Behavior:</text>
  <text x="55" y="278" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• All values are strings</text>
  <text x="55" y="298" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Can hold any text</text>
  <text x="55" y="318" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Arithmetic needs $(( ))</text>
  <text x="55" y="338" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Length: ${#x}</text>

  <rect x="55" y="355" width="250" height="100" rx="8" fill="var(--code-bg)"/>
  <text x="70" y="375" font-family="monospace" font-size="12" fill="var(--text-mid)"># string operations</text>
  <text x="70" y="393" font-family="monospace" font-size="12" fill="var(--ok-tint)">echo</text>
  <text x="105" y="393" font-family="monospace" font-size="12" fill="var(--primary-lt)"> "${x^^}"</text>
  <text x="70" y="411" font-family="monospace" font-size="12" fill="var(--text-mid)"># HELLO</text>
  <text x="70" y="429" font-family="monospace" font-size="12" fill="var(--ok-tint)">echo</text>
  <text x="105" y="429" font-family="monospace" font-size="12" fill="var(--primary-lt)"> "${x:0:3}"</text>
  <text x="70" y="447" font-family="monospace" font-size="12" fill="var(--text-mid)"># hel</text>

  <rect x="55" y="470" width="250" height="36" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="180" y="493" font-family="sans-serif" font-size="13" fill="var(--primary-dk)" text-anchor="middle">Default for all variables</text>

  <!-- Card 2: Integer -->
  <rect x="345" y="30" width="280" height="560" rx="12" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="345" y="30" width="280" height="56" rx="12" fill="var(--ok-dk)"/>
  <rect x="345" y="74" width="280" height="12" fill="var(--ok-dk)"/>
  <text x="485" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integer</text>

  <text x="485" y="108" font-family="monospace" font-size="14" fill="var(--text-muted)" text-anchor="middle">declare -i</text>

  <rect x="360" y="122" width="250" height="110" rx="8" fill="var(--code-bg)"/>
  <text x="375" y="146" font-family="monospace" font-size="13" fill="var(--text-mid)"># integer declaration</text>
  <text x="375" y="166" font-family="monospace" font-size="13" fill="var(--ok-tint)">declare</text>
  <text x="434" y="166" font-family="monospace" font-size="13" fill="var(--primary-lt)"> -i num</text>
  <text x="375" y="186" font-family="monospace" font-size="13" fill="var(--primary-lt)">num=5+3</text>
  <text x="375" y="206" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="414" y="206" font-family="monospace" font-size="13" fill="var(--primary-lt)"> $num</text>
  <text x="375" y="220" font-family="monospace" font-size="11" fill="var(--text-mid)"># 8  (auto arithmetic)</text>

  <text x="360" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Behavior:</text>
  <text x="360" y="278" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Assignments evaluated as math</text>
  <text x="360" y="298" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Strings become 0</text>
  <text x="360" y="318" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Integer division truncates</text>
  <text x="360" y="338" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Stored as string internally</text>

  <rect x="360" y="355" width="250" height="100" rx="8" fill="var(--code-bg)"/>
  <text x="375" y="375" font-family="monospace" font-size="12" fill="var(--ok-tint)">declare</text>
  <text x="434" y="375" font-family="monospace" font-size="12" fill="var(--primary-lt)"> -i a=5 b=3 c</text>
  <text x="375" y="393" font-family="monospace" font-size="12" fill="var(--primary-lt)">c=a+b</text>
  <text x="375" y="411" font-family="monospace" font-size="12" fill="var(--ok-tint)">echo</text>
  <text x="414" y="411" font-family="monospace" font-size="12" fill="var(--primary-lt)"> $c</text>
  <text x="375" y="429" font-family="monospace" font-size="12" fill="var(--text-mid)"># 8</text>
  <text x="375" y="447" font-family="monospace" font-size="12" fill="var(--primary-lt)">num="hello"</text>
  <text x="375" y="447" font-family="monospace" font-size="12" fill="var(--text-mid)"> → 0</text>

  <rect x="360" y="470" width="250" height="36" rx="6" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="485" y="493" font-family="sans-serif" font-size="13" fill="var(--ok-dk)" text-anchor="middle">For counters and math vars</text>

  <!-- Card 3: Readonly -->
  <rect x="650" y="30" width="280" height="560" rx="12" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="650" y="30" width="280" height="56" rx="12" fill="var(--danger)"/>
  <rect x="650" y="74" width="280" height="12" fill="var(--danger)"/>
  <text x="790" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Readonly</text>

  <text x="790" y="108" font-family="monospace" font-size="14" fill="var(--text-muted)" text-anchor="middle">declare -r</text>

  <rect x="665" y="122" width="250" height="110" rx="8" fill="var(--code-bg)"/>
  <text x="680" y="146" font-family="monospace" font-size="13" fill="var(--text-mid)"># readonly constant</text>
  <text x="680" y="166" font-family="monospace" font-size="13" fill="var(--ok-tint)">declare</text>
  <text x="739" y="166" font-family="monospace" font-size="13" fill="var(--primary-lt)"> -r MAX=100</text>
  <text x="680" y="186" font-family="monospace" font-size="13" fill="var(--text-mid)"># or:</text>
  <text x="680" y="206" font-family="monospace" font-size="13" fill="var(--ok-tint)">readonly</text>
  <text x="746" y="206" font-family="monospace" font-size="13" fill="var(--primary-lt)"> PI=3.14159</text>
  <text x="680" y="222" font-family="monospace" font-size="11" fill="var(--info-lt)">MAX=200  # error!</text>

  <text x="665" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--danger)">Behavior:</text>
  <text x="665" y="278" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Cannot be reassigned</text>
  <text x="665" y="298" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Cannot be unset</text>
  <text x="665" y="318" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Error if modified</text>
  <text x="665" y="338" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Persists for shell lifetime</text>

  <rect x="665" y="355" width="250" height="100" rx="8" fill="var(--code-bg)"/>
  <text x="680" y="375" font-family="monospace" font-size="12" fill="var(--ok-tint)">readonly</text>
  <text x="746" y="375" font-family="monospace" font-size="12" fill="var(--primary-lt)"> CONFIG="/etc/app"</text>
  <text x="680" y="393" font-family="monospace" font-size="12" fill="var(--ok-tint)">readonly</text>
  <text x="746" y="393" font-family="monospace" font-size="12" fill="var(--primary-lt)"> VERSION="1.0"</text>
  <text x="680" y="411" font-family="monospace" font-size="12" fill="var(--text-mid)"># attempt to change:</text>
  <text x="680" y="429" font-family="monospace" font-size="12" fill="var(--primary-lt)">VERSION="2.0"</text>
  <text x="680" y="447" font-family="monospace" font-size="12" fill="var(--info-lt)"># readonly variable</text>

  <rect x="665" y="470" width="250" height="36" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="790" y="493" font-family="sans-serif" font-size="13" fill="var(--danger)" text-anchor="middle">For constants and config</text>

  <!-- Card 4: Array -->
  <rect x="955" y="30" width="285" height="560" rx="12" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="955" y="30" width="285" height="56" rx="12" fill="var(--warn-mid)"/>
  <rect x="955" y="74" width="285" height="12" fill="var(--warn-mid)"/>
  <text x="1097" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Array</text>

  <text x="1097" y="108" font-family="monospace" font-size="14" fill="var(--text-muted)" text-anchor="middle">declare -a / declare -A</text>

  <rect x="970" y="122" width="255" height="110" rx="8" fill="var(--code-bg)"/>
  <text x="985" y="146" font-family="monospace" font-size="12" fill="var(--text-mid)"># indexed array</text>
  <text x="985" y="164" font-family="monospace" font-size="12" fill="var(--primary-lt)">arr=(a b c d)</text>
  <text x="985" y="182" font-family="monospace" font-size="12" fill="var(--ok-tint)">echo</text>
  <text x="1024" y="182" font-family="monospace" font-size="12" fill="var(--primary-lt)"> "${arr[0]}"</text>
  <text x="985" y="200" font-family="monospace" font-size="12" fill="var(--text-mid)"># a</text>
  <text x="985" y="218" font-family="monospace" font-size="12" fill="var(--text-mid)"># assoc: declare -A map</text>

  <text x="970" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">Two types:</text>
  <text x="970" y="278" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Indexed (-a): numbered keys</text>
  <text x="970" y="298" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• Associative (-A): string keys</text>
  <text x="970" y="318" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• ${arr[@]} = all elements</text>
  <text x="970" y="338" font-family="sans-serif" font-size="12" fill="var(--text-dark)">• ${#arr[@]} = count</text>

  <rect x="970" y="355" width="255" height="100" rx="8" fill="var(--code-bg)"/>
  <text x="985" y="375" font-family="monospace" font-size="12" fill="var(--ok-tint)">declare</text>
  <text x="1044" y="375" font-family="monospace" font-size="12" fill="var(--primary-lt)"> -A user</text>
  <text x="985" y="393" font-family="monospace" font-size="12" fill="var(--primary-lt)">user[name]="Alice"</text>
  <text x="985" y="411" font-family="monospace" font-size="12" fill="var(--primary-lt)">user[age]=30</text>
  <text x="985" y="429" font-family="monospace" font-size="12" fill="var(--ok-tint)">echo</text>
  <text x="1024" y="429" font-family="monospace" font-size="12" fill="var(--primary-lt)"> "${user[name]}"</text>
  <text x="985" y="447" font-family="monospace" font-size="12" fill="var(--text-mid)"># Alice</text>

  <rect x="970" y="470" width="255" height="36" rx="6" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="1.5"/>
  <text x="1097" y="493" font-family="sans-serif" font-size="13" fill="var(--warn-dk)" text-anchor="middle">For collections of values</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Card 1: String (default) -->
  <rect x="40" y="30" width="280" height="560" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="40" y="30" width="280" height="56" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="74" width="280" height="12" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">String</text>

  <text x="180" y="108" font-family="monospace" font-size="14" fill="var(--text-muted)" text-anchor="middle">declare (default)</text>

  <rect x="55" y="122" width="250" height="110" rx="6" fill="var(--code-bg)"/>
  <text x="70" y="146" font-family="monospace" font-size="13" fill="var(--text-muted)"># default assignment</text>
  <text x="70" y="166" font-family="monospace" font-size="13" fill="var(--primary-accent)">x="hello"</text>
  <text x="70" y="186" font-family="monospace" font-size="13" fill="var(--primary-accent)">name=Alice</text>
  <text x="70" y="206" font-family="monospace" font-size="13" fill="var(--primary-accent)">count=42</text>
  <text x="70" y="220" font-family="monospace" font-size="11" fill="var(--text-muted)"># (stored as string)</text>

  <text x="55" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Behavior:</text>
  <text x="55" y="278" font-family="sans-serif" font-size="12" fill="var(--text)">• All values are strings</text>
  <text x="55" y="298" font-family="sans-serif" font-size="12" fill="var(--text)">• Can hold any text</text>
  <text x="55" y="318" font-family="sans-serif" font-size="12" fill="var(--text)">• Arithmetic needs $(( ))</text>
  <text x="55" y="338" font-family="sans-serif" font-size="12" fill="var(--text)">• Length: ${#x}</text>

  <rect x="55" y="355" width="250" height="100" rx="6" fill="var(--code-bg)"/>
  <text x="70" y="375" font-family="monospace" font-size="12" fill="var(--text-muted)"># string operations</text>
  <text x="70" y="393" font-family="monospace" font-size="12" fill="var(--ok-accent)">echo</text>
  <text x="105" y="393" font-family="monospace" font-size="12" fill="var(--primary-accent)"> "${x^^}"</text>
  <text x="70" y="411" font-family="monospace" font-size="12" fill="var(--text-muted)"># HELLO</text>
  <text x="70" y="429" font-family="monospace" font-size="12" fill="var(--ok-accent)">echo</text>
  <text x="105" y="429" font-family="monospace" font-size="12" fill="var(--primary-accent)"> "${x:0:3}"</text>
  <text x="70" y="447" font-family="monospace" font-size="12" fill="var(--text-muted)"># hel</text>

  <rect x="55" y="470" width="250" height="36" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="493" font-family="sans-serif" font-size="13" fill="var(--primary-accent)" text-anchor="middle">Default for all variables</text>

  <!-- Card 2: Integer -->
  <rect x="345" y="30" width="280" height="560" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="345" y="30" width="280" height="56" rx="6" fill="var(--ok-accent)"/>
  <rect x="345" y="74" width="280" height="12" fill="var(--ok-accent)" rx="6"/>
  <text x="485" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integer</text>

  <text x="485" y="108" font-family="monospace" font-size="14" fill="var(--text-muted)" text-anchor="middle">declare -i</text>

  <rect x="360" y="122" width="250" height="110" rx="6" fill="var(--code-bg)"/>
  <text x="375" y="146" font-family="monospace" font-size="13" fill="var(--text-muted)"># integer declaration</text>
  <text x="375" y="166" font-family="monospace" font-size="13" fill="var(--ok-accent)">declare</text>
  <text x="434" y="166" font-family="monospace" font-size="13" fill="var(--primary-accent)"> -i num</text>
  <text x="375" y="186" font-family="monospace" font-size="13" fill="var(--primary-accent)">num=5+3</text>
  <text x="375" y="206" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="414" y="206" font-family="monospace" font-size="13" fill="var(--primary-accent)"> $num</text>
  <text x="375" y="220" font-family="monospace" font-size="11" fill="var(--text-muted)"># 8  (auto arithmetic)</text>

  <text x="360" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Behavior:</text>
  <text x="360" y="278" font-family="sans-serif" font-size="12" fill="var(--text)">• Assignments evaluated as math</text>
  <text x="360" y="298" font-family="sans-serif" font-size="12" fill="var(--text)">• Strings become 0</text>
  <text x="360" y="318" font-family="sans-serif" font-size="12" fill="var(--text)">• Integer division truncates</text>
  <text x="360" y="338" font-family="sans-serif" font-size="12" fill="var(--text)">• Stored as string internally</text>

  <rect x="360" y="355" width="250" height="100" rx="6" fill="var(--code-bg)"/>
  <text x="375" y="375" font-family="monospace" font-size="12" fill="var(--ok-accent)">declare</text>
  <text x="434" y="375" font-family="monospace" font-size="12" fill="var(--primary-accent)"> -i a=5 b=3 c</text>
  <text x="375" y="393" font-family="monospace" font-size="12" fill="var(--primary-accent)">c=a+b</text>
  <text x="375" y="411" font-family="monospace" font-size="12" fill="var(--ok-accent)">echo</text>
  <text x="414" y="411" font-family="monospace" font-size="12" fill="var(--primary-accent)"> $c</text>
  <text x="375" y="429" font-family="monospace" font-size="12" fill="var(--text-muted)"># 8</text>
  <text x="375" y="447" font-family="monospace" font-size="12" fill="var(--primary-accent)">num="hello"</text>
  <text x="375" y="447" font-family="monospace" font-size="12" fill="var(--text-muted)"> → 0</text>

  <rect x="360" y="470" width="250" height="36" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="485" y="493" font-family="sans-serif" font-size="13" fill="var(--ok-accent)" text-anchor="middle">For counters and math vars</text>

  <!-- Card 3: Readonly -->
  <rect x="650" y="30" width="280" height="560" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="650" y="30" width="280" height="56" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="650" y="74" width="280" height="12" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="790" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Readonly</text>

  <text x="790" y="108" font-family="monospace" font-size="14" fill="var(--text-muted)" text-anchor="middle">declare -r</text>

  <rect x="665" y="122" width="250" height="110" rx="6" fill="var(--code-bg)"/>
  <text x="680" y="146" font-family="monospace" font-size="13" fill="var(--text-muted)"># readonly constant</text>
  <text x="680" y="166" font-family="monospace" font-size="13" fill="var(--ok-accent)">declare</text>
  <text x="739" y="166" font-family="monospace" font-size="13" fill="var(--primary-accent)"> -r MAX=100</text>
  <text x="680" y="186" font-family="monospace" font-size="13" fill="var(--text-muted)"># or:</text>
  <text x="680" y="206" font-family="monospace" font-size="13" fill="var(--ok-accent)">readonly</text>
  <text x="746" y="206" font-family="monospace" font-size="13" fill="var(--primary-accent)"> PI=3.14159</text>
  <text x="680" y="222" font-family="monospace" font-size="11" fill="var(--info-accent)">MAX=200  # error!</text>

  <text x="665" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)">Behavior:</text>
  <text x="665" y="278" font-family="sans-serif" font-size="12" fill="var(--text)">• Cannot be reassigned</text>
  <text x="665" y="298" font-family="sans-serif" font-size="12" fill="var(--text)">• Cannot be unset</text>
  <text x="665" y="318" font-family="sans-serif" font-size="12" fill="var(--text)">• Error if modified</text>
  <text x="665" y="338" font-family="sans-serif" font-size="12" fill="var(--text)">• Persists for shell lifetime</text>

  <rect x="665" y="355" width="250" height="100" rx="6" fill="var(--code-bg)"/>
  <text x="680" y="375" font-family="monospace" font-size="12" fill="var(--ok-accent)">readonly</text>
  <text x="746" y="375" font-family="monospace" font-size="12" fill="var(--primary-accent)"> CONFIG="/etc/app"</text>
  <text x="680" y="393" font-family="monospace" font-size="12" fill="var(--ok-accent)">readonly</text>
  <text x="746" y="393" font-family="monospace" font-size="12" fill="var(--primary-accent)"> VERSION="1.0"</text>
  <text x="680" y="411" font-family="monospace" font-size="12" fill="var(--text-muted)"># attempt to change:</text>
  <text x="680" y="429" font-family="monospace" font-size="12" fill="var(--primary-accent)">VERSION="2.0"</text>
  <text x="680" y="447" font-family="monospace" font-size="12" fill="var(--info-accent)"># readonly variable</text>

  <rect x="665" y="470" width="250" height="36" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="790" y="493" font-family="sans-serif" font-size="13" fill="var(--danger-accent)" text-anchor="middle">For constants and config</text>

  <!-- Card 4: Array -->
  <rect x="955" y="30" width="285" height="560" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="955" y="30" width="285" height="56" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="955" y="74" width="285" height="12" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1097" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Array</text>

  <text x="1097" y="108" font-family="monospace" font-size="14" fill="var(--text-muted)" text-anchor="middle">declare -a / declare -A</text>

  <rect x="970" y="122" width="255" height="110" rx="6" fill="var(--code-bg)"/>
  <text x="985" y="146" font-family="monospace" font-size="12" fill="var(--text-muted)"># indexed array</text>
  <text x="985" y="164" font-family="monospace" font-size="12" fill="var(--primary-accent)">arr=(a b c d)</text>
  <text x="985" y="182" font-family="monospace" font-size="12" fill="var(--ok-accent)">echo</text>
  <text x="1024" y="182" font-family="monospace" font-size="12" fill="var(--primary-accent)"> "${arr[0]}"</text>
  <text x="985" y="200" font-family="monospace" font-size="12" fill="var(--text-muted)"># a</text>
  <text x="985" y="218" font-family="monospace" font-size="12" fill="var(--text-muted)"># assoc: declare -A map</text>

  <text x="970" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">Two types:</text>
  <text x="970" y="278" font-family="sans-serif" font-size="12" fill="var(--text)">• Indexed (-a): numbered keys</text>
  <text x="970" y="298" font-family="sans-serif" font-size="12" fill="var(--text)">• Associative (-A): string keys</text>
  <text x="970" y="318" font-family="sans-serif" font-size="12" fill="var(--text)">• ${arr[@]} = all elements</text>
  <text x="970" y="338" font-family="sans-serif" font-size="12" fill="var(--text)">• ${#arr[@]} = count</text>

  <rect x="970" y="355" width="255" height="100" rx="6" fill="var(--code-bg)"/>
  <text x="985" y="375" font-family="monospace" font-size="12" fill="var(--ok-accent)">declare</text>
  <text x="1044" y="375" font-family="monospace" font-size="12" fill="var(--primary-accent)"> -A user</text>
  <text x="985" y="393" font-family="monospace" font-size="12" fill="var(--primary-accent)">user[name]="Alice"</text>
  <text x="985" y="411" font-family="monospace" font-size="12" fill="var(--primary-accent)">user[age]=30</text>
  <text x="985" y="429" font-family="monospace" font-size="12" fill="var(--ok-accent)">echo</text>
  <text x="1024" y="429" font-family="monospace" font-size="12" fill="var(--primary-accent)"> "${user[name]}"</text>
  <text x="985" y="447" font-family="monospace" font-size="12" fill="var(--text-muted)"># Alice</text>

  <rect x="970" y="470" width="255" height="36" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1097" y="493" font-family="sans-serif" font-size="13" fill="var(--warn-accent)" text-anchor="middle">For collections of values</text>
</svg>

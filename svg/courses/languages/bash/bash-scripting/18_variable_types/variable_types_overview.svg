<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Card 1: String (default) -->
  <rect x="77.5" y="67.1875" width="262.5" height="507.5" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="77.5" y="67.1875" width="262.5" height="50.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="77.5" y="107.0625" width="262.5" height="10.875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="208.75" y="99.8125" font-family="sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">String</text>

  <text x="208.75" y="137.875" font-family="monospace" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">declare (default)</text>

  <rect x="91.5625" y="150.5625" width="234.375" height="99.6875" rx="6" fill="var(--code-bg)"/>
  <text x="105.625" y="172.3125" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># default assignment</text>
  <text x="105.625" y="190.4375" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">x="hello"</text>
  <text x="105.625" y="208.5625" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">name=Alice</text>
  <text x="105.625" y="226.6875" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">count=42</text>
  <text x="105.625" y="239.375" font-family="monospace" font-size="10.1392" fill="var(--text-muted)"># (stored as string)</text>

  <text x="91.5625" y="273.8125" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Behavior:</text>
  <text x="91.5625" y="291.9375" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• All values are strings</text>
  <text x="91.5625" y="310.0625" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Can hold any text</text>
  <text x="91.5625" y="328.1875" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Arithmetic needs $(( ))</text>
  <text x="91.5625" y="346.3125" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Length: ${#x}</text>

  <rect x="91.5625" y="361.7188" width="234.375" height="90.625" rx="6" fill="var(--code-bg)"/>
  <text x="105.625" y="379.8438" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># string operations</text>
  <text x="105.625" y="396.1562" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">echo</text>
  <text x="138.4375" y="396.1562" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)"> "${x^^}"</text>
  <text x="105.625" y="412.4688" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># HELLO</text>
  <text x="105.625" y="428.7812" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">echo</text>
  <text x="138.4375" y="428.7812" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)"> "${x:0:3}"</text>
  <text x="105.625" y="445.0938" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># hel</text>

  <rect x="91.5625" y="465.9375" width="234.375" height="32.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="208.75" y="486.7812" font-family="sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">Default for all variables</text>

  <!-- Card 2: Integer -->
  <rect x="363.4375" y="67.1875" width="262.5" height="507.5" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="363.4375" y="67.1875" width="262.5" height="50.75" rx="6" fill="var(--ok-accent)"/>
  <rect x="363.4375" y="107.0625" width="262.5" height="10.875" fill="var(--ok-accent)" rx="6"/>
  <text x="494.6875" y="99.8125" font-family="sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integer</text>

  <text x="494.6875" y="137.875" font-family="monospace" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">declare -i</text>

  <rect x="377.5" y="150.5625" width="234.375" height="99.6875" rx="6" fill="var(--code-bg)"/>
  <text x="391.5625" y="172.3125" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># integer declaration</text>
  <text x="391.5625" y="190.4375" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">declare</text>
  <text x="446.875" y="190.4375" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> -i num</text>
  <text x="391.5625" y="208.5625" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">num=5+3</text>
  <text x="391.5625" y="226.6875" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="428.125" y="226.6875" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> $num</text>
  <text x="391.5625" y="239.375" font-family="monospace" font-size="10.1392" fill="var(--text-muted)"># 8  (auto arithmetic)</text>

  <text x="377.5" y="273.8125" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">Behavior:</text>
  <text x="377.5" y="291.9375" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Assignments evaluated as math</text>
  <text x="377.5" y="310.0625" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Strings become 0</text>
  <text x="377.5" y="328.1875" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Integer division truncates</text>
  <text x="377.5" y="346.3125" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Stored as string internally</text>

  <rect x="377.5" y="361.7188" width="234.375" height="90.625" rx="6" fill="var(--code-bg)"/>
  <text x="391.5625" y="379.8438" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">declare</text>
  <text x="446.875" y="379.8438" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)"> -i a=5 b=3 c</text>
  <text x="391.5625" y="396.1562" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">c=a+b</text>
  <text x="391.5625" y="412.4688" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">echo</text>
  <text x="428.125" y="412.4688" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)"> $c</text>
  <text x="391.5625" y="428.7812" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># 8</text>
  <text x="391.5625" y="445.0938" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">num="hello"</text>
  <text x="391.5625" y="445.0938" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"> → 0</text>

  <rect x="377.5" y="465.9375" width="234.375" height="32.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="494.6875" y="486.7812" font-family="sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">For counters and math vars</text>

  <!-- Card 3: Readonly -->
  <rect x="649.375" y="67.1875" width="262.5" height="507.5" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="649.375" y="67.1875" width="262.5" height="50.75" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="649.375" y="107.0625" width="262.5" height="10.875" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="780.625" y="99.8125" font-family="sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">Readonly</text>

  <text x="780.625" y="137.875" font-family="monospace" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">declare -r</text>

  <rect x="663.4375" y="150.5625" width="234.375" height="99.6875" rx="6" fill="var(--code-bg)"/>
  <text x="677.5" y="172.3125" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># readonly constant</text>
  <text x="677.5" y="190.4375" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">declare</text>
  <text x="732.8125" y="190.4375" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> -r MAX=100</text>
  <text x="677.5" y="208.5625" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># or:</text>
  <text x="677.5" y="226.6875" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">readonly</text>
  <text x="739.375" y="226.6875" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> PI=3.14159</text>
  <text x="677.5" y="241.1875" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">MAX=200  # error!</text>

  <text x="663.4375" y="273.8125" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--danger-accent)">Behavior:</text>
  <text x="663.4375" y="291.9375" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Cannot be reassigned</text>
  <text x="663.4375" y="310.0625" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Cannot be unset</text>
  <text x="663.4375" y="328.1875" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Error if modified</text>
  <text x="663.4375" y="346.3125" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Persists for shell lifetime</text>

  <rect x="663.4375" y="361.7188" width="234.375" height="90.625" rx="6" fill="var(--code-bg)"/>
  <text x="677.5" y="379.8438" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">readonly</text>
  <text x="739.375" y="379.8438" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)"> CONFIG="/etc/app"</text>
  <text x="677.5" y="396.1562" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">readonly</text>
  <text x="739.375" y="396.1562" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)"> VERSION="1.0"</text>
  <text x="677.5" y="412.4688" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># attempt to change:</text>
  <text x="677.5" y="428.7812" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">VERSION="2.0"</text>
  <text x="677.5" y="445.0938" font-family="monospace" font-size="11.0609" fill="var(--info-accent)"># readonly variable</text>

  <rect x="663.4375" y="465.9375" width="234.375" height="32.625" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="780.625" y="486.7812" font-family="sans-serif" font-size="11.9827" fill="var(--danger-accent)" text-anchor="middle">For constants and config</text>

  <!-- Card 4: Array -->
  <rect x="935.3125" y="67.1875" width="267.1875" height="507.5" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="935.3125" y="67.1875" width="267.1875" height="50.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="935.3125" y="107.0625" width="267.1875" height="10.875" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1068.4375" y="99.8125" font-family="sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">Array</text>

  <text x="1068.4375" y="137.875" font-family="monospace" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">declare -a / declare -A</text>

  <rect x="949.375" y="150.5625" width="239.0625" height="99.6875" rx="6" fill="var(--code-bg)"/>
  <text x="963.4375" y="172.3125" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># indexed array</text>
  <text x="963.4375" y="188.625" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">arr=(a b c d)</text>
  <text x="963.4375" y="204.9375" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">echo</text>
  <text x="1000" y="204.9375" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)"> "${arr[0]}"</text>
  <text x="963.4375" y="221.25" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># a</text>
  <text x="963.4375" y="237.5625" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># assoc: declare -A map</text>

  <text x="949.375" y="273.8125" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">Two types:</text>
  <text x="949.375" y="291.9375" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Indexed (-a): numbered keys</text>
  <text x="949.375" y="310.0625" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Associative (-A): string keys</text>
  <text x="949.375" y="328.1875" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• ${arr[@]} = all elements</text>
  <text x="949.375" y="346.3125" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• ${#arr[@]} = count</text>

  <rect x="949.375" y="361.7188" width="239.0625" height="90.625" rx="6" fill="var(--code-bg)"/>
  <text x="963.4375" y="379.8438" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">declare</text>
  <text x="1018.75" y="379.8438" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)"> -A user</text>
  <text x="963.4375" y="396.1562" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">user[name]="Alice"</text>
  <text x="963.4375" y="412.4688" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">user[age]=30</text>
  <text x="963.4375" y="428.7812" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">echo</text>
  <text x="1000" y="428.7812" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)"> "${user[name]}"</text>
  <text x="963.4375" y="445.0938" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Alice</text>

  <rect x="949.375" y="465.9375" width="239.0625" height="32.625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1068.4375" y="486.7812" font-family="sans-serif" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle">For collections of values</text>
</svg>

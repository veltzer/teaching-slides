<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.579135622711" font-weight="bold" fill="var(--primary-accent)">Bash Variable Types</text>

  <!-- Four cards -->
  <rect x="40" y="76.576576576577" width="290" height="543.423423423423" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490037834601" font-weight="bold" fill="var(--primary-text)">String</text>
  <text x="185" y="160.18018018018" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--primary-text)">declare (default)</text>
  <text x="185" y="212.432432432432" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--primary-text)">x="hello"</text>
  <text x="185" y="243.783783783784" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--primary-text)">name=Alice</text>
  <text x="185" y="275.135135135135" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--primary-text)">count=42</text>
  <text x="185" y="337.837837837838" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">All values strings</text>
  <text x="185" y="369.189189189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">${#x} length</text>
  <text x="185" y="400.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">${x^^} upper</text>
  <text x="185" y="431.891891891892" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">${x:0:3} slice</text>
  <text x="185" y="578.198198198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">Default type</text>

  <rect x="340" y="76.576576576577" width="290" height="543.423423423423" rx="10.222744470273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490037834601" font-weight="bold" fill="var(--ok-text)">Integer</text>
  <text x="485" y="160.18018018018" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--ok-text)">declare -i</text>
  <text x="485" y="212.432432432432" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--ok-text)">declare -i n</text>
  <text x="485" y="243.783783783784" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--ok-text)">n=5+3   # 8</text>
  <text x="485" y="275.135135135135" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--ok-text)">c=a+b</text>
  <text x="485" y="337.837837837838" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">Auto arithmetic</text>
  <text x="485" y="369.189189189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">Strings become 0</text>
  <text x="485" y="400.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">Truncating divide</text>
  <text x="485" y="578.198198198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">For counters</text>

  <rect x="640" y="76.576576576577" width="290" height="543.423423423423" rx="10.222744470273" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490037834601" font-weight="bold" fill="var(--danger-text)">Readonly</text>
  <text x="785" y="160.18018018018" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--danger-text)">declare -r</text>
  <text x="785" y="212.432432432432" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">readonly MAX=100</text>
  <text x="785" y="243.783783783784" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">readonly PI=3.14</text>
  <text x="785" y="275.135135135135" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">MAX=200   # error</text>
  <text x="785" y="337.837837837838" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--danger-text)">Cannot reassign</text>
  <text x="785" y="369.189189189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--danger-text)">Cannot unset</text>
  <text x="785" y="400.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--danger-text)">Lives shell lifetime</text>
  <text x="785" y="578.198198198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--danger-text)">For constants</text>

  <rect x="940" y="76.576576576577" width="300" height="543.423423423423" rx="10.222744470273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490037834601" font-weight="bold" fill="var(--warn-text)">Array</text>
  <text x="1090" y="160.18018018018" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--warn-text)">declare -a / -A</text>
  <text x="1090" y="212.432432432432" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--warn-text)">arr=(a b c d)</text>
  <text x="1090" y="243.783783783784" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--warn-text)">${arr[0]}</text>
  <text x="1090" y="275.135135135135" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--warn-text)">declare -A map</text>
  <text x="1090" y="337.837837837838" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">-a indexed keys</text>
  <text x="1090" y="369.189189189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">-A string keys</text>
  <text x="1090" y="400.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">${#arr[@]} count</text>
  <text x="1090" y="578.198198198198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">For collections</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Four cards -->
  <rect x="40" y="40" width="290" height="580" rx="10.561177090573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="90.192307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599262" font-weight="bold" fill="var(--primary-text)">String</text>
  <text x="185" y="129.230769230769" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--primary-text)">declare (default)</text>
  <text x="185" y="184.999999999999" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--primary-text)">x="hello"</text>
  <text x="185" y="218.461538461538" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--primary-text)">name=Alice</text>
  <text x="185" y="251.923076923077" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--primary-text)">count=42</text>
  <text x="185" y="318.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">All values strings</text>
  <text x="185" y="352.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">${#x} length</text>
  <text x="185" y="385.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">${x^^} upper</text>
  <text x="185" y="419.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">${x:0:3} slice</text>
  <text x="185" y="575.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">Default type</text>

  <rect x="340" y="40" width="290" height="580" rx="10.561177090573" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="90.192307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599262" font-weight="bold" fill="var(--ok-text)">Integer</text>
  <text x="485" y="129.230769230769" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--ok-text)">declare -i</text>
  <text x="485" y="184.999999999999" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--ok-text)">declare -i n</text>
  <text x="485" y="218.461538461538" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--ok-text)">n=5+3   # 8</text>
  <text x="485" y="251.923076923077" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--ok-text)">c=a+b</text>
  <text x="485" y="318.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">Auto arithmetic</text>
  <text x="485" y="352.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">Strings become 0</text>
  <text x="485" y="385.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">Truncating divide</text>
  <text x="485" y="575.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">For counters</text>

  <rect x="640" y="40" width="290" height="580" rx="10.561177090573" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="90.192307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599262" font-weight="bold" fill="var(--danger-text)">Readonly</text>
  <text x="785" y="129.230769230769" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--danger-text)">declare -r</text>
  <text x="785" y="184.999999999999" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--danger-text)">readonly MAX=100</text>
  <text x="785" y="218.461538461538" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--danger-text)">readonly PI=3.14</text>
  <text x="785" y="251.923076923077" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--danger-text)">MAX=200   # error</text>
  <text x="785" y="318.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--danger-text)">Cannot reassign</text>
  <text x="785" y="352.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--danger-text)">Cannot unset</text>
  <text x="785" y="385.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--danger-text)">Lives shell lifetime</text>
  <text x="785" y="575.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--danger-text)">For constants</text>

  <rect x="940" y="40" width="300" height="580" rx="10.561177090573" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="90.192307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599262" font-weight="bold" fill="var(--warn-text)">Array</text>
  <text x="1090" y="129.230769230769" text-anchor="middle" font-family="Courier New, monospace" font-size="14.785647926804" fill="var(--warn-text)">declare -a / -A</text>
  <text x="1090" y="184.999999999999" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--warn-text)">arr=(a b c d)</text>
  <text x="1090" y="218.461538461538" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--warn-text)">${arr[0]}</text>
  <text x="1090" y="251.923076923077" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--warn-text)">declare -A map</text>
  <text x="1090" y="318.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">-a indexed keys</text>
  <text x="1090" y="352.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">-A string keys</text>
  <text x="1090" y="385.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">${#arr[@]} count</text>
  <text x="1090" y="575.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">For collections</text>
</svg>

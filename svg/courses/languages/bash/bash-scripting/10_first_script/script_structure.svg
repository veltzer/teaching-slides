<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Left column: script sections stacked -->

  <!-- Shebang -->
  <rect x="60" y="30" width="540" height="70" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="150" y="55" font-family="monospace" font-size="16" fill="var(--primary-lt)" font-weight="bold">1. Shebang Line</text>
  <text x="80" y="82" font-family="monospace" font-size="18" fill="var(--bg)">#!/bin/bash</text>
  <!-- bracket label -->
  <line x1="610" y1="30" x2="640" y2="30" stroke="var(--primary)" stroke-width="2"/>
  <line x1="640" y1="30" x2="640" y2="65" stroke="var(--primary)" stroke-width="2"/>
  <line x1="640" y1="65" x2="610" y2="65" stroke="var(--primary)" stroke-width="2"/>
  <text x="650" y="68" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">tells OS which interpreter</text>

  <!-- Comments / Header -->
  <rect x="60" y="120" width="540" height="80" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="145" font-family="monospace" font-size="14" fill="var(--ok-dk)" font-weight="bold">2. Header Comments</text>
  <text x="80" y="168" font-family="monospace" font-size="14" fill="var(--text-dark)"># Description: what this script does</text>
  <text x="80" y="188" font-family="monospace" font-size="14" fill="var(--text-dark)"># Usage: ./script.sh [options]</text>
  <line x1="610" y1="120" x2="640" y2="120" stroke="var(--ok)" stroke-width="2"/>
  <line x1="640" y1="120" x2="640" y2="160" stroke="var(--ok)" stroke-width="2"/>
  <line x1="640" y1="160" x2="610" y2="160" stroke="var(--ok)" stroke-width="2"/>
  <text x="650" y="148" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-dk)">documents purpose</text>
  <text x="650" y="166" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-dk)">and usage</text>

  <!-- Safety options -->
  <rect x="60" y="220" width="540" height="80" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="245" font-family="monospace" font-size="14" fill="var(--warn-dk)" font-weight="bold">3. Safety Options</text>
  <text x="80" y="268" font-family="monospace" font-size="14" fill="var(--text-dark)">set -euo pipefail</text>
  <text x="80" y="288" font-family="monospace" font-size="14" fill="var(--text-dark)">IFS=$'\n\t'</text>
  <line x1="610" y1="220" x2="640" y2="220" stroke="var(--warn)" stroke-width="2"/>
  <line x1="640" y1="220" x2="640" y2="260" stroke="var(--warn)" stroke-width="2"/>
  <line x1="640" y1="260" x2="610" y2="260" stroke="var(--warn)" stroke-width="2"/>
  <text x="650" y="248" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)">enables strict mode</text>

  <!-- Functions -->
  <rect x="60" y="320" width="540" height="100" rx="8" fill="url(#grad-surface)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="345" font-family="monospace" font-size="14" fill="var(--info-dk)" font-weight="bold">4. Function Definitions</text>
  <text x="80" y="368" font-family="monospace" font-size="14" fill="var(--text-dark)">usage() { echo "Usage: ..."; exit 0; }</text>
  <text x="80" y="388" font-family="monospace" font-size="14" fill="var(--text-dark)">check_deps() { ... }</text>
  <text x="80" y="408" font-family="monospace" font-size="14" fill="var(--text-dark)">do_work() { ... }</text>
  <line x1="610" y1="320" x2="640" y2="320" stroke="var(--info)" stroke-width="2"/>
  <line x1="640" y1="320" x2="640" y2="370" stroke="var(--info)" stroke-width="2"/>
  <line x1="640" y1="370" x2="610" y2="370" stroke="var(--info)" stroke-width="2"/>
  <text x="650" y="348" font-family="Arial, sans-serif" font-size="13" fill="var(--info-dk)">define before calling</text>

  <!-- Main logic -->
  <rect x="60" y="440" width="540" height="100" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="465" font-family="monospace" font-size="14" fill="var(--primary-dk)" font-weight="bold">5. Main Logic</text>
  <text x="80" y="488" font-family="monospace" font-size="14" fill="var(--text-dark)">parse_args "$@"</text>
  <text x="80" y="508" font-family="monospace" font-size="14" fill="var(--text-dark)">check_deps</text>
  <text x="80" y="528" font-family="monospace" font-size="14" fill="var(--text-dark)">do_work</text>
  <line x1="610" y1="440" x2="640" y2="440" stroke="var(--primary)" stroke-width="2"/>
  <line x1="640" y1="440" x2="640" y2="490" stroke="var(--primary)" stroke-width="2"/>
  <line x1="640" y1="490" x2="610" y2="490" stroke="var(--primary)" stroke-width="2"/>
  <text x="650" y="468" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">orchestrates execution</text>

  <!-- Exit code -->
  <rect x="60" y="560" width="540" height="55" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="80" y="583" font-family="monospace" font-size="14" fill="var(--primary-lt)" font-weight="bold">6. Exit Code</text>
  <text x="80" y="603" font-family="monospace" font-size="16" fill="var(--bg)">exit 0   # success</text>
  <line x1="610" y1="560" x2="640" y2="560" stroke="var(--primary)" stroke-width="2"/>
  <line x1="640" y1="560" x2="640" y2="588" stroke="var(--primary)" stroke-width="2"/>
  <line x1="640" y1="588" x2="610" y2="588" stroke="var(--primary)" stroke-width="2"/>
  <text x="650" y="576" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-dk)">0=success, 1-255=error</text>

  <!-- Right side: key points -->
  <rect x="800" y="30" width="440" height="175" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="58" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Making a Script Executable</text>
  <text x="820" y="84" font-family="monospace" font-size="14" fill="var(--text-dark)"># Create the file</text>
  <text x="820" y="104" font-family="monospace" font-size="14" fill="var(--text-dark)">nano myscript.sh</text>
  <text x="820" y="128" font-family="monospace" font-size="14" fill="var(--text-dark)"># Make it executable</text>
  <text x="820" y="148" font-family="monospace" font-size="14" fill="var(--text-dark)">chmod +x myscript.sh</text>
  <text x="820" y="172" font-family="monospace" font-size="14" fill="var(--text-dark)"># Run it</text>
  <text x="820" y="192" font-family="monospace" font-size="14" fill="var(--text-dark)">./myscript.sh</text>

  <rect x="800" y="230" width="440" height="175" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="258" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Good Practices</text>
  <text x="820" y="283" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">- One task per function</text>
  <text x="820" y="305" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">- Quote all variables: "$var"</text>
  <text x="820" y="327" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">- Local variables in functions</text>
  <text x="820" y="349" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">- Descriptive names</text>
  <text x="820" y="371" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">- Handle errors explicitly</text>
  <text x="820" y="393" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">- Test with edge cases</text>

  <rect x="800" y="430" width="440" height="155" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="458" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">Argument Handling</text>
  <text x="820" y="483" font-family="monospace" font-size="13" fill="var(--text-dark)">$0  - script name</text>
  <text x="820" y="503" font-family="monospace" font-size="13" fill="var(--text-dark)">$1,$2...  - positional args</text>
  <text x="820" y="523" font-family="monospace" font-size="13" fill="var(--text-dark)">$#  - number of args</text>
  <text x="820" y="543" font-family="monospace" font-size="13" fill="var(--text-dark)">$@  - all args (quoted)</text>
  <text x="820" y="563" font-family="monospace" font-size="13" fill="var(--text-dark)">$*  - all args as one string</text>
</svg>

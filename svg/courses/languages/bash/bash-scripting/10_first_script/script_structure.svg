<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.699676538728" font-weight="bold" fill="var(--primary-accent)">Bash Script Structure</text>

  <rect x="40" y="71.636363636364" width="600" height="68.545454545455" rx="6.16146381663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="98" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--primary-text)">1. Shebang</text>
  <text x="60" y="124.363636363636" font-family="Courier New, monospace" font-size="16.430570177679" fill="var(--primary-text)">#!/bin/bash</text>

  <rect x="40" y="150.727272727273" width="600" height="84.363636363636" rx="6.16146381663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="177.090909090909" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--ok-text)">2. Header</text>
  <text x="60" y="203.454545454545" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--ok-text)"># Description, usage</text>

  <rect x="40" y="245.636363636364" width="600" height="84.363636363636" rx="6.16146381663" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="272" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--warn-text)">3. Safety</text>
  <text x="60" y="298.363636363636" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">set -euo pipefail</text>

  <rect x="40" y="340.545454545455" width="600" height="105.454545454545" rx="6.16146381663" fill="var(--surface)" stroke="var(--border)"/>
  <text x="60" y="366.909090909091" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--info-accent)">4. Functions</text>
  <text x="60" y="393.272727272727" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--text)">usage(), check_deps()</text>
  <text x="60" y="419.636363636364" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--text)">do_work()</text>

  <rect x="40" y="456.545454545455" width="600" height="105.454545454545" rx="6.16146381663" fill="var(--surface)" stroke="var(--border)"/>
  <text x="60" y="482.909090909091" font-family="Arial, sans-serif" font-size="14.376748905469" font-weight="bold" fill="var(--primary-accent)">5. Main Logic</text>
  <text x="60" y="509.272727272727" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--text)">parse_args; do_work</text>

  <rect x="40" y="572.545454545455" width="600" height="47.454545454545" rx="6.16146381663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="602.072727272727" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">6. exit 0</text>

  <rect x="660" y="71.636363636364" width="580" height="168.727272727273" rx="6.16146381663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="103.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" font-weight="bold" fill="var(--primary-text)">Make Executable</text>
  <text x="680" y="134.909090909091" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">chmod +x myscript.sh</text>
  <text x="680" y="171.818181818182" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">./myscript.sh</text>
  <text x="680" y="214" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">Shebang picks the interpreter</text>

  <rect x="660" y="261.454545454545" width="580" height="168.727272727273" rx="6.16146381663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="293.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" font-weight="bold" fill="var(--ok-text)">Good Practices</text>
  <text x="680" y="324.727272727273" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--ok-text)">Quote variables: "$var"</text>
  <text x="680" y="351.090909090909" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--ok-text)">Use local in functions</text>
  <text x="680" y="377.454545454545" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--ok-text)">Handle errors explicitly</text>
  <text x="680" y="403.818181818182" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--ok-text)">Test edge cases</text>

  <rect x="660" y="451.272727272727" width="580" height="168.727272727273" rx="6.16146381663" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="482.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" font-weight="bold" fill="var(--warn-text)">Argument Vars</text>
  <text x="680" y="514.545454545455" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">$0   script name</text>
  <text x="680" y="540.909090909091" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">$1.. positional</text>
  <text x="680" y="567.272727272727" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">$#   count</text>
  <text x="680" y="593.636363636364" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--warn-text)">$@   all (quoted)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- Left column: script sections stacked -->

  <!-- Shebang -->
  <rect x="40" y="40" width="549.152542" height="69.401703" rx="6.536229" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="131.525424" y="64.786377" font-family="monospace" font-size="16.065942" fill="var(--primary-accent)" font-weight="bold">1. Shebang Line</text>
  <text x="60.338983" y="91.555551" font-family="monospace" font-size="18.074199" fill="var(--bg)">#!/bin/bash</text>
  <!-- bracket label -->
  <line x1="599.322034" y1="40" x2="629.830508" y2="40" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="629.830508" y1="40" x2="629.830508" y2="74.700797" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="629.830508" y1="74.700797" x2="599.322034" y2="74.700797" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="77.67521" font-family="Arial, sans-serif" font-size="13.053612" fill="var(--primary-accent)">tells OS which interpreter</text>

  <!-- Comments / Header -->
  <rect x="40" y="129.230761" width="549.152542" height="79.316232" rx="6.536229" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.338983" y="154.017029" font-family="monospace" font-size="14.057686" fill="var(--ok-accent)" font-weight="bold">2. Header Comments</text>
  <text x="60.338983" y="176.8205" font-family="monospace" font-size="14.057686" fill="var(--text)"># Description: what this script does</text>
  <text x="60.338983" y="196.649558" font-family="monospace" font-size="14.057686" fill="var(--text)"># Usage: ./script.sh [options]</text>
  <line x1="599.322034" y1="129.230761" x2="629.830508" y2="129.230761" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="629.830508" y1="129.230761" x2="629.830508" y2="168.888877" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="629.830508" y1="168.888877" x2="599.322034" y2="168.888877" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="156.991442" font-family="Arial, sans-serif" font-size="13.053612" fill="var(--ok-accent)">documents purpose</text>
  <text x="640" y="174.837594" font-family="Arial, sans-serif" font-size="13.053612" fill="var(--ok-accent)">and usage</text>

  <!-- Safety options -->
  <rect x="40" y="228.376051" width="549.152542" height="79.316232" rx="6.536229" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.338983" y="253.162318" font-family="monospace" font-size="14.057686" fill="var(--warn-accent)" font-weight="bold">3. Safety Options</text>
  <text x="60.338983" y="275.96579" font-family="monospace" font-size="14.057686" fill="var(--text)">set -euo pipefail</text>
  <text x="60.338983" y="295.794848" font-family="monospace" font-size="14.057686" fill="var(--text)">IFS=$'\n\t'</text>
  <line x1="599.322034" y1="228.376051" x2="629.830508" y2="228.376051" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="629.830508" y1="228.376051" x2="629.830508" y2="268.034167" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="629.830508" y1="268.034167" x2="599.322034" y2="268.034167" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="256.136732" font-family="Arial, sans-serif" font-size="13.053612" fill="var(--warn-accent)">enables strict mode</text>

  <!-- Functions -->
  <rect x="40" y="327.52134" width="549.152542" height="99.14529" rx="6.536229" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60.338983" y="352.307608" font-family="monospace" font-size="14.057686" fill="var(--info-accent)" font-weight="bold">4. Function Definitions</text>
  <text x="60.338983" y="375.11108" font-family="monospace" font-size="14.057686" fill="var(--text)">usage() { echo "Usage: ..."; exit 0; }</text>
  <text x="60.338983" y="394.940137" font-family="monospace" font-size="14.057686" fill="var(--text)">check_deps() { ... }</text>
  <text x="60.338983" y="414.769195" font-family="monospace" font-size="14.057686" fill="var(--text)">do_work() { ... }</text>
  <line x1="599.322034" y1="327.52134" x2="629.830508" y2="327.52134" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="629.830508" y1="327.52134" x2="629.830508" y2="377.093985" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="629.830508" y1="377.093985" x2="599.322034" y2="377.093985" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="355.282022" font-family="Arial, sans-serif" font-size="13.053612" fill="var(--info-accent)">define before calling</text>

  <!-- Main logic -->
  <rect x="40" y="446.495688" width="549.152542" height="99.14529" rx="6.536229" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60.338983" y="471.281956" font-family="monospace" font-size="14.057686" fill="var(--primary-accent)" font-weight="bold">5. Main Logic</text>
  <text x="60.338983" y="494.085427" font-family="monospace" font-size="14.057686" fill="var(--text)">parse_args "$@"</text>
  <text x="60.338983" y="513.914485" font-family="monospace" font-size="14.057686" fill="var(--text)">check_deps</text>
  <text x="60.338983" y="533.743543" font-family="monospace" font-size="14.057686" fill="var(--text)">do_work</text>
  <line x1="599.322034" y1="446.495688" x2="629.830508" y2="446.495688" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="629.830508" y1="446.495688" x2="629.830508" y2="496.068333" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="629.830508" y1="496.068333" x2="599.322034" y2="496.068333" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="474.256369" font-family="Arial, sans-serif" font-size="13.053612" fill="var(--primary-accent)">orchestrates execution</text>

  <!-- Exit code -->
  <rect x="40" y="565.470036" width="549.152542" height="54.529964" rx="6.536229" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="60.338983" y="588.273507" font-family="monospace" font-size="14.057686" fill="var(--primary-accent)" font-weight="bold">6. Exit Code</text>
  <text x="60.338983" y="608.102565" font-family="monospace" font-size="16.065942" fill="var(--bg)">exit 0   # success</text>
  <line x1="599.322034" y1="565.470036" x2="629.830508" y2="565.470036" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="629.830508" y1="565.470036" x2="629.830508" y2="593.230717" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="629.830508" y1="593.230717" x2="599.322034" y2="593.230717" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="581.333282" font-family="Arial, sans-serif" font-size="13.053612" fill="var(--primary-accent)">0=success, 1-255=error</text>

  <!-- Right side: key points -->
  <rect x="792.542373" y="40" width="447.457627" height="173.504312" rx="6.536229" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1016.271186" y="67.760681" font-family="Arial, sans-serif" font-size="16.065942" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Making a Script Executable</text>
  <text x="812.881356" y="93.538456" font-family="monospace" font-size="14.057686" fill="var(--text)"># Create the file</text>
  <text x="812.881356" y="113.367514" font-family="monospace" font-size="14.057686" fill="var(--text)">nano myscript.sh</text>
  <text x="812.881356" y="137.162384" font-family="monospace" font-size="14.057686" fill="var(--text)"># Make it executable</text>
  <text x="812.881356" y="156.991442" font-family="monospace" font-size="14.057686" fill="var(--text)">chmod +x myscript.sh</text>
  <text x="812.881356" y="180.786312" font-family="monospace" font-size="14.057686" fill="var(--text)"># Run it</text>
  <text x="812.881356" y="200.615369" font-family="monospace" font-size="14.057686" fill="var(--text)">./myscript.sh</text>

  <rect x="792.542373" y="238.29058" width="447.457627" height="173.504312" rx="6.536229" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1016.271186" y="266.051261" font-family="Arial, sans-serif" font-size="16.065942" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Good Practices</text>
  <text x="812.881356" y="290.837638" font-family="Arial, sans-serif" font-size="14.057686" fill="var(--text)">- One task per function</text>
  <text x="812.881356" y="312.649492" font-family="Arial, sans-serif" font-size="14.057686" fill="var(--text)">- Quote all variables: "$var"</text>
  <text x="812.881356" y="334.461565" font-family="Arial, sans-serif" font-size="14.057686" fill="var(--text)">- Local variables in functions</text>
  <text x="812.881356" y="356.27342" font-family="Arial, sans-serif" font-size="14.057686" fill="var(--text)">- Descriptive names</text>
  <text x="812.881356" y="378.085493" font-family="Arial, sans-serif" font-size="14.057686" fill="var(--text)">- Handle errors explicitly</text>
  <text x="812.881356" y="399.897347" font-family="Arial, sans-serif" font-size="14.057686" fill="var(--text)">- Test with edge cases</text>

  <rect x="792.542373" y="436.581159" width="447.457627" height="153.675254" rx="6.536229" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1016.271186" y="464.34184" font-family="Arial, sans-serif" font-size="16.065942" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Argument Handling</text>
  <text x="812.881356" y="489.128217" font-family="monospace" font-size="13.053612" fill="var(--text)">$0  - script name</text>
  <text x="812.881356" y="508.957275" font-family="monospace" font-size="13.053612" fill="var(--text)">$1,$2...  - positional args</text>
  <text x="812.881356" y="528.786333" font-family="monospace" font-size="13.053612" fill="var(--text)">$#  - number of args</text>
  <text x="812.881356" y="548.615391" font-family="monospace" font-size="13.053612" fill="var(--text)">$@  - all args (quoted)</text>
  <text x="812.881356" y="568.444449" font-family="monospace" font-size="13.053612" fill="var(--text)">$*  - all args as one string</text>
</svg>

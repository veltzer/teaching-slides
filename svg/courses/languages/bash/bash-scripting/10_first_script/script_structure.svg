<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="600" height="72.500000000001" rx="6.336706254345" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="67.884615384615" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--primary-text)">1. Shebang</text>
  <text x="60" y="95.76923076923" font-family="Courier New, monospace" font-size="16.897883344918" fill="var(--primary-text)">#!/bin/bash</text>

  <rect x="40" y="123.653846153846" width="600" height="89.230769230769" rx="6.336706254345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="151.538461538461" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--ok-text)">2. Header</text>
  <text x="60" y="179.423076923076" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--ok-text)"># Description, usage</text>

  <rect x="40" y="224.038461538462" width="600" height="89.230769230769" rx="6.336706254345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="251.923076923077" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--warn-text)">3. Safety</text>
  <text x="60" y="279.807692307692" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--warn-text)">set -euo pipefail</text>

  <rect x="40" y="324.423076923077" width="600" height="111.538461538461" rx="6.336706254345" fill="var(--surface)" stroke="var(--border)"/>
  <text x="60" y="352.307692307692" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--info-accent)">4. Functions</text>
  <text x="60" y="380.192307692307" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--text)">usage(), check_deps()</text>
  <text x="60" y="408.076923076923" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--text)">do_work()</text>

  <rect x="40" y="447.115384615385" width="600" height="111.538461538461" rx="6.336706254345" fill="var(--surface)" stroke="var(--border)"/>
  <text x="60" y="475" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--primary-accent)">5. Main Logic</text>
  <text x="60" y="502.884615384615" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--text)">parse_args; do_work</text>

  <rect x="40" y="569.807692307693" width="600" height="50.192307692307" rx="6.336706254345" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="601.038461538461" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--primary-text)">6. exit 0</text>

  <rect x="660" y="40" width="580" height="178.461538461539" rx="6.336706254345" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="73.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--primary-text)">Make Executable</text>
  <text x="680" y="106.923076923077" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--primary-text)">chmod +x myscript.sh</text>
  <text x="680" y="145.961538461538" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--primary-text)">./myscript.sh</text>
  <text x="680" y="190.576923076923" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">Shebang picks the interpreter</text>

  <rect x="660" y="240.76923076923" width="580" height="178.461538461539" rx="6.336706254345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="274.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--ok-text)">Good Practices</text>
  <text x="680" y="307.692307692308" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">Quote variables: "$var"</text>
  <text x="680" y="335.576923076923" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">Use local in functions</text>
  <text x="680" y="363.461538461538" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">Handle errors explicitly</text>
  <text x="680" y="391.346153846154" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">Test edge cases</text>

  <rect x="660" y="441.538461538461" width="580" height="178.461538461539" rx="6.336706254345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--warn-text)">Argument Vars</text>
  <text x="680" y="508.461538461539" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--warn-text)">$0   script name</text>
  <text x="680" y="536.346153846154" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--warn-text)">$1.. positional</text>
  <text x="680" y="564.230769230769" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--warn-text)">$#   count</text>
  <text x="680" y="592.115384615385" font-family="Courier New, monospace" font-size="14.785647926803" fill="var(--warn-text)">$@   all (quoted)</text>
</svg>

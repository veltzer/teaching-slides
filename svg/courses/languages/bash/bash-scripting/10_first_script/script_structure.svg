<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Left column: script sections stacked -->

  <!-- Shebang -->
  <rect x="96.25" y="67.1875" width="506.25" height="63.4375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180.625" y="89.8438" font-family="monospace" font-size="14.7479" fill="var(--primary-accent)" font-weight="bold">1. Shebang Line</text>
  <text x="115" y="114.3125" font-family="monospace" font-size="16.5914" fill="var(--bg)">#!/bin/bash</text>
  <!-- bracket label -->
  <line x1="611.875" y1="67.1875" x2="640" y2="67.1875" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="67.1875" x2="640" y2="98.9062" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="98.9062" x2="611.875" y2="98.9062" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="649.375" y="101.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)">tells OS which interpreter</text>

  <!-- Comments / Header -->
  <rect x="96.25" y="148.75" width="506.25" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="171.4062" font-family="monospace" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">2. Header Comments</text>
  <text x="115" y="192.25" font-family="monospace" font-size="12.9044" fill="var(--text)"># Description: what this script does</text>
  <text x="115" y="210.375" font-family="monospace" font-size="12.9044" fill="var(--text)"># Usage: ./script.sh [options]</text>
  <line x1="611.875" y1="148.75" x2="640" y2="148.75" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="640" y1="148.75" x2="640" y2="185" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="640" y1="185" x2="611.875" y2="185" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="649.375" y="174.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)">documents purpose</text>
  <text x="649.375" y="190.4375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--ok-accent)">and usage</text>

  <!-- Safety options -->
  <rect x="96.25" y="239.375" width="506.25" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="262.0312" font-family="monospace" font-size="12.9044" fill="var(--warn-accent)" font-weight="bold">3. Safety Options</text>
  <text x="115" y="282.875" font-family="monospace" font-size="12.9044" fill="var(--text)">set -euo pipefail</text>
  <text x="115" y="301" font-family="monospace" font-size="12.9044" fill="var(--text)">IFS=$'\n\t'</text>
  <line x1="611.875" y1="239.375" x2="640" y2="239.375" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="640" y1="239.375" x2="640" y2="275.625" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="640" y1="275.625" x2="611.875" y2="275.625" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="649.375" y="264.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--warn-accent)">enables strict mode</text>

  <!-- Functions -->
  <rect x="96.25" y="330" width="506.25" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="115" y="352.6562" font-family="monospace" font-size="12.9044" fill="var(--info-accent)" font-weight="bold">4. Function Definitions</text>
  <text x="115" y="373.5" font-family="monospace" font-size="12.9044" fill="var(--text)">usage() { echo "Usage: ..."; exit 0; }</text>
  <text x="115" y="391.625" font-family="monospace" font-size="12.9044" fill="var(--text)">check_deps() { ... }</text>
  <text x="115" y="409.75" font-family="monospace" font-size="12.9044" fill="var(--text)">do_work() { ... }</text>
  <line x1="611.875" y1="330" x2="640" y2="330" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="640" y1="330" x2="640" y2="375.3125" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="640" y1="375.3125" x2="611.875" y2="375.3125" stroke="var(--info-border)" stroke-width="2"/>
  <text x="649.375" y="355.375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--info-accent)">define before calling</text>

  <!-- Main logic -->
  <rect x="96.25" y="438.75" width="506.25" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="115" y="461.4062" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" font-weight="bold">5. Main Logic</text>
  <text x="115" y="482.25" font-family="monospace" font-size="12.9044" fill="var(--text)">parse_args "$@"</text>
  <text x="115" y="500.375" font-family="monospace" font-size="12.9044" fill="var(--text)">check_deps</text>
  <text x="115" y="518.5" font-family="monospace" font-size="12.9044" fill="var(--text)">do_work</text>
  <line x1="611.875" y1="438.75" x2="640" y2="438.75" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="438.75" x2="640" y2="484.0625" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="484.0625" x2="611.875" y2="484.0625" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="649.375" y="464.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)">orchestrates execution</text>

  <!-- Exit code -->
  <rect x="96.25" y="547.5" width="506.25" height="49.8438" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="115" y="568.3438" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)" font-weight="bold">6. Exit Code</text>
  <text x="115" y="586.4688" font-family="monospace" font-size="14.7479" fill="var(--bg)">exit 0   # success</text>
  <line x1="611.875" y1="547.5" x2="640" y2="547.5" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="547.5" x2="640" y2="572.875" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="572.875" x2="611.875" y2="572.875" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="649.375" y="562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)">0=success, 1-255=error</text>

  <!-- Right side: key points -->
  <rect x="790" y="67.1875" width="412.5" height="158.5938" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="996.25" y="92.5625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Making a Script Executable</text>
  <text x="808.75" y="116.125" font-family="monospace" font-size="12.9044" fill="var(--text)"># Create the file</text>
  <text x="808.75" y="134.25" font-family="monospace" font-size="12.9044" fill="var(--text)">nano myscript.sh</text>
  <text x="808.75" y="156" font-family="monospace" font-size="12.9044" fill="var(--text)"># Make it executable</text>
  <text x="808.75" y="174.125" font-family="monospace" font-size="12.9044" fill="var(--text)">chmod +x myscript.sh</text>
  <text x="808.75" y="195.875" font-family="monospace" font-size="12.9044" fill="var(--text)"># Run it</text>
  <text x="808.75" y="214" font-family="monospace" font-size="12.9044" fill="var(--text)">./myscript.sh</text>

  <rect x="790" y="248.4375" width="412.5" height="158.5938" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="996.25" y="273.8125" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Good Practices</text>
  <text x="808.75" y="296.4688" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">- One task per function</text>
  <text x="808.75" y="316.4062" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">- Quote all variables: "$var"</text>
  <text x="808.75" y="336.3438" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">- Local variables in functions</text>
  <text x="808.75" y="356.2812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">- Descriptive names</text>
  <text x="808.75" y="376.2188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">- Handle errors explicitly</text>
  <text x="808.75" y="396.1562" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">- Test with edge cases</text>

  <rect x="790" y="429.6875" width="412.5" height="140.4688" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="996.25" y="455.0625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Argument Handling</text>
  <text x="808.75" y="477.7188" font-family="monospace" font-size="11.9827" fill="var(--text)">$0  - script name</text>
  <text x="808.75" y="495.8438" font-family="monospace" font-size="11.9827" fill="var(--text)">$1,$2...  - positional args</text>
  <text x="808.75" y="513.9688" font-family="monospace" font-size="11.9827" fill="var(--text)">$#  - number of args</text>
  <text x="808.75" y="532.0938" font-family="monospace" font-size="11.9827" fill="var(--text)">$@  - all args (quoted)</text>
  <text x="808.75" y="550.2188" font-family="monospace" font-size="11.9827" fill="var(--text)">$*  - all args as one string</text>
</svg>

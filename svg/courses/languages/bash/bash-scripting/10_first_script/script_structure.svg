<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Left column: script sections stacked -->

  <!-- Shebang -->
  <rect x="60" y="30" width="540" height="70" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="55" font-family="monospace" font-size="16" fill="var(--primary-accent)" font-weight="bold">1. Shebang Line</text>
  <text x="80" y="82" font-family="monospace" font-size="18" fill="var(--bg)">#!/bin/bash</text>
  <!-- bracket label -->
  <line x1="610" y1="30" x2="640" y2="30" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="30" x2="640" y2="65" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="65" x2="610" y2="65" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="650" y="68" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">tells OS which interpreter</text>

  <!-- Comments / Header -->
  <rect x="60" y="120" width="540" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="145" font-family="monospace" font-size="14" fill="var(--ok-accent)" font-weight="bold">2. Header Comments</text>
  <text x="80" y="168" font-family="monospace" font-size="14" fill="var(--text)"># Description: what this script does</text>
  <text x="80" y="188" font-family="monospace" font-size="14" fill="var(--text)"># Usage: ./script.sh [options]</text>
  <line x1="610" y1="120" x2="640" y2="120" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="640" y1="120" x2="640" y2="160" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="640" y1="160" x2="610" y2="160" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="650" y="148" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)">documents purpose</text>
  <text x="650" y="166" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)">and usage</text>

  <!-- Safety options -->
  <rect x="60" y="220" width="540" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="245" font-family="monospace" font-size="14" fill="var(--warn-accent)" font-weight="bold">3. Safety Options</text>
  <text x="80" y="268" font-family="monospace" font-size="14" fill="var(--text)">set -euo pipefail</text>
  <text x="80" y="288" font-family="monospace" font-size="14" fill="var(--text)">IFS=$'\n\t'</text>
  <line x1="610" y1="220" x2="640" y2="220" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="640" y1="220" x2="640" y2="260" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="640" y1="260" x2="610" y2="260" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="650" y="248" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">enables strict mode</text>

  <!-- Functions -->
  <rect x="60" y="320" width="540" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="80" y="345" font-family="monospace" font-size="14" fill="var(--info-accent)" font-weight="bold">4. Function Definitions</text>
  <text x="80" y="368" font-family="monospace" font-size="14" fill="var(--text)">usage() { echo "Usage: ..."; exit 0; }</text>
  <text x="80" y="388" font-family="monospace" font-size="14" fill="var(--text)">check_deps() { ... }</text>
  <text x="80" y="408" font-family="monospace" font-size="14" fill="var(--text)">do_work() { ... }</text>
  <line x1="610" y1="320" x2="640" y2="320" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="640" y1="320" x2="640" y2="370" stroke="var(--info-border)" stroke-width="2"/>
  <line x1="640" y1="370" x2="610" y2="370" stroke="var(--info-border)" stroke-width="2"/>
  <text x="650" y="348" font-family="Arial, sans-serif" font-size="13" fill="var(--info-accent)">define before calling</text>

  <!-- Main logic -->
  <rect x="60" y="440" width="540" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="80" y="465" font-family="monospace" font-size="14" fill="var(--primary-accent)" font-weight="bold">5. Main Logic</text>
  <text x="80" y="488" font-family="monospace" font-size="14" fill="var(--text)">parse_args "$@"</text>
  <text x="80" y="508" font-family="monospace" font-size="14" fill="var(--text)">check_deps</text>
  <text x="80" y="528" font-family="monospace" font-size="14" fill="var(--text)">do_work</text>
  <line x1="610" y1="440" x2="640" y2="440" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="440" x2="640" y2="490" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="490" x2="610" y2="490" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="650" y="468" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">orchestrates execution</text>

  <!-- Exit code -->
  <rect x="60" y="560" width="540" height="55" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="80" y="583" font-family="monospace" font-size="14" fill="var(--primary-accent)" font-weight="bold">6. Exit Code</text>
  <text x="80" y="603" font-family="monospace" font-size="16" fill="var(--bg)">exit 0   # success</text>
  <line x1="610" y1="560" x2="640" y2="560" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="560" x2="640" y2="588" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="640" y1="588" x2="610" y2="588" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="650" y="576" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">0=success, 1-255=error</text>

  <!-- Right side: key points -->
  <rect x="800" y="30" width="440" height="175" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="58" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Making a Script Executable</text>
  <text x="820" y="84" font-family="monospace" font-size="14" fill="var(--text)"># Create the file</text>
  <text x="820" y="104" font-family="monospace" font-size="14" fill="var(--text)">nano myscript.sh</text>
  <text x="820" y="128" font-family="monospace" font-size="14" fill="var(--text)"># Make it executable</text>
  <text x="820" y="148" font-family="monospace" font-size="14" fill="var(--text)">chmod +x myscript.sh</text>
  <text x="820" y="172" font-family="monospace" font-size="14" fill="var(--text)"># Run it</text>
  <text x="820" y="192" font-family="monospace" font-size="14" fill="var(--text)">./myscript.sh</text>

  <rect x="800" y="230" width="440" height="175" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="258" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Good Practices</text>
  <text x="820" y="283" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">- One task per function</text>
  <text x="820" y="305" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">- Quote all variables: "$var"</text>
  <text x="820" y="327" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">- Local variables in functions</text>
  <text x="820" y="349" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">- Descriptive names</text>
  <text x="820" y="371" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">- Handle errors explicitly</text>
  <text x="820" y="393" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">- Test with edge cases</text>

  <rect x="800" y="430" width="440" height="155" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="458" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Argument Handling</text>
  <text x="820" y="483" font-family="monospace" font-size="13" fill="var(--text)">$0  - script name</text>
  <text x="820" y="503" font-family="monospace" font-size="13" fill="var(--text)">$1,$2...  - positional args</text>
  <text x="820" y="523" font-family="monospace" font-size="13" fill="var(--text)">$#  - number of args</text>
  <text x="820" y="543" font-family="monospace" font-size="13" fill="var(--text)">$@  - all args (quoted)</text>
  <text x="820" y="563" font-family="monospace" font-size="13" fill="var(--text)">$*  - all args as one string</text>
</svg>

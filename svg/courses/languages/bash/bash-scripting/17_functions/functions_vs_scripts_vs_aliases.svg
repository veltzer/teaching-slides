<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6.6276" x="40" y="40"/>
  <rect x="58.7499" y="56.111" width="380.625" height="56.3889" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="449.6874" y="56.111" width="380.625" height="56.3889" rx="6.6276" fill="var(--text-muted)" filter="url(#shadow)" />
  <rect x="840.625" y="56.111" width="380.625" height="56.3889" rx="6.6276" fill="var(--info-accent)" filter="url(#shadow)" />
  <text x="249.0624" y="90.75" font-size="22.5946" font-weight="bold" fill="var(--bg)" text-anchor="middle">Function</text>
  <text x="639.9999" y="90.75" font-size="22.5946" font-weight="bold" fill="var(--bg)" text-anchor="middle">Script</text>
  <text x="1030.9376" y="90.75" font-size="22.5946" font-weight="bold" fill="var(--bg)" text-anchor="middle">Alias</text>
  <rect x="58.7499" y="125.3889" width="380.625" height="104.7223" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="449.6874" y="125.3889" width="380.625" height="104.7223" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="840.625" y="125.3889" width="380.625" height="104.7223" rx="6.6276" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="77.4999" y="147.9443" font-size="12.1662" font-weight="bold" fill="var(--primary-accent)">EXECUTION CONTEXT</text>
  <text x="249.0624" y="175.3333" font-size="17.3806" fill="var(--text)" text-anchor="middle">Runs in <tspan font-weight="bold">current</tspan>
  </text>
  <text x="249.0624" y="199.4999" font-size="17.3806" fill="var(--text)" text-anchor="middle">shell process</text>
  <text x="249.0624" y="222.0555" font-size="13.9043" fill="var(--text-muted)" text-anchor="middle">(no fork)</text>
  <text x="468.4374" y="147.9443" font-size="12.1662" font-weight="bold" fill="var(--text-muted)">EXECUTION CONTEXT</text>
  <text x="639.9999" y="175.3333" font-size="17.3806" fill="var(--text)" text-anchor="middle">Runs in a <tspan font-weight="bold">subshell</tspan>
  </text>
  <text x="639.9999" y="199.4999" font-size="17.3806" fill="var(--text)" text-anchor="middle">new process each time</text>
  <text x="639.9999" y="222.0555" font-size="13.9043" fill="var(--text-muted)" text-anchor="middle">(fork + exec)</text>
  <text x="859.375" y="147.9443" font-size="12.1662" font-weight="bold" fill="var(--info-accent)">EXECUTION CONTEXT</text>
  <text x="1030.9376" y="175.3333" font-size="17.3806" fill="var(--text)" text-anchor="middle">Text replacement</text>
  <text x="1030.9376" y="199.4999" font-size="17.3806" fill="var(--text)" text-anchor="middle">before parsing</text>
  <text x="1030.9376" y="222.0555" font-size="13.9043" fill="var(--text-muted)" text-anchor="middle">(no process at all)</text>
  <rect x="58.7499" y="239.7777" width="380.625" height="104.7223" rx="6.6276" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="449.6874" y="239.7777" width="380.625" height="104.7223" rx="6.6276" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="840.625" y="239.7777" width="380.625" height="104.7223" rx="6.6276" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="77.4999" y="262.3333" font-size="12.1662" font-weight="bold" fill="var(--ok-accent)">SHELL STATE</text>
  <text x="249.0624" y="288.1111" font-size="17.3806" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Can modify shell state</text>
  <text x="249.0624" y="312.2777" font-size="15.6425" fill="var(--text)" text-anchor="middle">cd, set vars, export</text>
  <text x="468.4374" y="262.3333" font-size="12.1662" font-weight="bold" fill="var(--danger-accent)">SHELL STATE</text>
  <text x="639.9999" y="288.1111" font-size="17.3806" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Cannot modify parent</text>
  <text x="639.9999" y="312.2777" font-size="15.6425" fill="var(--text)" text-anchor="middle">subshell vars are local</text>
  <text x="859.375" y="262.3333" font-size="12.1662" font-weight="bold" fill="var(--danger-accent)">SHELL STATE</text>
  <text x="1030.9376" y="288.1111" font-size="17.3806" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Cannot modify state</text>
  <text x="1030.9376" y="312.2777" font-size="15.6425" fill="var(--text)" text-anchor="middle">pure text substitution</text>
  <rect x="58.7499" y="354.1666" width="380.625" height="104.7223" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="449.6874" y="354.1666" width="380.625" height="104.7223" rx="6.6276" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="840.625" y="354.1666" width="380.625" height="104.7223" rx="6.6276" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="77.4999" y="376.7222" font-size="12.1662" font-weight="bold" fill="var(--primary-accent)">CAPABILITIES</text>
  <text x="249.0624" y="402.5" font-size="17.3806" fill="var(--text)" text-anchor="middle">Logic, loops, args</text>
  <text x="249.0624" y="426.6667" font-size="15.6425" fill="var(--text-muted)" text-anchor="middle">loaded in memory</text>
  <text x="468.4374" y="376.7222" font-size="12.1662" font-weight="bold" fill="var(--ok-accent)">CAPABILITIES</text>
  <text x="639.9999" y="402.5" font-size="17.3806" fill="var(--text)" text-anchor="middle">Full script, any language</text>
  <text x="639.9999" y="426.6667" font-size="15.6425" fill="var(--text-muted)" text-anchor="middle">lives on disk</text>
  <text x="859.375" y="376.7222" font-size="12.1662" font-weight="bold" fill="var(--warn-accent)">CAPABILITIES</text>
  <text x="1030.9376" y="402.5" font-size="17.3806" fill="var(--text)" text-anchor="middle">Simple shortcuts only</text>
  <text x="1030.9376" y="426.6667" font-size="15.6425" fill="var(--text-muted)" text-anchor="middle">no logic, no real args</text>
  <rect x="58.7499" y="468.5556" width="380.625" height="64.4444" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="449.6874" y="468.5556" width="380.625" height="64.4444" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="840.625" y="468.5556" width="380.625" height="64.4444" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="77.4999" y="491.1111" font-size="12.1662" font-weight="bold" fill="var(--text-muted)">BEST FOR</text>
  <text x="249.0624" y="511.25" font-size="15.6425" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Reusable shell logic</text>
  <text x="639.9999" y="511.25" font-size="15.6425" fill="var(--text-muted)" text-anchor="middle" font-weight="bold">Portable, complex tasks</text>
  <text x="1030.9376" y="511.25" font-size="15.6425" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Typing shortcuts</text>
  <rect x="58.7499" y="544.2777" width="1162.5001" height="43.4999" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="570.8612" text-anchor="middle" font-size="16.5116" fill="var(--text)">Functions are fastest (in-memory). Aliases have zero overhead. Scripts pay fork+exec cost every call.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" />
  <rect x="17.7778" y="17.7778" width="360.8889" height="62.2222" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <rect x="388.4444" y="17.7778" width="360.8889" height="62.2222" rx="7.1111" fill="var(--text-muted)" filter="url(#shadow)" />
  <rect x="759.1111" y="17.7778" width="360.8889" height="62.2222" rx="7.1111" fill="var(--info-dk)" filter="url(#shadow)" />
  <text x="198.2222" y="56" font-size="23.1111" font-weight="bold" fill="var(--bg)" text-anchor="middle">Function</text>
  <text x="568.8889" y="56" font-size="23.1111" font-weight="bold" fill="var(--bg)" text-anchor="middle">Script</text>
  <text x="939.5556" y="56" font-size="23.1111" font-weight="bold" fill="var(--bg)" text-anchor="middle">Alias</text>
  <rect x="17.7778" y="94.2222" width="360.8889" height="115.5556" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.3333" />
  <rect x="388.4444" y="94.2222" width="360.8889" height="115.5556" rx="5.3333" fill="url(#grad-surface)" stroke="var(--border-strong)" stroke-width="1.3333" />
  <rect x="759.1111" y="94.2222" width="360.8889" height="115.5556" rx="5.3333" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.3333" />
  <text x="35.5556" y="119.1111" font-size="12.4444" font-weight="bold" fill="var(--primary-dk)">EXECUTION CONTEXT</text>
  <text x="198.2222" y="149.3333" font-size="17.7778" fill="var(--text-darker)" text-anchor="middle">Runs in <tspan font-weight="bold">current</tspan>
  </text>
  <text x="198.2222" y="176" font-size="17.7778" fill="var(--text-darker)" text-anchor="middle">shell process</text>
  <text x="198.2222" y="200.8889" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">(no fork)</text>
  <text x="406.2222" y="119.1111" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">EXECUTION CONTEXT</text>
  <text x="568.8889" y="149.3333" font-size="17.7778" fill="var(--text-darker)" text-anchor="middle">Runs in a <tspan font-weight="bold">subshell</tspan>
  </text>
  <text x="568.8889" y="176" font-size="17.7778" fill="var(--text-darker)" text-anchor="middle">new process each time</text>
  <text x="568.8889" y="200.8889" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">(fork + exec)</text>
  <text x="776.8889" y="119.1111" font-size="12.4444" font-weight="bold" fill="var(--info-dk)">EXECUTION CONTEXT</text>
  <text x="939.5556" y="149.3333" font-size="17.7778" fill="var(--text-darker)" text-anchor="middle">Text replacement</text>
  <text x="939.5556" y="176" font-size="17.7778" fill="var(--text-darker)" text-anchor="middle">before parsing</text>
  <text x="939.5556" y="200.8889" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">(no process at all)</text>
  <rect x="17.7778" y="220.4444" width="360.8889" height="115.5556" rx="5.3333" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.3333" />
  <rect x="388.4444" y="220.4444" width="360.8889" height="115.5556" rx="5.3333" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.3333" />
  <rect x="759.1111" y="220.4444" width="360.8889" height="115.5556" rx="5.3333" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.3333" />
  <text x="35.5556" y="245.3333" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)">SHELL STATE</text>
  <text x="198.2222" y="273.7778" font-size="17.7778" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Can modify shell state</text>
  <text x="198.2222" y="300.4444" font-size="16" fill="var(--text-dark)" text-anchor="middle">cd, set vars, export</text>
  <text x="406.2222" y="245.3333" font-size="12.4444" font-weight="bold" fill="var(--danger)">SHELL STATE</text>
  <text x="568.8889" y="273.7778" font-size="17.7778" fill="var(--danger)" text-anchor="middle" font-weight="bold">Cannot modify parent</text>
  <text x="568.8889" y="300.4444" font-size="16" fill="var(--text-dark)" text-anchor="middle">subshell vars are local</text>
  <text x="776.8889" y="245.3333" font-size="12.4444" font-weight="bold" fill="var(--danger)">SHELL STATE</text>
  <text x="939.5556" y="273.7778" font-size="17.7778" fill="var(--danger)" text-anchor="middle" font-weight="bold">Cannot modify state</text>
  <text x="939.5556" y="300.4444" font-size="16" fill="var(--text-dark)" text-anchor="middle">pure text substitution</text>
  <rect x="17.7778" y="346.6667" width="360.8889" height="115.5556" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.3333" />
  <rect x="388.4444" y="346.6667" width="360.8889" height="115.5556" rx="5.3333" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.3333" />
  <rect x="759.1111" y="346.6667" width="360.8889" height="115.5556" rx="5.3333" fill="var(--warn-pale4)" stroke="var(--warn-amber)" stroke-width="1.3333" />
  <text x="35.5556" y="371.5556" font-size="12.4444" font-weight="bold" fill="var(--primary-dk)">CAPABILITIES</text>
  <text x="198.2222" y="400" font-size="17.7778" fill="var(--text-darker)" text-anchor="middle">Logic, loops, args</text>
  <text x="198.2222" y="426.6667" font-size="16" fill="var(--text-muted)" text-anchor="middle">loaded in memory</text>
  <text x="406.2222" y="371.5556" font-size="12.4444" font-weight="bold" fill="var(--ok-dk)">CAPABILITIES</text>
  <text x="568.8889" y="400" font-size="17.7778" fill="var(--text-darker)" text-anchor="middle">Full script, any language</text>
  <text x="568.8889" y="426.6667" font-size="16" fill="var(--text-muted)" text-anchor="middle">lives on disk</text>
  <text x="776.8889" y="371.5556" font-size="12.4444" font-weight="bold" fill="var(--warn-mid)">CAPABILITIES</text>
  <text x="939.5556" y="400" font-size="17.7778" fill="var(--text-darker)" text-anchor="middle">Simple shortcuts only</text>
  <text x="939.5556" y="426.6667" font-size="16" fill="var(--text-muted)" text-anchor="middle">no logic, no real args</text>
  <rect x="17.7778" y="472.8889" width="360.8889" height="71.1111" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="1.3333" />
  <rect x="388.4444" y="472.8889" width="360.8889" height="71.1111" rx="5.3333" fill="url(#grad-surface)" stroke="var(--border-strong)" stroke-width="1.3333" />
  <rect x="759.1111" y="472.8889" width="360.8889" height="71.1111" rx="5.3333" fill="url(#grad-surface)" stroke="var(--warn-amber)" stroke-width="1.3333" />
  <text x="35.5556" y="497.7778" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">BEST FOR</text>
  <text x="198.2222" y="520" font-size="16" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Reusable shell logic</text>
  <text x="568.8889" y="520" font-size="16" fill="var(--text-muted)" text-anchor="middle" font-weight="bold">Portable, complex tasks</text>
  <text x="939.5556" y="520" font-size="16" fill="var(--warn-mid)" text-anchor="middle" font-weight="bold">Typing shortcuts</text>
  <rect x="17.7778" y="556.4444" width="1102.2222" height="48" rx="7.1111" fill="var(--primary-pale2)" stroke="var(--primary)" stroke-width="1.3333" />
  <text x="568.8889" y="585.7778" text-anchor="middle" font-size="16.8889" fill="var(--text-dark)">Functions are fastest (in-memory). Aliases have zero overhead. Scripts pay fork+exec cost every call.</text>
</svg>
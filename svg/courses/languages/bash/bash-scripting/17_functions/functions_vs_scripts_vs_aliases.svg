<svg xmlns="http://www.w3.org/2000/svg" width="660" height="220" font-family="sans-serif">
  <!-- header -->
  <rect x="10" y="10" width="210" height="30" fill="#bbdefb" stroke="#333" stroke-width="1.5"/>
  <rect x="220" y="10" width="210" height="30" fill="#bbdefb" stroke="#333" stroke-width="1.5"/>
  <rect x="430" y="10" width="220" height="30" fill="#bbdefb" stroke="#333" stroke-width="1.5"/>
  <text x="115" y="30" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Function</text>
  <text x="325" y="30" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Script</text>
  <text x="540" y="30" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Alias</text>
  <!-- row 1 -->
  <rect x="10" y="40" width="210" height="50" fill="#e3f2fd" stroke="#333" stroke-width="1"/>
  <rect x="220" y="40" width="210" height="50" fill="#f0f4f8" stroke="#333" stroke-width="1"/>
  <rect x="430" y="40" width="220" height="50" fill="#e3f2fd" stroke="#333" stroke-width="1"/>
  <text x="115" y="60" font-size="12" fill="#222" text-anchor="middle">Runs in current</text>
  <text x="115" y="78" font-size="12" fill="#222" text-anchor="middle">shell process</text>
  <text x="325" y="60" font-size="12" fill="#222" text-anchor="middle">Runs in subshell</text>
  <text x="325" y="78" font-size="12" fill="#222" text-anchor="middle">(new process)</text>
  <text x="540" y="60" font-size="12" fill="#222" text-anchor="middle">Text replacement</text>
  <text x="540" y="78" font-size="12" fill="#222" text-anchor="middle">before parsing</text>
  <!-- row 2 -->
  <rect x="10" y="90" width="210" height="50" fill="#f0f4f8" stroke="#333" stroke-width="1"/>
  <rect x="220" y="90" width="210" height="50" fill="#e3f2fd" stroke="#333" stroke-width="1"/>
  <rect x="430" y="90" width="220" height="50" fill="#f0f4f8" stroke="#333" stroke-width="1"/>
  <text x="115" y="110" font-size="12" fill="#222" text-anchor="middle">Can modify shell</text>
  <text x="115" y="128" font-size="12" fill="#222" text-anchor="middle">state (cd, vars)</text>
  <text x="325" y="110" font-size="12" fill="#222" text-anchor="middle">Cannot modify</text>
  <text x="325" y="128" font-size="12" fill="#222" text-anchor="middle">parent shell</text>
  <text x="540" y="110" font-size="12" fill="#222" text-anchor="middle">Cannot contain</text>
  <text x="540" y="128" font-size="12" fill="#222" text-anchor="middle">logic or args</text>
  <!-- row 3 -->
  <rect x="10" y="140" width="210" height="50" fill="#e3f2fd" stroke="#333" stroke-width="1"/>
  <rect x="220" y="140" width="210" height="50" fill="#f0f4f8" stroke="#333" stroke-width="1"/>
  <rect x="430" y="140" width="220" height="50" fill="#e3f2fd" stroke="#333" stroke-width="1"/>
  <text x="115" y="160" font-size="12" fill="#222" text-anchor="middle">Loaded into</text>
  <text x="115" y="178" font-size="12" fill="#222" text-anchor="middle">memory</text>
  <text x="325" y="160" font-size="12" fill="#222" text-anchor="middle">Lives on disk</text>
  <text x="540" y="160" font-size="12" fill="#222" text-anchor="middle">Simple shortcuts</text>
</svg>

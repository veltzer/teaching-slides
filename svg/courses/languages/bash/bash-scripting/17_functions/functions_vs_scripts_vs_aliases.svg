<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <rect x="169.4166" y="158.361" width="344.9657" height="46.1639" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="523.7287" y="158.361" width="344.9657" height="46.1639" rx="5.7089" fill="var(--text-muted)" filter="url(#shadow)" />
  <rect x="878.0409" y="158.361" width="344.9657" height="46.1639" rx="5.7089" fill="var(--info-accent)" filter="url(#shadow)" />
  <text x="341.8995" y="186.7189" font-size="19.4625" font-weight="bold" fill="var(--bg)" text-anchor="middle">Function</text>
  <text x="696.2116" y="186.7189" font-size="19.4625" font-weight="bold" fill="var(--bg)" text-anchor="middle">Script</text>
  <text x="1050.5238" y="186.7189" font-size="19.4625" font-weight="bold" fill="var(--bg)" text-anchor="middle">Alias</text>
  <rect x="169.4166" y="215.0767" width="344.9657" height="85.733" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="523.7287" y="215.0767" width="344.9657" height="85.733" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="878.0409" y="215.0767" width="344.9657" height="85.733" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="186.41" y="233.5422" font-size="10.4797" font-weight="bold" fill="var(--primary-accent)">EXECUTION CONTEXT</text>
  <text x="341.8995" y="255.9647" font-size="14.9713" fill="var(--text)" text-anchor="middle">Runs in <tspan font-weight="bold">current</tspan>
  </text>
  <text x="341.8995" y="275.7492" font-size="14.9713" fill="var(--text)" text-anchor="middle">shell process</text>
  <text x="341.8995" y="294.2148" font-size="11.9769" fill="var(--text-muted)" text-anchor="middle">(no fork)</text>
  <text x="540.7221" y="233.5422" font-size="10.4797" font-weight="bold" fill="var(--text-muted)">EXECUTION CONTEXT</text>
  <text x="696.2116" y="255.9647" font-size="14.9713" fill="var(--text)" text-anchor="middle">Runs in a <tspan font-weight="bold">subshell</tspan>
  </text>
  <text x="696.2116" y="275.7492" font-size="14.9713" fill="var(--text)" text-anchor="middle">new process each time</text>
  <text x="696.2116" y="294.2148" font-size="11.9769" fill="var(--text-muted)" text-anchor="middle">(fork + exec)</text>
  <text x="895.0343" y="233.5422" font-size="10.4797" font-weight="bold" fill="var(--info-accent)">EXECUTION CONTEXT</text>
  <text x="1050.5238" y="255.9647" font-size="14.9713" fill="var(--text)" text-anchor="middle">Text replacement</text>
  <text x="1050.5238" y="275.7492" font-size="14.9713" fill="var(--text)" text-anchor="middle">before parsing</text>
  <text x="1050.5238" y="294.2148" font-size="11.9769" fill="var(--text-muted)" text-anchor="middle">(no process at all)</text>
  <rect x="169.4166" y="308.7234" width="344.9657" height="85.733" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="523.7287" y="308.7234" width="344.9657" height="85.733" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="878.0409" y="308.7234" width="344.9657" height="85.733" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="186.41" y="327.189" font-size="10.4797" font-weight="bold" fill="var(--ok-accent)">SHELL STATE</text>
  <text x="341.8995" y="348.2925" font-size="14.9713" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Can modify shell state</text>
  <text x="341.8995" y="368.077" font-size="13.4741" fill="var(--text)" text-anchor="middle">cd, set vars, export</text>
  <text x="540.7221" y="327.189" font-size="10.4797" font-weight="bold" fill="var(--danger-accent)">SHELL STATE</text>
  <text x="696.2116" y="348.2925" font-size="14.9713" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Cannot modify parent</text>
  <text x="696.2116" y="368.077" font-size="13.4741" fill="var(--text)" text-anchor="middle">subshell vars are local</text>
  <text x="895.0343" y="327.189" font-size="10.4797" font-weight="bold" fill="var(--danger-accent)">SHELL STATE</text>
  <text x="1050.5238" y="348.2925" font-size="14.9713" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Cannot modify state</text>
  <text x="1050.5238" y="368.077" font-size="13.4741" fill="var(--text)" text-anchor="middle">pure text substitution</text>
  <rect x="169.4166" y="402.3702" width="344.9657" height="85.733" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="523.7287" y="402.3702" width="344.9657" height="85.733" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="878.0409" y="402.3702" width="344.9657" height="85.733" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="186.41" y="420.8358" font-size="10.4797" font-weight="bold" fill="var(--primary-accent)">CAPABILITIES</text>
  <text x="341.8995" y="441.9393" font-size="14.9713" fill="var(--text)" text-anchor="middle">Logic, loops, args</text>
  <text x="341.8995" y="461.7238" font-size="13.4741" fill="var(--text-muted)" text-anchor="middle">loaded in memory</text>
  <text x="540.7221" y="420.8358" font-size="10.4797" font-weight="bold" fill="var(--ok-accent)">CAPABILITIES</text>
  <text x="696.2116" y="441.9393" font-size="14.9713" fill="var(--text)" text-anchor="middle">Full script, any language</text>
  <text x="696.2116" y="461.7238" font-size="13.4741" fill="var(--text-muted)" text-anchor="middle">lives on disk</text>
  <text x="895.0343" y="420.8358" font-size="10.4797" font-weight="bold" fill="var(--warn-accent)">CAPABILITIES</text>
  <text x="1050.5238" y="441.9393" font-size="14.9713" fill="var(--text)" text-anchor="middle">Simple shortcuts only</text>
  <text x="1050.5238" y="461.7238" font-size="13.4741" fill="var(--text-muted)" text-anchor="middle">no logic, no real args</text>
  <rect x="169.4166" y="496.017" width="344.9657" height="52.7587" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="523.7287" y="496.017" width="344.9657" height="52.7587" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="878.0409" y="496.017" width="344.9657" height="52.7587" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="186.41" y="514.4825" font-size="10.4797" font-weight="bold" fill="var(--text-muted)">BEST FOR</text>
  <text x="341.8995" y="530.9696" font-size="13.4741" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Reusable shell logic</text>
  <text x="696.2116" y="530.9696" font-size="13.4741" fill="var(--text-muted)" text-anchor="middle" font-weight="bold">Portable, complex tasks</text>
  <text x="1050.5238" y="530.9696" font-size="13.4741" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Typing shortcuts</text>
  <rect x="169.4166" y="558.0084" width="1053.59" height="35.6121" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="696.2116" y="579.7715" text-anchor="middle" font-size="14.2227" fill="var(--text)">Functions are fastest (in-memory). Aliases have zero overhead. Scripts pay fork+exec cost every call.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="17.7778" width="360.8889" height="62.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="388.4444" y="17.7778" width="360.8889" height="62.2222" rx="6" fill="var(--text-muted)" filter="url(#shadow)" />
  <rect x="759.1111" y="17.7778" width="360.8889" height="62.2222" rx="6" fill="var(--info-accent)" filter="url(#shadow)" />
  <text x="198.2222" y="56" font-size="23.1111" font-weight="bold" fill="var(--bg)" text-anchor="middle">Function</text>
  <text x="568.8889" y="56" font-size="23.1111" font-weight="bold" fill="var(--bg)" text-anchor="middle">Script</text>
  <text x="939.5556" y="56" font-size="23.1111" font-weight="bold" fill="var(--bg)" text-anchor="middle">Alias</text>
  <rect x="17.7778" y="94.2222" width="360.8889" height="115.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="388.4444" y="94.2222" width="360.8889" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="759.1111" y="94.2222" width="360.8889" height="115.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="35.5556" y="119.1111" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)">EXECUTION CONTEXT</text>
  <text x="198.2222" y="149.3333" font-size="17.7778" fill="var(--text)" text-anchor="middle">Runs in <tspan font-weight="bold">current</tspan>
  </text>
  <text x="198.2222" y="176" font-size="17.7778" fill="var(--text)" text-anchor="middle">shell process</text>
  <text x="198.2222" y="200.8889" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">(no fork)</text>
  <text x="406.2222" y="119.1111" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">EXECUTION CONTEXT</text>
  <text x="568.8889" y="149.3333" font-size="17.7778" fill="var(--text)" text-anchor="middle">Runs in a <tspan font-weight="bold">subshell</tspan>
  </text>
  <text x="568.8889" y="176" font-size="17.7778" fill="var(--text)" text-anchor="middle">new process each time</text>
  <text x="568.8889" y="200.8889" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">(fork + exec)</text>
  <text x="776.8889" y="119.1111" font-size="12.4444" font-weight="bold" fill="var(--info-accent)">EXECUTION CONTEXT</text>
  <text x="939.5556" y="149.3333" font-size="17.7778" fill="var(--text)" text-anchor="middle">Text replacement</text>
  <text x="939.5556" y="176" font-size="17.7778" fill="var(--text)" text-anchor="middle">before parsing</text>
  <text x="939.5556" y="200.8889" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">(no process at all)</text>
  <rect x="17.7778" y="220.4444" width="360.8889" height="115.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="388.4444" y="220.4444" width="360.8889" height="115.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="759.1111" y="220.4444" width="360.8889" height="115.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="35.5556" y="245.3333" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">SHELL STATE</text>
  <text x="198.2222" y="273.7778" font-size="17.7778" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Can modify shell state</text>
  <text x="198.2222" y="300.4444" font-size="16" fill="var(--text)" text-anchor="middle">cd, set vars, export</text>
  <text x="406.2222" y="245.3333" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">SHELL STATE</text>
  <text x="568.8889" y="273.7778" font-size="17.7778" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Cannot modify parent</text>
  <text x="568.8889" y="300.4444" font-size="16" fill="var(--text)" text-anchor="middle">subshell vars are local</text>
  <text x="776.8889" y="245.3333" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">SHELL STATE</text>
  <text x="939.5556" y="273.7778" font-size="17.7778" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">Cannot modify state</text>
  <text x="939.5556" y="300.4444" font-size="16" fill="var(--text)" text-anchor="middle">pure text substitution</text>
  <rect x="17.7778" y="346.6667" width="360.8889" height="115.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="388.4444" y="346.6667" width="360.8889" height="115.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="759.1111" y="346.6667" width="360.8889" height="115.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="35.5556" y="371.5556" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)">CAPABILITIES</text>
  <text x="198.2222" y="400" font-size="17.7778" fill="var(--text)" text-anchor="middle">Logic, loops, args</text>
  <text x="198.2222" y="426.6667" font-size="16" fill="var(--text-muted)" text-anchor="middle">loaded in memory</text>
  <text x="406.2222" y="371.5556" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">CAPABILITIES</text>
  <text x="568.8889" y="400" font-size="17.7778" fill="var(--text)" text-anchor="middle">Full script, any language</text>
  <text x="568.8889" y="426.6667" font-size="16" fill="var(--text-muted)" text-anchor="middle">lives on disk</text>
  <text x="776.8889" y="371.5556" font-size="12.4444" font-weight="bold" fill="var(--warn-accent)">CAPABILITIES</text>
  <text x="939.5556" y="400" font-size="17.7778" fill="var(--text)" text-anchor="middle">Simple shortcuts only</text>
  <text x="939.5556" y="426.6667" font-size="16" fill="var(--text-muted)" text-anchor="middle">no logic, no real args</text>
  <rect x="17.7778" y="472.8889" width="360.8889" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="388.4444" y="472.8889" width="360.8889" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="759.1111" y="472.8889" width="360.8889" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="35.5556" y="497.7778" font-size="12.4444" font-weight="bold" fill="var(--text-muted)">BEST FOR</text>
  <text x="198.2222" y="520" font-size="16" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Reusable shell logic</text>
  <text x="568.8889" y="520" font-size="16" fill="var(--text-muted)" text-anchor="middle" font-weight="bold">Portable, complex tasks</text>
  <text x="939.5556" y="520" font-size="16" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Typing shortcuts</text>
  <rect x="17.7778" y="556.4444" width="1102.2222" height="48" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="585.7778" text-anchor="middle" font-size="16.8889" fill="var(--text)">Functions are fastest (in-memory). Aliases have zero overhead. Scripts pay fork+exec cost every call.</text>
</svg>
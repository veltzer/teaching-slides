<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Column widths: 0-420 | 420-840 | 840-1280  (each 420px wide) -->

  <!-- Header row -->
  <rect x="20" y="20" width="406" height="70" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <rect x="437" y="20" width="406" height="70" rx="8" fill="#37474f" filter="url(#shadow)"/>
  <rect x="854" y="20" width="406" height="70" rx="8" fill="#6a1b9a" filter="url(#shadow)"/>
  <text x="223" y="63" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Function</text>
  <text x="640" y="63" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Script</text>
  <text x="1057" y="63" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Alias</text>

  <!-- Row 1: Execution context -->
  <rect x="20" y="106" width="406" height="130" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <rect x="437" y="106" width="406" height="130" rx="6" fill="url(#grad-surface)" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="854" y="106" width="406" height="130" rx="6" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="40" y="134" font-size="14" font-weight="bold" fill="#1565c0">EXECUTION CONTEXT</text>
  <text x="223" y="168" font-size="20" fill="#222" text-anchor="middle">Runs in <tspan font-weight="bold">current</tspan></text>
  <text x="223" y="198" font-size="20" fill="#222" text-anchor="middle">shell process</text>
  <text x="223" y="226" font-size="16" fill="#555" text-anchor="middle">(no fork)</text>
  <text x="457" y="134" font-size="14" font-weight="bold" fill="#37474f">EXECUTION CONTEXT</text>
  <text x="640" y="168" font-size="20" fill="#222" text-anchor="middle">Runs in a <tspan font-weight="bold">subshell</tspan></text>
  <text x="640" y="198" font-size="20" fill="#222" text-anchor="middle">new process each time</text>
  <text x="640" y="226" font-size="16" fill="#555" text-anchor="middle">(fork + exec)</text>
  <text x="874" y="134" font-size="14" font-weight="bold" fill="#6a1b9a">EXECUTION CONTEXT</text>
  <text x="1057" y="168" font-size="20" fill="#222" text-anchor="middle">Text replacement</text>
  <text x="1057" y="198" font-size="20" fill="#222" text-anchor="middle">before parsing</text>
  <text x="1057" y="226" font-size="16" fill="#555" text-anchor="middle">(no process at all)</text>

  <!-- Row 2: Shell state -->
  <rect x="20" y="248" width="406" height="130" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="437" y="248" width="406" height="130" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <rect x="854" y="248" width="406" height="130" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <text x="40" y="276" font-size="14" font-weight="bold" fill="#2e7d32">SHELL STATE</text>
  <text x="223" y="308" font-size="20" fill="#2e7d32" text-anchor="middle" font-weight="bold">Can modify shell state</text>
  <text x="223" y="338" font-size="18" fill="#333" text-anchor="middle">cd, set vars, export</text>
  <text x="457" y="276" font-size="14" font-weight="bold" fill="#e53935">SHELL STATE</text>
  <text x="640" y="308" font-size="20" fill="#e53935" text-anchor="middle" font-weight="bold">Cannot modify parent</text>
  <text x="640" y="338" font-size="18" fill="#333" text-anchor="middle">subshell vars are local</text>
  <text x="874" y="276" font-size="14" font-weight="bold" fill="#e53935">SHELL STATE</text>
  <text x="1057" y="308" font-size="20" fill="#e53935" text-anchor="middle" font-weight="bold">Cannot modify state</text>
  <text x="1057" y="338" font-size="18" fill="#333" text-anchor="middle">pure text substitution</text>

  <!-- Row 3: Capabilities -->
  <rect x="20" y="390" width="406" height="130" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <rect x="437" y="390" width="406" height="130" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="854" y="390" width="406" height="130" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="40" y="418" font-size="14" font-weight="bold" fill="#1565c0">CAPABILITIES</text>
  <text x="223" y="450" font-size="20" fill="#222" text-anchor="middle">Logic, loops, args</text>
  <text x="223" y="480" font-size="18" fill="#555" text-anchor="middle">loaded in memory</text>
  <text x="457" y="418" font-size="14" font-weight="bold" fill="#2e7d32">CAPABILITIES</text>
  <text x="640" y="450" font-size="20" fill="#222" text-anchor="middle">Full script, any language</text>
  <text x="640" y="480" font-size="18" fill="#555" text-anchor="middle">lives on disk</text>
  <text x="874" y="418" font-size="14" font-weight="bold" fill="#f57c00">CAPABILITIES</text>
  <text x="1057" y="450" font-size="20" fill="#222" text-anchor="middle">Simple shortcuts only</text>
  <text x="1057" y="480" font-size="18" fill="#555" text-anchor="middle">no logic, no real args</text>

  <!-- Row 4: Use case -->
  <rect x="20" y="532" width="406" height="80" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.5"/>
  <rect x="437" y="532" width="406" height="80" rx="6" fill="url(#grad-surface)" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="854" y="532" width="406" height="80" rx="6" fill="url(#grad-surface)" stroke="#f9a825" stroke-width="1.5"/>
  <text x="40" y="560" font-size="14" font-weight="bold" fill="#555">BEST FOR</text>
  <text x="223" y="585" font-size="18" fill="#1565c0" text-anchor="middle" font-weight="bold">Reusable shell logic</text>
  <text x="640" y="585" font-size="18" fill="#37474f" text-anchor="middle" font-weight="bold">Portable, complex tasks</text>
  <text x="1057" y="585" font-size="18" fill="#f57c00" text-anchor="middle" font-weight="bold">Typing shortcuts</text>

  <!-- Performance note -->
  <rect x="20" y="626" width="1240" height="54" rx="8" fill="#f0f4ff" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="640" y="659" text-anchor="middle" font-size="19" fill="#333">Functions are fastest (in-memory). Aliases have zero overhead. Scripts pay fork+exec cost every call.</text>
</svg>

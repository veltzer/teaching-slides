<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Headers -->
  <rect x="40" y="40" width="390" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Function</text>

  <rect x="445" y="40" width="390" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Script</text>

  <rect x="850" y="40" width="390" height="60" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Alias</text>

  <!-- Execution -->
  <rect x="40" y="115" width="390" height="130" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text)">EXECUTION</text>
  <text x="236" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Current shell</text>
  <text x="236" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">no fork</text>

  <rect x="445" y="115" width="390" height="130" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="465" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text)">EXECUTION</text>
  <text x="640" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Subshell</text>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">fork + exec</text>

  <rect x="850" y="115" width="390" height="130" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="870" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text)">EXECUTION</text>
  <text x="1045" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Text substitution</text>
  <text x="1045" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">no process</text>

  <!-- State -->
  <rect x="40" y="260" width="390" height="130" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Modifies shell state</text>
  <text x="236" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">cd, export work</text>

  <rect x="445" y="260" width="390" height="130" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-text)">Cannot change parent</text>
  <text x="640" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">vars stay in child</text>

  <rect x="850" y="260" width="390" height="130" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-text)">No state changes</text>
  <text x="1045" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">pure substitution</text>

  <!-- Capabilities -->
  <rect x="40" y="405" width="390" height="130" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Logic, loops, args</text>
  <text x="236" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">in memory</text>

  <rect x="445" y="405" width="390" height="130" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Full script, any lang</text>
  <text x="640" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">on disk</text>

  <rect x="850" y="405" width="390" height="130" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">Shortcuts only</text>
  <text x="1045" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">no real args</text>

  <!-- Summary -->
  <rect x="40" y="555" width="1200" height="65" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Functions fastest • Aliases no overhead • Scripts pay fork+exec</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="265" y="112.5" width="750" height="435" rx="6" fill="var(--text)" stroke="var(--text-muted)" stroke-width="2.6667"/>
  <rect x="265" y="112.5" width="750" height="43.5" rx="6" fill="var(--text-muted)"/>
  <rect x="265" y="141.5" width="750" height="14.5" fill="var(--text-muted)" rx="6"/>
  <circle cx="302.5" cy="134.25" r="8.6903" fill="var(--danger-fill)"/>
  <circle cx="332.5" cy="134.25" r="8.6903" fill="var(--warn-fill)"/>
  <circle cx="362.5" cy="134.25" r="8.6903" fill="var(--ok-fill)"/>
  <text x="302.5" y="199.5" font-size="19.1186" fill="var(--ok-accent)" opacity="0.9" font-family="Courier New, monospace">$ </text>
  <text x="332.5" y="199.5" font-size="19.1186" fill="var(--surface)" opacity="0.8" font-family="Courier New, monospace">#!/bin/bash</text>
  <text x="302.5" y="243" font-size="19.1186" fill="var(--ok-accent)" opacity="0.9" font-family="Courier New, monospace">$ </text>
  <text x="332.5" y="243" font-size="19.1186" fill="var(--primary-accent)" opacity="0.8" font-family="Courier New, monospace">for i in *.sh; do</text>
  <text x="302.5" y="286.5" font-size="19.1186" fill="var(--surface)" opacity="0.6" font-family="Courier New, monospace">&gt;   echo "$i"</text>
  <text x="302.5" y="330" font-size="19.1186" fill="var(--surface)" opacity="0.6" font-family="Courier New, monospace">&gt; done</text>
  <text x="302.5" y="388" font-size="19.1186" fill="var(--ok-accent)" opacity="0.9" font-family="Courier New, monospace">$ </text>
  <text x="332.5" y="388" font-size="19.1186" fill="var(--warn-accent)" opacity="0.8" font-family="Courier New, monospace">grep -r "pattern" .</text>
  <text x="302.5" y="431.5" font-size="19.1186" fill="var(--ok-accent)" opacity="0.9" font-family="Courier New, monospace">$ </text>
  <text x="332.5" y="431.5" font-size="19.1186" fill="var(--danger-accent)" opacity="0.8" font-family="Courier New, monospace">pipe | sed | awk</text>
  <rect x="302.5" y="460.5" width="12.1875" height="21.75" fill="url(#grad-ok)" opacity="0.7" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="257.5" font-size="41.7133" fill="var(--primary-accent)" opacity="0.3" font-family="Courier New, monospace">|</text>
  <text x="1120" y="330" font-size="41.7133" fill="var(--primary-accent)" opacity="0.3" font-family="Courier New, monospace">&gt;</text>
  <text x="1074.9999" y="402.5" font-size="41.7133" fill="var(--primary-accent)" opacity="0.3" font-family="Courier New, monospace">&amp;</text>
  <text x="160" y="272" font-size="41.7133" fill="var(--primary-accent)" opacity="0.3" font-family="Courier New, monospace">#!</text>
  <text x="175" y="359" font-size="41.7133" fill="var(--primary-accent)" opacity="0.3" font-family="Courier New, monospace">$</text>
    
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Bash Scripting</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Shell Scripting Mastery</text>
</svg>

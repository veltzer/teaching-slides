<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <rect x="265" y="112.5" width="750" height="435" rx="6" fill="var(--text)" stroke="var(--text-muted)" stroke-width="2.6667"/>
  <rect x="265" y="112.5" width="750" height="43.5" rx="6" fill="var(--text-muted)"/>
  <rect x="265" y="141.5" width="750" height="14.5" fill="var(--text-muted)" rx="6"/>
  <circle cx="302.5" cy="134.25" r="8.6903" fill="var(--danger-fill)"/>
  <circle cx="332.5" cy="134.25" r="8.6903" fill="var(--warn-fill)"/>
  <circle cx="362.5" cy="134.25" r="8.6903" fill="var(--ok-fill)"/>
  <text x="302.5" y="199.5" font-size="19.1186" fill="var(--ok-accent)" opacity="0.9" font-family="Courier New, monospace">$ </text>
  <text x="332.5" y="199.5" font-size="19.1186" fill="var(--surface)" opacity="0.8" font-family="Courier New, monospace">#!/bin/bash</text>
  <text x="302.5" y="243" font-size="19.1186" fill="var(--ok-accent)" opacity="0.9" font-family="Courier New, monospace">$ </text>
  <text x="332.5" y="243" font-size="19.1186" fill="var(--primary-accent)" opacity="0.8" font-family="Courier New, monospace">for i in *.sh; do</text>
  <text x="302.5" y="286.5" font-size="19.1186" fill="var(--surface)" opacity="0.6" font-family="Courier New, monospace">&gt;   echo "$i"</text>
  <text x="302.5" y="330" font-size="19.1186" fill="var(--surface)" opacity="0.6" font-family="Courier New, monospace">&gt; done</text>
  <text x="302.5" y="388" font-size="19.1186" fill="var(--ok-accent)" opacity="0.9" font-family="Courier New, monospace">$ </text>
  <text x="332.5" y="388" font-size="19.1186" fill="var(--warn-accent)" opacity="0.8" font-family="Courier New, monospace">grep -r "pattern" .</text>
  <text x="302.5" y="431.5" font-size="19.1186" fill="var(--ok-accent)" opacity="0.9" font-family="Courier New, monospace">$ </text>
  <text x="332.5" y="431.5" font-size="19.1186" fill="var(--danger-accent)" opacity="0.8" font-family="Courier New, monospace">pipe | sed | awk</text>
  <rect x="302.5" y="460.5" width="12.1875" height="21.75" fill="url(#grad-ok)" opacity="0.7" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="257.5" font-size="41.7133" fill="var(--primary-accent)" opacity="0.3" font-family="Courier New, monospace">|</text>
  <text x="1120" y="330" font-size="41.7133" fill="var(--primary-accent)" opacity="0.3" font-family="Courier New, monospace">&gt;</text>
  <text x="1074.9999" y="402.5" font-size="41.7133" fill="var(--primary-accent)" opacity="0.3" font-family="Courier New, monospace">&amp;</text>
  <text x="160" y="272" font-size="41.7133" fill="var(--primary-accent)" opacity="0.3" font-family="Courier New, monospace">#!</text>
  <text x="175" y="359" font-size="41.7133" fill="var(--primary-accent)" opacity="0.3" font-family="Courier New, monospace">$</text>
  <text x="640" y="595.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3328" fill="var(--border)" letter-spacing="3">BASH SCRIPTING</text>
</svg>

  <ns0:text x="277.3333" y="384" font-family="monospace" font-size="19.5556" fill="#f9a825" opacity="0.8">grep -r "pattern" .</ns0:text>
  <ns0:text x="248.8889" y="432" font-family="monospace" font-size="19.5556" fill="#28a745" opacity="0.9">$ </ns0:text>
  <ns0:text x="277.3333" y="432" font-family="monospace" font-size="19.5556" fill="#e74c3c" opacity="0.8">pipe | sed | awk</ns0:text>

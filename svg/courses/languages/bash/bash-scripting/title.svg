        --warn-amber: #f9a825;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-yellow: #ffc107;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;

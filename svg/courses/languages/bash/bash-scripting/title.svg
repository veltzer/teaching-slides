  <text x="312" y="252" font-family="monospace" font-size="22" fill="#74c0fc" opacity="0.8">for i in *.sh; do</text>
  <text x="280" y="306" font-family="monospace" font-size="22" fill="#e8e8e8" opacity="0.6">&gt;   echo "$i"</text>
  <text x="280" y="360" font-family="monospace" font-size="22" fill="#e8e8e8" opacity="0.6">&gt; done</text>
  <text x="280" y="432" font-family="monospace" font-size="22" fill="#27c93f" opacity="0.9">$ </text>
  <text x="312" y="432" font-family="monospace" font-size="22" fill="#ffd43b" opacity="0.8">grep -r "pattern" .</text>
  <text x="280" y="486" font-family="monospace" font-size="22" fill="#27c93f" opacity="0.9">$ </text>
  <text x="312" y="486" font-family="monospace" font-size="22" fill="#ff6b6b" opacity="0.8">pipe | sed | awk</text>
  <rect x="280" y="522" width="13" height="27" fill="#27c93f" opacity="0.7"/>

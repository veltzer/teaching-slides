<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Terminal window -->
  <rect x="150" y="50" width="500" height="300" rx="10" fill="#2d2d2d" stroke="#495057" stroke-width="2"/>
  <!-- Terminal title bar -->
  <rect x="150" y="50" width="500" height="30" rx="10" fill="#495057"/>
  <rect x="150" y="70" width="500" height="10" fill="#495057"/>
  <circle cx="175" cy="65" r="6" fill="#ff5f56"/>
  <circle cx="195" cy="65" r="6" fill="#ffbd2e"/>
  <circle cx="215" cy="65" r="6" fill="#27c93f"/>
  <!-- Terminal prompt lines -->
  <text x="175" y="110" font-family="monospace" font-size="14" fill="#27c93f" opacity="0.9">$ </text>
  <text x="195" y="110" font-family="monospace" font-size="14" fill="#e8e8e8" opacity="0.8">#!/bin/bash</text>
  <text x="175" y="140" font-family="monospace" font-size="14" fill="#27c93f" opacity="0.9">$ </text>
  <text x="195" y="140" font-family="monospace" font-size="14" fill="#74c0fc" opacity="0.8">for i in *.sh; do</text>
  <text x="175" y="170" font-family="monospace" font-size="14" fill="#e8e8e8" opacity="0.6">&gt;   echo "$i"</text>
  <text x="175" y="200" font-family="monospace" font-size="14" fill="#e8e8e8" opacity="0.6">&gt; done</text>
  <text x="175" y="240" font-family="monospace" font-size="14" fill="#27c93f" opacity="0.9">$ </text>
  <text x="195" y="240" font-family="monospace" font-size="14" fill="#ffd43b" opacity="0.8">grep -r "pattern" .</text>
  <text x="175" y="270" font-family="monospace" font-size="14" fill="#27c93f" opacity="0.9">$ </text>
  <text x="195" y="270" font-family="monospace" font-size="14" fill="#ff6b6b" opacity="0.8">pipe | sed | awk</text>
  <!-- Blinking cursor -->
  <rect x="175" y="290" width="8" height="15" fill="#27c93f" opacity="0.7"/>
  <!-- Pipe symbols floating -->
  <text x="700" y="150" font-family="monospace" font-size="30" fill="#74c0fc" opacity="0.3">|</text>
  <text x="720" y="200" font-family="monospace" font-size="30" fill="#74c0fc" opacity="0.3">&gt;</text>
  <text x="690" y="250" font-family="monospace" font-size="30" fill="#74c0fc" opacity="0.3">&amp;</text>
  <text x="80" y="160" font-family="monospace" font-size="30" fill="#74c0fc" opacity="0.3">#!</text>
  <text x="90" y="220" font-family="monospace" font-size="30" fill="#74c0fc" opacity="0.3">$</text>
  <!-- Title -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#adb5bd" letter-spacing="3">BASH SCRIPTING</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_intro.yaml -->
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;

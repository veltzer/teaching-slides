<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1a1a2e" />
  <rect x="240" y="90" width="800" height="540" rx="16" fill="#2d2d2d" stroke="#495057" stroke-width="3.2" />
  <rect x="240" y="90" width="800" height="54" rx="16" fill="#495057" />
  <rect x="240" y="126" width="800" height="18" fill="#495057" />
  <circle cx="280" cy="117" r="9.6" fill="#ff5f56" />
  <circle cx="312" cy="117" r="9.6" fill="#ffbd2e" />
  <circle cx="344" cy="117" r="9.6" fill="#27c93f" />
  <text x="280" y="198" font-family="monospace" font-size="22.4" fill="#27c93f" opacity="0.9">$ </text>
  <text x="312" y="198" font-family="monospace" font-size="22.4" fill="#e8e8e8" opacity="0.8">#!/bin/bash</text>
  <text x="280" y="252" font-family="monospace" font-size="22.4" fill="#27c93f" opacity="0.9">$ </text>
  <text x="312" y="252" font-family="monospace" font-size="22.4" fill="#74c0fc" opacity="0.8">for i in *.sh; do</text>
  <text x="280" y="306" font-family="monospace" font-size="22.4" fill="#e8e8e8" opacity="0.6">&gt;   echo "$i"</text>
  <text x="280" y="360" font-family="monospace" font-size="22.4" fill="#e8e8e8" opacity="0.6">&gt; done</text>
  <text x="280" y="432" font-family="monospace" font-size="22.4" fill="#27c93f" opacity="0.9">$ </text>
  <text x="312" y="432" font-family="monospace" font-size="22.4" fill="#ffd43b" opacity="0.8">grep -r "pattern" .</text>
  <text x="280" y="486" font-family="monospace" font-size="22.4" fill="#27c93f" opacity="0.9">$ </text>
  <text x="312" y="486" font-family="monospace" font-size="22.4" fill="#ff6b6b" opacity="0.8">pipe | sed | awk</text>
  <rect x="280" y="522" width="12.8" height="27" fill="#27c93f" opacity="0.7" />
  <text x="1120" y="270" font-family="monospace" font-size="48" fill="#74c0fc" opacity="0.3">|</text>
  <text x="1152" y="360" font-family="monospace" font-size="48" fill="#74c0fc" opacity="0.3">&gt;</text>
  <text x="1104" y="450" font-family="monospace" font-size="48" fill="#74c0fc" opacity="0.3">&amp;</text>
  <text x="128" y="288" font-family="monospace" font-size="48" fill="#74c0fc" opacity="0.3">#!</text>
  <text x="144" y="396" font-family="monospace" font-size="48" fill="#74c0fc" opacity="0.3">$</text>
  <text x="640" y="702" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.8" fill="#adb5bd" letter-spacing="3">BASH SCRIPTING</text>
</svg>
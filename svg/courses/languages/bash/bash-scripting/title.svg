      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--code-bg)" />
  <ns0:rect x="213.3333" y="80" width="711.1111" height="480" rx="14.2222" fill="var(--text-dark)" stroke="var(--text-muted)" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:rect x="213.3333" y="80" width="711.1111" height="48" rx="14.2222" fill="var(--text-muted)" />
  <ns0:rect x="213.3333" y="112" width="711.1111" height="16" fill="var(--text-muted)" />
  <ns0:circle cx="248.8889" cy="104" r="8.8889" fill="var(--danger-light)" />
  <ns0:circle cx="277.3333" cy="104" r="8.8889" fill="var(--warn-amber)" />
  <ns0:circle cx="305.7778" cy="104" r="8.8889" fill="var(--ok-bright)" />
  <ns0:text x="248.8889" y="176" font-family="monospace" font-size="19.5556" fill="var(--ok-bright)" opacity="0.9">$ </ns0:text>
  <ns0:text x="277.3333" y="176" font-family="monospace" font-size="19.5556" fill="var(--surface-alt)" opacity="0.8">#!/bin/bash</ns0:text>
  <ns0:text x="248.8889" y="224" font-family="monospace" font-size="19.5556" fill="var(--ok-bright)" opacity="0.9">$ </ns0:text>
  <ns0:text x="277.3333" y="224" font-family="monospace" font-size="19.5556" fill="var(--primary-tint)" opacity="0.8">for i in *.sh; do</ns0:text>
  <ns0:text x="248.8889" y="272" font-family="monospace" font-size="19.5556" fill="var(--surface-alt)" opacity="0.6">&gt;   echo "$i"</ns0:text>
  <ns0:text x="248.8889" y="320" font-family="monospace" font-size="19.5556" fill="var(--surface-alt)" opacity="0.6">&gt; done</ns0:text>
  <ns0:text x="248.8889" y="384" font-family="monospace" font-size="19.5556" fill="var(--ok-bright)" opacity="0.9">$ </ns0:text>
  <ns0:text x="277.3333" y="384" font-family="monospace" font-size="19.5556" fill="var(--warn-amber)" opacity="0.8">grep -r "pattern" .</ns0:text>
  <ns0:text x="248.8889" y="432" font-family="monospace" font-size="19.5556" fill="var(--ok-bright)" opacity="0.9">$ </ns0:text>
  <ns0:text x="277.3333" y="432" font-family="monospace" font-size="19.5556" fill="var(--danger-light)" opacity="0.8">pipe | sed | awk</ns0:text>
  <ns0:rect x="248.8889" y="464" width="11.5556" height="24" fill="var(--ok-bright)" opacity="0.7" />
  <ns0:text x="995.5556" y="240" font-family="monospace" font-size="42.6667" fill="var(--primary-tint)" opacity="0.3">|</ns0:text>
  <ns0:text x="1024" y="320" font-family="monospace" font-size="42.6667" fill="var(--primary-tint)" opacity="0.3">&gt;</ns0:text>
  <ns0:text x="981.3333" y="400" font-family="monospace" font-size="42.6667" fill="var(--primary-tint)" opacity="0.3">&amp;</ns0:text>
  <ns0:text x="113.7778" y="256" font-family="monospace" font-size="42.6667" fill="var(--primary-tint)" opacity="0.3">#!</ns0:text>
  <ns0:text x="128" y="352" font-family="monospace" font-size="42.6667" fill="var(--primary-tint)" opacity="0.3">$</ns0:text>
  <ns0:text x="568.8889" y="613.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.8889" fill="var(--border-strong)" letter-spacing="3">BASH SCRIPTING</ns0:text>

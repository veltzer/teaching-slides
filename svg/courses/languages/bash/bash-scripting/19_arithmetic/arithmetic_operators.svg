<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#f8f9fa"/>

  <!-- Top syntax banner -->
  <rect x="40" y="20" width="1200" height="70" rx="10" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="200" y="45" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">$(( expression ))</text>
  <text x="200" y="72" font-family="sans-serif" font-size="15" fill="#bbdefb">evaluates expression, substitutes result (use in assignments and echo)</text>
  <text x="750" y="45" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">(( expression ))</text>
  <text x="750" y="72" font-family="sans-serif" font-size="15" fill="#bbdefb">evaluates expression, returns exit code (use in if/while)</text>
  <line x1="640" y1="25" x2="640" y2="85" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Section 1: Basic Operators -->
  <rect x="40" y="110" width="360" height="290" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="40" y="110" width="360" height="42" rx="10" fill="#1565c0"/>
  <rect x="40" y="138" width="360" height="14" fill="#1565c0"/>
  <text x="220" y="138" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Basic Operators</text>
  <!-- table header -->
  <rect x="50" y="160" width="340" height="28" rx="4" fill="#e3f2fd"/>
  <text x="120" y="179" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="middle">Operator</text>
  <text x="260" y="179" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="middle">Meaning</text>
  <text x="360" y="179" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="middle">Example</text>
  <!-- rows -->
  <line x1="50" y1="188" x2="390" y2="188" stroke="#e0e0e0" stroke-width="1"/>
  <text x="120" y="206" font-family="monospace" font-size="15" fill="#1e88e5" text-anchor="middle">+</text>
  <text x="240" y="206" font-family="sans-serif" font-size="13" fill="#333333">Addition</text>
  <text x="360" y="206" font-family="monospace" font-size="13" fill="#555555">$((5+3))→8</text>
  <line x1="50" y1="214" x2="390" y2="214" stroke="#f0f0f0" stroke-width="1"/>
  <text x="120" y="232" font-family="monospace" font-size="15" fill="#1e88e5" text-anchor="middle">-</text>
  <text x="240" y="232" font-family="sans-serif" font-size="13" fill="#333333">Subtraction</text>
  <text x="360" y="232" font-family="monospace" font-size="13" fill="#555555">$((10-4))→6</text>
  <line x1="50" y1="240" x2="390" y2="240" stroke="#f0f0f0" stroke-width="1"/>
  <text x="120" y="258" font-family="monospace" font-size="15" fill="#1e88e5" text-anchor="middle">*</text>
  <text x="240" y="258" font-family="sans-serif" font-size="13" fill="#333333">Multiplication</text>
  <text x="360" y="258" font-family="monospace" font-size="13" fill="#555555">$((3*7))→21</text>
  <line x1="50" y1="266" x2="390" y2="266" stroke="#f0f0f0" stroke-width="1"/>
  <text x="120" y="284" font-family="monospace" font-size="15" fill="#1e88e5" text-anchor="middle">/</text>
  <text x="240" y="284" font-family="sans-serif" font-size="13" fill="#333333">Integer division</text>
  <text x="360" y="284" font-family="monospace" font-size="13" fill="#555555">$((7/2))→3</text>
  <line x1="50" y1="292" x2="390" y2="292" stroke="#f0f0f0" stroke-width="1"/>
  <text x="120" y="310" font-family="monospace" font-size="15" fill="#1e88e5" text-anchor="middle">%</text>
  <text x="240" y="310" font-family="sans-serif" font-size="13" fill="#333333">Modulo (remainder)</text>
  <text x="360" y="310" font-family="monospace" font-size="13" fill="#555555">$((7%2))→1</text>
  <line x1="50" y1="318" x2="390" y2="318" stroke="#f0f0f0" stroke-width="1"/>
  <text x="120" y="336" font-family="monospace" font-size="15" fill="#1e88e5" text-anchor="middle">**</text>
  <text x="240" y="336" font-family="sans-serif" font-size="13" fill="#333333">Exponentiation</text>
  <text x="360" y="336" font-family="monospace" font-size="13" fill="#555555">$((2**8))→256</text>
  <line x1="50" y1="344" x2="390" y2="344" stroke="#f0f0f0" stroke-width="1"/>
  <text x="120" y="362" font-family="monospace" font-size="15" fill="#1e88e5" text-anchor="middle">-x</text>
  <text x="240" y="362" font-family="sans-serif" font-size="13" fill="#333333">Unary negation</text>
  <text x="360" y="362" font-family="monospace" font-size="13" fill="#555555">$((-x))</text>

  <!-- Section 2: Assignment Operators -->
  <rect x="420" y="110" width="360" height="290" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="420" y="110" width="360" height="42" rx="10" fill="#2e7d32"/>
  <rect x="420" y="138" width="360" height="14" fill="#2e7d32"/>
  <text x="600" y="138" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Assignment Operators</text>
  <rect x="430" y="160" width="340" height="28" rx="4" fill="#e8f5e9"/>
  <text x="520" y="179" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">Operator</text>
  <text x="660" y="179" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">Equivalent to</text>
  <text x="760" y="179" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">Result</text>
  <line x1="430" y1="188" x2="770" y2="188" stroke="#e0e0e0" stroke-width="1"/>
  <text x="520" y="206" font-family="monospace" font-size="14" fill="#2e7d32" text-anchor="middle">x=10</text>
  <text x="660" y="206" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">assign</text>
  <text x="760" y="206" font-family="monospace" font-size="13" fill="#555555">x=10</text>
  <line x1="430" y1="214" x2="770" y2="214" stroke="#f0f0f0" stroke-width="1"/>
  <text x="520" y="232" font-family="monospace" font-size="14" fill="#2e7d32" text-anchor="middle">((x+=5))</text>
  <text x="660" y="232" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">x = x + 5</text>
  <text x="760" y="232" font-family="monospace" font-size="13" fill="#555555">x=15</text>
  <line x1="430" y1="240" x2="770" y2="240" stroke="#f0f0f0" stroke-width="1"/>
  <text x="520" y="258" font-family="monospace" font-size="14" fill="#2e7d32" text-anchor="middle">((x-=3))</text>
  <text x="660" y="258" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">x = x - 3</text>
  <text x="760" y="258" font-family="monospace" font-size="13" fill="#555555">x=12</text>
  <line x1="430" y1="266" x2="770" y2="266" stroke="#f0f0f0" stroke-width="1"/>
  <text x="520" y="284" font-family="monospace" font-size="14" fill="#2e7d32" text-anchor="middle">((x*=2))</text>
  <text x="660" y="284" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">x = x * 2</text>
  <text x="760" y="284" font-family="monospace" font-size="13" fill="#555555">x=24</text>
  <line x1="430" y1="292" x2="770" y2="292" stroke="#f0f0f0" stroke-width="1"/>
  <text x="520" y="310" font-family="monospace" font-size="14" fill="#2e7d32" text-anchor="middle">((x/=4))</text>
  <text x="660" y="310" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">x = x / 4</text>
  <text x="760" y="310" font-family="monospace" font-size="13" fill="#555555">x=6</text>
  <line x1="430" y1="318" x2="770" y2="318" stroke="#f0f0f0" stroke-width="1"/>
  <text x="520" y="336" font-family="monospace" font-size="14" fill="#2e7d32" text-anchor="middle">((x%=4))</text>
  <text x="660" y="336" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">x = x % 4</text>
  <text x="760" y="336" font-family="monospace" font-size="13" fill="#555555">x=2</text>
  <line x1="430" y1="344" x2="770" y2="344" stroke="#f0f0f0" stroke-width="1"/>
  <text x="520" y="362" font-family="monospace" font-size="14" fill="#2e7d32" text-anchor="middle">((x++))</text>
  <text x="660" y="362" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">post-increment</text>
  <text x="760" y="362" font-family="monospace" font-size="13" fill="#555555">x=3</text>
  <line x1="430" y1="370" x2="770" y2="370" stroke="#f0f0f0" stroke-width="1"/>
  <text x="520" y="388" font-family="monospace" font-size="14" fill="#2e7d32" text-anchor="middle">((x--))</text>
  <text x="660" y="388" font-family="sans-serif" font-size="13" fill="#555555" text-anchor="middle">post-decrement</text>
  <text x="760" y="388" font-family="monospace" font-size="13" fill="#555555">x=2</text>

  <!-- Section 3: Comparison Operators -->
  <rect x="800" y="110" width="440" height="290" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="800" y="110" width="440" height="42" rx="10" fill="#f57c00"/>
  <rect x="800" y="138" width="440" height="14" fill="#f57c00"/>
  <text x="1020" y="138" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Comparison Operators  (( ))</text>
  <rect x="810" y="160" width="420" height="28" rx="4" fill="#fff3e0"/>
  <text x="900" y="179" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e65100" text-anchor="middle">Operator</text>
  <text x="1020" y="179" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e65100" text-anchor="middle">Meaning</text>
  <text x="1160" y="179" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e65100" text-anchor="middle">Usage</text>
  <line x1="810" y1="188" x2="1230" y2="188" stroke="#e0e0e0" stroke-width="1"/>
  <text x="900" y="206" font-family="monospace" font-size="14" fill="#f57c00" text-anchor="middle">==</text>
  <text x="1020" y="206" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">Equal</text>
  <text x="1140" y="206" font-family="monospace" font-size="13" fill="#555555">if (( a == b ))</text>
  <line x1="810" y1="214" x2="1230" y2="214" stroke="#f0f0f0" stroke-width="1"/>
  <text x="900" y="232" font-family="monospace" font-size="14" fill="#f57c00" text-anchor="middle">!=</text>
  <text x="1020" y="232" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">Not equal</text>
  <text x="1140" y="232" font-family="monospace" font-size="13" fill="#555555">if (( a != b ))</text>
  <line x1="810" y1="240" x2="1230" y2="240" stroke="#f0f0f0" stroke-width="1"/>
  <text x="900" y="258" font-family="monospace" font-size="14" fill="#f57c00" text-anchor="middle">&gt;</text>
  <text x="1020" y="258" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">Greater than</text>
  <text x="1140" y="258" font-family="monospace" font-size="13" fill="#555555">if (( a &gt; b ))</text>
  <line x1="810" y1="266" x2="1230" y2="266" stroke="#f0f0f0" stroke-width="1"/>
  <text x="900" y="284" font-family="monospace" font-size="14" fill="#f57c00" text-anchor="middle">&lt;</text>
  <text x="1020" y="284" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">Less than</text>
  <text x="1140" y="284" font-family="monospace" font-size="13" fill="#555555">if (( a &lt; b ))</text>
  <line x1="810" y1="292" x2="1230" y2="292" stroke="#f0f0f0" stroke-width="1"/>
  <text x="900" y="310" font-family="monospace" font-size="14" fill="#f57c00" text-anchor="middle">&gt;=</text>
  <text x="1020" y="310" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">Greater or equal</text>
  <text x="1140" y="310" font-family="monospace" font-size="13" fill="#555555">if (( a &gt;= b ))</text>
  <line x1="810" y1="318" x2="1230" y2="318" stroke="#f0f0f0" stroke-width="1"/>
  <text x="900" y="336" font-family="monospace" font-size="14" fill="#f57c00" text-anchor="middle">&lt;=</text>
  <text x="1020" y="336" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">Less or equal</text>
  <text x="1140" y="336" font-family="monospace" font-size="13" fill="#555555">if (( a &lt;= b ))</text>
  <line x1="810" y1="344" x2="1230" y2="344" stroke="#f0f0f0" stroke-width="1"/>
  <text x="900" y="362" font-family="monospace" font-size="14" fill="#f57c00" text-anchor="middle">&amp;&amp;</text>
  <text x="1020" y="362" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">Logical AND</text>
  <text x="1140" y="362" font-family="monospace" font-size="13" fill="#555555">(( a&gt;0 &amp;&amp; a&lt;10 ))</text>
  <line x1="810" y1="370" x2="1230" y2="370" stroke="#f0f0f0" stroke-width="1"/>
  <text x="900" y="388" font-family="monospace" font-size="14" fill="#f57c00" text-anchor="middle">||</text>
  <text x="1020" y="388" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">Logical OR</text>
  <text x="1140" y="388" font-family="monospace" font-size="13" fill="#555555">(( a==0 || b==0 ))</text>

  <!-- Bottom row: syntax comparison -->
  <rect x="40" y="420" width="580" height="160" rx="10" fill="#1e1e2e" filter="url(#shadow)"/>
  <rect x="40" y="420" width="580" height="36" rx="10" fill="#1565c0"/>
  <rect x="40" y="444" width="580" height="12" fill="#1565c0"/>
  <text x="330" y="444" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">$(( )) — substitution (value)</text>
  <text x="70" y="476" font-family="monospace" font-size="13" fill="#89dceb">result</text>
  <text x="115" y="476" font-family="monospace" font-size="13" fill="#cdd6f4">=$((10 + 5))</text>
  <text x="70" y="495" font-family="monospace" font-size="13" fill="#585b70"># result=15</text>
  <text x="70" y="514" font-family="monospace" font-size="13" fill="#a6e3a1">echo</text>
  <text x="109" y="514" font-family="monospace" font-size="13" fill="#cdd6f4"> "sum=$((x + y))"</text>
  <text x="70" y="533" font-family="monospace" font-size="13" fill="#585b70"># use anywhere you need a value</text>
  <text x="70" y="552" font-family="monospace" font-size="13" fill="#cdd6f4">arr[$((i+1))]="next"</text>
  <text x="70" y="571" font-family="monospace" font-size="13" fill="#585b70"># works as index too</text>

  <rect x="640" y="420" width="600" height="160" rx="10" fill="#1e1e2e" filter="url(#shadow)"/>
  <rect x="640" y="420" width="600" height="36" rx="10" fill="#2e7d32"/>
  <rect x="640" y="444" width="600" height="12" fill="#2e7d32"/>
  <text x="940" y="444" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">(( )) — command (exit code)</text>
  <text x="665" y="476" font-family="monospace" font-size="13" fill="#a6e3a1">if</text>
  <text x="688" y="476" font-family="monospace" font-size="13" fill="#cdd6f4"> (( x &gt; 0 )); </text>
  <text x="770" y="476" font-family="monospace" font-size="13" fill="#a6e3a1">then</text>
  <text x="665" y="495" font-family="monospace" font-size="13" fill="#cdd6f4">    echo "positive"</text>
  <text x="665" y="514" font-family="monospace" font-size="13" fill="#a6e3a1">fi</text>
  <text x="665" y="533" font-family="monospace" font-size="13" fill="#a6e3a1">while</text>
  <text x="714" y="533" font-family="monospace" font-size="13" fill="#cdd6f4"> (( i &lt; 10 )); </text>
  <text x="793" y="533" font-family="monospace" font-size="13" fill="#a6e3a1">do</text>
  <text x="665" y="552" font-family="monospace" font-size="13" fill="#cdd6f4">    ((i++))</text>
  <text x="665" y="571" font-family="monospace" font-size="13" fill="#a6e3a1">done</text>
</svg>

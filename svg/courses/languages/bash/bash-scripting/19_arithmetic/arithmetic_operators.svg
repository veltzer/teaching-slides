<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Syntax banner -->
  <rect x="40" y="40" width="590" height="80" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="75" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="var(--bg)">$(( expr ))</text>
  <text x="335" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)">substitutes value</text>

  <rect x="650" y="40" width="590" height="80" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="75" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="var(--bg)">(( expr ))</text>
  <text x="945" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)">returns exit code</text>

  <!-- Operators -->
  <rect x="40" y="140" width="390" height="280" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Arithmetic</text>
  <text x="70" y="215" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">+ - * / % **</text>
  <text x="70" y="260" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">$((7/2)) -&gt; 3</text>
  <text x="70" y="290" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">$((7%2)) -&gt; 1</text>
  <text x="70" y="320" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">$((2**8)) -&gt; 256</text>
  <text x="70" y="370" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--bg)">Integer only</text>

  <rect x="445" y="140" width="390" height="280" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Assignment</text>
  <text x="475" y="215" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">((x+=5))</text>
  <text x="475" y="250" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">((x-=3))</text>
  <text x="475" y="285" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">((x*=2))</text>
  <text x="475" y="320" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">((x/=4))</text>
  <text x="475" y="355" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">((x++)) ((x--))</text>

  <rect x="850" y="140" width="390" height="280" rx="8" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Comparison</text>
  <text x="880" y="215" font-family="Courier New, monospace" font-size="14" fill="var(--bg)">== != &lt; &gt; &lt;= &gt;=</text>
  <text x="880" y="255" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">&amp;&amp; ||</text>
  <text x="880" y="295" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">if (( a &gt; b ))</text>
  <text x="880" y="330" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">while (( i &lt; 10 ))</text>

  <!-- Examples -->
  <rect x="40" y="445" width="590" height="175" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">$(( )) value</text>
  <text x="70" y="515" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">result=$((10 + 5))</text>
  <text x="70" y="550" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">echo "sum=$((x+y))"</text>
  <text x="70" y="585" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">arr[$((i+1))]="next"</text>

  <rect x="650" y="445" width="590" height="175" rx="8" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">(( )) test</text>
  <text x="680" y="515" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">if (( x &gt; 0 )); then</text>
  <text x="680" y="550" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">while (( i &lt; 10 )); do</text>
  <text x="680" y="585" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">((i++)); done</text>
</svg>

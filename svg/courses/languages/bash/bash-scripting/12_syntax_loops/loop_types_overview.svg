  <rect x="511.6626" y="100.0327" width="148.3902" height="24.0633" rx="5.148" fill="url(#grad-until)" />
  <rect x="511.6626" y="119.2833" width="148.3902" height="4.8126" fill="url(#grad-until)" rx="5.148" />
  <text x="585.8576" y="115.6738" font-family="monospace" font-size="11.2295" font-weight="bold" fill="var(--bg)" text-anchor="middle">until</text>

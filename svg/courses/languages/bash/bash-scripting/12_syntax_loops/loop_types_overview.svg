  <text x="419.4199" y="158.9877" font-family="monospace" font-size="10" fill="var(--ok-accent)" text-anchor="middle">in list?</text>
  <line x1="419.4199" y1="161.7951" x2="419.4199" y2="172.2226" stroke="var(--text-muted)" stroke-width="0.3775" marker-end="url(#arrow)" />

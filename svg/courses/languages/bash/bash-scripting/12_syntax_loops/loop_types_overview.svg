<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-while" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-for" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
    <linearGradient id="grad-until" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
  </defs>
  <rect width="598.3056" height="299.1528" fill="var(--bg)" rx="5.2147" />
  <rect x="102.4598" y="61.8873" width="172.9477" height="271.1072" rx="5.2147" fill="var(--surface)" filter="url(#shadow)" />
  <rect x="102.4598" y="61.8873" width="172.9477" height="28.0456" rx="5.2147" fill="url(#grad-while)" />
  <rect x="102.4598" y="84.3237" width="172.9477" height="5.6091" fill="url(#grad-while)" rx="5.2147" />
  <text x="188.9337" y="80.1168" font-family="monospace" font-size="13.0879" font-weight="bold" fill="var(--bg)" text-anchor="middle">while</text>
  <text x="188.9337" y="103.9556" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Loops WHILE condition is true</text>
  <rect x="151.5396" y="113.3041" width="74.7882" height="20.5668" rx="5.2147" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.1966" />
  <text x="188.9337" y="125.9246" font-family="monospace" font-size="10" fill="var(--primary-accent)" text-anchor="middle">condition?</text>
  <line x1="188.9337" y1="133.8709" x2="188.9337" y2="146.024" stroke="var(--text-muted)" stroke-width="0.6435" marker-end="url(#arrow)" />
  <text x="195.945" y="141.3497" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">true</text>
  <rect x="151.5396" y="146.024" width="74.7882" height="20.5668" rx="5.2147" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1966" />
  <text x="188.9337" y="158.6445" font-family="monospace" font-size="10" fill="var(--ok-accent)" text-anchor="middle">do body</text>
  <path d="M 226.3278 156.3073 Q 252.0362 156.3073 252.0362 123.5876 Q 252.0362 90.8677 188.9337 90.8677" stroke="var(--text-muted)" stroke-width="0.6435" fill="none" marker-end="url(#arrow)" />
  <line x1="151.5396" y1="123.5876" x2="125.8312" y2="123.5876" stroke="var(--text-muted)" stroke-width="0.6435" marker-end="url(#arrow)" />
  <text x="122.0917" y="121.7178" font-family="sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="end">false</text>
  <rect x="111.8084" y="128.7292" width="37.3941" height="14.0228" rx="5.2147" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.1966" />
  <text x="130.5054" y="138.0777" font-family="sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">exit loop</text>
  <rect x="111.8084" y="178.7437" width="154.2507" height="70.1139" rx="5.2147" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="0.4827" />
  <text x="121.1569" y="190.4294" font-family="monospace" font-size="10" fill="var(--primary-accent)">while</text>
  <text x="139.8539" y="190.4294" font-family="monospace" font-size="10" fill="var(--primary-accent)"> [ $count -le 5 ]; </text>
  <text x="121.1569" y="190.4294" font-family="monospace" font-size="10" fill="var(--primary-accent)">while</text>
  <text x="121.1569" y="199.778" font-family="monospace" font-size="10" fill="var(--primary-accent)">do</text>
  <text x="130.5054" y="209.1265" font-family="monospace" font-size="10" fill="var(--primary-accent)">  echo $count</text>
  <text x="130.5054" y="218.475" font-family="monospace" font-size="10" fill="var(--primary-accent)">  ((count++))</text>
  <text x="121.1569" y="227.8235" font-family="monospace" font-size="10" fill="var(--primary-accent)">done</text>
  <text x="116.4827" y="258.2063" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">Use cases:</text>
  <text x="116.4827" y="268.4896" font-family="sans-serif" font-size="10" fill="var(--text)">• Wait for a condition</text>
  <text x="116.4827" y="277.8381" font-family="sans-serif" font-size="10" fill="var(--text)">• Read input line by line</text>
  <text x="116.4827" y="287.1866" font-family="sans-serif" font-size="10" fill="var(--text)">• Retry until success</text>
  <text x="116.4827" y="296.5352" font-family="sans-serif" font-size="10" fill="var(--text)">• Daemon / polling loops</text>
  <rect x="296.4418" y="61.8873" width="172.9477" height="271.1072" rx="5.2147" fill="var(--surface)" filter="url(#shadow)" />
  <rect x="296.4418" y="61.8873" width="172.9477" height="28.0456" rx="5.2147" fill="url(#grad-for)" />
  <rect x="296.4418" y="84.3237" width="172.9477" height="5.6091" fill="url(#grad-for)" rx="5.2147" />
  <text x="382.9156" y="80.1168" font-family="monospace" font-size="13.0879" font-weight="bold" fill="var(--bg)" text-anchor="middle">for</text>
  <text x="382.9156" y="103.9556" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Iterates over a list or range</text>
  <rect x="345.5215" y="113.3041" width="74.7882" height="20.5668" rx="5.2147" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1966" />
  <text x="382.9156" y="122.6527" font-family="monospace" font-size="10" fill="var(--ok-accent)" text-anchor="middle">more items</text>
  <text x="382.9156" y="130.5989" font-family="monospace" font-size="10" fill="var(--ok-accent)" text-anchor="middle">in list?</text>
  <line x1="382.9156" y1="133.8709" x2="382.9156" y2="146.024" stroke="var(--text-muted)" stroke-width="0.6435" marker-end="url(#arrow)" />
  <text x="389.927" y="141.3497" font-family="sans-serif" font-size="10" fill="var(--ok-accent)">yes</text>
  <rect x="345.5215" y="146.024" width="74.7882" height="20.5668" rx="5.2147" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1966" />
  <text x="382.9156" y="158.6445" font-family="monospace" font-size="10" fill="var(--ok-accent)" text-anchor="middle">do body</text>
  <path d="M 420.3097 156.3073 Q 446.0181 156.3073 446.0181 123.5876 Q 446.0181 90.8677 382.9156 90.8677" stroke="var(--text-muted)" stroke-width="0.6435" fill="none" marker-end="url(#arrow)" />
  <line x1="345.5215" y1="123.5876" x2="319.813" y2="123.5876" stroke="var(--text-muted)" stroke-width="0.6435" marker-end="url(#arrow)" />
  <text x="316.0736" y="121.7178" font-family="sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="end">no</text>
  <rect x="305.7903" y="128.7292" width="37.3941" height="14.0228" rx="5.2147" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.1966" />
  <text x="324.4873" y="138.0777" font-family="sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">exit loop</text>
  <rect x="305.7903" y="178.7437" width="154.2507" height="79.4625" rx="5.2147" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="0.4827" />
  <text x="315.1388" y="190.4294" font-family="monospace" font-size="10" fill="var(--ok-accent)">for</text>
  <text x="327.7593" y="190.4294" font-family="monospace" font-size="10" fill="var(--primary-accent)"> fruit in apple banana; </text>
  <text x="315.1388" y="199.778" font-family="monospace" font-size="10" fill="var(--ok-accent)">do</text>
  <text x="315.1388" y="209.1265" font-family="monospace" font-size="10" fill="var(--primary-accent)">  echo "$fruit"</text>
  <text x="315.1388" y="218.475" font-family="monospace" font-size="10" fill="var(--ok-accent)">done</text>
  <text x="315.1388" y="230.1607" font-family="monospace" font-size="10" fill="var(--text-muted)"># C-style:</text>
  <text x="315.1388" y="238.5744" font-family="monospace" font-size="10" fill="var(--ok-accent)">for</text>
  <text x="327.7593" y="238.5744" font-family="monospace" font-size="10" fill="var(--primary-accent)"> ((i=0; i&lt;10; i++)); </text>
  <text x="315.1388" y="246.988" font-family="monospace" font-size="10" fill="var(--ok-accent)">do</text>
  <text x="315.1388" y="255.4017" font-family="monospace" font-size="10" fill="var(--primary-accent)">  echo $i</text>
  <text x="310.4645" y="267.5548" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Use cases:</text>
  <text x="310.4645" y="277.8381" font-family="sans-serif" font-size="10" fill="var(--text)">• Process a list of items</text>
  <text x="310.4645" y="287.1866" font-family="sans-serif" font-size="10" fill="var(--text)">• Iterate over files (glob)</text>
  <text x="310.4645" y="296.5352" font-family="sans-serif" font-size="10" fill="var(--text)">• Counted repetitions</text>
  <text x="310.4645" y="305.8837" font-family="sans-serif" font-size="10" fill="var(--text)">• Loop over array elements</text>
  <rect x="490.4237" y="61.8873" width="172.9477" height="271.1072" rx="5.2147" fill="var(--surface)" filter="url(#shadow)" />
  <rect x="490.4237" y="61.8873" width="172.9477" height="28.0456" rx="5.2147" fill="url(#grad-until)" />
  <rect x="490.4237" y="84.3237" width="172.9477" height="5.6091" fill="url(#grad-until)" rx="5.2147" />
  <text x="576.8975" y="80.1168" font-family="monospace" font-size="13.0879" font-weight="bold" fill="var(--bg)" text-anchor="middle">until</text>
  <text x="576.8975" y="103.9556" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Loops UNTIL condition is true</text>
  <rect x="539.5033" y="113.3041" width="74.7882" height="20.5668" rx="5.2147" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1966" />
  <text x="576.8975" y="125.9246" font-family="monospace" font-size="10" fill="var(--warn-accent)" text-anchor="middle">condition?</text>

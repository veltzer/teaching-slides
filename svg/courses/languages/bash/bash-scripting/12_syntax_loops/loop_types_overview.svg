<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-while" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-for" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
    <linearGradient id="grad-until" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
  </defs>
  <rect width="1000" height="500" fill="var(--bg)" rx="8.7158"/>
  <rect x="171.25" y="103.4376" width="289.0625" height="453.125" rx="8.7158" fill="var(--surface)" filter="url(#shadow)" />
  <rect x="171.25" y="103.4376" width="289.0625" height="46.875" rx="8.7158" fill="url(#grad-while)" />
  <rect x="171.25" y="140.9375" width="289.0625" height="9.375" fill="url(#grad-while)" rx="8.7158"/>
  <text x="315.7812" y="133.9062" font-family="monospace" font-size="21.875" font-weight="bold" fill="var(--bg)" text-anchor="middle">while</text>
  <text x="315.7812" y="173.75" font-family="sans-serif" font-size="14.5264" fill="var(--text-muted)" text-anchor="middle">Loops WHILE condition is true</text>
  <rect x="253.2813" y="189.375" width="125" height="34.375" rx="8.7158" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="315.7812" y="210.4687" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)" text-anchor="middle">condition?</text>
  <line x1="315.7812" y1="223.75" x2="315.7812" y2="244.0625" stroke="var(--text-muted)" stroke-width="1.0756" marker-end="url(#arrow)" />
  <text x="327.4999" y="236.25" font-family="sans-serif" font-size="14.5264" fill="var(--ok-accent)">true</text>
  <rect x="253.2813" y="244.0625" width="125" height="34.375" rx="8.7158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="315.7812" y="265.1563" font-family="monospace" font-size="14.5264" fill="var(--ok-accent)" text-anchor="middle">do body</text>
  <path d="M 378.2812 261.25 Q 421.2499 261.25 421.2499 206.5626 Q 421.2499 151.875 315.7812 151.875" stroke="var(--text-muted)" stroke-width="1.0756" fill="none" marker-end="url(#arrow)" />
  <line x1="253.2813" y1="206.5626" x2="210.3126" y2="206.5626" stroke="var(--text-muted)" stroke-width="1.0756" marker-end="url(#arrow)" />
  <text x="204.0624" y="203.4375" font-family="sans-serif" font-size="14.5264" fill="var(--danger-accent)" text-anchor="end">false</text>
  <rect x="186.875" y="215.1562" width="62.5" height="23.4376" rx="8.7158" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="218.125" y="230.7812" font-family="sans-serif" font-size="14.5264" fill="var(--danger-accent)" text-anchor="middle">exit loop</text>
  <rect x="186.875" y="298.7499" width="257.8125" height="117.1875" rx="8.7158" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="0.8067" />
  <text x="202.5" y="318.2812" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)">while</text>
  <text x="233.75" y="318.2812" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)"> [ $count -le 5 ]; </text>
  <text x="202.5" y="318.2812" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)">while</text>
  <text x="202.5" y="333.9062" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)">do</text>
  <text x="218.125" y="349.5312" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)">  echo $count</text>
  <text x="218.125" y="365.1562" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)">  ((count++))</text>
  <text x="202.5" y="380.7812" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)">done</text>
  <text x="194.6876" y="431.5625" font-family="sans-serif" font-size="14.5264" font-weight="bold" fill="var(--primary-accent)">Use cases:</text>
  <text x="194.6876" y="448.7499" font-family="sans-serif" font-size="14.5264" fill="var(--text)">• Wait for a condition</text>
  <text x="194.6876" y="464.3749" font-family="sans-serif" font-size="14.5264" fill="var(--text)">• Read input line by line</text>
  <text x="194.6876" y="479.9999" font-family="sans-serif" font-size="14.5264" fill="var(--text)">• Retry until success</text>
  <text x="194.6876" y="495.6249" font-family="sans-serif" font-size="14.5264" fill="var(--text)">• Daemon / polling loops</text>
  <rect x="495.4688" y="103.4376" width="289.0625" height="453.125" rx="8.7158" fill="var(--surface)" filter="url(#shadow)" />
  <rect x="495.4688" y="103.4376" width="289.0625" height="46.875" rx="8.7158" fill="url(#grad-for)" />
  <rect x="495.4688" y="140.9375" width="289.0625" height="9.375" fill="url(#grad-for)" rx="8.7158"/>
  <text x="640" y="133.9062" font-family="monospace" font-size="21.875" font-weight="bold" fill="var(--bg)" text-anchor="middle">for</text>
  <text x="640" y="173.75" font-family="sans-serif" font-size="14.5264" fill="var(--text-muted)" text-anchor="middle">Iterates over a list or range</text>
  <rect x="577.5" y="189.375" width="125" height="34.375" rx="8.7158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="205" font-family="monospace" font-size="14.5264" fill="var(--ok-accent)" text-anchor="middle">more items</text>
  <text x="640" y="218.2813" font-family="monospace" font-size="14.5264" fill="var(--ok-accent)" text-anchor="middle">in list?</text>
  <line x1="640" y1="223.75" x2="640" y2="244.0625" stroke="var(--text-muted)" stroke-width="1.0756" marker-end="url(#arrow)" />
  <text x="651.7187" y="236.25" font-family="sans-serif" font-size="14.5264" fill="var(--ok-accent)">yes</text>
  <rect x="577.5" y="244.0625" width="125" height="34.375" rx="8.7158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="265.1563" font-family="monospace" font-size="14.5264" fill="var(--ok-accent)" text-anchor="middle">do body</text>
  <path d="M 702.5 261.25 Q 745.4687 261.25 745.4687 206.5626 Q 745.4687 151.875 640 151.875" stroke="var(--text-muted)" stroke-width="1.0756" fill="none" marker-end="url(#arrow)" />
  <line x1="577.5" y1="206.5626" x2="534.5312" y2="206.5626" stroke="var(--text-muted)" stroke-width="1.0756" marker-end="url(#arrow)" />
  <text x="528.2812" y="203.4375" font-family="sans-serif" font-size="14.5264" fill="var(--danger-accent)" text-anchor="end">no</text>
  <rect x="511.0938" y="215.1562" width="62.5" height="23.4376" rx="8.7158" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="542.3437" y="230.7812" font-family="sans-serif" font-size="14.5264" fill="var(--danger-accent)" text-anchor="middle">exit loop</text>
  <rect x="511.0938" y="298.7499" width="257.8125" height="132.8125" rx="8.7158" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="0.8067" />
  <text x="526.7187" y="318.2812" font-family="monospace" font-size="14.5264" fill="var(--ok-accent)">for</text>
  <text x="547.8125" y="318.2812" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)"> fruit in apple banana; </text>
  <text x="526.7187" y="333.9062" font-family="monospace" font-size="14.5264" fill="var(--ok-accent)">do</text>
  <text x="526.7187" y="349.5312" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)">  echo "$fruit"</text>
  <text x="526.7187" y="365.1562" font-family="monospace" font-size="14.5264" fill="var(--ok-accent)">done</text>
  <text x="526.7187" y="384.6875" font-family="monospace" font-size="14.5264" fill="var(--text-muted)"># C-style:</text>
  <text x="526.7187" y="398.75" font-family="monospace" font-size="14.5264" fill="var(--ok-accent)">for</text>
  <text x="547.8125" y="398.75" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)"> ((i=0; i&lt;10; i++)); </text>
  <text x="526.7187" y="412.8124" font-family="monospace" font-size="14.5264" fill="var(--ok-accent)">do</text>
  <text x="526.7187" y="426.875" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)">  echo $i</text>
  <text x="518.9062" y="447.1875" font-family="sans-serif" font-size="14.5264" font-weight="bold" fill="var(--ok-accent)">Use cases:</text>
  <text x="518.9062" y="464.3749" font-family="sans-serif" font-size="14.5264" fill="var(--text)">• Process a list of items</text>
  <text x="518.9062" y="479.9999" font-family="sans-serif" font-size="14.5264" fill="var(--text)">• Iterate over files (glob)</text>
  <text x="518.9062" y="495.6249" font-family="sans-serif" font-size="14.5264" fill="var(--text)">• Counted repetitions</text>
  <text x="518.9062" y="511.2499" font-family="sans-serif" font-size="14.5264" fill="var(--text)">• Loop over array elements</text>
  <rect x="819.6875" y="103.4376" width="289.0625" height="453.125" rx="8.7158" fill="var(--surface)" filter="url(#shadow)" />
  <rect x="819.6875" y="103.4376" width="289.0625" height="46.875" rx="8.7158" fill="url(#grad-until)" />
  <rect x="819.6875" y="140.9375" width="289.0625" height="9.375" fill="url(#grad-until)" rx="8.7158"/>
  <text x="964.2188" y="133.9062" font-family="monospace" font-size="21.875" font-weight="bold" fill="var(--bg)" text-anchor="middle">until</text>
  <text x="964.2188" y="173.75" font-family="sans-serif" font-size="14.5264" fill="var(--text-muted)" text-anchor="middle">Loops UNTIL condition is true</text>
  <rect x="901.7186" y="189.375" width="125" height="34.375" rx="8.7158" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="964.2188" y="210.4687" font-family="monospace" font-size="14.5264" fill="var(--warn-accent)" text-anchor="middle">condition?</text>
  <line x1="964.2188" y1="223.75" x2="964.2188" y2="244.0625" stroke="var(--text-muted)" stroke-width="1.0756" marker-end="url(#arrow)" />
  <text x="975.9375" y="236.25" font-family="sans-serif" font-size="14.5264" fill="var(--danger-accent)">false</text>
  <rect x="901.7186" y="244.0625" width="125" height="34.375" rx="8.7158" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="964.2188" y="265.1563" font-family="monospace" font-size="14.5264" fill="var(--warn-accent)" text-anchor="middle">do body</text>
  <path d="M 1026.7187 261.25 Q 1069.6874 261.25 1069.6874 206.5626 Q 1069.6874 151.875 964.2188 151.875" stroke="var(--text-muted)" stroke-width="1.0756" fill="none" marker-end="url(#arrow)" />
  <line x1="901.7186" y1="206.5626" x2="858.7499" y2="206.5626" stroke="var(--text-muted)" stroke-width="1.0756" marker-end="url(#arrow)" />
  <text x="852.5" y="203.4375" font-family="sans-serif" font-size="14.5264" fill="var(--ok-accent)" text-anchor="end">true</text>
  <rect x="835.3125" y="215.1562" width="62.5" height="23.4376" rx="8.7158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="866.5625" y="230.7812" font-family="sans-serif" font-size="14.5264" fill="var(--ok-accent)" text-anchor="middle">exit loop</text>
  <rect x="835.3125" y="298.7499" width="257.8125" height="117.1875" rx="8.7158" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="0.8067" />
  <text x="850.9375" y="318.2812" font-family="monospace" font-size="14.5264" fill="var(--warn-accent)">until</text>
  <text x="886.0936" y="318.2812" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)"> [ $count -gt 5 ]; </text>
  <text x="850.9375" y="333.9062" font-family="monospace" font-size="14.5264" fill="var(--warn-accent)">do</text>
  <text x="866.5625" y="349.5312" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)">  echo $count</text>
  <text x="866.5625" y="365.1562" font-family="monospace" font-size="14.5264" fill="var(--primary-accent)">  ((count++))</text>
  <text x="850.9375" y="380.7812" font-family="monospace" font-size="14.5264" fill="var(--warn-accent)">done</text>
  <text x="843.1249" y="431.5625" font-family="sans-serif" font-size="14.5264" font-weight="bold" fill="var(--warn-accent)">Use cases:</text>
  <text x="843.1249" y="448.7499" font-family="sans-serif" font-size="14.5264" fill="var(--text)">• Wait for service to start</text>
  <text x="843.1249" y="464.3749" font-family="sans-serif" font-size="14.5264" fill="var(--text)">• Retry until success</text>
  <text x="843.1249" y="479.9999" font-family="sans-serif" font-size="14.5264" fill="var(--text)">• Opposite logic to while</text>
  <text x="843.1249" y="495.6249" font-family="sans-serif" font-size="14.5264" fill="var(--text)">• Poll until condition met</text>
  <rect x="171.25" y="568.2813" width="937.5" height="3.1251" rx="8.7158" fill="var(--border)" />
  <rect x="171.25" y="568.2813" width="304.6875" height="3.1251" rx="8.7158" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="491.5625" y="568.2813" width="304.6875" height="3.1251" rx="8.7158" fill="var(--ok-accent)" />
  <rect x="811.875" y="568.2813" width="296.8749" height="3.1251" rx="8.7158" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>

      <stop offset="0%" stop-color="#f57c00" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
  </defs>
  <rect width="513.35" height="256.675" fill="var(--bg)" rx="5.148" />
  <rect x="178.7871" y="100.0327" width="148.3902" height="232.6117" rx="5.148" fill="var(--surface)" filter="url(#shadow)" />

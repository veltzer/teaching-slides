  <rect x="387.3355" y="172.2226" width="64.1687" height="17.6465" rx="5.148" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1733" />
  <text x="419.4199" y="183.051" font-family="monospace" font-size="10" fill="var(--ok-accent)" text-anchor="middle">do body</text>

  <line x1="387.3355" y1="152.972" x2="365.2775" y2="152.972" stroke="var(--text-muted)" stroke-width="0.3775" marker-end="url(#arrow)" />
  <text x="362.0691" y="151.3677" font-family="sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="end">no</text>
  <rect x="353.246" y="157.3835" width="32.0844" height="12.0316" rx="5.148" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.1733" />
  <text x="369.2881" y="165.4046" font-family="sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">exit loop</text>
  <rect x="353.246" y="200.2963" width="132.3481" height="68.1793" rx="5.148" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="0.2832" />
  <text x="361.267" y="210.3227" font-family="monospace" font-size="10" fill="var(--ok-accent)">for</text>
  <text x="372.0955" y="210.3227" font-family="monospace" font-size="10" fill="var(--primary-accent)"> fruit in apple banana; </text>
  <text x="361.267" y="218.3438" font-family="monospace" font-size="10" fill="var(--ok-accent)">do</text>
  <text x="361.267" y="226.3649" font-family="monospace" font-size="10" fill="var(--primary-accent)">  echo "$fruit"</text>
  <text x="361.267" y="234.386" font-family="monospace" font-size="10" fill="var(--ok-accent)">done</text>
  <text x="361.267" y="244.4124" font-family="monospace" font-size="10" fill="var(--text-muted)"># C-style:</text>
  <text x="361.267" y="251.6314" font-family="monospace" font-size="10" fill="var(--ok-accent)">for</text>
  <text x="372.0955" y="251.6314" font-family="monospace" font-size="10" fill="var(--primary-accent)"> ((i=0; i&lt;10; i++)); </text>
  <text x="361.267" y="258.8503" font-family="monospace" font-size="10" fill="var(--ok-accent)">do</text>
  <text x="361.267" y="266.0694" font-family="monospace" font-size="10" fill="var(--primary-accent)">  echo $i</text>
  <text x="357.2564" y="276.4968" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Use cases:</text>
  <text x="357.2564" y="285.3199" font-family="sans-serif" font-size="10" fill="var(--text)">• Process a list of items</text>
  <text x="357.2564" y="293.341" font-family="sans-serif" font-size="10" fill="var(--text)">• Iterate over files (glob)</text>
  <text x="357.2564" y="301.3621" font-family="sans-serif" font-size="10" fill="var(--text)">• Counted repetitions</text>
  <text x="357.2564" y="309.3832" font-family="sans-serif" font-size="10" fill="var(--text)">• Loop over array elements</text>

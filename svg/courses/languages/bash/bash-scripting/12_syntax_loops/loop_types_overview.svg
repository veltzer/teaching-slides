  <line x1="553.7732" y1="152.972" x2="531.7152" y2="152.972" stroke="var(--text-muted)" stroke-width="0.3775" marker-end="url(#arrow)" />
  <text x="528.5069" y="151.3677" font-family="sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="end">true</text>
  <rect x="519.6836" y="157.3835" width="32.0844" height="12.0316" rx="5.148" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1733" />
  <text x="535.7258" y="165.4046" font-family="sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">exit loop</text>
  <rect x="519.6836" y="200.2963" width="132.3481" height="60.1582" rx="5.148" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="0.2832" />
  <text x="527.7047" y="210.3227" font-family="monospace" font-size="10" fill="var(--warn-accent)">until</text>
  <text x="545.7521" y="210.3227" font-family="monospace" font-size="10" fill="var(--primary-accent)"> [ $count -gt 5 ]; </text>
  <text x="527.7047" y="218.3438" font-family="monospace" font-size="10" fill="var(--warn-accent)">do</text>
  <text x="535.7258" y="226.3649" font-family="monospace" font-size="10" fill="var(--primary-accent)">  echo $count</text>
  <text x="535.7258" y="234.386" font-family="monospace" font-size="10" fill="var(--primary-accent)">  ((count++))</text>
  <text x="527.7047" y="242.4071" font-family="monospace" font-size="10" fill="var(--warn-accent)">done</text>
  <text x="523.6942" y="268.4757" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">Use cases:</text>
  <text x="523.6942" y="277.2988" font-family="sans-serif" font-size="10" fill="var(--text)">• Wait for service to start</text>
  <text x="523.6942" y="285.3199" font-family="sans-serif" font-size="10" fill="var(--text)">• Retry until success</text>
  <text x="523.6942" y="293.341" font-family="sans-serif" font-size="10" fill="var(--text)">• Opposite logic to while</text>
  <text x="523.6942" y="301.3621" font-family="sans-serif" font-size="10" fill="var(--text)">• Poll until condition met</text>

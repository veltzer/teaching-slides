  <rect x="539.5033" y="146.024" width="74.7882" height="20.5668" rx="5.2147" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1966" />
  <text x="576.8975" y="158.6445" font-family="monospace" font-size="10" fill="var(--warn-accent)" text-anchor="middle">do body</text>
  <path d="M 614.2916 156.3073 Q 640 156.3073 640 123.5876 Q 640 90.8677 576.8975 90.8677" stroke="var(--text-muted)" stroke-width="0.6435" fill="none" marker-end="url(#arrow)" />
  <line x1="539.5033" y1="123.5876" x2="513.7949" y2="123.5876" stroke="var(--text-muted)" stroke-width="0.6435" marker-end="url(#arrow)" />
  <text x="510.0556" y="121.7178" font-family="sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="end">true</text>
  <rect x="499.7722" y="128.7292" width="37.3941" height="14.0228" rx="5.2147" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1966" />
  <text x="518.4692" y="138.0777" font-family="sans-serif" font-size="10" fill="var(--ok-accent)" text-anchor="middle">exit loop</text>
  <rect x="499.7722" y="178.7437" width="154.2507" height="70.1139" rx="5.2147" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="0.4827" />
  <text x="509.1207" y="190.4294" font-family="monospace" font-size="10" fill="var(--warn-accent)">until</text>
  <text x="530.1548" y="190.4294" font-family="monospace" font-size="10" fill="var(--primary-accent)"> [ $count -gt 5 ]; </text>
  <text x="509.1207" y="199.778" font-family="monospace" font-size="10" fill="var(--warn-accent)">do</text>
  <text x="518.4692" y="209.1265" font-family="monospace" font-size="10" fill="var(--primary-accent)">  echo $count</text>
  <text x="518.4692" y="218.475" font-family="monospace" font-size="10" fill="var(--primary-accent)">  ((count++))</text>
  <text x="509.1207" y="227.8235" font-family="monospace" font-size="10" fill="var(--warn-accent)">done</text>
  <text x="504.4464" y="258.2063" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--warn-accent)">Use cases:</text>
  <text x="504.4464" y="268.4896" font-family="sans-serif" font-size="10" fill="var(--text)">• Wait for service to start</text>
  <text x="504.4464" y="277.8381" font-family="sans-serif" font-size="10" fill="var(--text)">• Retry until success</text>
  <text x="504.4464" y="287.1866" font-family="sans-serif" font-size="10" fill="var(--text)">• Opposite logic to while</text>
  <text x="504.4464" y="296.5352" font-family="sans-serif" font-size="10" fill="var(--text)">• Poll until condition met</text>

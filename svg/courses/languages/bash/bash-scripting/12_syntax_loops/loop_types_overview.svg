  <rect x="220.8979" y="172.2226" width="64.1687" height="17.6465" rx="5.148" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1733" />
  <text x="252.9823" y="183.051" font-family="monospace" font-size="10" fill="var(--ok-accent)" text-anchor="middle">do body</text>
  <path d="M 285.0666 181.0457 Q 307.1246 181.0457 307.1246 152.972 Q 307.1246 124.8981 252.9823 124.8981" stroke="var(--text-muted)" stroke-width="0.3775" fill="none" marker-end="url(#arrow)" />
  <line x1="220.8979" y1="152.972" x2="198.8399" y2="152.972" stroke="var(--text-muted)" stroke-width="0.3775" marker-end="url(#arrow)" />
  <text x="195.6314" y="151.3677" font-family="sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="end">false</text>
  <rect x="186.8082" y="157.3835" width="32.0844" height="12.0316" rx="5.148" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.1733" />
  <text x="202.8504" y="165.4046" font-family="sans-serif" font-size="10" fill="var(--danger-accent)" text-anchor="middle">exit loop</text>
  <rect x="186.8082" y="200.2963" width="132.3481" height="60.1582" rx="5.148" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="0.2832" />
  <text x="194.8293" y="210.3227" font-family="monospace" font-size="10" fill="var(--primary-accent)">while</text>
  <text x="210.8715" y="210.3227" font-family="monospace" font-size="10" fill="var(--primary-accent)"> [ $count -le 5 ]; </text>
  <text x="194.8293" y="210.3227" font-family="monospace" font-size="10" fill="var(--primary-accent)">while</text>
  <text x="194.8293" y="218.3438" font-family="monospace" font-size="10" fill="var(--primary-accent)">do</text>
  <text x="202.8504" y="226.3649" font-family="monospace" font-size="10" fill="var(--primary-accent)">  echo $count</text>
  <text x="202.8504" y="234.386" font-family="monospace" font-size="10" fill="var(--primary-accent)">  ((count++))</text>
  <text x="194.8293" y="242.4071" font-family="monospace" font-size="10" fill="var(--primary-accent)">done</text>
  <text x="190.8188" y="268.4757" font-family="sans-serif" font-size="10" font-weight="bold" fill="var(--primary-accent)">Use cases:</text>
  <text x="190.8188" y="277.2988" font-family="sans-serif" font-size="10" fill="var(--text)">• Wait for a condition</text>
  <text x="190.8188" y="285.3199" font-family="sans-serif" font-size="10" fill="var(--text)">• Read input line by line</text>
  <text x="190.8188" y="293.341" font-family="sans-serif" font-size="10" fill="var(--text)">• Retry until success</text>
  <text x="190.8188" y="301.3621" font-family="sans-serif" font-size="10" fill="var(--text)">• Daemon / polling loops</text>
  <rect x="345.2249" y="100.0327" width="148.3902" height="232.6117" rx="5.148" fill="var(--surface)" filter="url(#shadow)" />
  <rect x="345.2249" y="100.0327" width="148.3902" height="24.0633" rx="5.148" fill="url(#grad-for)" />
  <rect x="345.2249" y="119.2833" width="148.3902" height="4.8126" fill="url(#grad-for)" rx="5.148" />
  <text x="419.4199" y="115.6738" font-family="monospace" font-size="11.2295" font-weight="bold" fill="var(--bg)" text-anchor="middle">for</text>
  <text x="419.4199" y="136.1276" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Iterates over a list or range</text>
  <rect x="387.3355" y="144.1487" width="64.1687" height="17.6465" rx="5.148" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1733" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-while" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-for" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-until" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Column 1: while -->
  <rect x="40" y="30" width="370" height="580" rx="12" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="40" y="30" width="370" height="60" rx="12" fill="url(#grad-while)"/>
  <rect x="40" y="78" width="370" height="12" fill="url(#grad-while)"/>
  <text x="225" y="69" font-family="monospace" font-size="28" font-weight="bold" fill="var(--bg)" text-anchor="middle">while</text>

  <!-- while: condition label -->
  <text x="225" y="120" font-family="sans-serif" font-size="16" fill="var(--text-muted)" text-anchor="middle">Loops WHILE condition is true</text>

  <!-- while: flow diagram -->
  <rect x="145" y="140" width="160" height="44" rx="22" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
  <text x="225" y="167" font-family="monospace" font-size="14" fill="var(--primary-dk)" text-anchor="middle">condition?</text>
  <line x1="225" y1="184" x2="225" y2="210" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="200" font-family="sans-serif" font-size="12" fill="var(--ok-dk)">true</text>
  <rect x="145" y="210" width="160" height="44" rx="8" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="225" y="237" font-family="monospace" font-size="14" fill="var(--ok-dk)" text-anchor="middle">do body</text>
  <!-- loop back arrow -->
  <path d="M305,232 Q360,232 360,162 Q360,92 225,92" stroke="var(--text-muted)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- false exit -->
  <line x1="145" y1="162" x2="90" y2="162" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="82" y="158" font-family="sans-serif" font-size="12" fill="var(--danger)" text-anchor="end">false</text>
  <rect x="60" y="173" width="80" height="30" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="100" y="193" font-family="sans-serif" font-size="12" fill="var(--danger)" text-anchor="middle">exit loop</text>

  <!-- while: code box -->
  <rect x="60" y="280" width="330" height="150" rx="8" fill="var(--code-bg)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="80" y="305" font-family="monospace" font-size="13" fill="var(--primary-tint)">while</text>
  <text x="120" y="305" font-family="monospace" font-size="13" fill="var(--primary-lt)"> [ $count -le 5 ]; </text>
  <text x="80" y="305" font-family="monospace" font-size="13" fill="var(--primary-tint)">while</text>
  <text x="80" y="325" font-family="monospace" font-size="13" fill="var(--primary-tint)">do</text>
  <text x="100" y="345" font-family="monospace" font-size="13" fill="var(--primary-lt)">  echo $count</text>
  <text x="100" y="365" font-family="monospace" font-size="13" fill="var(--primary-lt)">  ((count++))</text>
  <text x="80" y="385" font-family="monospace" font-size="13" fill="var(--primary-tint)">done</text>

  <!-- while: use cases -->
  <text x="70" y="450" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">Use cases:</text>
  <text x="70" y="472" font-family="sans-serif" font-size="13" fill="var(--text-dark)">• Wait for a condition</text>
  <text x="70" y="492" font-family="sans-serif" font-size="13" fill="var(--text-dark)">• Read input line by line</text>
  <text x="70" y="512" font-family="sans-serif" font-size="13" fill="var(--text-dark)">• Retry until success</text>
  <text x="70" y="532" font-family="sans-serif" font-size="13" fill="var(--text-dark)">• Daemon / polling loops</text>

  <!-- Column 2: for -->
  <rect x="455" y="30" width="370" height="580" rx="12" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="455" y="30" width="370" height="60" rx="12" fill="url(#grad-for)"/>
  <rect x="455" y="78" width="370" height="12" fill="url(#grad-for)"/>
  <text x="640" y="69" font-family="monospace" font-size="28" font-weight="bold" fill="var(--bg)" text-anchor="middle">for</text>

  <text x="640" y="120" font-family="sans-serif" font-size="16" fill="var(--text-muted)" text-anchor="middle">Iterates over a list or range</text>

  <!-- for: flow -->
  <rect x="560" y="140" width="160" height="44" rx="22" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="640" y="160" font-family="monospace" font-size="12" fill="var(--ok-dk)" text-anchor="middle">more items</text>
  <text x="640" y="177" font-family="monospace" font-size="12" fill="var(--ok-dk)" text-anchor="middle">in list?</text>
  <line x1="640" y1="184" x2="640" y2="210" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="200" font-family="sans-serif" font-size="12" fill="var(--ok-dk)">yes</text>
  <rect x="560" y="210" width="160" height="44" rx="8" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="640" y="237" font-family="monospace" font-size="14" fill="var(--ok-dk)" text-anchor="middle">do body</text>
  <path d="M720,232 Q775,232 775,162 Q775,92 640,92" stroke="var(--text-muted)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <line x1="560" y1="162" x2="505" y2="162" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="497" y="158" font-family="sans-serif" font-size="12" fill="var(--danger)" text-anchor="end">no</text>
  <rect x="475" y="173" width="80" height="30" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="515" y="193" font-family="sans-serif" font-size="12" fill="var(--danger)" text-anchor="middle">exit loop</text>

  <!-- for: code box -->
  <rect x="475" y="280" width="330" height="170" rx="8" fill="var(--code-bg)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="495" y="305" font-family="monospace" font-size="12" fill="var(--ok-tint)">for</text>
  <text x="522" y="305" font-family="monospace" font-size="12" fill="var(--primary-lt)"> fruit in apple banana; </text>
  <text x="495" y="325" font-family="monospace" font-size="12" fill="var(--ok-tint)">do</text>
  <text x="495" y="345" font-family="monospace" font-size="12" fill="var(--primary-lt)">  echo "$fruit"</text>
  <text x="495" y="365" font-family="monospace" font-size="12" fill="var(--ok-tint)">done</text>
  <text x="495" y="390" font-family="monospace" font-size="12" fill="var(--text-mid)"># C-style:</text>
  <text x="495" y="408" font-family="monospace" font-size="12" fill="var(--ok-tint)">for</text>
  <text x="522" y="408" font-family="monospace" font-size="12" fill="var(--primary-lt)"> ((i=0; i&lt;10; i++)); </text>
  <text x="495" y="426" font-family="monospace" font-size="12" fill="var(--ok-tint)">do</text>
  <text x="495" y="444" font-family="monospace" font-size="12" fill="var(--primary-lt)">  echo $i</text>

  <!-- for: use cases -->
  <text x="485" y="470" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)">Use cases:</text>
  <text x="485" y="492" font-family="sans-serif" font-size="13" fill="var(--text-dark)">• Process a list of items</text>
  <text x="485" y="512" font-family="sans-serif" font-size="13" fill="var(--text-dark)">• Iterate over files (glob)</text>
  <text x="485" y="532" font-family="sans-serif" font-size="13" fill="var(--text-dark)">• Counted repetitions</text>
  <text x="485" y="552" font-family="sans-serif" font-size="13" fill="var(--text-dark)">• Loop over array elements</text>

  <!-- Column 3: until -->
  <rect x="870" y="30" width="370" height="580" rx="12" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="870" y="30" width="370" height="60" rx="12" fill="url(#grad-until)"/>
  <rect x="870" y="78" width="370" height="12" fill="url(#grad-until)"/>
  <text x="1055" y="69" font-family="monospace" font-size="28" font-weight="bold" fill="var(--bg)" text-anchor="middle">until</text>

  <text x="1055" y="120" font-family="sans-serif" font-size="16" fill="var(--text-muted)" text-anchor="middle">Loops UNTIL condition is true</text>

  <!-- until: flow -->
  <rect x="975" y="140" width="160" height="44" rx="22" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="2"/>
  <text x="1055" y="167" font-family="monospace" font-size="14" fill="var(--warn-dk)" text-anchor="middle">condition?</text>
  <line x1="1055" y1="184" x2="1055" y2="210" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1070" y="200" font-family="sans-serif" font-size="12" fill="var(--danger)">false</text>
  <rect x="975" y="210" width="160" height="44" rx="8" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="2"/>
  <text x="1055" y="237" font-family="monospace" font-size="14" fill="var(--warn-dk)" text-anchor="middle">do body</text>
  <path d="M1135,232 Q1190,232 1190,162 Q1190,92 1055,92" stroke="var(--text-muted)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <line x1="975" y1="162" x2="920" y2="162" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="912" y="158" font-family="sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="end">true</text>
  <rect x="890" y="173" width="80" height="30" rx="6" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="930" y="193" font-family="sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle">exit loop</text>

  <!-- until: code box -->
  <rect x="890" y="280" width="330" height="150" rx="8" fill="var(--code-bg)" stroke="var(--warn-mid)" stroke-width="1.5"/>
  <text x="910" y="305" font-family="monospace" font-size="13" fill="var(--warn-tint)">until</text>
  <text x="955" y="305" font-family="monospace" font-size="13" fill="var(--primary-lt)"> [ $count -gt 5 ]; </text>
  <text x="910" y="325" font-family="monospace" font-size="13" fill="var(--warn-tint)">do</text>
  <text x="930" y="345" font-family="monospace" font-size="13" fill="var(--primary-lt)">  echo $count</text>
  <text x="930" y="365" font-family="monospace" font-size="13" fill="var(--primary-lt)">  ((count++))</text>
  <text x="910" y="385" font-family="monospace" font-size="13" fill="var(--warn-tint)">done</text>

  <!-- until: use cases -->
  <text x="900" y="450" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)">Use cases:</text>
  <text x="900" y="472" font-family="sans-serif" font-size="13" fill="var(--text-dark)">• Wait for service to start</text>
  <text x="900" y="492" font-family="sans-serif" font-size="13" fill="var(--text-dark)">• Retry until success</text>
  <text x="900" y="512" font-family="sans-serif" font-size="13" fill="var(--text-dark)">• Opposite logic to while</text>
  <text x="900" y="532" font-family="sans-serif" font-size="13" fill="var(--text-dark)">• Poll until condition met</text>

  <!-- Bottom comparison bar -->
  <rect x="40" y="625" width="1200" height="4" rx="2" fill="var(--border)"/>
  <rect x="40" y="625" width="390" height="4" rx="2" fill="var(--primary)"/>
  <rect x="450" y="625" width="390" height="4" rx="2" fill="var(--ok-dk)"/>
  <rect x="860" y="625" width="380" height="4" rx="2" fill="var(--warn-mid)"/>
</svg>

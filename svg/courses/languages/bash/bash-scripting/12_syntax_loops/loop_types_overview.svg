  <rect x="178.7871" y="119.2833" width="148.3902" height="4.8126" fill="url(#grad-while)" rx="5.148" />
  <text x="252.9823" y="115.6738" font-family="monospace" font-size="11.2295" font-weight="bold" fill="var(--bg)" text-anchor="middle">while</text>
  <text x="252.9823" y="136.1276" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">Loops WHILE condition is true</text>
  <rect x="220.8979" y="144.1487" width="64.1687" height="17.6465" rx="5.148" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.1733" />
  <text x="252.9823" y="154.9771" font-family="monospace" font-size="10" fill="var(--primary-accent)" text-anchor="middle">condition?</text>
  <line x1="252.9823" y1="161.7951" x2="252.9823" y2="172.2226" stroke="var(--text-muted)" stroke-width="0.3775" marker-end="url(#arrow)" />

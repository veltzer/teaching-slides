<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="77.5" y="64.1667" width="1125" height="443.0556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="106.0556" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--primary-accent)">Shell Process</text>
  <rect x="115" y="128.6111" width="478.125" height="273.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="115" y="128.6111" width="478.125" height="41.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="115" y="152.7777" width="478.125" height="17.7223" fill="var(--primary-accent)" rx="6"/>
  <text x="354.0625" y="156.8056" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">Shell Variables</text>
  <text x="143.125" y="201.1111" font-size="17.3806" fill="var(--text)" font-family="monospace">x=5</text>
  <text x="143.125" y="231.7223" font-size="17.3806" fill="var(--text)" font-family="monospace">name="hello"</text>
  <text x="143.125" y="262.3333" font-size="17.3806" fill="var(--text)" font-family="monospace">count=0</text>
  <text x="143.125" y="313.8889" font-size="15.6425" fill="var(--text-muted)">Private to this shell process.</text>
  <text x="143.125" y="336.4444" font-size="15.6425" fill="var(--text-muted)">Not passed to child processes.</text>
  <text x="143.125" y="359" font-size="15.6425" fill="var(--text-muted)">Defined with:  name=value</text>
  <text x="143.125" y="381.5556" font-size="15.6425" fill="var(--danger-accent)" font-weight="bold">NOT inherited by children.</text>
  <rect x="649.375" y="128.6111" width="515.625" height="273.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="649.375" y="128.6111" width="515.625" height="41.8889" rx="6" fill="var(--ok-accent)" />
  <rect x="649.375" y="152.7777" width="515.625" height="17.7223" fill="var(--ok-accent)" rx="6"/>
  <text x="907.1875" y="156.8056" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">Environment Variables</text>
  <text x="677.4999" y="201.1111" font-size="17.3806" fill="var(--text)" font-family="monospace">PATH=...</text>
  <text x="677.4999" y="231.7223" font-size="17.3806" fill="var(--text)" font-family="monospace">HOME=/home/u</text>
  <text x="677.4999" y="262.3333" font-size="17.3806" fill="var(--text)" font-family="monospace">USER=mark</text>
  <text x="677.4999" y="313.8889" font-size="15.6425" fill="var(--text-muted)">Passed to all child processes.</text>
  <text x="677.4999" y="336.4444" font-size="15.6425" fill="var(--text-muted)">Defined with:  export name=value</text>
  <text x="677.4999" y="359" font-size="15.6425" fill="var(--text-muted)">Or:  declare -x name=value</text>
  <text x="677.4999" y="381.5556" font-size="15.6425" fill="var(--ok-accent)" font-weight="bold">Inherited by all children.</text>
  <line x1="635.3124" y1="144.7223" x2="635.3124" y2="386.3889" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" />
  <rect x="115" y="434.7223" width="1050" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="466.9444" text-anchor="middle" font-size="17.3806" fill="var(--text)" font-weight="bold">Shell vars: local to current shell — not passed to children</text>
  <text x="640" y="489.5" text-anchor="middle" font-size="17.3806" fill="var(--text)" font-weight="bold">Environment vars: exported — inherited by all child processes</text>
</svg>
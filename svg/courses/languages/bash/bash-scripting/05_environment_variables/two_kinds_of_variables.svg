<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.339918409345" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Shell Process</text>
  <rect x="40" y="73.278607432467" width="546.428571428571" height="404.09838805597" rx="7.791186425948" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="73.278607432467" width="546.428571428571" height="61.803297146267" rx="7.791186425948" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="108.934247546" width="546.428571428571" height="26.147655905685" fill="var(--primary-accent)" rx="7.791186425948"/>
  <text x="313.214285714286" y="114.877051277379" text-anchor="middle" font-size="24.826094613362" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Shell Variables</text>
  <text x="72.142857142857" y="180.245823059987" font-size="22.569247549708" fill="var(--text)" font-family="Courier New, monospace">x=5</text>
  <text x="72.142857142857" y="225.409890311751" font-size="22.569247549708" fill="var(--text)" font-family="Courier New, monospace">name="hello"</text>
  <text x="72.142857142857" y="270.573662276592" font-size="22.569247549708" fill="var(--text)" font-family="Courier New, monospace">count=0</text>
  <text x="72.142857142857" y="346.639303152709" font-size="20.312270817378" fill="var(--text-muted)" font-family="Arial, sans-serif">Private to this shell process.</text>
  <text x="72.142857142857" y="379.917910585176" font-size="20.312270817378" fill="var(--text-muted)" font-family="Arial, sans-serif">Not passed to child processes.</text>
  <text x="72.142857142857" y="413.196665661105" font-size="20.312270817378" fill="var(--text-muted)" font-family="Arial, sans-serif">Defined with:  name=value</text>
  <text x="72.142857142857" y="446.475420737034" font-size="20.312270817378" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">NOT inherited by children.</text>
  <rect x="650.714285714286" y="73.278607432467" width="589.285714285714" height="404.09838805597" rx="7.791186425948" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="650.714285714286" y="73.278607432467" width="589.285714285714" height="61.803297146267" rx="7.791186425948" fill="var(--ok-accent)"/>
  <rect x="650.714285714286" y="108.934247546" width="589.285714285714" height="26.147655905685" fill="var(--ok-accent)" rx="7.791186425948"/>
  <text x="945.357142857143" y="114.877051277379" text-anchor="middle" font-size="24.826094613362" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Environment Variables</text>
  <text x="682.857028214286" y="180.245823059987" font-size="22.569247549708" fill="var(--text)" font-family="Courier New, monospace">PATH=...</text>
  <text x="682.857028214286" y="225.409890311751" font-size="22.569247549708" fill="var(--text)" font-family="Courier New, monospace">HOME=/home/u</text>
  <text x="682.857028214286" y="270.573662276592" font-size="22.569247549708" fill="var(--text)" font-family="Courier New, monospace">USER=mark</text>
  <text x="682.857028214286" y="346.639303152709" font-size="20.312270817378" fill="var(--text-muted)" font-family="Arial, sans-serif">Passed to all child processes.</text>
  <text x="682.857028214286" y="379.917910585176" font-size="20.312270817378" fill="var(--text-muted)" font-family="Arial, sans-serif">Defined with:  export name=value</text>
  <text x="682.857028214286" y="413.196665661105" font-size="20.312270817378" fill="var(--text-muted)" font-family="Arial, sans-serif">Or:  declare -x name=value</text>
  <text x="682.857028214286" y="446.475420737034" font-size="20.312270817378" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Inherited by all children.</text>
  <line x1="634.6427425" y1="97.049230657088" x2="634.6427425" y2="453.606518780229" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556"/>
  <rect x="40" y="524.918095421266" width="1200" height="95.081904578734" rx="7.791186425948" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="572.458900067171" text-anchor="middle" font-size="22.569247549708" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Shell vars: local to current shell — not passed to children</text>
  <text x="640" y="605.7376551431" text-anchor="middle" font-size="22.569247549708" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Environment vars: exported — inherited by all child processes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Shell Process outer frame -->
  <rect x="40" y="30" width="1200" height="550" rx="12" fill="#f0f4ff" stroke="#1e88e5" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="640" y="82" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">Shell Process</text>

  <!-- Shell Variables panel -->
  <rect x="80" y="110" width="510" height="340" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="110" width="510" height="52" rx="10" fill="url(#grad-accent)"/>
  <rect x="80" y="140" width="510" height="22" fill="#1565c0"/>
  <text x="335" y="145" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Shell Variables</text>
  <text x="110" y="200" font-size="20" fill="#333" font-family="monospace">x=5</text>
  <text x="110" y="238" font-size="20" fill="#333" font-family="monospace">name="hello"</text>
  <text x="110" y="276" font-size="20" fill="#333" font-family="monospace">count=0</text>
  <text x="110" y="340" font-size="18" fill="#555">Private to this shell process.</text>
  <text x="110" y="368" font-size="18" fill="#555">Not passed to child processes.</text>
  <text x="110" y="396" font-size="18" fill="#555">Defined with:  name=value</text>
  <text x="110" y="424" font-size="18" fill="#e53935" font-weight="bold">NOT inherited by children.</text>

  <!-- Environment Variables panel -->
  <rect x="650" y="110" width="550" height="340" rx="10" fill="url(#grad-surface)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <rect x="650" y="110" width="550" height="52" rx="10" fill="#2e7d32"/>
  <rect x="650" y="140" width="550" height="22" fill="#1b5e20"/>
  <text x="925" y="145" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Environment Variables</text>
  <text x="680" y="200" font-size="20" fill="#333" font-family="monospace">PATH=...</text>
  <text x="680" y="238" font-size="20" fill="#333" font-family="monospace">HOME=/home/u</text>
  <text x="680" y="276" font-size="20" fill="#333" font-family="monospace">USER=mark</text>
  <text x="680" y="340" font-size="18" fill="#555">Passed to all child processes.</text>
  <text x="680" y="368" font-size="18" fill="#555">Defined with:  export name=value</text>
  <text x="680" y="396" font-size="18" fill="#555">Or:  declare -x name=value</text>
  <text x="680" y="424" font-size="18" fill="#2e7d32" font-weight="bold">Inherited by all children.</text>

  <!-- Divider -->
  <line x1="635" y1="130" x2="635" y2="430" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Summary box -->
  <rect x="80" y="490" width="1120" height="80" rx="10" fill="#fff9c4" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="530" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">Shell vars: local to current shell — not passed to children</text>
  <text x="640" y="558" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">Environment vars: exported — inherited by all child processes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 320" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Two Kinds of Variables in Bash</text>
  <rect x="30" y="40" width="590" height="260" rx="5" fill="#f0f4ff" stroke="#4a90e2" stroke-width="2"/>
  <text x="325" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Shell Process</text>
  <!-- Shell Variables -->
  <rect x="60" y="80" width="240" height="120" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="180" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Shell Variables</text>
  <text x="80" y="125" font-size="11" fill="#333" font-family="monospace">x=5</text>
  <text x="80" y="145" font-size="11" fill="#333" font-family="monospace">name="hello"</text>
  <text x="80" y="165" font-size="11" fill="#333" font-family="monospace">count=0</text>
  <text x="80" y="185" font-size="10" fill="#666">Private to this shell process</text>
  <!-- Environment Variables -->
  <rect x="340" y="80" width="250" height="120" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="465" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Environment Variables</text>
  <text x="360" y="125" font-size="11" fill="#333" font-family="monospace">PATH=...</text>
  <text x="360" y="145" font-size="11" fill="#333" font-family="monospace">HOME=/home/u</text>
  <text x="360" y="165" font-size="11" fill="#333" font-family="monospace">USER=mark</text>
  <text x="360" y="185" font-size="10" fill="#666">Inherited by child processes</text>
  <!-- Divider arrow -->
  <line x1="305" y1="120" x2="335" y2="120" stroke="#999" stroke-width="1" stroke-dasharray="4"/>
  <!-- Summary -->
  <rect x="60" y="215" width="530" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="325" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Shell vars: local to current shell, not passed to children</text>
  <text x="325" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Environment vars: exported, inherited by all child processes</text>
</svg>
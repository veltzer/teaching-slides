<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="56.25" text-anchor="middle" font-size="31.5077" font-weight="bold" fill="#333">Two Kinds of Variables in Bash</text>
  <rect x="59.0769" y="90" width="1161.8462" height="585" rx="9.8462" fill="#f0f4ff" stroke="#4a90e2" stroke-width="3.9385" />
  <text x="640" y="146.25" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#4a90e2">Shell Process</text>
  <rect x="118.1538" y="180" width="472.6154" height="270" rx="9.8462" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9538" />
  <text x="354.4615" y="229.5" text-anchor="middle" font-size="23.6308" font-weight="bold" fill="#4a90e2">Shell Variables</text>
  <text x="157.5385" y="281.25" font-size="21.6615" fill="#333" font-family="monospace">x=5</text>
  <text x="157.5385" y="326.25" font-size="21.6615" fill="#333" font-family="monospace">name="hello"</text>
  <text x="157.5385" y="371.25" font-size="21.6615" fill="#333" font-family="monospace">count=0</text>
  <text x="157.5385" y="416.25" font-size="19.6923" fill="#666">Private to this shell process</text>
  <rect x="669.5385" y="180" width="492.3077" height="270" rx="9.8462" fill="#d4edda" stroke="#28a745" stroke-width="2.9538" />
  <text x="915.6923" y="229.5" text-anchor="middle" font-size="23.6308" font-weight="bold" fill="#28a745">Environment Variables</text>
  <text x="708.9231" y="281.25" font-size="21.6615" fill="#333" font-family="monospace">PATH=...</text>
  <text x="708.9231" y="326.25" font-size="21.6615" fill="#333" font-family="monospace">HOME=/home/u</text>
  <text x="708.9231" y="371.25" font-size="21.6615" fill="#333" font-family="monospace">USER=mark</text>
  <text x="708.9231" y="416.25" font-size="19.6923" fill="#666">Inherited by child processes</text>
  <line x1="600.6154" y1="270" x2="659.6923" y2="270" stroke="#999" stroke-width="1.9692" stroke-dasharray="7.8769" />
  <rect x="118.1538" y="483.75" width="1043.6923" height="123.75" rx="9.8462" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9538" />
  <text x="640" y="535.5" text-anchor="middle" font-size="21.6615" fill="#333" font-weight="bold">Shell vars: local to current shell, not passed to children</text>
  <text x="640" y="580.5" text-anchor="middle" font-size="21.6615" fill="#333" font-weight="bold">Environment vars: exported, inherited by all child processes</text>
</svg>
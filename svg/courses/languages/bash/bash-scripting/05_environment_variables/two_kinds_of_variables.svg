<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="35.5556" y="26.6667" width="1066.6667" height="488.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="72.8889" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--primary-accent)">Shell Process</text>
  <rect x="71.1111" y="97.7778" width="453.3333" height="302.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="71.1111" y="97.7778" width="453.3333" height="46.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="71.1111" y="124.4444" width="453.3333" height="19.5556" fill="var(--primary-accent)" rx="6"/>
  <text x="297.7778" y="128.8889" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">Shell Variables</text>
  <text x="97.7778" y="177.7778" font-size="17.7778" fill="var(--text)" font-family="monospace">x=5</text>
  <text x="97.7778" y="211.5556" font-size="17.7778" fill="var(--text)" font-family="monospace">name="hello"</text>
  <text x="97.7778" y="245.3333" font-size="17.7778" fill="var(--text)" font-family="monospace">count=0</text>
  <text x="97.7778" y="302.2222" font-size="16" fill="var(--text-muted)">Private to this shell process.</text>
  <text x="97.7778" y="327.1111" font-size="16" fill="var(--text-muted)">Not passed to child processes.</text>
  <text x="97.7778" y="352" font-size="16" fill="var(--text-muted)">Defined with:  name=value</text>
  <text x="97.7778" y="376.8889" font-size="16" fill="var(--danger-accent)" font-weight="bold">NOT inherited by children.</text>
  <rect x="577.7778" y="97.7778" width="488.8889" height="302.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="577.7778" y="97.7778" width="488.8889" height="46.2222" rx="6" fill="var(--ok-accent)" />
  <rect x="577.7778" y="124.4444" width="488.8889" height="19.5556" fill="var(--ok-accent)" rx="6"/>
  <text x="822.2222" y="128.8889" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">Environment Variables</text>
  <text x="604.4444" y="177.7778" font-size="17.7778" fill="var(--text)" font-family="monospace">PATH=...</text>
  <text x="604.4444" y="211.5556" font-size="17.7778" fill="var(--text)" font-family="monospace">HOME=/home/u</text>
  <text x="604.4444" y="245.3333" font-size="17.7778" fill="var(--text)" font-family="monospace">USER=mark</text>
  <text x="604.4444" y="302.2222" font-size="16" fill="var(--text-muted)">Passed to all child processes.</text>
  <text x="604.4444" y="327.1111" font-size="16" fill="var(--text-muted)">Defined with:  export name=value</text>
  <text x="604.4444" y="352" font-size="16" fill="var(--text-muted)">Or:  declare -x name=value</text>
  <text x="604.4444" y="376.8889" font-size="16" fill="var(--ok-accent)" font-weight="bold">Inherited by all children.</text>
  <line x1="564.4444" y1="115.5556" x2="564.4444" y2="382.2222" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" />
  <rect x="71.1111" y="435.5556" width="995.5556" height="71.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="471.1111" text-anchor="middle" font-size="17.7778" fill="var(--text)" font-weight="bold">Shell vars: local to current shell — not passed to children</text>
  <text x="568.8889" y="496" text-anchor="middle" font-size="17.7778" fill="var(--text)" font-weight="bold">Environment vars: exported — inherited by all child processes</text>
</svg>
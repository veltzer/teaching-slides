<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="513.924163" rx="6.614139" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="85.886102" text-anchor="middle" font-size="24.907305" font-weight="bold" fill="var(--primary-accent)">Parent Shell</text>
  <text x="80.000107" y="129.93666" font-size="21.075513" fill="var(--text)" font-family="monospace">x=1</text>
  <text x="300.000107" y="129.93666" font-size="17.243612" fill="var(--text-muted)">shell variable — private to this shell</text>
  <text x="80.000107" y="164.810294" font-size="21.075513" fill="var(--text)" font-family="monospace">export y=2</text>
  <text x="300.000107" y="164.810294" font-size="17.243612" fill="var(--text-muted)">environment variable — will be inherited</text>
  <rect x="120" y="196.012725" width="1000.000107" height="266.139234" rx="6.614139" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="620" y="240.063283" text-anchor="middle" font-size="22.991519" font-weight="bold" fill="var(--ok-accent)">Child Process</text>
  <rect x="160.000107" y="258.417701" width="380.000107" height="51.392394" rx="6.614139" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="350" y="289.620132" text-anchor="middle" font-size="19.159618" fill="var(--danger-accent)" font-weight="bold">x is NOT visible</text>
  <rect x="580.000107" y="258.417701" width="380.000107" height="51.392394" rx="6.614139" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="770" y="289.620132" text-anchor="middle" font-size="19.159618" fill="var(--ok-accent)" font-weight="bold">y=2  (inherited)</text>
  <text x="160.000107" y="352.02545" font-size="17.243612" fill="var(--text-muted)">Changes to y inside child do NOT affect parent.</text>
  <text x="160.000107" y="379.557134" font-size="17.243612" fill="var(--text-muted)">Child receives a copy, not a reference.</text>
  <text x="160.000107" y="407.088704" font-size="17.243612" fill="var(--text-muted)">Child can export new vars — only its own children will see them.</text>
  <text x="160.000107" y="434.620274" font-size="17.243612" fill="var(--text-muted)">Variables never flow upward (child cannot modify parent).</text>
  <text x="80.000107" y="508.037947" font-size="19.159618" fill="var(--text)" font-family="monospace">After child exits:  y is still 2 in parent  (unchanged)</text>
  <rect x="40" y="572.278467" width="1200" height="47.721533" rx="6.614139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="602.563468" text-anchor="middle" font-size="19.159618" fill="var(--text-muted)">Environment variables flow <tspan font-weight="bold">down</tspan> (parent to child), never up</text>
</svg>
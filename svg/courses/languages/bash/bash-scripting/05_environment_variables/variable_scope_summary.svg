<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="52.9412" text-anchor="middle" font-size="33.8824" font-weight="bold" fill="#333">Variable Scope: Parent vs Child</text>
  <rect x="85.3333" y="95.2941" width="1109.3333" height="550.5882" rx="10.5882" fill="#e8f4f8" stroke="#4a90e2" stroke-width="4.2353" />
  <text x="640" y="148.2353" text-anchor="middle" font-size="27.5294" font-weight="bold" fill="#4a90e2">Parent Shell</text>
  <text x="128" y="201.1765" font-size="23.2941" fill="#333" font-family="monospace">x=1 (shell var)</text>
  <text x="128" y="243.5294" font-size="23.2941" fill="#333" font-family="monospace">export y=2 (env var)</text>
  <rect x="170.6667" y="285.8824" width="853.3333" height="254.1176" rx="10.5882" fill="#d4edda" stroke="#28a745" stroke-width="4.2353" />
  <text x="597.3333" y="334.5882" text-anchor="middle" font-size="25.4118" font-weight="bold" fill="#28a745">Child Process</text>
  <rect x="213.3333" y="355.7647" width="362.6667" height="52.9412" rx="6.3529" fill="#f8d7da" stroke="#dc3545" stroke-width="2.1176" />
  <text x="394.6667" y="391.7647" text-anchor="middle" font-size="21.1765" fill="#dc3545">x is NOT visible</text>
  <rect x="618.6667" y="355.7647" width="362.6667" height="52.9412" rx="6.3529" fill="#d4edda" stroke="#28a745" stroke-width="2.1176" />
  <text x="800" y="391.7647" text-anchor="middle" font-size="21.1765" fill="#28a745">y=2 (inherited)</text>
  <text x="213.3333" y="461.6471" font-size="21.1765" fill="#666">Changes to y do NOT affect parent</text>
  <text x="213.3333" y="504" font-size="21.1765" fill="#666">Child gets a copy, not a reference</text>
  <text x="128" y="592.9412" font-size="23.2941" fill="#333">After child exits: y is still 2 in parent (unchanged)</text>
  <text x="640" y="688.2353" text-anchor="middle" font-size="25.4118" fill="#666">Environment variables flow down (parent to child), never up</text>
</svg>
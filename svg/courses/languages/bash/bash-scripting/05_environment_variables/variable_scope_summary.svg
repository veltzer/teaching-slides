<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="513.924163" rx="6.614139" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85.886102" text-anchor="middle" font-size="24.907305" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Parent Shell</text>
  <text x="80.000107" y="129.93666" font-size="21.075513" fill="var(--text)" font-family="Courier New, monospace">x=1</text>
  <text x="300.000107" y="129.93666" font-size="17.243612" fill="var(--text-muted)" font-family="Arial, sans-serif">shell variable — private to this shell</text>
  <text x="80.000107" y="164.810294" font-size="21.075513" fill="var(--text)" font-family="Courier New, monospace">export y=2</text>
  <text x="300.000107" y="164.810294" font-size="17.243612" fill="var(--text-muted)" font-family="Arial, sans-serif">environment variable — will be inherited</text>
  <rect x="120" y="196.012725" width="1000.000107" height="266.139234" rx="6.614139" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="240.063283" text-anchor="middle" font-size="22.991519" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Child Process</text>
  <rect x="160.000107" y="258.417701" width="380.000107" height="51.392394" rx="6.614139" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="289.620132" text-anchor="middle" font-size="19.159618" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">x is NOT visible</text>
  <rect x="580.000107" y="258.417701" width="380.000107" height="51.392394" rx="6.614139" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="289.620132" text-anchor="middle" font-size="19.159618" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">y=2  (inherited)</text>
  <text x="160.000107" y="352.02545" font-size="17.243612" fill="var(--text-muted)" font-family="Arial, sans-serif">Changes to y inside child do NOT affect parent.</text>
  <text x="160.000107" y="379.557134" font-size="17.243612" fill="var(--text-muted)" font-family="Arial, sans-serif">Child receives a copy, not a reference.</text>
  <text x="160.000107" y="407.088704" font-size="17.243612" fill="var(--text-muted)" font-family="Arial, sans-serif">Child can export new vars — only its own children will see them.</text>
  <text x="160.000107" y="434.620274" font-size="17.243612" fill="var(--text-muted)" font-family="Arial, sans-serif">Variables never flow upward (child cannot modify parent).</text>
  <text x="80.000107" y="508.037947" font-size="19.159618" fill="var(--text)" font-family="Courier New, monospace">After child exits:  y is still 2 in parent  (unchanged)</text>
  <rect x="40" y="572.278467" width="1200" height="47.721533" rx="6.614139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="602.563468" text-anchor="middle" font-size="19.159618" fill="var(--text-muted)" font-family="Arial, sans-serif">Environment variables flow <tspan font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">down</tspan> (parent to child), never up</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <rect x="186.41" y="164.9559" width="1019.6032" height="369.3112" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="696.2116" y="197.9301" text-anchor="middle" font-size="19.4625" font-weight="bold" fill="var(--primary-accent)">Parent Shell</text>
  <text x="220.3968" y="229.5853" font-size="16.4683" fill="var(--text)" font-family="monospace">x=1</text>
  <text x="407.3241" y="229.5853" font-size="13.4741" fill="var(--text-muted)">shell variable — private to this shell</text>
  <text x="220.3968" y="254.6458" font-size="16.4683" fill="var(--text)" font-family="monospace">export y=2</text>
  <text x="407.3241" y="254.6458" font-size="13.4741" fill="var(--text-muted)">environment variable — will be inherited</text>
  <rect x="254.3835" y="277.0682" width="849.6694" height="191.2504" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="679.2182" y="308.7234" text-anchor="middle" font-size="17.9655" font-weight="bold" fill="var(--ok-accent)">Child Process</text>
  <rect x="288.3704" y="321.9131" width="322.8744" height="36.9311" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="449.8075" y="344.3355" text-anchor="middle" font-size="14.9713" fill="var(--danger-accent)" font-weight="bold">x is NOT visible</text>
  <rect x="645.2315" y="321.9131" width="322.8744" height="36.9311" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="806.6686" y="344.3355" text-anchor="middle" font-size="14.9713" fill="var(--ok-accent)" font-weight="bold">y=2  (inherited)</text>
  <text x="288.3704" y="389.1806" font-size="13.4741" fill="var(--text-muted)">Changes to y inside child do NOT affect parent.</text>
  <text x="288.3704" y="408.9651" font-size="13.4741" fill="var(--text-muted)">Child receives a copy, not a reference.</text>
  <text x="288.3704" y="428.7496" font-size="13.4741" fill="var(--text-muted)">Child can export new vars — only its own children will see them.</text>
  <text x="288.3704" y="448.5341" font-size="13.4741" fill="var(--text-muted)">Variables never flow upward (child cannot modify parent).</text>
  <text x="220.3968" y="501.2928" font-size="14.9713" fill="var(--text)" font-family="monospace">After child exits:  y is still 2 in parent  (unchanged)</text>
  <rect x="186.41" y="547.4567" width="1019.6032" height="34.2932" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="696.2116" y="569.2198" text-anchor="middle" font-size="14.9713" fill="var(--text-muted)">Environment variables flow <tspan font-weight="bold">down</tspan> (parent to child), never up</text>
</svg>
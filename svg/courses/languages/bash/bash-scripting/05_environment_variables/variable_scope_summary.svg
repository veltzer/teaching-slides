<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-3.5556%" y="-7.1111%" width="96%" height="110.2222%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="35.5556" y="26.6667" width="1066.6667" height="497.7778" rx="10.6667" fill="#e8f4f8" stroke="#1e88e5" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="71.1111" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#1565c0">Parent Shell</ns0:text>
  <ns0:text x="71.1111" y="113.7778" font-size="19.5556" fill="#333" font-family="monospace">x=1</ns0:text>
  <ns0:text x="266.6667" y="113.7778" font-size="16" fill="#555">shell variable — private to this shell</ns0:text>
  <ns0:text x="71.1111" y="147.5556" font-size="19.5556" fill="#333" font-family="monospace">export y=2</ns0:text>
  <ns0:text x="266.6667" y="147.5556" font-size="16" fill="#555">environment variable — will be inherited</ns0:text>
  <ns0:rect x="106.6667" y="177.7778" width="888.8889" height="257.7778" rx="8.8889" fill="#d4edda" stroke="#2e7d32" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="551.1111" y="220.4444" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#2e7d32">Child Process</ns0:text>
  <ns0:rect x="142.2222" y="238.2222" width="337.7778" height="49.7778" rx="7.1111" fill="#ffebee" stroke="#e53935" stroke-width="1.7778" />
  <ns0:text x="311.1111" y="268.4444" text-anchor="middle" font-size="17.7778" fill="#c62828" font-weight="bold">x is NOT visible</ns0:text>
  <ns0:rect x="515.5556" y="238.2222" width="337.7778" height="49.7778" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:text x="684.4444" y="268.4444" text-anchor="middle" font-size="17.7778" fill="#1b5e20" font-weight="bold">y=2  (inherited)</ns0:text>
  <ns0:text x="142.2222" y="328.8889" font-size="16" fill="#555">Changes to y inside child do NOT affect parent.</ns0:text>
  <ns0:text x="142.2222" y="355.5556" font-size="16" fill="#555">Child receives a copy, not a reference.</ns0:text>
  <ns0:text x="142.2222" y="382.2222" font-size="16" fill="#555">Child can export new vars — only its own children will see them.</ns0:text>
  <ns0:text x="142.2222" y="408.8889" font-size="16" fill="#555">Variables never flow upward (child cannot modify parent).</ns0:text>
  <ns0:text x="71.1111" y="480" font-size="17.7778" fill="#333" font-family="monospace">After child exits:  y is still 2 in parent  (unchanged)</ns0:text>
  <ns0:rect x="35.5556" y="542.2222" width="1066.6667" height="46.2222" rx="7.1111" fill="url(#grad-surface)" stroke="#bbbbbb" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="571.5556" text-anchor="middle" font-size="17.7778" fill="#555">Environment variables flow <ns0:tspan font-weight="bold">down</ns0:tspan> (parent to child), never up</ns0:text>
</ns0:svg>
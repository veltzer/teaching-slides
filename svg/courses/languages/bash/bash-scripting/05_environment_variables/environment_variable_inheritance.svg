<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="18.2857" markerHeight="10.5" refX="18.2857" refY="5.25" orient="auto">
      <polygon points="0,15 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowRed" markerWidth="18.2857" markerHeight="10.5" refX="18.2857" refY="5.25" orient="auto">
      <polygon points="0,15 6.4,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Environment Variable Inheritance</text>
  <rect x="365.7143" y="82.5" width="548.5714" height="180" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="120" text-anchor="middle" font-size="21" font-weight="bold" fill="#333">Parent Shell (bash)</text>
  <text x="402.2857" y="157.5" font-size="18" fill="#555">HOME=/home/user</text>
  <text x="402.2857" y="187.5" font-size="18" fill="#28a745" font-weight="bold">export MY_VAR="hello"</text>
  <text x="402.2857" y="217.5" font-size="18" fill="#dc3545">LOCAL_VAR="secret"</text>
  <line x1="512" y1="262.5" x2="365.7143" y2="360" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrow)" />
  <text x="384" y="315" font-size="16.5" fill="#4a90e2">fork + exec</text>
  <line x1="768" y1="262.5" x2="914.2857" y2="360" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrow)" />
  <text x="804.5714" y="315" font-size="16.5" fill="#4a90e2">fork + exec</text>
  <rect x="73.1429" y="367.5" width="457.1429" height="165" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="301.7143" y="405" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Child Process 1</text>
  <text x="100.5714" y="442.5" font-size="16.5" fill="#555">HOME=/home/user (inherited)</text>
  <text x="100.5714" y="472.5" font-size="16.5" fill="#28a745">MY_VAR="hello" (inherited)</text>
  <text x="100.5714" y="502.5" font-size="16.5" fill="#dc3545">LOCAL_VAR is NOT available</text>
  <rect x="749.7143" y="367.5" width="457.1429" height="165" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="978.2857" y="405" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Child Process 2</text>
  <text x="777.1429" y="442.5" font-size="16.5" fill="#555">HOME=/home/user (inherited)</text>
  <text x="777.1429" y="472.5" font-size="16.5" fill="#28a745">MY_VAR="hello" (inherited)</text>
  <text x="777.1429" y="502.5" font-size="16.5" fill="#dc3545">LOCAL_VAR is NOT available</text>
  <rect x="182.8571" y="585" width="914.2857" height="120" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="640" y="622.5" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Key Rules</text>
  <text x="219.4286" y="652.5" font-size="16.5" fill="#555">- Only exported variables are inherited by child processes</text>
  <text x="219.4286" y="682.5" font-size="16.5" fill="#555">- Changes in child do NOT propagate back to parent</text>
  <rect x="54.8571" y="82.5" width="27.4286" height="22.5" rx="3" fill="#28a745" />
  <text x="95.0857" y="100.5" font-size="16.5" fill="#555">Exported (inherited)</text>
  <rect x="54.8571" y="117" width="27.4286" height="22.5" rx="3" fill="#dc3545" />
  <text x="95.0857" y="135" font-size="16.5" fill="#555">Local (not inherited)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="18.2857" markerHeight="10.08" refX="18.2857" refY="5.04" orient="auto">
      <polygon points="0,14.4 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="43.2" text-anchor="middle" font-size="28.8" font-weight="bold" fill="#333">The Environment Hierarchy</text>
  <rect x="274.2857" y="72" width="731.4286" height="100.8" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.88" />
  <text x="640" y="108" text-anchor="middle" font-size="20.16" font-weight="bold" fill="#333">System-Wide (/etc/environment)</text>
  <text x="640" y="144" text-anchor="middle" font-size="15.84" fill="#555">PATH, LANG - applies to ALL users</text>
  <line x1="640" y1="172.8" x2="640" y2="216" stroke="#4a90e2" stroke-width="2.88" marker-end="url(#arrow)" />
  <rect x="274.2857" y="223.2" width="731.4286" height="100.8" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.88" />
  <text x="640" y="259.2" text-anchor="middle" font-size="20.16" font-weight="bold" fill="#333">Login Shell (/etc/profile, /etc/profile.d/*)</text>
  <text x="640" y="288" text-anchor="middle" font-size="15.84" fill="#555">System-wide shell config for login shells</text>
  <line x1="640" y1="324" x2="640" y2="367.2" stroke="#4a90e2" stroke-width="2.88" marker-end="url(#arrow)" />
  <rect x="274.2857" y="374.4" width="731.4286" height="100.8" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="2.88" />
  <text x="640" y="410.4" text-anchor="middle" font-size="20.16" font-weight="bold" fill="#333">User Login (~/.bash_profile, ~/.profile)</text>
  <text x="640" y="439.2" text-anchor="middle" font-size="15.84" fill="#555">Per-user config, runs once at login</text>
  <line x1="640" y1="475.2" x2="640" y2="518.4" stroke="#4a90e2" stroke-width="2.88" marker-end="url(#arrow)" />
  <rect x="274.2857" y="525.6" width="731.4286" height="100.8" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="2.88" />
  <text x="640" y="561.6" text-anchor="middle" font-size="20.16" font-weight="bold" fill="#333">Interactive Shell (~/.bashrc)</text>
  <text x="640" y="590.4" text-anchor="middle" font-size="15.84" fill="#555">Per-user config, runs for each new shell</text>
  <rect x="1078.8571" y="86.4" width="164.5714" height="36" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.44" />
  <text x="1161.1429" y="110.88" text-anchor="middle" font-size="14.4" fill="#333">Broadest</text>
  <rect x="1078.8571" y="540" width="164.5714" height="36" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="1.44" />
  <text x="1161.1429" y="564.48" text-anchor="middle" font-size="14.4" fill="#333">Narrowest</text>
  <line x1="1161.1429" y1="122.4" x2="1161.1429" y2="540" stroke="#999" stroke-width="1.44" stroke-dasharray="7.2 7.2" />
  <rect x="182.8571" y="655.2" width="914.2857" height="50.4" rx="7.2" fill="#fff3cd" stroke="#ffc107" stroke-width="2.88" />
  <text x="640" y="686.88" text-anchor="middle" font-size="17.28" fill="#333">Later files override earlier ones. More specific scope wins.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="17.7778" width="497.7778" height="515.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="275.5556" y="46.2222" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--text-muted)">Sequential (default)</text>
  <line x1="71.1111" y1="71.1111" x2="71.1111" y2="480" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="60.4444" y="487.1111" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">time</text>
  <rect x="88.8889" y="80" width="408.8889" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="293.3333" y="120.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">task A  (5s)</text>
  <rect x="88.8889" y="160" width="408.8889" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="293.3333" y="200.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">task B  (5s)</text>
  <rect x="88.8889" y="240" width="408.8889" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="293.3333" y="280.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">task C  (5s)</text>
  <rect x="88.8889" y="320" width="408.8889" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="293.3333" y="360.8889" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">task D  (5s)</text>
  <rect x="88.8889" y="405.3333" width="408.8889" height="49.7778" rx="6" fill="var(--text)" />
  <text x="293.3333" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--bg)">Total: ~20 seconds</text>
  <text x="88.8889" y="469.3333" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">for item in a b c d; do process "$item"; done</text>
  <rect x="613.3333" y="17.7778" width="497.7778" height="515.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="862.2222" y="46.2222" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">Parallel (background jobs)</text>
  <line x1="657.7778" y1="71.1111" x2="657.7778" y2="248.8889" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <text x="647.1111" y="256" font-family="sans-serif" font-size="11.5556" fill="var(--primary-accent)">time</text>
  <rect x="675.5556" y="80" width="177.7778" height="142.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="764.4444" y="158.2222" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--bg)">task A</text>
  <rect x="862.2222" y="80" width="177.7778" height="142.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="951.1111" y="158.2222" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--bg)">task B</text>
  <rect x="675.5556" y="80" width="177.7778" height="142.2222" rx="6" fill="none" />
  <rect x="862.2222" y="80" width="177.7778" height="142.2222" rx="6" fill="none" />
  <rect x="675.5556" y="88.8889" width="177.7778" height="124.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="764.4444" y="158.2222" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--bg)">task A</text>
  <rect x="862.2222" y="88.8889" width="177.7778" height="124.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="951.1111" y="158.2222" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--bg)">task B</text>
  <rect x="675.5556" y="80" width="80" height="142.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="715.5556" y="158.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--bg)">A</text>
  <rect x="764.4444" y="80" width="80" height="142.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="804.4444" y="158.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--bg)">B</text>
  <rect x="853.3333" y="80" width="80" height="142.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="893.3333" y="158.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--bg)">C</text>
  <rect x="942.2222" y="80" width="80" height="142.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="982.2222" y="158.2222" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--bg)">D</text>
  <line x1="657.7778" y1="231.1111" x2="1066.6667" y2="231.1111" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <text x="862.2222" y="253.3333" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">all finish ~same time</text>
  <rect x="675.5556" y="266.6667" width="346.6667" height="49.7778" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="848.8889" y="297.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--bg)">Total: ~5 seconds</text>
  <rect x="631.1111" y="337.7778" width="462.2222" height="160" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="862.2222" y="360.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">How to run in parallel</text>
  <text x="648.8889" y="382.2222" font-family="monospace" font-size="11.5556" fill="var(--text)"># &amp; sends to background; wait collects</text>
  <text x="648.8889" y="401.7778" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">for item in a b c d; do</text>
  <text x="648.8889" y="419.5556" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">    process "$item" &amp;</text>
  <text x="648.8889" y="437.3333" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">done</text>
  <text x="648.8889" y="455.1111" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">wait   # wait for ALL background jobs</text>
  <text x="648.8889" y="476.4444" font-family="monospace" font-size="11.5556" fill="var(--text-faint)"># xargs -P4 for bounded parallelism</text>
  <rect x="26.6667" y="549.3333" width="1084.4444" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="572.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">Use <tspan font-family="monospace">$!</tspan> to capture PIDs · <tspan font-family="monospace">wait $pid</tspan> to get individual exit codes · <tspan font-family="monospace">xargs -P N</tspan> to limit concurrency</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="550.819624" height="525.625042" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="315.409812" y="69.000135" text-anchor="middle" font-family="sans-serif" font-size="18.882785" font-weight="bold" fill="var(--text-muted)">Sequential (default)</text>
  <line x1="89.180428" y1="94.37507" x2="89.180428" y2="511.249972" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="77.377046" y="518.500034" font-family="sans-serif" font-size="12.612679" fill="var(--text-faint)">time</text>
  <rect x="108.852453" y="103.43762" width="452.458977" height="72.499944" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="335.081941" y="145.125166" text-anchor="middle" font-family="monospace" font-size="16.050248" fill="var(--text-muted)">task A  (5s)</text>
  <rect x="108.852453" y="185" width="452.458977" height="72.499944" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="335.081941" y="226.687546" text-anchor="middle" font-family="monospace" font-size="16.050248" fill="var(--text-muted)">task B  (5s)</text>
  <rect x="108.852453" y="266.562605" width="452.458977" height="72.499944" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="335.081941" y="308.250152" text-anchor="middle" font-family="monospace" font-size="16.050248" fill="var(--text-muted)">task C  (5s)</text>
  <rect x="108.852453" y="348.125098" width="452.458977" height="72.499944" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="335.081941" y="389.812645" text-anchor="middle" font-family="monospace" font-size="16.050248" fill="var(--text-muted)">task D  (5s)</text>
  <rect x="108.852453" y="435.124941" width="452.458977" height="50.749983" rx="6.518573" fill="var(--text)" />
  <text x="335.081941" y="465.937676" text-anchor="middle" font-family="sans-serif" font-size="16.050248" fill="var(--bg)">Total: ~20 seconds</text>
  <text x="108.852453" y="500.375048" font-family="monospace" font-size="13.217711" fill="var(--text-muted)">for item in a b c d; do process "$item"; done</text>
  <rect x="689.180376" y="40" width="550.819624" height="525.625042" rx="6.518573" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="964.590188" y="69.000135" text-anchor="middle" font-family="sans-serif" font-size="18.882785" font-weight="bold" fill="var(--primary-accent)">Parallel (background jobs)</text>
  <line x1="738.360595" y1="94.37507" x2="738.360595" y2="275.625155" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <text x="726.557212" y="282.875104" font-family="sans-serif" font-size="12.612679" fill="var(--primary-accent)">time</text>
  <rect x="758.032724" y="103.43762" width="196.721189" height="145" rx="6.518573" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="856.393371" y="183.187625" text-anchor="middle" font-family="monospace" font-size="15.106033" fill="var(--bg)">task A</text>
  <rect x="964.590188" y="103.43762" width="196.721189" height="145" rx="6.518573" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1062.95073" y="183.187625" text-anchor="middle" font-family="monospace" font-size="15.106033" fill="var(--bg)">task B</text>
  <rect x="758.032724" y="103.43762" width="196.721189" height="145" rx="6.518573" fill="none" />
  <rect x="964.590188" y="103.43762" width="196.721189" height="145" rx="6.518573" fill="none" />
  <rect x="758.032724" y="112.500056" width="196.721189" height="126.874902" rx="6.518573" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="856.393371" y="183.187625" text-anchor="middle" font-family="monospace" font-size="15.106033" fill="var(--bg)">task A</text>
  <rect x="964.590188" y="112.500056" width="196.721189" height="126.874902" rx="6.518573" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1062.95073" y="183.187625" text-anchor="middle" font-family="monospace" font-size="15.106033" fill="var(--bg)">task B</text>
  <rect x="758.032724" y="103.43762" width="88.524582" height="145" rx="6.518573" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="802.295015" y="183.187625" text-anchor="middle" font-family="monospace" font-size="13.217711" fill="var(--bg)">A</text>
  <rect x="856.393371" y="103.43762" width="88.524582" height="145" rx="6.518573" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="900.655662" y="183.187625" text-anchor="middle" font-family="monospace" font-size="13.217711" fill="var(--bg)">B</text>
  <rect x="954.753913" y="103.43762" width="88.524582" height="145" rx="6.518573" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="999.016205" y="183.187625" text-anchor="middle" font-family="monospace" font-size="13.217711" fill="var(--bg)">C</text>
  <rect x="1053.114666" y="103.43762" width="88.524582" height="145" rx="6.518573" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1097.376957" y="183.187625" text-anchor="middle" font-family="monospace" font-size="13.217711" fill="var(--bg)">D</text>
  <line x1="738.360595" y1="257.499944" x2="1190.819676" y2="257.499944" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <text x="964.590188" y="280.156204" text-anchor="middle" font-family="sans-serif" font-size="13.217711" fill="var(--primary-accent)">all finish ~same time</text>
  <rect x="758.032724" y="293.750141" width="383.606524" height="50.749983" rx="6.518573" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="949.836091" y="325.468838" text-anchor="middle" font-family="sans-serif" font-size="16.050248" font-weight="bold" fill="var(--bg)">Total: ~5 seconds</text>
  <rect x="708.852401" y="366.250084" width="511.47547" height="163.125098" rx="6.518573" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="964.590188" y="389.812645" text-anchor="middle" font-family="sans-serif" font-size="14.162143" font-weight="bold" fill="var(--primary-accent)">How to run in parallel</text>
  <text x="728.524635" y="411.562605" font-family="monospace" font-size="12.612679" fill="var(--text)"># &amp; sends to background; wait collects</text>
  <text x="728.524635" y="431.500079" font-family="monospace" font-size="13.217711" fill="var(--primary-accent)">for item in a b c d; do</text>
  <text x="728.524635" y="449.625177" font-family="monospace" font-size="13.217711" fill="var(--primary-accent)">    process "$item" &amp;</text>
  <text x="728.524635" y="467.750051" font-family="monospace" font-size="13.217711" fill="var(--primary-accent)">done</text>
  <text x="728.524635" y="485.874924" font-family="monospace" font-size="13.217711" fill="var(--primary-accent)">wait   # wait for ALL background jobs</text>
  <text x="728.524635" y="507.624885" font-family="monospace" font-size="12.612679" fill="var(--text-faint)"># xargs -P4 for bounded parallelism</text>
  <rect x="40" y="581.937541" width="1199.999895" height="38.062459" rx="6.518573" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999948" y="605.499989" text-anchor="middle" font-family="sans-serif" font-size="15.106033" fill="var(--primary-accent)">Use <tspan font-family="monospace">$!</tspan> to capture PIDs · <tspan font-family="monospace">wait $pid</tspan> to get individual exit codes · <tspan font-family="monospace">xargs -P N</tspan> to limit concurrency</text>
</svg>
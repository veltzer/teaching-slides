<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6.6276" x="40" y="40"/>
  <rect x="68.1249" y="56.111" width="525" height="467.2223" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="330.6249" y="81.8889" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--text-muted)">Sequential (default)</text>
  <line x1="115" y1="104.4444" x2="115" y2="474.9999" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="103.7499" y="481.4444" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">time</text>
  <rect x="133.7499" y="112.5" width="431.25" height="64.4444" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="349.3749" y="149.5556" text-anchor="middle" font-family="monospace" font-size="14.7734" fill="var(--text-muted)">task A  (5s)</text>
  <rect x="133.7499" y="184.9999" width="431.25" height="64.4444" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="349.3749" y="222.0555" text-anchor="middle" font-family="monospace" font-size="14.7734" fill="var(--text-muted)">task B  (5s)</text>
  <rect x="133.7499" y="257.5" width="431.25" height="64.4444" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="349.3749" y="294.5556" text-anchor="middle" font-family="monospace" font-size="14.7734" fill="var(--text-muted)">task C  (5s)</text>
  <rect x="133.7499" y="330" width="431.25" height="64.4444" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="349.3749" y="367.0556" text-anchor="middle" font-family="monospace" font-size="14.7734" fill="var(--text-muted)">task D  (5s)</text>
  <rect x="133.7499" y="407.3332" width="431.25" height="45.1111" rx="6.6276" fill="var(--text)" />
  <text x="349.3749" y="434.7223" text-anchor="middle" font-family="sans-serif" font-size="14.7734" fill="var(--bg)">Total: ~20 seconds</text>
  <text x="133.7499" y="465.3333" font-family="monospace" font-size="12.1662" fill="var(--text-muted)">for item in a b c d; do process "$item"; done</text>
  <rect x="686.875" y="56.111" width="525" height="467.2223" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="949.375" y="81.8889" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">Parallel (background jobs)</text>
  <line x1="733.7499" y1="104.4444" x2="733.7499" y2="265.5556" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <text x="722.4998" y="272" font-family="sans-serif" font-size="11.6093" fill="var(--primary-accent)">time</text>
  <rect x="752.4999" y="112.5" width="187.4999" height="128.8889" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="846.2499" y="183.3889" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--bg)">task A</text>
  <rect x="949.375" y="112.5" width="187.4999" height="128.8889" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1043.1249" y="183.3889" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--bg)">task B</text>
  <rect x="752.4999" y="112.5" width="187.4999" height="128.8889" rx="6.6276" fill="none" />
  <rect x="949.375" y="112.5" width="187.4999" height="128.8889" rx="6.6276" fill="none" />
  <rect x="752.4999" y="120.5555" width="187.4999" height="112.7777" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="846.2499" y="183.3889" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--bg)">task A</text>
  <rect x="949.375" y="120.5555" width="187.4999" height="112.7777" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1043.1249" y="183.3889" text-anchor="middle" font-family="monospace" font-size="13.9043" fill="var(--bg)">task B</text>
  <rect x="752.4999" y="112.5" width="84.375" height="128.8889" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="794.6874" y="183.3889" text-anchor="middle" font-family="monospace" font-size="12.1662" fill="var(--bg)">A</text>
  <rect x="846.2499" y="112.5" width="84.375" height="128.8889" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="888.4374" y="183.3889" text-anchor="middle" font-family="monospace" font-size="12.1662" fill="var(--bg)">B</text>
  <rect x="939.9998" y="112.5" width="84.375" height="128.8889" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="982.1873" y="183.3889" text-anchor="middle" font-family="monospace" font-size="12.1662" fill="var(--bg)">C</text>
  <rect x="1033.7499" y="112.5" width="84.375" height="128.8889" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1075.9374" y="183.3889" text-anchor="middle" font-family="monospace" font-size="12.1662" fill="var(--bg)">D</text>
  <line x1="733.7499" y1="249.4443" x2="1165" y2="249.4443" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <text x="949.375" y="269.5832" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--primary-accent)">all finish ~same time</text>
  <rect x="752.4999" y="281.6667" width="365.625" height="45.1111" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="935.3125" y="309.8611" text-anchor="middle" font-family="sans-serif" font-size="14.7734" font-weight="bold" fill="var(--bg)">Total: ~5 seconds</text>
  <rect x="705.6249" y="346.1111" width="487.5001" height="145.0001" rx="6.6276" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="949.375" y="367.0556" text-anchor="middle" font-family="sans-serif" font-size="13.0355" font-weight="bold" fill="var(--primary-accent)">How to run in parallel</text>
  <text x="724.375" y="386.3889" font-family="monospace" font-size="11.6093" fill="var(--text)"># &amp; sends to background; wait collects</text>
  <text x="724.375" y="404.1111" font-family="monospace" font-size="12.1662" fill="var(--primary-accent)">for item in a b c d; do</text>
  <text x="724.375" y="420.2223" font-family="monospace" font-size="12.1662" fill="var(--primary-accent)">    process "$item" &amp;</text>
  <text x="724.375" y="436.3333" font-family="monospace" font-size="12.1662" fill="var(--primary-accent)">done</text>
  <text x="724.375" y="452.4443" font-family="monospace" font-size="12.1662" fill="var(--primary-accent)">wait   # wait for ALL background jobs</text>
  <text x="724.375" y="471.7776" font-family="monospace" font-size="11.6093" fill="var(--text-faint)"># xargs -P4 for bounded parallelism</text>
  <rect x="68.1249" y="537.8333" width="1143.75" height="33.8333" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="558.7777" text-anchor="middle" font-family="sans-serif" font-size="13.9043" fill="var(--primary-accent)">Use <tspan font-family="monospace">$!</tspan> to capture PIDs · <tspan font-family="monospace">wait $pid</tspan> to get individual exit codes · <tspan font-family="monospace">xargs -P N</tspan> to limit concurrency</text>
</svg>
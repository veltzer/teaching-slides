<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="550.819624" height="525.625042" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="315.409812" y="69.000135" text-anchor="middle" font-size="18.882785" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Sequential (default)</text>
  <line x1="89.180428" y1="94.37507" x2="89.180428" y2="511.249972" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="77.377046" y="518.500034" font-size="12.612679" fill="var(--text-faint)" font-family="Arial, sans-serif">time</text>
  <rect x="108.852453" y="103.43762" width="452.458977" height="72.499944" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="335.081941" y="145.125166" text-anchor="middle" font-size="16.050248" fill="var(--text-muted)" font-family="Courier New, monospace">task A  (5s)</text>
  <rect x="108.852453" y="185" width="452.458977" height="72.499944" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="335.081941" y="226.687546" text-anchor="middle" font-size="16.050248" fill="var(--text-muted)" font-family="Courier New, monospace">task B  (5s)</text>
  <rect x="108.852453" y="266.562605" width="452.458977" height="72.499944" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="335.081941" y="308.250152" text-anchor="middle" font-size="16.050248" fill="var(--text-muted)" font-family="Courier New, monospace">task C  (5s)</text>
  <rect x="108.852453" y="348.125098" width="452.458977" height="72.499944" rx="6.518573" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="335.081941" y="389.812645" text-anchor="middle" font-size="16.050248" fill="var(--text-muted)" font-family="Courier New, monospace">task D  (5s)</text>
  <rect x="108.852453" y="435.124941" width="452.458977" height="50.749983" rx="6.518573" fill="var(--text)" />
  <text x="335.081941" y="465.937676" text-anchor="middle" font-size="16.050248" fill="var(--bg)" font-family="Arial, sans-serif">Total: ~20 seconds</text>
  <text x="108.852453" y="500.375048" font-size="13.217711" fill="var(--text-muted)" font-family="Courier New, monospace">for item in a b c d; do process "$item"; done</text>
  <rect x="689.180376" y="40" width="550.819624" height="525.625042" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="964.590188" y="69.000135" text-anchor="middle" font-size="18.882785" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Parallel (background jobs)</text>
  <line x1="738.360595" y1="94.37507" x2="738.360595" y2="275.625155" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <text x="726.557212" y="282.875104" font-size="12.612679" fill="var(--primary-accent)" font-family="Arial, sans-serif">time</text>
  <rect x="758.032724" y="103.43762" width="196.721189" height="145" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="856.393371" y="183.187625" text-anchor="middle" font-size="15.106033" fill="var(--bg)" font-family="Courier New, monospace">task A</text>
  <rect x="964.590188" y="103.43762" width="196.721189" height="145" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1062.95073" y="183.187625" text-anchor="middle" font-size="15.106033" fill="var(--bg)" font-family="Courier New, monospace">task B</text>
  <rect x="758.032724" y="103.43762" width="196.721189" height="145" rx="6.518573" fill="none" />
  <rect x="964.590188" y="103.43762" width="196.721189" height="145" rx="6.518573" fill="none" />
  <rect x="758.032724" y="112.500056" width="196.721189" height="126.874902" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="856.393371" y="183.187625" text-anchor="middle" font-size="15.106033" fill="var(--bg)" font-family="Courier New, monospace">task A</text>
  <rect x="964.590188" y="112.500056" width="196.721189" height="126.874902" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1062.95073" y="183.187625" text-anchor="middle" font-size="15.106033" fill="var(--bg)" font-family="Courier New, monospace">task B</text>
  <rect x="758.032724" y="103.43762" width="88.524582" height="145" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.295015" y="183.187625" text-anchor="middle" font-size="13.217711" fill="var(--bg)" font-family="Courier New, monospace">A</text>
  <rect x="856.393371" y="103.43762" width="88.524582" height="145" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900.655662" y="183.187625" text-anchor="middle" font-size="13.217711" fill="var(--bg)" font-family="Courier New, monospace">B</text>
  <rect x="954.753913" y="103.43762" width="88.524582" height="145" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="999.016205" y="183.187625" text-anchor="middle" font-size="13.217711" fill="var(--bg)" font-family="Courier New, monospace">C</text>
  <rect x="1053.114666" y="103.43762" width="88.524582" height="145" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097.376957" y="183.187625" text-anchor="middle" font-size="13.217711" fill="var(--bg)" font-family="Courier New, monospace">D</text>
  <line x1="738.360595" y1="257.499944" x2="1190.819676" y2="257.499944" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <text x="964.590188" y="280.156204" text-anchor="middle" font-size="13.217711" fill="var(--primary-accent)" font-family="Arial, sans-serif">all finish ~same time</text>
  <rect x="758.032724" y="293.750141" width="383.606524" height="50.749983" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.836091" y="325.468838" text-anchor="middle" font-size="16.050248" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Total: ~5 seconds</text>
  <rect x="708.852401" y="366.250084" width="511.47547" height="163.125098" rx="6.518573" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="964.590188" y="389.812645" text-anchor="middle" font-size="14.162143" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">How to run in parallel</text>
  <text x="728.524635" y="411.562605" font-size="12.612679" fill="var(--text)" font-family="Courier New, monospace"># &amp; sends to background; wait collects</text>
  <text x="728.524635" y="431.500079" font-size="13.217711" fill="var(--primary-accent)" font-family="Courier New, monospace">for item in a b c d; do</text>
  <text x="728.524635" y="449.625177" font-size="13.217711" fill="var(--primary-accent)" font-family="Courier New, monospace">    process "$item" &amp;</text>
  <text x="728.524635" y="467.750051" font-size="13.217711" fill="var(--primary-accent)" font-family="Courier New, monospace">done</text>
  <text x="728.524635" y="485.874924" font-size="13.217711" fill="var(--primary-accent)" font-family="Courier New, monospace">wait   # wait for ALL background jobs</text>
  <text x="728.524635" y="507.624885" font-size="12.612679" fill="var(--text-faint)" font-family="Courier New, monospace"># xargs -P4 for bounded parallelism</text>
  <rect x="40" y="581.937541" width="1199.999895" height="38.062459" rx="6.518573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999948" y="605.499989" text-anchor="middle" font-size="15.106033" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use <tspan font-family="Courier New, monospace" fill="var(--text)">$!</tspan> to capture PIDs · <tspan font-family="Courier New, monospace" fill="var(--text)">wait $pid</tspan> to get individual exit codes · <tspan font-family="Courier New, monospace" fill="var(--text)">xargs -P N</tspan> to limit concurrency</text>
</svg>
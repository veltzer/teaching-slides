  <ns0:text x="568.8889" y="572.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">Use <ns0:tspan font-family="monospace">$!</ns0:tspan> to capture PIDs · <ns0:tspan font-family="monospace">wait $pid</ns0:tspan> to get individual exit codes · <ns0:tspan font-family="monospace">xargs -P N</ns0:tspan> to limit concurrency</ns0:text>

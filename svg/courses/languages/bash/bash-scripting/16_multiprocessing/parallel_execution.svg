<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Sequential (left) -->
  <rect x="30" y="20" width="560" height="580" rx="8" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="310" y="52" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#555555">Sequential (default)</text>

  <!-- Time axis -->
  <line x1="80" y1="80" x2="80" y2="540" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="68" y="548" font-family="sans-serif" font-size="13" fill="#9e9e9e">time</text>

  <rect x="100" y="90"  width="460" height="80" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="136" text-anchor="middle" font-family="monospace" font-size="17" fill="#555555">task A  (5s)</text>

  <rect x="100" y="180" width="460" height="80" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="226" text-anchor="middle" font-family="monospace" font-size="17" fill="#555555">task B  (5s)</text>

  <rect x="100" y="270" width="460" height="80" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="316" text-anchor="middle" font-family="monospace" font-size="17" fill="#555555">task C  (5s)</text>

  <rect x="100" y="360" width="460" height="80" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="406" text-anchor="middle" font-family="monospace" font-size="17" fill="#555555">task D  (5s)</text>

  <rect x="100" y="456" width="460" height="56" rx="4" fill="#212121"/>
  <text x="330" y="490" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#ffffff">Total: ~20 seconds</text>

  <!-- Code example -->
  <text x="100" y="528" font-family="monospace" font-size="14" fill="#555555">for item in a b c d; do process "$item"; done</text>

  <!-- Parallel (right) -->
  <rect x="690" y="20" width="560" height="580" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="970" y="52" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1565c0">Parallel (background jobs)</text>

  <!-- Time axis -->
  <line x1="740" y1="80" x2="740" y2="280" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="728" y="288" font-family="sans-serif" font-size="13" fill="#1565c0">time</text>

  <!-- 4 parallel bars same height -->
  <rect x="760" y="90" width="200" height="160" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="860" y="178" text-anchor="middle" font-family="monospace" font-size="16" fill="#ffffff">task A</text>

  <rect x="970" y="90" width="200" height="160" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1070" y="178" text-anchor="middle" font-family="monospace" font-size="16" fill="#ffffff">task B</text>

  <rect x="760" y="90" width="200" height="160" rx="4" fill="none"/>
  <rect x="970" y="90" width="200" height="160" rx="4" fill="none"/>

  <!-- second row parallel -->
  <rect x="760" y="100" width="200" height="140" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="860" y="178" text-anchor="middle" font-family="monospace" font-size="16" fill="#ffffff">task A</text>

  <rect x="970" y="100" width="200" height="140" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1070" y="178" text-anchor="middle" font-family="monospace" font-size="16" fill="#ffffff">task B</text>

  <!-- Redo properly: 4 narrow parallel bars -->
  <rect x="760" y="90"  width="90" height="160" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="805" y="178" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff">A</text>
  <rect x="860" y="90"  width="90" height="160" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="905" y="178" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff">B</text>
  <rect x="960" y="90"  width="90" height="160" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1005" y="178" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff">C</text>
  <rect x="1060" y="90" width="90" height="160" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1105" y="178" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff">D</text>

  <line x1="740" y1="260" x2="1200" y2="260" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="970" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1565c0">all finish ~same time</text>

  <rect x="760" y="300" width="390" height="56" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="955" y="335" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Total: ~5 seconds</text>

  <!-- Code examples -->
  <rect x="710" y="380" width="520" height="180" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="970" y="406" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">How to run in parallel</text>
  <text x="730" y="430" font-family="monospace" font-size="13" fill="#212121"># &amp; sends to background; wait collects</text>
  <text x="730" y="452" font-family="monospace" font-size="14" fill="#1565c0">for item in a b c d; do</text>
  <text x="730" y="472" font-family="monospace" font-size="14" fill="#1565c0">    process "$item" &amp;</text>
  <text x="730" y="492" font-family="monospace" font-size="14" fill="#1565c0">done</text>
  <text x="730" y="512" font-family="monospace" font-size="14" fill="#1565c0">wait   # wait for ALL background jobs</text>
  <text x="730" y="536" font-family="monospace" font-size="13" fill="#9e9e9e"># xargs -P4 for bounded parallelism</text>

  <!-- Note -->
  <rect x="30" y="618" width="1220" height="42" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="644" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">Use <tspan font-family="monospace">$!</tspan> to capture PIDs · <tspan font-family="monospace">wait $pid</tspan> to get individual exit codes · <tspan font-family="monospace">xargs -P N</tspan> to limit concurrency</text>
</svg>

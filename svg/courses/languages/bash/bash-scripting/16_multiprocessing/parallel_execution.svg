<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <rect x="177.9133" y="158.361" width="475.8148" height="382.5009" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="415.8207" y="179.4646" text-anchor="middle" font-family="sans-serif" font-size="14.9713" font-weight="bold" fill="var(--text-muted)">Sequential (default)</text>
  <line x1="220.3968" y1="197.9301" x2="220.3968" y2="501.2928" stroke="var(--border)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="210.2007" y="506.5687" font-family="sans-serif" font-size="10" fill="var(--text-faint)">time</text>
  <rect x="237.3901" y="204.525" width="390.8479" height="52.7587" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="432.8141" y="234.8613" text-anchor="middle" font-family="monospace" font-size="12.7255" fill="var(--text-muted)">task A  (5s)</text>
  <rect x="237.3901" y="263.8785" width="390.8479" height="52.7587" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="432.8141" y="294.2148" text-anchor="middle" font-family="monospace" font-size="12.7255" fill="var(--text-muted)">task B  (5s)</text>
  <rect x="237.3901" y="323.2321" width="390.8479" height="52.7587" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="432.8141" y="353.5684" text-anchor="middle" font-family="monospace" font-size="12.7255" fill="var(--text-muted)">task C  (5s)</text>
  <rect x="237.3901" y="382.5857" width="390.8479" height="52.7587" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="432.8141" y="412.922" text-anchor="middle" font-family="monospace" font-size="12.7255" fill="var(--text-muted)">task D  (5s)</text>
  <rect x="237.3901" y="445.8961" width="390.8479" height="36.9311" rx="5.7089" fill="var(--text)" />
  <text x="432.8141" y="468.3187" text-anchor="middle" font-family="sans-serif" font-size="12.7255" fill="var(--bg)">Total: ~20 seconds</text>
  <text x="237.3901" y="493.379" font-family="monospace" font-size="10.4797" fill="var(--text-muted)">for item in a b c d; do process "$item"; done</text>
  <rect x="738.6951" y="158.361" width="475.8148" height="382.5009" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="976.6025" y="179.4646" text-anchor="middle" font-family="sans-serif" font-size="14.9713" font-weight="bold" fill="var(--primary-accent)">Parallel (background jobs)</text>
  <line x1="781.1785" y1="197.9301" x2="781.1785" y2="329.827" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <text x="770.9824" y="335.1028" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">time</text>
  <rect x="798.1719" y="204.525" width="169.9338" height="105.5175" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="883.1388" y="262.5596" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--bg)">task A</text>
  <rect x="976.6025" y="204.525" width="169.9338" height="105.5175" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1061.5694" y="262.5596" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--bg)">task B</text>
  <rect x="798.1719" y="204.525" width="169.9338" height="105.5175" rx="5.7089" fill="none" />
  <rect x="976.6025" y="204.525" width="169.9338" height="105.5175" rx="5.7089" fill="none" />
  <rect x="798.1719" y="211.1198" width="169.9338" height="92.3277" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="883.1388" y="262.5596" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--bg)">task A</text>
  <rect x="976.6025" y="211.1198" width="169.9338" height="92.3277" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1061.5694" y="262.5596" text-anchor="middle" font-family="monospace" font-size="11.9769" fill="var(--bg)">task B</text>
  <rect x="798.1719" y="204.525" width="76.4702" height="105.5175" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="836.407" y="262.5596" text-anchor="middle" font-family="monospace" font-size="10.4797" fill="var(--bg)">A</text>
  <rect x="883.1388" y="204.525" width="76.4702" height="105.5175" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="921.3739" y="262.5596" text-anchor="middle" font-family="monospace" font-size="10.4797" fill="var(--bg)">B</text>
  <rect x="968.1056" y="204.525" width="76.4702" height="105.5175" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1006.3408" y="262.5596" text-anchor="middle" font-family="monospace" font-size="10.4797" fill="var(--bg)">C</text>
  <rect x="1053.0727" y="204.525" width="76.4702" height="105.5175" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1091.3078" y="262.5596" text-anchor="middle" font-family="monospace" font-size="10.4797" fill="var(--bg)">D</text>
  <line x1="781.1785" y1="316.6372" x2="1172.0265" y2="316.6372" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="3.5556 2.6667" />
  <text x="976.6025" y="333.1243" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--primary-accent)">all finish ~same time</text>
  <rect x="798.1719" y="343.0167" width="331.371" height="36.9311" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="963.8575" y="366.0986" text-anchor="middle" font-family="sans-serif" font-size="12.7255" font-weight="bold" fill="var(--bg)">Total: ~5 seconds</text>
  <rect x="755.6884" y="395.7754" width="441.8281" height="118.7072" rx="5.7089" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="976.6025" y="412.922" text-anchor="middle" font-family="sans-serif" font-size="11.2285" font-weight="bold" fill="var(--primary-accent)">How to run in parallel</text>
  <text x="772.6819" y="428.7496" font-family="monospace" font-size="10" fill="var(--text)"># &amp; sends to background; wait collects</text>
  <text x="772.6819" y="443.2582" font-family="monospace" font-size="10.4797" fill="var(--primary-accent)">for item in a b c d; do</text>
  <text x="772.6819" y="456.448" font-family="monospace" font-size="10.4797" fill="var(--primary-accent)">    process "$item" &amp;</text>
  <text x="772.6819" y="469.6376" font-family="monospace" font-size="10.4797" fill="var(--primary-accent)">done</text>
  <text x="772.6819" y="482.8272" font-family="monospace" font-size="10.4797" fill="var(--primary-accent)">wait   # wait for ALL background jobs</text>
  <text x="772.6819" y="498.6548" font-family="monospace" font-size="10" fill="var(--text-faint)"># xargs -P4 for bounded parallelism</text>
  <rect x="177.9133" y="552.7326" width="1036.5965" height="27.6983" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="696.2116" y="569.8791" text-anchor="middle" font-family="sans-serif" font-size="11.9769" fill="var(--primary-accent)">Use <tspan font-family="monospace">$!</tspan> to capture PIDs · <tspan font-family="monospace">wait $pid</tspan> to get individual exit codes · <tspan font-family="monospace">xargs -P N</tspan> to limit concurrency</text>
</svg>
  <ns0:text x="862.2222" y="360.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#1565c0">How to run in parallel</ns0:text>
  <ns0:text x="648.8889" y="382.2222" font-family="monospace" font-size="11.5556" fill="#212121"># &amp; sends to background; wait collects</ns0:text>
  <ns0:text x="648.8889" y="401.7778" font-family="monospace" font-size="12.4444" fill="#1565c0">for item in a b c d; do</ns0:text>
  <ns0:text x="648.8889" y="419.5556" font-family="monospace" font-size="12.4444" fill="#1565c0">    process "$item" &amp;</ns0:text>
  <ns0:text x="648.8889" y="437.3333" font-family="monospace" font-size="12.4444" fill="#1565c0">done</ns0:text>
  <ns0:text x="648.8889" y="455.1111" font-family="monospace" font-size="12.4444" fill="#1565c0">wait   # wait for ALL background jobs</ns0:text>
  <ns0:text x="648.8889" y="476.4444" font-family="monospace" font-size="11.5556" fill="#9e9e9e"># xargs -P4 for bounded parallelism</ns0:text>

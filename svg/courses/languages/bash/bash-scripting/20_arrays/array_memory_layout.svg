<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- Array declaration -->
  <rect x="40" y="40" width="1200" height="53.475177" rx="6.601096" fill="var(--code-bg)"/>
  <text x="70" y="72.907801" font-family="monospace" font-size="22.309834" fill="var(--ok-accent)">fruits</text>
  <text x="148" y="72.907801" font-family="monospace" font-size="22.309834" fill="var(--primary-accent)">=(</text>
  <text x="178" y="72.907801" font-family="monospace" font-size="22.309834" fill="var(--warn-accent)">"apple"</text>
  <text x="286" y="72.907801" font-family="monospace" font-size="22.309834" fill="var(--warn-accent)"> "banana"</text>
  <text x="434" y="72.907801" font-family="monospace" font-size="22.309834" fill="var(--warn-accent)"> "cherry"</text>
  <text x="584" y="72.907801" font-family="monospace" font-size="22.309834" fill="var(--warn-accent)"> "date"</text>
  <text x="680" y="72.907801" font-family="monospace" font-size="22.309834" fill="var(--warn-accent)"> "elderberry"</text>
  <text x="880" y="72.907801" font-family="monospace" font-size="22.309834" fill="var(--primary-accent)">)</text>

  <!-- Memory layout boxes -->
  <!-- Index labels -->
  <text x="130" y="127.411291" font-family="monospace" font-size="18.253571" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[0]</text>
  <text x="370" y="127.411291" font-family="monospace" font-size="18.253571" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[1]</text>
  <text x="610" y="127.411291" font-family="monospace" font-size="18.253571" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[2]</text>
  <text x="850" y="127.411291" font-family="monospace" font-size="18.253571" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[3]</text>
  <text x="1090" y="127.411291" font-family="monospace" font-size="18.253571" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[4]</text>

  <!-- Index boxes -->
  <rect x="50" y="134.609929" width="160" height="82.269504" rx="6.601096" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="53" y="137.695092" width="154" height="76.099291" rx="6.601096" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="186.028369" font-family="monospace" font-size="20.281757" fill="var(--primary-accent)" text-anchor="middle">"apple"</text>

  <rect x="290" y="134.609929" width="160" height="82.269504" rx="6.601096" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="293" y="137.695092" width="154" height="76.099291" rx="6.601096" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="186.028369" font-family="monospace" font-size="20.281757" fill="var(--primary-accent)" text-anchor="middle">"banana"</text>

  <rect x="530" y="134.609929" width="160" height="82.269504" rx="6.601096" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="533" y="137.695092" width="154" height="76.099291" rx="6.601096" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="186.028369" font-family="monospace" font-size="20.281757" fill="var(--primary-accent)" text-anchor="middle">"cherry"</text>

  <rect x="770" y="134.609929" width="160" height="82.269504" rx="6.601096" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="773" y="137.695092" width="154" height="76.099291" rx="6.601096" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="186.028369" font-family="monospace" font-size="20.281757" fill="var(--primary-accent)" text-anchor="middle">"date"</text>

  <rect x="1010" y="134.609929" width="220" height="82.269504" rx="6.601096" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1013" y="137.695092" width="214" height="76.099291" rx="6.601096" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="186.028369" font-family="monospace" font-size="18.253571" fill="var(--primary-accent)" text-anchor="middle">"elderberry"</text>

  <!-- Separator line between boxes -->
  <line x1="210" y1="134.609929" x2="210" y2="216.879433" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="450" y1="134.609929" x2="450" y2="216.879433" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="690" y1="134.609929" x2="690" y2="216.879433" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="930" y1="134.609929" x2="930" y2="216.879433" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- Negative index labels -->
  <text x="130" y="240.531972" font-family="monospace" font-size="14.197197" fill="var(--text-faint)" text-anchor="middle">[-5]</text>
  <text x="370" y="240.531972" font-family="monospace" font-size="14.197197" fill="var(--text-faint)" text-anchor="middle">[-4]</text>
  <text x="610" y="240.531972" font-family="monospace" font-size="14.197197" fill="var(--text-faint)" text-anchor="middle">[-3]</text>
  <text x="850" y="240.531972" font-family="monospace" font-size="14.197197" fill="var(--text-faint)" text-anchor="middle">[-2]</text>
  <text x="1120" y="240.531972" font-family="monospace" font-size="14.197197" fill="var(--text-faint)" text-anchor="middle">[-1]  (bash 4.3+)</text>

  <!-- Divider -->
  <line x1="40" y1="255.957447" x2="1240" y2="255.957447" stroke="var(--border)" stroke-width="2"/>

  <!-- Three columns of syntax examples -->
  <!-- Column 1: Access -->
  <rect x="40" y="270.35461" width="380" height="349.64539" rx="6.601096" fill="var(--bg)"/>
  <rect x="40" y="270.35461" width="380" height="41.134752" rx="6.601096" fill="var(--primary-accent)"/>
  <rect x="40" y="297.092199" width="380" height="14.397163" fill="var(--primary-accent)" rx="6.601096"/>
  <text x="230" y="298.120624" font-family="sans-serif" font-size="16.225384" font-weight="bold" fill="var(--bg)" text-anchor="middle">Access Elements</text>
  <rect x="55" y="321.77305" width="350" height="283.829787" rx="6.601096" fill="var(--code-bg)"/>
  <text x="75" y="346.453901" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Single element</text>
  <text x="75" y="365.992851" font-family="monospace" font-size="13.183159" fill="var(--ok-accent)">echo</text>
  <text x="114" y="365.992851" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)"> "${fruits[0]}"</text>
  <text x="75" y="381.41844" font-family="monospace" font-size="11.154972" fill="var(--text-muted)"># apple</text>
  <text x="75" y="401.985816" font-family="monospace" font-size="13.183159" fill="var(--ok-accent)">echo</text>
  <text x="114" y="401.985816" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)"> "${fruits[-1]}"</text>
  <text x="75" y="417.411404" font-family="monospace" font-size="11.154972" fill="var(--text-muted)"># elderberry (last)</text>
  <text x="75" y="437.97878" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># All elements</text>
  <text x="75" y="457.51773" font-family="monospace" font-size="13.183159" fill="var(--ok-accent)">echo</text>
  <text x="114" y="457.51773" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)"> "${fruits[@]}"</text>
  <text x="75" y="478.085106" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Count</text>
  <text x="75" y="497.624057" font-family="monospace" font-size="13.183159" fill="var(--ok-accent)">echo</text>
  <text x="114" y="497.624057" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)"> "${#fruits[@]}"</text>
  <text x="75" y="513.049645" font-family="monospace" font-size="11.154972" fill="var(--text-muted)"># 5</text>
  <text x="75" y="533.617021" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># All indices</text>
  <text x="75" y="553.156085" font-family="monospace" font-size="13.183159" fill="var(--ok-accent)">echo</text>
  <text x="114" y="553.156085" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)"> "${!fruits[@]}"</text>
  <text x="75" y="568.58156" font-family="monospace" font-size="11.154972" fill="var(--text-muted)"># 0 1 2 3 4</text>
  <text x="75" y="591.205674" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Iterate</text>
  <text x="75" y="591.205674" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Iterate</text>
  <text x="75" y="591.205674" font-family="monospace" font-size="13.183159" fill="var(--ok-accent)">for</text>
  <text x="100" y="591.205674" font-family="monospace" font-size="11.154972" fill="var(--text-muted)"> f in "${fruits[@]}"; do echo $f; done</text>

  <!-- Column 2: Append/Modify -->
  <rect x="450" y="270.35461" width="380" height="349.64539" rx="6.601096" fill="var(--bg)"/>
  <rect x="450" y="270.35461" width="380" height="41.134752" rx="6.601096" fill="var(--ok-accent)"/>
  <rect x="450" y="297.092199" width="380" height="14.397163" fill="var(--ok-accent)" rx="6.601096"/>
  <text x="640" y="298.120624" font-family="sans-serif" font-size="16.225384" font-weight="bold" fill="var(--bg)" text-anchor="middle">Append and Modify</text>
  <rect x="465" y="321.77305" width="350" height="283.829787" rx="6.601096" fill="var(--code-bg)"/>
  <text x="485" y="346.453901" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Append one</text>
  <text x="485" y="365.992851" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)">fruits+=("fig")</text>
  <text x="485" y="386.560227" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Append multiple</text>
  <text x="485" y="406.099291" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)">fruits+=("grape" "kiwi")</text>
  <text x="485" y="426.666667" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Modify element</text>
  <text x="485" y="446.20573" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)">fruits[2]="CHERRY"</text>
  <text x="485" y="466.773106" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Delete element (sparse)</text>
  <text x="485" y="486.312057" font-family="monospace" font-size="13.183159" fill="var(--ok-accent)">unset</text>
  <text x="530" y="486.312057" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)"> 'fruits[1]'</text>
  <text x="485" y="506.879433" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Delete all</text>
  <text x="485" y="526.418383" font-family="monospace" font-size="13.183159" fill="var(--ok-accent)">unset</text>
  <text x="530" y="526.418383" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)"> fruits</text>
  <text x="485" y="546.985759" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Prepend element</text>
  <text x="485" y="566.524823" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)">fruits=("avocado" "${fruits[@]}")</text>
  <text x="485" y="587.092199" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Sort into new array</text>
  <text x="485" y="591.205674" font-family="monospace" font-size="11.154972" fill="var(--primary-accent)">mapfile -t s &lt; &lt;(printf '%s\n' "${fruits[@]}" | sort)</text>

  <!-- Column 3: Slicing -->
  <rect x="860" y="270.35461" width="380" height="349.64539" rx="6.601096" fill="var(--bg)"/>
  <rect x="860" y="270.35461" width="380" height="41.134752" rx="6.601096" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860" y="297.092199" width="380" height="14.397163" fill="var(--warn-fill)" rx="6.601096" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="298.120624" font-family="sans-serif" font-size="16.225384" font-weight="bold" fill="var(--bg)" text-anchor="middle">Slicing and Copying</text>
  <rect x="875" y="321.77305" width="350" height="283.829787" rx="6.601096" fill="var(--code-bg)"/>
  <text x="895" y="346.453901" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Syntax: ${arr[@]:off:len}</text>
  <text x="895" y="367.021277" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># From index 1, take 3:</text>
  <text x="895" y="386.560227" font-family="monospace" font-size="13.183159" fill="var(--ok-accent)">echo</text>
  <text x="934" y="386.560227" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)"> "${fruits[@]:1:3}"</text>
  <text x="895" y="401.985816" font-family="monospace" font-size="11.154972" fill="var(--text-muted)"># banana cherry date</text>
  <text x="895" y="422.553191" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># From index 2 to end:</text>
  <text x="895" y="442.092255" font-family="monospace" font-size="13.183159" fill="var(--ok-accent)">echo</text>
  <text x="934" y="442.092255" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)"> "${fruits[@]:2}"</text>
  <text x="895" y="457.51773" font-family="monospace" font-size="11.154972" fill="var(--text-muted)"># cherry date elderberry</text>
  <text x="895" y="478.085106" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Last 2 elements:</text>
  <text x="895" y="497.624057" font-family="monospace" font-size="13.183159" fill="var(--ok-accent)">echo</text>
  <text x="934" y="497.624057" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)"> "${fruits[@]:(-2)}"</text>
  <text x="895" y="513.049645" font-family="monospace" font-size="11.154972" fill="var(--text-muted)"># date elderberry</text>
  <text x="895" y="533.617021" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Copy entire array:</text>
  <text x="895" y="553.156085" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)">copy=("${fruits[@]}")</text>
  <text x="895" y="573.723461" font-family="monospace" font-size="13.183159" fill="var(--text-muted)"># Merge two arrays:</text>
  <text x="895" y="593.262411" font-family="monospace" font-size="13.183159" fill="var(--primary-accent)">m=("${a[@]}" "${b[@]}")</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--surface-light)"/>

  <!-- Array declaration -->
  <rect x="40" y="20" width="1200" height="52" rx="10" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="70" y="52" font-family="monospace" font-size="22" fill="var(--ok-tint)">fruits</text>
  <text x="148" y="52" font-family="monospace" font-size="22" fill="var(--primary-lt)">=(</text>
  <text x="178" y="52" font-family="monospace" font-size="22" fill="var(--warn-lt)">"apple"</text>
  <text x="286" y="52" font-family="monospace" font-size="22" fill="var(--warn-lt)"> "banana"</text>
  <text x="434" y="52" font-family="monospace" font-size="22" fill="var(--warn-lt)"> "cherry"</text>
  <text x="584" y="52" font-family="monospace" font-size="22" fill="var(--warn-lt)"> "date"</text>
  <text x="680" y="52" font-family="monospace" font-size="22" fill="var(--warn-lt)"> "elderberry"</text>
  <text x="880" y="52" font-family="monospace" font-size="22" fill="var(--primary-lt)">)</text>

  <!-- Memory layout boxes -->
  <!-- Index labels -->
  <text x="130" y="105" font-family="monospace" font-size="18" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">[0]</text>
  <text x="370" y="105" font-family="monospace" font-size="18" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">[1]</text>
  <text x="610" y="105" font-family="monospace" font-size="18" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">[2]</text>
  <text x="850" y="105" font-family="monospace" font-size="18" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">[3]</text>
  <text x="1090" y="105" font-family="monospace" font-size="18" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">[4]</text>

  <!-- Index boxes -->
  <rect x="50" y="112" width="160" height="80" rx="0" fill="var(--primary)"/>
  <rect x="53" y="115" width="154" height="74" rx="0" fill="var(--primary-pale)"/>
  <text x="130" y="162" font-family="monospace" font-size="20" fill="var(--primary-dk)" text-anchor="middle">"apple"</text>

  <rect x="290" y="112" width="160" height="80" rx="0" fill="var(--primary)"/>
  <rect x="293" y="115" width="154" height="74" rx="0" fill="var(--primary-pale)"/>
  <text x="370" y="162" font-family="monospace" font-size="20" fill="var(--primary-dk)" text-anchor="middle">"banana"</text>

  <rect x="530" y="112" width="160" height="80" rx="0" fill="var(--primary)"/>
  <rect x="533" y="115" width="154" height="74" rx="0" fill="var(--primary-pale)"/>
  <text x="610" y="162" font-family="monospace" font-size="20" fill="var(--primary-dk)" text-anchor="middle">"cherry"</text>

  <rect x="770" y="112" width="160" height="80" rx="0" fill="var(--primary)"/>
  <rect x="773" y="115" width="154" height="74" rx="0" fill="var(--primary-pale)"/>
  <text x="850" y="162" font-family="monospace" font-size="20" fill="var(--primary-dk)" text-anchor="middle">"date"</text>

  <rect x="1010" y="112" width="220" height="80" rx="0" fill="var(--primary)"/>
  <rect x="1013" y="115" width="214" height="74" rx="0" fill="var(--primary-pale)"/>
  <text x="1120" y="162" font-family="monospace" font-size="18" fill="var(--primary-dk)" text-anchor="middle">"elderberry"</text>

  <!-- Separator line between boxes -->
  <line x1="210" y1="112" x2="210" y2="192" stroke="var(--primary)" stroke-width="3"/>
  <line x1="450" y1="112" x2="450" y2="192" stroke="var(--primary)" stroke-width="3"/>
  <line x1="690" y1="112" x2="690" y2="192" stroke="var(--primary)" stroke-width="3"/>
  <line x1="930" y1="112" x2="930" y2="192" stroke="var(--primary)" stroke-width="3"/>

  <!-- Negative index labels -->
  <text x="130" y="215" font-family="monospace" font-size="14" fill="var(--text-faint)" text-anchor="middle">[-5]</text>
  <text x="370" y="215" font-family="monospace" font-size="14" fill="var(--text-faint)" text-anchor="middle">[-4]</text>
  <text x="610" y="215" font-family="monospace" font-size="14" fill="var(--text-faint)" text-anchor="middle">[-3]</text>
  <text x="850" y="215" font-family="monospace" font-size="14" fill="var(--text-faint)" text-anchor="middle">[-2]</text>
  <text x="1120" y="215" font-family="monospace" font-size="14" fill="var(--text-faint)" text-anchor="middle">[-1]  (bash 4.3+)</text>

  <!-- Divider -->
  <line x1="40" y1="230" x2="1240" y2="230" stroke="var(--border)" stroke-width="2"/>

  <!-- Three columns of syntax examples -->
  <!-- Column 1: Access -->
  <rect x="40" y="244" width="380" height="340" rx="10" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="40" y="244" width="380" height="40" rx="10" fill="var(--primary-dk)"/>
  <rect x="40" y="270" width="380" height="14" fill="var(--primary-dk)"/>
  <text x="230" y="271" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Access Elements</text>
  <rect x="55" y="294" width="350" height="276" rx="6" fill="var(--code-bg)"/>
  <text x="75" y="318" font-family="monospace" font-size="13" fill="var(--text-mid)"># Single element</text>
  <text x="75" y="337" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="114" y="337" font-family="monospace" font-size="13" fill="var(--primary-lt)"> "${fruits[0]}"</text>
  <text x="75" y="352" font-family="monospace" font-size="11" fill="var(--text-mid)"># apple</text>
  <text x="75" y="372" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="114" y="372" font-family="monospace" font-size="13" fill="var(--primary-lt)"> "${fruits[-1]}"</text>
  <text x="75" y="387" font-family="monospace" font-size="11" fill="var(--text-mid)"># elderberry (last)</text>
  <text x="75" y="407" font-family="monospace" font-size="13" fill="var(--text-mid)"># All elements</text>
  <text x="75" y="426" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="114" y="426" font-family="monospace" font-size="13" fill="var(--primary-lt)"> "${fruits[@]}"</text>
  <text x="75" y="446" font-family="monospace" font-size="13" fill="var(--text-mid)"># Count</text>
  <text x="75" y="465" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="114" y="465" font-family="monospace" font-size="13" fill="var(--primary-lt)"> "${#fruits[@]}"</text>
  <text x="75" y="480" font-family="monospace" font-size="11" fill="var(--text-mid)"># 5</text>
  <text x="75" y="500" font-family="monospace" font-size="13" fill="var(--text-mid)"># All indices</text>
  <text x="75" y="519" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="114" y="519" font-family="monospace" font-size="13" fill="var(--primary-lt)"> "${!fruits[@]}"</text>
  <text x="75" y="534" font-family="monospace" font-size="11" fill="var(--text-mid)"># 0 1 2 3 4</text>
  <text x="75" y="556" font-family="monospace" font-size="13" fill="var(--text-mid)"># Iterate</text>
  <text x="75" y="556" font-family="monospace" font-size="13" fill="var(--text-mid)"># Iterate</text>
  <text x="75" y="556" font-family="monospace" font-size="13" fill="var(--ok-tint)">for</text>
  <text x="100" y="556" font-family="monospace" font-size="11" fill="var(--text-mid)"> f in "${fruits[@]}"; do echo $f; done</text>

  <!-- Column 2: Append/Modify -->
  <rect x="450" y="244" width="380" height="340" rx="10" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="450" y="244" width="380" height="40" rx="10" fill="var(--ok-dk)"/>
  <rect x="450" y="270" width="380" height="14" fill="var(--ok-dk)"/>
  <text x="640" y="271" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Append and Modify</text>
  <rect x="465" y="294" width="350" height="276" rx="6" fill="var(--code-bg)"/>
  <text x="485" y="318" font-family="monospace" font-size="13" fill="var(--text-mid)"># Append one</text>
  <text x="485" y="337" font-family="monospace" font-size="13" fill="var(--primary-lt)">fruits+=("fig")</text>
  <text x="485" y="357" font-family="monospace" font-size="13" fill="var(--text-mid)"># Append multiple</text>
  <text x="485" y="376" font-family="monospace" font-size="13" fill="var(--primary-lt)">fruits+=("grape" "kiwi")</text>
  <text x="485" y="396" font-family="monospace" font-size="13" fill="var(--text-mid)"># Modify element</text>
  <text x="485" y="415" font-family="monospace" font-size="13" fill="var(--primary-lt)">fruits[2]="CHERRY"</text>
  <text x="485" y="435" font-family="monospace" font-size="13" fill="var(--text-mid)"># Delete element (sparse)</text>
  <text x="485" y="454" font-family="monospace" font-size="13" fill="var(--ok-tint)">unset</text>
  <text x="530" y="454" font-family="monospace" font-size="13" fill="var(--primary-lt)"> 'fruits[1]'</text>
  <text x="485" y="474" font-family="monospace" font-size="13" fill="var(--text-mid)"># Delete all</text>
  <text x="485" y="493" font-family="monospace" font-size="13" fill="var(--ok-tint)">unset</text>
  <text x="530" y="493" font-family="monospace" font-size="13" fill="var(--primary-lt)"> fruits</text>
  <text x="485" y="513" font-family="monospace" font-size="13" fill="var(--text-mid)"># Prepend element</text>
  <text x="485" y="532" font-family="monospace" font-size="13" fill="var(--primary-lt)">fruits=("avocado" "${fruits[@]}")</text>
  <text x="485" y="552" font-family="monospace" font-size="13" fill="var(--text-mid)"># Sort into new array</text>
  <text x="485" y="556" font-family="monospace" font-size="11" fill="var(--primary-lt)">mapfile -t s &lt; &lt;(printf '%s\n' "${fruits[@]}" | sort)</text>

  <!-- Column 3: Slicing -->
  <rect x="860" y="244" width="380" height="340" rx="10" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="860" y="244" width="380" height="40" rx="10" fill="var(--warn-mid)"/>
  <rect x="860" y="270" width="380" height="14" fill="var(--warn-mid)"/>
  <text x="1050" y="271" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Slicing and Copying</text>
  <rect x="875" y="294" width="350" height="276" rx="6" fill="var(--code-bg)"/>
  <text x="895" y="318" font-family="monospace" font-size="13" fill="var(--text-mid)"># Syntax: ${arr[@]:off:len}</text>
  <text x="895" y="338" font-family="monospace" font-size="13" fill="var(--text-mid)"># From index 1, take 3:</text>
  <text x="895" y="357" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="934" y="357" font-family="monospace" font-size="13" fill="var(--primary-lt)"> "${fruits[@]:1:3}"</text>
  <text x="895" y="372" font-family="monospace" font-size="11" fill="var(--text-mid)"># banana cherry date</text>
  <text x="895" y="392" font-family="monospace" font-size="13" fill="var(--text-mid)"># From index 2 to end:</text>
  <text x="895" y="411" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="934" y="411" font-family="monospace" font-size="13" fill="var(--primary-lt)"> "${fruits[@]:2}"</text>
  <text x="895" y="426" font-family="monospace" font-size="11" fill="var(--text-mid)"># cherry date elderberry</text>
  <text x="895" y="446" font-family="monospace" font-size="13" fill="var(--text-mid)"># Last 2 elements:</text>
  <text x="895" y="465" font-family="monospace" font-size="13" fill="var(--ok-tint)">echo</text>
  <text x="934" y="465" font-family="monospace" font-size="13" fill="var(--primary-lt)"> "${fruits[@]:(-2)}"</text>
  <text x="895" y="480" font-family="monospace" font-size="11" fill="var(--text-mid)"># date elderberry</text>
  <text x="895" y="500" font-family="monospace" font-size="13" fill="var(--text-mid)"># Copy entire array:</text>
  <text x="895" y="519" font-family="monospace" font-size="13" fill="var(--primary-lt)">copy=("${fruits[@]}")</text>
  <text x="895" y="539" font-family="monospace" font-size="13" fill="var(--text-mid)"># Merge two arrays:</text>
  <text x="895" y="558" font-family="monospace" font-size="13" fill="var(--primary-lt)">m=("${a[@]}" "${b[@]}")</text>
</svg>

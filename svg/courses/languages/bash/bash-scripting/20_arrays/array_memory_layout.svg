<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- declaration -->
  <text x="640" y="40" font-size="26.031654938239" fill="var(--text)" font-family="Courier New, monospace" text-anchor="middle">fruits=("apple" "banana" "cherry" "date" "elderberry")</text>

  <!-- Memory cells -->
  <text x="122.758620689655" y="96.862745098039" font-size="17.354436625492" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">[0]</text>
  <text x="329.655172413793" y="96.862745098039" font-size="17.354436625492" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">[1]</text>
  <text x="536.551724137931" y="96.862745098039" font-size="17.354436625492" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">[2]</text>
  <text x="743.448275862069" y="96.862745098039" font-size="17.354436625492" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">[3]</text>
  <text x="971.034482758621" y="96.862745098039" font-size="17.354436625492" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">[4]</text>

  <rect x="40" y="113.921568627451" width="165.51724137931" height="79.607843137255" rx="6.50791373456" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.758620689655" y="165.098039215686" font-size="17.354436625492" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">apple</text>

  <rect x="246.896551724138" y="113.921568627451" width="165.51724137931" height="79.607843137255" rx="6.50791373456" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="165.098039215686" font-size="17.354436625492" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">banana</text>

  <rect x="453.793103448276" y="113.921568627451" width="165.51724137931" height="79.607843137255" rx="6.50791373456" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="536.551724137931" y="165.098039215686" font-size="17.354436625492" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">cherry</text>

  <rect x="660.689655172414" y="113.921568627451" width="165.51724137931" height="79.607843137255" rx="6.50791373456" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="743.448275862069" y="165.098039215686" font-size="17.354436625492" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">date</text>

  <rect x="867.586206896552" y="113.921568627451" width="206.896551724138" height="79.607843137255" rx="6.50791373456" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.034482758621" y="165.098039215686" font-size="17.354436625492" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">elderberry</text>

  <text x="122.758620689655" y="221.960784313725" font-size="14.100479758213" fill="var(--text-faint)" text-anchor="middle" font-family="Courier New, monospace">[-5]</text>
  <text x="329.655172413793" y="221.960784313725" font-size="14.100479758213" fill="var(--text-faint)" text-anchor="middle" font-family="Courier New, monospace">[-4]</text>
  <text x="536.551724137931" y="221.960784313725" font-size="14.100479758213" fill="var(--text-faint)" text-anchor="middle" font-family="Courier New, monospace">[-3]</text>
  <text x="743.448275862069" y="221.960784313725" font-size="14.100479758213" fill="var(--text-faint)" text-anchor="middle" font-family="Courier New, monospace">[-2]</text>
  <text x="971.034482758621" y="221.960784313725" font-size="14.100479758213" fill="var(--text-faint)" text-anchor="middle" font-family="Courier New, monospace">[-1]</text>

  <!-- Columns -->
  <rect x="40" y="256.078431372549" width="393.103448275862" height="363.921568627451" rx="8.677218312746" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="295.882352941176" font-size="19.523741203679" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Access</text>
  <text x="60.689655172414" y="341.372549019608" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">${fruits[0]}</text>
  <text x="60.689655172414" y="375.490196078431" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">${fruits[-1]}</text>
  <text x="60.689655172414" y="409.607843137255" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">${fruits[@]}</text>
  <text x="60.689655172414" y="443.725490196078" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">${#fruits[@]}</text>
  <text x="60.689655172414" y="477.843137254902" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">${!fruits[@]}</text>
  <text x="60.689655172414" y="529.019607843137" font-size="14.100479758213" fill="var(--bg)" font-family="Courier New, monospace">for f in "${fruits[@]}"</text>

  <rect x="443.448275862069" y="256.078431372549" width="393.103448275862" height="363.921568627451" rx="8.677218312746" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="295.882352941176" font-size="19.523741203679" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Modify</text>
  <text x="464.137931034483" y="341.372549019608" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">fruits+=("fig")</text>
  <text x="464.137931034483" y="375.490196078431" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">fruits[2]="NEW"</text>
  <text x="464.137931034483" y="409.607843137255" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">unset 'fruits[1]'</text>
  <text x="464.137931034483" y="443.725490196078" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">unset fruits</text>
  <text x="464.137931034483" y="489.21568627451" font-size="14.100479758213" fill="var(--bg)" font-family="Courier New, monospace">fruits=("avo" "${fruits[@]}")</text>

  <rect x="846.896551724138" y="256.078431372549" width="393.103448275862" height="363.921568627451" rx="8.677218312746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448275862069" y="295.882352941176" font-size="19.523741203679" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Slice / Copy</text>
  <text x="867.586206896552" y="341.372549019608" font-size="14.100479758213" fill="var(--bg)" font-family="Courier New, monospace">${fruits[@]:off:len}</text>
  <text x="867.586206896552" y="381.176470588235" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">${fruits[@]:1:3}</text>
  <text x="867.586206896552" y="415.294117647059" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">${fruits[@]:2}</text>
  <text x="867.586206896552" y="449.411764705882" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">${fruits[@]:(-2)}</text>
  <text x="867.586206896552" y="494.901960784314" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">copy=("${fruits[@]}")</text>
  <text x="867.586206896552" y="529.019607843137" font-size="15.185132047306" fill="var(--bg)" font-family="Courier New, monospace">m=("${a[@]}" "${b[@]}")</text>
</svg>

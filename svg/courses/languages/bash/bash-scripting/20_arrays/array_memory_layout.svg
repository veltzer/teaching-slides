<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--surface)" rx="6"/>

  <!-- Array declaration -->
  <rect x="40" y="20" width="1200" height="52" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="70" y="52" font-family="monospace" font-size="22" fill="var(--ok-accent)">fruits</text>
  <text x="148" y="52" font-family="monospace" font-size="22" fill="var(--primary-accent)">=(</text>
  <text x="178" y="52" font-family="monospace" font-size="22" fill="var(--warn-accent)">"apple"</text>
  <text x="286" y="52" font-family="monospace" font-size="22" fill="var(--warn-accent)"> "banana"</text>
  <text x="434" y="52" font-family="monospace" font-size="22" fill="var(--warn-accent)"> "cherry"</text>
  <text x="584" y="52" font-family="monospace" font-size="22" fill="var(--warn-accent)"> "date"</text>
  <text x="680" y="52" font-family="monospace" font-size="22" fill="var(--warn-accent)"> "elderberry"</text>
  <text x="880" y="52" font-family="monospace" font-size="22" fill="var(--primary-accent)">)</text>

  <!-- Memory layout boxes -->
  <!-- Index labels -->
  <text x="130" y="105" font-family="monospace" font-size="18" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[0]</text>
  <text x="370" y="105" font-family="monospace" font-size="18" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[1]</text>
  <text x="610" y="105" font-family="monospace" font-size="18" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[2]</text>
  <text x="850" y="105" font-family="monospace" font-size="18" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[3]</text>
  <text x="1090" y="105" font-family="monospace" font-size="18" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[4]</text>

  <!-- Index boxes -->
  <rect x="50" y="112" width="160" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="53" y="115" width="154" height="74" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="130" y="162" font-family="monospace" font-size="20" fill="var(--primary-accent)" text-anchor="middle">"apple"</text>

  <rect x="290" y="112" width="160" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="293" y="115" width="154" height="74" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="370" y="162" font-family="monospace" font-size="20" fill="var(--primary-accent)" text-anchor="middle">"banana"</text>

  <rect x="530" y="112" width="160" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="533" y="115" width="154" height="74" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="610" y="162" font-family="monospace" font-size="20" fill="var(--primary-accent)" text-anchor="middle">"cherry"</text>

  <rect x="770" y="112" width="160" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="773" y="115" width="154" height="74" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="850" y="162" font-family="monospace" font-size="20" fill="var(--primary-accent)" text-anchor="middle">"date"</text>

  <rect x="1010" y="112" width="220" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1013" y="115" width="214" height="74" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1120" y="162" font-family="monospace" font-size="18" fill="var(--primary-accent)" text-anchor="middle">"elderberry"</text>

  <!-- Separator line between boxes -->
  <line x1="210" y1="112" x2="210" y2="192" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="450" y1="112" x2="450" y2="192" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="690" y1="112" x2="690" y2="192" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="930" y1="112" x2="930" y2="192" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- Negative index labels -->
  <text x="130" y="215" font-family="monospace" font-size="14" fill="var(--text-faint)" text-anchor="middle">[-5]</text>
  <text x="370" y="215" font-family="monospace" font-size="14" fill="var(--text-faint)" text-anchor="middle">[-4]</text>
  <text x="610" y="215" font-family="monospace" font-size="14" fill="var(--text-faint)" text-anchor="middle">[-3]</text>
  <text x="850" y="215" font-family="monospace" font-size="14" fill="var(--text-faint)" text-anchor="middle">[-2]</text>
  <text x="1120" y="215" font-family="monospace" font-size="14" fill="var(--text-faint)" text-anchor="middle">[-1]  (bash 4.3+)</text>

  <!-- Divider -->
  <line x1="40" y1="230" x2="1240" y2="230" stroke="var(--border)" stroke-width="2"/>

  <!-- Three columns of syntax examples -->
  <!-- Column 1: Access -->
  <rect x="40" y="244" width="380" height="340" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="40" y="244" width="380" height="40" rx="6" fill="var(--primary-accent)"/>
  <rect x="40" y="270" width="380" height="14" fill="var(--primary-accent)" rx="6"/>
  <text x="230" y="271" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Access Elements</text>
  <rect x="55" y="294" width="350" height="276" rx="6" fill="var(--code-bg)"/>
  <text x="75" y="318" font-family="monospace" font-size="13" fill="var(--text-muted)"># Single element</text>
  <text x="75" y="337" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="114" y="337" font-family="monospace" font-size="13" fill="var(--primary-accent)"> "${fruits[0]}"</text>
  <text x="75" y="352" font-family="monospace" font-size="11" fill="var(--text-muted)"># apple</text>
  <text x="75" y="372" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="114" y="372" font-family="monospace" font-size="13" fill="var(--primary-accent)"> "${fruits[-1]}"</text>
  <text x="75" y="387" font-family="monospace" font-size="11" fill="var(--text-muted)"># elderberry (last)</text>
  <text x="75" y="407" font-family="monospace" font-size="13" fill="var(--text-muted)"># All elements</text>
  <text x="75" y="426" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="114" y="426" font-family="monospace" font-size="13" fill="var(--primary-accent)"> "${fruits[@]}"</text>
  <text x="75" y="446" font-family="monospace" font-size="13" fill="var(--text-muted)"># Count</text>
  <text x="75" y="465" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="114" y="465" font-family="monospace" font-size="13" fill="var(--primary-accent)"> "${#fruits[@]}"</text>
  <text x="75" y="480" font-family="monospace" font-size="11" fill="var(--text-muted)"># 5</text>
  <text x="75" y="500" font-family="monospace" font-size="13" fill="var(--text-muted)"># All indices</text>
  <text x="75" y="519" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="114" y="519" font-family="monospace" font-size="13" fill="var(--primary-accent)"> "${!fruits[@]}"</text>
  <text x="75" y="534" font-family="monospace" font-size="11" fill="var(--text-muted)"># 0 1 2 3 4</text>
  <text x="75" y="556" font-family="monospace" font-size="13" fill="var(--text-muted)"># Iterate</text>
  <text x="75" y="556" font-family="monospace" font-size="13" fill="var(--text-muted)"># Iterate</text>
  <text x="75" y="556" font-family="monospace" font-size="13" fill="var(--ok-accent)">for</text>
  <text x="100" y="556" font-family="monospace" font-size="11" fill="var(--text-muted)"> f in "${fruits[@]}"; do echo $f; done</text>

  <!-- Column 2: Append/Modify -->
  <rect x="450" y="244" width="380" height="340" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="450" y="244" width="380" height="40" rx="6" fill="var(--ok-accent)"/>
  <rect x="450" y="270" width="380" height="14" fill="var(--ok-accent)" rx="6"/>
  <text x="640" y="271" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Append and Modify</text>
  <rect x="465" y="294" width="350" height="276" rx="6" fill="var(--code-bg)"/>
  <text x="485" y="318" font-family="monospace" font-size="13" fill="var(--text-muted)"># Append one</text>
  <text x="485" y="337" font-family="monospace" font-size="13" fill="var(--primary-accent)">fruits+=("fig")</text>
  <text x="485" y="357" font-family="monospace" font-size="13" fill="var(--text-muted)"># Append multiple</text>
  <text x="485" y="376" font-family="monospace" font-size="13" fill="var(--primary-accent)">fruits+=("grape" "kiwi")</text>
  <text x="485" y="396" font-family="monospace" font-size="13" fill="var(--text-muted)"># Modify element</text>
  <text x="485" y="415" font-family="monospace" font-size="13" fill="var(--primary-accent)">fruits[2]="CHERRY"</text>
  <text x="485" y="435" font-family="monospace" font-size="13" fill="var(--text-muted)"># Delete element (sparse)</text>
  <text x="485" y="454" font-family="monospace" font-size="13" fill="var(--ok-accent)">unset</text>
  <text x="530" y="454" font-family="monospace" font-size="13" fill="var(--primary-accent)"> 'fruits[1]'</text>
  <text x="485" y="474" font-family="monospace" font-size="13" fill="var(--text-muted)"># Delete all</text>
  <text x="485" y="493" font-family="monospace" font-size="13" fill="var(--ok-accent)">unset</text>
  <text x="530" y="493" font-family="monospace" font-size="13" fill="var(--primary-accent)"> fruits</text>
  <text x="485" y="513" font-family="monospace" font-size="13" fill="var(--text-muted)"># Prepend element</text>
  <text x="485" y="532" font-family="monospace" font-size="13" fill="var(--primary-accent)">fruits=("avocado" "${fruits[@]}")</text>
  <text x="485" y="552" font-family="monospace" font-size="13" fill="var(--text-muted)"># Sort into new array</text>
  <text x="485" y="556" font-family="monospace" font-size="11" fill="var(--primary-accent)">mapfile -t s &lt; &lt;(printf '%s\n' "${fruits[@]}" | sort)</text>

  <!-- Column 3: Slicing -->
  <rect x="860" y="244" width="380" height="340" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="860" y="244" width="380" height="40" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="860" y="270" width="380" height="14" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1050" y="271" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Slicing and Copying</text>
  <rect x="875" y="294" width="350" height="276" rx="6" fill="var(--code-bg)"/>
  <text x="895" y="318" font-family="monospace" font-size="13" fill="var(--text-muted)"># Syntax: ${arr[@]:off:len}</text>
  <text x="895" y="338" font-family="monospace" font-size="13" fill="var(--text-muted)"># From index 1, take 3:</text>
  <text x="895" y="357" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="934" y="357" font-family="monospace" font-size="13" fill="var(--primary-accent)"> "${fruits[@]:1:3}"</text>
  <text x="895" y="372" font-family="monospace" font-size="11" fill="var(--text-muted)"># banana cherry date</text>
  <text x="895" y="392" font-family="monospace" font-size="13" fill="var(--text-muted)"># From index 2 to end:</text>
  <text x="895" y="411" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="934" y="411" font-family="monospace" font-size="13" fill="var(--primary-accent)"> "${fruits[@]:2}"</text>
  <text x="895" y="426" font-family="monospace" font-size="11" fill="var(--text-muted)"># cherry date elderberry</text>
  <text x="895" y="446" font-family="monospace" font-size="13" fill="var(--text-muted)"># Last 2 elements:</text>
  <text x="895" y="465" font-family="monospace" font-size="13" fill="var(--ok-accent)">echo</text>
  <text x="934" y="465" font-family="monospace" font-size="13" fill="var(--primary-accent)"> "${fruits[@]:(-2)}"</text>
  <text x="895" y="480" font-family="monospace" font-size="11" fill="var(--text-muted)"># date elderberry</text>
  <text x="895" y="500" font-family="monospace" font-size="13" fill="var(--text-muted)"># Copy entire array:</text>
  <text x="895" y="519" font-family="monospace" font-size="13" fill="var(--primary-accent)">copy=("${fruits[@]}")</text>
  <text x="895" y="539" font-family="monospace" font-size="13" fill="var(--text-muted)"># Merge two arrays:</text>
  <text x="895" y="558" font-family="monospace" font-size="13" fill="var(--primary-accent)">m=("${a[@]}" "${b[@]}")</text>
</svg>

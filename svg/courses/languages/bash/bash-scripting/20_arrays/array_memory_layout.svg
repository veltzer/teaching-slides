<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--surface)" rx="6" x="40" y="40"/>

  <!-- Array declaration -->
  <rect x="77.5" y="58.125" width="1125" height="47.125" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="105.625" y="87.125" font-family="monospace" font-size="20.2783" fill="var(--ok-accent)">fruits</text>
  <text x="178.75" y="87.125" font-family="monospace" font-size="20.2783" fill="var(--primary-accent)">=(</text>
  <text x="206.875" y="87.125" font-family="monospace" font-size="20.2783" fill="var(--warn-accent)">"apple"</text>
  <text x="308.125" y="87.125" font-family="monospace" font-size="20.2783" fill="var(--warn-accent)"> "banana"</text>
  <text x="446.875" y="87.125" font-family="monospace" font-size="20.2783" fill="var(--warn-accent)"> "cherry"</text>
  <text x="587.5" y="87.125" font-family="monospace" font-size="20.2783" fill="var(--warn-accent)"> "date"</text>
  <text x="677.5" y="87.125" font-family="monospace" font-size="20.2783" fill="var(--warn-accent)"> "elderberry"</text>
  <text x="865" y="87.125" font-family="monospace" font-size="20.2783" fill="var(--primary-accent)">)</text>

  <!-- Memory layout boxes -->
  <!-- Index labels -->
  <text x="161.875" y="135.1562" font-family="monospace" font-size="16.5914" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[0]</text>
  <text x="386.875" y="135.1562" font-family="monospace" font-size="16.5914" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[1]</text>
  <text x="611.875" y="135.1562" font-family="monospace" font-size="16.5914" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[2]</text>
  <text x="836.875" y="135.1562" font-family="monospace" font-size="16.5914" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[3]</text>
  <text x="1061.875" y="135.1562" font-family="monospace" font-size="16.5914" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">[4]</text>

  <!-- Index boxes -->
  <rect x="86.875" y="141.5" width="150" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="89.6875" y="144.2188" width="144.375" height="67.0625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="161.875" y="186.8125" font-family="monospace" font-size="18.4349" fill="var(--primary-accent)" text-anchor="middle">"apple"</text>

  <rect x="311.875" y="141.5" width="150" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="314.6875" y="144.2188" width="144.375" height="67.0625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="386.875" y="186.8125" font-family="monospace" font-size="18.4349" fill="var(--primary-accent)" text-anchor="middle">"banana"</text>

  <rect x="536.875" y="141.5" width="150" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="539.6875" y="144.2188" width="144.375" height="67.0625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="611.875" y="186.8125" font-family="monospace" font-size="18.4349" fill="var(--primary-accent)" text-anchor="middle">"cherry"</text>

  <rect x="761.875" y="141.5" width="150" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="764.6875" y="144.2188" width="144.375" height="67.0625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="836.875" y="186.8125" font-family="monospace" font-size="18.4349" fill="var(--primary-accent)" text-anchor="middle">"date"</text>

  <rect x="986.875" y="141.5" width="206.25" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="989.6875" y="144.2188" width="200.625" height="67.0625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1090" y="186.8125" font-family="monospace" font-size="16.5914" fill="var(--primary-accent)" text-anchor="middle">"elderberry"</text>

  <!-- Separator line between boxes -->
  <line x1="236.875" y1="141.5" x2="236.875" y2="214" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="461.875" y1="141.5" x2="461.875" y2="214" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="686.875" y1="141.5" x2="686.875" y2="214" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="911.875" y1="141.5" x2="911.875" y2="214" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- Negative index labels -->
  <text x="161.875" y="234.8438" font-family="monospace" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">[-5]</text>
  <text x="386.875" y="234.8438" font-family="monospace" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">[-4]</text>
  <text x="611.875" y="234.8438" font-family="monospace" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">[-3]</text>
  <text x="836.875" y="234.8438" font-family="monospace" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">[-2]</text>
  <text x="1090" y="234.8438" font-family="monospace" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">[-1]  (bash 4.3+)</text>

  <!-- Divider -->
  <line x1="77.5" y1="248.4375" x2="1202.5" y2="248.4375" stroke="var(--border)" stroke-width="2"/>

  <!-- Three columns of syntax examples -->
  <!-- Column 1: Access -->
  <rect x="77.5" y="261.125" width="356.25" height="308.125" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="77.5" y="261.125" width="356.25" height="36.25" rx="6" fill="var(--primary-accent)"/>
  <rect x="77.5" y="284.6875" width="356.25" height="12.6875" fill="var(--primary-accent)" rx="6"/>
  <text x="255.625" y="285.5938" font-family="sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">Access Elements</text>
  <rect x="91.5625" y="306.4375" width="328.125" height="250.125" rx="6" fill="var(--code-bg)"/>
  <text x="110.3125" y="328.1875" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Single element</text>
  <text x="110.3125" y="345.4062" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="146.875" y="345.4062" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> "${fruits[0]}"</text>
  <text x="110.3125" y="359" font-family="monospace" font-size="10.1392" fill="var(--text-muted)"># apple</text>
  <text x="110.3125" y="377.125" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="146.875" y="377.125" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> "${fruits[-1]}"</text>
  <text x="110.3125" y="390.7188" font-family="monospace" font-size="10.1392" fill="var(--text-muted)"># elderberry (last)</text>
  <text x="110.3125" y="408.8438" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># All elements</text>
  <text x="110.3125" y="426.0625" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="146.875" y="426.0625" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> "${fruits[@]}"</text>
  <text x="110.3125" y="444.1875" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Count</text>
  <text x="110.3125" y="461.4062" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="146.875" y="461.4062" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> "${#fruits[@]}"</text>
  <text x="110.3125" y="475" font-family="monospace" font-size="10.1392" fill="var(--text-muted)"># 5</text>
  <text x="110.3125" y="493.125" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># All indices</text>
  <text x="110.3125" y="510.3438" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="146.875" y="510.3438" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> "${!fruits[@]}"</text>
  <text x="110.3125" y="523.9375" font-family="monospace" font-size="10.1392" fill="var(--text-muted)"># 0 1 2 3 4</text>
  <text x="110.3125" y="543.875" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Iterate</text>
  <text x="110.3125" y="543.875" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Iterate</text>
  <text x="110.3125" y="543.875" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">for</text>
  <text x="133.75" y="543.875" font-family="monospace" font-size="10.1392" fill="var(--text-muted)"> f in "${fruits[@]}"; do echo $f; done</text>

  <!-- Column 2: Append/Modify -->
  <rect x="461.875" y="261.125" width="356.25" height="308.125" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="461.875" y="261.125" width="356.25" height="36.25" rx="6" fill="var(--ok-accent)"/>
  <rect x="461.875" y="284.6875" width="356.25" height="12.6875" fill="var(--ok-accent)" rx="6"/>
  <text x="640" y="285.5938" font-family="sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">Append and Modify</text>
  <rect x="475.9375" y="306.4375" width="328.125" height="250.125" rx="6" fill="var(--code-bg)"/>
  <text x="494.6875" y="328.1875" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Append one</text>
  <text x="494.6875" y="345.4062" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">fruits+=("fig")</text>
  <text x="494.6875" y="363.5312" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Append multiple</text>
  <text x="494.6875" y="380.75" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">fruits+=("grape" "kiwi")</text>
  <text x="494.6875" y="398.875" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Modify element</text>
  <text x="494.6875" y="416.0938" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">fruits[2]="CHERRY"</text>
  <text x="494.6875" y="434.2188" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Delete element (sparse)</text>
  <text x="494.6875" y="451.4375" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">unset</text>
  <text x="536.875" y="451.4375" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> 'fruits[1]'</text>
  <text x="494.6875" y="469.5625" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Delete all</text>
  <text x="494.6875" y="486.7812" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">unset</text>
  <text x="536.875" y="486.7812" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> fruits</text>
  <text x="494.6875" y="504.9062" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Prepend element</text>
  <text x="494.6875" y="522.125" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">fruits=("avocado" "${fruits[@]}")</text>
  <text x="494.6875" y="540.25" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Sort into new array</text>
  <text x="494.6875" y="543.875" font-family="monospace" font-size="10.1392" fill="var(--primary-accent)">mapfile -t s &lt; &lt;(printf '%s\n' "${fruits[@]}" | sort)</text>

  <!-- Column 3: Slicing -->
  <rect x="846.25" y="261.125" width="356.25" height="308.125" rx="6" fill="var(--bg)" filter="url(#shadow)"/>
  <rect x="846.25" y="261.125" width="356.25" height="36.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="846.25" y="284.6875" width="356.25" height="12.6875" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1024.375" y="285.5938" font-family="sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">Slicing and Copying</text>
  <rect x="860.3125" y="306.4375" width="328.125" height="250.125" rx="6" fill="var(--code-bg)"/>
  <text x="879.0625" y="328.1875" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Syntax: ${arr[@]:off:len}</text>
  <text x="879.0625" y="346.3125" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># From index 1, take 3:</text>
  <text x="879.0625" y="363.5312" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="915.625" y="363.5312" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> "${fruits[@]:1:3}"</text>
  <text x="879.0625" y="377.125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)"># banana cherry date</text>
  <text x="879.0625" y="395.25" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># From index 2 to end:</text>
  <text x="879.0625" y="412.4688" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="915.625" y="412.4688" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> "${fruits[@]:2}"</text>
  <text x="879.0625" y="426.0625" font-family="monospace" font-size="10.1392" fill="var(--text-muted)"># cherry date elderberry</text>
  <text x="879.0625" y="444.1875" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Last 2 elements:</text>
  <text x="879.0625" y="461.4062" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo</text>
  <text x="915.625" y="461.4062" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)"> "${fruits[@]:(-2)}"</text>
  <text x="879.0625" y="475" font-family="monospace" font-size="10.1392" fill="var(--text-muted)"># date elderberry</text>
  <text x="879.0625" y="493.125" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Copy entire array:</text>
  <text x="879.0625" y="510.3438" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">copy=("${fruits[@]}")</text>
  <text x="879.0625" y="528.4688" font-family="monospace" font-size="11.9827" fill="var(--text-muted)"># Merge two arrays:</text>
  <text x="879.0625" y="545.6875" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">m=("${a[@]}" "${b[@]}")</text>
</svg>

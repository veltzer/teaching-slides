<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43a047"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#e53935"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- LEFT: Flowchart -->
  <!-- Start -->
  <rect x="40" y="20" width="680" height="610" rx="12" fill="#f9f9f9" filter="url(#shadow)"/>
  <text x="380" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0" text-anchor="middle">if / elif / else Flow</text>

  <!-- if condition diamond -->
  <polygon points="380,70 480,120 380,170 280,120" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="380" y="116" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">if condition</text>
  <text x="380" y="132" font-family="monospace" font-size="12" fill="#bbdefb" text-anchor="middle">return code == 0?</text>

  <!-- True branch (right) -->
  <line x1="480" y1="120" x2="580" y2="120" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="113" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle">true (rc=0)</text>

  <rect x="580" y="95" width="120" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="117" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">then block</text>
  <text x="640" y="135" font-family="monospace" font-size="11" fill="#2e7d32" text-anchor="middle">executes</text>

  <!-- False branch down -->
  <line x1="380" y1="170" x2="380" y2="210" stroke="#e53935" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="393" y="195" font-family="Arial, sans-serif" font-size="13" fill="#e53935">false</text>

  <!-- elif diamond -->
  <polygon points="380,210 480,260 380,310 280,260" fill="#f57c00" filter="url(#shadow)"/>
  <text x="380" y="256" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">elif condition</text>
  <text x="380" y="272" font-family="monospace" font-size="12" fill="#fff3e0" text-anchor="middle">return code == 0?</text>

  <!-- elif true branch -->
  <line x1="480" y1="260" x2="580" y2="260" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="253" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle">true</text>

  <rect x="580" y="235" width="120" height="50" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="257" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e65100" text-anchor="middle">elif block</text>
  <text x="640" y="275" font-family="monospace" font-size="11" fill="#f57c00" text-anchor="middle">executes</text>

  <!-- elif false branch -->
  <line x1="380" y1="310" x2="380" y2="350" stroke="#e53935" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="393" y="335" font-family="Arial, sans-serif" font-size="13" fill="#e53935">false</text>

  <!-- (can have many elif) -->
  <text x="150" y="370" font-family="Arial, sans-serif" font-size="13" fill="#999999" font-style="italic">... more elif (optional) ...</text>
  <line x1="380" y1="350" x2="380" y2="395" stroke="#999999" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- else box -->
  <rect x="280" y="395" width="200" height="60" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b71c1c" text-anchor="middle">else block</text>
  <text x="380" y="440" font-family="Arial, sans-serif" font-size="12" fill="#e53935" text-anchor="middle">(optional fallback)</text>

  <!-- merge lines -->
  <line x1="640" y1="145" x2="640" y2="480" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="640" y1="285" x2="640" y2="480" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="380" y1="455" x2="380" y2="480" stroke="#555555" stroke-width="1.5"/>
  <line x1="380" y1="480" x2="640" y2="480" stroke="#555555" stroke-width="1.5"/>
  <line x1="640" y1="480" x2="640" y2="510" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- fi / end box -->
  <rect x="565" y="510" width="150" height="50" rx="8" fill="#333333" filter="url(#shadow)"/>
  <text x="640" y="540" font-family="monospace" font-size="18" font-weight="bold" fill="#a5d6a7" text-anchor="middle">fi</text>

  <!-- Arrow to continue -->
  <line x1="640" y1="560" x2="640" y2="590" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="565" y="590" width="150" height="45" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="640" y="618" font-family="Arial, sans-serif" font-size="14" fill="#1565c0" text-anchor="middle">Continue script</text>

  <!-- RIGHT: Syntax reference -->
  <rect x="740" y="20" width="510" height="610" rx="12" fill="#f9f9f9" filter="url(#shadow)"/>
  <text x="995" y="48" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1565c0" text-anchor="middle">Syntax Reference</text>

  <!-- Basic if -->
  <rect x="760" y="58" width="470" height="118" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="780" y="78" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b5e20">Basic if</text>
  <text x="780" y="98" font-family="monospace" font-size="13" fill="#333333">if command; then</text>
  <text x="800" y="116" font-family="monospace" font-size="13" fill="#333333">  echo "success"</text>
  <text x="780" y="134" font-family="monospace" font-size="13" fill="#333333">fi</text>
  <text x="780" y="152" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">0 = true, non-zero = false. Works with ANY command.</text>

  <!-- if/elif/else -->
  <rect x="760" y="184" width="470" height="148" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="780" y="202" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0d47a1">if / elif / else</text>
  <text x="780" y="220" font-family="monospace" font-size="12" fill="#333333">if [ "$1" = "start" ]; then</text>
  <text x="800" y="237" font-family="monospace" font-size="12" fill="#333333">  start_service</text>
  <text x="780" y="254" font-family="monospace" font-size="12" fill="#333333">elif [ "$1" = "stop" ]; then</text>
  <text x="800" y="271" font-family="monospace" font-size="12" fill="#333333">  stop_service</text>
  <text x="780" y="288" font-family="monospace" font-size="12" fill="#333333">else</text>
  <text x="800" y="305" font-family="monospace" font-size="12" fill="#333333">  echo "Usage..."</text>
  <text x="780" y="322" font-family="monospace" font-size="12" fill="#333333">fi</text>

  <!-- [ ] vs [[ ]] -->
  <rect x="760" y="340" width="470" height="148" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="1"/>
  <text x="780" y="360" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e65100">[ ] vs [[ ]] — test commands</text>
  <text x="780" y="380" font-family="monospace" font-size="12" fill="#333333">[ "$f" = "foo" ]    # POSIX, word-splits</text>
  <text x="780" y="398" font-family="monospace" font-size="12" fill="#333333">[[ $f = "foo" ]]    # bash, safer</text>
  <text x="780" y="416" font-family="monospace" font-size="12" fill="#333333">[[ $f == *.txt ]]   # glob patterns</text>
  <text x="780" y="434" font-family="monospace" font-size="12" fill="#333333">[[ $f =~ ^[0-9]+$ ]] # regex</text>
  <text x="780" y="452" font-family="monospace" font-size="12" fill="#333333">(( x > 0 ))         # arithmetic</text>
  <text x="780" y="470" font-family="monospace" font-size="12" fill="#333333">command             # any command's rc</text>

  <!-- Negation + chaining -->
  <rect x="760" y="496" width="470" height="112" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="1"/>
  <text x="780" y="516" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b71c1c">Negation &amp; Short-circuit</text>
  <text x="780" y="536" font-family="monospace" font-size="12" fill="#333333">if ! grep -q "error" log; then</text>
  <text x="780" y="554" font-family="monospace" font-size="12" fill="#333333">mkdir /tmp/dir &amp;&amp; echo "created"</text>
  <text x="780" y="572" font-family="monospace" font-size="12" fill="#333333">mkdir /tmp/dir || echo "failed"</text>
  <text x="780" y="590" font-family="Arial, sans-serif" font-size="11" fill="#e53935">! negates return code; &amp;&amp; / || chain on rc</text>
</svg>

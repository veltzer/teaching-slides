<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43a047"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#e53935"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- LEFT: Flowchart -->
  <!-- Start -->
  <rect x="40" y="20" width="680" height="610" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="380" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">if / elif / else Flow</text>

  <!-- if condition diamond -->
  <polygon points="380,70 480,120 380,170 280,120" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="380" y="116" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">if condition</text>
  <text x="380" y="132" font-family="monospace" font-size="12" fill="var(--primary-accent)" text-anchor="middle">return code == 0?</text>

  <!-- True branch (right) -->
  <line x1="480" y1="120" x2="580" y2="120" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="113" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)" text-anchor="middle">true (rc=0)</text>

  <rect x="580" y="95" width="120" height="50" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="117" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">then block</text>
  <text x="640" y="135" font-family="monospace" font-size="11" fill="var(--ok-accent)" text-anchor="middle">executes</text>

  <!-- False branch down -->
  <line x1="380" y1="170" x2="380" y2="210" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="393" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-accent)">false</text>

  <!-- elif diamond -->
  <polygon points="380,210 480,260 380,310 280,260" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="380" y="256" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">elif condition</text>
  <text x="380" y="272" font-family="monospace" font-size="12" fill="var(--warn-accent)" text-anchor="middle">return code == 0?</text>

  <!-- elif true branch -->
  <line x1="480" y1="260" x2="580" y2="260" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="253" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)" text-anchor="middle">true</text>

  <rect x="580" y="235" width="120" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="257" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">elif block</text>
  <text x="640" y="275" font-family="monospace" font-size="11" fill="var(--warn-accent)" text-anchor="middle">executes</text>

  <!-- elif false branch -->
  <line x1="380" y1="310" x2="380" y2="350" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="393" y="335" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-accent)">false</text>

  <!-- (can have many elif) -->
  <text x="150" y="370" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" font-style="italic">... more elif (optional) ...</text>
  <line x1="380" y1="350" x2="380" y2="395" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- else box -->
  <rect x="280" y="395" width="200" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">else block</text>
  <text x="380" y="440" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-accent)" text-anchor="middle">(optional fallback)</text>

  <!-- merge lines -->
  <line x1="640" y1="145" x2="640" y2="480" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="640" y1="285" x2="640" y2="480" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="380" y1="455" x2="380" y2="480" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="380" y1="480" x2="640" y2="480" stroke="var(--text-muted)" stroke-width="1.5"/>
  <line x1="640" y1="480" x2="640" y2="510" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- fi / end box -->
  <rect x="565" y="510" width="150" height="50" rx="6" fill="var(--text)" filter="url(#shadow)"/>
  <text x="640" y="540" font-family="monospace" font-size="18" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">fi</text>

  <!-- Arrow to continue -->
  <line x1="640" y1="560" x2="640" y2="590" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="565" y="590" width="150" height="45" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="618" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)" text-anchor="middle">Continue script</text>

  <!-- RIGHT: Syntax reference -->
  <rect x="740" y="20" width="510" height="610" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="995" y="48" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Syntax Reference</text>

  <!-- Basic if -->
  <rect x="760" y="58" width="470" height="118" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780" y="78" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Basic if</text>
  <text x="780" y="98" font-family="monospace" font-size="13" fill="var(--text)">if command; then</text>
  <text x="800" y="116" font-family="monospace" font-size="13" fill="var(--text)">  echo "success"</text>
  <text x="780" y="134" font-family="monospace" font-size="13" fill="var(--text)">fi</text>
  <text x="780" y="152" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">0 = true, non-zero = false. Works with ANY command.</text>

  <!-- if/elif/else -->
  <rect x="760" y="184" width="470" height="148" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="780" y="202" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">if / elif / else</text>
  <text x="780" y="220" font-family="monospace" font-size="12" fill="var(--text)">if [ "$1" = "start" ]; then</text>
  <text x="800" y="237" font-family="monospace" font-size="12" fill="var(--text)">  start_service</text>
  <text x="780" y="254" font-family="monospace" font-size="12" fill="var(--text)">elif [ "$1" = "stop" ]; then</text>
  <text x="800" y="271" font-family="monospace" font-size="12" fill="var(--text)">  stop_service</text>
  <text x="780" y="288" font-family="monospace" font-size="12" fill="var(--text)">else</text>
  <text x="800" y="305" font-family="monospace" font-size="12" fill="var(--text)">  echo "Usage..."</text>
  <text x="780" y="322" font-family="monospace" font-size="12" fill="var(--text)">fi</text>

  <!-- [ ] vs [[ ]] -->
  <rect x="760" y="340" width="470" height="148" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="780" y="360" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)">[ ] vs [[ ]] — test commands</text>
  <text x="780" y="380" font-family="monospace" font-size="12" fill="var(--text)">[ "$f" = "foo" ]    # POSIX, word-splits</text>
  <text x="780" y="398" font-family="monospace" font-size="12" fill="var(--text)">[[ $f = "foo" ]]    # bash, safer</text>
  <text x="780" y="416" font-family="monospace" font-size="12" fill="var(--text)">[[ $f == *.txt ]]   # glob patterns</text>
  <text x="780" y="434" font-family="monospace" font-size="12" fill="var(--text)">[[ $f =~ ^[0-9]+$ ]] # regex</text>
  <text x="780" y="452" font-family="monospace" font-size="12" fill="var(--text)">(( x > 0 ))         # arithmetic</text>
  <text x="780" y="470" font-family="monospace" font-size="12" fill="var(--text)">command             # any command's rc</text>

  <!-- Negation + chaining -->
  <rect x="760" y="496" width="470" height="112" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="780" y="516" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)">Negation &amp; Short-circuit</text>
  <text x="780" y="536" font-family="monospace" font-size="12" fill="var(--text)">if ! grep -q "error" log; then</text>
  <text x="780" y="554" font-family="monospace" font-size="12" fill="var(--text)">mkdir /tmp/dir &amp;&amp; echo "created"</text>
  <text x="780" y="572" font-family="monospace" font-size="12" fill="var(--text)">mkdir /tmp/dir || echo "failed"</text>
  <text x="780" y="590" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)">! negates return code; &amp;&amp; / || chain on rc</text>
</svg>

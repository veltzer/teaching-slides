<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <!-- User layer -->
  <rect x="40" y="40" width="221.848739" height="77.333333" rx="7.421069" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150.92437" y="87.68896" font-family="Arial, sans-serif" font-size="22.801112" fill="var(--bg)" text-anchor="middle" font-weight="bold">User / Developer</text>

  <!-- Arrow user to interactive shell -->
  <line x1="150.92437" y1="117.333333" x2="150.92437" y2="175.333404" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="161.008403" y="156" font-family="Arial, sans-serif" font-size="14.820741" fill="var(--text-muted)">types commands</text>

  <!-- Interactive shell box -->
  <rect x="40" y="175.333404" width="221.848739" height="83.777707" rx="7.421069" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="150.92437" y="210.133333" font-family="monospace" font-size="19.380864" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Interactive Shell</text>
  <text x="150.92437" y="243.644444" font-family="monospace" font-size="14.820741" fill="var(--text-muted)" text-anchor="middle">bash prompt (REPL)</text>

  <!-- Script file box -->
  <rect x="332.436975" y="40" width="221.848739" height="77.333333" rx="7.421069" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="443.361345" y="87.68896" font-family="Arial, sans-serif" font-size="22.801112" fill="var(--bg)" text-anchor="middle" font-weight="bold">Script File (.sh)</text>

  <!-- Arrow script to shell interpreter -->
  <line x1="443.361345" y1="117.333333" x2="443.361345" y2="175.333404" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="453.445378" y="156" font-family="Arial, sans-serif" font-size="14.820741" fill="var(--text-muted)">interpreted by</text>

  <!-- Shell interpreter box -->
  <rect x="332.436975" y="175.333404" width="221.848739" height="83.777707" rx="7.421069" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="443.361345" y="210.133333" font-family="monospace" font-size="19.380864" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Shell Interpreter</text>
  <text x="443.361345" y="243.644444" font-family="monospace" font-size="14.820741" fill="var(--text-muted)" text-anchor="middle">parses and executes</text>

  <!-- Both shells merge to commands -->
  <line x1="150.92437" y1="259.111111" x2="150.92437" y2="336.444444" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="443.361345" y1="259.111111" x2="443.361345" y2="336.444444" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="150.92437" y1="336.444444" x2="443.361345" y2="336.444444" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="297.142857" y1="336.444444" x2="297.142857" y2="381.555627" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Commands layer -->
  <rect x="161.008403" y="381.555627" width="272.268908" height="83.777707" rx="7.421069" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="297.142857" y="416.355556" font-family="monospace" font-size="19.380864" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Built-in Commands</text>
  <text x="297.142857" y="449.866667" font-family="monospace" font-size="14.820741" fill="var(--text-muted)" text-anchor="middle">cd, echo, read, export</text>

  <!-- External commands box -->
  <rect x="493.781513" y="381.555627" width="272.268908" height="83.777707" rx="7.421069" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="629.915966" y="416.355556" font-family="monospace" font-size="19.380864" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">External Commands</text>
  <text x="629.915966" y="449.866667" font-family="monospace" font-size="14.820741" fill="var(--text-muted)" text-anchor="middle">ls, grep, awk, curl</text>

  <!-- Arrow from commands to OS -->
  <line x1="297.142857" y1="465.333333" x2="297.142857" y2="536.222293" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="629.915966" y1="465.333333" x2="629.915966" y2="536.222293" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OS / Kernel box spanning full width -->
  <rect x="100.504202" y="536.222293" width="826.890756" height="83.777707" rx="7.421069" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="513.94958" y="571.022222" font-family="Arial, sans-serif" font-size="22.801112" fill="var(--bg)" text-anchor="middle" font-weight="bold">Operating System Kernel</text>
  <text x="513.94958" y="601.955556" font-family="Arial, sans-serif" font-size="15.960741" fill="var(--ok-accent)" text-anchor="middle">process management, file system, networking, signals</text>

  <!-- Shebang note box on right -->
  <rect x="806.386555" y="40" width="433.613445" height="199.777849" rx="7.421069" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1023.193277" y="76.088889" font-family="monospace" font-size="18.240865" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Key Script Concepts</text>
  <text x="826.554622" y="110.888818" font-family="monospace" font-size="15.960741" fill="var(--text-muted)">shebang:  #!/bin/bash</text>
  <text x="826.554622" y="143.111111" font-family="monospace" font-size="15.960741" fill="var(--text-muted)">make executable: chmod +x</text>
  <text x="826.554622" y="175.333404" font-family="monospace" font-size="15.960741" fill="var(--text-muted)">run: ./myscript.sh</text>
  <text x="826.554622" y="207.555556" font-family="monospace" font-size="15.960741" fill="var(--text-muted)">or:  bash myscript.sh</text>

  <!-- Environment / variables note -->
  <rect x="806.386555" y="272" width="433.613445" height="141.777778" rx="7.421069" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1023.193277" y="308.088889" font-family="Arial, sans-serif" font-size="18.240865" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Script vs Interactive Differences</text>
  <text x="826.554622" y="340.311182" font-family="Arial, sans-serif" font-size="14.820741" fill="var(--text-muted)">- Scripts run in a subshell (child process)</text>
  <text x="826.554622" y="366.08896" font-family="Arial, sans-serif" font-size="14.820741" fill="var(--text-muted)">- No interactive prompts by default</text>
  <text x="826.554622" y="391.866738" font-family="Arial, sans-serif" font-size="14.820741" fill="var(--text-muted)">- Uses exit codes to signal success/failure</text>

  <!-- stdin/stdout/stderr note -->
  <rect x="806.386555" y="445.999929" width="433.613445" height="141.777778" rx="7.421069" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1023.193277" y="482.088818" font-family="Arial, sans-serif" font-size="18.240865" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Standard I/O Streams</text>
  <text x="826.554622" y="514.311111" font-family="monospace" font-size="14.820741" fill="var(--text-muted)">stdin  (fd 0) - input</text>
  <text x="826.554622" y="540.088889" font-family="monospace" font-size="14.820741" fill="var(--text-muted)">stdout (fd 1) - normal output</text>
  <text x="826.554622" y="565.866667" font-family="monospace" font-size="14.820741" fill="var(--text-muted)">stderr (fd 2) - error output</text>
</svg>

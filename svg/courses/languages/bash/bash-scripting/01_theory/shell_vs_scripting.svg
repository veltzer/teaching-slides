<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534586728656" font-weight="bold" fill="var(--text)">Shell vs Scripting</text>

  <rect x="40" y="71.351351351351" width="240" height="73.153153153153" rx="8.178195576219" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="115.243243243243" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--primary-text)">User</text>

  <line x1="160" y1="144.504504504504" x2="160" y2="186.306306306306" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="191.531531531532" width="240" height="83.603603603604" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="160" y="226.018018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--primary-accent)">Interactive Shell</text>
  <text x="160" y="254.234234234234" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--text-muted)">bash REPL</text>

  <rect x="330" y="71.351351351351" width="240" height="73.153153153153" rx="8.178195576219" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="115.243243243243" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--warn-text)">Script (.sh)</text>

  <line x1="450" y1="144.504504504504" x2="450" y2="186.306306306306" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="191.531531531532" width="240" height="83.603603603604" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="450" y="226.018018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--primary-accent)">Shell Interpreter</text>
  <text x="450" y="254.234234234234" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">parses, executes</text>

  <line x1="160" y1="275.135135135135" x2="160" y2="343.063063063063" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="450" y1="275.135135135135" x2="450" y2="343.063063063063" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="160" y1="343.063063063063" x2="450" y2="343.063063063063" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="305" y1="343.063063063063" x2="305" y2="384.864864864865" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="390.09009009009" width="230" height="78.378378378378" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="185" y="421.441441441441" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--primary-accent)">Built-in</text>
  <text x="185" y="447.567567567568" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--text-muted)">cd, echo, export</text>

  <rect x="310" y="390.09009009009" width="260" height="78.378378378378" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="440" y="421.441441441441" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--warn-accent)">External</text>
  <text x="440" y="447.567567567568" text-anchor="middle" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--text-muted)">ls, grep, awk</text>

  <line x1="185" y1="468.468468468468" x2="185" y2="531.171171171171" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="468.468468468468" x2="440" y2="531.171171171171" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="536.396396396396" width="750" height="83.603603603604" rx="8.178195576219" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="435" y="572.972972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--ok-text)">OS Kernel</text>
  <text x="435" y="601.189189189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">processes, files, networking</text>

  <rect x="830" y="71.351351351351" width="410" height="188.108108108108" rx="10.222744470273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="107.927927927928" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--warn-text)">Script Basics</text>
  <text x="850" y="139.279279279279" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--warn-text)">#!/bin/bash</text>
  <text x="850" y="170.630630630631" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--warn-text)">chmod +x</text>
  <text x="850" y="201.981981981982" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--warn-text)">./script.sh</text>
  <text x="850" y="233.333333333333" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--warn-text)">bash script.sh</text>

  <rect x="830" y="275.135135135135" width="410" height="161.981981981982" rx="10.222744470273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="306.486486486486" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--ok-text)">Script vs Interactive</text>
  <text x="850" y="337.837837837838" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">Runs in subshell</text>
  <text x="850" y="366.054054054054" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">No prompts</text>
  <text x="850" y="394.27027027027" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">Exit codes signal</text>

  <rect x="830" y="452.792792792793" width="410" height="167.207207207207" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="484.144144144144" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--primary-text)">Standard Streams</text>
  <text x="850" y="515.495495495496" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--primary-text)">stdin  (0)</text>
  <text x="850" y="543.711711711712" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--primary-text)">stdout (1)</text>
  <text x="850" y="571.927927927928" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--primary-text)">stderr (2)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="240" height="77.333333333333" rx="8.408612364996" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="86.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.919377821241" font-weight="bold" fill="var(--primary-text)">User</text>

  <line x1="160" y1="117.333333333333" x2="160" y2="161.52380952381" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="167.04761904762" width="240" height="88.380952380953" rx="8.408612364996" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="160" y="203.504761904762" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.919377821241" font-weight="bold" fill="var(--primary-accent)">Interactive Shell</text>
  <text x="160" y="233.333333333333" text-anchor="middle" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--text-muted)">bash REPL</text>

  <rect x="330" y="40" width="240" height="77.333333333333" rx="8.408612364996" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="86.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.919377821241" font-weight="bold" fill="var(--warn-text)">Script (.sh)</text>

  <line x1="450" y1="117.333333333333" x2="450" y2="161.52380952381" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="167.04761904762" width="240" height="88.380952380953" rx="8.408612364996" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="450" y="203.504761904762" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.919377821241" font-weight="bold" fill="var(--primary-accent)">Shell Interpreter</text>
  <text x="450" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--text-muted)">parses, executes</text>

  <line x1="160" y1="255.428571428572" x2="160" y2="327.238095238095" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="450" y1="255.428571428572" x2="450" y2="327.238095238095" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="160" y1="327.238095238095" x2="450" y2="327.238095238095" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="305" y1="327.238095238095" x2="305" y2="371.428571428572" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="376.952380952381" width="230" height="82.857142857142" rx="8.408612364996" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="185" y="410.095238095238" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.817224729991" font-weight="bold" fill="var(--primary-accent)">Built-in</text>
  <text x="185" y="437.714285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="13.663995093118" fill="var(--text-muted)">cd, echo, export</text>

  <rect x="310" y="376.952380952381" width="260" height="82.857142857142" rx="8.408612364996" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="440" y="410.095238095238" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.817224729991" font-weight="bold" fill="var(--warn-accent)">External</text>
  <text x="440" y="437.714285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="13.663995093118" fill="var(--text-muted)">ls, grep, awk</text>

  <line x1="185" y1="459.809523809523" x2="185" y2="526.095238095238" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="459.809523809523" x2="440" y2="526.095238095238" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="531.619047619047" width="750" height="88.380952380953" rx="8.408612364996" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="435" y="570.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.919377821241" font-weight="bold" fill="var(--ok-text)">OS Kernel</text>
  <text x="435" y="600.114285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--ok-text)">processes, files, networking</text>

  <rect x="830" y="40" width="410" height="198.857142857143" rx="10.510765456245" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="78.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.868301275617" font-weight="bold" fill="var(--warn-text)">Script Basics</text>
  <text x="850" y="111.809523809524" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--warn-text)">#!/bin/bash</text>
  <text x="850" y="144.952380952382" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--warn-text)">chmod +x</text>
  <text x="850" y="178.095238095238" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--warn-text)">./script.sh</text>
  <text x="850" y="211.238095238095" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--warn-text)">bash script.sh</text>

  <rect x="830" y="255.428571428572" width="410" height="171.238095238095" rx="10.510765456245" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="288.571428571428" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.817224729991" font-weight="bold" fill="var(--ok-text)">Script vs Interactive</text>
  <text x="850" y="321.714285714286" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--ok-text)">Runs in subshell</text>
  <text x="850" y="351.542857142857" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--ok-text)">No prompts</text>
  <text x="850" y="381.371428571428" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--ok-text)">Exit codes signal</text>

  <rect x="830" y="443.238095238096" width="410" height="176.761904761904" rx="10.510765456245" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="476.380952380952" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.817224729991" font-weight="bold" fill="var(--primary-text)">Standard Streams</text>
  <text x="850" y="509.52380952381" font-family="Courier New, monospace" font-size="13.663995093118" fill="var(--primary-text)">stdin  (0)</text>
  <text x="850" y="539.352380952381" font-family="Courier New, monospace" font-size="13.663995093118" fill="var(--primary-text)">stdout (1)</text>
  <text x="850" y="569.180952380952" font-family="Courier New, monospace" font-size="13.663995093118" fill="var(--primary-text)">stderr (2)</text>
</svg>

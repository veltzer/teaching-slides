<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- User layer -->
  <rect x="77.5" y="67.1875" width="206.25" height="54.375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180.625" y="100.7188" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--bg)" text-anchor="middle" font-weight="bold">User / Developer</text>

  <!-- Arrow user to interactive shell -->
  <line x1="180.625" y1="121.5625" x2="180.625" y2="162.3438" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="148.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">types commands</text>

  <!-- Interactive shell box -->
  <rect x="77.5" y="162.3438" width="206.25" height="58.9062" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="180.625" y="186.8125" font-family="monospace" font-size="15.6696" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Interactive Shell</text>
  <text x="180.625" y="210.375" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">bash prompt (REPL)</text>

  <!-- Script file box -->
  <rect x="349.375" y="67.1875" width="206.25" height="54.375" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="452.5" y="100.7188" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--bg)" text-anchor="middle" font-weight="bold">Script File (.sh)</text>

  <!-- Arrow script to shell interpreter -->
  <line x1="452.5" y1="121.5625" x2="452.5" y2="162.3438" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="461.875" y="148.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">interpreted by</text>

  <!-- Shell interpreter box -->
  <rect x="349.375" y="162.3438" width="206.25" height="58.9062" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="452.5" y="186.8125" font-family="monospace" font-size="15.6696" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Shell Interpreter</text>
  <text x="452.5" y="210.375" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">parses and executes</text>

  <!-- Both shells merge to commands -->
  <line x1="180.625" y1="221.25" x2="180.625" y2="275.625" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="452.5" y1="221.25" x2="452.5" y2="275.625" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="180.625" y1="275.625" x2="452.5" y2="275.625" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="316.5625" y1="275.625" x2="316.5625" y2="307.3438" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Commands layer -->
  <rect x="190" y="307.3438" width="253.125" height="58.9062" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="316.5625" y="331.8125" font-family="monospace" font-size="15.6696" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Built-in Commands</text>
  <text x="316.5625" y="355.375" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">cd, echo, read, export</text>

  <!-- External commands box -->
  <rect x="499.375" y="307.3438" width="253.125" height="58.9062" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="625.9375" y="331.8125" font-family="monospace" font-size="15.6696" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">External Commands</text>
  <text x="625.9375" y="355.375" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">ls, grep, awk, curl</text>

  <!-- Arrow from commands to OS -->
  <line x1="316.5625" y1="366.25" x2="316.5625" y2="416.0938" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="625.9375" y1="366.25" x2="625.9375" y2="416.0938" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OS / Kernel box spanning full width -->
  <rect x="133.75" y="416.0938" width="768.75" height="58.9062" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="518.125" y="440.5625" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--bg)" text-anchor="middle" font-weight="bold">Operating System Kernel</text>
  <text x="518.125" y="462.3125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">process management, file system, networking, signals</text>

  <!-- Shebang note box on right -->
  <rect x="790" y="67.1875" width="403.125" height="140.4688" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.5625" y="92.5625" font-family="monospace" font-size="14.7479" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Key Script Concepts</text>
  <text x="808.75" y="117.0312" font-family="monospace" font-size="12.9044" fill="var(--text-muted)">shebang:  #!/bin/bash</text>
  <text x="808.75" y="139.6875" font-family="monospace" font-size="12.9044" fill="var(--text-muted)">make executable: chmod +x</text>
  <text x="808.75" y="162.3438" font-family="monospace" font-size="12.9044" fill="var(--text-muted)">run: ./myscript.sh</text>
  <text x="808.75" y="185" font-family="monospace" font-size="12.9044" fill="var(--text-muted)">or:  bash myscript.sh</text>

  <!-- Environment / variables note -->
  <rect x="790" y="230.3125" width="403.125" height="99.6875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.5625" y="255.6875" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Script vs Interactive Differences</text>
  <text x="808.75" y="278.3438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">- Scripts run in a subshell (child process)</text>
  <text x="808.75" y="296.4688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">- No interactive prompts by default</text>
  <text x="808.75" y="314.5938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">- Uses exit codes to signal success/failure</text>

  <!-- stdin/stdout/stderr note -->
  <rect x="790" y="352.6562" width="403.125" height="99.6875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.5625" y="378.0312" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Standard I/O Streams</text>
  <text x="808.75" y="400.6875" font-family="monospace" font-size="11.9827" fill="var(--text-muted)">stdin  (fd 0) - input</text>
  <text x="808.75" y="418.8125" font-family="monospace" font-size="11.9827" fill="var(--text-muted)">stdout (fd 1) - normal output</text>
  <text x="808.75" y="436.9375" font-family="monospace" font-size="11.9827" fill="var(--text-muted)">stderr (fd 2) - error output</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <!-- Flow: top to bottom in left column -->

  <!-- 1. Setup -->
  <rect x="40" y="40" width="560" height="77.983186" rx="6.426834" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="320" y="67.294115" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--bg)" text-anchor="middle" font-weight="bold">1. Setup / Fixtures</text>
  <text x="60" y="90.689071" font-family="monospace" font-size="12.835138" fill="var(--primary-accent)">setup() { mkdir -p /tmp/test_dir; TEST_FILE=/tmp/test_dir/f.txt; }</text>
  <text x="60" y="108.235288" font-family="Arial, sans-serif" font-size="11.847762" fill="var(--primary-accent)">create temp dirs, files, env vars needed by tests</text>
  <line x1="320" y1="117.983186" x2="320" y2="147.226881" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Test functions -->
  <rect x="40" y="147.226881" width="560" height="126.722677" rx="6.426834" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="174.520996" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">2. Test Functions</text>
  <text x="60" y="198.890688" font-family="monospace" font-size="12.835138" fill="var(--text)">test_success() {</text>
  <text x="60" y="218.386484" font-family="monospace" font-size="12.835138" fill="var(--text)">  result=$(my_function "valid_input")</text>
  <text x="60" y="237.882281" font-family="monospace" font-size="12.835138" fill="var(--text)">  assert_equals "$result" "expected"</text>
  <text x="60" y="257.378077" font-family="monospace" font-size="12.835138" fill="var(--text)">}</text>
  <line x1="320" y1="273.949558" x2="320" y2="303.193253" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Assertions -->
  <rect x="40" y="303.193253" width="560" height="126.722677" rx="6.426834" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="330.487368" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">3. Assertions</text>
  <text x="60" y="354.85706" font-family="monospace" font-size="12.835138" fill="var(--text)">assert_equals() {</text>
  <text x="60" y="374.352856" font-family="monospace" font-size="12.835138" fill="var(--text)">  [[ "$1" == "$2" ]] &amp;&amp; return 0</text>
  <text x="60" y="393.848653" font-family="monospace" font-size="12.835138" fill="var(--text)">  echo "FAIL: '$1' != '$2'" &gt;&amp;2</text>
  <text x="60" y="413.344449" font-family="monospace" font-size="12.835138" fill="var(--text)">  return 1</text>
  <text x="60" y="429.91593" font-family="monospace" font-size="12.835138" fill="var(--text)">}</text>
  <line x1="320" y1="429.91593" x2="320" y2="459.159625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Teardown -->
  <rect x="40" y="459.159625" width="560" height="77.983186" rx="6.426834" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="486.45374" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">4. Teardown / Cleanup</text>
  <text x="60" y="509.848696" font-family="monospace" font-size="12.835138" fill="var(--text)">teardown() { rm -rf /tmp/test_dir; }</text>
  <text x="60" y="527.394913" font-family="Arial, sans-serif" font-size="11.847762" fill="var(--text-muted)">always runs even if tests fail (use trap)</text>
  <line x1="320" y1="537.142811" x2="320" y2="566.386506" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Reporting -->
  <rect x="40" y="566.386506" width="560" height="53.613494" rx="6.426834" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="320" y="593.680621" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--bg)" text-anchor="middle" font-weight="bold">5. Reporting</text>
  <text x="60" y="608.302415" font-family="monospace" font-size="12.835138" fill="var(--ok-accent)">echo "Passed: $pass | Failed: $fail"; exit $fail</text>

  <!-- Right column: runner and frameworks -->
  <rect x="660" y="40" width="580" height="194.957965" rx="6.426834" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="67.294115" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Test Runner Pattern</text>
  <text x="680" y="93.613387" font-family="monospace" font-size="12.835138" fill="var(--text)">PASS=0; FAIL=0</text>
  <text x="680" y="113.109183" font-family="monospace" font-size="12.835138" fill="var(--text)">run_test() {</text>
  <text x="680" y="132.60498" font-family="monospace" font-size="12.835138" fill="var(--text)">  setup</text>
  <text x="680" y="152.100776" font-family="monospace" font-size="12.835138" fill="var(--text)">  if "$1"; then</text>
  <text x="680" y="171.596573" font-family="monospace" font-size="12.835138" fill="var(--text)">    echo "PASS: $1"; (( PASS++ ))</text>
  <text x="680" y="191.092369" font-family="monospace" font-size="12.835138" fill="var(--text)">  else</text>
  <text x="680" y="210.588166" font-family="monospace" font-size="12.835138" fill="var(--text)">    echo "FAIL: $1"; (( FAIL++ ))</text>
  <text x="680" y="225.210067" font-family="monospace" font-size="12.835138" fill="var(--text)">  fi; teardown</text>

  <!-- Available assertion types -->
  <rect x="660" y="254.453762" width="580" height="190.08407" rx="6.426834" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="281.747877" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Common Assertions</text>
  <text x="680" y="308.067148" font-family="monospace" font-size="12.835138" fill="var(--text)">assert_equals val1 val2</text>
  <text x="680" y="327.562945" font-family="monospace" font-size="12.835138" fill="var(--text)">assert_not_equals val1 val2</text>
  <text x="680" y="347.058741" font-family="monospace" font-size="12.835138" fill="var(--text)">assert_zero $?      # exit code is 0</text>
  <text x="680" y="366.554538" font-family="monospace" font-size="12.835138" fill="var(--text)">assert_contains "substr" "$str"</text>
  <text x="680" y="386.050334" font-family="monospace" font-size="12.835138" fill="var(--text)">assert_file_exists "$path"</text>
  <text x="680" y="405.546131" font-family="monospace" font-size="12.835138" fill="var(--text)">assert_file_not_exists "$path"</text>
  <text x="680" y="425.041927" font-family="Arial, sans-serif" font-size="11.847762" fill="var(--text-muted)">implement as functions that return 0 or 1</text>
  <text x="680" y="439.663828" font-family="Arial, sans-serif" font-size="11.847762" fill="var(--text-muted)">print failure message to stderr</text>

  <!-- Frameworks -->
  <rect x="660" y="464.03352" width="580" height="155.966372" rx="6.426834" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="491.327635" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Existing Bash Test Frameworks</text>
  <text x="680" y="517.647015" font-family="Arial, sans-serif" font-size="13.822407" fill="var(--text)" font-weight="bold">bats-core</text>
  <text x="680" y="537.142811" font-family="Arial, sans-serif" font-size="12.835138" fill="var(--text-muted)">Bash Automated Testing System - TAP output</text>
  <text x="680" y="559.563031" font-family="Arial, sans-serif" font-size="13.822407" fill="var(--text)" font-weight="bold">shunit2</text>
  <text x="680" y="579.058827" font-family="Arial, sans-serif" font-size="12.835138" fill="var(--text-muted)">xUnit-style framework for shell scripts</text>
  <text x="680" y="601.47894" font-family="Arial, sans-serif" font-size="13.822407" fill="var(--text)" font-weight="bold">shellspec</text>
  <text x="680" y="613.176417" font-family="Arial, sans-serif" font-size="12.835138" fill="var(--text-muted)">BDD-style testing with describe/it syntax</text>
</svg>

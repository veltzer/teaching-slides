<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Flow: top to bottom in left column -->

  <!-- 1. Setup -->
  <rect x="40" y="40" width="560" height="77.983186" rx="6.426834" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="67.294115" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--bg)" text-anchor="middle" font-weight="bold">1. Setup</text>
  <text x="60" y="90.689071" font-size="12.835138" fill="var(--primary-accent)" font-family="Courier New, monospace">setup() { mkdir -p /tmp/t; }</text>
  <text x="60" y="108.235288" font-family="Arial, sans-serif" font-size="11.847762" fill="var(--primary-accent)"/>
  <line x1="320" y1="117.983186" x2="320" y2="147.226881" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- 2. Test functions -->
  <rect x="40" y="147.226881" width="560" height="126.722677" rx="6.426834" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="174.520996" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">2. Test Functions</text>
  <text x="60" y="198.890688" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">test_success() {</text>
  <text x="60" y="218.386484" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">  r=$(my_fn "input")</text>
  <text x="60" y="237.882281" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">  assert_equals "$r" "x"</text>
  <text x="60" y="257.378077" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">}</text>
  <line x1="320" y1="273.949558" x2="320" y2="303.193253" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- 3. Assertions -->
  <rect x="40" y="303.193253" width="560" height="126.722677" rx="6.426834" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="330.487368" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">3. Assertions</text>
  <text x="60" y="354.85706" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">assert_equals() {</text>
  <text x="60" y="374.352856" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">  [[ "$1" == "$2" ]] || {</text>
  <text x="60" y="393.848653" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">    echo FAIL &gt;&amp;2; return 1; }</text>
  <text x="60" y="413.344449" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">}</text>
  <text x="60" y="429.91593" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace"/>
  <line x1="320" y1="429.91593" x2="320" y2="459.159625" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- 4. Teardown -->
  <rect x="40" y="459.159625" width="560" height="77.983186" rx="6.426834" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="486.45374" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">4. Teardown</text>
  <text x="60" y="509.848696" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">teardown() { rm -rf /tmp/t; }</text>
  <text x="60" y="527.394913" font-family="Arial, sans-serif" font-size="11.847762" fill="var(--text-muted)">trap on EXIT</text>
  <line x1="320" y1="537.142811" x2="320" y2="566.386506" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- 5. Reporting -->
  <rect x="40" y="566.386506" width="560" height="53.613494" rx="6.426834" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="593.680621" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--bg)" text-anchor="middle" font-weight="bold">5. Reporting</text>
  <text x="60" y="608.302415" font-size="12.835138" fill="var(--ok-accent)" font-family="Courier New, monospace">echo "P:$pass F:$fail"; exit $fail</text>

  <!-- Right column: runner and frameworks -->
  <rect x="660" y="40" width="580" height="194.957965" rx="6.426834" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="67.294115" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Test Runner Pattern</text>
  <text x="680" y="93.613387" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">PASS=0; FAIL=0</text>
  <text x="680" y="113.109183" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">run_test() {</text>
  <text x="680" y="132.60498" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">  setup</text>
  <text x="680" y="152.100776" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">  "$1" &amp;&amp; ((PASS++)) \</text>
  <text x="680" y="171.596573" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">       || ((FAIL++))</text>
  <text x="680" y="191.092369" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">  teardown</text>
  <text x="680" y="210.588166" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">}</text>
  <text x="680" y="225.210067" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace"/>

  <!-- Available assertion types -->
  <rect x="660" y="254.453762" width="580" height="190.08407" rx="6.426834" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="281.747877" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Common Assertions</text>
  <text x="680" y="308.067148" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">assert_equals a b</text>
  <text x="680" y="327.562945" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">assert_not_equals a b</text>
  <text x="680" y="347.058741" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">assert_zero $?</text>
  <text x="680" y="366.554538" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">assert_contains sub str</text>
  <text x="680" y="386.050334" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">assert_file_exists p</text>
  <text x="680" y="405.546131" font-size="12.835138" fill="var(--text)" font-family="Courier New, monospace">assert_file_not_exists p</text>
  <text x="680" y="425.041927" font-family="Arial, sans-serif" font-size="11.847762" fill="var(--text-muted)">return 0/1; log to stderr</text>
  <text x="680" y="439.663828" font-family="Arial, sans-serif" font-size="11.847762" fill="var(--text-muted)"/>

  <!-- Frameworks -->
  <rect x="660" y="464.03352" width="580" height="155.966372" rx="6.426834" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="491.327635" font-family="Arial, sans-serif" font-size="16.78432" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Bash Test Frameworks</text>
  <text x="680" y="517.647015" font-family="Arial, sans-serif" font-size="13.822407" fill="var(--text)" font-weight="bold">bats-core</text>
  <text x="680" y="537.142811" font-family="Arial, sans-serif" font-size="12.835138" fill="var(--text-muted)">TAP output</text>
  <text x="680" y="559.563031" font-family="Arial, sans-serif" font-size="13.822407" fill="var(--text)" font-weight="bold">shunit2</text>
  <text x="680" y="579.058827" font-family="Arial, sans-serif" font-size="12.835138" fill="var(--text-muted)">xUnit style</text>
  <text x="680" y="601.47894" font-family="Arial, sans-serif" font-size="13.822407" fill="var(--text)" font-weight="bold">shellspec</text>
  <text x="680" y="613.176417" font-family="Arial, sans-serif" font-size="12.835138" fill="var(--text-muted)">BDD describe/it</text>
</svg>

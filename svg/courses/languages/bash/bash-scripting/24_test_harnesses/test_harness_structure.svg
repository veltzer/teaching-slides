<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Flow: top to bottom in left column -->

  <!-- 1. Setup -->
  <rect x="40" y="30" width="560" height="80" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="320" y="58" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">1. Setup / Fixtures</text>
  <text x="60" y="82" font-family="monospace" font-size="13" fill="#bbdefb">setup() { mkdir -p /tmp/test_dir; TEST_FILE=/tmp/test_dir/f.txt; }</text>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="12" fill="#bbdefb">create temp dirs, files, env vars needed by tests</text>
  <line x1="320" y1="110" x2="320" y2="140" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Test functions -->
  <rect x="40" y="140" width="560" height="130" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="168" font-family="Arial, sans-serif" font-size="17" fill="#1565c0" text-anchor="middle" font-weight="bold">2. Test Functions</text>
  <text x="60" y="193" font-family="monospace" font-size="13" fill="#333333">test_success() {</text>
  <text x="60" y="213" font-family="monospace" font-size="13" fill="#333333">  result=$(my_function "valid_input")</text>
  <text x="60" y="233" font-family="monospace" font-size="13" fill="#333333">  assert_equals "$result" "expected"</text>
  <text x="60" y="253" font-family="monospace" font-size="13" fill="#333333">}</text>
  <line x1="320" y1="270" x2="320" y2="300" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Assertions -->
  <rect x="40" y="300" width="560" height="130" rx="8" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="328" font-family="Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="bold">3. Assertions</text>
  <text x="60" y="353" font-family="monospace" font-size="13" fill="#333333">assert_equals() {</text>
  <text x="60" y="373" font-family="monospace" font-size="13" fill="#333333">  [[ "$1" == "$2" ]] &amp;&amp; return 0</text>
  <text x="60" y="393" font-family="monospace" font-size="13" fill="#333333">  echo "FAIL: '$1' != '$2'" &gt;&amp;2</text>
  <text x="60" y="413" font-family="monospace" font-size="13" fill="#333333">  return 1</text>
  <text x="60" y="430" font-family="monospace" font-size="13" fill="#333333">}</text>
  <line x1="320" y1="430" x2="320" y2="460" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Teardown -->
  <rect x="40" y="460" width="560" height="80" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="488" font-family="Arial, sans-serif" font-size="17" fill="#e65100" text-anchor="middle" font-weight="bold">4. Teardown / Cleanup</text>
  <text x="60" y="512" font-family="monospace" font-size="13" fill="#333333">teardown() { rm -rf /tmp/test_dir; }</text>
  <text x="60" y="530" font-family="Arial, sans-serif" font-size="12" fill="#555555">always runs even if tests fail (use trap)</text>
  <line x1="320" y1="540" x2="320" y2="570" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Reporting -->
  <rect x="40" y="570" width="560" height="55" rx="8" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="320" y="598" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">5. Reporting</text>
  <text x="60" y="613" font-family="monospace" font-size="13" fill="#c8e6c9">echo "Passed: $pass | Failed: $fail"; exit $fail</text>

  <!-- Right column: runner and frameworks -->
  <rect x="660" y="30" width="580" height="200" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="58" font-family="Arial, sans-serif" font-size="17" fill="#1565c0" text-anchor="middle" font-weight="bold">Test Runner Pattern</text>
  <text x="680" y="85" font-family="monospace" font-size="13" fill="#333333">PASS=0; FAIL=0</text>
  <text x="680" y="105" font-family="monospace" font-size="13" fill="#333333">run_test() {</text>
  <text x="680" y="125" font-family="monospace" font-size="13" fill="#333333">  setup</text>
  <text x="680" y="145" font-family="monospace" font-size="13" fill="#333333">  if "$1"; then</text>
  <text x="680" y="165" font-family="monospace" font-size="13" fill="#333333">    echo "PASS: $1"; (( PASS++ ))</text>
  <text x="680" y="185" font-family="monospace" font-size="13" fill="#333333">  else</text>
  <text x="680" y="205" font-family="monospace" font-size="13" fill="#333333">    echo "FAIL: $1"; (( FAIL++ ))</text>
  <text x="680" y="220" font-family="monospace" font-size="13" fill="#333333">  fi; teardown</text>

  <!-- Available assertion types -->
  <rect x="660" y="250" width="580" height="195" rx="8" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="278" font-family="Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="bold">Common Assertions</text>
  <text x="680" y="305" font-family="monospace" font-size="13" fill="#333333">assert_equals val1 val2</text>
  <text x="680" y="325" font-family="monospace" font-size="13" fill="#333333">assert_not_equals val1 val2</text>
  <text x="680" y="345" font-family="monospace" font-size="13" fill="#333333">assert_zero $?      # exit code is 0</text>
  <text x="680" y="365" font-family="monospace" font-size="13" fill="#333333">assert_contains "substr" "$str"</text>
  <text x="680" y="385" font-family="monospace" font-size="13" fill="#333333">assert_file_exists "$path"</text>
  <text x="680" y="405" font-family="monospace" font-size="13" fill="#333333">assert_file_not_exists "$path"</text>
  <text x="680" y="425" font-family="Arial, sans-serif" font-size="12" fill="#555555">implement as functions that return 0 or 1</text>
  <text x="680" y="440" font-family="Arial, sans-serif" font-size="12" fill="#555555">print failure message to stderr</text>

  <!-- Frameworks -->
  <rect x="660" y="465" width="580" height="160" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="493" font-family="Arial, sans-serif" font-size="17" fill="#6a1b9a" text-anchor="middle" font-weight="bold">Existing Bash Test Frameworks</text>
  <text x="680" y="520" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">bats-core</text>
  <text x="680" y="540" font-family="Arial, sans-serif" font-size="13" fill="#555555">Bash Automated Testing System - TAP output</text>
  <text x="680" y="563" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">shunit2</text>
  <text x="680" y="583" font-family="Arial, sans-serif" font-size="13" fill="#555555">xUnit-style framework for shell scripts</text>
  <text x="680" y="606" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">shellspec</text>
  <text x="680" y="618" font-family="Arial, sans-serif" font-size="13" fill="#555555">BDD-style testing with describe/it syntax</text>
</svg>

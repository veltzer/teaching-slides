<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Flow: top to bottom in left column -->

  <!-- 1. Setup -->
  <rect x="77.5" y="67.1875" width="525" height="72.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="340" y="92.5625" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--bg)" text-anchor="middle" font-weight="bold">1. Setup / Fixtures</text>
  <text x="96.25" y="114.3125" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">setup() { mkdir -p /tmp/test_dir; TEST_FILE=/tmp/test_dir/f.txt; }</text>
  <text x="96.25" y="130.625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">create temp dirs, files, env vars needed by tests</text>
  <line x1="340" y1="139.6875" x2="340" y2="166.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Test functions -->
  <rect x="77.5" y="166.875" width="525" height="117.8125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="340" y="192.25" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">2. Test Functions</text>
  <text x="96.25" y="214.9062" font-family="monospace" font-size="11.9827" fill="var(--text)">test_success() {</text>
  <text x="96.25" y="233.0312" font-family="monospace" font-size="11.9827" fill="var(--text)">  result=$(my_function "valid_input")</text>
  <text x="96.25" y="251.1562" font-family="monospace" font-size="11.9827" fill="var(--text)">  assert_equals "$result" "expected"</text>
  <text x="96.25" y="269.2812" font-family="monospace" font-size="11.9827" fill="var(--text)">}</text>
  <line x1="340" y1="284.6875" x2="340" y2="311.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Assertions -->
  <rect x="77.5" y="311.875" width="525" height="117.8125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="340" y="337.25" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">3. Assertions</text>
  <text x="96.25" y="359.9062" font-family="monospace" font-size="11.9827" fill="var(--text)">assert_equals() {</text>
  <text x="96.25" y="378.0312" font-family="monospace" font-size="11.9827" fill="var(--text)">  [[ "$1" == "$2" ]] &amp;&amp; return 0</text>
  <text x="96.25" y="396.1562" font-family="monospace" font-size="11.9827" fill="var(--text)">  echo "FAIL: '$1' != '$2'" &gt;&amp;2</text>
  <text x="96.25" y="414.2812" font-family="monospace" font-size="11.9827" fill="var(--text)">  return 1</text>
  <text x="96.25" y="429.6875" font-family="monospace" font-size="11.9827" fill="var(--text)">}</text>
  <line x1="340" y1="429.6875" x2="340" y2="456.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Teardown -->
  <rect x="77.5" y="456.875" width="525" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="482.25" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">4. Teardown / Cleanup</text>
  <text x="96.25" y="504" font-family="monospace" font-size="11.9827" fill="var(--text)">teardown() { rm -rf /tmp/test_dir; }</text>
  <text x="96.25" y="520.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">always runs even if tests fail (use trap)</text>
  <line x1="340" y1="529.375" x2="340" y2="556.5625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Reporting -->
  <rect x="77.5" y="556.5625" width="525" height="49.8438" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="340" y="581.9375" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--bg)" text-anchor="middle" font-weight="bold">5. Reporting</text>
  <text x="96.25" y="595.5312" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">echo "Passed: $pass | Failed: $fail"; exit $fail</text>

  <!-- Right column: runner and frameworks -->
  <rect x="658.75" y="67.1875" width="543.75" height="181.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="930.625" y="92.5625" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Test Runner Pattern</text>
  <text x="677.5" y="117.0312" font-family="monospace" font-size="11.9827" fill="var(--text)">PASS=0; FAIL=0</text>
  <text x="677.5" y="135.1562" font-family="monospace" font-size="11.9827" fill="var(--text)">run_test() {</text>
  <text x="677.5" y="153.2812" font-family="monospace" font-size="11.9827" fill="var(--text)">  setup</text>
  <text x="677.5" y="171.4062" font-family="monospace" font-size="11.9827" fill="var(--text)">  if "$1"; then</text>
  <text x="677.5" y="189.5312" font-family="monospace" font-size="11.9827" fill="var(--text)">    echo "PASS: $1"; (( PASS++ ))</text>
  <text x="677.5" y="207.6562" font-family="monospace" font-size="11.9827" fill="var(--text)">  else</text>
  <text x="677.5" y="225.7812" font-family="monospace" font-size="11.9827" fill="var(--text)">    echo "FAIL: $1"; (( FAIL++ ))</text>
  <text x="677.5" y="239.375" font-family="monospace" font-size="11.9827" fill="var(--text)">  fi; teardown</text>

  <!-- Available assertion types -->
  <rect x="658.75" y="266.5625" width="543.75" height="176.7188" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="930.625" y="291.9375" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Common Assertions</text>
  <text x="677.5" y="316.4062" font-family="monospace" font-size="11.9827" fill="var(--text)">assert_equals val1 val2</text>
  <text x="677.5" y="334.5312" font-family="monospace" font-size="11.9827" fill="var(--text)">assert_not_equals val1 val2</text>
  <text x="677.5" y="352.6562" font-family="monospace" font-size="11.9827" fill="var(--text)">assert_zero $?      # exit code is 0</text>
  <text x="677.5" y="370.7812" font-family="monospace" font-size="11.9827" fill="var(--text)">assert_contains "substr" "$str"</text>
  <text x="677.5" y="388.9062" font-family="monospace" font-size="11.9827" fill="var(--text)">assert_file_exists "$path"</text>
  <text x="677.5" y="407.0312" font-family="monospace" font-size="11.9827" fill="var(--text)">assert_file_not_exists "$path"</text>
  <text x="677.5" y="425.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">implement as functions that return 0 or 1</text>
  <text x="677.5" y="438.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">print failure message to stderr</text>

  <!-- Frameworks -->
  <rect x="658.75" y="461.4062" width="543.75" height="145" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.625" y="486.7812" font-family="Arial, sans-serif" font-size="15.6696" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">Existing Bash Test Frameworks</text>
  <text x="677.5" y="511.25" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)" font-weight="bold">bats-core</text>
  <text x="677.5" y="529.375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Bash Automated Testing System - TAP output</text>
  <text x="677.5" y="550.2188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)" font-weight="bold">shunit2</text>
  <text x="677.5" y="568.3438" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">xUnit-style framework for shell scripts</text>
  <text x="677.5" y="589.1875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)" font-weight="bold">shellspec</text>
  <text x="677.5" y="600.0625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">BDD-style testing with describe/it syntax</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Flow: top to bottom in left column -->

  <!-- 1. Setup -->
  <rect x="40" y="30" width="560" height="80" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="320" y="58" font-family="Arial, sans-serif" font-size="17" fill="var(--bg)" text-anchor="middle" font-weight="bold">1. Setup / Fixtures</text>
  <text x="60" y="82" font-family="monospace" font-size="13" fill="var(--primary-lt)">setup() { mkdir -p /tmp/test_dir; TEST_FILE=/tmp/test_dir/f.txt; }</text>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-lt)">create temp dirs, files, env vars needed by tests</text>
  <line x1="320" y1="110" x2="320" y2="140" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Test functions -->
  <rect x="40" y="140" width="560" height="130" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="168" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">2. Test Functions</text>
  <text x="60" y="193" font-family="monospace" font-size="13" fill="var(--text-dark)">test_success() {</text>
  <text x="60" y="213" font-family="monospace" font-size="13" fill="var(--text-dark)">  result=$(my_function "valid_input")</text>
  <text x="60" y="233" font-family="monospace" font-size="13" fill="var(--text-dark)">  assert_equals "$result" "expected"</text>
  <text x="60" y="253" font-family="monospace" font-size="13" fill="var(--text-dark)">}</text>
  <line x1="320" y1="270" x2="320" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Assertions -->
  <rect x="40" y="300" width="560" height="130" rx="8" fill="url(#grad-surface)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="328" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">3. Assertions</text>
  <text x="60" y="353" font-family="monospace" font-size="13" fill="var(--text-dark)">assert_equals() {</text>
  <text x="60" y="373" font-family="monospace" font-size="13" fill="var(--text-dark)">  [[ "$1" == "$2" ]] &amp;&amp; return 0</text>
  <text x="60" y="393" font-family="monospace" font-size="13" fill="var(--text-dark)">  echo "FAIL: '$1' != '$2'" &gt;&amp;2</text>
  <text x="60" y="413" font-family="monospace" font-size="13" fill="var(--text-dark)">  return 1</text>
  <text x="60" y="430" font-family="monospace" font-size="13" fill="var(--text-dark)">}</text>
  <line x1="320" y1="430" x2="320" y2="460" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Teardown -->
  <rect x="40" y="460" width="560" height="80" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="488" font-family="Arial, sans-serif" font-size="17" fill="var(--warn-dk)" text-anchor="middle" font-weight="bold">4. Teardown / Cleanup</text>
  <text x="60" y="512" font-family="monospace" font-size="13" fill="var(--text-dark)">teardown() { rm -rf /tmp/test_dir; }</text>
  <text x="60" y="530" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">always runs even if tests fail (use trap)</text>
  <line x1="320" y1="540" x2="320" y2="570" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Reporting -->
  <rect x="40" y="570" width="560" height="55" rx="8" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="320" y="598" font-family="Arial, sans-serif" font-size="17" fill="var(--bg)" text-anchor="middle" font-weight="bold">5. Reporting</text>
  <text x="60" y="613" font-family="monospace" font-size="13" fill="var(--ok-lt)">echo "Passed: $pass | Failed: $fail"; exit $fail</text>

  <!-- Right column: runner and frameworks -->
  <rect x="660" y="30" width="580" height="200" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="58" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Test Runner Pattern</text>
  <text x="680" y="85" font-family="monospace" font-size="13" fill="var(--text-dark)">PASS=0; FAIL=0</text>
  <text x="680" y="105" font-family="monospace" font-size="13" fill="var(--text-dark)">run_test() {</text>
  <text x="680" y="125" font-family="monospace" font-size="13" fill="var(--text-dark)">  setup</text>
  <text x="680" y="145" font-family="monospace" font-size="13" fill="var(--text-dark)">  if "$1"; then</text>
  <text x="680" y="165" font-family="monospace" font-size="13" fill="var(--text-dark)">    echo "PASS: $1"; (( PASS++ ))</text>
  <text x="680" y="185" font-family="monospace" font-size="13" fill="var(--text-dark)">  else</text>
  <text x="680" y="205" font-family="monospace" font-size="13" fill="var(--text-dark)">    echo "FAIL: $1"; (( FAIL++ ))</text>
  <text x="680" y="220" font-family="monospace" font-size="13" fill="var(--text-dark)">  fi; teardown</text>

  <!-- Available assertion types -->
  <rect x="660" y="250" width="580" height="195" rx="8" fill="url(#grad-surface)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="278" font-family="Arial, sans-serif" font-size="17" fill="var(--ok-dk)" text-anchor="middle" font-weight="bold">Common Assertions</text>
  <text x="680" y="305" font-family="monospace" font-size="13" fill="var(--text-dark)">assert_equals val1 val2</text>
  <text x="680" y="325" font-family="monospace" font-size="13" fill="var(--text-dark)">assert_not_equals val1 val2</text>
  <text x="680" y="345" font-family="monospace" font-size="13" fill="var(--text-dark)">assert_zero $?      # exit code is 0</text>
  <text x="680" y="365" font-family="monospace" font-size="13" fill="var(--text-dark)">assert_contains "substr" "$str"</text>
  <text x="680" y="385" font-family="monospace" font-size="13" fill="var(--text-dark)">assert_file_exists "$path"</text>
  <text x="680" y="405" font-family="monospace" font-size="13" fill="var(--text-dark)">assert_file_not_exists "$path"</text>
  <text x="680" y="425" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">implement as functions that return 0 or 1</text>
  <text x="680" y="440" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">print failure message to stderr</text>

  <!-- Frameworks -->
  <rect x="660" y="465" width="580" height="160" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="493" font-family="Arial, sans-serif" font-size="17" fill="var(--info-dk)" text-anchor="middle" font-weight="bold">Existing Bash Test Frameworks</text>
  <text x="680" y="520" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)" font-weight="bold">bats-core</text>
  <text x="680" y="540" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Bash Automated Testing System - TAP output</text>
  <text x="680" y="563" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)" font-weight="bold">shunit2</text>
  <text x="680" y="583" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">xUnit-style framework for shell scripts</text>
  <text x="680" y="606" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)" font-weight="bold">shellspec</text>
  <text x="680" y="618" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">BDD-style testing with describe/it syntax</text>
</svg>

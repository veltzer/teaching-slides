<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <!-- Panel 1: * -->
  <rect x="40" y="40" width="363.934426" height="550.508372" rx="6.400888" fill="url(#panelGrad)"/>
  <rect x="40" y="40" width="363.934426" height="55.050837" rx="6.400888" fill="url(#blueGrad)"/>
  <rect x="40" y="75.389824" width="363.934426" height="19.661013" fill="url(#blueGrad)" rx="6.400888"/>
  <text x="221.967213" y="73.423723" font-family="monospace" font-size="31.466554" font-weight="bold" fill="var(--bg)" text-anchor="middle">*</text>
  <text x="221.967213" y="118.644053" font-family="Arial, sans-serif" font-size="15.733277" fill="var(--text-muted)" text-anchor="middle">Zero or more characters (not /)</text>

  <rect x="59.672131" y="133.389867" width="324.590164" height="37.355925" rx="6.400888" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.967213" y="156.983083" font-family="monospace" font-size="17.69995" fill="var(--primary-accent)" text-anchor="middle">*.txt</text>

  <text x="79.344262" y="192.372907" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="79.344262" y="213.999913" font-family="monospace" font-size="14.749887" fill="var(--text)">file.txt</text>
  <text x="79.344262" y="233.660926" font-family="monospace" font-size="14.749887" fill="var(--text)">readme.txt</text>
  <text x="79.344262" y="253.32194" font-family="monospace" font-size="14.749887" fill="var(--text)">my_document.txt</text>
  <text x="79.344262" y="272.982953" font-family="monospace" font-size="14.749887" fill="var(--text)">a.txt</text>
  <text x="79.344262" y="300.508372" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--danger-accent)" font-weight="bold">Does NOT match:</text>
  <text x="79.344262" y="322.135595" font-family="monospace" font-size="14.749887" fill="var(--text-faint)">.hidden.txt  (hidden)</text>
  <text x="79.344262" y="341.796608" font-family="monospace" font-size="14.749887" fill="var(--text-faint)">dir/file.txt  (slash)</text>

  <line x1="59.672131" y1="359.491411" x2="384.262295" y2="359.491411" stroke="var(--border)" stroke-width="1"/>

  <rect x="59.672131" y="369.322027" width="324.590164" height="37.355925" rx="6.400888" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.967213" y="392.915242" font-family="monospace" font-size="17.69995" fill="var(--primary-accent)" text-anchor="middle">file*</text>

  <text x="79.344262" y="428.305066" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="79.344262" y="449.932072" font-family="monospace" font-size="14.749887" fill="var(--text)">file</text>
  <text x="79.344262" y="469.593086" font-family="monospace" font-size="14.749887" fill="var(--text)">file.txt</text>
  <text x="79.344262" y="489.254099" font-family="monospace" font-size="14.749887" fill="var(--text)">file_backup.tar.gz</text>
  <text x="79.344262" y="508.915112" font-family="monospace" font-size="14.749887" fill="var(--text)">files_2024</text>

  <line x1="59.672131" y1="526.610133" x2="384.262295" y2="526.610133" stroke="var(--border)" stroke-width="1"/>

  <rect x="59.672131" y="536.440531" width="324.590164" height="37.355925" rx="6.400888" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.967213" y="560.033747" font-family="monospace" font-size="17.69995" fill="var(--primary-accent)" text-anchor="middle">*data*</text>

  <text x="79.344262" y="595.423571" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="79.344262" y="617.050794" font-family="monospace" font-size="14.749887" fill="var(--text)">data.csv  /  mydata  /  raw_data_2024.txt</text>

  <!-- Panel 2: ? -->
  <rect x="433.442623" y="40" width="363.934426" height="550.508372" rx="6.400888" fill="url(#panelGrad)"/>
  <rect x="433.442623" y="40" width="363.934426" height="55.050837" rx="6.400888" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="433.442623" y="75.389824" width="363.934426" height="19.661013" fill="var(--warn-fill)" rx="6.400888" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.409836" y="73.423723" font-family="monospace" font-size="31.466554" font-weight="bold" fill="var(--bg)" text-anchor="middle">?</text>
  <text x="615.409836" y="118.644053" font-family="Arial, sans-serif" font-size="15.733277" fill="var(--text-muted)" text-anchor="middle">Exactly one character (any)</text>

  <rect x="453.114754" y="133.389867" width="324.590164" height="37.355925" rx="6.400888" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.409836" y="156.983083" font-family="monospace" font-size="17.69995" fill="var(--warn-accent)" text-anchor="middle">file?.txt</text>

  <text x="472.786885" y="192.372907" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="472.786885" y="213.999913" font-family="monospace" font-size="14.749887" fill="var(--text)">file1.txt</text>
  <text x="472.786885" y="233.660926" font-family="monospace" font-size="14.749887" fill="var(--text)">fileA.txt</text>
  <text x="472.786885" y="253.32194" font-family="monospace" font-size="14.749887" fill="var(--text)">file_.txt</text>
  <text x="472.786885" y="272.982953" font-family="monospace" font-size="14.749887" fill="var(--text)">file .txt  (space counts!)</text>
  <text x="472.786885" y="300.508372" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--danger-accent)" font-weight="bold">Does NOT match:</text>
  <text x="472.786885" y="322.135595" font-family="monospace" font-size="14.749887" fill="var(--text-faint)">file.txt  (no char)</text>
  <text x="472.786885" y="341.796608" font-family="monospace" font-size="14.749887" fill="var(--text-faint)">file10.txt  (two chars)</text>

  <line x1="453.114754" y1="359.491411" x2="777.704918" y2="359.491411" stroke="var(--border)" stroke-width="1"/>

  <rect x="453.114754" y="369.322027" width="324.590164" height="37.355925" rx="6.400888" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.409836" y="392.915242" font-family="monospace" font-size="17.69995" fill="var(--warn-accent)" text-anchor="middle">???</text>

  <text x="472.786885" y="428.305066" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="472.786885" y="449.932072" font-family="monospace" font-size="14.749887" fill="var(--text)">abc  /  123  /  foo  /  a.b</text>
  <text x="472.786885" y="469.593086" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--danger-accent)" font-weight="bold">Not:</text>
  <text x="472.786885" y="491.220309" font-family="monospace" font-size="14.749887" fill="var(--text-faint)">ab (2 chars)  /  abcd (4 chars)</text>

  <line x1="453.114754" y1="506.949119" x2="777.704918" y2="506.949119" stroke="var(--border)" stroke-width="1"/>

  <rect x="453.114754" y="521.694825" width="324.590164" height="37.355925" rx="6.400888" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.409836" y="545.288041" font-family="monospace" font-size="17.69995" fill="var(--warn-accent)" text-anchor="middle">file?.*</text>

  <text x="472.786885" y="580.677865" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="472.786885" y="602.30498" font-family="monospace" font-size="14.749887" fill="var(--text)">file1.txt  /  fileA.md  /  fileZ.sh</text>

  <!-- Panel 3: [...] -->
  <rect x="826.885246" y="40" width="413.114754" height="550.508372" rx="6.400888" fill="url(#panelGrad)"/>
  <rect x="826.885246" y="40" width="413.114754" height="55.050837" rx="6.400888" fill="var(--info-accent)"/>
  <rect x="826.885246" y="75.389824" width="413.114754" height="19.661013" fill="var(--info-accent)" rx="6.400888"/>
  <text x="1033.442623" y="73.423723" font-family="monospace" font-size="27.533208" font-weight="bold" fill="var(--bg)" text-anchor="middle">[...]</text>
  <text x="1033.442623" y="118.644053" font-family="Arial, sans-serif" font-size="15.733277" fill="var(--text-muted)" text-anchor="middle">Match one char from set or range</text>

  <rect x="846.557377" y="133.389867" width="373.770492" height="37.355925" rx="6.400888" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.442623" y="156.983083" font-family="monospace" font-size="17.69995" fill="var(--info-accent)" text-anchor="middle">file[123].txt</text>
  <text x="866.229508" y="192.372907" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="866.229508" y="213.999913" font-family="monospace" font-size="14.749887" fill="var(--text)">file1.txt  /  file2.txt  /  file3.txt</text>

  <line x1="846.557377" y1="231.694934" x2="1220.327869" y2="231.694934" stroke="var(--border)" stroke-width="1"/>
  <rect x="846.557377" y="241.525332" width="373.770492" height="37.355925" rx="6.400888" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.442623" y="265.118548" font-family="monospace" font-size="17.69995" fill="var(--info-accent)" text-anchor="middle">file[0-9].txt</text>
  <text x="866.229508" y="300.508372" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="866.229508" y="322.135595" font-family="monospace" font-size="14.749887" fill="var(--text)">file0.txt through file9.txt</text>

  <line x1="846.557377" y1="339.830398" x2="1220.327869" y2="339.830398" stroke="var(--border)" stroke-width="1"/>
  <rect x="846.557377" y="349.661013" width="373.770492" height="37.355925" rx="6.400888" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.442623" y="373.254229" font-family="monospace" font-size="17.69995" fill="var(--info-accent)" text-anchor="middle">file[a-zA-Z].txt</text>
  <text x="866.229508" y="408.644053" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="866.229508" y="430.271059" font-family="monospace" font-size="14.749887" fill="var(--text)">filea.txt through fileZ.txt</text>

  <line x1="846.557377" y1="447.96608" x2="1220.327869" y2="447.96608" stroke="var(--border)" stroke-width="1"/>
  <rect x="846.557377" y="457.796478" width="373.770492" height="37.355925" rx="6.400888" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.442623" y="481.389694" font-family="monospace" font-size="17.69995" fill="var(--danger-accent)" text-anchor="middle">file[!0-9].txt  or  [^0-9]</text>
  <text x="866.229508" y="516.779518" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--text-muted)" font-weight="bold">Negation — NOT in set:</text>
  <text x="866.229508" y="538.406741" font-family="monospace" font-size="14.749887" fill="var(--text)">filea.txt  /  fileX.txt</text>
  <text x="866.229508" y="558.067754" font-family="monospace" font-size="14.749887" fill="var(--text-faint)">NOT: file1.txt, file7.txt</text>

  <line x1="846.557377" y1="575.762557" x2="1220.327869" y2="575.762557" stroke="var(--border)" stroke-width="1"/>
  <rect x="846.557377" y="585.593173" width="373.770492" height="34.406827" rx="6.400888" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.442623" y="608.203284" font-family="monospace" font-size="15.733277" fill="var(--info-accent)" text-anchor="middle">[[:digit:]]  [[:alpha:]]  [[:alnum:]]</text>

</svg>

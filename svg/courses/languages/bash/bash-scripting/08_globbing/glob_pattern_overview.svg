<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Panel 1: * -->
  <rect x="68.125" y="58.125" width="346.875" height="507.5" rx="6" fill="url(#panelGrad)" filter="url(#shadow)"/>
  <rect x="68.125" y="58.125" width="346.875" height="50.75" rx="6" fill="url(#blueGrad)"/>
  <rect x="68.125" y="90.75" width="346.875" height="18.125" fill="url(#blueGrad)" rx="6"/>
  <text x="241.5625" y="88.9375" font-family="monospace" font-size="29.4958" font-weight="bold" fill="var(--bg)" text-anchor="middle">*</text>
  <text x="241.5625" y="130.625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)" text-anchor="middle">Zero or more characters (not /)</text>

  <rect x="86.875" y="144.2188" width="309.375" height="34.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="241.5625" y="165.9688" font-family="monospace" font-size="16.5914" fill="var(--primary-accent)" text-anchor="middle">*.txt</text>

  <text x="105.625" y="198.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="105.625" y="218.5312" font-family="monospace" font-size="13.8261" fill="var(--text)">file.txt</text>
  <text x="105.625" y="236.6562" font-family="monospace" font-size="13.8261" fill="var(--text)">readme.txt</text>
  <text x="105.625" y="254.7812" font-family="monospace" font-size="13.8261" fill="var(--text)">my_document.txt</text>
  <text x="105.625" y="272.9062" font-family="monospace" font-size="13.8261" fill="var(--text)">a.txt</text>
  <text x="105.625" y="298.2812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)" font-weight="bold">Does NOT match:</text>
  <text x="105.625" y="318.2188" font-family="monospace" font-size="13.8261" fill="var(--text-faint)">.hidden.txt  (hidden)</text>
  <text x="105.625" y="336.3438" font-family="monospace" font-size="13.8261" fill="var(--text-faint)">dir/file.txt  (slash)</text>

  <line x1="86.875" y1="352.6562" x2="396.25" y2="352.6562" stroke="var(--border)" stroke-width="1"/>

  <rect x="86.875" y="361.7188" width="309.375" height="34.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="241.5625" y="383.4688" font-family="monospace" font-size="16.5914" fill="var(--primary-accent)" text-anchor="middle">file*</text>

  <text x="105.625" y="416.0938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="105.625" y="436.0312" font-family="monospace" font-size="13.8261" fill="var(--text)">file</text>
  <text x="105.625" y="454.1562" font-family="monospace" font-size="13.8261" fill="var(--text)">file.txt</text>
  <text x="105.625" y="472.2812" font-family="monospace" font-size="13.8261" fill="var(--text)">file_backup.tar.gz</text>
  <text x="105.625" y="490.4062" font-family="monospace" font-size="13.8261" fill="var(--text)">files_2024</text>

  <line x1="86.875" y1="506.7188" x2="396.25" y2="506.7188" stroke="var(--border)" stroke-width="1"/>

  <rect x="86.875" y="515.7812" width="309.375" height="34.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="241.5625" y="537.5312" font-family="monospace" font-size="16.5914" fill="var(--primary-accent)" text-anchor="middle">*data*</text>

  <text x="105.625" y="570.1562" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="105.625" y="590.0938" font-family="monospace" font-size="13.8261" fill="var(--text)">data.csv  /  mydata  /  raw_data_2024.txt</text>

  <!-- Panel 2: ? -->
  <rect x="443.125" y="58.125" width="346.875" height="507.5" rx="6" fill="url(#panelGrad)" filter="url(#shadow)"/>
  <rect x="443.125" y="58.125" width="346.875" height="50.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="443.125" y="90.75" width="346.875" height="18.125" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="616.5625" y="88.9375" font-family="monospace" font-size="29.4958" font-weight="bold" fill="var(--bg)" text-anchor="middle">?</text>
  <text x="616.5625" y="130.625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)" text-anchor="middle">Exactly one character (any)</text>

  <rect x="461.875" y="144.2188" width="309.375" height="34.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="616.5625" y="165.9688" font-family="monospace" font-size="16.5914" fill="var(--warn-accent)" text-anchor="middle">file?.txt</text>

  <text x="480.625" y="198.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="480.625" y="218.5312" font-family="monospace" font-size="13.8261" fill="var(--text)">file1.txt</text>
  <text x="480.625" y="236.6562" font-family="monospace" font-size="13.8261" fill="var(--text)">fileA.txt</text>
  <text x="480.625" y="254.7812" font-family="monospace" font-size="13.8261" fill="var(--text)">file_.txt</text>
  <text x="480.625" y="272.9062" font-family="monospace" font-size="13.8261" fill="var(--text)">file .txt  (space counts!)</text>
  <text x="480.625" y="298.2812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)" font-weight="bold">Does NOT match:</text>
  <text x="480.625" y="318.2188" font-family="monospace" font-size="13.8261" fill="var(--text-faint)">file.txt  (no char)</text>
  <text x="480.625" y="336.3438" font-family="monospace" font-size="13.8261" fill="var(--text-faint)">file10.txt  (two chars)</text>

  <line x1="461.875" y1="352.6562" x2="771.25" y2="352.6562" stroke="var(--border)" stroke-width="1"/>

  <rect x="461.875" y="361.7188" width="309.375" height="34.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="616.5625" y="383.4688" font-family="monospace" font-size="16.5914" fill="var(--warn-accent)" text-anchor="middle">???</text>

  <text x="480.625" y="416.0938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="480.625" y="436.0312" font-family="monospace" font-size="13.8261" fill="var(--text)">abc  /  123  /  foo  /  a.b</text>
  <text x="480.625" y="454.1562" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--danger-accent)" font-weight="bold">Not:</text>
  <text x="480.625" y="474.0938" font-family="monospace" font-size="13.8261" fill="var(--text-faint)">ab (2 chars)  /  abcd (4 chars)</text>

  <line x1="461.875" y1="488.5938" x2="771.25" y2="488.5938" stroke="var(--border)" stroke-width="1"/>

  <rect x="461.875" y="502.1875" width="309.375" height="34.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="616.5625" y="523.9375" font-family="monospace" font-size="16.5914" fill="var(--warn-accent)" text-anchor="middle">file?.*</text>

  <text x="480.625" y="556.5625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="480.625" y="576.5" font-family="monospace" font-size="13.8261" fill="var(--text)">file1.txt  /  fileA.md  /  fileZ.sh</text>

  <!-- Panel 3: [...] -->
  <rect x="818.125" y="58.125" width="393.75" height="507.5" rx="6" fill="url(#panelGrad)" filter="url(#shadow)"/>
  <rect x="818.125" y="58.125" width="393.75" height="50.75" rx="6" fill="var(--info-accent)"/>
  <rect x="818.125" y="90.75" width="393.75" height="18.125" fill="var(--info-accent)" rx="6"/>
  <text x="1015" y="88.9375" font-family="monospace" font-size="25.8088" font-weight="bold" fill="var(--bg)" text-anchor="middle">[...]</text>
  <text x="1015" y="130.625" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--text-muted)" text-anchor="middle">Match one char from set or range</text>

  <rect x="836.875" y="144.2188" width="356.25" height="34.4375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1015" y="165.9688" font-family="monospace" font-size="16.5914" fill="var(--info-accent)" text-anchor="middle">file[123].txt</text>
  <text x="855.625" y="198.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="855.625" y="218.5312" font-family="monospace" font-size="13.8261" fill="var(--text)">file1.txt  /  file2.txt  /  file3.txt</text>

  <line x1="836.875" y1="234.8438" x2="1193.125" y2="234.8438" stroke="var(--border)" stroke-width="1"/>
  <rect x="836.875" y="243.9062" width="356.25" height="34.4375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1015" y="265.6562" font-family="monospace" font-size="16.5914" fill="var(--info-accent)" text-anchor="middle">file[0-9].txt</text>
  <text x="855.625" y="298.2812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="855.625" y="318.2188" font-family="monospace" font-size="13.8261" fill="var(--text)">file0.txt through file9.txt</text>

  <line x1="836.875" y1="334.5312" x2="1193.125" y2="334.5312" stroke="var(--border)" stroke-width="1"/>
  <rect x="836.875" y="343.5938" width="356.25" height="34.4375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1015" y="365.3438" font-family="monospace" font-size="16.5914" fill="var(--info-accent)" text-anchor="middle">file[a-zA-Z].txt</text>
  <text x="855.625" y="397.9688" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="855.625" y="417.9062" font-family="monospace" font-size="13.8261" fill="var(--text)">filea.txt through fileZ.txt</text>

  <line x1="836.875" y1="434.2188" x2="1193.125" y2="434.2188" stroke="var(--border)" stroke-width="1"/>
  <rect x="836.875" y="443.2812" width="356.25" height="34.4375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1015" y="465.0312" font-family="monospace" font-size="16.5914" fill="var(--danger-accent)" text-anchor="middle">file[!0-9].txt  or  [^0-9]</text>
  <text x="855.625" y="497.6562" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" font-weight="bold">Negation — NOT in set:</text>
  <text x="855.625" y="517.5938" font-family="monospace" font-size="13.8261" fill="var(--text)">filea.txt  /  fileX.txt</text>
  <text x="855.625" y="535.7188" font-family="monospace" font-size="13.8261" fill="var(--text-faint)">NOT: file1.txt, file7.txt</text>

  <line x1="836.875" y1="552.0312" x2="1193.125" y2="552.0312" stroke="var(--border)" stroke-width="1"/>
  <rect x="836.875" y="561.0938" width="356.25" height="31.7188" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1015" y="581.9375" font-family="monospace" font-size="14.7479" fill="var(--info-accent)" text-anchor="middle">[[:digit:]]  [[:alpha:]]  [[:alnum:]]</text>

</svg>

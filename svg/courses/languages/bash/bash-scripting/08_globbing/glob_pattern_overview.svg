<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Panel 1: * -->
  <rect x="30" y="20" width="370" height="560" rx="6" fill="url(#panelGrad)" filter="url(#shadow)"/>
  <rect x="30" y="20" width="370" height="56" rx="6" fill="url(#blueGrad)"/>
  <rect x="30" y="56" width="370" height="20" fill="url(#blueGrad)" rx="6"/>
  <text x="215" y="54" font-family="monospace" font-size="32" font-weight="bold" fill="var(--bg)" text-anchor="middle">*</text>
  <text x="215" y="100" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)" text-anchor="middle">Zero or more characters (not /)</text>

  <rect x="50" y="115" width="330" height="38" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="215" y="139" font-family="monospace" font-size="18" fill="var(--primary-accent)" text-anchor="middle">*.txt</text>

  <text x="70" y="175" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="70" y="197" font-family="monospace" font-size="15" fill="var(--text)">file.txt</text>
  <text x="70" y="217" font-family="monospace" font-size="15" fill="var(--text)">readme.txt</text>
  <text x="70" y="237" font-family="monospace" font-size="15" fill="var(--text)">my_document.txt</text>
  <text x="70" y="257" font-family="monospace" font-size="15" fill="var(--text)">a.txt</text>
  <text x="70" y="285" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)" font-weight="bold">Does NOT match:</text>
  <text x="70" y="307" font-family="monospace" font-size="15" fill="var(--text-faint)">.hidden.txt  (hidden)</text>
  <text x="70" y="327" font-family="monospace" font-size="15" fill="var(--text-faint)">dir/file.txt  (slash)</text>

  <line x1="50" y1="345" x2="380" y2="345" stroke="var(--border)" stroke-width="1"/>

  <rect x="50" y="355" width="330" height="38" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="215" y="379" font-family="monospace" font-size="18" fill="var(--primary-accent)" text-anchor="middle">file*</text>

  <text x="70" y="415" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="70" y="437" font-family="monospace" font-size="15" fill="var(--text)">file</text>
  <text x="70" y="457" font-family="monospace" font-size="15" fill="var(--text)">file.txt</text>
  <text x="70" y="477" font-family="monospace" font-size="15" fill="var(--text)">file_backup.tar.gz</text>
  <text x="70" y="497" font-family="monospace" font-size="15" fill="var(--text)">files_2024</text>

  <line x1="50" y1="515" x2="380" y2="515" stroke="var(--border)" stroke-width="1"/>

  <rect x="50" y="525" width="330" height="38" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="215" y="549" font-family="monospace" font-size="18" fill="var(--primary-accent)" text-anchor="middle">*data*</text>

  <text x="70" y="585" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="70" y="607" font-family="monospace" font-size="15" fill="var(--text)">data.csv  /  mydata  /  raw_data_2024.txt</text>

  <!-- Panel 2: ? -->
  <rect x="430" y="20" width="370" height="560" rx="6" fill="url(#panelGrad)" filter="url(#shadow)"/>
  <rect x="430" y="20" width="370" height="56" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="430" y="56" width="370" height="20" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="615" y="54" font-family="monospace" font-size="32" font-weight="bold" fill="var(--bg)" text-anchor="middle">?</text>
  <text x="615" y="100" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)" text-anchor="middle">Exactly one character (any)</text>

  <rect x="450" y="115" width="330" height="38" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="615" y="139" font-family="monospace" font-size="18" fill="var(--warn-accent)" text-anchor="middle">file?.txt</text>

  <text x="470" y="175" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="470" y="197" font-family="monospace" font-size="15" fill="var(--text)">file1.txt</text>
  <text x="470" y="217" font-family="monospace" font-size="15" fill="var(--text)">fileA.txt</text>
  <text x="470" y="237" font-family="monospace" font-size="15" fill="var(--text)">file_.txt</text>
  <text x="470" y="257" font-family="monospace" font-size="15" fill="var(--text)">file .txt  (space counts!)</text>
  <text x="470" y="285" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)" font-weight="bold">Does NOT match:</text>
  <text x="470" y="307" font-family="monospace" font-size="15" fill="var(--text-faint)">file.txt  (no char)</text>
  <text x="470" y="327" font-family="monospace" font-size="15" fill="var(--text-faint)">file10.txt  (two chars)</text>

  <line x1="450" y1="345" x2="780" y2="345" stroke="var(--border)" stroke-width="1"/>

  <rect x="450" y="355" width="330" height="38" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="615" y="379" font-family="monospace" font-size="18" fill="var(--warn-accent)" text-anchor="middle">???</text>

  <text x="470" y="415" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="470" y="437" font-family="monospace" font-size="15" fill="var(--text)">abc  /  123  /  foo  /  a.b</text>
  <text x="470" y="457" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-accent)" font-weight="bold">Not:</text>
  <text x="470" y="479" font-family="monospace" font-size="15" fill="var(--text-faint)">ab (2 chars)  /  abcd (4 chars)</text>

  <line x1="450" y1="495" x2="780" y2="495" stroke="var(--border)" stroke-width="1"/>

  <rect x="450" y="510" width="330" height="38" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="615" y="534" font-family="monospace" font-size="18" fill="var(--warn-accent)" text-anchor="middle">file?.*</text>

  <text x="470" y="570" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="470" y="592" font-family="monospace" font-size="15" fill="var(--text)">file1.txt  /  fileA.md  /  fileZ.sh</text>

  <!-- Panel 3: [...] -->
  <rect x="830" y="20" width="420" height="560" rx="6" fill="url(#panelGrad)" filter="url(#shadow)"/>
  <rect x="830" y="20" width="420" height="56" rx="6" fill="var(--info-accent)"/>
  <rect x="830" y="56" width="420" height="20" fill="var(--info-accent)" rx="6"/>
  <text x="1040" y="54" font-family="monospace" font-size="28" font-weight="bold" fill="var(--bg)" text-anchor="middle">[...]</text>
  <text x="1040" y="100" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)" text-anchor="middle">Match one char from set or range</text>

  <rect x="850" y="115" width="380" height="38" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1040" y="139" font-family="monospace" font-size="18" fill="var(--info-accent)" text-anchor="middle">file[123].txt</text>
  <text x="870" y="175" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="870" y="197" font-family="monospace" font-size="15" fill="var(--text)">file1.txt  /  file2.txt  /  file3.txt</text>

  <line x1="850" y1="215" x2="1230" y2="215" stroke="var(--border)" stroke-width="1"/>
  <rect x="850" y="225" width="380" height="38" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1040" y="249" font-family="monospace" font-size="18" fill="var(--info-accent)" text-anchor="middle">file[0-9].txt</text>
  <text x="870" y="285" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="870" y="307" font-family="monospace" font-size="15" fill="var(--text)">file0.txt through file9.txt</text>

  <line x1="850" y1="325" x2="1230" y2="325" stroke="var(--border)" stroke-width="1"/>
  <rect x="850" y="335" width="380" height="38" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1040" y="359" font-family="monospace" font-size="18" fill="var(--info-accent)" text-anchor="middle">file[a-zA-Z].txt</text>
  <text x="870" y="395" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="870" y="417" font-family="monospace" font-size="15" fill="var(--text)">filea.txt through fileZ.txt</text>

  <line x1="850" y1="435" x2="1230" y2="435" stroke="var(--border)" stroke-width="1"/>
  <rect x="850" y="445" width="380" height="38" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1040" y="469" font-family="monospace" font-size="18" fill="var(--danger-accent)" text-anchor="middle">file[!0-9].txt  or  [^0-9]</text>
  <text x="870" y="505" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" font-weight="bold">Negation — NOT in set:</text>
  <text x="870" y="527" font-family="monospace" font-size="15" fill="var(--text)">filea.txt  /  fileX.txt</text>
  <text x="870" y="547" font-family="monospace" font-size="15" fill="var(--text-faint)">NOT: file1.txt, file7.txt</text>

  <line x1="850" y1="565" x2="1230" y2="565" stroke="var(--border)" stroke-width="1"/>
  <rect x="850" y="575" width="380" height="35" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1040" y="598" font-family="monospace" font-size="16" fill="var(--info-accent)" text-anchor="middle">[[:digit:]]  [[:alpha:]]  [[:alnum:]]</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Panel 1: * -->
  <rect x="40" y="40" width="363.934426" height="550.508372" rx="6.400888" fill="url(#panelGrad)"/>
  <rect x="40" y="40" width="363.934426" height="55.050837" rx="6.400888" fill="url(#blueGrad)"/>
  <rect x="40" y="75.389824" width="363.934426" height="19.661013" fill="url(#blueGrad)" rx="6.400888"/>
  <text x="221.967213" y="73.423723" font-size="31.466554" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">*</text>
  <text x="221.967213" y="118.644053" font-family="Arial, sans-serif" font-size="15.733277" fill="var(--text-muted)" text-anchor="middle">Any chars (not /)</text>

  <rect x="59.672131" y="133.389867" width="324.590164" height="37.355925" rx="6.400888" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.967213" y="156.983083" font-size="17.69995" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">*.txt</text>

  <text x="79.344262" y="192.372907" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="79.344262" y="213.999913" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">file.txt</text>
  <text x="79.344262" y="233.660926" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">readme.txt</text>
  <text x="79.344262" y="253.32194" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">my_document.txt</text>
  <text x="79.344262" y="272.982953" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">a.txt</text>
  <text x="79.344262" y="300.508372" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--danger-accent)" font-weight="bold">Not:</text>
  <text x="79.344262" y="322.135595" font-size="14.749887" fill="var(--text-faint)" font-family="Courier New, monospace">.hidden.txt</text>
  <text x="79.344262" y="341.796608" font-size="14.749887" fill="var(--text-faint)" font-family="Courier New, monospace">dir/file.txt</text>

  <line x1="59.672131" y1="359.491411" x2="384.262295" y2="359.491411" stroke="var(--border)" stroke-width="1"/>

  <rect x="59.672131" y="369.322027" width="324.590164" height="37.355925" rx="6.400888" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.967213" y="392.915242" font-size="17.69995" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">file*</text>

  <text x="79.344262" y="428.305066" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="79.344262" y="449.932072" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">file</text>
  <text x="79.344262" y="469.593086" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">file.txt</text>
  <text x="79.344262" y="489.254099" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">file_backup.tar.gz</text>
  <text x="79.344262" y="508.915112" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">files_2024</text>

  <line x1="59.672131" y1="526.610133" x2="384.262295" y2="526.610133" stroke="var(--border)" stroke-width="1"/>

  <rect x="59.672131" y="536.440531" width="324.590164" height="37.355925" rx="6.400888" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.967213" y="560.033747" font-size="17.69995" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">*data*</text>

  <text x="79.344262" y="595.423571" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="79.344262" y="617.050794" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">data.csv / mydata / raw_data.txt</text>

  <!-- Panel 2: ? -->
  <rect x="433.442623" y="40" width="363.934426" height="550.508372" rx="6.400888" fill="url(#panelGrad)"/>
  <rect x="433.442623" y="40" width="363.934426" height="55.050837" rx="6.400888" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="433.442623" y="75.389824" width="363.934426" height="19.661013" fill="url(#grad-warn)" rx="6.400888" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.409836" y="73.423723" font-size="31.466554" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">?</text>
  <text x="615.409836" y="118.644053" font-family="Arial, sans-serif" font-size="15.733277" fill="var(--text-muted)" text-anchor="middle">One character</text>

  <rect x="453.114754" y="133.389867" width="324.590164" height="37.355925" rx="6.400888" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.409836" y="156.983083" font-size="17.69995" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">file?.txt</text>

  <text x="472.786885" y="192.372907" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="472.786885" y="213.999913" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">file1.txt</text>
  <text x="472.786885" y="233.660926" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">fileA.txt</text>
  <text x="472.786885" y="253.32194" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">file_.txt</text>
  <text x="472.786885" y="272.982953" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">file .txt</text>
  <text x="472.786885" y="300.508372" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--danger-accent)" font-weight="bold">Not:</text>
  <text x="472.786885" y="322.135595" font-size="14.749887" fill="var(--text-faint)" font-family="Courier New, monospace">file.txt</text>
  <text x="472.786885" y="341.796608" font-size="14.749887" fill="var(--text-faint)" font-family="Courier New, monospace">file10.txt</text>

  <line x1="453.114754" y1="359.491411" x2="777.704918" y2="359.491411" stroke="var(--border)" stroke-width="1"/>

  <rect x="453.114754" y="369.322027" width="324.590164" height="37.355925" rx="6.400888" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.409836" y="392.915242" font-size="17.69995" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">???</text>

  <text x="472.786885" y="428.305066" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="472.786885" y="449.932072" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">abc / 123 / foo</text>
  <text x="472.786885" y="469.593086" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--danger-accent)" font-weight="bold">Not:</text>
  <text x="472.786885" y="491.220309" font-size="14.749887" fill="var(--text-faint)" font-family="Courier New, monospace">ab / abcd</text>

  <line x1="453.114754" y1="506.949119" x2="777.704918" y2="506.949119" stroke="var(--border)" stroke-width="1"/>

  <rect x="453.114754" y="521.694825" width="324.590164" height="37.355925" rx="6.400888" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.409836" y="545.288041" font-size="17.69995" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">file?.*</text>

  <text x="472.786885" y="580.677865" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="472.786885" y="602.30498" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">file1.txt / fileA.md</text>

  <!-- Panel 3: [...] -->
  <rect x="826.885246" y="40" width="413.114754" height="550.508372" rx="6.400888" fill="url(#panelGrad)"/>
  <rect x="826.885246" y="40" width="413.114754" height="55.050837" rx="6.400888" fill="var(--info-accent)"/>
  <rect x="826.885246" y="75.389824" width="413.114754" height="19.661013" fill="var(--info-accent)" rx="6.400888"/>
  <text x="1033.442623" y="73.423723" font-size="27.533208" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">[...]</text>
  <text x="1033.442623" y="118.644053" font-family="Arial, sans-serif" font-size="15.733277" fill="var(--text-muted)" text-anchor="middle">One char from set</text>

  <rect x="846.557377" y="133.389867" width="373.770492" height="37.355925" rx="6.400888" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.442623" y="156.983083" font-size="17.69995" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">file[123].txt</text>
  <text x="866.229508" y="192.372907" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="866.229508" y="213.999913" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">file1.txt / file2.txt</text>

  <line x1="846.557377" y1="231.694934" x2="1220.327869" y2="231.694934" stroke="var(--border)" stroke-width="1"/>
  <rect x="846.557377" y="241.525332" width="373.770492" height="37.355925" rx="6.400888" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.442623" y="265.118548" font-size="17.69995" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">file[0-9].txt</text>
  <text x="866.229508" y="300.508372" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="866.229508" y="322.135595" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">file0.txt ... file9.txt</text>

  <line x1="846.557377" y1="339.830398" x2="1220.327869" y2="339.830398" stroke="var(--border)" stroke-width="1"/>
  <rect x="846.557377" y="349.661013" width="373.770492" height="37.355925" rx="6.400888" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.442623" y="373.254229" font-size="17.69995" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">file[a-zA-Z].txt</text>
  <text x="866.229508" y="408.644053" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--ok-accent)" font-weight="bold">Matches:</text>
  <text x="866.229508" y="430.271059" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">filea.txt ... fileZ.txt</text>

  <line x1="846.557377" y1="447.96608" x2="1220.327869" y2="447.96608" stroke="var(--border)" stroke-width="1"/>
  <rect x="846.557377" y="457.796478" width="373.770492" height="37.355925" rx="6.400888" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.442623" y="481.389694" font-size="17.69995" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">file[!0-9].txt  or  [^0-9]</text>
  <text x="866.229508" y="516.779518" font-family="Arial, sans-serif" font-size="13.766604" fill="var(--text-muted)" font-weight="bold">Negation:</text>
  <text x="866.229508" y="538.406741" font-size="14.749887" fill="var(--text)" font-family="Courier New, monospace">filea.txt</text>
  <text x="866.229508" y="558.067754" font-size="14.749887" fill="var(--text-faint)" font-family="Courier New, monospace">Not: file1.txt</text>

  <line x1="846.557377" y1="575.762557" x2="1220.327869" y2="575.762557" stroke="var(--border)" stroke-width="1"/>
  <rect x="846.557377" y="585.593173" width="373.770492" height="34.406827" rx="6.400888" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.442623" y="608.203284" font-size="15.733277" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">[[:digit:]]  [[:alpha:]]  [[:alnum:]]</text>

</svg>

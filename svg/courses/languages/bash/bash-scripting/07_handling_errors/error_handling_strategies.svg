<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Title bar -->
  <rect x="77.5" y="58.125" width="1125" height="49.8438" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="88.9375" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--bg)" text-anchor="middle" font-weight="bold">Bash Error Handling Strategies</text>

  <!-- set -e -->
  <rect x="77.5" y="130.625" width="337.5" height="126.875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="246.25" y="156" font-family="monospace" font-size="16.5914" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">set -e</text>
  <text x="246.25" y="177.75" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Exit on any error</text>
  <text x="96.25" y="201.3125" font-family="monospace" font-size="11.9827" fill="var(--text)">#!/bin/bash</text>
  <text x="96.25" y="219.4375" font-family="monospace" font-size="11.9827" fill="var(--text)">set -e</text>
  <text x="96.25" y="237.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">script stops at first failing cmd</text>

  <!-- set -u -->
  <rect x="471.25" y="130.625" width="337.5" height="126.875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="156" font-family="monospace" font-size="16.5914" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">set -u</text>
  <text x="640" y="177.75" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Error on unset variables</text>
  <text x="490" y="201.3125" font-family="monospace" font-size="11.9827" fill="var(--text)">set -u</text>
  <text x="490" y="219.4375" font-family="monospace" font-size="11.9827" fill="var(--text)">echo $UNDEFINED  # error!</text>
  <text x="490" y="237.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">catches typos in var names</text>

  <!-- set -o pipefail -->
  <rect x="865" y="130.625" width="337.5" height="126.875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1033.75" y="156" font-family="monospace" font-size="14.7479" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">set -o pipefail</text>
  <text x="1033.75" y="177.75" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Pipe failure propagation</text>
  <text x="883.75" y="201.3125" font-family="monospace" font-size="11.9827" fill="var(--text)">false | echo "ok"</text>
  <text x="883.75" y="219.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">without: exits 0 (echo succeeds)</text>
  <text x="883.75" y="237.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">with: exits 1 (false failed)</text>

  <!-- Combined recommended -->
  <rect x="283.75" y="289.2188" width="712.5" height="58.9062" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="314.5938" font-family="monospace" font-size="15.6696" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">Recommended: set -euo pipefail</text>
  <text x="640" y="335.4375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">combine all three at top of every script for maximum safety</text>

  <!-- trap ERR -->
  <rect x="77.5" y="384.375" width="356.25" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="255.625" y="409.75" font-family="monospace" font-size="16.5914" fill="var(--info-accent)" text-anchor="middle" font-weight="bold">trap ERR</text>
  <text x="255.625" y="431.5" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Run cleanup on error</text>
  <text x="96.25" y="453.25" font-family="monospace" font-size="11.0609" fill="var(--text)">cleanup() {</text>
  <text x="96.25" y="470.4688" font-family="monospace" font-size="11.0609" fill="var(--text)">  echo "Error on line $LINENO"</text>
  <text x="96.25" y="487.6875" font-family="monospace" font-size="11.0609" fill="var(--text)">}</text>
  <text x="96.25" y="504.9062" font-family="monospace" font-size="11.0609" fill="var(--text)">trap cleanup ERR</text>
  <text x="96.25" y="520.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">runs function when error occurs</text>

  <!-- Checking $? -->
  <rect x="471.25" y="384.375" width="356.25" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="649.375" y="409.75" font-family="monospace" font-size="16.5914" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Checking $?</text>
  <text x="649.375" y="431.5" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Manual exit code check</text>
  <text x="490" y="453.25" font-family="monospace" font-size="11.0609" fill="var(--text)">cmd</text>
  <text x="490" y="470.4688" font-family="monospace" font-size="11.0609" fill="var(--text)">if [ $? -ne 0 ]; then</text>
  <text x="490" y="487.6875" font-family="monospace" font-size="11.0609" fill="var(--text)">  echo "cmd failed"</text>
  <text x="490" y="504.9062" font-family="monospace" font-size="11.0609" fill="var(--text)">fi</text>
  <text x="490" y="520.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">$? = exit code of last command</text>

  <!-- || die pattern -->
  <rect x="865" y="384.375" width="337.5" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1033.75" y="409.75" font-family="monospace" font-size="16.5914" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">|| die pattern</text>
  <text x="1033.75" y="431.5" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)" text-anchor="middle">Inline error handling</text>
  <text x="883.75" y="453.25" font-family="monospace" font-size="11.0609" fill="var(--text)">die() {</text>
  <text x="883.75" y="470.4688" font-family="monospace" font-size="11.0609" fill="var(--text)">  echo "Error: $1" &gt;&amp;2</text>
  <text x="883.75" y="487.6875" font-family="monospace" font-size="11.0609" fill="var(--text)">  exit 1</text>
  <text x="883.75" y="504.9062" font-family="monospace" font-size="11.0609" fill="var(--text)">}</text>
  <text x="883.75" y="520.3125" font-family="monospace" font-size="11.0609" fill="var(--text)">cmd || die "cmd failed"</text>

  <!-- Arrows from combined box to lower sections -->
  <line x1="415" y1="348.125" x2="255.625" y2="384.375" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="508.75" y1="348.125" x2="555.625" y2="384.375" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="771.25" y1="348.125" x2="1033.75" y2="384.375" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

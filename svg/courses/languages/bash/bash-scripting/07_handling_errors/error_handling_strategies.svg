<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Title bar -->
  <rect x="40" y="40" width="1200" height="61.346215" rx="6.874703" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.923077" font-family="Arial, sans-serif" font-size="23.234548" fill="var(--bg)" text-anchor="middle" font-weight="bold">Bash Error Handling Strategies</text>

  <!-- set -e -->
  <rect x="40" y="129.230769" width="360" height="156.153846" rx="6.874703" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="220" y="160.461538" font-size="19.010157" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">set -e</text>
  <text x="220" y="187.230769" font-family="Arial, sans-serif" font-size="14.785652" fill="var(--text-muted)" text-anchor="middle">Exit on error</text>
  <text x="60" y="216.230769" font-size="13.729584" fill="var(--text)" font-family="Courier New, monospace">#!/bin/bash</text>
  <text x="60" y="238.538462" font-size="13.729584" fill="var(--text)" font-family="Courier New, monospace">set -e</text>
  <text x="60" y="260.846154" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">stops at first failure</text>

  <!-- set -u -->
  <rect x="460" y="129.230769" width="360" height="156.153846" rx="6.874703" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="160.461538" font-size="19.010157" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">set -u</text>
  <text x="640" y="187.230769" font-family="Arial, sans-serif" font-size="14.785652" fill="var(--text-muted)" text-anchor="middle">Unset vars = error</text>
  <text x="480" y="216.230769" font-size="13.729584" fill="var(--text)" font-family="Courier New, monospace">set -u</text>
  <text x="480" y="238.538462" font-size="13.729584" fill="var(--text)" font-family="Courier New, monospace">echo $UNDEFINED  # err</text>
  <text x="480" y="260.846154" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">catches typos</text>

  <!-- set -o pipefail -->
  <rect x="880" y="129.230769" width="360" height="156.153846" rx="6.874703" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1060" y="160.461538" font-size="16.897905" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">set -o pipefail</text>
  <text x="1060" y="187.230769" font-family="Arial, sans-serif" font-size="14.785652" fill="var(--text-muted)" text-anchor="middle">Propagate pipe failure</text>
  <text x="900" y="216.230769" font-size="13.729584" fill="var(--text)" font-family="Courier New, monospace">false | echo ok</text>
  <text x="900" y="238.538462" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">without: exit 0</text>
  <text x="900" y="260.846154" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">with: exit 1</text>

  <!-- Combined recommended -->
  <rect x="260" y="324.423138" width="760" height="72.499938" rx="6.874703" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="355.653908" font-size="17.953974" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">Recommended: set -euo pipefail</text>
  <text x="640" y="381.307692" font-family="Arial, sans-serif" font-size="14.785652" fill="var(--text-muted)" text-anchor="middle">combine all three at script top</text>

  <!-- trap ERR -->
  <rect x="40" y="441.538462" width="380" height="178.461538" rx="6.874703" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="472.769231" font-size="19.010157" fill="var(--info-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">trap ERR</text>
  <text x="230" y="499.538462" font-family="Arial, sans-serif" font-size="14.785652" fill="var(--text-muted)" text-anchor="middle">Cleanup on error</text>
  <text x="60" y="526.307692" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">cleanup() {</text>
  <text x="60" y="547.500062" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">  echo "line $LINENO"</text>
  <text x="60" y="568.692308" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">}</text>
  <text x="60" y="589.884554" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">trap cleanup ERR</text>
  <text x="60" y="608.846154" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">fires on error</text>

  <!-- Checking $? -->
  <rect x="460" y="441.538462" width="380" height="178.461538" rx="6.874703" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650" y="472.769231" font-size="19.010157" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">Checking $?</text>
  <text x="650" y="499.538462" font-family="Arial, sans-serif" font-size="14.785652" fill="var(--text-muted)" text-anchor="middle">Manual check</text>
  <text x="480" y="526.307692" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">cmd</text>
  <text x="480" y="547.500062" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">if [ $? -ne 0 ]; then</text>
  <text x="480" y="568.692308" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">  echo "failed"</text>
  <text x="480" y="589.884554" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">fi</text>
  <text x="480" y="608.846154" font-family="Arial, sans-serif" font-size="12.6734" fill="var(--text-muted)">$? = last exit code</text>

  <!-- || die pattern -->
  <rect x="880" y="441.538462" width="360" height="178.461538" rx="6.874703" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1060" y="472.769231" font-size="19.010157" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">|| die pattern</text>
  <text x="1060" y="499.538462" font-family="Arial, sans-serif" font-size="14.785652" fill="var(--text-muted)" text-anchor="middle">Inline handling</text>
  <text x="900" y="526.307692" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">die() {</text>
  <text x="900" y="547.500062" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">  echo "$1" &gt;&amp;2</text>
  <text x="900" y="568.692308" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">  exit 1</text>
  <text x="900" y="589.884554" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">}</text>
  <text x="900" y="608.846154" font-size="12.6734" fill="var(--text)" font-family="Courier New, monospace">cmd || die "failed"</text>

  <!-- Arrows from combined box to lower sections -->
  <line x1="400" y1="396.923077" x2="230" y2="441.538462" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="396.923077" x2="550" y2="441.538462" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="396.923077" x2="1060" y2="441.538462" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

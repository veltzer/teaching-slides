<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <!-- Main card -->
  <!-- Table header -->
  <rect x="40" y="40" width="1200" height="58" rx="6.4" fill="url(#headerGrad)"/>
  <rect x="40" y="78.666667" width="1200" height="19.333333" fill="url(#headerGrad)" rx="6.4"/>
  <text x="170" y="76.733333" font-family="Arial, sans-serif" font-size="21.630187" font-weight="bold" fill="var(--bg)">Code</text>
  <text x="430" y="76.733333" font-family="Arial, sans-serif" font-size="21.630187" font-weight="bold" fill="var(--bg)">Meaning</text>
  <text x="860" y="76.733333" font-family="Arial, sans-serif" font-size="21.630187" font-weight="bold" fill="var(--bg)">Category</text>

  <!-- Column separators -->
  <line x1="340" y1="40" x2="340" y2="620" stroke="var(--border)" stroke-width="1"/>
  <line x1="760" y1="40" x2="760" y2="620" stroke="var(--border)" stroke-width="1"/>

  <!-- Row 1: 0 = Success (green) -->
  <rect x="40" y="98" width="1200" height="58" fill="url(#grad-ok)" rx="6.4" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="98" width="50" height="58" fill="var(--ok-accent)" rx="6.4"/>
  <text x="90" y="132.8" font-size="25.562987" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">0</text>
  <text x="540" y="132.8" font-family="Arial, sans-serif" font-size="19.663893" fill="var(--ok-accent)" text-anchor="middle">Success</text>
  <rect x="780" y="107.666667" width="160" height="36.733333" rx="6.4" fill="var(--ok-accent)"/>
  <text x="860" y="130.866667" font-family="Arial, sans-serif" font-size="17.697493" font-weight="bold" fill="var(--bg)" text-anchor="middle">SUCCESS</text>

  <!-- Row 2: 1 -->
  <rect x="40" y="156" width="1200" height="58" fill="url(#grad-warn)" rx="6.4" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="156" width="50" height="58" fill="url(#grad-warn)" rx="6.4" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="190.8" font-size="25.562987" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">1</text>
  <text x="540" y="190.8" font-family="Arial, sans-serif" font-size="19.663893" fill="var(--danger-accent)" text-anchor="middle">General error</text>
  <rect x="780" y="165.666667" width="160" height="36.733333" rx="6.4" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="188.866667" font-family="Arial, sans-serif" font-size="17.697493" font-weight="bold" fill="var(--bg)" text-anchor="middle">GENERAL</text>

  <!-- Row 3: 2 -->
  <rect x="40" y="214" width="1200" height="58" fill="url(#grad-danger)" rx="6.4" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="214" width="50" height="58" fill="url(#grad-danger)" rx="6.4" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="248.8" font-size="25.562987" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">2</text>
  <text x="540" y="248.8" font-family="Arial, sans-serif" font-size="19.663893" fill="var(--danger-accent)" text-anchor="middle">Misuse of built-in command</text>
  <rect x="780" y="223.666667" width="160" height="36.733333" rx="6.4" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="246.866667" font-family="Arial, sans-serif" font-size="17.697493" font-weight="bold" fill="var(--bg)" text-anchor="middle">BUILTIN</text>

  <!-- Row 4: 126 -->
  <rect x="40" y="272" width="1200" height="58" fill="url(#grad-danger)" rx="6.4" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="272" width="50" height="58" fill="var(--danger-accent)" rx="6.4"/>
  <text x="90" y="306.8" font-size="21.630187" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">126</text>
  <text x="540" y="306.8" font-family="Arial, sans-serif" font-size="19.663893" fill="var(--danger-accent)" text-anchor="middle">Command found but not executable</text>
  <rect x="780" y="281.666667" width="160" height="36.733333" rx="6.4" fill="var(--danger-accent)"/>
  <text x="860" y="304.866667" font-family="Arial, sans-serif" font-size="16.71424" font-weight="bold" fill="var(--bg)" text-anchor="middle">PERMISSION</text>

  <!-- Row 5: 127 -->
  <rect x="40" y="330" width="1200" height="58" fill="url(#grad-danger)" rx="6.4" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="330" width="50" height="58" fill="var(--danger-accent)" rx="6.4"/>
  <text x="90" y="364.8" font-size="21.630187" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">127</text>
  <text x="540" y="364.8" font-family="Arial, sans-serif" font-size="19.663893" fill="var(--danger-accent)" text-anchor="middle">Command not found</text>
  <rect x="780" y="339.666667" width="160" height="36.733333" rx="6.4" fill="var(--danger-accent)"/>
  <text x="860" y="362.866667" font-family="Arial, sans-serif" font-size="16.71424" font-weight="bold" fill="var(--bg)" text-anchor="middle">NOT FOUND</text>

  <!-- Row 6: 128+N -->
  <rect x="40" y="388" width="1200" height="58" fill="url(#grad-info)" rx="6.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="388" width="50" height="58" fill="var(--info-accent)" rx="6.4"/>
  <text x="90" y="421.833387" font-size="15.731093" font-weight="bold" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">128+N</text>
  <text x="540" y="422.8" font-family="Arial, sans-serif" font-size="19.663893" fill="var(--info-accent)" text-anchor="middle">Killed by signal N</text>
  <rect x="780" y="397.666667" width="160" height="36.733333" rx="6.4" fill="var(--info-accent)"/>
  <text x="860" y="420.866667" font-family="Arial, sans-serif" font-size="16.71424" font-weight="bold" fill="var(--bg)" text-anchor="middle">SIGNAL</text>

  <!-- Row 7: 130 -->
  <rect x="40" y="446" width="1200" height="58" fill="url(#grad-info)" rx="6.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="446" width="50" height="58" fill="url(#grad-info)" rx="6.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="480.8" font-size="21.630187" font-weight="bold" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">130</text>
  <text x="540" y="480.8" font-family="Arial, sans-serif" font-size="19.663893" fill="var(--info-accent)" text-anchor="middle">Killed by Ctrl+C  (128 + SIGINT=2)</text>
  <rect x="780" y="455.666667" width="160" height="36.733333" rx="6.4" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="478.866667" font-family="Arial, sans-serif" font-size="16.71424" font-weight="bold" fill="var(--bg)" text-anchor="middle">SIGINT</text>

  <!-- Row 8: 137 -->
  <rect x="40" y="504" width="1200" height="58" fill="url(#grad-info)" rx="6.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="504" width="50" height="58" fill="url(#grad-info)" rx="6.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="538.8" font-size="21.630187" font-weight="bold" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">137</text>
  <text x="540" y="538.8" font-family="Arial, sans-serif" font-size="19.663893" fill="var(--info-accent)" text-anchor="middle">Killed by SIGKILL  (128 + 9)</text>
  <rect x="780" y="513.666667" width="160" height="36.733333" rx="6.4" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="536.866667" font-family="Arial, sans-serif" font-size="16.71424" font-weight="bold" fill="var(--bg)" text-anchor="middle">SIGKILL</text>

  <!-- Row 9: 143 -->
  <rect x="40" y="562" width="1200" height="58" rx="6.4" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="562" width="50" height="58" fill="url(#grad-info)" rx="6.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="600.666667" width="1200" height="19.333333" rx="6.4" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="596.8" font-size="21.630187" font-weight="bold" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">143</text>
  <text x="540" y="596.8" font-family="Arial, sans-serif" font-size="19.663893" fill="var(--info-accent)" text-anchor="middle">Killed by SIGTERM  (128 + 15)</text>
  <rect x="780" y="571.666667" width="160" height="36.733333" rx="6.4" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="594.866667" font-family="Arial, sans-serif" font-size="16.71424" font-weight="bold" fill="var(--bg)" text-anchor="middle">SIGTERM</text>

</svg>

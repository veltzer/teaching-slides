<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43a047"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Main card -->
  <rect x="77.5" y="58.125" width="1125" height="507.5" rx="6" fill="var(--surface)" filter="url(#shadow)"/>

  <!-- Table header -->
  <rect x="77.5" y="58.125" width="1125" height="54.375" rx="6" fill="url(#headerGrad)"/>
  <rect x="77.5" y="94.375" width="1125" height="18.125" fill="url(#headerGrad)" rx="6"/>
  <text x="199.375" y="92.5625" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)">Code</text>
  <text x="443.125" y="92.5625" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)">Meaning</text>
  <text x="846.25" y="92.5625" font-family="Arial, sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)">Category</text>

  <!-- Column separators -->
  <line x1="358.75" y1="58.125" x2="358.75" y2="601.875" stroke="var(--border)" stroke-width="1"/>
  <line x1="752.5" y1="58.125" x2="752.5" y2="601.875" stroke="var(--border)" stroke-width="1"/>

  <!-- Row 1: 0 = Success (green) -->
  <rect x="77.5" y="112.5" width="1125" height="54.375" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="77.5" y="112.5" width="46.875" height="54.375" fill="var(--ok-accent)" rx="6"/>
  <text x="124.375" y="145.125" font-family="monospace" font-size="23.9653" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">0</text>
  <text x="546.25" y="145.125" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--ok-accent)" text-anchor="middle">Success</text>
  <rect x="771.25" y="121.5625" width="150" height="34.4375" rx="6" fill="var(--ok-accent)"/>
  <text x="846.25" y="143.3125" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">SUCCESS</text>

  <!-- Row 2: 1 -->
  <rect x="77.5" y="166.875" width="1125" height="54.375" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="77.5" y="166.875" width="46.875" height="54.375" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="124.375" y="199.5" font-family="monospace" font-size="23.9653" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">1</text>
  <text x="546.25" y="199.5" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--danger-accent)" text-anchor="middle">General error</text>
  <rect x="771.25" y="175.9375" width="150" height="34.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="846.25" y="197.6875" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">GENERAL</text>

  <!-- Row 3: 2 -->
  <rect x="77.5" y="221.25" width="1125" height="54.375" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="77.5" y="221.25" width="46.875" height="54.375" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="124.375" y="253.875" font-family="monospace" font-size="23.9653" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">2</text>
  <text x="546.25" y="253.875" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--danger-accent)" text-anchor="middle">Misuse of built-in command</text>
  <rect x="771.25" y="230.3125" width="150" height="34.4375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="846.25" y="252.0625" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">BUILTIN</text>

  <!-- Row 4: 126 -->
  <rect x="77.5" y="275.625" width="1125" height="54.375" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="77.5" y="275.625" width="46.875" height="54.375" fill="var(--danger-accent)" rx="6"/>
  <text x="124.375" y="308.25" font-family="monospace" font-size="20.2783" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">126</text>
  <text x="546.25" y="308.25" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--danger-accent)" text-anchor="middle">Command found but not executable</text>
  <rect x="771.25" y="284.6875" width="150" height="34.4375" rx="6" fill="var(--danger-accent)"/>
  <text x="846.25" y="306.4375" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">PERMISSION</text>

  <!-- Row 5: 127 -->
  <rect x="77.5" y="330" width="1125" height="54.375" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="77.5" y="330" width="46.875" height="54.375" fill="var(--danger-accent)" rx="6"/>
  <text x="124.375" y="362.625" font-family="monospace" font-size="20.2783" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">127</text>
  <text x="546.25" y="362.625" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--danger-accent)" text-anchor="middle">Command not found</text>
  <rect x="771.25" y="339.0625" width="150" height="34.4375" rx="6" fill="var(--danger-accent)"/>
  <text x="846.25" y="360.8125" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">NOT FOUND</text>

  <!-- Row 6: 128+N -->
  <rect x="77.5" y="384.375" width="1125" height="54.375" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="77.5" y="384.375" width="46.875" height="54.375" fill="var(--info-accent)" rx="6"/>
  <text x="124.375" y="416.0938" font-family="monospace" font-size="14.7479" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">128+N</text>
  <text x="546.25" y="417" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--info-accent)" text-anchor="middle">Killed by signal N</text>
  <rect x="771.25" y="393.4375" width="150" height="34.4375" rx="6" fill="var(--info-accent)"/>
  <text x="846.25" y="415.1875" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">SIGNAL</text>

  <!-- Row 7: 130 -->
  <rect x="77.5" y="438.75" width="1125" height="54.375" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="77.5" y="438.75" width="46.875" height="54.375" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="124.375" y="471.375" font-family="monospace" font-size="20.2783" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">130</text>
  <text x="546.25" y="471.375" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--info-accent)" text-anchor="middle">Killed by Ctrl+C  (128 + SIGINT=2)</text>
  <rect x="771.25" y="447.8125" width="150" height="34.4375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="846.25" y="469.5625" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">SIGINT</text>

  <!-- Row 8: 137 -->
  <rect x="77.5" y="493.125" width="1125" height="54.375" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="77.5" y="493.125" width="46.875" height="54.375" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="124.375" y="525.75" font-family="monospace" font-size="20.2783" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">137</text>
  <text x="546.25" y="525.75" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--info-accent)" text-anchor="middle">Killed by SIGKILL  (128 + 9)</text>
  <rect x="771.25" y="502.1875" width="150" height="34.4375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="846.25" y="523.9375" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">SIGKILL</text>

  <!-- Row 9: 143 -->
  <rect x="77.5" y="547.5" width="1125" height="54.375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="77.5" y="547.5" width="46.875" height="54.375" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="77.5" y="583.75" width="1125" height="18.125" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="124.375" y="580.125" font-family="monospace" font-size="20.2783" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">143</text>
  <text x="546.25" y="580.125" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--info-accent)" text-anchor="middle">Killed by SIGTERM  (128 + 15)</text>
  <rect x="771.25" y="556.5625" width="150" height="34.4375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="846.25" y="578.3125" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">SIGTERM</text>

</svg>

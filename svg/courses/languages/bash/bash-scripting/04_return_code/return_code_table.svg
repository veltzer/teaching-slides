<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43a047"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Main card -->
  <rect x="40" y="20" width="1200" height="560" rx="6" fill="var(--surface)" filter="url(#shadow)"/>

  <!-- Table header -->
  <rect x="40" y="20" width="1200" height="60" rx="6" fill="url(#headerGrad)"/>
  <rect x="40" y="60" width="1200" height="20" fill="url(#headerGrad)" rx="6"/>
  <text x="170" y="58" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)">Code</text>
  <text x="430" y="58" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)">Meaning</text>
  <text x="860" y="58" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--bg)">Category</text>

  <!-- Column separators -->
  <line x1="340" y1="20" x2="340" y2="620" stroke="var(--border)" stroke-width="1"/>
  <line x1="760" y1="20" x2="760" y2="620" stroke="var(--border)" stroke-width="1"/>

  <!-- Row 1: 0 = Success (green) -->
  <rect x="40" y="80" width="1200" height="60" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="40" y="80" width="50" height="60" fill="var(--ok-accent)" rx="6"/>
  <text x="90" y="116" font-family="monospace" font-size="26" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">0</text>
  <text x="540" y="116" font-family="Arial, sans-serif" font-size="20" fill="var(--ok-accent)" text-anchor="middle">Success</text>
  <rect x="780" y="90" width="160" height="38" rx="6" fill="var(--ok-accent)"/>
  <text x="860" y="114" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">SUCCESS</text>

  <!-- Row 2: 1 -->
  <rect x="40" y="140" width="1200" height="60" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="40" y="140" width="50" height="60" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="90" y="176" font-family="monospace" font-size="26" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">1</text>
  <text x="540" y="176" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-accent)" text-anchor="middle">General error</text>
  <rect x="780" y="150" width="160" height="38" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="860" y="174" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">GENERAL</text>

  <!-- Row 3: 2 -->
  <rect x="40" y="200" width="1200" height="60" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="40" y="200" width="50" height="60" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="90" y="236" font-family="monospace" font-size="26" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">2</text>
  <text x="540" y="236" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-accent)" text-anchor="middle">Misuse of built-in command</text>
  <rect x="780" y="210" width="160" height="38" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="860" y="234" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">BUILTIN</text>

  <!-- Row 4: 126 -->
  <rect x="40" y="260" width="1200" height="60" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="40" y="260" width="50" height="60" fill="var(--danger-accent)" rx="6"/>
  <text x="90" y="296" font-family="monospace" font-size="22" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">126</text>
  <text x="540" y="296" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-accent)" text-anchor="middle">Command found but not executable</text>
  <rect x="780" y="270" width="160" height="38" rx="6" fill="var(--danger-accent)"/>
  <text x="860" y="294" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">PERMISSION</text>

  <!-- Row 5: 127 -->
  <rect x="40" y="320" width="1200" height="60" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="40" y="320" width="50" height="60" fill="var(--danger-accent)" rx="6"/>
  <text x="90" y="356" font-family="monospace" font-size="22" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">127</text>
  <text x="540" y="356" font-family="Arial, sans-serif" font-size="20" fill="var(--danger-accent)" text-anchor="middle">Command not found</text>
  <rect x="780" y="330" width="160" height="38" rx="6" fill="var(--danger-accent)"/>
  <text x="860" y="354" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">NOT FOUND</text>

  <!-- Row 6: 128+N -->
  <rect x="40" y="380" width="1200" height="60" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="40" y="380" width="50" height="60" fill="var(--info-accent)" rx="6"/>
  <text x="90" y="415" font-family="monospace" font-size="16" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">128+N</text>
  <text x="540" y="416" font-family="Arial, sans-serif" font-size="20" fill="var(--info-accent)" text-anchor="middle">Killed by signal N</text>
  <rect x="780" y="390" width="160" height="38" rx="6" fill="var(--info-accent)"/>
  <text x="860" y="414" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">SIGNAL</text>

  <!-- Row 7: 130 -->
  <rect x="40" y="440" width="1200" height="60" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="40" y="440" width="50" height="60" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="90" y="476" font-family="monospace" font-size="22" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">130</text>
  <text x="540" y="476" font-family="Arial, sans-serif" font-size="20" fill="var(--info-accent)" text-anchor="middle">Killed by Ctrl+C  (128 + SIGINT=2)</text>
  <rect x="780" y="450" width="160" height="38" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="860" y="474" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">SIGINT</text>

  <!-- Row 8: 137 -->
  <rect x="40" y="500" width="1200" height="60" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="40" y="500" width="50" height="60" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="90" y="536" font-family="monospace" font-size="22" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">137</text>
  <text x="540" y="536" font-family="Arial, sans-serif" font-size="20" fill="var(--info-accent)" text-anchor="middle">Killed by SIGKILL  (128 + 9)</text>
  <rect x="780" y="510" width="160" height="38" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="860" y="534" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">SIGKILL</text>

  <!-- Row 9: 143 -->
  <rect x="40" y="560" width="1200" height="60" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="40" y="560" width="50" height="60" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="40" y="600" width="1200" height="20" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="90" y="596" font-family="monospace" font-size="22" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">143</text>
  <text x="540" y="596" font-family="Arial, sans-serif" font-size="20" fill="var(--info-accent)" text-anchor="middle">Killed by SIGTERM  (128 + 15)</text>
  <rect x="780" y="570" width="160" height="38" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="860" y="594" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">SIGTERM</text>

</svg>

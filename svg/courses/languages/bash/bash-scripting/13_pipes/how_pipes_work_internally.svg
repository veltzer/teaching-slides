<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="17.7778" y="44.4444" width="248.8889" height="151.1111" rx="8.8889" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="142.2222" y="108.4444" font-size="23.1111" font-weight="bold" fill="#1565c0" text-anchor="middle">command1</ns0:text>
  <ns0:text x="142.2222" y="142.2222" font-size="17.7778" fill="#333" text-anchor="middle" font-family="monospace">stdout = fd 1</ns0:text>
  <ns0:text x="142.2222" y="174.2222" font-size="14.2222" fill="#555" text-anchor="middle">writes to pipe</ns0:text>
  <ns0:line x1="266.6667" y1="120" x2="344.8889" y2="120" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="346.6667" y="44.4444" width="444.4444" height="151.1111" rx="8.8889" fill="#fff3e0" stroke="#f57c00" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="97.7778" font-size="21.3333" font-weight="bold" fill="#e65100" text-anchor="middle">pipe buffer</ns0:text>
  <ns0:text x="568.8889" y="133.3333" font-size="17.7778" fill="#555" text-anchor="middle">4 KB - 64 KB  (kernel memory)</ns0:text>
  <ns0:text x="568.8889" y="165.3333" font-size="14.2222" fill="#888" text-anchor="middle">managed by the kernel automatically</ns0:text>
  <ns0:line x1="791.1111" y1="120" x2="869.3333" y2="120" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="871.1111" y="44.4444" width="248.8889" height="151.1111" rx="8.8889" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="995.5556" y="108.4444" font-size="23.1111" font-weight="bold" fill="#2e7d32" text-anchor="middle">command2</ns0:text>
  <ns0:text x="995.5556" y="142.2222" font-size="17.7778" fill="#333" text-anchor="middle" font-family="monospace">stdin = fd 0</ns0:text>
  <ns0:text x="995.5556" y="174.2222" font-size="14.2222" fill="#555" text-anchor="middle">reads from pipe</ns0:text>
  <ns0:rect x="17.7778" y="229.3333" width="1102.2222" height="302.2222" rx="8.8889" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:circle cx="44.4444" cy="273.7778" r="14.2222" fill="url(#grad-primary)" />
  <ns0:text x="44.4444" y="279.1111" font-size="14.2222" font-weight="bold" fill="#ffffff" text-anchor="middle">1</ns0:text>
  <ns0:text x="71.1111" y="279.1111" font-size="19.5556" fill="#222">Shell calls pipe() — kernel returns two file descriptors: read end and write end</ns0:text>
  <ns0:circle cx="44.4444" cy="327.1111" r="14.2222" fill="url(#grad-primary)" />
  <ns0:text x="44.4444" y="332.4444" font-size="14.2222" font-weight="bold" fill="#ffffff" text-anchor="middle">2</ns0:text>
  <ns0:text x="71.1111" y="332.4444" font-size="19.5556" fill="#222">Shell forks command1, connects its stdout (fd 1) to the pipe write end</ns0:text>
  <ns0:circle cx="44.4444" cy="380.4444" r="14.2222" fill="url(#grad-primary)" />
  <ns0:text x="44.4444" y="385.7778" font-size="14.2222" font-weight="bold" fill="#ffffff" text-anchor="middle">3</ns0:text>
  <ns0:text x="71.1111" y="385.7778" font-size="19.5556" fill="#222">Shell forks command2, connects its stdin (fd 0) to the pipe read end</ns0:text>
  <ns0:circle cx="44.4444" cy="433.7778" r="14.2222" fill="url(#grad-primary)" />
  <ns0:text x="44.4444" y="439.1111" font-size="14.2222" font-weight="bold" fill="#ffffff" text-anchor="middle">4</ns0:text>
  <ns0:text x="71.1111" y="439.1111" font-size="19.5556" fill="#222">Both commands run <ns0:tspan font-weight="bold" fill="#1565c0">concurrently</ns0:tspan> — they do not wait for each other</ns0:text>
  <ns0:circle cx="44.4444" cy="487.1111" r="14.2222" fill="url(#grad-primary)" />
  <ns0:text x="44.4444" y="492.4444" font-size="14.2222" font-weight="bold" fill="#ffffff" text-anchor="middle">5</ns0:text>
  <ns0:text x="71.1111" y="492.4444" font-size="19.5556" fill="#222">Kernel manages back-pressure: command1 blocks when buffer is full</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <rect x="169.4166" y="178.1455" width="237.9075" height="112.1123" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="288.3704" y="225.6284" font-size="19.4625" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">command1</text>
  <text x="288.3704" y="250.6888" font-size="14.9713" fill="var(--text)" text-anchor="middle" font-family="monospace">stdout = fd 1</text>
  <text x="288.3704" y="274.4303" font-size="11.9769" fill="var(--text-muted)" text-anchor="middle">writes to pipe</text>
  <line x1="407.3241" y1="234.2017" x2="482.0949" y2="234.2017" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="483.7943" y="178.1455" width="424.8345" height="112.1123" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="696.2116" y="217.7146" font-size="17.9655" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">pipe buffer</text>
  <text x="696.2116" y="244.094" font-size="14.9713" fill="var(--text-muted)" text-anchor="middle">4 KB - 64 KB  (kernel memory)</text>
  <text x="696.2116" y="267.8354" font-size="11.9769" fill="var(--text-faint)" text-anchor="middle">managed by the kernel automatically</text>
  <line x1="908.629" y1="234.2017" x2="983.3998" y2="234.2017" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="985.0992" y="178.1455" width="237.9075" height="112.1123" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1104.0529" y="225.6284" font-size="19.4625" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">command2</text>
  <text x="1104.0529" y="250.6888" font-size="14.9713" fill="var(--text)" text-anchor="middle" font-family="monospace">stdin = fd 0</text>
  <text x="1104.0529" y="274.4303" font-size="11.9769" fill="var(--text-muted)" text-anchor="middle">reads from pipe</text>
  <rect x="169.4166" y="315.3183" width="1053.59" height="224.2246" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <circle cx="194.9067" cy="348.2925" r="11.9769" fill="url(#grad-primary)" />
  <text x="194.9067" y="352.2494" font-size="11.9769" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="220.3968" y="352.2494" font-size="16.4683" fill="var(--text)">Shell calls pipe() — kernel returns two file descriptors: read end and write end</text>
  <circle cx="194.9067" cy="387.8615" r="11.9769" fill="url(#grad-primary)" />
  <text x="194.9067" y="391.8184" font-size="11.9769" font-weight="bold" fill="var(--bg)" text-anchor="middle">2</text>
  <text x="220.3968" y="391.8184" font-size="16.4683" fill="var(--text)">Shell forks command1, connects its stdout (fd 1) to the pipe write end</text>
  <circle cx="194.9067" cy="427.4306" r="11.9769" fill="url(#grad-primary)" />
  <text x="194.9067" y="431.3875" font-size="11.9769" font-weight="bold" fill="var(--bg)" text-anchor="middle">3</text>
  <text x="220.3968" y="431.3875" font-size="16.4683" fill="var(--text)">Shell forks command2, connects its stdin (fd 0) to the pipe read end</text>
  <circle cx="194.9067" cy="466.9996" r="11.9769" fill="url(#grad-primary)" />
  <text x="194.9067" y="470.9565" font-size="11.9769" font-weight="bold" fill="var(--bg)" text-anchor="middle">4</text>
  <text x="220.3968" y="470.9565" font-size="16.4683" fill="var(--text)">Both commands run <tspan font-weight="bold" fill="var(--primary-accent)">concurrently</tspan> — they do not wait for each other</text>
  <circle cx="194.9067" cy="506.5687" r="11.9769" fill="url(#grad-primary)" />
  <text x="194.9067" y="510.5256" font-size="11.9769" font-weight="bold" fill="var(--bg)" text-anchor="middle">5</text>
  <text x="220.3968" y="510.5256" font-size="16.4683" fill="var(--text)">Kernel manages back-pressure: command1 blocks when buffer is full</text>
</svg>
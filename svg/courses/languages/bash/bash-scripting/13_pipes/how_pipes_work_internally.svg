<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="44.4444" width="248.8889" height="151.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="142.2222" y="108.4444" font-size="23.1111" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">command1</text>
  <text x="142.2222" y="142.2222" font-size="17.7778" fill="var(--text)" text-anchor="middle" font-family="monospace">stdout = fd 1</text>
  <text x="142.2222" y="174.2222" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">writes to pipe</text>
  <line x1="266.6667" y1="120" x2="344.8889" y2="120" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="346.6667" y="44.4444" width="444.4444" height="151.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="97.7778" font-size="21.3333" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">pipe buffer</text>
  <text x="568.8889" y="133.3333" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">4 KB - 64 KB  (kernel memory)</text>
  <text x="568.8889" y="165.3333" font-size="14.2222" fill="var(--text-faint)" text-anchor="middle">managed by the kernel automatically</text>
  <line x1="791.1111" y1="120" x2="869.3333" y2="120" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="871.1111" y="44.4444" width="248.8889" height="151.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="995.5556" y="108.4444" font-size="23.1111" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">command2</text>
  <text x="995.5556" y="142.2222" font-size="17.7778" fill="var(--text)" text-anchor="middle" font-family="monospace">stdin = fd 0</text>
  <text x="995.5556" y="174.2222" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">reads from pipe</text>
  <rect x="17.7778" y="229.3333" width="1102.2222" height="302.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <circle cx="44.4444" cy="273.7778" r="14.2222" fill="url(#grad-primary)" />
  <text x="44.4444" y="279.1111" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="71.1111" y="279.1111" font-size="19.5556" fill="var(--text)">Shell calls pipe() — kernel returns two file descriptors: read end and write end</text>
  <circle cx="44.4444" cy="327.1111" r="14.2222" fill="url(#grad-primary)" />
  <text x="44.4444" y="332.4444" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">2</text>
  <text x="71.1111" y="332.4444" font-size="19.5556" fill="var(--text)">Shell forks command1, connects its stdout (fd 1) to the pipe write end</text>
  <circle cx="44.4444" cy="380.4444" r="14.2222" fill="url(#grad-primary)" />
  <text x="44.4444" y="385.7778" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">3</text>
  <text x="71.1111" y="385.7778" font-size="19.5556" fill="var(--text)">Shell forks command2, connects its stdin (fd 0) to the pipe read end</text>
  <circle cx="44.4444" cy="433.7778" r="14.2222" fill="url(#grad-primary)" />
  <text x="44.4444" y="439.1111" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">4</text>
  <text x="71.1111" y="439.1111" font-size="19.5556" fill="var(--text)">Both commands run <tspan font-weight="bold" fill="var(--primary-accent)">concurrently</tspan> — they do not wait for each other</text>
  <circle cx="44.4444" cy="487.1111" r="14.2222" fill="url(#grad-primary)" />
  <text x="44.4444" y="492.4444" font-size="14.2222" font-weight="bold" fill="var(--bg)" text-anchor="middle">5</text>
  <text x="71.1111" y="492.4444" font-size="19.5556" fill="var(--text)">Kernel manages back-pressure: command1 blocks when buffer is full</text>
</svg>
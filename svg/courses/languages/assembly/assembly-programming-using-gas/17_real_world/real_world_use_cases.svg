<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <!-- Title -->
  <rect x="40" y="40" width="1200" height="42.890752" rx="6.373938" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="67.294115" font-family="Arial, sans-serif" font-size="19.583817" font-weight="bold" fill="var(--bg)" text-anchor="middle">Real-World Assembly Use Cases</text>

  <!-- Row 1: Cryptography -->
  <rect x="40" y="98.48739" width="373.770492" height="165.71427" rx="6.373938" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="98.48739" width="373.770492" height="38.991593" rx="6.373938" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="226.885246" y="123.831817" font-family="Arial, sans-serif" font-size="14.687783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Cryptography</text>
  <text x="59.672131" y="154.050356" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- AES-NI hardware instructions</text>
  <text x="59.672131" y="174.520888" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Constant-time implementations</text>
  <text x="59.672131" y="194.991528" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- SHA hash extensions (SHA-NI)</text>
  <text x="59.672131" y="215.462169" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Used in OpenSSL, libsodium</text>
  <text x="59.672131" y="235.932701" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">aesenc %xmm1, %xmm0</text>
  <text x="59.672131" y="253.478918" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--text-faint)">Single-round AES encryption</text>

  <!-- Codecs -->
  <rect x="433.442623" y="98.48739" width="373.770492" height="165.71427" rx="6.373938" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="433.442623" y="98.48739" width="373.770492" height="38.991593" rx="6.373938" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="620.327869" y="123.831817" font-family="Arial, sans-serif" font-size="14.687783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Media Codecs</text>
  <text x="453.114754" y="154.050356" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Video encoding (H.264, AV1)</text>
  <text x="453.114754" y="174.520888" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Audio DSP (MP3, AAC filters)</text>
  <text x="453.114754" y="194.991528" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- SIMD pixel/sample processing</text>
  <text x="453.114754" y="215.462169" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Used in FFmpeg, x264, dav1d</text>
  <text x="453.114754" y="235.932701" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">pmaddwd %xmm2, %xmm1</text>
  <text x="453.114754" y="253.478918" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--text-faint)">SIMD multiply-add for DCT</text>

  <!-- Kernel -->
  <rect x="826.885246" y="98.48739" width="413.114754" height="165.71427" rx="6.373938" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="826.885246" y="98.48739" width="413.114754" height="38.991593" rx="6.373938" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1033.442623" y="123.831817" font-family="Arial, sans-serif" font-size="14.687783" font-weight="bold" fill="var(--bg)" text-anchor="middle">OS Kernel Code</text>
  <text x="846.557377" y="154.050356" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Boot sequence and boot loaders</text>
  <text x="846.557377" y="174.520888" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Context switch (save/restore regs)</text>
  <text x="846.557377" y="194.991528" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Interrupt / syscall entry points</text>
  <text x="846.557377" y="215.462169" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Used in Linux, FreeBSD kernels</text>
  <text x="846.557377" y="235.932701" font-family="monospace" font-size="11.750248" fill="var(--warn-accent)">swapgs; sysretq</text>
  <text x="846.557377" y="253.478918" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--text-faint)">Fast syscall return path</text>

  <!-- Row 2: Embedded -->
  <rect x="40" y="283.697349" width="373.770492" height="165.71427" rx="6.373938" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="283.697349" width="373.770492" height="38.991593" rx="6.373938" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="226.885246" y="309.041992" font-family="Arial, sans-serif" font-size="14.687783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Embedded Systems</text>
  <text x="59.672131" y="339.260423" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Microcontroller startup code</text>
  <text x="59.672131" y="359.731063" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Real-time interrupt handlers</text>
  <text x="59.672131" y="380.201595" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Hardware peripheral drivers</text>
  <text x="59.672131" y="400.672128" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- ARM Cortex-M, AVR, RISC-V</text>
  <text x="59.672131" y="421.142768" font-family="monospace" font-size="11.750248" fill="var(--info-accent)">cpsid i ; disable interrupts</text>
  <text x="59.672131" y="438.688985" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--text-faint)">ARM: critical section entry</text>

  <!-- Hot paths -->
  <rect x="433.442623" y="283.697349" width="373.770492" height="165.71427" rx="6.373938" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="433.442623" y="283.697349" width="373.770492" height="38.991593" rx="6.373938" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="620.327869" y="309.041992" font-family="Arial, sans-serif" font-size="14.687783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Performance Hot Paths</text>
  <text x="453.114754" y="339.260423" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Inner loops (memcpy, memset)</text>
  <text x="453.114754" y="359.731063" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- String operations (strlen, strcmp)</text>
  <text x="453.114754" y="380.201595" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Database sort/search kernels</text>
  <text x="453.114754" y="400.672128" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Game engine math routines</text>
  <text x="453.114754" y="421.142768" font-family="monospace" font-size="11.750248" fill="var(--danger-accent)">rep movsq</text>
  <text x="453.114754" y="438.688985" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--text-faint)">Fast 64-bit memory copy loop</text>

  <!-- Security / RE -->
  <rect x="826.885246" y="283.697349" width="413.114754" height="165.71427" rx="6.373938" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="826.885246" y="283.697349" width="413.114754" height="38.991593" rx="6.373938" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1033.442623" y="309.041992" font-family="Arial, sans-serif" font-size="14.687783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Security and Reverse Engineering</text>
  <text x="846.557377" y="339.260423" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Shellcode / exploit development</text>
  <text x="846.557377" y="359.731063" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Malware analysis (disassembly)</text>
  <text x="846.557377" y="380.201595" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Vulnerability research</text>
  <text x="846.557377" y="400.672128" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- CTF (Capture the Flag) challenges</text>
  <text x="846.557377" y="421.142768" font-family="monospace" font-size="11.750248" fill="var(--text-muted)">objdump -d binary | less</text>
  <text x="846.557377" y="438.688985" font-family="Arial, sans-serif" font-size="10.771105" fill="var(--text-faint)">Disassemble to study behavior</text>

  <!-- Bottom: decision guide -->
  <rect x="40" y="468.907523" width="1200" height="151.092477" rx="6.373938" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="491.327635" font-family="Arial, sans-serif" font-size="14.687783" font-weight="bold" fill="var(--text)" text-anchor="middle">When to Use Assembly vs. C</text>

  <!-- Use assembly -->
  <rect x="59.672131" y="503.025113" width="531.147541" height="102.352878" rx="6.373938" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="325.245902" y="524.47049" font-family="Arial, sans-serif" font-size="12.729497" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Use Assembly when...</text>
  <text x="79.344262" y="545.915866" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Compiler cannot emit required instructions (e.g. AES-NI)</text>
  <text x="79.344262" y="565.411662" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Timing must be precise (side-channel attack resistance)</text>
  <text x="79.344262" y="584.907459" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- No C runtime available (bootloader, startup stub)</text>
  <text x="79.344262" y="604.403255" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Profiling shows a specific hot loop dominates runtime</text>

  <!-- Use C -->
  <rect x="610.491803" y="503.025113" width="600" height="102.352878" rx="6.373938" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="910.491803" y="524.47049" font-family="Arial, sans-serif" font-size="12.729497" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Use C (not assembly) when...</text>
  <text x="630.163934" y="545.915866" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Compiler auto-vectorization is sufficient</text>
  <text x="630.163934" y="565.411662" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Portability across architectures matters</text>
  <text x="630.163934" y="584.907459" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Maintainability and debugging ease are priorities</text>
  <text x="630.163934" y="604.403255" font-family="Arial, sans-serif" font-size="12.729497" fill="var(--text)">- Intrinsics (e.g. _mm256_add_ps) cover the SIMD need</text>
</svg>

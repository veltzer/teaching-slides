<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.071383656624" font-weight="bold" fill="var(--primary-accent)">Real-World Assembly Use Cases</text>

  <!-- Row 1 -->
  <rect x="40" y="83.364485981308" width="390" height="233.084112149533" rx="10.412070637163" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="121.308411214953" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--primary-text)">Cryptography</text>
  <text x="60" y="159.252336448598" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--primary-text)">AES-NI, SHA-NI</text>
  <text x="60" y="191.775700934579" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--primary-text)">Constant-time code</text>
  <text x="60" y="224.299065420561" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--primary-text)">OpenSSL, libsodium</text>
  <text x="60" y="262.242990654206" font-family="Courier New, monospace" font-size="14.576898892028" fill="var(--primary-text)">aesenc %xmm1, %xmm0</text>

  <rect x="445" y="83.364485981308" width="390" height="233.084112149533" rx="10.412070637163" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="121.308411214953" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--ok-text)">Media Codecs</text>
  <text x="465" y="159.252336448598" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--ok-text)">H.264, AV1 encode</text>
  <text x="465" y="191.775700934579" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--ok-text)">SIMD DSP</text>
  <text x="465" y="224.299065420561" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--ok-text)">FFmpeg, x264, dav1d</text>
  <text x="465" y="262.242990654206" font-family="Courier New, monospace" font-size="14.576898892028" fill="var(--ok-text)">pmaddwd %xmm2, %xmm1</text>

  <rect x="850" y="83.364485981308" width="390" height="233.084112149533" rx="10.412070637163" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="121.308411214953" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--warn-text)">Kernel</text>
  <text x="870" y="159.252336448598" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--warn-text)">Boot + loaders</text>
  <text x="870" y="191.775700934579" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--warn-text)">Context switch</text>
  <text x="870" y="224.299065420561" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--warn-text)">Syscall / IRQ entry</text>
  <text x="870" y="262.242990654206" font-family="Courier New, monospace" font-size="14.576898892028" fill="var(--warn-text)">swapgs; sysretq</text>

  <!-- Row 2 -->
  <rect x="40" y="338.130841121495" width="390" height="233.084112149533" rx="10.412070637163" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="376.07476635514" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--info-text)">Embedded</text>
  <text x="60" y="414.018691588785" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--info-text)">MCU startup</text>
  <text x="60" y="446.542056074766" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--info-text)">RT interrupt handlers</text>
  <text x="60" y="479.065420560748" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--info-text)">Cortex-M, AVR, RISC-V</text>
  <text x="60" y="517.009345794393" font-family="Courier New, monospace" font-size="14.576898892028" fill="var(--info-text)">cpsid i</text>

  <rect x="445" y="338.130841121495" width="390" height="233.084112149533" rx="10.412070637163" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="376.07476635514" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--danger-text)">Hot Paths</text>
  <text x="465" y="414.018691588785" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--danger-text)">memcpy / memset</text>
  <text x="465" y="446.542056074766" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--danger-text)">String ops</text>
  <text x="465" y="479.065420560748" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--danger-text)">Game math, DB sort</text>
  <text x="465" y="517.009345794393" font-family="Courier New, monospace" font-size="14.576898892028" fill="var(--danger-text)">rep movsq</text>

  <rect x="850" y="338.130841121495" width="390" height="233.084112149533" rx="10.412070637163" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="376.07476635514" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--warn-text)">Security / RE</text>
  <text x="870" y="414.018691588785" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--warn-text)">Shellcode / exploits</text>
  <text x="870" y="446.542056074766" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--warn-text)">Malware analysis</text>
  <text x="870" y="479.065420560748" font-family="Arial, sans-serif" font-size="15.618105955744" fill="var(--warn-text)">CTF challenges</text>
  <text x="870" y="517.009345794393" font-family="Courier New, monospace" font-size="14.576898892028" fill="var(--warn-text)">objdump -d</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.659313019461" font-style="italic" fill="var(--text-muted)">Assembly where compilers cannot reach</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Real-World Assembly Use Cases</text>

  <!-- Row 1: Cryptography -->
  <rect x="30" y="75" width="380" height="170" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="380" height="40" rx="8" fill="url(#grad-primary)"/>
  <text x="220" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Cryptography</text>
  <text x="50" y="132" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- AES-NI hardware instructions</text>
  <text x="50" y="153" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Constant-time implementations</text>
  <text x="50" y="174" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- SHA hash extensions (SHA-NI)</text>
  <text x="50" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Used in OpenSSL, libsodium</text>
  <text x="50" y="216" font-family="monospace" font-size="12" fill="var(--primary-dk)">aesenc %xmm1, %xmm0</text>
  <text x="50" y="234" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Single-round AES encryption</text>

  <!-- Codecs -->
  <rect x="430" y="75" width="380" height="170" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="75" width="380" height="40" rx="8" fill="url(#grad-ok)"/>
  <text x="620" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Media Codecs</text>
  <text x="450" y="132" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Video encoding (H.264, AV1)</text>
  <text x="450" y="153" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Audio DSP (MP3, AAC filters)</text>
  <text x="450" y="174" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- SIMD pixel/sample processing</text>
  <text x="450" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Used in FFmpeg, x264, dav1d</text>
  <text x="450" y="216" font-family="monospace" font-size="12" fill="var(--ok-dk)">pmaddwd %xmm2, %xmm1</text>
  <text x="450" y="234" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">SIMD multiply-add for DCT</text>

  <!-- Kernel -->
  <rect x="830" y="75" width="420" height="170" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="830" y="75" width="420" height="40" rx="8" fill="url(#grad-warn)"/>
  <text x="1040" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">OS Kernel Code</text>
  <text x="850" y="132" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Boot sequence and boot loaders</text>
  <text x="850" y="153" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Context switch (save/restore regs)</text>
  <text x="850" y="174" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Interrupt / syscall entry points</text>
  <text x="850" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Used in Linux, FreeBSD kernels</text>
  <text x="850" y="216" font-family="monospace" font-size="12" fill="var(--warn-mid)">swapgs; sysretq</text>
  <text x="850" y="234" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Fast syscall return path</text>

  <!-- Row 2: Embedded -->
  <rect x="30" y="265" width="380" height="170" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="265" width="380" height="40" rx="8" fill="url(#grad-info)"/>
  <text x="220" y="291" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Embedded Systems</text>
  <text x="50" y="322" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Microcontroller startup code</text>
  <text x="50" y="343" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Real-time interrupt handlers</text>
  <text x="50" y="364" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Hardware peripheral drivers</text>
  <text x="50" y="385" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- ARM Cortex-M, AVR, RISC-V</text>
  <text x="50" y="406" font-family="monospace" font-size="12" fill="var(--info-dk)">cpsid i ; disable interrupts</text>
  <text x="50" y="424" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">ARM: critical section entry</text>

  <!-- Hot paths -->
  <rect x="430" y="265" width="380" height="170" rx="8" fill="var(--danger-pale3)" stroke="var(--danger-bright)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="265" width="380" height="40" rx="8" fill="var(--danger-bright)"/>
  <text x="620" y="291" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Performance Hot Paths</text>
  <text x="450" y="322" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Inner loops (memcpy, memset)</text>
  <text x="450" y="343" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- String operations (strlen, strcmp)</text>
  <text x="450" y="364" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Database sort/search kernels</text>
  <text x="450" y="385" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Game engine math routines</text>
  <text x="450" y="406" font-family="monospace" font-size="12" fill="var(--danger-pink)">rep movsq</text>
  <text x="450" y="424" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Fast 64-bit memory copy loop</text>

  <!-- Security / RE -->
  <rect x="830" y="265" width="420" height="170" rx="8" fill="var(--warn-pale3)" stroke="var(--warn-amber)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="830" y="265" width="420" height="40" rx="8" fill="var(--warn-amber)"/>
  <text x="1040" y="291" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Security and Reverse Engineering</text>
  <text x="850" y="322" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Shellcode / exploit development</text>
  <text x="850" y="343" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Malware analysis (disassembly)</text>
  <text x="850" y="364" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Vulnerability research</text>
  <text x="850" y="385" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- CTF (Capture the Flag) challenges</text>
  <text x="850" y="406" font-family="monospace" font-size="12" fill="var(--text-muted)">objdump -d binary | less</text>
  <text x="850" y="424" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Disassemble to study behavior</text>

  <!-- Bottom: decision guide -->
  <rect x="30" y="455" width="1220" height="155" rx="8" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="478" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">When to Use Assembly vs. C</text>

  <!-- Use assembly -->
  <rect x="50" y="490" width="540" height="105" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="320" y="512" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Use Assembly when...</text>
  <text x="70" y="534" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Compiler cannot emit required instructions (e.g. AES-NI)</text>
  <text x="70" y="554" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Timing must be precise (side-channel attack resistance)</text>
  <text x="70" y="574" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- No C runtime available (bootloader, startup stub)</text>
  <text x="70" y="594" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Profiling shows a specific hot loop dominates runtime</text>

  <!-- Use C -->
  <rect x="610" y="490" width="610" height="105" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="915" y="512" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Use C (not assembly) when...</text>
  <text x="630" y="534" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Compiler auto-vectorization is sufficient</text>
  <text x="630" y="554" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Portability across architectures matters</text>
  <text x="630" y="574" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Maintainability and debugging ease are priorities</text>
  <text x="630" y="594" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Intrinsics (e.g. _mm256_add_ps) cover the SIMD need</text>
</svg>

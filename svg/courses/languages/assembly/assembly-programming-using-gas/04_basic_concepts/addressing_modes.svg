<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="56.1111" width="356.25" height="161.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="246.25" y="86.7223" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">1. Immediate</text>
  <text x="246.25" y="107.6667" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">Constant encoded in instruction</text>
  <rect x="90.625" y="120.5556" width="311.25" height="35.4444" rx="6" fill="var(--primary-accent)" />
  <text x="246.25" y="143.1111" text-anchor="middle" font-family="monospace" font-size="17.3806" fill="var(--bg)">movl  $42, %eax</text>
  <text x="246.25" y="173.7223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">EAX ← 42</text>
  <text x="246.25" y="194.6667" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">No memory access · fastest mode</text>
  <rect x="461.875" y="56.1111" width="356.25" height="161.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="86.7223" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--text)">2. Register</text>
  <text x="640" y="107.6667" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">Value already in a register</text>
  <rect x="484.375" y="120.5556" width="311.25" height="35.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="143.1111" text-anchor="middle" font-family="monospace" font-size="17.3806" fill="var(--primary-accent)">movl  %ebx, %eax</text>
  <text x="640" y="173.7223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">EAX ← EBX</text>
  <text x="640" y="194.6667" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">No memory access · very fast</text>
  <rect x="855.6249" y="56.1111" width="356.25" height="161.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1033.75" y="86.7223" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--text)">3. Direct</text>
  <text x="1033.75" y="107.6667" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">Fixed memory address in instruction</text>
  <rect x="878.125" y="120.5556" width="311.25" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1033.75" y="143.1111" text-anchor="middle" font-family="monospace" font-size="17.3806" fill="var(--text)">movl  0x1000, %eax</text>
  <text x="1033.75" y="173.7223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">EAX ← mem[0x1000]</text>
  <text x="1033.75" y="194.6667" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">One memory read · global variables</text>
  <rect x="68.125" y="241.3889" width="356.25" height="161.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="246.25" y="272" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--text)">4. Indirect</text>
  <text x="246.25" y="292.9444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">Address stored in a register</text>
  <rect x="90.625" y="305.8333" width="311.25" height="35.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="246.25" y="328.3889" text-anchor="middle" font-family="monospace" font-size="17.3806" fill="var(--primary-accent)">movl  (%ebx), %eax</text>
  <text x="246.25" y="359" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">EAX ← mem[EBX]</text>
  <text x="246.25" y="379.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">EBX is a pointer · dereference</text>
  <rect x="461.875" y="241.3889" width="356.25" height="161.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="272" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">5. Base + Offset</text>
  <text x="640" y="292.9444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">Register + constant displacement</text>
  <rect x="484.375" y="305.8333" width="311.25" height="35.4444" rx="6" fill="var(--primary-accent)" />
  <text x="640" y="328.3889" text-anchor="middle" font-family="monospace" font-size="17.3806" fill="var(--bg)">movl  8(%ebp), %eax</text>
  <text x="640" y="359" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">EAX ← mem[EBP + 8]</text>
  <text x="640" y="379.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">Stack params · struct fields</text>
  <rect x="855.6249" y="241.3889" width="356.25" height="161.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1033.75" y="272" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--text)">6. Scaled Index</text>
  <text x="1033.75" y="292.9444" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">Base + index×scale + displacement</text>
  <rect x="878.125" y="305.8333" width="311.25" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1033.75" y="328.3889" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--text)">movl (%ebx,%ecx,4),%eax</text>
  <text x="1033.75" y="359" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">EAX ← mem[EBX + ECX×4]</text>
  <text x="1033.75" y="379.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">Array access · scale = element size</text>
  <rect x="227.5" y="428.2777" width="825" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="452.4444" text-anchor="middle" font-family="sans-serif" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">General memory form (AT&amp;T syntax):</text>
  <text x="640" y="475" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--text)">disp(base, index, scale)   →   mem[ base + index×scale + disp ]</text>
  <rect x="227.5" y="508.8333" width="825" height="77.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="531.3889" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">AT&amp;T (GAS) syntax reminder</text>
  <text x="265" y="552.3333" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">movl $42, %eax   </text>
  <text x="508.7499" y="552.3333" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">← source before destination · % for regs · $ for immediates</text>
  <text x="265" y="571.6667" font-family="monospace" font-size="13.0354" fill="var(--text-faint)">mov  eax, 42     </text>
  <text x="508.7499" y="571.6667" font-family="sans-serif" font-size="13.0354" fill="var(--text-faint)">← Intel syntax (destination first) — opposite!</text>
  <text x="265" y="587.7777" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">GAS uses AT&amp;T syntax by default. Use .intel_syntax noprefix to switch.</text>
</svg>
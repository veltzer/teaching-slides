<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-3.5556%" y="-7.1111%" width="96%" height="110.2222%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-white" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#ffffff" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="17.7778" width="337.7778" height="177.7778" rx="7.1111" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="195.5556" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">1. Immediate</ns0:text>
  <ns0:text x="195.5556" y="74.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#bbdefb">Constant encoded in instruction</ns0:text>
  <ns0:rect x="48" y="88.8889" width="295.1111" height="39.1111" rx="3.5556" fill="#0d47a1" />
  <ns0:text x="195.5556" y="113.7778" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="#ffffff">movl  $42, %eax</ns0:text>
  <ns0:text x="195.5556" y="147.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#bbdefb">EAX ← 42</ns0:text>
  <ns0:text x="195.5556" y="170.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#90caf9">No memory access · fastest mode</ns0:text>
  <ns0:rect x="400" y="17.7778" width="337.7778" height="177.7778" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#212121">2. Register</ns0:text>
  <ns0:text x="568.8889" y="74.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Value already in a register</ns0:text>
  <ns0:rect x="421.3333" y="88.8889" width="295.1111" height="39.1111" rx="3.5556" fill="#e3f2fd" />
  <ns0:text x="568.8889" y="113.7778" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="#1565c0">movl  %ebx, %eax</ns0:text>
  <ns0:text x="568.8889" y="147.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">EAX ← EBX</ns0:text>
  <ns0:text x="568.8889" y="170.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">No memory access · very fast</ns0:text>
  <ns0:rect x="773.3333" y="17.7778" width="337.7778" height="177.7778" rx="7.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="942.2222" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#212121">3. Direct</ns0:text>
  <ns0:text x="942.2222" y="74.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Fixed memory address in instruction</ns0:text>
  <ns0:rect x="794.6667" y="88.8889" width="295.1111" height="39.1111" rx="3.5556" fill="#f2f2f2" stroke="#e0e0e0" />
  <ns0:text x="942.2222" y="113.7778" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="#212121">movl  0x1000, %eax</ns0:text>
  <ns0:text x="942.2222" y="147.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">EAX ← mem[0x1000]</ns0:text>
  <ns0:text x="942.2222" y="170.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">One memory read · global variables</ns0:text>
  <ns0:rect x="26.6667" y="222.2222" width="337.7778" height="177.7778" rx="7.1111" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="195.5556" y="256" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#212121">4. Indirect</ns0:text>
  <ns0:text x="195.5556" y="279.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Address stored in a register</ns0:text>
  <ns0:rect x="48" y="293.3333" width="295.1111" height="39.1111" rx="3.5556" fill="#e3f2fd" />
  <ns0:text x="195.5556" y="318.2222" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="#1565c0">movl  (%ebx), %eax</ns0:text>
  <ns0:text x="195.5556" y="352" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">EAX ← mem[EBX]</ns0:text>
  <ns0:text x="195.5556" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">EBX is a pointer · dereference</ns0:text>
  <ns0:rect x="400" y="222.2222" width="337.7778" height="177.7778" rx="7.1111" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="256" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">5. Base + Offset</ns0:text>
  <ns0:text x="568.8889" y="279.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#bbdefb">Register + constant displacement</ns0:text>
  <ns0:rect x="421.3333" y="293.3333" width="295.1111" height="39.1111" rx="3.5556" fill="#0d47a1" />
  <ns0:text x="568.8889" y="318.2222" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="#ffffff">movl  8(%ebp), %eax</ns0:text>
  <ns0:text x="568.8889" y="352" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#bbdefb">EAX ← mem[EBP + 8]</ns0:text>
  <ns0:text x="568.8889" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#90caf9">Stack params · struct fields</ns0:text>
  <ns0:rect x="773.3333" y="222.2222" width="337.7778" height="177.7778" rx="7.1111" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="942.2222" y="256" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#212121">6. Scaled Index</ns0:text>
  <ns0:text x="942.2222" y="279.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Base + index×scale + displacement</ns0:text>
  <ns0:rect x="794.6667" y="293.3333" width="295.1111" height="39.1111" rx="3.5556" fill="#f2f2f2" stroke="#e0e0e0" />
  <ns0:text x="942.2222" y="318.2222" text-anchor="middle" font-family="monospace" font-size="16" fill="#212121">movl (%ebx,%ecx,4),%eax</ns0:text>
  <ns0:text x="942.2222" y="352" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">EAX ← mem[EBX + ECX×4]</ns0:text>
  <ns0:text x="942.2222" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">Array access · scale = element size</ns0:text>
  <ns0:rect x="177.7778" y="428.4444" width="782.2222" height="62.2222" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="455.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="#1565c0">General memory form (AT&amp;T syntax):</ns0:text>
  <ns0:text x="568.8889" y="480" text-anchor="middle" font-family="monospace" font-size="16" fill="#212121">disp(base, index, scale)   →   mem[ base + index×scale + disp ]</ns0:text>
  <ns0:rect x="177.7778" y="517.3333" width="782.2222" height="85.3333" rx="5.3333" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="542.2222" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#212121">AT&amp;T (GAS) syntax reminder</ns0:text>
  <ns0:text x="213.3333" y="565.3333" font-family="monospace" font-size="13.3333" fill="#1565c0">movl $42, %eax   </ns0:text>
  <ns0:text x="444.4444" y="565.3333" font-family="sans-serif" font-size="13.3333" fill="#555555">← source before destination · % for regs · $ for immediates</ns0:text>
  <ns0:text x="213.3333" y="586.6667" font-family="monospace" font-size="13.3333" fill="#9e9e9e">mov  eax, 42     </ns0:text>
  <ns0:text x="444.4444" y="586.6667" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">← Intel syntax (destination first) — opposite!</ns0:text>
  <ns0:text x="213.3333" y="604.4444" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">GAS uses AT&amp;T syntax by default. Use .intel_syntax noprefix to switch.</ns0:text>
</ns0:svg>
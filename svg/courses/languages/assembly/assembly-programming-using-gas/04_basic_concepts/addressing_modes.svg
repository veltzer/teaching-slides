<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="17.7778" width="337.7778" height="177.7778" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="195.5556" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">1. Immediate</text>
  <text x="195.5556" y="74.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">Constant encoded in instruction</text>
  <rect x="48" y="88.8889" width="295.1111" height="39.1111" rx="6" fill="var(--primary-accent)" />
  <text x="195.5556" y="113.7778" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="var(--bg)">movl  $42, %eax</text>
  <text x="195.5556" y="147.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">EAX ← 42</text>
  <text x="195.5556" y="170.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">No memory access · fastest mode</text>
  <rect x="400" y="17.7778" width="337.7778" height="177.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--text)">2. Register</text>
  <text x="568.8889" y="74.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Value already in a register</text>
  <rect x="421.3333" y="88.8889" width="295.1111" height="39.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="113.7778" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="var(--primary-accent)">movl  %ebx, %eax</text>
  <text x="568.8889" y="147.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">EAX ← EBX</text>
  <text x="568.8889" y="170.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">No memory access · very fast</text>
  <rect x="773.3333" y="17.7778" width="337.7778" height="177.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="942.2222" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--text)">3. Direct</text>
  <text x="942.2222" y="74.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Fixed memory address in instruction</text>
  <rect x="794.6667" y="88.8889" width="295.1111" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="942.2222" y="113.7778" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="var(--text)">movl  0x1000, %eax</text>
  <text x="942.2222" y="147.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">EAX ← mem[0x1000]</text>
  <text x="942.2222" y="170.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">One memory read · global variables</text>
  <rect x="26.6667" y="222.2222" width="337.7778" height="177.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="195.5556" y="256" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--text)">4. Indirect</text>
  <text x="195.5556" y="279.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Address stored in a register</text>
  <rect x="48" y="293.3333" width="295.1111" height="39.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="195.5556" y="318.2222" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="var(--primary-accent)">movl  (%ebx), %eax</text>
  <text x="195.5556" y="352" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">EAX ← mem[EBX]</text>
  <text x="195.5556" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">EBX is a pointer · dereference</text>
  <rect x="400" y="222.2222" width="337.7778" height="177.7778" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="256" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">5. Base + Offset</text>
  <text x="568.8889" y="279.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">Register + constant displacement</text>
  <rect x="421.3333" y="293.3333" width="295.1111" height="39.1111" rx="6" fill="var(--primary-accent)" />
  <text x="568.8889" y="318.2222" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="var(--bg)">movl  8(%ebp), %eax</text>
  <text x="568.8889" y="352" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">EAX ← mem[EBP + 8]</text>
  <text x="568.8889" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">Stack params · struct fields</text>
  <rect x="773.3333" y="222.2222" width="337.7778" height="177.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="942.2222" y="256" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--text)">6. Scaled Index</text>
  <text x="942.2222" y="279.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Base + index×scale + displacement</text>
  <rect x="794.6667" y="293.3333" width="295.1111" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="942.2222" y="318.2222" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--text)">movl (%ebx,%ecx,4),%eax</text>
  <text x="942.2222" y="352" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">EAX ← mem[EBX + ECX×4]</text>
  <text x="942.2222" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">Array access · scale = element size</text>
  <rect x="177.7778" y="428.4444" width="782.2222" height="62.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="455.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--primary-accent)">General memory form (AT&amp;T syntax):</text>
  <text x="568.8889" y="480" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--text)">disp(base, index, scale)   →   mem[ base + index×scale + disp ]</text>
  <rect x="177.7778" y="517.3333" width="782.2222" height="85.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="542.2222" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">AT&amp;T (GAS) syntax reminder</text>
  <text x="213.3333" y="565.3333" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">movl $42, %eax   </text>
  <text x="444.4444" y="565.3333" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">← source before destination · % for regs · $ for immediates</text>
  <text x="213.3333" y="586.6667" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">mov  eax, 42     </text>
  <text x="444.4444" y="586.6667" font-family="sans-serif" font-size="13.3333" fill="var(--text-faint)">← Intel syntax (destination first) — opposite!</text>
  <text x="213.3333" y="604.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">GAS uses AT&amp;T syntax by default. Use .intel_syntax noprefix to switch.</text>
</svg>
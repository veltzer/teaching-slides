<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:rect x="26.6667" y="17.7778" width="337.7778" height="177.7778" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="195.5556" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">1. Immediate</ns0:text>
  <ns0:text x="195.5556" y="74.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-lt)">Constant encoded in instruction</ns0:text>
  <ns0:rect x="48" y="88.8889" width="295.1111" height="39.1111" rx="3.5556" fill="var(--primary-deep)" />
  <ns0:text x="195.5556" y="113.7778" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="var(--bg)">movl  $42, %eax</ns0:text>
  <ns0:text x="195.5556" y="147.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-lt)">EAX ← 42</ns0:text>
  <ns0:text x="195.5556" y="170.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-tint)">No memory access · fastest mode</ns0:text>
  <ns0:rect x="400" y="17.7778" width="337.7778" height="177.7778" rx="7.1111" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--text)">2. Register</ns0:text>
  <ns0:text x="568.8889" y="74.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Value already in a register</ns0:text>
  <ns0:rect x="421.3333" y="88.8889" width="295.1111" height="39.1111" rx="3.5556" fill="var(--primary-pale)" />
  <ns0:text x="568.8889" y="113.7778" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="var(--primary-dk)">movl  %ebx, %eax</ns0:text>
  <ns0:text x="568.8889" y="147.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">EAX ← EBX</ns0:text>
  <ns0:text x="568.8889" y="170.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">No memory access · very fast</ns0:text>
  <ns0:rect x="773.3333" y="17.7778" width="337.7778" height="177.7778" rx="7.1111" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="942.2222" y="51.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--text)">3. Direct</ns0:text>
  <ns0:text x="942.2222" y="74.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Fixed memory address in instruction</ns0:text>
  <ns0:rect x="794.6667" y="88.8889" width="295.1111" height="39.1111" rx="3.5556" fill="var(--surface-dark)" stroke="var(--border)" />
  <ns0:text x="942.2222" y="113.7778" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="var(--text)">movl  0x1000, %eax</ns0:text>
  <ns0:text x="942.2222" y="147.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">EAX ← mem[0x1000]</ns0:text>
  <ns0:text x="942.2222" y="170.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">One memory read · global variables</ns0:text>
  <ns0:rect x="26.6667" y="222.2222" width="337.7778" height="177.7778" rx="7.1111" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="195.5556" y="256" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--text)">4. Indirect</ns0:text>
  <ns0:text x="195.5556" y="279.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Address stored in a register</ns0:text>
  <ns0:rect x="48" y="293.3333" width="295.1111" height="39.1111" rx="3.5556" fill="var(--primary-pale)" />
  <ns0:text x="195.5556" y="318.2222" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="var(--primary-dk)">movl  (%ebx), %eax</ns0:text>
  <ns0:text x="195.5556" y="352" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">EAX ← mem[EBX]</ns0:text>
  <ns0:text x="195.5556" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">EBX is a pointer · dereference</ns0:text>
  <ns0:rect x="400" y="222.2222" width="337.7778" height="177.7778" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="256" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">5. Base + Offset</ns0:text>
  <ns0:text x="568.8889" y="279.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-lt)">Register + constant displacement</ns0:text>
  <ns0:rect x="421.3333" y="293.3333" width="295.1111" height="39.1111" rx="3.5556" fill="var(--primary-deep)" />
  <ns0:text x="568.8889" y="318.2222" text-anchor="middle" font-family="monospace" font-size="17.7778" fill="var(--bg)">movl  8(%ebp), %eax</ns0:text>
  <ns0:text x="568.8889" y="352" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-lt)">EAX ← mem[EBP + 8]</ns0:text>
  <ns0:text x="568.8889" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-tint)">Stack params · struct fields</ns0:text>
  <ns0:rect x="773.3333" y="222.2222" width="337.7778" height="177.7778" rx="7.1111" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="942.2222" y="256" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--text)">6. Scaled Index</ns0:text>
  <ns0:text x="942.2222" y="279.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Base + index×scale + displacement</ns0:text>
  <ns0:rect x="794.6667" y="293.3333" width="295.1111" height="39.1111" rx="3.5556" fill="var(--surface-dark)" stroke="var(--border)" />
  <ns0:text x="942.2222" y="318.2222" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--text)">movl (%ebx,%ecx,4),%eax</ns0:text>
  <ns0:text x="942.2222" y="352" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">EAX ← mem[EBX + ECX×4]</ns0:text>
  <ns0:text x="942.2222" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">Array access · scale = element size</ns0:text>
  <ns0:rect x="177.7778" y="428.4444" width="782.2222" height="62.2222" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="455.1111" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--primary-dk)">General memory form (AT&amp;T syntax):</ns0:text>
  <ns0:text x="568.8889" y="480" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--text)">disp(base, index, scale)   →   mem[ base + index×scale + disp ]</ns0:text>
  <ns0:rect x="177.7778" y="517.3333" width="782.2222" height="85.3333" rx="5.3333" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="542.2222" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">AT&amp;T (GAS) syntax reminder</ns0:text>
  <ns0:text x="213.3333" y="565.3333" font-family="monospace" font-size="13.3333" fill="var(--primary-dk)">movl $42, %eax   </ns0:text>
  <ns0:text x="444.4444" y="565.3333" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">← source before destination · % for regs · $ for immediates</ns0:text>
  <ns0:text x="213.3333" y="586.6667" font-family="monospace" font-size="13.3333" fill="var(--text-disabled)">mov  eax, 42     </ns0:text>
  <ns0:text x="444.4444" y="586.6667" font-family="sans-serif" font-size="13.3333" fill="var(--text-disabled)">← Intel syntax (destination first) — opposite!</ns0:text>
  <ns0:text x="213.3333" y="604.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">GAS uses AT&amp;T syntax by default. Use .intel_syntax noprefix to switch.</ns0:text>
</ns0:svg>
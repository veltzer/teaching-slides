<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <marker id="arr-down" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M2,1 L5,9 L8,1 Z" fill="#e53935"/>
    </marker>
    <marker id="arr-up" markerWidth="10" markerHeight="10" refX="5" refY="1" orient="auto">
      <path d="M2,9 L5,1 L8,9 Z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Left panel: vertical memory map -->
  <!-- Address axis -->
  <line x1="58" y1="45" x2="58" y2="615" stroke="var(--border)" stroke-width="2"/>
  <polygon points="58,35 52,52 64,52" fill="var(--text-faint)"/>
  <text x="58" y="28" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--text-faint)">High</text>
  <text x="58" y="625" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--text-faint)">Low</text>
  <text x="30" y="335" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--text-muted)" transform="rotate(-90 30 335)">Virtual Address Space</text>

  <!-- Kernel boundary (above stack) -->
  <text x="75" y="50" font-family="monospace" font-size="10" fill="var(--text-faint)">0xC000 0000</text>
  <line x1="70" y1="55" x2="505" y2="55" stroke="var(--danger-border)" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="510" y="59" font-family="monospace" font-size="10" fill="var(--danger-accent)">↑ kernel</text>

  <!-- STACK segment y=60 h=90 -->
  <rect x="70" y="60" width="430" height="90" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="94" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--danger-accent)">Stack</text>
  <text x="285" y="115" text-anchor="middle" font-family="sans-serif" font-size="12" fill="var(--danger-accent)">local vars · call frames · saved registers</text>
  <!-- ESP points here -->
  <text x="75" y="143" font-family="monospace" font-size="10" fill="var(--danger-accent)">ESP →</text>

  <!-- grows-down arrow -->
  <line x1="285" y1="152" x2="285" y2="183" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-down)"/>
  <text x="305" y="172" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--danger-accent)">grows down</text>

  <!-- FREE space y=190 h=80 -->
  <rect x="70" y="190" width="430" height="80" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="7,4"/>
  <text x="285" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" fill="var(--text-faint)" font-style="italic">free / unmapped region</text>

  <!-- grows-up arrow -->
  <line x1="285" y1="270" x2="285" y2="299" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-up)"/>
  <text x="305" y="288" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--ok-accent)">grows up</text>

  <!-- HEAP segment y=300 h=80 -->
  <rect x="70" y="300" width="430" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="334" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--ok-accent)">Heap</text>
  <text x="285" y="357" text-anchor="middle" font-family="sans-serif" font-size="12" fill="var(--ok-accent)">dynamic allocation · brk / mmap</text>
  <!-- program break label -->
  <text x="75" y="299" font-family="monospace" font-size="10" fill="var(--ok-accent)">brk →</text>

  <!-- BSS segment y=390 h=60 -->
  <rect x="70" y="390" width="430" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="415" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="var(--warn-accent)">BSS</text>
  <text x="285" y="440" text-anchor="middle" font-family="sans-serif" font-size="11" fill="var(--danger-accent)">uninitialised static data · zero-filled</text>

  <!-- DATA segment y=458 h=60 -->
  <rect x="70" y="458" width="430" height="60" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="483" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="var(--info-accent)">Data</text>
  <text x="285" y="506" text-anchor="middle" font-family="sans-serif" font-size="11" fill="var(--info-accent)">initialised globals · read-write</text>

  <!-- TEXT/CODE segment y=526 h=80 -->
  <rect x="70" y="526" width="430" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="558" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--primary-accent)">Text (Code)</text>
  <text x="285" y="578" text-anchor="middle" font-family="sans-serif" font-size="12" fill="var(--primary-accent)">machine instructions · read-only · shared</text>
  <text x="75" y="528" font-family="monospace" font-size="10" fill="var(--primary-accent)">_start →</text>

  <!-- Low address marker -->
  <text x="75" y="614" font-family="monospace" font-size="10" fill="var(--text-faint)">0x0804 8000</text>

  <!-- Right panel: detailed annotations -->
  <rect x="545" y="35" width="710" height="575" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="545" y="35" width="710" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="545" y="60" width="710" height="15" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="900" y="62" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Segment Reference</text>

  <!-- Stack detail -->
  <rect x="560" y="88" width="680" height="88" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="580" y="108" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)">Stack</text>
  <text x="580" y="126" font-family="monospace" font-size="11" fill="var(--text)">• ESP points to top; push decrements ESP, pop increments</text>
  <text x="580" y="142" font-family="monospace" font-size="11" fill="var(--text)">• Function frames: return addr, saved regs, local variables</text>
  <text x="580" y="158" font-family="monospace" font-size="11" fill="var(--text-muted)">  allocate:  sub $16, %esp    free:  add $16, %esp</text>
  <text x="580" y="170" font-family="monospace" font-size="10" fill="var(--text-faint)">  default limit 8 MB (ulimit -s); overflow → segfault</text>

  <!-- Heap detail -->
  <rect x="560" y="184" width="680" height="88" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="580" y="204" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">Heap</text>
  <text x="580" y="222" font-family="monospace" font-size="11" fill="var(--text)">• Runtime allocation — size unknown at compile time</text>
  <text x="580" y="238" font-family="monospace" font-size="11" fill="var(--text)">• sys_brk (EAX=45) moves program break up or down</text>
  <text x="580" y="254" font-family="monospace" font-size="11" fill="var(--text-muted)">  mmap (EAX=192) also maps anonymous pages</text>
  <text x="580" y="266" font-family="monospace" font-size="10" fill="var(--text-faint)">  C: malloc/calloc/free use brk/mmap internally</text>

  <!-- BSS detail -->
  <rect x="560" y="280" width="680" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="580" y="300" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">BSS  (Block Started by Symbol)</text>
  <text x="580" y="318" font-family="monospace" font-size="11" fill="var(--text)">• Uninitialized global/static vars — NOT stored in binary</text>
  <text x="580" y="334" font-family="monospace" font-size="11" fill="var(--text)">• OS zero-fills this region at load time (cheap)</text>
  <text x="580" y="350" font-family="monospace" font-size="11" fill="var(--text-muted)">  GAS:   buffer: .space 1024   (in .bss section)</text>

  <!-- Data detail -->
  <rect x="560" y="368" width="680" height="80" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="580" y="388" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--info-accent)">Data Segment</text>
  <text x="580" y="406" font-family="monospace" font-size="11" fill="var(--text)">• Initialized globals/statics — stored in executable file</text>
  <text x="580" y="422" font-family="monospace" font-size="11" fill="var(--text)">• Read-write; fixed size at compile time</text>
  <text x="580" y="438" font-family="monospace" font-size="11" fill="var(--text-muted)">  GAS:   msg: .asciz "hello"   (in .data section)</text>

  <!-- Text detail -->
  <rect x="560" y="456" width="680" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="580" y="476" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">Text / Code Segment</text>
  <text x="580" y="494" font-family="monospace" font-size="11" fill="var(--text)">• Read-only machine instructions (enforced by MMU)</text>
  <text x="580" y="510" font-family="monospace" font-size="11" fill="var(--text)">• Shared among all processes running the same binary</text>
  <text x="580" y="526" font-family="monospace" font-size="11" fill="var(--text-muted)">  Entry point: _start label (.globl _start)</text>
  <text x="580" y="540" font-family="monospace" font-size="10" fill="var(--text-faint)">  Typical start address: 0x08048000 (32-bit ELF)</text>

  <!-- Gas directives summary box -->
  <rect x="560" y="554" width="680" height="50" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="580" y="573" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--primary-accent)">GAS Sections:  </text>
  <text x="700" y="573" font-family="monospace" font-size="12" fill="var(--primary-accent)">.text  (code)   .data  (init data)   .bss  (uninit data)</text>
  <text x="580" y="594" font-family="monospace" font-size="11" fill="var(--text-muted)">Stack &amp; heap are runtime — not declared in GAS source</text>
</svg>

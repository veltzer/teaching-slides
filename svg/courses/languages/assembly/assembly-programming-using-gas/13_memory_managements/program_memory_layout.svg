<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <marker id="arr-down" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M2,1 L5,9 L8,1 Z" fill="#e53935"/>
    </marker>
    <marker id="arr-up" markerWidth="10" markerHeight="10" refX="5" refY="1" orient="auto">
      <path d="M2,9 L5,1 L8,9 Z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Left panel: vertical memory map -->
  <!-- Address axis -->
  <line x1="58" y1="45" x2="58" y2="615" stroke="var(--border-strong)" stroke-width="2"/>
  <polygon points="58,35 52,52 64,52" fill="var(--text-faint)"/>
  <text x="58" y="28" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--text-faint)">High</text>
  <text x="58" y="625" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--text-faint)">Low</text>
  <text x="30" y="335" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--text-muted)" transform="rotate(-90 30 335)">Virtual Address Space</text>

  <!-- Kernel boundary (above stack) -->
  <text x="75" y="50" font-family="monospace" font-size="10" fill="var(--text-placeholder)">0xC000 0000</text>
  <line x1="70" y1="55" x2="505" y2="55" stroke="var(--danger-lt)" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="510" y="59" font-family="monospace" font-size="10" fill="var(--danger)">↑ kernel</text>

  <!-- STACK segment y=60 h=90 -->
  <rect x="70" y="60" width="430" height="90" rx="5" fill="var(--danger-lt)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="94" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--danger-deep)">Stack</text>
  <text x="285" y="115" text-anchor="middle" font-family="sans-serif" font-size="12" fill="var(--danger-dk)">local vars · call frames · saved registers</text>
  <!-- ESP points here -->
  <text x="75" y="143" font-family="monospace" font-size="10" fill="var(--danger)">ESP →</text>

  <!-- grows-down arrow -->
  <line x1="285" y1="152" x2="285" y2="183" stroke="var(--danger)" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr-down)"/>
  <text x="305" y="172" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--danger)">grows down</text>

  <!-- FREE space y=190 h=80 -->
  <rect x="70" y="190" width="430" height="80" rx="5" fill="var(--surface)" stroke="var(--border-faint)" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="285" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" fill="var(--text-placeholder)" font-style="italic">free / unmapped region</text>

  <!-- grows-up arrow -->
  <line x1="285" y1="270" x2="285" y2="299" stroke="var(--ok-dk)" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr-up)"/>
  <text x="305" y="288" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--ok-dk)">grows up</text>

  <!-- HEAP segment y=300 h=80 -->
  <rect x="70" y="300" width="430" height="80" rx="5" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="334" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--ok-deep)">Heap</text>
  <text x="285" y="357" text-anchor="middle" font-family="sans-serif" font-size="12" fill="var(--ok-dk)">dynamic allocation · brk / mmap</text>
  <!-- program break label -->
  <text x="75" y="299" font-family="monospace" font-size="10" fill="var(--ok-dk)">brk →</text>

  <!-- BSS segment y=390 h=60 -->
  <rect x="70" y="390" width="430" height="60" rx="5" fill="var(--warn-lt)" stroke="var(--warn-mid)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="415" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="var(--warn-dk)">BSS</text>
  <text x="285" y="440" text-anchor="middle" font-family="sans-serif" font-size="11" fill="var(--danger-deeper)">uninitialised static data · zero-filled</text>

  <!-- DATA segment y=458 h=60 -->
  <rect x="70" y="458" width="430" height="60" rx="5" fill="var(--info-tint)" stroke="var(--info-mid)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="483" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="var(--info-deep)">Data</text>
  <text x="285" y="506" text-anchor="middle" font-family="sans-serif" font-size="11" fill="var(--info-dk)">initialised globals · read-write</text>

  <!-- TEXT/CODE segment y=526 h=80 -->
  <rect x="70" y="526" width="430" height="80" rx="5" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="558" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--primary-deep)">Text (Code)</text>
  <text x="285" y="578" text-anchor="middle" font-family="sans-serif" font-size="12" fill="var(--primary-dk)">machine instructions · read-only · shared</text>
  <text x="75" y="528" font-family="monospace" font-size="10" fill="var(--primary-dk)">_start →</text>

  <!-- Low address marker -->
  <text x="75" y="614" font-family="monospace" font-size="10" fill="var(--text-placeholder)">0x0804 8000</text>

  <!-- Right panel: detailed annotations -->
  <rect x="545" y="35" width="710" height="575" rx="10" fill="var(--surface-light)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="545" y="35" width="710" height="40" rx="10" fill="url(#grad-primary)"/>
  <rect x="545" y="60" width="710" height="15" fill="url(#grad-primary)"/>
  <text x="900" y="62" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Segment Reference</text>

  <!-- Stack detail -->
  <rect x="560" y="88" width="680" height="88" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="580" y="108" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--danger-dk)">Stack</text>
  <text x="580" y="126" font-family="monospace" font-size="11" fill="var(--text-dark)">• ESP points to top; push decrements ESP, pop increments</text>
  <text x="580" y="142" font-family="monospace" font-size="11" fill="var(--text-dark)">• Function frames: return addr, saved regs, local variables</text>
  <text x="580" y="158" font-family="monospace" font-size="11" fill="var(--text-muted)">  allocate:  sub $16, %esp    free:  add $16, %esp</text>
  <text x="580" y="170" font-family="monospace" font-size="10" fill="var(--text-faint)">  default limit 8 MB (ulimit -s); overflow → segfault</text>

  <!-- Heap detail -->
  <rect x="560" y="184" width="680" height="88" rx="6" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="580" y="204" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--ok-deep)">Heap</text>
  <text x="580" y="222" font-family="monospace" font-size="11" fill="var(--text-dark)">• Runtime allocation — size unknown at compile time</text>
  <text x="580" y="238" font-family="monospace" font-size="11" fill="var(--text-dark)">• sys_brk (EAX=45) moves program break up or down</text>
  <text x="580" y="254" font-family="monospace" font-size="11" fill="var(--text-muted)">  mmap (EAX=192) also maps anonymous pages</text>
  <text x="580" y="266" font-family="monospace" font-size="10" fill="var(--text-faint)">  C: malloc/calloc/free use brk/mmap internally</text>

  <!-- BSS detail -->
  <rect x="560" y="280" width="680" height="80" rx="6" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="1.5"/>
  <text x="580" y="300" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)">BSS  (Block Started by Symbol)</text>
  <text x="580" y="318" font-family="monospace" font-size="11" fill="var(--text-dark)">• Uninitialized global/static vars — NOT stored in binary</text>
  <text x="580" y="334" font-family="monospace" font-size="11" fill="var(--text-dark)">• OS zero-fills this region at load time (cheap)</text>
  <text x="580" y="350" font-family="monospace" font-size="11" fill="var(--text-muted)">  GAS:   buffer: .space 1024   (in .bss section)</text>

  <!-- Data detail -->
  <rect x="560" y="368" width="680" height="80" rx="6" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="1.5"/>
  <text x="580" y="388" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--info-deep)">Data Segment</text>
  <text x="580" y="406" font-family="monospace" font-size="11" fill="var(--text-dark)">• Initialized globals/statics — stored in executable file</text>
  <text x="580" y="422" font-family="monospace" font-size="11" fill="var(--text-dark)">• Read-write; fixed size at compile time</text>
  <text x="580" y="438" font-family="monospace" font-size="11" fill="var(--text-muted)">  GAS:   msg: .asciz "hello"   (in .data section)</text>

  <!-- Text detail -->
  <rect x="560" y="456" width="680" height="90" rx="6" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.5"/>
  <text x="580" y="476" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--primary-deep)">Text / Code Segment</text>
  <text x="580" y="494" font-family="monospace" font-size="11" fill="var(--text-dark)">• Read-only machine instructions (enforced by MMU)</text>
  <text x="580" y="510" font-family="monospace" font-size="11" fill="var(--text-dark)">• Shared among all processes running the same binary</text>
  <text x="580" y="526" font-family="monospace" font-size="11" fill="var(--text-muted)">  Entry point: _start label (.globl _start)</text>
  <text x="580" y="540" font-family="monospace" font-size="10" fill="var(--text-faint)">  Typical start address: 0x08048000 (32-bit ELF)</text>

  <!-- Gas directives summary box -->
  <rect x="560" y="554" width="680" height="50" rx="6" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="1.5"/>
  <text x="580" y="573" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--primary-deeper)">GAS Sections:  </text>
  <text x="700" y="573" font-family="monospace" font-size="12" fill="var(--primary-deeper)">.text  (code)   .data  (init data)   .bss  (uninit data)</text>
  <text x="580" y="594" font-family="monospace" font-size="11" fill="var(--text-muted)">Stack &amp; heap are runtime — not declared in GAS source</text>
</svg>

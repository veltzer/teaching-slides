<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.630931949821" font-weight="bold" fill="var(--primary-accent)">Program Memory Layout</text>

  <!-- Memory map (left) -->
  <text x="40" y="76.25" font-family="Arial, sans-serif" font-size="12.31546597491" font-weight="bold" fill="var(--text-faint)">High</text>
  <text x="40" y="620" font-family="Arial, sans-serif" font-size="12.31546597491" font-weight="bold" fill="var(--text-faint)">Low</text>
  <text x="90.847457627119" y="76.25" font-family="Courier New, monospace" font-size="11.289177143668" fill="var(--text-faint)">0xC0000000</text>
  <text x="90.847457627119" y="614.821428571429" font-family="Courier New, monospace" font-size="11.289177143668" fill="var(--text-faint)">0x08048000</text>

  <rect x="80.677966101695" y="81.428571428571" width="447.457627118644" height="93.214285714286" rx="6.157732987455" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304.406779661017" y="115.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.525776624851" font-weight="bold" fill="var(--bg)">Stack</text>
  <text x="304.406779661017" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--bg)">local vars, call frames</text>
  <text x="304.406779661017" y="164.285714285714" text-anchor="middle" font-family="Courier New, monospace" font-size="12.31546597491" fill="var(--bg)">ESP -&gt; grows down</text>

  <rect x="80.677966101695" y="190.178571428571" width="447.457627118644" height="77.678571428571" rx="6.157732987455" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="304.406779661017" y="236.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-style="italic" fill="var(--text-faint)">free / unmapped</text>

  <rect x="80.677966101695" y="283.392857142857" width="447.457627118644" height="88.035714285714" rx="6.157732987455" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304.406779661017" y="317.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.525776624851" font-weight="bold" fill="var(--bg)">Heap</text>
  <text x="304.406779661017" y="345.535714285714" text-anchor="middle" font-family="Courier New, monospace" font-size="12.31546597491" fill="var(--bg)">brk / mmap -&gt; grows up</text>

  <rect x="80.677966101695" y="386.964285714286" width="447.457627118644" height="62.142857142857" rx="6.157732987455" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304.406779661017" y="418.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--bg)">BSS</text>
  <text x="304.406779661017" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.31546597491" fill="var(--bg)">uninit static, zero-filled</text>

  <rect x="80.677966101695" y="464.642857142857" width="447.457627118644" height="62.142857142857" rx="6.157732987455" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304.406779661017" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--bg)">Data</text>
  <text x="304.406779661017" y="516.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.31546597491" fill="var(--bg)">init globals, read-write</text>

  <rect x="80.677966101695" y="542.321428571429" width="447.457627118644" height="72.5" rx="6.157732987455" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304.406779661017" y="575.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--bg)">Text / Code</text>
  <text x="304.406779661017" y="599.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.31546597491" fill="var(--bg)">read-only, shared</text>

  <!-- Right panel detailed -->
  <rect x="558.64406779661" y="76.25" width="681.35593220339" height="103.571428571429" rx="8.21031064994" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="578.983050847458" y="102.142857142857" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--bg)">Stack</text>
  <text x="578.983050847458" y="125.964285714286" font-family="Arial, sans-serif" font-size="12.31546597491" fill="var(--bg)">push/pop adjust ESP automatically</text>
  <text x="578.983050847458" y="150" font-family="Courier New, monospace" font-size="11" fill="var(--bg)">sub/add $16,%esp   default 8MB</text>

  <rect x="558.64406779661" y="190.178571428571" width="681.35593220339" height="103.571428571429" rx="8.21031064994" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="578.983050847458" y="216.071428571429" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--bg)">Heap</text>
  <text x="578.983050847458" y="239.892857142857" font-family="Arial, sans-serif" font-size="12.31546597491" fill="var(--bg)">runtime allocation, dynamic size</text>
  <text x="578.983050847458" y="260.607142857143" font-family="Courier New, monospace" font-size="11.289177143668" fill="var(--bg)">sys_brk / mmap -&gt; malloc uses these</text>

  <rect x="558.64406779661" y="304.107142857143" width="681.35593220339" height="93.214285714286" rx="8.21031064994" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="578.983050847458" y="330" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--bg)">BSS</text>
  <text x="578.983050847458" y="353.821428571429" font-family="Arial, sans-serif" font-size="12.31546597491" fill="var(--bg)">not stored in binary, OS zero-fills</text>
  <text x="578.983050847458" y="374.535714285714" font-family="Courier New, monospace" font-size="11.289177143668" fill="var(--bg)">buffer: .space 1024</text>

  <rect x="558.64406779661" y="407.678571428571" width="681.35593220339" height="93.214285714286" rx="8.21031064994" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="578.983050847458" y="433.571428571429" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--bg)">Data</text>
  <text x="578.983050847458" y="457.392857142857" font-family="Arial, sans-serif" font-size="12.31546597491" fill="var(--bg)">stored in binary, fixed size</text>
  <text x="578.983050847458" y="478.107142857143" font-family="Courier New, monospace" font-size="11.289177143668" fill="var(--bg)">msg: .asciz "hello"</text>

  <rect x="558.64406779661" y="511.25" width="681.35593220339" height="103.571428571429" rx="8.21031064994" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="578.983050847458" y="537.142857142857" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--bg)">Text / Code</text>
  <text x="578.983050847458" y="560.964285714286" font-family="Arial, sans-serif" font-size="12.31546597491" fill="var(--bg)">read-only, MMU-enforced, shared</text>
  <text x="578.983050847458" y="581.678571428572" font-family="Courier New, monospace" font-size="11.289177143668" fill="var(--bg)">.globl _start   entry at 0x08048000</text>
  <text x="578.983050847458" y="602.392857142857" font-family="Courier New, monospace" font-size="11.289177143668" fill="var(--bg)">GAS: .text / .data / .bss</text>
</svg>

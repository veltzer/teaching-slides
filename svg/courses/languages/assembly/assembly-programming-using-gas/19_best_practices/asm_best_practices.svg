<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Assembly Best Practices</text>

  <!-- Column 1: Documentation -->
  <rect x="30" y="75" width="370" height="270" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="370" height="40" rx="8" fill="url(#grad-primary)"/>
  <text x="215" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Documentation</text>
  <text x="50" y="130" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Comment every instruction:</text>
  <rect x="40" y="140" width="340" height="80" rx="4" fill="var(--code-bg)"/>
  <text x="55" y="162" font-family="monospace" font-size="12" fill="var(--primary-lt)">movl $4, %eax   <tspan fill="var(--text-lighter)"># sys_write</tspan></text>
  <text x="55" y="182" font-family="monospace" font-size="12" fill="var(--primary-lt)">movl $1, %ebx   <tspan fill="var(--text-lighter)"># fd=stdout</tspan></text>
  <text x="55" y="202" font-family="monospace" font-size="12" fill="var(--primary-lt)">int  $0x80      <tspan fill="var(--text-lighter)"># kernel call</tspan></text>
  <text x="50" y="240" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Document register usage at function start</text>
  <text x="50" y="260" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Describe ABI: caller/callee saved regs</text>
  <text x="50" y="280" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Note side effects and clobbered flags</text>
  <text x="50" y="300" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Use .section and label names descriptively</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Keep a header comment with stack frame layout</text>

  <!-- Column 2: ABI Compliance -->
  <rect x="420" y="75" width="420" height="270" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="75" width="420" height="40" rx="8" fill="url(#grad-ok)"/>
  <text x="630" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">ABI Compliance</text>
  <!-- x86-64 mini table -->
  <text x="440" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">x86-64 System V ABI (Linux/macOS):</text>
  <rect x="430" y="136" width="400" height="28" rx="3" fill="var(--ok-lt)"/>
  <text x="440" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-deep)">Role</text>
  <text x="570" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-deep)">Registers</text>
  <text x="750" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-deep)">Preserved by</text>
  <text x="440" y="178" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Arguments</text>
  <text x="570" y="178" font-family="monospace" font-size="12" fill="var(--primary-dk)">rdi, rsi, rdx, rcx, r8, r9</text>
  <text x="750" y="178" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">caller</text>
  <text x="440" y="198" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Return value</text>
  <text x="570" y="198" font-family="monospace" font-size="12" fill="var(--primary-dk)">rax (rdx for 128-bit)</text>
  <text x="750" y="198" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">caller</text>
  <text x="440" y="218" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Caller-saved</text>
  <text x="570" y="218" font-family="monospace" font-size="12" fill="var(--warn-mid)">rax, rcx, rdx, r8-r11</text>
  <text x="750" y="218" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">caller</text>
  <text x="440" y="238" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Callee-saved</text>
  <text x="570" y="238" font-family="monospace" font-size="12" fill="var(--danger-dk)">rbx, rbp, r12-r15</text>
  <text x="750" y="238" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">callee</text>
  <text x="440" y="260" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Stack must be 16-byte aligned at call</text>
  <text x="440" y="280" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Red zone: 128 bytes below RSP (no signal)</text>
  <text x="440" y="300" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Push/pop callee-saved regs in prologue/epilogue</text>
  <text x="440" y="320" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Never return with mismatched stack pointer</text>

  <!-- Column 3: Testing -->
  <rect x="860" y="75" width="390" height="270" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860" y="75" width="390" height="40" rx="8" fill="url(#grad-warn)"/>
  <text x="1055" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Testing Assembly Code</text>
  <text x="880" y="130" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Test from C harness:</text>
  <rect x="870" y="138" width="360" height="80" rx="4" fill="var(--code-bg)"/>
  <text x="885" y="160" font-family="monospace" font-size="12" fill="var(--info-tint)">// C test harness</text>
  <text x="885" y="178" font-family="monospace" font-size="12" fill="var(--primary-lt)">extern int asm_add(int a, int b);</text>
  <text x="885" y="196" font-family="monospace" font-size="12" fill="var(--ok-tint)">assert(asm_add(2,3) == 5);</text>
  <text x="880" y="238" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Use gdb / rr to step through instructions</text>
  <text x="880" y="258" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Valgrind for memory errors</text>
  <text x="880" y="278" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Perf / VTune for cycle-level profiling</text>
  <text x="880" y="298" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Verify with objdump -d output</text>
  <text x="880" y="318" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Test edge cases: 0, negatives, overflow</text>

  <!-- Bottom row: when to use assembly -->
  <rect x="30" y="365" width="1220" height="245" rx="8" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="30" y="365" width="1220" height="40" rx="8" fill="var(--text-muted)"/>
  <text x="640" y="391" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">When to Use Assembly vs. C -- Decision Framework</text>

  <!-- Prefer C -->
  <rect x="50" y="415" width="560" height="180" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="330" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Prefer C (or intrinsics)</text>
  <text x="70" y="462" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- General application logic</text>
  <text x="70" y="484" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- When -O2 / -O3 compiler output is good enough</text>
  <text x="70" y="506" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Cross-platform portability required</text>
  <text x="70" y="528" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Large codebases (maintainability cost too high)</text>
  <text x="70" y="550" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Team lacks assembly expertise</text>
  <text x="70" y="572" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Tip: check compiler output with -S flag first</text>

  <!-- Prefer assembly -->
  <rect x="640" y="415" width="580" height="180" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="930" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Prefer Assembly</text>
  <text x="660" y="462" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- No C runtime available (bootloaders, firmware)</text>
  <text x="660" y="484" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Hardware instructions not exposed via C (CPUID, AES-NI)</text>
  <text x="660" y="506" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Exact cycle timing required (real-time control loops)</text>
  <text x="660" y="528" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Profiling confirms the hot loop is the bottleneck</text>
  <text x="660" y="550" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Side-channel resistance needs constant-time code</text>
  <text x="660" y="572" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Tip: isolate into a separate .s file, expose via C header</text>
</svg>

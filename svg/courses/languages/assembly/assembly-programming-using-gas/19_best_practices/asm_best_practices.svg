<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Assembly Best Practices</text>

  <!-- Column 1: Documentation -->
  <rect x="30" y="75" width="370" height="270" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="370" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="215" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Documentation</text>
  <text x="50" y="130" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Comment every instruction:</text>
  <rect x="40" y="140" width="340" height="80" rx="6" fill="var(--code-bg)"/>
  <text x="55" y="162" font-family="monospace" font-size="12" fill="var(--primary-accent)">movl $4, %eax   <tspan fill="var(--text-muted)"># sys_write</tspan></text>
  <text x="55" y="182" font-family="monospace" font-size="12" fill="var(--primary-accent)">movl $1, %ebx   <tspan fill="var(--text-muted)"># fd=stdout</tspan></text>
  <text x="55" y="202" font-family="monospace" font-size="12" fill="var(--primary-accent)">int  $0x80      <tspan fill="var(--text-muted)"># kernel call</tspan></text>
  <text x="50" y="240" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Document register usage at function start</text>
  <text x="50" y="260" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Describe ABI: caller/callee saved regs</text>
  <text x="50" y="280" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Note side effects and clobbered flags</text>
  <text x="50" y="300" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Use .section and label names descriptively</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Keep a header comment with stack frame layout</text>

  <!-- Column 2: ABI Compliance -->
  <rect x="420" y="75" width="420" height="270" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="75" width="420" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="630" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">ABI Compliance</text>
  <!-- x86-64 mini table -->
  <text x="440" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">x86-64 System V ABI (Linux/macOS):</text>
  <rect x="430" y="136" width="400" height="28" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="440" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)">Role</text>
  <text x="570" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)">Registers</text>
  <text x="750" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)">Preserved by</text>
  <text x="440" y="178" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Arguments</text>
  <text x="570" y="178" font-family="monospace" font-size="12" fill="var(--primary-accent)">rdi, rsi, rdx, rcx, r8, r9</text>
  <text x="750" y="178" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">caller</text>
  <text x="440" y="198" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Return value</text>
  <text x="570" y="198" font-family="monospace" font-size="12" fill="var(--primary-accent)">rax (rdx for 128-bit)</text>
  <text x="750" y="198" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">caller</text>
  <text x="440" y="218" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Caller-saved</text>
  <text x="570" y="218" font-family="monospace" font-size="12" fill="var(--warn-accent)">rax, rcx, rdx, r8-r11</text>
  <text x="750" y="218" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">caller</text>
  <text x="440" y="238" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Callee-saved</text>
  <text x="570" y="238" font-family="monospace" font-size="12" fill="var(--danger-accent)">rbx, rbp, r12-r15</text>
  <text x="750" y="238" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">callee</text>
  <text x="440" y="260" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Stack must be 16-byte aligned at call</text>
  <text x="440" y="280" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Red zone: 128 bytes below RSP (no signal)</text>
  <text x="440" y="300" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Push/pop callee-saved regs in prologue/epilogue</text>
  <text x="440" y="320" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Never return with mismatched stack pointer</text>

  <!-- Column 3: Testing -->
  <rect x="860" y="75" width="390" height="270" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860" y="75" width="390" height="40" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1055" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Testing Assembly Code</text>
  <text x="880" y="130" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Test from C harness:</text>
  <rect x="870" y="138" width="360" height="80" rx="6" fill="var(--code-bg)"/>
  <text x="885" y="160" font-family="monospace" font-size="12" fill="var(--info-accent)">// C test harness</text>
  <text x="885" y="178" font-family="monospace" font-size="12" fill="var(--primary-accent)">extern int asm_add(int a, int b);</text>
  <text x="885" y="196" font-family="monospace" font-size="12" fill="var(--ok-accent)">assert(asm_add(2,3) == 5);</text>
  <text x="880" y="238" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Use gdb / rr to step through instructions</text>
  <text x="880" y="258" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Valgrind for memory errors</text>
  <text x="880" y="278" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Perf / VTune for cycle-level profiling</text>
  <text x="880" y="298" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Verify with objdump -d output</text>
  <text x="880" y="318" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Test edge cases: 0, negatives, overflow</text>

  <!-- Bottom row: when to use assembly -->
  <rect x="30" y="365" width="1220" height="245" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="30" y="365" width="1220" height="40" rx="6" fill="var(--text-muted)"/>
  <text x="640" y="391" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">When to Use Assembly vs. C -- Decision Framework</text>

  <!-- Prefer C -->
  <rect x="50" y="415" width="560" height="180" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="330" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Prefer C (or intrinsics)</text>
  <text x="70" y="462" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- General application logic</text>
  <text x="70" y="484" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- When -O2 / -O3 compiler output is good enough</text>
  <text x="70" y="506" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Cross-platform portability required</text>
  <text x="70" y="528" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Large codebases (maintainability cost too high)</text>
  <text x="70" y="550" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Team lacks assembly expertise</text>
  <text x="70" y="572" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Tip: check compiler output with -S flag first</text>

  <!-- Prefer assembly -->
  <rect x="640" y="415" width="580" height="180" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="930" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Prefer Assembly</text>
  <text x="660" y="462" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- No C runtime available (bootloaders, firmware)</text>
  <text x="660" y="484" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Hardware instructions not exposed via C (CPUID, AES-NI)</text>
  <text x="660" y="506" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Exact cycle timing required (real-time control loops)</text>
  <text x="660" y="528" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Profiling confirms the hot loop is the bottleneck</text>
  <text x="660" y="550" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Side-channel resistance needs constant-time code</text>
  <text x="660" y="572" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Tip: isolate into a separate .s file, expose via C header</text>
</svg>

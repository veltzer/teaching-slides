<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Assembly Best Practices</text>

  <!-- Column 1: Documentation -->
  <rect x="30" y="75" width="370" height="270" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="370" height="40" rx="8" fill="url(#grad-accent)"/>
  <text x="215" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Documentation</text>
  <text x="50" y="130" font-family="Arial, sans-serif" font-size="13" fill="#333333">Comment every instruction:</text>
  <rect x="40" y="140" width="340" height="80" rx="4" fill="#1e1e2e"/>
  <text x="55" y="162" font-family="monospace" font-size="12" fill="#cdd6f4">movl $4, %eax   <tspan fill="#6c7086"># sys_write</tspan></text>
  <text x="55" y="182" font-family="monospace" font-size="12" fill="#cdd6f4">movl $1, %ebx   <tspan fill="#6c7086"># fd=stdout</tspan></text>
  <text x="55" y="202" font-family="monospace" font-size="12" fill="#cdd6f4">int  $0x80      <tspan fill="#6c7086"># kernel call</tspan></text>
  <text x="50" y="240" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Document register usage at function start</text>
  <text x="50" y="260" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Describe ABI: caller/callee saved regs</text>
  <text x="50" y="280" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Note side effects and clobbered flags</text>
  <text x="50" y="300" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Use .section and label names descriptively</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Keep a header comment with stack frame layout</text>

  <!-- Column 2: ABI Compliance -->
  <rect x="420" y="75" width="420" height="270" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="75" width="420" height="40" rx="8" fill="url(#grad-green)"/>
  <text x="630" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">ABI Compliance</text>
  <!-- x86-64 mini table -->
  <text x="440" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">x86-64 System V ABI (Linux/macOS):</text>
  <rect x="430" y="136" width="400" height="28" rx="3" fill="#c8e6c9"/>
  <text x="440" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Role</text>
  <text x="570" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Registers</text>
  <text x="750" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Preserved by</text>
  <text x="440" y="178" font-family="Arial, sans-serif" font-size="12" fill="#333333">Arguments</text>
  <text x="570" y="178" font-family="monospace" font-size="12" fill="#1565c0">rdi, rsi, rdx, rcx, r8, r9</text>
  <text x="750" y="178" font-family="Arial, sans-serif" font-size="12" fill="#333333">caller</text>
  <text x="440" y="198" font-family="Arial, sans-serif" font-size="12" fill="#333333">Return value</text>
  <text x="570" y="198" font-family="monospace" font-size="12" fill="#1565c0">rax (rdx for 128-bit)</text>
  <text x="750" y="198" font-family="Arial, sans-serif" font-size="12" fill="#333333">caller</text>
  <text x="440" y="218" font-family="Arial, sans-serif" font-size="12" fill="#333333">Caller-saved</text>
  <text x="570" y="218" font-family="monospace" font-size="12" fill="#f57c00">rax, rcx, rdx, r8-r11</text>
  <text x="750" y="218" font-family="Arial, sans-serif" font-size="12" fill="#333333">caller</text>
  <text x="440" y="238" font-family="Arial, sans-serif" font-size="12" fill="#333333">Callee-saved</text>
  <text x="570" y="238" font-family="monospace" font-size="12" fill="#c62828">rbx, rbp, r12-r15</text>
  <text x="750" y="238" font-family="Arial, sans-serif" font-size="12" fill="#333333">callee</text>
  <text x="440" y="260" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Stack must be 16-byte aligned at call</text>
  <text x="440" y="280" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Red zone: 128 bytes below RSP (no signal)</text>
  <text x="440" y="300" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Push/pop callee-saved regs in prologue/epilogue</text>
  <text x="440" y="320" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Never return with mismatched stack pointer</text>

  <!-- Column 3: Testing -->
  <rect x="860" y="75" width="390" height="270" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860" y="75" width="390" height="40" rx="8" fill="url(#grad-orange)"/>
  <text x="1055" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Testing Assembly Code</text>
  <text x="880" y="130" font-family="Arial, sans-serif" font-size="13" fill="#333333">Test from C harness:</text>
  <rect x="870" y="138" width="360" height="80" rx="4" fill="#1e1e2e"/>
  <text x="885" y="160" font-family="monospace" font-size="12" fill="#cba6f7">// C test harness</text>
  <text x="885" y="178" font-family="monospace" font-size="12" fill="#cdd6f4">extern int asm_add(int a, int b);</text>
  <text x="885" y="196" font-family="monospace" font-size="12" fill="#a6e3a1">assert(asm_add(2,3) == 5);</text>
  <text x="880" y="238" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Use gdb / rr to step through instructions</text>
  <text x="880" y="258" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Valgrind for memory errors</text>
  <text x="880" y="278" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Perf / VTune for cycle-level profiling</text>
  <text x="880" y="298" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Verify with objdump -d output</text>
  <text x="880" y="318" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Test edge cases: 0, negatives, overflow</text>

  <!-- Bottom row: when to use assembly -->
  <rect x="30" y="365" width="1220" height="245" rx="8" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="30" y="365" width="1220" height="40" rx="8" fill="#455a64"/>
  <text x="640" y="391" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">When to Use Assembly vs. C -- Decision Framework</text>

  <!-- Prefer C -->
  <rect x="50" y="415" width="560" height="180" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <text x="330" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">Prefer C (or intrinsics)</text>
  <text x="70" y="462" font-family="Arial, sans-serif" font-size="13" fill="#333333">- General application logic</text>
  <text x="70" y="484" font-family="Arial, sans-serif" font-size="13" fill="#333333">- When -O2 / -O3 compiler output is good enough</text>
  <text x="70" y="506" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Cross-platform portability required</text>
  <text x="70" y="528" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Large codebases (maintainability cost too high)</text>
  <text x="70" y="550" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Team lacks assembly expertise</text>
  <text x="70" y="572" font-family="Arial, sans-serif" font-size="13" fill="#888888">Tip: check compiler output with -S flag first</text>

  <!-- Prefer assembly -->
  <rect x="640" y="415" width="580" height="180" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="930" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Prefer Assembly</text>
  <text x="660" y="462" font-family="Arial, sans-serif" font-size="13" fill="#333333">- No C runtime available (bootloaders, firmware)</text>
  <text x="660" y="484" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Hardware instructions not exposed via C (CPUID, AES-NI)</text>
  <text x="660" y="506" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Exact cycle timing required (real-time control loops)</text>
  <text x="660" y="528" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Profiling confirms the hot loop is the bottleneck</text>
  <text x="660" y="550" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Side-channel resistance needs constant-time code</text>
  <text x="660" y="572" font-family="Arial, sans-serif" font-size="13" fill="#888888">Tip: isolate into a separate .s file, expose via C header</text>
</svg>

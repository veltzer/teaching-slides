<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <!-- Title -->
  <rect x="40" y="40" width="1200" height="42.890776" rx="6.373939" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="639.999948" y="67.294023" font-family="Arial, sans-serif" font-size="19.583928" font-weight="bold" fill="var(--bg)" text-anchor="middle">Assembly Best Practices</text>

  <!-- Column 1: Documentation -->
  <rect x="40" y="98.487422" width="363.934394" height="263.193399" rx="6.373939" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="98.487422" width="363.934394" height="38.991615" rx="6.373939" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.967302" y="123.831757" font-family="Arial, sans-serif" font-size="14.687786" font-weight="bold" fill="var(--bg)" text-anchor="middle">Documentation</text>
  <text x="59.672129" y="152.100731" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">Comment every instruction:</text>
  <rect x="49.836065" y="161.848635" width="334.426095" height="77.983229" rx="6.373939" fill="var(--code-bg)"/>
  <text x="64.590162" y="183.29413" font-family="monospace" font-size="12.332828" fill="var(--primary-accent)">movl $4, %eax   <tspan fill="var(--text-muted)"># sys_write</tspan></text>
  <text x="64.590162" y="202.78983" font-family="monospace" font-size="12.332828" fill="var(--primary-accent)">movl $1, %ebx   <tspan fill="var(--text-muted)"># fd=stdout</tspan></text>
  <text x="64.590162" y="222.285745" font-family="monospace" font-size="12.332828" fill="var(--primary-accent)">int  $0x80      <tspan fill="var(--text-muted)"># kernel call</tspan></text>
  <text x="59.672129" y="259.327779" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Document register usage at function start</text>
  <text x="59.672129" y="278.823479" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Describe ABI: caller/callee saved regs</text>
  <text x="59.672129" y="298.319394" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Note side effects and clobbered flags</text>
  <text x="59.672129" y="317.815094" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Use .section and label names descriptively</text>
  <text x="59.672129" y="337.311008" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Keep a header comment with stack frame layout</text>

  <!-- Column 2: ABI Compliance -->
  <rect x="423.606629" y="98.487422" width="413.114718" height="263.193399" rx="6.373939" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="423.606629" y="98.487422" width="413.114718" height="38.991615" rx="6.373939" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.163988" y="123.831757" font-family="Arial, sans-serif" font-size="14.687786" font-weight="bold" fill="var(--bg)" text-anchor="middle">ABI Compliance</text>
  <!-- x86-64 mini table -->
  <text x="443.278653" y="152.100731" font-family="Arial, sans-serif" font-size="12.729606" font-weight="bold" fill="var(--ok-accent)">x86-64 System V ABI (Linux/macOS):</text>
  <rect x="433.442589" y="157.949473" width="393.442589" height="27.294023" rx="6.373939" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="443.278653" y="176.470652" font-family="Arial, sans-serif" font-size="12.332828" font-weight="bold" fill="var(--ok-accent)">Role</text>
  <text x="571.147495" y="176.470652" font-family="Arial, sans-serif" font-size="12.332828" font-weight="bold" fill="var(--ok-accent)">Registers</text>
  <text x="748.196659" y="176.470652" font-family="Arial, sans-serif" font-size="12.332828" font-weight="bold" fill="var(--ok-accent)">Preserved by</text>
  <text x="443.278653" y="198.890776" font-family="Arial, sans-serif" font-size="12.332828" fill="var(--text)">Arguments</text>
  <text x="571.147495" y="198.890776" font-family="monospace" font-size="12.332828" fill="var(--primary-accent)">rdi, rsi, rdx, rcx, r8, r9</text>
  <text x="748.196659" y="198.890776" font-family="Arial, sans-serif" font-size="12.332828" fill="var(--text)">caller</text>
  <text x="443.278653" y="218.386584" font-family="Arial, sans-serif" font-size="12.332828" fill="var(--text)">Return value</text>
  <text x="571.147495" y="218.386584" font-family="monospace" font-size="12.332828" fill="var(--primary-accent)">rax (rdx for 128-bit)</text>
  <text x="748.196659" y="218.386584" font-family="Arial, sans-serif" font-size="12.332828" fill="var(--text)">caller</text>
  <text x="443.278653" y="237.882391" font-family="Arial, sans-serif" font-size="12.332828" fill="var(--text)">Caller-saved</text>
  <text x="571.147495" y="237.882391" font-family="monospace" font-size="12.332828" fill="var(--warn-accent)">rax, rcx, rdx, r8-r11</text>
  <text x="748.196659" y="237.882391" font-family="Arial, sans-serif" font-size="12.332828" fill="var(--text)">caller</text>
  <text x="443.278653" y="257.378091" font-family="Arial, sans-serif" font-size="12.332828" fill="var(--text)">Callee-saved</text>
  <text x="571.147495" y="257.378091" font-family="monospace" font-size="12.332828" fill="var(--danger-accent)">rbx, rbp, r12-r15</text>
  <text x="748.196659" y="257.378091" font-family="Arial, sans-serif" font-size="12.332828" fill="var(--text)">callee</text>
  <text x="443.278653" y="278.823479" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Stack must be 16-byte aligned at call</text>
  <text x="443.278653" y="298.319394" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Red zone: 128 bytes below RSP (no signal)</text>
  <text x="443.278653" y="317.815094" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Push/pop callee-saved regs in prologue/epilogue</text>
  <text x="443.278653" y="337.311008" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Never return with mismatched stack pointer</text>

  <!-- Column 3: Testing -->
  <rect x="856.393476" y="98.487422" width="383.606524" height="263.193399" rx="6.373939" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="856.393476" y="98.487422" width="383.606524" height="38.991615" rx="6.373939" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.196633" y="123.831757" font-family="Arial, sans-serif" font-size="14.687786" font-weight="bold" fill="var(--bg)" text-anchor="middle">Testing Assembly Code</text>
  <text x="876.065606" y="152.100731" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">Test from C harness:</text>
  <rect x="866.229436" y="159.899161" width="354.098435" height="77.983229" rx="6.373939" fill="var(--code-bg)"/>
  <text x="880.983638" y="181.344442" font-family="monospace" font-size="12.332828" fill="var(--info-accent)">// C test harness</text>
  <text x="880.983638" y="198.890776" font-family="monospace" font-size="12.332828" fill="var(--primary-accent)">extern int asm_add(int a, int b);</text>
  <text x="880.983638" y="216.43711" font-family="monospace" font-size="12.332828" fill="var(--ok-accent)">assert(asm_add(2,3) == 5);</text>
  <text x="876.065606" y="257.378091" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Use gdb / rr to step through instructions</text>
  <text x="876.065606" y="276.873898" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Valgrind for memory errors</text>
  <text x="876.065606" y="296.369705" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Perf / VTune for cycle-level profiling</text>
  <text x="876.065606" y="315.86562" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Verify with objdump -d output</text>
  <text x="876.065606" y="335.36132" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Test edge cases: 0, negatives, overflow</text>

  <!-- Bottom row: when to use assembly -->
  <rect x="40" y="381.176414" width="1200" height="238.823586" rx="6.373939" fill="var(--surface)"/>
  <rect x="40" y="381.176414" width="1200" height="38.991615" rx="6.373939" fill="var(--text-muted)"/>
  <text x="639.999948" y="406.521178" font-family="Arial, sans-serif" font-size="15.667036" font-weight="bold" fill="var(--bg)" text-anchor="middle">When to Use Assembly vs. C -- Decision Framework</text>

  <!-- Prefer C -->
  <rect x="59.672129" y="429.91604" width="550.819624" height="175.462374" rx="6.373939" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.081941" y="452.336272" font-family="Arial, sans-serif" font-size="13.708537" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Prefer C (or intrinsics)</text>
  <text x="79.344154" y="475.731241" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- General application logic</text>
  <text x="79.344154" y="497.176629" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- When -O2 / -O3 compiler output is good enough</text>
  <text x="79.344154" y="518.622017" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Cross-platform portability required</text>
  <text x="79.344154" y="540.067405" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Large codebases (maintainability cost too high)</text>
  <text x="79.344154" y="561.512793" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Team lacks assembly expertise</text>
  <text x="79.344154" y="582.958074" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text-faint)">Tip: check compiler output with -S flag first</text>

  <!-- Prefer assembly -->
  <rect x="639.999948" y="429.91604" width="570.491858" height="175.462374" rx="6.373939" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="925.245824" y="452.336272" font-family="Arial, sans-serif" font-size="13.708537" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Prefer Assembly</text>
  <text x="659.672182" y="475.731241" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- No C runtime available (bootloaders, firmware)</text>
  <text x="659.672182" y="497.176629" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Hardware instructions not exposed via C (CPUID, AES-NI)</text>
  <text x="659.672182" y="518.622017" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Exact cycle timing required (real-time control loops)</text>
  <text x="659.672182" y="540.067405" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Profiling confirms the hot loop is the bottleneck</text>
  <text x="659.672182" y="561.512793" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text)">- Side-channel resistance needs constant-time code</text>
  <text x="659.672182" y="582.958074" font-family="Arial, sans-serif" font-size="12.729606" fill="var(--text-faint)">Tip: isolate into a separate .s file, expose via C header</text>
</svg>

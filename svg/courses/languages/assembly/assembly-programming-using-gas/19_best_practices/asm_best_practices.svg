<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>

  <!-- Title -->
  <rect x="177.9133" y="156.3002" width="1036.5966" height="32.6445" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="696.2116" y="177.0739" font-family="Arial, sans-serif" font-size="15.8795" font-weight="bold" fill="var(--bg)" text-anchor="middle">Assembly Best Practices</text>

  <!-- Column 1: Documentation -->
  <rect x="177.9133" y="200.8154" width="314.3776" height="200.3183" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="177.9133" y="200.8154" width="314.3776" height="29.6768" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="335.1022" y="220.1052" font-family="Arial, sans-serif" font-size="11.9095" font-weight="bold" fill="var(--bg)" text-anchor="middle">Documentation</text>
  <text x="194.9067" y="241.6209" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">Comment every instruction:</text>
  <rect x="186.41" y="249.0401" width="288.8875" height="59.3536" rx="5.7089" fill="var(--code-bg)"/>
  <text x="199.155" y="265.3624" font-family="monospace" font-size="10" fill="var(--primary-accent)">movl $4, %eax   <tspan fill="var(--text-muted)"># sys_write</tspan></text>
  <text x="199.155" y="280.2007" font-family="monospace" font-size="10" fill="var(--primary-accent)">movl $1, %ebx   <tspan fill="var(--text-muted)"># fd=stdout</tspan></text>
  <text x="199.155" y="295.0392" font-family="monospace" font-size="10" fill="var(--primary-accent)">int  $0x80      <tspan fill="var(--text-muted)"># kernel call</tspan></text>
  <text x="194.9067" y="323.2321" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Document register usage at function start</text>
  <text x="194.9067" y="338.0704" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Describe ABI: caller/callee saved regs</text>
  <text x="194.9067" y="352.9089" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Note side effects and clobbered flags</text>
  <text x="194.9067" y="367.7472" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Use .section and label names descriptively</text>
  <text x="194.9067" y="382.5857" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Keep a header comment with stack frame layout</text>

  <!-- Column 2: ABI Compliance -->
  <rect x="509.2844" y="200.8154" width="356.8611" height="200.3183" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="509.2844" y="200.8154" width="356.8611" height="29.6768" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="687.715" y="220.1052" font-family="Arial, sans-serif" font-size="11.9095" font-weight="bold" fill="var(--bg)" text-anchor="middle">ABI Compliance</text>
  <!-- x86-64 mini table -->
  <text x="526.2777" y="241.6209" font-family="Arial, sans-serif" font-size="10.3217" font-weight="bold" fill="var(--ok-accent)">x86-64 System V ABI (Linux/macOS):</text>
  <rect x="517.781" y="246.0724" width="339.8677" height="20.7737" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="526.2777" y="260.169" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Role</text>
  <text x="636.7347" y="260.169" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Registers</text>
  <text x="789.6752" y="260.169" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--ok-accent)">Preserved by</text>
  <text x="526.2777" y="277.2331" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Arguments</text>
  <text x="636.7347" y="277.2331" font-family="monospace" font-size="10" fill="var(--primary-accent)">rdi, rsi, rdx, rcx, r8, r9</text>
  <text x="789.6752" y="277.2331" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">caller</text>
  <text x="526.2777" y="292.0715" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Return value</text>
  <text x="636.7347" y="292.0715" font-family="monospace" font-size="10" fill="var(--primary-accent)">rax (rdx for 128-bit)</text>
  <text x="789.6752" y="292.0715" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">caller</text>
  <text x="526.2777" y="306.9099" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Caller-saved</text>
  <text x="636.7347" y="306.9099" font-family="monospace" font-size="10" fill="var(--warn-accent)">rax, rcx, rdx, r8-r11</text>
  <text x="789.6752" y="306.9099" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">caller</text>
  <text x="526.2777" y="321.7482" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">Callee-saved</text>
  <text x="636.7347" y="321.7482" font-family="monospace" font-size="10" fill="var(--danger-accent)">rbx, rbp, r12-r15</text>
  <text x="789.6752" y="321.7482" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">callee</text>
  <text x="526.2777" y="338.0704" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Stack must be 16-byte aligned at call</text>
  <text x="526.2777" y="352.9089" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Red zone: 128 bytes below RSP (no signal)</text>
  <text x="526.2777" y="367.7472" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Push/pop callee-saved regs in prologue/epilogue</text>
  <text x="526.2777" y="382.5857" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Never return with mismatched stack pointer</text>

  <!-- Column 3: Testing -->
  <rect x="883.1389" y="200.8154" width="331.371" height="200.3183" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="883.1389" y="200.8154" width="331.371" height="29.6768" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1048.8243" y="220.1052" font-family="Arial, sans-serif" font-size="11.9095" font-weight="bold" fill="var(--bg)" text-anchor="middle">Testing Assembly Code</text>
  <text x="900.1323" y="241.6209" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">Test from C harness:</text>
  <rect x="891.6355" y="247.5563" width="305.881" height="59.3536" rx="5.7089" fill="var(--code-bg)"/>
  <text x="904.3806" y="263.8785" font-family="monospace" font-size="10" fill="var(--info-accent)">// C test harness</text>
  <text x="904.3806" y="277.2331" font-family="monospace" font-size="10" fill="var(--primary-accent)">extern int asm_add(int a, int b);</text>
  <text x="904.3806" y="290.5877" font-family="monospace" font-size="10" fill="var(--ok-accent)">assert(asm_add(2,3) == 5);</text>
  <text x="900.1323" y="321.7482" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Use gdb / rr to step through instructions</text>
  <text x="900.1323" y="336.5866" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Valgrind for memory errors</text>
  <text x="900.1323" y="351.425" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Perf / VTune for cycle-level profiling</text>
  <text x="900.1323" y="366.2635" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Verify with objdump -d output</text>
  <text x="900.1323" y="381.1018" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Test edge cases: 0, negatives, overflow</text>

  <!-- Bottom row: when to use assembly -->
  <rect x="177.9133" y="415.972" width="1036.5966" height="181.7703" rx="5.7089" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="177.9133" y="415.972" width="1036.5966" height="29.6768" rx="5.7089" fill="var(--text-muted)"/>
  <text x="696.2116" y="435.262" font-family="Arial, sans-serif" font-size="12.7035" font-weight="bold" fill="var(--bg)" text-anchor="middle">When to Use Assembly vs. C -- Decision Framework</text>

  <!-- Prefer C -->
  <rect x="194.9067" y="453.068" width="475.8148" height="133.5456" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="432.8141" y="470.1322" font-family="Arial, sans-serif" font-size="11.1155" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Prefer C (or intrinsics)</text>
  <text x="211.9" y="487.9383" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- General application logic</text>
  <text x="211.9" y="504.2605" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- When -O2 / -O3 compiler output is good enough</text>
  <text x="211.9" y="520.5828" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Cross-platform portability required</text>
  <text x="211.9" y="536.905" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Large codebases (maintainability cost too high)</text>
  <text x="211.9" y="553.2272" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Team lacks assembly expertise</text>
  <text x="211.9" y="569.5494" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text-faint)">Tip: check compiler output with -S flag first</text>

  <!-- Prefer assembly -->
  <rect x="696.2116" y="453.068" width="492.8083" height="133.5456" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="942.6157" y="470.1322" font-family="Arial, sans-serif" font-size="11.1155" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Prefer Assembly</text>
  <text x="713.205" y="487.9383" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- No C runtime available (bootloaders, firmware)</text>
  <text x="713.205" y="504.2605" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Hardware instructions not exposed via C (CPUID, AES-NI)</text>
  <text x="713.205" y="520.5828" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Exact cycle timing required (real-time control loops)</text>
  <text x="713.205" y="536.905" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Profiling confirms the hot loop is the bottleneck</text>
  <text x="713.205" y="553.2272" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Side-channel resistance needs constant-time code</text>
  <text x="713.205" y="569.5494" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text-faint)">Tip: isolate into a separate .s file, expose via C header</text>
</svg>

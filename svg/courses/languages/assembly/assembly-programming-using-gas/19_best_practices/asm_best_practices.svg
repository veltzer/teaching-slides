<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.699676538728" font-weight="bold" fill="var(--primary-accent)">Assembly Best Practices</text>

  <rect x="40" y="82.181818181818" width="385" height="237.272727272727" rx="10.269106361049" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--primary-text)">Documentation</text>
  <text x="60" y="156" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--primary-text)">Comment each instruction</text>
  <text x="60" y="187.636363636364" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--primary-text)">Note register usage</text>
  <text x="60" y="219.272727272727" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--primary-text)">Document ABI clobbers</text>
  <text x="60" y="250.909090909091" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--primary-text)">Describe stack layout</text>
  <text x="60" y="282.545454545455" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--primary-text)">Descriptive labels</text>

  <rect x="447" y="82.181818181818" width="385" height="237.272727272727" rx="10.269106361049" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--ok-text)">ABI (x86-64)</text>
  <text x="467" y="156" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">args: rdi rsi rdx rcx r8 r9</text>
  <text x="467" y="187.636363636364" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">return: rax</text>
  <text x="467" y="219.272727272727" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">caller-save: rax rcx r8-r11</text>
  <text x="467" y="250.909090909091" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">callee-save: rbx rbp r12-r15</text>
  <text x="467" y="282.545454545455" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--ok-text)">stack: 16-byte aligned</text>

  <rect x="854" y="82.181818181818" width="386" height="237.272727272727" rx="10.269106361049" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--warn-text)">Testing</text>
  <text x="874" y="156" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--warn-text)">C harness + assert</text>
  <text x="874" y="187.636363636364" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--warn-text)">gdb step-through</text>
  <text x="874" y="219.272727272727" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--warn-text)">Valgrind memory</text>
  <text x="874" y="250.909090909091" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--warn-text)">perf cycle profile</text>
  <text x="874" y="282.545454545455" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--warn-text)">objdump -d verify</text>

  <!-- Decision framework -->
  <rect x="40" y="351.090909090909" width="590" height="268.909090909091" rx="10.269106361049" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--danger-text)">Prefer C</text>
  <text x="60" y="424.909090909091" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--danger-text)">General application logic</text>
  <text x="60" y="461.818181818182" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--danger-text)">-O2 output fast enough</text>
  <text x="60" y="498.727272727273" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--danger-text)">Cross-platform needs</text>
  <text x="60" y="535.636363636364" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--danger-text)">Large maintained codebase</text>
  <text x="60" y="577.818181818182" font-family="Arial, sans-serif" font-size="14.376748905469" font-style="italic" fill="var(--danger-text)">Check -S output first</text>

  <rect x="650" y="351.090909090909" width="590" height="268.909090909091" rx="10.269106361049" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--ok-text)">Prefer Assembly</text>
  <text x="670" y="424.909090909091" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--ok-text)">No C runtime (bootloader)</text>
  <text x="670" y="461.818181818182" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--ok-text)">Special instructions (AES-NI)</text>
  <text x="670" y="498.727272727273" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--ok-text)">Exact cycle timing</text>
  <text x="670" y="535.636363636364" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--ok-text)">Constant-time crypto</text>
  <text x="670" y="577.818181818182" font-family="Arial, sans-serif" font-size="14.376748905469" font-style="italic" fill="var(--ok-text)">Isolate in .s file</text>
</svg>

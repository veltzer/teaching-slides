<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">SIMD and AVX: Vector Registers and Data Parallelism</text>

  <!-- Register hierarchy -->
  <!-- ZMM (512-bit) -->
  <rect x="30" y="75" width="1220" height="44" rx="4" fill="url(#grad-purple)" filter="url(#shadow)"/>
  <text x="55" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">ZMM0 (512-bit, AVX-512):</text>
  <!-- 16 floats -->
  <rect x="280" y="79" width="50" height="36" rx="3" fill="#ce93d8" stroke="#ffffff" stroke-width="1"/>
  <text x="305" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f0</text>
  <rect x="332" y="79" width="50" height="36" rx="3" fill="#ce93d8" stroke="#ffffff" stroke-width="1"/>
  <text x="357" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f1</text>
  <rect x="384" y="79" width="50" height="36" rx="3" fill="#ce93d8" stroke="#ffffff" stroke-width="1"/>
  <text x="409" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f2</text>
  <rect x="436" y="79" width="50" height="36" rx="3" fill="#ce93d8" stroke="#ffffff" stroke-width="1"/>
  <text x="461" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f3</text>
  <rect x="488" y="79" width="50" height="36" rx="3" fill="#ce93d8" stroke="#ffffff" stroke-width="1"/>
  <text x="513" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f4</text>
  <rect x="540" y="79" width="50" height="36" rx="3" fill="#ce93d8" stroke="#ffffff" stroke-width="1"/>
  <text x="565" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f5</text>
  <rect x="592" y="79" width="50" height="36" rx="3" fill="#ce93d8" stroke="#ffffff" stroke-width="1"/>
  <text x="617" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f6</text>
  <rect x="644" y="79" width="50" height="36" rx="3" fill="#ce93d8" stroke="#ffffff" stroke-width="1"/>
  <text x="669" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f7</text>
  <rect x="696" y="79" width="50" height="36" rx="3" fill="#ab47bc" stroke="#ffffff" stroke-width="1"/>
  <text x="721" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f8</text>
  <rect x="748" y="79" width="50" height="36" rx="3" fill="#ab47bc" stroke="#ffffff" stroke-width="1"/>
  <text x="773" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f9</text>
  <rect x="800" y="79" width="50" height="36" rx="3" fill="#ab47bc" stroke="#ffffff" stroke-width="1"/>
  <text x="825" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f10</text>
  <rect x="852" y="79" width="50" height="36" rx="3" fill="#ab47bc" stroke="#ffffff" stroke-width="1"/>
  <text x="877" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f11</text>
  <rect x="904" y="79" width="50" height="36" rx="3" fill="#ab47bc" stroke="#ffffff" stroke-width="1"/>
  <text x="929" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f12</text>
  <rect x="956" y="79" width="50" height="36" rx="3" fill="#ab47bc" stroke="#ffffff" stroke-width="1"/>
  <text x="981" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f13</text>
  <rect x="1008" y="79" width="50" height="36" rx="3" fill="#ab47bc" stroke="#ffffff" stroke-width="1"/>
  <text x="1033" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f14</text>
  <rect x="1060" y="79" width="50" height="36" rx="3" fill="#ab47bc" stroke="#ffffff" stroke-width="1"/>
  <text x="1085" y="102" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f15</text>
  <text x="1130" y="100" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">16 x float32</text>

  <!-- YMM (256-bit) -->
  <rect x="30" y="133" width="1220" height="44" rx="4" fill="url(#grad-green)" filter="url(#shadow)"/>
  <text x="55" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">YMM0 (256-bit, AVX):</text>
  <!-- 8 floats -->
  <rect x="280" y="137" width="100" height="36" rx="3" fill="#66bb6a" stroke="#ffffff" stroke-width="1"/>
  <text x="330" y="160" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f0</text>
  <rect x="382" y="137" width="100" height="36" rx="3" fill="#66bb6a" stroke="#ffffff" stroke-width="1"/>
  <text x="432" y="160" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f1</text>
  <rect x="484" y="137" width="100" height="36" rx="3" fill="#66bb6a" stroke="#ffffff" stroke-width="1"/>
  <text x="534" y="160" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f2</text>
  <rect x="586" y="137" width="100" height="36" rx="3" fill="#66bb6a" stroke="#ffffff" stroke-width="1"/>
  <text x="636" y="160" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f3</text>
  <rect x="688" y="137" width="100" height="36" rx="3" fill="#43a047" stroke="#ffffff" stroke-width="1"/>
  <text x="738" y="160" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f4</text>
  <rect x="790" y="137" width="100" height="36" rx="3" fill="#43a047" stroke="#ffffff" stroke-width="1"/>
  <text x="840" y="160" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f5</text>
  <rect x="892" y="137" width="100" height="36" rx="3" fill="#43a047" stroke="#ffffff" stroke-width="1"/>
  <text x="942" y="160" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f6</text>
  <rect x="994" y="137" width="100" height="36" rx="3" fill="#43a047" stroke="#ffffff" stroke-width="1"/>
  <text x="1044" y="160" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f7</text>
  <text x="1120" y="158" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">8 x float32</text>

  <!-- XMM (128-bit) -->
  <rect x="30" y="191" width="1220" height="44" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="55" y="216" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">XMM0 (128-bit, SSE):</text>
  <!-- 4 floats -->
  <rect x="280" y="195" width="200" height="36" rx="3" fill="#42a5f5" stroke="#ffffff" stroke-width="1"/>
  <text x="380" y="218" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f0</text>
  <rect x="482" y="195" width="200" height="36" rx="3" fill="#42a5f5" stroke="#ffffff" stroke-width="1"/>
  <text x="582" y="218" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f1</text>
  <rect x="684" y="195" width="200" height="36" rx="3" fill="#1e88e5" stroke="#ffffff" stroke-width="1"/>
  <text x="784" y="218" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f2</text>
  <rect x="886" y="195" width="200" height="36" rx="3" fill="#1e88e5" stroke="#ffffff" stroke-width="1"/>
  <text x="986" y="218" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">f3</text>
  <text x="1120" y="216" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">4 x float32</text>

  <!-- Packed operation diagram -->
  <rect x="30" y="255" width="600" height="230" rx="8" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <text x="330" y="278" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1565c0" text-anchor="middle">Packed Operation: vaddps ymm0, ymm1, ymm2</text>

  <!-- ymm1 -->
  <text x="50" y="305" font-family="monospace" font-size="12" fill="#555555">ymm1:</text>
  <rect x="120" y="290" width="60" height="28" rx="3" fill="#43a047"/>
  <text x="150" y="309" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">1.0</text>
  <rect x="182" y="290" width="60" height="28" rx="3" fill="#43a047"/>
  <text x="212" y="309" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">2.0</text>
  <rect x="244" y="290" width="60" height="28" rx="3" fill="#43a047"/>
  <text x="274" y="309" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">3.0</text>
  <rect x="306" y="290" width="60" height="28" rx="3" fill="#43a047"/>
  <text x="336" y="309" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">4.0</text>
  <rect x="368" y="290" width="60" height="28" rx="3" fill="#43a047"/>
  <text x="398" y="309" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">5.0</text>
  <rect x="430" y="290" width="60" height="28" rx="3" fill="#43a047"/>
  <text x="460" y="309" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">6.0</text>
  <rect x="492" y="290" width="60" height="28" rx="3" fill="#43a047"/>
  <text x="522" y="309" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">7.0</text>
  <rect x="554" y="290" width="60" height="28" rx="3" fill="#43a047"/>
  <text x="584" y="309" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">8.0</text>

  <!-- ymm2 -->
  <text x="50" y="342" font-family="monospace" font-size="12" fill="#555555">ymm2:</text>
  <rect x="120" y="328" width="60" height="28" rx="3" fill="#fb8c00"/>
  <text x="150" y="347" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">10</text>
  <rect x="182" y="328" width="60" height="28" rx="3" fill="#fb8c00"/>
  <text x="212" y="347" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">20</text>
  <rect x="244" y="328" width="60" height="28" rx="3" fill="#fb8c00"/>
  <text x="274" y="347" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">30</text>
  <rect x="306" y="328" width="60" height="28" rx="3" fill="#fb8c00"/>
  <text x="336" y="347" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">40</text>
  <rect x="368" y="328" width="60" height="28" rx="3" fill="#fb8c00"/>
  <text x="398" y="347" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">50</text>
  <rect x="430" y="328" width="60" height="28" rx="3" fill="#fb8c00"/>
  <text x="460" y="347" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">60</text>
  <rect x="492" y="328" width="60" height="28" rx="3" fill="#fb8c00"/>
  <text x="522" y="347" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">70</text>
  <rect x="554" y="328" width="60" height="28" rx="3" fill="#fb8c00"/>
  <text x="584" y="347" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">80</text>

  <!-- Arrow -->
  <line x1="355" y1="360" x2="355" y2="388" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="380" font-family="Arial, sans-serif" font-size="12" fill="#555555">vaddps (8 adds simultaneously)</text>

  <!-- Result ymm0 -->
  <text x="50" y="415" font-family="monospace" font-size="12" fill="#555555">ymm0:</text>
  <rect x="120" y="400" width="60" height="28" rx="3" fill="#1e88e5"/>
  <text x="150" y="419" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">11</text>
  <rect x="182" y="400" width="60" height="28" rx="3" fill="#1e88e5"/>
  <text x="212" y="419" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">22</text>
  <rect x="244" y="400" width="60" height="28" rx="3" fill="#1e88e5"/>
  <text x="274" y="419" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">33</text>
  <rect x="306" y="400" width="60" height="28" rx="3" fill="#1e88e5"/>
  <text x="336" y="419" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">44</text>
  <rect x="368" y="400" width="60" height="28" rx="3" fill="#1e88e5"/>
  <text x="398" y="419" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">55</text>
  <rect x="430" y="400" width="60" height="28" rx="3" fill="#1e88e5"/>
  <text x="460" y="419" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">66</text>
  <rect x="492" y="400" width="60" height="28" rx="3" fill="#1e88e5"/>
  <text x="522" y="419" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">77</text>
  <rect x="554" y="400" width="60" height="28" rx="3" fill="#1e88e5"/>
  <text x="584" y="419" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">88</text>

  <text x="330" y="462" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">8 additions in one instruction (vs 8 scalar addss)</text>

  <!-- Right panel: common instructions and usage -->
  <rect x="650" y="255" width="600" height="230" rx="8" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <text x="950" y="278" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#6a1b9a" text-anchor="middle">Common SIMD Instructions</text>

  <!-- Table -->
  <rect x="665" y="285" width="570" height="28" rx="3" fill="#e8eaf6"/>
  <text x="680" y="304" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333">Instruction</text>
  <text x="840" y="304" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333">Operation</text>
  <text x="1060" y="304" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333">Width</text>

  <text x="680" y="328" font-family="monospace" font-size="12" fill="#6a1b9a">vaddps</text>
  <text x="840" y="328" font-family="Arial, sans-serif" font-size="12" fill="#333333">Packed float add</text>
  <text x="1060" y="328" font-family="Arial, sans-serif" font-size="12" fill="#333333">YMM/ZMM</text>

  <text x="680" y="350" font-family="monospace" font-size="12" fill="#6a1b9a">vmulps</text>
  <text x="840" y="350" font-family="Arial, sans-serif" font-size="12" fill="#333333">Packed float multiply</text>
  <text x="1060" y="350" font-family="Arial, sans-serif" font-size="12" fill="#333333">YMM/ZMM</text>

  <text x="680" y="372" font-family="monospace" font-size="12" fill="#6a1b9a">vmovaps</text>
  <text x="840" y="372" font-family="Arial, sans-serif" font-size="12" fill="#333333">Aligned move</text>
  <text x="1060" y="372" font-family="Arial, sans-serif" font-size="12" fill="#333333">YMM/ZMM</text>

  <text x="680" y="394" font-family="monospace" font-size="12" fill="#6a1b9a">vpand</text>
  <text x="840" y="394" font-family="Arial, sans-serif" font-size="12" fill="#333333">Bitwise AND</text>
  <text x="1060" y="394" font-family="Arial, sans-serif" font-size="12" fill="#333333">YMM/ZMM</text>

  <text x="680" y="416" font-family="monospace" font-size="12" fill="#6a1b9a">vpcmpeqd</text>
  <text x="840" y="416" font-family="Arial, sans-serif" font-size="12" fill="#333333">Packed int compare</text>
  <text x="1060" y="416" font-family="Arial, sans-serif" font-size="12" fill="#333333">YMM/ZMM</text>

  <text x="680" y="438" font-family="monospace" font-size="12" fill="#6a1b9a">vfmadd231ps</text>
  <text x="840" y="438" font-family="Arial, sans-serif" font-size="12" fill="#333333">Fused multiply-add</text>
  <text x="1060" y="438" font-family="Arial, sans-serif" font-size="12" fill="#333333">YMM/ZMM</text>

  <text x="950" y="465" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Registers: XMM0-XMM15 (SSE), YMM0-YMM15 (AVX), ZMM0-ZMM31 (AVX-512)</text>

  <!-- GCC vectorization hint -->
  <rect x="30" y="500" width="1220" height="110" rx="8" fill="#1e1e2e" filter="url(#shadow)"/>
  <text x="640" y="522" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Using SIMD in GAS / GCC</text>
  <text x="50" y="546" font-family="monospace" font-size="13" fill="#89b4fa">vmovaps (%rsi), %ymm1          <tspan fill="#6c7086">; load 8 floats from aligned memory</tspan></text>
  <text x="50" y="566" font-family="monospace" font-size="13" fill="#89b4fa">vmovaps (%rdx), %ymm2          <tspan fill="#6c7086">; load 8 more floats</tspan></text>
  <text x="50" y="586" font-family="monospace" font-size="13" fill="#a6e3a1">vaddps  %ymm2, %ymm1, %ymm0    <tspan fill="#6c7086">; add them together (8 ops at once)</tspan></text>
  <text x="50" y="606" font-family="monospace" font-size="13" fill="#89b4fa">vmovaps %ymm0, (%rdi)          <tspan fill="#6c7086">; store 8 results</tspan></text>
</svg>

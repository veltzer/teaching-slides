<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Register widths -->
  <rect x="40" y="40" width="610.169491525424" height="62.142857142857" rx="6.157732987455" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.338983050847" y="65.892857142857" font-family="Arial, sans-serif" font-size="16.420621299881" font-weight="bold" fill="var(--primary-text)">SSE</text>
  <text x="60.338983050847" y="89.714285714286" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--primary-text)">xmm0-xmm15  128-bit</text>

  <rect x="40" y="112.5" width="813.559322033898" height="62.142857142857" rx="6.157732987455" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.338983050847" y="138.392857142857" font-family="Arial, sans-serif" font-size="16.420621299881" font-weight="bold" fill="var(--ok-text)">AVX / AVX2</text>
  <text x="60.338983050847" y="162.214285714286" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--ok-text)">ymm0-ymm15  256-bit</text>

  <rect x="40" y="185" width="1200" height="62.142857142857" rx="6.157732987455" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.338983050847" y="210.892857142857" font-family="Arial, sans-serif" font-size="16.420621299881" font-weight="bold" fill="var(--warn-text)">AVX-512</text>
  <text x="60.338983050847" y="234.714285714286" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--warn-text)">zmm0-zmm31  512-bit</text>

  <!-- Instruction groups -->
  <rect x="40" y="278.214285714286" width="386.440677966102" height="155.357142857143" rx="8.21031064994" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.420621299881" font-weight="bold" fill="var(--info-text)">Packed arithmetic</text>
  <text x="233.220338983051" y="340.357142857143" text-anchor="middle" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--info-text)">vaddps ymm0, ymm1, ymm2</text>
  <text x="233.220338983051" y="371.428571428571" text-anchor="middle" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--info-text)">vmulpd  vfmadd231ps</text>
  <text x="233.220338983051" y="410.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--info-text)">8 floats per instruction</text>

  <rect x="446.779661016949" y="278.214285714286" width="386.440677966102" height="155.357142857143" rx="8.21031064994" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.420621299881" font-weight="bold" fill="var(--primary-text)">Load / store</text>
  <text x="640" y="340.357142857143" text-anchor="middle" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--primary-text)">vmovaps (aligned)</text>
  <text x="640" y="371.428571428571" text-anchor="middle" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--primary-text)">vmovups (unaligned)</text>
  <text x="640" y="410.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--primary-text)">32-byte align</text>

  <rect x="853.559322033898" y="278.214285714286" width="386.440677966102" height="155.357142857143" rx="8.21031064994" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.779661016949" y="309.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.420621299881" font-weight="bold" fill="var(--ok-text)">Shuffle / mask</text>
  <text x="1046.779661016949" y="340.357142857143" text-anchor="middle" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--ok-text)">vpermps  vshufps</text>
  <text x="1046.779661016949" y="371.428571428571" text-anchor="middle" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--ok-text)">AVX-512 k-masks</text>
  <text x="1046.779661016949" y="410.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--ok-text)">Lane ops</text>

  <!-- Example -->
  <rect x="40" y="464.642857142857" width="1200" height="155.357142857143" rx="8.21031064994" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="60.338983050847" y="495.714285714286" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--bg)">Example: 8-float add</text>
  <text x="60.338983050847" y="521.607142857143" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--ok-fill)">vmovups ymm0, [rdi]</text>
  <text x="60.338983050847" y="545.428571428572" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--ok-fill)">vmovups ymm1, [rsi]</text>
  <text x="60.338983050847" y="569.25" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--ok-fill)">vaddps  ymm0, ymm0, ymm1</text>
  <text x="60.338983050847" y="593.071428571429" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--ok-fill)">vmovups [rdx], ymm0</text>
</svg>

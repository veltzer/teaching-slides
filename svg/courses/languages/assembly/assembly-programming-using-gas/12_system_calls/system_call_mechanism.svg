<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="560" height="238.823529411765" rx="8.531372323694" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728312" font-weight="bold" fill="var(--primary-text)">USER SPACE</text>
  <text x="320" y="119.607843137255" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">EAX = syscall number</text>
  <text x="320" y="153.725490196079" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">EBX, ECX, EDX = args</text>
  <text x="320" y="187.843137254902" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">ESI, EDI = args 4, 5</text>
  <text x="320" y="239.019607843137" text-anchor="middle" font-family="Courier New, monospace" font-size="19.195587728312" font-weight="bold" fill="var(--primary-text)">int $0x80</text>

  <rect x="40" y="324.313725490196" width="560" height="295.686274509804" rx="8.531372323694" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="364.117647058823" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728312" font-weight="bold" fill="var(--danger-text)">KERNEL SPACE</text>
  <text x="320" y="403.921568627451" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--danger-text)">syscall_table[EAX]</text>
  <text x="320" y="449.411764705883" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--danger-text)">Dispatches to handler</text>
  <text x="320" y="489.21568627451" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--danger-text)">Returns via EAX</text>
  <text x="320" y="529.019607843137" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--danger-text)">EAX &gt;= 0: success</text>
  <text x="320" y="563.137254901961" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--danger-text)">EAX &lt; 0: -errno</text>

  <line x1="320" y1="278.823529411765" x2="320" y2="318.627450980392" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="290" y1="318.627450980392" x2="290" y2="278.823529411765" stroke="var(--ok-border)" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrow-ok)"/>

  <rect x="640" y="40" width="600" height="580" rx="8.531372323694" fill="var(--surface)" stroke="var(--border)"/>
  <text x="940" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728312" font-weight="bold" fill="var(--text)">Common x86 Syscalls</text>
  <text x="680" y="130.980392156863" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">1  sys_exit     EBX=code</text>
  <text x="680" y="170.784313725491" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">2  sys_fork</text>
  <text x="680" y="210.588235294117" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">3  sys_read     fd, buf, count</text>
  <text x="680" y="250.392156862745" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">4  sys_write    fd, buf, count</text>
  <text x="680" y="290.196078431373" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">5  sys_open     name, flags, mode</text>
  <text x="680" y="330" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">6  sys_close    fd</text>
  <text x="680" y="369.803921568628" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">7  sys_waitpid</text>
  <text x="680" y="409.607843137255" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">20 sys_getpid</text>
  <text x="680" y="449.411764705883" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text)">45 sys_brk</text>
  <text x="680" y="529.019607843137" font-family="Arial, sans-serif" font-size="13.863480026003" fill="var(--text-muted)">Trap switches to ring 0</text>
  <text x="680" y="563.137254901961" font-family="Arial, sans-serif" font-size="13.863480026003" fill="var(--text-muted)">Kernel validates args</text>
  <text x="680" y="597.254901960785" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--text-muted)">cmp $0, %eax; jl error</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-user" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="grad-kernel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#ffcdd2"/>
    </linearGradient>
    <marker id="arrow-ret" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- User Space zone -->
  <rect x="30" y="20" width="560" height="240" rx="10" fill="url(#grad-user)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="20" width="560" height="38" rx="10" fill="url(#grad-primary)"/>
  <rect x="30" y="44" width="560" height="14" fill="url(#grad-primary)"/>
  <text x="310" y="46" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">USER SPACE</text>

  <!-- User program box -->
  <rect x="60" y="75" width="200" height="160" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="100" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1565c0">User Program</text>
  <text x="160" y="122" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">mov $4, %eax</text>
  <text x="160" y="138" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">mov $1, %ebx</text>
  <text x="160" y="154" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">mov $msg, %ecx</text>
  <text x="160" y="170" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">mov $len, %edx</text>
  <rect x="90" y="182" width="140" height="28" rx="4" fill="#1e88e5"/>
  <text x="160" y="200" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">int $0x80</text>
  <text x="160" y="226" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">← triggers trap</text>

  <!-- Register table in user space -->
  <rect x="285" y="75" width="285" height="170" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="427" y="97" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Register Assignments</text>
  <line x1="285" y1="103" x2="570" y2="103" stroke="#bbdefb" stroke-width="1"/>
  <!-- header -->
  <text x="340" y="120" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#555">Register</text>
  <text x="490" y="120" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#555">Purpose</text>
  <line x1="285" y1="126" x2="570" y2="126" stroke="#e3f2fd" stroke-width="1"/>
  <!-- rows -->
  <text x="330" y="143" text-anchor="middle" font-family="monospace" font-size="12" fill="#e53935" font-weight="bold">EAX</text>
  <text x="470" y="143" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">syscall number</text>
  <text x="330" y="160" text-anchor="middle" font-family="monospace" font-size="12" fill="#1565c0">EBX</text>
  <text x="470" y="160" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">argument 1</text>
  <text x="330" y="177" text-anchor="middle" font-family="monospace" font-size="12" fill="#1565c0">ECX</text>
  <text x="470" y="177" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">argument 2</text>
  <text x="330" y="194" text-anchor="middle" font-family="monospace" font-size="12" fill="#1565c0">EDX</text>
  <text x="470" y="194" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">argument 3</text>
  <text x="330" y="211" text-anchor="middle" font-family="monospace" font-size="12" fill="#1565c0">ESI</text>
  <text x="470" y="211" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">argument 4</text>
  <text x="330" y="228" text-anchor="middle" font-family="monospace" font-size="12" fill="#1565c0">EDI</text>
  <text x="470" y="228" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">argument 5</text>

  <!-- int 0x80 trap arrow -->
  <line x1="310" y1="310" x2="310" y2="350" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="230" y="310" width="160" height="26" rx="4" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="310" y="327" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#f57c00">CPU trap / int 0x80</text>

  <!-- Kernel Space zone -->
  <rect x="30" y="360" width="560" height="240" rx="10" fill="url(#grad-kernel)" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="360" width="560" height="38" rx="10" fill="#e53935"/>
  <rect x="30" y="384" width="560" height="14" fill="#e53935"/>
  <text x="310" y="386" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">KERNEL SPACE</text>

  <!-- syscall dispatch box -->
  <rect x="60" y="410" width="220" height="170" rx="8" fill="#ffffff" stroke="#e53935" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="432" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#c62828">syscall_table[EAX]</text>
  <line x1="60" y1="438" x2="280" y2="438" stroke="#ffcdd2" stroke-width="1"/>
  <text x="170" y="456" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">Dispatches to handler</text>
  <text x="170" y="472" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">sys_write() / sys_read()</text>
  <text x="170" y="488" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">sys_open() / sys_exit()</text>
  <text x="170" y="508" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">Executes kernel logic</text>
  <text x="170" y="524" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">Copies data if needed</text>
  <text x="170" y="543" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">Return value → EAX</text>
  <text x="170" y="562" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">(negative = error)</text>

  <!-- return arrow -->
  <line x1="310" y1="350" x2="310" y2="310" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-ret)"/>
  <text x="355" y="336" font-family="monospace" font-size="11" fill="#2e7d32">return value</text>
  <text x="355" y="350" font-family="monospace" font-size="11" fill="#2e7d32">in EAX</text>

  <!-- Common syscalls table - right side -->
  <rect x="640" y="20" width="610" height="590" rx="10" fill="#f9f9f9" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="20" width="610" height="42" rx="10" fill="url(#grad-primary)"/>
  <rect x="640" y="48" width="610" height="14" fill="url(#grad-primary)"/>
  <text x="945" y="50" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Common Linux System Calls (x86)</text>

  <!-- Table header -->
  <rect x="655" y="75" width="580" height="32" rx="4" fill="#1e88e5"/>
  <text x="715" y="96" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">EAX</text>
  <text x="790" y="96" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">Name</text>
  <text x="940" y="96" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">EBX</text>
  <text x="1080" y="96" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">ECX</text>
  <text x="1185" y="96" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">EDX</text>

  <!-- rows data -->
  <!-- exit -->
  <rect x="655" y="107" width="580" height="34" fill="#e3f2fd"/>
  <text x="715" y="129" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#e53935">1</text>
  <text x="790" y="129" text-anchor="middle" font-family="monospace" font-size="13" fill="#1565c0">sys_exit</text>
  <text x="940" y="129" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">exit code</text>
  <text x="1080" y="129" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">—</text>
  <text x="1185" y="129" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">—</text>
  <!-- fork -->
  <rect x="655" y="141" width="580" height="34" fill="#ffffff"/>
  <text x="715" y="163" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#e53935">2</text>
  <text x="790" y="163" text-anchor="middle" font-family="monospace" font-size="13" fill="#1565c0">sys_fork</text>
  <text x="940" y="163" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">—</text>
  <text x="1080" y="163" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">—</text>
  <text x="1185" y="163" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">—</text>
  <!-- read -->
  <rect x="655" y="175" width="580" height="34" fill="#e3f2fd"/>
  <text x="715" y="197" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#e53935">3</text>
  <text x="790" y="197" text-anchor="middle" font-family="monospace" font-size="13" fill="#1565c0">sys_read</text>
  <text x="940" y="197" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">fd</text>
  <text x="1080" y="197" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">buf ptr</text>
  <text x="1185" y="197" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">count</text>
  <!-- write -->
  <rect x="655" y="209" width="580" height="34" fill="#ffffff"/>
  <text x="715" y="231" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#e53935">4</text>
  <text x="790" y="231" text-anchor="middle" font-family="monospace" font-size="13" fill="#1565c0">sys_write</text>
  <text x="940" y="231" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">fd</text>
  <text x="1080" y="231" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">buf ptr</text>
  <text x="1185" y="231" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">count</text>
  <!-- open -->
  <rect x="655" y="243" width="580" height="34" fill="#e3f2fd"/>
  <text x="715" y="265" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#e53935">5</text>
  <text x="790" y="265" text-anchor="middle" font-family="monospace" font-size="13" fill="#1565c0">sys_open</text>
  <text x="940" y="265" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">filename</text>
  <text x="1080" y="265" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">flags</text>
  <text x="1185" y="265" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">mode</text>
  <!-- close -->
  <rect x="655" y="277" width="580" height="34" fill="#ffffff"/>
  <text x="715" y="299" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#e53935">6</text>
  <text x="790" y="299" text-anchor="middle" font-family="monospace" font-size="13" fill="#1565c0">sys_close</text>
  <text x="940" y="299" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">fd</text>
  <text x="1080" y="299" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">—</text>
  <text x="1185" y="299" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">—</text>
  <!-- waitpid -->
  <rect x="655" y="311" width="580" height="34" fill="#e3f2fd"/>
  <text x="715" y="333" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#e53935">7</text>
  <text x="790" y="333" text-anchor="middle" font-family="monospace" font-size="13" fill="#1565c0">sys_waitpid</text>
  <text x="940" y="333" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">pid</text>
  <text x="1080" y="333" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">stat_addr</text>
  <text x="1185" y="333" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">options</text>
  <!-- getpid -->
  <rect x="655" y="345" width="580" height="34" fill="#ffffff"/>
  <text x="715" y="367" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#e53935">20</text>
  <text x="790" y="367" text-anchor="middle" font-family="monospace" font-size="13" fill="#1565c0">sys_getpid</text>
  <text x="940" y="367" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">—</text>
  <text x="1080" y="367" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">—</text>
  <text x="1185" y="367" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">—</text>
  <!-- brk -->
  <rect x="655" y="379" width="580" height="34" fill="#e3f2fd"/>
  <text x="715" y="401" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#e53935">45</text>
  <text x="790" y="401" text-anchor="middle" font-family="monospace" font-size="13" fill="#1565c0">sys_brk</text>
  <text x="940" y="401" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">new brk addr</text>
  <text x="1080" y="401" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">—</text>
  <text x="1185" y="401" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">—</text>

  <!-- column dividers in table -->
  <line x1="746" y1="75" x2="746" y2="413" stroke="#bbdefb" stroke-width="1"/>
  <line x1="844" y1="75" x2="844" y2="413" stroke="#bbdefb" stroke-width="1"/>
  <line x1="1030" y1="75" x2="1030" y2="413" stroke="#bbdefb" stroke-width="1"/>
  <line x1="1140" y1="75" x2="1140" y2="413" stroke="#bbdefb" stroke-width="1"/>

  <!-- Note box -->
  <rect x="655" y="425" width="580" height="85" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="945" y="447" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e65100">Flow Summary</text>
  <text x="670" y="466" font-family="monospace" font-size="11" fill="#555">1. Load syscall number into EAX</text>
  <text x="670" y="482" font-family="monospace" font-size="11" fill="#555">2. Load arguments into EBX, ECX, EDX, ESI, EDI</text>
  <text x="670" y="498" font-family="monospace" font-size="11" fill="#555">3. Execute  int $0x80  →  CPU switches to ring 0 (kernel mode)</text>

  <!-- Error note box -->
  <rect x="655" y="520" width="580" height="80" rx="8" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <text x="945" y="542" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c62828">Return Values</text>
  <text x="670" y="561" font-family="monospace" font-size="11" fill="#555">EAX ≥ 0 : success (result value)</text>
  <text x="670" y="577" font-family="monospace" font-size="11" fill="#555">EAX &lt; 0 : error (EAX = -errno, e.g. -2 = ENOENT)</text>
  <text x="670" y="593" font-family="monospace" font-size="11" fill="#555">Check with:  cmp $0, %eax  /  jl error_handler</text>
</svg>

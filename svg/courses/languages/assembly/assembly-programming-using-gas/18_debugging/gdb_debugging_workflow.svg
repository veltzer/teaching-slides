<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e; --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="647.531380753138" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.877926624248" font-weight="bold" fill="var(--text)">GDB Workflow for Assembly</text>

  <rect x="55.062761506276" y="77.247706422018" width="241.004184100418" height="58.532110091743" rx="8.270131268999" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.564853556485" y="103.853211009174" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.472729720749" font-weight="bold" fill="var(--primary-text)">1. Compile -g</text>
  <text x="175.564853556485" y="125.137614678899" text-anchor="middle" font-family="Courier New, monospace" font-size="12.405196903499" fill="var(--primary-text)">as -g prog.s</text>

  <line x1="175.564853556485" y1="138.97247706422" x2="175.564853556485" y2="160.256880733945" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55.062761506276" y="162.385321100917" width="241.004184100418" height="58.532110091743" rx="8.270131268999" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.564853556485" y="188.990825688073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.472729720749" font-weight="bold" fill="var(--primary-text)">2. Run GDB</text>
  <text x="175.564853556485" y="210.275229357798" text-anchor="middle" font-family="Courier New, monospace" font-size="12.405196903499" fill="var(--primary-text)">gdb ./program</text>

  <line x1="175.564853556485" y1="224.110091743119" x2="175.564853556485" y2="245.394495412844" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55.062761506276" y="247.522935779817" width="241.004184100418" height="58.532110091743" rx="8.270131268999" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.564853556485" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.472729720749" font-weight="bold" fill="var(--ok-text)">3. Set Break + Run</text>
  <text x="175.564853556485" y="295.412844036697" text-anchor="middle" font-family="Courier New, monospace" font-size="12.405196903499" fill="var(--ok-text)">break _start; run</text>

  <line x1="175.564853556485" y1="309.247706422018" x2="175.564853556485" y2="330.532110091743" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55.062761506276" y="332.660550458716" width="241.004184100418" height="58.532110091743" rx="8.270131268999" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.564853556485" y="359.266055045872" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.472729720749" font-weight="bold" fill="var(--warn-text)">4. Examine state</text>
  <text x="175.564853556485" y="380.550458715596" text-anchor="middle" font-family="Courier New, monospace" font-size="12.405196903499" fill="var(--warn-text)">info regs; x/10i</text>

  <line x1="175.564853556485" y1="394.385321100917" x2="175.564853556485" y2="415.669724770642" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55.062761506276" y="417.798165137615" width="241.004184100418" height="58.532110091743" rx="8.270131268999" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.564853556485" y="444.403669724771" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.472729720749" font-weight="bold" fill="var(--info-text)">5. Step / Next</text>
  <text x="175.564853556485" y="465.688073394495" text-anchor="middle" font-family="Courier New, monospace" font-size="12.405196903499" fill="var(--info-text)">stepi / nexti</text>

  <line x1="55.062761506276" y1="446.532110091743" x2="40" y2="446.532110091743" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="40" y1="446.532110091743" x2="40" y2="361.394495412844" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="40" y1="361.394495412844" x2="53.054393305439" y2="361.394495412844" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <rect x="326.192468619247" y="77.247706422018" width="913.807531380753" height="542.752293577982" rx="8.270131268999" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="783.096234309623" y="114.495412844037" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.607795355248" font-weight="bold" fill="var(--text)">Key GDB Commands</text>

  <text x="351.297071129707" y="162.385321100917" font-family="Arial, sans-serif" font-size="14.472729720749" font-weight="bold" fill="var(--primary-accent)">Control</text>
  <text x="351.297071129707" y="188.990825688073" font-family="Courier New, monospace" font-size="13.438963312124" fill="var(--text)">run</text>
  <text x="607.364016736402" y="188.990825688073" font-family="Arial, sans-serif" font-size="13.438963312124" fill="var(--text-muted)">Start program</text>
  <text x="351.297071129707" y="215.596330275229" font-family="Courier New, monospace" font-size="13.438963312124" fill="var(--text)">continue (c)</text>
  <text x="607.364016736402" y="215.596330275229" font-family="Arial, sans-serif" font-size="13.438963312124" fill="var(--text-muted)">Continue to next breakpoint</text>
  <text x="351.297071129707" y="242.201834862385" font-family="Courier New, monospace" font-size="13.438963312124" fill="var(--text)">quit (q)</text>
  <text x="607.364016736402" y="242.201834862385" font-family="Arial, sans-serif" font-size="13.438963312124" fill="var(--text-muted)">Exit GDB</text>

  <text x="351.297071129707" y="284.770642201835" font-family="Arial, sans-serif" font-size="14.472729720749" font-weight="bold" fill="var(--ok-accent)">Breakpoints</text>
  <text x="351.297071129707" y="311.376146788991" font-family="Courier New, monospace" font-size="13.438963312124" fill="var(--text)">break _start</text>
  <text x="607.364016736402" y="311.376146788991" font-family="Arial, sans-serif" font-size="13.438963312124" fill="var(--text-muted)">At label</text>
  <text x="351.297071129707" y="337.981651376147" font-family="Courier New, monospace" font-size="13.438963312124" fill="var(--text)">break *0x80480</text>
  <text x="607.364016736402" y="337.981651376147" font-family="Arial, sans-serif" font-size="13.438963312124" fill="var(--text-muted)">At address</text>

  <text x="351.297071129707" y="380.550458715596" font-family="Arial, sans-serif" font-size="14.472729720749" font-weight="bold" fill="var(--warn-accent)">Stepping</text>
  <text x="351.297071129707" y="407.155963302752" font-family="Courier New, monospace" font-size="13.438963312124" fill="var(--text)">stepi (si)</text>
  <text x="607.364016736402" y="407.155963302752" font-family="Arial, sans-serif" font-size="13.438963312124" fill="var(--text-muted)">One instruction (into calls)</text>
  <text x="351.297071129707" y="433.761467889908" font-family="Courier New, monospace" font-size="13.438963312124" fill="var(--text)">nexti (ni)</text>
  <text x="607.364016736402" y="433.761467889908" font-family="Arial, sans-serif" font-size="13.438963312124" fill="var(--text-muted)">Step over calls</text>

  <text x="351.297071129707" y="476.330275229358" font-family="Arial, sans-serif" font-size="14.472729720749" font-weight="bold" fill="var(--danger-accent)">Inspect</text>
  <text x="351.297071129707" y="502.935779816514" font-family="Courier New, monospace" font-size="13.438963312124" fill="var(--text)">info registers</text>
  <text x="607.364016736402" y="502.935779816514" font-family="Arial, sans-serif" font-size="13.438963312124" fill="var(--text-muted)">All registers</text>
  <text x="351.297071129707" y="529.54128440367" font-family="Courier New, monospace" font-size="13.438963312124" fill="var(--text)">print $eax</text>
  <text x="607.364016736402" y="529.54128440367" font-family="Arial, sans-serif" font-size="13.438963312124" fill="var(--text-muted)">One register</text>
  <text x="351.297071129707" y="556.146788990826" font-family="Courier New, monospace" font-size="13.438963312124" fill="var(--text)">x/10xw $esp</text>
  <text x="607.364016736402" y="556.146788990826" font-family="Arial, sans-serif" font-size="13.438963312124" fill="var(--text-muted)">Memory at ESP</text>
  <text x="351.297071129707" y="582.752293577982" font-family="Courier New, monospace" font-size="13.438963312124" fill="var(--text)">disassemble</text>
  <text x="607.364016736402" y="582.752293577982" font-family="Arial, sans-serif" font-size="13.438963312124" fill="var(--text-muted)">Current function</text>
</svg>

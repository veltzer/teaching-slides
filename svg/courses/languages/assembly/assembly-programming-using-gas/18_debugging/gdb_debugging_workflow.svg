<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Header -->
  <rect x="20" y="12" width="1240" height="42" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">GDB Debugging Workflow for Assembly</text>

  <!-- === FLOWCHART (left column) === -->
  <!-- Step 1: Compile with -g -->
  <rect x="30" y="70" width="200" height="56" rx="8" fill="#1e88e5" filter="url(#shadow)"/>
  <text x="130" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">1. Compile with -g</text>
  <text x="130" y="114" text-anchor="middle" font-family="monospace" font-size="11" fill="#bbdefb">as -g prog.s -o prog.o</text>
  <!-- arrow -->
  <line x1="130" y1="126" x2="130" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Run GDB -->
  <rect x="30" y="150" width="200" height="56" rx="8" fill="#1565c0" filter="url(#shadow)"/>
  <text x="130" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">2. Run GDB</text>
  <text x="130" y="194" text-anchor="middle" font-family="monospace" font-size="11" fill="#bbdefb">gdb ./program</text>
  <!-- arrow -->
  <line x1="130" y1="206" x2="130" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Set Breakpoint -->
  <rect x="30" y="230" width="200" height="56" rx="8" fill="#1e88e5" filter="url(#shadow)"/>
  <text x="130" y="254" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">3. Set Breakpoint</text>
  <text x="130" y="273" text-anchor="middle" font-family="monospace" font-size="11" fill="#bbdefb">break _start</text>
  <!-- arrow -->
  <line x1="130" y1="286" x2="130" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Run -->
  <rect x="30" y="310" width="200" height="56" rx="8" fill="#2e7d32" filter="url(#shadow)"/>
  <text x="130" y="334" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">4. Run Program</text>
  <text x="130" y="353" text-anchor="middle" font-family="monospace" font-size="11" fill="#c8e6c9">run</text>
  <!-- arrow -->
  <line x1="130" y1="366" x2="130" y2="390" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Examine (diamond decision) -->
  <polygon points="130,390 200,430 130,470 60,430" fill="#f57c00" filter="url(#shadow)"/>
  <text x="130" y="426" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Examine</text>
  <text x="130" y="443" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">state</text>
  <!-- arrow down -->
  <line x1="130" y1="470" x2="130" y2="494" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Step/Next -->
  <rect x="30" y="494" width="200" height="56" rx="8" fill="#7b1fa2" filter="url(#shadow)"/>
  <text x="130" y="518" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">5. Step / Next</text>
  <text x="130" y="537" text-anchor="middle" font-family="monospace" font-size="11" fill="#e1bee7">stepi / nexti</text>

  <!-- Feedback loop arrow: back to examine -->
  <line x1="30" y1="522" x2="15" y2="522" stroke="#f57c00" stroke-width="2"/>
  <line x1="15" y1="522" x2="15" y2="430" stroke="#f57c00" stroke-width="2"/>
  <line x1="15" y1="430" x2="60" y2="430" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="10" y="478" font-family="sans-serif" font-size="10" fill="#f57c00" font-weight="bold" transform="rotate(-90 10 478)">loop</text>

  <!-- Bug found arrow -->
  <line x1="130" y1="550" x2="130" y2="580" stroke="#e53935" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 7: Fix bug -->
  <rect x="30" y="580" width="200" height="40" rx="8" fill="#e53935" filter="url(#shadow)"/>
  <text x="130" y="598" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">6. Fix Bug &amp; Repeat</text>
  <text x="130" y="614" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffcdd2">quit -> edit -> rebuild</text>

  <!-- === COMMANDS REFERENCE (right column) === -->
  <rect x="255" y="68" width="1005" height="554" rx="10" fill="#f8f9fa" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="255" y="68" width="1005" height="40" rx="10" fill="url(#grad-accent)"/>
  <rect x="255" y="94" width="1005" height="14" fill="url(#grad-accent)"/>
  <text x="757" y="98" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Key GDB Commands for Assembly Debugging</text>

  <!-- Column headings -->
  <rect x="270" y="115" width="480" height="28" rx="4" fill="#1e88e5"/>
  <text x="510" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Command</text>

  <rect x="760" y="115" width="490" height="28" rx="4" fill="#1565c0"/>
  <text x="1005" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">What it does</text>

  <!-- == Startup / Control section == -->
  <rect x="270" y="148" width="480" height="22" rx="0" fill="#e3f2fd"/>
  <rect x="760" y="148" width="490" height="22" rx="0" fill="#e3f2fd"/>
  <text x="290" y="164" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1565c0">STARTUP &amp; CONTROL</text>

  <rect x="270" y="170" width="480" height="24" fill="#ffffff"/>
  <rect x="760" y="170" width="490" height="24" fill="#ffffff"/>
  <text x="290" y="186" font-family="monospace" font-size="12" fill="#333">run</text>
  <text x="780" y="186" font-family="monospace" font-size="12" fill="#555">Start the program from beginning</text>

  <rect x="270" y="194" width="480" height="24" fill="#f5f5f5"/>
  <rect x="760" y="194" width="490" height="24" fill="#f5f5f5"/>
  <text x="290" y="210" font-family="monospace" font-size="12" fill="#333">continue  (c)</text>
  <text x="780" y="210" font-family="monospace" font-size="12" fill="#555">Continue until next breakpoint</text>

  <rect x="270" y="218" width="480" height="24" fill="#ffffff"/>
  <rect x="760" y="218" width="490" height="24" fill="#ffffff"/>
  <text x="290" y="234" font-family="monospace" font-size="12" fill="#333">quit  (q)</text>
  <text x="780" y="234" font-family="monospace" font-size="12" fill="#555">Exit GDB</text>

  <!-- == Breakpoints section == -->
  <rect x="270" y="242" width="480" height="22" rx="0" fill="#e8f5e9"/>
  <rect x="760" y="242" width="490" height="22" rx="0" fill="#e8f5e9"/>
  <text x="290" y="258" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">BREAKPOINTS</text>

  <rect x="270" y="264" width="480" height="24" fill="#ffffff"/>
  <rect x="760" y="264" width="490" height="24" fill="#ffffff"/>
  <text x="290" y="280" font-family="monospace" font-size="12" fill="#333">break _start</text>
  <text x="780" y="280" font-family="monospace" font-size="12" fill="#555">Set breakpoint at label _start</text>

  <rect x="270" y="288" width="480" height="24" fill="#f5f5f5"/>
  <rect x="760" y="288" width="490" height="24" fill="#f5f5f5"/>
  <text x="290" y="304" font-family="monospace" font-size="12" fill="#333">break *0x08048080</text>
  <text x="780" y="304" font-family="monospace" font-size="12" fill="#555">Breakpoint at specific address</text>

  <rect x="270" y="312" width="480" height="24" fill="#ffffff"/>
  <rect x="760" y="312" width="490" height="24" fill="#ffffff"/>
  <text x="290" y="328" font-family="monospace" font-size="12" fill="#333">info breakpoints</text>
  <text x="780" y="328" font-family="monospace" font-size="12" fill="#555">List all breakpoints</text>

  <!-- == Stepping section == -->
  <rect x="270" y="336" width="480" height="22" rx="0" fill="#fff3e0"/>
  <rect x="760" y="336" width="490" height="22" rx="0" fill="#fff3e0"/>
  <text x="290" y="352" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f57c00">STEPPING (ASSEMBLY-LEVEL)</text>

  <rect x="270" y="358" width="480" height="24" fill="#ffffff"/>
  <rect x="760" y="358" width="490" height="24" fill="#ffffff"/>
  <text x="290" y="374" font-family="monospace" font-size="12" fill="#e53935" font-weight="bold">stepi  (si)</text>
  <text x="780" y="374" font-family="monospace" font-size="12" fill="#555">Step one instruction (follows calls)</text>

  <rect x="270" y="382" width="480" height="24" fill="#f5f5f5"/>
  <rect x="760" y="382" width="490" height="24" fill="#f5f5f5"/>
  <text x="290" y="398" font-family="monospace" font-size="12" fill="#e53935" font-weight="bold">nexti  (ni)</text>
  <text x="780" y="398" font-family="monospace" font-size="12" fill="#555">Step over one instruction (skips calls)</text>

  <rect x="270" y="406" width="480" height="24" fill="#ffffff"/>
  <rect x="760" y="406" width="490" height="24" fill="#ffffff"/>
  <text x="290" y="422" font-family="monospace" font-size="12" fill="#333">finish</text>
  <text x="780" y="422" font-family="monospace" font-size="12" fill="#555">Run until end of current function</text>

  <!-- == Registers section == -->
  <rect x="270" y="430" width="480" height="22" rx="0" fill="#fce4ec"/>
  <rect x="760" y="430" width="490" height="22" rx="0" fill="#fce4ec"/>
  <text x="290" y="446" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c62828">REGISTERS</text>

  <rect x="270" y="452" width="480" height="24" fill="#ffffff"/>
  <rect x="760" y="452" width="490" height="24" fill="#ffffff"/>
  <text x="290" y="468" font-family="monospace" font-size="12" fill="#e53935" font-weight="bold">info registers</text>
  <text x="780" y="468" font-family="monospace" font-size="12" fill="#555">Show all register values</text>

  <rect x="270" y="476" width="480" height="24" fill="#f5f5f5"/>
  <rect x="760" y="476" width="490" height="24" fill="#f5f5f5"/>
  <text x="290" y="492" font-family="monospace" font-size="12" fill="#333">print $eax</text>
  <text x="780" y="492" font-family="monospace" font-size="12" fill="#555">Print value of EAX register</text>

  <rect x="270" y="500" width="480" height="24" fill="#ffffff"/>
  <rect x="760" y="500" width="490" height="24" fill="#ffffff"/>
  <text x="290" y="516" font-family="monospace" font-size="12" fill="#333">set $eax = 42</text>
  <text x="780" y="516" font-family="monospace" font-size="12" fill="#555">Modify register value</text>

  <!-- == Memory section == -->
  <rect x="270" y="524" width="480" height="22" rx="0" fill="#ede7f6"/>
  <rect x="760" y="524" width="490" height="22" rx="0" fill="#ede7f6"/>
  <text x="290" y="540" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4a148c">MEMORY EXAMINATION</text>

  <rect x="270" y="546" width="480" height="24" fill="#ffffff"/>
  <rect x="760" y="546" width="490" height="24" fill="#ffffff"/>
  <text x="290" y="562" font-family="monospace" font-size="12" fill="#7b1fa2" font-weight="bold">x/10xw $esp</text>
  <text x="780" y="562" font-family="monospace" font-size="12" fill="#555">10 words from ESP in hex</text>

  <rect x="270" y="570" width="480" height="24" fill="#f5f5f5"/>
  <rect x="760" y="570" width="490" height="24" fill="#f5f5f5"/>
  <text x="290" y="586" font-family="monospace" font-size="12" fill="#7b1fa2" font-weight="bold">x/10i $eip</text>
  <text x="780" y="586" font-family="monospace" font-size="12" fill="#555">Show next 10 instructions at EIP</text>

  <rect x="270" y="594" width="480" height="24" fill="#ffffff"/>
  <rect x="760" y="594" width="490" height="24" fill="#ffffff"/>
  <text x="290" y="610" font-family="monospace" font-size="12" fill="#7b1fa2" font-weight="bold">disassemble</text>
  <text x="780" y="610" font-family="monospace" font-size="12" fill="#555">Disassemble current function</text>

  <!-- divider between command and desc columns -->
  <line x1="750" y1="115" x2="750" y2="618" stroke="#cccccc" stroke-width="1"/>
</svg>

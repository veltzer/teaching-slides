<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="55.062761506276" y="40" width="241.004184100418" height="62.549019607843" rx="8.549201752386" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.564853556485" y="68.43137254902" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.961103066676" font-weight="bold" fill="var(--primary-text)">1. Compile -g</text>
  <text x="175.564853556485" y="91.176470588236" text-anchor="middle" font-family="Courier New, monospace" font-size="12.823802628579" fill="var(--primary-text)">as -g prog.s</text>

  <line x1="175.564853556485" y1="105.960784313726" x2="175.564853556485" y2="128.705882352942" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55.062761506276" y="130.980392156863" width="241.004184100418" height="62.549019607843" rx="8.549201752386" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.564853556485" y="159.411764705882" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.961103066676" font-weight="bold" fill="var(--primary-text)">2. Run GDB</text>
  <text x="175.564853556485" y="182.156862745098" text-anchor="middle" font-family="Courier New, monospace" font-size="12.823802628579" fill="var(--primary-text)">gdb ./program</text>

  <line x1="175.564853556485" y1="196.941176470588" x2="175.564853556485" y2="219.686274509804" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55.062761506276" y="221.960784313726" width="241.004184100418" height="62.549019607843" rx="8.549201752386" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.564853556485" y="250.392156862745" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.961103066676" font-weight="bold" fill="var(--ok-text)">3. Set Break + Run</text>
  <text x="175.564853556485" y="273.137254901961" text-anchor="middle" font-family="Courier New, monospace" font-size="12.823802628579" fill="var(--ok-text)">break _start; run</text>

  <line x1="175.564853556485" y1="287.921568627451" x2="175.564853556485" y2="310.666666666667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55.062761506276" y="312.941176470589" width="241.004184100418" height="62.549019607843" rx="8.549201752386" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.564853556485" y="341.372549019609" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.961103066676" font-weight="bold" fill="var(--warn-text)">4. Examine state</text>
  <text x="175.564853556485" y="364.117647058823" text-anchor="middle" font-family="Courier New, monospace" font-size="12.823802628579" fill="var(--warn-text)">info regs; x/10i</text>

  <line x1="175.564853556485" y1="378.901960784313" x2="175.564853556485" y2="401.647058823529" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55.062761506276" y="403.921568627452" width="241.004184100418" height="62.549019607843" rx="8.549201752386" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.564853556485" y="432.352941176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.961103066676" font-weight="bold" fill="var(--info-text)">5. Step / Next</text>
  <text x="175.564853556485" y="455.098039215686" text-anchor="middle" font-family="Courier New, monospace" font-size="12.823802628579" fill="var(--info-text)">stepi / nexti</text>

  <line x1="55.062761506276" y1="434.627450980392" x2="40" y2="434.627450980392" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="40" y1="434.627450980392" x2="40" y2="343.64705882353" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="40" y1="343.64705882353" x2="53.054393305439" y2="343.64705882353" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <rect x="326.192468619247" y="40" width="913.807531380753" height="580" rx="8.549201752386" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="783.096234309623" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.235703942868" font-weight="bold" fill="var(--text)">Key GDB Commands</text>

  <text x="351.297071129707" y="130.980392156863" font-family="Arial, sans-serif" font-size="14.961103066676" font-weight="bold" fill="var(--primary-accent)">Control</text>
  <text x="351.297071129707" y="159.411764705882" font-family="Courier New, monospace" font-size="13.892452847628" fill="var(--text)">run</text>
  <text x="607.364016736402" y="159.411764705882" font-family="Arial, sans-serif" font-size="13.892452847628" fill="var(--text-muted)">Start program</text>
  <text x="351.297071129707" y="187.843137254902" font-family="Courier New, monospace" font-size="13.892452847628" fill="var(--text)">continue (c)</text>
  <text x="607.364016736402" y="187.843137254902" font-family="Arial, sans-serif" font-size="13.892452847628" fill="var(--text-muted)">Continue to next breakpoint</text>
  <text x="351.297071129707" y="216.274509803921" font-family="Courier New, monospace" font-size="13.892452847628" fill="var(--text)">quit (q)</text>
  <text x="607.364016736402" y="216.274509803921" font-family="Arial, sans-serif" font-size="13.892452847628" fill="var(--text-muted)">Exit GDB</text>

  <text x="351.297071129707" y="261.764705882353" font-family="Arial, sans-serif" font-size="14.961103066676" font-weight="bold" fill="var(--ok-accent)">Breakpoints</text>
  <text x="351.297071129707" y="290.196078431373" font-family="Courier New, monospace" font-size="13.892452847628" fill="var(--text)">break _start</text>
  <text x="607.364016736402" y="290.196078431373" font-family="Arial, sans-serif" font-size="13.892452847628" fill="var(--text-muted)">At label</text>
  <text x="351.297071129707" y="318.627450980393" font-family="Courier New, monospace" font-size="13.892452847628" fill="var(--text)">break *0x80480</text>
  <text x="607.364016736402" y="318.627450980393" font-family="Arial, sans-serif" font-size="13.892452847628" fill="var(--text-muted)">At address</text>

  <text x="351.297071129707" y="364.117647058823" font-family="Arial, sans-serif" font-size="14.961103066676" font-weight="bold" fill="var(--warn-accent)">Stepping</text>
  <text x="351.297071129707" y="392.549019607843" font-family="Courier New, monospace" font-size="13.892452847628" fill="var(--text)">stepi (si)</text>
  <text x="607.364016736402" y="392.549019607843" font-family="Arial, sans-serif" font-size="13.892452847628" fill="var(--text-muted)">One instruction (into calls)</text>
  <text x="351.297071129707" y="420.980392156863" font-family="Courier New, monospace" font-size="13.892452847628" fill="var(--text)">nexti (ni)</text>
  <text x="607.364016736402" y="420.980392156863" font-family="Arial, sans-serif" font-size="13.892452847628" fill="var(--text-muted)">Step over calls</text>

  <text x="351.297071129707" y="466.470588235294" font-family="Arial, sans-serif" font-size="14.961103066676" font-weight="bold" fill="var(--danger-accent)">Inspect</text>
  <text x="351.297071129707" y="494.901960784314" font-family="Courier New, monospace" font-size="13.892452847628" fill="var(--text)">info registers</text>
  <text x="607.364016736402" y="494.901960784314" font-family="Arial, sans-serif" font-size="13.892452847628" fill="var(--text-muted)">All registers</text>
  <text x="351.297071129707" y="523.333333333334" font-family="Courier New, monospace" font-size="13.892452847628" fill="var(--text)">print $eax</text>
  <text x="607.364016736402" y="523.333333333334" font-family="Arial, sans-serif" font-size="13.892452847628" fill="var(--text-muted)">One register</text>
  <text x="351.297071129707" y="551.764705882353" font-family="Courier New, monospace" font-size="13.892452847628" fill="var(--text)">x/10xw $esp</text>
  <text x="607.364016736402" y="551.764705882353" font-family="Arial, sans-serif" font-size="13.892452847628" fill="var(--text-muted)">Memory at ESP</text>
  <text x="351.297071129707" y="580.196078431373" font-family="Courier New, monospace" font-size="13.892452847628" fill="var(--text)">disassemble</text>
  <text x="607.364016736402" y="580.196078431373" font-family="Arial, sans-serif" font-size="13.892452847628" fill="var(--text-muted)">Current function</text>
</svg>

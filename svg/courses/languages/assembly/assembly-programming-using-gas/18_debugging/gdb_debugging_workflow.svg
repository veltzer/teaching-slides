<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Header -->
  <rect x="58.75" y="50.875" width="1162.5" height="38.0625" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="76.25" text-anchor="middle" font-family="sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)">GDB Debugging Workflow for Assembly</text>

  <!-- === FLOWCHART (left column) === -->
  <!-- Step 1: Compile with -g -->
  <rect x="68.125" y="103.4375" width="187.5" height="50.75" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="161.875" y="126.0938" text-anchor="middle" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">1. Compile with -g</text>
  <text x="161.875" y="143.3125" text-anchor="middle" font-family="monospace" font-size="10.1392" fill="var(--primary-accent)">as -g prog.s -o prog.o</text>
  <!-- arrow -->
  <line x1="161.875" y1="154.1875" x2="161.875" y2="175.9375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Run GDB -->
  <rect x="68.125" y="175.9375" width="187.5" height="50.75" rx="6" fill="var(--primary-accent)" filter="url(#shadow)"/>
  <text x="161.875" y="198.5938" text-anchor="middle" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">2. Run GDB</text>
  <text x="161.875" y="215.8125" text-anchor="middle" font-family="monospace" font-size="10.1392" fill="var(--primary-accent)">gdb ./program</text>
  <!-- arrow -->
  <line x1="161.875" y1="226.6875" x2="161.875" y2="248.4375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Set Breakpoint -->
  <rect x="68.125" y="248.4375" width="187.5" height="50.75" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="161.875" y="270.1875" text-anchor="middle" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">3. Set Breakpoint</text>
  <text x="161.875" y="287.4062" text-anchor="middle" font-family="monospace" font-size="10.1392" fill="var(--primary-accent)">break _start</text>
  <!-- arrow -->
  <line x1="161.875" y1="299.1875" x2="161.875" y2="320.9375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Run -->
  <rect x="68.125" y="320.9375" width="187.5" height="50.75" rx="6" fill="var(--ok-accent)" filter="url(#shadow)"/>
  <text x="161.875" y="342.6875" text-anchor="middle" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">4. Run Program</text>
  <text x="161.875" y="359.9062" text-anchor="middle" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)">run</text>
  <!-- arrow -->
  <line x1="161.875" y1="371.6875" x2="161.875" y2="393.4375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Examine (diamond decision) -->
  <polygon points="161.875,393.4375 227.5,429.6875 161.875,465.9375 96.25,429.6875" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="161.875" y="426.0625" text-anchor="middle" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--bg)">Examine</text>
  <text x="161.875" y="441.4688" text-anchor="middle" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--bg)">state</text>
  <!-- arrow down -->
  <line x1="161.875" y1="465.9375" x2="161.875" y2="487.6875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Step/Next -->
  <rect x="68.125" y="487.6875" width="187.5" height="50.75" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="161.875" y="509.4375" text-anchor="middle" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">5. Step / Next</text>
  <text x="161.875" y="526.6562" text-anchor="middle" font-family="monospace" font-size="10.1392" fill="var(--info-accent)">stepi / nexti</text>

  <!-- Feedback loop arrow: back to examine -->
  <line x1="68.125" y1="513.0625" x2="54.0625" y2="513.0625" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="54.0625" y1="513.0625" x2="54.0625" y2="429.6875" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="54.0625" y1="429.6875" x2="96.25" y2="429.6875" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="49.375" y="473.1875" font-family="sans-serif" font-size="10" fill="var(--warn-accent)" font-weight="bold" transform="rotate(-90 10 478)">loop</text>

  <!-- Bug found arrow -->
  <line x1="161.875" y1="538.4375" x2="161.875" y2="565.625" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 7: Fix bug -->
  <rect x="68.125" y="565.625" width="187.5" height="36.25" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="161.875" y="581.9375" text-anchor="middle" font-family="sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)">6. Fix Bug &amp; Repeat</text>
  <text x="161.875" y="596.4375" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--danger-accent)">quit -> edit -> rebuild</text>

  <!-- === COMMANDS REFERENCE (right column) === -->
  <rect x="279.0625" y="101.625" width="942.1875" height="502.0625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="279.0625" y="101.625" width="942.1875" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="279.0625" y="125.1875" width="942.1875" height="12.6875" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="749.6875" y="128.8125" text-anchor="middle" font-family="sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)">Key GDB Commands for Assembly Debugging</text>

  <!-- Column headings -->
  <rect x="293.125" y="144.2188" width="450" height="25.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="518.125" y="160.5312" text-anchor="middle" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">Command</text>

  <rect x="752.5" y="144.2188" width="459.375" height="25.375" rx="6" fill="var(--primary-accent)"/>
  <text x="982.1875" y="160.5312" text-anchor="middle" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)">What it does</text>

  <!-- == Startup / Control section == -->
  <rect x="293.125" y="174.125" width="450" height="19.9375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="752.5" y="174.125" width="459.375" height="19.9375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="311.875" y="188.625" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--primary-accent)">STARTUP &amp; CONTROL</text>

  <rect x="293.125" y="194.0625" width="450" height="21.75" fill="var(--bg)" rx="6"/>
  <rect x="752.5" y="194.0625" width="459.375" height="21.75" fill="var(--bg)" rx="6"/>
  <text x="311.875" y="208.5625" font-family="monospace" font-size="11.0609" fill="var(--text)">run</text>
  <text x="771.25" y="208.5625" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Start the program from beginning</text>

  <rect x="293.125" y="215.8125" width="450" height="21.75" fill="var(--surface)" rx="6"/>
  <rect x="752.5" y="215.8125" width="459.375" height="21.75" fill="var(--surface)" rx="6"/>
  <text x="311.875" y="230.3125" font-family="monospace" font-size="11.0609" fill="var(--text)">continue  (c)</text>
  <text x="771.25" y="230.3125" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Continue until next breakpoint</text>

  <rect x="293.125" y="237.5625" width="450" height="21.75" fill="var(--bg)" rx="6"/>
  <rect x="752.5" y="237.5625" width="459.375" height="21.75" fill="var(--bg)" rx="6"/>
  <text x="311.875" y="252.0625" font-family="monospace" font-size="11.0609" fill="var(--text)">quit  (q)</text>
  <text x="771.25" y="252.0625" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Exit GDB</text>

  <!-- == Breakpoints section == -->
  <rect x="293.125" y="259.3125" width="450" height="19.9375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="752.5" y="259.3125" width="459.375" height="19.9375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="311.875" y="273.8125" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--ok-accent)">BREAKPOINTS</text>

  <rect x="293.125" y="279.25" width="450" height="21.75" fill="var(--bg)" rx="6"/>
  <rect x="752.5" y="279.25" width="459.375" height="21.75" fill="var(--bg)" rx="6"/>
  <text x="311.875" y="293.75" font-family="monospace" font-size="11.0609" fill="var(--text)">break _start</text>
  <text x="771.25" y="293.75" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Set breakpoint at label _start</text>

  <rect x="293.125" y="301" width="450" height="21.75" fill="var(--surface)" rx="6"/>
  <rect x="752.5" y="301" width="459.375" height="21.75" fill="var(--surface)" rx="6"/>
  <text x="311.875" y="315.5" font-family="monospace" font-size="11.0609" fill="var(--text)">break *0x08048080</text>
  <text x="771.25" y="315.5" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Breakpoint at specific address</text>

  <rect x="293.125" y="322.75" width="450" height="21.75" fill="var(--bg)" rx="6"/>
  <rect x="752.5" y="322.75" width="459.375" height="21.75" fill="var(--bg)" rx="6"/>
  <text x="311.875" y="337.25" font-family="monospace" font-size="11.0609" fill="var(--text)">info breakpoints</text>
  <text x="771.25" y="337.25" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">List all breakpoints</text>

  <!-- == Stepping section == -->
  <rect x="293.125" y="344.5" width="450" height="19.9375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="752.5" y="344.5" width="459.375" height="19.9375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="311.875" y="359" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--warn-accent)">STEPPING (ASSEMBLY-LEVEL)</text>

  <rect x="293.125" y="364.4375" width="450" height="21.75" fill="var(--bg)" rx="6"/>
  <rect x="752.5" y="364.4375" width="459.375" height="21.75" fill="var(--bg)" rx="6"/>
  <text x="311.875" y="378.9375" font-family="monospace" font-size="11.0609" fill="var(--danger-accent)" font-weight="bold">stepi  (si)</text>
  <text x="771.25" y="378.9375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Step one instruction (follows calls)</text>

  <rect x="293.125" y="386.1875" width="450" height="21.75" fill="var(--surface)" rx="6"/>
  <rect x="752.5" y="386.1875" width="459.375" height="21.75" fill="var(--surface)" rx="6"/>
  <text x="311.875" y="400.6875" font-family="monospace" font-size="11.0609" fill="var(--danger-accent)" font-weight="bold">nexti  (ni)</text>
  <text x="771.25" y="400.6875" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Step over one instruction (skips calls)</text>

  <rect x="293.125" y="407.9375" width="450" height="21.75" fill="var(--bg)" rx="6"/>
  <rect x="752.5" y="407.9375" width="459.375" height="21.75" fill="var(--bg)" rx="6"/>
  <text x="311.875" y="422.4375" font-family="monospace" font-size="11.0609" fill="var(--text)">finish</text>
  <text x="771.25" y="422.4375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Run until end of current function</text>

  <!-- == Registers section == -->
  <rect x="293.125" y="429.6875" width="450" height="19.9375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="752.5" y="429.6875" width="459.375" height="19.9375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="311.875" y="444.1875" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--danger-accent)">REGISTERS</text>

  <rect x="293.125" y="449.625" width="450" height="21.75" fill="var(--bg)" rx="6"/>
  <rect x="752.5" y="449.625" width="459.375" height="21.75" fill="var(--bg)" rx="6"/>
  <text x="311.875" y="464.125" font-family="monospace" font-size="11.0609" fill="var(--danger-accent)" font-weight="bold">info registers</text>
  <text x="771.25" y="464.125" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Show all register values</text>

  <rect x="293.125" y="471.375" width="450" height="21.75" fill="var(--surface)" rx="6"/>
  <rect x="752.5" y="471.375" width="459.375" height="21.75" fill="var(--surface)" rx="6"/>
  <text x="311.875" y="485.875" font-family="monospace" font-size="11.0609" fill="var(--text)">print $eax</text>
  <text x="771.25" y="485.875" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Print value of EAX register</text>

  <rect x="293.125" y="493.125" width="450" height="21.75" fill="var(--bg)" rx="6"/>
  <rect x="752.5" y="493.125" width="459.375" height="21.75" fill="var(--bg)" rx="6"/>
  <text x="311.875" y="507.625" font-family="monospace" font-size="11.0609" fill="var(--text)">set $eax = 42</text>
  <text x="771.25" y="507.625" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Modify register value</text>

  <!-- == Memory section == -->
  <rect x="293.125" y="514.875" width="450" height="19.9375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="752.5" y="514.875" width="459.375" height="19.9375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="311.875" y="529.375" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--info-accent)">MEMORY EXAMINATION</text>

  <rect x="293.125" y="534.8125" width="450" height="21.75" fill="var(--bg)" rx="6"/>
  <rect x="752.5" y="534.8125" width="459.375" height="21.75" fill="var(--bg)" rx="6"/>
  <text x="311.875" y="549.3125" font-family="monospace" font-size="11.0609" fill="var(--info-accent)" font-weight="bold">x/10xw $esp</text>
  <text x="771.25" y="549.3125" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">10 words from ESP in hex</text>

  <rect x="293.125" y="556.5625" width="450" height="21.75" fill="var(--surface)" rx="6"/>
  <rect x="752.5" y="556.5625" width="459.375" height="21.75" fill="var(--surface)" rx="6"/>
  <text x="311.875" y="571.0625" font-family="monospace" font-size="11.0609" fill="var(--info-accent)" font-weight="bold">x/10i $eip</text>
  <text x="771.25" y="571.0625" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Show next 10 instructions at EIP</text>

  <rect x="293.125" y="578.3125" width="450" height="21.75" fill="var(--bg)" rx="6"/>
  <rect x="752.5" y="578.3125" width="459.375" height="21.75" fill="var(--bg)" rx="6"/>
  <text x="311.875" y="592.8125" font-family="monospace" font-size="11.0609" fill="var(--info-accent)" font-weight="bold">disassemble</text>
  <text x="771.25" y="592.8125" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">Disassemble current function</text>

  <!-- divider between command and desc columns -->
  <line x1="743.125" y1="144.2188" x2="743.125" y2="600.0625" stroke="var(--border)" stroke-width="1"/>
</svg>

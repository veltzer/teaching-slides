<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Header -->
  <rect x="20" y="12" width="1240" height="42" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="var(--bg)">GDB Debugging Workflow for Assembly</text>

  <!-- === FLOWCHART (left column) === -->
  <!-- Step 1: Compile with -g -->
  <rect x="30" y="70" width="200" height="56" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">1. Compile with -g</text>
  <text x="130" y="114" text-anchor="middle" font-family="monospace" font-size="11" fill="var(--primary-accent)">as -g prog.s -o prog.o</text>
  <!-- arrow -->
  <line x1="130" y1="126" x2="130" y2="150" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Run GDB -->
  <rect x="30" y="150" width="200" height="56" rx="6" fill="var(--primary-accent)" filter="url(#shadow)"/>
  <text x="130" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">2. Run GDB</text>
  <text x="130" y="194" text-anchor="middle" font-family="monospace" font-size="11" fill="var(--primary-accent)">gdb ./program</text>
  <!-- arrow -->
  <line x1="130" y1="206" x2="130" y2="230" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Set Breakpoint -->
  <rect x="30" y="230" width="200" height="56" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="130" y="254" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">3. Set Breakpoint</text>
  <text x="130" y="273" text-anchor="middle" font-family="monospace" font-size="11" fill="var(--primary-accent)">break _start</text>
  <!-- arrow -->
  <line x1="130" y1="286" x2="130" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Run -->
  <rect x="30" y="310" width="200" height="56" rx="6" fill="var(--ok-accent)" filter="url(#shadow)"/>
  <text x="130" y="334" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">4. Run Program</text>
  <text x="130" y="353" text-anchor="middle" font-family="monospace" font-size="11" fill="var(--ok-accent)">run</text>
  <!-- arrow -->
  <line x1="130" y1="366" x2="130" y2="390" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Examine (diamond decision) -->
  <polygon points="130,390 200,430 130,470 60,430" fill="var(--warn-fill)" filter="url(#shadow)"/>
  <text x="130" y="426" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--bg)">Examine</text>
  <text x="130" y="443" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--bg)">state</text>
  <!-- arrow down -->
  <line x1="130" y1="470" x2="130" y2="494" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Step/Next -->
  <rect x="30" y="494" width="200" height="56" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="130" y="518" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">5. Step / Next</text>
  <text x="130" y="537" text-anchor="middle" font-family="monospace" font-size="11" fill="var(--info-accent)">stepi / nexti</text>

  <!-- Feedback loop arrow: back to examine -->
  <line x1="30" y1="522" x2="15" y2="522" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="15" y1="522" x2="15" y2="430" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="15" y1="430" x2="60" y2="430" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="10" y="478" font-family="sans-serif" font-size="10" fill="var(--warn-accent)" font-weight="bold" transform="rotate(-90 10 478)">loop</text>

  <!-- Bug found arrow -->
  <line x1="130" y1="550" x2="130" y2="580" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 7: Fix bug -->
  <rect x="30" y="580" width="200" height="40" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="130" y="598" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--bg)">6. Fix Bug &amp; Repeat</text>
  <text x="130" y="614" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--danger-accent)">quit -> edit -> rebuild</text>

  <!-- === COMMANDS REFERENCE (right column) === -->
  <rect x="255" y="68" width="1005" height="554" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="255" y="68" width="1005" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="255" y="94" width="1005" height="14" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="757" y="98" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">Key GDB Commands for Assembly Debugging</text>

  <!-- Column headings -->
  <rect x="270" y="115" width="480" height="28" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="510" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">Command</text>

  <rect x="760" y="115" width="490" height="28" rx="6" fill="var(--primary-accent)"/>
  <text x="1005" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)">What it does</text>

  <!-- == Startup / Control section == -->
  <rect x="270" y="148" width="480" height="22" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="760" y="148" width="490" height="22" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="290" y="164" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--primary-accent)">STARTUP &amp; CONTROL</text>

  <rect x="270" y="170" width="480" height="24" fill="var(--bg)" rx="6"/>
  <rect x="760" y="170" width="490" height="24" fill="var(--bg)" rx="6"/>
  <text x="290" y="186" font-family="monospace" font-size="12" fill="var(--text)">run</text>
  <text x="780" y="186" font-family="monospace" font-size="12" fill="var(--text-muted)">Start the program from beginning</text>

  <rect x="270" y="194" width="480" height="24" fill="var(--surface)" rx="6"/>
  <rect x="760" y="194" width="490" height="24" fill="var(--surface)" rx="6"/>
  <text x="290" y="210" font-family="monospace" font-size="12" fill="var(--text)">continue  (c)</text>
  <text x="780" y="210" font-family="monospace" font-size="12" fill="var(--text-muted)">Continue until next breakpoint</text>

  <rect x="270" y="218" width="480" height="24" fill="var(--bg)" rx="6"/>
  <rect x="760" y="218" width="490" height="24" fill="var(--bg)" rx="6"/>
  <text x="290" y="234" font-family="monospace" font-size="12" fill="var(--text)">quit  (q)</text>
  <text x="780" y="234" font-family="monospace" font-size="12" fill="var(--text-muted)">Exit GDB</text>

  <!-- == Breakpoints section == -->
  <rect x="270" y="242" width="480" height="22" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="760" y="242" width="490" height="22" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="290" y="258" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--ok-accent)">BREAKPOINTS</text>

  <rect x="270" y="264" width="480" height="24" fill="var(--bg)" rx="6"/>
  <rect x="760" y="264" width="490" height="24" fill="var(--bg)" rx="6"/>
  <text x="290" y="280" font-family="monospace" font-size="12" fill="var(--text)">break _start</text>
  <text x="780" y="280" font-family="monospace" font-size="12" fill="var(--text-muted)">Set breakpoint at label _start</text>

  <rect x="270" y="288" width="480" height="24" fill="var(--surface)" rx="6"/>
  <rect x="760" y="288" width="490" height="24" fill="var(--surface)" rx="6"/>
  <text x="290" y="304" font-family="monospace" font-size="12" fill="var(--text)">break *0x08048080</text>
  <text x="780" y="304" font-family="monospace" font-size="12" fill="var(--text-muted)">Breakpoint at specific address</text>

  <rect x="270" y="312" width="480" height="24" fill="var(--bg)" rx="6"/>
  <rect x="760" y="312" width="490" height="24" fill="var(--bg)" rx="6"/>
  <text x="290" y="328" font-family="monospace" font-size="12" fill="var(--text)">info breakpoints</text>
  <text x="780" y="328" font-family="monospace" font-size="12" fill="var(--text-muted)">List all breakpoints</text>

  <!-- == Stepping section == -->
  <rect x="270" y="336" width="480" height="22" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="760" y="336" width="490" height="22" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="290" y="352" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--warn-accent)">STEPPING (ASSEMBLY-LEVEL)</text>

  <rect x="270" y="358" width="480" height="24" fill="var(--bg)" rx="6"/>
  <rect x="760" y="358" width="490" height="24" fill="var(--bg)" rx="6"/>
  <text x="290" y="374" font-family="monospace" font-size="12" fill="var(--danger-accent)" font-weight="bold">stepi  (si)</text>
  <text x="780" y="374" font-family="monospace" font-size="12" fill="var(--text-muted)">Step one instruction (follows calls)</text>

  <rect x="270" y="382" width="480" height="24" fill="var(--surface)" rx="6"/>
  <rect x="760" y="382" width="490" height="24" fill="var(--surface)" rx="6"/>
  <text x="290" y="398" font-family="monospace" font-size="12" fill="var(--danger-accent)" font-weight="bold">nexti  (ni)</text>
  <text x="780" y="398" font-family="monospace" font-size="12" fill="var(--text-muted)">Step over one instruction (skips calls)</text>

  <rect x="270" y="406" width="480" height="24" fill="var(--bg)" rx="6"/>
  <rect x="760" y="406" width="490" height="24" fill="var(--bg)" rx="6"/>
  <text x="290" y="422" font-family="monospace" font-size="12" fill="var(--text)">finish</text>
  <text x="780" y="422" font-family="monospace" font-size="12" fill="var(--text-muted)">Run until end of current function</text>

  <!-- == Registers section == -->
  <rect x="270" y="430" width="480" height="22" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="760" y="430" width="490" height="22" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="290" y="446" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--danger-accent)">REGISTERS</text>

  <rect x="270" y="452" width="480" height="24" fill="var(--bg)" rx="6"/>
  <rect x="760" y="452" width="490" height="24" fill="var(--bg)" rx="6"/>
  <text x="290" y="468" font-family="monospace" font-size="12" fill="var(--danger-accent)" font-weight="bold">info registers</text>
  <text x="780" y="468" font-family="monospace" font-size="12" fill="var(--text-muted)">Show all register values</text>

  <rect x="270" y="476" width="480" height="24" fill="var(--surface)" rx="6"/>
  <rect x="760" y="476" width="490" height="24" fill="var(--surface)" rx="6"/>
  <text x="290" y="492" font-family="monospace" font-size="12" fill="var(--text)">print $eax</text>
  <text x="780" y="492" font-family="monospace" font-size="12" fill="var(--text-muted)">Print value of EAX register</text>

  <rect x="270" y="500" width="480" height="24" fill="var(--bg)" rx="6"/>
  <rect x="760" y="500" width="490" height="24" fill="var(--bg)" rx="6"/>
  <text x="290" y="516" font-family="monospace" font-size="12" fill="var(--text)">set $eax = 42</text>
  <text x="780" y="516" font-family="monospace" font-size="12" fill="var(--text-muted)">Modify register value</text>

  <!-- == Memory section == -->
  <rect x="270" y="524" width="480" height="22" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="760" y="524" width="490" height="22" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="290" y="540" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--info-accent)">MEMORY EXAMINATION</text>

  <rect x="270" y="546" width="480" height="24" fill="var(--bg)" rx="6"/>
  <rect x="760" y="546" width="490" height="24" fill="var(--bg)" rx="6"/>
  <text x="290" y="562" font-family="monospace" font-size="12" fill="var(--info-accent)" font-weight="bold">x/10xw $esp</text>
  <text x="780" y="562" font-family="monospace" font-size="12" fill="var(--text-muted)">10 words from ESP in hex</text>

  <rect x="270" y="570" width="480" height="24" fill="var(--surface)" rx="6"/>
  <rect x="760" y="570" width="490" height="24" fill="var(--surface)" rx="6"/>
  <text x="290" y="586" font-family="monospace" font-size="12" fill="var(--info-accent)" font-weight="bold">x/10i $eip</text>
  <text x="780" y="586" font-family="monospace" font-size="12" fill="var(--text-muted)">Show next 10 instructions at EIP</text>

  <rect x="270" y="594" width="480" height="24" fill="var(--bg)" rx="6"/>
  <rect x="760" y="594" width="490" height="24" fill="var(--bg)" rx="6"/>
  <text x="290" y="610" font-family="monospace" font-size="12" fill="var(--info-accent)" font-weight="bold">disassemble</text>
  <text x="780" y="610" font-family="monospace" font-size="12" fill="var(--text-muted)">Disassemble current function</text>

  <!-- divider between command and desc columns -->
  <line x1="750" y1="115" x2="750" y2="618" stroke="var(--border)" stroke-width="1"/>
</svg>

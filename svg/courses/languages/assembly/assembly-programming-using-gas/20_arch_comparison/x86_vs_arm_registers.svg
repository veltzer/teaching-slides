<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- x86 column -->
  <rect x="40" y="40" width="589.655172413793" height="580" rx="10.954451150103" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334.827586206897" y="86.4" text-anchor="middle" font-size="28.481572990269" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">x86 (CISC)</text>

  <text x="71.034482758621" y="144.4" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">eax</text>
  <text x="246.896551724138" y="144.4" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">return, syscall#</text>
  <text x="71.034482758621" y="179.2" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">ebx/ecx/edx</text>
  <text x="246.896551724138" y="179.2" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">syscall args</text>
  <text x="71.034482758621" y="214" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">esi/edi</text>
  <text x="246.896551724138" y="214" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">source/dest index</text>
  <text x="71.034482758621" y="248.8" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">esp</text>
  <text x="246.896551724138" y="248.8" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">stack pointer</text>
  <text x="71.034482758621" y="283.6" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">ebp</text>
  <text x="246.896551724138" y="283.6" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">frame pointer</text>
  <text x="71.034482758621" y="318.4" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">eip</text>
  <text x="246.896551724138" y="318.4" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">instruction pointer</text>
  <text x="71.034482758621" y="353.2" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">eflags</text>
  <text x="246.896551724138" y="353.2" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">ZF, CF, SF, OF</text>

  <text x="334.827586206897" y="434.4" text-anchor="middle" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">8 GP registers</text>
  <text x="334.827586206897" y="469.2" text-anchor="middle" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">variable length 1-17B</text>
  <text x="334.827586206897" y="504" text-anchor="middle" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">memory-to-memory ops</text>
  <text x="334.827586206897" y="538.8" text-anchor="middle" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">many addressing modes</text>
  <text x="334.827586206897" y="573.6" text-anchor="middle" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">return via stack</text>

  <!-- ARM column -->
  <rect x="650.344827586207" y="40" width="589.655172413793" height="580" rx="10.954451150103" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.172413793103" y="86.4" text-anchor="middle" font-size="28.481572990269" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">ARM (RISC)</text>

  <text x="681.379310344828" y="144.4" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">r0-r3</text>
  <text x="857.241379310345" y="144.4" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">args / return</text>
  <text x="681.379310344828" y="179.2" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">r4-r10</text>
  <text x="857.241379310345" y="179.2" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">callee-saved</text>
  <text x="681.379310344828" y="214" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">r11 (fp)</text>
  <text x="857.241379310345" y="214" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">frame pointer</text>
  <text x="681.379310344828" y="248.8" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">r12 (ip)</text>
  <text x="857.241379310345" y="248.8" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">scratch</text>
  <text x="681.379310344828" y="283.6" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">r13 (sp)</text>
  <text x="857.241379310345" y="283.6" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">stack pointer</text>
  <text x="681.379310344828" y="318.4" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">r14 (lr)</text>
  <text x="857.241379310345" y="318.4" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">link register</text>
  <text x="681.379310344828" y="353.2" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">r15 (pc)</text>
  <text x="857.241379310345" y="353.2" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">program counter</text>

  <text x="945.172413793103" y="434.4" text-anchor="middle" font-size="18.622566955176" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">16 GP registers</text>
  <text x="945.172413793103" y="469.2" text-anchor="middle" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">fixed 4B instructions</text>
  <text x="945.172413793103" y="504" text-anchor="middle" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">load-store only</text>
  <text x="945.172413793103" y="538.8" text-anchor="middle" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">CPSR flags: N Z C V</text>
  <text x="945.172413793103" y="573.6" text-anchor="middle" font-size="16.431676725155" fill="var(--bg)" font-family="Arial, sans-serif">return via lr</text>
</svg>

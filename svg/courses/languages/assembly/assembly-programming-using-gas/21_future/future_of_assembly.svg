<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>

  <!-- Title -->
  <rect x="177.9133" y="156.3002" width="1036.5966" height="32.6445" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="696.2116" y="177.0739" font-family="Arial, sans-serif" font-size="15.8795" font-weight="bold" fill="var(--bg)" text-anchor="middle">The Future of Assembly Programming</text>

  <!-- RISC-V -->
  <rect x="177.9133" y="200.8154" width="492.8083" height="163.2224" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="177.9133" y="200.8154" width="492.8083" height="29.6768" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="424.3174" y="220.1052" font-family="Arial, sans-serif" font-size="12.7035" font-weight="bold" fill="var(--bg)" text-anchor="middle">RISC-V: Open-Source ISA</text>
  <text x="194.9067" y="243.1048" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Free, open standard instruction set architecture</text>
  <text x="194.9067" y="258.6851" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Modular: base ISA + optional extensions (M, F, A, V...)</text>
  <text x="194.9067" y="274.2655" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Used in embedded, HPC, and academic research</text>
  <text x="194.9067" y="289.8458" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Growing ecosystem: SiFive, SpacemiT, StarFive</text>
  <rect x="186.41" y="296.523" width="475.8148" height="59.3536" rx="5.7089" fill="var(--code-bg)"/>
  <text x="199.155" y="312.8452" font-family="monospace" font-size="10.3217" fill="var(--text-muted)"># RISC-V assembly (RV64I)</text>
  <text x="199.155" y="327.6836" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">addi a0, zero, 42   <tspan fill="var(--text-muted)"># load immediate 42 into a0</tspan></text>
  <text x="199.155" y="342.522" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">ecall               <tspan fill="var(--text-muted)"># environment call (syscall)</tspan></text>

  <!-- WebAssembly -->
  <rect x="687.715" y="200.8154" width="526.795" height="163.2224" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="687.715" y="200.8154" width="526.795" height="29.6768" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="951.1125" y="220.1052" font-family="Arial, sans-serif" font-size="12.7035" font-weight="bold" fill="var(--bg)" text-anchor="middle">WebAssembly (Wasm)</text>
  <text x="704.7083" y="243.1048" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Binary instruction format for a stack-based VM</text>
  <text x="704.7083" y="258.6851" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Runs in browsers and server-side (WASI)</text>
  <text x="704.7083" y="274.2655" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Compiled from C, Rust, Go -- or written directly</text>
  <text x="704.7083" y="289.8458" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Not traditional assembly but conceptually similar</text>
  <rect x="696.2116" y="296.523" width="509.8016" height="59.3536" rx="5.7089" fill="var(--code-bg)"/>
  <text x="708.9566" y="312.8452" font-family="monospace" font-size="10.3217" fill="var(--text-muted)">;; WebAssembly text format (WAT)</text>
  <text x="708.9566" y="327.6836" font-family="monospace" font-size="10.3217" fill="var(--ok-accent)">(func (param i32 i32) (result i32)</text>
  <text x="708.9566" y="342.522" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">  local.get 0  i32.add  local.get 1)</text>

  <!-- Row 2: Specialized ISAs + when assembly still matters -->
  <rect x="177.9133" y="378.8761" width="492.8083" height="148.384" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="177.9133" y="378.8761" width="492.8083" height="29.6768" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="424.3174" y="398.166" font-family="Arial, sans-serif" font-size="12.7035" font-weight="bold" fill="var(--bg)" text-anchor="middle">Specialized ISAs</text>
  <text x="194.9067" y="421.1655" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- GPU assembly: PTX (NVIDIA), GCN/RDNA (AMD)</text>
  <text x="194.9067" y="436.7457" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- DSP ISAs: TI C6000, Qualcomm Hexagon</text>
  <text x="194.9067" y="452.3261" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Neural processors: custom VLIW/systolic ISAs</text>
  <text x="194.9067" y="467.9065" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Each domain has its own assembly dialect</text>
  <text x="194.9067" y="483.4868" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Portable: SPIR-V as IR for GPU assembly</text>
  <text x="194.9067" y="510.1959" font-family="monospace" font-size="10" fill="var(--warn-accent)">ptx: .reg .f32 %f1; mul.f32 %f1, %f2, %f3;</text>

  <!-- When assembly still matters -->
  <rect x="687.715" y="378.8761" width="526.795" height="148.384" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="687.715" y="378.8761" width="526.795" height="29.6768" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="951.1125" y="398.166" font-family="Arial, sans-serif" font-size="12.7035" font-weight="bold" fill="var(--bg)" text-anchor="middle">When Assembly Still Matters</text>
  <text x="704.7083" y="421.1655" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Compilers get smarter but humans still outpace them for</text>
  <text x="704.7083" y="436.7457" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">  specific micro-optimizations</text>
  <text x="704.7083" y="452.3261" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Security: timing-attack-resistant constant-time code</text>
  <text x="704.7083" y="467.9065" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- OS kernel, firmware, bootloader: no runtime available</text>
  <text x="704.7083" y="483.4868" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Reverse engineering and vulnerability research</text>
  <text x="704.7083" y="499.067" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Understanding how CPUs work (pipeline, branch predict)</text>
  <text x="704.7083" y="514.6474" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Embedded controllers with no C compiler support</text>

  <!-- Timeline / trend box -->
  <rect x="177.9133" y="538.3889" width="1036.5966" height="66.7728" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="696.2116" y="556.1949" font-family="Arial, sans-serif" font-size="11.1155" font-weight="bold" fill="var(--text)" text-anchor="middle">Trend: Assembly is Narrowing, but Not Disappearing</text>

  <!-- Timeline bar -->
  <rect x="203.4034" y="564.356" width="985.6165" height="11.8707" rx="5.7089" fill="var(--border)"/>
  <rect x="203.4034" y="564.356" width="169.9338" height="11.8707" rx="5.7089" fill="var(--primary-accent)"/>
  <text x="288.3704" y="574.0009" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">Boot/Kernel</text>
  <rect x="373.3373" y="564.356" width="169.9338" height="11.8707" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="458.3042" y="574.0009" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">Crypto / Codecs</text>
  <rect x="543.2711" y="564.356" width="169.9338" height="11.8707" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="628.2381" y="574.0009" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">Hot Paths</text>
  <rect x="713.205" y="564.356" width="169.9338" height="11.8707" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="798.1719" y="574.0009" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">GPU / DSP / SIMD</text>
  <rect x="883.1389" y="564.356" width="169.9338" height="11.8707" rx="5.7089" fill="var(--text-muted)"/>
  <text x="968.1057" y="574.0009" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">Security / RE</text>
  <text x="696.2116" y="597.7424" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text-faint)" text-anchor="middle">Assembly knowledge remains essential for computer science depth -- even if you rarely write it from scratch</text>
</svg>

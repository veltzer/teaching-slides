<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <!-- Title -->
  <rect x="40" y="40" width="1200" height="42.181814" rx="6.321041" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999948" y="66.842867" font-family="Arial, sans-serif" font-size="19.421397" font-weight="bold" fill="var(--bg)" text-anchor="middle">The Future of Assembly Programming</text>

  <!-- RISC-V -->
  <rect x="40" y="97.520656" width="570.491858" height="210.909177" rx="6.321041" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="97.520656" width="570.491858" height="38.347104" rx="6.321041" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.245877" y="122.446062" font-family="Arial, sans-serif" font-size="15.537012" font-weight="bold" fill="var(--bg)" text-anchor="middle">RISC-V: Open-Source ISA</text>
  <text x="59.672129" y="152.165226" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Free, open standard instruction set architecture</text>
  <text x="59.672129" y="172.297403" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Modular: base ISA + optional extensions (M, F, A, V...)</text>
  <text x="59.672129" y="192.429791" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Used in embedded, HPC, and academic research</text>
  <text x="59.672129" y="212.561968" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Growing ecosystem: SiFive, SpacemiT, StarFive</text>
  <rect x="49.836065" y="221.190013" width="550.819624" height="76.694208" rx="6.321041" fill="var(--code-bg)"/>
  <text x="64.590162" y="242.280815" font-size="12.623961" fill="var(--text-muted)" font-family="Courier New, monospace"># RISC-V assembly (RV64I)</text>
  <text x="64.590162" y="261.454367" font-size="12.623961" fill="var(--primary-accent)" font-family="Courier New, monospace">addi a0, zero, 42   <tspan fill="var(--text-muted)" font-family="Arial, sans-serif"># load immediate 42 into a0</tspan></text>
  <text x="64.590162" y="280.628024" font-size="12.623961" fill="var(--primary-accent)" font-family="Courier New, monospace">ecall               <tspan fill="var(--text-muted)" font-family="Arial, sans-serif"># environment call (syscall)</tspan></text>

  <!-- WebAssembly -->
  <rect x="630.163988" y="97.520656" width="609.836012" height="210.909177" rx="6.321041" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630.163988" y="97.520656" width="609.836012" height="38.347104" rx="6.321041" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.082099" y="122.446062" font-family="Arial, sans-serif" font-size="15.537012" font-weight="bold" fill="var(--bg)" text-anchor="middle">WebAssembly (Wasm)</text>
  <text x="649.836117" y="152.165226" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Binary instruction format for a stack-based VM</text>
  <text x="649.836117" y="172.297403" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Runs in browsers and server-side (WASI)</text>
  <text x="649.836117" y="192.429791" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Compiled from C, Rust, Go -- or written directly</text>
  <text x="649.836117" y="212.561968" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Not traditional assembly but conceptually similar</text>
  <rect x="639.999948" y="221.190013" width="590.163883" height="76.694208" rx="6.321041" fill="var(--code-bg)"/>
  <text x="654.754045" y="242.280815" font-size="12.623961" fill="var(--text-muted)" font-family="Courier New, monospace">;; WebAssembly text format (WAT)</text>
  <text x="654.754045" y="261.454367" font-size="12.623961" fill="var(--ok-accent)" font-family="Courier New, monospace">(func (param i32 i32) (result i32)</text>
  <text x="654.754045" y="280.628024" font-size="12.623961" fill="var(--primary-accent)" font-family="Courier New, monospace">  local.get 0  i32.add  local.get 1)</text>

  <!-- Row 2: Specialized ISAs + when assembly still matters -->
  <rect x="40" y="327.603174" width="570.491858" height="191.735625" rx="6.321041" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="327.603174" width="570.491858" height="38.347104" rx="6.321041" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.245877" y="352.528791" font-family="Arial, sans-serif" font-size="15.537012" font-weight="bold" fill="var(--bg)" text-anchor="middle">Specialized ISAs</text>
  <text x="59.672129" y="382.24785" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- GPU assembly: PTX (NVIDIA), GCN/RDNA (AMD)</text>
  <text x="59.672129" y="402.379921" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- DSP ISAs: TI C6000, Qualcomm Hexagon</text>
  <text x="59.672129" y="422.512203" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Neural processors: custom VLIW/systolic ISAs</text>
  <text x="59.672129" y="442.644591" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Each domain has its own assembly dialect</text>
  <text x="59.672129" y="462.776768" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Portable: SPIR-V as IR for GPU assembly</text>
  <text x="59.672129" y="497.289162" font-size="12.230476" fill="var(--warn-accent)" font-family="Courier New, monospace">ptx: .reg .f32 %f1; mul.f32 %f1, %f2, %f3;</text>

  <!-- When assembly still matters -->
  <rect x="630.163988" y="327.603174" width="609.836012" height="191.735625" rx="6.321041" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630.163988" y="327.603174" width="609.836012" height="38.347104" rx="6.321041" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.082099" y="352.528791" font-family="Arial, sans-serif" font-size="15.537012" font-weight="bold" fill="var(--bg)" text-anchor="middle">When Assembly Still Matters</text>
  <text x="649.836117" y="382.24785" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Compilers get smarter but humans still outpace them for</text>
  <text x="649.836117" y="402.379921" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">  specific micro-optimizations</text>
  <text x="649.836117" y="422.512203" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Security: timing-attack-resistant constant-time code</text>
  <text x="649.836117" y="442.644591" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- OS kernel, firmware, bootloader: no runtime available</text>
  <text x="649.836117" y="462.776768" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Reverse engineering and vulnerability research</text>
  <text x="649.836117" y="482.908839" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Understanding how CPUs work (pipeline, branch predict)</text>
  <text x="649.836117" y="503.041227" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text)">- Embedded controllers with no C compiler support</text>

  <!-- Timeline / trend box -->
  <rect x="40" y="533.719016" width="1200" height="86.280984" rx="6.321041" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.999948" y="556.727173" font-family="Arial, sans-serif" font-size="13.594767" font-weight="bold" fill="var(--text)" text-anchor="middle">Trend: Assembly is Narrowing, but Not Disappearing</text>

  <!-- Timeline bar -->
  <rect x="69.508194" y="567.272573" width="1140.983612" height="15.338842" rx="6.321041" fill="var(--border)"/>
  <rect x="69.508194" y="567.272573" width="196.721189" height="15.338842" rx="6.321041" fill="var(--primary-accent)"/>
  <text x="167.868946" y="579.735329" font-family="Arial, sans-serif" font-size="12.230476" fill="var(--bg)" text-anchor="middle">Boot/Kernel</text>
  <rect x="266.229593" y="567.272573" width="196.721189" height="15.338842" rx="6.321041" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="364.590136" y="579.735329" font-family="Arial, sans-serif" font-size="12.230476" fill="var(--bg)" text-anchor="middle">Crypto / Codecs</text>
  <rect x="462.950783" y="567.272573" width="196.721189" height="15.338842" rx="6.321041" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="561.311535" y="579.735329" font-family="Arial, sans-serif" font-size="12.230476" fill="var(--bg)" text-anchor="middle">Hot Paths</text>
  <rect x="659.672182" y="567.272573" width="196.721189" height="15.338842" rx="6.321041" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="758.032724" y="579.735329" font-family="Arial, sans-serif" font-size="12.230476" fill="var(--bg)" text-anchor="middle">GPU / DSP / SIMD</text>
  <rect x="856.393476" y="567.272573" width="196.721189" height="15.338842" rx="6.321041" fill="var(--text-muted)"/>
  <text x="954.754018" y="579.735329" font-family="Arial, sans-serif" font-size="12.230476" fill="var(--bg)" text-anchor="middle">Security / RE</text>
  <text x="639.999948" y="610.413118" font-family="Arial, sans-serif" font-size="12.623961" fill="var(--text-faint)" text-anchor="middle">Assembly knowledge remains essential for computer science depth -- even if you rarely write it from scratch</text>
</svg>

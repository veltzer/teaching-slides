<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">The Future of Assembly Programming</text>

  <!-- RISC-V -->
  <rect x="30" y="75" width="580" height="220" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="580" height="40" rx="8" fill="url(#grad-primary)"/>
  <text x="320" y="101" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">RISC-V: Open-Source ISA</text>
  <text x="50" y="132" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Free, open standard instruction set architecture</text>
  <text x="50" y="153" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Modular: base ISA + optional extensions (M, F, A, V...)</text>
  <text x="50" y="174" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Used in embedded, HPC, and academic research</text>
  <text x="50" y="195" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Growing ecosystem: SiFive, SpacemiT, StarFive</text>
  <rect x="40" y="204" width="560" height="80" rx="4" fill="#1e1e2e"/>
  <text x="55" y="226" font-family="monospace" font-size="13" fill="#6c7086"># RISC-V assembly (RV64I)</text>
  <text x="55" y="246" font-family="monospace" font-size="13" fill="#cdd6f4">addi a0, zero, 42   <tspan fill="#6c7086"># load immediate 42 into a0</tspan></text>
  <text x="55" y="266" font-family="monospace" font-size="13" fill="#cdd6f4">ecall               <tspan fill="#6c7086"># environment call (syscall)</tspan></text>

  <!-- WebAssembly -->
  <rect x="630" y="75" width="620" height="220" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630" y="75" width="620" height="40" rx="8" fill="url(#grad-ok)"/>
  <text x="940" y="101" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">WebAssembly (Wasm)</text>
  <text x="650" y="132" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Binary instruction format for a stack-based VM</text>
  <text x="650" y="153" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Runs in browsers and server-side (WASI)</text>
  <text x="650" y="174" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Compiled from C, Rust, Go -- or written directly</text>
  <text x="650" y="195" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Not traditional assembly but conceptually similar</text>
  <rect x="640" y="204" width="600" height="80" rx="4" fill="#1e1e2e"/>
  <text x="655" y="226" font-family="monospace" font-size="13" fill="#6c7086">;; WebAssembly text format (WAT)</text>
  <text x="655" y="246" font-family="monospace" font-size="13" fill="#a6e3a1">(func (param i32 i32) (result i32)</text>
  <text x="655" y="266" font-family="monospace" font-size="13" fill="#cdd6f4">  local.get 0  i32.add  local.get 1)</text>

  <!-- Row 2: Specialized ISAs + when assembly still matters -->
  <rect x="30" y="315" width="580" height="200" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="315" width="580" height="40" rx="8" fill="url(#grad-warn)"/>
  <text x="320" y="341" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Specialized ISAs</text>
  <text x="50" y="372" font-family="Arial, sans-serif" font-size="13" fill="#333333">- GPU assembly: PTX (NVIDIA), GCN/RDNA (AMD)</text>
  <text x="50" y="393" font-family="Arial, sans-serif" font-size="13" fill="#333333">- DSP ISAs: TI C6000, Qualcomm Hexagon</text>
  <text x="50" y="414" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Neural processors: custom VLIW/systolic ISAs</text>
  <text x="50" y="435" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Each domain has its own assembly dialect</text>
  <text x="50" y="456" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Portable: SPIR-V as IR for GPU assembly</text>
  <text x="50" y="492" font-family="monospace" font-size="12" fill="#f57c00">ptx: .reg .f32 %f1; mul.f32 %f1, %f2, %f3;</text>

  <!-- When assembly still matters -->
  <rect x="630" y="315" width="620" height="200" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630" y="315" width="620" height="40" rx="8" fill="url(#grad-info)"/>
  <text x="940" y="341" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">When Assembly Still Matters</text>
  <text x="650" y="372" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Compilers get smarter but humans still outpace them for</text>
  <text x="650" y="393" font-family="Arial, sans-serif" font-size="13" fill="#333333">  specific micro-optimizations</text>
  <text x="650" y="414" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Security: timing-attack-resistant constant-time code</text>
  <text x="650" y="435" font-family="Arial, sans-serif" font-size="13" fill="#333333">- OS kernel, firmware, bootloader: no runtime available</text>
  <text x="650" y="456" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Reverse engineering and vulnerability research</text>
  <text x="650" y="477" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Understanding how CPUs work (pipeline, branch predict)</text>
  <text x="650" y="498" font-family="Arial, sans-serif" font-size="13" fill="#333333">- Embedded controllers with no C compiler support</text>

  <!-- Timeline / trend box -->
  <rect x="30" y="530" width="1220" height="90" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="554" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Trend: Assembly is Narrowing, but Not Disappearing</text>

  <!-- Timeline bar -->
  <rect x="60" y="565" width="1160" height="16" rx="8" fill="#e0e0e0"/>
  <rect x="60" y="565" width="200" height="16" rx="8" fill="#1565c0"/>
  <text x="160" y="578" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Boot/Kernel</text>
  <rect x="260" y="565" width="200" height="16" rx="8" fill="#43a047"/>
  <text x="360" y="578" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Crypto / Codecs</text>
  <rect x="460" y="565" width="200" height="16" rx="8" fill="#fb8c00"/>
  <text x="560" y="578" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Hot Paths</text>
  <rect x="660" y="565" width="200" height="16" rx="8" fill="#8e24aa"/>
  <text x="760" y="578" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">GPU / DSP / SIMD</text>
  <rect x="860" y="565" width="200" height="16" rx="8" fill="#455a64"/>
  <text x="960" y="578" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Security / RE</text>
  <text x="640" y="610" font-family="Arial, sans-serif" font-size="13" fill="#888888" text-anchor="middle">Assembly knowledge remains essential for computer science depth -- even if you rarely write it from scratch</text>
</svg>

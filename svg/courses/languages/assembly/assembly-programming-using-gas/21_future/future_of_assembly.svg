<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">The Future of Assembly Programming</text>

  <!-- RISC-V -->
  <rect x="30" y="75" width="580" height="220" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="580" height="40" rx="8" fill="url(#grad-primary)"/>
  <text x="320" y="101" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">RISC-V: Open-Source ISA</text>
  <text x="50" y="132" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Free, open standard instruction set architecture</text>
  <text x="50" y="153" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Modular: base ISA + optional extensions (M, F, A, V...)</text>
  <text x="50" y="174" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Used in embedded, HPC, and academic research</text>
  <text x="50" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Growing ecosystem: SiFive, SpacemiT, StarFive</text>
  <rect x="40" y="204" width="560" height="80" rx="4" fill="var(--code-bg)"/>
  <text x="55" y="226" font-family="monospace" font-size="13" fill="var(--text-lighter)"># RISC-V assembly (RV64I)</text>
  <text x="55" y="246" font-family="monospace" font-size="13" fill="var(--primary-lt)">addi a0, zero, 42   <tspan fill="var(--text-lighter)"># load immediate 42 into a0</tspan></text>
  <text x="55" y="266" font-family="monospace" font-size="13" fill="var(--primary-lt)">ecall               <tspan fill="var(--text-lighter)"># environment call (syscall)</tspan></text>

  <!-- WebAssembly -->
  <rect x="630" y="75" width="620" height="220" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630" y="75" width="620" height="40" rx="8" fill="url(#grad-ok)"/>
  <text x="940" y="101" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">WebAssembly (Wasm)</text>
  <text x="650" y="132" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Binary instruction format for a stack-based VM</text>
  <text x="650" y="153" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Runs in browsers and server-side (WASI)</text>
  <text x="650" y="174" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Compiled from C, Rust, Go -- or written directly</text>
  <text x="650" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Not traditional assembly but conceptually similar</text>
  <rect x="640" y="204" width="600" height="80" rx="4" fill="var(--code-bg)"/>
  <text x="655" y="226" font-family="monospace" font-size="13" fill="var(--text-lighter)">;; WebAssembly text format (WAT)</text>
  <text x="655" y="246" font-family="monospace" font-size="13" fill="var(--ok-tint)">(func (param i32 i32) (result i32)</text>
  <text x="655" y="266" font-family="monospace" font-size="13" fill="var(--primary-lt)">  local.get 0  i32.add  local.get 1)</text>

  <!-- Row 2: Specialized ISAs + when assembly still matters -->
  <rect x="30" y="315" width="580" height="200" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="315" width="580" height="40" rx="8" fill="url(#grad-warn)"/>
  <text x="320" y="341" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Specialized ISAs</text>
  <text x="50" y="372" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- GPU assembly: PTX (NVIDIA), GCN/RDNA (AMD)</text>
  <text x="50" y="393" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- DSP ISAs: TI C6000, Qualcomm Hexagon</text>
  <text x="50" y="414" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Neural processors: custom VLIW/systolic ISAs</text>
  <text x="50" y="435" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Each domain has its own assembly dialect</text>
  <text x="50" y="456" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Portable: SPIR-V as IR for GPU assembly</text>
  <text x="50" y="492" font-family="monospace" font-size="12" fill="var(--warn-mid)">ptx: .reg .f32 %f1; mul.f32 %f1, %f2, %f3;</text>

  <!-- When assembly still matters -->
  <rect x="630" y="315" width="620" height="200" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630" y="315" width="620" height="40" rx="8" fill="url(#grad-info)"/>
  <text x="940" y="341" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">When Assembly Still Matters</text>
  <text x="650" y="372" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Compilers get smarter but humans still outpace them for</text>
  <text x="650" y="393" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">  specific micro-optimizations</text>
  <text x="650" y="414" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Security: timing-attack-resistant constant-time code</text>
  <text x="650" y="435" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- OS kernel, firmware, bootloader: no runtime available</text>
  <text x="650" y="456" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Reverse engineering and vulnerability research</text>
  <text x="650" y="477" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Understanding how CPUs work (pipeline, branch predict)</text>
  <text x="650" y="498" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Embedded controllers with no C compiler support</text>

  <!-- Timeline / trend box -->
  <rect x="30" y="530" width="1220" height="90" rx="8" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="554" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Trend: Assembly is Narrowing, but Not Disappearing</text>

  <!-- Timeline bar -->
  <rect x="60" y="565" width="1160" height="16" rx="8" fill="var(--border)"/>
  <rect x="60" y="565" width="200" height="16" rx="8" fill="var(--primary-dk)"/>
  <text x="160" y="578" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">Boot/Kernel</text>
  <rect x="260" y="565" width="200" height="16" rx="8" fill="var(--ok)"/>
  <text x="360" y="578" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">Crypto / Codecs</text>
  <rect x="460" y="565" width="200" height="16" rx="8" fill="var(--warn)"/>
  <text x="560" y="578" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">Hot Paths</text>
  <rect x="660" y="565" width="200" height="16" rx="8" fill="var(--info)"/>
  <text x="760" y="578" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">GPU / DSP / SIMD</text>
  <rect x="860" y="565" width="200" height="16" rx="8" fill="var(--text-muted)"/>
  <text x="960" y="578" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">Security / RE</text>
  <text x="640" y="610" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Assembly knowledge remains essential for computer science depth -- even if you rarely write it from scratch</text>
</svg>

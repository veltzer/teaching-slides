<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6.6276" x="40" y="40"/>

  <!-- Title -->
  <rect x="68.1249" y="53.5938" width="1143.7501" height="39.875" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="639.9999" y="78.9687" font-family="Arial, sans-serif" font-size="18.435" font-weight="bold" fill="var(--bg)" text-anchor="middle">The Future of Assembly Programming</text>

  <!-- RISC-V -->
  <rect x="68.1249" y="107.9688" width="543.7501" height="199.3751" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="68.1249" y="107.9688" width="543.7501" height="36.25" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="339.9999" y="131.5311" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">RISC-V: Open-Source ISA</text>
  <text x="86.8749" y="159.625" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Free, open standard instruction set architecture</text>
  <text x="86.8749" y="178.6562" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Modular: base ISA + optional extensions (M, F, A, V...)</text>
  <text x="86.8749" y="197.6876" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Used in embedded, HPC, and academic research</text>
  <text x="86.8749" y="216.7188" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Growing ecosystem: SiFive, SpacemiT, StarFive</text>
  <rect x="77.4999" y="224.875" width="525" height="72.5" rx="6.6276" fill="var(--code-bg)"/>
  <text x="91.5624" y="244.8124" font-family="monospace" font-size="11.9828" fill="var(--text-muted)"># RISC-V assembly (RV64I)</text>
  <text x="91.5624" y="262.9374" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">addi a0, zero, 42   <tspan fill="var(--text-muted)"># load immediate 42 into a0</tspan></text>
  <text x="91.5624" y="281.0625" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">ecall               <tspan fill="var(--text-muted)"># environment call (syscall)</tspan></text>

  <!-- WebAssembly -->
  <rect x="630.625" y="107.9688" width="581.25" height="199.3751" rx="6.6276" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630.625" y="107.9688" width="581.25" height="36.25" rx="6.6276" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="921.2501" y="131.5311" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">WebAssembly (Wasm)</text>
  <text x="649.375" y="159.625" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Binary instruction format for a stack-based VM</text>
  <text x="649.375" y="178.6562" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Runs in browsers and server-side (WASI)</text>
  <text x="649.375" y="197.6876" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Compiled from C, Rust, Go -- or written directly</text>
  <text x="649.375" y="216.7188" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Not traditional assembly but conceptually similar</text>
  <rect x="639.9999" y="224.875" width="562.5" height="72.5" rx="6.6276" fill="var(--code-bg)"/>
  <text x="654.0624" y="244.8124" font-family="monospace" font-size="11.9828" fill="var(--text-muted)">;; WebAssembly text format (WAT)</text>
  <text x="654.0624" y="262.9374" font-family="monospace" font-size="11.9828" fill="var(--ok-accent)">(func (param i32 i32) (result i32)</text>
  <text x="654.0624" y="281.0625" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">  local.get 0  i32.add  local.get 1)</text>

  <!-- Row 2: Specialized ISAs + when assembly still matters -->
  <rect x="68.1249" y="325.4687" width="543.7501" height="181.2501" rx="6.6276" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="68.1249" y="325.4687" width="543.7501" height="36.25" rx="6.6276" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="339.9999" y="349.0312" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">Specialized ISAs</text>
  <text x="86.8749" y="377.125" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- GPU assembly: PTX (NVIDIA), GCN/RDNA (AMD)</text>
  <text x="86.8749" y="396.1561" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- DSP ISAs: TI C6000, Qualcomm Hexagon</text>
  <text x="86.8749" y="415.1874" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Neural processors: custom VLIW/systolic ISAs</text>
  <text x="86.8749" y="434.2188" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Each domain has its own assembly dialect</text>
  <text x="86.8749" y="453.25" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Portable: SPIR-V as IR for GPU assembly</text>
  <text x="86.8749" y="485.875" font-family="monospace" font-size="11.6093" fill="var(--warn-accent)">ptx: .reg .f32 %f1; mul.f32 %f1, %f2, %f3;</text>

  <!-- When assembly still matters -->
  <rect x="630.625" y="325.4687" width="581.25" height="181.2501" rx="6.6276" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630.625" y="325.4687" width="581.25" height="36.25" rx="6.6276" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="921.2501" y="349.0312" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">When Assembly Still Matters</text>
  <text x="649.375" y="377.125" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Compilers get smarter but humans still outpace them for</text>
  <text x="649.375" y="396.1561" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">  specific micro-optimizations</text>
  <text x="649.375" y="415.1874" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Security: timing-attack-resistant constant-time code</text>
  <text x="649.375" y="434.2188" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- OS kernel, firmware, bootloader: no runtime available</text>
  <text x="649.375" y="453.25" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Reverse engineering and vulnerability research</text>
  <text x="649.375" y="472.2811" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Understanding how CPUs work (pipeline, branch predict)</text>
  <text x="649.375" y="491.3125" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Embedded controllers with no C compiler support</text>

  <!-- Timeline / trend box -->
  <rect x="68.1249" y="520.3126" width="1143.7501" height="81.5625" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="639.9999" y="542.0625" font-family="Arial, sans-serif" font-size="12.9043" font-weight="bold" fill="var(--text)" text-anchor="middle">Trend: Assembly is Narrowing, but Not Disappearing</text>

  <!-- Timeline bar -->
  <rect x="96.2499" y="552.0312" width="1087.5001" height="14.5" rx="6.6276" fill="var(--border)"/>
  <rect x="96.2499" y="552.0312" width="187.4999" height="14.5" rx="6.6276" fill="var(--primary-accent)"/>
  <text x="190" y="563.8124" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--bg)" text-anchor="middle">Boot/Kernel</text>
  <rect x="283.75" y="552.0312" width="187.4999" height="14.5" rx="6.6276" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="377.4999" y="563.8124" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--bg)" text-anchor="middle">Crypto / Codecs</text>
  <rect x="471.2499" y="552.0312" width="187.4999" height="14.5" rx="6.6276" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="565" y="563.8124" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--bg)" text-anchor="middle">Hot Paths</text>
  <rect x="658.75" y="552.0312" width="187.4999" height="14.5" rx="6.6276" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="752.4999" y="563.8124" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--bg)" text-anchor="middle">GPU / DSP / SIMD</text>
  <rect x="846.25" y="552.0312" width="187.4999" height="14.5" rx="6.6276" fill="var(--text-muted)"/>
  <text x="939.9999" y="563.8124" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--bg)" text-anchor="middle">Security / RE</text>
  <text x="639.9999" y="592.8125" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text-faint)" text-anchor="middle">Assembly knowledge remains essential for computer science depth -- even if you rarely write it from scratch</text>
</svg>

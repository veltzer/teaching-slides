<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- RISC-V -->
  <rect x="40" y="40" width="590" height="218.867924528302" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="78.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--bg)">RISC-V: Open ISA</text>
  <text x="60" y="111.132075471698" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Free, open standard</text>
  <text x="60" y="138.490566037735" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Modular base + extensions</text>
  <text x="60" y="165.849056603774" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Embedded, HPC, research</text>
  <rect x="60" y="182.264150943396" width="550" height="65.66037735849" rx="6.276641332361" fill="var(--code-bg)"/>
  <text x="80" y="208.528301886792" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--text-faint)"># RV64I</text>
  <text x="80" y="230.415094339623" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">addi a0, zero, 42</text>

  <!-- WebAssembly -->
  <rect x="650" y="40" width="590" height="218.867924528302" rx="8.368855109814" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="78.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--bg)">WebAssembly</text>
  <text x="670" y="111.132075471698" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Stack-based VM bytecode</text>
  <text x="670" y="138.490566037735" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Runs in browser and WASI</text>
  <text x="670" y="165.849056603774" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Compiled from C, Rust, Go</text>
  <rect x="670" y="182.264150943396" width="550" height="65.66037735849" rx="6.276641332361" fill="var(--code-bg)"/>
  <text x="690" y="208.528301886792" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--text-faint)">;; WAT</text>
  <text x="690" y="230.415094339623" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">(func (param i32 i32) i32.add)</text>

  <!-- Specialized ISAs -->
  <rect x="40" y="280.754716981132" width="590" height="196.981132075472" rx="8.368855109814" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="319.056603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--bg)">Specialized ISAs</text>
  <text x="60" y="357.358490566038" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">GPU: PTX, GCN/RDNA</text>
  <text x="60" y="384.716981132075" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">DSP: C6000, Hexagon</text>
  <text x="60" y="412.075471698113" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">NPU: VLIW / systolic</text>
  <text x="60" y="444.905660377359" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--bg)">SPIR-V = portable IR</text>

  <!-- Still matters -->
  <rect x="650" y="280.754716981132" width="590" height="196.981132075472" rx="8.368855109814" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="319.056603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--bg)">Still Matters For</text>
  <text x="670" y="357.358490566038" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Kernels, firmware, boot</text>
  <text x="670" y="384.716981132075" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Crypto, constant-time code</text>
  <text x="670" y="412.075471698113" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Micro-optimized hot paths</text>
  <text x="670" y="444.905660377359" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--bg)">Reverse engineering</text>

  <!-- Timeline -->
  <rect x="40" y="505.094339622642" width="1200" height="114.905660377358" rx="8.368855109814" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="532.452830188679" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--text)">Narrowing, Not Disappearing</text>
  <rect x="60" y="554.33962264151" width="228" height="32.830188679245" rx="4.184427554907" fill="var(--primary-accent)"/>
  <text x="174" y="576.226415094339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Boot / Kernel</text>
  <rect x="296" y="554.33962264151" width="228" height="32.830188679245" rx="4.184427554907" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="576.226415094339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Crypto / Codec</text>
  <rect x="532" y="554.33962264151" width="228" height="32.830188679245" rx="4.184427554907" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="646" y="576.226415094339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Hot Paths</text>
  <rect x="768" y="554.33962264151" width="228" height="32.830188679245" rx="4.184427554907" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="882" y="576.226415094339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">GPU / SIMD</text>
  <rect x="1004" y="554.33962264151" width="216" height="32.830188679245" rx="4.184427554907" fill="var(--text-muted)"/>
  <text x="1112" y="576.226415094339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553448" fill="var(--bg)">Security / RE</text>
  <text x="640" y="609.056603773585" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.55328266472" fill="var(--text-muted)">Essential depth knowledge</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">The Future of Assembly Programming</text>

  <!-- RISC-V -->
  <rect x="30" y="75" width="580" height="220" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="580" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="320" y="101" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">RISC-V: Open-Source ISA</text>
  <text x="50" y="132" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Free, open standard instruction set architecture</text>
  <text x="50" y="153" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Modular: base ISA + optional extensions (M, F, A, V...)</text>
  <text x="50" y="174" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Used in embedded, HPC, and academic research</text>
  <text x="50" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Growing ecosystem: SiFive, SpacemiT, StarFive</text>
  <rect x="40" y="204" width="560" height="80" rx="6" fill="var(--code-bg)"/>
  <text x="55" y="226" font-family="monospace" font-size="13" fill="var(--text-muted)"># RISC-V assembly (RV64I)</text>
  <text x="55" y="246" font-family="monospace" font-size="13" fill="var(--primary-accent)">addi a0, zero, 42   <tspan fill="var(--text-muted)"># load immediate 42 into a0</tspan></text>
  <text x="55" y="266" font-family="monospace" font-size="13" fill="var(--primary-accent)">ecall               <tspan fill="var(--text-muted)"># environment call (syscall)</tspan></text>

  <!-- WebAssembly -->
  <rect x="630" y="75" width="620" height="220" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630" y="75" width="620" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="101" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">WebAssembly (Wasm)</text>
  <text x="650" y="132" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Binary instruction format for a stack-based VM</text>
  <text x="650" y="153" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Runs in browsers and server-side (WASI)</text>
  <text x="650" y="174" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Compiled from C, Rust, Go -- or written directly</text>
  <text x="650" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Not traditional assembly but conceptually similar</text>
  <rect x="640" y="204" width="600" height="80" rx="6" fill="var(--code-bg)"/>
  <text x="655" y="226" font-family="monospace" font-size="13" fill="var(--text-muted)">;; WebAssembly text format (WAT)</text>
  <text x="655" y="246" font-family="monospace" font-size="13" fill="var(--ok-accent)">(func (param i32 i32) (result i32)</text>
  <text x="655" y="266" font-family="monospace" font-size="13" fill="var(--primary-accent)">  local.get 0  i32.add  local.get 1)</text>

  <!-- Row 2: Specialized ISAs + when assembly still matters -->
  <rect x="30" y="315" width="580" height="200" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="315" width="580" height="40" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="320" y="341" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Specialized ISAs</text>
  <text x="50" y="372" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- GPU assembly: PTX (NVIDIA), GCN/RDNA (AMD)</text>
  <text x="50" y="393" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- DSP ISAs: TI C6000, Qualcomm Hexagon</text>
  <text x="50" y="414" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Neural processors: custom VLIW/systolic ISAs</text>
  <text x="50" y="435" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Each domain has its own assembly dialect</text>
  <text x="50" y="456" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Portable: SPIR-V as IR for GPU assembly</text>
  <text x="50" y="492" font-family="monospace" font-size="12" fill="var(--warn-accent)">ptx: .reg .f32 %f1; mul.f32 %f1, %f2, %f3;</text>

  <!-- When assembly still matters -->
  <rect x="630" y="315" width="620" height="200" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630" y="315" width="620" height="40" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="940" y="341" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">When Assembly Still Matters</text>
  <text x="650" y="372" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Compilers get smarter but humans still outpace them for</text>
  <text x="650" y="393" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">  specific micro-optimizations</text>
  <text x="650" y="414" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Security: timing-attack-resistant constant-time code</text>
  <text x="650" y="435" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- OS kernel, firmware, bootloader: no runtime available</text>
  <text x="650" y="456" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Reverse engineering and vulnerability research</text>
  <text x="650" y="477" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Understanding how CPUs work (pipeline, branch predict)</text>
  <text x="650" y="498" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Embedded controllers with no C compiler support</text>

  <!-- Timeline / trend box -->
  <rect x="30" y="530" width="1220" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="554" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)" text-anchor="middle">Trend: Assembly is Narrowing, but Not Disappearing</text>

  <!-- Timeline bar -->
  <rect x="60" y="565" width="1160" height="16" rx="6" fill="var(--border)"/>
  <rect x="60" y="565" width="200" height="16" rx="6" fill="var(--primary-accent)"/>
  <text x="160" y="578" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">Boot/Kernel</text>
  <rect x="260" y="565" width="200" height="16" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="360" y="578" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">Crypto / Codecs</text>
  <rect x="460" y="565" width="200" height="16" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="560" y="578" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">Hot Paths</text>
  <rect x="660" y="565" width="200" height="16" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="760" y="578" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">GPU / DSP / SIMD</text>
  <rect x="860" y="565" width="200" height="16" rx="6" fill="var(--text-muted)"/>
  <text x="960" y="578" font-family="Arial, sans-serif" font-size="11" fill="var(--bg)" text-anchor="middle">Security / RE</text>
  <text x="640" y="610" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Assembly knowledge remains essential for computer science depth -- even if you rarely write it from scratch</text>
</svg>

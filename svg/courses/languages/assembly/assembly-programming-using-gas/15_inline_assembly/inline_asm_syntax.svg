<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Left: syntax diagram -->
  <rect x="68.125" y="58.125" width="656.25" height="534.6875" rx="6" fill="var(--surface)" filter="url(#shadow)"/>

  <!-- Header -->
  <rect x="68.125" y="58.125" width="656.25" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="396.25" y="83.5" font-family="Arial, sans-serif" font-size="17.5131" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCC Inline Assembly Syntax</text>

  <!-- Full syntax template -->
  <rect x="86.875" y="108.875" width="618.75" height="199.375" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="100.9375" y="132.4375" font-family="monospace" font-size="12.9044" fill="var(--info-accent)">__asm__ volatile</text>
  <text x="100.9375" y="150.5625" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)">(</text>
  <text x="115" y="168.6875" font-family="monospace" font-size="12.9044" fill="var(--ok-accent)">"assembly template"</text>
  <text x="100.9375" y="186.8125" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)">: output operands</text>
  <text x="100.9375" y="204.9375" font-family="monospace" font-size="12.9044" fill="var(--warn-accent)">: input operands</text>
  <text x="100.9375" y="223.0625" font-family="monospace" font-size="12.9044" fill="var(--info-accent)">: clobbers</text>
  <text x="100.9375" y="241.1875" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)">);</text>
  <text x="100.9375" y="272" font-family="monospace" font-size="11.9827" fill="var(--text-muted)">/* Each section separated by colons */</text>
  <text x="100.9375" y="290.125" font-family="monospace" font-size="11.9827" fill="var(--text-muted)">/* volatile = prevent reordering/removal */</text>

  <!-- Annotated real example -->
  <rect x="86.875" y="320.9375" width="618.75" height="235.625" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="396.25" y="343.5938" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Example: add two integers</text>
  <text x="100.9375" y="368.0625" font-family="monospace" font-size="11.9827" fill="var(--info-accent)">__asm__ volatile</text>
  <text x="100.9375" y="386.1875" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">(</text>
  <text x="115" y="404.3125" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">"addl %2, %0\n\t"</text>
  <text x="555.625" y="404.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">template</text>
  <text x="100.9375" y="426.0625" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">: "=r"(result)</text>
  <text x="555.625" y="426.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">output</text>
  <text x="100.9375" y="447.8125" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)">: "0"(a), "r"(b)</text>
  <text x="555.625" y="447.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">inputs</text>
  <text x="100.9375" y="469.5625" font-family="monospace" font-size="11.9827" fill="var(--info-accent)">: "cc"</text>
  <text x="555.625" y="469.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">clobbers</text>
  <text x="100.9375" y="487.6875" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">);</text>
  <text x="100.9375" y="514.875" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">/* %0=result, %1=a (same reg as result), %2=b */</text>
  <text x="100.9375" y="531.1875" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">/* "=r" write-only reg; "0" tied to operand 0 */</text>

  <!-- Right panel: constraints and clobbers -->
  <rect x="743.125" y="58.125" width="468.75" height="534.6875" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="743.125" y="58.125" width="468.75" height="39.875" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="977.5" y="83.5" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">Constraints and Clobbers</text>

  <!-- Output constraints -->
  <rect x="761.875" y="108.875" width="431.25" height="135.9375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="780.625" y="130.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Output Constraint Modifiers</text>
  <text x="780.625" y="152.375" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">=</text>
  <text x="808.75" y="152.375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">write-only (output)</text>
  <text x="780.625" y="172.3125" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">+</text>
  <text x="808.75" y="172.3125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">read-write (in and out)</text>
  <text x="780.625" y="192.25" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">&amp;</text>
  <text x="808.75" y="192.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">earlyclobber (written before inputs read)</text>
  <text x="780.625" y="212.1875" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">r</text>
  <text x="808.75" y="212.1875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">any general-purpose register</text>
  <text x="780.625" y="232.125" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">m</text>
  <text x="808.75" y="232.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">memory operand</text>

  <!-- Input constraints -->
  <rect x="761.875" y="257.5" width="431.25" height="117.8125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="780.625" y="279.25" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Input Constraints</text>
  <text x="780.625" y="301" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)">r</text>
  <text x="808.75" y="301" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">any register</text>
  <text x="780.625" y="320.9375" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)">i</text>
  <text x="808.75" y="320.9375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">immediate integer constant</text>
  <text x="780.625" y="340.875" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)">0,1,2...</text>
  <text x="836.875" y="340.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">tied to matching output operand</text>
  <text x="780.625" y="360.8125" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)">g</text>
  <text x="808.75" y="360.8125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">register, memory, or immediate</text>

  <!-- Clobbers -->
  <rect x="761.875" y="388" width="431.25" height="117.8125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="780.625" y="409.75" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">Common Clobbers</text>
  <text x="780.625" y="431.5" font-family="monospace" font-size="11.9827" fill="var(--danger-accent)">"cc"</text>
  <text x="827.5" y="431.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">modifies condition codes (flags)</text>
  <text x="780.625" y="451.4375" font-family="monospace" font-size="11.9827" fill="var(--danger-accent)">"memory"</text>
  <text x="855.625" y="451.4375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">reads/writes arbitrary memory</text>
  <text x="780.625" y="471.375" font-family="monospace" font-size="11.9827" fill="var(--danger-accent)">"%eax"</text>
  <text x="836.875" y="471.375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">specific register clobbered</text>
  <text x="780.625" y="491.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Tells GCC which resources are overwritten</text>

  <!-- volatile note -->
  <rect x="761.875" y="518.5" width="431.25" height="54.375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="780.625" y="539.3438" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--info-accent)">volatile keyword</text>
  <text x="780.625" y="559.2812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Prevents compiler from moving, duplicating, or removing the asm block</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.209610966678" font-weight="bold" fill="var(--text)">GCC Inline Assembly Syntax</text>

  <rect x="40" y="65.438596491228" width="690" height="554.561403508772" rx="10.087337902782" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="55" y="80.701754385965" width="660" height="213.684210526316" rx="8.069870322226" fill="var(--code-bg)"/>
  <text x="75" y="116.315789473684" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--info-text)">__asm__ volatile</text>
  <text x="75" y="141.754385964912" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--primary-text)">(</text>
  <text x="90" y="167.19298245614" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--ok-text)">"assembly template"</text>
  <text x="75" y="192.631578947368" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--primary-text)">: output operands</text>
  <text x="75" y="218.070175438596" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--warn-text)">: input operands</text>
  <text x="75" y="243.508771929825" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--info-text)">: clobbers</text>
  <text x="75" y="268.947368421053" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--primary-text)">);</text>

  <rect x="55" y="309.649122807018" width="660" height="295.087719298246" rx="8.069870322226" fill="var(--code-bg)"/>
  <text x="385" y="340.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--bg)">Example: add</text>
  <text x="75" y="370.701754385965" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--info-text)">__asm__ volatile</text>
  <text x="75" y="394.105263157895" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--primary-text)">(</text>
  <text x="90" y="417.508771929825" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--ok-text)">"addl %2, %0"</text>
  <text x="75" y="447.017543859649" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--primary-text)">: "=r"(result)</text>
  <text x="500" y="447.017543859649" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">output</text>
  <text x="75" y="475.508771929825" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--warn-text)">: "0"(a), "r"(b)</text>
  <text x="500" y="475.508771929825" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">inputs</text>
  <text x="75" y="504" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--info-text)">: "cc"</text>
  <text x="500" y="504" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--info-text)">clobbers</text>
  <text x="75" y="532.491228070175" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--primary-text)">);</text>

  <rect x="750" y="65.438596491228" width="490" height="172.982456140351" rx="10.087337902782" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="95.964912280702" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--primary-text)">Output Modifiers</text>
  <text x="770" y="126.491228070175" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">=  write-only</text>
  <text x="770" y="151.929824561404" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">+  read-write</text>
  <text x="770" y="177.368421052632" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">&amp;  earlyclobber</text>
  <text x="770" y="202.80701754386" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">r  register</text>
  <text x="770" y="226.210526315789" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">m  memory</text>

  <rect x="750" y="253.684210526316" width="490" height="152.631578947368" rx="10.087337902782" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="284.210526315789" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--warn-text)">Input Constraints</text>
  <text x="770" y="312.701754385965" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--warn-text)">r  any register</text>
  <text x="770" y="338.140350877193" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--warn-text)">i  immediate</text>
  <text x="770" y="363.578947368421" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--warn-text)">0,1,2  tied</text>
  <text x="770" y="389.017543859649" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--warn-text)">g  any</text>

  <rect x="750" y="421.578947368421" width="490" height="132.280701754386" rx="10.087337902782" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="452.105263157895" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--danger-text)">Clobbers</text>
  <text x="770" y="480.59649122807" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--danger-text)">"cc"      flags</text>
  <text x="770" y="506.035087719298" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--danger-text)">"memory"  memory</text>
  <text x="770" y="531.473684210526" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--danger-text)">"%eax"    reg</text>

  <rect x="750" y="569.122807017544" width="490" height="45.789473684211" rx="10.087337902782" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995" y="597.614035087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--info-text)">volatile: no reorder/remove</text>
</svg>

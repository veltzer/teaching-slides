<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <!-- Left: syntax diagram -->
  <rect x="40" y="40" width="688.52459" height="580" rx="6.400889" fill="var(--surface)"/>

  <!-- Header -->
  <rect x="40" y="40" width="688.52459" height="43.254237" rx="6.400889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="384.262295" y="67.525424" font-family="Arial, sans-serif" font-size="18.683235" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCC Inline Assembly Syntax</text>

  <!-- Full syntax template -->
  <rect x="59.672131" y="95.050847" width="649.180328" height="216.271186" rx="6.400889" fill="var(--code-bg)"/>
  <text x="74.42623" y="120.610169" font-size="13.766605" fill="var(--info-accent)" font-family="Courier New, monospace">__asm__ volatile</text>
  <text x="74.42623" y="140.271186" font-size="13.766605" fill="var(--primary-accent)" font-family="Courier New, monospace">(</text>
  <text x="89.180328" y="159.932203" font-size="13.766605" fill="var(--ok-accent)" font-family="Courier New, monospace">"assembly template"</text>
  <text x="74.42623" y="179.59322" font-size="13.766605" fill="var(--primary-accent)" font-family="Courier New, monospace">: output operands</text>
  <text x="74.42623" y="199.254237" font-size="13.766605" fill="var(--warn-accent)" font-family="Courier New, monospace">: input operands</text>
  <text x="74.42623" y="218.915254" font-size="13.766605" fill="var(--info-accent)" font-family="Courier New, monospace">: clobbers</text>
  <text x="74.42623" y="238.576271" font-size="13.766605" fill="var(--primary-accent)" font-family="Courier New, monospace">);</text>
  <text x="74.42623" y="272" font-size="12.783322" fill="var(--text-muted)" font-family="Courier New, monospace">/* Each section separated by colons */</text>
  <text x="74.42623" y="291.661017" font-size="12.783322" fill="var(--text-muted)" font-family="Courier New, monospace">/* volatile = prevent reordering/removal */</text>

  <!-- Annotated real example -->
  <rect x="59.672131" y="325.084746" width="649.180328" height="255.59322" rx="6.400889" fill="var(--code-bg)"/>
  <text x="384.262295" y="349.661071" font-family="Arial, sans-serif" font-size="13.766605" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Example: add two integers</text>
  <text x="74.42623" y="376.20339" font-size="12.783322" fill="var(--info-accent)" font-family="Courier New, monospace">__asm__ volatile</text>
  <text x="74.42623" y="395.864407" font-size="12.783322" fill="var(--primary-accent)" font-family="Courier New, monospace">(</text>
  <text x="89.180328" y="415.525424" font-size="12.783322" fill="var(--ok-accent)" font-family="Courier New, monospace">"addl %2, %0\n\t"</text>
  <text x="551.47541" y="415.525424" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">template</text>
  <text x="74.42623" y="439.118644" font-size="12.783322" fill="var(--primary-accent)" font-family="Courier New, monospace">: "=r"(result)</text>
  <text x="551.47541" y="439.118644" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--primary-accent)">output</text>
  <text x="74.42623" y="462.711864" font-size="12.783322" fill="var(--warn-accent)" font-family="Courier New, monospace">: "0"(a), "r"(b)</text>
  <text x="551.47541" y="462.711864" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--warn-accent)">inputs</text>
  <text x="74.42623" y="486.305085" font-size="12.783322" fill="var(--info-accent)" font-family="Courier New, monospace">: "cc"</text>
  <text x="551.47541" y="486.305085" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--info-accent)">clobbers</text>
  <text x="74.42623" y="505.966102" font-size="12.783322" fill="var(--primary-accent)" font-family="Courier New, monospace">);</text>
  <text x="74.42623" y="535.457627" font-size="11.799932" fill="var(--text-muted)" font-family="Courier New, monospace">/* %0=result, %1=a (same reg as result), %2=b */</text>
  <text x="74.42623" y="553.152542" font-size="11.799932" fill="var(--text-muted)" font-family="Courier New, monospace">/* "=r" write-only reg; "0" tied to operand 0 */</text>

  <!-- Right panel: constraints and clobbers -->
  <rect x="748.196721" y="40" width="491.803279" height="580" rx="6.400889" fill="var(--surface)"/>
  <rect x="748.196721" y="40" width="491.803279" height="43.254237" rx="6.400889" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="994.098361" y="67.525424" font-family="Arial, sans-serif" font-size="17.699952" font-weight="bold" fill="var(--bg)" text-anchor="middle">Constraints and Clobbers</text>

  <!-- Output constraints -->
  <rect x="767.868852" y="95.050847" width="452.459016" height="147.457627" rx="6.400889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.540984" y="118.644068" font-family="Arial, sans-serif" font-size="13.766605" font-weight="bold" fill="var(--primary-accent)">Output Constraint Modifiers</text>
  <text x="787.540984" y="142.237288" font-size="12.783322" fill="var(--primary-accent)" font-family="Courier New, monospace">=</text>
  <text x="817.04918" y="142.237288" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">write-only (output)</text>
  <text x="787.540984" y="163.864407" font-size="12.783322" fill="var(--primary-accent)" font-family="Courier New, monospace">+</text>
  <text x="817.04918" y="163.864407" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">read-write (in and out)</text>
  <text x="787.540984" y="185.491525" font-size="12.783322" fill="var(--primary-accent)" font-family="Courier New, monospace">&amp;</text>
  <text x="817.04918" y="185.491525" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">earlyclobber (written before inputs read)</text>
  <text x="787.540984" y="207.118644" font-size="12.783322" fill="var(--primary-accent)" font-family="Courier New, monospace">r</text>
  <text x="817.04918" y="207.118644" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">any general-purpose register</text>
  <text x="787.540984" y="228.745763" font-size="12.783322" fill="var(--primary-accent)" font-family="Courier New, monospace">m</text>
  <text x="817.04918" y="228.745763" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">memory operand</text>

  <!-- Input constraints -->
  <rect x="767.868852" y="256.271186" width="452.459016" height="127.79661" rx="6.400889" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.540984" y="279.864407" font-family="Arial, sans-serif" font-size="13.766605" font-weight="bold" fill="var(--warn-accent)">Input Constraints</text>
  <text x="787.540984" y="303.457627" font-size="12.783322" fill="var(--warn-accent)" font-family="Courier New, monospace">r</text>
  <text x="817.04918" y="303.457627" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">any register</text>
  <text x="787.540984" y="325.084746" font-size="12.783322" fill="var(--warn-accent)" font-family="Courier New, monospace">i</text>
  <text x="817.04918" y="325.084746" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">immediate integer constant</text>
  <text x="787.540984" y="346.711864" font-size="12.783322" fill="var(--warn-accent)" font-family="Courier New, monospace">0,1,2...</text>
  <text x="846.557377" y="346.711864" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">tied to matching output operand</text>
  <text x="787.540984" y="368.338983" font-size="12.783322" fill="var(--warn-accent)" font-family="Courier New, monospace">g</text>
  <text x="817.04918" y="368.338983" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">register, memory, or immediate</text>

  <!-- Clobbers -->
  <rect x="767.868852" y="397.830508" width="452.459016" height="127.79661" rx="6.400889" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.540984" y="421.423729" font-family="Arial, sans-serif" font-size="13.766605" font-weight="bold" fill="var(--danger-accent)">Common Clobbers</text>
  <text x="787.540984" y="445.016949" font-size="12.783322" fill="var(--danger-accent)" font-family="Courier New, monospace">"cc"</text>
  <text x="836.721311" y="445.016949" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">modifies condition codes (flags)</text>
  <text x="787.540984" y="466.644068" font-size="12.783322" fill="var(--danger-accent)" font-family="Courier New, monospace">"memory"</text>
  <text x="866.229508" y="466.644068" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">reads/writes arbitrary memory</text>
  <text x="787.540984" y="488.271186" font-size="12.783322" fill="var(--danger-accent)" font-family="Courier New, monospace">"%eax"</text>
  <text x="846.557377" y="488.271186" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">specific register clobbered</text>
  <text x="787.540984" y="509.898305" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-faint)">Tells GCC which resources are overwritten</text>

  <!-- volatile note -->
  <rect x="767.868852" y="539.389831" width="452.459016" height="58.983051" rx="6.400889" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.540984" y="562.000054" font-family="Arial, sans-serif" font-size="12.783322" font-weight="bold" fill="var(--info-accent)">volatile keyword</text>
  <text x="787.540984" y="583.627064" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">Prevents compiler from moving, duplicating, or removing the asm block</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <!-- Left: syntax diagram -->
  <rect x="40" y="40" width="688.52459" height="580" rx="6.400889" fill="var(--surface)" filter="url(#shadow)"/>

  <!-- Header -->
  <rect x="40" y="40" width="688.52459" height="43.254237" rx="6.400889" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="384.262295" y="67.525424" font-family="Arial, sans-serif" font-size="18.683235" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCC Inline Assembly Syntax</text>

  <!-- Full syntax template -->
  <rect x="59.672131" y="95.050847" width="649.180328" height="216.271186" rx="6.400889" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="74.42623" y="120.610169" font-family="monospace" font-size="13.766605" fill="var(--info-accent)">__asm__ volatile</text>
  <text x="74.42623" y="140.271186" font-family="monospace" font-size="13.766605" fill="var(--primary-accent)">(</text>
  <text x="89.180328" y="159.932203" font-family="monospace" font-size="13.766605" fill="var(--ok-accent)">"assembly template"</text>
  <text x="74.42623" y="179.59322" font-family="monospace" font-size="13.766605" fill="var(--primary-accent)">: output operands</text>
  <text x="74.42623" y="199.254237" font-family="monospace" font-size="13.766605" fill="var(--warn-accent)">: input operands</text>
  <text x="74.42623" y="218.915254" font-family="monospace" font-size="13.766605" fill="var(--info-accent)">: clobbers</text>
  <text x="74.42623" y="238.576271" font-family="monospace" font-size="13.766605" fill="var(--primary-accent)">);</text>
  <text x="74.42623" y="272" font-family="monospace" font-size="12.783322" fill="var(--text-muted)">/* Each section separated by colons */</text>
  <text x="74.42623" y="291.661017" font-family="monospace" font-size="12.783322" fill="var(--text-muted)">/* volatile = prevent reordering/removal */</text>

  <!-- Annotated real example -->
  <rect x="59.672131" y="325.084746" width="649.180328" height="255.59322" rx="6.400889" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="384.262295" y="349.661071" font-family="Arial, sans-serif" font-size="13.766605" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Example: add two integers</text>
  <text x="74.42623" y="376.20339" font-family="monospace" font-size="12.783322" fill="var(--info-accent)">__asm__ volatile</text>
  <text x="74.42623" y="395.864407" font-family="monospace" font-size="12.783322" fill="var(--primary-accent)">(</text>
  <text x="89.180328" y="415.525424" font-family="monospace" font-size="12.783322" fill="var(--ok-accent)">"addl %2, %0\n\t"</text>
  <text x="551.47541" y="415.525424" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-muted)">template</text>
  <text x="74.42623" y="439.118644" font-family="monospace" font-size="12.783322" fill="var(--primary-accent)">: "=r"(result)</text>
  <text x="551.47541" y="439.118644" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--primary-accent)">output</text>
  <text x="74.42623" y="462.711864" font-family="monospace" font-size="12.783322" fill="var(--warn-accent)">: "0"(a), "r"(b)</text>
  <text x="551.47541" y="462.711864" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--warn-accent)">inputs</text>
  <text x="74.42623" y="486.305085" font-family="monospace" font-size="12.783322" fill="var(--info-accent)">: "cc"</text>
  <text x="551.47541" y="486.305085" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--info-accent)">clobbers</text>
  <text x="74.42623" y="505.966102" font-family="monospace" font-size="12.783322" fill="var(--primary-accent)">);</text>
  <text x="74.42623" y="535.457627" font-family="monospace" font-size="11.799932" fill="var(--text-muted)">/* %0=result, %1=a (same reg as result), %2=b */</text>
  <text x="74.42623" y="553.152542" font-family="monospace" font-size="11.799932" fill="var(--text-muted)">/* "=r" write-only reg; "0" tied to operand 0 */</text>

  <!-- Right panel: constraints and clobbers -->
  <rect x="748.196721" y="40" width="491.803279" height="580" rx="6.400889" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="748.196721" y="40" width="491.803279" height="43.254237" rx="6.400889" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="994.098361" y="67.525424" font-family="Arial, sans-serif" font-size="17.699952" font-weight="bold" fill="var(--bg)" text-anchor="middle">Constraints and Clobbers</text>

  <!-- Output constraints -->
  <rect x="767.868852" y="95.050847" width="452.459016" height="147.457627" rx="6.400889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="787.540984" y="118.644068" font-family="Arial, sans-serif" font-size="13.766605" font-weight="bold" fill="var(--primary-accent)">Output Constraint Modifiers</text>
  <text x="787.540984" y="142.237288" font-family="monospace" font-size="12.783322" fill="var(--primary-accent)">=</text>
  <text x="817.04918" y="142.237288" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">write-only (output)</text>
  <text x="787.540984" y="163.864407" font-family="monospace" font-size="12.783322" fill="var(--primary-accent)">+</text>
  <text x="817.04918" y="163.864407" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">read-write (in and out)</text>
  <text x="787.540984" y="185.491525" font-family="monospace" font-size="12.783322" fill="var(--primary-accent)">&amp;</text>
  <text x="817.04918" y="185.491525" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">earlyclobber (written before inputs read)</text>
  <text x="787.540984" y="207.118644" font-family="monospace" font-size="12.783322" fill="var(--primary-accent)">r</text>
  <text x="817.04918" y="207.118644" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">any general-purpose register</text>
  <text x="787.540984" y="228.745763" font-family="monospace" font-size="12.783322" fill="var(--primary-accent)">m</text>
  <text x="817.04918" y="228.745763" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">memory operand</text>

  <!-- Input constraints -->
  <rect x="767.868852" y="256.271186" width="452.459016" height="127.79661" rx="6.400889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="787.540984" y="279.864407" font-family="Arial, sans-serif" font-size="13.766605" font-weight="bold" fill="var(--warn-accent)">Input Constraints</text>
  <text x="787.540984" y="303.457627" font-family="monospace" font-size="12.783322" fill="var(--warn-accent)">r</text>
  <text x="817.04918" y="303.457627" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">any register</text>
  <text x="787.540984" y="325.084746" font-family="monospace" font-size="12.783322" fill="var(--warn-accent)">i</text>
  <text x="817.04918" y="325.084746" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">immediate integer constant</text>
  <text x="787.540984" y="346.711864" font-family="monospace" font-size="12.783322" fill="var(--warn-accent)">0,1,2...</text>
  <text x="846.557377" y="346.711864" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">tied to matching output operand</text>
  <text x="787.540984" y="368.338983" font-family="monospace" font-size="12.783322" fill="var(--warn-accent)">g</text>
  <text x="817.04918" y="368.338983" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">register, memory, or immediate</text>

  <!-- Clobbers -->
  <rect x="767.868852" y="397.830508" width="452.459016" height="127.79661" rx="6.400889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="787.540984" y="421.423729" font-family="Arial, sans-serif" font-size="13.766605" font-weight="bold" fill="var(--danger-accent)">Common Clobbers</text>
  <text x="787.540984" y="445.016949" font-family="monospace" font-size="12.783322" fill="var(--danger-accent)">"cc"</text>
  <text x="836.721311" y="445.016949" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">modifies condition codes (flags)</text>
  <text x="787.540984" y="466.644068" font-family="monospace" font-size="12.783322" fill="var(--danger-accent)">"memory"</text>
  <text x="866.229508" y="466.644068" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">reads/writes arbitrary memory</text>
  <text x="787.540984" y="488.271186" font-family="monospace" font-size="12.783322" fill="var(--danger-accent)">"%eax"</text>
  <text x="846.557377" y="488.271186" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">specific register clobbered</text>
  <text x="787.540984" y="509.898305" font-family="Arial, sans-serif" font-size="11.799932" fill="var(--text-faint)">Tells GCC which resources are overwritten</text>

  <!-- volatile note -->
  <rect x="767.868852" y="539.389831" width="452.459016" height="58.983051" rx="6.400889" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="787.540984" y="562.000054" font-family="Arial, sans-serif" font-size="12.783322" font-weight="bold" fill="var(--info-accent)">volatile keyword</text>
  <text x="787.540984" y="583.627064" font-family="Arial, sans-serif" font-size="12.783322" fill="var(--text)">Prevents compiler from moving, duplicating, or removing the asm block</text>
</svg>

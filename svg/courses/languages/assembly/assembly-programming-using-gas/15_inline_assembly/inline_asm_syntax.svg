<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Left: syntax diagram -->
  <rect x="30" y="20" width="700" height="590" rx="8" fill="url(#grad-surface)" filter="url(#shadow)"/>

  <!-- Header -->
  <rect x="30" y="20" width="700" height="44" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="380" y="48" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCC Inline Assembly Syntax</text>

  <!-- Full syntax template -->
  <rect x="50" y="76" width="660" height="220" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="65" y="102" font-family="monospace" font-size="14" fill="var(--info-tint)">__asm__ volatile</text>
  <text x="65" y="122" font-family="monospace" font-size="14" fill="var(--primary-lt)">(</text>
  <text x="80" y="142" font-family="monospace" font-size="14" fill="var(--ok-tint)">"assembly template"</text>
  <text x="65" y="162" font-family="monospace" font-size="14" fill="var(--primary-tint)">: output operands</text>
  <text x="65" y="182" font-family="monospace" font-size="14" fill="var(--warn-lt)">: input operands</text>
  <text x="65" y="202" font-family="monospace" font-size="14" fill="var(--info-lt)">: clobbers</text>
  <text x="65" y="222" font-family="monospace" font-size="14" fill="var(--primary-lt)">);</text>
  <text x="65" y="256" font-family="monospace" font-size="13" fill="var(--text-lighter)">/* Each section separated by colons */</text>
  <text x="65" y="276" font-family="monospace" font-size="13" fill="var(--text-lighter)">/* volatile = prevent reordering/removal */</text>

  <!-- Annotated real example -->
  <rect x="50" y="310" width="660" height="260" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="380" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-lt)" text-anchor="middle">Example: add two integers</text>
  <text x="65" y="362" font-family="monospace" font-size="13" fill="var(--info-tint)">__asm__ volatile</text>
  <text x="65" y="382" font-family="monospace" font-size="13" fill="var(--primary-lt)">(</text>
  <text x="80" y="402" font-family="monospace" font-size="13" fill="var(--ok-tint)">"addl %2, %0\n\t"</text>
  <text x="550" y="402" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">template</text>
  <text x="65" y="426" font-family="monospace" font-size="13" fill="var(--primary-tint)">: "=r"(result)</text>
  <text x="550" y="426" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-tint)">output</text>
  <text x="65" y="450" font-family="monospace" font-size="13" fill="var(--warn-lt)">: "0"(a), "r"(b)</text>
  <text x="550" y="450" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-lt)">inputs</text>
  <text x="65" y="474" font-family="monospace" font-size="13" fill="var(--info-lt)">: "cc"</text>
  <text x="550" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--info-lt)">clobbers</text>
  <text x="65" y="494" font-family="monospace" font-size="13" fill="var(--primary-lt)">);</text>
  <text x="65" y="524" font-family="monospace" font-size="12" fill="var(--text-lighter)">/* %0=result, %1=a (same reg as result), %2=b */</text>
  <text x="65" y="542" font-family="monospace" font-size="12" fill="var(--text-lighter)">/* "=r" write-only reg; "0" tied to operand 0 */</text>

  <!-- Right panel: constraints and clobbers -->
  <rect x="750" y="20" width="500" height="590" rx="8" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <rect x="750" y="20" width="500" height="44" rx="8" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="1000" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Constraints and Clobbers</text>

  <!-- Output constraints -->
  <rect x="770" y="76" width="460" height="150" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="790" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)">Output Constraint Modifiers</text>
  <text x="790" y="124" font-family="monospace" font-size="13" fill="var(--primary-dk)">=</text>
  <text x="820" y="124" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">write-only (output)</text>
  <text x="790" y="146" font-family="monospace" font-size="13" fill="var(--primary-dk)">+</text>
  <text x="820" y="146" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">read-write (in and out)</text>
  <text x="790" y="168" font-family="monospace" font-size="13" fill="var(--primary-dk)">&amp;</text>
  <text x="820" y="168" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">earlyclobber (written before inputs read)</text>
  <text x="790" y="190" font-family="monospace" font-size="13" fill="var(--primary-dk)">r</text>
  <text x="820" y="190" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">any general-purpose register</text>
  <text x="790" y="212" font-family="monospace" font-size="13" fill="var(--primary-dk)">m</text>
  <text x="820" y="212" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">memory operand</text>

  <!-- Input constraints -->
  <rect x="770" y="240" width="460" height="130" rx="6" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="790" y="264" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-mid)">Input Constraints</text>
  <text x="790" y="288" font-family="monospace" font-size="13" fill="var(--warn-mid)">r</text>
  <text x="820" y="288" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">any register</text>
  <text x="790" y="310" font-family="monospace" font-size="13" fill="var(--warn-mid)">i</text>
  <text x="820" y="310" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">immediate integer constant</text>
  <text x="790" y="332" font-family="monospace" font-size="13" fill="var(--warn-mid)">0,1,2...</text>
  <text x="850" y="332" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">tied to matching output operand</text>
  <text x="790" y="354" font-family="monospace" font-size="13" fill="var(--warn-mid)">g</text>
  <text x="820" y="354" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">register, memory, or immediate</text>

  <!-- Clobbers -->
  <rect x="770" y="384" width="460" height="130" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="790" y="408" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-dk)">Common Clobbers</text>
  <text x="790" y="432" font-family="monospace" font-size="13" fill="var(--danger-dk)">"cc"</text>
  <text x="840" y="432" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">modifies condition codes (flags)</text>
  <text x="790" y="454" font-family="monospace" font-size="13" fill="var(--danger-dk)">"memory"</text>
  <text x="870" y="454" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">reads/writes arbitrary memory</text>
  <text x="790" y="476" font-family="monospace" font-size="13" fill="var(--danger-dk)">"%eax"</text>
  <text x="850" y="476" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">specific register clobbered</text>
  <text x="790" y="498" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Tells GCC which resources are overwritten</text>

  <!-- volatile note -->
  <rect x="770" y="528" width="460" height="60" rx="6" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.5"/>
  <text x="790" y="551" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-dk)">volatile keyword</text>
  <text x="790" y="573" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Prevents compiler from moving, duplicating, or removing the asm block</text>
</svg>

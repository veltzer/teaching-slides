<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Left: syntax diagram -->
  <rect x="30" y="20" width="700" height="590" rx="6" fill="var(--surface)" filter="url(#shadow)"/>

  <!-- Header -->
  <rect x="30" y="20" width="700" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="380" y="48" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="var(--bg)" text-anchor="middle">GCC Inline Assembly Syntax</text>

  <!-- Full syntax template -->
  <rect x="50" y="76" width="660" height="220" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="65" y="102" font-family="monospace" font-size="14" fill="var(--info-accent)">__asm__ volatile</text>
  <text x="65" y="122" font-family="monospace" font-size="14" fill="var(--primary-accent)">(</text>
  <text x="80" y="142" font-family="monospace" font-size="14" fill="var(--ok-accent)">"assembly template"</text>
  <text x="65" y="162" font-family="monospace" font-size="14" fill="var(--primary-accent)">: output operands</text>
  <text x="65" y="182" font-family="monospace" font-size="14" fill="var(--warn-accent)">: input operands</text>
  <text x="65" y="202" font-family="monospace" font-size="14" fill="var(--info-accent)">: clobbers</text>
  <text x="65" y="222" font-family="monospace" font-size="14" fill="var(--primary-accent)">);</text>
  <text x="65" y="256" font-family="monospace" font-size="13" fill="var(--text-muted)">/* Each section separated by colons */</text>
  <text x="65" y="276" font-family="monospace" font-size="13" fill="var(--text-muted)">/* volatile = prevent reordering/removal */</text>

  <!-- Annotated real example -->
  <rect x="50" y="310" width="660" height="260" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="380" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Example: add two integers</text>
  <text x="65" y="362" font-family="monospace" font-size="13" fill="var(--info-accent)">__asm__ volatile</text>
  <text x="65" y="382" font-family="monospace" font-size="13" fill="var(--primary-accent)">(</text>
  <text x="80" y="402" font-family="monospace" font-size="13" fill="var(--ok-accent)">"addl %2, %0\n\t"</text>
  <text x="550" y="402" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">template</text>
  <text x="65" y="426" font-family="monospace" font-size="13" fill="var(--primary-accent)">: "=r"(result)</text>
  <text x="550" y="426" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">output</text>
  <text x="65" y="450" font-family="monospace" font-size="13" fill="var(--warn-accent)">: "0"(a), "r"(b)</text>
  <text x="550" y="450" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)">inputs</text>
  <text x="65" y="474" font-family="monospace" font-size="13" fill="var(--info-accent)">: "cc"</text>
  <text x="550" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)">clobbers</text>
  <text x="65" y="494" font-family="monospace" font-size="13" fill="var(--primary-accent)">);</text>
  <text x="65" y="524" font-family="monospace" font-size="12" fill="var(--text-muted)">/* %0=result, %1=a (same reg as result), %2=b */</text>
  <text x="65" y="542" font-family="monospace" font-size="12" fill="var(--text-muted)">/* "=r" write-only reg; "0" tied to operand 0 */</text>

  <!-- Right panel: constraints and clobbers -->
  <rect x="750" y="20" width="500" height="590" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="750" y="20" width="500" height="44" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1000" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Constraints and Clobbers</text>

  <!-- Output constraints -->
  <rect x="770" y="76" width="460" height="150" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="790" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">Output Constraint Modifiers</text>
  <text x="790" y="124" font-family="monospace" font-size="13" fill="var(--primary-accent)">=</text>
  <text x="820" y="124" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">write-only (output)</text>
  <text x="790" y="146" font-family="monospace" font-size="13" fill="var(--primary-accent)">+</text>
  <text x="820" y="146" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">read-write (in and out)</text>
  <text x="790" y="168" font-family="monospace" font-size="13" fill="var(--primary-accent)">&amp;</text>
  <text x="820" y="168" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">earlyclobber (written before inputs read)</text>
  <text x="790" y="190" font-family="monospace" font-size="13" fill="var(--primary-accent)">r</text>
  <text x="820" y="190" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">any general-purpose register</text>
  <text x="790" y="212" font-family="monospace" font-size="13" fill="var(--primary-accent)">m</text>
  <text x="820" y="212" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">memory operand</text>

  <!-- Input constraints -->
  <rect x="770" y="240" width="460" height="130" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="790" y="264" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">Input Constraints</text>
  <text x="790" y="288" font-family="monospace" font-size="13" fill="var(--warn-accent)">r</text>
  <text x="820" y="288" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">any register</text>
  <text x="790" y="310" font-family="monospace" font-size="13" fill="var(--warn-accent)">i</text>
  <text x="820" y="310" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">immediate integer constant</text>
  <text x="790" y="332" font-family="monospace" font-size="13" fill="var(--warn-accent)">0,1,2...</text>
  <text x="850" y="332" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">tied to matching output operand</text>
  <text x="790" y="354" font-family="monospace" font-size="13" fill="var(--warn-accent)">g</text>
  <text x="820" y="354" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">register, memory, or immediate</text>

  <!-- Clobbers -->
  <rect x="770" y="384" width="460" height="130" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="790" y="408" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)">Common Clobbers</text>
  <text x="790" y="432" font-family="monospace" font-size="13" fill="var(--danger-accent)">"cc"</text>
  <text x="840" y="432" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">modifies condition codes (flags)</text>
  <text x="790" y="454" font-family="monospace" font-size="13" fill="var(--danger-accent)">"memory"</text>
  <text x="870" y="454" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">reads/writes arbitrary memory</text>
  <text x="790" y="476" font-family="monospace" font-size="13" fill="var(--danger-accent)">"%eax"</text>
  <text x="850" y="476" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">specific register clobbered</text>
  <text x="790" y="498" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Tells GCC which resources are overwritten</text>

  <!-- volatile note -->
  <rect x="770" y="528" width="460" height="60" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="790" y="551" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-accent)">volatile keyword</text>
  <text x="790" y="573" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Prevents compiler from moving, duplicating, or removing the asm block</text>
</svg>

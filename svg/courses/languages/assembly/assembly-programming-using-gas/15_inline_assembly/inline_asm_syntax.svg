<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="690" height="580" rx="10.316104805042" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="55" y="55.963302752294" width="660" height="223.48623853211" rx="8.252883844034" fill="var(--code-bg)"/>
  <text x="75" y="93.211009174312" font-family="Courier New, monospace" font-size="15.474157207564" fill="var(--info-text)">__asm__ volatile</text>
  <text x="75" y="119.816513761468" font-family="Courier New, monospace" font-size="15.474157207564" fill="var(--primary-text)">(</text>
  <text x="90" y="146.422018348624" font-family="Courier New, monospace" font-size="15.474157207564" fill="var(--ok-text)">"assembly template"</text>
  <text x="75" y="173.027522935779" font-family="Courier New, monospace" font-size="15.474157207564" fill="var(--primary-text)">: output operands</text>
  <text x="75" y="199.633027522935" font-family="Courier New, monospace" font-size="15.474157207564" fill="var(--warn-text)">: input operands</text>
  <text x="75" y="226.238532110092" font-family="Courier New, monospace" font-size="15.474157207564" fill="var(--info-text)">: clobbers</text>
  <text x="75" y="252.844036697248" font-family="Courier New, monospace" font-size="15.474157207564" fill="var(--primary-text)">);</text>

  <rect x="55" y="295.412844036698" width="660" height="308.62385321101" rx="8.252883844034" fill="var(--code-bg)"/>
  <text x="385" y="327.339449541284" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.474157207564" font-weight="bold" fill="var(--bg)">Example: add</text>
  <text x="75" y="359.266055045872" font-family="Courier New, monospace" font-size="14.442546727059" fill="var(--info-text)">__asm__ volatile</text>
  <text x="75" y="383.743119266055" font-family="Courier New, monospace" font-size="14.442546727059" fill="var(--primary-text)">(</text>
  <text x="90" y="408.220183486239" font-family="Courier New, monospace" font-size="14.442546727059" fill="var(--ok-text)">"addl %2, %0"</text>
  <text x="75" y="439.082568807339" font-family="Courier New, monospace" font-size="14.442546727059" fill="var(--primary-text)">: "=r"(result)</text>
  <text x="500" y="439.082568807339" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--primary-text)">output</text>
  <text x="75" y="468.880733944955" font-family="Courier New, monospace" font-size="14.442546727059" fill="var(--warn-text)">: "0"(a), "r"(b)</text>
  <text x="500" y="468.880733944955" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--warn-text)">inputs</text>
  <text x="75" y="498.678899082569" font-family="Courier New, monospace" font-size="14.442546727059" fill="var(--info-text)">: "cc"</text>
  <text x="500" y="498.678899082569" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--info-text)">clobbers</text>
  <text x="75" y="528.477064220183" font-family="Courier New, monospace" font-size="14.442546727059" fill="var(--primary-text)">);</text>

  <rect x="750" y="40" width="490" height="180.917431192661" rx="10.316104805042" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="71.926605504587" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--primary-text)">Output Modifiers</text>
  <text x="770" y="103.853211009174" font-family="Courier New, monospace" font-size="13.410936246555" fill="var(--primary-text)">=  write-only</text>
  <text x="770" y="130.458715596331" font-family="Courier New, monospace" font-size="13.410936246555" fill="var(--primary-text)">+  read-write</text>
  <text x="770" y="157.064220183487" font-family="Courier New, monospace" font-size="13.410936246555" fill="var(--primary-text)">&amp;  earlyclobber</text>
  <text x="770" y="183.669724770643" font-family="Courier New, monospace" font-size="13.410936246555" fill="var(--primary-text)">r  register</text>
  <text x="770" y="208.146788990825" font-family="Courier New, monospace" font-size="13.410936246555" fill="var(--primary-text)">m  memory</text>

  <rect x="750" y="236.880733944954" width="490" height="159.633027522935" rx="10.316104805042" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="268.807339449541" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--warn-text)">Input Constraints</text>
  <text x="770" y="298.605504587156" font-family="Courier New, monospace" font-size="13.410936246555" fill="var(--warn-text)">r  any register</text>
  <text x="770" y="325.211009174312" font-family="Courier New, monospace" font-size="13.410936246555" fill="var(--warn-text)">i  immediate</text>
  <text x="770" y="351.816513761468" font-family="Courier New, monospace" font-size="13.410936246555" fill="var(--warn-text)">0,1,2  tied</text>
  <text x="770" y="378.422018348624" font-family="Courier New, monospace" font-size="13.410936246555" fill="var(--warn-text)">g  any</text>

  <rect x="750" y="412.477064220183" width="490" height="138.348623853211" rx="10.316104805042" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="444.403669724771" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--danger-text)">Clobbers</text>
  <text x="770" y="474.201834862385" font-family="Courier New, monospace" font-size="13.410936246555" fill="var(--danger-text)">"cc"      flags</text>
  <text x="770" y="500.807339449541" font-family="Courier New, monospace" font-size="13.410936246555" fill="var(--danger-text)">"memory"  memory</text>
  <text x="770" y="527.412844036697" font-family="Courier New, monospace" font-size="13.410936246555" fill="var(--danger-text)">"%eax"    reg</text>

  <rect x="750" y="566.788990825688" width="490" height="47.889908256881" rx="10.316104805042" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995" y="596.587155963303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.442546727059" fill="var(--info-text)">volatile: no reorder/remove</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <text x="130" y="127" font-family="monospace" font-size="19.1186" fill="var(--primary-accent)">.section .text</text>
  <text x="130" y="163.25" font-family="monospace" font-size="19.1186" fill="var(--ok-accent)">.globl _start</text>
  <text x="130" y="206.75" font-family="monospace" font-size="19.1186" fill="var(--warn-accent)">_start:</text>
  <text x="175" y="243" font-family="monospace" font-size="19.1186" fill="var(--danger-accent)">movl</text>
  <text x="257.5" y="243" font-family="monospace" font-size="19.1186" fill="var(--bg)">$0x1, %eax</text>
  <text x="175" y="279.25" font-family="monospace" font-size="19.1186" fill="var(--danger-accent)">movl</text>
  <text x="257.5" y="279.25" font-family="monospace" font-size="19.1186" fill="var(--bg)">$0x0, %ebx</text>
  <text x="175" y="315.5" font-family="monospace" font-size="19.1186" fill="var(--danger-accent)">int</text>
  <text x="235" y="315.5" font-family="monospace" font-size="19.1186" fill="var(--bg)">$0x80</text>
  <rect x="715" y="112.5" width="420" height="290" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.6667" />
  <text x="835" y="152.7777" font-family="monospace" font-size="21.7257" fill="var(--primary-accent)" font-weight="bold">Registers</text>
  <text x="744.9999" y="199.5" font-family="monospace" font-size="17.3806" fill="var(--warn-accent)">%eax</text>
  <rect x="835" y="177.75" width="270" height="29" rx="6" fill="var(--primary-accent)" />
  <text x="850" y="199.5" font-family="monospace" font-size="15.6425" fill="var(--danger-accent)">0x00000001</text>
  <text x="744.9999" y="243" font-family="monospace" font-size="17.3806" fill="var(--warn-accent)">%ebx</text>
  <rect x="835" y="221.25" width="270" height="29" rx="6" fill="var(--primary-accent)" />
  <text x="850" y="243" font-family="monospace" font-size="15.6425" fill="var(--danger-accent)">0x00000000</text>
  <text x="744.9999" y="286.5" font-family="monospace" font-size="17.3806" fill="var(--warn-accent)">%ecx</text>
  <rect x="835" y="264.75" width="270" height="29" rx="6" fill="var(--primary-accent)" />
  <text x="850" y="286.5" font-family="monospace" font-size="15.6425" fill="var(--danger-accent)">0xFFFFFFFF</text>
  <text x="744.9999" y="330" font-family="monospace" font-size="17.3806" fill="var(--warn-accent)">%esp</text>
  <rect x="835" y="308.25" width="270" height="29" rx="6" fill="var(--primary-accent)" />
  <text x="850" y="330" font-family="monospace" font-size="15.6425" fill="var(--danger-accent)">0xBFFF0000</text>
  <text x="744.9999" y="373.5" font-family="monospace" font-size="17.3806" fill="var(--warn-accent)">%eip</text>
  <rect x="835" y="351.75" width="270" height="29" rx="6" fill="var(--primary-accent)" />
  <text x="850" y="373.5" font-family="monospace" font-size="15.6425" fill="var(--danger-accent)">0x08048054</text>
  <rect x="790" y="446" width="299.9999" height="90.2223" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="2.6667" />
  <text x="872.4999" y="482.25" font-family="monospace" font-size="19.1186" fill="var(--ok-accent)" font-weight="bold">Stack</text>
  <line x1="820" y1="496.75" x2="1060" y2="496.75" stroke="var(--primary-border)" stroke-width="1.3333" />
  <line x1="820" y1="520.9167" x2="1060" y2="520.9167" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="190" y="458.8889" font-family="monospace" font-size="55.6178" fill="var(--danger-accent)" font-weight="bold" opacity="0.3">GAS</text>
  <text x="130" y="539.4444" font-family="monospace" font-size="15.6425" fill="var(--primary-accent)">01001000 01100101 01101100 01101100 01101111</text>
</svg>
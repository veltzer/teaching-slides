<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--code-bg)" rx="6"/>
  <text x="85.3333" y="96" font-family="monospace" font-size="19.5556" fill="var(--primary-accent)">.section .text</text>
  <text x="85.3333" y="136" font-family="monospace" font-size="19.5556" fill="var(--ok-accent)">.globl _start</text>
  <text x="85.3333" y="184" font-family="monospace" font-size="19.5556" fill="var(--warn-accent)">_start:</text>
  <text x="128" y="224" font-family="monospace" font-size="19.5556" fill="var(--danger-accent)">movl</text>
  <text x="206.2222" y="224" font-family="monospace" font-size="19.5556" fill="var(--bg)">$0x1, %eax</text>
  <text x="128" y="264" font-family="monospace" font-size="19.5556" fill="var(--danger-accent)">movl</text>
  <text x="206.2222" y="264" font-family="monospace" font-size="19.5556" fill="var(--bg)">$0x0, %ebx</text>
  <text x="128" y="304" font-family="monospace" font-size="19.5556" fill="var(--danger-accent)">int</text>
  <text x="184.8889" y="304" font-family="monospace" font-size="19.5556" fill="var(--bg)">$0x80</text>
  <rect x="640" y="80" width="398.2222" height="320" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.6667" />
  <text x="753.7778" y="124.4444" font-family="monospace" font-size="22.2222" fill="var(--primary-accent)" font-weight="bold">Registers</text>
  <text x="668.4444" y="176" font-family="monospace" font-size="17.7778" fill="var(--warn-accent)">%eax</text>
  <rect x="753.7778" y="152" width="256" height="32" rx="6" fill="var(--primary-accent)" />
  <text x="768" y="176" font-family="monospace" font-size="16" fill="var(--danger-accent)">0x00000001</text>
  <text x="668.4444" y="224" font-family="monospace" font-size="17.7778" fill="var(--warn-accent)">%ebx</text>
  <rect x="753.7778" y="200" width="256" height="32" rx="6" fill="var(--primary-accent)" />
  <text x="768" y="224" font-family="monospace" font-size="16" fill="var(--danger-accent)">0x00000000</text>
  <text x="668.4444" y="272" font-family="monospace" font-size="17.7778" fill="var(--warn-accent)">%ecx</text>
  <rect x="753.7778" y="248" width="256" height="32" rx="6" fill="var(--primary-accent)" />
  <text x="768" y="272" font-family="monospace" font-size="16" fill="var(--danger-accent)">0xFFFFFFFF</text>
  <text x="668.4444" y="320" font-family="monospace" font-size="17.7778" fill="var(--warn-accent)">%esp</text>
  <rect x="753.7778" y="296" width="256" height="32" rx="6" fill="var(--primary-accent)" />
  <text x="768" y="320" font-family="monospace" font-size="16" fill="var(--danger-accent)">0xBFFF0000</text>
  <text x="668.4444" y="368" font-family="monospace" font-size="17.7778" fill="var(--warn-accent)">%eip</text>
  <rect x="753.7778" y="344" width="256" height="32" rx="6" fill="var(--primary-accent)" />
  <text x="768" y="368" font-family="monospace" font-size="16" fill="var(--danger-accent)">0x08048054</text>
  <rect x="711.1111" y="448" width="284.4444" height="99.5556" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="2.6667" />
  <text x="789.3333" y="488" font-family="monospace" font-size="19.5556" fill="var(--ok-accent)" font-weight="bold">Stack</text>
  <line x1="739.5556" y1="504" x2="967.1111" y2="504" stroke="var(--primary-border)" stroke-width="1.3333" />
  <line x1="739.5556" y1="530.6667" x2="967.1111" y2="530.6667" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="142.2222" y="462.2222" font-family="monospace" font-size="56.8889" fill="var(--danger-accent)" font-weight="bold" opacity="0.3">GAS</text>
  <text x="85.3333" y="551.1111" font-family="monospace" font-size="16" fill="var(--primary-accent)">01001000 01100101 01101100 01101100 01101111</text>
</svg>
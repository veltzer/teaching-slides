<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <!-- Source code panel -->
  <rect x="40" y="40" width="511.475425" height="580" rx="6.455833" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="285.901596" y="70" font-family="Arial, sans-serif" font-size="15.868329" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">hello.s (GAS source)</text>

  <!-- .data section highlight -->
  <rect x="49.836064" y="80" width="491.803088" height="109.99989" rx="6.455833" fill="var(--text)"/>
  <text x="64.59016" y="102.999945" font-family="monospace" font-size="12.893159" fill="var(--primary-accent)">.section .data</text>
  <text x="64.59016" y="126" font-family="monospace" font-size="12.893159" fill="var(--ok-accent)">msg: .ascii "Hello, World!\n"</text>
  <text x="64.59016" y="148.999945" font-family="monospace" font-size="12.893159" fill="var(--ok-accent)">len: .long . - msg</text>
  <text x="64.59016" y="172" font-family="monospace" font-size="12.491283" fill="var(--text-muted)"># current loc minus msg start</text>

  <!-- .text section highlight -->
  <rect x="49.836064" y="200.00011" width="491.803088" height="80" rx="6.455833" fill="var(--text)"/>
  <text x="64.59016" y="223.000055" font-family="monospace" font-size="12.893159" fill="var(--primary-accent)">.section .text</text>
  <text x="64.59016" y="245.99989" font-family="monospace" font-size="12.893159" fill="var(--info-accent)">.globl _start</text>
  <text x="64.59016" y="268.999945" font-family="monospace" font-size="12.491283" fill="var(--text-muted)"># exported entry point</text>

  <!-- _start / syscall sequence -->
  <rect x="49.836064" y="288" width="491.803088" height="200.00011" rx="6.455833" fill="var(--code-bg)"/>
  <text x="64.59016" y="310.999945" font-family="monospace" font-size="12.893159" fill="var(--info-accent)">_start:</text>
  <text x="64.59016" y="334" font-family="monospace" font-size="12.893159" fill="var(--primary-accent)">  movl $4, %eax    <tspan fill="var(--text-muted)"># sys_write</tspan></text>
  <text x="64.59016" y="356.999945" font-family="monospace" font-size="12.893159" fill="var(--primary-accent)">  movl $1, %ebx    <tspan fill="var(--text-muted)"># stdout fd=1</tspan></text>
  <text x="64.59016" y="380" font-family="monospace" font-size="12.893159" fill="var(--primary-accent)">  movl $msg, %ecx  <tspan fill="var(--text-muted)"># buffer addr</tspan></text>
  <text x="64.59016" y="403.000055" font-family="monospace" font-size="12.893159" fill="var(--primary-accent)">  movl len, %edx   <tspan fill="var(--text-muted)"># byte count</tspan></text>
  <text x="64.59016" y="426" font-family="monospace" font-size="12.893159" fill="var(--warn-accent)">  int $0x80        <tspan fill="var(--text-muted)"># kernel call</tspan></text>
  <text x="64.59016" y="452" font-family="monospace" font-size="12.893159" fill="var(--primary-accent)">  movl $1, %eax    <tspan fill="var(--text-muted)"># sys_exit</tspan></text>
  <text x="64.59016" y="475.000055" font-family="monospace" font-size="12.893159" fill="var(--primary-accent)">  movl $0, %ebx    <tspan fill="var(--text-muted)"># exit code 0</tspan></text>
  <text x="64.59016" y="498" font-family="monospace" font-size="12.893159" fill="var(--warn-accent)">  int $0x80        <tspan fill="var(--text-muted)"># kernel call</tspan></text>

  <!-- Annotation panel -->
  <rect x="580.983617" y="40" width="659.016383" height="580" rx="6.455833" fill="var(--surface)" filter="url(#shadow)"/>

  <!-- Sections legend header -->
  <rect x="600.65564" y="55.000166" width="619.672023" height="36.00011" rx="6.455833" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="910.491651" y="77.99989" font-family="Arial, sans-serif" font-size="16.86016" font-weight="bold" fill="var(--bg)" text-anchor="middle">ELF / GAS Program Anatomy</text>

  <!-- .data box -->
  <rect x="600.65564" y="104.999945" width="275.409893" height="109.99989" rx="6.455833" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="738.360534" y="129.99989" font-family="Arial, sans-serif" font-size="15.868329" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">.data Section</text>
  <text x="615.409735" y="152.999834" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">- Initialized data (read-write)</text>
  <text x="615.409735" y="172.999945" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">- Strings, constants, variables</text>
  <text x="615.409735" y="192.999834" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">- Stored in ELF data segment</text>

  <!-- .text box -->
  <rect x="600.65564" y="230" width="275.409893" height="109.99989" rx="6.455833" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="738.360534" y="254.999945" font-family="Arial, sans-serif" font-size="15.868329" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">.text Section</text>
  <text x="615.409735" y="277.99989" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">- Executable instructions</text>
  <text x="615.409735" y="297.99989" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">- Read-only in ELF</text>
  <text x="615.409735" y="318" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">- .globl exports _start label</text>

  <!-- Labels box -->
  <rect x="600.65564" y="355.000166" width="275.409893" height="90" rx="6.455833" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="738.360534" y="380" font-family="Arial, sans-serif" font-size="15.868329" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Labels</text>
  <text x="615.409735" y="403.000055" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">- Symbolic addresses (msg, _start)</text>
  <text x="615.409735" y="423.000055" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">- Resolved by assembler/linker</text>

  <!-- Syscall box -->
  <rect x="905.573724" y="104.999945" width="314.754148" height="200.00011" rx="6.455833" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1062.950641" y="129.99989" font-family="Arial, sans-serif" font-size="15.868329" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Syscall Sequence (int 0x80)</text>
  <text x="920.32782" y="155.99989" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">Register  Purpose</text>
  <line x1="920.32782" y1="162.999945" x2="1210.491704" y2="162.999945" stroke="var(--info-border)" stroke-width="1"/>
  <text x="920.32782" y="182.999945" font-family="monospace" font-size="12.893159" fill="var(--info-accent)">%eax</text>
  <text x="984.26234" y="182.999945" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">syscall number (4=write, 1=exit)</text>
  <text x="920.32782" y="207.99989" font-family="monospace" font-size="12.893159" fill="var(--info-accent)">%ebx</text>
  <text x="984.26234" y="207.99989" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">arg1 (fd=1 for stdout)</text>
  <text x="920.32782" y="232.999834" font-family="monospace" font-size="12.893159" fill="var(--info-accent)">%ecx</text>
  <text x="984.26234" y="232.999834" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">arg2 (buffer address)</text>
  <text x="920.32782" y="257.99989" font-family="monospace" font-size="12.893159" fill="var(--info-accent)">%edx</text>
  <text x="984.26234" y="257.99989" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">arg3 (byte count)</text>
  <text x="920.32782" y="283.000055" font-family="monospace" font-size="12.893159" fill="var(--warn-accent)">int $0x80</text>
  <text x="1013.770426" y="283.000055" font-family="Arial, sans-serif" font-size="12.893159" fill="var(--text)">transfers control to kernel</text>

  <!-- ELF structure box -->
  <rect x="905.573724" y="319.99989" width="314.754148" height="200.00011" rx="6.455833" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1062.950641" y="344.999834" font-family="Arial, sans-serif" font-size="15.868329" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">ELF Output Structure</text>
  <!-- ELF mini diagram -->
  <rect x="1003.934258" y="358.00011" width="196.721172" height="27.99989" rx="6.455833" fill="var(--primary-accent)"/>
  <text x="1102.295001" y="376.999945" font-family="monospace" font-size="12.491283" fill="var(--bg)" text-anchor="middle">ELF Header</text>
  <rect x="1003.934258" y="390" width="196.721172" height="27.99989" rx="6.455833" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1102.295001" y="408.999945" font-family="monospace" font-size="12.491283" fill="var(--bg)" text-anchor="middle">.text segment</text>
  <rect x="1003.934258" y="422" width="196.721172" height="27.99989" rx="6.455833" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1102.295001" y="440.999834" font-family="monospace" font-size="12.491283" fill="var(--bg)" text-anchor="middle">.data segment</text>
  <rect x="1003.934258" y="454.00011" width="196.721172" height="27.99989" rx="6.455833" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1102.295001" y="472.999945" font-family="monospace" font-size="12.491283" fill="var(--bg)" text-anchor="middle">Section headers</text>
  <text x="920.32782" y="508" font-family="Arial, sans-serif" font-size="12.491283" fill="var(--text-muted)">Produced by ld linker from .o object file</text>

  <!-- Build command -->
  <rect x="600.65564" y="464.999945" width="599.999895" height="60" rx="6.455833" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="615.409735" y="488" font-family="monospace" font-size="12.893159" fill="var(--primary-accent)">as -o hello.o hello.s</text>
  <text x="615.409735" y="512.999945" font-family="monospace" font-size="12.893159" fill="var(--primary-accent)">ld -o hello hello.o   <tspan fill="var(--text-muted)"># or: gcc -nostdlib -o hello hello.s</tspan></text>

  <!-- Run command -->
  <rect x="600.65564" y="540" width="599.999895" height="50" rx="6.455833" fill="var(--black)" filter="url(#shadow)"/>
  <text x="615.409735" y="563.000166" font-family="monospace" font-size="12.893159" fill="var(--ok-accent)">$ ./hello</text>
  <text x="748.196597" y="563.000166" font-family="monospace" font-size="12.893159" fill="var(--info-accent)">Hello, World!</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Source code panel -->
  <rect x="68.1249" y="58.125" width="487.5001" height="525.625" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="302.4999" y="85.3125" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">hello.s (GAS source)</text>

  <!-- .data section highlight -->
  <rect x="77.4999" y="94.375" width="468.7499" height="99.6874" rx="6" fill="var(--text)"/>
  <text x="91.5624" y="115.2187" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">.section .data</text>
  <text x="91.5624" y="136.0625" font-family="monospace" font-size="11.9828" fill="var(--ok-accent)">msg: .ascii "Hello, World!\n"</text>
  <text x="91.5624" y="156.9062" font-family="monospace" font-size="11.9828" fill="var(--ok-accent)">len: .long . - msg</text>
  <text x="91.5624" y="177.75" font-family="monospace" font-size="11.6093" fill="var(--text-muted)"># current loc minus msg start</text>

  <!-- .text section highlight -->
  <rect x="77.4999" y="203.1251" width="468.7499" height="72.5" rx="6" fill="var(--text)"/>
  <text x="91.5624" y="223.9688" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">.section .text</text>
  <text x="91.5624" y="244.8124" font-family="monospace" font-size="11.9828" fill="var(--info-accent)">.globl _start</text>
  <text x="91.5624" y="265.6562" font-family="monospace" font-size="11.6093" fill="var(--text-muted)"># exported entry point</text>

  <!-- _start / syscall sequence -->
  <rect x="77.4999" y="282.875" width="468.7499" height="181.2501" rx="6" fill="var(--code-bg)"/>
  <text x="91.5624" y="303.7187" font-family="monospace" font-size="11.9828" fill="var(--info-accent)">_start:</text>
  <text x="91.5624" y="324.5625" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">  movl $4, %eax    <tspan fill="var(--text-muted)"># sys_write</tspan></text>
  <text x="91.5624" y="345.4062" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">  movl $1, %ebx    <tspan fill="var(--text-muted)"># stdout fd=1</tspan></text>
  <text x="91.5624" y="366.25" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">  movl $msg, %ecx  <tspan fill="var(--text-muted)"># buffer addr</tspan></text>
  <text x="91.5624" y="387.0938" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">  movl len, %edx   <tspan fill="var(--text-muted)"># byte count</tspan></text>
  <text x="91.5624" y="407.9375" font-family="monospace" font-size="11.9828" fill="var(--warn-accent)">  int $0x80        <tspan fill="var(--text-muted)"># kernel call</tspan></text>
  <text x="91.5624" y="431.5" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">  movl $1, %eax    <tspan fill="var(--text-muted)"># sys_exit</tspan></text>
  <text x="91.5624" y="452.3438" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">  movl $0, %ebx    <tspan fill="var(--text-muted)"># exit code 0</tspan></text>
  <text x="91.5624" y="473.1875" font-family="monospace" font-size="11.9828" fill="var(--warn-accent)">  int $0x80        <tspan fill="var(--text-muted)"># kernel call</tspan></text>

  <!-- Annotation panel -->
  <rect x="583.75" y="58.125" width="628.1251" height="525.625" rx="6" fill="var(--surface)" filter="url(#shadow)"/>

  <!-- Sections legend header -->
  <rect x="602.4999" y="71.7189" width="590.625" height="32.6251" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="897.8124" y="92.5624" font-family="Arial, sans-serif" font-size="15.6697" font-weight="bold" fill="var(--bg)" text-anchor="middle">ELF / GAS Program Anatomy</text>

  <!-- .data box -->
  <rect x="602.4999" y="117.0312" width="262.5001" height="99.6874" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="733.7499" y="139.6874" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">.data Section</text>
  <text x="616.5624" y="160.5311" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Initialized data (read-write)</text>
  <text x="616.5624" y="178.6562" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Strings, constants, variables</text>
  <text x="616.5624" y="196.7811" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Stored in ELF data segment</text>

  <!-- .text box -->
  <rect x="602.4999" y="230.3125" width="262.5001" height="99.6874" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="733.7499" y="252.9687" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">.text Section</text>
  <text x="616.5624" y="273.8124" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Executable instructions</text>
  <text x="616.5624" y="291.9374" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Read-only in ELF</text>
  <text x="616.5624" y="310.0625" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- .globl exports _start label</text>

  <!-- Labels box -->
  <rect x="602.4999" y="343.5939" width="262.5001" height="81.5625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="733.7499" y="366.25" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Labels</text>
  <text x="616.5624" y="387.0938" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Symbolic addresses (msg, _start)</text>
  <text x="616.5624" y="405.2188" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">- Resolved by assembler/linker</text>

  <!-- Syscall box -->
  <rect x="893.125" y="117.0312" width="300.0001" height="181.2501" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.1249" y="139.6874" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Syscall Sequence (int 0x80)</text>
  <text x="907.1875" y="163.2499" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">Register  Purpose</text>
  <line x1="907.1875" y1="169.5937" x2="1183.75" y2="169.5937" stroke="var(--info-border)" stroke-width="1"/>
  <text x="907.1875" y="187.7187" font-family="monospace" font-size="11.9828" fill="var(--info-accent)">%eax</text>
  <text x="968.1251" y="187.7187" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">syscall number (4=write, 1=exit)</text>
  <text x="907.1875" y="210.3749" font-family="monospace" font-size="11.9828" fill="var(--info-accent)">%ebx</text>
  <text x="968.1251" y="210.3749" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">arg1 (fd=1 for stdout)</text>
  <text x="907.1875" y="233.0311" font-family="monospace" font-size="11.9828" fill="var(--info-accent)">%ecx</text>
  <text x="968.1251" y="233.0311" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">arg2 (buffer address)</text>
  <text x="907.1875" y="255.6874" font-family="monospace" font-size="11.9828" fill="var(--info-accent)">%edx</text>
  <text x="968.1251" y="255.6874" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">arg3 (byte count)</text>
  <text x="907.1875" y="278.3438" font-family="monospace" font-size="11.9828" fill="var(--warn-accent)">int $0x80</text>
  <text x="996.25" y="278.3438" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">transfers control to kernel</text>

  <!-- ELF structure box -->
  <rect x="893.125" y="311.8749" width="300.0001" height="181.2501" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1043.1249" y="334.5311" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">ELF Output Structure</text>
  <!-- ELF mini diagram -->
  <rect x="986.8749" y="346.3126" width="187.4999" height="25.3749" rx="6" fill="var(--primary-accent)"/>
  <text x="1080.625" y="363.5312" font-family="monospace" font-size="11.6093" fill="var(--bg)" text-anchor="middle">ELF Header</text>
  <rect x="986.8749" y="375.3125" width="187.4999" height="25.3749" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1080.625" y="392.5312" font-family="monospace" font-size="11.6093" fill="var(--bg)" text-anchor="middle">.text segment</text>
  <rect x="986.8749" y="404.3125" width="187.4999" height="25.3749" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1080.625" y="421.5311" font-family="monospace" font-size="11.6093" fill="var(--bg)" text-anchor="middle">.data segment</text>
  <rect x="986.8749" y="433.3126" width="187.4999" height="25.3749" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1080.625" y="450.5312" font-family="monospace" font-size="11.6093" fill="var(--bg)" text-anchor="middle">Section headers</text>
  <text x="907.1875" y="482.25" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)">Produced by ld linker from .o object file</text>

  <!-- Build command -->
  <rect x="602.4999" y="443.2812" width="571.875" height="54.375" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="616.5624" y="464.125" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">as -o hello.o hello.s</text>
  <text x="616.5624" y="486.7812" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">ld -o hello hello.o   <tspan fill="var(--text-muted)"># or: gcc -nostdlib -o hello hello.s</tspan></text>

  <!-- Run command -->
  <rect x="602.4999" y="511.25" width="571.875" height="45.3125" rx="6" fill="var(--black)" filter="url(#shadow)"/>
  <text x="616.5624" y="532.0939" font-family="monospace" font-size="11.9828" fill="var(--ok-accent)">$ ./hello</text>
  <text x="743.1249" y="532.0939" font-family="monospace" font-size="11.9828" fill="var(--info-accent)">Hello, World!</text>
</svg>

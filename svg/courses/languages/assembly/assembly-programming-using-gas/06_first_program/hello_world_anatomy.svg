<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="510" height="580" rx="8.069870322226" fill="var(--code-bg)"/>
  <text x="295" y="70.526315789474" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--primary-text)">hello.s</text>

  <text x="60" y="106.140350877193" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">.section .data</text>
  <text x="60" y="131.578947368421" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--ok-text)">msg: .ascii "Hello\n"</text>
  <text x="60" y="157.017543859649" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--ok-text)">len: .long . - msg</text>

  <text x="60" y="202.80701754386" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">.section .text</text>
  <text x="60" y="228.245614035088" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--info-text)">.globl _start</text>

  <text x="60" y="274.035087719298" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--info-text)">_start:</text>
  <text x="60" y="299.473684210526" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">  movl $4, %eax</text>
  <text x="60" y="324.912280701754" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">  movl $1, %ebx</text>
  <text x="60" y="350.350877192982" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">  movl $msg, %ecx</text>
  <text x="60" y="375.789473684211" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">  movl len, %edx</text>
  <text x="60" y="401.228070175439" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--warn-text)">  int $0x80</text>
  <text x="60" y="436.842105263158" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">  movl $1, %eax</text>
  <text x="60" y="462.280701754386" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">  movl $0, %ebx</text>
  <text x="60" y="487.719298245614" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--warn-text)">  int $0x80</text>

  <text x="60" y="553.859649122807" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--ok-text)">$ as -o hello.o hello.s</text>
  <text x="60" y="579.298245614035" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--ok-text)">$ ld -o hello hello.o</text>
  <text x="60" y="604.736842105263" font-family="Courier New, monospace" font-size="12.104805483339" fill="var(--ok-text)">$ ./hello</text>

  <rect x="580" y="40" width="660" height="183.157894736842" rx="8.069870322226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="910" y="75.614035087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--primary-text)">Sections</text>
  <text x="600" y="111.228070175439" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">.data  initialized RW</text>
  <text x="600" y="141.754385964912" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">.text  executable RO</text>
  <text x="600" y="172.280701754386" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">.globl exports entry</text>
  <text x="600" y="202.80701754386" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">labels become addresses</text>

  <rect x="580" y="238.421052631579" width="660" height="244.210526315789" rx="8.069870322226" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="910" y="274.035087719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--info-text)">Syscall (int 0x80)</text>
  <text x="600" y="309.649122807018" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--info-text)">eax  number</text>
  <text x="600" y="340.175438596491" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--info-text)">ebx  arg1</text>
  <text x="600" y="370.701754385965" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--info-text)">ecx  arg2</text>
  <text x="600" y="401.228070175439" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--info-text)">edx  arg3</text>
  <text x="600" y="436.842105263158" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--info-text)">4 = write, 1 = exit</text>
  <text x="600" y="462.280701754386" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--info-text)">int 0x80 traps to kernel</text>

  <rect x="580" y="497.894736842105" width="660" height="122.105263157895" rx="8.069870322226" fill="var(--surface)" stroke="var(--border)"/>
  <text x="910" y="533.508771929825" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--text)">ELF Output</text>
  <text x="910" y="569.122807017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">header, .text, .data</text>
  <text x="910" y="594.561403508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">produced by ld</text>
</svg>

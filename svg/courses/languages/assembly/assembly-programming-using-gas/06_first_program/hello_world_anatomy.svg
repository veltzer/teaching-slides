<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>

  <!-- Source code panel -->
  <rect x="177.9133" y="160.0098" width="441.8281" height="430.3134" rx="5.7089" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="390.3306" y="182.2674" font-family="Arial, sans-serif" font-size="12.7035" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">hello.s (GAS source)</text>

  <!-- .data section highlight -->
  <rect x="186.41" y="189.6866" width="424.8346" height="81.6111" rx="5.7089" fill="var(--text)"/>
  <text x="199.155" y="206.7507" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">.section .data</text>
  <text x="199.155" y="223.8149" font-family="monospace" font-size="10.3217" fill="var(--ok-accent)">msg: .ascii "Hello, World!\n"</text>
  <text x="199.155" y="240.879" font-family="monospace" font-size="10.3217" fill="var(--ok-accent)">len: .long . - msg</text>
  <text x="199.155" y="257.9432" font-family="monospace" font-size="10" fill="var(--text-muted)"># current loc minus msg start</text>

  <!-- .text section highlight -->
  <rect x="186.41" y="278.717" width="424.8346" height="59.3536" rx="5.7089" fill="var(--text)"/>
  <text x="199.155" y="295.7811" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">.section .text</text>
  <text x="199.155" y="312.8452" font-family="monospace" font-size="10.3217" fill="var(--info-accent)">.globl _start</text>
  <text x="199.155" y="329.9094" font-family="monospace" font-size="10" fill="var(--text-muted)"># exported entry point</text>

  <!-- _start / syscall sequence -->
  <rect x="186.41" y="344.0059" width="424.8346" height="148.384" rx="5.7089" fill="var(--code-bg)"/>
  <text x="199.155" y="361.07" font-family="monospace" font-size="10.3217" fill="var(--info-accent)">_start:</text>
  <text x="199.155" y="378.1342" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">  movl $4, %eax    <tspan fill="var(--text-muted)"># sys_write</tspan></text>
  <text x="199.155" y="395.1983" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">  movl $1, %ebx    <tspan fill="var(--text-muted)"># stdout fd=1</tspan></text>
  <text x="199.155" y="412.2625" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">  movl $msg, %ecx  <tspan fill="var(--text-muted)"># buffer addr</tspan></text>
  <text x="199.155" y="429.3267" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">  movl len, %edx   <tspan fill="var(--text-muted)"># byte count</tspan></text>
  <text x="199.155" y="446.3908" font-family="monospace" font-size="10.3217" fill="var(--warn-accent)">  int $0x80        <tspan fill="var(--text-muted)"># kernel call</tspan></text>
  <text x="199.155" y="465.6807" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">  movl $1, %eax    <tspan fill="var(--text-muted)"># sys_exit</tspan></text>
  <text x="199.155" y="482.7449" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">  movl $0, %ebx    <tspan fill="var(--text-muted)"># exit code 0</tspan></text>
  <text x="199.155" y="499.809" font-family="monospace" font-size="10.3217" fill="var(--warn-accent)">  int $0x80        <tspan fill="var(--text-muted)"># kernel call</tspan></text>

  <!-- Annotation panel -->
  <rect x="645.2315" y="160.0098" width="569.2785" height="430.3134" rx="5.7089" fill="var(--surface)" filter="url(#shadow)"/>

  <!-- Sections legend header -->
  <rect x="662.2248" y="171.1387" width="535.2917" height="26.7092" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="929.8706" y="188.2027" font-family="Arial, sans-serif" font-size="13.4975" font-weight="bold" fill="var(--bg)" text-anchor="middle">ELF / GAS Program Anatomy</text>

  <!-- .data box -->
  <rect x="662.2248" y="208.2345" width="237.9075" height="81.6111" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="781.1785" y="226.7825" font-family="Arial, sans-serif" font-size="12.7035" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">.data Section</text>
  <text x="674.9698" y="243.8466" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Initialized data (read-write)</text>
  <text x="674.9698" y="258.6851" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Strings, constants, variables</text>
  <text x="674.9698" y="273.5234" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Stored in ELF data segment</text>

  <!-- .text box -->
  <rect x="662.2248" y="300.9745" width="237.9075" height="81.6111" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="781.1785" y="319.5225" font-family="Arial, sans-serif" font-size="12.7035" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">.text Section</text>
  <text x="674.9698" y="336.5866" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Executable instructions</text>
  <text x="674.9698" y="351.425" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Read-only in ELF</text>
  <text x="674.9698" y="366.2635" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- .globl exports _start label</text>

  <!-- Labels box -->
  <rect x="662.2248" y="393.7146" width="237.9075" height="66.7728" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="781.1785" y="412.2625" font-family="Arial, sans-serif" font-size="12.7035" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Labels</text>
  <text x="674.9698" y="429.3267" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Symbolic addresses (msg, _start)</text>
  <text x="674.9698" y="444.1651" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">- Resolved by assembler/linker</text>

  <!-- Syscall box -->
  <rect x="925.6224" y="208.2345" width="271.8943" height="148.384" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.5694" y="226.7825" font-family="Arial, sans-serif" font-size="12.7035" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Syscall Sequence (int 0x80)</text>
  <text x="938.3674" y="246.0724" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">Register  Purpose</text>
  <line x1="938.3674" y1="251.2659" x2="1189.0198" y2="251.2659" stroke="var(--info-border)" stroke-width="1"/>
  <text x="938.3674" y="266.1043" font-family="monospace" font-size="10.3217" fill="var(--info-accent)">%eax</text>
  <text x="993.596" y="266.1043" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">syscall number (4=write, 1=exit)</text>
  <text x="938.3674" y="284.6522" font-family="monospace" font-size="10.3217" fill="var(--info-accent)">%ebx</text>
  <text x="993.596" y="284.6522" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">arg1 (fd=1 for stdout)</text>
  <text x="938.3674" y="303.2002" font-family="monospace" font-size="10.3217" fill="var(--info-accent)">%ecx</text>
  <text x="993.596" y="303.2002" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">arg2 (buffer address)</text>
  <text x="938.3674" y="321.7482" font-family="monospace" font-size="10.3217" fill="var(--info-accent)">%edx</text>
  <text x="993.596" y="321.7482" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">arg3 (byte count)</text>
  <text x="938.3674" y="340.2963" font-family="monospace" font-size="10.3217" fill="var(--warn-accent)">int $0x80</text>
  <text x="1019.086" y="340.2963" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">transfers control to kernel</text>

  <!-- ELF structure box -->
  <rect x="925.6224" y="367.7472" width="271.8943" height="148.384" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1061.5694" y="386.2952" font-family="Arial, sans-serif" font-size="12.7035" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">ELF Output Structure</text>
  <!-- ELF mini diagram -->
  <rect x="1010.5892" y="395.9403" width="169.9338" height="20.7737" rx="5.7089" fill="var(--primary-accent)"/>
  <text x="1095.5562" y="410.0367" font-family="monospace" font-size="10" fill="var(--bg)" text-anchor="middle">ELF Header</text>
  <rect x="1010.5892" y="419.6817" width="169.9338" height="20.7737" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1095.5562" y="433.7781" font-family="monospace" font-size="10" fill="var(--bg)" text-anchor="middle">.text segment</text>
  <rect x="1010.5892" y="443.4231" width="169.9338" height="20.7737" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1095.5562" y="457.5195" font-family="monospace" font-size="10" fill="var(--bg)" text-anchor="middle">.data segment</text>
  <rect x="1010.5892" y="467.1646" width="169.9338" height="20.7737" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1095.5562" y="481.261" font-family="monospace" font-size="10" fill="var(--bg)" text-anchor="middle">Section headers</text>
  <text x="938.3674" y="507.2282" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Produced by ld linker from .o object file</text>

  <!-- Build command -->
  <rect x="662.2248" y="475.3256" width="518.2983" height="44.5152" rx="5.7089" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="674.9698" y="492.3898" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">as -o hello.o hello.s</text>
  <text x="674.9698" y="510.9378" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">ld -o hello hello.o   <tspan fill="var(--text-muted)"># or: gcc -nostdlib -o hello hello.s</tspan></text>

  <!-- Run command -->
  <rect x="662.2248" y="530.9696" width="518.2983" height="37.096" rx="5.7089" fill="var(--black)" filter="url(#shadow)"/>
  <text x="674.9698" y="548.0339" font-family="monospace" font-size="10.3217" fill="var(--ok-accent)">$ ./hello</text>
  <text x="789.6752" y="548.0339" font-family="monospace" font-size="10.3217" fill="var(--info-accent)">Hello, World!</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Source code panel -->
  <rect x="30" y="20" width="520" height="580" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="280" y="50" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">hello.s (GAS source)</text>

  <!-- .data section highlight -->
  <rect x="40" y="60" width="500" height="110" rx="6" fill="var(--text)"/>
  <text x="55" y="83" font-family="monospace" font-size="13" fill="var(--primary-accent)">.section .data</text>
  <text x="55" y="106" font-family="monospace" font-size="13" fill="var(--ok-accent)">msg: .ascii "Hello, World!\n"</text>
  <text x="55" y="129" font-family="monospace" font-size="13" fill="var(--ok-accent)">len: .long . - msg</text>
  <text x="55" y="152" font-family="monospace" font-size="12" fill="var(--text-muted)"># current loc minus msg start</text>

  <!-- .text section highlight -->
  <rect x="40" y="180" width="500" height="80" rx="6" fill="var(--text)"/>
  <text x="55" y="203" font-family="monospace" font-size="13" fill="var(--primary-accent)">.section .text</text>
  <text x="55" y="226" font-family="monospace" font-size="13" fill="var(--info-accent)">.globl _start</text>
  <text x="55" y="249" font-family="monospace" font-size="12" fill="var(--text-muted)"># exported entry point</text>

  <!-- _start / syscall sequence -->
  <rect x="40" y="268" width="500" height="200" rx="6" fill="var(--code-bg)"/>
  <text x="55" y="291" font-family="monospace" font-size="13" fill="var(--info-accent)">_start:</text>
  <text x="55" y="314" font-family="monospace" font-size="13" fill="var(--primary-accent)">  movl $4, %eax    <tspan fill="var(--text-muted)"># sys_write</tspan></text>
  <text x="55" y="337" font-family="monospace" font-size="13" fill="var(--primary-accent)">  movl $1, %ebx    <tspan fill="var(--text-muted)"># stdout fd=1</tspan></text>
  <text x="55" y="360" font-family="monospace" font-size="13" fill="var(--primary-accent)">  movl $msg, %ecx  <tspan fill="var(--text-muted)"># buffer addr</tspan></text>
  <text x="55" y="383" font-family="monospace" font-size="13" fill="var(--primary-accent)">  movl len, %edx   <tspan fill="var(--text-muted)"># byte count</tspan></text>
  <text x="55" y="406" font-family="monospace" font-size="13" fill="var(--warn-accent)">  int $0x80        <tspan fill="var(--text-muted)"># kernel call</tspan></text>
  <text x="55" y="432" font-family="monospace" font-size="13" fill="var(--primary-accent)">  movl $1, %eax    <tspan fill="var(--text-muted)"># sys_exit</tspan></text>
  <text x="55" y="455" font-family="monospace" font-size="13" fill="var(--primary-accent)">  movl $0, %ebx    <tspan fill="var(--text-muted)"># exit code 0</tspan></text>
  <text x="55" y="478" font-family="monospace" font-size="13" fill="var(--warn-accent)">  int $0x80        <tspan fill="var(--text-muted)"># kernel call</tspan></text>

  <!-- Annotation panel -->
  <rect x="580" y="20" width="670" height="580" rx="6" fill="var(--surface)" filter="url(#shadow)"/>

  <!-- Sections legend header -->
  <rect x="600" y="35" width="630" height="36" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="915" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">ELF / GAS Program Anatomy</text>

  <!-- .data box -->
  <rect x="600" y="85" width="280" height="110" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">.data Section</text>
  <text x="615" y="133" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Initialized data (read-write)</text>
  <text x="615" y="153" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Strings, constants, variables</text>
  <text x="615" y="173" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Stored in ELF data segment</text>

  <!-- .text box -->
  <rect x="600" y="210" width="280" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">.text Section</text>
  <text x="615" y="258" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Executable instructions</text>
  <text x="615" y="278" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Read-only in ELF</text>
  <text x="615" y="298" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- .globl exports _start label</text>

  <!-- Labels box -->
  <rect x="600" y="335" width="280" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Labels</text>
  <text x="615" y="383" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Symbolic addresses (msg, _start)</text>
  <text x="615" y="403" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- Resolved by assembler/linker</text>

  <!-- Syscall box -->
  <rect x="910" y="85" width="320" height="200" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Syscall Sequence (int 0x80)</text>
  <text x="925" y="136" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Register  Purpose</text>
  <line x1="925" y1="143" x2="1220" y2="143" stroke="var(--info-border)" stroke-width="1"/>
  <text x="925" y="163" font-family="monospace" font-size="13" fill="var(--info-accent)">%eax</text>
  <text x="990" y="163" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">syscall number (4=write, 1=exit)</text>
  <text x="925" y="188" font-family="monospace" font-size="13" fill="var(--info-accent)">%ebx</text>
  <text x="990" y="188" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">arg1 (fd=1 for stdout)</text>
  <text x="925" y="213" font-family="monospace" font-size="13" fill="var(--info-accent)">%ecx</text>
  <text x="990" y="213" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">arg2 (buffer address)</text>
  <text x="925" y="238" font-family="monospace" font-size="13" fill="var(--info-accent)">%edx</text>
  <text x="990" y="238" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">arg3 (byte count)</text>
  <text x="925" y="263" font-family="monospace" font-size="13" fill="var(--warn-accent)">int $0x80</text>
  <text x="1020" y="263" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">transfers control to kernel</text>

  <!-- ELF structure box -->
  <rect x="910" y="300" width="320" height="200" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1070" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">ELF Output Structure</text>
  <!-- ELF mini diagram -->
  <rect x="1010" y="338" width="200" height="28" rx="6" fill="var(--primary-accent)"/>
  <text x="1110" y="357" font-family="monospace" font-size="12" fill="var(--bg)" text-anchor="middle">ELF Header</text>
  <rect x="1010" y="370" width="200" height="28" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1110" y="389" font-family="monospace" font-size="12" fill="var(--bg)" text-anchor="middle">.text segment</text>
  <rect x="1010" y="402" width="200" height="28" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1110" y="421" font-family="monospace" font-size="12" fill="var(--bg)" text-anchor="middle">.data segment</text>
  <rect x="1010" y="434" width="200" height="28" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1110" y="453" font-family="monospace" font-size="12" fill="var(--bg)" text-anchor="middle">Section headers</text>
  <text x="925" y="488" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Produced by ld linker from .o object file</text>

  <!-- Build command -->
  <rect x="600" y="445" width="610" height="60" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="615" y="468" font-family="monospace" font-size="13" fill="var(--primary-accent)">as -o hello.o hello.s</text>
  <text x="615" y="493" font-family="monospace" font-size="13" fill="var(--primary-accent)">ld -o hello hello.o   <tspan fill="var(--text-muted)"># or: gcc -nostdlib -o hello hello.s</tspan></text>

  <!-- Run command -->
  <rect x="600" y="520" width="610" height="50" rx="6" fill="var(--black)" filter="url(#shadow)"/>
  <text x="615" y="543" font-family="monospace" font-size="13" fill="var(--ok-accent)">$ ./hello</text>
  <text x="750" y="543" font-family="monospace" font-size="13" fill="var(--info-accent)">Hello, World!</text>
</svg>

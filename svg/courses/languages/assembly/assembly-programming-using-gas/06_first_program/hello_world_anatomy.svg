<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Source code panel -->
  <rect x="30" y="20" width="520" height="580" rx="8" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="280" y="50" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-lt)" text-anchor="middle">hello.s (GAS source)</text>

  <!-- .data section highlight -->
  <rect x="40" y="60" width="500" height="110" rx="4" fill="var(--text-dark)"/>
  <text x="55" y="83" font-family="monospace" font-size="13" fill="var(--primary-tint)">.section .data</text>
  <text x="55" y="106" font-family="monospace" font-size="13" fill="var(--ok-tint)">msg: .ascii "Hello, World!\n"</text>
  <text x="55" y="129" font-family="monospace" font-size="13" fill="var(--ok-tint)">len: .long . - msg</text>
  <text x="55" y="152" font-family="monospace" font-size="12" fill="var(--text-lighter)"># current loc minus msg start</text>

  <!-- .text section highlight -->
  <rect x="40" y="180" width="500" height="80" rx="4" fill="var(--text-dark)"/>
  <text x="55" y="203" font-family="monospace" font-size="13" fill="var(--primary-tint)">.section .text</text>
  <text x="55" y="226" font-family="monospace" font-size="13" fill="var(--info-tint)">.globl _start</text>
  <text x="55" y="249" font-family="monospace" font-size="12" fill="var(--text-lighter)"># exported entry point</text>

  <!-- _start / syscall sequence -->
  <rect x="40" y="268" width="500" height="200" rx="4" fill="var(--code-bg)"/>
  <text x="55" y="291" font-family="monospace" font-size="13" fill="var(--info-lt)">_start:</text>
  <text x="55" y="314" font-family="monospace" font-size="13" fill="var(--primary-lt)">  movl $4, %eax    <tspan fill="var(--text-lighter)"># sys_write</tspan></text>
  <text x="55" y="337" font-family="monospace" font-size="13" fill="var(--primary-lt)">  movl $1, %ebx    <tspan fill="var(--text-lighter)"># stdout fd=1</tspan></text>
  <text x="55" y="360" font-family="monospace" font-size="13" fill="var(--primary-lt)">  movl $msg, %ecx  <tspan fill="var(--text-lighter)"># buffer addr</tspan></text>
  <text x="55" y="383" font-family="monospace" font-size="13" fill="var(--primary-lt)">  movl len, %edx   <tspan fill="var(--text-lighter)"># byte count</tspan></text>
  <text x="55" y="406" font-family="monospace" font-size="13" fill="var(--warn-tint)">  int $0x80        <tspan fill="var(--text-lighter)"># kernel call</tspan></text>
  <text x="55" y="432" font-family="monospace" font-size="13" fill="var(--primary-lt)">  movl $1, %eax    <tspan fill="var(--text-lighter)"># sys_exit</tspan></text>
  <text x="55" y="455" font-family="monospace" font-size="13" fill="var(--primary-lt)">  movl $0, %ebx    <tspan fill="var(--text-lighter)"># exit code 0</tspan></text>
  <text x="55" y="478" font-family="monospace" font-size="13" fill="var(--warn-tint)">  int $0x80        <tspan fill="var(--text-lighter)"># kernel call</tspan></text>

  <!-- Annotation panel -->
  <rect x="580" y="20" width="670" height="580" rx="8" fill="url(#grad-surface)" filter="url(#shadow)"/>

  <!-- Sections legend header -->
  <rect x="600" y="35" width="630" height="36" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="915" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">ELF / GAS Program Anatomy</text>

  <!-- .data box -->
  <rect x="600" y="85" width="280" height="110" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">.data Section</text>
  <text x="615" y="133" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Initialized data (read-write)</text>
  <text x="615" y="153" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Strings, constants, variables</text>
  <text x="615" y="173" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Stored in ELF data segment</text>

  <!-- .text box -->
  <rect x="600" y="210" width="280" height="110" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">.text Section</text>
  <text x="615" y="258" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Executable instructions</text>
  <text x="615" y="278" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Read-only in ELF</text>
  <text x="615" y="298" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- .globl exports _start label</text>

  <!-- Labels box -->
  <rect x="600" y="335" width="280" height="90" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-mid)" text-anchor="middle">Labels</text>
  <text x="615" y="383" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Symbolic addresses (msg, _start)</text>
  <text x="615" y="403" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">- Resolved by assembler/linker</text>

  <!-- Syscall box -->
  <rect x="910" y="85" width="320" height="200" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Syscall Sequence (int 0x80)</text>
  <text x="925" y="136" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Register  Purpose</text>
  <line x1="925" y1="143" x2="1220" y2="143" stroke="var(--info)" stroke-width="1"/>
  <text x="925" y="163" font-family="monospace" font-size="13" fill="var(--info-dk)">%eax</text>
  <text x="990" y="163" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">syscall number (4=write, 1=exit)</text>
  <text x="925" y="188" font-family="monospace" font-size="13" fill="var(--info-dk)">%ebx</text>
  <text x="990" y="188" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">arg1 (fd=1 for stdout)</text>
  <text x="925" y="213" font-family="monospace" font-size="13" fill="var(--info-dk)">%ecx</text>
  <text x="990" y="213" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">arg2 (buffer address)</text>
  <text x="925" y="238" font-family="monospace" font-size="13" fill="var(--info-dk)">%edx</text>
  <text x="990" y="238" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">arg3 (byte count)</text>
  <text x="925" y="263" font-family="monospace" font-size="13" fill="var(--warn-mid)">int $0x80</text>
  <text x="1020" y="263" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">transfers control to kernel</text>

  <!-- ELF structure box -->
  <rect x="910" y="300" width="320" height="200" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">ELF Output Structure</text>
  <!-- ELF mini diagram -->
  <rect x="1010" y="338" width="200" height="28" rx="4" fill="var(--primary-dk)"/>
  <text x="1110" y="357" font-family="monospace" font-size="12" fill="var(--bg)" text-anchor="middle">ELF Header</text>
  <rect x="1010" y="370" width="200" height="28" rx="4" fill="var(--ok)"/>
  <text x="1110" y="389" font-family="monospace" font-size="12" fill="var(--bg)" text-anchor="middle">.text segment</text>
  <rect x="1010" y="402" width="200" height="28" rx="4" fill="var(--warn)"/>
  <text x="1110" y="421" font-family="monospace" font-size="12" fill="var(--bg)" text-anchor="middle">.data segment</text>
  <rect x="1010" y="434" width="200" height="28" rx="4" fill="var(--info)"/>
  <text x="1110" y="453" font-family="monospace" font-size="12" fill="var(--bg)" text-anchor="middle">Section headers</text>
  <text x="925" y="488" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">Produced by ld linker from .o object file</text>

  <!-- Build command -->
  <rect x="600" y="445" width="610" height="60" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="615" y="468" font-family="monospace" font-size="13" fill="var(--primary-lt)">as -o hello.o hello.s</text>
  <text x="615" y="493" font-family="monospace" font-size="13" fill="var(--primary-lt)">ld -o hello hello.o   <tspan fill="var(--text-lighter)"># or: gcc -nostdlib -o hello hello.s</tspan></text>

  <!-- Run command -->
  <rect x="600" y="520" width="610" height="50" rx="6" fill="var(--black)" filter="url(#shadow)"/>
  <text x="615" y="543" font-family="monospace" font-size="13" fill="var(--ok-tint)">$ ./hello</text>
  <text x="750" y="543" font-family="monospace" font-size="13" fill="var(--info-lt)">Hello, World!</text>
</svg>

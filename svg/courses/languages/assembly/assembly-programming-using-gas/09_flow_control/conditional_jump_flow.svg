<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="391.1111" y="26.6667" width="355.5556" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="60.4444" text-anchor="middle" font-family="monospace" font-size="23.1111" font-weight="bold" fill="var(--primary-accent)">cmp  src, dst</text>
  <text x="568.8889" y="85.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">computes dst − src (discards result)</text>
  <line x1="568.8889" y1="99.5556" x2="568.8889" y2="135.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="284.4444" y="136.8889" width="568.8889" height="88.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="170.6667" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">EFLAGS register updated</text>
  <rect x="309.3333" y="183.1111" width="88.8889" height="32" rx="6" fill="var(--bg)" opacity="0.2" />
  <text x="353.7778" y="203.5556" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">ZF</text>
  <rect x="407.1111" y="183.1111" width="88.8889" height="32" rx="6" fill="var(--bg)" opacity="0.2" />
  <text x="451.5556" y="203.5556" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">SF</text>
  <rect x="504.8889" y="183.1111" width="88.8889" height="32" rx="6" fill="var(--bg)" opacity="0.2" />
  <text x="549.3333" y="203.5556" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">OF</text>
  <rect x="602.6667" y="183.1111" width="88.8889" height="32" rx="6" fill="var(--bg)" opacity="0.2" />
  <text x="647.1111" y="203.5556" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">CF</text>
  <rect x="700.4444" y="183.1111" width="88.8889" height="32" rx="6" fill="var(--bg)" opacity="0.2" />
  <text x="744.8889" y="203.5556" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">PF</text>
  <line x1="568.8889" y1="227.5556" x2="568.8889" y2="263.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <polygon points="568.8889,264.8889 728.8889,327.1111 568.8889,389.3333 408.8889,327.1111" fill="url(#grad-surface)" stroke="var(--primary-border)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="568.8889" y="321.7778" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">jXX  label</text>
  <text x="568.8889" y="343.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">check flags</text>
  <line x1="408.8889" y1="327.1111" x2="231.1111" y2="327.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="321.7778" y="316.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)" font-weight="bold">condition true</text>
  <rect x="71.1111" y="300.4444" width="158.2222" height="53.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150.2222" y="330.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--bg)">Jump taken</text>
  <line x1="150.2222" y1="355.5556" x2="150.2222" y2="426.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="71.1111" y="428.4444" width="158.2222" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="150.2222" y="459.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text)">label: body</text>
  <line x1="728.8889" y1="327.1111" x2="906.6667" y2="327.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="816" y="316.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)" font-weight="bold">condition false</text>
  <rect x="908.4444" y="300.4444" width="158.2222" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="987.5556" y="330.6667" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Fall through</text>
  <line x1="987.5556" y1="355.5556" x2="987.5556" y2="426.6667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="908.4444" y="428.4444" width="158.2222" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="987.5556" y="459.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">next instr.</text>
  <rect x="213.3333" y="506.6667" width="711.1111" height="112" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="529.7778" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Common conditional jumps after CMP</text>
  <line x1="231.1111" y1="538.6667" x2="906.6667" y2="538.6667" stroke="var(--border)" stroke-width="0.8889" />
  <text x="284.4444" y="558.2222" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">je</text>
  <text x="284.4444" y="577.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">equal (ZF=1)</text>
  <text x="426.6667" y="558.2222" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">jne</text>
  <text x="426.6667" y="577.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">not equal (ZF=0)</text>
  <text x="568.8889" y="558.2222" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">jg / jl</text>
  <text x="568.8889" y="577.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">signed &gt; / &lt;</text>
  <text x="711.1111" y="558.2222" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">ja / jb</text>
  <text x="711.1111" y="577.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">unsigned above/below</text>
  <text x="853.3333" y="558.2222" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">jo / js</text>
  <text x="853.3333" y="577.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">overflow / sign</text>
  <text x="568.8889" y="609.7778" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text-faint)">cmp %ebx, %eax  →  je equal   means: jump if EAX == EBX</text>
</svg>
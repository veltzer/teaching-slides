<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="452.5" y="64.1667" width="375" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="94.7777" text-anchor="middle" font-family="monospace" font-size="22.5947" font-weight="bold" fill="var(--primary-accent)">cmp  src, dst</text>
  <text x="640" y="117.3333" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">computes dst − src (discards result)</text>
  <line x1="640" y1="130.2223" x2="640" y2="162.4444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="339.9999" y="164.0556" width="600" height="80.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="194.6667" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">EFLAGS register updated</text>
  <rect x="366.25" y="205.9444" width="93.75" height="29" rx="6" fill="var(--bg)" opacity="0.2" />
  <text x="413.125" y="224.4723" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">ZF</text>
  <rect x="469.375" y="205.9444" width="93.75" height="29" rx="6" fill="var(--bg)" opacity="0.2" />
  <text x="516.25" y="224.4723" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">SF</text>
  <rect x="572.5" y="205.9444" width="93.75" height="29" rx="6" fill="var(--bg)" opacity="0.2" />
  <text x="619.375" y="224.4723" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">OF</text>
  <rect x="675.625" y="205.9444" width="93.75" height="29" rx="6" fill="var(--bg)" opacity="0.2" />
  <text x="722.5" y="224.4723" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">CF</text>
  <rect x="778.7499" y="205.9444" width="93.75" height="29" rx="6" fill="var(--bg)" opacity="0.2" />
  <text x="825.625" y="224.4723" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">PF</text>
  <line x1="640" y1="246.2223" x2="640" y2="278.4444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <polygon points="640,280.0556 808.75,336.4444 640,392.8333 471.25,336.4444" fill="url(#grad-surface)" stroke="var(--primary-border)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="640" y="331.6111" text-anchor="middle" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">jXX  label</text>
  <text x="640" y="350.9444" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">check flags</text>
  <line x1="471.25" y1="336.4444" x2="283.75" y2="336.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="379.375" y="326.7777" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)" font-weight="bold">condition true</text>
  <rect x="115" y="312.2777" width="166.875" height="48.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="198.4375" y="339.6667" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)">Jump taken</text>
  <line x1="198.4375" y1="362.2223" x2="198.4375" y2="426.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="115" y="428.2777" width="166.875" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="198.4375" y="456.4723" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text)">label: body</text>
  <line x1="808.75" y1="336.4444" x2="996.25" y2="336.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="900.625" y="326.7777" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)" font-weight="bold">condition false</text>
  <rect x="998.1249" y="312.2777" width="166.875" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1081.5625" y="339.6667" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Fall through</text>
  <line x1="1081.5625" y1="362.2223" x2="1081.5625" y2="426.6667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="998.1249" y="428.2777" width="166.875" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1081.5625" y="456.4723" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">next instr.</text>
  <rect x="265" y="499.1667" width="750" height="101.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="520.1111" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">Common conditional jumps after CMP</text>
  <line x1="283.75" y1="528.1667" x2="996.25" y2="528.1667" stroke="var(--border)" stroke-width="0.8889" />
  <text x="339.9999" y="545.8889" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">je</text>
  <text x="339.9999" y="563.6111" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">equal (ZF=1)</text>
  <text x="490" y="545.8889" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">jne</text>
  <text x="490" y="563.6111" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">not equal (ZF=0)</text>
  <text x="640" y="545.8889" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">jg / jl</text>
  <text x="640" y="563.6111" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">signed &gt; / &lt;</text>
  <text x="790" y="545.8889" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">ja / jb</text>
  <text x="790" y="563.6111" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">unsigned above/below</text>
  <text x="939.9999" y="545.8889" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">jo / js</text>
  <text x="939.9999" y="563.6111" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">overflow / sign</text>
  <text x="640" y="592.6111" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-faint)">cmp %ebx, %eax  →  je equal   means: jump if EAX == EBX</text>
</svg>
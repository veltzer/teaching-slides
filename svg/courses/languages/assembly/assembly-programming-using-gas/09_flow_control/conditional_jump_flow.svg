<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="425.714322" y="40" width="428.571469" height="69.669622" rx="6.66924" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640.000057" y="73.092973" text-anchor="middle" font-family="monospace" font-size="25.114915" font-weight="bold" fill="var(--primary-accent)">cmp  src, dst</text>
  <text x="640.000057" y="97.477405" text-anchor="middle" font-family="sans-serif" font-size="14.48937" fill="var(--text-muted)">computes dst − src (discards result)</text>
  <line x1="640.000057" y1="111.411459" x2="640.000057" y2="146.246162" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="297.142767" y="147.988" width="685.714351" height="87.087135" rx="6.66924" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640.000057" y="181.081081" text-anchor="middle" font-family="sans-serif" font-size="19.319234" font-weight="bold" fill="var(--bg)">EFLAGS register updated</text>
  <rect x="327.142884" y="193.273189" width="107.142867" height="31.351351" rx="6.66924" fill="var(--bg)" opacity="0.2" />
  <text x="380.714318" y="213.303351" text-anchor="middle" font-family="monospace" font-size="17.387266" font-weight="bold" fill="var(--bg)">ZF</text>
  <rect x="445.000039" y="193.273189" width="107.142867" height="31.351351" rx="6.66924" fill="var(--bg)" opacity="0.2" />
  <text x="498.571472" y="213.303351" text-anchor="middle" font-family="monospace" font-size="17.387266" font-weight="bold" fill="var(--bg)">SF</text>
  <rect x="562.857193" y="193.273189" width="107.142867" height="31.351351" rx="6.66924" fill="var(--bg)" opacity="0.2" />
  <text x="616.428626" y="213.303351" text-anchor="middle" font-family="monospace" font-size="17.387266" font-weight="bold" fill="var(--bg)">OF</text>
  <rect x="680.714347" y="193.273189" width="107.142867" height="31.351351" rx="6.66924" fill="var(--bg)" opacity="0.2" />
  <text x="734.28578" y="213.303351" text-anchor="middle" font-family="monospace" font-size="17.387266" font-weight="bold" fill="var(--bg)">CF</text>
  <rect x="798.571387" y="193.273189" width="107.142867" height="31.351351" rx="6.66924" fill="var(--bg)" opacity="0.2" />
  <text x="852.142934" y="213.303351" text-anchor="middle" font-family="monospace" font-size="17.387266" font-weight="bold" fill="var(--bg)">PF</text>
  <line x1="640.000057" y1="236.816865" x2="640.000057" y2="271.651568" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <polygon points="640.000057,273.393405 832.857218,334.35427 640.000057,395.315243 447.142896,334.35427" fill="url(#grad-surface)" stroke="var(--primary-border)" stroke-width="1.7778" filter="url(#shadow)" />
  <text x="640.000057" y="329.129081" text-anchor="middle" font-family="monospace" font-size="19.319234" font-weight="bold" fill="var(--primary-accent)">jXX  label</text>
  <text x="640.000057" y="350.029946" text-anchor="middle" font-family="sans-serif" font-size="13.52333" fill="var(--text-muted)">check flags</text>
  <line x1="447.142896" y1="334.35427" x2="232.857161" y2="334.35427" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="342.142886" y="323.903784" text-anchor="middle" font-family="sans-serif" font-size="14.48937" fill="var(--primary-accent)" font-weight="bold">condition true</text>
  <rect x="40" y="308.228108" width="190.714304" height="52.252216" rx="6.66924" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="135.357152" y="337.837838" text-anchor="middle" font-family="sans-serif" font-size="15.455298" font-weight="bold" fill="var(--bg)">Jump taken</text>
  <line x1="135.357152" y1="362.22227" x2="135.357152" y2="431.891892" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="40" y="433.633514" width="190.714304" height="52.252216" rx="6.66924" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="135.357152" y="464.114162" text-anchor="middle" font-family="sans-serif" font-size="14.48937" fill="var(--text)">label: body</text>
  <line x1="832.857218" y1="334.35427" x2="1047.142953" y2="334.35427" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="937.857228" y="323.903784" text-anchor="middle" font-family="sans-serif" font-size="14.48937" fill="var(--text-muted)" font-weight="bold">condition false</text>
  <rect x="1049.285696" y="308.228108" width="190.714304" height="52.252216" rx="6.66924" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1144.642962" y="337.837838" text-anchor="middle" font-family="sans-serif" font-size="15.455298" fill="var(--text-muted)">Fall through</text>
  <line x1="1144.642962" y1="362.22227" x2="1144.642962" y2="431.891892" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="1049.285696" y="433.633514" width="190.714304" height="52.252216" rx="6.66924" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1144.642962" y="464.114162" text-anchor="middle" font-family="sans-serif" font-size="14.48937" fill="var(--text-muted)">next instr.</text>
  <rect x="211.428588" y="510.27027" width="857.142939" height="109.72973" rx="6.66924" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000057" y="532.912865" text-anchor="middle" font-family="sans-serif" font-size="15.455298" font-weight="bold" fill="var(--text)">Common conditional jumps after CMP</text>
  <line x1="232.857161" y1="541.621622" x2="1047.142953" y2="541.621622" stroke="var(--border)" stroke-width="0.8889" />
  <text x="297.142767" y="560.780757" text-anchor="middle" font-family="monospace" font-size="14.48937" fill="var(--primary-accent)">je</text>
  <text x="297.142767" y="579.939892" text-anchor="middle" font-family="sans-serif" font-size="12.557513" fill="var(--text-muted)">equal (ZF=1)</text>
  <text x="468.571469" y="560.780757" text-anchor="middle" font-family="monospace" font-size="14.48937" fill="var(--primary-accent)">jne</text>
  <text x="468.571469" y="579.939892" text-anchor="middle" font-family="sans-serif" font-size="12.557513" fill="var(--text-muted)">not equal (ZF=0)</text>
  <text x="640.000057" y="560.780757" text-anchor="middle" font-family="monospace" font-size="14.48937" fill="var(--primary-accent)">jg / jl</text>
  <text x="640.000057" y="579.939892" text-anchor="middle" font-family="sans-serif" font-size="12.557513" fill="var(--text-muted)">signed &gt; / &lt;</text>
  <text x="811.428645" y="560.780757" text-anchor="middle" font-family="monospace" font-size="14.48937" fill="var(--primary-accent)">ja / jb</text>
  <text x="811.428645" y="579.939892" text-anchor="middle" font-family="sans-serif" font-size="12.557513" fill="var(--text-muted)">unsigned above/below</text>
  <text x="982.857118" y="560.780757" text-anchor="middle" font-family="monospace" font-size="14.48937" fill="var(--primary-accent)">jo / js</text>
  <text x="982.857118" y="579.939892" text-anchor="middle" font-family="sans-serif" font-size="12.557513" fill="var(--text-muted)">overflow / sign</text>
  <text x="640.000057" y="611.291243" text-anchor="middle" font-family="monospace" font-size="13.52333" fill="var(--text-faint)">cmp %ebx, %eax  →  je equal   means: jump if EAX == EBX</text>
</svg>
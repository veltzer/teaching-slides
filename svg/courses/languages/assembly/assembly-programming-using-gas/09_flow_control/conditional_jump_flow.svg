<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Step 1: CMP instruction -->
  <rect x="440" y="30" width="400" height="80" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="68" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#1565c0">cmp  src, dst</text>
  <text x="640" y="96" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">computes dst − src (discards result)</text>

  <line x1="640" y1="112" x2="640" y2="152" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- EFLAGS box -->
  <rect x="320" y="154" width="640" height="100" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="192" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">EFLAGS register updated</text>
  <!-- Flags row -->
  <rect x="348" y="206" width="100" height="36" rx="4" fill="#ffffff" opacity="0.2"/>
  <text x="398" y="229" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">ZF</text>
  <rect x="458" y="206" width="100" height="36" rx="4" fill="#ffffff" opacity="0.2"/>
  <text x="508" y="229" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">SF</text>
  <rect x="568" y="206" width="100" height="36" rx="4" fill="#ffffff" opacity="0.2"/>
  <text x="618" y="229" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">OF</text>
  <rect x="678" y="206" width="100" height="36" rx="4" fill="#ffffff" opacity="0.2"/>
  <text x="728" y="229" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">CF</text>
  <rect x="788" y="206" width="100" height="36" rx="4" fill="#ffffff" opacity="0.2"/>
  <text x="838" y="229" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">PF</text>

  <line x1="640" y1="256" x2="640" y2="296" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Conditional jump diamond -->
  <polygon points="640,298 820,368 640,438 460,368" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="362" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#1565c0">jXX  label</text>
  <text x="640" y="386" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">check flags</text>

  <!-- Yes branch (left) -->
  <line x1="460" y1="368" x2="260" y2="368" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="362" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1565c0" font-weight="bold">condition true</text>
  <rect x="80" y="338" width="178" height="60" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="169" y="372" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Jump taken</text>
  <line x1="169" y1="400" x2="169" y2="480" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <rect x="80" y="482" width="178" height="60" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="169" y="517" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#212121">label: body</text>

  <!-- No branch (right) -->
  <line x1="820" y1="368" x2="1020" y2="368" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="918" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555" font-weight="bold">condition false</text>
  <rect x="1022" y="338" width="178" height="60" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1111" y="372" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Fall through</text>
  <line x1="1111" y1="400" x2="1111" y2="480" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1022" y="482" width="178" height="60" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1111" y="517" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">next instr.</text>

  <!-- Flags reference table -->
  <rect x="240" y="570" width="800" height="126" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="640" y="596" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Common conditional jumps after CMP</text>
  <line x1="260" y1="606" x2="1020" y2="606" stroke="#e0e0e0" stroke-width="1"/>

  <text x="320"  y="628" text-anchor="middle" font-family="monospace" font-size="15" fill="#1565c0">je</text>
  <text x="320"  y="650" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">equal (ZF=1)</text>

  <text x="480"  y="628" text-anchor="middle" font-family="monospace" font-size="15" fill="#1565c0">jne</text>
  <text x="480"  y="650" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">not equal (ZF=0)</text>

  <text x="640"  y="628" text-anchor="middle" font-family="monospace" font-size="15" fill="#1565c0">jg / jl</text>
  <text x="640"  y="650" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">signed &gt; / &lt;</text>

  <text x="800"  y="628" text-anchor="middle" font-family="monospace" font-size="15" fill="#1565c0">ja / jb</text>
  <text x="800"  y="650" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">unsigned above/below</text>

  <text x="960"  y="628" text-anchor="middle" font-family="monospace" font-size="15" fill="#1565c0">jo / js</text>
  <text x="960"  y="650" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">overflow / sign</text>

  <text x="640" y="686" text-anchor="middle" font-family="monospace" font-size="14" fill="#9e9e9e">cmp %ebx, %eax  →  je equal   means: jump if EAX == EBX</text>
</svg>

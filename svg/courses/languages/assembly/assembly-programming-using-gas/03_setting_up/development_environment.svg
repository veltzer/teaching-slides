<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Tools section header -->
  <rect x="77.5" y="67.1875" width="525" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="340" y="92.5625" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">Development Tools</text>

  <!-- Tool boxes -->
  <!-- gcc -->
  <rect x="77.5" y="121.5625" width="150" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="152.5" y="150.5625" font-family="monospace" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">gcc</text>
  <text x="152.5" y="174.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle">Compiler / Driver</text>

  <!-- as -->
  <rect x="246.25" y="121.5625" width="150" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="321.25" y="150.5625" font-family="monospace" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">as</text>
  <text x="321.25" y="174.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle">GNU Assembler</text>

  <!-- ld -->
  <rect x="415" y="121.5625" width="150" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="490" y="150.5625" font-family="monospace" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">ld</text>
  <text x="490" y="174.125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle">Linker</text>

  <!-- gdb -->
  <rect x="77.5" y="212.1875" width="150" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="152.5" y="241.1875" font-family="monospace" font-size="16.5914" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">gdb</text>
  <text x="152.5" y="264.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle">Debugger</text>

  <!-- make -->
  <rect x="246.25" y="212.1875" width="150" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="321.25" y="241.1875" font-family="monospace" font-size="16.5914" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">make</text>
  <text x="321.25" y="264.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle">Build System</text>

  <!-- objdump -->
  <rect x="415" y="212.1875" width="150" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="490" y="237.5625" font-family="monospace" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">objdump</text>
  <text x="490" y="264.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle">Disassembler</text>

  <!-- Compile/Link/Debug Cycle -->
  <rect x="658.75" y="67.1875" width="543.75" height="39.875" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="930.625" y="92.5625" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">Compile / Link / Debug Cycle</text>

  <!-- Source file -->
  <rect x="715" y="130.625" width="150" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="790" y="154.1875" font-family="monospace" font-size="13.8261" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">hello.s</text>
  <text x="790" y="176.8438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Source (.s)</text>

  <!-- Object file -->
  <rect x="715" y="248.4375" width="150" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="790" y="272" font-family="monospace" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">hello.o</text>
  <text x="790" y="294.6562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Object (.o)</text>

  <!-- Executable -->
  <rect x="715" y="366.25" width="150" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="790" y="389.8125" font-family="monospace" font-size="13.8261" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">hello</text>
  <text x="790" y="412.4688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Executable (ELF)</text>

  <!-- GDB box -->
  <rect x="940" y="366.25" width="168.75" height="58" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1024.375" y="389.8125" font-family="monospace" font-size="13.8261" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">gdb hello</text>
  <text x="1024.375" y="412.4688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">Debug Session</text>

  <!-- Arrows: source -> object -->
  <line x1="790" y1="188.625" x2="790" y2="244.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="804.0625" y="219.4375" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">as</text>

  <!-- Arrows: object -> executable -->
  <line x1="790" y1="306.4375" x2="790" y2="362.625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="804.0625" y="337.25" font-family="monospace" font-size="11.0609" fill="var(--warn-accent)">ld</text>

  <!-- Arrow: executable -> gdb -->
  <line x1="865" y1="395.25" x2="936.25" y2="395.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="881.875" y="388" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">debug</text>

  <!-- Installation note -->
  <rect x="77.5" y="311.875" width="525" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="96.25" y="334.5312" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text)">Install (Ubuntu/Debian):</text>
  <text x="96.25" y="359.9062" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)">sudo apt install build-essential gdb binutils</text>
  <text x="96.25" y="382.5625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Provides: gcc, as, ld, ar, objdump, nm, strip, make</text>

  <!-- gcc driver note -->
  <rect x="940" y="130.625" width="262.5" height="199.375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1071.25" y="154.1875" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">gcc as driver</text>
  <text x="958.75" y="180.4688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">gcc invokes as and ld</text>
  <text x="958.75" y="198.5938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">automatically:</text>
  <text x="958.75" y="223.0625" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">gcc -o hello hello.s</text>
  <text x="958.75" y="246.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Or step by step:</text>
  <text x="958.75" y="269.2812" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">as -o hello.o hello.s</text>
  <text x="958.75" y="287.4062" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">ld -o hello hello.o</text>
  <text x="958.75" y="310.0625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">(-lc for C stdlib)</text>

  <!-- Workflow caption -->
  <text x="640" y="465.9375" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-faint)" text-anchor="middle">Edit -&gt; Assemble -&gt; Link -&gt; Run -&gt; Debug -&gt; Repeat</text>
</svg>

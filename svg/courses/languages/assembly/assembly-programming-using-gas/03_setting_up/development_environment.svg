<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="560" height="55.478260869565" rx="6.026030490983" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="76.313043478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445133606" font-weight="bold" fill="var(--primary-text)">Development Tools</text>

  <rect x="40" y="115.652173913043" width="160" height="105.913043478261" rx="6.026030490983" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="120" y="161.04347826087" text-anchor="middle" font-family="Courier New, monospace" font-size="20.086768303278" font-weight="bold" fill="var(--primary-accent)">gcc</text>
  <text x="120" y="196.347826086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--text)">Driver</text>

  <rect x="220" y="115.652173913043" width="160" height="105.913043478261" rx="6.026030490983" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="300" y="161.04347826087" text-anchor="middle" font-family="Courier New, monospace" font-size="20.086768303278" font-weight="bold" fill="var(--primary-accent)">as</text>
  <text x="300" y="196.347826086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--text)">Assembler</text>

  <rect x="400" y="115.652173913043" width="160" height="105.913043478261" rx="6.026030490983" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="480" y="161.04347826087" text-anchor="middle" font-family="Courier New, monospace" font-size="20.086768303278" font-weight="bold" fill="var(--primary-accent)">ld</text>
  <text x="480" y="196.347826086957" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--text)">Linker</text>

  <rect x="40" y="246.782608695652" width="160" height="105.913043478261" rx="6.026030490983" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="120" y="292.173913043478" text-anchor="middle" font-family="Courier New, monospace" font-size="20.086768303278" font-weight="bold" fill="var(--ok-accent)">gdb</text>
  <text x="120" y="327.478260869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--text)">Debugger</text>

  <rect x="220" y="246.782608695652" width="160" height="105.913043478261" rx="6.026030490983" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="300" y="292.173913043478" text-anchor="middle" font-family="Courier New, monospace" font-size="20.086768303278" font-weight="bold" fill="var(--ok-accent)">make</text>
  <text x="300" y="327.478260869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--text)">Build</text>

  <rect x="400" y="246.782608695652" width="160" height="105.913043478261" rx="6.026030490983" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="480" y="287.130434782609" text-anchor="middle" font-family="Courier New, monospace" font-size="18.07809147295" font-weight="bold" fill="var(--ok-accent)">objdump</text>
  <text x="480" y="327.478260869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--text)">Disassembler</text>

  <rect x="660" y="40" width="580" height="55.478260869565" rx="6.026030490983" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="76.313043478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445133606" font-weight="bold" fill="var(--ok-text)">Compile / Link / Debug</text>

  <rect x="720" y="125.739130434783" width="160" height="80.695652173913" rx="6.026030490983" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="800" y="161.04347826087" text-anchor="middle" font-family="Courier New, monospace" font-size="17.073753057786" font-weight="bold" fill="var(--primary-accent)">hello.s</text>
  <text x="800" y="191.304347826087" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399397131" fill="var(--text-muted)">Source</text>

  <rect x="720" y="297.217391304348" width="160" height="80.695652173913" rx="6.026030490983" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="800" y="332.521739130435" text-anchor="middle" font-family="Courier New, monospace" font-size="17.073753057786" font-weight="bold" fill="var(--warn-accent)">hello.o</text>
  <text x="800" y="362.782608695652" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399397131" fill="var(--text-muted)">Object</text>

  <rect x="720" y="468.695652173913" width="160" height="80.695652173913" rx="6.026030490983" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="800" y="504" text-anchor="middle" font-family="Courier New, monospace" font-size="17.073753057786" font-weight="bold" fill="var(--ok-accent)">hello</text>
  <text x="800" y="534.260869565217" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399397131" fill="var(--text-muted)">ELF</text>

  <rect x="960" y="468.695652173913" width="180" height="80.695652173913" rx="6.026030490983" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050" y="504" text-anchor="middle" font-family="Courier New, monospace" font-size="17.073753057786" font-weight="bold" fill="var(--info-accent)">gdb hello</text>
  <text x="1050" y="534.260869565217" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399397131" fill="var(--text-muted)">Session</text>

  <line x1="800" y1="209.460869565217" x2="800" y2="294.191304347826" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="815" y="261.913043478261" font-family="Courier New, monospace" font-size="13.056399397131" fill="var(--primary-accent)">as</text>

  <line x1="800" y1="380.939130434783" x2="800" y2="465.669565217391" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="815" y="433.391304347826" font-family="Courier New, monospace" font-size="13.056399397131" fill="var(--warn-accent)">ld</text>

  <line x1="880" y1="509.04347826087" x2="956" y2="509.04347826087" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="393.04347826087" width="560" height="131.130434782609" rx="6.026030490983" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="428.347826086957" font-family="Arial, sans-serif" font-size="17.073753057786" font-weight="bold" fill="var(--text)">Install (Ubuntu):</text>
  <text x="60" y="463.652173913043" font-family="Courier New, monospace" font-size="15.065076227458" fill="var(--primary-accent)">sudo apt install build-essential gdb binutils</text>
  <text x="60" y="498.95652173913" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--text-muted)">Provides gcc, as, ld, objdump, make.</text>

  <rect x="960" y="125.739130434783" width="280" height="292.521739130435" rx="6.026030490983" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="161.04347826087" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.073753057786" font-weight="bold" fill="var(--warn-text)">gcc as driver</text>
  <text x="980" y="201.391304347826" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">Invokes as and ld:</text>
  <text x="980" y="241.739130434783" font-family="Courier New, monospace" font-size="13.056399397131" fill="var(--warn-text)">gcc -o hello hello.s</text>
  <text x="980" y="287.130434782609" font-family="Arial, sans-serif" font-size="14.060737812294" fill="var(--warn-text)">Or step by step:</text>
  <text x="980" y="322.434782608696" font-family="Courier New, monospace" font-size="13.056399397131" fill="var(--warn-text)">as -o hello.o hello.s</text>
  <text x="980" y="352.695652173913" font-family="Courier New, monospace" font-size="13.056399397131" fill="var(--warn-text)">ld -o hello hello.o</text>
  <text x="980" y="393.04347826087" font-family="Arial, sans-serif" font-size="12.052060981967" fill="var(--warn-text)">(-lc for C stdlib)</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069414642622" fill="var(--text-faint)">Edit, assemble, link, run, debug</text>
</svg>

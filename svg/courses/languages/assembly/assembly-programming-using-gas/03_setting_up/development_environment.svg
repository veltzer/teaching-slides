<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <!-- Tools section header -->
  <rect x="40" y="40" width="560" height="58" rx="7.47359" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="76.909091" font-family="Arial, sans-serif" font-size="22.96248" font-weight="bold" fill="var(--bg)" text-anchor="middle">Development Tools</text>

  <!-- Tool boxes -->
  <!-- gcc -->
  <rect x="40" y="119.090909" width="160" height="105.454545" rx="7.47359" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="120" y="161.272727" font-size="20.66622" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">gcc</text>
  <text x="120" y="195.545455" font-family="Arial, sans-serif" font-size="14.925631" fill="var(--text)" text-anchor="middle">Compiler / Driver</text>

  <!-- as -->
  <rect x="220" y="119.090909" width="160" height="105.454545" rx="7.47359" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="300" y="161.272727" font-size="20.66622" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">as</text>
  <text x="300" y="195.545455" font-family="Arial, sans-serif" font-size="14.925631" fill="var(--text)" text-anchor="middle">GNU Assembler</text>

  <!-- ld -->
  <rect x="400" y="119.090909" width="160" height="105.454545" rx="7.47359" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="480" y="161.272727" font-size="20.66622" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">ld</text>
  <text x="480" y="195.545455" font-family="Arial, sans-serif" font-size="14.925631" fill="var(--text)" text-anchor="middle">Linker</text>

  <!-- gdb -->
  <rect x="40" y="250.909091" width="160" height="105.454545" rx="7.47359" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="120" y="293.090909" font-size="20.66622" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">gdb</text>
  <text x="120" y="327.363636" font-family="Arial, sans-serif" font-size="14.925631" fill="var(--text)" text-anchor="middle">Debugger</text>

  <!-- make -->
  <rect x="220" y="250.909091" width="160" height="105.454545" rx="7.47359" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="300" y="293.090909" font-size="20.66622" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">make</text>
  <text x="300" y="327.363636" font-family="Arial, sans-serif" font-size="14.925631" fill="var(--text)" text-anchor="middle">Build System</text>

  <!-- objdump -->
  <rect x="400" y="250.909091" width="160" height="105.454545" rx="7.47359" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="480" y="287.818182" font-size="18.369959" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">objdump</text>
  <text x="480" y="327.363636" font-family="Arial, sans-serif" font-size="14.925631" fill="var(--text)" text-anchor="middle">Disassembler</text>

  <!-- Compile/Link/Debug Cycle -->
  <rect x="660" y="40" width="580" height="58" rx="7.47359" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="76.909091" font-family="Arial, sans-serif" font-size="22.96248" font-weight="bold" fill="var(--bg)" text-anchor="middle">Compile / Link / Debug Cycle</text>

  <!-- Source file -->
  <rect x="720" y="132.272727" width="160" height="84.363636" rx="7.47359" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="800" y="166.545455" font-size="17.221767" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">hello.s</text>
  <text x="800" y="199.500073" font-family="Arial, sans-serif" font-size="13.777438" fill="var(--text-muted)" text-anchor="middle">Source (.s)</text>

  <!-- Object file -->
  <rect x="720" y="303.636364" width="160" height="84.363636" rx="7.47359" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="800" y="337.909091" font-size="17.221767" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">hello.o</text>
  <text x="800" y="370.863564" font-family="Arial, sans-serif" font-size="13.777438" fill="var(--text-muted)" text-anchor="middle">Object (.o)</text>

  <!-- Executable -->
  <rect x="720" y="475" width="160" height="84.363636" rx="7.47359" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="800" y="509.272727" font-size="17.221767" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">hello</text>
  <text x="800" y="542.227345" font-family="Arial, sans-serif" font-size="13.777438" fill="var(--text-muted)" text-anchor="middle">Executable (ELF)</text>

  <!-- GDB box -->
  <rect x="960" y="475" width="180" height="84.363636" rx="7.47359" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050" y="509.272727" font-size="17.221767" font-weight="bold" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">gdb hello</text>
  <text x="1050" y="542.227345" font-family="Arial, sans-serif" font-size="13.777438" fill="var(--text-muted)" text-anchor="middle">Debug Session</text>

  <!-- Arrows: source -> object -->
  <line x1="800" y1="216.636364" x2="800" y2="298.363636" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="815" y="261.454545" font-size="13.777438" fill="var(--primary-accent)" font-family="Courier New, monospace">as</text>

  <!-- Arrows: object -> executable -->
  <line x1="800" y1="388" x2="800" y2="469.727273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="815" y="432.818182" font-size="13.777438" fill="var(--warn-accent)" font-family="Courier New, monospace">ld</text>

  <!-- Arrow: executable -> gdb -->
  <line x1="880" y1="517.181818" x2="956" y2="517.181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="898" y="506.636364" font-family="Arial, sans-serif" font-size="13.777438" fill="var(--info-accent)">debug</text>

  <!-- Installation note -->
  <rect x="40" y="395.909091" width="560" height="131.818182" rx="7.47359" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="428.863564" font-family="Arial, sans-serif" font-size="17.221767" font-weight="bold" fill="var(--text)">Install (Ubuntu/Debian):</text>
  <text x="60" y="465.772655" font-size="16.073699" fill="var(--primary-accent)" font-family="Courier New, monospace">sudo apt install build-essential gdb binutils</text>
  <text x="60" y="498.727273" font-family="Arial, sans-serif" font-size="14.925631" fill="var(--text-muted)">Provides: gcc, as, ld, ar, objdump, nm, strip, make</text>

  <!-- gcc driver note -->
  <rect x="960" y="132.272727" width="280" height="290" rx="7.47359" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="166.545455" font-family="Arial, sans-serif" font-size="17.221767" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">gcc as driver</text>
  <text x="980" y="204.7728" font-family="Arial, sans-serif" font-size="14.925631" fill="var(--text-muted)">gcc invokes as and ld</text>
  <text x="980" y="231.136436" font-family="Arial, sans-serif" font-size="14.925631" fill="var(--text-muted)">automatically:</text>
  <text x="980" y="266.727273" font-size="13.777438" fill="var(--primary-accent)" font-family="Courier New, monospace">gcc -o hello hello.s</text>
  <text x="980" y="301" font-family="Arial, sans-serif" font-size="14.925631" fill="var(--text-muted)">Or step by step:</text>
  <text x="980" y="333.954473" font-size="13.777438" fill="var(--primary-accent)" font-family="Courier New, monospace">as -o hello.o hello.s</text>
  <text x="980" y="360.318109" font-size="13.777438" fill="var(--primary-accent)" font-family="Courier New, monospace">ld -o hello hello.o</text>
  <text x="980" y="393.272727" font-family="Arial, sans-serif" font-size="12.62937" fill="var(--text-faint)">(-lc for C stdlib)</text>

  <!-- Workflow caption -->
  <text x="640" y="620" font-family="Arial, sans-serif" font-size="16.073699" fill="var(--text-faint)" text-anchor="middle">Edit -&gt; Assemble -&gt; Link -&gt; Run -&gt; Debug -&gt; Repeat</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Header bar -->
  <rect x="40" y="40" width="1200" height="7.25" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>

  <!-- Column headers -->
  <rect x="77.5" y="58.125" width="337.5" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="246.25" y="83.5" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">Feature</text>

  <rect x="443.125" y="58.125" width="337.5" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="611.875" y="83.5" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">AT&amp;T Syntax (GAS)</text>

  <rect x="808.75" y="58.125" width="393.75" height="39.875" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1005.625" y="83.5" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">Intel Syntax (NASM)</text>

  <!-- Row 1: Operand Order -->
  <rect x="77.5" y="110.6875" width="337.5" height="61.625" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="246.25" y="135.1562" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Operand Order</text>
  <text x="246.25" y="156" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)" text-anchor="middle">Which comes first?</text>

  <rect x="443.125" y="110.6875" width="337.5" height="61.625" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="611.875" y="135.1562" font-family="monospace" font-size="14.7479" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">source, destination</text>
  <text x="611.875" y="156" font-family="monospace" font-size="12.9044" fill="var(--text)" text-anchor="middle">movl $42, %eax</text>

  <rect x="808.75" y="110.6875" width="393.75" height="61.625" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1005.625" y="135.1562" font-family="monospace" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">destination, source</text>
  <text x="1005.625" y="156" font-family="monospace" font-size="12.9044" fill="var(--text)" text-anchor="middle">mov eax, 42</text>

  <!-- Row 2: Register Names -->
  <rect x="77.5" y="183.1875" width="337.5" height="61.625" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="246.25" y="207.6562" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Register Names</text>
  <text x="246.25" y="228.5" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)" text-anchor="middle">How are registers named?</text>

  <rect x="443.125" y="183.1875" width="337.5" height="61.625" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="611.875" y="207.6562" font-family="monospace" font-size="14.7479" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">% prefix required</text>
  <text x="611.875" y="228.5" font-family="monospace" font-size="12.9044" fill="var(--text)" text-anchor="middle">%eax  %ebx  %esp</text>

  <rect x="808.75" y="183.1875" width="393.75" height="61.625" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1005.625" y="207.6562" font-family="monospace" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">No prefix</text>
  <text x="1005.625" y="228.5" font-family="monospace" font-size="12.9044" fill="var(--text)" text-anchor="middle">eax   ebx   esp</text>

  <!-- Row 3: Immediate Values -->
  <rect x="77.5" y="255.6875" width="337.5" height="61.625" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="246.25" y="280.1562" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Immediate Values</text>
  <text x="246.25" y="301" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)" text-anchor="middle">Constant literals</text>

  <rect x="443.125" y="255.6875" width="337.5" height="61.625" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="611.875" y="280.1562" font-family="monospace" font-size="14.7479" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">$ prefix required</text>
  <text x="611.875" y="301" font-family="monospace" font-size="12.9044" fill="var(--text)" text-anchor="middle">$42  $0xFF  $0b1010</text>

  <rect x="808.75" y="255.6875" width="393.75" height="61.625" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1005.625" y="280.1562" font-family="monospace" font-size="14.7479" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">No prefix</text>
  <text x="1005.625" y="301" font-family="monospace" font-size="12.9044" fill="var(--text)" text-anchor="middle">42   0xFF   1010b</text>

  <!-- Row 4: Memory References -->
  <rect x="77.5" y="328.1875" width="337.5" height="74.3125" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="246.25" y="352.6562" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Memory References</text>
  <text x="246.25" y="373.5" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)" text-anchor="middle">Addressing mode</text>
  <text x="246.25" y="391.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">Base+Index*Scale+Offset</text>

  <rect x="443.125" y="328.1875" width="337.5" height="74.3125" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="611.875" y="352.6562" font-family="monospace" font-size="13.8261" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Offset(Base,Index,Scale)</text>
  <text x="611.875" y="373.5" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">(%ebx,%ecx,4)</text>
  <text x="611.875" y="391.625" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">8(%ebp)    (%esp)</text>

  <rect x="808.75" y="328.1875" width="393.75" height="74.3125" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1005.625" y="352.6562" font-family="monospace" font-size="13.8261" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">[Base + Index*Scale + Off]</text>
  <text x="1005.625" y="373.5" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">[ebx + ecx*4]</text>
  <text x="1005.625" y="391.625" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">[ebp+8]    [esp]</text>

  <!-- Row 5: Size Suffixes -->
  <rect x="77.5" y="413.375" width="337.5" height="74.3125" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="246.25" y="437.8438" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Size Suffixes</text>
  <text x="246.25" y="458.6875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)" text-anchor="middle">Operand size indicator</text>
  <text x="246.25" y="476.8125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">8/16/32/64-bit</text>

  <rect x="443.125" y="413.375" width="337.5" height="74.3125" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="611.875" y="437.8438" font-family="monospace" font-size="13.8261" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Instruction suffixed</text>
  <text x="611.875" y="458.6875" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">movb  movw  movl  movq</text>
  <text x="611.875" y="476.8125" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">b=byte  w=word  l=long  q=quad</text>

  <rect x="808.75" y="413.375" width="393.75" height="74.3125" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1005.625" y="437.8438" font-family="monospace" font-size="13.8261" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Keyword or register size</text>
  <text x="1005.625" y="458.6875" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">BYTE PTR  WORD PTR  DWORD PTR</text>
  <text x="1005.625" y="476.8125" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">mov al, bl  (inferred from reg)</text>

  <!-- Note at bottom -->
  <rect x="77.5" y="500.375" width="1125" height="38.0625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="516.6875" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">GAS also supports Intel syntax via: </text>
  <text x="640" y="532.0938" font-family="monospace" font-size="13.8261" fill="var(--warn-accent)" text-anchor="middle">.intel_syntax noprefix</text>
</svg>

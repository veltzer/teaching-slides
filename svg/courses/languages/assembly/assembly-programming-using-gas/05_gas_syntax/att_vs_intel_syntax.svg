<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="1280" height="8" fill="url(#grad-primary)"/>

  <!-- Column headers -->
  <rect x="40" y="20" width="360" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="220" y="48" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Feature</text>

  <rect x="430" y="20" width="360" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="610" y="48" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">AT&amp;T Syntax (GAS)</text>

  <rect x="820" y="20" width="420" height="44" rx="6" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="1030" y="48" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Intel Syntax (NASM)</text>

  <!-- Row 1: Operand Order -->
  <rect x="40" y="78" width="360" height="68" rx="4" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <text x="220" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">Operand Order</text>
  <text x="220" y="128" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle">Which comes first?</text>

  <rect x="430" y="78" width="360" height="68" rx="4" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="610" y="105" font-family="monospace" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">source, destination</text>
  <text x="610" y="128" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">movl $42, %eax</text>

  <rect x="820" y="78" width="420" height="68" rx="4" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="1030" y="105" font-family="monospace" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="bold">destination, source</text>
  <text x="1030" y="128" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">mov eax, 42</text>

  <!-- Row 2: Register Names -->
  <rect x="40" y="158" width="360" height="68" rx="4" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <text x="220" y="185" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">Register Names</text>
  <text x="220" y="208" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle">How are registers named?</text>

  <rect x="430" y="158" width="360" height="68" rx="4" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="610" y="185" font-family="monospace" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">% prefix required</text>
  <text x="610" y="208" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">%eax  %ebx  %esp</text>

  <rect x="820" y="158" width="420" height="68" rx="4" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="1030" y="185" font-family="monospace" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="bold">No prefix</text>
  <text x="1030" y="208" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">eax   ebx   esp</text>

  <!-- Row 3: Immediate Values -->
  <rect x="40" y="238" width="360" height="68" rx="4" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <text x="220" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">Immediate Values</text>
  <text x="220" y="288" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle">Constant literals</text>

  <rect x="430" y="238" width="360" height="68" rx="4" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="610" y="265" font-family="monospace" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">$ prefix required</text>
  <text x="610" y="288" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">$42  $0xFF  $0b1010</text>

  <rect x="820" y="238" width="420" height="68" rx="4" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="1030" y="265" font-family="monospace" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="bold">No prefix</text>
  <text x="1030" y="288" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">42   0xFF   1010b</text>

  <!-- Row 4: Memory References -->
  <rect x="40" y="318" width="360" height="82" rx="4" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <text x="220" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">Memory References</text>
  <text x="220" y="368" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle">Addressing mode</text>
  <text x="220" y="388" font-family="Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">Base+Index*Scale+Offset</text>

  <rect x="430" y="318" width="360" height="82" rx="4" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="610" y="345" font-family="monospace" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">Offset(Base,Index,Scale)</text>
  <text x="610" y="368" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">(%ebx,%ecx,4)</text>
  <text x="610" y="388" font-family="monospace" font-size="13" fill="#555555" text-anchor="middle">8(%ebp)    (%esp)</text>

  <rect x="820" y="318" width="420" height="82" rx="4" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="1030" y="345" font-family="monospace" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">[Base + Index*Scale + Off]</text>
  <text x="1030" y="368" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">[ebx + ecx*4]</text>
  <text x="1030" y="388" font-family="monospace" font-size="13" fill="#555555" text-anchor="middle">[ebp+8]    [esp]</text>

  <!-- Row 5: Size Suffixes -->
  <rect x="40" y="412" width="360" height="82" rx="4" fill="url(#grad-surface)" filter="url(#shadow)"/>
  <text x="220" y="439" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">Size Suffixes</text>
  <text x="220" y="462" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle">Operand size indicator</text>
  <text x="220" y="482" font-family="Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">8/16/32/64-bit</text>

  <rect x="430" y="412" width="360" height="82" rx="4" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="610" y="439" font-family="monospace" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">Instruction suffixed</text>
  <text x="610" y="462" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">movb  movw  movl  movq</text>
  <text x="610" y="482" font-family="monospace" font-size="13" fill="#555555" text-anchor="middle">b=byte  w=word  l=long  q=quad</text>

  <rect x="820" y="412" width="420" height="82" rx="4" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="1030" y="439" font-family="monospace" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">Keyword or register size</text>
  <text x="1030" y="462" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">BYTE PTR  WORD PTR  DWORD PTR</text>
  <text x="1030" y="482" font-family="monospace" font-size="13" fill="#555555" text-anchor="middle">mov al, bl  (inferred from reg)</text>

  <!-- Note at bottom -->
  <rect x="40" y="508" width="1200" height="42" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="640" y="526" font-family="Arial, sans-serif" font-size="15" fill="#e65100" text-anchor="middle" font-weight="bold">GAS also supports Intel syntax via: </text>
  <text x="640" y="543" font-family="monospace" font-size="15" fill="#e65100" text-anchor="middle">.intel_syntax noprefix</text>
</svg>

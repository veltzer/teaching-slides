<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="60.9444" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Register widths — each layer is an alias of the same hardware register</text>
  <text x="171.25" y="83.5" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">63</text>
  <text x="471.25" y="83.5" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">32</text>
  <text x="621.25" y="83.5" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">31</text>
  <text x="771.25" y="83.5" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">16</text>
  <text x="846.2499" y="83.5" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">15</text>
  <text x="958.75" y="83.5" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">8</text>
  <text x="1033.75" y="83.5" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">7</text>
  <text x="1146.25" y="83.5" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">0</text>
  <rect x="115" y="89.9444" width="1068.7499" height="41.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="321.25" y="114.9167" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--bg)">RAX</text>
  <text x="752.5" y="114.9167" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">64 bits</text>
  <rect x="621.25" y="144.7223" width="562.5" height="41.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="902.5" y="169.6944" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--bg)">EAX</text>
  <text x="752.5" y="169.6944" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">32 bits</text>
  <rect x="115" y="144.7223" width="504.375" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="367.1875" y="169.6944" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">(upper 32 bits — zeroed on write in 64-bit mode)</text>
  <rect x="846.2499" y="199.5" width="337.5" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1014.9999" y="224.4723" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">AX</text>
  <text x="939.9999" y="224.4723" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">16 bits</text>
  <rect x="115" y="199.5" width="729.375" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="479.6875" y="224.4723" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">(upper 48 bits — not directly accessible via AX)</text>
  <rect x="846.2499" y="254.2777" width="150" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="921.25" y="279.25" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--text)">AH</text>
  <text x="883.75" y="292.1389" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--text-faint)">bits 15–8</text>
  <rect x="1033.75" y="254.2777" width="150" height="41.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1108.7499" y="279.25" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--bg)">AL</text>
  <text x="1071.25" y="292.1389" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--primary-accent)">bits 7–0</text>
  <rect x="115" y="254.2777" width="729.375" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="346.1111" text-anchor="middle" font-family="sans-serif" font-size="14.7735" font-weight="bold" fill="var(--text)">General Purpose Registers — Roles</text>
  <rect x="115" y="359" width="496.875" height="37.0556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="171.25" y="381.5556" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">RAX / EAX</text>
  <text x="358.75" y="381.5556" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">Accumulator · return value</text>
  <rect x="115" y="400.8889" width="496.875" height="37.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="423.4444" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">RBX / EBX</text>
  <text x="358.75" y="423.4444" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Base · callee-saved</text>
  <rect x="115" y="442.7777" width="496.875" height="37.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="465.3333" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">RCX / ECX</text>
  <text x="358.75" y="465.3333" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Counter · loop / 4th arg</text>
  <rect x="115" y="484.6667" width="496.875" height="37.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="507.2223" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">RDX / EDX</text>
  <text x="358.75" y="507.2223" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Data · 3rd arg · mul/div</text>
  <rect x="115" y="526.5556" width="496.875" height="37.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="549.1111" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">RSP / ESP</text>
  <text x="358.75" y="549.1111" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Stack pointer</text>
  <rect x="115" y="568.4444" width="496.875" height="37.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="591" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">RBP / EBP</text>
  <text x="358.75" y="591" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Base pointer · frame</text>
  <rect x="668.125" y="359" width="496.875" height="37.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="724.375" y="381.5556" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">RSI / ESI</text>
  <text x="911.875" y="381.5556" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Source index · 2nd arg</text>
  <rect x="668.125" y="400.8889" width="496.875" height="37.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="724.375" y="423.4444" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">RDI / EDI</text>
  <text x="911.875" y="423.4444" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Dest index · 1st arg</text>
  <rect x="668.125" y="442.7777" width="496.875" height="37.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="724.375" y="465.3333" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">R8–R15</text>
  <text x="911.875" y="465.3333" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">64-bit only · args 5–6</text>
  <rect x="668.125" y="484.6667" width="496.875" height="37.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="724.375" y="507.2223" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">RIP / EIP</text>
  <text x="911.875" y="507.2223" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Instruction pointer</text>
  <rect x="668.125" y="526.5556" width="496.875" height="37.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="724.375" y="549.1111" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">RFLAGS</text>
  <text x="911.875" y="549.1111" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">Status flags · ZF CF SF OF</text>
  <rect x="668.125" y="568.4444" width="496.875" height="37.0556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="724.375" y="591" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">XMM0–15</text>
  <text x="911.875" y="591" font-family="sans-serif" font-size="13.9044" fill="var(--text-muted)">128-bit · SSE / float</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="629.473684" y="40" text-anchor="middle" font-size="15.205395" fill="var(--text-muted)" font-family="Arial, sans-serif">Register widths — each layer is an alias of the same hardware register</text>
  <text x="103.157895" y="64.023714" text-anchor="middle" font-size="12.354465" fill="var(--text-faint)" font-family="Courier New, monospace">63</text>
  <text x="440" y="64.023714" text-anchor="middle" font-size="12.354465" fill="var(--text-faint)" font-family="Courier New, monospace">32</text>
  <text x="608.421053" y="64.023714" text-anchor="middle" font-size="12.354465" fill="var(--text-faint)" font-family="Courier New, monospace">31</text>
  <text x="776.842105" y="64.023714" text-anchor="middle" font-size="12.354465" fill="var(--text-faint)" font-family="Courier New, monospace">16</text>
  <text x="861.052519" y="64.023714" text-anchor="middle" font-size="12.354465" fill="var(--text-faint)" font-family="Courier New, monospace">15</text>
  <text x="987.368421" y="64.023714" text-anchor="middle" font-size="12.354465" fill="var(--text-faint)" font-family="Courier New, monospace">8</text>
  <text x="1071.578947" y="64.023714" text-anchor="middle" font-size="12.354465" fill="var(--text-faint)" font-family="Courier New, monospace">7</text>
  <text x="1197.894737" y="64.023714" text-anchor="middle" font-size="12.354465" fill="var(--text-faint)" font-family="Courier New, monospace">0</text>
  <rect x="40" y="70.887571" width="1199.999888" height="44.615393" rx="6.561403" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="271.578947" y="97.485285" text-anchor="middle" font-size="20.907472" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">RAX</text>
  <text x="755.789474" y="97.485285" text-anchor="middle" font-size="14.255085" fill="var(--primary-accent)" font-family="Arial, sans-serif">64 bits</text>
  <rect x="608.421053" y="129.230892" width="631.578947" height="44.615393" rx="6.561403" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="924.210526" y="155.828393" text-anchor="middle" font-size="20.907472" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">EAX</text>
  <text x="755.789474" y="155.828393" text-anchor="middle" font-size="14.255085" fill="var(--primary-accent)" font-family="Arial, sans-serif">32 bits</text>
  <rect x="40" y="129.230892" width="566.315789" height="44.615393" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="323.157895" y="155.828393" text-anchor="middle" font-size="13.304666" fill="var(--text-faint)" font-family="Arial, sans-serif">(upper 32 bits — zeroed on write in 64-bit mode)</text>
  <rect x="861.052519" y="187.574" width="378.947368" height="44.615393" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1050.526204" y="214.171714" text-anchor="middle" font-size="20.907472" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">AX</text>
  <text x="966.315677" y="214.171714" text-anchor="middle" font-size="14.255085" fill="var(--text-muted)" font-family="Arial, sans-serif">16 bits</text>
  <rect x="40" y="187.574" width="818.947368" height="44.615393" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="449.473684" y="214.171714" text-anchor="middle" font-size="13.304666" fill="var(--text-faint)" font-family="Arial, sans-serif">(upper 48 bits — not directly accessible via AX)</text>
  <rect x="861.052519" y="245.917107" width="168.421053" height="44.615393" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="945.263158" y="272.514821" text-anchor="middle" font-size="20.907472" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">AH</text>
  <text x="903.157895" y="286.242643" text-anchor="middle" font-size="11.404155" fill="var(--text-faint)" font-family="Arial, sans-serif">bits 15–8</text>
  <rect x="1071.578947" y="245.917107" width="168.421053" height="44.615393" rx="6.561403" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1155.789361" y="272.514821" text-anchor="middle" font-size="20.907472" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">AL</text>
  <text x="1113.684211" y="286.242643" text-anchor="middle" font-size="11.404155" fill="var(--primary-accent)" font-family="Arial, sans-serif">bits 7–0</text>
  <rect x="40" y="245.917107" width="818.947368" height="44.615393" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="629.473684" y="343.727821" text-anchor="middle" font-size="16.155814" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">General Purpose Registers — Roles</text>
  <rect x="40" y="357.455643" width="557.894737" height="39.4675" rx="6.561403" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="103.157895" y="381.479357" font-size="17.106124" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">RAX / EAX</text>
  <text x="313.684211" y="381.479357" font-size="15.205395" fill="var(--primary-accent)" font-family="Arial, sans-serif">Accumulator · return value</text>
  <rect x="40" y="402.071036" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="103.157895" y="426.094643" font-size="17.106124" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">RBX / EBX</text>
  <text x="313.684211" y="426.094643" font-size="15.205395" fill="var(--text-muted)" font-family="Arial, sans-serif">Base · callee-saved</text>
  <rect x="40" y="446.686322" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="103.157895" y="470.710036" font-size="17.106124" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">RCX / ECX</text>
  <text x="313.684211" y="470.710036" font-size="15.205395" fill="var(--text-muted)" font-family="Arial, sans-serif">Counter · loop / 4th arg</text>
  <rect x="40" y="491.301821" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="103.157895" y="515.325535" font-size="17.106124" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">RDX / EDX</text>
  <text x="313.684211" y="515.325535" font-size="15.205395" fill="var(--text-muted)" font-family="Arial, sans-serif">Data · 3rd arg · mul/div</text>
  <rect x="40" y="535.917214" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="103.157895" y="559.940821" font-size="17.106124" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">RSP / ESP</text>
  <text x="313.684211" y="559.940821" font-size="15.205395" fill="var(--text-muted)" font-family="Arial, sans-serif">Stack pointer</text>
  <rect x="40" y="580.5325" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="103.157895" y="604.556214" font-size="17.106124" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">RBP / EBP</text>
  <text x="313.684211" y="604.556214" font-size="15.205395" fill="var(--text-muted)" font-family="Arial, sans-serif">Base pointer · frame</text>
  <rect x="661.052632" y="357.455643" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="724.210526" y="381.479357" font-size="17.106124" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">RSI / ESI</text>
  <text x="934.736842" y="381.479357" font-size="15.205395" fill="var(--text-muted)" font-family="Arial, sans-serif">Source index · 2nd arg</text>
  <rect x="661.052632" y="402.071036" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="724.210526" y="426.094643" font-size="17.106124" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">RDI / EDI</text>
  <text x="934.736842" y="426.094643" font-size="15.205395" fill="var(--text-muted)" font-family="Arial, sans-serif">Dest index · 1st arg</text>
  <rect x="661.052632" y="446.686322" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="724.210526" y="470.710036" font-size="17.106124" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">R8–R15</text>
  <text x="934.736842" y="470.710036" font-size="15.205395" fill="var(--text-muted)" font-family="Arial, sans-serif">64-bit only · args 5–6</text>
  <rect x="661.052632" y="491.301821" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="724.210526" y="515.325535" font-size="17.106124" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">RIP / EIP</text>
  <text x="934.736842" y="515.325535" font-size="15.205395" fill="var(--text-muted)" font-family="Arial, sans-serif">Instruction pointer</text>
  <rect x="661.052632" y="535.917214" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="724.210526" y="559.940821" font-size="17.106124" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">RFLAGS</text>
  <text x="934.736842" y="559.940821" font-size="15.205395" fill="var(--text-muted)" font-family="Arial, sans-serif">Status flags · ZF CF SF OF</text>
  <rect x="661.052632" y="580.5325" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="724.210526" y="604.556214" font-size="17.106124" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">XMM0–15</text>
  <text x="934.736842" y="604.556214" font-size="15.205395" fill="var(--text-muted)" font-family="Arial, sans-serif">128-bit · SSE / float</text>
</svg>
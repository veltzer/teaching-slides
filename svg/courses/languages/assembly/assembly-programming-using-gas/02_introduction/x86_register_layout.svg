<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.299708193792" font-weight="bold" fill="var(--text)">x86 Register Layout</text>

  <text x="103" y="70.905861456483" text-anchor="middle" font-family="Courier New, monospace" font-size="12.179824916275" fill="var(--text-faint)">63</text>
  <text x="608" y="70.905861456483" text-anchor="middle" font-family="Courier New, monospace" font-size="12.179824916275" fill="var(--text-faint)">31</text>
  <text x="861" y="70.905861456483" text-anchor="middle" font-family="Courier New, monospace" font-size="12.179824916275" fill="var(--text-faint)">15</text>
  <text x="1071" y="70.905861456483" text-anchor="middle" font-family="Courier New, monospace" font-size="12.179824916275" fill="var(--text-faint)">7</text>
  <text x="1197" y="70.905861456483" text-anchor="middle" font-family="Courier New, monospace" font-size="12.179824916275" fill="var(--text-faint)">0</text>

  <rect x="40" y="81.207815275311" width="1200" height="46.358792184725" rx="8.119883277517" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="271" y="110.053285968028" text-anchor="middle" font-family="Courier New, monospace" font-size="20.299708193792" font-weight="bold" fill="var(--primary-text)">RAX</text>
  <text x="755" y="110.053285968028" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--primary-text)">64 bits</text>

  <rect x="40" y="137.868561278863" width="568" height="46.358792184725" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <rect x="608" y="137.868561278863" width="632" height="46.358792184725" rx="8.119883277517" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="924" y="166.714031971581" text-anchor="middle" font-family="Courier New, monospace" font-size="20.299708193792" font-weight="bold" fill="var(--primary-text)">EAX</text>
  <text x="755" y="166.714031971581" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--primary-text)">32 bits</text>

  <rect x="40" y="194.529307282416" width="820" height="46.358792184725" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <rect x="861" y="194.529307282416" width="379" height="46.358792184725" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="1050" y="223.374777975133" text-anchor="middle" font-family="Courier New, monospace" font-size="20.299708193792" font-weight="bold" fill="var(--text)">AX</text>

  <rect x="40" y="251.190053285968" width="820" height="46.358792184725" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <rect x="861" y="251.190053285968" width="169" height="46.358792184725" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="945" y="280.035523978686" text-anchor="middle" font-family="Courier New, monospace" font-size="20.299708193792" font-weight="bold" fill="var(--text)">AH</text>
  <rect x="1071" y="251.190053285968" width="169" height="46.358792184725" rx="8.119883277517" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1155" y="280.035523978686" text-anchor="middle" font-family="Courier New, monospace" font-size="20.299708193792" font-weight="bold" fill="var(--primary-text)">AL</text>

  <text x="640" y="333.60568383659" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.239766555034" font-weight="bold" fill="var(--text)">General Purpose</text>

  <rect x="40" y="349.058614564831" width="560" height="39.147424511545" rx="8.119883277517" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="374.813499111901" font-family="Courier New, monospace" font-size="14.209795735654" font-weight="bold" fill="var(--primary-text)">RAX</text>
  <text x="200" y="374.813499111901" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--primary-text)">accumulator, return</text>

  <rect x="40" y="395.417406749556" width="560" height="39.147424511545" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="100" y="421.172291296625" font-family="Courier New, monospace" font-size="14.209795735654" font-weight="bold" fill="var(--text)">RBX</text>
  <text x="200" y="421.172291296625" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--text-muted)">callee-saved</text>

  <rect x="40" y="441.776198934281" width="560" height="39.147424511545" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="100" y="467.53108348135" font-family="Courier New, monospace" font-size="14.209795735654" font-weight="bold" fill="var(--text)">RCX</text>
  <text x="200" y="467.53108348135" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--text-muted)">counter</text>

  <rect x="40" y="488.134991119005" width="560" height="39.147424511545" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="100" y="513.889875666075" font-family="Courier New, monospace" font-size="14.209795735654" font-weight="bold" fill="var(--text)">RDX</text>
  <text x="200" y="513.889875666075" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--text-muted)">data, mul/div</text>

  <rect x="40" y="534.49378330373" width="560" height="39.147424511545" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="100" y="560.248667850799" font-family="Courier New, monospace" font-size="14.209795735654" font-weight="bold" fill="var(--text)">RSP</text>
  <text x="200" y="560.248667850799" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--text-muted)">stack pointer</text>

  <rect x="40" y="580.852575488455" width="560" height="39.147424511545" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="100" y="606.607460035524" font-family="Courier New, monospace" font-size="14.209795735654" font-weight="bold" fill="var(--text)">RBP</text>
  <text x="200" y="606.607460035524" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--text-muted)">frame pointer</text>

  <rect x="680" y="349.058614564831" width="560" height="39.147424511545" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="740" y="374.813499111901" font-family="Courier New, monospace" font-size="14.209795735654" font-weight="bold" fill="var(--text)">RSI</text>
  <text x="840" y="374.813499111901" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--text-muted)">source, arg2</text>

  <rect x="680" y="395.417406749556" width="560" height="39.147424511545" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="740" y="421.172291296625" font-family="Courier New, monospace" font-size="14.209795735654" font-weight="bold" fill="var(--text)">RDI</text>
  <text x="840" y="421.172291296625" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--text-muted)">dest, arg1</text>

  <rect x="680" y="441.776198934281" width="560" height="39.147424511545" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="740" y="467.53108348135" font-family="Courier New, monospace" font-size="14.209795735654" font-weight="bold" fill="var(--text)">R8-R15</text>
  <text x="840" y="467.53108348135" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--text-muted)">64-bit only</text>

  <rect x="680" y="488.134991119005" width="560" height="39.147424511545" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="740" y="513.889875666075" font-family="Courier New, monospace" font-size="14.209795735654" font-weight="bold" fill="var(--text)">RIP</text>
  <text x="840" y="513.889875666075" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--text-muted)">instruction pointer</text>

  <rect x="680" y="534.49378330373" width="560" height="39.147424511545" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="740" y="560.248667850799" font-family="Courier New, monospace" font-size="14.209795735654" font-weight="bold" fill="var(--text)">RFLAGS</text>
  <text x="840" y="560.248667850799" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--text-muted)">ZF CF SF OF</text>

  <rect x="680" y="580.852575488455" width="560" height="39.147424511545" rx="8.119883277517" fill="var(--surface)" stroke="var(--border)"/>
  <text x="740" y="606.607460035524" font-family="Courier New, monospace" font-size="14.209795735654" font-weight="bold" fill="var(--text)">XMM0-15</text>
  <text x="840" y="606.607460035524" font-family="Arial, sans-serif" font-size="13.194810325965" fill="var(--text-muted)">128-bit SSE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="568.8889" y="23.1111" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Register widths — each layer is an alias of the same hardware register</text>
  <text x="124.4444" y="48" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">63</text>
  <text x="408.8889" y="48" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">32</text>
  <text x="551.1111" y="48" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">31</text>
  <text x="693.3333" y="48" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">16</text>
  <text x="764.4444" y="48" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">15</text>
  <text x="871.1111" y="48" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">8</text>
  <text x="942.2222" y="48" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">7</text>
  <text x="1048.8889" y="48" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">0</text>
  <rect x="71.1111" y="55.1111" width="1013.3333" height="46.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="266.6667" y="82.6667" text-anchor="middle" font-family="monospace" font-size="19.5556" font-weight="bold" fill="var(--bg)">RAX</text>
  <text x="675.5556" y="82.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">64 bits</text>
  <rect x="551.1111" y="115.5556" width="533.3333" height="46.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="817.7778" y="143.1111" text-anchor="middle" font-family="monospace" font-size="19.5556" font-weight="bold" fill="var(--bg)">EAX</text>
  <text x="675.5556" y="143.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">32 bits</text>
  <rect x="71.1111" y="115.5556" width="478.2222" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="310.2222" y="143.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">(upper 32 bits — zeroed on write in 64-bit mode)</text>
  <rect x="764.4444" y="176" width="320" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="924.4444" y="203.5556" text-anchor="middle" font-family="monospace" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">AX</text>
  <text x="853.3333" y="203.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">16 bits</text>
  <rect x="71.1111" y="176" width="691.5556" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="416.8889" y="203.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">(upper 48 bits — not directly accessible via AX)</text>
  <rect x="764.4444" y="236.4444" width="142.2222" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="835.5556" y="264" text-anchor="middle" font-family="monospace" font-size="19.5556" font-weight="bold" fill="var(--text)">AH</text>
  <text x="800" y="278.2222" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--text-faint)">bits 15–8</text>
  <rect x="942.2222" y="236.4444" width="142.2222" height="46.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1013.3333" y="264" text-anchor="middle" font-family="monospace" font-size="19.5556" font-weight="bold" fill="var(--bg)">AL</text>
  <text x="977.7778" y="278.2222" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--primary-accent)">bits 7–0</text>
  <rect x="71.1111" y="236.4444" width="691.5556" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="337.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--text)">General Purpose Registers — Roles</text>
  <rect x="71.1111" y="352" width="471.1111" height="40.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="124.4444" y="376.8889" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">RAX / EAX</text>
  <text x="302.2222" y="376.8889" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">Accumulator · return value</text>
  <rect x="71.1111" y="398.2222" width="471.1111" height="40.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="124.4444" y="423.1111" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">RBX / EBX</text>
  <text x="302.2222" y="423.1111" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Base · callee-saved</text>
  <rect x="71.1111" y="444.4444" width="471.1111" height="40.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="124.4444" y="469.3333" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">RCX / ECX</text>
  <text x="302.2222" y="469.3333" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Counter · loop / 4th arg</text>
  <rect x="71.1111" y="490.6667" width="471.1111" height="40.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="124.4444" y="515.5556" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">RDX / EDX</text>
  <text x="302.2222" y="515.5556" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Data · 3rd arg · mul/div</text>
  <rect x="71.1111" y="536.8889" width="471.1111" height="40.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="124.4444" y="561.7778" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">RSP / ESP</text>
  <text x="302.2222" y="561.7778" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Stack pointer</text>
  <rect x="71.1111" y="583.1111" width="471.1111" height="40.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="124.4444" y="608" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">RBP / EBP</text>
  <text x="302.2222" y="608" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Base pointer · frame</text>
  <rect x="595.5556" y="352" width="471.1111" height="40.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="648.8889" y="376.8889" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">RSI / ESI</text>
  <text x="826.6667" y="376.8889" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Source index · 2nd arg</text>
  <rect x="595.5556" y="398.2222" width="471.1111" height="40.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="648.8889" y="423.1111" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">RDI / EDI</text>
  <text x="826.6667" y="423.1111" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Dest index · 1st arg</text>
  <rect x="595.5556" y="444.4444" width="471.1111" height="40.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="648.8889" y="469.3333" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">R8–R15</text>
  <text x="826.6667" y="469.3333" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">64-bit only · args 5–6</text>
  <rect x="595.5556" y="490.6667" width="471.1111" height="40.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="648.8889" y="515.5556" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">RIP / EIP</text>
  <text x="826.6667" y="515.5556" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Instruction pointer</text>
  <rect x="595.5556" y="536.8889" width="471.1111" height="40.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="648.8889" y="561.7778" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">RFLAGS</text>
  <text x="826.6667" y="561.7778" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">Status flags · ZF CF SF OF</text>
  <rect x="595.5556" y="583.1111" width="471.1111" height="40.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="648.8889" y="608" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">XMM0–15</text>
  <text x="826.6667" y="608" font-family="sans-serif" font-size="14.2222" fill="var(--text-muted)">128-bit · SSE / float</text>
</svg>
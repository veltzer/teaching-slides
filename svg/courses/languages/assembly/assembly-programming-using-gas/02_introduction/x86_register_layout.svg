<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Bit position ruler at top -->
  <text x="640" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Register widths — each layer is an alias of the same hardware register</text>

  <!-- Bit numbers -->
  <text x="140" y="54" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">63</text>
  <text x="460" y="54" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">32</text>
  <text x="620" y="54" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">31</text>
  <text x="780" y="54" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">16</text>
  <text x="860" y="54" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">15</text>
  <text x="980" y="54" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">8</text>
  <text x="1060" y="54" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">7</text>
  <text x="1180" y="54" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">0</text>

  <!-- RAX row (64-bit) -->
  <rect x="80" y="62" width="1140" height="52" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="300" y="93" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">RAX</text>
  <text x="760" y="93" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#bbdefb">64 bits</text>

  <!-- EAX row (32-bit, right half) -->
  <rect x="620" y="130" width="600" height="52" rx="4" fill="#1976d2" filter="url(#shadow)"/>
  <text x="920" y="161" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">EAX</text>
  <text x="760" y="161" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#bbdefb">32 bits</text>
  <!-- Gray filler for upper half -->
  <rect x="80" y="130" width="538" height="52" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="349" y="161" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">(upper 32 bits — zeroed on write in 64-bit mode)</text>

  <!-- AX row (16-bit) -->
  <rect x="860" y="198" width="360" height="52" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1040" y="229" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#1565c0">AX</text>
  <text x="960" y="229" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">16 bits</text>
  <rect x="80" y="198" width="778" height="52" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="469" y="229" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">(upper 48 bits — not directly accessible via AX)</text>

  <!-- AH row (bits 15-8) -->
  <rect x="860" y="266" width="160" height="52" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="940" y="297" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#212121">AH</text>
  <text x="900" y="313" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9e9e9e">bits 15–8</text>

  <!-- AL row (bits 7-0) -->
  <rect x="1060" y="266" width="160" height="52" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1140" y="297" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">AL</text>
  <text x="1100" y="313" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#bbdefb">bits 7–0</text>
  <rect x="80" y="266" width="778" height="52" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- General purpose register table -->
  <text x="640" y="380" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#212121">General Purpose Registers — Roles</text>

  <!-- 2-column table -->
  <!-- Left column -->
  <rect x="80"  y="396" width="530" height="46" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="140" y="424" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">RAX / EAX</text>
  <text x="340" y="424" font-family="sans-serif" font-size="16" fill="#bbdefb">Accumulator · return value</text>

  <rect x="80"  y="448" width="530" height="46" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="476" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">RBX / EBX</text>
  <text x="340" y="476" font-family="sans-serif" font-size="16" fill="#555555">Base · callee-saved</text>

  <rect x="80"  y="500" width="530" height="46" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="528" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">RCX / ECX</text>
  <text x="340" y="528" font-family="sans-serif" font-size="16" fill="#555555">Counter · loop / 4th arg</text>

  <rect x="80"  y="552" width="530" height="46" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="580" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">RDX / EDX</text>
  <text x="340" y="580" font-family="sans-serif" font-size="16" fill="#555555">Data · 3rd arg · mul/div</text>

  <rect x="80"  y="604" width="530" height="46" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="632" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">RSP / ESP</text>
  <text x="340" y="632" font-family="sans-serif" font-size="16" fill="#555555">Stack pointer</text>

  <rect x="80"  y="656" width="530" height="46" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="684" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">RBP / EBP</text>
  <text x="340" y="684" font-family="sans-serif" font-size="16" fill="#555555">Base pointer · frame</text>

  <!-- Right column -->
  <rect x="670" y="396" width="530" height="46" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="730" y="424" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">RSI / ESI</text>
  <text x="930" y="424" font-family="sans-serif" font-size="16" fill="#555555">Source index · 2nd arg</text>

  <rect x="670" y="448" width="530" height="46" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="730" y="476" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">RDI / EDI</text>
  <text x="930" y="476" font-family="sans-serif" font-size="16" fill="#555555">Dest index · 1st arg</text>

  <rect x="670" y="500" width="530" height="46" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="730" y="528" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">R8–R15</text>
  <text x="930" y="528" font-family="sans-serif" font-size="16" fill="#555555">64-bit only · args 5–6</text>

  <rect x="670" y="552" width="530" height="46" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="730" y="580" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">RIP / EIP</text>
  <text x="930" y="580" font-family="sans-serif" font-size="16" fill="#555555">Instruction pointer</text>

  <rect x="670" y="604" width="530" height="46" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="730" y="632" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">RFLAGS</text>
  <text x="930" y="632" font-family="sans-serif" font-size="16" fill="#555555">Status flags · ZF CF SF OF</text>

  <rect x="670" y="656" width="530" height="46" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="730" y="684" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">XMM0–15</text>
  <text x="930" y="684" font-family="sans-serif" font-size="16" fill="#555555">128-bit · SSE / float</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="629.473684" y="40" text-anchor="middle" font-family="sans-serif" font-size="15.205395" fill="var(--text-muted)">Register widths — each layer is an alias of the same hardware register</text>
  <text x="103.157895" y="64.023714" text-anchor="middle" font-family="monospace" font-size="12.354465" fill="var(--text-faint)">63</text>
  <text x="440" y="64.023714" text-anchor="middle" font-family="monospace" font-size="12.354465" fill="var(--text-faint)">32</text>
  <text x="608.421053" y="64.023714" text-anchor="middle" font-family="monospace" font-size="12.354465" fill="var(--text-faint)">31</text>
  <text x="776.842105" y="64.023714" text-anchor="middle" font-family="monospace" font-size="12.354465" fill="var(--text-faint)">16</text>
  <text x="861.052519" y="64.023714" text-anchor="middle" font-family="monospace" font-size="12.354465" fill="var(--text-faint)">15</text>
  <text x="987.368421" y="64.023714" text-anchor="middle" font-family="monospace" font-size="12.354465" fill="var(--text-faint)">8</text>
  <text x="1071.578947" y="64.023714" text-anchor="middle" font-family="monospace" font-size="12.354465" fill="var(--text-faint)">7</text>
  <text x="1197.894737" y="64.023714" text-anchor="middle" font-family="monospace" font-size="12.354465" fill="var(--text-faint)">0</text>
  <rect x="40" y="70.887571" width="1199.999888" height="44.615393" rx="6.561403" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="271.578947" y="97.485285" text-anchor="middle" font-family="monospace" font-size="20.907472" font-weight="bold" fill="var(--bg)">RAX</text>
  <text x="755.789474" y="97.485285" text-anchor="middle" font-family="sans-serif" font-size="14.255085" fill="var(--primary-accent)">64 bits</text>
  <rect x="608.421053" y="129.230892" width="631.578947" height="44.615393" rx="6.561403" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="924.210526" y="155.828393" text-anchor="middle" font-family="monospace" font-size="20.907472" font-weight="bold" fill="var(--bg)">EAX</text>
  <text x="755.789474" y="155.828393" text-anchor="middle" font-family="sans-serif" font-size="14.255085" fill="var(--primary-accent)">32 bits</text>
  <rect x="40" y="129.230892" width="566.315789" height="44.615393" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="323.157895" y="155.828393" text-anchor="middle" font-family="sans-serif" font-size="13.304666" fill="var(--text-faint)">(upper 32 bits — zeroed on write in 64-bit mode)</text>
  <rect x="861.052519" y="187.574" width="378.947368" height="44.615393" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1050.526204" y="214.171714" text-anchor="middle" font-family="monospace" font-size="20.907472" font-weight="bold" fill="var(--primary-accent)">AX</text>
  <text x="966.315677" y="214.171714" text-anchor="middle" font-family="sans-serif" font-size="14.255085" fill="var(--text-muted)">16 bits</text>
  <rect x="40" y="187.574" width="818.947368" height="44.615393" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="449.473684" y="214.171714" text-anchor="middle" font-family="sans-serif" font-size="13.304666" fill="var(--text-faint)">(upper 48 bits — not directly accessible via AX)</text>
  <rect x="861.052519" y="245.917107" width="168.421053" height="44.615393" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="945.263158" y="272.514821" text-anchor="middle" font-family="monospace" font-size="20.907472" font-weight="bold" fill="var(--text)">AH</text>
  <text x="903.157895" y="286.242643" text-anchor="middle" font-family="sans-serif" font-size="11.404155" fill="var(--text-faint)">bits 15–8</text>
  <rect x="1071.578947" y="245.917107" width="168.421053" height="44.615393" rx="6.561403" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1155.789361" y="272.514821" text-anchor="middle" font-family="monospace" font-size="20.907472" font-weight="bold" fill="var(--bg)">AL</text>
  <text x="1113.684211" y="286.242643" text-anchor="middle" font-family="sans-serif" font-size="11.404155" fill="var(--primary-accent)">bits 7–0</text>
  <rect x="40" y="245.917107" width="818.947368" height="44.615393" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="629.473684" y="343.727821" text-anchor="middle" font-family="sans-serif" font-size="16.155814" font-weight="bold" fill="var(--text)">General Purpose Registers — Roles</text>
  <rect x="40" y="357.455643" width="557.894737" height="39.4675" rx="6.561403" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="103.157895" y="381.479357" font-family="monospace" font-size="17.106124" font-weight="bold" fill="var(--bg)">RAX / EAX</text>
  <text x="313.684211" y="381.479357" font-family="sans-serif" font-size="15.205395" fill="var(--primary-accent)">Accumulator · return value</text>
  <rect x="40" y="402.071036" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="103.157895" y="426.094643" font-family="monospace" font-size="17.106124" font-weight="bold" fill="var(--text)">RBX / EBX</text>
  <text x="313.684211" y="426.094643" font-family="sans-serif" font-size="15.205395" fill="var(--text-muted)">Base · callee-saved</text>
  <rect x="40" y="446.686322" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="103.157895" y="470.710036" font-family="monospace" font-size="17.106124" font-weight="bold" fill="var(--text)">RCX / ECX</text>
  <text x="313.684211" y="470.710036" font-family="sans-serif" font-size="15.205395" fill="var(--text-muted)">Counter · loop / 4th arg</text>
  <rect x="40" y="491.301821" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="103.157895" y="515.325535" font-family="monospace" font-size="17.106124" font-weight="bold" fill="var(--text)">RDX / EDX</text>
  <text x="313.684211" y="515.325535" font-family="sans-serif" font-size="15.205395" fill="var(--text-muted)">Data · 3rd arg · mul/div</text>
  <rect x="40" y="535.917214" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="103.157895" y="559.940821" font-family="monospace" font-size="17.106124" font-weight="bold" fill="var(--text)">RSP / ESP</text>
  <text x="313.684211" y="559.940821" font-family="sans-serif" font-size="15.205395" fill="var(--text-muted)">Stack pointer</text>
  <rect x="40" y="580.5325" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="103.157895" y="604.556214" font-family="monospace" font-size="17.106124" font-weight="bold" fill="var(--text)">RBP / EBP</text>
  <text x="313.684211" y="604.556214" font-family="sans-serif" font-size="15.205395" fill="var(--text-muted)">Base pointer · frame</text>
  <rect x="661.052632" y="357.455643" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="724.210526" y="381.479357" font-family="monospace" font-size="17.106124" font-weight="bold" fill="var(--text)">RSI / ESI</text>
  <text x="934.736842" y="381.479357" font-family="sans-serif" font-size="15.205395" fill="var(--text-muted)">Source index · 2nd arg</text>
  <rect x="661.052632" y="402.071036" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="724.210526" y="426.094643" font-family="monospace" font-size="17.106124" font-weight="bold" fill="var(--text)">RDI / EDI</text>
  <text x="934.736842" y="426.094643" font-family="sans-serif" font-size="15.205395" fill="var(--text-muted)">Dest index · 1st arg</text>
  <rect x="661.052632" y="446.686322" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="724.210526" y="470.710036" font-family="monospace" font-size="17.106124" font-weight="bold" fill="var(--text)">R8–R15</text>
  <text x="934.736842" y="470.710036" font-family="sans-serif" font-size="15.205395" fill="var(--text-muted)">64-bit only · args 5–6</text>
  <rect x="661.052632" y="491.301821" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="724.210526" y="515.325535" font-family="monospace" font-size="17.106124" font-weight="bold" fill="var(--text)">RIP / EIP</text>
  <text x="934.736842" y="515.325535" font-family="sans-serif" font-size="15.205395" fill="var(--text-muted)">Instruction pointer</text>
  <rect x="661.052632" y="535.917214" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="724.210526" y="559.940821" font-family="monospace" font-size="17.106124" font-weight="bold" fill="var(--text)">RFLAGS</text>
  <text x="934.736842" y="559.940821" font-family="sans-serif" font-size="15.205395" fill="var(--text-muted)">Status flags · ZF CF SF OF</text>
  <rect x="661.052632" y="580.5325" width="557.894737" height="39.4675" rx="6.561403" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="724.210526" y="604.556214" font-family="monospace" font-size="17.106124" font-weight="bold" fill="var(--text)">XMM0–15</text>
  <text x="934.736842" y="604.556214" font-family="sans-serif" font-size="15.205395" fill="var(--text-muted)">128-bit · SSE / float</text>
</svg>
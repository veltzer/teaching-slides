<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="290" height="284.528301886793" rx="6.27664133236" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="78.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--primary-text)">ADD / SUB</text>
  <text x="185" y="127.547169811321" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--primary-text)">addl %ebx, %eax</text>
  <text x="185" y="165.849056603773" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--primary-text)">dest = dest + src</text>
  <text x="185" y="209.622641509434" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--primary-text)">subl src, dest</text>
  <text x="185" y="247.924528301887" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--primary-text)">10 + 5 → 15</text>

  <rect x="340" y="40" width="290" height="284.528301886793" rx="6.27664133236" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="78.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--ok-text)">MUL / IMUL</text>
  <text x="485" y="127.547169811321" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--ok-text)">mull %ebx</text>
  <text x="485" y="165.849056603773" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--ok-text)">Uses EAX</text>
  <text x="485" y="198.679245283019" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--ok-text)">Result: EDX:EAX</text>
  <text x="485" y="242.452830188679" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--ok-text)">imull = signed</text>

  <rect x="640" y="40" width="290" height="284.528301886793" rx="6.27664133236" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="78.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--warn-text)">DIV / IDIV</text>
  <text x="785" y="127.547169811321" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--warn-text)">divl %ebx</text>
  <text x="785" y="165.849056603773" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--warn-text)">EDX:EAX / src</text>
  <text x="785" y="198.679245283019" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--warn-text)">EAX=quot, EDX=rem</text>
  <text x="785" y="242.452830188679" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--warn-text)">idivl = signed</text>

  <rect x="940" y="40" width="300" height="284.528301886793" rx="6.27664133236" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="78.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--danger-text)">INC / DEC / NEG</text>
  <text x="1090" y="127.547169811321" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--danger-text)">incl %eax</text>
  <text x="1090" y="165.849056603773" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--danger-text)">decl %eax</text>
  <text x="1090" y="204.150943396227" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--danger-text)">negl %eax</text>
  <text x="1090" y="247.924528301887" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553282664721" fill="var(--danger-text)">inc/dec: no CF update</text>

  <!-- Flags -->
  <rect x="40" y="346.415094339623" width="1200" height="109.43396226415" rx="6.27664133236" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="379.245283018868" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" font-weight="bold" fill="var(--text)">EFLAGS: ZF (zero)  •  CF (unsigned overflow)  •  OF (signed overflow)</text>
  <text x="640" y="417.547169811321" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--text-muted)">SF (negative)  •  PF (parity)  •  AF (BCD carry)</text>

  <!-- Setup code -->
  <rect x="40" y="477.735849056604" width="1200" height="142.264150943396" rx="6.27664133236" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="510.566037735848" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" font-weight="bold" fill="var(--info-text)">Division setup (32-bit)</text>
  <text x="60" y="543.396226415094" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--info-text)">xorl %edx, %edx</text>
  <text x="60" y="570.754716981132" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--info-text)">movl $100, %eax</text>
  <text x="60" y="598.11320754717" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--info-text)">divl %ebx</text>
</svg>

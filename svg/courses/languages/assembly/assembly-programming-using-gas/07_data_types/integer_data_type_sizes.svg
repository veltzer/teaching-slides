  <text x="321.25" y="345.4062" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">.long / EAX</text>

  <text x="588.4375" y="331.8125" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--ok-accent)" text-anchor="start">}</text>
  <text x="640" y="334.5312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">32-bit  (4 bytes)</text>

  <!-- QWORD row -->
  <rect x="68.125" y="370.7812" width="1031.25" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="583.75" y="391.625" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">QWORD (Quadword)</text>
  <text x="583.75" y="408.8438" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">.quad / RAX</text>

  <text x="1113.4375" y="395.25" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--primary-accent)" text-anchor="start">}</text>
  <text x="1141.5625" y="396.1562" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle">64-bit</text>
  <text x="1141.5625" y="409.75" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)" text-anchor="middle">(8 bytes)</text>

  <!-- Details table -->
  <!-- Header -->
  <rect x="68.125" y="429.6875" width="234.375" height="32.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>

  <rect x="930.625" y="429.6875" width="281.25" height="32.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185.3125" y="450.5312" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">Type</text>
  <text x="391.5625" y="450.5312" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">GAS Directive</text>

  <rect x="930.625" y="465.9375" width="281.25" height="34.4375" rx="6" fill="var(--surface)"/>
  <text x="185.3125" y="485.875" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">BYTE (8-bit) — AL/AH</text>
  <text x="391.5625" y="487.6875" font-family="monospace" font-size="12.9044" fill="var(--text)" text-anchor="middle">.byte</text>
  <text x="555.625" y="487.6875" font-family="monospace" font-size="12.9044" fill="var(--text)" text-anchor="middle">AL, AH</text>
  <text x="780.625" y="487.6875" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">-128 to 127</text>
  <text x="1071.25" y="487.6875" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">0 to 255</text>


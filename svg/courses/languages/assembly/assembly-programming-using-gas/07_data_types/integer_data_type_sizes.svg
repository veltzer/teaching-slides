<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#grad-primary)"/>

  <!-- Section label -->
  <text x="640" y="38" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-dk)" text-anchor="middle" font-weight="bold">Memory Address →</text>

  <!-- Memory layout visual: 8 bytes total, showing widths -->
  <!-- Byte labels (bit positions) -->
  <text x="90" y="65" font-family="monospace" font-size="13" fill="var(--text-mid)" text-anchor="middle">Byte 0</text>
  <text x="230" y="65" font-family="monospace" font-size="13" fill="var(--text-mid)" text-anchor="middle">Byte 1</text>
  <text x="370" y="65" font-family="monospace" font-size="13" fill="var(--text-mid)" text-anchor="middle">Byte 2</text>
  <text x="510" y="65" font-family="monospace" font-size="13" fill="var(--text-mid)" text-anchor="middle">Byte 3</text>
  <text x="650" y="65" font-family="monospace" font-size="13" fill="var(--text-mid)" text-anchor="middle">Byte 4</text>
  <text x="790" y="65" font-family="monospace" font-size="13" fill="var(--text-mid)" text-anchor="middle">Byte 5</text>
  <text x="930" y="65" font-family="monospace" font-size="13" fill="var(--text-mid)" text-anchor="middle">Byte 6</text>
  <text x="1070" y="65" font-family="monospace" font-size="13" fill="var(--text-mid)" text-anchor="middle">Byte 7</text>

  <!-- 8 byte cells for reference -->
  <rect x="30" y="75" width="120" height="45" rx="3" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <rect x="170" y="75" width="120" height="45" rx="3" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="310" y="75" width="120" height="45" rx="3" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="450" y="75" width="120" height="45" rx="3" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="590" y="75" width="120" height="45" rx="3" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="730" y="75" width="120" height="45" rx="3" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="870" y="75" width="120" height="45" rx="3" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="1010" y="75" width="120" height="45" rx="3" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="90" y="104" font-family="monospace" font-size="13" fill="var(--primary-dk)" text-anchor="middle">8 bits</text>
  <text x="230" y="104" font-family="monospace" font-size="13" fill="var(--text-disabled)" text-anchor="middle">8 bits</text>
  <text x="370" y="104" font-family="monospace" font-size="13" fill="var(--text-disabled)" text-anchor="middle">8 bits</text>
  <text x="510" y="104" font-family="monospace" font-size="13" fill="var(--text-disabled)" text-anchor="middle">8 bits</text>
  <text x="650" y="104" font-family="monospace" font-size="13" fill="var(--text-disabled)" text-anchor="middle">8 bits</text>
  <text x="790" y="104" font-family="monospace" font-size="13" fill="var(--text-disabled)" text-anchor="middle">8 bits</text>
  <text x="930" y="104" font-family="monospace" font-size="13" fill="var(--text-disabled)" text-anchor="middle">8 bits</text>
  <text x="1070" y="104" font-family="monospace" font-size="13" fill="var(--text-disabled)" text-anchor="middle">8 bits</text>

  <!-- BYTE row -->
  <rect x="30" y="155" width="120" height="50" rx="4" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="178" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">BYTE</text>
  <text x="90" y="197" font-family="monospace" font-size="13" fill="var(--danger-dk)" text-anchor="middle">.byte / AL</text>

  <text x="165" y="182" font-family="Arial, sans-serif" font-size="22" fill="var(--danger)" text-anchor="start">}</text>
  <text x="220" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">8-bit  (1 byte)</text>

  <!-- WORD row -->
  <rect x="30" y="225" width="260" height="50" rx="4" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="248" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">WORD</text>
  <text x="160" y="267" font-family="monospace" font-size="13" fill="var(--warn-dk)" text-anchor="middle">.word / AX</text>

  <text x="305" y="252" font-family="Arial, sans-serif" font-size="22" fill="var(--warn-mid)" text-anchor="start">}</text>
  <text x="360" y="255" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">16-bit  (2 bytes)</text>

  <!-- DWORD row -->
  <rect x="30" y="295" width="540" height="50" rx="4" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="318" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--ok-deep)" text-anchor="middle">DWORD (Doubleword)</text>
  <text x="300" y="337" font-family="monospace" font-size="13" fill="var(--ok-deep)" text-anchor="middle">.long / EAX</text>

  <text x="585" y="322" font-family="Arial, sans-serif" font-size="22" fill="var(--ok-dk)" text-anchor="start">}</text>
  <text x="640" y="325" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">32-bit  (4 bytes)</text>

  <!-- QWORD row -->
  <rect x="30" y="365" width="1100" height="50" rx="4" fill="url(#grad-primary)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="388" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">QWORD (Quadword)</text>
  <text x="580" y="407" font-family="monospace" font-size="13" fill="var(--primary-lt)" text-anchor="middle">.quad / RAX</text>

  <text x="1145" y="392" font-family="Arial, sans-serif" font-size="22" fill="var(--primary-dk)" text-anchor="start">}</text>
  <text x="1175" y="393" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)" text-anchor="middle">64-bit</text>
  <text x="1175" y="408" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)" text-anchor="middle">(8 bytes)</text>

  <!-- Details table -->
  <!-- Header -->
  <rect x="30" y="430" width="250" height="36" rx="4" fill="url(#grad-primary)"/>
  <rect x="290" y="430" width="170" height="36" rx="4" fill="url(#grad-primary)"/>
  <rect x="470" y="430" width="160" height="36" rx="4" fill="url(#grad-primary)"/>
  <rect x="640" y="430" width="300" height="36" rx="4" fill="url(#grad-primary)"/>
  <rect x="950" y="430" width="300" height="36" rx="4" fill="url(#grad-primary)"/>
  <text x="155" y="453" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Type</text>
  <text x="375" y="453" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">GAS Directive</text>
  <text x="550" y="453" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Register</text>
  <text x="790" y="453" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Signed Range</text>
  <text x="1100" y="453" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Unsigned Range</text>

  <!-- Row: BYTE -->
  <rect x="30" y="470" width="250" height="38" rx="3" fill="var(--danger-pale)"/>
  <rect x="290" y="470" width="170" height="38" rx="3" fill="var(--surface-light)"/>
  <rect x="470" y="470" width="160" height="38" rx="3" fill="var(--surface-light)"/>
  <rect x="640" y="470" width="300" height="38" rx="3" fill="var(--surface-light)"/>
  <rect x="950" y="470" width="300" height="38" rx="3" fill="var(--surface-light)"/>
  <text x="155" y="492" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">BYTE (8-bit) — AL/AH</text>
  <text x="375" y="494" font-family="monospace" font-size="14" fill="var(--text-dark)" text-anchor="middle">.byte</text>
  <text x="550" y="494" font-family="monospace" font-size="14" fill="var(--text-dark)" text-anchor="middle">AL, AH</text>
  <text x="790" y="494" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">-128 to 127</text>
  <text x="1100" y="494" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">0 to 255</text>

  <!-- Row: WORD -->
  <rect x="30" y="512" width="250" height="38" rx="3" fill="var(--warn-pale)"/>
  <rect x="290" y="512" width="170" height="38" rx="3" fill="var(--surface-light)"/>
  <rect x="470" y="512" width="160" height="38" rx="3" fill="var(--surface-light)"/>
  <rect x="640" y="512" width="300" height="38" rx="3" fill="var(--surface-light)"/>
  <rect x="950" y="512" width="300" height="38" rx="3" fill="var(--surface-light)"/>
  <text x="155" y="534" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">WORD (16-bit) — AX/BX</text>
  <text x="375" y="536" font-family="monospace" font-size="14" fill="var(--text-dark)" text-anchor="middle">.word</text>
  <text x="550" y="536" font-family="monospace" font-size="14" fill="var(--text-dark)" text-anchor="middle">AX, BX</text>
  <text x="790" y="536" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">-32,768 to 32,767</text>
  <text x="1100" y="536" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">0 to 65,535</text>

  <!-- Row: DWORD -->
  <rect x="30" y="554" width="250" height="38" rx="3" fill="var(--ok-pale)"/>
  <rect x="290" y="554" width="170" height="38" rx="3" fill="var(--surface-light)"/>
  <rect x="470" y="554" width="160" height="38" rx="3" fill="var(--surface-light)"/>
  <rect x="640" y="554" width="300" height="38" rx="3" fill="var(--surface-light)"/>
  <rect x="950" y="554" width="300" height="38" rx="3" fill="var(--surface-light)"/>
  <text x="155" y="576" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-deep)" text-anchor="middle">DWORD (32-bit) — EAX</text>
  <text x="375" y="578" font-family="monospace" font-size="14" fill="var(--text-dark)" text-anchor="middle">.long</text>
  <text x="550" y="578" font-family="monospace" font-size="14" fill="var(--text-dark)" text-anchor="middle">EAX, EBX</text>
  <text x="790" y="578" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">-2³¹ to 2³¹-1</text>
  <text x="1100" y="578" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">0 to 4,294,967,295</text>

  <!-- Row: QWORD -->
  <rect x="30" y="596" width="250" height="38" rx="3" fill="var(--primary-pale)"/>
  <rect x="290" y="596" width="170" height="38" rx="3" fill="var(--surface-light)"/>
  <rect x="470" y="596" width="160" height="38" rx="3" fill="var(--surface-light)"/>
  <rect x="640" y="596" width="300" height="38" rx="3" fill="var(--surface-light)"/>
  <rect x="950" y="596" width="300" height="38" rx="3" fill="var(--surface-light)"/>
  <text x="155" y="618" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">QWORD (64-bit) — RAX</text>
  <text x="375" y="620" font-family="monospace" font-size="14" fill="var(--text-dark)" text-anchor="middle">.quad</text>
  <text x="550" y="620" font-family="monospace" font-size="14" fill="var(--text-dark)" text-anchor="middle">RAX, RBX</text>
  <text x="790" y="620" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">-2⁶³ to 2⁶³-1</text>
  <text x="1100" y="620" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">0 to 18,446,744,073…</text>
</svg>

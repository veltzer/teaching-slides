<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#grad-accent)"/>

  <!-- Section label -->
  <text x="640" y="38" font-family="Arial, sans-serif" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">Memory Address →</text>

  <!-- Memory layout visual: 8 bytes total, showing widths -->
  <!-- Byte labels (bit positions) -->
  <text x="90" y="65" font-family="monospace" font-size="13" fill="#666666" text-anchor="middle">Byte 0</text>
  <text x="230" y="65" font-family="monospace" font-size="13" fill="#666666" text-anchor="middle">Byte 1</text>
  <text x="370" y="65" font-family="monospace" font-size="13" fill="#666666" text-anchor="middle">Byte 2</text>
  <text x="510" y="65" font-family="monospace" font-size="13" fill="#666666" text-anchor="middle">Byte 3</text>
  <text x="650" y="65" font-family="monospace" font-size="13" fill="#666666" text-anchor="middle">Byte 4</text>
  <text x="790" y="65" font-family="monospace" font-size="13" fill="#666666" text-anchor="middle">Byte 5</text>
  <text x="930" y="65" font-family="monospace" font-size="13" fill="#666666" text-anchor="middle">Byte 6</text>
  <text x="1070" y="65" font-family="monospace" font-size="13" fill="#666666" text-anchor="middle">Byte 7</text>

  <!-- 8 byte cells for reference -->
  <rect x="30" y="75" width="120" height="45" rx="3" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <rect x="170" y="75" width="120" height="45" rx="3" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="310" y="75" width="120" height="45" rx="3" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="450" y="75" width="120" height="45" rx="3" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="590" y="75" width="120" height="45" rx="3" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="730" y="75" width="120" height="45" rx="3" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="870" y="75" width="120" height="45" rx="3" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="1010" y="75" width="120" height="45" rx="3" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="90" y="104" font-family="monospace" font-size="13" fill="#1565c0" text-anchor="middle">8 bits</text>
  <text x="230" y="104" font-family="monospace" font-size="13" fill="#9e9e9e" text-anchor="middle">8 bits</text>
  <text x="370" y="104" font-family="monospace" font-size="13" fill="#9e9e9e" text-anchor="middle">8 bits</text>
  <text x="510" y="104" font-family="monospace" font-size="13" fill="#9e9e9e" text-anchor="middle">8 bits</text>
  <text x="650" y="104" font-family="monospace" font-size="13" fill="#9e9e9e" text-anchor="middle">8 bits</text>
  <text x="790" y="104" font-family="monospace" font-size="13" fill="#9e9e9e" text-anchor="middle">8 bits</text>
  <text x="930" y="104" font-family="monospace" font-size="13" fill="#9e9e9e" text-anchor="middle">8 bits</text>
  <text x="1070" y="104" font-family="monospace" font-size="13" fill="#9e9e9e" text-anchor="middle">8 bits</text>

  <!-- BYTE row -->
  <rect x="30" y="155" width="120" height="50" rx="4" fill="#ffebee" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="178" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c62828" text-anchor="middle">BYTE</text>
  <text x="90" y="197" font-family="monospace" font-size="13" fill="#c62828" text-anchor="middle">.byte / AL</text>

  <text x="165" y="182" font-family="Arial, sans-serif" font-size="22" fill="#e53935" text-anchor="start">}</text>
  <text x="220" y="185" font-family="Arial, sans-serif" font-size="14" fill="#333333">8-bit  (1 byte)</text>

  <!-- WORD row -->
  <rect x="30" y="225" width="260" height="50" rx="4" fill="#fff3e0" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="248" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e65100" text-anchor="middle">WORD</text>
  <text x="160" y="267" font-family="monospace" font-size="13" fill="#e65100" text-anchor="middle">.word / AX</text>

  <text x="305" y="252" font-family="Arial, sans-serif" font-size="22" fill="#f57c00" text-anchor="start">}</text>
  <text x="360" y="255" font-family="Arial, sans-serif" font-size="14" fill="#333333">16-bit  (2 bytes)</text>

  <!-- DWORD row -->
  <rect x="30" y="295" width="540" height="50" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="318" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1b5e20" text-anchor="middle">DWORD (Doubleword)</text>
  <text x="300" y="337" font-family="monospace" font-size="13" fill="#1b5e20" text-anchor="middle">.long / EAX</text>

  <text x="585" y="322" font-family="Arial, sans-serif" font-size="22" fill="#2e7d32" text-anchor="start">}</text>
  <text x="640" y="325" font-family="Arial, sans-serif" font-size="14" fill="#333333">32-bit  (4 bytes)</text>

  <!-- QWORD row -->
  <rect x="30" y="365" width="1100" height="50" rx="4" fill="url(#grad-accent)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="388" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">QWORD (Quadword)</text>
  <text x="580" y="407" font-family="monospace" font-size="13" fill="#bbdefb" text-anchor="middle">.quad / RAX</text>

  <text x="1145" y="392" font-family="Arial, sans-serif" font-size="22" fill="#1565c0" text-anchor="start">}</text>
  <text x="1175" y="393" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">64-bit</text>
  <text x="1175" y="408" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">(8 bytes)</text>

  <!-- Details table -->
  <!-- Header -->
  <rect x="30" y="430" width="250" height="36" rx="4" fill="url(#grad-accent)"/>
  <rect x="290" y="430" width="170" height="36" rx="4" fill="url(#grad-accent)"/>
  <rect x="470" y="430" width="160" height="36" rx="4" fill="url(#grad-accent)"/>
  <rect x="640" y="430" width="300" height="36" rx="4" fill="url(#grad-accent)"/>
  <rect x="950" y="430" width="300" height="36" rx="4" fill="url(#grad-accent)"/>
  <text x="155" y="453" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Type</text>
  <text x="375" y="453" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">GAS Directive</text>
  <text x="550" y="453" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Register</text>
  <text x="790" y="453" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Signed Range</text>
  <text x="1100" y="453" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Unsigned Range</text>

  <!-- Row: BYTE -->
  <rect x="30" y="470" width="250" height="38" rx="3" fill="#ffebee"/>
  <rect x="290" y="470" width="170" height="38" rx="3" fill="#fff8f8"/>
  <rect x="470" y="470" width="160" height="38" rx="3" fill="#fff8f8"/>
  <rect x="640" y="470" width="300" height="38" rx="3" fill="#fff8f8"/>
  <rect x="950" y="470" width="300" height="38" rx="3" fill="#fff8f8"/>
  <text x="155" y="492" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">BYTE (8-bit) — AL/AH</text>
  <text x="375" y="494" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">.byte</text>
  <text x="550" y="494" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">AL, AH</text>
  <text x="790" y="494" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">-128 to 127</text>
  <text x="1100" y="494" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">0 to 255</text>

  <!-- Row: WORD -->
  <rect x="30" y="512" width="250" height="38" rx="3" fill="#fff3e0"/>
  <rect x="290" y="512" width="170" height="38" rx="3" fill="#fffdf8"/>
  <rect x="470" y="512" width="160" height="38" rx="3" fill="#fffdf8"/>
  <rect x="640" y="512" width="300" height="38" rx="3" fill="#fffdf8"/>
  <rect x="950" y="512" width="300" height="38" rx="3" fill="#fffdf8"/>
  <text x="155" y="534" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">WORD (16-bit) — AX/BX</text>
  <text x="375" y="536" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">.word</text>
  <text x="550" y="536" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">AX, BX</text>
  <text x="790" y="536" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">-32,768 to 32,767</text>
  <text x="1100" y="536" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">0 to 65,535</text>

  <!-- Row: DWORD -->
  <rect x="30" y="554" width="250" height="38" rx="3" fill="#e8f5e9"/>
  <rect x="290" y="554" width="170" height="38" rx="3" fill="#f8fff8"/>
  <rect x="470" y="554" width="160" height="38" rx="3" fill="#f8fff8"/>
  <rect x="640" y="554" width="300" height="38" rx="3" fill="#f8fff8"/>
  <rect x="950" y="554" width="300" height="38" rx="3" fill="#f8fff8"/>
  <text x="155" y="576" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b5e20" text-anchor="middle">DWORD (32-bit) — EAX</text>
  <text x="375" y="578" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">.long</text>
  <text x="550" y="578" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">EAX, EBX</text>
  <text x="790" y="578" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">-2³¹ to 2³¹-1</text>
  <text x="1100" y="578" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">0 to 4,294,967,295</text>

  <!-- Row: QWORD -->
  <rect x="30" y="596" width="250" height="38" rx="3" fill="#e3f2fd"/>
  <rect x="290" y="596" width="170" height="38" rx="3" fill="#f8faff"/>
  <rect x="470" y="596" width="160" height="38" rx="3" fill="#f8faff"/>
  <rect x="640" y="596" width="300" height="38" rx="3" fill="#f8faff"/>
  <rect x="950" y="596" width="300" height="38" rx="3" fill="#f8faff"/>
  <text x="155" y="618" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">QWORD (64-bit) — RAX</text>
  <text x="375" y="620" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">.quad</text>
  <text x="550" y="620" font-family="monospace" font-size="14" fill="#333333" text-anchor="middle">RAX, RBX</text>
  <text x="790" y="620" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">-2⁶³ to 2⁶³-1</text>
  <text x="1100" y="620" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle">0 to 18,446,744,073…</text>
</svg>

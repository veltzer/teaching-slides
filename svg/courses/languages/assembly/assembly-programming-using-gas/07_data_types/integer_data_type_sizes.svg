<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.310275063936" font-weight="bold" fill="var(--text)">GAS Integer Data Types</text>

  <text x="640" y="74.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.36516253778" fill="var(--primary-accent)" font-weight="bold">Memory Address →</text>

  <rect x="40" y="92.2" width="1157.894736842105" height="40.6" rx="6.630075017437" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="176.842105263158" y="118.88" text-anchor="middle" font-family="Courier New, monospace" font-size="13.260150034874" fill="var(--text-muted)">Byte 0 | Byte 1 | Byte 2 | Byte 3 | Byte 4 | Byte 5 | Byte 6 | Byte 7</text>

  <rect x="40" y="150.2" width="136.842105263158" height="46.4" rx="6.630075017437" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="108.421052631579" y="176.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.575187543592" font-weight="bold" fill="var(--danger-text)">BYTE</text>
  <text x="197.894736842105" y="179.2" font-family="Arial, sans-serif" font-size="14.36516253778" fill="var(--text)">8-bit (1 byte)</text>

  <rect x="40" y="208.2" width="273.684210526316" height="46.4" rx="6.630075017437" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.842105263158" y="234.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.575187543592" font-weight="bold" fill="var(--warn-text)">WORD</text>
  <text x="334.736842105263" y="237.2" font-family="Arial, sans-serif" font-size="14.36516253778" fill="var(--text)">16-bit (2 bytes)</text>

  <rect x="40" y="266.2" width="547.368421052632" height="46.4" rx="6.630075017437" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="313.684210526316" y="292.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.575187543592" font-weight="bold" fill="var(--ok-text)">DWORD</text>
  <text x="608.421052631579" y="295.2" font-family="Arial, sans-serif" font-size="14.36516253778" fill="var(--text)">32-bit (4 bytes)</text>

  <rect x="40" y="324.2" width="1094.736842105263" height="46.4" rx="6.630075017437" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="587.368421052631" y="350.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.575187543592" font-weight="bold" fill="var(--primary-text)">QWORD</text>
  <text x="1155.78947368421" y="353.2" font-family="Arial, sans-serif" font-size="14.36516253778" fill="var(--text)">64-bit</text>

  <rect x="40" y="393.8" width="1200" height="40.6" rx="6.630075017437" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.789473684211" y="420.48" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.470175040686" font-weight="bold" fill="var(--primary-text)">Type</text>
  <text x="387.368421052632" y="420.48" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.470175040686" font-weight="bold" fill="var(--primary-text)">Directive</text>
  <text x="555.78947368421" y="420.48" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.470175040686" font-weight="bold" fill="var(--primary-text)">Register</text>
  <text x="797.894736842105" y="420.48" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.470175040686" font-weight="bold" fill="var(--primary-text)">Signed Range</text>
  <text x="1092.631578947368" y="420.48" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.470175040686" font-weight="bold" fill="var(--primary-text)">Unsigned</text>

  <rect x="40" y="440.2" width="242.105263157895" height="40.6" rx="6.630075017437" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="161.052631578947" y="466.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.36516253778" font-weight="bold" fill="var(--danger-text)">BYTE (8-bit)</text>
  <text x="387.368421052632" y="466.88" text-anchor="middle" font-family="Courier New, monospace" font-size="14.36516253778" fill="var(--text)">.byte</text>
  <text x="555.78947368421" y="466.88" text-anchor="middle" font-family="Courier New, monospace" font-size="14.36516253778" fill="var(--text)">AL, AH</text>
  <text x="797.894736842105" y="466.88" text-anchor="middle" font-family="Courier New, monospace" font-size="13.260150034874" fill="var(--text)">-128..127</text>
  <text x="1092.631578947368" y="466.88" text-anchor="middle" font-family="Courier New, monospace" font-size="13.260150034874" fill="var(--text)">0..255</text>

  <rect x="40" y="486.6" width="242.105263157895" height="40.6" rx="6.630075017437" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="161.052631578947" y="513.28" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.36516253778" font-weight="bold" fill="var(--warn-text)">WORD (16-bit)</text>
  <text x="387.368421052632" y="513.28" text-anchor="middle" font-family="Courier New, monospace" font-size="14.36516253778" fill="var(--text)">.word</text>
  <text x="555.78947368421" y="513.28" text-anchor="middle" font-family="Courier New, monospace" font-size="14.36516253778" fill="var(--text)">AX, BX</text>
  <text x="797.894736842105" y="513.28" text-anchor="middle" font-family="Courier New, monospace" font-size="13.260150034874" fill="var(--text)">-32K..32K</text>
  <text x="1092.631578947368" y="513.28" text-anchor="middle" font-family="Courier New, monospace" font-size="13.260150034874" fill="var(--text)">0..65K</text>

  <rect x="40" y="533" width="242.105263157895" height="40.6" rx="6.630075017437" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="161.052631578947" y="559.68" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.36516253778" font-weight="bold" fill="var(--ok-text)">DWORD (32-bit)</text>
  <text x="387.368421052632" y="559.68" text-anchor="middle" font-family="Courier New, monospace" font-size="14.36516253778" fill="var(--text)">.long</text>
  <text x="555.78947368421" y="559.68" text-anchor="middle" font-family="Courier New, monospace" font-size="14.36516253778" fill="var(--text)">EAX, EBX</text>
  <text x="797.894736842105" y="559.68" text-anchor="middle" font-family="Courier New, monospace" font-size="13.260150034874" fill="var(--text)">-2³¹..2³¹-1</text>
  <text x="1092.631578947368" y="559.68" text-anchor="middle" font-family="Courier New, monospace" font-size="13.260150034874" fill="var(--text)">0..4.29B</text>

  <rect x="40" y="579.4" width="242.105263157895" height="40.6" rx="6.630075017437" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="161.052631578947" y="606.08" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.36516253778" font-weight="bold" fill="var(--primary-text)">QWORD (64-bit)</text>
  <text x="387.368421052632" y="606.08" text-anchor="middle" font-family="Courier New, monospace" font-size="14.36516253778" fill="var(--text)">.quad</text>
  <text x="555.78947368421" y="606.08" text-anchor="middle" font-family="Courier New, monospace" font-size="14.36516253778" fill="var(--text)">RAX, RBX</text>
  <text x="797.894736842105" y="606.08" text-anchor="middle" font-family="Courier New, monospace" font-size="13.260150034874" fill="var(--text)">-2⁶³..2⁶³-1</text>
  <text x="1092.631578947368" y="606.08" text-anchor="middle" font-family="Courier New, monospace" font-size="13.260150034874" fill="var(--text)">0..1.8×10¹⁹</text>
</svg>

  <text x="780.625" y="450.5312" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">Signed Range</text>
  <text x="1071.25" y="450.5312" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">Unsigned Range</text>

  <!-- Row: BYTE -->
  <rect x="68.125" y="465.9375" width="234.375" height="34.4375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="311.875" y="465.9375" width="159.375" height="34.4375" rx="6" fill="var(--surface)"/>
  <rect x="480.625" y="465.9375" width="150" height="34.4375" rx="6" fill="var(--surface)"/>

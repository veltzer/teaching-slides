  <text x="255.625" y="98.9062" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">Byte 1</text>
  <text x="386.875" y="98.9062" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">Byte 2</text>
  <text x="518.125" y="98.9062" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">Byte 3</text>
  <text x="649.375" y="98.9062" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">Byte 4</text>
  <text x="780.625" y="98.9062" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">Byte 5</text>
  <text x="911.875" y="98.9062" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">Byte 6</text>
  <text x="1043.125" y="98.9062" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">Byte 7</text>

  <!-- 8 byte cells for reference -->
  <rect x="68.125" y="107.9688" width="112.5" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="199.375" y="107.9688" width="112.5" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="330.625" y="107.9688" width="112.5" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="461.875" y="107.9688" width="112.5" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="593.125" y="107.9688" width="112.5" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="724.375" y="107.9688" width="112.5" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="855.625" y="107.9688" width="112.5" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="986.875" y="107.9688" width="112.5" height="40.7812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="124.375" y="134.25" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">8 bits</text>
  <text x="255.625" y="134.25" font-family="monospace" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">8 bits</text>
  <text x="386.875" y="134.25" font-family="monospace" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">8 bits</text>
  <text x="518.125" y="134.25" font-family="monospace" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">8 bits</text>
  <text x="649.375" y="134.25" font-family="monospace" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">8 bits</text>
  <text x="780.625" y="134.25" font-family="monospace" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">8 bits</text>
  <text x="911.875" y="134.25" font-family="monospace" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">8 bits</text>
  <text x="1043.125" y="134.25" font-family="monospace" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">8 bits</text>

  <!-- BYTE row -->
  <rect x="68.125" y="180.4688" width="112.5" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="124.375" y="201.3125" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">BYTE</text>
  <text x="124.375" y="218.5312" font-family="monospace" font-size="11.9827" fill="var(--danger-accent)" text-anchor="middle">.byte / AL</text>

  <text x="194.6875" y="204.9375" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--danger-accent)" text-anchor="start">}</text>
  <text x="246.25" y="207.6562" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">8-bit  (1 byte)</text>

  <!-- WORD row -->
  <rect x="68.125" y="243.9062" width="243.75" height="45.3125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="264.75" font-family="Arial, sans-serif" font-size="15.6696" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">WORD</text>
  <text x="190" y="281.9688" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle">.word / AX</text>

  <text x="325.9375" y="268.375" font-family="Arial, sans-serif" font-size="20.2783" fill="var(--warn-accent)" text-anchor="start">}</text>
  <text x="377.5" y="271.0938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">16-bit  (2 bytes)</text>


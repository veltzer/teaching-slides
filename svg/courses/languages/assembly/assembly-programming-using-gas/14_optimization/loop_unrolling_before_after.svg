<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-before" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffebee"/>
      <stop offset="100%" stop-color="#ffcdd2"/>
    </linearGradient>
    <linearGradient id="grad-after" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Header bar -->
  <rect x="20" y="12" width="1240" height="42" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="var(--bg)">Loop Unrolling: Before vs After</text>

  <!-- BEFORE panel -->
  <rect x="20" y="68" width="575" height="520" rx="6" fill="url(#grad-before)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="68" width="575" height="40" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="20" y="94" width="575" height="14" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="307" y="96" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">BEFORE  (original loop)</text>

  <!-- before code box -->
  <rect x="40" y="120" width="535" height="265" rx="6" fill="var(--text)" filter="url(#shadow)"/>
  <text x="60" y="146" font-family="monospace" font-size="13" fill="var(--text-faint)">; Copy 100 integers: src → dst</text>
  <text x="60" y="166" font-family="monospace" font-size="13" fill="var(--warn-accent)">    mov  $100, %ecx    </text>
  <text x="60" y="184" font-family="monospace" font-size="13" fill="var(--primary-accent)">    lea  src, %esi</text>
  <text x="60" y="202" font-family="monospace" font-size="13" fill="var(--primary-accent)">    lea  dst, %edi</text>
  <text x="60" y="222" font-family="monospace" font-size="14" font-weight="bold" fill="var(--warn-accent)">.loop:</text>
  <text x="60" y="240" font-family="monospace" font-size="13" fill="var(--ok-accent)">    mov  (%esi), %eax</text>
  <text x="60" y="258" font-family="monospace" font-size="13" fill="var(--ok-accent)">    mov  %eax, (%edi)</text>
  <text x="60" y="276" font-family="monospace" font-size="13" fill="var(--info-accent)">    add  $4, %esi</text>
  <text x="60" y="294" font-family="monospace" font-size="13" fill="var(--info-accent)">    add  $4, %edi</text>
  <text x="60" y="312" font-family="monospace" font-size="13" fill="var(--warn-accent)">    dec  %ecx</text>
  <text x="60" y="330" font-family="monospace" font-size="13" fill="var(--warn-accent)">    jnz  .loop</text>
  <text x="60" y="355" font-family="monospace" font-size="11" fill="var(--text-muted)">; ↑ jumps back 100 times</text>
  <text x="60" y="373" font-family="monospace" font-size="11" fill="var(--text-muted)">; ↑ 6 instructions per iteration</text>

  <!-- before stats -->
  <rect x="40" y="398" width="535" height="170" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.5"/>
  <text x="307" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)">Performance Analysis</text>
  <line x1="40" y1="426" x2="575" y2="426" stroke="var(--danger-border)" stroke-width="1"/>

  <text x="60" y="448" font-family="sans-serif" font-size="12" fill="var(--text)">Iterations:</text>
  <rect x="200" y="432" width="80" height="24" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="240" y="449" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="var(--bg)">100</text>

  <text x="60" y="472" font-family="sans-serif" font-size="12" fill="var(--text)">Instructions/iter:</text>
  <rect x="200" y="457" width="80" height="24" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="240" y="474" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="var(--bg)">6</text>

  <text x="60" y="496" font-family="sans-serif" font-size="12" fill="var(--text)">Total instructions:</text>
  <rect x="200" y="481" width="80" height="24" rx="6" fill="var(--danger-accent)"/>
  <text x="240" y="498" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="var(--bg)">600</text>

  <text x="60" y="520" font-family="sans-serif" font-size="12" fill="var(--text)">Branch mispredictions:</text>
  <rect x="240" y="505" width="120" height="24" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="300" y="522" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="var(--bg)">up to 100</text>

  <text x="60" y="544" font-family="sans-serif" font-size="12" fill="var(--text)">Code size:</text>
  <rect x="200" y="529" width="120" height="24" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="260" y="546" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="var(--bg)">compact ✓</text>

  <!-- AFTER panel -->
  <rect x="615" y="68" width="645" height="520" rx="6" fill="url(#grad-after)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="615" y="68" width="645" height="40" rx="6" fill="var(--ok-accent)"/>
  <rect x="615" y="94" width="645" height="14" fill="var(--ok-accent)" rx="6"/>
  <text x="937" y="96" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">AFTER  (4x unrolled)</text>

  <!-- after code box -->
  <rect x="633" y="120" width="610" height="265" rx="6" fill="var(--text)" filter="url(#shadow)"/>
  <text x="653" y="146" font-family="monospace" font-size="13" fill="var(--text-faint)">; Same copy, 4 operations per iteration</text>
  <text x="653" y="166" font-family="monospace" font-size="13" fill="var(--warn-accent)">    mov  $25, %ecx    </text>
  <text x="653" y="184" font-family="monospace" font-size="13" fill="var(--primary-accent)">    lea  src, %esi</text>
  <text x="653" y="202" font-family="monospace" font-size="13" fill="var(--primary-accent)">    lea  dst, %edi</text>
  <text x="653" y="222" font-family="monospace" font-size="14" font-weight="bold" fill="var(--warn-accent)">.loop:</text>
  <text x="653" y="240" font-family="monospace" font-size="13" fill="var(--ok-accent)">    mov  (%esi),   %eax   </text>
  <text x="653" y="254" font-family="monospace" font-size="13" fill="var(--ok-accent)">    mov  %eax,    (%edi)</text>
  <text x="653" y="268" font-family="monospace" font-size="13" fill="var(--ok-accent)">    mov  4(%esi),  %eax</text>
  <text x="653" y="282" font-family="monospace" font-size="13" fill="var(--ok-accent)">    mov  %eax,   4(%edi)</text>
  <text x="653" y="296" font-family="monospace" font-size="13" fill="var(--ok-accent)">    mov  8(%esi),  %eax</text>
  <text x="653" y="310" font-family="monospace" font-size="13" fill="var(--ok-accent)">    mov  %eax,   8(%edi)</text>
  <text x="653" y="324" font-family="monospace" font-size="13" fill="var(--ok-accent)">    mov  12(%esi), %eax</text>
  <text x="653" y="338" font-family="monospace" font-size="13" fill="var(--ok-accent)">    mov  %eax,  12(%edi)</text>
  <text x="653" y="355" font-family="monospace" font-size="13" fill="var(--info-accent)">    add  $16, %esi</text>
  <text x="653" y="370" font-family="monospace" font-size="13" fill="var(--info-accent)">    add  $16, %edi</text>
  <text x="653" y="384" font-family="monospace" font-size="13" fill="var(--warn-accent)">    dec  %ecx</text>

  <!-- after stats -->
  <rect x="633" y="398" width="610" height="170" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="937" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)">Performance Analysis</text>
  <line x1="633" y1="426" x2="1243" y2="426" stroke="var(--ok-border)" stroke-width="1"/>

  <text x="653" y="448" font-family="sans-serif" font-size="12" fill="var(--text)">Iterations:</text>
  <rect x="793" y="432" width="80" height="24" rx="6" fill="var(--ok-accent)"/>
  <text x="833" y="449" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="var(--bg)">25</text>
  <text x="882" y="449" font-family="sans-serif" font-size="12" fill="var(--ok-accent)" font-weight="bold">↓ 75% fewer</text>

  <text x="653" y="472" font-family="sans-serif" font-size="12" fill="var(--text)">Instructions/iter:</text>
  <rect x="793" y="457" width="80" height="24" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="833" y="474" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="var(--bg)">11</text>
  <text x="882" y="474" font-family="sans-serif" font-size="12" fill="var(--text-muted)">4× work per loop</text>

  <text x="653" y="496" font-family="sans-serif" font-size="12" fill="var(--text)">Total instructions:</text>
  <rect x="793" y="481" width="80" height="24" rx="6" fill="var(--ok-accent)"/>
  <text x="833" y="498" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="var(--bg)">275</text>
  <text x="882" y="498" font-family="sans-serif" font-size="12" fill="var(--ok-accent)" font-weight="bold">↓ 54% fewer</text>

  <text x="653" y="520" font-family="sans-serif" font-size="12" fill="var(--text)">Branch mispredictions:</text>
  <rect x="793" y="505" width="120" height="24" rx="6" fill="var(--ok-accent)"/>
  <text x="853" y="522" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="var(--bg)">only 25 ✓</text>

  <text x="653" y="544" font-family="sans-serif" font-size="12" fill="var(--text)">Code size:</text>
  <rect x="793" y="529" width="120" height="24" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="853" y="546" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="var(--bg)">4× larger !</text>

  <!-- Trade-off summary bar at bottom -->
  <rect x="20" y="596" width="1240" height="30" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="30" y="614" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--primary-accent)">Trade-off: </text>
  <text x="115" y="614" font-family="sans-serif" font-size="12" fill="var(--text)">Fewer jumps &amp; branch penalties → faster execution    |    Larger code footprint → more I-cache pressure    |    Best for inner hot loops</text>
</svg>

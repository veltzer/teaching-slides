<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="590" height="580" rx="8.616263691415" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="86.400000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228539" font-weight="bold" fill="var(--danger-text)">BEFORE</text>
  <text x="60" y="132.8" font-family="Courier New, monospace" font-size="15.078461459976" fill="var(--danger-text)">mov $100, %ecx</text>
  <text x="60" y="167.6" font-family="Courier New, monospace" font-size="15.078461459976" fill="var(--danger-text)">lea src, %esi</text>
  <text x="60" y="202.400000000001" font-family="Courier New, monospace" font-size="15.078461459976" fill="var(--danger-text)">lea dst, %edi</text>
  <text x="60" y="243" font-family="Courier New, monospace" font-size="15.078461459976" font-weight="bold" fill="var(--danger-text)">.loop:</text>
  <text x="60" y="277.8" font-family="Courier New, monospace" font-size="15.078461459976" fill="var(--danger-text)">  mov (%esi), %eax</text>
  <text x="60" y="312.6" font-family="Courier New, monospace" font-size="15.078461459976" fill="var(--danger-text)">  mov %eax, (%edi)</text>
  <text x="60" y="347.4" font-family="Courier New, monospace" font-size="15.078461459976" fill="var(--danger-text)">  add $4, %esi</text>
  <text x="60" y="382.200000000001" font-family="Courier New, monospace" font-size="15.078461459976" fill="var(--danger-text)">  add $4, %edi</text>
  <text x="60" y="417" font-family="Courier New, monospace" font-size="15.078461459976" fill="var(--danger-text)">  dec %ecx</text>
  <text x="60" y="451.8" font-family="Courier New, monospace" font-size="15.078461459976" fill="var(--danger-text)">  jnz .loop</text>
  <text x="335" y="509.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527382831" font-weight="bold" fill="var(--danger-text)">100 iter × 6 = 600 insn</text>
  <text x="335" y="550.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078461459976" fill="var(--danger-text)">Up to 100 branch penalties</text>

  <rect x="650" y="40" width="590" height="580" rx="8.616263691415" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="86.400000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228539" font-weight="bold" fill="var(--ok-text)">AFTER (4x)</text>
  <text x="670" y="132.8" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--ok-text)">mov $25, %ecx</text>
  <text x="670" y="173.4" font-family="Courier New, monospace" font-size="14.001428498549" font-weight="bold" fill="var(--ok-text)">.loop:</text>
  <text x="670" y="202.400000000001" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--ok-text)">  mov (%esi), %eax</text>
  <text x="670" y="225.6" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--ok-text)">  mov %eax, (%edi)</text>
  <text x="670" y="254.600000000001" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--ok-text)">  mov 4(%esi), %eax</text>
  <text x="670" y="277.8" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--ok-text)">  mov %eax, 4(%edi)</text>
  <text x="670" y="306.8" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--ok-text)">  mov 8(%esi), %eax</text>
  <text x="670" y="330.000000000001" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--ok-text)">  mov %eax, 8(%edi)</text>
  <text x="670" y="359" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--ok-text)">  mov 12(%esi), %eax</text>
  <text x="670" y="382.200000000001" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--ok-text)">  mov %eax, 12(%edi)</text>
  <text x="670" y="411.2" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--ok-text)">  add $16, %esi</text>
  <text x="670" y="440.2" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--ok-text)">  add $16, %edi</text>
  <text x="670" y="469.2" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--ok-text)">  dec %ecx ; jnz .loop</text>
  <text x="945" y="521.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527382831" font-weight="bold" fill="var(--ok-text)">25 × 11 = 275 insn</text>
  <text x="945" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.078461459976" fill="var(--ok-text)">Only 25 branches</text>
  <text x="945" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.001428498549" font-style="italic" fill="var(--ok-text)">Trade: larger code</text>
</svg>

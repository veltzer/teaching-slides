<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-before" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffebee"/>
      <stop offset="100%" stop-color="#ffcdd2"/>
    </linearGradient>
    <linearGradient id="grad-after" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Header bar -->
  <rect x="20" y="12" width="1240" height="42" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Loop Unrolling: Before vs After</text>

  <!-- BEFORE panel -->
  <rect x="20" y="68" width="575" height="520" rx="10" fill="url(#grad-before)" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="68" width="575" height="40" rx="10" fill="#e53935"/>
  <rect x="20" y="94" width="575" height="14" fill="#e53935"/>
  <text x="307" y="96" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">BEFORE  (original loop)</text>

  <!-- before code box -->
  <rect x="40" y="120" width="535" height="265" rx="6" fill="#212121" filter="url(#shadow)"/>
  <text x="60" y="146" font-family="monospace" font-size="13" fill="#888">; Copy 100 integers: src → dst</text>
  <text x="60" y="166" font-family="monospace" font-size="13" fill="#ffcc80">    mov  $100, %ecx    </text>
  <text x="60" y="184" font-family="monospace" font-size="13" fill="#90caf9">    lea  src, %esi</text>
  <text x="60" y="202" font-family="monospace" font-size="13" fill="#90caf9">    lea  dst, %edi</text>
  <text x="60" y="222" font-family="monospace" font-size="14" font-weight="bold" fill="#ffcc80">.loop:</text>
  <text x="60" y="240" font-family="monospace" font-size="13" fill="#a5d6a7">    mov  (%esi), %eax</text>
  <text x="60" y="258" font-family="monospace" font-size="13" fill="#a5d6a7">    mov  %eax, (%edi)</text>
  <text x="60" y="276" font-family="monospace" font-size="13" fill="#ce93d8">    add  $4, %esi</text>
  <text x="60" y="294" font-family="monospace" font-size="13" fill="#ce93d8">    add  $4, %edi</text>
  <text x="60" y="312" font-family="monospace" font-size="13" fill="#ffcc80">    dec  %ecx</text>
  <text x="60" y="330" font-family="monospace" font-size="13" fill="#ffcc80">    jnz  .loop</text>
  <text x="60" y="355" font-family="monospace" font-size="11" fill="#555">; ↑ jumps back 100 times</text>
  <text x="60" y="373" font-family="monospace" font-size="11" fill="#555">; ↑ 6 instructions per iteration</text>

  <!-- before stats -->
  <rect x="40" y="398" width="535" height="170" rx="6" fill="#ffffff" stroke="#e53935" stroke-width="1.5"/>
  <text x="307" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c62828">Performance Analysis</text>
  <line x1="40" y1="426" x2="575" y2="426" stroke="#ffcdd2" stroke-width="1"/>

  <text x="60" y="448" font-family="sans-serif" font-size="12" fill="#333">Iterations:</text>
  <rect x="200" y="432" width="80" height="24" rx="4" fill="#e53935"/>
  <text x="240" y="449" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">100</text>

  <text x="60" y="472" font-family="sans-serif" font-size="12" fill="#333">Instructions/iter:</text>
  <rect x="200" y="457" width="80" height="24" rx="4" fill="#e74c3c"/>
  <text x="240" y="474" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">6</text>

  <text x="60" y="496" font-family="sans-serif" font-size="12" fill="#333">Total instructions:</text>
  <rect x="200" y="481" width="80" height="24" rx="4" fill="#c62828"/>
  <text x="240" y="498" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">600</text>

  <text x="60" y="520" font-family="sans-serif" font-size="12" fill="#333">Branch mispredictions:</text>
  <rect x="240" y="505" width="120" height="24" rx="4" fill="#f9a825"/>
  <text x="300" y="522" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">up to 100</text>

  <text x="60" y="544" font-family="sans-serif" font-size="12" fill="#333">Code size:</text>
  <rect x="200" y="529" width="120" height="24" rx="4" fill="#4caf50"/>
  <text x="260" y="546" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">compact ✓</text>

  <!-- AFTER panel -->
  <rect x="615" y="68" width="645" height="520" rx="10" fill="url(#grad-after)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <rect x="615" y="68" width="645" height="40" rx="10" fill="#2e7d32"/>
  <rect x="615" y="94" width="645" height="14" fill="#2e7d32"/>
  <text x="937" y="96" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">AFTER  (4x unrolled)</text>

  <!-- after code box -->
  <rect x="633" y="120" width="610" height="265" rx="6" fill="#212121" filter="url(#shadow)"/>
  <text x="653" y="146" font-family="monospace" font-size="13" fill="#888">; Same copy, 4 operations per iteration</text>
  <text x="653" y="166" font-family="monospace" font-size="13" fill="#ffcc80">    mov  $25, %ecx    </text>
  <text x="653" y="184" font-family="monospace" font-size="13" fill="#90caf9">    lea  src, %esi</text>
  <text x="653" y="202" font-family="monospace" font-size="13" fill="#90caf9">    lea  dst, %edi</text>
  <text x="653" y="222" font-family="monospace" font-size="14" font-weight="bold" fill="#ffcc80">.loop:</text>
  <text x="653" y="240" font-family="monospace" font-size="13" fill="#a5d6a7">    mov  (%esi),   %eax   </text>
  <text x="653" y="254" font-family="monospace" font-size="13" fill="#a5d6a7">    mov  %eax,    (%edi)</text>
  <text x="653" y="268" font-family="monospace" font-size="13" fill="#a5d6a7">    mov  4(%esi),  %eax</text>
  <text x="653" y="282" font-family="monospace" font-size="13" fill="#a5d6a7">    mov  %eax,   4(%edi)</text>
  <text x="653" y="296" font-family="monospace" font-size="13" fill="#a5d6a7">    mov  8(%esi),  %eax</text>
  <text x="653" y="310" font-family="monospace" font-size="13" fill="#a5d6a7">    mov  %eax,   8(%edi)</text>
  <text x="653" y="324" font-family="monospace" font-size="13" fill="#a5d6a7">    mov  12(%esi), %eax</text>
  <text x="653" y="338" font-family="monospace" font-size="13" fill="#a5d6a7">    mov  %eax,  12(%edi)</text>
  <text x="653" y="355" font-family="monospace" font-size="13" fill="#ce93d8">    add  $16, %esi</text>
  <text x="653" y="370" font-family="monospace" font-size="13" fill="#ce93d8">    add  $16, %edi</text>
  <text x="653" y="384" font-family="monospace" font-size="13" fill="#ffcc80">    dec  %ecx</text>

  <!-- after stats -->
  <rect x="633" y="398" width="610" height="170" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="937" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b5e20">Performance Analysis</text>
  <line x1="633" y1="426" x2="1243" y2="426" stroke="#c8e6c9" stroke-width="1"/>

  <text x="653" y="448" font-family="sans-serif" font-size="12" fill="#333">Iterations:</text>
  <rect x="793" y="432" width="80" height="24" rx="4" fill="#2e7d32"/>
  <text x="833" y="449" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">25</text>
  <text x="882" y="449" font-family="sans-serif" font-size="12" fill="#2e7d32" font-weight="bold">↓ 75% fewer</text>

  <text x="653" y="472" font-family="sans-serif" font-size="12" fill="#333">Instructions/iter:</text>
  <rect x="793" y="457" width="80" height="24" rx="4" fill="#388e3c"/>
  <text x="833" y="474" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">11</text>
  <text x="882" y="474" font-family="sans-serif" font-size="12" fill="#555">4× work per loop</text>

  <text x="653" y="496" font-family="sans-serif" font-size="12" fill="#333">Total instructions:</text>
  <rect x="793" y="481" width="80" height="24" rx="4" fill="#1b5e20"/>
  <text x="833" y="498" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">275</text>
  <text x="882" y="498" font-family="sans-serif" font-size="12" fill="#2e7d32" font-weight="bold">↓ 54% fewer</text>

  <text x="653" y="520" font-family="sans-serif" font-size="12" fill="#333">Branch mispredictions:</text>
  <rect x="793" y="505" width="120" height="24" rx="4" fill="#2e7d32"/>
  <text x="853" y="522" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">only 25 ✓</text>

  <text x="653" y="544" font-family="sans-serif" font-size="12" fill="#333">Code size:</text>
  <rect x="793" y="529" width="120" height="24" rx="4" fill="#f9a825"/>
  <text x="853" y="546" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">4× larger !</text>

  <!-- Trade-off summary bar at bottom -->
  <rect x="20" y="596" width="1240" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <text x="30" y="614" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a237e">Trade-off: </text>
  <text x="115" y="614" font-family="sans-serif" font-size="12" fill="#333">Fewer jumps &amp; branch penalties → faster execution    |    Larger code footprint → more I-cache pressure    |    Best for inner hot loops</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-before" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffebee"/>
      <stop offset="100%" stop-color="#ffcdd2"/>
    </linearGradient>
    <linearGradient id="grad-after" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Header bar -->
  <rect x="20" y="12" width="1240" height="42" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="var(--bg)">Loop Unrolling: Before vs After</text>

  <!-- BEFORE panel -->
  <rect x="20" y="68" width="575" height="520" rx="10" fill="url(#grad-before)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="68" width="575" height="40" rx="10" fill="var(--danger)"/>
  <rect x="20" y="94" width="575" height="14" fill="var(--danger)"/>
  <text x="307" y="96" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">BEFORE  (original loop)</text>

  <!-- before code box -->
  <rect x="40" y="120" width="535" height="265" rx="6" fill="var(--text)" filter="url(#shadow)"/>
  <text x="60" y="146" font-family="monospace" font-size="13" fill="var(--text-faint)">; Copy 100 integers: src → dst</text>
  <text x="60" y="166" font-family="monospace" font-size="13" fill="var(--warn-tint)">    mov  $100, %ecx    </text>
  <text x="60" y="184" font-family="monospace" font-size="13" fill="var(--primary-tint)">    lea  src, %esi</text>
  <text x="60" y="202" font-family="monospace" font-size="13" fill="var(--primary-tint)">    lea  dst, %edi</text>
  <text x="60" y="222" font-family="monospace" font-size="14" font-weight="bold" fill="var(--warn-tint)">.loop:</text>
  <text x="60" y="240" font-family="monospace" font-size="13" fill="var(--ok-tint)">    mov  (%esi), %eax</text>
  <text x="60" y="258" font-family="monospace" font-size="13" fill="var(--ok-tint)">    mov  %eax, (%edi)</text>
  <text x="60" y="276" font-family="monospace" font-size="13" fill="var(--info-lt)">    add  $4, %esi</text>
  <text x="60" y="294" font-family="monospace" font-size="13" fill="var(--info-lt)">    add  $4, %edi</text>
  <text x="60" y="312" font-family="monospace" font-size="13" fill="var(--warn-tint)">    dec  %ecx</text>
  <text x="60" y="330" font-family="monospace" font-size="13" fill="var(--warn-tint)">    jnz  .loop</text>
  <text x="60" y="355" font-family="monospace" font-size="11" fill="var(--text-muted)">; ↑ jumps back 100 times</text>
  <text x="60" y="373" font-family="monospace" font-size="11" fill="var(--text-muted)">; ↑ 6 instructions per iteration</text>

  <!-- before stats -->
  <rect x="40" y="398" width="535" height="170" rx="6" fill="var(--bg)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="307" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--danger-dk)">Performance Analysis</text>
  <line x1="40" y1="426" x2="575" y2="426" stroke="var(--danger-lt)" stroke-width="1"/>

  <text x="60" y="448" font-family="sans-serif" font-size="12" fill="var(--text-dark)">Iterations:</text>
  <rect x="200" y="432" width="80" height="24" rx="4" fill="var(--danger)"/>
  <text x="240" y="449" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="var(--bg)">100</text>

  <text x="60" y="472" font-family="sans-serif" font-size="12" fill="var(--text-dark)">Instructions/iter:</text>
  <rect x="200" y="457" width="80" height="24" rx="4" fill="var(--danger-light)"/>
  <text x="240" y="474" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="var(--bg)">6</text>

  <text x="60" y="496" font-family="sans-serif" font-size="12" fill="var(--text-dark)">Total instructions:</text>
  <rect x="200" y="481" width="80" height="24" rx="4" fill="var(--danger-dk)"/>
  <text x="240" y="498" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="var(--bg)">600</text>

  <text x="60" y="520" font-family="sans-serif" font-size="12" fill="var(--text-dark)">Branch mispredictions:</text>
  <rect x="240" y="505" width="120" height="24" rx="4" fill="var(--warn-amber)"/>
  <text x="300" y="522" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="var(--bg)">up to 100</text>

  <text x="60" y="544" font-family="sans-serif" font-size="12" fill="var(--text-dark)">Code size:</text>
  <rect x="200" y="529" width="120" height="24" rx="4" fill="var(--ok-light)"/>
  <text x="260" y="546" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="var(--bg)">compact ✓</text>

  <!-- AFTER panel -->
  <rect x="615" y="68" width="645" height="520" rx="10" fill="url(#grad-after)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="615" y="68" width="645" height="40" rx="10" fill="var(--ok-dk)"/>
  <rect x="615" y="94" width="645" height="14" fill="var(--ok-dk)"/>
  <text x="937" y="96" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">AFTER  (4x unrolled)</text>

  <!-- after code box -->
  <rect x="633" y="120" width="610" height="265" rx="6" fill="var(--text)" filter="url(#shadow)"/>
  <text x="653" y="146" font-family="monospace" font-size="13" fill="var(--text-faint)">; Same copy, 4 operations per iteration</text>
  <text x="653" y="166" font-family="monospace" font-size="13" fill="var(--warn-tint)">    mov  $25, %ecx    </text>
  <text x="653" y="184" font-family="monospace" font-size="13" fill="var(--primary-tint)">    lea  src, %esi</text>
  <text x="653" y="202" font-family="monospace" font-size="13" fill="var(--primary-tint)">    lea  dst, %edi</text>
  <text x="653" y="222" font-family="monospace" font-size="14" font-weight="bold" fill="var(--warn-tint)">.loop:</text>
  <text x="653" y="240" font-family="monospace" font-size="13" fill="var(--ok-tint)">    mov  (%esi),   %eax   </text>
  <text x="653" y="254" font-family="monospace" font-size="13" fill="var(--ok-tint)">    mov  %eax,    (%edi)</text>
  <text x="653" y="268" font-family="monospace" font-size="13" fill="var(--ok-tint)">    mov  4(%esi),  %eax</text>
  <text x="653" y="282" font-family="monospace" font-size="13" fill="var(--ok-tint)">    mov  %eax,   4(%edi)</text>
  <text x="653" y="296" font-family="monospace" font-size="13" fill="var(--ok-tint)">    mov  8(%esi),  %eax</text>
  <text x="653" y="310" font-family="monospace" font-size="13" fill="var(--ok-tint)">    mov  %eax,   8(%edi)</text>
  <text x="653" y="324" font-family="monospace" font-size="13" fill="var(--ok-tint)">    mov  12(%esi), %eax</text>
  <text x="653" y="338" font-family="monospace" font-size="13" fill="var(--ok-tint)">    mov  %eax,  12(%edi)</text>
  <text x="653" y="355" font-family="monospace" font-size="13" fill="var(--info-lt)">    add  $16, %esi</text>
  <text x="653" y="370" font-family="monospace" font-size="13" fill="var(--info-lt)">    add  $16, %edi</text>
  <text x="653" y="384" font-family="monospace" font-size="13" fill="var(--warn-tint)">    dec  %ecx</text>

  <!-- after stats -->
  <rect x="633" y="398" width="610" height="170" rx="6" fill="var(--bg)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="937" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--ok-deep)">Performance Analysis</text>
  <line x1="633" y1="426" x2="1243" y2="426" stroke="var(--ok-lt)" stroke-width="1"/>

  <text x="653" y="448" font-family="sans-serif" font-size="12" fill="var(--text-dark)">Iterations:</text>
  <rect x="793" y="432" width="80" height="24" rx="4" fill="var(--ok-dk)"/>
  <text x="833" y="449" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="var(--bg)">25</text>
  <text x="882" y="449" font-family="sans-serif" font-size="12" fill="var(--ok-dk)" font-weight="bold">↓ 75% fewer</text>

  <text x="653" y="472" font-family="sans-serif" font-size="12" fill="var(--text-dark)">Instructions/iter:</text>
  <rect x="793" y="457" width="80" height="24" rx="4" fill="var(--ok-mid)"/>
  <text x="833" y="474" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="var(--bg)">11</text>
  <text x="882" y="474" font-family="sans-serif" font-size="12" fill="var(--text-muted)">4× work per loop</text>

  <text x="653" y="496" font-family="sans-serif" font-size="12" fill="var(--text-dark)">Total instructions:</text>
  <rect x="793" y="481" width="80" height="24" rx="4" fill="var(--ok-deep)"/>
  <text x="833" y="498" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="var(--bg)">275</text>
  <text x="882" y="498" font-family="sans-serif" font-size="12" fill="var(--ok-dk)" font-weight="bold">↓ 54% fewer</text>

  <text x="653" y="520" font-family="sans-serif" font-size="12" fill="var(--text-dark)">Branch mispredictions:</text>
  <rect x="793" y="505" width="120" height="24" rx="4" fill="var(--ok-dk)"/>
  <text x="853" y="522" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="var(--bg)">only 25 ✓</text>

  <text x="653" y="544" font-family="sans-serif" font-size="12" fill="var(--text-dark)">Code size:</text>
  <rect x="793" y="529" width="120" height="24" rx="4" fill="var(--warn-amber)"/>
  <text x="853" y="546" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="var(--bg)">4× larger !</text>

  <!-- Trade-off summary bar at bottom -->
  <rect x="20" y="596" width="1240" height="30" rx="6" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="1.5"/>
  <text x="30" y="614" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--primary-deeper)">Trade-off: </text>
  <text x="115" y="614" font-family="sans-serif" font-size="12" fill="var(--text-dark)">Fewer jumps &amp; branch penalties → faster execution    |    Larger code footprint → more I-cache pressure    |    Best for inner hot loops</text>
</svg>

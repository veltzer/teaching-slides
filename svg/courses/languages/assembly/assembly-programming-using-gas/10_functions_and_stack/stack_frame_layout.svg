<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="39.1111" y="266.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555" transform="rotate(-90 44 300)">Higher addresses</ns0:text>
  <ns0:line x1="58.6667" y1="17.7778" x2="58.6667" y2="497.7778" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:polygon points="58.6667,13.3333 55.1111,24.8889 62.2222,24.8889" fill="#aaaaaa" />
  <ns0:polygon points="58.6667,502.2222 55.1111,490.6667 62.2222,490.6667" fill="#aaaaaa" />
  <ns0:text x="39.1111" y="497.7778" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#555555" transform="rotate(-90 44 560)">Lower addresses</ns0:text>
  <ns0:text x="160" y="12.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Stack grows downward ↓</ns0:text>
  <ns0:rect x="248.8889" y="17.7778" width="497.7778" height="42.6667" rx="3.5556" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="497.7778" y="44.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">caller's stack frame (above)</ns0:text>
  <ns0:rect x="248.8889" y="65.7778" width="497.7778" height="42.6667" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="92.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="#555555">arg2   → EBP+12</ns0:text>
  <ns0:text x="782.2222" y="92.4444" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">pushed 2nd</ns0:text>
  <ns0:rect x="248.8889" y="113.7778" width="497.7778" height="42.6667" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="140.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="#555555">arg1   → EBP+8</ns0:text>
  <ns0:text x="782.2222" y="140.4444" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">pushed 1st (cdecl)</ns0:text>
  <ns0:rect x="248.8889" y="161.7778" width="497.7778" height="42.6667" rx="3.5556" fill="#212121" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="188.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="#ffffff">return addr → EBP+4</ns0:text>
  <ns0:text x="782.2222" y="188.4444" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">pushed by CALL</ns0:text>
  <ns0:rect x="248.8889" y="209.7778" width="497.7778" height="42.6667" rx="3.5556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="236.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" font-weight="bold" fill="#ffffff">saved EBP → EBP+0</ns0:text>
  <ns0:text x="782.2222" y="236.4444" font-family="sans-serif" font-size="12.4444" fill="#bbdefb">push %ebp; mov %esp,%ebp</ns0:text>
  <ns0:rect x="248.8889" y="257.7778" width="497.7778" height="42.6667" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="284.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="#1565c0">local1  → EBP-4</ns0:text>
  <ns0:text x="782.2222" y="284.4444" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">sub $N, %esp</ns0:text>
  <ns0:rect x="248.8889" y="305.7778" width="497.7778" height="42.6667" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="332.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="#1565c0">local2  → EBP-8</ns0:text>
  <ns0:rect x="248.8889" y="353.7778" width="497.7778" height="42.6667" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="497.7778" y="380.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="#555555">saved EBX/ESI/EDI</ns0:text>
  <ns0:text x="782.2222" y="380.4444" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">callee-saved regs</ns0:text>
  <ns0:rect x="248.8889" y="401.7778" width="497.7778" height="42.6667" rx="3.5556" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" stroke-dasharray="5.3333 2.6667" />
  <ns0:text x="497.7778" y="428.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#9e9e9e">↑ ESP (top of stack)</ns0:text>
  <ns0:line x1="224" y1="231.1111" x2="248.8889" y2="231.1111" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-primary)" />
  <ns0:text x="168.8889" y="235.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="#1565c0">EBP →</ns0:text>
  <ns0:line x1="224" y1="423.1111" x2="248.8889" y2="423.1111" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:text x="168.8889" y="427.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="#555555">ESP →</ns0:text>
  <ns0:rect x="800" y="161.7778" width="302.2222" height="186.6667" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="951.1111" y="184.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#1565c0">Prologue:</ns0:text>
  <ns0:text x="817.7778" y="204.4444" font-family="monospace" font-size="11.5556" fill="#212121">push %ebp</ns0:text>
  <ns0:text x="817.7778" y="222.2222" font-family="monospace" font-size="11.5556" fill="#212121">mov  %esp, %ebp</ns0:text>
  <ns0:text x="817.7778" y="240" font-family="monospace" font-size="11.5556" fill="#212121">sub  $8, %esp</ns0:text>
  <ns0:text x="951.1111" y="272" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#1565c0">Epilogue:</ns0:text>
  <ns0:text x="817.7778" y="291.5556" font-family="monospace" font-size="11.5556" fill="#212121">mov  %ebp, %esp</ns0:text>
  <ns0:text x="817.7778" y="309.3333" font-family="monospace" font-size="11.5556" fill="#212121">pop  %ebp</ns0:text>
  <ns0:text x="817.7778" y="327.1111" font-family="monospace" font-size="11.5556" fill="#212121">ret</ns0:text>
  <ns0:rect x="248.8889" y="462.2222" width="853.3333" height="35.5556" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="675.5556" y="484.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">EBP is stable throughout the function — access args (+offset) and locals (−offset) via EBP</ns0:text>
</ns0:svg>
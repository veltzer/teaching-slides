<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Address axis label -->
  <text x="54" y="360" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555" transform="rotate(-90 54 360)">Higher addresses</text>
  <line x1="78" y1="60" x2="78" y2="660" stroke="#e0e0e0" stroke-width="1.5"/>
  <polygon points="78,55 74,68 82,68" fill="#aaaaaa"/>
  <polygon points="78,665 74,652 82,652" fill="#aaaaaa"/>
  <text x="54" y="660" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555" transform="rotate(-90 54 660)">Lower addresses</text>

  <!-- Stack grows down label -->
  <text x="200" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555555">Stack grows downward (toward lower addresses)</text>
  <line x1="300" y1="34" x2="300" y2="54" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Caller area (top) -->
  <rect x="300" y="60" width="560" height="56" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="580" y="93" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9e9e9e">caller's stack frame (above)</text>

  <!-- Arg 2 -->
  <rect x="300" y="122" width="560" height="56" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="156" text-anchor="middle" font-family="monospace" font-size="18" fill="#555555">arg2   → EBP+12</text>
  <text x="900" y="156" font-family="sans-serif" font-size="15" fill="#9e9e9e">pushed 2nd</text>

  <!-- Arg 1 -->
  <rect x="300" y="184" width="560" height="56" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="218" text-anchor="middle" font-family="monospace" font-size="18" fill="#555555">arg1   → EBP+8</text>
  <text x="900" y="218" font-family="sans-serif" font-size="15" fill="#9e9e9e">pushed 1st (cdecl)</text>

  <!-- Return address -->
  <rect x="300" y="246" width="560" height="56" rx="4" fill="#212121" filter="url(#shadow)"/>
  <text x="580" y="280" text-anchor="middle" font-family="monospace" font-size="18" fill="#ffffff">return addr → EBP+4</text>
  <text x="900" y="280" font-family="sans-serif" font-size="15" fill="#9e9e9e">pushed by CALL</text>

  <!-- Saved EBP  ← EBP points here -->
  <rect x="300" y="308" width="560" height="56" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="580" y="342" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">saved EBP → EBP+0</text>
  <text x="900" y="342" font-family="sans-serif" font-size="15" fill="#bbdefb">push %ebp; mov %esp,%ebp</text>

  <!-- Local var 1 -->
  <rect x="300" y="370" width="560" height="56" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="404" text-anchor="middle" font-family="monospace" font-size="18" fill="#1565c0">local1  → EBP-4</text>
  <text x="900" y="404" font-family="sans-serif" font-size="15" fill="#9e9e9e">sub $N, %esp</text>

  <!-- Local var 2 -->
  <rect x="300" y="432" width="560" height="56" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="466" text-anchor="middle" font-family="monospace" font-size="18" fill="#1565c0">local2  → EBP-8</text>

  <!-- Saved EBX/ESI/EDI -->
  <rect x="300" y="494" width="560" height="56" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="528" text-anchor="middle" font-family="monospace" font-size="18" fill="#555555">saved EBX/ESI/EDI</text>
  <text x="900" y="528" font-family="sans-serif" font-size="15" fill="#9e9e9e">callee-saved regs</text>

  <!-- ESP marker (bottom of frame) -->
  <rect x="300" y="556" width="560" height="56" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="580" y="590" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9e9e9e">↑ ESP (top of stack)</text>

  <!-- EBP pointer arrow -->
  <line x1="270" y1="336" x2="300" y2="336" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="200" y="340" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1565c0">EBP →</text>

  <!-- ESP pointer arrow -->
  <line x1="270" y1="584" x2="300" y2="584" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="200" y="588" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#555555">ESP →</text>

  <!-- Code annotation on right -->
  <rect x="920" y="370" width="320" height="180" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1080" y="400" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">Prologue:</text>
  <text x="940" y="424" font-family="monospace" font-size="14" fill="#212121">push %ebp</text>
  <text x="940" y="446" font-family="monospace" font-size="14" fill="#212121">mov  %esp, %ebp</text>
  <text x="940" y="468" font-family="monospace" font-size="14" fill="#212121">sub  $8, %esp</text>
  <text x="1080" y="500" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">Epilogue:</text>
  <text x="940" y="524" font-family="monospace" font-size="14" fill="#212121">mov  %ebp, %esp</text>
  <text x="940" y="546" font-family="monospace" font-size="14" fill="#212121">pop  %ebp</text>

  <!-- Key note -->
  <rect x="300" y="638" width="880" height="46" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="740" y="667" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1565c0">EBP is stable throughout the function — use it to access args and locals by fixed offsets</text>
</svg>

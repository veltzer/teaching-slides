<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="39.1111" y="266.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)" transform="rotate(-90 44 300)">Higher addresses</text>
  <line x1="58.6667" y1="17.7778" x2="58.6667" y2="497.7778" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="58.6667,13.3333 55.1111,24.8889 62.2222,24.8889" fill="var(--text-faint)" />
  <polygon points="58.6667,502.2222 55.1111,490.6667 62.2222,490.6667" fill="var(--text-faint)" />
  <text x="39.1111" y="497.7778" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)" transform="rotate(-90 44 560)">Lower addresses</text>
  <text x="160" y="12.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Stack grows downward ↓</text>
  <rect x="248.8889" y="17.7778" width="497.7778" height="42.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="497.7778" y="44.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-faint)">caller's stack frame (above)</text>
  <rect x="248.8889" y="65.7778" width="497.7778" height="42.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="497.7778" y="92.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">arg2   → EBP+12</text>
  <text x="782.2222" y="92.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">pushed 2nd</text>
  <rect x="248.8889" y="113.7778" width="497.7778" height="42.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="497.7778" y="140.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">arg1   → EBP+8</text>
  <text x="782.2222" y="140.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">pushed 1st (cdecl)</text>
  <rect x="248.8889" y="161.7778" width="497.7778" height="42.6667" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="497.7778" y="188.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--bg)">return addr → EBP+4</text>
  <text x="782.2222" y="188.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">pushed by CALL</text>
  <rect x="248.8889" y="209.7778" width="497.7778" height="42.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="497.7778" y="236.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" font-weight="bold" fill="var(--bg)">saved EBP → EBP+0</text>
  <text x="782.2222" y="236.4444" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">push %ebp; mov %esp,%ebp</text>
  <rect x="248.8889" y="257.7778" width="497.7778" height="42.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="497.7778" y="284.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--primary-accent)">local1  → EBP-4</text>
  <text x="782.2222" y="284.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">sub $N, %esp</text>
  <rect x="248.8889" y="305.7778" width="497.7778" height="42.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="497.7778" y="332.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--primary-accent)">local2  → EBP-8</text>
  <rect x="248.8889" y="353.7778" width="497.7778" height="42.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="497.7778" y="380.4444" text-anchor="middle" font-family="monospace" font-size="15.1111" fill="var(--text-muted)">saved EBX/ESI/EDI</text>
  <text x="782.2222" y="380.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">callee-saved regs</text>
  <rect x="248.8889" y="401.7778" width="497.7778" height="42.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="5.3333 2.6667" />
  <text x="497.7778" y="428.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-faint)">↑ ESP (top of stack)</text>
  <line x1="224" y1="231.1111" x2="248.8889" y2="231.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="168.8889" y="235.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">EBP →</text>
  <line x1="224" y1="423.1111" x2="248.8889" y2="423.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="168.8889" y="427.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" font-weight="bold" fill="var(--text-muted)">ESP →</text>
  <rect x="800" y="161.7778" width="302.2222" height="186.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="951.1111" y="184.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">Prologue:</text>
  <text x="817.7778" y="204.4444" font-family="monospace" font-size="11.5556" fill="var(--text)">push %ebp</text>
  <text x="817.7778" y="222.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">mov  %esp, %ebp</text>
  <text x="817.7778" y="240" font-family="monospace" font-size="11.5556" fill="var(--text)">sub  $8, %esp</text>
  <text x="951.1111" y="272" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">Epilogue:</text>
  <text x="817.7778" y="291.5556" font-family="monospace" font-size="11.5556" fill="var(--text)">mov  %ebp, %esp</text>
  <text x="817.7778" y="309.3333" font-family="monospace" font-size="11.5556" fill="var(--text)">pop  %ebp</text>
  <text x="817.7778" y="327.1111" font-family="monospace" font-size="11.5556" fill="var(--text)">ret</text>
  <rect x="248.8889" y="462.2222" width="853.3333" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="675.5556" y="484.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">EBP is stable throughout the function — access args (+offset) and locals (−offset) via EBP</text>
</svg>
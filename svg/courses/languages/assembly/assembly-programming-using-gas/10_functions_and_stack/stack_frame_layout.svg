<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="81.25" y="281.6667" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)" transform="rotate(-90 44 300)">Higher addresses</text>
  <line x1="101.875" y1="56.1111" x2="101.875" y2="491.1111" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="101.875,52.0833 98.125,62.5556 105.625,62.5556" fill="var(--text-faint)" />
  <polygon points="101.875,495.1389 98.125,484.6667 105.625,484.6667" fill="var(--text-faint)" />
  <text x="81.25" y="491.1111" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)" transform="rotate(-90 44 560)">Lower addresses</text>
  <text x="208.75" y="51.2777" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">Stack grows downward ↓</text>
  <rect x="302.5" y="56.1111" width="525" height="38.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="565" y="80.2777" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-faint)">caller's stack frame (above)</text>
  <rect x="302.5" y="99.6111" width="525" height="38.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="565" y="123.7777" text-anchor="middle" font-family="monospace" font-size="14.7735" fill="var(--text-muted)">arg2   → EBP+12</text>
  <text x="865" y="123.7777" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">pushed 2nd</text>
  <rect x="302.5" y="143.1111" width="525" height="38.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="565" y="167.2777" text-anchor="middle" font-family="monospace" font-size="14.7735" fill="var(--text-muted)">arg1   → EBP+8</text>
  <text x="865" y="167.2777" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">pushed 1st (cdecl)</text>
  <rect x="302.5" y="186.6111" width="525" height="38.6667" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="565" y="210.7777" text-anchor="middle" font-family="monospace" font-size="14.7735" fill="var(--bg)">return addr → EBP+4</text>
  <text x="865" y="210.7777" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">pushed by CALL</text>
  <rect x="302.5" y="230.1111" width="525" height="38.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="565" y="254.2777" text-anchor="middle" font-family="monospace" font-size="14.7735" font-weight="bold" fill="var(--bg)">saved EBP → EBP+0</text>
  <text x="865" y="254.2777" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">push %ebp; mov %esp,%ebp</text>
  <rect x="302.5" y="273.6111" width="525" height="38.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="565" y="297.7777" text-anchor="middle" font-family="monospace" font-size="14.7735" fill="var(--primary-accent)">local1  → EBP-4</text>
  <text x="865" y="297.7777" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">sub $N, %esp</text>
  <rect x="302.5" y="317.1111" width="525" height="38.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="565" y="341.2777" text-anchor="middle" font-family="monospace" font-size="14.7735" fill="var(--primary-accent)">local2  → EBP-8</text>
  <rect x="302.5" y="360.6111" width="525" height="38.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="565" y="384.7777" text-anchor="middle" font-family="monospace" font-size="14.7735" fill="var(--text-muted)">saved EBX/ESI/EDI</text>
  <text x="865" y="384.7777" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">callee-saved regs</text>
  <rect x="302.5" y="404.1111" width="525" height="38.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="5.3333 2.6667" />
  <text x="565" y="428.2777" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-faint)">↑ ESP (top of stack)</text>
  <line x1="276.25" y1="249.4444" x2="302.5" y2="249.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="218.125" y="253.4723" text-anchor="middle" font-family="monospace" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">EBP →</text>
  <line x1="276.25" y1="423.4444" x2="302.5" y2="423.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="218.125" y="427.4723" text-anchor="middle" font-family="monospace" font-size="13.0354" font-weight="bold" fill="var(--text-muted)">ESP →</text>
  <rect x="883.75" y="186.6111" width="318.75" height="169.1667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1043.125" y="207.5556" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">Prologue:</text>
  <text x="902.5" y="225.2777" font-family="monospace" font-size="11.2974" fill="var(--text)">push %ebp</text>
  <text x="902.5" y="241.3889" font-family="monospace" font-size="11.2974" fill="var(--text)">mov  %esp, %ebp</text>
  <text x="902.5" y="257.5" font-family="monospace" font-size="11.2974" fill="var(--text)">sub  $8, %esp</text>
  <text x="1043.125" y="286.5" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">Epilogue:</text>
  <text x="902.5" y="304.2223" font-family="monospace" font-size="11.2974" fill="var(--text)">mov  %ebp, %esp</text>
  <text x="902.5" y="320.3333" font-family="monospace" font-size="11.2974" fill="var(--text)">pop  %ebp</text>
  <text x="902.5" y="336.4444" font-family="monospace" font-size="11.2974" fill="var(--text)">ret</text>
  <rect x="302.5" y="458.8889" width="899.9999" height="32.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="752.5" y="479.0277" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">EBP is stable throughout the function — access args (+offset) and locals (−offset) via EBP</text>
</svg>
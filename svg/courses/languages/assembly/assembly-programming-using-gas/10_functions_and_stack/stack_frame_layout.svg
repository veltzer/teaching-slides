<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="81.25" y="281.6667" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" transform="rotate(-90 44 300)" font-family="Arial, sans-serif">Higher addresses</text>
  <line x1="44.074703" y1="46.315875" x2="44.074703" y2="614.736814" stroke="var(--border)" stroke-width="1.3333" />
  <polygon points="44.074703,41.052689 40,54.736999 48.149406,54.736999" fill="var(--text-faint)" />
  <polygon points="44.074703,620 40,606.315821 48.149406,606.315821" fill="var(--text-faint)" />
  <text x="81.25" y="491.1111" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)" transform="rotate(-90 44 560)" font-family="Arial, sans-serif">Lower addresses</text>
  <text x="160.203735" y="40" text-anchor="middle" font-size="15.532705" fill="var(--text-muted)" font-family="Arial, sans-serif">Stack grows downward ↓</text>
  <rect x="262.071307" y="46.315875" width="570.458404" height="50.526349" rx="7.149472" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="547.300509" y="77.894729" text-anchor="middle" font-size="15.532705" fill="var(--text-faint)" font-family="Arial, sans-serif">caller's stack frame (above)</text>
  <rect x="262.071307" y="103.157969" width="570.458404" height="50.526349" rx="7.149472" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="547.300509" y="134.736823" text-anchor="middle" font-size="17.603788" fill="var(--text-muted)" font-family="Courier New, monospace">arg2   → EBP+12</text>
  <text x="873.27674" y="134.736823" font-size="14.497104" fill="var(--text-faint)" font-family="Arial, sans-serif">pushed 2nd</text>
  <rect x="262.071307" y="160.000063" width="570.458404" height="50.526349" rx="7.149472" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="547.300509" y="191.578917" text-anchor="middle" font-size="17.603788" fill="var(--text-muted)" font-family="Courier New, monospace">arg1   → EBP+8</text>
  <text x="873.27674" y="191.578917" font-size="14.497104" fill="var(--text-faint)" font-family="Arial, sans-serif">pushed 1st (cdecl)</text>
  <rect x="262.071307" y="216.842157" width="570.458404" height="50.526349" rx="7.149472" fill="var(--text)" />
  <text x="547.300509" y="248.421011" text-anchor="middle" font-size="17.603788" fill="var(--bg)" font-family="Courier New, monospace">return addr → EBP+4</text>
  <text x="873.27674" y="248.421011" font-size="14.497104" fill="var(--text-faint)" font-family="Arial, sans-serif">pushed by CALL</text>
  <rect x="262.071307" y="273.684251" width="570.458404" height="50.526349" rx="7.149472" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="547.300509" y="305.263105" text-anchor="middle" font-size="17.603788" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">saved EBP → EBP+0</text>
  <text x="873.27674" y="305.263105" font-size="14.497104" fill="var(--primary-accent)" font-family="Arial, sans-serif">push %ebp; mov %esp,%ebp</text>
  <rect x="262.071307" y="330.526345" width="570.458404" height="50.526349" rx="7.149472" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="547.300509" y="362.105199" text-anchor="middle" font-size="17.603788" fill="var(--primary-accent)" font-family="Courier New, monospace">local1  → EBP-4</text>
  <text x="873.27674" y="362.105199" font-size="14.497104" fill="var(--text-faint)" font-family="Arial, sans-serif">sub $N, %esp</text>
  <rect x="262.071307" y="387.368439" width="570.458404" height="50.526349" rx="7.149472" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="547.300509" y="418.947293" text-anchor="middle" font-size="17.603788" fill="var(--primary-accent)" font-family="Courier New, monospace">local2  → EBP-8</text>
  <rect x="262.071307" y="444.210532" width="570.458404" height="50.526349" rx="7.149472" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="547.300509" y="475.789386" text-anchor="middle" font-size="17.603788" fill="var(--text-muted)" font-family="Courier New, monospace">saved EBX/ESI/EDI</text>
  <text x="873.27674" y="475.789386" font-size="14.497104" fill="var(--text-faint)" font-family="Arial, sans-serif">callee-saved regs</text>
  <rect x="262.071307" y="501.052626" width="570.458404" height="50.526349" rx="7.149472" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="5.3333 2.6667" />
  <text x="547.300509" y="532.63148" text-anchor="middle" font-size="15.532705" fill="var(--text-faint)" font-family="Arial, sans-serif">↑ ESP (top of stack)</text>
  <line x1="233.548387" y1="298.94736" x2="262.071307" y2="298.94736" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="170.390492" y="304.210677" text-anchor="middle" font-size="15.532705" font-weight="bold" fill="var(--primary-accent)" font-family="Courier New, monospace">EBP →</text>
  <line x1="233.548387" y1="526.315736" x2="262.071307" y2="526.315736" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="170.390492" y="531.579052" text-anchor="middle" font-size="15.532705" font-weight="bold" fill="var(--text-muted)" font-family="Courier New, monospace">ESP →</text>
  <rect x="893.650255" y="216.842157" width="346.349745" height="221.052631" rx="7.149472" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1066.825127" y="244.210645" text-anchor="middle" font-size="15.532705" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Prologue:</text>
  <text x="914.023769" y="267.368376" font-size="13.461742" fill="var(--text)" font-family="Courier New, monospace">push %ebp</text>
  <text x="914.023769" y="288.421119" font-size="13.461742" fill="var(--text)" font-family="Courier New, monospace">mov  %esp, %ebp</text>
  <text x="914.023769" y="309.473732" font-size="13.461742" fill="var(--text)" font-family="Courier New, monospace">sub  $8, %esp</text>
  <text x="1066.825127" y="347.368461" text-anchor="middle" font-size="15.532705" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Epilogue:</text>
  <text x="914.023769" y="370.526453" font-size="13.461742" fill="var(--text)" font-family="Courier New, monospace">mov  %ebp, %esp</text>
  <text x="914.023769" y="391.578935" font-size="13.461742" fill="var(--text)" font-family="Courier New, monospace">pop  %ebp</text>
  <text x="914.023769" y="412.631548" font-size="13.461742" fill="var(--text)" font-family="Courier New, monospace">ret</text>
  <rect x="262.071307" y="572.631588" width="977.928584" height="42.105356" rx="7.149472" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="751.035654" y="598.947256" text-anchor="middle" font-size="16.568187" fill="var(--primary-accent)" font-family="Arial, sans-serif">EBP is stable throughout the function — access args (+offset) and locals (−offset) via EBP</text>
</svg>
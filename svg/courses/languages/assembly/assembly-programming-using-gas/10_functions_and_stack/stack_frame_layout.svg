<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Address axis -->
  <text x="44" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555" transform="rotate(-90 44 300)">Higher addresses</text>
  <line x1="66" y1="20" x2="66" y2="560" stroke="#e0e0e0" stroke-width="1.5"/>
  <polygon points="66,15 62,28 70,28" fill="#aaaaaa"/>
  <polygon points="66,565 62,552 70,552" fill="#aaaaaa"/>
  <text x="44" y="560" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555" transform="rotate(-90 44 560)">Lower addresses</text>

  <!-- Stack grows down label -->
  <text x="180" y="14" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Stack grows downward ↓</text>

  <!-- Row height: 58px, 8 rows, starting at y=20, ending at y=484 -->

  <!-- Caller area -->
  <rect x="280" y="20" width="560" height="48" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="560" y="50" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">caller's stack frame (above)</text>

  <!-- Arg 2 -->
  <rect x="280" y="74" width="560" height="48" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="104" text-anchor="middle" font-family="monospace" font-size="17" fill="#555555">arg2   → EBP+12</text>
  <text x="880" y="104" font-family="sans-serif" font-size="14" fill="#9e9e9e">pushed 2nd</text>

  <!-- Arg 1 -->
  <rect x="280" y="128" width="560" height="48" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="158" text-anchor="middle" font-family="monospace" font-size="17" fill="#555555">arg1   → EBP+8</text>
  <text x="880" y="158" font-family="sans-serif" font-size="14" fill="#9e9e9e">pushed 1st (cdecl)</text>

  <!-- Return address -->
  <rect x="280" y="182" width="560" height="48" rx="4" fill="#212121" filter="url(#shadow)"/>
  <text x="560" y="212" text-anchor="middle" font-family="monospace" font-size="17" fill="#ffffff">return addr → EBP+4</text>
  <text x="880" y="212" font-family="sans-serif" font-size="14" fill="#9e9e9e">pushed by CALL</text>

  <!-- Saved EBP -->
  <rect x="280" y="236" width="560" height="48" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="560" y="266" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#ffffff">saved EBP → EBP+0</text>
  <text x="880" y="266" font-family="sans-serif" font-size="14" fill="#bbdefb">push %ebp; mov %esp,%ebp</text>

  <!-- Local var 1 -->
  <rect x="280" y="290" width="560" height="48" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="320" text-anchor="middle" font-family="monospace" font-size="17" fill="#1565c0">local1  → EBP-4</text>
  <text x="880" y="320" font-family="sans-serif" font-size="14" fill="#9e9e9e">sub $N, %esp</text>

  <!-- Local var 2 -->
  <rect x="280" y="344" width="560" height="48" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="374" text-anchor="middle" font-family="monospace" font-size="17" fill="#1565c0">local2  → EBP-8</text>

  <!-- Saved regs -->
  <rect x="280" y="398" width="560" height="48" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="428" text-anchor="middle" font-family="monospace" font-size="17" fill="#555555">saved EBX/ESI/EDI</text>
  <text x="880" y="428" font-family="sans-serif" font-size="14" fill="#9e9e9e">callee-saved regs</text>

  <!-- ESP marker -->
  <rect x="280" y="452" width="560" height="48" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="560" y="482" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9e9e9e">↑ ESP (top of stack)</text>

  <!-- EBP pointer -->
  <line x1="252" y1="260" x2="280" y2="260" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="190" y="265" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#1565c0">EBP →</text>

  <!-- ESP pointer -->
  <line x1="252" y1="476" x2="280" y2="476" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="190" y="481" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#555555">ESP →</text>

  <!-- Code annotation -->
  <rect x="900" y="182" width="340" height="210" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1070" y="208" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Prologue:</text>
  <text x="920" y="230" font-family="monospace" font-size="13" fill="#212121">push %ebp</text>
  <text x="920" y="250" font-family="monospace" font-size="13" fill="#212121">mov  %esp, %ebp</text>
  <text x="920" y="270" font-family="monospace" font-size="13" fill="#212121">sub  $8, %esp</text>
  <text x="1070" y="306" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Epilogue:</text>
  <text x="920" y="328" font-family="monospace" font-size="13" fill="#212121">mov  %ebp, %esp</text>
  <text x="920" y="348" font-family="monospace" font-size="13" fill="#212121">pop  %ebp</text>
  <text x="920" y="368" font-family="monospace" font-size="13" fill="#212121">ret</text>

  <!-- Note — well within y=630 limit -->
  <rect x="280" y="520" width="960" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="760" y="545" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">EBP is stable throughout the function — access args (+offset) and locals (−offset) via EBP</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Integer Array section -->
  <rect x="68.1249" y="58.125" width="543.7501" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="339.9999" y="83.4999" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integer Array Memory Layout</text>

  <!-- Array declaration -->
  <rect x="68.1249" y="107.9688" width="543.7501" height="32.6251" rx="6" fill="var(--code-bg)"/>
  <text x="82.1875" y="128.8125" font-family="monospace" font-size="12.9043" fill="var(--primary-accent)">int_array: .long 10, 20, 30, 40, 50</text>
  <text x="447.8125" y="128.8125" font-family="monospace" font-size="11.9828" fill="var(--text-muted)">; 5 x 4 bytes</text>

  <!-- Memory cells for int array -->
  <!-- Cell labels -->
  <text x="92.4999" y="162.3438" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">[0]</text>
  <text x="191.8749" y="162.3438" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">[1]</text>
  <text x="291.2499" y="162.3438" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">[2]</text>
  <text x="390.6249" y="162.3438" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">[3]</text>
  <text x="489.9999" y="162.3438" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">[4]</text>

  <!-- Int array memory boxes (4 bytes wide each) -->
  <rect x="68.1249" y="166.8749" width="99.3751" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="117.8124" y="194.9688" font-family="monospace" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">10</text>
  <rect x="167.4999" y="166.8749" width="99.3751" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="217.1874" y="194.9688" font-family="monospace" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">20</text>
  <rect x="266.8749" y="166.8749" width="99.3751" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="316.5625" y="194.9688" font-family="monospace" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">30</text>
  <rect x="366.25" y="166.8749" width="99.3751" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="415.9375" y="194.9688" font-family="monospace" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">40</text>
  <rect x="465.6248" y="166.8749" width="99.3751" height="45.3125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="515.3124" y="194.9688" font-family="monospace" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">50</text>

  <!-- Address annotations -->
  <text x="117.8124" y="227.5938" font-family="monospace" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">+0</text>
  <text x="217.1874" y="227.5938" font-family="monospace" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">+4</text>
  <text x="316.5625" y="227.5938" font-family="monospace" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">+8</text>
  <text x="415.9375" y="227.5938" font-family="monospace" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">+12</text>
  <text x="515.3124" y="227.5938" font-family="monospace" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">+16</text>
  <text x="68.1249" y="227.5938" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-faint)">bytes:</text>

  <!-- Indexed addressing -->
  <rect x="68.1249" y="239.3751" width="543.7501" height="63.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="82.1875" y="261.125" font-family="Arial, sans-serif" font-size="12.9043" font-weight="bold" fill="var(--text-muted)">Indexed Addressing:</text>
  <text x="82.1875" y="281.9688" font-family="monospace" font-size="12.9043" fill="var(--text)">movl int_array(,%ecx,4), %eax</text>
  <text x="405.625" y="281.9688" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text-muted)">; addr = int_array + ecx * 4</text>
  <text x="82.1875" y="297.3749" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-faint)">base(offset, index, scale) -- scale = element size in bytes</text>

  <!-- String / null-termination section -->
  <rect x="68.1249" y="320.9376" width="543.7501" height="39.875" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="339.9999" y="346.3126" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">String Memory and Null Termination</text>

  <!-- String declaration -->
  <rect x="68.1249" y="369.875" width="543.7501" height="32.6251" rx="6" fill="var(--code-bg)"/>
  <text x="82.1875" y="390.7187" font-family="monospace" font-size="12.9043" fill="var(--primary-accent)">str: .asciz "Hi!"</text>
  <text x="246.25" y="390.7187" font-family="monospace" font-size="11.9828" fill="var(--text-muted)">; null-terminated (same as .ascii "Hi!\0")</text>

  <!-- String memory cells: H i ! \0 -->
  <rect x="68.1249" y="411.5625" width="75" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="105.6248" y="439.6561" font-family="monospace" font-size="20.2783" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">H</text>
  <rect x="146.8749" y="411.5625" width="75" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="184.3749" y="439.6561" font-family="monospace" font-size="20.2783" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">i</text>
  <rect x="225.6249" y="411.5625" width="75" height="45.3125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="263.1249" y="439.6561" font-family="monospace" font-size="20.2783" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">!</text>
  <rect x="304.3751" y="411.5625" width="75" height="45.3125" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="341.875" y="439.6561" font-family="monospace" font-size="14.7479" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">\0</text>
  <rect x="383.1249" y="411.5625" width="75" height="45.3125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="420.625" y="439.6561" font-family="monospace" font-size="14.7479" fill="var(--border)" text-anchor="middle">???</text>

  <!-- Byte values -->
  <text x="105.6248" y="470.4688" font-family="monospace" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">0x48</text>
  <text x="184.3749" y="470.4688" font-family="monospace" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">0x69</text>
  <text x="263.1249" y="470.4688" font-family="monospace" font-size="11.6093" fill="var(--text-faint)" text-anchor="middle">0x21</text>
  <text x="341.875" y="470.4688" font-family="monospace" font-size="11.6093" fill="var(--danger-accent)" text-anchor="middle">0x00</text>
  <text x="420.625" y="470.4688" font-family="monospace" font-size="11.6093" fill="var(--border)" text-anchor="middle">uninit</text>

  <!-- Null terminator arrow label -->
  <line x1="341.875" y1="474.9999" x2="341.875" y2="502.1875" stroke="var(--danger-border)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356.8749" y="494.9374" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--danger-accent)">Null terminator -- marks end of string</text>

  <!-- Right panel: addressing modes summary -->
  <rect x="639.9999" y="58.125" width="571.875" height="534.6875" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="658.75" y="69" width="534.3751" height="32.6251" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="925.9374" y="90.75" font-family="Arial, sans-serif" font-size="15.6697" font-weight="bold" fill="var(--bg)" text-anchor="middle">Addressing Modes Summary</text>

  <!-- Mode 1: immediate -->
  <rect x="658.75" y="114.3125" width="534.3751" height="68.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="672.8125" y="136.0625" font-family="Arial, sans-serif" font-size="12.9043" font-weight="bold" fill="var(--primary-accent)">Direct (Immediate)</text>
  <text x="672.8125" y="156" font-family="monospace" font-size="11.9828" fill="var(--text)">movl $42, %eax</text>
  <text x="672.8125" y="174.125" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)">Literal value embedded in instruction</text>

  <!-- Mode 2: register indirect -->
  <rect x="658.75" y="195.875" width="534.3751" height="68.875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="672.8125" y="217.6251" font-family="Arial, sans-serif" font-size="12.9043" font-weight="bold" fill="var(--ok-accent)">Register Indirect</text>
  <text x="672.8125" y="237.5625" font-family="monospace" font-size="11.9828" fill="var(--text)">movl (%ebx), %eax</text>
  <text x="672.8125" y="255.6874" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)">Read memory at address held in %ebx</text>

  <!-- Mode 3: base + displacement -->
  <rect x="658.75" y="277.4374" width="534.3751" height="68.875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="672.8125" y="299.1876" font-family="Arial, sans-serif" font-size="12.9043" font-weight="bold" fill="var(--warn-accent)">Base + Displacement</text>
  <text x="672.8125" y="319.1249" font-family="monospace" font-size="11.9828" fill="var(--text)">movl 8(%ebx), %eax</text>
  <text x="672.8125" y="337.2499" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)">Memory at %ebx + 8 (struct field access)</text>

  <!-- Mode 4: indexed -->
  <rect x="658.75" y="359" width="534.3751" height="87" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="672.8125" y="380.75" font-family="Arial, sans-serif" font-size="12.9043" font-weight="bold" fill="var(--info-accent)">Base + Index * Scale + Displacement</text>
  <text x="672.8125" y="400.6875" font-family="monospace" font-size="11.9828" fill="var(--text)">movl arr(,%ecx,4), %eax</text>
  <text x="672.8125" y="420.6249" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)">addr = arr + ecx * 4</text>
  <text x="672.8125" y="436.9375" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)">Scale: 1 (byte), 2 (word), 4 (dword), 8 (qword)</text>

  <!-- Loop pattern -->
  <rect x="658.75" y="458.6875" width="534.3751" height="117.8125" rx="6" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="672.8125" y="480.4374" font-family="Arial, sans-serif" font-size="12.9043" font-weight="bold" fill="var(--primary-accent)">Array traversal loop:</text>
  <text x="672.8125" y="500.3749" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">  xorl %ecx, %ecx         <tspan fill="var(--text-muted)">; index = 0</tspan></text>
  <text x="672.8125" y="518.5" font-family="monospace" font-size="11.9828" fill="var(--info-accent)">loop:</text>
  <text x="672.8125" y="536.625" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">  movl arr(,%ecx,4), %eax</text>
  <text x="672.8125" y="554.75" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">  incl %ecx</text>
  <text x="672.8125" y="568.3438" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">  cmpl $5, %ecx  <tspan fill="var(--text-muted)">; 5 elements</tspan></text>
</svg>

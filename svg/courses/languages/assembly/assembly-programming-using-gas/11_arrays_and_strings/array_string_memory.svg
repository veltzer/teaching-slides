<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Integer Array -->
  <rect x="40" y="40" width="570" height="44" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--primary-text)">Integer Array Layout</text>

  <text x="55" y="120" font-family="Courier New, monospace" font-size="14" fill="var(--text)">int_array: .long 10, 20, 30, 40, 50</text>

  <rect x="40" y="145" width="104" height="50" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92" y="177" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="var(--primary-text)">10</text>
  <rect x="144" y="145" width="104" height="50" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="177" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="var(--primary-text)">20</text>
  <rect x="248" y="145" width="104" height="50" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="177" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="var(--primary-text)">30</text>
  <rect x="352" y="145" width="104" height="50" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="404" y="177" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="var(--primary-text)">40</text>
  <rect x="456" y="145" width="104" height="50" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="508" y="177" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="var(--primary-text)">50</text>

  <text x="92" y="215" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text-faint)">+0</text>
  <text x="196" y="215" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text-faint)">+4</text>
  <text x="300" y="215" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text-faint)">+8</text>
  <text x="404" y="215" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text-faint)">+12</text>
  <text x="508" y="215" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text-faint)">+16</text>

  <rect x="40" y="235" width="570" height="70" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="55" y="260" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">Indexed Addressing</text>
  <text x="55" y="282" font-family="Courier New, monospace" font-size="13" fill="var(--warn-text)">movl int_array(,%ecx,4), %eax</text>

  <!-- String section -->
  <rect x="40" y="335" width="570" height="44" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--ok-text)">Null-Terminated String</text>

  <text x="55" y="415" font-family="Courier New, monospace" font-size="14" fill="var(--text)">str: .asciz "Hi!"</text>

  <rect x="40" y="430" width="78" height="50" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="79" y="462" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--ok-text)">H</text>
  <rect x="122" y="430" width="78" height="50" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="161" y="462" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--ok-text)">i</text>
  <rect x="205" y="430" width="78" height="50" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="244" y="462" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="var(--ok-text)">!</text>
  <rect x="288" y="430" width="78" height="50" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="327" y="462" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="var(--danger-text)">\0</text>

  <text x="79" y="500" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text-faint)">0x48</text>
  <text x="161" y="500" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text-faint)">0x69</text>
  <text x="244" y="500" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--text-faint)">0x21</text>
  <text x="327" y="500" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--danger-accent)">0x00</text>

  <text x="55" y="540" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Null byte marks end of string</text>

  <!-- Right panel: addressing modes -->
  <rect x="640" y="40" width="600" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Addressing Modes</text>

  <rect x="660" y="90" width="560" height="70" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="115" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">Immediate</text>
  <text x="675" y="140" font-family="Courier New, monospace" font-size="13" fill="var(--primary-text)">movl $42, %eax</text>

  <rect x="660" y="170" width="560" height="70" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-text)">Register Indirect</text>
  <text x="675" y="220" font-family="Courier New, monospace" font-size="13" fill="var(--ok-text)">movl (%ebx), %eax</text>

  <rect x="660" y="250" width="560" height="70" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">Base + Displacement</text>
  <text x="675" y="300" font-family="Courier New, monospace" font-size="13" fill="var(--warn-text)">movl 8(%ebx), %eax</text>

  <rect x="660" y="330" width="560" height="90" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="355" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-text)">Base + Index*Scale</text>
  <text x="675" y="380" font-family="Courier New, monospace" font-size="13" fill="var(--info-text)">movl arr(,%ecx,4), %eax</text>
  <text x="675" y="405" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">Scale: 1, 2, 4, 8</text>

  <rect x="660" y="435" width="560" height="165" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="675" y="460" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--text)">Array traversal</text>
  <text x="675" y="485" font-family="Courier New, monospace" font-size="12" fill="var(--text)">xorl %ecx, %ecx</text>
  <text x="675" y="510" font-family="Courier New, monospace" font-size="12" fill="var(--text)">loop:</text>
  <text x="675" y="535" font-family="Courier New, monospace" font-size="12" fill="var(--text)">  movl arr(,%ecx,4), %eax</text>
  <text x="675" y="560" font-family="Courier New, monospace" font-size="12" fill="var(--text)">  incl %ecx</text>
  <text x="675" y="585" font-family="Courier New, monospace" font-size="12" fill="var(--text)">  cmpl $5, %ecx</text>
</svg>

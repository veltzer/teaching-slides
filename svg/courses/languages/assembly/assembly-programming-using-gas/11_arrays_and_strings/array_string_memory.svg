<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <!-- Integer Array section -->
  <rect x="40" y="40" width="570.491908" height="43.254237" rx="6.400889" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="325.245902" y="67.525315" font-family="Arial, sans-serif" font-size="17.699952" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integer Array Memory Layout</text>

  <!-- Array declaration -->
  <rect x="40" y="94.067851" width="570.491908" height="35.389939" rx="6.400889" fill="var(--code-bg)"/>
  <text x="54.754203" y="116.677966" font-family="monospace" font-size="13.766499" fill="var(--primary-accent)">int_array: .long 10, 20, 30, 40, 50</text>
  <text x="438.360761" y="116.677966" font-family="monospace" font-size="12.783429" fill="var(--text-muted)">; 5 x 4 bytes</text>

  <!-- Memory cells for int array -->
  <!-- Cell labels -->
  <text x="65.57377" y="153.050902" font-family="Arial, sans-serif" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">[0]</text>
  <text x="169.836066" y="153.050902" font-family="Arial, sans-serif" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">[1]</text>
  <text x="274.098361" y="153.050902" font-family="Arial, sans-serif" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">[2]</text>
  <text x="378.360656" y="153.050902" font-family="Arial, sans-serif" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">[3]</text>
  <text x="482.622951" y="153.050902" font-family="Arial, sans-serif" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">[4]</text>

  <!-- Int array memory boxes (4 bytes wide each) -->
  <rect x="40" y="157.965993" width="104.2624" height="49.152542" rx="6.400889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.131148" y="188.440732" font-family="monospace" font-size="17.699952" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">10</text>
  <rect x="144.262295" y="157.965993" width="104.2624" height="49.152542" rx="6.400889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="196.393443" y="188.440732" font-family="monospace" font-size="17.699952" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">20</text>
  <rect x="248.52459" y="157.965993" width="104.2624" height="49.152542" rx="6.400889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="300.655843" y="188.440732" font-family="monospace" font-size="17.699952" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">30</text>
  <rect x="352.78699" y="157.965993" width="104.2624" height="49.152542" rx="6.400889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="404.918138" y="188.440732" font-family="monospace" font-size="17.699952" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">40</text>
  <rect x="457.049075" y="157.965993" width="104.2624" height="49.152542" rx="6.400889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="509.180328" y="188.440732" font-family="monospace" font-size="17.699952" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">50</text>

  <!-- Address annotations -->
  <text x="92.131148" y="223.830563" font-family="monospace" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">+0</text>
  <text x="196.393443" y="223.830563" font-family="monospace" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">+4</text>
  <text x="300.655843" y="223.830563" font-family="monospace" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">+8</text>
  <text x="404.918138" y="223.830563" font-family="monospace" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">+12</text>
  <text x="509.180328" y="223.830563" font-family="monospace" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">+16</text>
  <text x="40" y="223.830563" font-family="Arial, sans-serif" font-size="12.384974" fill="var(--text-faint)">bytes:</text>

  <!-- Indexed addressing -->
  <rect x="40" y="236.610278" width="570.491908" height="68.813559" rx="6.400889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="54.754203" y="260.20339" font-family="Arial, sans-serif" font-size="13.766499" font-weight="bold" fill="var(--text-muted)">Indexed Addressing:</text>
  <text x="54.754203" y="282.813614" font-family="monospace" font-size="13.766499" fill="var(--text)">movl int_array(,%ecx,4), %eax</text>
  <text x="394.098466" y="282.813614" font-family="Arial, sans-serif" font-size="12.783429" fill="var(--text-muted)">; addr = int_array + ecx * 4</text>
  <text x="54.754203" y="299.525315" font-family="Arial, sans-serif" font-size="12.384974" fill="var(--text-faint)">base(offset, index, scale) -- scale = element size in bytes</text>

  <!-- String / null-termination section -->
  <rect x="40" y="325.084854" width="570.491908" height="43.254237" rx="6.400889" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="325.245902" y="352.610278" font-family="Arial, sans-serif" font-size="17.699952" font-weight="bold" fill="var(--bg)" text-anchor="middle">String Memory and Null Termination</text>

  <!-- String declaration -->
  <rect x="40" y="378.169492" width="570.491908" height="35.389939" rx="6.400889" fill="var(--code-bg)"/>
  <text x="54.754203" y="400.779607" font-family="monospace" font-size="13.766499" fill="var(--primary-accent)">str: .asciz "Hi!"</text>
  <text x="226.885351" y="400.779607" font-family="monospace" font-size="12.783429" fill="var(--text-muted)">; null-terminated (same as .ascii "Hi!\0")</text>

  <!-- String memory cells: H i ! \0 -->
  <rect x="40" y="423.389831" width="78.688525" height="49.152542" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="79.344157" y="453.864244" font-family="monospace" font-size="21.633191" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">H</text>
  <rect x="122.622951" y="423.389831" width="78.688525" height="49.152542" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="161.967213" y="453.864244" font-family="monospace" font-size="21.633191" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">i</text>
  <rect x="205.245902" y="423.389831" width="78.688525" height="49.152542" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="244.590164" y="453.864244" font-family="monospace" font-size="21.633191" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">!</text>
  <rect x="287.869062" y="423.389831" width="78.688525" height="49.152542" rx="6.400889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="327.21322" y="453.864244" font-family="monospace" font-size="15.733279" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">\0</text>
  <rect x="370.491803" y="423.389831" width="78.688525" height="49.152542" rx="6.400889" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="409.83617" y="453.864244" font-family="monospace" font-size="15.733279" fill="var(--border)" text-anchor="middle">???</text>

  <!-- Byte values -->
  <text x="79.344157" y="487.28819" font-family="monospace" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">0x48</text>
  <text x="161.967213" y="487.28819" font-family="monospace" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">0x69</text>
  <text x="244.590164" y="487.28819" font-family="monospace" font-size="12.384974" fill="var(--text-faint)" text-anchor="middle">0x21</text>
  <text x="327.21322" y="487.28819" font-family="monospace" font-size="12.384974" fill="var(--danger-accent)" text-anchor="middle">0x00</text>
  <text x="409.83617" y="487.28819" font-family="monospace" font-size="12.384974" fill="var(--border)" text-anchor="middle">uninit</text>

  <!-- Null terminator arrow label -->
  <line x1="327.21322" y1="492.203281" x2="327.21322" y2="521.694915" stroke="var(--danger-border)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="342.95082" y="513.8304" font-family="Arial, sans-serif" font-size="12.783429" fill="var(--danger-accent)">Null terminator -- marks end of string</text>

  <!-- Right panel: addressing modes summary -->
  <rect x="640" y="40" width="600" height="580" rx="6.400889" fill="var(--surface)"/>
  <rect x="659.672236" y="51.79661" width="560.655843" height="35.389939" rx="6.400889" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="940" y="75.389831" font-family="Arial, sans-serif" font-size="16.716669" font-weight="bold" fill="var(--bg)" text-anchor="middle">Addressing Modes Summary</text>

  <!-- Mode 1: immediate -->
  <rect x="659.672236" y="100.949153" width="560.655843" height="74.711864" rx="6.400889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.426334" y="124.542373" font-family="Arial, sans-serif" font-size="13.766499" font-weight="bold" fill="var(--primary-accent)">Direct (Immediate)</text>
  <text x="674.426334" y="146.169492" font-family="monospace" font-size="12.783429" fill="var(--text)">movl $42, %eax</text>
  <text x="674.426334" y="165.830508" font-family="Arial, sans-serif" font-size="12.384974" fill="var(--text-muted)">Literal value embedded in instruction</text>

  <!-- Mode 2: register indirect -->
  <rect x="659.672236" y="189.423729" width="560.655843" height="74.711864" rx="6.400889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.426334" y="213.017058" font-family="Arial, sans-serif" font-size="13.766499" font-weight="bold" fill="var(--ok-accent)">Register Indirect</text>
  <text x="674.426334" y="234.644068" font-family="monospace" font-size="12.783429" fill="var(--text)">movl (%ebx), %eax</text>
  <text x="674.426334" y="254.304976" font-family="Arial, sans-serif" font-size="12.384974" fill="var(--text-muted)">Read memory at address held in %ebx</text>

  <!-- Mode 3: base + displacement -->
  <rect x="659.672236" y="277.898197" width="560.655843" height="74.711864" rx="6.400889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.426334" y="301.491634" font-family="Arial, sans-serif" font-size="13.766499" font-weight="bold" fill="var(--warn-accent)">Base + Displacement</text>
  <text x="674.426334" y="323.118536" font-family="monospace" font-size="12.783429" fill="var(--text)">movl 8(%ebx), %eax</text>
  <text x="674.426334" y="342.779553" font-family="Arial, sans-serif" font-size="12.384974" fill="var(--text-muted)">Memory at %ebx + 8 (struct field access)</text>

  <!-- Mode 4: indexed -->
  <rect x="659.672236" y="366.372881" width="560.655843" height="94.372881" rx="6.400889" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.426334" y="389.966102" font-family="Arial, sans-serif" font-size="13.766499" font-weight="bold" fill="var(--info-accent)">Base + Index * Scale + Displacement</text>
  <text x="674.426334" y="411.59322" font-family="monospace" font-size="12.783429" fill="var(--text)">movl arr(,%ecx,4), %eax</text>
  <text x="674.426334" y="433.220231" font-family="Arial, sans-serif" font-size="12.384974" fill="var(--text-muted)">addr = arr + ecx * 4</text>
  <text x="674.426334" y="450.915254" font-family="Arial, sans-serif" font-size="12.384974" fill="var(--text-muted)">Scale: 1 (byte), 2 (word), 4 (dword), 8 (qword)</text>

  <!-- Loop pattern -->
  <rect x="659.672236" y="474.508475" width="560.655843" height="127.79661" rx="6.400889" fill="var(--code-bg)"/>
  <text x="674.426334" y="498.101586" font-family="Arial, sans-serif" font-size="13.766499" font-weight="bold" fill="var(--primary-accent)">Array traversal loop:</text>
  <text x="674.426334" y="519.728705" font-family="monospace" font-size="12.783429" fill="var(--primary-accent)">  xorl %ecx, %ecx         <tspan fill="var(--text-muted)">; index = 0</tspan></text>
  <text x="674.426334" y="539.389831" font-family="monospace" font-size="12.783429" fill="var(--info-accent)">loop:</text>
  <text x="674.426334" y="559.050847" font-family="monospace" font-size="12.783429" fill="var(--primary-accent)">  movl arr(,%ecx,4), %eax</text>
  <text x="674.426334" y="578.711864" font-family="monospace" font-size="12.783429" fill="var(--primary-accent)">  incl %ecx</text>
  <text x="674.426334" y="593.457681" font-family="monospace" font-size="12.783429" fill="var(--primary-accent)">  cmpl $5, %ecx  <tspan fill="var(--text-muted)">; 5 elements</tspan></text>
</svg>

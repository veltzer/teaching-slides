<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>

  <!-- Integer Array section -->
  <rect x="177.9133" y="160.0098" width="492.8083" height="32.6445" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="424.3174" y="180.7835" font-family="Arial, sans-serif" font-size="14.2915" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integer Array Memory Layout</text>

  <!-- Array declaration -->
  <rect x="177.9133" y="200.8154" width="492.8083" height="26.7092" rx="5.7089" fill="var(--code-bg)"/>
  <text x="190.6584" y="217.8795" font-family="monospace" font-size="11.1155" fill="var(--primary-accent)">int_array: .long 10, 20, 30, 40, 50</text>
  <text x="522.0294" y="217.8795" font-family="monospace" font-size="10.3217" fill="var(--text-muted)">; 5 x 4 bytes</text>

  <!-- Memory cells for int array -->
  <!-- Cell labels -->
  <text x="200.0047" y="245.3306" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">[0]</text>
  <text x="290.0696" y="245.3306" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">[1]</text>
  <text x="380.1346" y="245.3306" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">[2]</text>
  <text x="470.1995" y="245.3306" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">[3]</text>
  <text x="560.2645" y="245.3306" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">[4]</text>

  <!-- Int array memory boxes (4 bytes wide each) -->
  <rect x="177.9133" y="249.0401" width="90.065" height="37.096" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="222.9458" y="272.0397" font-family="monospace" font-size="14.2915" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">10</text>
  <rect x="267.9782" y="249.0401" width="90.065" height="37.096" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="313.0107" y="272.0397" font-family="monospace" font-size="14.2915" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">20</text>
  <rect x="358.0432" y="249.0401" width="90.065" height="37.096" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="403.0757" y="272.0397" font-family="monospace" font-size="14.2915" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">30</text>
  <rect x="448.1082" y="249.0401" width="90.065" height="37.096" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="493.1407" y="272.0397" font-family="monospace" font-size="14.2915" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">40</text>
  <rect x="538.173" y="249.0401" width="90.065" height="37.096" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="583.2055" y="272.0397" font-family="monospace" font-size="14.2915" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">50</text>

  <!-- Address annotations -->
  <text x="222.9458" y="298.7488" font-family="monospace" font-size="10" fill="var(--text-faint)" text-anchor="middle">+0</text>
  <text x="313.0107" y="298.7488" font-family="monospace" font-size="10" fill="var(--text-faint)" text-anchor="middle">+4</text>
  <text x="403.0757" y="298.7488" font-family="monospace" font-size="10" fill="var(--text-faint)" text-anchor="middle">+8</text>
  <text x="493.1407" y="298.7488" font-family="monospace" font-size="10" fill="var(--text-faint)" text-anchor="middle">+12</text>
  <text x="583.2055" y="298.7488" font-family="monospace" font-size="10" fill="var(--text-faint)" text-anchor="middle">+16</text>
  <text x="177.9133" y="298.7488" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">bytes:</text>

  <!-- Indexed addressing -->
  <rect x="177.9133" y="308.3938" width="492.8083" height="51.9344" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="190.6584" y="326.1998" font-family="Arial, sans-serif" font-size="11.1155" font-weight="bold" fill="var(--text-muted)">Indexed Addressing:</text>
  <text x="190.6584" y="343.264" font-family="monospace" font-size="11.1155" fill="var(--text)">movl int_array(,%ecx,4), %eax</text>
  <text x="483.7943" y="343.264" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text-muted)">; addr = int_array + ecx * 4</text>
  <text x="190.6584" y="355.8765" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">base(offset, index, scale) -- scale = element size in bytes</text>

  <!-- String / null-termination section -->
  <rect x="177.9133" y="375.1666" width="492.8083" height="32.6445" rx="5.7089" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="424.3174" y="395.9403" font-family="Arial, sans-serif" font-size="14.2915" font-weight="bold" fill="var(--bg)" text-anchor="middle">String Memory and Null Termination</text>

  <!-- String declaration -->
  <rect x="177.9133" y="415.2302" width="492.8083" height="26.7092" rx="5.7089" fill="var(--code-bg)"/>
  <text x="190.6584" y="432.2943" font-family="monospace" font-size="11.1155" fill="var(--primary-accent)">str: .asciz "Hi!"</text>
  <text x="339.3505" y="432.2943" font-family="monospace" font-size="10.3217" fill="var(--text-muted)">; null-terminated (same as .ascii "Hi!\0")</text>

  <!-- String memory cells: H i ! \0 -->
  <rect x="177.9133" y="449.3585" width="67.9735" height="37.096" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="211.9" y="472.3579" font-family="monospace" font-size="17.4673" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">H</text>
  <rect x="249.2855" y="449.3585" width="67.9735" height="37.096" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="283.2723" y="472.3579" font-family="monospace" font-size="17.4673" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">i</text>
  <rect x="320.6577" y="449.3585" width="67.9735" height="37.096" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="354.6445" y="472.3579" font-family="monospace" font-size="17.4673" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">!</text>
  <rect x="392.0301" y="449.3585" width="67.9735" height="37.096" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="426.0168" y="472.3579" font-family="monospace" font-size="12.7035" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">\0</text>
  <rect x="463.4022" y="449.3585" width="67.9735" height="37.096" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="497.389" y="472.3579" font-family="monospace" font-size="12.7035" fill="var(--border)" text-anchor="middle">???</text>

  <!-- Byte values -->
  <text x="211.9" y="497.5833" font-family="monospace" font-size="10" fill="var(--text-faint)" text-anchor="middle">0x48</text>
  <text x="283.2723" y="497.5833" font-family="monospace" font-size="10" fill="var(--text-faint)" text-anchor="middle">0x69</text>
  <text x="354.6445" y="497.5833" font-family="monospace" font-size="10" fill="var(--text-faint)" text-anchor="middle">0x21</text>
  <text x="426.0168" y="497.5833" font-family="monospace" font-size="10" fill="var(--danger-accent)" text-anchor="middle">0x00</text>
  <text x="497.389" y="497.5833" font-family="monospace" font-size="10" fill="var(--border)" text-anchor="middle">uninit</text>

  <!-- Null terminator arrow label -->
  <line x1="426.0168" y1="501.2928" x2="426.0168" y2="523.5504" stroke="var(--danger-border)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="439.6114" y="517.615" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--danger-accent)">Null terminator -- marks end of string</text>

  <!-- Right panel: addressing modes summary -->
  <rect x="696.2116" y="160.0098" width="518.2983" height="437.7326" rx="5.7089" fill="var(--surface)" filter="url(#shadow)"/>
  <rect x="713.205" y="168.9128" width="484.3116" height="26.7092" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="955.3607" y="186.7189" font-family="Arial, sans-serif" font-size="13.4975" font-weight="bold" fill="var(--bg)" text-anchor="middle">Addressing Modes Summary</text>

  <!-- Mode 1: immediate -->
  <rect x="713.205" y="206.0088" width="484.3116" height="56.3859" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="725.9501" y="223.8149" font-family="Arial, sans-serif" font-size="11.1155" font-weight="bold" fill="var(--primary-accent)">Direct (Immediate)</text>
  <text x="725.9501" y="240.1371" font-family="monospace" font-size="10.3217" fill="var(--text)">movl $42, %eax</text>
  <text x="725.9501" y="254.9755" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Literal value embedded in instruction</text>

  <!-- Mode 2: register indirect -->
  <rect x="713.205" y="272.7816" width="484.3116" height="56.3859" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="725.9501" y="290.5877" font-family="Arial, sans-serif" font-size="11.1155" font-weight="bold" fill="var(--ok-accent)">Register Indirect</text>
  <text x="725.9501" y="306.9099" font-family="monospace" font-size="10.3217" fill="var(--text)">movl (%ebx), %eax</text>
  <text x="725.9501" y="321.7482" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Read memory at address held in %ebx</text>

  <!-- Mode 3: base + displacement -->
  <rect x="713.205" y="339.5543" width="484.3116" height="56.3859" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="725.9501" y="357.3605" font-family="Arial, sans-serif" font-size="11.1155" font-weight="bold" fill="var(--warn-accent)">Base + Displacement</text>
  <text x="725.9501" y="373.6826" font-family="monospace" font-size="10.3217" fill="var(--text)">movl 8(%ebx), %eax</text>
  <text x="725.9501" y="388.521" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Memory at %ebx + 8 (struct field access)</text>

  <!-- Mode 4: indexed -->
  <rect x="713.205" y="406.3271" width="484.3116" height="71.2243" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="725.9501" y="424.1332" font-family="Arial, sans-serif" font-size="11.1155" font-weight="bold" fill="var(--info-accent)">Base + Index * Scale + Displacement</text>
  <text x="725.9501" y="440.4554" font-family="monospace" font-size="10.3217" fill="var(--text)">movl arr(,%ecx,4), %eax</text>
  <text x="725.9501" y="456.7776" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">addr = arr + ecx * 4</text>
  <text x="725.9501" y="470.1322" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Scale: 1 (byte), 2 (word), 4 (dword), 8 (qword)</text>

  <!-- Loop pattern -->
  <rect x="713.205" y="487.9383" width="484.3116" height="96.4496" rx="5.7089" fill="var(--code-bg)" filter="url(#shadow)"/>
  <text x="725.9501" y="505.7443" font-family="Arial, sans-serif" font-size="11.1155" font-weight="bold" fill="var(--primary-accent)">Array traversal loop:</text>
  <text x="725.9501" y="522.0665" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">  xorl %ecx, %ecx         <tspan fill="var(--text-muted)">; index = 0</tspan></text>
  <text x="725.9501" y="536.905" font-family="monospace" font-size="10.3217" fill="var(--info-accent)">loop:</text>
  <text x="725.9501" y="551.7434" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">  movl arr(,%ecx,4), %eax</text>
  <text x="725.9501" y="566.5818" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">  incl %ecx</text>
  <text x="725.9501" y="577.7106" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">  cmpl $5, %ecx  <tspan fill="var(--text-muted)">; 5 elements</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <line x1="644.958678" y1="40" x2="644.958678" y2="620" stroke="var(--border)" stroke-width="1.6" stroke-dasharray="7.1111 7.1111" />
  <text x="40" y="65.133402" font-size="23.498841" font-weight="bold" fill="var(--text)">Synchronous (Blocking):</text>
  <rect x="40" y="84.466723" width="277.68595" height="77.333285" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="178.842975" y="131.833366" font-size="21.540661" fill="var(--text)" text-anchor="middle">Start Task A</text>
  <line x1="178.842975" y1="161.800008" x2="178.842975" y2="179.20001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="184.99997" width="277.68595" height="77.333285" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="178.842975" y="232.366733" font-size="21.540661" fill="var(--text)" text-anchor="middle">Wait for A ⏳</text>
  <line x1="178.842975" y1="262.333375" x2="178.842975" y2="279.733377" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="285.533457" width="277.68595" height="77.333285" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="178.842975" y="332.89998" font-size="21.540661" fill="var(--text)" text-anchor="middle">Start Task B</text>
  <line x1="178.842975" y1="362.866742" x2="178.842975" y2="380.266743" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="386.066704" width="277.68595" height="77.333285" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="178.842975" y="433.433467" font-size="21.540661" fill="var(--text)" text-anchor="middle">Wait for B ⏳</text>
  <text x="40" y="513.666673" font-size="19.58248" fill="var(--danger-accent)" font-weight="bold">Total: Time A + Time B</text>
  <text x="674.710744" y="65.133402" font-size="23.498841" font-weight="bold" fill="var(--text)">Asynchronous (Non-blocking):</text>
  <rect x="674.710744" y="84.466723" width="277.68595" height="77.333285" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="813.553719" y="131.833366" font-size="21.540661" fill="var(--text)" text-anchor="middle">Start Task A</text>
  <line x1="813.553719" y1="161.800008" x2="813.553719" y2="179.20001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="674.710744" y="184.99997" width="277.68595" height="77.333285" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="813.553719" y="232.366733" font-size="21.540661" fill="var(--text)" text-anchor="middle">Start Task B</text>
  <line x1="813.553719" y1="262.333375" x2="813.553719" y2="279.733377" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="674.710744" y="285.533457" width="277.68595" height="77.333285" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="813.553719" y="332.89998" font-size="21.540661" fill="var(--text)" text-anchor="middle">React on complete</text>
  <text x="674.710744" y="436.333387" font-size="19.58248" fill="var(--ok-accent)" font-weight="bold">Total: Max(Time A, Time B)</text>
  <rect x="49.917355" y="562.000036" width="1190.082645" height="54.133324" rx="6.760117" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="644.958678" y="594.866718" text-anchor="middle" font-size="17.624187" fill="var(--primary-accent)">Async shines for I/O-bound tasks: network, disk, database - not CPU-bound work</text>
</svg>
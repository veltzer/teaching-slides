  <ns0:text x="26.6667" y="453.3333" font-size="17.7778" fill="#c62828" font-weight="bold">Total: Time A + Time B</ns0:text>
  <ns0:text x="595.5556" y="40.8889" font-size="21.3333" font-weight="bold" fill="#333333">Asynchronous (Non-blocking):</ns0:text>

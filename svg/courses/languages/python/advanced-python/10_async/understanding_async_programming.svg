<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="644.958678" y1="40" x2="644.958678" y2="620" stroke="var(--border)" stroke-width="1.6" stroke-dasharray="7.1111 7.1111"/>
  <text x="40" y="65.133402" font-size="23.498841" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Synchronous (Blocking):</text>
  <rect x="40" y="84.466723" width="277.68595" height="77.333285" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="178.842975" y="131.833366" font-size="21.540661" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Start Task A</text>
  <line x1="178.842975" y1="161.800008" x2="178.842975" y2="179.20001" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="184.99997" width="277.68595" height="77.333285" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="178.842975" y="232.366733" font-size="21.540661" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Wait for A ⏳</text>
  <line x1="178.842975" y1="262.333375" x2="178.842975" y2="279.733377" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="285.533457" width="277.68595" height="77.333285" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="178.842975" y="332.89998" font-size="21.540661" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Start Task B</text>
  <line x1="178.842975" y1="362.866742" x2="178.842975" y2="380.266743" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="386.066704" width="277.68595" height="77.333285" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="178.842975" y="433.433467" font-size="21.540661" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Wait for B ⏳</text>
  <text x="40" y="513.666673" font-size="19.58248" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Total: Time A + Time B</text>
  <text x="674.710744" y="65.133402" font-size="23.498841" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Asynchronous (Non-blocking):</text>
  <rect x="674.710744" y="84.466723" width="277.68595" height="77.333285" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="813.553719" y="131.833366" font-size="21.540661" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Start Task A</text>
  <line x1="813.553719" y1="161.800008" x2="813.553719" y2="179.20001" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="674.710744" y="184.99997" width="277.68595" height="77.333285" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="813.553719" y="232.366733" font-size="21.540661" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Start Task B</text>
  <line x1="813.553719" y1="262.333375" x2="813.553719" y2="279.733377" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="674.710744" y="285.533457" width="277.68595" height="77.333285" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.760117" filter="url(#shadow)"/>
  <text x="813.553719" y="332.89998" font-size="21.540661" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">React on complete</text>
  <text x="674.710744" y="436.333387" font-size="19.58248" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Total: Max(Time A, Time B)</text>
  <rect x="49.917355" y="562.000036" width="1190.082645" height="54.133324" rx="6.760117" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="644.958678" y="594.866718" text-anchor="middle" font-size="17.624187" fill="var(--primary-accent)" font-family="Arial, sans-serif">Async shines for I/O-bound tasks: network, disk, database - not CPU-bound work</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="68.125" y="77.0556" font-size="20.8566" font-weight="bold" fill="var(--text)">Common Log Collection Architectures</text>
  <text x="68.125" y="117.3333" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">1. Direct File Collection</text>
  <rect x="68.125" y="127" width="159.375" height="48.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="147.8125" y="156" font-size="15.6425" fill="var(--text)" text-anchor="middle">Application</text>
  <line x1="227.5" y1="151.1667" x2="253.75" y2="151.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="257.5" y="127" width="140.625" height="48.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="327.8125" y="156" font-size="15.6425" fill="var(--text)" text-anchor="middle">Log Files</text>
  <line x1="398.125" y1="151.1667" x2="424.3749" y2="151.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="428.125" y="127" width="178.125" height="48.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="517.1874" y="156" font-size="15.6425" fill="var(--text)" text-anchor="middle">Log Collector</text>
  <line x1="606.25" y1="151.1667" x2="632.5" y2="151.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="636.25" y="127" width="159.375" height="48.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="715.9375" y="156" font-size="15.6425" fill="var(--text)" text-anchor="middle">Log Storage</text>
  <text x="68.125" y="223.6667" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">2. Syslog Collection</text>
  <rect x="68.125" y="233.3333" width="159.375" height="48.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="147.8125" y="262.3333" font-size="15.6425" fill="var(--text)" text-anchor="middle">Application</text>
  <line x1="227.5" y1="257.5" x2="253.75" y2="257.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="257.5" y="233.3333" width="121.875" height="48.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="318.4375" y="262.3333" font-size="15.6425" fill="var(--text)" text-anchor="middle">Syslog</text>
  <line x1="379.375" y1="257.5" x2="405.625" y2="257.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="409.375" y="233.3333" width="178.125" height="48.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="498.4375" y="262.3333" font-size="15.6425" fill="var(--text)" text-anchor="middle">Syslog Server</text>
  <line x1="587.5" y1="257.5" x2="613.75" y2="257.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="617.5" y="233.3333" width="159.375" height="48.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="697.1875" y="262.3333" font-size="15.6425" fill="var(--text)" text-anchor="middle">Log Storage</text>
  <text x="68.125" y="330" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">3. Agent-Based Collection</text>
  <rect x="68.125" y="339.6667" width="159.375" height="48.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="147.8125" y="368.6667" font-size="15.6425" fill="var(--text)" text-anchor="middle">Application</text>
  <line x1="227.5" y1="363.8333" x2="253.75" y2="363.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="257.5" y="339.6667" width="140.625" height="48.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="327.8125" y="368.6667" font-size="15.6425" fill="var(--text)" text-anchor="middle">Log Files</text>
  <line x1="398.125" y1="363.8333" x2="424.3749" y2="363.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="428.125" y="339.6667" width="196.875" height="48.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="526.5625" y="368.6667" font-size="15.6425" fill="var(--text)" text-anchor="middle">Collection Agent</text>
  <line x1="625" y1="363.8333" x2="651.25" y2="363.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="655" y="339.6667" width="159.375" height="48.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="734.6875" y="368.6667" font-size="15.6425" fill="var(--text)" text-anchor="middle">Log Storage</text>
  <text x="68.125" y="436.3333" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">4. Direct API Integration</text>
  <rect x="68.125" y="446" width="159.375" height="48.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="147.8125" y="475" font-size="15.6425" fill="var(--text)" text-anchor="middle">Application</text>
  <line x1="227.5" y1="470.1667" x2="253.75" y2="470.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="257.5" y="446" width="121.875" height="48.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="318.4375" y="475" font-size="15.6425" fill="var(--text)" text-anchor="middle">Log API</text>
  <line x1="379.375" y1="470.1667" x2="405.625" y2="470.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="409.375" y="446" width="159.375" height="48.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="489.0625" y="475" font-size="15.6425" fill="var(--text)" text-anchor="middle">Log Storage</text>
  <rect x="68.125" y="529.7777" width="1125" height="38.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="553.9444" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)">Each architecture suits different scale, reliability, and operational needs</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="26.6667" y="40.8889" font-size="21.3333" font-weight="bold" fill="var(--text)">Common Log Collection Architectures</text>
  <text x="26.6667" y="85.3333" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">1. Direct File Collection</text>
  <rect x="26.6667" y="96" width="151.1111" height="53.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="102.2222" y="128" font-size="16" fill="var(--text)" text-anchor="middle">Application</text>
  <line x1="177.7778" y1="122.6667" x2="202.6667" y2="122.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="206.2222" y="96" width="133.3333" height="53.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="272.8889" y="128" font-size="16" fill="var(--text)" text-anchor="middle">Log Files</text>
  <line x1="339.5556" y1="122.6667" x2="364.4444" y2="122.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="368" y="96" width="168.8889" height="53.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="452.4444" y="128" font-size="16" fill="var(--text)" text-anchor="middle">Log Collector</text>
  <line x1="536.8889" y1="122.6667" x2="561.7778" y2="122.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="565.3333" y="96" width="151.1111" height="53.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="640.8889" y="128" font-size="16" fill="var(--text)" text-anchor="middle">Log Storage</text>
  <text x="26.6667" y="202.6667" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">2. Syslog Collection</text>
  <rect x="26.6667" y="213.3333" width="151.1111" height="53.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="102.2222" y="245.3333" font-size="16" fill="var(--text)" text-anchor="middle">Application</text>
  <line x1="177.7778" y1="240" x2="202.6667" y2="240" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="206.2222" y="213.3333" width="115.5556" height="53.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="264" y="245.3333" font-size="16" fill="var(--text)" text-anchor="middle">Syslog</text>
  <line x1="321.7778" y1="240" x2="346.6667" y2="240" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="350.2222" y="213.3333" width="168.8889" height="53.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="434.6667" y="245.3333" font-size="16" fill="var(--text)" text-anchor="middle">Syslog Server</text>
  <line x1="519.1111" y1="240" x2="544" y2="240" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="547.5556" y="213.3333" width="151.1111" height="53.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="623.1111" y="245.3333" font-size="16" fill="var(--text)" text-anchor="middle">Log Storage</text>
  <text x="26.6667" y="320" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">3. Agent-Based Collection</text>
  <rect x="26.6667" y="330.6667" width="151.1111" height="53.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="102.2222" y="362.6667" font-size="16" fill="var(--text)" text-anchor="middle">Application</text>
  <line x1="177.7778" y1="357.3333" x2="202.6667" y2="357.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="206.2222" y="330.6667" width="133.3333" height="53.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="272.8889" y="362.6667" font-size="16" fill="var(--text)" text-anchor="middle">Log Files</text>
  <line x1="339.5556" y1="357.3333" x2="364.4444" y2="357.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="368" y="330.6667" width="186.6667" height="53.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="461.3333" y="362.6667" font-size="16" fill="var(--text)" text-anchor="middle">Collection Agent</text>
  <line x1="554.6667" y1="357.3333" x2="579.5556" y2="357.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="583.1111" y="330.6667" width="151.1111" height="53.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="658.6667" y="362.6667" font-size="16" fill="var(--text)" text-anchor="middle">Log Storage</text>
  <text x="26.6667" y="437.3333" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">4. Direct API Integration</text>
  <rect x="26.6667" y="448" width="151.1111" height="53.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="102.2222" y="480" font-size="16" fill="var(--text)" text-anchor="middle">Application</text>
  <line x1="177.7778" y1="474.6667" x2="202.6667" y2="474.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="206.2222" y="448" width="115.5556" height="53.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="264" y="480" font-size="16" fill="var(--text)" text-anchor="middle">Log API</text>
  <line x1="321.7778" y1="474.6667" x2="346.6667" y2="474.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="350.2222" y="448" width="151.1111" height="53.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="425.7778" y="480" font-size="16" fill="var(--text)" text-anchor="middle">Log Storage</text>
  <rect x="26.6667" y="540.4444" width="1066.6667" height="42.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="567.1111" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)">Each architecture suits different scale, reliability, and operational needs</text>
</svg>
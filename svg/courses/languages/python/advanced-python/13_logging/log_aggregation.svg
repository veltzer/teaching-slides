<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="40" y="40" font-size="23.402338" font-weight="bold" fill="var(--text)">Common Log Collection Architectures</text>
  <text x="40" y="87.5409" font-size="19.50206" font-weight="bold" fill="var(--primary-accent)">1. Direct File Collection</text>
  <rect x="40" y="98.950778" width="170" height="57.049151" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="125" y="133.180292" font-size="17.551809" fill="var(--text)" text-anchor="middle">Application</text>
  <line x1="210" y1="127.475413" x2="238" y2="127.475413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="242" y="98.950778" width="150" height="57.049151" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="317" y="133.180292" font-size="17.551809" fill="var(--text)" text-anchor="middle">Log Files</text>
  <line x1="392" y1="127.475413" x2="419.999893" y2="127.475413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="424" y="98.950778" width="190" height="57.049151" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="518.999893" y="133.180292" font-size="17.551809" fill="var(--text)" text-anchor="middle">Log Collector</text>
  <line x1="614" y1="127.475413" x2="642" y2="127.475413" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="646" y="98.950778" width="170" height="57.049151" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="731" y="133.180292" font-size="17.551809" fill="var(--text)" text-anchor="middle">Log Storage</text>
  <text x="40" y="213.049199" font-size="19.50206" font-weight="bold" fill="var(--primary-accent)">2. Syslog Collection</text>
  <rect x="40" y="224.458958" width="170" height="57.049151" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="125" y="258.688472" font-size="17.551809" fill="var(--text)" text-anchor="middle">Application</text>
  <line x1="210" y1="252.983593" x2="238" y2="252.983593" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="242" y="224.458958" width="130" height="57.049151" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="307" y="258.688472" font-size="17.551809" fill="var(--text)" text-anchor="middle">Syslog</text>
  <line x1="372" y1="252.983593" x2="400" y2="252.983593" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="404" y="224.458958" width="190" height="57.049151" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="499" y="258.688472" font-size="17.551809" fill="var(--text)" text-anchor="middle">Syslog Server</text>
  <line x1="594" y1="252.983593" x2="622" y2="252.983593" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="626" y="224.458958" width="170" height="57.049151" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="711" y="258.688472" font-size="17.551809" fill="var(--text)" text-anchor="middle">Log Storage</text>
  <text x="40" y="338.557379" font-size="19.50206" font-weight="bold" fill="var(--primary-accent)">3. Agent-Based Collection</text>
  <rect x="40" y="349.967256" width="170" height="57.049151" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="125" y="384.19677" font-size="17.551809" fill="var(--text)" text-anchor="middle">Application</text>
  <line x1="210" y1="378.491773" x2="238" y2="378.491773" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="242" y="349.967256" width="150" height="57.049151" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="317" y="384.19677" font-size="17.551809" fill="var(--text)" text-anchor="middle">Log Files</text>
  <line x1="392" y1="378.491773" x2="419.999893" y2="378.491773" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="424" y="349.967256" width="210" height="57.049151" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="529" y="384.19677" font-size="17.551809" fill="var(--text)" text-anchor="middle">Collection Agent</text>
  <line x1="634" y1="378.491773" x2="662" y2="378.491773" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="666" y="349.967256" width="170" height="57.049151" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="751" y="384.19677" font-size="17.551809" fill="var(--text)" text-anchor="middle">Log Storage</text>
  <text x="40" y="464.065559" font-size="19.50206" font-weight="bold" fill="var(--primary-accent)">4. Direct API Integration</text>
  <rect x="40" y="475.475436" width="170" height="57.049151" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="125" y="509.704951" font-size="17.551809" fill="var(--text)" text-anchor="middle">Application</text>
  <line x1="210" y1="504.000071" x2="238" y2="504.000071" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="242" y="475.475436" width="130" height="57.049151" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="307" y="509.704951" font-size="17.551809" fill="var(--text)" text-anchor="middle">Log API</text>
  <line x1="372" y1="504.000071" x2="400" y2="504.000071" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="404" y="475.475436" width="170" height="57.049151" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.732355" filter="url(#shadow)"/>
  <text x="489" y="509.704951" font-size="17.551809" fill="var(--text)" text-anchor="middle">Log Storage</text>
  <rect x="40" y="574.360608" width="1200" height="45.639392" rx="6.732355" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="650" y="602.885243" text-anchor="middle" font-size="15.601559" fill="var(--primary-accent)">Each architecture suits different scale, reliability, and operational needs</text>
</svg>
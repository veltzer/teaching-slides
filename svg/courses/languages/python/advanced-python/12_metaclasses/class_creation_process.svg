<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Title bar -->
  <rect x="40" y="40" width="1200" height="48.488746" fill="url(#grad-primary)" rx="6.086198" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="71.70418" font-size="20.569623" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Python Class Creation Pipeline</text>

  <!-- Section labels -->
  <text x="396.25" y="109.003215" font-size="14.024729" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Class Creation</text>
  <text x="940" y="109.003215" font-size="14.024729" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">Instance Creation</text>

  <!-- Vertical divider -->
  <line x1="677.5" y1="95.948553" x2="677.5" y2="618.135048" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ===== CLASS CREATION PIPELINE (left) ===== -->

  <!-- Step 1 -->
  <rect x="96.25" y="122.057878" width="281.25" height="44.758842" rx="6.086198" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.875" y="140.707395" font-size="13.089788" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">class Foo(Base):</text>
  <text x="236.875" y="157.491961" font-size="11.219804" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">class statement seen</text>

  <line x1="236.875" y1="166.81672" x2="236.875" y2="191.061093" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="96.25" y="191.061093" width="281.25" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="236.875" y="210.643138" font-size="12.154847" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Find metaclass</text>
  <text x="236.875" y="226.495177" font-size="10.284862" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">type or custom Meta</text>

  <!-- type label -->
  <rect x="405.625" y="198.5209" width="159.375" height="29.839228" rx="6.086198" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.3125" y="213.440514" font-size="11.219804" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">default: type</text>
  <text x="485.3125" y="225.562752" font-size="10.143663" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">class Foo(metaclass=Meta)</text>
  <line x1="405.625" y1="213.440514" x2="377.5" y2="213.440514" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow-warn)"/>

  <line x1="236.875" y1="235.819936" x2="236.875" y2="260.064309" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="96.25" y="260.064309" width="281.25" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="236.875" y="279.646251" font-size="12.154847" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">metaclass.__prepare__(name, bases)</text>
  <text x="236.875" y="295.498392" font-size="10.284862" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">returns namespace dict</text>

  <line x1="236.875" y1="304.823151" x2="236.875" y2="329.067524" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="96.25" y="329.067524" width="281.25" height="44.758842" rx="6.086198" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.875" y="348.649569" font-size="12.154847" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">exec(class body)</text>
  <text x="236.875" y="364.501608" font-size="10.284862" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">populates namespace</text>

  <line x1="236.875" y1="373.826367" x2="236.875" y2="398.07074" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="96.25" y="398.07074" width="281.25" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="236.875" y="417.652682" font-size="12.154847" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">metaclass.__new__(mcs, name,</text>
  <text x="236.875" y="433.504823" font-size="12.154847" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">  bases, namespace)</text>

  <line x1="236.875" y1="442.829582" x2="236.875" y2="467.073955" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="96.25" y="467.073955" width="281.25" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="236.875" y="486.656" font-size="12.154847" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">metaclass.__init__(cls, name,</text>
  <text x="236.875" y="502.508039" font-size="12.154847" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">  bases, namespace)</text>

  <line x1="236.875" y1="511.832797" x2="236.875" y2="536.07717" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Result: class object -->
  <rect x="115" y="536.07717" width="243.75" height="41.028939" rx="6.086198" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.875" y="555.659113" font-size="13.089788" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">class object Foo created</text>
  <text x="236.875" y="569.646302" font-size="10.284862" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">bound to "Foo"</text>

  <!-- ===== INSTANCE CREATION PIPELINE (right) ===== -->

  <!-- Step A -->
  <rect x="715" y="122.057878" width="262.5" height="44.758842" rx="6.086198" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="846.25" y="140.707395" font-size="14.024729" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">Foo(arg1, arg2)</text>
  <text x="846.25" y="157.491961" font-size="11.219804" fill="var(--surface)" text-anchor="middle" font-family="Arial, sans-serif">call the class</text>

  <line x1="846.25" y1="166.81672" x2="846.25" y2="191.061093" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step B -->
  <rect x="715" y="191.061093" width="262.5" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="846.25" y="210.643138" font-size="12.154847" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">type.__call__(cls, *args)</text>
  <text x="846.25" y="226.495177" font-size="10.284862" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">orchestrates creation</text>

  <line x1="846.25" y1="235.819936" x2="846.25" y2="260.064309" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step C -->
  <rect x="715" y="260.064309" width="262.5" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="846.25" y="279.646251" font-size="12.154847" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">Foo.__new__(cls, *args)</text>
  <text x="846.25" y="295.498392" font-size="10.284862" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">allocates raw instance</text>

  <line x1="846.25" y1="304.823151" x2="846.25" y2="329.067524" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step D -->
  <rect x="715" y="329.067524" width="262.5" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="846.25" y="348.649569" font-size="12.154847" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">Foo.__init__(self, *args)</text>
  <text x="846.25" y="364.501608" font-size="10.284862" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">init attributes</text>

  <line x1="846.25" y1="373.826367" x2="846.25" y2="398.07074" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Result: instance -->
  <rect x="733.75" y="398.07074" width="225" height="41.028939" rx="6.086198" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="846.25" y="417.652682" font-size="13.089788" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">instance returned</text>
  <text x="846.25" y="431.639871" font-size="10.284862" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">type(instance) == Foo</text>

  <!-- Type hierarchy diagram -->
  <rect x="715" y="457.749196" width="468.75" height="143.601286" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="949.375" y="476.398714" font-size="12.154847" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Type Hierarchy</text>
  <!-- boxes -->
  <rect x="818.125" y="485.723473" width="131.25" height="31.70418" rx="6.086198" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.75" y="505.305518" font-size="11.219804" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">type</text>
  <rect x="724.375" y="534.212219" width="131.25" height="31.70418" rx="6.086198" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="553.794264" font-size="11.219804" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">Foo (class)</text>
  <rect x="911.875" y="534.212219" width="131.25" height="31.70418" rx="6.086198" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="977.5" y="553.794264" font-size="11.219804" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">instance</text>
  <!-- connecting lines -->
  <line x1="855.625" y1="517.427653" x2="790" y2="534.212219" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="911.875" y1="517.427653" x2="977.5" y2="534.212219" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="780.625" y="529.549788" font-size="10.143663" fill="var(--text-muted)" font-family="Arial, sans-serif">type(Foo)</text>
  <text x="916.5625" y="529.549788" font-size="10.143663" fill="var(--text-muted)" font-family="Arial, sans-serif">type(inst)</text>
  <text x="729.0625" y="580.836013" font-size="10.143663" fill="var(--text-muted)" font-family="Courier New, monospace">= type</text>
  <text x="916.5625" y="580.836013" font-size="10.143663" fill="var(--text-muted)" font-family="Courier New, monospace">= Foo</text>
  <text x="743.125" y="595.755627" font-size="10.143663" fill="var(--text-muted)" font-family="Arial, sans-serif">type(type) = type</text>

  <!-- Bottom info -->
  <rect x="96.25" y="592.025723" width="543.75" height="27.974277" rx="6.086198" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="368.125" y="610.675241" font-size="11.219804" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">class MyMeta(type): ...   class Foo(Base, metaclass=MyMeta): ...</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
  </defs>
  <!-- Title bar -->
  <rect x="40" y="40" width="1200" height="48.488746" fill="var(--primary-fill)" rx="6.086198" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="71.70418" font-family="sans-serif" font-size="20.569623" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Class Creation Pipeline</text>

  <!-- Section labels -->
  <text x="396.25" y="109.003215" font-family="sans-serif" font-size="14.024729" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Class Creation (metaclass.__new__ / __call__)</text>
  <text x="940" y="109.003215" font-family="sans-serif" font-size="14.024729" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Instance Creation (Foo())</text>

  <!-- Vertical divider -->
  <line x1="677.5" y1="95.948553" x2="677.5" y2="618.135048" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ===== CLASS CREATION PIPELINE (left) ===== -->

  <!-- Step 1 -->
  <rect x="96.25" y="122.057878" width="281.25" height="44.758842" rx="6.086198" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="236.875" y="140.707395" font-family="monospace" font-size="13.089788" font-weight="bold" fill="var(--bg)" text-anchor="middle">class Foo(Base):</text>
  <text x="236.875" y="157.491961" font-family="sans-serif" font-size="11.219804" fill="var(--primary-accent)" text-anchor="middle">Python sees a class statement</text>

  <line x1="236.875" y1="166.81672" x2="236.875" y2="191.061093" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="96.25" y="191.061093" width="281.25" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="236.875" y="210.643138" font-family="sans-serif" font-size="12.154847" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Find metaclass</text>
  <text x="236.875" y="226.495177" font-family="monospace" font-size="10.284862" fill="var(--text-muted)" text-anchor="middle">type (default) or custom Meta</text>

  <!-- type label -->
  <rect x="405.625" y="198.5209" width="159.375" height="29.839228" rx="6.086198" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="485.3125" y="213.440514" font-family="monospace" font-size="11.219804" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">default: type</text>
  <text x="485.3125" y="225.562752" font-family="sans-serif" font-size="10.143663" fill="var(--text-faint)" text-anchor="middle">class Foo(metaclass=Meta)</text>
  <line x1="405.625" y1="213.440514" x2="377.5" y2="213.440514" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow-warn)"/>

  <line x1="236.875" y1="235.819936" x2="236.875" y2="260.064309" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="96.25" y="260.064309" width="281.25" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="236.875" y="279.646251" font-family="monospace" font-size="12.154847" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">metaclass.__prepare__(name, bases)</text>
  <text x="236.875" y="295.498392" font-family="sans-serif" font-size="10.284862" fill="var(--text-muted)" text-anchor="middle">returns namespace dict for class body</text>

  <line x1="236.875" y1="304.823151" x2="236.875" y2="329.067524" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="96.25" y="329.067524" width="281.25" height="44.758842" rx="6.086198" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="236.875" y="348.649569" font-family="monospace" font-size="12.154847" fill="var(--primary-accent)" text-anchor="middle">exec(class body)</text>
  <text x="236.875" y="364.501608" font-family="sans-serif" font-size="10.284862" fill="var(--text-muted)" text-anchor="middle">populates namespace dict with attrs/methods</text>

  <line x1="236.875" y1="373.826367" x2="236.875" y2="398.07074" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="96.25" y="398.07074" width="281.25" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="236.875" y="417.652682" font-family="monospace" font-size="12.154847" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">metaclass.__new__(mcs, name,</text>
  <text x="236.875" y="433.504823" font-family="monospace" font-size="12.154847" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">  bases, namespace)</text>

  <line x1="236.875" y1="442.829582" x2="236.875" y2="467.073955" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="96.25" y="467.073955" width="281.25" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="236.875" y="486.656" font-family="monospace" font-size="12.154847" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">metaclass.__init__(cls, name,</text>
  <text x="236.875" y="502.508039" font-family="monospace" font-size="12.154847" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">  bases, namespace)</text>

  <line x1="236.875" y1="511.832797" x2="236.875" y2="536.07717" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Result: class object -->
  <rect x="115" y="536.07717" width="243.75" height="41.028939" rx="6.086198" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="236.875" y="555.659113" font-family="sans-serif" font-size="13.089788" font-weight="bold" fill="var(--bg)" text-anchor="middle">class object Foo created</text>
  <text x="236.875" y="569.646302" font-family="sans-serif" font-size="10.284862" fill="var(--ok-accent)" text-anchor="middle">bound to name "Foo" in namespace</text>

  <!-- ===== INSTANCE CREATION PIPELINE (right) ===== -->

  <!-- Step A -->
  <rect x="715" y="122.057878" width="262.5" height="44.758842" rx="6.086198" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="846.25" y="140.707395" font-family="monospace" font-size="14.024729" font-weight="bold" fill="var(--bg)" text-anchor="middle">Foo(arg1, arg2)</text>
  <text x="846.25" y="157.491961" font-family="sans-serif" font-size="11.219804" fill="var(--surface)" text-anchor="middle">calling the class object</text>

  <line x1="846.25" y1="166.81672" x2="846.25" y2="191.061093" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step B -->
  <rect x="715" y="191.061093" width="262.5" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="846.25" y="210.643138" font-family="monospace" font-size="12.154847" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">type.__call__(cls, *args)</text>
  <text x="846.25" y="226.495177" font-family="sans-serif" font-size="10.284862" fill="var(--text-muted)" text-anchor="middle">metaclass __call__ orchestrates creation</text>

  <line x1="846.25" y1="235.819936" x2="846.25" y2="260.064309" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step C -->
  <rect x="715" y="260.064309" width="262.5" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="846.25" y="279.646251" font-family="monospace" font-size="12.154847" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Foo.__new__(cls, *args)</text>
  <text x="846.25" y="295.498392" font-family="sans-serif" font-size="10.284862" fill="var(--text-muted)" text-anchor="middle">allocates memory, creates raw instance</text>

  <line x1="846.25" y1="304.823151" x2="846.25" y2="329.067524" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step D -->
  <rect x="715" y="329.067524" width="262.5" height="44.758842" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="846.25" y="348.649569" font-family="monospace" font-size="12.154847" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Foo.__init__(self, *args)</text>
  <text x="846.25" y="364.501608" font-family="sans-serif" font-size="10.284862" fill="var(--text-muted)" text-anchor="middle">initializes instance attributes</text>

  <line x1="846.25" y1="373.826367" x2="846.25" y2="398.07074" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Result: instance -->
  <rect x="733.75" y="398.07074" width="225" height="41.028939" rx="6.086198" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="846.25" y="417.652682" font-family="sans-serif" font-size="13.089788" font-weight="bold" fill="var(--bg)" text-anchor="middle">instance returned</text>
  <text x="846.25" y="431.639871" font-family="sans-serif" font-size="10.284862" fill="var(--ok-accent)" text-anchor="middle">type(instance) == Foo</text>

  <!-- Type hierarchy diagram -->
  <rect x="715" y="457.749196" width="468.75" height="143.601286" rx="6.086198" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="949.375" y="476.398714" font-family="sans-serif" font-size="12.154847" font-weight="bold" fill="var(--text)" text-anchor="middle">Type Hierarchy</text>
  <!-- boxes -->
  <rect x="818.125" y="485.723473" width="131.25" height="31.70418" rx="6.086198" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="883.75" y="505.305518" font-family="monospace" font-size="11.219804" fill="var(--primary-accent)" text-anchor="middle">type</text>
  <rect x="724.375" y="534.212219" width="131.25" height="31.70418" rx="6.086198" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="790" y="553.794264" font-family="monospace" font-size="11.219804" fill="var(--ok-accent)" text-anchor="middle">Foo (class)</text>
  <rect x="911.875" y="534.212219" width="131.25" height="31.70418" rx="6.086198" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="977.5" y="553.794264" font-family="monospace" font-size="11.219804" fill="var(--warn-accent)" text-anchor="middle">instance</text>
  <!-- connecting lines -->
  <line x1="855.625" y1="517.427653" x2="790" y2="534.212219" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="911.875" y1="517.427653" x2="977.5" y2="534.212219" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="780.625" y="529.549788" font-family="sans-serif" font-size="10.143663" fill="var(--text-muted)">type(Foo)</text>
  <text x="916.5625" y="529.549788" font-family="sans-serif" font-size="10.143663" fill="var(--text-muted)">type(inst)</text>
  <text x="729.0625" y="580.836013" font-family="monospace" font-size="10.143663" fill="var(--text-muted)">= type</text>
  <text x="916.5625" y="580.836013" font-family="monospace" font-size="10.143663" fill="var(--text-muted)">= Foo</text>
  <text x="743.125" y="595.755627" font-family="sans-serif" font-size="10.143663" fill="var(--text-muted)">type(type) = type</text>

  <!-- Bottom info -->
  <rect x="96.25" y="592.025723" width="543.75" height="27.974277" rx="6.086198" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="368.125" y="610.675241" font-family="monospace" font-size="11.219804" fill="var(--ok-accent)" text-anchor="middle">class MyMeta(type): ...   class Foo(Base, metaclass=MyMeta): ...</text>
</svg>

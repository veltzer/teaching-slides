<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="52" fill="url(#grad-primary)"/>
  <text x="640" y="34" font-family="sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Class Creation Pipeline</text>

  <!-- Section labels -->
  <text x="380" y="74" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Class Creation (metaclass.__new__ / __call__)</text>
  <text x="960" y="74" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Instance Creation (Foo())</text>

  <!-- Vertical divider -->
  <line x1="680" y1="60" x2="680" y2="620" stroke="var(--border-softer)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ===== CLASS CREATION PIPELINE (left) ===== -->

  <!-- Step 1 -->
  <rect x="60" y="88" width="300" height="48" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="210" y="108" font-family="monospace" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">class Foo(Base):</text>
  <text x="210" y="126" font-family="sans-serif" font-size="12" fill="var(--primary-lt)" text-anchor="middle">Python sees a class statement</text>

  <line x1="210" y1="136" x2="210" y2="162" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="60" y="162" width="300" height="48" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="183" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Find metaclass</text>
  <text x="210" y="200" font-family="monospace" font-size="11" fill="var(--text-muted)" text-anchor="middle">type (default) or custom Meta</text>

  <!-- type label -->
  <rect x="390" y="170" width="170" height="32" rx="6" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="1.5"/>
  <text x="475" y="186" font-family="monospace" font-size="12" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">default: type</text>
  <text x="475" y="199" font-family="sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">class Foo(metaclass=Meta)</text>
  <line x1="390" y1="186" x2="360" y2="186" stroke="var(--warn-mid)" stroke-width="1.5" marker-end="url(#arrow-warn)"/>

  <line x1="210" y1="210" x2="210" y2="236" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="60" y="236" width="300" height="48" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="257" font-family="monospace" font-size="13" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">metaclass.__prepare__(name, bases)</text>
  <text x="210" y="274" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">returns namespace dict for class body</text>

  <line x1="210" y1="284" x2="210" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="60" y="310" width="300" height="48" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="210" y="331" font-family="monospace" font-size="13" fill="var(--primary-dk)" text-anchor="middle">exec(class body)</text>
  <text x="210" y="348" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">populates namespace dict with attrs/methods</text>

  <line x1="210" y1="358" x2="210" y2="384" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="60" y="384" width="300" height="48" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="405" font-family="monospace" font-size="13" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">metaclass.__new__(mcs, name,</text>
  <text x="210" y="422" font-family="monospace" font-size="13" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">  bases, namespace)</text>

  <line x1="210" y1="432" x2="210" y2="458" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="60" y="458" width="300" height="48" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="479" font-family="monospace" font-size="13" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">metaclass.__init__(cls, name,</text>
  <text x="210" y="496" font-family="monospace" font-size="13" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">  bases, namespace)</text>

  <line x1="210" y1="506" x2="210" y2="532" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Result: class object -->
  <rect x="80" y="532" width="260" height="44" rx="22" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="210" y="553" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">class object Foo created</text>
  <text x="210" y="568" font-family="sans-serif" font-size="11" fill="var(--ok-lt)" text-anchor="middle">bound to name "Foo" in namespace</text>

  <!-- ===== INSTANCE CREATION PIPELINE (right) ===== -->

  <!-- Step A -->
  <rect x="720" y="88" width="280" height="48" rx="8" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="860" y="108" font-family="monospace" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Foo(arg1, arg2)</text>
  <text x="860" y="126" font-family="sans-serif" font-size="12" fill="var(--surface-light)" text-anchor="middle">calling the class object</text>

  <line x1="860" y1="136" x2="860" y2="162" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step B -->
  <rect x="720" y="162" width="280" height="48" rx="8" fill="url(#grad-surface)" stroke="var(--warn-mid)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="183" font-family="monospace" font-size="13" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">type.__call__(cls, *args)</text>
  <text x="860" y="200" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">metaclass __call__ orchestrates creation</text>

  <line x1="860" y1="210" x2="860" y2="236" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step C -->
  <rect x="720" y="236" width="280" height="48" rx="8" fill="url(#grad-surface)" stroke="var(--warn-mid)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="257" font-family="monospace" font-size="13" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Foo.__new__(cls, *args)</text>
  <text x="860" y="274" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">allocates memory, creates raw instance</text>

  <line x1="860" y1="284" x2="860" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step D -->
  <rect x="720" y="310" width="280" height="48" rx="8" fill="url(#grad-surface)" stroke="var(--warn-mid)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="331" font-family="monospace" font-size="13" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Foo.__init__(self, *args)</text>
  <text x="860" y="348" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">initializes instance attributes</text>

  <line x1="860" y1="358" x2="860" y2="384" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Result: instance -->
  <rect x="740" y="384" width="240" height="44" rx="22" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="860" y="405" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">instance returned</text>
  <text x="860" y="420" font-family="sans-serif" font-size="11" fill="var(--ok-lt)" text-anchor="middle">type(instance) == Foo</text>

  <!-- Type hierarchy diagram -->
  <rect x="720" y="448" width="500" height="154" rx="8" fill="var(--surface-light)" stroke="var(--text-placeholder)" stroke-width="1"/>
  <text x="970" y="468" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Type Hierarchy</text>
  <!-- boxes -->
  <rect x="830" y="478" width="140" height="34" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="900" y="499" font-family="monospace" font-size="12" fill="var(--primary-dk)" text-anchor="middle">type</text>
  <rect x="730" y="530" width="140" height="34" rx="6" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="800" y="551" font-family="monospace" font-size="12" fill="var(--ok-dk)" text-anchor="middle">Foo (class)</text>
  <rect x="930" y="530" width="140" height="34" rx="6" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="1.5"/>
  <text x="1000" y="551" font-family="monospace" font-size="12" fill="var(--warn-dk)" text-anchor="middle">instance</text>
  <!-- connecting lines -->
  <line x1="870" y1="512" x2="800" y2="530" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="930" y1="512" x2="1000" y2="530" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="525" font-family="sans-serif" font-size="10" fill="var(--text-mid)">type(Foo)</text>
  <text x="935" y="525" font-family="sans-serif" font-size="10" fill="var(--text-mid)">type(inst)</text>
  <text x="735" y="580" font-family="monospace" font-size="10" fill="var(--text-muted)">= type</text>
  <text x="935" y="580" font-family="monospace" font-size="10" fill="var(--text-muted)">= Foo</text>
  <text x="750" y="596" font-family="sans-serif" font-size="10" fill="var(--text-muted)">type(type) = type</text>

  <!-- Bottom info -->
  <rect x="60" y="592" width="580" height="30" rx="5" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1"/>
  <text x="350" y="612" font-family="monospace" font-size="12" fill="var(--ok-dk)" text-anchor="middle">class MyMeta(type): ...   class Foo(Base, metaclass=MyMeta): ...</text>
</svg>

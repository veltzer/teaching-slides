<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="52" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="34" font-family="sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Class Creation Pipeline</text>

  <!-- Section labels -->
  <text x="380" y="74" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Class Creation (metaclass.__new__ / __call__)</text>
  <text x="960" y="74" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Instance Creation (Foo())</text>

  <!-- Vertical divider -->
  <line x1="680" y1="60" x2="680" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ===== CLASS CREATION PIPELINE (left) ===== -->

  <!-- Step 1 -->
  <rect x="60" y="88" width="300" height="48" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="210" y="108" font-family="monospace" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">class Foo(Base):</text>
  <text x="210" y="126" font-family="sans-serif" font-size="12" fill="var(--primary-accent)" text-anchor="middle">Python sees a class statement</text>

  <line x1="210" y1="136" x2="210" y2="162" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="60" y="162" width="300" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="210" y="183" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Find metaclass</text>
  <text x="210" y="200" font-family="monospace" font-size="11" fill="var(--text-muted)" text-anchor="middle">type (default) or custom Meta</text>

  <!-- type label -->
  <rect x="390" y="170" width="170" height="32" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="475" y="186" font-family="monospace" font-size="12" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">default: type</text>
  <text x="475" y="199" font-family="sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">class Foo(metaclass=Meta)</text>
  <line x1="390" y1="186" x2="360" y2="186" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow-warn)"/>

  <line x1="210" y1="210" x2="210" y2="236" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="60" y="236" width="300" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="210" y="257" font-family="monospace" font-size="13" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">metaclass.__prepare__(name, bases)</text>
  <text x="210" y="274" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">returns namespace dict for class body</text>

  <line x1="210" y1="284" x2="210" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="60" y="310" width="300" height="48" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="210" y="331" font-family="monospace" font-size="13" fill="var(--primary-accent)" text-anchor="middle">exec(class body)</text>
  <text x="210" y="348" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">populates namespace dict with attrs/methods</text>

  <line x1="210" y1="358" x2="210" y2="384" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="60" y="384" width="300" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="210" y="405" font-family="monospace" font-size="13" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">metaclass.__new__(mcs, name,</text>
  <text x="210" y="422" font-family="monospace" font-size="13" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">  bases, namespace)</text>

  <line x1="210" y1="432" x2="210" y2="458" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="60" y="458" width="300" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="210" y="479" font-family="monospace" font-size="13" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">metaclass.__init__(cls, name,</text>
  <text x="210" y="496" font-family="monospace" font-size="13" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">  bases, namespace)</text>

  <line x1="210" y1="506" x2="210" y2="532" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Result: class object -->
  <rect x="80" y="532" width="260" height="44" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="210" y="553" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">class object Foo created</text>
  <text x="210" y="568" font-family="sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">bound to name "Foo" in namespace</text>

  <!-- ===== INSTANCE CREATION PIPELINE (right) ===== -->

  <!-- Step A -->
  <rect x="720" y="88" width="280" height="48" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="860" y="108" font-family="monospace" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Foo(arg1, arg2)</text>
  <text x="860" y="126" font-family="sans-serif" font-size="12" fill="var(--surface)" text-anchor="middle">calling the class object</text>

  <line x1="860" y1="136" x2="860" y2="162" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step B -->
  <rect x="720" y="162" width="280" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="860" y="183" font-family="monospace" font-size="13" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">type.__call__(cls, *args)</text>
  <text x="860" y="200" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">metaclass __call__ orchestrates creation</text>

  <line x1="860" y1="210" x2="860" y2="236" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step C -->
  <rect x="720" y="236" width="280" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="860" y="257" font-family="monospace" font-size="13" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Foo.__new__(cls, *args)</text>
  <text x="860" y="274" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">allocates memory, creates raw instance</text>

  <line x1="860" y1="284" x2="860" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step D -->
  <rect x="720" y="310" width="280" height="48" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="860" y="331" font-family="monospace" font-size="13" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Foo.__init__(self, *args)</text>
  <text x="860" y="348" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">initializes instance attributes</text>

  <line x1="860" y1="358" x2="860" y2="384" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Result: instance -->
  <rect x="740" y="384" width="240" height="44" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="860" y="405" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">instance returned</text>
  <text x="860" y="420" font-family="sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">type(instance) == Foo</text>

  <!-- Type hierarchy diagram -->
  <rect x="720" y="448" width="500" height="154" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="970" y="468" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--text)" text-anchor="middle">Type Hierarchy</text>
  <!-- boxes -->
  <rect x="830" y="478" width="140" height="34" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="900" y="499" font-family="monospace" font-size="12" fill="var(--primary-accent)" text-anchor="middle">type</text>
  <rect x="730" y="530" width="140" height="34" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="800" y="551" font-family="monospace" font-size="12" fill="var(--ok-accent)" text-anchor="middle">Foo (class)</text>
  <rect x="930" y="530" width="140" height="34" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1000" y="551" font-family="monospace" font-size="12" fill="var(--warn-accent)" text-anchor="middle">instance</text>
  <!-- connecting lines -->
  <line x1="870" y1="512" x2="800" y2="530" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="930" y1="512" x2="1000" y2="530" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="525" font-family="sans-serif" font-size="10" fill="var(--text-muted)">type(Foo)</text>
  <text x="935" y="525" font-family="sans-serif" font-size="10" fill="var(--text-muted)">type(inst)</text>
  <text x="735" y="580" font-family="monospace" font-size="10" fill="var(--text-muted)">= type</text>
  <text x="935" y="580" font-family="monospace" font-size="10" fill="var(--text-muted)">= Foo</text>
  <text x="750" y="596" font-family="sans-serif" font-size="10" fill="var(--text-muted)">type(type) = type</text>

  <!-- Bottom info -->
  <rect x="60" y="592" width="580" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="350" y="612" font-family="monospace" font-size="12" fill="var(--ok-accent)" text-anchor="middle">class MyMeta(type): ...   class Foo(Base, metaclass=MyMeta): ...</text>
</svg>

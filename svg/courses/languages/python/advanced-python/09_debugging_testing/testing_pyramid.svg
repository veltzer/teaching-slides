<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- E2E top layer -->
  <polygon points="640,60 864,300 416,300" fill="#ffccbc" stroke="#e64a19" stroke-width="3"/>
  <!-- Integration middle layer -->
  <polygon points="640,60 1056,480 224,480" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <!-- Unit bottom layer -->
  <polygon points="640,60 1216,630 64,630" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <!-- Labels -->
  <text x="640" y="215" font-size="36" font-weight="bold" fill="#bf360c" text-anchor="middle">E2E</text>
  <text x="640" y="400" font-size="36" font-weight="bold" fill="#1565c0" text-anchor="middle">Integration</text>
  <text x="640" y="575" font-size="40" font-weight="bold" fill="#2e7d32" text-anchor="middle">Unit</text>
  <!-- Side annotations -->
  <text x="40" y="680" font-size="18" fill="#666666">Fewer, slower, more realistic &#x2191;     &#x2193; More, faster, isolated</text>
</svg>

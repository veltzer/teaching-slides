<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Data Model: Everything is an Object</text>

  <!-- Center: "Everything is an object" -->
  <rect x="490" y="80" width="300" height="60" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="116" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Every value is an object</text>

  <!-- Objects radiating out -->
  <!-- int -->
  <line x1="490" y1="110" x2="300" y2="150" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="100" y="130" width="200" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="158" font-family="monospace" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">42</text>
  <text x="200" y="178" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">type: int  id: 0x7f...</text>

  <!-- str -->
  <line x1="540" y1="80" x2="420" y2="50" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="20" width="200" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="47" font-family="monospace" font-size="14" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">"hello"</text>
  <text x="370" y="68" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">type: str  id: 0x7f...</text>

  <!-- list -->
  <line x1="640" y1="140" x2="640" y2="188" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="530" y="190" width="220" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="217" font-family="monospace" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">[1, 2, 3]</text>
  <text x="640" y="237" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">type: list  id: 0x7f...</text>

  <!-- function -->
  <line x1="790" y1="80" x2="890" y2="50" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="820" y="20" width="220" height="60" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="47" font-family="monospace" font-size="14" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">def foo(): ...</text>
  <text x="930" y="68" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">type: function  id: 0x7f...</text>

  <!-- class -->
  <line x1="790" y1="110" x2="980" y2="150" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="980" y="130" width="200" height="70" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="158" font-family="monospace" font-size="14" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">class Foo:</text>
  <text x="1080" y="178" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)" text-anchor="middle">type: type  id: 0x7f...</text>

  <!-- Object anatomy box -->
  <rect x="30" y="270" width="400" height="200" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="230" y="295" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Every Object Has:</text>
  <text x="50" y="322" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">id     - unique identity (memory address)</text>
  <text x="50" y="347" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">type   - its class (determines behavior)</text>
  <text x="50" y="372" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">value  - the data it holds</text>
  <text x="50" y="405" font-family="monospace" font-size="13" fill="var(--primary-accent)">id(x)    # address</text>
  <text x="50" y="428" font-family="monospace" font-size="13" fill="var(--primary-accent)">type(x)  # class</text>
  <text x="50" y="451" font-family="monospace" font-size="13" fill="var(--primary-accent)">x == y   # value equality</text>

  <!-- Identity vs Equality -->
  <rect x="450" y="270" width="380" height="200" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="295" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Identity vs Equality</text>
  <rect x="460" y="302" width="360" height="80" rx="6" fill="var(--code-bg)"/>
  <text x="475" y="325" font-family="monospace" font-size="13" fill="var(--primary-accent)">a = [1, 2, 3]</text>
  <text x="475" y="345" font-family="monospace" font-size="13" fill="var(--primary-accent)">b = [1, 2, 3]</text>
  <text x="475" y="365" font-family="monospace" font-size="13" fill="var(--ok-accent)">a == b  <tspan fill="var(--text-muted)"># True  (same value)</tspan></text>
  <text x="475" y="385" font-family="monospace" font-size="13" fill="var(--info-accent)">a is b  <tspan fill="var(--text-muted)"># False (different obj)</tspan></text>
  <text x="460" y="420" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">== calls __eq__() (value comparison)</text>
  <text x="460" y="442" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">is  checks id() identity</text>
  <text x="460" y="462" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Use "is" only for None, True, False</text>

  <!-- Dunder methods table -->
  <rect x="850" y="270" width="400" height="350" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="850" y="270" width="400" height="36" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1050" y="293" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Key Dunder Methods</text>
  <rect x="860" y="310" width="380" height="28" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="870" y="329" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-accent)">Method</text>
  <text x="1030" y="329" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--info-accent)">Triggered by</text>
  <text x="870" y="354" font-family="monospace" font-size="12" fill="var(--info-accent)">__init__</text>
  <text x="1030" y="354" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">obj = Class()</text>
  <text x="870" y="374" font-family="monospace" font-size="12" fill="var(--info-accent)">__repr__</text>
  <text x="1030" y="374" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">repr(obj)</text>
  <text x="870" y="394" font-family="monospace" font-size="12" fill="var(--info-accent)">__str__</text>
  <text x="1030" y="394" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">str(obj), print(obj)</text>
  <text x="870" y="414" font-family="monospace" font-size="12" fill="var(--info-accent)">__len__</text>
  <text x="1030" y="414" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">len(obj)</text>
  <text x="870" y="434" font-family="monospace" font-size="12" fill="var(--info-accent)">__getitem__</text>
  <text x="1030" y="434" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">obj[key]</text>
  <text x="870" y="454" font-family="monospace" font-size="12" fill="var(--info-accent)">__iter__</text>
  <text x="1030" y="454" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">for x in obj</text>
  <text x="870" y="474" font-family="monospace" font-size="12" fill="var(--info-accent)">__eq__</text>
  <text x="1030" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">obj == other</text>
  <text x="870" y="494" font-family="monospace" font-size="12" fill="var(--info-accent)">__add__</text>
  <text x="1030" y="494" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">obj + other</text>
  <text x="870" y="514" font-family="monospace" font-size="12" fill="var(--info-accent)">__enter__ / __exit__</text>
  <text x="1030" y="514" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">with obj as ...</text>
  <text x="870" y="534" font-family="monospace" font-size="12" fill="var(--info-accent)">__call__</text>
  <text x="1030" y="534" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">obj()</text>
  <text x="870" y="554" font-family="monospace" font-size="12" fill="var(--info-accent)">__del__</text>
  <text x="1030" y="554" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">garbage collected</text>
  <text x="870" y="580" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">Data model enables operator overloading and protocol support</text>

  <!-- Types hierarchy note -->
  <rect x="30" y="485" width="800" height="125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="430" y="508" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Type System Hierarchy</text>
  <!-- boxes -->
  <rect x="50" y="518" width="120" height="36" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="110" y="541" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">object</text>
  <rect x="200" y="518" width="120" height="36" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="260" y="541" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">type</text>
  <rect x="350" y="518" width="120" height="36" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="410" y="541" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">int / str / list</text>
  <rect x="500" y="518" width="140" height="36" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="570" y="541" font-family="Arial, sans-serif" font-size="12" fill="var(--bg)" text-anchor="middle">MyClass (user)</text>
  <text x="50" y="580" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">type(42) is int; type(int) is type; isinstance(42, object) is True</text>
  <text x="50" y="600" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">int and type are both instances of object -- everything inherits from object</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6.6276" x="40" y="40"/>

  <!-- Title -->
  <rect x="68.1249" y="53.5938" width="1143.7501" height="39.875" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="639.9999" y="78.9687" font-family="Arial, sans-serif" font-size="18.435" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Data Model: Everything is an Object</text>

  <!-- Center: "Everything is an object" -->
  <rect x="499.3748" y="112.5" width="281.25" height="54.375" rx="6.6276" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="639.9999" y="145.1249" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">Every value is an object</text>

  <!-- Objects radiating out -->
  <!-- int -->
  <line x1="499.3748" y1="139.6874" x2="321.25" y2="175.9376" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="133.7499" y="157.8124" width="187.4999" height="63.4375" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="227.4999" y="183.1875" font-family="monospace" font-size="12.9043" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">42</text>
  <text x="227.4999" y="201.3125" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)" text-anchor="middle">type: int  id: 0x7f...</text>

  <!-- str -->
  <line x1="546.2499" y1="112.5" x2="433.75" y2="85.3125" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="293.125" y="58.125" width="187.4999" height="54.375" rx="6.6276" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="386.875" y="82.5938" font-family="monospace" font-size="12.9043" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">"hello"</text>
  <text x="386.875" y="101.625" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)" text-anchor="middle">type: str  id: 0x7f...</text>

  <!-- list -->
  <line x1="639.9999" y1="166.8749" x2="639.9999" y2="210.3749" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="536.875" y="212.1875" width="206.2501" height="54.375" rx="6.6276" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="236.6563" font-family="monospace" font-size="12.9043" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">[1, 2, 3]</text>
  <text x="639.9999" y="254.7812" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)" text-anchor="middle">type: list  id: 0x7f...</text>

  <!-- function -->
  <line x1="780.6248" y1="112.5" x2="874.375" y2="85.3125" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="808.75" y="58.125" width="206.2501" height="54.375" rx="6.6276" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="911.8749" y="82.5938" font-family="monospace" font-size="12.9043" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">def foo(): ...</text>
  <text x="911.8749" y="101.625" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)" text-anchor="middle">type: function  id: 0x7f...</text>

  <!-- class -->
  <line x1="780.6248" y1="139.6874" x2="958.75" y2="175.9376" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="958.75" y="157.8124" width="187.4999" height="63.4375" rx="6.6276" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1052.5001" y="183.1875" font-family="monospace" font-size="12.9043" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">class Foo:</text>
  <text x="1052.5001" y="201.3125" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-muted)" text-anchor="middle">type: type  id: 0x7f...</text>

  <!-- Object anatomy box -->
  <rect x="68.1249" y="284.6875" width="375" height="181.2501" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="255.6248" y="307.3439" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Every Object Has:</text>
  <text x="86.8749" y="331.8125" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--text)">id     - unique identity (memory address)</text>
  <text x="86.8749" y="354.4687" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--text)">type   - its class (determines behavior)</text>
  <text x="86.8749" y="377.125" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--text)">value  - the data it holds</text>
  <text x="86.8749" y="407.0312" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">id(x)    # address</text>
  <text x="86.8749" y="427.8751" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">type(x)  # class</text>
  <text x="86.8749" y="448.7188" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">x == y   # value equality</text>

  <!-- Identity vs Equality -->
  <rect x="461.8749" y="284.6875" width="356.2501" height="181.2501" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="639.9999" y="307.3439" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Identity vs Equality</text>
  <rect x="471.2499" y="313.6874" width="337.5001" height="72.5" rx="6.6276" fill="var(--code-bg)"/>
  <text x="485.3125" y="334.5311" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">a = [1, 2, 3]</text>
  <text x="485.3125" y="352.6561" font-family="monospace" font-size="11.9828" fill="var(--primary-accent)">b = [1, 2, 3]</text>
  <text x="485.3125" y="370.7811" font-family="monospace" font-size="11.9828" fill="var(--ok-accent)">a == b  <tspan fill="var(--text-muted)"># True  (same value)</tspan></text>
  <text x="485.3125" y="388.9063" font-family="monospace" font-size="11.9828" fill="var(--info-accent)">a is b  <tspan fill="var(--text-muted)"># False (different obj)</tspan></text>
  <text x="471.2499" y="420.6249" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">== calls __eq__() (value comparison)</text>
  <text x="471.2499" y="440.5624" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">is  checks id() identity</text>
  <text x="471.2499" y="458.6875" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text-faint)">Use "is" only for None, True, False</text>

  <!-- Dunder methods table -->
  <rect x="836.8749" y="284.6875" width="375" height="317.1875" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="836.8749" y="284.6875" width="375" height="32.6251" rx="6.6276" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1024.3749" y="305.5312" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">Key Dunder Methods</text>
  <rect x="846.25" y="320.9376" width="356.2501" height="25.3749" rx="6.6276" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="855.6249" y="338.1562" font-family="Arial, sans-serif" font-size="11.6093" font-weight="bold" fill="var(--info-accent)">Method</text>
  <text x="1005.625" y="338.1562" font-family="Arial, sans-serif" font-size="11.6093" font-weight="bold" fill="var(--info-accent)">Triggered by</text>
  <text x="855.6249" y="360.8124" font-family="monospace" font-size="11.6093" fill="var(--info-accent)">__init__</text>
  <text x="1005.625" y="360.8124" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">obj = Class()</text>
  <text x="855.6249" y="378.9374" font-family="monospace" font-size="11.6093" fill="var(--info-accent)">__repr__</text>
  <text x="1005.625" y="378.9374" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">repr(obj)</text>
  <text x="855.6249" y="397.0626" font-family="monospace" font-size="11.6093" fill="var(--info-accent)">__str__</text>
  <text x="1005.625" y="397.0626" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">str(obj), print(obj)</text>
  <text x="855.6249" y="415.1874" font-family="monospace" font-size="11.6093" fill="var(--info-accent)">__len__</text>
  <text x="1005.625" y="415.1874" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">len(obj)</text>
  <text x="855.6249" y="433.3126" font-family="monospace" font-size="11.6093" fill="var(--info-accent)">__getitem__</text>
  <text x="1005.625" y="433.3126" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">obj[key]</text>
  <text x="855.6249" y="451.4375" font-family="monospace" font-size="11.6093" fill="var(--info-accent)">__iter__</text>
  <text x="1005.625" y="451.4375" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">for x in obj</text>
  <text x="855.6249" y="469.5625" font-family="monospace" font-size="11.6093" fill="var(--info-accent)">__eq__</text>
  <text x="1005.625" y="469.5625" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">obj == other</text>
  <text x="855.6249" y="487.6876" font-family="monospace" font-size="11.6093" fill="var(--info-accent)">__add__</text>
  <text x="1005.625" y="487.6876" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">obj + other</text>
  <text x="855.6249" y="505.8125" font-family="monospace" font-size="11.6093" fill="var(--info-accent)">__enter__ / __exit__</text>
  <text x="1005.625" y="505.8125" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">with obj as ...</text>
  <text x="855.6249" y="523.9375" font-family="monospace" font-size="11.6093" fill="var(--info-accent)">__call__</text>
  <text x="1005.625" y="523.9375" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">obj()</text>
  <text x="855.6249" y="542.0625" font-family="monospace" font-size="11.6093" fill="var(--info-accent)">__del__</text>
  <text x="1005.625" y="542.0625" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text)">garbage collected</text>
  <text x="855.6249" y="565.625" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--text-faint)">Data model enables operator overloading and protocol support</text>

  <!-- Types hierarchy note -->
  <rect x="68.1249" y="479.5312" width="750.0001" height="113.2812" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="443.1249" y="500.3749" font-family="Arial, sans-serif" font-size="12.9043" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Type System Hierarchy</text>
  <!-- boxes -->
  <rect x="86.8749" y="509.4376" width="112.5" height="32.6251" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="143.125" y="530.2812" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--bg)" text-anchor="middle">object</text>
  <rect x="227.4999" y="509.4376" width="112.5" height="32.6251" rx="6.6276" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="283.75" y="530.2812" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--bg)" text-anchor="middle">type</text>
  <rect x="368.1249" y="509.4376" width="112.5" height="32.6251" rx="6.6276" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="424.375" y="530.2812" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--bg)" text-anchor="middle">int / str / list</text>
  <rect x="508.7499" y="509.4376" width="131.25" height="32.6251" rx="6.6276" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="574.3749" y="530.2812" font-family="Arial, sans-serif" font-size="11.6093" fill="var(--bg)" text-anchor="middle">MyClass (user)</text>
  <text x="86.8749" y="565.625" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">type(42) is int; type(int) is type; isinstance(42, object) is True</text>
  <text x="86.8749" y="583.75" font-family="Arial, sans-serif" font-size="11.9828" fill="var(--text)">int and type are both instances of object -- everything inherits from object</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Title -->
  <rect x="40" y="40" width="1200" height="42.181822" rx="6.321041" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999948" y="66.842872" font-family="Arial, sans-serif" font-size="19.421399" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Data Model</text>

  <!-- Center: "Everything is an object" -->
  <rect x="492.458872" y="102.314002" width="295.081941" height="57.520666" rx="6.321041" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999948" y="136.826296" font-family="Arial, sans-serif" font-size="15.537014" font-weight="bold" fill="var(--bg)" text-anchor="middle">All is object</text>

  <!-- Objects radiating out -->
  <!-- int -->
  <line x1="492.458872" y1="131.07423" x2="305.573852" y2="169.421552" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="108.852453" y="150.247785" width="196.721189" height="67.107444" rx="6.321041" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="207.2131" y="177.090869" font-size="13.594769" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">42</text>
  <text x="207.2131" y="196.264424" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text-muted)" text-anchor="middle">int</text>

  <!-- str -->
  <line x1="541.6393" y1="102.314002" x2="423.606629" y2="73.553669" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="276.065658" y="44.793336" width="196.721189" height="57.520666" rx="6.321041" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="374.426305" y="70.677689" font-size="13.594769" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">"hello"</text>
  <text x="374.426305" y="90.809869" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text-muted)" text-anchor="middle">str</text>

  <!-- list -->
  <line x1="639.999948" y1="159.834563" x2="639.999948" y2="205.851096" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="531.803341" y="207.768557" width="216.393529" height="57.520666" rx="6.321041" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999948" y="233.65291" font-size="13.594769" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Courier New, monospace">[1, 2, 3]</text>
  <text x="639.999948" y="252.82636" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text-muted)" text-anchor="middle">list</text>

  <!-- function -->
  <line x1="787.540813" y1="102.314002" x2="885.90167" y2="73.553669" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="817.049217" y="44.793336" width="216.393529" height="57.520666" rx="6.321041" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="925.245824" y="70.677689" font-size="13.594769" font-weight="bold" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">def foo(): ...</text>
  <text x="925.245824" y="90.809869" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text-muted)" text-anchor="middle">function</text>

  <!-- class -->
  <line x1="787.540813" y1="131.07423" x2="974.426253" y2="169.421552" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="974.426253" y="150.247785" width="196.721189" height="67.107444" rx="6.321041" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072.787005" y="177.090869" font-size="13.594769" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">class Foo:</text>
  <text x="1072.787005" y="196.264424" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text-muted)" text-anchor="middle">type</text>

  <!-- Object anatomy box -->
  <rect x="40" y="284.462779" width="393.442589" height="191.73566" rx="6.321041" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="236.721189" y="308.429882" font-family="Arial, sans-serif" font-size="14.565891" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Object Has:</text>
  <text x="59.672129" y="334.314024" font-family="Arial, sans-serif" font-size="13.594769" fill="var(--text)">id - identity</text>
  <text x="59.672129" y="358.280915" font-family="Arial, sans-serif" font-size="13.594769" fill="var(--text)">type - class</text>
  <text x="59.672129" y="382.247912" font-family="Arial, sans-serif" font-size="13.594769" fill="var(--text)">value - data</text>
  <text x="59.672129" y="413.884226" font-size="12.623962" fill="var(--primary-accent)" font-family="Courier New, monospace">id(x)</text>
  <text x="59.672129" y="435.933973" font-size="12.623962" fill="var(--primary-accent)" font-family="Courier New, monospace">type(x)</text>
  <text x="59.672129" y="457.983509" font-size="12.623962" fill="var(--primary-accent)" font-family="Courier New, monospace">x == y</text>

  <!-- Identity vs Equality -->
  <rect x="453.114718" y="284.462779" width="373.770564" height="191.73566" rx="6.321041" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.999948" y="308.429882" font-family="Arial, sans-serif" font-size="14.565891" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">is vs ==</text>
  <rect x="462.950783" y="315.140362" width="354.098435" height="76.694222" rx="6.321041" fill="var(--code-bg)"/>
  <text x="477.704985" y="337.189898" font-size="12.623962" fill="var(--primary-accent)" font-family="Courier New, monospace">a = [1, 2, 3]</text>
  <text x="477.704985" y="356.363454" font-size="12.623962" fill="var(--primary-accent)" font-family="Courier New, monospace">b = [1, 2, 3]</text>
  <text x="477.704985" y="375.537009" font-size="12.623962" fill="var(--ok-accent)" font-family="Courier New, monospace">a == b  <tspan fill="var(--text-muted)" font-family="Arial, sans-serif"># True</tspan></text>
  <text x="477.704985" y="394.710776" font-size="12.623962" fill="var(--info-accent)" font-family="Courier New, monospace">a is b  <tspan fill="var(--text-muted)" font-family="Arial, sans-serif"># False</tspan></text>
  <text x="462.950783" y="428.26434" font-family="Arial, sans-serif" font-size="12.623962" fill="var(--text)">== uses __eq__</text>
  <text x="462.950783" y="449.355251" font-family="Arial, sans-serif" font-size="12.623962" fill="var(--text)">is checks id</text>
  <text x="462.950783" y="468.528912" font-family="Arial, sans-serif" font-size="12.623962" fill="var(--text-faint)">is: None only</text>

  <!-- Dunder methods table -->
  <rect x="846.557307" y="284.462779" width="393.442589" height="335.537221" rx="6.321041" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="846.557307" y="284.462779" width="393.442589" height="34.512506" rx="6.321041" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.278601" y="306.512315" font-family="Arial, sans-serif" font-size="14.565891" font-weight="bold" fill="var(--bg)" text-anchor="middle">Dunders</text>
  <rect x="856.393476" y="322.809996" width="373.770564" height="26.842872" rx="6.321041" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="866.229436" y="341.024715" font-family="Arial, sans-serif" font-size="12.230477" font-weight="bold" fill="var(--info-accent)">Method</text>
  <text x="866.229436" y="364.991606" font-size="12.230477" fill="var(--info-accent)" font-family="Courier New, monospace">__init__</text>
  <text x="1023.606576" y="364.991606" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text)">Class()</text>
  <text x="866.229436" y="384.165162" font-size="12.230477" fill="var(--info-accent)" font-family="Courier New, monospace">__repr__</text>
  <text x="1023.606576" y="384.165162" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text)">repr()</text>
  <text x="866.229436" y="403.338929" font-size="12.230477" fill="var(--info-accent)" font-family="Courier New, monospace">__str__</text>
  <text x="1023.606576" y="403.338929" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text)">str()</text>
  <text x="866.229436" y="422.512273" font-size="12.230477" fill="var(--info-accent)" font-family="Courier New, monospace">__len__</text>
  <text x="1023.606576" y="422.512273" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text)">len()</text>
  <text x="866.229436" y="441.68604" font-size="12.230477" fill="var(--info-accent)" font-family="Courier New, monospace">__getitem__</text>
  <text x="1023.606576" y="441.68604" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text)">obj[k]</text>
  <text x="866.229436" y="460.85949" font-size="12.230477" fill="var(--info-accent)" font-family="Courier New, monospace">__iter__</text>
  <text x="1023.606576" y="460.85949" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text)">for</text>
  <text x="866.229436" y="480.033045" font-size="12.230477" fill="var(--info-accent)" font-family="Courier New, monospace">__eq__</text>
  <text x="1023.606576" y="480.033045" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text)">==</text>
  <text x="866.229436" y="499.206706" font-size="12.230477" fill="var(--info-accent)" font-family="Courier New, monospace">__add__</text>
  <text x="1023.606576" y="499.206706" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text)">+</text>
  <text x="866.229436" y="518.380156" font-size="12.230477" fill="var(--info-accent)" font-family="Courier New, monospace">__enter__</text>
  <text x="1023.606576" y="518.380156" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text)">with</text>
  <text x="866.229436" y="537.553711" font-size="12.230477" fill="var(--info-accent)" font-family="Courier New, monospace">__call__</text>
  <text x="1023.606576" y="537.553711" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text)">obj()</text>
  <text x="866.229436" y="556.727267" font-size="12.230477" fill="var(--info-accent)" font-family="Courier New, monospace">__del__</text>
  <text x="1023.606576" y="556.727267" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text)">gc</text>
  <text x="866.229436" y="581.652889" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--text-faint)">Operator overloading</text>

  <!-- Types hierarchy note -->
  <rect x="40" y="490.578448" width="786.885282" height="119.834669" rx="6.321041" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="433.442589" y="512.627984" font-family="Arial, sans-serif" font-size="13.594769" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Type Hierarchy</text>
  <!-- boxes -->
  <rect x="59.672129" y="522.214973" width="118.032777" height="34.512506" rx="6.321041" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.688623" y="544.264403" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--bg)" text-anchor="middle">object</text>
  <rect x="207.2131" y="522.214973" width="118.032777" height="34.512506" rx="6.321041" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="266.229593" y="544.264403" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--bg)" text-anchor="middle">type</text>
  <rect x="354.754071" y="522.214973" width="118.032777" height="34.512506" rx="6.321041" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="413.770564" y="544.264403" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--bg)" text-anchor="middle">int/str/list</text>
  <rect x="502.295042" y="522.214973" width="137.704906" height="34.512506" rx="6.321041" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="571.147495" y="544.264403" font-family="Arial, sans-serif" font-size="12.230477" fill="var(--bg)" text-anchor="middle">MyClass</text>
  <text x="59.672129" y="581.652889" font-family="Arial, sans-serif" font-size="12.623962" fill="var(--text)">type(42) is int</text>
  <text x="59.672129" y="600.826445" font-family="Arial, sans-serif" font-size="12.623962" fill="var(--text)">Inherits object</text>
</svg>

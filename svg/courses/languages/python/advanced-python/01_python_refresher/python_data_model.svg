<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>

  <!-- Title -->
  <rect x="177.9133" y="156.3002" width="1036.5966" height="32.6445" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="696.2116" y="177.0739" font-family="Arial, sans-serif" font-size="15.8795" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Data Model: Everything is an Object</text>

  <!-- Center: "Everything is an object" -->
  <rect x="568.7611" y="204.525" width="254.9008" height="44.5152" rx="5.7089" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="696.2116" y="231.234" font-family="Arial, sans-serif" font-size="12.7035" font-weight="bold" fill="var(--bg)" text-anchor="middle">Every value is an object</text>

  <!-- Objects radiating out -->
  <!-- int -->
  <line x1="568.7611" y1="226.7825" x2="407.3241" y2="256.4594" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="237.3901" y="241.6209" width="169.9338" height="51.9344" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="322.3571" y="262.3947" font-family="monospace" font-size="11.1155" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">42</text>
  <text x="322.3571" y="277.2331" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">type: int  id: 0x7f...</text>

  <!-- str -->
  <line x1="611.2446" y1="204.525" x2="509.2844" y2="182.2674" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="381.834" y="160.0098" width="169.9338" height="44.5152" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="466.8009" y="180.0417" font-family="monospace" font-size="11.1155" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">"hello"</text>
  <text x="466.8009" y="195.6219" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">type: str  id: 0x7f...</text>

  <!-- list -->
  <line x1="696.2116" y1="249.0401" x2="696.2116" y2="284.6522" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="602.748" y="286.1361" width="186.9273" height="44.5152" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="696.2116" y="306.168" font-family="monospace" font-size="11.1155" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">[1, 2, 3]</text>
  <text x="696.2116" y="321.0063" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">type: list  id: 0x7f...</text>

  <!-- function -->
  <line x1="823.6619" y1="204.525" x2="908.629" y2="182.2674" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="849.1521" y="160.0098" width="186.9273" height="44.5152" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="942.6157" y="180.0417" font-family="monospace" font-size="11.1155" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">def foo(): ...</text>
  <text x="942.6157" y="195.6219" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">type: function  id: 0x7f...</text>

  <!-- class -->
  <line x1="823.6619" y1="226.7825" x2="985.0992" y2="256.4594" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="985.0992" y="241.6209" width="169.9338" height="51.9344" rx="5.7089" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.0662" y="262.3947" font-family="monospace" font-size="11.1155" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">class Foo:</text>
  <text x="1070.0662" y="277.2331" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">type: type  id: 0x7f...</text>

  <!-- Object anatomy box -->
  <rect x="177.9133" y="345.4897" width="339.8677" height="148.384" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="347.8471" y="364.0378" font-family="Arial, sans-serif" font-size="11.9095" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Every Object Has:</text>
  <text x="194.9067" y="384.0695" font-family="Arial, sans-serif" font-size="11.1155" fill="var(--text)">id     - unique identity (memory address)</text>
  <text x="194.9067" y="402.6175" font-family="Arial, sans-serif" font-size="11.1155" fill="var(--text)">type   - its class (determines behavior)</text>
  <text x="194.9067" y="421.1655" font-family="Arial, sans-serif" font-size="11.1155" fill="var(--text)">value  - the data it holds</text>
  <text x="194.9067" y="445.6488" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">id(x)    # address</text>
  <text x="194.9067" y="462.7131" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">type(x)  # class</text>
  <text x="194.9067" y="479.7772" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">x == y   # value equality</text>

  <!-- Identity vs Equality -->
  <rect x="534.7744" y="345.4897" width="322.8744" height="148.384" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="696.2116" y="364.0378" font-family="Arial, sans-serif" font-size="11.9095" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Identity vs Equality</text>
  <rect x="543.2711" y="369.2311" width="305.881" height="59.3536" rx="5.7089" fill="var(--code-bg)"/>
  <text x="556.0162" y="386.2952" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">a = [1, 2, 3]</text>
  <text x="556.0162" y="401.1336" font-family="monospace" font-size="10.3217" fill="var(--primary-accent)">b = [1, 2, 3]</text>
  <text x="556.0162" y="415.972" font-family="monospace" font-size="10.3217" fill="var(--ok-accent)">a == b  <tspan fill="var(--text-muted)"># True  (same value)</tspan></text>
  <text x="556.0162" y="430.8105" font-family="monospace" font-size="10.3217" fill="var(--info-accent)">a is b  <tspan fill="var(--text-muted)"># False (different obj)</tspan></text>
  <text x="543.2711" y="456.7776" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">== calls __eq__() (value comparison)</text>
  <text x="543.2711" y="473.0998" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">is  checks id() identity</text>
  <text x="543.2711" y="487.9383" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text-faint)">Use "is" only for None, True, False</text>

  <!-- Dunder methods table -->
  <rect x="874.6421" y="345.4897" width="339.8677" height="259.6719" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="874.6421" y="345.4897" width="339.8677" height="26.7092" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1044.576" y="362.5538" font-family="Arial, sans-serif" font-size="11.9095" font-weight="bold" fill="var(--bg)" text-anchor="middle">Key Dunder Methods</text>
  <rect x="883.1389" y="375.1666" width="322.8744" height="20.7737" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="891.6355" y="389.2629" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--info-accent)">Method</text>
  <text x="1027.5827" y="389.2629" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="var(--info-accent)">Triggered by</text>
  <text x="891.6355" y="407.8109" font-family="monospace" font-size="10" fill="var(--info-accent)">__init__</text>
  <text x="1027.5827" y="407.8109" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">obj = Class()</text>
  <text x="891.6355" y="422.6493" font-family="monospace" font-size="10" fill="var(--info-accent)">__repr__</text>
  <text x="1027.5827" y="422.6493" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">repr(obj)</text>
  <text x="891.6355" y="437.4878" font-family="monospace" font-size="10" fill="var(--info-accent)">__str__</text>
  <text x="1027.5827" y="437.4878" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">str(obj), print(obj)</text>
  <text x="891.6355" y="452.3261" font-family="monospace" font-size="10" fill="var(--info-accent)">__len__</text>
  <text x="1027.5827" y="452.3261" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">len(obj)</text>
  <text x="891.6355" y="467.1646" font-family="monospace" font-size="10" fill="var(--info-accent)">__getitem__</text>
  <text x="1027.5827" y="467.1646" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">obj[key]</text>
  <text x="891.6355" y="482.0029" font-family="monospace" font-size="10" fill="var(--info-accent)">__iter__</text>
  <text x="1027.5827" y="482.0029" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">for x in obj</text>
  <text x="891.6355" y="496.8413" font-family="monospace" font-size="10" fill="var(--info-accent)">__eq__</text>
  <text x="1027.5827" y="496.8413" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">obj == other</text>
  <text x="891.6355" y="511.6798" font-family="monospace" font-size="10" fill="var(--info-accent)">__add__</text>
  <text x="1027.5827" y="511.6798" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">obj + other</text>
  <text x="891.6355" y="526.5181" font-family="monospace" font-size="10" fill="var(--info-accent)">__enter__ / __exit__</text>
  <text x="1027.5827" y="526.5181" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">with obj as ...</text>
  <text x="891.6355" y="541.3565" font-family="monospace" font-size="10" fill="var(--info-accent)">__call__</text>
  <text x="1027.5827" y="541.3565" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">obj()</text>
  <text x="891.6355" y="556.1949" font-family="monospace" font-size="10" fill="var(--info-accent)">__del__</text>
  <text x="1027.5827" y="556.1949" font-family="Arial, sans-serif" font-size="10" fill="var(--text)">garbage collected</text>
  <text x="891.6355" y="575.4848" font-family="Arial, sans-serif" font-size="10" fill="var(--text-faint)">Data model enables operator overloading and protocol support</text>

  <!-- Types hierarchy note -->
  <rect x="177.9133" y="505.0024" width="679.7355" height="92.7399" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="517.781" y="522.0665" font-family="Arial, sans-serif" font-size="11.1155" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Type System Hierarchy</text>
  <!-- boxes -->
  <rect x="194.9067" y="529.4859" width="101.9603" height="26.7092" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="245.8869" y="546.5499" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">object</text>
  <rect x="322.3571" y="529.4859" width="101.9603" height="26.7092" rx="5.7089" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="373.3373" y="546.5499" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">type</text>
  <rect x="449.8075" y="529.4859" width="101.9603" height="26.7092" rx="5.7089" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="500.7877" y="546.5499" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">int / str / list</text>
  <rect x="577.2579" y="529.4859" width="118.9537" height="26.7092" rx="5.7089" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="636.7347" y="546.5499" font-family="Arial, sans-serif" font-size="10" fill="var(--bg)" text-anchor="middle">MyClass (user)</text>
  <text x="194.9067" y="575.4848" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">type(42) is int; type(int) is type; isinstance(42, object) is True</text>
  <text x="194.9067" y="590.3232" font-family="Arial, sans-serif" font-size="10.3217" fill="var(--text)">int and type are both instances of object -- everything inherits from object</text>
</svg>

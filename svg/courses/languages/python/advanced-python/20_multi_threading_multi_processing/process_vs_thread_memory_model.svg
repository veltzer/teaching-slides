<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.61855" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Process vs Thread Memory Model</text>
  <rect x="40" y="66.278365" width="537.931034" height="525.56626" rx="6.80298" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="308.965407" y="108.511369" text-anchor="middle" font-size="21.677244" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Process 1</text>
  <rect x="81.37931" y="128.220144" width="455.172414" height="103.236219" rx="6.80298" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="308.965407" y="188.284796" text-anchor="middle" font-size="17.735937" fill="var(--text)" font-family="Arial, sans-serif">Python Interpreter</text>
  <rect x="81.37931" y="252.103583" width="455.172414" height="103.236219" rx="6.80298" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="308.965407" y="312.168235" text-anchor="middle" font-size="17.735937" fill="var(--text)" font-family="Arial, sans-serif">Memory Space</text>
  <rect x="81.37931" y="375.987139" width="455.172414" height="103.236219" rx="6.80298" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="308.965407" y="436.051675" text-anchor="middle" font-size="17.735937" fill="var(--text)" font-family="Arial, sans-serif">Variables / Heap</text>
  <text x="308.965407" y="526.148828" text-anchor="middle" font-size="14.779929" fill="var(--danger-accent)" font-family="Arial, sans-serif">No shared memory with Process 2</text>
  <text x="308.965407" y="552.427194" text-anchor="middle" font-size="14.779929" fill="var(--text-muted)" font-family="Arial, sans-serif">IPC needed for communication</text>
  <rect x="702.068966" y="66.278365" width="537.931034" height="525.56626" rx="6.80298" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.034372" y="108.511369" text-anchor="middle" font-size="21.677244" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Process 2</text>
  <rect x="743.448276" y="128.220144" width="455.172414" height="103.236219" rx="6.80298" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="971.034372" y="188.284796" text-anchor="middle" font-size="17.735937" fill="var(--text)" font-family="Arial, sans-serif">Python Interpreter</text>
  <rect x="743.448276" y="252.103583" width="455.172414" height="103.236219" rx="6.80298" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="971.034372" y="312.168235" text-anchor="middle" font-size="17.735937" fill="var(--text)" font-family="Arial, sans-serif">Memory Space</text>
  <rect x="743.448276" y="375.987139" width="455.172414" height="103.236219" rx="6.80298" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="971.034372" y="436.051675" text-anchor="middle" font-size="17.735937" fill="var(--text)" font-family="Arial, sans-serif">Variables / Heap</text>
  <text x="971.034372" y="526.148828" text-anchor="middle" font-size="14.779929" fill="var(--danger-accent)" font-family="Arial, sans-serif">No shared memory with Process 1</text>
  <text x="971.034372" y="552.427194" text-anchor="middle" font-size="14.779929" fill="var(--text-muted)" font-family="Arial, sans-serif">Complete isolation - bypasses GIL</text>
  <line x1="640" y1="66.278365" x2="640" y2="591.844625" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 7.1111" />
  <text x="640" y="620" text-anchor="middle" font-size="15.765227" fill="var(--text-muted)" font-family="Arial, sans-serif">Threads share memory within a process; processes have separate memory spaces</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">Process vs Thread Memory Model</text>
  <!-- Process 1 -->
  <rect x="60" y="70" width="520" height="560" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" filter="url(#shadow)"/>
  <text x="320" y="115" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Process 1</text>
  <rect x="100" y="136" width="440" height="110" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="320" y="200" text-anchor="middle" font-size="18" fill="#333333">Python Interpreter</text>
  <rect x="100" y="268" width="440" height="110" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="320" y="332" text-anchor="middle" font-size="18" fill="#333333">Memory Space</text>
  <rect x="100" y="400" width="440" height="110" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="320" y="464" text-anchor="middle" font-size="18" fill="#333333">Variables / Heap</text>
  <text x="320" y="560" text-anchor="middle" font-size="15" fill="#e53935">No shared memory with Process 2</text>
  <text x="320" y="588" text-anchor="middle" font-size="15" fill="#555555">IPC needed for communication</text>
  <!-- Process 2 -->
  <rect x="700" y="70" width="520" height="560" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" filter="url(#shadow)"/>
  <text x="960" y="115" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">Process 2</text>
  <rect x="740" y="136" width="440" height="110" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="960" y="200" text-anchor="middle" font-size="18" fill="#333333">Python Interpreter</text>
  <rect x="740" y="268" width="440" height="110" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="960" y="332" text-anchor="middle" font-size="18" fill="#333333">Memory Space</text>
  <rect x="740" y="400" width="440" height="110" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="960" y="464" text-anchor="middle" font-size="18" fill="#333333">Variables / Heap</text>
  <text x="960" y="560" text-anchor="middle" font-size="15" fill="#e53935">No shared memory with Process 1</text>
  <text x="960" y="588" text-anchor="middle" font-size="15" fill="#555555">Complete isolation - bypasses GIL</text>
  <!-- Divider -->
  <line x1="640" y1="70" x2="640" y2="630" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="8 8"/>
  <text x="640" y="660" text-anchor="middle" font-size="16" fill="#555555">Threads share memory within a process; processes have separate memory spaces</text>
</svg>

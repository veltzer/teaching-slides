<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.61855" font-weight="bold" fill="var(--primary-accent)">Process vs Thread Memory Model</text>
  <rect x="40" y="66.278365" width="537.931034" height="525.56626" rx="6.80298" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="308.965407" y="108.511369" text-anchor="middle" font-size="21.677244" font-weight="bold" fill="var(--primary-accent)">Process 1</text>
  <rect x="81.37931" y="128.220144" width="455.172414" height="103.236219" rx="6.80298" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="308.965407" y="188.284796" text-anchor="middle" font-size="17.735937" fill="var(--text)">Python Interpreter</text>
  <rect x="81.37931" y="252.103583" width="455.172414" height="103.236219" rx="6.80298" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="308.965407" y="312.168235" text-anchor="middle" font-size="17.735937" fill="var(--text)">Memory Space</text>
  <rect x="81.37931" y="375.987139" width="455.172414" height="103.236219" rx="6.80298" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7778" />
  <text x="308.965407" y="436.051675" text-anchor="middle" font-size="17.735937" fill="var(--text)">Variables / Heap</text>
  <text x="308.965407" y="526.148828" text-anchor="middle" font-size="14.779929" fill="var(--danger-accent)">No shared memory with Process 2</text>
  <text x="308.965407" y="552.427194" text-anchor="middle" font-size="14.779929" fill="var(--text-muted)">IPC needed for communication</text>
  <rect x="702.068966" y="66.278365" width="537.931034" height="525.56626" rx="6.80298" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="971.034372" y="108.511369" text-anchor="middle" font-size="21.677244" font-weight="bold" fill="var(--ok-accent)">Process 2</text>
  <rect x="743.448276" y="128.220144" width="455.172414" height="103.236219" rx="6.80298" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="971.034372" y="188.284796" text-anchor="middle" font-size="17.735937" fill="var(--text)">Python Interpreter</text>
  <rect x="743.448276" y="252.103583" width="455.172414" height="103.236219" rx="6.80298" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="971.034372" y="312.168235" text-anchor="middle" font-size="17.735937" fill="var(--text)">Memory Space</text>
  <rect x="743.448276" y="375.987139" width="455.172414" height="103.236219" rx="6.80298" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.7778" />
  <text x="971.034372" y="436.051675" text-anchor="middle" font-size="17.735937" fill="var(--text)">Variables / Heap</text>
  <text x="971.034372" y="526.148828" text-anchor="middle" font-size="14.779929" fill="var(--danger-accent)">No shared memory with Process 1</text>
  <text x="971.034372" y="552.427194" text-anchor="middle" font-size="14.779929" fill="var(--text-muted)">Complete isolation - bypasses GIL</text>
  <line x1="640" y1="66.278365" x2="640" y2="591.844625" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 7.1111" />
  <text x="640" y="620" text-anchor="middle" font-size="15.765227" fill="var(--text-muted)">Threads share memory within a process; processes have separate memory spaces</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="295.7376" y="43.91877" text-anchor="middle" font-size="21.596658" font-weight="bold" fill="var(--primary-accent)">Concurrent (Threading)</text>
  <text x="295.7376" y="71.351256" text-anchor="middle" font-size="15.706619" fill="var(--text-muted)">Tasks interleaved on one CPU</text>
  <rect x="40" y="98.783742" width="511.47541" height="97.973025" rx="6.77769" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="295.7376" y="155.607916" text-anchor="middle" font-size="19.633387" fill="var(--text)">Task A</text>
  <rect x="40" y="216.351347" width="511.47541" height="97.973025" rx="6.77769" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="295.7376" y="273.175522" text-anchor="middle" font-size="19.633387" fill="var(--text)">Task B</text>
  <rect x="40" y="333.918831" width="511.47541" height="97.973025" rx="6.77769" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="295.7376" y="390.743127" text-anchor="middle" font-size="19.633387" fill="var(--text)">Task C</text>
  <text x="295.7376" y="510.270178" text-anchor="middle" font-size="15.706619" fill="var(--text-muted)">GIL allows only one thread at a time (for CPU work)</text>
  <text x="944.918033" y="43.91877" text-anchor="middle" font-size="21.596658" font-weight="bold" fill="var(--ok-accent)">Parallel (Multiprocessing)</text>
  <text x="944.918033" y="71.351256" text-anchor="middle" font-size="15.706619" fill="var(--text-muted)">Tasks run simultaneously on multiple CPUs</text>
  <rect x="689.180328" y="98.783742" width="157.377049" height="333.108114" rx="6.77769" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="767.868852" y="279.053859" text-anchor="middle" font-size="17.670003" fill="var(--text)">Task A</text>
  <rect x="885.901639" y="98.783742" width="157.377049" height="333.108114" rx="6.77769" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="964.590164" y="279.053859" text-anchor="middle" font-size="17.670003" fill="var(--text)">Task B</text>
  <rect x="1082.622951" y="98.783742" width="157.377049" height="333.108114" rx="6.77769" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1161.311475" y="279.053859" text-anchor="middle" font-size="17.670003" fill="var(--text)">Task C</text>
  <text x="944.918033" y="510.270178" text-anchor="middle" font-size="15.706619" fill="var(--text-muted)">Separate processes bypass the GIL</text>
  <line x1="610.491803" y1="40" x2="610.491803" y2="549.459339" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 7.1111" />
  <rect x="40" y="569.054042" width="1140.983607" height="50.945958" rx="6.77769" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="610.491803" y="600.405298" text-anchor="middle" font-size="16.688368" fill="var(--primary-accent)">Use threading for I/O-bound tasks, multiprocessing for CPU-bound tasks</text>
</svg>
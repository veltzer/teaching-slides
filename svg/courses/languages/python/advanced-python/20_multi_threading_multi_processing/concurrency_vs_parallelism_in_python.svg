<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="295.7376" y="43.91877" text-anchor="middle" font-size="21.596658" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Concurrent (Threading)</text>
  <text x="295.7376" y="71.351256" text-anchor="middle" font-size="15.706619" fill="var(--text-muted)" font-family="Arial, sans-serif">Tasks interleaved on one CPU</text>
  <rect x="40" y="98.783742" width="511.47541" height="97.973025" rx="6.77769" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="295.7376" y="155.607916" text-anchor="middle" font-size="19.633387" fill="var(--text)" font-family="Arial, sans-serif">Task A</text>
  <rect x="40" y="216.351347" width="511.47541" height="97.973025" rx="6.77769" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="295.7376" y="273.175522" text-anchor="middle" font-size="19.633387" fill="var(--text)" font-family="Arial, sans-serif">Task B</text>
  <rect x="40" y="333.918831" width="511.47541" height="97.973025" rx="6.77769" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="295.7376" y="390.743127" text-anchor="middle" font-size="19.633387" fill="var(--text)" font-family="Arial, sans-serif">Task C</text>
  <text x="295.7376" y="510.270178" text-anchor="middle" font-size="15.706619" fill="var(--text-muted)" font-family="Arial, sans-serif">GIL allows only one thread at a time (for CPU work)</text>
  <text x="944.918033" y="43.91877" text-anchor="middle" font-size="21.596658" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Parallel (Multiprocessing)</text>
  <text x="944.918033" y="71.351256" text-anchor="middle" font-size="15.706619" fill="var(--text-muted)" font-family="Arial, sans-serif">Tasks run simultaneously on multiple CPUs</text>
  <rect x="689.180328" y="98.783742" width="157.377049" height="333.108114" rx="6.77769" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="767.868852" y="279.053859" text-anchor="middle" font-size="17.670003" fill="var(--text)" font-family="Arial, sans-serif">Task A</text>
  <rect x="885.901639" y="98.783742" width="157.377049" height="333.108114" rx="6.77769" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="964.590164" y="279.053859" text-anchor="middle" font-size="17.670003" fill="var(--text)" font-family="Arial, sans-serif">Task B</text>
  <rect x="1082.622951" y="98.783742" width="157.377049" height="333.108114" rx="6.77769" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1161.311475" y="279.053859" text-anchor="middle" font-size="17.670003" fill="var(--text)" font-family="Arial, sans-serif">Task C</text>
  <text x="944.918033" y="510.270178" text-anchor="middle" font-size="15.706619" fill="var(--text-muted)" font-family="Arial, sans-serif">Separate processes bypass the GIL</text>
  <line x1="610.491803" y1="40" x2="610.491803" y2="549.459339" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 7.1111"/>
  <rect x="40" y="569.054042" width="1140.983607" height="50.945958" rx="6.77769" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="610.491803" y="600.405298" text-anchor="middle" font-size="16.688368" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use threading for I/O-bound tasks, multiprocessing for CPU-bound tasks</text>
</svg>

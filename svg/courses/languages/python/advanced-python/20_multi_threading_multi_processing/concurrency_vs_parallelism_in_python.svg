<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Left: Concurrent (Threading) -->
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Concurrent (Threading)</text>
  <text x="320" y="72" text-anchor="middle" font-size="16" fill="#555555">Tasks interleaved on one CPU</text>
  <rect x="60" y="100" width="520" height="100" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="320" y="158" text-anchor="middle" font-size="20" fill="#333333">Task A</text>
  <rect x="60" y="220" width="520" height="100" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="320" y="278" text-anchor="middle" font-size="20" fill="#333333">Task B</text>
  <rect x="60" y="340" width="520" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="320" y="398" text-anchor="middle" font-size="20" fill="#333333">Task C</text>
  <text x="320" y="520" text-anchor="middle" font-size="16" fill="#555555">GIL allows only one thread at a time (for CPU work)</text>
  <!-- Right: Parallel (Multiprocessing) -->
  <text x="980" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">Parallel (Multiprocessing)</text>
  <text x="980" y="72" text-anchor="middle" font-size="16" fill="#555555">Tasks run simultaneously on multiple CPUs</text>
  <rect x="720" y="100" width="160" height="340" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="800" y="284" text-anchor="middle" font-size="18" fill="#333333">Task A</text>
  <rect x="920" y="100" width="160" height="340" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1000" y="284" text-anchor="middle" font-size="18" fill="#333333">Task B</text>
  <rect x="1120" y="100" width="160" height="340" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1200" y="284" text-anchor="middle" font-size="18" fill="#333333">Task C</text>
  <text x="980" y="520" text-anchor="middle" font-size="16" fill="#555555">Separate processes bypass the GIL</text>
  <!-- Divider -->
  <line x1="640" y1="40" x2="640" y2="560" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="8 8"/>
  <!-- Bottom note -->
  <rect x="60" y="580" width="1160" height="52" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="612" text-anchor="middle" font-size="17" fill="#1565c0">Use threading for I/O-bound tasks, multiprocessing for CPU-bound tasks</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="71.1111" y="35.5556" width="995.5556" height="62.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="74.6667" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--bg)">Python Concurrency Models</text>
  <rect x="71.1111" y="124.4444" width="293.3333" height="177.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="217.7778" y="173.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--danger-accent)">Threading</text>
  <text x="217.7778" y="213.3333" text-anchor="middle" font-size="16" fill="var(--text)">Shared Memory</text>
  <text x="217.7778" y="240" text-anchor="middle" font-size="16" fill="var(--text)">Limited by GIL</text>
  <text x="217.7778" y="266.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">Good for I/O-bound</text>
  <rect x="422.2222" y="124.4444" width="293.3333" height="177.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="173.3333" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--ok-accent)">Multiprocessing</text>
  <text x="568.8889" y="213.3333" text-anchor="middle" font-size="16" fill="var(--text)">Separate Processes</text>
  <text x="568.8889" y="240" text-anchor="middle" font-size="16" fill="var(--text)">Bypasses GIL</text>
  <text x="568.8889" y="266.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">Good for CPU-bound</text>
  <rect x="773.3333" y="124.4444" width="293.3333" height="177.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="920" y="173.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text-muted)">Asyncio</text>
  <text x="920" y="213.3333" text-anchor="middle" font-size="16" fill="var(--text)">Cooperative</text>
  <text x="920" y="240" text-anchor="middle" font-size="16" fill="var(--text)">Event Loop Based</text>
  <text x="920" y="266.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">Good for many I/O</text>
  <rect x="244.4444" y="355.5556" width="648.8889" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="404.4444" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--primary-accent)">concurrent.futures</text>
  <text x="568.8889" y="440" text-anchor="middle" font-size="16" fill="var(--text-muted)">High-level unified interface for both threading and multiprocessing</text>
  <rect x="71.1111" y="497.7778" width="995.5556" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="527.1111" text-anchor="middle" font-size="16" fill="var(--primary-accent)" font-weight="bold">The GIL (Global Interpreter Lock)</text>
  <text x="568.8889" y="552.8889" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Mutex that protects Python internals - only one thread executes Python bytecode at a time</text>
</svg>
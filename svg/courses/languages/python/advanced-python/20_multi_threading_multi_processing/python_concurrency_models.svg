<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="67.666699" rx="7.026481" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="82.533292" text-anchor="middle" font-size="24.424752" font-weight="bold" fill="var(--bg)">Python Concurrency Models</text>
  <rect x="40" y="136.666507" width="353.571429" height="193.333373" rx="7.026481" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="216.785714" y="189.833241" text-anchor="middle" font-size="26.460207" font-weight="bold" fill="var(--danger-accent)">Threading</text>
  <text x="216.785714" y="233.333253" text-anchor="middle" font-size="18.318623" fill="var(--text)">Shared Memory</text>
  <text x="216.785714" y="262.333301" text-anchor="middle" font-size="18.318623" fill="var(--text)">Limited by GIL</text>
  <text x="216.785714" y="291.333349" text-anchor="middle" font-size="18.318623" fill="var(--text-muted)">Good for I/O-bound</text>
  <rect x="463.214286" y="136.666507" width="353.571429" height="193.333373" rx="7.026481" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="189.833241" text-anchor="middle" font-size="22.389415" font-weight="bold" fill="var(--ok-accent)">Multiprocessing</text>
  <text x="640" y="233.333253" text-anchor="middle" font-size="18.318623" fill="var(--text)">Separate Processes</text>
  <text x="640" y="262.333301" text-anchor="middle" font-size="18.318623" fill="var(--text)">Bypasses GIL</text>
  <text x="640" y="291.333349" text-anchor="middle" font-size="18.318623" fill="var(--text-muted)">Good for CPU-bound</text>
  <rect x="886.428457" y="136.666507" width="353.571429" height="193.333373" rx="7.026481" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1063.214286" y="189.833241" text-anchor="middle" font-size="26.460207" font-weight="bold" fill="var(--text-muted)">Asyncio</text>
  <text x="1063.214286" y="233.333253" text-anchor="middle" font-size="18.318623" fill="var(--text)">Cooperative</text>
  <text x="1063.214286" y="262.333301" text-anchor="middle" font-size="18.318623" fill="var(--text)">Event Loop Based</text>
  <text x="1063.214286" y="291.333349" text-anchor="middle" font-size="18.318623" fill="var(--text-muted)">Good for many I/O</text>
  <rect x="248.928457" y="388.000096" width="782.142857" height="116.000072" rx="7.026481" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="441.166591" text-anchor="middle" font-size="26.460207" font-weight="bold" fill="var(--primary-accent)">concurrent.futures</text>
  <text x="640" y="479.833361" text-anchor="middle" font-size="18.318623" fill="var(--text-muted)">High-level unified interface for both threading and multiprocessing</text>
  <rect x="40" y="542.666699" width="1200" height="77.333301" rx="7.026481" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="574.566667" text-anchor="middle" font-size="18.318623" fill="var(--primary-accent)" font-weight="bold">The GIL (Global Interpreter Lock)</text>
  <text x="640" y="602.600115" text-anchor="middle" font-size="16.283168" fill="var(--text-muted)">Mutex that protects Python internals - only one thread executes Python bytecode at a time</text>
</svg>
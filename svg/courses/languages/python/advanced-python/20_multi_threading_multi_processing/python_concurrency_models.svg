<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="67.666699" rx="7.026481" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="82.533292" text-anchor="middle" font-size="24.424752" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Python Concurrency Models</text>
  <rect x="40" y="136.666507" width="353.571429" height="193.333373" rx="7.026481" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="216.785714" y="189.833241" text-anchor="middle" font-size="26.460207" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Threading</text>
  <text x="216.785714" y="233.333253" text-anchor="middle" font-size="18.318623" fill="var(--text)" font-family="Arial, sans-serif">Shared Memory</text>
  <text x="216.785714" y="262.333301" text-anchor="middle" font-size="18.318623" fill="var(--text)" font-family="Arial, sans-serif">Limited by GIL</text>
  <text x="216.785714" y="291.333349" text-anchor="middle" font-size="18.318623" fill="var(--text-muted)" font-family="Arial, sans-serif">Good for I/O-bound</text>
  <rect x="463.214286" y="136.666507" width="353.571429" height="193.333373" rx="7.026481" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="189.833241" text-anchor="middle" font-size="22.389415" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Multiprocessing</text>
  <text x="640" y="233.333253" text-anchor="middle" font-size="18.318623" fill="var(--text)" font-family="Arial, sans-serif">Separate Processes</text>
  <text x="640" y="262.333301" text-anchor="middle" font-size="18.318623" fill="var(--text)" font-family="Arial, sans-serif">Bypasses GIL</text>
  <text x="640" y="291.333349" text-anchor="middle" font-size="18.318623" fill="var(--text-muted)" font-family="Arial, sans-serif">Good for CPU-bound</text>
  <rect x="886.428457" y="136.666507" width="353.571429" height="193.333373" rx="7.026481" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.214286" y="189.833241" text-anchor="middle" font-size="26.460207" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Asyncio</text>
  <text x="1063.214286" y="233.333253" text-anchor="middle" font-size="18.318623" fill="var(--text)" font-family="Arial, sans-serif">Cooperative</text>
  <text x="1063.214286" y="262.333301" text-anchor="middle" font-size="18.318623" fill="var(--text)" font-family="Arial, sans-serif">Event Loop Based</text>
  <text x="1063.214286" y="291.333349" text-anchor="middle" font-size="18.318623" fill="var(--text-muted)" font-family="Arial, sans-serif">Good for many I/O</text>
  <rect x="248.928457" y="388.000096" width="782.142857" height="116.000072" rx="7.026481" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="441.166591" text-anchor="middle" font-size="26.460207" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">concurrent.futures</text>
  <text x="640" y="479.833361" text-anchor="middle" font-size="18.318623" fill="var(--text-muted)" font-family="Arial, sans-serif">High-level unified interface for both threading and multiprocessing</text>
  <rect x="40" y="542.666699" width="1200" height="77.333301" rx="7.026481" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="574.566667" text-anchor="middle" font-size="18.318623" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">The GIL (Global Interpreter Lock)</text>
  <text x="640" y="602.600115" text-anchor="middle" font-size="16.283168" fill="var(--text-muted)" font-family="Arial, sans-serif">Mutex that protects Python internals - only one thread executes Python bytecode at a time</text>
</svg>

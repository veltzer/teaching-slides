<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="71.1111" y="35.5556" width="995.5556" height="62.2222" rx="7.1111" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="74.6667" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#ffffff">Python Concurrency Models</ns0:text>
  <ns0:rect x="71.1111" y="124.4444" width="293.3333" height="177.7778" rx="8.8889" fill="#fce4ec" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="217.7778" y="173.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#c62828">Threading</ns0:text>
  <ns0:text x="217.7778" y="213.3333" text-anchor="middle" font-size="16" fill="#333333">Shared Memory</ns0:text>
  <ns0:text x="217.7778" y="240" text-anchor="middle" font-size="16" fill="#333333">Limited by GIL</ns0:text>
  <ns0:text x="217.7778" y="266.6667" text-anchor="middle" font-size="16" fill="#555555">Good for I/O-bound</ns0:text>
  <ns0:rect x="422.2222" y="124.4444" width="293.3333" height="177.7778" rx="8.8889" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="173.3333" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#2e7d32">Multiprocessing</ns0:text>
  <ns0:text x="568.8889" y="213.3333" text-anchor="middle" font-size="16" fill="#333333">Separate Processes</ns0:text>
  <ns0:text x="568.8889" y="240" text-anchor="middle" font-size="16" fill="#333333">Bypasses GIL</ns0:text>
  <ns0:text x="568.8889" y="266.6667" text-anchor="middle" font-size="16" fill="#555555">Good for CPU-bound</ns0:text>
  <ns0:rect x="773.3333" y="124.4444" width="293.3333" height="177.7778" rx="8.8889" fill="#fff9c4" stroke="#f9a825" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="920" y="173.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#795548">Asyncio</ns0:text>
  <ns0:text x="920" y="213.3333" text-anchor="middle" font-size="16" fill="#333333">Cooperative</ns0:text>
  <ns0:text x="920" y="240" text-anchor="middle" font-size="16" fill="#333333">Event Loop Based</ns0:text>
  <ns0:text x="920" y="266.6667" text-anchor="middle" font-size="16" fill="#555555">Good for many I/O</ns0:text>
  <ns0:rect x="244.4444" y="355.5556" width="648.8889" height="106.6667" rx="8.8889" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="404.4444" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#1565c0">concurrent.futures</ns0:text>
  <ns0:text x="568.8889" y="440" text-anchor="middle" font-size="16" fill="#555555">High-level unified interface for both threading and multiprocessing</ns0:text>
  <ns0:rect x="71.1111" y="497.7778" width="995.5556" height="71.1111" rx="5.3333" fill="#f2f6ff" stroke="#bbdefb" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="527.1111" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">The GIL (Global Interpreter Lock)</ns0:text>
  <ns0:text x="568.8889" y="552.8889" text-anchor="middle" font-size="14.2222" fill="#555555">Mutex that protects Python internals - only one thread executes Python bytecode at a time</ns0:text>
</ns0:svg>
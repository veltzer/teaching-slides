<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="73.8333" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--primary-accent)">Thread Lifecycle in Python</text>
  <rect x="115" y="201.1112" width="187.5" height="96.6666" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="208.75" y="255.8889" text-anchor="middle" font-size="20.8566" fill="var(--text)">New</text>
  <rect x="415" y="201.1112" width="187.5" height="96.6666" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="508.75" y="255.8889" text-anchor="middle" font-size="20.8566" fill="var(--text)">Runnable</text>
  <rect x="715" y="201.1112" width="187.5" height="96.6666" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="808.75" y="255.8889" text-anchor="middle" font-size="20.8566" fill="var(--text)">Running</text>
  <rect x="715" y="394.4444" width="187.5" height="96.6666" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="808.75" y="449.2222" text-anchor="middle" font-size="20.8566" fill="var(--text)">Blocked</text>
  <rect x="415" y="394.4444" width="187.5" height="96.6666" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="508.75" y="449.2222" text-anchor="middle" font-size="20.8566" fill="var(--text)">Terminated</text>
  <line x1="302.5" y1="249.4444" x2="415" y2="249.4444" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)" />
  <text x="358.7501" y="238.1667" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">start()</text>
  <line x1="602.5" y1="249.4444" x2="715" y2="249.4444" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)" />
  <line x1="808.75" y1="297.7778" x2="808.75" y2="394.4444" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)" />
  <text x="855.625" y="354.1666" font-size="13.9044" fill="var(--text-muted)">I/O, sleep()</text>
  <line x1="715" y1="442.7778" x2="602.5" y2="442.7778" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)" />
  <text x="656.875" y="433.1111" font-size="13.9044" fill="var(--text-muted)">return</text>
  <path d="M 808.75 394.4444 C 808.75 338.0556 715 249.4444 715 249.4444" fill="none" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)" />
  <text x="640" y="571.6667" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">A thread transitions through these states during its lifetime</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="285.714286" height="151.304265465005" rx="9.266249162624" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.857143" y="125.739021426094" text-anchor="middle" font-size="32.210407966587" fill="var(--text)" font-family="Arial, sans-serif">New</text>
  <rect x="497.142857" y="40" width="285.714286" height="151.304265465005" rx="9.266249162624" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.739021426094" text-anchor="middle" font-size="32.210407966587" fill="var(--text)" font-family="Arial, sans-serif">Runnable</text>
  <rect x="954.285714" y="40" width="285.714286" height="151.304265465005" rx="9.266249162624" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097.142857" y="125.739021426094" text-anchor="middle" font-size="32.210407966587" fill="var(--text)" font-family="Arial, sans-serif">Running</text>
  <rect x="954.285714" y="342.608532273489" width="285.714286" height="151.304265465005" rx="9.266249162624" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097.142857" y="428.347710886584" text-anchor="middle" font-size="32.210407966587" fill="var(--text)" font-family="Arial, sans-serif">Blocked</text>
  <rect x="497.142857" y="342.608532273489" width="285.714286" height="151.304265465005" rx="9.266249162624" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="428.347710886584" text-anchor="middle" font-size="32.210407966587" fill="var(--text)" font-family="Arial, sans-serif">Terminated</text>
  <line x1="325.714286" y1="115.65197688898" x2="497.142857" y2="115.65197688898" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)"/>
  <text x="411.428724" y="97.999922346935" text-anchor="middle" font-size="21.473605311058" fill="var(--text-muted)" font-family="Arial, sans-serif">start()</text>
  <line x1="782.857143" y1="115.65197688898" x2="954.285714" y2="115.65197688898" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)"/>
  <line x1="1097.142857" y1="191.304266808484" x2="1097.142857" y2="342.608532273489" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)"/>
  <text x="1168.571429" y="279.565009736236" font-size="21.473605311058" fill="var(--text-muted)" font-family="Arial, sans-serif">I/O, sleep()</text>
  <line x1="954.285714" y1="418.260822192992" x2="782.857143" y2="418.260822192992" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)"/>
  <text x="865.714286" y="403.130333309083" font-size="21.473605311058" fill="var(--text-muted)" font-family="Arial, sans-serif">return</text>
  <path d="M 1097.142857 342.608532273489 C 1097.142857 254.347789345736 954.285714 115.65197688898 954.285714 115.65197688898" fill="none" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)"/>
  <text x="840" y="620" text-anchor="middle" font-size="21.473605311058" fill="var(--text-muted)" font-family="Arial, sans-serif">A thread transitions through these states during its lifetime</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="999.0244" height="561.9512" fill="var(--bg)" rx="6"/>
  <text x="499.5122" y="32.7805" text-anchor="middle" font-size="20.2927" font-weight="bold" fill="var(--primary-accent)">Thread Lifecycle in Python</text>
  <rect x="62.439" y="156.0976" width="156.0976" height="93.6585" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="140.4878" y="209.1707" text-anchor="middle" font-size="18.7317" fill="var(--text)">New</text>
  <rect x="312.1951" y="156.0976" width="156.0976" height="93.6585" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="390.2439" y="209.1707" text-anchor="middle" font-size="18.7317" fill="var(--text)">Runnable</text>
  <rect x="561.9512" y="156.0976" width="156.0976" height="93.6585" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="209.1707" text-anchor="middle" font-size="18.7317" fill="var(--text)">Running</text>
  <rect x="561.9512" y="343.4146" width="156.0976" height="93.6585" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="396.4878" text-anchor="middle" font-size="18.7317" fill="var(--text)">Blocked</text>
  <rect x="312.1951" y="343.4146" width="156.0976" height="93.6585" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="390.2439" y="396.4878" text-anchor="middle" font-size="18.7317" fill="var(--text)">Terminated</text>
  <line x1="218.5366" y1="202.9268" x2="312.1951" y2="202.9268" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)" />
  <text x="265.3659" y="192" text-anchor="middle" font-size="12.4878" fill="var(--text-muted)">start()</text>
  <line x1="468.2927" y1="202.9268" x2="561.9512" y2="202.9268" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)" />
  <line x1="640" y1="249.7561" x2="640" y2="343.4146" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)" />
  <text x="679.0244" y="304.3902" font-size="12.4878" fill="var(--text-muted)">I/O, sleep()</text>
  <line x1="561.9512" y1="390.2439" x2="468.2927" y2="390.2439" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)" />
  <text x="513.561" y="380.878" font-size="12.4878" fill="var(--text-muted)">return</text>
  <path d="M 640 343.4146 C 640 288.7805 561.9512 202.9268 561.9512 202.9268" fill="none" stroke="var(--text-muted)" stroke-width="1.9512" marker-end="url(#arrow)" />
  <text x="499.5122" y="515.122" text-anchor="middle" font-size="12.4878" fill="var(--text-muted)">A thread transitions through these states during its lifetime</text>
</svg>
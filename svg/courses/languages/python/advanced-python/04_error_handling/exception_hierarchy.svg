<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Helper line drawing macros via paths -->

  <!-- BaseException (root) -->
  <rect x="499.375" y="58.125" width="281.25" height="43.5" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="85.3125" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">BaseException</text>

  <!-- Lines from BaseException to its children -->
  <!-- to SystemExit -->
  <line x1="499.375" y1="79.875" x2="185.3125" y2="137.875" stroke="var(--info-border)" stroke-width="1.8"/>
  <!-- to KeyboardInterrupt -->
  <line x1="541.5625" y1="101.625" x2="452.5" y2="137.875" stroke="var(--info-border)" stroke-width="1.8"/>
  <!-- to GeneratorExit -->
  <line x1="700.9375" y1="101.625" x2="724.375" y2="137.875" stroke="var(--info-border)" stroke-width="1.8"/>
  <!-- to Exception -->
  <line x1="780.625" y1="79.875" x2="1033.75" y2="137.875" stroke="var(--info-border)" stroke-width="1.8"/>

  <!-- SystemExit -->
  <rect x="96.25" y="137.875" width="178.125" height="36.25" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="185.3125" y="160.5312" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--bg)" text-anchor="middle" font-weight="bold">SystemExit</text>

  <!-- KeyboardInterrupt -->
  <rect x="330.625" y="137.875" width="187.5" height="36.25" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="424.375" y="160.5312" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--bg)" text-anchor="middle" font-weight="bold">KeyboardInterrupt</text>

  <!-- GeneratorExit -->
  <rect x="611.875" y="137.875" width="178.125" height="36.25" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="700.9375" y="160.5312" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--bg)" text-anchor="middle" font-weight="bold">GeneratorExit</text>

  <!-- Exception -->
  <rect x="893.125" y="137.875" width="281.25" height="43.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1033.75" y="165.0625" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">Exception</text>
  <text x="1033.75" y="180.4688" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle">(most custom exceptions inherit from here)</text>

  <!-- Lines from Exception to children -->
  <!-- ArithmeticError -->
  <line x1="949.375" y1="181.375" x2="640" y2="237.5625" stroke="var(--primary-border)" stroke-width="1.8"/>
  <!-- LookupError -->
  <line x1="977.5" y1="181.375" x2="865" y2="237.5625" stroke="var(--primary-border)" stroke-width="1.8"/>
  <!-- ValueError -->
  <line x1="1033.75" y1="181.375" x2="1033.75" y2="237.5625" stroke="var(--primary-border)" stroke-width="1.8"/>
  <!-- TypeError -->
  <line x1="1090" y1="181.375" x2="1174.375" y2="237.5625" stroke="var(--primary-border)" stroke-width="1.8"/>
  <!-- AttributeError -->

  <!-- ArithmeticError -->
  <rect x="522.8125" y="237.5625" width="187.5" height="36.25" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="616.5625" y="260.2188" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--bg)" text-anchor="middle" font-weight="bold">ArithmeticError</text>

  <!-- LookupError -->
  <rect x="752.5" y="237.5625" width="168.75" height="36.25" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="836.875" y="260.2188" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--bg)" text-anchor="middle" font-weight="bold">LookupError</text>

  <!-- ValueError -->
  <rect x="949.375" y="237.5625" width="159.375" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1029.0625" y="260.2188" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">ValueError</text>

  <!-- TypeError -->
  <rect x="1132.1875" y="237.5625" width="84.375" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1174.375" y="260.2188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">TypeError</text>

  <!-- Lines from ArithmeticError to children -->
  <line x1="565" y1="273.8125" x2="490" y2="328.1875" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="616.5625" y1="273.8125" x2="616.5625" y2="328.1875" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="677.5" y1="273.8125" x2="761.875" y2="328.1875" stroke="var(--ok-border)" stroke-width="1.5"/>

  <!-- ZeroDivisionError -->
  <rect x="358.75" y="328.1875" width="196.875" height="32.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="457.1875" y="349.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">ZeroDivisionError</text>

  <!-- OverflowError -->
  <rect x="560.3125" y="328.1875" width="121.875" height="32.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="621.25" y="349.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">OverflowError</text>

  <!-- FloatingPointError -->
  <rect x="696.25" y="328.1875" width="164.0625" height="32.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="777.8125" y="349.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">FloatingPointError</text>

  <!-- Lines from LookupError to children -->
  <line x1="808.75" y1="273.8125" x2="865" y2="328.1875" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="865" y1="273.8125" x2="977.5" y2="328.1875" stroke="var(--ok-border)" stroke-width="1.5"/>

  <!-- IndexError -->
  <rect x="799.375" y="328.1875" width="121.875" height="32.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="860.3125" y="349.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">IndexError</text>

  <!-- KeyError -->
  <rect x="930.625" y="328.1875" width="112.5" height="32.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="986.875" y="349.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--ok-accent)" text-anchor="middle">KeyError</text>

  <!-- Extra direct Exception subclasses -->
  <!-- ImportError -->
  <rect x="77.5" y="237.5625" width="135.9375" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145" y="260.2188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">ImportError</text>
  <line x1="921.25" y1="181.375" x2="145" y2="237.5625" stroke="var(--primary-border)" stroke-width="1.3" stroke-dasharray="5,3"/>

  <!-- AttributeError -->
  <rect x="227.5" y="237.5625" width="150" height="36.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302.5" y="260.2188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">AttributeError</text>
  <line x1="925.9375" y1="181.375" x2="302.5" y2="237.5625" stroke="var(--primary-border)" stroke-width="1.3" stroke-dasharray="5,3"/>

  <!-- IOError/OSError -->
  <rect x="1057.1875" y="328.1875" width="135.9375" height="32.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1124.6875" y="349.0312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" text-anchor="middle">OSError / IOError</text>
  <line x1="1033.75" y1="273.8125" x2="1124.6875" y2="328.1875" stroke="var(--primary-border)" stroke-width="1.3" stroke-dasharray="5,3"/>

  <!-- FileNotFoundError under OSError -->
  <line x1="1124.6875" y1="360.8125" x2="1124.6875" y2="406.125" stroke="var(--primary-border)" stroke-width="1.3"/>
  <rect x="1057.1875" y="406.125" width="164.0625" height="32.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1138.75" y="426.9688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">FileNotFoundError</text>

  <!-- Custom exception example -->
  <rect x="77.5" y="438.75" width="825" height="117.8125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="490" y="464.125" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Building a Custom Exception Hierarchy</text>
  <text x="115" y="487.6875" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)">class AppError(Exception): pass</text>
  <text x="115" y="507.625" font-family="monospace" font-size="12.9044" fill="var(--ok-accent)">class DatabaseError(AppError): pass</text>
  <text x="115" y="527.5625" font-family="monospace" font-size="12.9044" fill="var(--warn-accent)">class ConnectionError(DatabaseError): pass</text>
  <text x="115" y="547.5" font-family="monospace" font-size="12.9044" fill="var(--warn-accent)">class QueryError(DatabaseError): pass</text>

  <!-- Legend -->
  <rect x="940" y="438.75" width="262.5" height="117.8125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1071.25" y="461.4062" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text)" text-anchor="middle">Legend</text>
  <rect x="954.0625" y="473.1875" width="18.75" height="12.6875" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="982.1875" y="484.9688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Root — BaseException</text>
  <rect x="954.0625" y="494.9375" width="18.75" height="12.6875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="982.1875" y="506.7188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">System-level signals</text>
  <rect x="954.0625" y="516.6875" width="18.75" height="12.6875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="982.1875" y="528.4688" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Exception (catch-all)</text>
  <rect x="954.0625" y="538.4375" width="18.75" height="12.6875" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="982.1875" y="550.2188" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)">Mid-level categories</text>
</svg>

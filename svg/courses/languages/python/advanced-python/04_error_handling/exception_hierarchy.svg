<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <!-- Helper line drawing macros via paths -->

  <!-- BaseException (root) -->
  <rect x="482.622951" y="40" width="295.081967" height="50.618182" rx="6.629564" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.163934" y="71.636364" font-family="Arial, sans-serif" font-size="20.369225" font-weight="bold" fill="var(--bg)" text-anchor="middle">BaseException</text>

  <!-- Lines from BaseException to its children -->
  <!-- to SystemExit -->
  <line x1="482.622951" y1="65.309091" x2="153.114754" y2="132.8" stroke="var(--info-border)" stroke-width="1.8"/>
  <!-- to KeyboardInterrupt -->
  <line x1="526.885246" y1="90.618182" x2="433.442623" y2="132.8" stroke="var(--info-border)" stroke-width="1.8"/>
  <!-- to GeneratorExit -->
  <line x1="694.098361" y1="90.618182" x2="718.688525" y2="132.8" stroke="var(--info-border)" stroke-width="1.8"/>
  <!-- to Exception -->
  <line x1="777.704918" y1="65.309091" x2="1043.278689" y2="132.8" stroke="var(--info-border)" stroke-width="1.8"/>

  <!-- SystemExit -->
  <rect x="59.672131" y="132.8" width="186.885246" height="42.181818" rx="6.629564" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.114754" y="159.163578" font-family="Arial, sans-serif" font-size="15.276836" fill="var(--bg)" text-anchor="middle" font-weight="bold">SystemExit</text>

  <!-- KeyboardInterrupt -->
  <rect x="305.57377" y="132.8" width="196.721311" height="42.181818" rx="6.629564" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="403.934426" y="159.163578" font-family="Arial, sans-serif" font-size="15.276836" fill="var(--bg)" text-anchor="middle" font-weight="bold">KeyboardInterrupt</text>

  <!-- GeneratorExit -->
  <rect x="600.655738" y="132.8" width="186.885246" height="42.181818" rx="6.629564" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="694.098361" y="159.163578" font-family="Arial, sans-serif" font-size="15.276836" fill="var(--bg)" text-anchor="middle" font-weight="bold">GeneratorExit</text>

  <!-- Exception -->
  <rect x="895.737705" y="132.8" width="295.081967" height="50.618182" rx="6.629564" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.278689" y="164.436364" font-family="Arial, sans-serif" font-size="20.369225" font-weight="bold" fill="var(--bg)" text-anchor="middle">Exception</text>
  <text x="1043.278689" y="182.363695" font-family="Arial, sans-serif" font-size="12.221491" fill="var(--primary-accent)" text-anchor="middle">(most custom exceptions inherit from here)</text>

  <!-- Lines from Exception to children -->
  <!-- ArithmeticError -->
  <line x1="954.754098" y1="183.418182" x2="630.163934" y2="248.8" stroke="var(--primary-border)" stroke-width="1.8"/>
  <!-- LookupError -->
  <line x1="984.262295" y1="183.418182" x2="866.229508" y2="248.8" stroke="var(--primary-border)" stroke-width="1.8"/>
  <!-- ValueError -->
  <line x1="1043.278689" y1="183.418182" x2="1043.278689" y2="248.8" stroke="var(--primary-border)" stroke-width="1.8"/>
  <!-- TypeError -->
  <line x1="1102.295082" y1="183.418182" x2="1190.819672" y2="248.8" stroke="var(--primary-border)" stroke-width="1.8"/>
  <!-- AttributeError -->

  <!-- ArithmeticError -->
  <rect x="507.213115" y="248.8" width="196.721311" height="42.181818" rx="6.629564" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="605.57377" y="275.163695" font-family="Arial, sans-serif" font-size="15.276836" fill="var(--bg)" text-anchor="middle" font-weight="bold">ArithmeticError</text>

  <!-- LookupError -->
  <rect x="748.196721" y="248.8" width="177.04918" height="42.181818" rx="6.629564" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="836.721311" y="275.163695" font-family="Arial, sans-serif" font-size="15.276836" fill="var(--bg)" text-anchor="middle" font-weight="bold">LookupError</text>

  <!-- ValueError -->
  <rect x="954.754098" y="248.8" width="167.213115" height="42.181818" rx="6.629564" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1038.360656" y="275.163695" font-family="Arial, sans-serif" font-size="15.276836" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">ValueError</text>

  <!-- TypeError -->
  <rect x="1146.557377" y="248.8" width="88.52459" height="42.181818" rx="6.629564" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1190.819672" y="275.163695" font-family="Arial, sans-serif" font-size="14.258424" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">TypeError</text>

  <!-- Lines from ArithmeticError to children -->
  <line x1="551.47541" y1="290.981818" x2="472.786885" y2="354.254545" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="605.57377" y1="290.981818" x2="605.57377" y2="354.254545" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="669.508197" y1="290.981818" x2="758.032787" y2="354.254545" stroke="var(--ok-border)" stroke-width="1.5"/>

  <!-- ZeroDivisionError -->
  <rect x="335.081967" y="354.254545" width="206.557377" height="37.963636" rx="6.629564" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="438.360656" y="378.509033" font-family="Arial, sans-serif" font-size="14.258424" fill="var(--ok-accent)" text-anchor="middle">ZeroDivisionError</text>

  <!-- OverflowError -->
  <rect x="546.557377" y="354.254545" width="127.868852" height="37.963636" rx="6.629564" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="610.491803" y="378.509033" font-family="Arial, sans-serif" font-size="14.258424" fill="var(--ok-accent)" text-anchor="middle">OverflowError</text>

  <!-- FloatingPointError -->
  <rect x="689.180328" y="354.254545" width="172.131148" height="37.963636" rx="6.629564" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="774.754098" y="378.509033" font-family="Arial, sans-serif" font-size="14.258424" fill="var(--ok-accent)" text-anchor="middle">FloatingPointError</text>

  <!-- Lines from LookupError to children -->
  <line x1="807.213115" y1="290.981818" x2="866.229508" y2="354.254545" stroke="var(--ok-border)" stroke-width="1.5"/>
  <line x1="866.229508" y1="290.981818" x2="984.262295" y2="354.254545" stroke="var(--ok-border)" stroke-width="1.5"/>

  <!-- IndexError -->
  <rect x="797.377049" y="354.254545" width="127.868852" height="37.963636" rx="6.629564" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="861.311475" y="378.509033" font-family="Arial, sans-serif" font-size="14.258424" fill="var(--ok-accent)" text-anchor="middle">IndexError</text>

  <!-- KeyError -->
  <rect x="935.081967" y="354.254545" width="118.032787" height="37.963636" rx="6.629564" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="994.098361" y="378.509033" font-family="Arial, sans-serif" font-size="14.258424" fill="var(--ok-accent)" text-anchor="middle">KeyError</text>

  <!-- Extra direct Exception subclasses -->
  <!-- ImportError -->
  <rect x="40" y="248.8" width="142.622951" height="42.181818" rx="6.629564" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="110.819672" y="275.163695" font-family="Arial, sans-serif" font-size="14.258424" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">ImportError</text>
  <line x1="925.245902" y1="183.418182" x2="110.819672" y2="248.8" stroke="var(--primary-border)" stroke-width="1.3" stroke-dasharray="5,3"/>

  <!-- AttributeError -->
  <rect x="197.377049" y="248.8" width="157.377049" height="42.181818" rx="6.629564" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="276.065574" y="275.163695" font-family="Arial, sans-serif" font-size="14.258424" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">AttributeError</text>
  <line x1="930.163934" y1="183.418182" x2="276.065574" y2="248.8" stroke="var(--primary-border)" stroke-width="1.3" stroke-dasharray="5,3"/>

  <!-- IOError/OSError -->
  <rect x="1067.868852" y="354.254545" width="142.622951" height="37.963636" rx="6.629564" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1138.688525" y="378.509033" font-family="Arial, sans-serif" font-size="14.258424" fill="var(--primary-accent)" text-anchor="middle">OSError / IOError</text>
  <line x1="1043.278689" y1="290.981818" x2="1138.688525" y2="354.254545" stroke="var(--primary-border)" stroke-width="1.3" stroke-dasharray="5,3"/>

  <!-- FileNotFoundError under OSError -->
  <line x1="1138.688525" y1="392.218182" x2="1138.688525" y2="444.945455" stroke="var(--primary-border)" stroke-width="1.3"/>
  <rect x="1067.868852" y="444.945455" width="172.131148" height="37.963636" rx="6.629564" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1153.442623" y="469.200058" font-family="Arial, sans-serif" font-size="13.240013" fill="var(--primary-accent)" text-anchor="middle">FileNotFoundError</text>

  <!-- Custom exception example -->
  <rect x="40" y="482.909091" width="865.57377" height="137.090909" rx="6.629564" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="472.786885" y="512.436364" font-family="Arial, sans-serif" font-size="16.295358" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Building a Custom Exception Hierarchy</text>
  <text x="79.344262" y="539.854545" font-size="14.258424" fill="var(--primary-accent)" font-family="Courier New, monospace">class AppError(Exception): pass</text>
  <text x="79.344262" y="563.054545" font-size="14.258424" fill="var(--ok-accent)" font-family="Courier New, monospace">class DatabaseError(AppError): pass</text>
  <text x="79.344262" y="586.254545" font-size="14.258424" fill="var(--warn-accent)" font-family="Courier New, monospace">class ConnectionError(DatabaseError): pass</text>
  <text x="79.344262" y="609.454545" font-size="14.258424" fill="var(--warn-accent)" font-family="Courier New, monospace">class QueryError(DatabaseError): pass</text>

  <!-- Legend -->
  <rect x="944.918033" y="482.909091" width="275.409836" height="137.090909" rx="6.629564" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1082.622951" y="509.272669" font-family="Arial, sans-serif" font-size="15.276836" font-weight="bold" fill="var(--text)" text-anchor="middle">Legend</text>
  <rect x="959.672131" y="522.981818" width="19.672131" height="14.763636" rx="6.629564" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="989.180328" y="536.690967" font-family="Arial, sans-serif" font-size="13.240013" fill="var(--text-muted)">Root — BaseException</text>
  <rect x="959.672131" y="548.290909" width="19.672131" height="14.763636" rx="6.629564" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="989.180328" y="562.000058" font-family="Arial, sans-serif" font-size="13.240013" fill="var(--text-muted)">System-level signals</text>
  <rect x="959.672131" y="573.6" width="19.672131" height="14.763636" rx="6.629564" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="989.180328" y="587.309149" font-family="Arial, sans-serif" font-size="13.240013" fill="var(--text-muted)">Exception (catch-all)</text>
  <rect x="959.672131" y="598.909091" width="19.672131" height="14.763636" rx="6.629564" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="989.180328" y="612.61824" font-family="Arial, sans-serif" font-size="13.240013" fill="var(--text-muted)">Mid-level categories</text>
</svg>

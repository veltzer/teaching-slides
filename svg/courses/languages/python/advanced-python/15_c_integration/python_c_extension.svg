<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Python-C Integration Methods</text>

  <!-- Method 1: ctypes -->
  <rect x="30" y="75" width="370" height="300" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="370" height="38" rx="8" fill="url(#grad-primary)"/>
  <text x="215" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">ctypes (stdlib)</text>
  <text x="50" y="128" font-family="Arial, sans-serif" font-size="13" fill="#333333">Load shared libraries directly:</text>
  <rect x="40" y="136" width="350" height="155" rx="4" fill="#1a1a2e"/>
  <text x="55" y="158" font-family="monospace" font-size="12" fill="#e1bee7">from ctypes import cdll, c_int</text>
  <text x="55" y="178" font-family="monospace" font-size="12" fill="#bbdefb">lib = cdll.LoadLibrary("./mylib.so")</text>
  <text x="55" y="198" font-family="monospace" font-size="12" fill="#bbdefb">lib.add.restype = c_int</text>
  <text x="55" y="218" font-family="monospace" font-size="12" fill="#bbdefb">lib.add.argtypes = [c_int, c_int]</text>
  <text x="55" y="242" font-family="monospace" font-size="12" fill="#a5d6a7">result = lib.add(3, 4)  # 7</text>
  <text x="55" y="275" font-family="monospace" font-size="12" fill="#777777"># No compilation step required</text>
  <text x="50" y="305" font-family="Arial, sans-serif" font-size="13" fill="#333333">Pros: no compile, stdlib, works with any .so</text>
  <text x="50" y="325" font-family="Arial, sans-serif" font-size="13" fill="#333333">Cons: manual type mapping, error-prone</text>
  <text x="50" y="345" font-family="Arial, sans-serif" font-size="13" fill="#333333">Best for: quick .so calls, legacy libraries</text>
  <text x="50" y="363" font-family="Arial, sans-serif" font-size="12" fill="#888888">Use: ctypes.POINTER, Structure for structs</text>

  <!-- Method 2: cffi -->
  <rect x="420" y="75" width="370" height="300" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="75" width="370" height="38" rx="8" fill="url(#grad-ok)"/>
  <text x="605" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">cffi (C Foreign Function Interface)</text>
  <text x="440" y="128" font-family="Arial, sans-serif" font-size="13" fill="#333333">Declare C API in Python:</text>
  <rect x="430" y="136" width="350" height="155" rx="4" fill="#1a1a2e"/>
  <text x="445" y="158" font-family="monospace" font-size="12" fill="#e1bee7">from cffi import FFI</text>
  <text x="445" y="178" font-family="monospace" font-size="12" fill="#bbdefb">ffi = FFI()</text>
  <text x="445" y="198" font-family="monospace" font-size="12" fill="#bbdefb">ffi.cdef("int add(int a, int b);")</text>
  <text x="445" y="218" font-family="monospace" font-size="12" fill="#bbdefb">lib = ffi.dlopen("./mylib.so")</text>
  <text x="445" y="242" font-family="monospace" font-size="12" fill="#a5d6a7">result = lib.add(3, 4)</text>
  <text x="445" y="266" font-family="monospace" font-size="12" fill="#777777"># Also: ffi.verify() for inline C</text>
  <text x="440" y="305" font-family="Arial, sans-serif" font-size="13" fill="#333333">Pros: cleaner API, ABI + API modes</text>
  <text x="440" y="325" font-family="Arial, sans-serif" font-size="13" fill="#333333">Cons: external dependency</text>
  <text x="440" y="345" font-family="Arial, sans-serif" font-size="13" fill="#333333">Best for: wrapping C libraries cleanly</text>
  <text x="440" y="363" font-family="Arial, sans-serif" font-size="12" fill="#888888">Used by: PyPy, cryptography, bcrypt</text>

  <!-- Method 3: Cython -->
  <rect x="810" y="75" width="440" height="300" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="810" y="75" width="440" height="38" rx="8" fill="url(#grad-warn)"/>
  <text x="1030" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Cython</text>
  <text x="830" y="128" font-family="Arial, sans-serif" font-size="13" fill="#333333">Python superset compiled to C:</text>
  <rect x="820" y="136" width="420" height="155" rx="4" fill="#1a1a2e"/>
  <text x="835" y="158" font-family="monospace" font-size="12" fill="#777777"># hello.pyx</text>
  <text x="835" y="178" font-family="monospace" font-size="12" fill="#e1bee7">def add(int a, int b):</text>
  <text x="835" y="198" font-family="monospace" font-size="12" fill="#a5d6a7">    return a + b</text>
  <text x="835" y="222" font-family="monospace" font-size="12" fill="#777777"># cdef for pure C speed:</text>
  <text x="835" y="242" font-family="monospace" font-size="12" fill="#e1bee7">cdef int fast_add(int a, int b):</text>
  <text x="835" y="262" font-family="monospace" font-size="12" fill="#a5d6a7">    return a + b</text>
  <text x="830" y="305" font-family="Arial, sans-serif" font-size="13" fill="#333333">Pros: near-C speed, Python-compatible</text>
  <text x="830" y="325" font-family="Arial, sans-serif" font-size="13" fill="#333333">Cons: compile step, new syntax to learn</text>
  <text x="830" y="345" font-family="Arial, sans-serif" font-size="13" fill="#333333">Best for: speed-critical numerical code</text>
  <text x="830" y="363" font-family="Arial, sans-serif" font-size="12" fill="#888888">Used by: NumPy, pandas, lxml, scikit-learn</text>

  <!-- Bottom: C extensions + comparison table -->
  <rect x="30" y="390" width="600" height="220" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="390" width="600" height="38" rx="8" fill="url(#grad-info)"/>
  <text x="330" y="415" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">C Extension Module (Python/C API)</text>
  <rect x="40" y="435" width="580" height="165" rx="4" fill="#1a1a2e"/>
  <text x="55" y="456" font-family="monospace" font-size="12" fill="#777777">// mymodule.c</text>
  <text x="55" y="474" font-family="monospace" font-size="12" fill="#90caf9">#include &lt;Python.h&gt;</text>
  <text x="55" y="492" font-family="monospace" font-size="12" fill="#bbdefb">static PyObject* py_add(PyObject* self, PyObject* args) {</text>
  <text x="55" y="510" font-family="monospace" font-size="12" fill="#bbdefb">    int a, b;</text>
  <text x="55" y="528" font-family="monospace" font-size="12" fill="#a5d6a7">    PyArg_ParseTuple(args, "ii", &amp;a, &amp;b);</text>
  <text x="55" y="546" font-family="monospace" font-size="12" fill="#a5d6a7">    return PyLong_FromLong(a + b);</text>
  <text x="55" y="564" font-family="monospace" font-size="12" fill="#bbdefb">}</text>
  <text x="55" y="584" font-family="Arial, sans-serif" font-size="12" fill="#888888">Pros: maximum control  Cons: verbose, reference counting manual</text>

  <!-- Comparison table -->
  <rect x="650" y="390" width="600" height="220" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="650" y="390" width="600" height="38" rx="8" fill="#555555"/>
  <text x="950" y="415" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Comparison</text>
  <rect x="660" y="432" width="580" height="28" rx="3" fill="#eeeeee"/>
  <text x="670" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">Method</text>
  <text x="790" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">Compile?</text>
  <text x="890" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">Speed</text>
  <text x="970" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">Complexity</text>
  <text x="1100" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">Best for</text>
  <text x="670" y="474" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">ctypes</text>
  <text x="790" y="474" font-family="Arial, sans-serif" font-size="12" fill="#333333">No</text>
  <text x="890" y="474" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">Medium</text>
  <text x="970" y="474" font-family="Arial, sans-serif" font-size="12" fill="#333333">Low</text>
  <text x="1100" y="474" font-family="Arial, sans-serif" font-size="12" fill="#333333">Quick .so calls</text>
  <text x="670" y="496" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">cffi</text>
  <text x="790" y="496" font-family="Arial, sans-serif" font-size="12" fill="#333333">Optional</text>
  <text x="890" y="496" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">Medium</text>
  <text x="970" y="496" font-family="Arial, sans-serif" font-size="12" fill="#333333">Low</text>
  <text x="1100" y="496" font-family="Arial, sans-serif" font-size="12" fill="#333333">Library wrapping</text>
  <text x="670" y="518" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">Cython</text>
  <text x="790" y="518" font-family="Arial, sans-serif" font-size="12" fill="#333333">Yes</text>
  <text x="890" y="518" font-family="Arial, sans-serif" font-size="12" fill="#43a047">High</text>
  <text x="970" y="518" font-family="Arial, sans-serif" font-size="12" fill="#333333">Medium</text>
  <text x="1100" y="518" font-family="Arial, sans-serif" font-size="12" fill="#333333">Numeric speed</text>
  <text x="670" y="540" font-family="Arial, sans-serif" font-size="12" fill="#6a1b9a">C Extension</text>
  <text x="790" y="540" font-family="Arial, sans-serif" font-size="12" fill="#333333">Yes</text>
  <text x="890" y="540" font-family="Arial, sans-serif" font-size="12" fill="#43a047">Highest</text>
  <text x="970" y="540" font-family="Arial, sans-serif" font-size="12" fill="#333333">High</text>
  <text x="1100" y="540" font-family="Arial, sans-serif" font-size="12" fill="#333333">Full control</text>
  <text x="670" y="562" font-family="Arial, sans-serif" font-size="12" fill="#333333">pybind11</text>
  <text x="790" y="562" font-family="Arial, sans-serif" font-size="12" fill="#333333">Yes</text>
  <text x="890" y="562" font-family="Arial, sans-serif" font-size="12" fill="#43a047">High</text>
  <text x="970" y="562" font-family="Arial, sans-serif" font-size="12" fill="#333333">Medium</text>
  <text x="1100" y="562" font-family="Arial, sans-serif" font-size="12" fill="#333333">C++ / modern C</text>
  <text x="660" y="595" font-family="Arial, sans-serif" font-size="12" fill="#888888">Rule of thumb: profile first; only optimize confirmed hot spots with C</text>
</svg>

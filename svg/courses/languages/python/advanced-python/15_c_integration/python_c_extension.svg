<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python-C Integration Methods</text>

  <!-- Method 1: ctypes -->
  <rect x="30" y="75" width="370" height="300" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="370" height="38" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="215" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">ctypes (stdlib)</text>
  <text x="50" y="128" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Load shared libraries directly:</text>
  <rect x="40" y="136" width="350" height="155" rx="6" fill="var(--code-bg)"/>
  <text x="55" y="158" font-family="monospace" font-size="12" fill="var(--info-accent)">from ctypes import cdll, c_int</text>
  <text x="55" y="178" font-family="monospace" font-size="12" fill="var(--primary-accent)">lib = cdll.LoadLibrary("./mylib.so")</text>
  <text x="55" y="198" font-family="monospace" font-size="12" fill="var(--primary-accent)">lib.add.restype = c_int</text>
  <text x="55" y="218" font-family="monospace" font-size="12" fill="var(--primary-accent)">lib.add.argtypes = [c_int, c_int]</text>
  <text x="55" y="242" font-family="monospace" font-size="12" fill="var(--ok-accent)">result = lib.add(3, 4)  # 7</text>
  <text x="55" y="275" font-family="monospace" font-size="12" fill="var(--text-muted)"># No compilation step required</text>
  <text x="50" y="305" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Pros: no compile, stdlib, works with any .so</text>
  <text x="50" y="325" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Cons: manual type mapping, error-prone</text>
  <text x="50" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Best for: quick .so calls, legacy libraries</text>
  <text x="50" y="363" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Use: ctypes.POINTER, Structure for structs</text>

  <!-- Method 2: cffi -->
  <rect x="420" y="75" width="370" height="300" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="75" width="370" height="38" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="605" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">cffi (C Foreign Function Interface)</text>
  <text x="440" y="128" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Declare C API in Python:</text>
  <rect x="430" y="136" width="350" height="155" rx="6" fill="var(--code-bg)"/>
  <text x="445" y="158" font-family="monospace" font-size="12" fill="var(--info-accent)">from cffi import FFI</text>
  <text x="445" y="178" font-family="monospace" font-size="12" fill="var(--primary-accent)">ffi = FFI()</text>
  <text x="445" y="198" font-family="monospace" font-size="12" fill="var(--primary-accent)">ffi.cdef("int add(int a, int b);")</text>
  <text x="445" y="218" font-family="monospace" font-size="12" fill="var(--primary-accent)">lib = ffi.dlopen("./mylib.so")</text>
  <text x="445" y="242" font-family="monospace" font-size="12" fill="var(--ok-accent)">result = lib.add(3, 4)</text>
  <text x="445" y="266" font-family="monospace" font-size="12" fill="var(--text-muted)"># Also: ffi.verify() for inline C</text>
  <text x="440" y="305" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Pros: cleaner API, ABI + API modes</text>
  <text x="440" y="325" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Cons: external dependency</text>
  <text x="440" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Best for: wrapping C libraries cleanly</text>
  <text x="440" y="363" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Used by: PyPy, cryptography, bcrypt</text>

  <!-- Method 3: Cython -->
  <rect x="810" y="75" width="440" height="300" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="810" y="75" width="440" height="38" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1030" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Cython</text>
  <text x="830" y="128" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Python superset compiled to C:</text>
  <rect x="820" y="136" width="420" height="155" rx="6" fill="var(--code-bg)"/>
  <text x="835" y="158" font-family="monospace" font-size="12" fill="var(--text-muted)"># hello.pyx</text>
  <text x="835" y="178" font-family="monospace" font-size="12" fill="var(--info-accent)">def add(int a, int b):</text>
  <text x="835" y="198" font-family="monospace" font-size="12" fill="var(--ok-accent)">    return a + b</text>
  <text x="835" y="222" font-family="monospace" font-size="12" fill="var(--text-muted)"># cdef for pure C speed:</text>
  <text x="835" y="242" font-family="monospace" font-size="12" fill="var(--info-accent)">cdef int fast_add(int a, int b):</text>
  <text x="835" y="262" font-family="monospace" font-size="12" fill="var(--ok-accent)">    return a + b</text>
  <text x="830" y="305" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Pros: near-C speed, Python-compatible</text>
  <text x="830" y="325" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Cons: compile step, new syntax to learn</text>
  <text x="830" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Best for: speed-critical numerical code</text>
  <text x="830" y="363" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Used by: NumPy, pandas, lxml, scikit-learn</text>

  <!-- Bottom: C extensions + comparison table -->
  <rect x="30" y="390" width="600" height="220" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="390" width="600" height="38" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="330" y="415" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">C Extension Module (Python/C API)</text>
  <rect x="40" y="435" width="580" height="165" rx="6" fill="var(--code-bg)"/>
  <text x="55" y="456" font-family="monospace" font-size="12" fill="var(--text-muted)">// mymodule.c</text>
  <text x="55" y="474" font-family="monospace" font-size="12" fill="var(--primary-accent)">#include &lt;Python.h&gt;</text>
  <text x="55" y="492" font-family="monospace" font-size="12" fill="var(--primary-accent)">static PyObject* py_add(PyObject* self, PyObject* args) {</text>
  <text x="55" y="510" font-family="monospace" font-size="12" fill="var(--primary-accent)">    int a, b;</text>
  <text x="55" y="528" font-family="monospace" font-size="12" fill="var(--ok-accent)">    PyArg_ParseTuple(args, "ii", &amp;a, &amp;b);</text>
  <text x="55" y="546" font-family="monospace" font-size="12" fill="var(--ok-accent)">    return PyLong_FromLong(a + b);</text>
  <text x="55" y="564" font-family="monospace" font-size="12" fill="var(--primary-accent)">}</text>
  <text x="55" y="584" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Pros: maximum control  Cons: verbose, reference counting manual</text>

  <!-- Comparison table -->
  <rect x="650" y="390" width="600" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="650" y="390" width="600" height="38" rx="6" fill="var(--text-muted)"/>
  <text x="950" y="415" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Comparison</text>
  <rect x="660" y="432" width="580" height="28" rx="6" fill="var(--surface)"/>
  <text x="670" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text)">Method</text>
  <text x="790" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text)">Compile?</text>
  <text x="890" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text)">Speed</text>
  <text x="970" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text)">Complexity</text>
  <text x="1100" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text)">Best for</text>
  <text x="670" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">ctypes</text>
  <text x="790" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">No</text>
  <text x="890" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)">Medium</text>
  <text x="970" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Low</text>
  <text x="1100" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Quick .so calls</text>
  <text x="670" y="496" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">cffi</text>
  <text x="790" y="496" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Optional</text>
  <text x="890" y="496" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)">Medium</text>
  <text x="970" y="496" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Low</text>
  <text x="1100" y="496" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Library wrapping</text>
  <text x="670" y="518" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)">Cython</text>
  <text x="790" y="518" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Yes</text>
  <text x="890" y="518" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">High</text>
  <text x="970" y="518" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Medium</text>
  <text x="1100" y="518" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Numeric speed</text>
  <text x="670" y="540" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)">C Extension</text>
  <text x="790" y="540" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Yes</text>
  <text x="890" y="540" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Highest</text>
  <text x="970" y="540" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">High</text>
  <text x="1100" y="540" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Full control</text>
  <text x="670" y="562" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">pybind11</text>
  <text x="790" y="562" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Yes</text>
  <text x="890" y="562" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">High</text>
  <text x="970" y="562" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Medium</text>
  <text x="1100" y="562" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">C++ / modern C</text>
  <text x="660" y="595" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Rule of thumb: profile first; only optimize confirmed hot spots with C</text>
</svg>

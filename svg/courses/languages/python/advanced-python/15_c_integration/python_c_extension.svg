<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.699676538728" font-weight="bold" fill="var(--primary-accent)">Python to C Integration</text>

  <!-- Four method cards -->
  <rect x="40" y="76.909090909091" width="290" height="242.545454545455" rx="10.269106361049" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="113.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--primary-text)">ctypes</text>
  <text x="185" y="145.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">stdlib, no compile</text>
  <text x="185" y="182.363636363636" text-anchor="middle" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--primary-text)">cdll.LoadLibrary</text>
  <text x="185" y="208.727272727273" text-anchor="middle" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--primary-text)">lib.add(3, 4)</text>
  <text x="185" y="250.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">Manual type mapping</text>
  <text x="185" y="282.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">Best: quick .so calls</text>

  <rect x="340" y="76.909090909091" width="290" height="242.545454545455" rx="10.269106361049" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="113.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--ok-text)">cffi</text>
  <text x="485" y="145.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--ok-text)">Declare C in Python</text>
  <text x="485" y="182.363636363636" text-anchor="middle" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--ok-text)">ffi.cdef(sig)</text>
  <text x="485" y="208.727272727273" text-anchor="middle" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--ok-text)">ffi.dlopen(lib)</text>
  <text x="485" y="250.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--ok-text)">ABI + API modes</text>
  <text x="485" y="282.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--ok-text)">Best: wrap libraries</text>

  <rect x="640" y="76.909090909091" width="290" height="242.545454545455" rx="10.269106361049" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="113.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--warn-text)">Cython</text>
  <text x="785" y="145.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--warn-text)">Python compiled to C</text>
  <text x="785" y="182.363636363636" text-anchor="middle" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--warn-text)">cdef int f(int x)</text>
  <text x="785" y="208.727272727273" text-anchor="middle" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--warn-text)">compile .pyx</text>
  <text x="785" y="250.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--warn-text)">Near-C speed</text>
  <text x="785" y="282.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--warn-text)">Best: numeric hot loops</text>

  <rect x="940" y="76.909090909091" width="300" height="242.545454545455" rx="10.269106361049" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="113.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--info-text)">C Extension</text>
  <text x="1090" y="145.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--info-text)">Python/C API</text>
  <text x="1090" y="182.363636363636" text-anchor="middle" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--info-text)">#include Python.h</text>
  <text x="1090" y="208.727272727273" text-anchor="middle" font-family="Courier New, monospace" font-size="12.322927633259" fill="var(--info-text)">PyArg_ParseTuple</text>
  <text x="1090" y="250.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--info-text)">Manual refcounting</text>
  <text x="1090" y="282.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--info-text)">Best: full control</text>

  <!-- Comparison table -->
  <rect x="40" y="361.636363636364" width="1200" height="37.963636363636" rx="6.16146381663" fill="var(--primary-accent)"/>
  <text x="160" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--bg)">Method</text>
  <text x="440" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--bg)">Compile</text>
  <text x="720" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--bg)">Speed</text>
  <text x="1000" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.403659541574" font-weight="bold" fill="var(--bg)">Use</text>

  <text x="160" y="435.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">ctypes</text>
  <text x="440" y="435.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">no</text>
  <text x="720" y="435.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">medium</text>
  <text x="1000" y="435.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">quick</text>

  <text x="160" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">cffi</text>
  <text x="440" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">optional</text>
  <text x="720" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">medium</text>
  <text x="1000" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">wrap</text>

  <text x="160" y="509.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">Cython</text>
  <text x="440" y="509.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">yes</text>
  <text x="720" y="509.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">high</text>
  <text x="1000" y="509.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">numeric</text>

  <text x="160" y="546.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">C API</text>
  <text x="440" y="546.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">yes</text>
  <text x="720" y="546.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">highest</text>
  <text x="1000" y="546.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">control</text>

  <text x="160" y="583.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">pybind11</text>
  <text x="440" y="583.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">yes</text>
  <text x="720" y="583.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">high</text>
  <text x="1000" y="583.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text)">C++</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--text-muted)">Profile first. Optimize confirmed hot spots only.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python-C Integration Methods</text>

  <!-- Method 1: ctypes -->
  <rect x="30" y="75" width="370" height="300" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="370" height="38" rx="8" fill="url(#grad-primary)"/>
  <text x="215" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">ctypes (stdlib)</text>
  <text x="50" y="128" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Load shared libraries directly:</text>
  <rect x="40" y="136" width="350" height="155" rx="4" fill="var(--code-bg)"/>
  <text x="55" y="158" font-family="monospace" font-size="12" fill="var(--info-tint)">from ctypes import cdll, c_int</text>
  <text x="55" y="178" font-family="monospace" font-size="12" fill="var(--primary-lt)">lib = cdll.LoadLibrary("./mylib.so")</text>
  <text x="55" y="198" font-family="monospace" font-size="12" fill="var(--primary-lt)">lib.add.restype = c_int</text>
  <text x="55" y="218" font-family="monospace" font-size="12" fill="var(--primary-lt)">lib.add.argtypes = [c_int, c_int]</text>
  <text x="55" y="242" font-family="monospace" font-size="12" fill="var(--ok-tint)">result = lib.add(3, 4)  # 7</text>
  <text x="55" y="275" font-family="monospace" font-size="12" fill="var(--text-lighter)"># No compilation step required</text>
  <text x="50" y="305" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Pros: no compile, stdlib, works with any .so</text>
  <text x="50" y="325" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Cons: manual type mapping, error-prone</text>
  <text x="50" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Best for: quick .so calls, legacy libraries</text>
  <text x="50" y="363" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Use: ctypes.POINTER, Structure for structs</text>

  <!-- Method 2: cffi -->
  <rect x="420" y="75" width="370" height="300" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="75" width="370" height="38" rx="8" fill="url(#grad-ok)"/>
  <text x="605" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">cffi (C Foreign Function Interface)</text>
  <text x="440" y="128" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Declare C API in Python:</text>
  <rect x="430" y="136" width="350" height="155" rx="4" fill="var(--code-bg)"/>
  <text x="445" y="158" font-family="monospace" font-size="12" fill="var(--info-tint)">from cffi import FFI</text>
  <text x="445" y="178" font-family="monospace" font-size="12" fill="var(--primary-lt)">ffi = FFI()</text>
  <text x="445" y="198" font-family="monospace" font-size="12" fill="var(--primary-lt)">ffi.cdef("int add(int a, int b);")</text>
  <text x="445" y="218" font-family="monospace" font-size="12" fill="var(--primary-lt)">lib = ffi.dlopen("./mylib.so")</text>
  <text x="445" y="242" font-family="monospace" font-size="12" fill="var(--ok-tint)">result = lib.add(3, 4)</text>
  <text x="445" y="266" font-family="monospace" font-size="12" fill="var(--text-lighter)"># Also: ffi.verify() for inline C</text>
  <text x="440" y="305" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Pros: cleaner API, ABI + API modes</text>
  <text x="440" y="325" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Cons: external dependency</text>
  <text x="440" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Best for: wrapping C libraries cleanly</text>
  <text x="440" y="363" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Used by: PyPy, cryptography, bcrypt</text>

  <!-- Method 3: Cython -->
  <rect x="810" y="75" width="440" height="300" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="810" y="75" width="440" height="38" rx="8" fill="url(#grad-warn)"/>
  <text x="1030" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Cython</text>
  <text x="830" y="128" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Python superset compiled to C:</text>
  <rect x="820" y="136" width="420" height="155" rx="4" fill="var(--code-bg)"/>
  <text x="835" y="158" font-family="monospace" font-size="12" fill="var(--text-lighter)"># hello.pyx</text>
  <text x="835" y="178" font-family="monospace" font-size="12" fill="var(--info-tint)">def add(int a, int b):</text>
  <text x="835" y="198" font-family="monospace" font-size="12" fill="var(--ok-tint)">    return a + b</text>
  <text x="835" y="222" font-family="monospace" font-size="12" fill="var(--text-lighter)"># cdef for pure C speed:</text>
  <text x="835" y="242" font-family="monospace" font-size="12" fill="var(--info-tint)">cdef int fast_add(int a, int b):</text>
  <text x="835" y="262" font-family="monospace" font-size="12" fill="var(--ok-tint)">    return a + b</text>
  <text x="830" y="305" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Pros: near-C speed, Python-compatible</text>
  <text x="830" y="325" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Cons: compile step, new syntax to learn</text>
  <text x="830" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--text-dark)">Best for: speed-critical numerical code</text>
  <text x="830" y="363" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Used by: NumPy, pandas, lxml, scikit-learn</text>

  <!-- Bottom: C extensions + comparison table -->
  <rect x="30" y="390" width="600" height="220" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="390" width="600" height="38" rx="8" fill="url(#grad-info)"/>
  <text x="330" y="415" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">C Extension Module (Python/C API)</text>
  <rect x="40" y="435" width="580" height="165" rx="4" fill="var(--code-bg)"/>
  <text x="55" y="456" font-family="monospace" font-size="12" fill="var(--text-lighter)">// mymodule.c</text>
  <text x="55" y="474" font-family="monospace" font-size="12" fill="var(--primary-tint)">#include &lt;Python.h&gt;</text>
  <text x="55" y="492" font-family="monospace" font-size="12" fill="var(--primary-lt)">static PyObject* py_add(PyObject* self, PyObject* args) {</text>
  <text x="55" y="510" font-family="monospace" font-size="12" fill="var(--primary-lt)">    int a, b;</text>
  <text x="55" y="528" font-family="monospace" font-size="12" fill="var(--ok-tint)">    PyArg_ParseTuple(args, "ii", &amp;a, &amp;b);</text>
  <text x="55" y="546" font-family="monospace" font-size="12" fill="var(--ok-tint)">    return PyLong_FromLong(a + b);</text>
  <text x="55" y="564" font-family="monospace" font-size="12" fill="var(--primary-lt)">}</text>
  <text x="55" y="584" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Pros: maximum control  Cons: verbose, reference counting manual</text>

  <!-- Comparison table -->
  <rect x="650" y="390" width="600" height="220" rx="8" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="650" y="390" width="600" height="38" rx="8" fill="var(--text-muted)"/>
  <text x="950" y="415" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Comparison</text>
  <rect x="660" y="432" width="580" height="28" rx="3" fill="var(--surface-alt)"/>
  <text x="670" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-dark)">Method</text>
  <text x="790" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-dark)">Compile?</text>
  <text x="890" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-dark)">Speed</text>
  <text x="970" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-dark)">Complexity</text>
  <text x="1100" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--text-dark)">Best for</text>
  <text x="670" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">ctypes</text>
  <text x="790" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">No</text>
  <text x="890" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-mid)">Medium</text>
  <text x="970" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Low</text>
  <text x="1100" y="474" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Quick .so calls</text>
  <text x="670" y="496" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">cffi</text>
  <text x="790" y="496" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Optional</text>
  <text x="890" y="496" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-mid)">Medium</text>
  <text x="970" y="496" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Low</text>
  <text x="1100" y="496" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Library wrapping</text>
  <text x="670" y="518" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-mid)">Cython</text>
  <text x="790" y="518" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Yes</text>
  <text x="890" y="518" font-family="Arial, sans-serif" font-size="12" fill="var(--ok)">High</text>
  <text x="970" y="518" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Medium</text>
  <text x="1100" y="518" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Numeric speed</text>
  <text x="670" y="540" font-family="Arial, sans-serif" font-size="12" fill="var(--info-dk)">C Extension</text>
  <text x="790" y="540" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Yes</text>
  <text x="890" y="540" font-family="Arial, sans-serif" font-size="12" fill="var(--ok)">Highest</text>
  <text x="970" y="540" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">High</text>
  <text x="1100" y="540" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Full control</text>
  <text x="670" y="562" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">pybind11</text>
  <text x="790" y="562" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Yes</text>
  <text x="890" y="562" font-family="Arial, sans-serif" font-size="12" fill="var(--ok)">High</text>
  <text x="970" y="562" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Medium</text>
  <text x="1100" y="562" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">C++ / modern C</text>
  <text x="660" y="595" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Rule of thumb: profile first; only optimize confirmed hot spots with C</text>
</svg>

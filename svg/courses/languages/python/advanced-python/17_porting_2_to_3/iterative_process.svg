<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="678.571429" y="40" text-anchor="middle" font-size="21.954626" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Python 2 to 3 Porting: Iterative Process</text>
  <rect x="502.857143" y="56.730771" width="308.571429" height="46.474275" rx="6.890031" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="657.142857" y="85.544852" text-anchor="middle" font-size="16.96498" fill="var(--text)" font-family="Arial, sans-serif">Start with Py2 Code</text>
  <line x1="657.142857" y1="103.205162" x2="657.142857" y2="125.512934" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="657.142857,144.102552 828.571429,199.871867 657.142857,255.641067 485.714286,199.871867" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2222"/>
  <text x="657.142857" y="195.224405" text-anchor="middle" font-size="14.969053" fill="var(--text)" font-family="Arial, sans-serif">Run Tests</text>
  <text x="657.142857" y="213.814138" text-anchor="middle" font-size="14.969053" fill="var(--text)" font-family="Arial, sans-serif">in Py2?</text>
  <line x1="828.571429" y1="199.871867" x2="957.142857" y2="199.871867" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="890.714286" y="188.717981" text-anchor="middle" font-size="12.97324" fill="var(--danger-accent)" font-family="Arial, sans-serif">Fail</text>
  <rect x="961.428571" y="176.634557" width="278.571429" height="46.474275" rx="6.890031" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.714286" y="204.519214" text-anchor="middle" font-size="14.969053" fill="var(--text)" font-family="Arial, sans-serif">Fix Tests in Py2 First!</text>
  <line x1="657.142857" y1="255.641067" x2="657.142857" y2="292.820649" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="687.142857" y="278.878262" font-size="12.97324" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pass</text>
  <rect x="502.857143" y="296.538457" width="308.571429" height="46.474275" rx="6.890031" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="657.142857" y="325.352653" text-anchor="middle" font-size="16.96498" fill="var(--text)" font-family="Arial, sans-serif">Branch Code</text>
  <line x1="657.142857" y1="343.012963" x2="657.142857" y2="376.474506" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="657.142857,395.064124 850,446.185977 657.142857,497.307714 464.285714,446.185977" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2222"/>
  <text x="657.142857" y="438.750014" text-anchor="middle" font-size="13.971032" fill="var(--text)" font-family="Arial, sans-serif">Apply Auto-Porting</text>
  <text x="657.142857" y="457.339863" text-anchor="middle" font-size="12.97324" fill="var(--text-muted)" font-family="Arial, sans-serif">(2to3, modernize)</text>
  <line x1="464.285714" y1="446.185977" x2="378.571429" y2="446.185977" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="185.714286" y="422.948782" width="192.857143" height="46.474275" rx="6.890031" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="282.142857" y="450.833439" text-anchor="middle" font-size="13.971032" fill="var(--text)" font-family="Arial, sans-serif">Manual Fixes</text>
  <line x1="282.142857" y1="469.423057" x2="282.142857" y2="506.602639" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="282.142857,523.33341 442.857143,571.666763 282.142857,620 121.428571,571.666763" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2222"/>
  <text x="282.142857" y="567.019301" text-anchor="middle" font-size="13.971032" fill="var(--text)" font-family="Arial, sans-serif">Run Tests</text>
  <text x="282.142857" y="585.609149" text-anchor="middle" font-size="13.971032" fill="var(--text)" font-family="Arial, sans-serif">in Py3?</text>
  <path d="M 121.428571 571.666763 Q 57.142857 571.666763 57.142857 478.717981 Q 57.142857 432.243706 183.571429 436.891053" fill="none" stroke="var(--danger-border)" stroke-width="2.2222" marker-end="url(#arrow-danger)"/>
  <text x="40" y="528.910296" font-size="12.97324" fill="var(--danger-accent)" font-family="Arial, sans-serif">Fail</text>
  <line x1="442.857143" y1="571.666763" x2="571.428571" y2="571.666763" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="502.857143" y="560.512992" font-size="12.97324" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pass</text>
  <rect x="575.714286" y="548.429567" width="317.142857" height="46.474275" rx="6.890031" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="734.285714" y="576.314225" text-anchor="middle" font-size="14.969053" fill="var(--text)" font-family="Arial, sans-serif">Merge to Main / Release</text>
</svg>

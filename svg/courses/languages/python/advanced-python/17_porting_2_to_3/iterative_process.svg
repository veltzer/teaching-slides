<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="502.857143" y="40" width="308.571429" height="47.854699160213" rx="6.991609428399" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="657.142857" y="69.669944885273" text-anchor="middle" font-size="17.215091502579" fill="var(--text)" font-family="Arial, sans-serif">Start with Py2 Code</text>
  <line x1="657.142857" y1="87.854818605758" x2="657.142857" y2="110.825197767017" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="657.142857,129.966982698428 828.571429,187.392812185734 657.142857,244.818523257197 485.714286,187.392812185734" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2222"/>
  <text x="657.142857" y="182.60730674496" text-anchor="middle" font-size="15.189738927011" fill="var(--text)" font-family="Arial, sans-serif">Run Tests</text>
  <text x="657.142857" y="201.749210092213" text-anchor="middle" font-size="15.189738927011" fill="var(--text)" font-family="Arial, sans-serif">in Py2?</text>
  <line x1="828.571429" y1="187.392812185734" x2="957.142857" y2="187.392812185734" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="890.714286" y="175.907622605104" text-anchor="middle" font-size="13.164502032123" fill="var(--danger-accent)" font-family="Arial, sans-serif">Fail</text>
  <rect x="961.428571" y="163.465284981864" width="278.571429" height="47.854699160213" rx="6.991609428399" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.714286" y="192.178199210666" text-anchor="middle" font-size="15.189738927011" fill="var(--text)" font-family="Arial, sans-serif">Fix Tests in Py2 First!</text>
  <line x1="657.142857" y1="244.818523257197" x2="657.142857" y2="283.102449397249" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="687.142857" y="268.745932045224" font-size="13.164502032123" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pass</text>
  <rect x="502.857143" y="286.930687349868" width="308.571429" height="47.854699160213" rx="6.991609428399" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="657.142857" y="316.600750650982" text-anchor="middle" font-size="17.215091502579" fill="var(--text)" font-family="Arial, sans-serif">Branch Code</text>
  <line x1="657.142857" y1="334.785624371467" x2="657.142857" y2="369.241074697514" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="657.142857,388.382859628925 850,441.023183675457 657.142857,493.663388276443 464.285714,441.023183675457" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2222"/>
  <text x="657.142857" y="433.366350463288" text-anchor="middle" font-size="14.177004291515" fill="var(--text)" font-family="Arial, sans-serif">Apply Auto-Porting</text>
  <text x="657.142857" y="452.508373256086" text-anchor="middle" font-size="13.164502032123" fill="var(--text-muted)" font-family="Arial, sans-serif">(2to3, modernize)</text>
  <line x1="464.285714" y1="441.023183675457" x2="378.571429" y2="441.023183675457" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="185.714286" y="417.09577488743" width="192.857143" height="47.854699160213" rx="6.991609428399" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="282.142857" y="445.808689116231" text-anchor="middle" font-size="14.177004291515" fill="var(--text)" font-family="Arial, sans-serif">Manual Fixes</text>
  <line x1="282.142857" y1="464.950474047642" x2="282.142857" y2="503.234400187694" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="282.142857,520.462124835866 442.857143,570.231122140705 282.142857,620 121.428571,570.231122140705" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2222"/>
  <text x="282.142857" y="565.445616699932" text-anchor="middle" font-size="14.177004291515" fill="var(--text)" font-family="Arial, sans-serif">Run Tests</text>
  <text x="282.142857" y="584.587638463027" text-anchor="middle" font-size="14.177004291515" fill="var(--text)" font-family="Arial, sans-serif">in Py3?</text>
  <path d="M 121.428571 570.231122140705 Q 57.142857 570.231122140705 57.142857 474.52148492919 Q 57.142857 426.666785768977 183.571429 431.452172793909" fill="none" stroke="var(--danger-border)" stroke-width="2.2222" marker-end="url(#arrow-danger)"/>
  <text x="40" y="526.204660933111" font-size="13.164502032123" fill="var(--danger-accent)" font-family="Arial, sans-serif">Fail</text>
  <line x1="442.857143" y1="570.231122140705" x2="571.428571" y2="570.231122140705" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="502.857143" y="558.746050975918" font-size="13.164502032123" fill="var(--ok-accent)" font-family="Arial, sans-serif">Pass</text>
  <rect x="575.714286" y="546.303712322975" width="317.142857" height="47.854699160213" rx="6.991609428399" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="734.285714" y="575.016627581479" text-anchor="middle" font-size="15.189738927011" fill="var(--text)" font-family="Arial, sans-serif">Merge to Main / Release</text>
</svg>

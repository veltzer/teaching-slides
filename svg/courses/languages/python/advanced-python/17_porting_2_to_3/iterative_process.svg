<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="70.6111" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--text)">Python 2 to 3 Porting: Iterative Process</text>
  <rect x="486.25" y="85.1111" width="270" height="40.2777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="621.25" y="110.0833" text-anchor="middle" font-size="14.7735" fill="var(--text)">Start with Py2 Code</text>
  <line x1="621.25" y1="125.3889" x2="621.25" y2="144.7223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="621.25,160.8333 771.25,209.1667 621.25,257.5 471.25,209.1667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2222" />
  <text x="621.25" y="205.1389" text-anchor="middle" font-size="13.0354" fill="var(--text)">Run Tests</text>
  <text x="621.25" y="221.25" text-anchor="middle" font-size="13.0354" fill="var(--text)">in Py2?</text>
  <line x1="771.25" y1="209.1667" x2="883.75" y2="209.1667" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="825.625" y="199.5" text-anchor="middle" font-size="11.2974" fill="var(--danger-accent)">Fail</text>
  <rect x="887.5" y="189.0277" width="243.75" height="40.2777" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1009.375" y="213.1944" text-anchor="middle" font-size="13.0354" fill="var(--text)">Fix Tests in Py2 First!</text>
  <line x1="621.25" y1="257.5" x2="621.25" y2="289.7223" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="647.5" y="277.6389" font-size="11.2974" fill="var(--ok-accent)">Pass</text>
  <rect x="486.25" y="292.9444" width="270" height="40.2777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="621.25" y="317.9167" text-anchor="middle" font-size="14.7735" fill="var(--text)">Branch Code</text>
  <line x1="621.25" y1="333.2223" x2="621.25" y2="362.2223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="621.25,378.3333 790,422.6389 621.25,466.9444 452.5,422.6389" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2222" />
  <text x="621.25" y="416.1944" text-anchor="middle" font-size="12.1663" fill="var(--text)">Apply Auto-Porting</text>
  <text x="621.25" y="432.3056" text-anchor="middle" font-size="11.2974" fill="var(--text-muted)">(2to3, modernize)</text>
  <line x1="452.5" y1="422.6389" x2="377.5" y2="422.6389" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="208.75" y="402.5" width="168.75" height="40.2777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="293.125" y="426.6667" text-anchor="middle" font-size="12.1663" fill="var(--text)">Manual Fixes</text>
  <line x1="293.125" y1="442.7777" x2="293.125" y2="475" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="293.125,489.5 433.75,531.3889 293.125,573.2777 152.5,531.3889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2222" />
  <text x="293.125" y="527.3611" text-anchor="middle" font-size="12.1663" fill="var(--text)">Run Tests</text>
  <text x="293.125" y="543.4723" text-anchor="middle" font-size="12.1663" fill="var(--text)">in Py3?</text>
  <path d="M 152.5 531.3889 Q 96.25 531.3889 96.25 450.8333 Q 96.25 410.5556 206.875 414.5833" fill="none" stroke="var(--danger-border)" stroke-width="2.2222" marker-end="url(#arrow-danger)" />
  <text x="81.25" y="494.3333" font-size="11.2974" fill="var(--danger-accent)">Fail</text>
  <line x1="433.75" y1="531.3889" x2="546.25" y2="531.3889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="486.25" y="521.7223" font-size="11.2974" fill="var(--ok-accent)">Pass</text>
  <rect x="550" y="511.25" width="277.5" height="40.2777" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="688.75" y="535.4167" text-anchor="middle" font-size="13.0354" fill="var(--text)">Merge to Main / Release</text>
</svg>
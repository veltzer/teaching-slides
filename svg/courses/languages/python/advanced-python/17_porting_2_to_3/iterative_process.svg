<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
  </defs>
  <text x="678.571429" y="40" text-anchor="middle" font-size="21.954626" font-weight="bold" fill="var(--text)">Python 2 to 3 Porting: Iterative Process</text>
  <rect x="502.857143" y="56.730771" width="308.571429" height="46.474275" rx="6.890031" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="657.142857" y="85.544852" text-anchor="middle" font-size="16.96498" fill="var(--text)">Start with Py2 Code</text>
  <line x1="657.142857" y1="103.205162" x2="657.142857" y2="125.512934" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="657.142857,144.102552 828.571429,199.871867 657.142857,255.641067 485.714286,199.871867" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2222" />
  <text x="657.142857" y="195.224405" text-anchor="middle" font-size="14.969053" fill="var(--text)">Run Tests</text>
  <text x="657.142857" y="213.814138" text-anchor="middle" font-size="14.969053" fill="var(--text)">in Py2?</text>
  <line x1="828.571429" y1="199.871867" x2="957.142857" y2="199.871867" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="890.714286" y="188.717981" text-anchor="middle" font-size="12.97324" fill="var(--danger-accent)">Fail</text>
  <rect x="961.428571" y="176.634557" width="278.571429" height="46.474275" rx="6.890031" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.714286" y="204.519214" text-anchor="middle" font-size="14.969053" fill="var(--text)">Fix Tests in Py2 First!</text>
  <line x1="657.142857" y1="255.641067" x2="657.142857" y2="292.820649" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="687.142857" y="278.878262" font-size="12.97324" fill="var(--ok-accent)">Pass</text>
  <rect x="502.857143" y="296.538457" width="308.571429" height="46.474275" rx="6.890031" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="657.142857" y="325.352653" text-anchor="middle" font-size="16.96498" fill="var(--text)">Branch Code</text>
  <line x1="657.142857" y1="343.012963" x2="657.142857" y2="376.474506" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="657.142857,395.064124 850,446.185977 657.142857,497.307714 464.285714,446.185977" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2222" />
  <text x="657.142857" y="438.750014" text-anchor="middle" font-size="13.971032" fill="var(--text)">Apply Auto-Porting</text>
  <text x="657.142857" y="457.339863" text-anchor="middle" font-size="12.97324" fill="var(--text-muted)">(2to3, modernize)</text>
  <line x1="464.285714" y1="446.185977" x2="378.571429" y2="446.185977" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="185.714286" y="422.948782" width="192.857143" height="46.474275" rx="6.890031" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="282.142857" y="450.833439" text-anchor="middle" font-size="13.971032" fill="var(--text)">Manual Fixes</text>
  <line x1="282.142857" y1="469.423057" x2="282.142857" y2="506.602639" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="282.142857,523.33341 442.857143,571.666763 282.142857,620 121.428571,571.666763" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.2222" />
  <text x="282.142857" y="567.019301" text-anchor="middle" font-size="13.971032" fill="var(--text)">Run Tests</text>
  <text x="282.142857" y="585.609149" text-anchor="middle" font-size="13.971032" fill="var(--text)">in Py3?</text>
  <path d="M 121.428571 571.666763 Q 57.142857 571.666763 57.142857 478.717981 Q 57.142857 432.243706 183.571429 436.891053" fill="none" stroke="var(--danger-border)" stroke-width="2.2222" marker-end="url(#arrow-danger)" />
  <text x="40" y="528.910296" font-size="12.97324" fill="var(--danger-accent)">Fail</text>
  <line x1="442.857143" y1="571.666763" x2="571.428571" y2="571.666763" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="502.857143" y="560.512992" font-size="12.97324" fill="var(--ok-accent)">Pass</text>
  <rect x="575.714286" y="548.429567" width="317.142857" height="46.474275" rx="6.890031" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="734.285714" y="576.314225" text-anchor="middle" font-size="14.969053" fill="var(--text)">Merge to Main / Release</text>
</svg>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f5f5f5" rx="10"/>
  <text x="400" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565c0">Python 2 to 3 Migration Summary</text>
  <rect x="40" y="90" width="220" height="120" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="150" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">Key Changes</text>
  <text x="150" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">print() function</text>
  <text x="150" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Unicode strings</text>
  <text x="150" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Integer division</text>
  <rect x="290" y="90" width="220" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">Tools</text>
  <text x="400" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">2to3 converter</text>
  <text x="400" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">futurize / modernize</text>
  <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">pylint --py3k</text>
  <rect x="540" y="90" width="220" height="120" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="650" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100">Best Practices</text>
  <text x="650" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Use __future__ imports</text>
  <text x="650" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Test thoroughly</text>
  <text x="650" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Migrate incrementally</text>
  <rect x="40" y="240" width="720" height="60" rx="8" fill="#e8eaf6" stroke="#283593" stroke-width="2"/>
  <text x="400" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#283593">Python 2 EOL: January 1, 2020</text>
  <text x="400" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">All new projects should use Python 3. Migration of legacy code is essential.</text>
  <rect x="40" y="320" width="720" height="55" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="400" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c62828">Strategy: Write code compatible with both 2 and 3 during transition</text>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Use six library or python-future for compatibility layers</text>
</svg>

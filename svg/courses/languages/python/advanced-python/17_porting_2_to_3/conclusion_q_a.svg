<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="53.3333" text-anchor="middle" font-size="26.6667" font-weight="bold" fill="#1565c0">Python 2 to 3 Migration Summary</ns0:text>
  <ns0:rect x="35.5556" y="88.8889" width="320" height="195.5556" rx="8.8889" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="195.5556" y="128.8889" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#1565c0">Key Changes</ns0:text>
  <ns0:text x="195.5556" y="164.4444" text-anchor="middle" font-size="15.1111" fill="#333333">print() function</ns0:text>
  <ns0:text x="195.5556" y="195.5556" text-anchor="middle" font-size="15.1111" fill="#333333">Unicode strings</ns0:text>
  <ns0:text x="195.5556" y="226.6667" text-anchor="middle" font-size="15.1111" fill="#333333">Integer division</ns0:text>
  <ns0:text x="195.5556" y="257.7778" text-anchor="middle" font-size="15.1111" fill="#333333">Exception syntax</ns0:text>
  <ns0:rect x="408.8889" y="88.8889" width="320" height="195.5556" rx="8.8889" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="128.8889" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#2e7d32">Tools</ns0:text>
  <ns0:text x="568.8889" y="164.4444" text-anchor="middle" font-size="15.1111" fill="#333333">2to3 converter</ns0:text>
  <ns0:text x="568.8889" y="195.5556" text-anchor="middle" font-size="15.1111" fill="#333333">futurize / modernize</ns0:text>
  <ns0:text x="568.8889" y="226.6667" text-anchor="middle" font-size="15.1111" fill="#333333">pylint --py3k</ns0:text>
  <ns0:text x="568.8889" y="257.7778" text-anchor="middle" font-size="15.1111" fill="#333333">pyupgrade</ns0:text>
  <ns0:rect x="782.2222" y="88.8889" width="320" height="195.5556" rx="8.8889" fill="#fff9c4" stroke="#f9a825" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="942.2222" y="128.8889" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#795548">Best Practices</ns0:text>
  <ns0:text x="942.2222" y="164.4444" text-anchor="middle" font-size="15.1111" fill="#333333">Use __future__ imports</ns0:text>
  <ns0:text x="942.2222" y="195.5556" text-anchor="middle" font-size="15.1111" fill="#333333">Test thoroughly</ns0:text>
  <ns0:text x="942.2222" y="226.6667" text-anchor="middle" font-size="15.1111" fill="#333333">Migrate incrementally</ns0:text>
  <ns0:text x="942.2222" y="257.7778" text-anchor="middle" font-size="15.1111" fill="#333333">Use CI/CD pipeline</ns0:text>
  <ns0:rect x="35.5556" y="324.4444" width="1066.6667" height="80" rx="8.8889" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="357.3333" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#1565c0">Python 2 EOL: January 1, 2020</ns0:text>
  <ns0:text x="568.8889" y="387.5556" text-anchor="middle" font-size="15.1111" fill="#333333">All new projects should use Python 3. Migration of legacy code is essential.</ns0:text>
  <ns0:rect x="35.5556" y="442.6667" width="1066.6667" height="80" rx="8.8889" fill="#fce4ec" stroke="#c62828" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="475.5556" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#c62828">Strategy: Write code compatible with both 2 and 3 during transition</ns0:text>
  <ns0:text x="568.8889" y="505.7778" text-anchor="middle" font-size="15.1111" fill="#333333">Use six library or python-future for compatibility layers</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="88.3333" text-anchor="middle" font-size="26.0708" font-weight="bold" fill="var(--primary-accent)">Python 2 to 3 Migration Summary</text>
  <rect x="77.5" y="120.5556" width="337.5" height="177.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="246.25" y="156.8056" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">Key Changes</text>
  <text x="246.25" y="189.0277" text-anchor="middle" font-size="14.7735" fill="var(--text)">print() function</text>
  <text x="246.25" y="217.2223" text-anchor="middle" font-size="14.7735" fill="var(--text)">Unicode strings</text>
  <text x="246.25" y="245.4167" text-anchor="middle" font-size="14.7735" fill="var(--text)">Integer division</text>
  <text x="246.25" y="273.6111" text-anchor="middle" font-size="14.7735" fill="var(--text)">Exception syntax</text>
  <rect x="471.25" y="120.5556" width="337.5" height="177.2223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="156.8056" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">Tools</text>
  <text x="640" y="189.0277" text-anchor="middle" font-size="14.7735" fill="var(--text)">2to3 converter</text>
  <text x="640" y="217.2223" text-anchor="middle" font-size="14.7735" fill="var(--text)">futurize / modernize</text>
  <text x="640" y="245.4167" text-anchor="middle" font-size="14.7735" fill="var(--text)">pylint --py3k</text>
  <text x="640" y="273.6111" text-anchor="middle" font-size="14.7735" fill="var(--text)">pyupgrade</text>
  <rect x="865" y="120.5556" width="337.5" height="177.2223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1033.75" y="156.8056" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text-muted)">Best Practices</text>
  <text x="1033.75" y="189.0277" text-anchor="middle" font-size="14.7735" fill="var(--text)">Use __future__ imports</text>
  <text x="1033.75" y="217.2223" text-anchor="middle" font-size="14.7735" fill="var(--text)">Test thoroughly</text>
  <text x="1033.75" y="245.4167" text-anchor="middle" font-size="14.7735" fill="var(--text)">Migrate incrementally</text>
  <text x="1033.75" y="273.6111" text-anchor="middle" font-size="14.7735" fill="var(--text)">Use CI/CD pipeline</text>
  <rect x="77.5" y="334.0277" width="1125" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="363.8333" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">Python 2 EOL: January 1, 2020</text>
  <text x="640" y="391.2223" text-anchor="middle" font-size="14.7735" fill="var(--text)">All new projects should use Python 3. Migration of legacy code is essential.</text>
  <rect x="77.5" y="441.1667" width="1125" height="72.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="470.9723" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--danger-accent)">Strategy: Write code compatible with both 2 and 3 during transition</text>
  <text x="640" y="498.3611" text-anchor="middle" font-size="14.7735" fill="var(--text)">Use six library or python-future for compatibility layers</text>
</svg>
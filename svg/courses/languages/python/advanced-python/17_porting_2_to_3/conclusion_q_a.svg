<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="60" text-anchor="middle" font-size="30" font-weight="bold" fill="#1565c0">Python 2 to 3 Migration Summary</text>
  <!-- Three columns -->
  <rect x="40" y="100" width="360" height="220" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="145" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">Key Changes</text>
  <text x="220" y="185" text-anchor="middle" font-size="17" fill="#333333">print() function</text>
  <text x="220" y="220" text-anchor="middle" font-size="17" fill="#333333">Unicode strings</text>
  <text x="220" y="255" text-anchor="middle" font-size="17" fill="#333333">Integer division</text>
  <text x="220" y="290" text-anchor="middle" font-size="17" fill="#333333">Exception syntax</text>
  <rect x="460" y="100" width="360" height="220" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="145" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">Tools</text>
  <text x="640" y="185" text-anchor="middle" font-size="17" fill="#333333">2to3 converter</text>
  <text x="640" y="220" text-anchor="middle" font-size="17" fill="#333333">futurize / modernize</text>
  <text x="640" y="255" text-anchor="middle" font-size="17" fill="#333333">pylint --py3k</text>
  <text x="640" y="290" text-anchor="middle" font-size="17" fill="#333333">pyupgrade</text>
  <rect x="880" y="100" width="360" height="220" rx="10" fill="#fff9c4" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="145" text-anchor="middle" font-size="20" font-weight="bold" fill="#795548">Best Practices</text>
  <text x="1060" y="185" text-anchor="middle" font-size="17" fill="#333333">Use __future__ imports</text>
  <text x="1060" y="220" text-anchor="middle" font-size="17" fill="#333333">Test thoroughly</text>
  <text x="1060" y="255" text-anchor="middle" font-size="17" fill="#333333">Migrate incrementally</text>
  <text x="1060" y="290" text-anchor="middle" font-size="17" fill="#333333">Use CI/CD pipeline</text>
  <!-- EOL banner -->
  <rect x="40" y="365" width="1200" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="402" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">Python 2 EOL: January 1, 2020</text>
  <text x="640" y="436" text-anchor="middle" font-size="17" fill="#333333">All new projects should use Python 3. Migration of legacy code is essential.</text>
  <!-- Strategy banner -->
  <rect x="40" y="498" width="1200" height="90" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="535" text-anchor="middle" font-size="20" font-weight="bold" fill="#c62828">Strategy: Write code compatible with both 2 and 3 during transition</text>
  <text x="640" y="569" text-anchor="middle" font-size="17" fill="#333333">Use six library or python-future for compatibility layers</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f5f5f5" rx="16" />
  <text x="640" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="38.4" font-weight="bold" fill="#1565c0">Python 2 to 3 Migration Summary</text>
  <rect x="64" y="162" width="352" height="216" rx="12.8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2" />
  <text x="240" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#1565c0">Key Changes</text>
  <text x="240" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">print() function</text>
  <text x="240" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">Unicode strings</text>
  <text x="240" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">Integer division</text>
  <rect x="464" y="162" width="352" height="216" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="640" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#2e7d32">Tools</text>
  <text x="640" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">2to3 converter</text>
  <text x="640" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">futurize / modernize</text>
  <text x="640" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">pylint --py3k</text>
  <rect x="864" y="162" width="352" height="216" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="1040" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#e65100">Best Practices</text>
  <text x="1040" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">Use __future__ imports</text>
  <text x="1040" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">Test thoroughly</text>
  <text x="1040" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">Migrate incrementally</text>
  <rect x="64" y="432" width="1152" height="108" rx="12.8" fill="#e8eaf6" stroke="#283593" stroke-width="3.2" />
  <text x="640" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#283593">Python 2 EOL: January 1, 2020</text>
  <text x="640" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">All new projects should use Python 3. Migration of legacy code is essential.</text>
  <rect x="64" y="576" width="1152" height="99" rx="12.8" fill="#fce4ec" stroke="#c62828" stroke-width="3.2" />
  <text x="640" y="621" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#c62828">Strategy: Write code compatible with both 2 and 3 during transition</text>
  <text x="640" y="657" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">Use six library or python-future for compatibility layers</text>
</svg>
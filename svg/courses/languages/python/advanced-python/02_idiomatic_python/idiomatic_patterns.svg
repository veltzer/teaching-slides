<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Title -->
  <rect x="68.125" y="53.5938" width="1143.75" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="78.9688" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--bg)" text-anchor="middle">Idiomatic Python Patterns</text>

  <!-- Comprehensions -->
  <rect x="68.125" y="107.9688" width="356.25" height="235.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="68.125" y="107.9688" width="356.25" height="34.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="246.25" y="130.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Comprehensions</text>
  <rect x="77.5" y="148.75" width="337.5" height="181.25" rx="6" fill="var(--code-bg)"/>
  <text x="91.5625" y="170.5" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Non-idiomatic:</text>
  <text x="91.5625" y="188.625" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">result = []</text>
  <text x="91.5625" y="206.75" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">for x in data:</text>
  <text x="91.5625" y="224.875" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">    result.append(x*2)</text>
  <text x="91.5625" y="248.4375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Idiomatic:</text>
  <text x="91.5625" y="266.5625" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">result = [x*2 for x in data]</text>
  <text x="91.5625" y="291.9375" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">evens  = {x for x in d if x%2==0}</text>
  <text x="91.5625" y="310.0625" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">sq_map = {k: k**2 for k in range(5)}</text>

  <!-- Context managers -->
  <rect x="443.125" y="107.9688" width="356.25" height="235.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="443.125" y="107.9688" width="356.25" height="34.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="621.25" y="130.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Context Managers</text>
  <rect x="452.5" y="148.75" width="337.5" height="181.25" rx="6" fill="var(--code-bg)"/>
  <text x="466.5625" y="170.5" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Non-idiomatic:</text>
  <text x="466.5625" y="188.625" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">f = open("file.txt")</text>
  <text x="466.5625" y="206.75" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">data = f.read()</text>
  <text x="466.5625" y="224.875" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">f.close()</text>
  <text x="466.5625" y="248.4375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Idiomatic:</text>
  <text x="466.5625" y="266.5625" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">with open("file.txt") as f:</text>
  <text x="466.5625" y="284.6875" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">    data = f.read()</text>
  <text x="466.5625" y="307.3438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Calls __enter__ / __exit__ automatically</text>

  <!-- Generators -->
  <rect x="818.125" y="107.9688" width="393.75" height="235.625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="818.125" y="107.9688" width="393.75" height="34.4375" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1015" y="130.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Generators</text>
  <rect x="827.5" y="148.75" width="375" height="181.25" rx="6" fill="var(--code-bg)"/>
  <text x="841.5625" y="170.5" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Lazy sequence (memory efficient):</text>
  <text x="841.5625" y="188.625" font-family="monospace" font-size="11.0609" fill="var(--info-accent)">def squares(n):</text>
  <text x="841.5625" y="206.75" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">    for i in range(n):</text>
  <text x="841.5625" y="224.875" font-family="monospace" font-size="11.0609" fill="var(--warn-accent)">        yield i * i</text>
  <text x="841.5625" y="246.625" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Generator expression:</text>
  <text x="841.5625" y="264.75" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">g = (x*x for x in range(1000))</text>
  <text x="841.5625" y="286.5" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">total = sum(x*x for x in data)</text>
  <text x="841.5625" y="307.3438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Values produced on demand -- no list built</text>

  <!-- Bottom row -->
  <!-- Unpacking -->
  <rect x="68.125" y="361.7188" width="356.25" height="231.0938" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="68.125" y="361.7188" width="356.25" height="34.4375" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="246.25" y="384.375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Unpacking</text>
  <rect x="77.5" y="402.5" width="337.5" height="176.7188" rx="6" fill="var(--code-bg)"/>
  <text x="91.5625" y="422.4375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Tuple unpacking:</text>
  <text x="91.5625" y="440.5625" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">a, b, c = (1, 2, 3)</text>
  <text x="91.5625" y="458.6875" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">first, *rest = [1, 2, 3, 4]</text>
  <text x="91.5625" y="476.8125" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">*init, last = [1, 2, 3, 4]</text>
  <text x="91.5625" y="498.5625" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Swap without temp:</text>
  <text x="91.5625" y="516.6875" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">a, b = b, a</text>
  <text x="91.5625" y="538.4375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># Unpack in loop:</text>
  <text x="91.5625" y="556.5625" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">for k, v in d.items(): ...</text>

  <!-- EAFP vs LBYL -->
  <rect x="443.125" y="361.7188" width="768.75" height="231.0938" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="443.125" y="361.7188" width="768.75" height="34.4375" rx="6" fill="var(--text-muted)"/>
  <text x="827.5" y="384.375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">EAFP vs LBYL Philosophy</text>

  <!-- LBYL left -->
  <rect x="452.5" y="402.5" width="360.9375" height="176.7188" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="632.5" y="424.25" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">LBYL -- Look Before You Leap (non-Pythonic)</text>
  <rect x="461.875" y="431.5" width="342.1875" height="99.6875" rx="6" fill="var(--code-bg)"/>
  <text x="475.9375" y="451.4375" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">if key in d:</text>
  <text x="475.9375" y="469.5625" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">    value = d[key]</text>
  <text x="475.9375" y="487.6875" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">else:</text>
  <text x="475.9375" y="505.8125" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">    value = default</text>
  <text x="461.875" y="545.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Race condition risk; verbose; checks twice</text>

  <!-- EAFP right -->
  <rect x="827.5" y="402.5" width="365.625" height="176.7188" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1010.3125" y="424.25" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">EAFP -- Easier to Ask Forgiveness (Pythonic)</text>
  <rect x="836.875" y="431.5" width="346.875" height="99.6875" rx="6" fill="var(--code-bg)"/>
  <text x="850.9375" y="451.4375" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">try:</text>
  <text x="850.9375" y="469.5625" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">    value = d[key]</text>
  <text x="850.9375" y="487.6875" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)">except KeyError:</text>
  <text x="850.9375" y="505.8125" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">    value = default</text>
  <text x="836.875" y="545.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Cleaner; no race; Pythonic; uses exceptions</text>
  <text x="827.5" y="568.3438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)">Or even: value = d.get(key, default)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="45" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Idiomatic Python</text>

  <rect x="40" y="100" width="373" height="250" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Comprehensions</text>
  <text x="60" y="165" font-family="Courier New, monospace" font-size="12" fill="var(--primary-text)">[x*2 for x in data]</text>
  <text x="60" y="195" font-family="Courier New, monospace" font-size="12" fill="var(--primary-text)">{x for x in d}</text>
  <text x="60" y="225" font-family="Courier New, monospace" font-size="12" fill="var(--primary-text)">{k: k**2 for k in r}</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">List/dict/set/gen forms.</text>

  <rect x="433" y="100" width="373" height="250" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Context Managers</text>
  <text x="453" y="165" font-family="Courier New, monospace" font-size="12" fill="var(--ok-text)">with open("f") as f:</text>
  <text x="453" y="195" font-family="Courier New, monospace" font-size="12" fill="var(--ok-text)">    data = f.read()</text>
  <text x="453" y="245" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">No close needed.</text>
  <text x="453" y="280" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">__enter__/__exit__.</text>

  <rect x="826" y="100" width="414" height="250" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Generators</text>
  <text x="846" y="175" font-family="Courier New, monospace" font-size="12" fill="var(--warn-text)">def f(n):</text>
  <text x="846" y="200" font-family="Courier New, monospace" font-size="12" fill="var(--warn-text)">  yield i*i</text>
  <text x="846" y="240" font-family="Courier New, monospace" font-size="12" fill="var(--warn-text)">(x*x for x in r)</text>
  <text x="846" y="285" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">Lazy.</text>

  <rect x="40" y="370" width="373" height="250" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Unpacking</text>
  <text x="60" y="435" font-family="Courier New, monospace" font-size="12" fill="var(--info-text)">a,b,c = (1,2,3)</text>
  <text x="60" y="460" font-family="Courier New, monospace" font-size="12" fill="var(--info-text)">first,*rest = xs</text>
  <text x="60" y="485" font-family="Courier New, monospace" font-size="12" fill="var(--info-text)">a,b = b,a</text>
  <text x="60" y="510" font-family="Courier New, monospace" font-size="12" fill="var(--info-text)">for k,v in d.items():</text>

  <rect x="433" y="370" width="380" height="250" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-text)">LBYL (avoid)</text>
  <text x="453" y="450" font-family="Courier New, monospace" font-size="12" fill="var(--danger-text)">if key in d: v=d[key]</text>
  <text x="453" y="480" font-family="Courier New, monospace" font-size="12" fill="var(--danger-text)">else: v=default</text>
  <text x="453" y="555" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-text)">Race risk.</text>

  <rect x="833" y="370" width="407" height="250" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">EAFP (prefer)</text>
  <text x="853" y="450" font-family="Courier New, monospace" font-size="12" fill="var(--ok-text)">try: v=d[key]</text>
  <text x="853" y="480" font-family="Courier New, monospace" font-size="12" fill="var(--ok-text)">except KeyError: v=default</text>
  <text x="853" y="520" font-family="Courier New, monospace" font-size="12" fill="var(--ok-text)">or d.get(key,default)</text>
  <text x="853" y="560" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Pythonic.</text>
</svg>

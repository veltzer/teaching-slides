<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <!-- Title -->
  <rect x="40" y="40" width="1200" height="42.890752" rx="6.373938" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="67.294115" font-family="Arial, sans-serif" font-size="19.583817" font-weight="bold" fill="var(--bg)" text-anchor="middle">Idiomatic Python Patterns</text>

  <!-- Comprehensions -->
  <rect x="40" y="98.48739" width="373.770492" height="253.445355" rx="6.373938" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="98.48739" width="373.770492" height="37.042013" rx="6.373938" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="226.885246" y="122.857081" font-family="Arial, sans-serif" font-size="13.70864" font-weight="bold" fill="var(--bg)" text-anchor="middle">Comprehensions</text>
  <rect x="49.836066" y="142.352878" width="354.098361" height="194.957965" rx="6.373938" fill="var(--code-bg)"/>
  <text x="64.590164" y="165.747834" font-family="monospace" font-size="11.750248" fill="var(--text-muted)"># Non-idiomatic:</text>
  <text x="64.590164" y="185.24363" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">result = []</text>
  <text x="64.590164" y="204.739427" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">for x in data:</text>
  <text x="64.590164" y="224.235223" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">    result.append(x*2)</text>
  <text x="64.590164" y="249.579759" font-family="monospace" font-size="11.750248" fill="var(--text-muted)"># Idiomatic:</text>
  <text x="64.590164" y="269.075555" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">result = [x*2 for x in data]</text>
  <text x="64.590164" y="296.36967" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">evens  = {x for x in d if x%2==0}</text>
  <text x="64.590164" y="315.865467" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">sq_map = {k: k**2 for k in range(5)}</text>

  <!-- Context managers -->
  <rect x="433.442623" y="98.48739" width="373.770492" height="253.445355" rx="6.373938" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="433.442623" y="98.48739" width="373.770492" height="37.042013" rx="6.373938" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="620.327869" y="122.857081" font-family="Arial, sans-serif" font-size="13.70864" font-weight="bold" fill="var(--bg)" text-anchor="middle">Context Managers</text>
  <rect x="443.278689" y="142.352878" width="354.098361" height="194.957965" rx="6.373938" fill="var(--code-bg)"/>
  <text x="458.032787" y="165.747834" font-family="monospace" font-size="11.750248" fill="var(--text-muted)"># Non-idiomatic:</text>
  <text x="458.032787" y="185.24363" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">f = open("file.txt")</text>
  <text x="458.032787" y="204.739427" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">data = f.read()</text>
  <text x="458.032787" y="224.235223" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">f.close()</text>
  <text x="458.032787" y="249.579759" font-family="monospace" font-size="11.750248" fill="var(--text-muted)"># Idiomatic:</text>
  <text x="458.032787" y="269.075555" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">with open("file.txt") as f:</text>
  <text x="458.032787" y="288.571352" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">    data = f.read()</text>
  <text x="458.032787" y="312.941151" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text-muted)">Calls __enter__ / __exit__ automatically</text>

  <!-- Generators -->
  <rect x="826.885246" y="98.48739" width="413.114754" height="253.445355" rx="6.373938" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="826.885246" y="98.48739" width="413.114754" height="37.042013" rx="6.373938" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1033.442623" y="122.857081" font-family="Arial, sans-serif" font-size="13.70864" font-weight="bold" fill="var(--bg)" text-anchor="middle">Generators</text>
  <rect x="836.721311" y="142.352878" width="393.442623" height="194.957965" rx="6.373938" fill="var(--code-bg)"/>
  <text x="851.47541" y="165.747834" font-family="monospace" font-size="11.750248" fill="var(--text-muted)"># Lazy sequence (memory efficient):</text>
  <text x="851.47541" y="185.24363" font-family="monospace" font-size="11.750248" fill="var(--info-accent)">def squares(n):</text>
  <text x="851.47541" y="204.739427" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">    for i in range(n):</text>
  <text x="851.47541" y="224.235223" font-family="monospace" font-size="11.750248" fill="var(--warn-accent)">        yield i * i</text>
  <text x="851.47541" y="247.630179" font-family="monospace" font-size="11.750248" fill="var(--text-muted)"># Generator expression:</text>
  <text x="851.47541" y="267.125976" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">g = (x*x for x in range(1000))</text>
  <text x="851.47541" y="290.520931" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">total = sum(x*x for x in data)</text>
  <text x="851.47541" y="312.941151" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text-muted)">Values produced on demand -- no list built</text>

  <!-- Bottom row -->
  <!-- Unpacking -->
  <rect x="40" y="371.428541" width="373.770492" height="248.571459" rx="6.373938" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="371.428541" width="373.770492" height="37.042013" rx="6.373938" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="226.885246" y="395.798233" font-family="Arial, sans-serif" font-size="13.70864" font-weight="bold" fill="var(--bg)" text-anchor="middle">Unpacking</text>
  <rect x="49.836066" y="415.294029" width="354.098361" height="190.08407" rx="6.373938" fill="var(--code-bg)"/>
  <text x="64.590164" y="436.739405" font-family="monospace" font-size="11.750248" fill="var(--text-muted)"># Tuple unpacking:</text>
  <text x="64.590164" y="456.235202" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">a, b, c = (1, 2, 3)</text>
  <text x="64.590164" y="475.730998" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">first, *rest = [1, 2, 3, 4]</text>
  <text x="64.590164" y="495.226795" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">*init, last = [1, 2, 3, 4]</text>
  <text x="64.590164" y="518.621751" font-family="monospace" font-size="11.750248" fill="var(--text-muted)"># Swap without temp:</text>
  <text x="64.590164" y="538.117547" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">a, b = b, a</text>
  <text x="64.590164" y="561.512503" font-family="monospace" font-size="11.750248" fill="var(--text-muted)"># Unpack in loop:</text>
  <text x="64.590164" y="581.008299" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">for k, v in d.items(): ...</text>

  <!-- EAFP vs LBYL -->
  <rect x="433.442623" y="371.428541" width="806.557377" height="248.571459" rx="6.373938" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="433.442623" y="371.428541" width="806.557377" height="37.042013" rx="6.373938" fill="var(--text-muted)"/>
  <text x="836.721311" y="395.798233" font-family="Arial, sans-serif" font-size="13.70864" font-weight="bold" fill="var(--bg)" text-anchor="middle">EAFP vs LBYL Philosophy</text>

  <!-- LBYL left -->
  <rect x="443.278689" y="415.294029" width="378.688525" height="190.08407" rx="6.373938" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="632.131148" y="438.688985" font-family="Arial, sans-serif" font-size="12.729497" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">LBYL -- Look Before You Leap (non-Pythonic)</text>
  <rect x="453.114754" y="446.487303" width="359.016393" height="107.226881" rx="6.373938" fill="var(--code-bg)"/>
  <text x="467.868852" y="467.93268" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">if key in d:</text>
  <text x="467.868852" y="487.428476" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">    value = d[key]</text>
  <text x="467.868852" y="506.924273" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">else:</text>
  <text x="467.868852" y="526.420069" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">    value = default</text>
  <text x="453.114754" y="569.310822" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text-faint)">Race condition risk; verbose; checks twice</text>

  <!-- EAFP right -->
  <rect x="836.721311" y="415.294029" width="383.606557" height="190.08407" rx="6.373938" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1028.52459" y="438.688985" font-family="Arial, sans-serif" font-size="12.729497" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">EAFP -- Easier to Ask Forgiveness (Pythonic)</text>
  <rect x="846.557377" y="446.487303" width="363.934426" height="107.226881" rx="6.373938" fill="var(--code-bg)"/>
  <text x="861.311475" y="467.93268" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">try:</text>
  <text x="861.311475" y="487.428476" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">    value = d[key]</text>
  <text x="861.311475" y="506.924273" font-family="monospace" font-size="11.750248" fill="var(--primary-accent)">except KeyError:</text>
  <text x="861.311475" y="526.420069" font-family="monospace" font-size="11.750248" fill="var(--ok-accent)">    value = default</text>
  <text x="846.557377" y="569.310822" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text-faint)">Cleaner; no race; Pythonic; uses exceptions</text>
  <text x="836.721311" y="593.680621" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text-faint)">Or even: value = d.get(key, default)</text>
</svg>

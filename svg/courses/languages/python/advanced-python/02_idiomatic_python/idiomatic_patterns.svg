<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--bg)" text-anchor="middle">Idiomatic Python Patterns</text>

  <!-- Comprehensions -->
  <rect x="30" y="75" width="380" height="260" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="380" height="38" rx="8" fill="url(#grad-primary)"/>
  <text x="220" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Comprehensions</text>
  <rect x="40" y="120" width="360" height="200" rx="4" fill="var(--code-bg)"/>
  <text x="55" y="144" font-family="monospace" font-size="12" fill="var(--text-lighter)"># Non-idiomatic:</text>
  <text x="55" y="164" font-family="monospace" font-size="12" fill="var(--primary-lt)">result = []</text>
  <text x="55" y="184" font-family="monospace" font-size="12" fill="var(--primary-lt)">for x in data:</text>
  <text x="55" y="204" font-family="monospace" font-size="12" fill="var(--primary-lt)">    result.append(x*2)</text>
  <text x="55" y="230" font-family="monospace" font-size="12" fill="var(--text-lighter)"># Idiomatic:</text>
  <text x="55" y="250" font-family="monospace" font-size="12" fill="var(--ok-tint)">result = [x*2 for x in data]</text>
  <text x="55" y="278" font-family="monospace" font-size="12" fill="var(--ok-tint)">evens  = {x for x in d if x%2==0}</text>
  <text x="55" y="298" font-family="monospace" font-size="12" fill="var(--ok-tint)">sq_map = {k: k**2 for k in range(5)}</text>

  <!-- Context managers -->
  <rect x="430" y="75" width="380" height="260" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="75" width="380" height="38" rx="8" fill="url(#grad-ok)"/>
  <text x="620" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Context Managers</text>
  <rect x="440" y="120" width="360" height="200" rx="4" fill="var(--code-bg)"/>
  <text x="455" y="144" font-family="monospace" font-size="12" fill="var(--text-lighter)"># Non-idiomatic:</text>
  <text x="455" y="164" font-family="monospace" font-size="12" fill="var(--primary-lt)">f = open("file.txt")</text>
  <text x="455" y="184" font-family="monospace" font-size="12" fill="var(--primary-lt)">data = f.read()</text>
  <text x="455" y="204" font-family="monospace" font-size="12" fill="var(--primary-lt)">f.close()</text>
  <text x="455" y="230" font-family="monospace" font-size="12" fill="var(--text-lighter)"># Idiomatic:</text>
  <text x="455" y="250" font-family="monospace" font-size="12" fill="var(--ok-tint)">with open("file.txt") as f:</text>
  <text x="455" y="270" font-family="monospace" font-size="12" fill="var(--ok-tint)">    data = f.read()</text>
  <text x="455" y="295" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">Calls __enter__ / __exit__ automatically</text>

  <!-- Generators -->
  <rect x="830" y="75" width="420" height="260" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="830" y="75" width="420" height="38" rx="8" fill="url(#grad-warn)"/>
  <text x="1040" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Generators</text>
  <rect x="840" y="120" width="400" height="200" rx="4" fill="var(--code-bg)"/>
  <text x="855" y="144" font-family="monospace" font-size="12" fill="var(--text-lighter)"># Lazy sequence (memory efficient):</text>
  <text x="855" y="164" font-family="monospace" font-size="12" fill="var(--info-tint)">def squares(n):</text>
  <text x="855" y="184" font-family="monospace" font-size="12" fill="var(--primary-lt)">    for i in range(n):</text>
  <text x="855" y="204" font-family="monospace" font-size="12" fill="var(--warn-tint)">        yield i * i</text>
  <text x="855" y="228" font-family="monospace" font-size="12" fill="var(--text-lighter)"># Generator expression:</text>
  <text x="855" y="248" font-family="monospace" font-size="12" fill="var(--ok-tint)">g = (x*x for x in range(1000))</text>
  <text x="855" y="272" font-family="monospace" font-size="12" fill="var(--ok-tint)">total = sum(x*x for x in data)</text>
  <text x="855" y="295" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">Values produced on demand -- no list built</text>

  <!-- Bottom row -->
  <!-- Unpacking -->
  <rect x="30" y="355" width="380" height="255" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="355" width="380" height="38" rx="8" fill="url(#grad-info)"/>
  <text x="220" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Unpacking</text>
  <rect x="40" y="400" width="360" height="195" rx="4" fill="var(--code-bg)"/>
  <text x="55" y="422" font-family="monospace" font-size="12" fill="var(--text-lighter)"># Tuple unpacking:</text>
  <text x="55" y="442" font-family="monospace" font-size="12" fill="var(--ok-tint)">a, b, c = (1, 2, 3)</text>
  <text x="55" y="462" font-family="monospace" font-size="12" fill="var(--ok-tint)">first, *rest = [1, 2, 3, 4]</text>
  <text x="55" y="482" font-family="monospace" font-size="12" fill="var(--ok-tint)">*init, last = [1, 2, 3, 4]</text>
  <text x="55" y="506" font-family="monospace" font-size="12" fill="var(--text-lighter)"># Swap without temp:</text>
  <text x="55" y="526" font-family="monospace" font-size="12" fill="var(--ok-tint)">a, b = b, a</text>
  <text x="55" y="550" font-family="monospace" font-size="12" fill="var(--text-lighter)"># Unpack in loop:</text>
  <text x="55" y="570" font-family="monospace" font-size="12" fill="var(--ok-tint)">for k, v in d.items(): ...</text>

  <!-- EAFP vs LBYL -->
  <rect x="430" y="355" width="820" height="255" rx="8" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="430" y="355" width="820" height="38" rx="8" fill="var(--text-muted)"/>
  <text x="840" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">EAFP vs LBYL Philosophy</text>

  <!-- LBYL left -->
  <rect x="440" y="400" width="385" height="195" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="632" y="424" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">LBYL -- Look Before You Leap (non-Pythonic)</text>
  <rect x="450" y="432" width="365" height="110" rx="4" fill="var(--code-bg)"/>
  <text x="465" y="454" font-family="monospace" font-size="12" fill="var(--primary-lt)">if key in d:</text>
  <text x="465" y="474" font-family="monospace" font-size="12" fill="var(--primary-lt)">    value = d[key]</text>
  <text x="465" y="494" font-family="monospace" font-size="12" fill="var(--primary-lt)">else:</text>
  <text x="465" y="514" font-family="monospace" font-size="12" fill="var(--primary-lt)">    value = default</text>
  <text x="450" y="558" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Race condition risk; verbose; checks twice</text>

  <!-- EAFP right -->
  <rect x="840" y="400" width="390" height="195" rx="6" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="1035" y="424" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">EAFP -- Easier to Ask Forgiveness (Pythonic)</text>
  <rect x="850" y="432" width="370" height="110" rx="4" fill="var(--code-bg)"/>
  <text x="865" y="454" font-family="monospace" font-size="12" fill="var(--primary-lt)">try:</text>
  <text x="865" y="474" font-family="monospace" font-size="12" fill="var(--ok-tint)">    value = d[key]</text>
  <text x="865" y="494" font-family="monospace" font-size="12" fill="var(--primary-lt)">except KeyError:</text>
  <text x="865" y="514" font-family="monospace" font-size="12" fill="var(--ok-tint)">    value = default</text>
  <text x="850" y="558" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Cleaner; no race; Pythonic; uses exceptions</text>
  <text x="840" y="583" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)">Or even: value = d.get(key, default)</text>
</svg>

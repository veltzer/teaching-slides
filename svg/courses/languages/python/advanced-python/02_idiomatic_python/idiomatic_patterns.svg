<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Title -->
  <rect x="30" y="15" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Idiomatic Python Patterns</text>

  <!-- Comprehensions -->
  <rect x="30" y="75" width="380" height="260" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="380" height="38" rx="8" fill="url(#grad-primary)"/>
  <text x="220" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Comprehensions</text>
  <rect x="40" y="120" width="360" height="200" rx="4" fill="#1a1a2e"/>
  <text x="55" y="144" font-family="monospace" font-size="12" fill="#777777"># Non-idiomatic:</text>
  <text x="55" y="164" font-family="monospace" font-size="12" fill="#bbdefb">result = []</text>
  <text x="55" y="184" font-family="monospace" font-size="12" fill="#bbdefb">for x in data:</text>
  <text x="55" y="204" font-family="monospace" font-size="12" fill="#bbdefb">    result.append(x*2)</text>
  <text x="55" y="230" font-family="monospace" font-size="12" fill="#777777"># Idiomatic:</text>
  <text x="55" y="250" font-family="monospace" font-size="12" fill="#a5d6a7">result = [x*2 for x in data]</text>
  <text x="55" y="278" font-family="monospace" font-size="12" fill="#a5d6a7">evens  = {x for x in d if x%2==0}</text>
  <text x="55" y="298" font-family="monospace" font-size="12" fill="#a5d6a7">sq_map = {k: k**2 for k in range(5)}</text>

  <!-- Context managers -->
  <rect x="430" y="75" width="380" height="260" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="75" width="380" height="38" rx="8" fill="url(#grad-ok)"/>
  <text x="620" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Context Managers</text>
  <rect x="440" y="120" width="360" height="200" rx="4" fill="#1a1a2e"/>
  <text x="455" y="144" font-family="monospace" font-size="12" fill="#777777"># Non-idiomatic:</text>
  <text x="455" y="164" font-family="monospace" font-size="12" fill="#bbdefb">f = open("file.txt")</text>
  <text x="455" y="184" font-family="monospace" font-size="12" fill="#bbdefb">data = f.read()</text>
  <text x="455" y="204" font-family="monospace" font-size="12" fill="#bbdefb">f.close()</text>
  <text x="455" y="230" font-family="monospace" font-size="12" fill="#777777"># Idiomatic:</text>
  <text x="455" y="250" font-family="monospace" font-size="12" fill="#a5d6a7">with open("file.txt") as f:</text>
  <text x="455" y="270" font-family="monospace" font-size="12" fill="#a5d6a7">    data = f.read()</text>
  <text x="455" y="295" font-family="Arial, sans-serif" font-size="12" fill="#777777">Calls __enter__ / __exit__ automatically</text>

  <!-- Generators -->
  <rect x="830" y="75" width="420" height="260" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="830" y="75" width="420" height="38" rx="8" fill="url(#grad-warn)"/>
  <text x="1040" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Generators</text>
  <rect x="840" y="120" width="400" height="200" rx="4" fill="#1a1a2e"/>
  <text x="855" y="144" font-family="monospace" font-size="12" fill="#777777"># Lazy sequence (memory efficient):</text>
  <text x="855" y="164" font-family="monospace" font-size="12" fill="#e1bee7">def squares(n):</text>
  <text x="855" y="184" font-family="monospace" font-size="12" fill="#bbdefb">    for i in range(n):</text>
  <text x="855" y="204" font-family="monospace" font-size="12" fill="#ffcc80">        yield i * i</text>
  <text x="855" y="228" font-family="monospace" font-size="12" fill="#777777"># Generator expression:</text>
  <text x="855" y="248" font-family="monospace" font-size="12" fill="#a5d6a7">g = (x*x for x in range(1000))</text>
  <text x="855" y="272" font-family="monospace" font-size="12" fill="#a5d6a7">total = sum(x*x for x in data)</text>
  <text x="855" y="295" font-family="Arial, sans-serif" font-size="12" fill="#777777">Values produced on demand -- no list built</text>

  <!-- Bottom row -->
  <!-- Unpacking -->
  <rect x="30" y="355" width="380" height="255" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="355" width="380" height="38" rx="8" fill="url(#grad-info)"/>
  <text x="220" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Unpacking</text>
  <rect x="40" y="400" width="360" height="195" rx="4" fill="#1a1a2e"/>
  <text x="55" y="422" font-family="monospace" font-size="12" fill="#777777"># Tuple unpacking:</text>
  <text x="55" y="442" font-family="monospace" font-size="12" fill="#a5d6a7">a, b, c = (1, 2, 3)</text>
  <text x="55" y="462" font-family="monospace" font-size="12" fill="#a5d6a7">first, *rest = [1, 2, 3, 4]</text>
  <text x="55" y="482" font-family="monospace" font-size="12" fill="#a5d6a7">*init, last = [1, 2, 3, 4]</text>
  <text x="55" y="506" font-family="monospace" font-size="12" fill="#777777"># Swap without temp:</text>
  <text x="55" y="526" font-family="monospace" font-size="12" fill="#a5d6a7">a, b = b, a</text>
  <text x="55" y="550" font-family="monospace" font-size="12" fill="#777777"># Unpack in loop:</text>
  <text x="55" y="570" font-family="monospace" font-size="12" fill="#a5d6a7">for k, v in d.items(): ...</text>

  <!-- EAFP vs LBYL -->
  <rect x="430" y="355" width="820" height="255" rx="8" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="430" y="355" width="820" height="38" rx="8" fill="#555555"/>
  <text x="840" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">EAFP vs LBYL Philosophy</text>

  <!-- LBYL left -->
  <rect x="440" y="400" width="385" height="195" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <text x="632" y="424" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">LBYL -- Look Before You Leap (non-Pythonic)</text>
  <rect x="450" y="432" width="365" height="110" rx="4" fill="#1a1a2e"/>
  <text x="465" y="454" font-family="monospace" font-size="12" fill="#bbdefb">if key in d:</text>
  <text x="465" y="474" font-family="monospace" font-size="12" fill="#bbdefb">    value = d[key]</text>
  <text x="465" y="494" font-family="monospace" font-size="12" fill="#bbdefb">else:</text>
  <text x="465" y="514" font-family="monospace" font-size="12" fill="#bbdefb">    value = default</text>
  <text x="450" y="558" font-family="Arial, sans-serif" font-size="12" fill="#888888">Race condition risk; verbose; checks twice</text>

  <!-- EAFP right -->
  <rect x="840" y="400" width="390" height="195" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="1035" y="424" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">EAFP -- Easier to Ask Forgiveness (Pythonic)</text>
  <rect x="850" y="432" width="370" height="110" rx="4" fill="#1a1a2e"/>
  <text x="865" y="454" font-family="monospace" font-size="12" fill="#bbdefb">try:</text>
  <text x="865" y="474" font-family="monospace" font-size="12" fill="#a5d6a7">    value = d[key]</text>
  <text x="865" y="494" font-family="monospace" font-size="12" fill="#bbdefb">except KeyError:</text>
  <text x="865" y="514" font-family="monospace" font-size="12" fill="#a5d6a7">    value = default</text>
  <text x="850" y="558" font-family="Arial, sans-serif" font-size="12" fill="#888888">Cleaner; no race; Pythonic; uses exceptions</text>
  <text x="840" y="583" font-family="Arial, sans-serif" font-size="12" fill="#888888">Or even: value = d.get(key, default)</text>
</svg>

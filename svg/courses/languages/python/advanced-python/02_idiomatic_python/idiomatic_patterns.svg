<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <!-- Title -->
  <rect x="40" y="40" width="1200" height="42.890752" rx="6.373938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="67.294115" font-family="Arial, sans-serif" font-size="19.583817" font-weight="bold" fill="var(--bg)" text-anchor="middle">Idiomatic Python Patterns</text>

  <!-- Comprehensions -->
  <rect x="40" y="98.48739" width="373.770492" height="253.445355" rx="6.373938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="98.48739" width="373.770492" height="37.042013" rx="6.373938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.885246" y="122.857081" font-family="Arial, sans-serif" font-size="13.70864" font-weight="bold" fill="var(--bg)" text-anchor="middle">Comprehensions</text>
  <rect x="49.836066" y="142.352878" width="354.098361" height="194.957965" rx="6.373938" fill="var(--code-bg)"/>
  <text x="64.590164" y="165.747834" font-size="11.750248" fill="var(--text-muted)" font-family="Courier New, monospace"># Non-idiomatic:</text>
  <text x="64.590164" y="185.24363" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">result = []</text>
  <text x="64.590164" y="204.739427" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">for x in data:</text>
  <text x="64.590164" y="224.235223" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">    result.append(x*2)</text>
  <text x="64.590164" y="249.579759" font-size="11.750248" fill="var(--text-muted)" font-family="Courier New, monospace"># Idiomatic:</text>
  <text x="64.590164" y="269.075555" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">result = [x*2 for x in data]</text>
  <text x="64.590164" y="296.36967" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">evens  = {x for x in d if x%2==0}</text>
  <text x="64.590164" y="315.865467" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">sq_map = {k: k**2 for k in range(5)}</text>

  <!-- Context managers -->
  <rect x="433.442623" y="98.48739" width="373.770492" height="253.445355" rx="6.373938" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="433.442623" y="98.48739" width="373.770492" height="37.042013" rx="6.373938" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620.327869" y="122.857081" font-family="Arial, sans-serif" font-size="13.70864" font-weight="bold" fill="var(--bg)" text-anchor="middle">Context Managers</text>
  <rect x="443.278689" y="142.352878" width="354.098361" height="194.957965" rx="6.373938" fill="var(--code-bg)"/>
  <text x="458.032787" y="165.747834" font-size="11.750248" fill="var(--text-muted)" font-family="Courier New, monospace"># Non-idiomatic:</text>
  <text x="458.032787" y="185.24363" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">f = open("file.txt")</text>
  <text x="458.032787" y="204.739427" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">data = f.read()</text>
  <text x="458.032787" y="224.235223" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">f.close()</text>
  <text x="458.032787" y="249.579759" font-size="11.750248" fill="var(--text-muted)" font-family="Courier New, monospace"># Idiomatic:</text>
  <text x="458.032787" y="269.075555" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">with open("file.txt") as f:</text>
  <text x="458.032787" y="288.571352" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">    data = f.read()</text>
  <text x="458.032787" y="312.941151" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text-muted)">Calls __enter__ / __exit__ automatically</text>

  <!-- Generators -->
  <rect x="826.885246" y="98.48739" width="413.114754" height="253.445355" rx="6.373938" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="826.885246" y="98.48739" width="413.114754" height="37.042013" rx="6.373938" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.442623" y="122.857081" font-family="Arial, sans-serif" font-size="13.70864" font-weight="bold" fill="var(--bg)" text-anchor="middle">Generators</text>
  <rect x="836.721311" y="142.352878" width="393.442623" height="194.957965" rx="6.373938" fill="var(--code-bg)"/>
  <text x="851.47541" y="165.747834" font-size="11.750248" fill="var(--text-muted)" font-family="Courier New, monospace"># Lazy sequence (memory efficient):</text>
  <text x="851.47541" y="185.24363" font-size="11.750248" fill="var(--info-accent)" font-family="Courier New, monospace">def squares(n):</text>
  <text x="851.47541" y="204.739427" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">    for i in range(n):</text>
  <text x="851.47541" y="224.235223" font-size="11.750248" fill="var(--warn-accent)" font-family="Courier New, monospace">        yield i * i</text>
  <text x="851.47541" y="247.630179" font-size="11.750248" fill="var(--text-muted)" font-family="Courier New, monospace"># Generator expression:</text>
  <text x="851.47541" y="267.125976" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">g = (x*x for x in range(1000))</text>
  <text x="851.47541" y="290.520931" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">total = sum(x*x for x in data)</text>
  <text x="851.47541" y="312.941151" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text-muted)">Values produced on demand -- no list built</text>

  <!-- Bottom row -->
  <!-- Unpacking -->
  <rect x="40" y="371.428541" width="373.770492" height="248.571459" rx="6.373938" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="371.428541" width="373.770492" height="37.042013" rx="6.373938" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.885246" y="395.798233" font-family="Arial, sans-serif" font-size="13.70864" font-weight="bold" fill="var(--bg)" text-anchor="middle">Unpacking</text>
  <rect x="49.836066" y="415.294029" width="354.098361" height="190.08407" rx="6.373938" fill="var(--code-bg)"/>
  <text x="64.590164" y="436.739405" font-size="11.750248" fill="var(--text-muted)" font-family="Courier New, monospace"># Tuple unpacking:</text>
  <text x="64.590164" y="456.235202" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">a, b, c = (1, 2, 3)</text>
  <text x="64.590164" y="475.730998" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">first, *rest = [1, 2, 3, 4]</text>
  <text x="64.590164" y="495.226795" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">*init, last = [1, 2, 3, 4]</text>
  <text x="64.590164" y="518.621751" font-size="11.750248" fill="var(--text-muted)" font-family="Courier New, monospace"># Swap without temp:</text>
  <text x="64.590164" y="538.117547" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">a, b = b, a</text>
  <text x="64.590164" y="561.512503" font-size="11.750248" fill="var(--text-muted)" font-family="Courier New, monospace"># Unpack in loop:</text>
  <text x="64.590164" y="581.008299" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">for k, v in d.items(): ...</text>

  <!-- EAFP vs LBYL -->
  <rect x="433.442623" y="371.428541" width="806.557377" height="248.571459" rx="6.373938" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="433.442623" y="371.428541" width="806.557377" height="37.042013" rx="6.373938" fill="var(--text-muted)"/>
  <text x="836.721311" y="395.798233" font-family="Arial, sans-serif" font-size="13.70864" font-weight="bold" fill="var(--bg)" text-anchor="middle">EAFP vs LBYL Philosophy</text>

  <!-- LBYL left -->
  <rect x="443.278689" y="415.294029" width="378.688525" height="190.08407" rx="6.373938" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632.131148" y="438.688985" font-family="Arial, sans-serif" font-size="12.729497" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">LBYL -- Look Before You Leap (non-Pythonic)</text>
  <rect x="453.114754" y="446.487303" width="359.016393" height="107.226881" rx="6.373938" fill="var(--code-bg)"/>
  <text x="467.868852" y="467.93268" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">if key in d:</text>
  <text x="467.868852" y="487.428476" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">    value = d[key]</text>
  <text x="467.868852" y="506.924273" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">else:</text>
  <text x="467.868852" y="526.420069" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">    value = default</text>
  <text x="453.114754" y="569.310822" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text-faint)">Race condition risk; verbose; checks twice</text>

  <!-- EAFP right -->
  <rect x="836.721311" y="415.294029" width="383.606557" height="190.08407" rx="6.373938" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1028.52459" y="438.688985" font-family="Arial, sans-serif" font-size="12.729497" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">EAFP -- Easier to Ask Forgiveness (Pythonic)</text>
  <rect x="846.557377" y="446.487303" width="363.934426" height="107.226881" rx="6.373938" fill="var(--code-bg)"/>
  <text x="861.311475" y="467.93268" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">try:</text>
  <text x="861.311475" y="487.428476" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">    value = d[key]</text>
  <text x="861.311475" y="506.924273" font-size="11.750248" fill="var(--primary-accent)" font-family="Courier New, monospace">except KeyError:</text>
  <text x="861.311475" y="526.420069" font-size="11.750248" fill="var(--ok-accent)" font-family="Courier New, monospace">    value = default</text>
  <text x="846.557377" y="569.310822" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text-faint)">Cleaner; no race; Pythonic; uses exceptions</text>
  <text x="836.721311" y="593.680621" font-family="Arial, sans-serif" font-size="11.750248" fill="var(--text-faint)">Or even: value = d.get(key, default)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00838f"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="52" fill="url(#grad-accent)"/>
  <text x="640" y="34" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Python Web Stack: Layers &amp; Technologies</text>

  <!-- Left label: Request flow -->
  <text x="30" y="340" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888888" text-anchor="middle" transform="rotate(-90 30 340)">REQUEST ↓</text>
  <!-- Right label: Response flow -->
  <text x="1255" y="340" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888888" text-anchor="middle" transform="rotate(90 1255 340)">RESPONSE ↑</text>

  <!-- ===== LAYER 1: Browser ===== -->
  <rect x="60" y="64" width="1160" height="66" rx="10" fill="#1e88e5" filter="url(#shadow)"/>
  <text x="260" y="98" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Browser / Client</text>
  <text x="640" y="88" font-family="monospace" font-size="12" fill="#cce5ff" text-anchor="middle">Chrome, Firefox, curl, fetch(), httpx, requests</text>
  <text x="640" y="108" font-family="sans-serif" font-size="12" fill="#cce5ff" text-anchor="middle">Renders HTML/CSS/JS · Sends HTTP requests · Parses responses · Manages cookies &amp; sessions</text>
  <rect x="60" y="64" width="188" height="66" rx="10" fill="#1565c0"/>
  <text x="154" y="95" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Layer 1</text>
  <text x="154" y="114" font-family="sans-serif" font-size="11" fill="#aad4f5" text-anchor="middle">Browser / Client</text>

  <!-- Arrow 1→2 -->
  <line x1="640" y1="130" x2="640" y2="148" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="143" font-family="monospace" font-size="11" fill="#555555">HTTP/HTTPS Request (GET /api/data)</text>

  <!-- ===== LAYER 2: HTTP Request/Response ===== -->
  <rect x="60" y="150" width="1160" height="54" rx="8" fill="#42a5f5" filter="url(#shadow)"/>
  <rect x="60" y="150" width="188" height="54" rx="8" fill="#1976d2"/>
  <text x="154" y="172" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Layer 2</text>
  <text x="154" y="190" font-family="sans-serif" font-size="11" fill="#bbdefb" text-anchor="middle">HTTP Protocol</text>
  <text x="640" y="172" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">HTTP / HTTPS Request &amp; Response</text>
  <text x="640" y="192" font-family="monospace" font-size="11" fill="#e3f2fd" text-anchor="middle">Methods: GET POST PUT DELETE PATCH  ·  Status: 200 201 400 401 403 404 500  ·  Headers, Body, JSON, Forms</text>

  <!-- Arrow 2→3 -->
  <line x1="640" y1="204" x2="640" y2="220" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 3: Web Server ===== -->
  <rect x="60" y="222" width="1160" height="60" rx="8" fill="#00838f" filter="url(#shadow)"/>
  <rect x="60" y="222" width="188" height="60" rx="8" fill="#006064"/>
  <text x="154" y="246" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Layer 3</text>
  <text x="154" y="265" font-family="sans-serif" font-size="11" fill="#b2ebf2" text-anchor="middle">Web Server</text>
  <text x="640" y="244" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Web Server (Production WSGI/ASGI Server)</text>
  <text x="640" y="264" font-family="monospace" font-size="12" fill="#e0f7fa" text-anchor="middle">Gunicorn  ·  uWSGI  ·  Daphne  ·  Hypercorn  ·  Uvicorn</text>
  <text x="950" y="244" font-family="sans-serif" font-size="11" fill="#b2ebf2">Manages worker processes · SSL termination</text>
  <text x="950" y="262" font-family="sans-serif" font-size="11" fill="#b2ebf2">Load balancing · Static file serving</text>

  <!-- Arrow 3→4 -->
  <line x1="640" y1="282" x2="640" y2="298" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="293" font-family="monospace" font-size="11" fill="#555555">WSGI / ASGI callable interface</text>

  <!-- ===== LAYER 4: WSGI/ASGI Interface ===== -->
  <rect x="60" y="300" width="1160" height="54" rx="8" fill="#f57c00" filter="url(#shadow)"/>
  <rect x="60" y="300" width="188" height="54" rx="8" fill="#e65100"/>
  <text x="154" y="322" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Layer 4</text>
  <text x="154" y="342" font-family="sans-serif" font-size="11" fill="#ffe0b2" text-anchor="middle">WSGI / ASGI</text>
  <text x="640" y="322" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">WSGI / ASGI Interface  (PEP 3333 / PEP 3422)</text>
  <text x="640" y="342" font-family="monospace" font-size="12" fill="#fff3e0" text-anchor="middle">def app(environ, start_response): ...   |   async def app(scope, receive, send): ...</text>

  <!-- Arrow 4→5 -->
  <line x1="640" y1="354" x2="640" y2="370" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 5: Framework ===== -->
  <rect x="60" y="372" width="1160" height="62" rx="8" fill="#2e7d32" filter="url(#shadow)"/>
  <rect x="60" y="372" width="188" height="62" rx="8" fill="#1b5e20"/>
  <text x="154" y="396" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Layer 5</text>
  <text x="154" y="416" font-family="sans-serif" font-size="11" fill="#a5d6a7" text-anchor="middle">Framework</text>
  <text x="640" y="393" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Web Framework</text>
  <text x="640" y="411" font-family="monospace" font-size="13" fill="#c8e6c9" text-anchor="middle">Flask  ·  Django  ·  FastAPI  ·  Tornado  ·  Starlette  ·  Falcon</text>
  <text x="640" y="427" font-family="sans-serif" font-size="11" fill="#a5d6a7" text-anchor="middle">Routing · Middleware · Auth · Templates · ORM · Serialization · Validation</text>

  <!-- Arrow 5→6 -->
  <line x1="640" y1="434" x2="640" y2="450" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 6: Application Code ===== -->
  <rect x="60" y="452" width="1160" height="60" rx="8" fill="#7b1fa2" filter="url(#shadow)"/>
  <rect x="60" y="452" width="188" height="60" rx="8" fill="#6a1b9a"/>
  <text x="154" y="476" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Layer 6</text>
  <text x="154" y="496" font-family="sans-serif" font-size="11" fill="#e1bee7" text-anchor="middle">App Code</text>
  <text x="640" y="474" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Application Code (Business Logic)</text>
  <text x="640" y="492" font-family="monospace" font-size="12" fill="#e1bee7" text-anchor="middle">View functions · Class-Based Views · API endpoints · Services · Models</text>
  <text x="950" y="474" font-family="sans-serif" font-size="11" fill="#ce93d8">Celery tasks · Background jobs</text>
  <text x="950" y="492" font-family="sans-serif" font-size="11" fill="#ce93d8">Caching (Redis) · Auth checks</text>

  <!-- Arrow 6→7 -->
  <line x1="640" y1="512" x2="640" y2="528" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 7: Database ===== -->
  <rect x="60" y="530" width="1160" height="62" rx="8" fill="#37474f" filter="url(#shadow)"/>
  <rect x="60" y="530" width="188" height="62" rx="8" fill="#263238"/>
  <text x="154" y="554" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Layer 7</text>
  <text x="154" y="574" font-family="sans-serif" font-size="11" fill="#b0bec5" text-anchor="middle">Database</text>
  <text x="640" y="552" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Database / Persistence Layer</text>
  <text x="640" y="570" font-family="monospace" font-size="12" fill="#b0bec5" text-anchor="middle">SQLAlchemy ORM  ·  psycopg2  ·  PyMongo  ·  redis-py  ·  Django ORM</text>
  <text x="640" y="586" font-family="sans-serif" font-size="11" fill="#90a4ae" text-anchor="middle">PostgreSQL · MySQL · SQLite · MongoDB · Redis · Elasticsearch</text>

  <!-- Side annotation: request/response double arrow -->
  <line x1="44" y1="64" x2="44" y2="592" stroke="#1e88e5" stroke-width="3"/>
  <polygon points="44,64 38,76 50,76" fill="#1e88e5"/>
  <polygon points="44,592 38,580 50,580" fill="#1e88e5"/>

  <!-- Bottom legend -->
  <rect x="60" y="602" width="1160" height="28" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1"/>
  <text x="170" y="621" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1565c0">WSGI (sync):</text>
  <text x="260" y="621" font-family="monospace" font-size="11" fill="#333333">Flask, Django ↔ Gunicorn/uWSGI</text>
  <text x="580" y="621" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1565c0">ASGI (async):</text>
  <text x="670" y="621" font-family="monospace" font-size="11" fill="#333333">FastAPI, Starlette ↔ Uvicorn/Daphne</text>
  <text x="960" y="621" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1565c0">Dev server:</text>
  <text x="1040" y="621" font-family="monospace" font-size="11" fill="#333333">flask run / manage.py runserver</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0277bd"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="52" fill="url(#grad-primary)"/>
  <text x="640" y="34" font-family="sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Web Stack: Layers &amp; Technologies</text>

  <!-- Left label: Request flow -->
  <text x="30" y="340" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--text-faint)" text-anchor="middle" transform="rotate(-90 30 340)">REQUEST ↓</text>
  <!-- Right label: Response flow -->
  <text x="1255" y="340" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--text-faint)" text-anchor="middle" transform="rotate(90 1255 340)">RESPONSE ↑</text>

  <!-- ===== LAYER 1: Browser ===== -->
  <rect x="60" y="64" width="1160" height="66" rx="10" fill="var(--primary)" filter="url(#shadow)"/>
  <text x="260" y="98" font-family="sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Browser / Client</text>
  <text x="640" y="88" font-family="monospace" font-size="12" fill="var(--primary-lt)" text-anchor="middle">Chrome, Firefox, curl, fetch(), httpx, requests</text>
  <text x="640" y="108" font-family="sans-serif" font-size="12" fill="var(--primary-lt)" text-anchor="middle">Renders HTML/CSS/JS · Sends HTTP requests · Parses responses · Manages cookies &amp; sessions</text>
  <rect x="60" y="64" width="188" height="66" rx="10" fill="var(--primary-dk)"/>
  <text x="154" y="95" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 1</text>
  <text x="154" y="114" font-family="sans-serif" font-size="11" fill="var(--primary-lt)" text-anchor="middle">Browser / Client</text>

  <!-- Arrow 1→2 -->
  <line x1="640" y1="130" x2="640" y2="148" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="143" font-family="monospace" font-size="11" fill="var(--text-muted)">HTTP/HTTPS Request (GET /api/data)</text>

  <!-- ===== LAYER 2: HTTP Request/Response ===== -->
  <rect x="60" y="150" width="1160" height="54" rx="8" fill="var(--primary-bright)" filter="url(#shadow)"/>
  <rect x="60" y="150" width="188" height="54" rx="8" fill="var(--primary-mid)"/>
  <text x="154" y="172" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 2</text>
  <text x="154" y="190" font-family="sans-serif" font-size="11" fill="var(--primary-lt)" text-anchor="middle">HTTP Protocol</text>
  <text x="640" y="172" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTTP / HTTPS Request &amp; Response</text>
  <text x="640" y="192" font-family="monospace" font-size="11" fill="var(--primary-pale)" text-anchor="middle">Methods: GET POST PUT DELETE PATCH  ·  Status: 200 201 400 401 403 404 500  ·  Headers, Body, JSON, Forms</text>

  <!-- Arrow 2→3 -->
  <line x1="640" y1="204" x2="640" y2="220" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 3: Web Server ===== -->
  <rect x="60" y="222" width="1160" height="60" rx="8" fill="var(--primary-strong)" filter="url(#shadow)"/>
  <rect x="60" y="222" width="188" height="60" rx="8" fill="var(--primary-deep)"/>
  <text x="154" y="246" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 3</text>
  <text x="154" y="265" font-family="sans-serif" font-size="11" fill="var(--primary-lt)" text-anchor="middle">Web Server</text>
  <text x="640" y="244" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Web Server (Production WSGI/ASGI Server)</text>
  <text x="640" y="264" font-family="monospace" font-size="12" fill="var(--primary-pale3)" text-anchor="middle">Gunicorn  ·  uWSGI  ·  Daphne  ·  Hypercorn  ·  Uvicorn</text>
  <text x="950" y="244" font-family="sans-serif" font-size="11" fill="var(--primary-lt)">Manages worker processes · SSL termination</text>
  <text x="950" y="262" font-family="sans-serif" font-size="11" fill="var(--primary-lt)">Load balancing · Static file serving</text>

  <!-- Arrow 3→4 -->
  <line x1="640" y1="282" x2="640" y2="298" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="293" font-family="monospace" font-size="11" fill="var(--text-muted)">WSGI / ASGI callable interface</text>

  <!-- ===== LAYER 4: WSGI/ASGI Interface ===== -->
  <rect x="60" y="300" width="1160" height="54" rx="8" fill="var(--warn-mid)" filter="url(#shadow)"/>
  <rect x="60" y="300" width="188" height="54" rx="8" fill="var(--warn-dk)"/>
  <text x="154" y="322" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 4</text>
  <text x="154" y="342" font-family="sans-serif" font-size="11" fill="var(--warn-lt)" text-anchor="middle">WSGI / ASGI</text>
  <text x="640" y="322" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">WSGI / ASGI Interface  (PEP 3333 / PEP 3422)</text>
  <text x="640" y="342" font-family="monospace" font-size="12" fill="var(--warn-pale)" text-anchor="middle">def app(environ, start_response): ...   |   async def app(scope, receive, send): ...</text>

  <!-- Arrow 4→5 -->
  <line x1="640" y1="354" x2="640" y2="370" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 5: Framework ===== -->
  <rect x="60" y="372" width="1160" height="62" rx="8" fill="var(--ok-dk)" filter="url(#shadow)"/>
  <rect x="60" y="372" width="188" height="62" rx="8" fill="var(--ok-deep)"/>
  <text x="154" y="396" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 5</text>
  <text x="154" y="416" font-family="sans-serif" font-size="11" fill="var(--ok-tint)" text-anchor="middle">Framework</text>
  <text x="640" y="393" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Web Framework</text>
  <text x="640" y="411" font-family="monospace" font-size="13" fill="var(--ok-lt)" text-anchor="middle">Flask  ·  Django  ·  FastAPI  ·  Tornado  ·  Starlette  ·  Falcon</text>
  <text x="640" y="427" font-family="sans-serif" font-size="11" fill="var(--ok-tint)" text-anchor="middle">Routing · Middleware · Auth · Templates · ORM · Serialization · Validation</text>

  <!-- Arrow 5→6 -->
  <line x1="640" y1="434" x2="640" y2="450" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 6: Application Code ===== -->
  <rect x="60" y="452" width="1160" height="60" rx="8" fill="var(--info-mid)" filter="url(#shadow)"/>
  <rect x="60" y="452" width="188" height="60" rx="8" fill="var(--info-dk)"/>
  <text x="154" y="476" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 6</text>
  <text x="154" y="496" font-family="sans-serif" font-size="11" fill="var(--info-tint)" text-anchor="middle">App Code</text>
  <text x="640" y="474" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Application Code (Business Logic)</text>
  <text x="640" y="492" font-family="monospace" font-size="12" fill="var(--info-tint)" text-anchor="middle">View functions · Class-Based Views · API endpoints · Services · Models</text>
  <text x="950" y="474" font-family="sans-serif" font-size="11" fill="var(--info-lt)">Celery tasks · Background jobs</text>
  <text x="950" y="492" font-family="sans-serif" font-size="11" fill="var(--info-lt)">Caching (Redis) · Auth checks</text>

  <!-- Arrow 6→7 -->
  <line x1="640" y1="512" x2="640" y2="528" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 7: Database ===== -->
  <rect x="60" y="530" width="1160" height="62" rx="8" fill="var(--text-muted)" filter="url(#shadow)"/>
  <rect x="60" y="530" width="188" height="62" rx="8" fill="var(--text-dark)"/>
  <text x="154" y="554" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 7</text>
  <text x="154" y="574" font-family="sans-serif" font-size="11" fill="var(--border-strong)" text-anchor="middle">Database</text>
  <text x="640" y="552" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Database / Persistence Layer</text>
  <text x="640" y="570" font-family="monospace" font-size="12" fill="var(--border-strong)" text-anchor="middle">SQLAlchemy ORM  ·  psycopg2  ·  PyMongo  ·  redis-py  ·  Django ORM</text>
  <text x="640" y="586" font-family="sans-serif" font-size="11" fill="var(--text-disabled)" text-anchor="middle">PostgreSQL · MySQL · SQLite · MongoDB · Redis · Elasticsearch</text>

  <!-- Side annotation: request/response double arrow -->
  <line x1="44" y1="64" x2="44" y2="592" stroke="var(--primary)" stroke-width="3"/>
  <polygon points="44,64 38,76 50,76" fill="var(--primary)"/>
  <polygon points="44,592 38,580 50,580" fill="var(--primary)"/>

  <!-- Bottom legend -->
  <rect x="60" y="602" width="1160" height="28" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1"/>
  <text x="170" y="621" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--primary-dk)">WSGI (sync):</text>
  <text x="260" y="621" font-family="monospace" font-size="11" fill="var(--text-dark)">Flask, Django ↔ Gunicorn/uWSGI</text>
  <text x="580" y="621" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--primary-dk)">ASGI (async):</text>
  <text x="670" y="621" font-family="monospace" font-size="11" fill="var(--text-dark)">FastAPI, Starlette ↔ Uvicorn/Daphne</text>
  <text x="960" y="621" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--primary-dk)">Dev server:</text>
  <text x="1040" y="621" font-family="monospace" font-size="11" fill="var(--text-dark)">flask run / manage.py runserver</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="68.235294117647" rx="6.39852924277" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="83.21568627451" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--primary-text)">Layer 1</text>
  <text x="740" y="74.117647058823" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--primary-text)">Browser / Client</text>
  <text x="740" y="96.862745098039" text-anchor="middle" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--primary-text)">Chrome, curl, fetch, httpx</text>

  <rect x="40" y="125.294117647059" width="1200" height="68.235294117647" rx="6.39852924277" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="168.509803921569" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--primary-text)">Layer 2</text>
  <text x="740" y="159.411764705883" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--primary-text)">HTTP / HTTPS</text>
  <text x="740" y="182.156862745098" text-anchor="middle" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--primary-text)">GET POST PUT DELETE · 2xx 4xx 5xx</text>

  <rect x="40" y="210.588235294117" width="1200" height="68.235294117647" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="253.803921568627" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--info-text)">Layer 3</text>
  <text x="740" y="244.705882352942" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--info-text)">Web Server</text>
  <text x="740" y="267.450980392157" text-anchor="middle" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--info-text)">Gunicorn · uWSGI · Uvicorn · Daphne</text>

  <rect x="40" y="295.882352941177" width="1200" height="68.235294117647" rx="6.39852924277" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="339.098039215687" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--warn-text)">Layer 4</text>
  <text x="740" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--warn-text)">WSGI / ASGI</text>
  <text x="740" y="352.745098039216" text-anchor="middle" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--warn-text)">PEP 3333 sync; async scope/receive/send</text>

  <rect x="40" y="381.176470588235" width="1200" height="68.235294117647" rx="6.39852924277" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="424.392156862745" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--ok-text)">Layer 5</text>
  <text x="740" y="415.294117647059" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--ok-text)">Framework</text>
  <text x="740" y="438.039215686274" text-anchor="middle" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--ok-text)">Flask · Django · FastAPI · Tornado · Starlette</text>

  <rect x="40" y="466.470588235294" width="1200" height="68.235294117647" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="509.686274509804" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--info-text)">Layer 6</text>
  <text x="740" y="500.588235294117" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--info-text)">Application Code</text>
  <text x="740" y="523.333333333334" text-anchor="middle" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--info-text)">Views · Models · Services · Celery</text>

  <rect x="40" y="551.764705882353" width="1200" height="68.235294117647" rx="6.39852924277" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="594.980392156862" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--danger-text)">Layer 7</text>
  <text x="740" y="585.882352941177" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--danger-text)">Database</text>
  <text x="740" y="608.627450980392" text-anchor="middle" font-family="Courier New, monospace" font-size="13.863480026003" fill="var(--danger-text)">PostgreSQL · MySQL · MongoDB · Redis</text>
</svg>

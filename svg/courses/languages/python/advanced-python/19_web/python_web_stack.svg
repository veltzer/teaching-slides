<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0277bd"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
  </defs>
  <!-- Title bar -->
  <rect x="40" y="40" width="1200" height="47.873016" fill="var(--primary-fill)" rx="6.047432" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="71.301587" font-family="sans-serif" font-size="20.438605" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Web Stack: Layers &amp; Technologies</text>

  <!-- Left label: Request flow -->
  <text x="68.125" y="348.125" font-family="sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text-faint)" text-anchor="middle" transform="rotate(-90 30 340)">REQUEST ↓</text>
  <!-- Right label: Response flow -->
  <text x="1216.5625" y="348.125" font-family="sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text-faint)" text-anchor="middle" transform="rotate(90 1255 340)">RESPONSE ↑</text>

  <!-- ===== LAYER 1: Browser ===== -->
  <rect x="96.25" y="98.920635" width="1087.5" height="60.761905" rx="6.047432" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="283.75" y="130.222222" font-family="sans-serif" font-size="16.722559" font-weight="bold" fill="var(--bg)" text-anchor="middle">Browser / Client</text>
  <text x="640" y="121.015873" font-family="monospace" font-size="11.148339" fill="var(--primary-accent)" text-anchor="middle">Chrome, Firefox, curl, fetch(), httpx, requests</text>
  <text x="640" y="139.428571" font-family="sans-serif" font-size="11.148339" fill="var(--primary-accent)" text-anchor="middle">Renders HTML/CSS/JS · Sends HTTP requests · Parses responses · Manages cookies &amp; sessions</text>
  <rect x="96.25" y="98.920635" width="176.25" height="60.761905" rx="6.047432" fill="var(--primary-accent)"/>
  <text x="184.375" y="127.460368" font-family="sans-serif" font-size="14.864486" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 1</text>
  <text x="184.375" y="144.952381" font-family="sans-serif" font-size="10.219353" fill="var(--primary-accent)" text-anchor="middle">Browser / Client</text>

  <!-- Arrow 1→2 -->
  <line x1="640" y1="159.68254" x2="640" y2="176.253968" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="668.125" y="171.650844" font-family="monospace" font-size="10.219353" fill="var(--text-muted)">HTTP/HTTPS Request (GET /api/data)</text>

  <!-- ===== LAYER 2: HTTP Request/Response ===== -->
  <rect x="96.25" y="178.095238" width="1087.5" height="49.714286" rx="6.047432" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="96.25" y="178.095238" width="176.25" height="49.714286" rx="6.047432" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.375" y="198.349206" font-family="sans-serif" font-size="13.935399" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 2</text>
  <text x="184.375" y="214.920635" font-family="sans-serif" font-size="10.219353" fill="var(--primary-accent)" text-anchor="middle">HTTP Protocol</text>
  <text x="640" y="198.349206" font-family="sans-serif" font-size="13.006413" font-weight="bold" fill="var(--bg)" text-anchor="middle">HTTP / HTTPS Request &amp; Response</text>
  <text x="640" y="216.761905" font-family="monospace" font-size="10.219353" fill="var(--primary-accent)" text-anchor="middle">Methods: GET POST PUT DELETE PATCH  ·  Status: 200 201 400 401 403 404 500  ·  Headers, Body, JSON, Forms</text>

  <!-- Arrow 2→3 -->
  <line x1="640" y1="227.809524" x2="640" y2="242.539683" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 3: Web Server ===== -->
  <rect x="96.25" y="244.380952" width="1087.5" height="55.238095" rx="6.047432" fill="var(--primary-accent)"/>
  <rect x="96.25" y="244.380952" width="176.25" height="55.238095" rx="6.047432" fill="var(--primary-accent)"/>
  <text x="184.375" y="266.47619" font-family="sans-serif" font-size="13.935399" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 3</text>
  <text x="184.375" y="283.968203" font-family="sans-serif" font-size="10.219353" fill="var(--primary-accent)" text-anchor="middle">Web Server</text>
  <text x="640" y="264.634921" font-family="sans-serif" font-size="13.006413" font-weight="bold" fill="var(--bg)" text-anchor="middle">Web Server (Production WSGI/ASGI Server)</text>
  <text x="640" y="283.047619" font-family="monospace" font-size="11.148339" fill="var(--primary-accent)" text-anchor="middle">Gunicorn  ·  uWSGI  ·  Daphne  ·  Hypercorn  ·  Uvicorn</text>
  <text x="930.625" y="264.634921" font-family="sans-serif" font-size="10.219353" fill="var(--primary-accent)">Manages worker processes · SSL termination</text>
  <text x="930.625" y="281.206349" font-family="sans-serif" font-size="10.219353" fill="var(--primary-accent)">Load balancing · Static file serving</text>

  <!-- Arrow 3→4 -->
  <line x1="640" y1="299.619048" x2="640" y2="314.349206" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="677.5" y="309.745981" font-family="monospace" font-size="10.219353" fill="var(--text-muted)">WSGI / ASGI callable interface</text>

  <!-- ===== LAYER 4: WSGI/ASGI Interface ===== -->
  <rect x="96.25" y="316.190476" width="1087.5" height="49.714286" rx="6.047432" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="96.25" y="316.190476" width="176.25" height="49.714286" rx="6.047432" fill="var(--warn-accent)"/>
  <text x="184.375" y="336.444444" font-family="sans-serif" font-size="13.935399" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 4</text>
  <text x="184.375" y="354.857143" font-family="sans-serif" font-size="10.219353" fill="var(--warn-accent)" text-anchor="middle">WSGI / ASGI</text>
  <text x="640" y="336.444444" font-family="sans-serif" font-size="13.006413" font-weight="bold" fill="var(--bg)" text-anchor="middle">WSGI / ASGI Interface  (PEP 3333 / PEP 3422)</text>
  <text x="640" y="354.857143" font-family="monospace" font-size="11.148339" fill="var(--warn-accent)" text-anchor="middle">def app(environ, start_response): ...   |   async def app(scope, receive, send): ...</text>

  <!-- Arrow 4→5 -->
  <line x1="640" y1="365.904762" x2="640" y2="380.634921" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 5: Framework ===== -->
  <rect x="96.25" y="382.47619" width="1087.5" height="57.079365" rx="6.047432" fill="var(--ok-accent)"/>
  <rect x="96.25" y="382.47619" width="176.25" height="57.079365" rx="6.047432" fill="var(--ok-accent)"/>
  <text x="184.375" y="404.571429" font-family="sans-serif" font-size="13.935399" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 5</text>
  <text x="184.375" y="422.984127" font-family="sans-serif" font-size="10.219353" fill="var(--ok-accent)" text-anchor="middle">Framework</text>
  <text x="640" y="401.809473" font-family="sans-serif" font-size="13.006413" font-weight="bold" fill="var(--bg)" text-anchor="middle">Web Framework</text>
  <text x="640" y="418.381003" font-family="monospace" font-size="12.077426" fill="var(--ok-accent)" text-anchor="middle">Flask  ·  Django  ·  FastAPI  ·  Tornado  ·  Starlette  ·  Falcon</text>
  <text x="640" y="433.111162" font-family="sans-serif" font-size="10.219353" fill="var(--ok-accent)" text-anchor="middle">Routing · Middleware · Auth · Templates · ORM · Serialization · Validation</text>

  <!-- Arrow 5→6 -->
  <line x1="640" y1="439.555556" x2="640" y2="454.285714" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 6: Application Code ===== -->
  <rect x="96.25" y="456.126984" width="1087.5" height="55.238095" rx="6.047432" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="96.25" y="456.126984" width="176.25" height="55.238095" rx="6.047432" fill="var(--info-accent)"/>
  <text x="184.375" y="478.222222" font-family="sans-serif" font-size="13.935399" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 6</text>
  <text x="184.375" y="496.634921" font-family="sans-serif" font-size="10.219353" fill="var(--info-accent)" text-anchor="middle">App Code</text>
  <text x="640" y="476.380952" font-family="sans-serif" font-size="13.006413" font-weight="bold" fill="var(--bg)" text-anchor="middle">Application Code (Business Logic)</text>
  <text x="640" y="492.952381" font-family="monospace" font-size="11.148339" fill="var(--info-accent)" text-anchor="middle">View functions · Class-Based Views · API endpoints · Services · Models</text>
  <text x="930.625" y="476.380952" font-family="sans-serif" font-size="10.219353" fill="var(--info-accent)">Celery tasks · Background jobs</text>
  <text x="930.625" y="492.952381" font-family="sans-serif" font-size="10.219353" fill="var(--info-accent)">Caching (Redis) · Auth checks</text>

  <!-- Arrow 6→7 -->
  <line x1="640" y1="511.365079" x2="640" y2="526.095238" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 7: Database ===== -->
  <rect x="96.25" y="527.936508" width="1087.5" height="57.079365" rx="6.047432" fill="var(--text-muted)"/>
  <rect x="96.25" y="527.936508" width="176.25" height="57.079365" rx="6.047432" fill="var(--text)"/>
  <text x="184.375" y="550.031746" font-family="sans-serif" font-size="13.935399" font-weight="bold" fill="var(--bg)" text-anchor="middle">Layer 7</text>
  <text x="184.375" y="568.444444" font-family="sans-serif" font-size="10.219353" fill="var(--border)" text-anchor="middle">Database</text>
  <text x="640" y="548.190476" font-family="sans-serif" font-size="13.006413" font-weight="bold" fill="var(--bg)" text-anchor="middle">Database / Persistence Layer</text>
  <text x="640" y="564.761905" font-family="monospace" font-size="11.148339" fill="var(--border)" text-anchor="middle">SQLAlchemy ORM  ·  psycopg2  ·  PyMongo  ·  redis-py  ·  Django ORM</text>
  <text x="640" y="579.492063" font-family="sans-serif" font-size="10.219353" fill="var(--text-faint)" text-anchor="middle">PostgreSQL · MySQL · SQLite · MongoDB · Redis · Elasticsearch</text>

  <!-- Side annotation: request/response double arrow -->
  <line x1="81.25" y1="98.920635" x2="81.25" y2="585.015873" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="81.25,98.920635 75.625,109.968254 86.875,109.968254" fill="var(--primary-fill)"/>
  <polygon points="81.25,585.015873 75.625,573.968254 86.875,573.968254" fill="var(--primary-fill)"/>

  <!-- Bottom legend -->
  <rect x="96.25" y="594.222222" width="1087.5" height="25.777778" rx="6.047432" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="199.375" y="611.714235" font-family="sans-serif" font-size="10.219353" font-weight="bold" fill="var(--primary-accent)">WSGI (sync):</text>
  <text x="283.75" y="611.714235" font-family="monospace" font-size="10.219353" fill="var(--text)">Flask, Django ↔ Gunicorn/uWSGI</text>
  <text x="583.75" y="611.714235" font-family="sans-serif" font-size="10.219353" font-weight="bold" fill="var(--primary-accent)">ASGI (async):</text>
  <text x="668.125" y="611.714235" font-family="monospace" font-size="10.219353" fill="var(--text)">FastAPI, Starlette ↔ Uvicorn/Daphne</text>
  <text x="940" y="611.714235" font-family="sans-serif" font-size="10.219353" font-weight="bold" fill="var(--primary-accent)">Dev server:</text>
  <text x="1015" y="611.714235" font-family="monospace" font-size="10.219353" fill="var(--text)">flask run / manage.py runserver</text>
</svg>

    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" />
  <rect x="231.1111" y="17.7778" width="177.7778" height="62.2222" rx="5.3333" fill="var(--text)" filter="url(#shadow)" />
  <text x="320" y="46.2222" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="var(--bg)">Base</text>
  <text x="320" y="65.7778" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text-disabled)">def greet(self)</text>
  <line x1="293.3333" y1="81.7778" x2="186.6667" y2="152.8889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="88.8889" y="154.6667" width="195.5556" height="62.2222" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="186.6667" y="183.1111" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="var(--text)">Left</text>
  <text x="186.6667" y="202.6667" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">def greet(self)</text>
  <line x1="346.6667" y1="81.7778" x2="453.3333" y2="152.8889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="355.5556" y="154.6667" width="195.5556" height="62.2222" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="453.3333" y="183.1111" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="var(--text)">Right</text>
  <text x="453.3333" y="202.6667" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">def greet(self)</text>
  <line x1="186.6667" y1="218.6667" x2="293.3333" y2="289.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <line x1="453.3333" y1="218.6667" x2="346.6667" y2="289.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="186.6667" y="291.5556" width="266.6667" height="62.2222" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="320" y="320" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="var(--bg)">Bottom</text>
  <text x="320" y="339.5556" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-lt)">class Bottom(Left, Right)</text>
  <text x="320" y="405.3333" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--danger-dk)">Bottom().greet() → which greet() wins?</text>
  <rect x="640" y="17.7778" width="462.2222" height="515.5556" rx="7.1111" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="871.1111" y="46.2222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Python C3 MRO — search order</text>
  <rect x="657.7778" y="60.4444" width="115.5556" height="49.7778" rx="3.5556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="715.5556" y="90.6667" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">Bottom</text>
  <line x1="775.1111" y1="85.3333" x2="807.1111" y2="85.3333" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="791.1111" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--primary-dk)">1st</text>
  <rect x="808.8889" y="60.4444" width="115.5556" height="49.7778" rx="3.5556" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="866.6667" y="90.6667" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">Left</text>
  <line x1="926.2222" y1="85.3333" x2="958.2222" y2="85.3333" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="942.2222" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--primary-dk)">2nd</text>
  <rect x="960" y="60.4444" width="115.5556" height="49.7778" rx="3.5556" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="1017.7778" y="90.6667" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--text)">Right</text>
  <line x1="1017.7778" y1="112" x2="1017.7778" y2="138.6667" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="1035.5556" y="131.5556" font-family="sans-serif" font-size="10.6667" fill="var(--primary-dk)">3rd</text>
  <rect x="897.7778" y="140.4444" width="115.5556" height="49.7778" rx="3.5556" fill="var(--text)" filter="url(#shadow)" />
  <text x="955.5556" y="170.6667" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">Base</text>
  <line x1="897.7778" y1="165.3333" x2="865.7778" y2="165.3333" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="881.7778" y="158.2222" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--primary-dk)">4th</text>
  <rect x="657.7778" y="140.4444" width="115.5556" height="49.7778" rx="3.5556" fill="var(--surface-dark)" stroke="var(--text-disabled)" stroke-width="1.3333" />
  <text x="715.5556" y="170.6667" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--text-disabled)">object</text>
  <line x1="775.1111" y1="165.3333" x2="807.1111" y2="165.3333" stroke="var(--text-disabled)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="791.1111" y="158.2222" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--text-disabled)">5th</text>
  <rect x="657.7778" y="227.5556" width="426.6667" height="71.1111" rx="5.3333" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="871.1111" y="250.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">Verify in Python:</text>
  <text x="675.5556" y="273.7778" font-family="monospace" font-size="13.3333" fill="var(--primary-dk)">print(Bottom.__mro__)</text>
  <text x="675.5556" y="291.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)"># (Bottom, Left, Right, Base, object)</text>
  <rect x="657.7778" y="314.6667" width="426.6667" height="177.7778" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <text x="871.1111" y="337.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-dk)">super() follows MRO — cooperative inheritance</text>
  <text x="675.5556" y="360.8889" font-family="monospace" font-size="11.5556" fill="var(--text)">class Left(Base):</text>
  <text x="675.5556" y="378.6667" font-family="monospace" font-size="11.5556" fill="var(--text)">    def greet(self):</text>
  <text x="675.5556" y="396.4444" font-family="monospace" font-size="11.5556" fill="var(--primary-dk)">        super().greet()  # calls Right.greet next!</text>
  <text x="675.5556" y="414.2222" font-family="monospace" font-size="11.5556" fill="var(--text)">        print("Left")</text>
  <text x="675.5556" y="439.1111" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">Each class calls super() → chain follows MRO order</text>
  <text x="675.5556" y="456.8889" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">Base.greet() called exactly once</text>
  <rect x="53.3333" y="435.5556" width="551.1111" height="39.1111" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <text x="328.8889" y="459.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-dk)">Rule: Python uses C3 linearization — Left always before Right (left-to-right in class def)</text>
</svg>
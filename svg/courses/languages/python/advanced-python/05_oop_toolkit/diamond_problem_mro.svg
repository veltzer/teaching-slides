<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="283.75" y="56.1111" width="187.5" height="56.3889" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="377.5" y="81.8889" text-anchor="middle" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--bg)">Base</text>
  <text x="377.5" y="99.6111" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-faint)">def greet(self)</text>
  <line x1="349.375" y1="114.1111" x2="236.875" y2="178.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="133.75" y="180.1667" width="206.25" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="236.875" y="205.9444" text-anchor="middle" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--text)">Left</text>
  <text x="236.875" y="223.6667" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">def greet(self)</text>
  <line x1="405.625" y1="114.1111" x2="518.125" y2="178.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="415" y="180.1667" width="206.25" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="518.125" y="205.9444" text-anchor="middle" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--text)">Right</text>
  <text x="518.125" y="223.6667" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">def greet(self)</text>
  <line x1="236.875" y1="238.1667" x2="349.375" y2="302.6111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <line x1="518.125" y1="238.1667" x2="405.625" y2="302.6111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="236.875" y="304.2223" width="281.25" height="56.3889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="377.5" y="330" text-anchor="middle" font-family="monospace" font-size="17.3806" font-weight="bold" fill="var(--bg)">Bottom</text>
  <text x="377.5" y="347.7223" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">class Bottom(Left, Right)</text>
  <text x="377.5" y="407.3333" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--danger-accent)">Bottom().greet() → which greet() wins?</text>
  <rect x="715" y="56.1111" width="487.5" height="467.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="958.75" y="81.8889" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Python C3 MRO — search order</text>
  <rect x="733.75" y="94.7777" width="121.875" height="45.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="794.6875" y="122.1667" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">Bottom</text>
  <line x1="857.5" y1="117.3333" x2="891.25" y2="117.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="874.375" y="110.8889" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--primary-accent)">1st</text>
  <rect x="893.125" y="94.7777" width="121.875" height="45.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="954.0625" y="122.1667" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">Left</text>
  <line x1="1016.875" y1="117.3333" x2="1050.625" y2="117.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="1033.75" y="110.8889" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--primary-accent)">2nd</text>
  <rect x="1052.5" y="94.7777" width="121.875" height="45.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1113.4375" y="122.1667" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--text)">Right</text>
  <line x1="1113.4375" y1="141.5" x2="1113.4375" y2="165.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="1132.1875" y="159.2223" font-family="sans-serif" font-size="10.4284" fill="var(--primary-accent)">3rd</text>
  <rect x="986.875" y="167.2777" width="121.875" height="45.1111" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="1047.8125" y="194.6667" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">Base</text>
  <line x1="986.875" y1="189.8333" x2="953.125" y2="189.8333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="970" y="183.3889" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--primary-accent)">4th</text>
  <rect x="733.75" y="167.2777" width="121.875" height="45.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="794.6875" y="194.6667" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--text-faint)">object</text>
  <line x1="857.5" y1="189.8333" x2="891.25" y2="189.8333" stroke="var(--text-faint)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="874.375" y="183.3889" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--text-faint)">5th</text>
  <rect x="733.75" y="246.2223" width="450" height="64.4444" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.3333" />
  <text x="958.75" y="267.1667" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text)">Verify in Python:</text>
  <text x="752.5" y="288.1111" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">print(Bottom.__mro__)</text>
  <text x="752.5" y="304.2223" font-family="monospace" font-size="11.2974" fill="var(--text-muted)"># (Bottom, Left, Right, Base, object)</text>
  <rect x="733.75" y="325.1667" width="450" height="161.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="958.75" y="346.1111" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">super() follows MRO — cooperative inheritance</text>
  <text x="752.5" y="367.0556" font-family="monospace" font-size="11.2974" fill="var(--text)">class Left(Base):</text>
  <text x="752.5" y="383.1667" font-family="monospace" font-size="11.2974" fill="var(--text)">    def greet(self):</text>
  <text x="752.5" y="399.2777" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">        super().greet()  # calls Right.greet next!</text>
  <text x="752.5" y="415.3889" font-family="monospace" font-size="11.2974" fill="var(--text)">        print("Left")</text>
  <text x="752.5" y="437.9444" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">Each class calls super() → chain follows MRO order</text>
  <text x="752.5" y="454.0556" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">Base.greet() called exactly once</text>
  <rect x="96.25" y="434.7223" width="581.25" height="35.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="386.875" y="456.4723" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">Rule: Python uses C3 linearization — Left always before Right (left-to-right in class def)</text>
</svg>
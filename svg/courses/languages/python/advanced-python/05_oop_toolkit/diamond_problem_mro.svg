<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="inherit" markerWidth="12" markerHeight="12" refX="1" refY="6" orient="auto">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Diamond inheritance diagram (left) -->
  <!-- Base -->
  <rect x="260" y="20" width="200" height="70" rx="6" fill="#212121" filter="url(#shadow)"/>
  <text x="360" y="52" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff">Base</text>
  <text x="360" y="74" text-anchor="middle" font-family="monospace" font-size="14" fill="#9e9e9e">def greet(self)</text>

  <!-- Left -->
  <line x1="330" y1="92" x2="210" y2="172" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>
  <rect x="100" y="174" width="220" height="70" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="206" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#212121">Left</text>
  <text x="210" y="228" text-anchor="middle" font-family="monospace" font-size="14" fill="#555555">def greet(self)</text>

  <!-- Right -->
  <line x1="390" y1="92" x2="510" y2="172" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>
  <rect x="400" y="174" width="220" height="70" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="206" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#212121">Right</text>
  <text x="510" y="228" text-anchor="middle" font-family="monospace" font-size="14" fill="#555555">def greet(self)</text>

  <!-- Bottom -->
  <line x1="210" y1="246" x2="330" y2="326" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>
  <line x1="510" y1="246" x2="390" y2="326" stroke="#555555" stroke-width="2" marker-end="url(#inherit)"/>
  <rect x="210" y="328" width="300" height="70" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="360" y="360" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff">Bottom</text>
  <text x="360" y="382" text-anchor="middle" font-family="monospace" font-size="14" fill="#bbdefb">class Bottom(Left, Right)</text>

  <!-- Question mark -->
  <text x="360" y="456" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#c62828">Bottom().greet() → which greet() wins?</text>

  <!-- MRO resolution (right) -->
  <rect x="720" y="20" width="520" height="580" rx="8" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="980" y="52" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">Python C3 MRO — search order</text>

  <!-- MRO sequence boxes -->
  <rect x="740" y="68" width="130" height="56" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="805" y="102" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">Bottom</text>

  <line x1="872" y1="96" x2="908" y2="96" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="890" y="88" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1565c0">1st</text>

  <rect x="910" y="68" width="130" height="56" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="975" y="102" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">Left</text>

  <line x1="1042" y1="96" x2="1078" y2="96" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="1060" y="88" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1565c0">2nd</text>

  <rect x="1080" y="68" width="130" height="56" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1145" y="102" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#212121">Right</text>

  <line x1="1145" y1="126" x2="1145" y2="156" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="1165" y="148" font-family="sans-serif" font-size="12" fill="#1565c0">3rd</text>

  <rect x="1010" y="158" width="130" height="56" rx="4" fill="#212121" filter="url(#shadow)"/>
  <text x="1075" y="192" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">Base</text>

  <line x1="1010" y1="186" x2="974" y2="186" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="992" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1565c0">4th</text>

  <rect x="740" y="158" width="130" height="56" rx="4" fill="#f2f2f2" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="805" y="192" text-anchor="middle" font-family="monospace" font-size="18" fill="#9e9e9e">object</text>

  <line x1="872" y1="186" x2="908" y2="186" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="890" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9e9e9e">5th</text>

  <!-- Verify -->
  <rect x="740" y="256" width="480" height="80" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="980" y="282" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#212121">Verify in Python:</text>
  <text x="760" y="308" font-family="monospace" font-size="15" fill="#1565c0">print(Bottom.__mro__)</text>
  <text x="760" y="328" font-family="monospace" font-size="13" fill="#555555"># (Bottom, Left, Right, Base, object)</text>

  <!-- super() usage -->
  <rect x="740" y="354" width="480" height="200" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="980" y="380" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">super() follows MRO — cooperative inheritance</text>
  <text x="760" y="406" font-family="monospace" font-size="13" fill="#212121">class Left(Base):</text>
  <text x="760" y="426" font-family="monospace" font-size="13" fill="#212121">    def greet(self):</text>
  <text x="760" y="446" font-family="monospace" font-size="13" fill="#1565c0">        super().greet()  # calls Right.greet next!</text>
  <text x="760" y="466" font-family="monospace" font-size="13" fill="#212121">        print("Left")</text>
  <text x="760" y="494" font-family="sans-serif" font-size="13" fill="#9e9e9e">Each class calls super() → chain follows MRO order</text>
  <text x="760" y="514" font-family="sans-serif" font-size="13" fill="#9e9e9e">Base.greet() called exactly once</text>

  <rect x="60" y="490" width="620" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="370" y="517" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">Rule: Python uses C3 linearization — Left always before Right (left-to-right in class def)</text>
</svg>

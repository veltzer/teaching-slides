<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="inherit" markerWidth="12" markerHeight="12" refX="1" refY="6" orient="auto">
      <ns0:polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="231.1111" y="17.7778" width="177.7778" height="62.2222" rx="5.3333" fill="#212121" filter="url(#shadow)" />
  <ns0:text x="320" y="46.2222" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="#ffffff">Base</ns0:text>
  <ns0:text x="320" y="65.7778" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#9e9e9e">def greet(self)</ns0:text>
  <ns0:line x1="293.3333" y1="81.7778" x2="186.6667" y2="152.8889" stroke="#555555" stroke-width="1.7778" marker-end="url(#inherit)" />
  <ns0:rect x="88.8889" y="154.6667" width="195.5556" height="62.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="186.6667" y="183.1111" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="#212121">Left</ns0:text>
  <ns0:text x="186.6667" y="202.6667" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#555555">def greet(self)</ns0:text>
  <ns0:line x1="346.6667" y1="81.7778" x2="453.3333" y2="152.8889" stroke="#555555" stroke-width="1.7778" marker-end="url(#inherit)" />
  <ns0:rect x="355.5556" y="154.6667" width="195.5556" height="62.2222" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="453.3333" y="183.1111" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="#212121">Right</ns0:text>
  <ns0:text x="453.3333" y="202.6667" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#555555">def greet(self)</ns0:text>
  <ns0:line x1="186.6667" y1="218.6667" x2="293.3333" y2="289.7778" stroke="#555555" stroke-width="1.7778" marker-end="url(#inherit)" />
  <ns0:line x1="453.3333" y1="218.6667" x2="346.6667" y2="289.7778" stroke="#555555" stroke-width="1.7778" marker-end="url(#inherit)" />
  <ns0:rect x="186.6667" y="291.5556" width="266.6667" height="62.2222" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="320" y="320" text-anchor="middle" font-family="monospace" font-size="17.7778" font-weight="bold" fill="#ffffff">Bottom</ns0:text>
  <ns0:text x="320" y="339.5556" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="#bbdefb">class Bottom(Left, Right)</ns0:text>
  <ns0:text x="320" y="405.3333" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c62828">Bottom().greet() → which greet() wins?</ns0:text>
  <ns0:rect x="640" y="17.7778" width="462.2222" height="515.5556" rx="7.1111" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="871.1111" y="46.2222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Python C3 MRO — search order</ns0:text>
  <ns0:rect x="657.7778" y="60.4444" width="115.5556" height="49.7778" rx="3.5556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="715.5556" y="90.6667" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">Bottom</ns0:text>
  <ns0:line x1="775.1111" y1="85.3333" x2="807.1111" y2="85.3333" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:text x="791.1111" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="#1565c0">1st</ns0:text>
  <ns0:rect x="808.8889" y="60.4444" width="115.5556" height="49.7778" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="866.6667" y="90.6667" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">Left</ns0:text>
  <ns0:line x1="926.2222" y1="85.3333" x2="958.2222" y2="85.3333" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:text x="942.2222" y="78.2222" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="#1565c0">2nd</ns0:text>
  <ns0:rect x="960" y="60.4444" width="115.5556" height="49.7778" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="1017.7778" y="90.6667" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">Right</ns0:text>
  <ns0:line x1="1017.7778" y1="112" x2="1017.7778" y2="138.6667" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:text x="1035.5556" y="131.5556" font-family="sans-serif" font-size="10.6667" fill="#1565c0">3rd</ns0:text>
  <ns0:rect x="897.7778" y="140.4444" width="115.5556" height="49.7778" rx="3.5556" fill="#212121" filter="url(#shadow)" />
  <ns0:text x="955.5556" y="170.6667" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">Base</ns0:text>
  <ns0:line x1="897.7778" y1="165.3333" x2="865.7778" y2="165.3333" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:text x="881.7778" y="158.2222" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="#1565c0">4th</ns0:text>
  <ns0:rect x="657.7778" y="140.4444" width="115.5556" height="49.7778" rx="3.5556" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.3333" />
  <ns0:text x="715.5556" y="170.6667" text-anchor="middle" font-family="monospace" font-size="16" fill="#9e9e9e">object</ns0:text>
  <ns0:line x1="775.1111" y1="165.3333" x2="807.1111" y2="165.3333" stroke="#9e9e9e" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="791.1111" y="158.2222" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="#9e9e9e">5th</ns0:text>
  <ns0:rect x="657.7778" y="227.5556" width="426.6667" height="71.1111" rx="5.3333" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="871.1111" y="250.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#212121">Verify in Python:</ns0:text>
  <ns0:text x="675.5556" y="273.7778" font-family="monospace" font-size="13.3333" fill="#1565c0">print(Bottom.__mro__)</ns0:text>
  <ns0:text x="675.5556" y="291.5556" font-family="monospace" font-size="11.5556" fill="#555555"># (Bottom, Left, Right, Base, object)</ns0:text>
  <ns0:rect x="657.7778" y="314.6667" width="426.6667" height="177.7778" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="871.1111" y="337.7778" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#1565c0">super() follows MRO — cooperative inheritance</ns0:text>
  <ns0:text x="675.5556" y="360.8889" font-family="monospace" font-size="11.5556" fill="#212121">class Left(Base):</ns0:text>
  <ns0:text x="675.5556" y="378.6667" font-family="monospace" font-size="11.5556" fill="#212121">    def greet(self):</ns0:text>
  <ns0:text x="675.5556" y="396.4444" font-family="monospace" font-size="11.5556" fill="#1565c0">        super().greet()  # calls Right.greet next!</ns0:text>
  <ns0:text x="675.5556" y="414.2222" font-family="monospace" font-size="11.5556" fill="#212121">        print("Left")</ns0:text>
  <ns0:text x="675.5556" y="439.1111" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">Each class calls super() → chain follows MRO order</ns0:text>
  <ns0:text x="675.5556" y="456.8889" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">Base.greet() called exactly once</ns0:text>
  <ns0:rect x="53.3333" y="435.5556" width="551.1111" height="39.1111" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="328.8889" y="459.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">Rule: Python uses C3 linearization — Left always before Right (left-to-right in class def)</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="52" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="34" font-family="sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Descriptor Protocol: Lookup Chain &amp; Priority</text>

  <!-- ===== TOP: Attribute lookup flowchart ===== -->
  <text x="440" y="74" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Attribute Lookup: obj.attr</text>

  <!-- Start -->
  <rect x="260" y="84" width="360" height="38" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="440" y="108" font-family="monospace" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">obj.attr  (read access)</text>

  <line x1="440" y1="122" x2="440" y2="142" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1 -->
  <polygon points="440,142 540,168 440,194 340,168" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="163" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Data descriptor</text>
  <text x="440" y="178" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">in type(obj)?</text>

  <!-- Yes → data descriptor wins -->
  <line x1="540" y1="168" x2="680" y2="168" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="610" y="160" font-family="sans-serif" font-size="11" fill="var(--ok-accent)">YES (priority 1)</text>
  <rect x="680" y="148" width="220" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="790" y="168" font-family="monospace" font-size="12" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">descriptor.__get__(obj, type)</text>
  <text x="790" y="183" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">has __get__ AND __set__/__delete__</text>

  <!-- No → check instance dict -->
  <line x1="440" y1="194" x2="440" y2="214" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="458" y="210" font-family="sans-serif" font-size="11" fill="var(--text-faint)">NO</text>

  <!-- Decision 2 -->
  <polygon points="440,214 540,240 440,266 340,240" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="440" y="235" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">attr in</text>
  <text x="440" y="250" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">obj.__dict__?</text>

  <!-- Yes → instance dict -->
  <line x1="540" y1="240" x2="680" y2="240" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="610" y="232" font-family="sans-serif" font-size="11" fill="var(--ok-accent)">YES (priority 2)</text>
  <rect x="680" y="220" width="220" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="790" y="240" font-family="monospace" font-size="12" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">obj.__dict__['attr']</text>
  <text x="790" y="255" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">instance variable wins here</text>

  <!-- No → non-data descriptor -->
  <line x1="440" y1="266" x2="440" y2="286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="458" y="282" font-family="sans-serif" font-size="11" fill="var(--text-faint)">NO</text>

  <!-- Decision 3 -->
  <polygon points="440,286 540,312 440,338 340,312" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="440" y="307" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Non-data descriptor</text>
  <text x="440" y="322" font-family="sans-serif" font-size="11" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">in type(obj)?</text>

  <!-- Yes → non-data descriptor -->
  <line x1="540" y1="312" x2="680" y2="312" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="610" y="304" font-family="sans-serif" font-size="11" fill="var(--ok-accent)">YES (priority 3)</text>
  <rect x="680" y="292" width="220" height="40" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="790" y="312" font-family="monospace" font-size="12" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">descriptor.__get__(obj, type)</text>
  <text x="790" y="327" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">has __get__ only (e.g. methods)</text>

  <!-- No → class variable -->
  <line x1="440" y1="338" x2="440" y2="358" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="458" y="354" font-family="sans-serif" font-size="11" fill="var(--text-faint)">NO</text>

  <rect x="300" y="358" width="280" height="38" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="440" y="376" font-family="monospace" font-size="12" fill="var(--primary-accent)" text-anchor="middle">class attribute or AttributeError</text>
  <text x="440" y="390" font-family="sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">(priority 4)</text>

  <!-- ===== RIGHT: Method signatures ===== -->
  <rect x="920" y="64" width="340" height="188" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="86" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Descriptor Method Signatures</text>
  <text x="940" y="110" font-family="monospace" font-size="12" font-weight="bold" fill="var(--primary-accent)">__get__(self, obj, objtype)</text>
  <text x="940" y="128" font-family="sans-serif" font-size="11" fill="var(--text-muted)">  obj=None when accessed from class</text>
  <text x="940" y="146" font-family="sans-serif" font-size="11" fill="var(--text-muted)">  returns the attribute value</text>
  <text x="940" y="168" font-family="monospace" font-size="12" font-weight="bold" fill="var(--primary-accent)">__set__(self, obj, value)</text>
  <text x="940" y="186" font-family="sans-serif" font-size="11" fill="var(--text-muted)">  called on obj.attr = value</text>
  <text x="940" y="206" font-family="monospace" font-size="12" font-weight="bold" fill="var(--primary-accent)">__delete__(self, obj)</text>
  <text x="940" y="224" font-family="sans-serif" font-size="11" fill="var(--text-muted)">  called on del obj.attr</text>

  <!-- ===== BOTTOM: Priority table ===== -->
  <rect x="30" y="414" width="860" height="200" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="460" y="436" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--text)" text-anchor="middle">Data Descriptor vs Non-Data Descriptor</text>

  <!-- Table header -->
  <rect x="50" y="444" width="820" height="30" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="170" y="463" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Type</text>
  <text x="380" y="463" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Methods Required</text>
  <text x="580" y="463" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Priority</text>
  <text x="780" y="463" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Examples</text>

  <!-- Row 1: Data descriptor -->
  <rect x="50" y="474" width="820" height="38" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="170" y="496" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Data descriptor</text>
  <text x="380" y="490" font-family="monospace" font-size="11" fill="var(--text)" text-anchor="middle">__get__ + __set__</text>
  <text x="380" y="506" font-family="monospace" font-size="11" fill="var(--text-muted)" text-anchor="middle">and/or __delete__</text>
  <text x="580" y="496" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">HIGHEST (beats instance dict)</text>
  <text x="780" y="490" font-family="monospace" font-size="11" fill="var(--text)" text-anchor="middle">property, slots,</text>
  <text x="780" y="506" font-family="monospace" font-size="11" fill="var(--text)" text-anchor="middle">ORM fields</text>

  <!-- Row 2: Instance dict -->
  <rect x="50" y="512" width="820" height="34" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="170" y="533" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Instance __dict__</text>
  <text x="380" y="533" font-family="monospace" font-size="11" fill="var(--text)" text-anchor="middle">obj.__dict__['attr'] = val</text>
  <text x="580" y="533" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">MIDDLE</text>
  <text x="780" y="533" font-family="monospace" font-size="11" fill="var(--text)" text-anchor="middle">self.name = "Alice"</text>

  <!-- Row 3: Non-data descriptor -->
  <rect x="50" y="546" width="820" height="38" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="170" y="568" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Non-data descriptor</text>
  <text x="380" y="562" font-family="monospace" font-size="11" fill="var(--text)" text-anchor="middle">__get__ only</text>
  <text x="380" y="578" font-family="monospace" font-size="11" fill="var(--text-muted)" text-anchor="middle">(no __set__)</text>
  <text x="580" y="568" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">LOWEST (instance dict overrides)</text>
  <text x="780" y="562" font-family="monospace" font-size="11" fill="var(--text)" text-anchor="middle">functions/methods,</text>
  <text x="780" y="578" font-family="monospace" font-size="11" fill="var(--text)" text-anchor="middle">staticmethod</text>

  <line x1="260" y1="474" x2="260" y2="584" stroke="var(--border)" stroke-width="1"/>
  <line x1="480" y1="474" x2="480" y2="584" stroke="var(--border)" stroke-width="1"/>
  <line x1="670" y1="474" x2="670" y2="584" stroke="var(--border)" stroke-width="1"/>

  <!-- __set_name__ box -->
  <rect x="920" y="264" width="340" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1090" y="284" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">__set_name__ (Python 3.6+)</text>
  <text x="935" y="304" font-family="monospace" font-size="11" fill="var(--text)">def __set_name__(self, owner, name):</text>
  <text x="935" y="322" font-family="monospace" font-size="11" fill="var(--text-muted)">    self.name = name</text>
  <text x="935" y="342" font-family="sans-serif" font-size="11" fill="var(--text-muted)">Called when descriptor defined in class</text>

  <!-- Code example box -->
  <rect x="920" y="368" width="340" height="148" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1090" y="388" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--text)" text-anchor="middle">Usage Example</text>
  <text x="935" y="408" font-family="monospace" font-size="11" fill="var(--primary-accent)">class Validated:</text>
  <text x="935" y="424" font-family="monospace" font-size="11" fill="var(--text)">  def __set_name__(self,own,nm):</text>
  <text x="935" y="440" font-family="monospace" font-size="11" fill="var(--text)">    self.name = nm</text>
  <text x="935" y="456" font-family="monospace" font-size="11" fill="var(--text)">  def __get__(self, obj, t=None):</text>
  <text x="935" y="472" font-family="monospace" font-size="11" fill="var(--text)">    return obj.__dict__[self.name]</text>
  <text x="935" y="488" font-family="monospace" font-size="11" fill="var(--text)">  def __set__(self, obj, val):</text>
  <text x="935" y="504" font-family="monospace" font-size="11" fill="var(--text)">    obj.__dict__[self.name] = val</text>

  <!-- Bottom note -->
  <rect x="30" y="620" width="860" height="14" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="440" y="631" font-family="sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">Write access (obj.attr = val): data descriptor __set__ always wins over instance __dict__</text>
</svg>

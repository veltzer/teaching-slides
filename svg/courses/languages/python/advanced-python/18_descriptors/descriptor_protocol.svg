<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Title bar -->
  <rect x="40" y="40" width="1200" height="47.125" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="70.8125" font-family="sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Descriptor Protocol: Lookup Chain &amp; Priority</text>

  <!-- ===== TOP: Attribute lookup flowchart ===== -->
  <text x="452.5" y="107.0625" font-family="sans-serif" font-size="13.8261" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Attribute Lookup: obj.attr</text>

  <!-- Start -->
  <rect x="283.75" y="116.125" width="337.5" height="34.4375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="452.5" y="137.875" font-family="monospace" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">obj.attr  (read access)</text>

  <line x1="452.5" y1="150.5625" x2="452.5" y2="168.6875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1 -->
  <polygon points="452.5,168.6875 546.25,192.25 452.5,215.8125 358.75,192.25" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="452.5" y="187.7188" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Data descriptor</text>
  <text x="452.5" y="201.3125" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">in type(obj)?</text>

  <!-- Yes → data descriptor wins -->
  <line x1="546.25" y1="192.25" x2="677.5" y2="192.25" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="611.875" y="185" font-family="sans-serif" font-size="10.1392" fill="var(--ok-accent)">YES (priority 1)</text>
  <rect x="677.5" y="174.125" width="206.25" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780.625" y="192.25" font-family="monospace" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">descriptor.__get__(obj, type)</text>
  <text x="780.625" y="205.8438" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">has __get__ AND __set__/__delete__</text>

  <!-- No → check instance dict -->
  <line x1="452.5" y1="215.8125" x2="452.5" y2="233.9375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="469.375" y="230.3125" font-family="sans-serif" font-size="10.1392" fill="var(--text-faint)">NO</text>

  <!-- Decision 2 -->
  <polygon points="452.5,233.9375 546.25,257.5 452.5,281.0625 358.75,257.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="452.5" y="252.9688" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">attr in</text>
  <text x="452.5" y="266.5625" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">obj.__dict__?</text>

  <!-- Yes → instance dict -->
  <line x1="546.25" y1="257.5" x2="677.5" y2="257.5" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="611.875" y="250.25" font-family="sans-serif" font-size="10.1392" fill="var(--ok-accent)">YES (priority 2)</text>
  <rect x="677.5" y="239.375" width="206.25" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780.625" y="257.5" font-family="monospace" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">obj.__dict__['attr']</text>
  <text x="780.625" y="271.0938" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">instance variable wins here</text>

  <!-- No → non-data descriptor -->
  <line x1="452.5" y1="281.0625" x2="452.5" y2="299.1875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="469.375" y="295.5625" font-family="sans-serif" font-size="10.1392" fill="var(--text-faint)">NO</text>

  <!-- Decision 3 -->
  <polygon points="452.5,299.1875 546.25,322.75 452.5,346.3125 358.75,322.75" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="452.5" y="318.2188" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Non-data descriptor</text>
  <text x="452.5" y="331.8125" font-family="sans-serif" font-size="10.1392" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">in type(obj)?</text>

  <!-- Yes → non-data descriptor -->
  <line x1="546.25" y1="322.75" x2="677.5" y2="322.75" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="611.875" y="315.5" font-family="sans-serif" font-size="10.1392" fill="var(--ok-accent)">YES (priority 3)</text>
  <rect x="677.5" y="304.625" width="206.25" height="36.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780.625" y="322.75" font-family="monospace" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">descriptor.__get__(obj, type)</text>
  <text x="780.625" y="336.3438" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">has __get__ only (e.g. methods)</text>

  <!-- No → class variable -->
  <line x1="452.5" y1="346.3125" x2="452.5" y2="364.4375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="469.375" y="360.8125" font-family="sans-serif" font-size="10.1392" fill="var(--text-faint)">NO</text>

  <rect x="321.25" y="364.4375" width="262.5" height="34.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="452.5" y="380.75" font-family="monospace" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle">class attribute or AttributeError</text>
  <text x="452.5" y="393.4375" font-family="sans-serif" font-size="10" fill="var(--text-faint)" text-anchor="middle">(priority 4)</text>

  <!-- ===== RIGHT: Method signatures ===== -->
  <rect x="902.5" y="98" width="318.75" height="170.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.875" y="117.9375" font-family="sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Descriptor Method Signatures</text>
  <text x="921.25" y="139.6875" font-family="monospace" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">__get__(self, obj, objtype)</text>
  <text x="921.25" y="156" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">  obj=None when accessed from class</text>
  <text x="921.25" y="172.3125" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">  returns the attribute value</text>
  <text x="921.25" y="192.25" font-family="monospace" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">__set__(self, obj, value)</text>
  <text x="921.25" y="208.5625" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">  called on obj.attr = value</text>
  <text x="921.25" y="226.6875" font-family="monospace" font-size="11.0609" font-weight="bold" fill="var(--primary-accent)">__delete__(self, obj)</text>
  <text x="921.25" y="243" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">  called on del obj.attr</text>

  <!-- ===== BOTTOM: Priority table ===== -->
  <rect x="68.125" y="415.1875" width="806.25" height="181.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="471.25" y="435.125" font-family="sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)" text-anchor="middle">Data Descriptor vs Non-Data Descriptor</text>

  <!-- Table header -->
  <rect x="86.875" y="442.375" width="768.75" height="27.1875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="199.375" y="459.5938" font-family="sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">Type</text>
  <text x="396.25" y="459.5938" font-family="sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">Methods Required</text>
  <text x="583.75" y="459.5938" font-family="sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">Priority</text>
  <text x="771.25" y="459.5938" font-family="sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">Examples</text>

  <!-- Row 1: Data descriptor -->
  <rect x="86.875" y="469.5625" width="768.75" height="34.4375" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="199.375" y="489.5" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Data descriptor</text>
  <text x="396.25" y="484.0625" font-family="monospace" font-size="10.1392" fill="var(--text)" text-anchor="middle">__get__ + __set__</text>
  <text x="396.25" y="498.5625" font-family="monospace" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">and/or __delete__</text>
  <text x="583.75" y="489.5" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">HIGHEST (beats instance dict)</text>
  <text x="771.25" y="484.0625" font-family="monospace" font-size="10.1392" fill="var(--text)" text-anchor="middle">property, slots,</text>
  <text x="771.25" y="498.5625" font-family="monospace" font-size="10.1392" fill="var(--text)" text-anchor="middle">ORM fields</text>

  <!-- Row 2: Instance dict -->
  <rect x="86.875" y="504" width="768.75" height="30.8125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="199.375" y="523.0312" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Instance __dict__</text>
  <text x="396.25" y="523.0312" font-family="monospace" font-size="10.1392" fill="var(--text)" text-anchor="middle">obj.__dict__['attr'] = val</text>
  <text x="583.75" y="523.0312" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">MIDDLE</text>
  <text x="771.25" y="523.0312" font-family="monospace" font-size="10.1392" fill="var(--text)" text-anchor="middle">self.name = "Alice"</text>

  <!-- Row 3: Non-data descriptor -->
  <rect x="86.875" y="534.8125" width="768.75" height="34.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="199.375" y="554.75" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Non-data descriptor</text>
  <text x="396.25" y="549.3125" font-family="monospace" font-size="10.1392" fill="var(--text)" text-anchor="middle">__get__ only</text>
  <text x="396.25" y="563.8125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">(no __set__)</text>
  <text x="583.75" y="554.75" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">LOWEST (instance dict overrides)</text>
  <text x="771.25" y="549.3125" font-family="monospace" font-size="10.1392" fill="var(--text)" text-anchor="middle">functions/methods,</text>
  <text x="771.25" y="563.8125" font-family="monospace" font-size="10.1392" fill="var(--text)" text-anchor="middle">staticmethod</text>

  <line x1="283.75" y1="469.5625" x2="283.75" y2="569.25" stroke="var(--border)" stroke-width="1"/>
  <line x1="490" y1="469.5625" x2="490" y2="569.25" stroke="var(--border)" stroke-width="1"/>
  <line x1="668.125" y1="469.5625" x2="668.125" y2="569.25" stroke="var(--border)" stroke-width="1"/>

  <!-- __set_name__ box -->
  <rect x="902.5" y="279.25" width="318.75" height="81.5625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1061.875" y="297.375" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">__set_name__ (Python 3.6+)</text>
  <text x="916.5625" y="315.5" font-family="monospace" font-size="10.1392" fill="var(--text)">def __set_name__(self, owner, name):</text>
  <text x="916.5625" y="331.8125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">    self.name = name</text>
  <text x="916.5625" y="349.9375" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">Called when descriptor defined in class</text>

  <!-- Code example box -->
  <rect x="902.5" y="373.5" width="318.75" height="134.125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1061.875" y="391.625" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)" text-anchor="middle">Usage Example</text>
  <text x="916.5625" y="409.75" font-family="monospace" font-size="10.1392" fill="var(--primary-accent)">class Validated:</text>
  <text x="916.5625" y="424.25" font-family="monospace" font-size="10.1392" fill="var(--text)">  def __set_name__(self,own,nm):</text>
  <text x="916.5625" y="438.75" font-family="monospace" font-size="10.1392" fill="var(--text)">    self.name = nm</text>
  <text x="916.5625" y="453.25" font-family="monospace" font-size="10.1392" fill="var(--text)">  def __get__(self, obj, t=None):</text>
  <text x="916.5625" y="467.75" font-family="monospace" font-size="10.1392" fill="var(--text)">    return obj.__dict__[self.name]</text>
  <text x="916.5625" y="482.25" font-family="monospace" font-size="10.1392" fill="var(--text)">  def __set__(self, obj, val):</text>
  <text x="916.5625" y="496.75" font-family="monospace" font-size="10.1392" fill="var(--text)">    obj.__dict__[self.name] = val</text>

  <!-- Bottom note -->
  <rect x="68.125" y="601.875" width="806.25" height="12.6875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="452.5" y="611.8438" font-family="sans-serif" font-size="10" fill="var(--primary-accent)" text-anchor="middle">Write access (obj.attr = val): data descriptor __set__ always wins over instance __dict__</text>
</svg>

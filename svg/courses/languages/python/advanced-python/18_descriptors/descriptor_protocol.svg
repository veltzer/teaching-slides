<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="700" height="332.962962962962" rx="10.363754503432" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="390" y="72.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--primary-accent)">Lookup: obj.attr</text>

  <rect x="260" y="88.333333333334" width="260" height="37.592592592593" rx="8.291003602745" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="113.037037037038" text-anchor="middle" font-family="Courier New, monospace" font-size="14.509256304805" font-weight="bold" fill="var(--primary-text)">obj.attr</text>
  <line x1="390" y1="125.925925925926" x2="390" y2="147.407407407407" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="200" y="152.777777777778" width="380" height="37.592592592593" rx="8.291003602745" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="177.481481481482" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" font-weight="bold" fill="var(--ok-text)">1. Data descriptor wins</text>
  <line x1="390" y1="190.37037037037" x2="390" y2="211.851851851852" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="200" y="217.222222222223" width="380" height="37.592592592593" rx="8.291003602745" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="241.925925925926" text-anchor="middle" font-family="Courier New, monospace" font-size="13.472880854462" font-weight="bold" fill="var(--ok-text)">2. obj.__dict__</text>
  <line x1="390" y1="254.814814814815" x2="390" y2="276.296296296296" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="200" y="281.666666666667" width="380" height="37.592592592593" rx="8.291003602745" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="306.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" font-weight="bold" fill="var(--ok-text)">3. Non-data descriptor</text>
  <line x1="390" y1="319.259259259259" x2="390" y2="340.74074074074" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="200" y="346.111111111111" width="380" height="21.481481481481" rx="8.291003602745" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="362.222222222223" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--primary-text)">4. class attr or AttributeError</text>

  <rect x="760" y="40" width="480" height="193.333333333333" rx="10.363754503432" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="70.074074074075" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--primary-text)">Method Signatures</text>
  <text x="780" y="99.074074074075" font-family="Courier New, monospace" font-size="13.472880854462" font-weight="bold" fill="var(--primary-text)">__get__(self, obj, type)</text>
  <text x="780" y="125.925925925926" font-family="Courier New, monospace" font-size="13.472880854462" font-weight="bold" fill="var(--primary-text)">__set__(self, obj, value)</text>
  <text x="780" y="152.777777777778" font-family="Courier New, monospace" font-size="13.472880854462" font-weight="bold" fill="var(--primary-text)">__delete__(self, obj)</text>
  <text x="780" y="185" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--primary-text)">obj=None from class</text>
  <text x="780" y="211.851851851852" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--primary-text)">Set intercepts assignment</text>

  <rect x="760" y="249.444444444445" width="480" height="123.518518518519" rx="10.363754503432" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="276.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" font-weight="bold" fill="var(--warn-text)">__set_name__ (3.6+)</text>
  <text x="780" y="303.148148148148" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--warn-text)">__set_name__(self, owner, name)</text>
  <text x="780" y="330.000000000001" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--warn-text)">Called at class definition</text>
  <text x="780" y="356.851851851852" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--warn-text)">Capture the attribute name</text>

  <rect x="40" y="394.444444444445" width="1200" height="225.555555555555" rx="10.363754503432" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="424.518518518518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--text)">Data vs Non-Data</text>

  <rect x="60" y="442.777777777778" width="380" height="161.111111111111" rx="8.291003602745" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--danger-text)">Data descriptor</text>
  <text x="250" y="507.222222222222" text-anchor="middle" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--danger-text)">__get__ + __set__</text>
  <text x="250" y="539.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--danger-text)">Highest priority</text>
  <text x="250" y="571.666666666666" text-anchor="middle" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--danger-text)">property, ORM field</text>

  <rect x="450" y="442.777777777778" width="380" height="161.111111111111" rx="8.291003602745" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--ok-text)">Instance __dict__</text>
  <text x="640" y="507.222222222222" text-anchor="middle" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--ok-text)">obj.__dict__[k]=v</text>
  <text x="640" y="539.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--ok-text)">Middle</text>

  <rect x="840" y="442.777777777778" width="380" height="161.111111111111" rx="8.291003602745" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--primary-text)">Non-data descriptor</text>
  <text x="1030" y="507.222222222222" text-anchor="middle" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--primary-text)">__get__ only</text>
  <text x="1030" y="539.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.436505404118" fill="var(--primary-text)">Lowest</text>
  <text x="1030" y="571.666666666666" text-anchor="middle" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--primary-text)">methods</text>
</svg>

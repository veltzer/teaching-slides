<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.290122420528" font-weight="bold" fill="var(--text)">Python Descriptor Protocol</text>

  <rect x="40" y="65.663716814159" width="700" height="318.230088495575" rx="10.131873827513" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="390" y="96.46017699115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--primary-accent)">Lookup: obj.attr</text>

  <rect x="260" y="111.858407079646" width="260" height="35.929203539823" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="135.469026548673" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" font-weight="bold" fill="var(--primary-text)">obj.attr</text>
  <line x1="390" y1="147.787610619469" x2="390" y2="168.318584070796" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="173.451327433628" width="380" height="35.929203539823" rx="8.10549906201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="197.061946902655" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-weight="bold" fill="var(--ok-text)">1. Data descriptor wins</text>
  <line x1="390" y1="209.380530973451" x2="390" y2="229.911504424779" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="235.044247787611" width="380" height="35.929203539823" rx="8.10549906201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="258.654867256637" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" font-weight="bold" fill="var(--ok-text)">2. obj.__dict__</text>
  <line x1="390" y1="270.973451327434" x2="390" y2="291.504424778761" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="296.637168141593" width="380" height="35.929203539823" rx="8.10549906201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="320.247787610619" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" font-weight="bold" fill="var(--ok-text)">3. Non-data descriptor</text>
  <line x1="390" y1="332.566371681416" x2="390" y2="353.097345132743" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="358.230088495575" width="380" height="20.530973451327" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="373.628318584071" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--primary-text)">4. class attr or AttributeError</text>

  <rect x="760" y="65.663716814159" width="480" height="184.778761061947" rx="10.131873827513" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="94.407079646018" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--primary-text)">Method Signatures</text>
  <text x="780" y="122.12389380531" font-family="Courier New, monospace" font-size="13.171435975767" font-weight="bold" fill="var(--primary-text)">__get__(self, obj, type)</text>
  <text x="780" y="147.787610619469" font-family="Courier New, monospace" font-size="13.171435975767" font-weight="bold" fill="var(--primary-text)">__set__(self, obj, value)</text>
  <text x="780" y="173.451327433628" font-family="Courier New, monospace" font-size="13.171435975767" font-weight="bold" fill="var(--primary-text)">__delete__(self, obj)</text>
  <text x="780" y="204.247787610619" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--primary-text)">obj=None from class</text>
  <text x="780" y="229.911504424779" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--primary-text)">Set intercepts assignment</text>

  <rect x="760" y="265.840707964602" width="480" height="118.053097345133" rx="10.131873827513" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="291.504424778761" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--warn-text)">__set_name__ (3.6+)</text>
  <text x="780" y="317.16814159292" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--warn-text)">__set_name__(self, owner, name)</text>
  <text x="780" y="342.83185840708" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--warn-text)">Called at class definition</text>
  <text x="780" y="368.495575221239" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--warn-text)">Capture the attribute name</text>

  <rect x="40" y="404.424778761062" width="1200" height="215.575221238938" rx="10.131873827513" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="433.16814159292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--text)">Data vs Non-Data</text>

  <rect x="60" y="450.619469026549" width="380" height="153.982300884956" rx="8.10549906201" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="481.41592920354" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--danger-text)">Data descriptor</text>
  <text x="250" y="512.212389380531" text-anchor="middle" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--danger-text)">__get__ + __set__</text>
  <text x="250" y="543.008849557522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--danger-text)">Highest priority</text>
  <text x="250" y="573.805309734513" text-anchor="middle" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--danger-text)">property, ORM field</text>

  <rect x="450" y="450.619469026549" width="380" height="153.982300884956" rx="8.10549906201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="481.41592920354" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)">Instance __dict__</text>
  <text x="640" y="512.212389380531" text-anchor="middle" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--ok-text)">obj.__dict__[k]=v</text>
  <text x="640" y="543.008849557522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">Middle</text>

  <rect x="840" y="450.619469026549" width="380" height="153.982300884956" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="481.41592920354" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--primary-text)">Non-data descriptor</text>
  <text x="1030" y="512.212389380531" text-anchor="middle" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--primary-text)">__get__ only</text>
  <text x="1030" y="543.008849557522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--primary-text)">Lowest</text>
  <text x="1030" y="573.805309734513" text-anchor="middle" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--primary-text)">methods</text>
</svg>

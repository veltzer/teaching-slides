<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
  </defs>
  <!-- Title bar -->
  <rect x="40" y="40" width="1200" height="47.570978" fill="var(--primary-fill)" rx="6.028324" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="71.104101" font-family="sans-serif" font-size="20.374028" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Descriptor Protocol: Lookup Chain &amp; Priority</text>

  <!-- ===== TOP: Attribute lookup flowchart ===== -->
  <text x="452.5" y="107.697161" font-family="sans-serif" font-size="13.891369" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Attribute Lookup: obj.attr</text>

  <!-- Start -->
  <rect x="283.75" y="116.845426" width="337.5" height="34.763407" rx="6.028324" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="452.5" y="138.801262" font-family="monospace" font-size="12.965318" font-weight="bold" fill="var(--bg)" text-anchor="middle">obj.attr  (read access)</text>

  <line x1="452.5" y1="151.608833" x2="452.5" y2="169.905363" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1 -->
  <polygon points="452.5,169.905363 546.25,193.690852 452.5,217.476341 358.75,193.690852" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="452.5" y="189.11677" font-family="sans-serif" font-size="10.187064" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Data descriptor</text>
  <text x="452.5" y="202.839117" font-family="sans-serif" font-size="10.187064" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">in type(obj)?</text>

  <!-- Yes → data descriptor wins -->
  <line x1="546.25" y1="193.690852" x2="677.5" y2="193.690852" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="611.875" y="186.37224" font-family="sans-serif" font-size="10.187064" fill="var(--ok-accent)">YES (priority 1)</text>
  <rect x="677.5" y="175.394322" width="206.25" height="36.59306" rx="6.028324" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780.625" y="193.690852" font-family="monospace" font-size="11.113115" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">descriptor.__get__(obj, type)</text>
  <text x="780.625" y="207.4133" font-family="sans-serif" font-size="10.047207" fill="var(--text-muted)" text-anchor="middle">has __get__ AND __set__/__delete__</text>

  <!-- No → check instance dict -->
  <line x1="452.5" y1="217.476341" x2="452.5" y2="235.772871" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="469.375" y="232.113565" font-family="sans-serif" font-size="10.187064" fill="var(--text-faint)">NO</text>

  <!-- Decision 2 -->
  <polygon points="452.5,235.772871 546.25,259.55836 452.5,283.343849 358.75,259.55836" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="452.5" y="254.984278" font-family="sans-serif" font-size="10.187064" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">attr in</text>
  <text x="452.5" y="268.706625" font-family="sans-serif" font-size="10.187064" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">obj.__dict__?</text>

  <!-- Yes → instance dict -->
  <line x1="546.25" y1="259.55836" x2="677.5" y2="259.55836" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="611.875" y="252.239748" font-family="sans-serif" font-size="10.187064" fill="var(--ok-accent)">YES (priority 2)</text>
  <rect x="677.5" y="241.26183" width="206.25" height="36.59306" rx="6.028324" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780.625" y="259.55836" font-family="monospace" font-size="11.113115" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">obj.__dict__['attr']</text>
  <text x="780.625" y="273.280808" font-family="sans-serif" font-size="10.047207" fill="var(--text-muted)" text-anchor="middle">instance variable wins here</text>

  <!-- No → non-data descriptor -->
  <line x1="452.5" y1="283.343849" x2="452.5" y2="301.640379" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="469.375" y="297.981073" font-family="sans-serif" font-size="10.187064" fill="var(--text-faint)">NO</text>

  <!-- Decision 3 -->
  <polygon points="452.5,301.640379 546.25,325.425868 452.5,349.211356 358.75,325.425868" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="452.5" y="320.851785" font-family="sans-serif" font-size="10.187064" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Non-data descriptor</text>
  <text x="452.5" y="334.574132" font-family="sans-serif" font-size="10.187064" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">in type(obj)?</text>

  <!-- Yes → non-data descriptor -->
  <line x1="546.25" y1="325.425868" x2="677.5" y2="325.425868" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="611.875" y="318.107256" font-family="sans-serif" font-size="10.187064" fill="var(--ok-accent)">YES (priority 3)</text>
  <rect x="677.5" y="307.129338" width="206.25" height="36.59306" rx="6.028324" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780.625" y="325.425868" font-family="monospace" font-size="11.113115" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">descriptor.__get__(obj, type)</text>
  <text x="780.625" y="339.148315" font-family="sans-serif" font-size="10.047207" fill="var(--text-muted)" text-anchor="middle">has __get__ only (e.g. methods)</text>

  <!-- No → class variable -->
  <line x1="452.5" y1="349.211356" x2="452.5" y2="367.507886" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="469.375" y="363.84858" font-family="sans-serif" font-size="10.187064" fill="var(--text-faint)">NO</text>

  <rect x="321.25" y="367.507886" width="262.5" height="34.763407" rx="6.028324" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="452.5" y="383.974763" font-family="monospace" font-size="11.113115" fill="var(--primary-accent)" text-anchor="middle">class attribute or AttributeError</text>
  <text x="452.5" y="396.782334" font-family="sans-serif" font-size="10.047207" fill="var(--text-faint)" text-anchor="middle">(priority 4)</text>

  <!-- ===== RIGHT: Method signatures ===== -->
  <rect x="902.5" y="98.548896" width="318.75" height="171.987382" rx="6.028324" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.875" y="118.675079" font-family="sans-serif" font-size="12.965318" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Descriptor Method Signatures</text>
  <text x="921.25" y="140.630915" font-family="monospace" font-size="11.113115" font-weight="bold" fill="var(--primary-accent)">__get__(self, obj, objtype)</text>
  <text x="921.25" y="157.097792" font-family="sans-serif" font-size="10.187064" fill="var(--text-muted)">  obj=None when accessed from class</text>
  <text x="921.25" y="173.564669" font-family="sans-serif" font-size="10.187064" fill="var(--text-muted)">  returns the attribute value</text>
  <text x="921.25" y="193.690852" font-family="monospace" font-size="11.113115" font-weight="bold" fill="var(--primary-accent)">__set__(self, obj, value)</text>
  <text x="921.25" y="210.157729" font-family="sans-serif" font-size="10.187064" fill="var(--text-muted)">  called on obj.attr = value</text>
  <text x="921.25" y="228.454259" font-family="monospace" font-size="11.113115" font-weight="bold" fill="var(--primary-accent)">__delete__(self, obj)</text>
  <text x="921.25" y="244.921136" font-family="sans-serif" font-size="10.187064" fill="var(--text-muted)">  called on del obj.attr</text>

  <!-- ===== BOTTOM: Priority table ===== -->
  <rect x="68.125" y="418.73817" width="806.25" height="182.9653" rx="6.028324" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="471.25" y="438.864353" font-family="sans-serif" font-size="12.965318" font-weight="bold" fill="var(--text)" text-anchor="middle">Data Descriptor vs Non-Data Descriptor</text>

  <!-- Table header -->
  <rect x="86.875" y="446.182965" width="768.75" height="27.444795" rx="6.028324" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="199.375" y="463.564719" font-family="sans-serif" font-size="11.113115" font-weight="bold" fill="var(--bg)" text-anchor="middle">Type</text>
  <text x="396.25" y="463.564719" font-family="sans-serif" font-size="11.113115" font-weight="bold" fill="var(--bg)" text-anchor="middle">Methods Required</text>
  <text x="583.75" y="463.564719" font-family="sans-serif" font-size="11.113115" font-weight="bold" fill="var(--bg)" text-anchor="middle">Priority</text>
  <text x="771.25" y="463.564719" font-family="sans-serif" font-size="11.113115" font-weight="bold" fill="var(--bg)" text-anchor="middle">Examples</text>

  <!-- Row 1: Data descriptor -->
  <rect x="86.875" y="473.62776" width="768.75" height="34.763407" rx="6.028324" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="199.375" y="493.753943" font-family="sans-serif" font-size="12.039267" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Data descriptor</text>
  <text x="396.25" y="488.264984" font-family="monospace" font-size="10.187064" fill="var(--text)" text-anchor="middle">__get__ + __set__</text>
  <text x="396.25" y="502.902208" font-family="monospace" font-size="10.187064" fill="var(--text-muted)" text-anchor="middle">and/or __delete__</text>
  <text x="583.75" y="493.753943" font-family="sans-serif" font-size="12.039267" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">HIGHEST (beats instance dict)</text>
  <text x="771.25" y="488.264984" font-family="monospace" font-size="10.187064" fill="var(--text)" text-anchor="middle">property, slots,</text>
  <text x="771.25" y="502.902208" font-family="monospace" font-size="10.187064" fill="var(--text)" text-anchor="middle">ORM fields</text>

  <!-- Row 2: Instance dict -->
  <rect x="86.875" y="508.391167" width="768.75" height="31.104101" rx="6.028324" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="199.375" y="527.602473" font-family="sans-serif" font-size="12.039267" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Instance __dict__</text>
  <text x="396.25" y="527.602473" font-family="monospace" font-size="10.187064" fill="var(--text)" text-anchor="middle">obj.__dict__['attr'] = val</text>
  <text x="583.75" y="527.602473" font-family="sans-serif" font-size="12.039267" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">MIDDLE</text>
  <text x="771.25" y="527.602473" font-family="monospace" font-size="10.187064" fill="var(--text)" text-anchor="middle">self.name = "Alice"</text>

  <!-- Row 3: Non-data descriptor -->
  <rect x="86.875" y="539.495268" width="768.75" height="34.763407" rx="6.028324" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="199.375" y="559.621451" font-family="sans-serif" font-size="12.039267" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Non-data descriptor</text>
  <text x="396.25" y="554.132492" font-family="monospace" font-size="10.187064" fill="var(--text)" text-anchor="middle">__get__ only</text>
  <text x="396.25" y="568.769716" font-family="monospace" font-size="10.187064" fill="var(--text-muted)" text-anchor="middle">(no __set__)</text>
  <text x="583.75" y="559.621451" font-family="sans-serif" font-size="12.039267" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">LOWEST (instance dict overrides)</text>
  <text x="771.25" y="554.132492" font-family="monospace" font-size="10.187064" fill="var(--text)" text-anchor="middle">functions/methods,</text>
  <text x="771.25" y="568.769716" font-family="monospace" font-size="10.187064" fill="var(--text)" text-anchor="middle">staticmethod</text>

  <line x1="283.75" y1="473.62776" x2="283.75" y2="574.258675" stroke="var(--border)" stroke-width="1"/>
  <line x1="490" y1="473.62776" x2="490" y2="574.258675" stroke="var(--border)" stroke-width="1"/>
  <line x1="668.125" y1="473.62776" x2="668.125" y2="574.258675" stroke="var(--border)" stroke-width="1"/>

  <!-- __set_name__ box -->
  <rect x="902.5" y="281.514196" width="318.75" height="82.334385" rx="6.028324" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.875" y="299.810726" font-family="sans-serif" font-size="12.039267" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">__set_name__ (Python 3.6+)</text>
  <text x="916.5625" y="318.107256" font-family="monospace" font-size="10.187064" fill="var(--text)">def __set_name__(self, owner, name):</text>
  <text x="916.5625" y="334.574132" font-family="monospace" font-size="10.187064" fill="var(--text-muted)">    self.name = name</text>
  <text x="916.5625" y="352.870662" font-family="sans-serif" font-size="10.187064" fill="var(--text-muted)">Called when descriptor defined in class</text>

  <!-- Code example box -->
  <rect x="902.5" y="376.656151" width="318.75" height="135.394322" rx="6.028324" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1061.875" y="394.952681" font-family="sans-serif" font-size="12.039267" font-weight="bold" fill="var(--text)" text-anchor="middle">Usage Example</text>
  <text x="916.5625" y="413.249211" font-family="monospace" font-size="10.187064" fill="var(--primary-accent)">class Validated:</text>
  <text x="916.5625" y="427.886435" font-family="monospace" font-size="10.187064" fill="var(--text)">  def __set_name__(self,own,nm):</text>
  <text x="916.5625" y="442.523659" font-family="monospace" font-size="10.187064" fill="var(--text)">    self.name = nm</text>
  <text x="916.5625" y="457.160883" font-family="monospace" font-size="10.187064" fill="var(--text)">  def __get__(self, obj, t=None):</text>
  <text x="916.5625" y="471.798107" font-family="monospace" font-size="10.187064" fill="var(--text)">    return obj.__dict__[self.name]</text>
  <text x="916.5625" y="486.435331" font-family="monospace" font-size="10.187064" fill="var(--text)">  def __set__(self, obj, val):</text>
  <text x="916.5625" y="501.072555" font-family="monospace" font-size="10.187064" fill="var(--text)">    obj.__dict__[self.name] = val</text>

  <!-- Bottom note -->
  <rect x="68.125" y="607.192429" width="806.25" height="12.807571" rx="6.028324" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="452.5" y="617.255571" font-family="sans-serif" font-size="10.047207" fill="var(--primary-accent)" text-anchor="middle">Write access (obj.attr = val): data descriptor __set__ always wins over instance __dict__</text>
</svg>

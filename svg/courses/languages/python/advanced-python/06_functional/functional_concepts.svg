<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.316497186031" font-weight="bold" fill="var(--primary-accent)">map / filter / reduce</text>

  <!-- MAP row -->
  <rect x="40" y="70.796460176991" width="160" height="61.592920353982" rx="6.079124296508" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="120" y="106.725663716814" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--text)">[1,2,3,4,5]</text>
  <line x1="205" y1="101.592920353982" x2="245" y2="101.592920353982" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="70.796460176991" width="180" height="61.592920353982" rx="6.079124296508" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="94.407079646018" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--bg)">map</text>
  <text x="340" y="116.991150442478" text-anchor="middle" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">lambda x: x**2</text>
  <line x1="435" y1="101.592920353982" x2="475" y2="101.592920353982" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="480" y="70.796460176991" width="180" height="61.592920353982" rx="6.079124296508" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="106.725663716814" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--bg)">[1,4,9,16,25]</text>
  <text x="690" y="110" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Apply fn, same length</text>

  <!-- FILTER row -->
  <rect x="40" y="158.053097345133" width="160" height="61.592920353982" rx="6.079124296508" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="120" y="193.982300884956" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--text)">[1,2,3,4,5,6]</text>
  <line x1="205" y1="188.849557522124" x2="245" y2="188.849557522124" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="158.053097345133" width="180" height="61.592920353982" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="181.663716814159" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--bg)">filter</text>
  <text x="340" y="204.247787610619" text-anchor="middle" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">lambda x: x%2==0</text>
  <line x1="435" y1="188.849557522124" x2="475" y2="188.849557522124" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="480" y="158.053097345133" width="180" height="61.592920353982" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="193.982300884956" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--bg)">[2,4,6]</text>
  <text x="690" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Keep true, shorter</text>

  <!-- REDUCE row -->
  <rect x="40" y="245.309734513274" width="160" height="61.592920353982" rx="6.079124296508" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="120" y="281.238938053097" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--text)">[1,2,3,4,5]</text>
  <line x1="205" y1="276.106194690266" x2="245" y2="276.106194690266" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="245.309734513274" width="180" height="61.592920353982" rx="6.079124296508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="268.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--bg)">reduce</text>
  <text x="340" y="291.504424778761" text-anchor="middle" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">lambda a,x: a+x</text>
  <line x1="435" y1="276.106194690266" x2="475" y2="276.106194690266" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="480" y="245.309734513274" width="180" height="61.592920353982" rx="6.079124296508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="281.238938053097" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--bg)">15</text>
  <text x="690" y="285" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Fold via accumulator</text>

  <!-- Reduce steps -->
  <rect x="40" y="337.699115044248" width="620" height="133.451327433628" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="368.495575221239" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" font-weight="bold" fill="var(--bg)">reduce step-by-step</text>
  <rect x="60" y="389.026548672566" width="90" height="32.849557522124" rx="4.052749531005" fill="var(--bg)"/>
  <text x="105" y="411.610619469027" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">1+2=3</text>
  <line x1="152" y1="405.451327433628" x2="170" y2="405.451327433628" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <rect x="172" y="389.026548672566" width="90" height="32.849557522124" rx="4.052749531005" fill="var(--bg)"/>
  <text x="217" y="411.610619469027" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">3+3=6</text>
  <line x1="264" y1="405.451327433628" x2="282" y2="405.451327433628" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <rect x="284" y="389.026548672566" width="90" height="32.849557522124" rx="4.052749531005" fill="var(--bg)"/>
  <text x="329" y="411.610619469027" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">6+4=10</text>
  <line x1="376" y1="405.451327433628" x2="394" y2="405.451327433628" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <rect x="396" y="389.026548672566" width="100" height="32.849557522124" rx="4.052749531005" fill="var(--bg)"/>
  <text x="446" y="411.610619469027" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">10+5=15</text>
  <line x1="498" y1="405.451327433628" x2="516" y2="405.451327433628" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <rect x="518" y="389.026548672566" width="70" height="32.849557522124" rx="4.052749531005" fill="var(--warn-accent)"/>
  <text x="553" y="411.610619469027" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">15</text>
  <text x="350" y="450.619469026549" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--bg)">Accumulator grows left-to-right</text>

  <!-- Chaining -->
  <rect x="680" y="337.699115044248" width="560" height="282.300884955752" rx="8.10549906201" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="368.495575221239" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--bg)">Chaining Pipeline</text>
  <rect x="700" y="383.893805309735" width="520" height="32.849557522124" rx="4.052749531005" fill="var(--code-bg)"/>
  <text x="960" y="405.451327433628" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">nums = range(1, 11)</text>
  <rect x="700" y="424.955752212389" width="520" height="32.849557522124" rx="4.052749531005" fill="var(--code-bg)"/>
  <text x="960" y="446.513274336283" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">ev = filter(lambda x: x%2==0, nums)</text>
  <rect x="700" y="466.017699115044" width="520" height="32.849557522124" rx="4.052749531005" fill="var(--code-bg)"/>
  <text x="960" y="487.575221238938" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">sq = map(lambda x: x**2, ev)</text>
  <rect x="700" y="507.079646017699" width="520" height="32.849557522124" rx="4.052749531005" fill="var(--code-bg)"/>
  <text x="960" y="528.637168141593" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--bg)">total = reduce(lambda a,b: a+b, sq)</text>
  <text x="960" y="590" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="var(--bg)">from functools import reduce</text>

  <!-- bottom descriptor -->
</svg>

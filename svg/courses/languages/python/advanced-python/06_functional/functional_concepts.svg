<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Title row labels -->
  <text x="640" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">map / filter / reduce — Data Pipeline Transformations</text>

  <!-- === MAP ROW === -->
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">map()</text>

  <!-- Input data -->
  <rect x="50" y="100" width="180" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="140" y="122" font-family="monospace" font-size="13" fill="var(--primary-accent)" text-anchor="middle">[1, 2, 3, 4, 5]</text>
  <text x="140" y="144" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">input iterable</text>

  <line x1="230" y1="128" x2="280" y2="128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- map box -->
  <rect x="280" y="96" width="180" height="64" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="370" y="122" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">map()</text>
  <text x="370" y="142" font-family="monospace" font-size="13" fill="var(--primary-accent)" text-anchor="middle">lambda x: x**2</text>
  <text x="370" y="155" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)" text-anchor="middle">applies function to every element</text>

  <line x1="460" y1="128" x2="510" y2="128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- map output -->
  <rect x="510" y="100" width="200" height="56" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="122" font-family="monospace" font-size="13" fill="var(--primary-accent)" text-anchor="middle">[1, 4, 9, 16, 25]</text>
  <text x="610" y="144" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">same length, transformed</text>

  <!-- map description -->
  <text x="760" y="115" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Applies a function to each element.</text>
  <text x="760" y="135" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Output has the same length as input.</text>
  <text x="760" y="155" font-family="monospace" font-size="13" fill="var(--primary-accent)">list(map(lambda x: x**2, [1,2,3,4,5]))</text>

  <!-- === FILTER ROW === -->
  <text x="50" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">filter()</text>

  <rect x="50" y="225" width="180" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="140" y="247" font-family="monospace" font-size="13" fill="var(--ok-accent)" text-anchor="middle">[1, 2, 3, 4, 5, 6]</text>
  <text x="140" y="269" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">input iterable</text>

  <line x1="230" y1="253" x2="280" y2="253" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- filter box -->
  <rect x="280" y="221" width="180" height="64" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="370" y="247" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">filter()</text>
  <text x="370" y="267" font-family="monospace" font-size="13" fill="var(--ok-accent)" text-anchor="middle">lambda x: x%2==0</text>
  <text x="370" y="280" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">keeps elements where True</text>

  <line x1="460" y1="253" x2="510" y2="253" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- filter output -->
  <rect x="510" y="225" width="200" height="56" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="247" font-family="monospace" font-size="13" fill="var(--ok-accent)" text-anchor="middle">[2, 4, 6]</text>
  <text x="610" y="269" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">only matching elements</text>

  <text x="760" y="240" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Keeps elements where predicate is True.</text>
  <text x="760" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Output can be shorter than input.</text>
  <text x="760" y="280" font-family="monospace" font-size="13" fill="var(--ok-accent)">list(filter(lambda x: x%2==0, [1,2,3,4,5,6]))</text>

  <!-- === REDUCE ROW === -->
  <text x="50" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)">reduce()</text>

  <rect x="50" y="350" width="180" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="140" y="372" font-family="monospace" font-size="13" fill="var(--warn-accent)" text-anchor="middle">[1, 2, 3, 4, 5]</text>
  <text x="140" y="394" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">input iterable</text>

  <line x1="230" y1="378" x2="280" y2="378" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- reduce box -->
  <rect x="280" y="346" width="180" height="64" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="370" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">reduce()</text>
  <text x="370" y="392" font-family="monospace" font-size="13" fill="var(--warn-accent)" text-anchor="middle">lambda acc, x: acc+x</text>
  <text x="370" y="405" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)" text-anchor="middle">accumulates to a single value</text>

  <line x1="460" y1="378" x2="510" y2="378" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- reduce output -->
  <rect x="510" y="350" width="200" height="56" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="372" font-family="monospace" font-size="13" fill="var(--warn-accent)" text-anchor="middle">15</text>
  <text x="610" y="394" font-family="Arial, sans-serif" font-size="12" fill="var(--text-faint)" text-anchor="middle">single accumulated value</text>

  <text x="760" y="365" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Folds list into a single value.</text>
  <text x="760" y="385" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Uses running accumulator.</text>
  <text x="760" y="405" font-family="monospace" font-size="13" fill="var(--warn-accent)">from functools import reduce</text>
  <text x="760" y="420" font-family="monospace" font-size="13" fill="var(--warn-accent)">reduce(lambda acc, x: acc+x, [1,2,3,4,5])</text>

  <!-- Step-by-step reduce visualization -->
  <rect x="50" y="435" width="660" height="120" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="458" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">reduce step-by-step: [1, 2, 3, 4, 5]</text>

  <!-- Steps -->
  <rect x="75" y="468" width="80" height="30" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="115" y="488" font-family="monospace" font-size="13" fill="var(--text)" text-anchor="middle">1+2=3</text>
  <line x1="155" y1="483" x2="175" y2="483" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="175" y="468" width="80" height="30" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="215" y="488" font-family="monospace" font-size="13" fill="var(--text)" text-anchor="middle">3+3=6</text>
  <line x1="255" y1="483" x2="275" y2="483" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="275" y="468" width="80" height="30" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="315" y="488" font-family="monospace" font-size="13" fill="var(--text)" text-anchor="middle">6+4=10</text>
  <line x1="355" y1="483" x2="375" y2="483" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="375" y="468" width="80" height="30" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="415" y="488" font-family="monospace" font-size="13" fill="var(--bg)" text-anchor="middle">10+5=15</text>
  <line x1="455" y1="483" x2="475" y2="483" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="475" y="468" width="60" height="30" rx="6" fill="var(--warn-accent)"/>
  <text x="505" y="488" font-family="monospace" font-size="14" fill="var(--bg)" text-anchor="middle" font-weight="bold">15</text>

  <text x="380" y="540" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)" text-anchor="middle">Accumulator grows left-to-right through the list</text>

  <!-- Chaining pipeline -->
  <rect x="760" y="435" width="480" height="185" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="456" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Chaining Operations</text>

  <rect x="780" y="464" width="440" height="28" rx="6" fill="var(--code-bg)"/>
  <text x="1000" y="483" font-family="monospace" font-size="13" fill="var(--primary-accent)" text-anchor="middle">numbers = range(1, 11)</text>

  <rect x="780" y="498" width="440" height="28" rx="6" fill="var(--code-bg)"/>
  <text x="1000" y="517" font-family="monospace" font-size="13" fill="var(--ok-accent)" text-anchor="middle">evens = filter(lambda x: x%2==0, numbers)</text>

  <rect x="780" y="532" width="440" height="28" rx="6" fill="var(--code-bg)"/>
  <text x="1000" y="551" font-family="monospace" font-size="13" fill="var(--warn-accent)" text-anchor="middle">squared = map(lambda x: x**2, evens)</text>

  <rect x="780" y="566" width="440" height="28" rx="6" fill="var(--code-bg)"/>
  <text x="1000" y="585" font-family="monospace" font-size="13" fill="var(--warn-accent)" text-anchor="middle">total = reduce(lambda a,b: a+b, squared)</text>

  <text x="1000" y="612" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)" text-anchor="middle">[2,4,6,8,10] → [4,16,36,64,100] → 220</text>

  <!-- Divider line -->
  <line x1="50" y1="425" x2="1230" y2="425" stroke="var(--border)" stroke-width="1"/>
</svg>

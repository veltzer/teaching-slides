<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
  </defs>
  <!-- Title row labels -->
  <text x="634.957983" y="40" font-family="Arial, sans-serif" font-size="20.049373" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">map / filter / reduce — Data Pipeline Transformations</text>

  <!-- === MAP ROW === -->
  <text x="40" y="91.821306" font-family="Arial, sans-serif" font-size="16.039476" font-weight="bold" fill="var(--primary-accent)">map()</text>

  <!-- Input data -->
  <rect x="40" y="101.786942" width="181.512605" height="55.80756" rx="6.525462" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130.756303" y="123.71134" font-family="monospace" font-size="13.032108" fill="var(--primary-accent)" text-anchor="middle">[1, 2, 3, 4, 5]</text>
  <text x="130.756303" y="145.635739" font-family="Arial, sans-serif" font-size="12.02958" fill="var(--text-faint)" text-anchor="middle">input iterable</text>

  <line x1="221.512605" y1="129.690722" x2="271.932773" y2="129.690722" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- map box -->
  <rect x="271.932773" y="97.800687" width="181.512605" height="63.780069" rx="6.525462" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="362.689076" y="123.71134" font-family="Arial, sans-serif" font-size="16.039476" font-weight="bold" fill="var(--bg)" text-anchor="middle">map()</text>
  <text x="362.689076" y="143.642612" font-family="monospace" font-size="13.032108" fill="var(--primary-accent)" text-anchor="middle">lambda x: x**2</text>
  <text x="362.689076" y="156.597993" font-family="Arial, sans-serif" font-size="11.02716" fill="var(--primary-accent)" text-anchor="middle">applies function to every element</text>

  <line x1="453.445378" y1="129.690722" x2="503.865546" y2="129.690722" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- map output -->
  <rect x="503.865546" y="101.786942" width="201.680672" height="55.80756" rx="6.525462" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.705882" y="123.71134" font-family="monospace" font-size="13.032108" fill="var(--primary-accent)" text-anchor="middle">[1, 4, 9, 16, 25]</text>
  <text x="604.705882" y="145.635739" font-family="Arial, sans-serif" font-size="12.02958" fill="var(--text-faint)" text-anchor="middle">same length, transformed</text>

  <!-- map description -->
  <text x="755.966387" y="116.73545" font-family="Arial, sans-serif" font-size="14.034528" fill="var(--text-muted)">Applies a function to each element.</text>
  <text x="755.966387" y="136.666722" font-family="Arial, sans-serif" font-size="14.034528" fill="var(--text-muted)">Output has the same length as input.</text>
  <text x="755.966387" y="156.597993" font-family="monospace" font-size="13.032108" fill="var(--primary-accent)">list(map(lambda x: x**2, [1,2,3,4,5]))</text>

  <!-- === FILTER ROW === -->
  <text x="40" y="216.391808" font-family="Arial, sans-serif" font-size="16.039476" font-weight="bold" fill="var(--ok-accent)">filter()</text>

  <rect x="40" y="226.357333" width="181.512605" height="55.80756" rx="6.525462" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130.756303" y="248.281842" font-family="monospace" font-size="13.032108" fill="var(--ok-accent)" text-anchor="middle">[1, 2, 3, 4, 5, 6]</text>
  <text x="130.756303" y="270.206131" font-family="Arial, sans-serif" font-size="12.02958" fill="var(--text-faint)" text-anchor="middle">input iterable</text>

  <line x1="221.512605" y1="254.261113" x2="271.932773" y2="254.261113" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- filter box -->
  <rect x="271.932773" y="222.371079" width="181.512605" height="63.780069" rx="6.525462" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="362.689076" y="248.281842" font-family="Arial, sans-serif" font-size="16.039476" font-weight="bold" fill="var(--bg)" text-anchor="middle">filter()</text>
  <text x="362.689076" y="268.213113" font-family="monospace" font-size="13.032108" fill="var(--ok-accent)" text-anchor="middle">lambda x: x%2==0</text>
  <text x="362.689076" y="281.168385" font-family="Arial, sans-serif" font-size="11.02716" fill="var(--ok-accent)" text-anchor="middle">keeps elements where True</text>

  <line x1="453.445378" y1="254.261113" x2="503.865546" y2="254.261113" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- filter output -->
  <rect x="503.865546" y="226.357333" width="201.680672" height="55.80756" rx="6.525462" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.705882" y="248.281842" font-family="monospace" font-size="13.032108" fill="var(--ok-accent)" text-anchor="middle">[2, 4, 6]</text>
  <text x="604.705882" y="270.206131" font-family="Arial, sans-serif" font-size="12.02958" fill="var(--text-faint)" text-anchor="middle">only matching elements</text>

  <text x="755.966387" y="241.305842" font-family="Arial, sans-serif" font-size="14.034528" fill="var(--text-muted)">Keeps elements where predicate is True.</text>
  <text x="755.966387" y="261.237113" font-family="Arial, sans-serif" font-size="14.034528" fill="var(--text-muted)">Output can be shorter than input.</text>
  <text x="755.966387" y="281.168385" font-family="monospace" font-size="13.032108" fill="var(--ok-accent)">list(filter(lambda x: x%2==0, [1,2,3,4,5,6]))</text>

  <!-- === REDUCE ROW === -->
  <text x="40" y="340.962199" font-family="Arial, sans-serif" font-size="16.039476" font-weight="bold" fill="var(--warn-accent)">reduce()</text>

  <rect x="40" y="350.927835" width="181.512605" height="55.80756" rx="6.525462" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130.756303" y="372.852234" font-family="monospace" font-size="13.032108" fill="var(--warn-accent)" text-anchor="middle">[1, 2, 3, 4, 5]</text>
  <text x="130.756303" y="394.776632" font-family="Arial, sans-serif" font-size="12.02958" fill="var(--text-faint)" text-anchor="middle">input iterable</text>

  <line x1="221.512605" y1="378.831615" x2="271.932773" y2="378.831615" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- reduce box -->
  <rect x="271.932773" y="346.941581" width="181.512605" height="63.780069" rx="6.525462" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="362.689076" y="372.852234" font-family="Arial, sans-serif" font-size="16.039476" font-weight="bold" fill="var(--bg)" text-anchor="middle">reduce()</text>
  <text x="362.689076" y="392.783505" font-family="monospace" font-size="13.032108" fill="var(--warn-accent)" text-anchor="middle">lambda acc, x: acc+x</text>
  <text x="362.689076" y="405.738777" font-family="Arial, sans-serif" font-size="11.02716" fill="var(--warn-accent)" text-anchor="middle">accumulates to a single value</text>

  <line x1="453.445378" y1="378.831615" x2="503.865546" y2="378.831615" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- reduce output -->
  <rect x="503.865546" y="350.927835" width="201.680672" height="55.80756" rx="6.525462" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="604.705882" y="372.852234" font-family="monospace" font-size="13.032108" fill="var(--warn-accent)" text-anchor="middle">15</text>
  <text x="604.705882" y="394.776632" font-family="Arial, sans-serif" font-size="12.02958" fill="var(--text-faint)" text-anchor="middle">single accumulated value</text>

  <text x="755.966387" y="365.876234" font-family="Arial, sans-serif" font-size="14.034528" fill="var(--text-muted)">Folds list into a single value.</text>
  <text x="755.966387" y="385.807505" font-family="Arial, sans-serif" font-size="14.034528" fill="var(--text-muted)">Uses running accumulator.</text>
  <text x="755.966387" y="405.738777" font-family="monospace" font-size="13.032108" fill="var(--warn-accent)">from functools import reduce</text>
  <text x="755.966387" y="420.687285" font-family="monospace" font-size="13.032108" fill="var(--warn-accent)">reduce(lambda acc, x: acc+x, [1,2,3,4,5])</text>

  <!-- Step-by-step reduce visualization -->
  <rect x="40" y="435.635794" width="665.546218" height="119.587629" rx="6.525462" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="372.773109" y="458.556701" font-family="Arial, sans-serif" font-size="14.034528" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">reduce step-by-step: [1, 2, 3, 4, 5]</text>

  <!-- Steps -->
  <rect x="65.210084" y="468.522337" width="80.672269" height="29.896907" rx="6.525462" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="105.546218" y="488.453608" font-family="monospace" font-size="13.032108" fill="var(--text)" text-anchor="middle">1+2=3</text>
  <line x1="145.882353" y1="483.470845" x2="166.05042" y2="483.470845" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="166.05042" y="468.522337" width="80.672269" height="29.896907" rx="6.525462" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.386555" y="488.453608" font-family="monospace" font-size="13.032108" fill="var(--text)" text-anchor="middle">3+3=6</text>
  <line x1="246.722689" y1="483.470845" x2="266.890756" y2="483.470845" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="266.890756" y="468.522337" width="80.672269" height="29.896907" rx="6.525462" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.226891" y="488.453608" font-family="monospace" font-size="13.032108" fill="var(--text)" text-anchor="middle">6+4=10</text>
  <line x1="347.563025" y1="483.470845" x2="367.731092" y2="483.470845" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="367.731092" y="468.522337" width="80.672269" height="29.896907" rx="6.525462" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="408.067227" y="488.453608" font-family="monospace" font-size="13.032108" fill="var(--bg)" text-anchor="middle">10+5=15</text>
  <line x1="448.403361" y1="483.470845" x2="468.571429" y2="483.470845" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="468.571429" y="468.522337" width="60.504202" height="29.896907" rx="6.525462" fill="var(--warn-accent)"/>
  <text x="498.823529" y="488.453608" font-family="monospace" font-size="14.034528" fill="var(--bg)" text-anchor="middle" font-weight="bold">15</text>

  <text x="372.773109" y="540.274914" font-family="Arial, sans-serif" font-size="13.032108" fill="var(--text-faint)" text-anchor="middle">Accumulator grows left-to-right through the list</text>

  <!-- Chaining pipeline -->
  <rect x="755.966387" y="435.635794" width="484.033613" height="184.364206" rx="6.525462" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="997.983193" y="456.563574" font-family="Arial, sans-serif" font-size="15.036948" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Chaining Operations</text>

  <rect x="776.134454" y="464.536082" width="443.697479" height="27.90378" rx="6.525462" fill="var(--code-bg)"/>
  <text x="997.983193" y="483.470845" font-family="monospace" font-size="13.032108" fill="var(--primary-accent)" text-anchor="middle">numbers = range(1, 11)</text>

  <rect x="776.134454" y="498.419244" width="443.697479" height="27.90378" rx="6.525462" fill="var(--code-bg)"/>
  <text x="997.983193" y="517.353897" font-family="monospace" font-size="13.032108" fill="var(--ok-accent)" text-anchor="middle">evens = filter(lambda x: x%2==0, numbers)</text>

  <rect x="776.134454" y="532.302405" width="443.697479" height="27.90378" rx="6.525462" fill="var(--code-bg)"/>
  <text x="997.983193" y="551.237168" font-family="monospace" font-size="13.032108" fill="var(--warn-accent)" text-anchor="middle">squared = map(lambda x: x**2, evens)</text>

  <rect x="776.134454" y="566.185567" width="443.697479" height="27.90378" rx="6.525462" fill="var(--code-bg)"/>
  <text x="997.983193" y="585.12022" font-family="monospace" font-size="13.032108" fill="var(--warn-accent)" text-anchor="middle">total = reduce(lambda a,b: a+b, squared)</text>

  <text x="997.983193" y="612.027491" font-family="Arial, sans-serif" font-size="12.02958" fill="var(--info-accent)" text-anchor="middle">[2,4,6,8,10] → [4,16,36,64,100] → 220</text>

  <!-- Divider line -->
  <line x1="40" y1="425.670048" x2="1229.915966" y2="425.670048" stroke="var(--border)" stroke-width="1"/>
</svg>

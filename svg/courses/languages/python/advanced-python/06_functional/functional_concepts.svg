<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Title row labels -->
  <text x="640" y="74.4375" font-family="Arial, sans-serif" font-size="18.4349" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">map / filter / reduce — Data Pipeline Transformations</text>

  <!-- === MAP ROW === -->
  <text x="86.875" y="121.5625" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)">map()</text>

  <!-- Input data -->
  <rect x="86.875" y="130.625" width="168.75" height="50.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="171.25" y="150.5625" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">[1, 2, 3, 4, 5]</text>
  <text x="171.25" y="170.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">input iterable</text>

  <line x1="255.625" y1="156" x2="302.5" y2="156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- map box -->
  <rect x="302.5" y="127" width="168.75" height="58" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="386.875" y="150.5625" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">map()</text>
  <text x="386.875" y="168.6875" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">lambda x: x**2</text>
  <text x="386.875" y="180.4688" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle">applies function to every element</text>

  <line x1="471.25" y1="156" x2="518.125" y2="156" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- map output -->
  <rect x="518.125" y="130.625" width="187.5" height="50.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="611.875" y="150.5625" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">[1, 4, 9, 16, 25]</text>
  <text x="611.875" y="170.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">same length, transformed</text>

  <!-- map description -->
  <text x="752.5" y="144.2188" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Applies a function to each element.</text>
  <text x="752.5" y="162.3438" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Output has the same length as input.</text>
  <text x="752.5" y="180.4688" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">list(map(lambda x: x**2, [1,2,3,4,5]))</text>

  <!-- === FILTER ROW === -->
  <text x="86.875" y="234.8438" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--ok-accent)">filter()</text>

  <rect x="86.875" y="243.9062" width="168.75" height="50.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="171.25" y="263.8438" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">[1, 2, 3, 4, 5, 6]</text>
  <text x="171.25" y="283.7812" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">input iterable</text>

  <line x1="255.625" y1="269.2812" x2="302.5" y2="269.2812" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- filter box -->
  <rect x="302.5" y="240.2812" width="168.75" height="58" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="386.875" y="263.8438" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">filter()</text>
  <text x="386.875" y="281.9688" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">lambda x: x%2==0</text>
  <text x="386.875" y="293.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">keeps elements where True</text>

  <line x1="471.25" y1="269.2812" x2="518.125" y2="269.2812" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- filter output -->
  <rect x="518.125" y="243.9062" width="187.5" height="50.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="611.875" y="263.8438" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">[2, 4, 6]</text>
  <text x="611.875" y="283.7812" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">only matching elements</text>

  <text x="752.5" y="257.5" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Keeps elements where predicate is True.</text>
  <text x="752.5" y="275.625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Output can be shorter than input.</text>
  <text x="752.5" y="293.75" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">list(filter(lambda x: x%2==0, [1,2,3,4,5,6]))</text>

  <!-- === REDUCE ROW === -->
  <text x="86.875" y="348.125" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)">reduce()</text>

  <rect x="86.875" y="357.1875" width="168.75" height="50.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="171.25" y="377.125" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle">[1, 2, 3, 4, 5]</text>
  <text x="171.25" y="397.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">input iterable</text>

  <line x1="255.625" y1="382.5625" x2="302.5" y2="382.5625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- reduce box -->
  <rect x="302.5" y="353.5625" width="168.75" height="58" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="386.875" y="377.125" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">reduce()</text>
  <text x="386.875" y="395.25" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle">lambda acc, x: acc+x</text>
  <text x="386.875" y="407.0312" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle">accumulates to a single value</text>

  <line x1="471.25" y1="382.5625" x2="518.125" y2="382.5625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- reduce output -->
  <rect x="518.125" y="357.1875" width="187.5" height="50.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="611.875" y="377.125" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle">15</text>
  <text x="611.875" y="397.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">single accumulated value</text>

  <text x="752.5" y="370.7812" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Folds list into a single value.</text>
  <text x="752.5" y="388.9062" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Uses running accumulator.</text>
  <text x="752.5" y="407.0312" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)">from functools import reduce</text>
  <text x="752.5" y="420.625" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)">reduce(lambda acc, x: acc+x, [1,2,3,4,5])</text>

  <!-- Step-by-step reduce visualization -->
  <rect x="86.875" y="434.2188" width="618.75" height="108.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="396.25" y="455.0625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">reduce step-by-step: [1, 2, 3, 4, 5]</text>

  <!-- Steps -->
  <rect x="110.3125" y="464.125" width="75" height="27.1875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="147.8125" y="482.25" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">1+2=3</text>
  <line x1="185.3125" y1="477.7188" x2="204.0625" y2="477.7188" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="204.0625" y="464.125" width="75" height="27.1875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="241.5625" y="482.25" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">3+3=6</text>
  <line x1="279.0625" y1="477.7188" x2="297.8125" y2="477.7188" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="297.8125" y="464.125" width="75" height="27.1875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="335.3125" y="482.25" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">6+4=10</text>
  <line x1="372.8125" y1="477.7188" x2="391.5625" y2="477.7188" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="391.5625" y="464.125" width="75" height="27.1875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="429.0625" y="482.25" font-family="monospace" font-size="11.9827" fill="var(--bg)" text-anchor="middle">10+5=15</text>
  <line x1="466.5625" y1="477.7188" x2="485.3125" y2="477.7188" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="485.3125" y="464.125" width="56.25" height="27.1875" rx="6" fill="var(--warn-accent)"/>
  <text x="513.4375" y="482.25" font-family="monospace" font-size="12.9044" fill="var(--bg)" text-anchor="middle" font-weight="bold">15</text>

  <text x="396.25" y="529.375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)" text-anchor="middle">Accumulator grows left-to-right through the list</text>

  <!-- Chaining pipeline -->
  <rect x="752.5" y="434.2188" width="450" height="167.6562" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="977.5" y="453.25" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Chaining Operations</text>

  <rect x="771.25" y="460.5" width="412.5" height="25.375" rx="6" fill="var(--code-bg)"/>
  <text x="977.5" y="477.7188" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">numbers = range(1, 11)</text>

  <rect x="771.25" y="491.3125" width="412.5" height="25.375" rx="6" fill="var(--code-bg)"/>
  <text x="977.5" y="508.5312" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">evens = filter(lambda x: x%2==0, numbers)</text>

  <rect x="771.25" y="522.125" width="412.5" height="25.375" rx="6" fill="var(--code-bg)"/>
  <text x="977.5" y="539.3438" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle">squared = map(lambda x: x**2, evens)</text>

  <rect x="771.25" y="552.9375" width="412.5" height="25.375" rx="6" fill="var(--code-bg)"/>
  <text x="977.5" y="570.1562" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle">total = reduce(lambda a,b: a+b, squared)</text>

  <text x="977.5" y="594.625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" text-anchor="middle">[2,4,6,8,10] → [4,16,36,64,100] → 220</text>

  <!-- Divider line -->
  <line x1="86.875" y1="425.1562" x2="1193.125" y2="425.1562" stroke="var(--border)" stroke-width="1"/>
</svg>

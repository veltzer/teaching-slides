<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- MAP row -->
  <rect x="40" y="40" width="160" height="65.046728971962" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="120" y="77.943925233645" text-anchor="middle" font-family="Courier New, monospace" font-size="14.576898892028" fill="var(--text)">[1,2,3,4,5]</text>
  <line x1="205" y1="72.523364485981" x2="245" y2="72.523364485981" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="250" y="40" width="180" height="65.046728971962" rx="6.247242382298" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="64.934579439253" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955744" font-weight="bold" fill="var(--bg)">map</text>
  <text x="340" y="88.785046728972" text-anchor="middle" font-family="Courier New, monospace" font-size="12.494484764595" fill="var(--bg)">lambda x: x**2</text>
  <line x1="435" y1="72.523364485981" x2="475" y2="72.523364485981" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="480" y="40" width="180" height="65.046728971962" rx="6.247242382298" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="77.943925233645" text-anchor="middle" font-family="Courier New, monospace" font-size="14.576898892028" fill="var(--bg)">[1,4,9,16,25]</text>
  <text x="690" y="81.401869158879" font-family="Arial, sans-serif" font-size="13.359514793361" fill="var(--text-muted)">Apply fn, same length</text>

  <!-- FILTER row -->
  <rect x="40" y="132.149532710281" width="160" height="65.046728971962" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="120" y="170.093457943926" text-anchor="middle" font-family="Courier New, monospace" font-size="14.576898892028" fill="var(--text)">[1,2,3,4,5,6]</text>
  <line x1="205" y1="164.672897196262" x2="245" y2="164.672897196262" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="250" y="132.149532710281" width="180" height="65.046728971962" rx="6.247242382298" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="157.084112149533" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955744" font-weight="bold" fill="var(--bg)">filter</text>
  <text x="340" y="180.934579439252" text-anchor="middle" font-family="Courier New, monospace" font-size="12.494484764595" fill="var(--bg)">lambda x: x%2==0</text>
  <line x1="435" y1="164.672897196262" x2="475" y2="164.672897196262" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="480" y="132.149532710281" width="180" height="65.046728971962" rx="6.247242382298" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="170.093457943926" text-anchor="middle" font-family="Courier New, monospace" font-size="14.576898892028" fill="var(--bg)">[2,4,6]</text>
  <text x="690" y="171.168224299066" font-family="Arial, sans-serif" font-size="13.359514793361" fill="var(--text-muted)">Keep true, shorter</text>

  <!-- REDUCE row -->
  <rect x="40" y="224.299065420561" width="160" height="65.046728971962" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="120" y="262.242990654205" text-anchor="middle" font-family="Courier New, monospace" font-size="14.576898892028" fill="var(--text)">[1,2,3,4,5]</text>
  <line x1="205" y1="256.822429906543" x2="245" y2="256.822429906543" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="250" y="224.299065420561" width="180" height="65.046728971962" rx="6.247242382298" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="249.233644859813" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955744" font-weight="bold" fill="var(--bg)">reduce</text>
  <text x="340" y="273.084112149533" text-anchor="middle" font-family="Courier New, monospace" font-size="12.494484764595" fill="var(--bg)">lambda a,x: a+x</text>
  <line x1="435" y1="256.822429906543" x2="475" y2="256.822429906543" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="480" y="224.299065420561" width="180" height="65.046728971962" rx="6.247242382298" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="262.242990654205" text-anchor="middle" font-family="Courier New, monospace" font-size="14.576898892028" fill="var(--bg)">15</text>
  <text x="690" y="266.214953271028" font-family="Arial, sans-serif" font-size="13.359514793361" fill="var(--text-muted)">Fold via accumulator</text>

  <!-- Reduce steps -->
  <rect x="40" y="321.869158878505" width="620" height="140.934579439252" rx="8.32965650973" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="354.392523364486" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955744" font-weight="bold" fill="var(--bg)">reduce step-by-step</text>
  <rect x="60" y="376.07476635514" width="90" height="34.691588785047" rx="4.164828254865" fill="var(--bg)"/>
  <text x="105" y="399.92523364486" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--text)">1+2=3</text>
  <line x1="152" y1="393.420560747663" x2="170" y2="393.420560747663" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <rect x="172" y="376.07476635514" width="90" height="34.691588785047" rx="4.164828254865" fill="var(--bg)"/>
  <text x="217" y="399.92523364486" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--text)">3+3=6</text>
  <line x1="264" y1="393.420560747663" x2="282" y2="393.420560747663" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <rect x="284" y="376.07476635514" width="90" height="34.691588785047" rx="4.164828254865" fill="var(--bg)"/>
  <text x="329" y="399.92523364486" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--text)">6+4=10</text>
  <line x1="376" y1="393.420560747663" x2="394" y2="393.420560747663" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <rect x="396" y="376.07476635514" width="100" height="34.691588785047" rx="4.164828254865" fill="var(--bg)"/>
  <text x="446" y="399.92523364486" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--text)">10+5=15</text>
  <line x1="498" y1="393.420560747663" x2="516" y2="393.420560747663" stroke="var(--bg)" stroke-width="2" marker-end="url(#arrow-white)"/>
  <rect x="518" y="376.07476635514" width="70" height="34.691588785047" rx="4.164828254865" fill="var(--warn-accent)"/>
  <text x="553" y="399.92523364486" text-anchor="middle" font-family="Courier New, monospace" font-size="14.576898892028" font-weight="bold" fill="var(--bg)">15</text>
  <text x="350" y="441.121495327103" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.494484764595" fill="var(--bg)">Accumulator grows left-to-right</text>

  <!-- Chaining -->
  <rect x="680" y="321.869158878505" width="560" height="298.130841121495" rx="8.32965650973" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="354.392523364486" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.65931301946" font-weight="bold" fill="var(--bg)">Chaining Pipeline</text>
  <rect x="700" y="370.654205607477" width="520" height="34.691588785047" rx="4.164828254865" fill="var(--code-bg)"/>
  <text x="960" y="393.420560747663" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">nums = range(1, 11)</text>
  <rect x="700" y="414.018691588785" width="520" height="34.691588785047" rx="4.164828254865" fill="var(--code-bg)"/>
  <text x="960" y="436.785046728972" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">ev = filter(lambda x: x%2==0, nums)</text>
  <rect x="700" y="457.383177570093" width="520" height="34.691588785047" rx="4.164828254865" fill="var(--code-bg)"/>
  <text x="960" y="480.14953271028" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">sq = map(lambda x: x**2, ev)</text>
  <rect x="700" y="500.747663551402" width="520" height="34.691588785047" rx="4.164828254865" fill="var(--code-bg)"/>
  <text x="960" y="523.514018691589" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--bg)">total = reduce(lambda a,b: a+b, sq)</text>
  <text x="960" y="588.317757009346" text-anchor="middle" font-family="Courier New, monospace" font-size="12.331859809256" fill="var(--bg)">from functools import reduce</text>

  <!-- bottom descriptor -->
</svg>

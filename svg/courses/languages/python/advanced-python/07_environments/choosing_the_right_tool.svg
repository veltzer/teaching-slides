<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header row -->
  <rect x="64" y="60" width="554" height="56" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="341" y="95" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Use Case</text>
  <rect x="622" y="60" width="594" height="56" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="919" y="95" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Recommended Tool</text>
  <!-- Row 1 -->
  <rect x="64" y="124" width="554" height="56" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1"/>
  <text x="341" y="158" text-anchor="middle" font-size="20" fill="#333333">Small projects</text>
  <rect x="622" y="124" width="594" height="56" rx="4" fill="#e8f5e9" stroke="#e0e0e0" stroke-width="1"/>
  <text x="919" y="158" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">venv + pip</text>
  <!-- Row 2 -->
  <rect x="64" y="184" width="554" height="56" rx="4" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="341" y="218" text-anchor="middle" font-size="20" fill="#333333">Complex dependencies</text>
  <rect x="622" y="184" width="594" height="56" rx="4" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="919" y="218" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">poetry or pipenv</text>
  <!-- Row 3 -->
  <rect x="64" y="244" width="554" height="56" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1"/>
  <text x="341" y="278" text-anchor="middle" font-size="20" fill="#333333">Data science</text>
  <rect x="622" y="244" width="594" height="56" rx="4" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
  <text x="919" y="278" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">conda</text>
  <!-- Row 4 -->
  <rect x="64" y="304" width="554" height="56" rx="4" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="341" y="338" text-anchor="middle" font-size="20" fill="#333333">Binary packages</text>
  <rect x="622" y="304" width="594" height="56" rx="4" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="919" y="338" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">conda</text>
  <!-- Row 5 -->
  <rect x="64" y="364" width="554" height="56" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1"/>
  <text x="341" y="398" text-anchor="middle" font-size="20" fill="#333333">Package publishing</text>
  <rect x="622" y="364" width="594" height="56" rx="4" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
  <text x="919" y="398" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">poetry or hatch</text>
  <!-- Row 6 -->
  <rect x="64" y="424" width="554" height="56" rx="4" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="341" y="458" text-anchor="middle" font-size="20" fill="#333333">Enterprise environments</text>
  <rect x="622" y="424" width="594" height="56" rx="4" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="919" y="458" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">pip-tools or pipenv</text>
  <!-- Row 7 -->
  <rect x="64" y="484" width="554" height="56" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1"/>
  <text x="341" y="518" text-anchor="middle" font-size="20" fill="#333333">Existing setup.py projects</text>
  <rect x="622" y="484" width="594" height="56" rx="4" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
  <text x="919" y="518" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">pip-tools</text>
  <!-- Legend -->
  <rect x="64" y="580" width="1152" height="48" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="610" text-anchor="middle" font-size="16" fill="#1565c0">Choose based on project complexity, team size, and deployment requirements</text>
</svg>

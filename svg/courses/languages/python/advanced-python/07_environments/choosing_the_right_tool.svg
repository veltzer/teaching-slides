<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="577.083222" height="57.183066" rx="7.120689" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="328.541667" y="75.739369" text-anchor="middle" font-size="22.6896" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Use Case</text>
  <rect x="621.25" y="40" width="618.75" height="57.183066" rx="7.120689" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.625" y="75.739369" text-anchor="middle" font-size="22.6896" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Recommended Tool</text>
  <rect x="40" y="105.352148" width="577.083222" height="57.183066" rx="7.120689" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="328.541667" y="140.070335" text-anchor="middle" font-size="20.626974" fill="var(--text)" font-family="Arial, sans-serif">Small projects</text>
  <rect x="621.25" y="105.352148" width="618.75" height="57.183066" rx="7.120689" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.625" y="140.070335" text-anchor="middle" font-size="20.626974" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">venv + pip</text>
  <rect x="40" y="166.619819" width="577.083222" height="57.183066" rx="7.120689" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="328.541667" y="201.338005" text-anchor="middle" font-size="20.626974" fill="var(--text)" font-family="Arial, sans-serif">Complex dependencies</text>
  <rect x="621.25" y="166.619819" width="618.75" height="57.183066" rx="7.120689" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="930.625" y="201.338005" text-anchor="middle" font-size="20.626974" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">poetry or pipenv</text>
  <rect x="40" y="227.887363" width="577.083222" height="57.183066" rx="7.120689" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="328.541667" y="262.605549" text-anchor="middle" font-size="20.626974" fill="var(--text)" font-family="Arial, sans-serif">Data science</text>
  <rect x="621.25" y="227.887363" width="618.75" height="57.183066" rx="7.120689" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.625" y="262.605549" text-anchor="middle" font-size="20.626974" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">conda</text>
  <rect x="40" y="289.154907" width="577.083222" height="57.183066" rx="7.120689" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="328.541667" y="323.873093" text-anchor="middle" font-size="20.626974" fill="var(--text)" font-family="Arial, sans-serif">Binary packages</text>
  <rect x="621.25" y="289.154907" width="618.75" height="57.183066" rx="7.120689" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="930.625" y="323.873093" text-anchor="middle" font-size="20.626974" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">conda</text>
  <rect x="40" y="350.422578" width="577.083222" height="57.183066" rx="7.120689" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="328.541667" y="385.140764" text-anchor="middle" font-size="20.626974" fill="var(--text)" font-family="Arial, sans-serif">Package publishing</text>
  <rect x="621.25" y="350.422578" width="618.75" height="57.183066" rx="7.120689" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.625" y="385.140764" text-anchor="middle" font-size="20.626974" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">poetry or hatch</text>
  <rect x="40" y="411.690122" width="577.083222" height="57.183066" rx="7.120689" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="328.541667" y="446.408308" text-anchor="middle" font-size="20.626974" fill="var(--text)" font-family="Arial, sans-serif">Enterprise environments</text>
  <rect x="621.25" y="411.690122" width="618.75" height="57.183066" rx="7.120689" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="930.625" y="446.408308" text-anchor="middle" font-size="20.626974" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">pip-tools or pipenv</text>
  <rect x="40" y="472.957666" width="577.083222" height="57.183066" rx="7.120689" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="328.541667" y="507.675852" text-anchor="middle" font-size="20.626974" fill="var(--text)" font-family="Arial, sans-serif">Existing setup.py projects</text>
  <rect x="621.25" y="472.957666" width="618.75" height="57.183066" rx="7.120689" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.625" y="507.675852" text-anchor="middle" font-size="20.626974" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">pip-tools</text>
  <rect x="40" y="570.985889" width="1200" height="49.014111" rx="7.120689" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="601.619597" text-anchor="middle" font-size="16.501484" fill="var(--primary-accent)" font-family="Arial, sans-serif">Choose based on project complexity, team size, and deployment requirements</text>
</svg>

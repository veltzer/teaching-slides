<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1565c0">What Are Virtual Environments?</text>
  <text x="640" y="90" text-anchor="middle" font-size="20" fill="#555555">Isolated Python installations per project</text>
  <!-- Project A -->
  <rect x="100" y="120" width="460" height="440" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" filter="url(#shadow)"/>
  <text x="330" y="175" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">Project A</text>
  <rect x="130" y="195" width="400" height="320" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="330" y="260" text-anchor="middle" font-size="22" fill="#333333" font-family="monospace">Python 3.8</text>
  <text x="330" y="320" text-anchor="middle" font-size="22" fill="#333333" font-family="monospace">requests 2.24</text>
  <text x="330" y="380" text-anchor="middle" font-size="22" fill="#333333" font-family="monospace">Flask 1.1.2</text>
  <text x="330" y="440" text-anchor="middle" font-size="22" fill="#555555" font-family="monospace">numpy 1.19</text>
  <text x="330" y="490" text-anchor="middle" font-size="22" fill="#888888" font-family="monospace">...</text>
  <!-- Project B -->
  <rect x="720" y="120" width="460" height="440" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" filter="url(#shadow)"/>
  <text x="950" y="175" text-anchor="middle" font-size="26" font-weight="bold" fill="#2e7d32">Project B</text>
  <rect x="750" y="195" width="400" height="320" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="950" y="260" text-anchor="middle" font-size="22" fill="#333333" font-family="monospace">Python 3.11</text>
  <text x="950" y="320" text-anchor="middle" font-size="22" fill="#333333" font-family="monospace">requests 2.31</text>
  <text x="950" y="380" text-anchor="middle" font-size="22" fill="#333333" font-family="monospace">Django 4.2</text>
  <text x="950" y="440" text-anchor="middle" font-size="22" fill="#555555" font-family="monospace">pandas 2.0</text>
  <text x="950" y="490" text-anchor="middle" font-size="22" fill="#888888" font-family="monospace">...</text>
  <!-- Separator -->
  <line x1="640" y1="140" x2="640" y2="560" stroke="#e53935" stroke-width="4" stroke-dasharray="14 7"/>
  <!-- Footer -->
  <text x="640" y="620" text-anchor="middle" font-size="22" font-weight="bold" fill="#e53935">Completely isolated - no conflicts!</text>
</svg>

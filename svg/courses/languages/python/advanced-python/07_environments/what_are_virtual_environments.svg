<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="31.955055" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">What Are Virtual Environments?</text>
  <text x="640" y="78.802808" text-anchor="middle" font-size="21.303452" fill="var(--text-muted)" font-family="Arial, sans-serif">Isolated Python installations per project</text>
  <rect x="40" y="109.436656" width="511.111111" height="449.295773" rx="7.354217" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="295.555556" y="165.598691" text-anchor="middle" font-size="27.694389" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Project A</text>
  <rect x="73.333333" y="186.021088" width="444.444444" height="326.760504" rx="7.354217" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="295.555556" y="252.394322" text-anchor="middle" font-size="23.433723" fill="var(--text)" font-family="Courier New, monospace">Python 3.8</text>
  <text x="295.555556" y="313.661892" text-anchor="middle" font-size="23.433723" fill="var(--text)" font-family="Courier New, monospace">requests 2.24</text>
  <text x="295.555556" y="374.92959" text-anchor="middle" font-size="23.433723" fill="var(--text)" font-family="Courier New, monospace">Flask 1.1.2</text>
  <text x="295.555556" y="436.197161" text-anchor="middle" font-size="23.433723" fill="var(--text-muted)" font-family="Courier New, monospace">numpy 1.19</text>
  <text x="295.555556" y="487.25366" text-anchor="middle" font-size="23.433723" fill="var(--text-faint)" font-family="Courier New, monospace">...</text>
  <rect x="728.888889" y="109.436656" width="511.111111" height="449.295773" rx="7.354217" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="984.444326" y="165.598691" text-anchor="middle" font-size="27.694389" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Project B</text>
  <rect x="762.222222" y="186.021088" width="444.444444" height="326.760504" rx="7.354217" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="984.444326" y="252.394322" text-anchor="middle" font-size="23.433723" fill="var(--text)" font-family="Courier New, monospace">Python 3.11</text>
  <text x="984.444326" y="313.661892" text-anchor="middle" font-size="23.433723" fill="var(--text)" font-family="Courier New, monospace">requests 2.31</text>
  <text x="984.444326" y="374.92959" text-anchor="middle" font-size="23.433723" fill="var(--text)" font-family="Courier New, monospace">Django 4.2</text>
  <text x="984.444326" y="436.197161" text-anchor="middle" font-size="23.433723" fill="var(--text-muted)" font-family="Courier New, monospace">pandas 2.0</text>
  <text x="984.444326" y="487.25366" text-anchor="middle" font-size="23.433723" fill="var(--text-faint)" font-family="Courier New, monospace">...</text>
  <line x1="640" y1="129.859053" x2="640" y2="558.732429" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="12.4444 6.2222" />
  <text x="640" y="620" text-anchor="middle" font-size="23.433723" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Completely isolated - no conflicts!</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="81.8889" text-anchor="middle" font-size="26.0708" font-weight="bold" fill="var(--primary-accent)">What Are Virtual Environments?</text>
  <text x="640" y="112.5" text-anchor="middle" font-size="17.3806" fill="var(--text-muted)">Isolated Python installations per project</text>
  <rect x="133.75" y="136.6667" width="431.25" height="354.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="349.375" y="180.9723" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--primary-accent)">Project A</text>
  <rect x="161.875" y="197.0833" width="375" height="257.7777" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="349.375" y="249.4444" text-anchor="middle" font-size="19.1186" fill="var(--text)" font-family="monospace">Python 3.8</text>
  <text x="349.375" y="297.7777" text-anchor="middle" font-size="19.1186" fill="var(--text)" font-family="monospace">requests 2.24</text>
  <text x="349.375" y="346.1111" text-anchor="middle" font-size="19.1186" fill="var(--text)" font-family="monospace">Flask 1.1.2</text>
  <text x="349.375" y="394.4444" text-anchor="middle" font-size="19.1186" fill="var(--text-muted)" font-family="monospace">numpy 1.19</text>
  <text x="349.375" y="434.7223" text-anchor="middle" font-size="19.1186" fill="var(--text-faint)" font-family="monospace">...</text>
  <rect x="715" y="136.6667" width="431.25" height="354.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="930.6249" y="180.9723" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--ok-accent)">Project B</text>
  <rect x="743.125" y="197.0833" width="375" height="257.7777" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="930.6249" y="249.4444" text-anchor="middle" font-size="19.1186" fill="var(--text)" font-family="monospace">Python 3.11</text>
  <text x="930.6249" y="297.7777" text-anchor="middle" font-size="19.1186" fill="var(--text)" font-family="monospace">requests 2.31</text>
  <text x="930.6249" y="346.1111" text-anchor="middle" font-size="19.1186" fill="var(--text)" font-family="monospace">Django 4.2</text>
  <text x="930.6249" y="394.4444" text-anchor="middle" font-size="19.1186" fill="var(--text-muted)" font-family="monospace">pandas 2.0</text>
  <text x="930.6249" y="434.7223" text-anchor="middle" font-size="19.1186" fill="var(--text-faint)" font-family="monospace">...</text>
  <line x1="640" y1="152.7777" x2="640" y2="491.1111" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="12.4444 6.2222" />
  <text x="640" y="539.4444" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--danger-accent)">Completely isolated - no conflicts!</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="31.955055" font-weight="bold" fill="var(--primary-accent)">What Are Virtual Environments?</text>
  <text x="640" y="78.802808" text-anchor="middle" font-size="21.303452" fill="var(--text-muted)">Isolated Python installations per project</text>
  <rect x="40" y="109.436656" width="511.111111" height="449.295773" rx="7.354217" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="295.555556" y="165.598691" text-anchor="middle" font-size="27.694389" font-weight="bold" fill="var(--primary-accent)">Project A</text>
  <rect x="73.333333" y="186.021088" width="444.444444" height="326.760504" rx="7.354217" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="295.555556" y="252.394322" text-anchor="middle" font-size="23.433723" fill="var(--text)" font-family="monospace">Python 3.8</text>
  <text x="295.555556" y="313.661892" text-anchor="middle" font-size="23.433723" fill="var(--text)" font-family="monospace">requests 2.24</text>
  <text x="295.555556" y="374.92959" text-anchor="middle" font-size="23.433723" fill="var(--text)" font-family="monospace">Flask 1.1.2</text>
  <text x="295.555556" y="436.197161" text-anchor="middle" font-size="23.433723" fill="var(--text-muted)" font-family="monospace">numpy 1.19</text>
  <text x="295.555556" y="487.25366" text-anchor="middle" font-size="23.433723" fill="var(--text-faint)" font-family="monospace">...</text>
  <rect x="728.888889" y="109.436656" width="511.111111" height="449.295773" rx="7.354217" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="984.444326" y="165.598691" text-anchor="middle" font-size="27.694389" font-weight="bold" fill="var(--ok-accent)">Project B</text>
  <rect x="762.222222" y="186.021088" width="444.444444" height="326.760504" rx="7.354217" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" />
  <text x="984.444326" y="252.394322" text-anchor="middle" font-size="23.433723" fill="var(--text)" font-family="monospace">Python 3.11</text>
  <text x="984.444326" y="313.661892" text-anchor="middle" font-size="23.433723" fill="var(--text)" font-family="monospace">requests 2.31</text>
  <text x="984.444326" y="374.92959" text-anchor="middle" font-size="23.433723" fill="var(--text)" font-family="monospace">Django 4.2</text>
  <text x="984.444326" y="436.197161" text-anchor="middle" font-size="23.433723" fill="var(--text-muted)" font-family="monospace">pandas 2.0</text>
  <text x="984.444326" y="487.25366" text-anchor="middle" font-size="23.433723" fill="var(--text-faint)" font-family="monospace">...</text>
  <line x1="640" y1="129.859053" x2="640" y2="558.732429" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="12.4444 6.2222" />
  <text x="640" y="620" text-anchor="middle" font-size="23.433723" font-weight="bold" fill="var(--danger-accent)">Completely isolated - no conflicts!</text>
</svg>
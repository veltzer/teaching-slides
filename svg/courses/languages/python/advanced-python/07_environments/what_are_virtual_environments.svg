<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" font-family="Arial, sans-serif">
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">What Are Virtual Environments?</text>
  <text x="300" y="50" text-anchor="middle" font-size="12" fill="#666">Isolated Python installations per project</text>
  <!-- Project A -->
  <rect x="60" y="70" width="200" height="150" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="160" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Project A</text>
  <rect x="80" y="105" width="160" height="100" rx="3" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="160" y="125" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">Python 3.8</text>
  <text x="160" y="145" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">requests 2.24</text>
  <text x="160" y="165" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">Flask 1.1.2</text>
  <text x="160" y="185" text-anchor="middle" font-size="11" fill="#666">...</text>
  <!-- Project B -->
  <rect x="340" y="70" width="200" height="150" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="440" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Project B</text>
  <rect x="360" y="105" width="160" height="100" rx="3" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="440" y="125" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">Python 3.9</text>
  <text x="440" y="145" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">requests 2.25</text>
  <text x="440" y="165" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">Django 3.1.5</text>
  <text x="440" y="185" text-anchor="middle" font-size="11" fill="#666">...</text>
  <!-- Separator -->
  <line x1="300" y1="80" x2="300" y2="210" stroke="#dc3545" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="300" y="240" text-anchor="middle" font-size="12" fill="#dc3545" font-weight="bold">Completely isolated - no conflicts!</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="375" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Python Environment Architecture</text>
  <!-- System Python -->
  <rect x="30" y="55" width="690" height="90" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="375" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">System Python (/usr/bin/python3)</text>
  <text x="100" y="105" text-anchor="middle" font-size="11" fill="#555">/usr/lib/python3.x/</text>
  <text x="300" y="105" text-anchor="middle" font-size="11" fill="#555">Standard Library</text>
  <text x="520" y="105" text-anchor="middle" font-size="11" fill="#555">dist-packages/</text>
  <text x="375" y="130" text-anchor="middle" font-size="10" fill="#dc3545">Do NOT install packages here - breaks OS tools!</text>
  <!-- pyenv / version managers -->
  <rect x="30" y="170" width="690" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="375" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Version Manager (pyenv / asdf / conda)</text>
  <text x="100" y="220" text-anchor="middle" font-size="11" fill="#555">Python 3.10</text>
  <text x="250" y="220" text-anchor="middle" font-size="11" fill="#555">Python 3.11</text>
  <text x="400" y="220" text-anchor="middle" font-size="11" fill="#555">Python 3.12</text>
  <text x="580" y="220" text-anchor="middle" font-size="11" fill="#555">~/.pyenv/versions/</text>
  <!-- Arrows to venvs -->
  <line x1="250" y1="240" x2="200" y2="275" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="240" x2="400" y2="275" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="240" x2="600" y2="275" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Virtual Environments -->
  <rect x="30" y="280" width="200" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="130" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Project A venv</text>
  <text x="40" y="325" font-size="10" fill="#555">requests==2.28</text>
  <text x="40" y="340" font-size="10" fill="#555">flask==2.2</text>
  <text x="40" y="355" font-size="10" fill="#555">Python 3.11</text>
  <text x="40" y="370" font-size="9" fill="#28a745">./venv/</text>
  <rect x="270" y="280" width="200" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="370" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Project B venv</text>
  <text x="280" y="325" font-size="10" fill="#555">requests==2.31</text>
  <text x="280" y="340" font-size="10" fill="#555">django==4.2</text>
  <text x="280" y="355" font-size="10" fill="#555">Python 3.11</text>
  <text x="280" y="370" font-size="9" fill="#28a745">./venv/</text>
  <rect x="510" y="280" width="200" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="610" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Project C venv</text>
  <text x="520" y="325" font-size="10" fill="#555">numpy==1.26</text>
  <text x="520" y="340" font-size="10" fill="#555">pandas==2.1</text>
  <text x="520" y="355" font-size="10" fill="#555">Python 3.12</text>
  <text x="520" y="370" font-size="9" fill="#28a745">./venv/</text>
  <!-- Tools -->
  <rect x="30" y="410" width="690" height="75" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Package &amp; Environment Tools</text>
  <text x="100" y="460" text-anchor="middle" font-size="11" fill="#555">pip</text>
  <text x="200" y="460" text-anchor="middle" font-size="11" fill="#555">venv</text>
  <text x="300" y="460" text-anchor="middle" font-size="11" fill="#555">poetry</text>
  <text x="400" y="460" text-anchor="middle" font-size="11" fill="#555">pipenv</text>
  <text x="500" y="460" text-anchor="middle" font-size="11" fill="#555">conda</text>
  <text x="600" y="460" text-anchor="middle" font-size="11" fill="#555">uv</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="77.5" y="72.2223" width="525" height="225.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="77.5" y="72.2223" width="525" height="35.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="339.9999" y="95.5833" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)">Without Virtual Env</text>
  <rect x="100" y="120.5556" width="480" height="32.2223" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="339.9999" y="141.5" text-anchor="middle" font-size="13.9044" fill="var(--text)">Global site-packages/</text>
  <text x="100" y="176.9444" font-size="13.0354" fill="var(--text-muted)">Project A needs: requests==2.28</text>
  <text x="100" y="199.5" font-size="13.0354" fill="var(--text-muted)">Project B needs: requests==2.31</text>
  <text x="100" y="228.5" font-size="13.0354" font-weight="bold" fill="var(--danger-accent)">CONFLICT! Only one version installed</text>
  <text x="100" y="249.4444" font-size="13.0354" fill="var(--danger-accent)">pip install overwrites previous version</text>
  <text x="100" y="270.3889" font-size="13.0354" fill="var(--danger-accent)">One project breaks!</text>
  <rect x="677.4999" y="72.2223" width="525" height="225.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="677.4999" y="72.2223" width="525" height="35.4444" rx="6" fill="var(--ok-accent)" />
  <text x="939.9999" y="95.5833" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)">With Virtual Env</text>
  <rect x="696.25" y="123.7777" width="225" height="64.4444" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="808.75" y="148.75" text-anchor="middle" font-size="13.0354" font-weight="bold" fill="var(--text)">Project A venv/</text>
  <text x="808.75" y="168.8889" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">requests==2.28</text>
  <rect x="958.75" y="123.7777" width="225" height="64.4444" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="1071.25" y="148.75" text-anchor="middle" font-size="13.0354" font-weight="bold" fill="var(--text)">Project B venv/</text>
  <text x="1071.25" y="168.8889" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">requests==2.31</text>
  <text x="696.25" y="217.2223" font-size="13.0354" font-weight="bold" fill="var(--ok-accent)">No conflicts! Each project isolated</text>
  <text x="696.25" y="238.1667" font-size="13.0354" fill="var(--text-muted)">Different versions coexist peacefully</text>
  <text x="696.25" y="259.1111" font-size="13.0354" fill="var(--text-muted)">Reproducible environments</text>
  <rect x="77.5" y="330" width="1125" height="217.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="77.5" y="330" width="1125" height="35.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="353.3611" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--bg)">Virtual Environment Structure  (python -m venv myenv)</text>
  <rect x="100" y="381.5556" width="243.75" height="54.7777" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="221.8749" y="404.1111" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--text)">myenv/bin/</text>
  <text x="221.8749" y="423.4444" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">python, pip, activate</text>
  <rect x="373.7499" y="381.5556" width="243.75" height="54.7777" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="495.625" y="404.1111" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--text)">myenv/lib/</text>
  <text x="495.625" y="423.4444" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">site-packages/</text>
  <rect x="647.5" y="381.5556" width="243.75" height="54.7777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="769.375" y="404.1111" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--text)">myenv/include/</text>
  <text x="769.375" y="423.4444" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">C headers</text>
  <rect x="921.25" y="381.5556" width="243.75" height="54.7777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1043.125" y="404.1111" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--text)">pyvenv.cfg</text>
  <text x="1043.125" y="423.4444" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">home, version</text>
  <text x="100" y="466.9444" font-size="13.0354" fill="var(--text-muted)">Activate:  source myenv/bin/activate</text>
  <text x="100" y="487.8889" font-size="13.0354" fill="var(--text-muted)">Deactivate:  deactivate</text>
  <text x="100" y="508.8333" font-size="13.0354" fill="var(--text-muted)">PATH is modified: myenv/bin prepended, so its python/pip are found first</text>
  <text x="100" y="529.7777" font-size="13.0354" fill="var(--text-muted)">The venv python is a symlink to the base interpreter (not a full copy)</text>
</svg>
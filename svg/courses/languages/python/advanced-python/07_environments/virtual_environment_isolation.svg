<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="17.0667" markerHeight="10.5" refX="17.0667" refY="5.25" orient="auto">
      <polygon points="0,15 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Virtual Environment Isolation</text>
  <rect x="51.2" y="82.5" width="546.1333" height="285" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="3" />
  <text x="324.2667" y="120" text-anchor="middle" font-size="21" font-weight="bold" fill="#dc3545">Without Virtual Env</text>
  <rect x="85.3333" y="142.5" width="477.8667" height="52.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="324.2667" y="175.5" text-anchor="middle" font-size="16.5" fill="#333">Global site-packages/</text>
  <text x="102.4" y="225" font-size="15" fill="#555">Project A needs: requests==2.28</text>
  <text x="102.4" y="252" font-size="15" fill="#555">Project B needs: requests==2.31</text>
  <text x="102.4" y="285" font-size="15" fill="#dc3545" font-weight="bold">CONFLICT! Only one version installed</text>
  <text x="102.4" y="315" font-size="15" fill="#dc3545">pip install overwrites previous</text>
  <text x="102.4" y="345" font-size="15" fill="#dc3545">One project breaks</text>
  <rect x="665.6" y="82.5" width="563.2" height="285" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="947.2" y="120" text-anchor="middle" font-size="21" font-weight="bold" fill="#28a745">With Virtual Env</text>
  <rect x="699.7333" y="142.5" width="230.4" height="82.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="814.08" y="172.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Project A venv/</text>
  <text x="814.08" y="202.5" text-anchor="middle" font-size="15" fill="#555">requests==2.28</text>
  <rect x="955.7333" y="142.5" width="230.4" height="82.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="1070.08" y="172.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Project B venv/</text>
  <text x="1070.08" y="202.5" text-anchor="middle" font-size="15" fill="#555">requests==2.31</text>
  <text x="699.7333" y="262.5" font-size="15" fill="#28a745" font-weight="bold">No conflicts! Each project isolated</text>
  <text x="699.7333" y="292.5" font-size="15" fill="#555">Different versions coexist</text>
  <text x="699.7333" y="322.5" font-size="15" fill="#555">Reproducible environments</text>
  <rect x="51.2" y="405" width="1177.6" height="285" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="442.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#333">Virtual Environment Structure (python -m venv myenv)</text>
  <rect x="85.3333" y="465" width="256" height="67.5" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="213.3333" y="495" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#333">myenv/bin/</text>
  <text x="213.3333" y="520.5" text-anchor="middle" font-size="15" fill="#555">python, pip, activate</text>
  <rect x="375.4667" y="465" width="256" height="67.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="503.4667" y="495" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#333">myenv/lib/</text>
  <text x="503.4667" y="520.5" text-anchor="middle" font-size="15" fill="#555">site-packages/</text>
  <rect x="665.6" y="465" width="256" height="67.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="793.6" y="495" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#333">myenv/include/</text>
  <text x="793.6" y="520.5" text-anchor="middle" font-size="15" fill="#555">C headers</text>
  <rect x="955.7333" y="465" width="256" height="67.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="1083.7333" y="495" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#333">pyvenv.cfg</text>
  <text x="1083.7333" y="520.5" text-anchor="middle" font-size="15" fill="#555">home, version</text>
  <text x="85.3333" y="577.5" font-size="16.5" fill="#555">Activate: source myenv/bin/activate</text>
  <text x="85.3333" y="607.5" font-size="16.5" fill="#555">Deactivate: deactivate</text>
  <text x="85.3333" y="637.5" font-size="16.5" fill="#555">PATH is modified: myenv/bin prepended, so its python/pip are found first</text>
  <text x="85.3333" y="667.5" font-size="16.5" fill="#555">The venv python is a symlink to the base interpreter (not a full copy)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="375" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Virtual Environment Isolation</text>
  <!-- Without venv -->
  <rect x="30" y="55" width="320" height="190" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="190" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Without Virtual Env</text>
  <rect x="50" y="95" width="280" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="190" y="117" text-anchor="middle" font-size="11" fill="#333">Global site-packages/</text>
  <text x="60" y="150" font-size="10" fill="#555">Project A needs: requests==2.28</text>
  <text x="60" y="168" font-size="10" fill="#555">Project B needs: requests==2.31</text>
  <text x="60" y="190" font-size="10" fill="#dc3545" font-weight="bold">CONFLICT! Only one version installed</text>
  <text x="60" y="210" font-size="10" fill="#dc3545">pip install overwrites previous</text>
  <text x="60" y="230" font-size="10" fill="#dc3545">One project breaks</text>
  <!-- With venv -->
  <rect x="390" y="55" width="330" height="190" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="555" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">With Virtual Env</text>
  <rect x="410" y="95" width="135" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="477" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Project A venv/</text>
  <text x="477" y="135" text-anchor="middle" font-size="9" fill="#555">requests==2.28</text>
  <rect x="560" y="95" width="135" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="627" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Project B venv/</text>
  <text x="627" y="135" text-anchor="middle" font-size="9" fill="#555">requests==2.31</text>
  <text x="410" y="175" font-size="10" fill="#28a745" font-weight="bold">No conflicts! Each project isolated</text>
  <text x="410" y="195" font-size="10" fill="#555">Different versions coexist</text>
  <text x="410" y="215" font-size="10" fill="#555">Reproducible environments</text>
  <!-- Venv structure -->
  <rect x="30" y="270" width="690" height="190" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Virtual Environment Structure (python -m venv myenv)</text>
  <rect x="50" y="310" width="150" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="125" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">myenv/bin/</text>
  <text x="125" y="347" text-anchor="middle" font-size="9" fill="#555">python, pip, activate</text>
  <rect x="220" y="310" width="150" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="295" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">myenv/lib/</text>
  <text x="295" y="347" text-anchor="middle" font-size="9" fill="#555">site-packages/</text>
  <rect x="390" y="310" width="150" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="465" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">myenv/include/</text>
  <text x="465" y="347" text-anchor="middle" font-size="9" fill="#555">C headers</text>
  <rect x="560" y="310" width="150" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="635" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">pyvenv.cfg</text>
  <text x="635" y="347" text-anchor="middle" font-size="9" fill="#555">home, version</text>
  <text x="50" y="385" font-size="11" fill="#555">Activate: source myenv/bin/activate</text>
  <text x="50" y="405" font-size="11" fill="#555">Deactivate: deactivate</text>
  <text x="50" y="425" font-size="11" fill="#555">PATH is modified: myenv/bin prepended, so its python/pip are found first</text>
  <text x="50" y="445" font-size="11" fill="#555">The venv python is a symlink to the base interpreter (not a full copy)</text>
</svg>
  <ns0:rect x="35.5556" y="35.5556" width="497.7778" height="39.1111" rx="7.1111" fill="#e53935" />
  <ns0:text x="284.4444" y="61.3333" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#ffffff">Without Virtual Env</ns0:text>
  <ns0:rect x="56.8889" y="88.8889" width="455.1111" height="35.5556" rx="3.5556" fill="#ffcdd2" stroke="#e53935" stroke-width="0.8889" />
  <ns0:text x="284.4444" y="112" text-anchor="middle" font-size="14.2222" fill="#333333">Global site-packages/</ns0:text>
  <ns0:text x="56.8889" y="151.1111" font-size="13.3333" fill="#555555">Project A needs: requests==2.28</ns0:text>
  <ns0:text x="56.8889" y="176" font-size="13.3333" fill="#555555">Project B needs: requests==2.31</ns0:text>
  <ns0:text x="56.8889" y="208" font-size="13.3333" font-weight="bold" fill="#c62828">CONFLICT! Only one version installed</ns0:text>
  <ns0:text x="56.8889" y="231.1111" font-size="13.3333" fill="#c62828">pip install overwrites previous version</ns0:text>
  <ns0:text x="56.8889" y="254.2222" font-size="13.3333" fill="#c62828">One project breaks!</ns0:text>
  <ns0:rect x="604.4444" y="35.5556" width="497.7778" height="248.8889" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="604.4444" y="35.5556" width="497.7778" height="39.1111" rx="7.1111" fill="#2e7d32" />
  <ns0:text x="853.3333" y="61.3333" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#ffffff">With Virtual Env</ns0:text>
  <ns0:rect x="622.2222" y="92.4444" width="213.3333" height="71.1111" rx="5.3333" fill="#ffffff" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="728.8889" y="120" text-anchor="middle" font-size="13.3333" font-weight="bold" fill="#333333">Project A venv/</ns0:text>
  <ns0:text x="728.8889" y="142.2222" text-anchor="middle" font-size="12.4444" fill="#555555">requests==2.28</ns0:text>
  <ns0:rect x="871.1111" y="92.4444" width="213.3333" height="71.1111" rx="5.3333" fill="#ffffff" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="977.7778" y="120" text-anchor="middle" font-size="13.3333" font-weight="bold" fill="#333333">Project B venv/</ns0:text>
  <ns0:text x="977.7778" y="142.2222" text-anchor="middle" font-size="12.4444" fill="#555555">requests==2.31</ns0:text>
  <ns0:text x="622.2222" y="195.5556" font-size="13.3333" font-weight="bold" fill="#2e7d32">No conflicts! Each project isolated</ns0:text>
  <ns0:text x="622.2222" y="218.6667" font-size="13.3333" fill="#555555">Different versions coexist peacefully</ns0:text>
  <ns0:text x="622.2222" y="241.7778" font-size="13.3333" fill="#555555">Reproducible environments</ns0:text>
  <ns0:rect x="35.5556" y="320" width="1066.6667" height="240" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="35.5556" y="320" width="1066.6667" height="39.1111" rx="7.1111" fill="url(#grad-accent)" />
  <ns0:text x="568.8889" y="345.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Virtual Environment Structure  (python -m venv myenv)</ns0:text>
  <ns0:rect x="56.8889" y="376.8889" width="231.1111" height="60.4444" rx="5.3333" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3333" />
  <ns0:text x="172.4444" y="401.7778" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="#333333">myenv/bin/</ns0:text>
  <ns0:text x="172.4444" y="423.1111" text-anchor="middle" font-size="12.4444" fill="#555555">python, pip, activate</ns0:text>
  <ns0:rect x="316.4444" y="376.8889" width="231.1111" height="60.4444" rx="5.3333" fill="#fff9c4" stroke="#f9a825" stroke-width="1.3333" />
  <ns0:text x="432" y="401.7778" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="#333333">myenv/lib/</ns0:text>
  <ns0:text x="432" y="423.1111" text-anchor="middle" font-size="12.4444" fill="#555555">site-packages/</ns0:text>
  <ns0:rect x="576" y="376.8889" width="231.1111" height="60.4444" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="691.5556" y="401.7778" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="#333333">myenv/include/</ns0:text>
  <ns0:text x="691.5556" y="423.1111" text-anchor="middle" font-size="12.4444" fill="#555555">C headers</ns0:text>
  <ns0:rect x="835.5556" y="376.8889" width="231.1111" height="60.4444" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="951.1111" y="401.7778" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="#333333">pyvenv.cfg</ns0:text>
  <ns0:text x="951.1111" y="423.1111" text-anchor="middle" font-size="12.4444" fill="#555555">home, version</ns0:text>
  <ns0:text x="56.8889" y="471.1111" font-size="13.3333" fill="#555555">Activate:  source myenv/bin/activate</ns0:text>
  <ns0:text x="56.8889" y="494.2222" font-size="13.3333" fill="#555555">Deactivate:  deactivate</ns0:text>
  <ns0:text x="56.8889" y="517.3333" font-size="13.3333" fill="#555555">PATH is modified: myenv/bin prepended, so its python/pip are found first</ns0:text>
  <ns0:text x="56.8889" y="540.4444" font-size="13.3333" fill="#555555">The venv python is a symlink to the base interpreter (not a full copy)</ns0:text>
</ns0:svg>
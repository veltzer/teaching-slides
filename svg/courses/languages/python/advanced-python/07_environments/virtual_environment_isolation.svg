<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="560" height="275.254337" rx="6.845511" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="560" height="43.25419" rx="6.845511" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="319.999893" y="68.508344" text-anchor="middle" font-size="19.829849" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Without Virtual Env</text>
  <rect x="64" y="98.98302" width="512" height="39.322135" rx="6.845511" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="319.999893" y="124.542292" text-anchor="middle" font-size="15.863788" fill="var(--text)" font-family="Arial, sans-serif">Global site-packages/</text>
  <text x="64" y="167.796482" font-size="14.87233" fill="var(--text-muted)" font-family="Arial, sans-serif">Project A needs: requests==2.28</text>
  <text x="64" y="195.321964" font-size="14.87233" fill="var(--text-muted)" font-family="Arial, sans-serif">Project B needs: requests==2.31</text>
  <text x="64" y="230.711801" font-size="14.87233" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">CONFLICT! Only one version installed</text>
  <text x="64" y="256.271073" font-size="14.87233" fill="var(--danger-accent)" font-family="Arial, sans-serif">pip install overwrites previous version</text>
  <text x="64" y="281.830467" font-size="14.87233" fill="var(--danger-accent)" font-family="Arial, sans-serif">One project breaks!</text>
  <rect x="679.999893" y="40" width="560" height="275.254337" rx="6.845511" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="679.999893" y="40" width="560" height="43.25419" rx="6.845511" fill="var(--ok-accent)" />
  <text x="959.999893" y="68.508344" text-anchor="middle" font-size="19.829849" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">With Virtual Env</text>
  <rect x="700" y="102.915075" width="240" height="78.644026" rx="6.845511" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="820" y="133.389751" text-anchor="middle" font-size="14.87233" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Project A venv/</text>
  <text x="820" y="157.96604" text-anchor="middle" font-size="13.880757" fill="var(--text-muted)" font-family="Arial, sans-serif">requests==2.28</text>
  <rect x="980" y="102.915075" width="240" height="78.644026" rx="6.845511" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="1100" y="133.389751" text-anchor="middle" font-size="14.87233" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Project B venv/</text>
  <text x="1100" y="157.96604" text-anchor="middle" font-size="13.880757" fill="var(--text-muted)" font-family="Arial, sans-serif">requests==2.31</text>
  <text x="700" y="216.949181" font-size="14.87233" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">No conflicts! Each project isolated</text>
  <text x="700" y="242.508453" font-size="14.87233" fill="var(--text-muted)" font-family="Arial, sans-serif">Different versions coexist peacefully</text>
  <text x="700" y="268.067725" font-size="14.87233" fill="var(--text-muted)" font-family="Arial, sans-serif">Reproducible environments</text>
  <rect x="40" y="354.576228" width="1200" height="265.423772" rx="6.845511" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="354.576228" width="1200" height="43.25419" rx="6.845511" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="383.084693" text-anchor="middle" font-size="17.846818" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Virtual Environment Structure  (python -m venv myenv)</text>
  <rect x="64" y="417.491547" width="260" height="66.847374" rx="6.845511" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="193.999893" y="445.016907" text-anchor="middle" font-size="15.863788" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">myenv/bin/</text>
  <text x="193.999893" y="468.61009" text-anchor="middle" font-size="13.880757" fill="var(--text-muted)" font-family="Arial, sans-serif">python, pip, activate</text>
  <rect x="355.999893" y="417.491547" width="260" height="66.847374" rx="6.845511" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="486" y="445.016907" text-anchor="middle" font-size="15.863788" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">myenv/lib/</text>
  <text x="486" y="468.61009" text-anchor="middle" font-size="13.880757" fill="var(--text-muted)" font-family="Arial, sans-serif">site-packages/</text>
  <rect x="648" y="417.491547" width="260" height="66.847374" rx="6.845511" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="778" y="445.016907" text-anchor="middle" font-size="15.863788" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">myenv/include/</text>
  <text x="778" y="468.61009" text-anchor="middle" font-size="13.880757" fill="var(--text-muted)" font-family="Arial, sans-serif">C headers</text>
  <rect x="940" y="417.491547" width="260" height="66.847374" rx="6.845511" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="445.016907" text-anchor="middle" font-size="15.863788" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">pyvenv.cfg</text>
  <text x="1070" y="468.61009" text-anchor="middle" font-size="13.880757" fill="var(--text-muted)" font-family="Arial, sans-serif">home, version</text>
  <text x="64" y="521.694845" font-size="14.87233" fill="var(--text-muted)" font-family="Arial, sans-serif">Activate:  source myenv/bin/activate</text>
  <text x="64" y="547.254239" font-size="14.87233" fill="var(--text-muted)" font-family="Arial, sans-serif">Deactivate:  deactivate</text>
  <text x="64" y="572.813511" font-size="14.87233" fill="var(--text-muted)" font-family="Arial, sans-serif">PATH is modified: myenv/bin prepended, so its python/pip are found first</text>
  <text x="64" y="598.372783" font-size="14.87233" fill="var(--text-muted)" font-family="Arial, sans-serif">The venv python is a symlink to the base interpreter (not a full copy)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Without venv panel -->
  <rect x="40" y="40" width="560" height="280" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="560" height="44" rx="8" fill="#e53935"/>
  <text x="320" y="69" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Without Virtual Env</text>
  <rect x="64" y="100" width="512" height="40" rx="4" fill="#ffcdd2" stroke="#e53935" stroke-width="1"/>
  <text x="320" y="126" text-anchor="middle" font-size="16" fill="#333333">Global site-packages/</text>
  <text x="64" y="170" font-size="15" fill="#555555">Project A needs: requests==2.28</text>
  <text x="64" y="198" font-size="15" fill="#555555">Project B needs: requests==2.31</text>
  <text x="64" y="234" font-size="15" font-weight="bold" fill="#c62828">CONFLICT! Only one version installed</text>
  <text x="64" y="260" font-size="15" fill="#c62828">pip install overwrites previous version</text>
  <text x="64" y="286" font-size="15" fill="#c62828">One project breaks!</text>
  <!-- With venv panel -->
  <rect x="680" y="40" width="560" height="280" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <rect x="680" y="40" width="560" height="44" rx="8" fill="#2e7d32"/>
  <text x="960" y="69" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">With Virtual Env</text>
  <rect x="700" y="104" width="240" height="80" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="820" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Project A venv/</text>
  <text x="820" y="160" text-anchor="middle" font-size="14" fill="#555555">requests==2.28</text>
  <rect x="980" y="104" width="240" height="80" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1100" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Project B venv/</text>
  <text x="1100" y="160" text-anchor="middle" font-size="14" fill="#555555">requests==2.31</text>
  <text x="700" y="220" font-size="15" font-weight="bold" fill="#2e7d32">No conflicts! Each project isolated</text>
  <text x="700" y="246" font-size="15" fill="#555555">Different versions coexist peacefully</text>
  <text x="700" y="272" font-size="15" fill="#555555">Reproducible environments</text>
  <!-- Structure section -->
  <rect x="40" y="360" width="1200" height="270" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="360" width="1200" height="44" rx="8" fill="url(#grad-accent)"/>
  <text x="640" y="389" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Virtual Environment Structure  (python -m venv myenv)</text>
  <rect x="64" y="424" width="260" height="68" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="194" y="452" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">myenv/bin/</text>
  <text x="194" y="476" text-anchor="middle" font-size="14" fill="#555555">python, pip, activate</text>
  <rect x="356" y="424" width="260" height="68" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="486" y="452" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">myenv/lib/</text>
  <text x="486" y="476" text-anchor="middle" font-size="14" fill="#555555">site-packages/</text>
  <rect x="648" y="424" width="260" height="68" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="778" y="452" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">myenv/include/</text>
  <text x="778" y="476" text-anchor="middle" font-size="14" fill="#555555">C headers</text>
  <rect x="940" y="424" width="260" height="68" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1070" y="452" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">pyvenv.cfg</text>
  <text x="1070" y="476" text-anchor="middle" font-size="14" fill="#555555">home, version</text>
  <text x="64" y="530" font-size="15" fill="#555555">Activate:  source myenv/bin/activate</text>
  <text x="64" y="556" font-size="15" fill="#555555">Deactivate:  deactivate</text>
  <text x="64" y="582" font-size="15" fill="#555555">PATH is modified: myenv/bin prepended, so its python/pip are found first</text>
  <text x="64" y="608" font-size="15" fill="#555555">The venv python is a symlink to the base interpreter (not a full copy)</text>
</svg>

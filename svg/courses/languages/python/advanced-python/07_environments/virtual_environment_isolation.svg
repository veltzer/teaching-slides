<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <rect x="40" y="40" width="580" height="284.912280701754" rx="6.052402741669" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="80.701754385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--danger-text)">Without Virtual Env</text>
  <rect x="65" y="101.052631578947" width="530" height="40.701754385965" rx="6.052402741669" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="330" y="128.526315789474" text-anchor="middle" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--text)">Global site-packages/</text>
  <text x="65" y="177.368421052632" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--danger-text)">Project A: requests==2.28</text>
  <text x="65" y="207.894736842105" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--danger-text)">Project B: requests==2.31</text>
  <text x="65" y="248.59649122807" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--danger-text)">Conflict: one version only</text>
  <text x="65" y="279.122807017544" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--danger-text)">pip overwrites; one breaks</text>

  <rect x="660" y="40" width="580" height="284.912280701754" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="80.701754385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--ok-text)">With Virtual Env</text>
  <rect x="685" y="106.140350877193" width="250" height="81.40350877193" rx="6.052402741669" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="810" y="136.666666666667" text-anchor="middle" font-family="Courier New, monospace" font-size="14.122273063895" font-weight="bold" fill="var(--text)">Project A venv/</text>
  <text x="810" y="162.105263157895" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--text-muted)">requests==2.28</text>
  <rect x="965" y="106.140350877193" width="250" height="81.40350877193" rx="6.052402741669" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1090" y="136.666666666667" text-anchor="middle" font-family="Courier New, monospace" font-size="14.122273063895" font-weight="bold" fill="var(--text)">Project B venv/</text>
  <text x="1090" y="162.105263157895" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--text-muted)">requests==2.31</text>
  <text x="685" y="223.157894736842" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--ok-text)">Isolated per project</text>
  <text x="685" y="253.684210526316" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">Versions coexist</text>
  <text x="685" y="284.210526315789" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">Reproducible</text>

  <rect x="40" y="355.438596491228" width="1200" height="264.561403508772" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="391.052631578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--primary-text)">Structure: python -m venv myenv</text>

  <rect x="65" y="416.491228070175" width="260" height="71.228070175439" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195" y="444.982456140351" text-anchor="middle" font-family="Courier New, monospace" font-size="15.131006854174" font-weight="bold" fill="var(--ok-text)">myenv/bin/</text>
  <text x="195" y="469.40350877193" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--ok-text)">python, pip, activate</text>

  <rect x="355" y="416.491228070175" width="260" height="71.228070175439" rx="6.052402741669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="444.982456140351" text-anchor="middle" font-family="Courier New, monospace" font-size="15.131006854174" font-weight="bold" fill="var(--warn-text)">myenv/lib/</text>
  <text x="485" y="469.40350877193" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--warn-text)">site-packages/</text>

  <rect x="645" y="416.491228070175" width="260" height="71.228070175439" rx="6.052402741669" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="775" y="444.982456140351" text-anchor="middle" font-family="Courier New, monospace" font-size="15.131006854174" font-weight="bold" fill="var(--info-text)">myenv/include/</text>
  <text x="775" y="469.40350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--info-text)">C headers</text>

  <rect x="935" y="416.491228070175" width="260" height="71.228070175439" rx="6.052402741669" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065" y="444.982456140351" text-anchor="middle" font-family="Courier New, monospace" font-size="15.131006854174" font-weight="bold" fill="var(--danger-text)">pyvenv.cfg</text>
  <text x="1065" y="469.40350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">home, version</text>

  <text x="65" y="523.333333333333" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--primary-text)">source myenv/bin/activate</text>
  <text x="65" y="553.859649122807" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--primary-text)">deactivate</text>
  <text x="65" y="589.473684210526" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">PATH prepended; python/pip symlinks base interpreter</text>
</svg>

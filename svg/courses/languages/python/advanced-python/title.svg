<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Python snake body (stylized) -->
  <path d="M100,300 Q150,200 250,220 Q350,240 400,180 Q450,120 550,140 Q650,160 700,100" fill="none" stroke="#ffd93d" stroke-width="8" stroke-linecap="round"/>
  <path d="M100,320 Q150,220 250,240 Q350,260 400,200 Q450,140 550,160 Q650,180 700,120" fill="none" stroke="#53d8fb" stroke-width="8" stroke-linecap="round"/>
  <!-- Snake head -->
  <circle cx="700" cy="100" r="15" fill="#ffd93d"/>
  <circle cx="707" cy="95" r="3" fill="#1a1a2e"/>
  <!-- Advanced concepts icons -->
  <!-- Decorators @ -->
  <text x="100" y="100" font-family="monospace" font-size="36" fill="#e94560" font-weight="bold">@</text>
  <!-- Generator yield -->
  <rect x="180" y="60" width="110" height="35" rx="5" fill="#16213e" stroke="#00b894" stroke-width="1.5"/>
  <text x="195" y="83" font-family="monospace" font-size="14" fill="#00b894">yield</text>
  <!-- Async/await -->
  <rect x="320" y="40" width="120" height="35" rx="5" fill="#16213e" stroke="#53d8fb" stroke-width="1.5"/>
  <text x="335" y="63" font-family="monospace" font-size="14" fill="#53d8fb">async/await</text>
  <!-- Metaclass -->
  <rect x="480" y="60" width="130" height="35" rx="5" fill="#16213e" stroke="#e94560" stroke-width="1.5"/>
  <text x="495" y="83" font-family="monospace" font-size="14" fill="#e94560">metaclass</text>
  <!-- Threading symbol -->
  <line x1="150" y1="350" x2="150" y2="370" stroke="#53d8fb" stroke-width="2"/>
  <line x1="150" y1="350" x2="200" y2="340" stroke="#53d8fb" stroke-width="2"/>
  <line x1="150" y1="350" x2="200" y2="360" stroke="#53d8fb" stroke-width="2"/>
  <line x1="150" y1="350" x2="200" y2="380" stroke="#53d8fb" stroke-width="2"/>
  <circle cx="200" cy="340" r="4" fill="#53d8fb"/>
  <circle cx="200" cy="360" r="4" fill="#53d8fb"/>
  <circle cx="200" cy="380" r="4" fill="#53d8fb"/>
  <text x="215" y="365" font-family="monospace" font-size="11" fill="#53d8fb">threads</text>
  <!-- Context manager -->
  <rect x="350" y="330" width="140" height="40" rx="5" fill="#16213e" stroke="#ffd93d" stroke-width="1.5"/>
  <text x="365" y="350" font-family="monospace" font-size="11" fill="#ffd93d">with open(f)</text>
  <text x="380" y="365" font-family="monospace" font-size="11" fill="#ffd93d">as fp:</text>
  <!-- Type hints -->
  <rect x="550" y="330" width="180" height="40" rx="5" fill="#16213e" stroke="#00b894" stroke-width="1.5"/>
  <text x="565" y="355" font-family="monospace" font-size="12" fill="#00b894">def f(x: int) -&gt; str</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="731.4286" height="411.4286" fill="var(--code-bg)" rx="6"/>
  <path d="M 91.4286 308.5714 Q 137.1429 205.7143 228.5714 226.2857 Q 320 246.8571 365.7143 185.1429 Q 411.4286 123.4286 502.8571 144 Q 594.2857 164.5714 640 102.8571" fill="none" stroke="var(--warn-border)" stroke-width="7.3143" stroke-linecap="round" />
  <path d="M 91.4286 329.1429 Q 137.1429 226.2857 228.5714 246.8571 Q 320 267.4286 365.7143 205.7143 Q 411.4286 144 502.8571 164.5714 Q 594.2857 185.1429 640 123.4286" fill="none" stroke="var(--primary-border)" stroke-width="7.3143" stroke-linecap="round" />
  <circle cx="640" cy="102.8571" r="13.7143" fill="var(--warn-fill)" />
  <circle cx="646.4" cy="97.7143" r="2.7429" fill="var(--code-bg)" />
  <text x="91.4286" y="102.8571" font-family="monospace" font-size="32.9143" fill="var(--danger-accent)" font-weight="bold">@</text>
  <rect x="164.5714" y="61.7143" width="100.5714" height="36" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.3714" />
  <text x="178.2857" y="85.3714" font-family="monospace" font-size="12.8" fill="var(--ok-accent)">yield</text>
  <rect x="292.5714" y="41.1429" width="109.7143" height="36" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.3714" />
  <text x="306.2857" y="64.8" font-family="monospace" font-size="12.8" fill="var(--primary-accent)">async/await</text>
  <rect x="438.8571" y="61.7143" width="118.8571" height="36" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="1.3714" />
  <text x="452.5714" y="85.3714" font-family="monospace" font-size="12.8" fill="var(--danger-accent)">metaclass</text>
  <line x1="137.1429" y1="360" x2="137.1429" y2="380.5714" stroke="var(--primary-border)" stroke-width="1.8286" />
  <line x1="137.1429" y1="360" x2="182.8571" y2="349.7143" stroke="var(--primary-border)" stroke-width="1.8286" />
  <line x1="137.1429" y1="360" x2="182.8571" y2="370.2857" stroke="var(--primary-border)" stroke-width="1.8286" />
  <line x1="137.1429" y1="360" x2="182.8571" y2="390.8571" stroke="var(--primary-border)" stroke-width="1.8286" />
  <circle cx="182.8571" cy="349.7143" r="3.6571" fill="var(--primary-fill)" />
  <circle cx="182.8571" cy="370.2857" r="3.6571" fill="var(--primary-fill)" />
  <circle cx="182.8571" cy="390.8571" r="3.6571" fill="var(--primary-fill)" />
  <text x="196.5714" y="375.4286" font-family="monospace" font-size="10.0571" fill="var(--primary-accent)">threads</text>
  <rect x="320" y="339.4286" width="128" height="41.1429" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="1.3714" />
  <text x="333.7143" y="360" font-family="monospace" font-size="10.0571" fill="var(--warn-accent)">with open(f)</text>
  <text x="347.4286" y="375.4286" font-family="monospace" font-size="10.0571" fill="var(--warn-accent)">as fp:</text>
  <rect x="502.8571" y="339.4286" width="164.5714" height="41.1429" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.3714" />
  <text x="516.5714" y="365.1429" font-family="monospace" font-size="10.9714" fill="var(--ok-accent)">def f(x: int) -&gt; str</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="888.8889" height="500" fill="var(--code-bg)" rx="7.2917"/>
  <path d="M 306.6667 454.9999 Q 362.2223 330 473.3333 355 Q 584.4444 379.9999 640 305 Q 695.5556 230 806.6666 255 Q 917.7777 280 973.3333 204.9999" fill="none" stroke="var(--warn-border)" stroke-width="7.3143" stroke-linecap="round" />
  <path d="M 306.6667 480 Q 362.2223 355 473.3333 379.9999 Q 584.4444 405 640 330 Q 695.5556 255 806.6666 280 Q 917.7777 305 973.3333 230" fill="none" stroke="var(--primary-border)" stroke-width="7.3143" stroke-linecap="round" />
  <circle cx="973.3333" cy="204.9999" r="16.6667" fill="var(--warn-fill)" />
  <circle cx="981.1111" cy="198.75" r="3.3334" fill="var(--code-bg)" />
  <text x="306.6667" y="204.9999" font-family="monospace" font-size="40" fill="var(--danger-accent)" font-weight="bold">@</text>
  <rect x="395.5555" y="155" width="122.2222" height="43.75" rx="7.2917" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.3714" />
  <text x="412.2222" y="183.75" font-family="monospace" font-size="15.5556" fill="var(--ok-accent)">yield</text>
  <rect x="551.1111" y="130" width="133.3333" height="43.75" rx="7.2917" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.3714" />
  <text x="567.7777" y="158.75" font-family="monospace" font-size="15.5556" fill="var(--primary-accent)">async/await</text>
  <rect x="728.8888" y="155" width="144.4444" height="43.75" rx="7.2917" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="1.3714" />
  <text x="745.5555" y="183.75" font-family="monospace" font-size="15.5556" fill="var(--danger-accent)">metaclass</text>
  <line x1="362.2223" y1="517.5" x2="362.2223" y2="542.4999" stroke="var(--primary-border)" stroke-width="1.8286" />
  <line x1="362.2223" y1="517.5" x2="417.7777" y2="505" stroke="var(--primary-border)" stroke-width="1.8286" />
  <line x1="362.2223" y1="517.5" x2="417.7777" y2="530" stroke="var(--primary-border)" stroke-width="1.8286" />
  <line x1="362.2223" y1="517.5" x2="417.7777" y2="554.9999" stroke="var(--primary-border)" stroke-width="1.8286" />
  <circle cx="417.7777" cy="505" r="4.4444" fill="var(--primary-fill)" />
  <circle cx="417.7777" cy="530" r="4.4444" fill="var(--primary-fill)" />
  <circle cx="417.7777" cy="554.9999" r="4.4444" fill="var(--primary-fill)" />
  <text x="434.4444" y="536.25" font-family="monospace" font-size="12.2222" fill="var(--primary-accent)">threads</text>
  <rect x="584.4444" y="492.5" width="155.5555" height="50" rx="7.2917" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="1.3714" />
  <text x="601.1111" y="517.5" font-family="monospace" font-size="12.2222" fill="var(--warn-accent)">with open(f)</text>
  <text x="617.7778" y="536.25" font-family="monospace" font-size="12.2222" fill="var(--warn-accent)">as fp:</text>
  <rect x="806.6666" y="492.5" width="200" height="50" rx="7.2917" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.3714" />
  <text x="823.3333" y="523.75" font-family="monospace" font-size="13.3333" fill="var(--ok-accent)">def f(x: int) -&gt; str</text>
</svg>
  <line x1="26.6667" y1="99.5556" x2="26.6667" y2="131.5556" stroke="var(--text-muted)" stroke-width="1.6" />
  <line x1="26.6667" y1="131.5556" x2="177.7778" y2="131.5556" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="186.6667" y="136.8889" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">Distribution name</text>
  <line x1="195.5556" y1="99.5556" x2="195.5556" y2="156.4444" stroke="var(--text-muted)" stroke-width="1.6" />
  <line x1="195.5556" y1="156.4444" x2="275.5556" y2="156.4444" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="284.4444" y="161.7778" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">Version</text>
  <line x1="284.4444" y1="99.5556" x2="284.4444" y2="183.1111" stroke="var(--text-muted)" stroke-width="1.6" />
  <line x1="284.4444" y1="183.1111" x2="346.6667" y2="183.1111" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="355.5556" y="188.4444" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">Python tag (CPython 3.9)</text>
  <line x1="346.6667" y1="99.5556" x2="346.6667" y2="209.7778" stroke="var(--text-muted)" stroke-width="1.6" />
  <line x1="346.6667" y1="209.7778" x2="408.8889" y2="209.7778" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="417.7778" y="215.1111" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">ABI tag</text>
  <line x1="408.8889" y1="99.5556" x2="408.8889" y2="236.4444" stroke="var(--text-muted)" stroke-width="1.6" />
  <line x1="408.8889" y1="236.4444" x2="586.6667" y2="236.4444" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="595.5556" y="241.7778" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">Python implementation</text>
  <line x1="604.4444" y1="99.5556" x2="604.4444" y2="263.1111" stroke="var(--text-muted)" stroke-width="1.6" />
  <line x1="604.4444" y1="263.1111" x2="782.2222" y2="263.1111" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="791.1111" y="268.4444" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">Platform</text>
  <text x="26.6667" y="337.7778" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Internal Structure:</text>
  <rect x="26.6667" y="355.5556" width="515.5556" height="222.2222" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="44.4444" y="400" font-size="17.7778" fill="var(--text)" font-family="monospace">mypackage/</text>
  <text x="44.4444" y="435.5556" font-size="17.7778" fill="var(--text)" font-family="monospace">mypackage-0.1.0.dist-info/</text>
  <text x="62.2222" y="469.3333" font-size="16" fill="var(--text-muted)" font-family="monospace">  ├── METADATA</text>
  <text x="62.2222" y="499.5556" font-size="16" fill="var(--text-muted)" font-family="monospace">  ├── WHEEL</text>
  <text x="62.2222" y="529.7778" font-size="16" fill="var(--text-muted)" font-family="monospace">  ├── RECORD</text>
  <text x="62.2222" y="560" font-size="16" fill="var(--text-muted)" font-family="monospace">  └── entry_points.txt</text>
</svg>
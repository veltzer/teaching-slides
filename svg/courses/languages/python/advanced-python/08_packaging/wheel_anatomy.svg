<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="68.125" y="80.2777" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Wheel Filename Anatomy:</text>
  <text x="68.125" y="120.5556" font-size="20.8566" fill="var(--text)" font-family="monospace">mypackage-0.1.0-cp39-cp39-linux_x86_64.whl</text>
  <line x1="68.125" y1="130.2223" x2="68.125" y2="159.2223" stroke="var(--text-muted)" stroke-width="1.6" />
  <line x1="68.125" y1="159.2223" x2="227.5" y2="159.2223" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="236.875" y="164.0556" font-size="15.6425" fill="var(--text-muted)" font-family="Arial, sans-serif">Distribution name</text>
  <line x1="246.25" y1="130.2223" x2="246.25" y2="181.7777" stroke="var(--text-muted)" stroke-width="1.6" />
  <line x1="246.25" y1="181.7777" x2="330.625" y2="181.7777" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="339.9999" y="186.6111" font-size="15.6425" fill="var(--text-muted)" font-family="Arial, sans-serif">Version</text>
  <line x1="339.9999" y1="130.2223" x2="339.9999" y2="205.9444" stroke="var(--text-muted)" stroke-width="1.6" />
  <line x1="339.9999" y1="205.9444" x2="405.625" y2="205.9444" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="415" y="210.7777" font-size="15.6425" fill="var(--text-muted)" font-family="Arial, sans-serif">Python tag (CPython 3.9)</text>
  <line x1="405.625" y1="130.2223" x2="405.625" y2="230.1111" stroke="var(--text-muted)" stroke-width="1.6" />
  <line x1="405.625" y1="230.1111" x2="471.25" y2="230.1111" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="480.625" y="234.9444" font-size="15.6425" fill="var(--text-muted)" font-family="Arial, sans-serif">ABI tag</text>
  <line x1="471.25" y1="130.2223" x2="471.25" y2="254.2777" stroke="var(--text-muted)" stroke-width="1.6" />
  <line x1="471.25" y1="254.2777" x2="658.75" y2="254.2777" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="668.125" y="259.1111" font-size="15.6425" fill="var(--text-muted)" font-family="Arial, sans-serif">Python implementation</text>
  <line x1="677.4999" y1="130.2223" x2="677.4999" y2="278.4444" stroke="var(--text-muted)" stroke-width="1.6" />
  <line x1="677.4999" y1="278.4444" x2="865" y2="278.4444" stroke="var(--text-muted)" stroke-width="1.6" />
  <text x="874.375" y="283.2777" font-size="15.6425" fill="var(--text-muted)" font-family="Arial, sans-serif">Platform</text>
  <text x="68.125" y="346.1111" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Internal Structure:</text>
  <rect x="68.125" y="362.2223" width="543.75" height="201.3889" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="86.875" y="402.5" font-size="17.3806" fill="var(--text)" font-family="monospace">mypackage/</text>
  <text x="86.875" y="434.7223" font-size="17.3806" fill="var(--text)" font-family="monospace">mypackage-0.1.0.dist-info/</text>
  <text x="105.625" y="465.3333" font-size="15.6425" fill="var(--text-muted)" font-family="monospace">  ├── METADATA</text>
  <text x="105.625" y="492.7223" font-size="15.6425" fill="var(--text-muted)" font-family="monospace">  ├── WHEEL</text>
  <text x="105.625" y="520.1111" font-size="15.6425" fill="var(--text-muted)" font-family="monospace">  ├── RECORD</text>
  <text x="105.625" y="547.5" font-size="15.6425" fill="var(--text-muted)" font-family="monospace">  └── entry_points.txt</text>
</svg>
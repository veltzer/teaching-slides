<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="25.550676" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Wheel Filename Anatomy:</text>
  <text x="40" y="88.333463" font-size="27.873392" fill="var(--text)" font-family="Courier New, monospace">mypackage-0.1.0-cp39-cp39-linux_x86_64.whl</text>
  <line x1="40" y1="99.933499" x2="40" y2="134.733487" stroke="var(--text-muted)" stroke-width="1.6"/>
  <line x1="40" y1="134.733487" x2="277.209302" y2="134.733487" stroke="var(--text-muted)" stroke-width="1.6"/>
  <text x="291.162791" y="140.533445" font-size="20.905111" fill="var(--text-muted)" font-family="Arial, sans-serif">Distribution name</text>
  <line x1="305.116279" y1="99.933499" x2="305.116279" y2="161.799958" stroke="var(--text-muted)" stroke-width="1.6"/>
  <line x1="305.116279" y1="161.799958" x2="430.697674" y2="161.799958" stroke="var(--text-muted)" stroke-width="1.6"/>
  <text x="444.651014" y="167.600036" font-size="20.905111" fill="var(--text-muted)" font-family="Arial, sans-serif">Version</text>
  <line x1="444.651014" y1="99.933499" x2="444.651014" y2="190.799988" stroke="var(--text-muted)" stroke-width="1.6"/>
  <line x1="444.651014" y1="190.799988" x2="542.325581" y2="190.799988" stroke="var(--text-muted)" stroke-width="1.6"/>
  <text x="556.27907" y="196.599946" font-size="20.905111" fill="var(--text-muted)" font-family="Arial, sans-serif">Python tag (CPython 3.9)</text>
  <line x1="542.325581" y1="99.933499" x2="542.325581" y2="219.800018" stroke="var(--text-muted)" stroke-width="1.6"/>
  <line x1="542.325581" y1="219.800018" x2="640" y2="219.800018" stroke="var(--text-muted)" stroke-width="1.6"/>
  <text x="653.953488" y="225.599976" font-size="20.905111" fill="var(--text-muted)" font-family="Arial, sans-serif">ABI tag</text>
  <line x1="640" y1="99.933499" x2="640" y2="248.799928" stroke="var(--text-muted)" stroke-width="1.6"/>
  <line x1="640" y1="248.799928" x2="919.069767" y2="248.799928" stroke="var(--text-muted)" stroke-width="1.6"/>
  <text x="933.023256" y="254.600006" font-size="20.905111" fill="var(--text-muted)" font-family="Arial, sans-serif">Python implementation</text>
  <line x1="946.976595" y1="99.933499" x2="946.976595" y2="277.799958" stroke="var(--text-muted)" stroke-width="1.6"/>
  <line x1="946.976595" y1="277.799958" x2="1226.046512" y2="277.799958" stroke="var(--text-muted)" stroke-width="1.6"/>
  <text x="1240" y="283.599916" font-size="20.905111" fill="var(--text-muted)" font-family="Arial, sans-serif">Platform</text>
  <text x="40" y="358.99997" font-size="25.550676" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Internal Structure:</text>
  <rect x="40" y="378.333403" width="809.302326" height="241.666597" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.018582"/>
  <text x="67.906977" y="426.666627" font-size="23.22796" fill="var(--text)" font-family="Courier New, monospace">mypackage/</text>
  <text x="67.906977" y="465.333373" font-size="23.22796" fill="var(--text)" font-family="Courier New, monospace">mypackage-0.1.0.dist-info/</text>
  <text x="95.813953" y="502.066561" font-size="20.905111" fill="var(--text-muted)" font-family="Courier New, monospace">  ├── METADATA</text>
  <text x="95.813953" y="534.933349" font-size="20.905111" fill="var(--text-muted)" font-family="Courier New, monospace">  ├── WHEEL</text>
  <text x="95.813953" y="567.799898" font-size="20.905111" fill="var(--text-muted)" font-family="Courier New, monospace">  ├── RECORD</text>
  <text x="95.813953" y="600.666567" font-size="20.905111" fill="var(--text-muted)" font-family="Courier New, monospace">  └── entry_points.txt</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
  </defs>
  <!-- Level 4: OS -->
  <rect x="40" y="40" width="1200" height="132.280702" rx="6.796726" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="92.912281" font-family="Arial, sans-serif" font-size="22.971009" font-weight="bold" fill="var(--bg)" text-anchor="middle">Level 1: Operating System</text>
  <text x="640" y="129.54386" font-family="Arial, sans-serif" font-size="16.70624" fill="var(--info-accent)" text-anchor="middle">Raw virtual memory pages allocated to the Python process via malloc/free system calls</text>
  <text x="125.714286" y="151.929825" font-family="monospace" font-size="14.617946" fill="var(--info-accent)">mmap, VirtualAlloc, brk</text>

  <!-- Arrow down -->
  <line x1="640" y1="172.280702" x2="640" y2="202.807018" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 3: Python Memory Manager -->
  <rect x="104.285714" y="202.807018" width="1071.428571" height="132.280702" rx="6.796726" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="255.719298" font-family="Arial, sans-serif" font-size="22.971009" font-weight="bold" fill="var(--bg)" text-anchor="middle">Level 2: Python Memory Manager</text>
  <text x="640" y="292.350877" font-family="Arial, sans-serif" font-size="16.70624" fill="var(--primary-accent)" text-anchor="middle">Manages large memory pools (arenas) obtained from the OS — allocates and frees 256KB arenas</text>
  <text x="190" y="314.736842" font-family="monospace" font-size="14.617946" fill="var(--primary-accent)">pymalloc, arenas (256KB), pools (4KB)</text>

  <!-- Arrow down -->
  <line x1="640" y1="335.087719" x2="640" y2="365.614035" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 2: Object Allocator -->
  <rect x="168.571429" y="365.614035" width="942.857143" height="132.280702" rx="6.796726" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="418.526316" font-family="Arial, sans-serif" font-size="22.971009" font-weight="bold" fill="var(--bg)" text-anchor="middle">Level 3: Object-Specific Allocator</text>
  <text x="640" y="455.157895" font-family="Arial, sans-serif" font-size="16.70624" fill="var(--warn-accent)" text-anchor="middle">Handles allocation of specific Python types: integers, strings, lists, dicts, tuples</text>
  <text x="254.285714" y="477.54386" font-family="monospace" font-size="14.617946" fill="var(--warn-accent)">PyObject_New, PyMem_Malloc, type-specific free lists</text>

  <!-- Arrow down -->
  <line x1="640" y1="497.894737" x2="640" y2="528.421053" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 1: Garbage Collector -->
  <rect x="232.857143" y="528.421053" width="814.285714" height="91.578947" rx="6.796726" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="571.157895" font-family="Arial, sans-serif" font-size="20.882828" font-weight="bold" fill="var(--bg)" text-anchor="middle">Level 4: Garbage Collector (GC)</text>
  <text x="640" y="597.614035" font-family="Arial, sans-serif" font-size="14.617946" fill="var(--ok-accent)" text-anchor="middle">Cyclic GC — detects unreachable reference cycles</text>
  <text x="640" y="613.894737" font-family="monospace" font-size="13.573855" fill="var(--ok-accent)" text-anchor="middle">gc module, generational collection (3 generations)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#e53935" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="246.25" y="87.125" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Step 1: Two References</text>
  <rect x="171.25" y="103.4375" width="159.375" height="108.75" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250.9375" y="130.625" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--bg)" text-anchor="middle" font-weight="bold">PyObject</text>
  <line x1="171.25" y1="139.6875" x2="330.625" y2="139.6875" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="250.9375" y="159.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">type: list</text>
  <rect x="185.3125" y="171.4063" width="121.875" height="27.1875" rx="6" fill="var(--primary-accent)" />
  <text x="246.25" y="189.5313" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--bg)" text-anchor="middle" font-weight="bold">refcount = 2</text>
  <rect x="68.125" y="157.8125" width="75" height="36.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="105.625" y="180.4688" font-family="monospace" font-size="12.9043" fill="var(--primary-accent)" text-anchor="middle">x</text>
  <line x1="143.125" y1="175.9375" x2="171.25" y2="171.4063" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="68.125" y="216.7187" width="75" height="36.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="105.625" y="239.375" font-family="monospace" font-size="12.9043" fill="var(--primary-accent)" text-anchor="middle">y</text>
  <line x1="143.125" y1="234.8437" x2="171.25" y2="198.5938" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="250.9375" y="230.3125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">x = [1,2,3]</text>
  <text x="250.9375" y="246.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">y = x</text>
  <text x="640" y="87.125" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Step 2: One Reference</text>
  <rect x="560.3125" y="103.4375" width="159.375" height="108.75" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="130.625" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--bg)" text-anchor="middle" font-weight="bold">PyObject</text>
  <line x1="560.3125" y1="139.6875" x2="719.6874" y2="139.6875" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="640" y="159.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">type: list</text>
  <rect x="574.375" y="171.4063" width="121.875" height="27.1875" rx="6" fill="var(--primary-accent)" />
  <text x="635.3124" y="189.5313" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--bg)" text-anchor="middle" font-weight="bold">refcount = 1</text>
  <rect x="457.1875" y="157.8125" width="75" height="36.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="494.6875" y="180.4688" font-family="monospace" font-size="12.9043" fill="var(--primary-accent)" text-anchor="middle">x</text>
  <line x1="532.1875" y1="175.9375" x2="560.3125" y2="171.4063" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="457.1875" y="216.7187" width="75" height="36.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="3.5556 2.6667" filter="url(#shadow)" />
  <text x="494.6875" y="239.375" font-family="monospace" font-size="12.9043" fill="var(--text-faint)" text-anchor="middle">y=None</text>
  <text x="640" y="230.3125" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">del y  (or y = None)</text>
  <text x="640" y="246.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">refcount decremented</text>
  <text x="1033.75" y="87.125" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Step 3: Freed!</text>
  <rect x="954.0625" y="103.4375" width="159.375" height="108.75" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1033.75" y="130.625" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--bg)" text-anchor="middle" font-weight="bold">PyObject</text>
  <line x1="954.0625" y1="139.6875" x2="1113.4375" y2="139.6875" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="1033.75" y="159.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--danger-accent)" text-anchor="middle">type: list</text>
  <rect x="968.125" y="171.4063" width="121.875" height="27.1875" rx="6" fill="var(--danger-accent)" />
  <text x="1029.0625" y="189.5313" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--bg)" text-anchor="middle" font-weight="bold">refcount = 0</text>
  <text x="1033.75" y="234.8437" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Memory Deallocated</text>
  <text x="1033.75" y="254.7813" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">Immediately freed — no GC needed</text>
  <line x1="339.9999" y1="157.8125" x2="443.125" y2="157.8125" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="391.5625" y="150.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">del y</text>
  <line x1="733.75" y1="157.8125" x2="935.3125" y2="157.8125" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="835" y="150.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)" text-anchor="middle">del x</text>
  <line x1="115" y1="293.75" x2="1165" y2="293.75" stroke="var(--border)" stroke-width="1.3333" />
  <text x="640" y="325.4687" font-family="Arial, sans-serif" font-size="17.5131" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Tracking Reference Counts with sys.getrefcount()</text>
  <rect x="133.75" y="343.5938" width="450" height="145" rx="6" fill="var(--code-bg)" filter="url(#shadow)" />
  <text x="358.75" y="368.0625" font-family="monospace" font-size="12.9043" fill="var(--primary-accent)">import sys</text>
  <text x="358.75" y="388" font-family="monospace" font-size="12.9043" fill="var(--bg)">x = [1, 2, 3]</text>
  <text x="358.75" y="407.9375" font-family="monospace" font-size="12.9043" fill="var(--ok-accent)">print(sys.getrefcount(x) - 1)  </text>
  <text x="358.75" y="427.8749" font-family="monospace" font-size="12.9043" fill="var(--bg)">y = x</text>
  <text x="358.75" y="447.8125" font-family="monospace" font-size="12.9043" fill="var(--ok-accent)">print(sys.getrefcount(x) - 1)  </text>
  <text x="358.75" y="467.75" font-family="monospace" font-size="12.9043" fill="var(--ok-accent)"># -1 because getrefcount itself adds 1</text>
  <rect x="640" y="343.5938" width="506.25" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="893.125" y="370.7812" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Key Properties</text>
  <text x="668.125" y="395.2499" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--text)">•  Refcount stored in PyObject header (ob_refcnt)</text>
  <text x="668.125" y="416.0938" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--text)">•  Incremented: assignment, function args, containers</text>
  <text x="668.125" y="436.9375" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--text)">•  Decremented: del, reassignment, scope exit</text>
  <text x="668.125" y="457.7813" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--text)">•  At 0: __del__ called, memory returned to allocator</text>
  <text x="668.125" y="478.625" font-family="Arial, sans-serif" font-size="12.9043" fill="var(--danger-accent)">•  Cannot detect cycles — that needs the cyclic GC</text>
  <text x="640" y="520.3125" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">The Cycle Problem — Refcounting Alone is Not Enough</text>
  <rect x="443.125" y="534.8125" width="121.875" height="54.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="504.0625" y="556.5625" font-family="monospace" font-size="12.9043" fill="var(--primary-accent)" text-anchor="middle">dict A</text>
  <text x="504.0625" y="572.875" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">refcount=1</text>
  <rect x="715" y="534.8125" width="121.875" height="54.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="775.9375" y="556.5625" font-family="monospace" font-size="12.9043" fill="var(--primary-accent)" text-anchor="middle">dict B</text>
  <text x="775.9375" y="572.875" font-family="monospace" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">refcount=1</text>
  <path d="M 565 554.75 Q 640 520.3125 715 554.75" fill="none" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <path d="M 715 574.6874 Q 640 606.4063 565 574.6874" fill="none" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="640" y="605.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">After del a, del b: both still refcount=1 — cyclic GC needed</text>
</svg>
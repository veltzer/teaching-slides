<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#e53935" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
  </defs>
  <text x="234.871795" y="40" font-family="Arial, sans-serif" font-size="18.340355" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Step 1: Two References</text>
  <rect x="152.820513" y="58.219894" width="174.358974" height="121.465957" rx="6.63248" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="88.586383" font-family="Arial, sans-serif" font-size="14.264586" fill="var(--bg)" text-anchor="middle" font-weight="bold">PyObject</text>
  <line x1="152.820513" y1="98.708546" x2="327.179487" y2="98.708546" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="240" y="120.977305" font-family="Arial, sans-serif" font-size="13.245837" fill="var(--primary-accent)" text-anchor="middle">type: list</text>
  <rect x="168.205128" y="134.136172" width="133.333333" height="30.366489" rx="6.63248" fill="var(--primary-accent)" />
  <text x="234.871795" y="154.380499" font-family="Arial, sans-serif" font-size="14.264586" fill="var(--bg)" text-anchor="middle" font-weight="bold">refcount = 2</text>
  <rect x="40" y="118.952872" width="82.051282" height="40.488652" rx="6.63248" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="81.025641" y="144.258336" font-size="14.264586" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">x</text>
  <line x1="122.051282" y1="139.197198" x2="152.820513" y2="134.136172" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="40" y="184.746876" width="82.051282" height="40.488652" rx="6.63248" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="81.025641" y="210.05234" font-size="14.264586" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">y</text>
  <line x1="122.051282" y1="204.991202" x2="152.820513" y2="164.502662" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="240" y="199.930177" font-family="Arial, sans-serif" font-size="13.245837" fill="var(--text-muted)" text-anchor="middle">x = [1,2,3]</text>
  <text x="240" y="218.15007" font-family="Arial, sans-serif" font-size="13.245837" fill="var(--text-muted)" text-anchor="middle">y = x</text>
  <text x="665.641026" y="40" font-family="Arial, sans-serif" font-size="18.340355" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Step 2: One Reference</text>
  <rect x="578.461538" y="58.219894" width="174.358974" height="121.465957" rx="6.63248" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="665.641026" y="88.586383" font-family="Arial, sans-serif" font-size="14.264586" fill="var(--bg)" text-anchor="middle" font-weight="bold">PyObject</text>
  <line x1="578.461538" y1="98.708546" x2="752.820403" y2="98.708546" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="665.641026" y="120.977305" font-family="Arial, sans-serif" font-size="13.245837" fill="var(--primary-accent)" text-anchor="middle">type: list</text>
  <rect x="593.846154" y="134.136172" width="133.333333" height="30.366489" rx="6.63248" fill="var(--primary-accent)" />
  <text x="660.512711" y="154.380499" font-family="Arial, sans-serif" font-size="14.264586" fill="var(--bg)" text-anchor="middle" font-weight="bold">refcount = 1</text>
  <rect x="465.641026" y="118.952872" width="82.051282" height="40.488652" rx="6.63248" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="506.666667" y="144.258336" font-size="14.264586" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">x</text>
  <line x1="547.692308" y1="139.197198" x2="578.461538" y2="134.136172" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="465.641026" y="184.746876" width="82.051282" height="40.488652" rx="6.63248" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="3.5556 2.6667" />
  <text x="506.666667" y="210.05234" font-size="14.264586" fill="var(--text-faint)" text-anchor="middle" font-family="Courier New, monospace">y=None</text>
  <text x="665.641026" y="199.930177" font-family="Arial, sans-serif" font-size="13.245837" fill="var(--text-muted)" text-anchor="middle">del y  (or y = None)</text>
  <text x="665.641026" y="218.15007" font-family="Arial, sans-serif" font-size="13.245837" fill="var(--text-muted)" text-anchor="middle">refcount decremented</text>
  <text x="1096.410256" y="40" font-family="Arial, sans-serif" font-size="18.340355" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Step 3: Freed!</text>
  <rect x="1009.230769" y="58.219894" width="174.358974" height="121.465957" rx="6.63248" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1096.410256" y="88.586383" font-family="Arial, sans-serif" font-size="14.264586" fill="var(--bg)" text-anchor="middle" font-weight="bold">PyObject</text>
  <line x1="1009.230769" y1="98.708546" x2="1183.589744" y2="98.708546" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="1096.410256" y="120.977305" font-family="Arial, sans-serif" font-size="13.245837" fill="var(--danger-accent)" text-anchor="middle">type: list</text>
  <rect x="1024.615385" y="134.136172" width="133.333333" height="30.366489" rx="6.63248" fill="var(--danger-accent)" />
  <text x="1091.282051" y="154.380499" font-family="Arial, sans-serif" font-size="14.264586" fill="var(--bg)" text-anchor="middle" font-weight="bold">refcount = 0</text>
  <text x="1096.410256" y="204.991202" font-family="Arial, sans-serif" font-size="15.283556" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Memory Deallocated</text>
  <text x="1096.410256" y="227.260073" font-family="Arial, sans-serif" font-size="13.245837" fill="var(--text-muted)" text-anchor="middle">Immediately freed — no GC needed</text>
  <line x1="337.435788" y1="118.952872" x2="450.25641" y2="118.952872" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="393.846154" y="110.855142" font-family="Arial, sans-serif" font-size="12.226867" fill="var(--text-muted)" text-anchor="middle">del y</text>
  <line x1="768.205128" y1="118.952872" x2="988.717949" y2="118.952872" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="878.974359" y="110.855142" font-family="Arial, sans-serif" font-size="12.226867" fill="var(--text-muted)" text-anchor="middle">del x</text>
  <line x1="91.282051" y1="270.785318" x2="1240" y2="270.785318" stroke="var(--border)" stroke-width="1.3333" />
  <text x="665.641026" y="306.212833" font-family="Arial, sans-serif" font-size="19.359215" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Tracking Reference Counts with sys.getrefcount()</text>
  <rect x="111.794872" y="326.457271" width="492.307692" height="161.954609" rx="6.63248" fill="var(--code-bg)" />
  <text x="357.948718" y="353.787055" font-size="14.264586" fill="var(--primary-accent)" font-family="Courier New, monospace">import sys</text>
  <text x="357.948718" y="376.055814" font-size="14.264586" fill="var(--bg)" font-family="Courier New, monospace">x = [1, 2, 3]</text>
  <text x="357.948718" y="398.324573" font-size="14.264586" fill="var(--ok-accent)" font-family="Courier New, monospace">print(sys.getrefcount(x) - 1)  </text>
  <text x="357.948718" y="420.59322" font-size="14.264586" fill="var(--bg)" font-family="Courier New, monospace">y = x</text>
  <text x="357.948718" y="442.86209" font-size="14.264586" fill="var(--ok-accent)" font-family="Courier New, monospace">print(sys.getrefcount(x) - 1)  </text>
  <text x="357.948718" y="465.130849" font-size="14.264586" fill="var(--ok-accent)" font-family="Courier New, monospace"># -1 because getrefcount itself adds 1</text>
  <rect x="665.641026" y="326.457271" width="553.846154" height="161.954609" rx="6.63248" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="942.564103" y="356.823648" font-family="Arial, sans-serif" font-size="16.302526" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Key Properties</text>
  <text x="696.410256" y="384.153433" font-family="Arial, sans-serif" font-size="14.264586" fill="var(--text)">•  Refcount stored in PyObject header (ob_refcnt)</text>
  <text x="696.410256" y="407.434575" font-family="Arial, sans-serif" font-size="14.264586" fill="var(--text)">•  Incremented: assignment, function args, containers</text>
  <text x="696.410256" y="430.715495" font-family="Arial, sans-serif" font-size="14.264586" fill="var(--text)">•  Decremented: del, reassignment, scope exit</text>
  <text x="696.410256" y="453.996526" font-family="Arial, sans-serif" font-size="14.264586" fill="var(--text)">•  At 0: __del__ called, memory returned to allocator</text>
  <text x="696.410256" y="477.277445" font-family="Arial, sans-serif" font-size="14.264586" fill="var(--danger-accent)">•  Cannot detect cycles — that needs the cyclic GC</text>
  <text x="665.641026" y="523.839395" font-family="Arial, sans-serif" font-size="16.302526" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">The Cycle Problem — Refcounting Alone is Not Enough</text>
  <rect x="450.25641" y="540.034856" width="133.333333" height="60.732978" rx="6.63248" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="516.923077" y="564.328047" font-size="14.264586" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">dict A</text>
  <text x="516.923077" y="582.547941" font-size="13.245837" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">refcount=1</text>
  <rect x="747.692308" y="540.034856" width="133.333333" height="60.732978" rx="6.63248" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="814.358974" y="564.328047" font-size="14.264586" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">dict B</text>
  <text x="814.358974" y="582.547941" font-size="13.245837" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">refcount=1</text>
  <path d="M 583.589744 562.303615 Q 665.641026 523.839395 747.692308 562.303615" fill="none" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <path d="M 747.692308 584.572262 Q 665.641026 620 583.589744 584.572262" fill="none" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="665.641026" y="618.987728" font-family="Arial, sans-serif" font-size="13.245837" fill="var(--text-muted)" text-anchor="middle">After del a, del b: both still refcount=1 — cyclic GC needed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- PHASE 1: refcount=2 -->
  <text x="220" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0" text-anchor="middle">Step 1: Two References</text>

  <!-- Object box -->
  <rect x="140" y="70" width="170" height="120" rx="10" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="225" y="100" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">PyObject</text>
  <line x1="140" y1="110" x2="310" y2="110" stroke="#90caf9" stroke-width="1"/>
  <text x="225" y="132" font-family="Arial, sans-serif" font-size="13" fill="#bbdefb" text-anchor="middle">type: list</text>
  <rect x="155" y="145" width="130" height="30" rx="5" fill="#0d47a1"/>
  <text x="220" y="165" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">refcount = 2</text>

  <!-- var x -->
  <rect x="30" y="130" width="80" height="40" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="155" font-family="monospace" font-size="14" fill="#1565c0" text-anchor="middle">x</text>
  <line x1="110" y1="150" x2="140" y2="145" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <!-- var y -->
  <rect x="30" y="195" width="80" height="40" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="220" font-family="monospace" font-size="14" fill="#1565c0" text-anchor="middle">y</text>
  <line x1="110" y1="215" x2="140" y2="175" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <text x="225" y="210" font-family="Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle">x = [1,2,3]</text>
  <text x="225" y="228" font-family="Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle">y = x</text>

  <!-- PHASE 2: refcount=1 -->
  <text x="640" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0" text-anchor="middle">Step 2: One Reference</text>

  <rect x="555" y="70" width="170" height="120" rx="10" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="100" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">PyObject</text>
  <line x1="555" y1="110" x2="725" y2="110" stroke="#90caf9" stroke-width="1"/>
  <text x="640" y="132" font-family="Arial, sans-serif" font-size="13" fill="#bbdefb" text-anchor="middle">type: list</text>
  <rect x="570" y="145" width="130" height="30" rx="5" fill="#0d47a1"/>
  <text x="635" y="165" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">refcount = 1</text>

  <rect x="445" y="130" width="80" height="40" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="155" font-family="monospace" font-size="14" fill="#1565c0" text-anchor="middle">x</text>
  <line x1="525" y1="150" x2="555" y2="145" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <!-- y = None crossed out -->
  <rect x="445" y="195" width="80" height="40" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="2" stroke-dasharray="4,3" filter="url(#shadow)"/>
  <text x="485" y="220" font-family="monospace" font-size="14" fill="#aaa" text-anchor="middle">y=None</text>

  <text x="640" y="210" font-family="Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle">del y  (or y = None)</text>
  <text x="640" y="228" font-family="Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle">refcount decremented</text>

  <!-- PHASE 3: refcount=0 → freed -->
  <text x="1060" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c62828" text-anchor="middle">Step 3: Freed!</text>

  <rect x="975" y="70" width="170" height="120" rx="10" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="1060" y="100" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">PyObject</text>
  <line x1="975" y1="110" x2="1145" y2="110" stroke="#ef9a9a" stroke-width="1"/>
  <text x="1060" y="132" font-family="Arial, sans-serif" font-size="13" fill="#ffcdd2" text-anchor="middle">type: list</text>
  <rect x="990" y="145" width="130" height="30" rx="5" fill="#b71c1c"/>
  <text x="1055" y="165" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">refcount = 0</text>

  <text x="1060" y="215" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">Memory Deallocated</text>
  <text x="1060" y="237" font-family="Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle">Immediately freed — no GC needed</text>

  <!-- Arrows between phases -->
  <line x1="320" y1="130" x2="430" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="122" font-family="Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">del y</text>
  <line x1="740" y1="130" x2="955" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="848" y="122" font-family="Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">del x</text>

  <!-- Divider -->
  <line x1="80" y1="280" x2="1200" y2="280" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- sys.getrefcount explanation -->
  <text x="640" y="315" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1565c0" text-anchor="middle">Tracking Reference Counts with sys.getrefcount()</text>

  <!-- Code box -->
  <rect x="100" y="335" width="480" height="160" rx="10" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="340" y="362" font-family="monospace" font-size="14" fill="#90caf9">import sys</text>
  <text x="340" y="384" font-family="monospace" font-size="14" fill="#ffffff">x = [1, 2, 3]</text>
  <text x="340" y="406" font-family="monospace" font-size="14" fill="#a5d6a7">print(sys.getrefcount(x) - 1)  </text>
  <text x="340" y="428" font-family="monospace" font-size="14" fill="#ffffff">y = x</text>
  <text x="340" y="450" font-family="monospace" font-size="14" fill="#a5d6a7">print(sys.getrefcount(x) - 1)  </text>
  <text x="340" y="472" font-family="monospace" font-size="14" fill="#a5d6a7"># -1 because getrefcount itself adds 1</text>

  <!-- Key facts box -->
  <rect x="640" y="335" width="540" height="160" rx="10" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="910" y="365" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">Key Properties</text>
  <text x="670" y="392" font-family="Arial, sans-serif" font-size="14" fill="#333">&#x2022;  Refcount stored in PyObject header (ob_refcnt)</text>
  <text x="670" y="415" font-family="Arial, sans-serif" font-size="14" fill="#333">&#x2022;  Incremented: assignment, function args, containers</text>
  <text x="670" y="438" font-family="Arial, sans-serif" font-size="14" fill="#333">&#x2022;  Decremented: del, reassignment, scope exit</text>
  <text x="670" y="461" font-family="Arial, sans-serif" font-size="14" fill="#333">&#x2022;  At 0: __del__ called, memory returned to allocator</text>
  <text x="670" y="484" font-family="Arial, sans-serif" font-size="14" fill="#c62828">&#x2022;  Cannot detect cycles — that needs the cyclic GC</text>

  <!-- Cycle problem illustration -->
  <text x="640" y="530" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e65100" text-anchor="middle">The Cycle Problem — Refcounting Alone is Not Enough</text>

  <rect x="430" y="546" width="130" height="60" rx="8" fill="url(#grad-surface)" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="570" font-family="monospace" font-size="14" fill="#1565c0" text-anchor="middle">dict A</text>
  <text x="495" y="588" font-family="monospace" font-size="13" fill="#555" text-anchor="middle">refcount=1</text>

  <rect x="720" y="546" width="130" height="60" rx="8" fill="url(#grad-surface)" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="570" font-family="monospace" font-size="14" fill="#1565c0" text-anchor="middle">dict B</text>
  <text x="785" y="588" font-family="monospace" font-size="13" fill="#555" text-anchor="middle">refcount=1</text>

  <!-- Circular arrows -->
  <path d="M560,568 Q640,530 720,568" fill="none" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M720,590 Q640,625 560,590" fill="none" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="624" font-family="Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle">After del a, del b: both still refcount=1 — cyclic GC needed</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#e53935" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935" />
    </marker>
  </defs>
  <rect width="1137.7778" height="568.8889" fill="var(--bg)" rx="6"/>
  <text x="195.5556" y="46.2222" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Step 1: Two References</text>
  <rect x="124.4444" y="62.2222" width="151.1111" height="106.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200" y="88.8889" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--bg)" text-anchor="middle" font-weight="bold">PyObject</text>
  <line x1="124.4444" y1="97.7778" x2="275.5556" y2="97.7778" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="200" y="117.3333" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--primary-accent)" text-anchor="middle">type: list</text>
  <rect x="137.7778" y="128.8889" width="115.5556" height="26.6667" rx="6" fill="var(--primary-accent)" />
  <text x="195.5556" y="146.6667" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--bg)" text-anchor="middle" font-weight="bold">refcount = 2</text>
  <rect x="26.6667" y="115.5556" width="71.1111" height="35.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="62.2222" y="137.7778" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)" text-anchor="middle">x</text>
  <line x1="97.7778" y1="133.3333" x2="124.4444" y2="128.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="26.6667" y="173.3333" width="71.1111" height="35.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="62.2222" y="195.5556" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)" text-anchor="middle">y</text>
  <line x1="97.7778" y1="191.1111" x2="124.4444" y2="155.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="200" y="186.6667" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">x = [1,2,3]</text>
  <text x="200" y="202.6667" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">y = x</text>
  <text x="568.8889" y="46.2222" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Step 2: One Reference</text>
  <rect x="493.3333" y="62.2222" width="151.1111" height="106.6667" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="88.8889" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--bg)" text-anchor="middle" font-weight="bold">PyObject</text>
  <line x1="493.3333" y1="97.7778" x2="644.4444" y2="97.7778" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="568.8889" y="117.3333" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--primary-accent)" text-anchor="middle">type: list</text>
  <rect x="506.6667" y="128.8889" width="115.5556" height="26.6667" rx="6" fill="var(--primary-accent)" />
  <text x="564.4444" y="146.6667" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--bg)" text-anchor="middle" font-weight="bold">refcount = 1</text>
  <rect x="395.5556" y="115.5556" width="71.1111" height="35.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="431.1111" y="137.7778" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)" text-anchor="middle">x</text>
  <line x1="466.6667" y1="133.3333" x2="493.3333" y2="128.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="395.5556" y="173.3333" width="71.1111" height="35.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="3.5556 2.6667" filter="url(#shadow)" />
  <text x="431.1111" y="195.5556" font-family="monospace" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">y=None</text>
  <text x="568.8889" y="186.6667" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">del y  (or y = None)</text>
  <text x="568.8889" y="202.6667" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">refcount decremented</text>
  <text x="942.2222" y="46.2222" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Step 3: Freed!</text>
  <rect x="866.6667" y="62.2222" width="151.1111" height="106.6667" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="942.2222" y="88.8889" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--bg)" text-anchor="middle" font-weight="bold">PyObject</text>
  <line x1="866.6667" y1="97.7778" x2="1017.7778" y2="97.7778" stroke="var(--warn-border)" stroke-width="0.8889" />
  <text x="942.2222" y="117.3333" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--danger-accent)" text-anchor="middle">type: list</text>
  <rect x="880" y="128.8889" width="115.5556" height="26.6667" rx="6" fill="var(--danger-accent)" />
  <text x="937.7778" y="146.6667" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--bg)" text-anchor="middle" font-weight="bold">refcount = 0</text>
  <text x="942.2222" y="191.1111" font-family="Arial, sans-serif" font-size="13.3333" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Memory Deallocated</text>
  <text x="942.2222" y="210.6667" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">Immediately freed — no GC needed</text>
  <line x1="284.4444" y1="115.5556" x2="382.2222" y2="115.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="333.3333" y="108.4444" font-family="Arial, sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">del y</text>
  <line x1="657.7778" y1="115.5556" x2="848.8889" y2="115.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="753.7778" y="108.4444" font-family="Arial, sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">del x</text>
  <line x1="71.1111" y1="248.8889" x2="1066.6667" y2="248.8889" stroke="var(--border)" stroke-width="1.3333" />
  <text x="568.8889" y="280" font-family="Arial, sans-serif" font-size="16.8889" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Tracking Reference Counts with sys.getrefcount()</text>
  <rect x="88.8889" y="297.7778" width="426.6667" height="142.2222" rx="6" fill="var(--code-bg)" filter="url(#shadow)" />
  <text x="302.2222" y="321.7778" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">import sys</text>
  <text x="302.2222" y="341.3333" font-family="monospace" font-size="12.4444" fill="var(--bg)">x = [1, 2, 3]</text>
  <text x="302.2222" y="360.8889" font-family="monospace" font-size="12.4444" fill="var(--ok-accent)">print(sys.getrefcount(x) - 1)  </text>
  <text x="302.2222" y="380.4444" font-family="monospace" font-size="12.4444" fill="var(--bg)">y = x</text>
  <text x="302.2222" y="400" font-family="monospace" font-size="12.4444" fill="var(--ok-accent)">print(sys.getrefcount(x) - 1)  </text>
  <text x="302.2222" y="419.5556" font-family="monospace" font-size="12.4444" fill="var(--ok-accent)"># -1 because getrefcount itself adds 1</text>
  <rect x="568.8889" y="297.7778" width="480" height="142.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="808.8889" y="324.4444" font-family="Arial, sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Key Properties</text>
  <text x="595.5556" y="348.4444" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--text)">•  Refcount stored in PyObject header (ob_refcnt)</text>
  <text x="595.5556" y="368.8889" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--text)">•  Incremented: assignment, function args, containers</text>
  <text x="595.5556" y="389.3333" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--text)">•  Decremented: del, reassignment, scope exit</text>
  <text x="595.5556" y="409.7778" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--text)">•  At 0: __del__ called, memory returned to allocator</text>
  <text x="595.5556" y="430.2222" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--danger-accent)">•  Cannot detect cycles — that needs the cyclic GC</text>
  <text x="568.8889" y="471.1111" font-family="Arial, sans-serif" font-size="14.2222" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">The Cycle Problem — Refcounting Alone is Not Enough</text>
  <rect x="382.2222" y="485.3333" width="115.5556" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="440" y="506.6667" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)" text-anchor="middle">dict A</text>
  <text x="440" y="522.6667" font-family="monospace" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">refcount=1</text>
  <rect x="640" y="485.3333" width="115.5556" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="697.7778" y="506.6667" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)" text-anchor="middle">dict B</text>
  <text x="697.7778" y="522.6667" font-family="monospace" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">refcount=1</text>
  <path d="M 497.7778 504.8889 Q 568.8889 471.1111 640 504.8889" fill="none" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <path d="M 640 524.4444 Q 568.8889 555.5556 497.7778 524.4444" fill="none" stroke="var(--warn-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="568.8889" y="554.6667" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--text-muted)" text-anchor="middle">After del a, del b: both still refcount=1 — cyclic GC needed</text>
</svg>
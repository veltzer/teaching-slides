<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="52" fill="url(#grad-accent)"/>
  <text x="640" y="34" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Context Manager Protocol</text>

  <!-- Column headers -->
  <text x="320" y="82" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">Normal Execution Path</text>
  <text x="820" y="82" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b71c1c" text-anchor="middle">Exception Path</text>

  <!-- Divider line -->
  <line x1="600" y1="60" x2="600" y2="620" stroke="#dddddd" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- === NORMAL PATH (left side) === -->

  <!-- Step 1: with statement -->
  <rect x="80" y="98" width="220" height="46" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="190" y="120" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">with CM() as obj:</text>
  <text x="190" y="137" font-family="sans-serif" font-size="11" fill="#cce5ff" text-anchor="middle">evaluate expression</text>

  <!-- Arrow down -->
  <line x1="190" y1="144" x2="190" y2="174" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: __enter__ -->
  <rect x="80" y="174" width="220" height="46" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="196" font-family="monospace" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">__enter__(self)</text>
  <text x="190" y="213" font-family="sans-serif" font-size="11" fill="#555555" text-anchor="middle">returns value bound to 'as'</text>

  <!-- Arrow down -->
  <line x1="190" y1="220" x2="190" y2="250" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: body executes -->
  <rect x="80" y="250" width="220" height="46" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="190" y="272" font-family="monospace" font-size="14" fill="#1565c0" text-anchor="middle">body executes</text>
  <text x="190" y="289" font-family="sans-serif" font-size="11" fill="#555555" text-anchor="middle">with obj as ctx: ...</text>

  <!-- Arrow down -->
  <line x1="190" y1="296" x2="190" y2="326" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: __exit__ normal -->
  <rect x="80" y="326" width="220" height="54" rx="8" fill="url(#grad-surface)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="348" font-family="monospace" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">__exit__(self,</text>
  <text x="190" y="364" font-family="monospace" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">  None, None, None)</text>
  <text x="190" y="375" font-family="sans-serif" font-size="10" fill="#555555" text-anchor="middle">exc_type=None → no exception</text>

  <!-- Arrow down -->
  <line x1="190" y1="380" x2="190" y2="410" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 5: Done -->
  <rect x="100" y="410" width="180" height="40" rx="20" fill="url(#grad-green)" filter="url(#shadow)"/>
  <text x="190" y="435" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Execution continues</text>

  <!-- === EXCEPTION PATH (right side) === -->

  <!-- Step 1: with statement -->
  <rect x="660" y="98" width="220" height="46" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="770" y="120" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">with CM() as obj:</text>
  <text x="770" y="137" font-family="sans-serif" font-size="11" fill="#cce5ff" text-anchor="middle">evaluate expression</text>

  <!-- Arrow down -->
  <line x1="770" y1="144" x2="770" y2="174" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: __enter__ -->
  <rect x="660" y="174" width="220" height="46" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="196" font-family="monospace" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">__enter__(self)</text>
  <text x="770" y="213" font-family="sans-serif" font-size="11" fill="#555555" text-anchor="middle">returns value bound to 'as'</text>

  <!-- Arrow down -->
  <line x1="770" y1="220" x2="770" y2="250" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: body raises -->
  <rect x="660" y="250" width="220" height="46" rx="8" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="770" y="272" font-family="monospace" font-size="14" fill="#b71c1c" text-anchor="middle">body raises Exception</text>
  <text x="770" y="289" font-family="sans-serif" font-size="11" fill="#555555" text-anchor="middle">exception propagates up</text>

  <!-- Arrow down -->
  <line x1="770" y1="296" x2="770" y2="326" stroke="#e53935" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Step 4: __exit__ with exc info -->
  <rect x="640" y="326" width="260" height="54" rx="8" fill="url(#grad-surface)" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="348" font-family="monospace" font-size="13" font-weight="bold" fill="#b71c1c" text-anchor="middle">__exit__(self,</text>
  <text x="770" y="364" font-family="monospace" font-size="12" font-weight="bold" fill="#b71c1c" text-anchor="middle">  type, value, traceback)</text>
  <text x="770" y="375" font-family="sans-serif" font-size="10" fill="#555555" text-anchor="middle">exc_type set → exception occurred</text>

  <!-- Decision diamond -->
  <polygon points="770,400 830,430 770,460 710,430" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="770" y="426" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">return</text>
  <text x="770" y="442" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">True?</text>

  <!-- Arrow: True → suppress -->
  <line x1="830" y1="430" x2="1010" y2="430" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="920" y="422" font-family="sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle">True</text>
  <rect x="1010" y="410" width="180" height="40" rx="20" fill="url(#grad-green)" filter="url(#shadow)"/>
  <text x="1100" y="435" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Exception suppressed</text>

  <!-- Arrow: False → re-raise -->
  <line x1="770" y1="460" x2="770" y2="490" stroke="#e53935" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="790" y="480" font-family="sans-serif" font-size="11" fill="#b71c1c">False</text>
  <rect x="670" y="490" width="200" height="40" rx="20" fill="url(#grad-red)" filter="url(#shadow)"/>
  <text x="770" y="515" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Exception re-raised</text>

  <!-- Bottom info box: __enter__ note -->
  <rect x="60" y="470" width="520" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="80" y="490" font-family="monospace" font-size="12" font-weight="bold" fill="#2e7d32">__enter__ return value → bound to 'as' variable</text>
  <text x="80" y="510" font-family="monospace" font-size="12" fill="#333333">with open('f.txt') as f:   # f = file.__enter__()</text>

  <!-- Method signatures box -->
  <rect x="60" y="536" width="520" height="68" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="80" y="556" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Protocol Methods:</text>
  <text x="80" y="574" font-family="monospace" font-size="11" fill="#333333">__enter__(self)  →  returns context value</text>
  <text x="80" y="592" font-family="monospace" font-size="11" fill="#333333">__exit__(self, exc_type, exc_val, exc_tb)  →  bool</text>
  <text x="80" y="610" font-family="monospace" font-size="11" fill="#333333">contextlib.contextmanager: yield splits enter/exit</text>

  <!-- Legend box -->
  <rect x="620" y="544" width="600" height="68" rx="6" fill="#f9f9f9" stroke="#aaaaaa" stroke-width="1"/>
  <text x="640" y="564" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333333">Custom context manager example:</text>
  <text x="640" y="582" font-family="monospace" font-size="11" fill="#1565c0">class Timer:</text>
  <text x="640" y="598" font-family="monospace" font-size="11" fill="#333333">    def __enter__(self): self.start=time.time(); return self</text>
  <text x="640" y="614" font-family="monospace" font-size="11" fill="#333333">    def __exit__(self, *exc): print(time.time()-self.start)</text>
</svg>

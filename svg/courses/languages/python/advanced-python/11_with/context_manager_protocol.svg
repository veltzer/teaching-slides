<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="52" fill="url(#grad-primary)"/>
  <text x="640" y="34" font-family="sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">Context Manager Protocol</text>

  <!-- Column headers -->
  <text x="320" y="82" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Normal Execution Path</text>
  <text x="820" y="82" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--danger-deep)" text-anchor="middle">Exception Path</text>

  <!-- Divider line -->
  <line x1="600" y1="60" x2="600" y2="620" stroke="var(--border-softer)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- === NORMAL PATH (left side) === -->

  <!-- Step 1: with statement -->
  <rect x="80" y="98" width="220" height="46" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="190" y="120" font-family="monospace" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">with CM() as obj:</text>
  <text x="190" y="137" font-family="sans-serif" font-size="11" fill="var(--primary-lt)" text-anchor="middle">evaluate expression</text>

  <!-- Arrow down -->
  <line x1="190" y1="144" x2="190" y2="174" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: __enter__ -->
  <rect x="80" y="174" width="220" height="46" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="196" font-family="monospace" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">__enter__(self)</text>
  <text x="190" y="213" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">returns value bound to 'as'</text>

  <!-- Arrow down -->
  <line x1="190" y1="220" x2="190" y2="250" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: body executes -->
  <rect x="80" y="250" width="220" height="46" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="190" y="272" font-family="monospace" font-size="14" fill="var(--primary-dk)" text-anchor="middle">body executes</text>
  <text x="190" y="289" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">with obj as ctx: ...</text>

  <!-- Arrow down -->
  <line x1="190" y1="296" x2="190" y2="326" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: __exit__ normal -->
  <rect x="80" y="326" width="220" height="54" rx="8" fill="url(#grad-surface)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="348" font-family="monospace" font-size="13" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">__exit__(self,</text>
  <text x="190" y="364" font-family="monospace" font-size="13" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">  None, None, None)</text>
  <text x="190" y="375" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">exc_type=None → no exception</text>

  <!-- Arrow down -->
  <line x1="190" y1="380" x2="190" y2="410" stroke="var(--ok-dk)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <!-- Step 5: Done -->
  <rect x="100" y="410" width="180" height="40" rx="20" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="190" y="435" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Execution continues</text>

  <!-- === EXCEPTION PATH (right side) === -->

  <!-- Step 1: with statement -->
  <rect x="660" y="98" width="220" height="46" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="770" y="120" font-family="monospace" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">with CM() as obj:</text>
  <text x="770" y="137" font-family="sans-serif" font-size="11" fill="var(--primary-lt)" text-anchor="middle">evaluate expression</text>

  <!-- Arrow down -->
  <line x1="770" y1="144" x2="770" y2="174" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: __enter__ -->
  <rect x="660" y="174" width="220" height="46" rx="8" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="196" font-family="monospace" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">__enter__(self)</text>
  <text x="770" y="213" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">returns value bound to 'as'</text>

  <!-- Arrow down -->
  <line x1="770" y1="220" x2="770" y2="250" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: body raises -->
  <rect x="660" y="250" width="220" height="46" rx="8" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="2"/>
  <text x="770" y="272" font-family="monospace" font-size="14" fill="var(--danger-deep)" text-anchor="middle">body raises Exception</text>
  <text x="770" y="289" font-family="sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">exception propagates up</text>

  <!-- Arrow down -->
  <line x1="770" y1="296" x2="770" y2="326" stroke="var(--danger)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <!-- Step 4: __exit__ with exc info -->
  <rect x="640" y="326" width="260" height="54" rx="8" fill="url(#grad-surface)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="348" font-family="monospace" font-size="13" font-weight="bold" fill="var(--danger-deep)" text-anchor="middle">__exit__(self,</text>
  <text x="770" y="364" font-family="monospace" font-size="12" font-weight="bold" fill="var(--danger-deep)" text-anchor="middle">  type, value, traceback)</text>
  <text x="770" y="375" font-family="sans-serif" font-size="10" fill="var(--text-muted)" text-anchor="middle">exc_type set → exception occurred</text>

  <!-- Decision diamond -->
  <polygon points="770,400 830,430 770,460 710,430" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="2"/>
  <text x="770" y="426" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">return</text>
  <text x="770" y="442" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">True?</text>

  <!-- Arrow: True → suppress -->
  <line x1="830" y1="430" x2="1010" y2="430" stroke="var(--ok-dk)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="920" y="422" font-family="sans-serif" font-size="11" fill="var(--ok-dk)" text-anchor="middle">True</text>
  <rect x="1010" y="410" width="180" height="40" rx="20" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="1100" y="435" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Exception suppressed</text>

  <!-- Arrow: False → re-raise -->
  <line x1="770" y1="460" x2="770" y2="490" stroke="var(--danger)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="790" y="480" font-family="sans-serif" font-size="11" fill="var(--danger-deep)">False</text>
  <rect x="670" y="490" width="200" height="40" rx="20" fill="url(#grad-danger)" filter="url(#shadow)"/>
  <text x="770" y="515" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Exception re-raised</text>

  <!-- Bottom info box: __enter__ note -->
  <rect x="60" y="470" width="520" height="50" rx="6" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="80" y="490" font-family="monospace" font-size="12" font-weight="bold" fill="var(--ok-dk)">__enter__ return value → bound to 'as' variable</text>
  <text x="80" y="510" font-family="monospace" font-size="12" fill="var(--text-dark)">with open('f.txt') as f:   # f = file.__enter__()</text>

  <!-- Method signatures box -->
  <rect x="60" y="536" width="520" height="68" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="80" y="556" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">Protocol Methods:</text>
  <text x="80" y="574" font-family="monospace" font-size="11" fill="var(--text-dark)">__enter__(self)  →  returns context value</text>
  <text x="80" y="592" font-family="monospace" font-size="11" fill="var(--text-dark)">__exit__(self, exc_type, exc_val, exc_tb)  →  bool</text>
  <text x="80" y="610" font-family="monospace" font-size="11" fill="var(--text-dark)">contextlib.contextmanager: yield splits enter/exit</text>

  <!-- Legend box -->
  <rect x="620" y="544" width="600" height="68" rx="6" fill="var(--surface-light)" stroke="var(--text-placeholder)" stroke-width="1"/>
  <text x="640" y="564" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--text-dark)">Custom context manager example:</text>
  <text x="640" y="582" font-family="monospace" font-size="11" fill="var(--primary-dk)">class Timer:</text>
  <text x="640" y="598" font-family="monospace" font-size="11" fill="var(--text-dark)">    def __enter__(self): self.start=time.time(); return self</text>
  <text x="640" y="614" font-family="monospace" font-size="11" fill="var(--text-dark)">    def __exit__(self, *exc): print(time.time()-self.start)</text>
</svg>

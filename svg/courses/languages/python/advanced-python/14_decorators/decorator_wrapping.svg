<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--text)">How @decorator works</text>

  <rect x="40" y="71.071428571429" width="400" height="124.285714285714" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="96.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" font-weight="bold" fill="var(--primary-text)">With @decorator</text>
  <text x="60" y="128.035714285714" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--primary-text)">@my_decorator</text>
  <text x="60" y="153.928571428571" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--primary-text)">def greet(name):</text>
  <text x="60" y="179.821428571429" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--primary-text)">    return hi</text>

  <rect x="40" y="216.071428571429" width="400" height="124.285714285714" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" font-weight="bold" fill="var(--warn-text)">Equivalent</text>
  <text x="60" y="273.035714285714" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--warn-text)">def greet(name):</text>
  <text x="60" y="298.928571428571" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--warn-text)">    return hi</text>
  <text x="60" y="324.821428571429" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--warn-text)">greet = my_decorator(greet)</text>

  <rect x="40" y="361.071428571429" width="400" height="248.571428571429" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" font-weight="bold" fill="var(--ok-text)">Key Points</text>
  <text x="60" y="418.035714285714" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--ok-text)">applied at definition</text>
  <text x="60" y="449.107142857143" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--ok-text)">greet becomes wrapper</text>
  <text x="60" y="480.178571428571" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--ok-text)">functools.wraps keeps name</text>
  <text x="60" y="511.25" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--ok-text)">stacks bottom-up</text>
  <text x="60" y="542.321428571429" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--ok-text)">@A @B f becomes A(B(f))</text>

  <rect x="460" y="71.071428571429" width="380" height="414.285714285714" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="96.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" font-weight="bold" fill="var(--warn-text)">Factory Structure</text>

  <rect x="480" y="122.857142857143" width="340" height="331.428571428571" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="148.75" text-anchor="middle" font-family="Courier New, monospace" font-size="12.212405870379" font-weight="bold" fill="var(--primary-text)">decorator(func)</text>

  <rect x="500" y="169.464285714286" width="300" height="248.571428571429" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="195.357142857143" text-anchor="middle" font-family="Courier New, monospace" font-size="12.212405870379" font-weight="bold" fill="var(--ok-text)">wrapper</text>
  <text x="515" y="226.428571428571" font-family="Courier New, monospace" font-size="10.177004891982" fill="var(--ok-text)">before()</text>
  <text x="515" y="252.321428571429" font-family="Courier New, monospace" font-size="10.177004891982" fill="var(--ok-text)">r = func(args)</text>
  <text x="515" y="278.214285714286" font-family="Courier New, monospace" font-size="10.177004891982" fill="var(--ok-text)">after()</text>
  <text x="515" y="304.107142857143" font-family="Courier New, monospace" font-size="10.177004891982" fill="var(--ok-text)">return r</text>

  <rect x="870" y="71.071428571429" width="370" height="51.785714285714" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="102.142857142857" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" font-weight="bold" fill="var(--primary-text)">caller: greet("Alice")</text>
  <line x1="1055" y1="122.857142857143" x2="1055" y2="141.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="870" y="143.571428571429" width="370" height="51.785714285714" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="174.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" font-weight="bold" fill="var(--warn-text)">wrapper: before</text>
  <line x1="1055" y1="195.357142857143" x2="1055" y2="214" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="870" y="216.071428571429" width="370" height="51.785714285714" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" font-weight="bold" fill="var(--ok-text)">original runs</text>
  <line x1="1055" y1="267.857142857143" x2="1055" y2="286.5" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="870" y="288.571428571429" width="370" height="51.785714285714" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="319.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" font-weight="bold" fill="var(--warn-text)">wrapper: after</text>
  <line x1="1055" y1="340.357142857143" x2="1055" y2="359" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="870" y="361.071428571429" width="370" height="51.785714285714" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="392.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" font-weight="bold" fill="var(--primary-text)">return result</text>

  <rect x="460" y="506.071428571429" width="780" height="113.928571428571" rx="8.141603913586" fill="var(--surface)" stroke="var(--border)"/>
  <text x="850" y="537.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--text)">Common Decorators</text>
  <text x="480" y="573.392857142857" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text-muted)">@lru_cache  @wraps  @staticmethod  @classmethod</text>
  <text x="480" y="599.285714285714" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text-muted)">@property  @app.route  @login_required  @retry</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1280" height="52" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="34" font-family="sans-serif" font-size="22" font-weight="bold" fill="var(--bg)" text-anchor="middle">How @decorator Works: Wrapping and Call Flow</text>

  <!-- Three column labels -->
  <text x="200" y="74" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Syntax Equivalence</text>
  <text x="640" y="74" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Decorator Factory Structure</text>
  <text x="1060" y="74" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Runtime Call Flow</text>

  <!-- Column dividers -->
  <line x1="420" y1="60" x2="420" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="860" y1="60" x2="860" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- ===== COLUMN 1: Syntax Equivalence ===== -->

  <!-- With @ syntax -->
  <rect x="30" y="90" width="370" height="110" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="112" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">With @decorator syntax</text>
  <text x="50" y="132" font-family="monospace" font-size="13" fill="var(--text)">@my_decorator</text>
  <text x="50" y="150" font-family="monospace" font-size="13" fill="var(--text)">def greet(name):</text>
  <text x="50" y="168" font-family="monospace" font-size="13" fill="var(--text)">    return f"Hello, {name}"</text>
  <text x="50" y="186" font-family="monospace" font-size="13" fill="var(--text-muted)">    # greet is now wrapper</text>

  <!-- Equals sign -->
  <text x="215" y="222" font-family="sans-serif" font-size="22" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">⟺  equivalent to</text>

  <!-- Without @ syntax -->
  <rect x="30" y="232" width="370" height="126" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="254" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Without @decorator syntax</text>
  <text x="50" y="274" font-family="monospace" font-size="13" fill="var(--text)">def greet(name):</text>
  <text x="50" y="292" font-family="monospace" font-size="13" fill="var(--text)">    return f"Hello, {name}"</text>
  <text x="50" y="312" font-family="monospace" font-size="13" fill="var(--warn-accent)">greet = my_decorator(greet)</text>
  <text x="50" y="332" font-family="monospace" font-size="11" fill="var(--text-faint)"># original greet replaced by wrapper</text>
  <text x="50" y="350" font-family="monospace" font-size="11" fill="var(--text-faint)"># applied at definition time</text>

  <!-- Key points -->
  <rect x="30" y="380" width="370" height="112" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="215" y="400" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Key Points</text>
  <text x="50" y="420" font-family="sans-serif" font-size="12" fill="var(--text)">• Applied at function definition time</text>
  <text x="50" y="440" font-family="sans-serif" font-size="12" fill="var(--text)">• greet becomes the wrapper function</text>
  <text x="50" y="460" font-family="sans-serif" font-size="12" fill="var(--text)">• Use @functools.wraps to keep __name__</text>
  <text x="50" y="478" font-family="sans-serif" font-size="12" fill="var(--text)">• Stacking: @A @B def f() → A(B(f))</text>

  <!-- ===== COLUMN 2: Decorator Factory Structure ===== -->

  <!-- Outer box: decorator factory -->
  <rect x="440" y="90" width="400" height="400" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">decorator factory (optional args)</text>

  <!-- Middle box: decorator -->
  <rect x="460" y="122" width="360" height="308" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="142" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">decorator(func)</text>

  <!-- Inner box: wrapper -->
  <rect x="480" y="154" width="320" height="230" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="174" font-family="sans-serif" font-size="12" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">wrapper(*args, **kwargs)</text>

  <!-- Wrapper content -->
  <text x="500" y="198" font-family="monospace" font-size="11" fill="var(--text)">@functools.wraps(func)</text>
  <text x="500" y="216" font-family="monospace" font-size="11" fill="var(--text-muted)">  # pre-processing</text>
  <text x="500" y="234" font-family="monospace" font-size="11" fill="var(--text-muted)">  print("before call")</text>
  <text x="500" y="252" font-family="monospace" font-size="11" fill="var(--text-muted)">  log_args(*args)</text>
  <rect x="490" y="260" width="295" height="32" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="637" y="280" font-family="monospace" font-size="12" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">result = func(*args, **kwargs)</text>
  <text x="500" y="312" font-family="monospace" font-size="11" fill="var(--text-muted)">  # post-processing</text>
  <text x="500" y="330" font-family="monospace" font-size="11" fill="var(--text-muted)">  print("after call")</text>
  <text x="500" y="348" font-family="monospace" font-size="11" fill="var(--text-muted)">  return result</text>
  <text x="500" y="372" font-family="monospace" font-size="11" fill="var(--primary-accent)">return wrapper</text>

  <!-- Return arrows between levels -->
  <text x="640" y="418" font-family="monospace" font-size="11" fill="var(--warn-accent)" text-anchor="middle">return decorator</text>
  <text x="640" y="444" font-family="monospace" font-size="12" fill="var(--text-faint)" text-anchor="middle">usage: @timed(level="DEBUG")</text>

  <!-- ===== COLUMN 3: Runtime Call Flow ===== -->

  <!-- Caller box -->
  <rect x="880" y="90" width="360" height="48" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1060" y="112" font-family="monospace" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">caller: greet("Alice")</text>
  <text x="1060" y="130" font-family="sans-serif" font-size="11" fill="var(--primary-accent)" text-anchor="middle">invokes the wrapper, not original</text>

  <line x1="1060" y1="138" x2="1060" y2="162" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Wrapper runs pre -->
  <rect x="880" y="162" width="360" height="48" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="183" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">wrapper: pre-processing</text>
  <text x="1060" y="200" font-family="monospace" font-size="11" fill="var(--text-muted)" text-anchor="middle">start timer / log args / check auth</text>

  <line x1="1060" y1="210" x2="1060" y2="234" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Original function -->
  <rect x="880" y="234" width="360" height="48" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="255" font-family="monospace" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">original: greet("Alice")</text>
  <text x="1060" y="273" font-family="sans-serif" font-size="11" fill="var(--ok-accent)" text-anchor="middle">→ returns "Hello, Alice"</text>

  <line x1="1060" y1="282" x2="1060" y2="306" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Wrapper runs post -->
  <rect x="880" y="306" width="360" height="48" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="327" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">wrapper: post-processing</text>
  <text x="1060" y="344" font-family="monospace" font-size="11" fill="var(--text-muted)" text-anchor="middle">stop timer / log result / cache</text>

  <line x1="1060" y1="354" x2="1060" y2="378" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Return to caller -->
  <rect x="900" y="378" width="320" height="40" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1060" y="402" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">return result to caller</text>

  <!-- Common decorator uses -->
  <rect x="880" y="438" width="360" height="142" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1060" y="458" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--text)" text-anchor="middle">Common Decorators</text>
  <rect x="896" y="465" width="148" height="24" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="970" y="481" font-family="monospace" font-size="11" fill="var(--primary-accent)" text-anchor="middle">@functools.lru_cache</text>
  <rect x="1050" y="465" width="175" height="24" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1137" y="481" font-family="monospace" font-size="11" fill="var(--primary-accent)" text-anchor="middle">@functools.wraps(f)</text>
  <rect x="896" y="494" width="130" height="24" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="961" y="510" font-family="monospace" font-size="11" fill="var(--ok-accent)" text-anchor="middle">@staticmethod</text>
  <rect x="1030" y="494" width="120" height="24" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1090" y="510" font-family="monospace" font-size="11" fill="var(--ok-accent)" text-anchor="middle">@classmethod</text>
  <rect x="1154" y="494" width="80" height="24" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1194" y="510" font-family="monospace" font-size="11" fill="var(--ok-accent)" text-anchor="middle">@property</text>
  <rect x="896" y="523" width="110" height="24" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="951" y="539" font-family="monospace" font-size="11" fill="var(--warn-accent)" text-anchor="middle">@app.route</text>
  <rect x="1010" y="523" width="150" height="24" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1085" y="539" font-family="monospace" font-size="11" fill="var(--warn-accent)" text-anchor="middle">@login_required</text>
  <rect x="1165" y="523" width="65" height="24" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1197" y="539" font-family="monospace" font-size="11" fill="var(--warn-accent)" text-anchor="middle">@retry</text>
  <text x="896" y="570" font-family="monospace" font-size="11" fill="var(--text-muted)">@A @B @C def f():  →  f = A(B(C(f)))</text>
  <text x="896" y="588" font-family="sans-serif" font-size="11" fill="var(--text-muted)">Applied bottom-up; called top-down at runtime</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Title bar -->
  <rect x="40" y="40" width="1200" height="47.125" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="70.8125" font-family="sans-serif" font-size="20.2783" font-weight="bold" fill="var(--bg)" text-anchor="middle">How @decorator Works: Wrapping and Call Flow</text>

  <!-- Three column labels -->
  <text x="227.5" y="107.0625" font-family="sans-serif" font-size="13.8261" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Syntax Equivalence</text>
  <text x="640" y="107.0625" font-family="sans-serif" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Decorator Factory Structure</text>
  <text x="1033.75" y="107.0625" font-family="sans-serif" font-size="13.8261" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Runtime Call Flow</text>

  <!-- Column dividers -->
  <line x1="433.75" y1="94.375" x2="433.75" y2="601.875" stroke="var(--border)" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="846.25" y1="94.375" x2="846.25" y2="601.875" stroke="var(--border)" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- ===== COLUMN 1: Syntax Equivalence ===== -->

  <!-- With @ syntax -->
  <rect x="68.125" y="121.5625" width="346.875" height="99.6875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="241.5625" y="141.5" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">With @decorator syntax</text>
  <text x="86.875" y="159.625" font-family="monospace" font-size="11.9827" fill="var(--text)">@my_decorator</text>
  <text x="86.875" y="175.9375" font-family="monospace" font-size="11.9827" fill="var(--text)">def greet(name):</text>
  <text x="86.875" y="192.25" font-family="monospace" font-size="11.9827" fill="var(--text)">    return f"Hello, {name}"</text>
  <text x="86.875" y="208.5625" font-family="monospace" font-size="11.9827" fill="var(--text-muted)">    # greet is now wrapper</text>

  <!-- Equals sign -->
  <text x="241.5625" y="241.1875" font-family="sans-serif" font-size="20.2783" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">⟺  equivalent to</text>

  <!-- Without @ syntax -->
  <rect x="68.125" y="250.25" width="346.875" height="114.1875" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="241.5625" y="270.1875" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Without @decorator syntax</text>
  <text x="86.875" y="288.3125" font-family="monospace" font-size="11.9827" fill="var(--text)">def greet(name):</text>
  <text x="86.875" y="304.625" font-family="monospace" font-size="11.9827" fill="var(--text)">    return f"Hello, {name}"</text>
  <text x="86.875" y="322.75" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)">greet = my_decorator(greet)</text>
  <text x="86.875" y="340.875" font-family="monospace" font-size="10.1392" fill="var(--text-faint)"># original greet replaced by wrapper</text>
  <text x="86.875" y="357.1875" font-family="monospace" font-size="10.1392" fill="var(--text-faint)"># applied at definition time</text>

  <!-- Key points -->
  <rect x="68.125" y="384.375" width="346.875" height="101.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="241.5625" y="402.5" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Key Points</text>
  <text x="86.875" y="420.625" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Applied at function definition time</text>
  <text x="86.875" y="438.75" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• greet becomes the wrapper function</text>
  <text x="86.875" y="456.875" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Use @functools.wraps to keep __name__</text>
  <text x="86.875" y="473.1875" font-family="sans-serif" font-size="11.0609" fill="var(--text)">• Stacking: @A @B def f() → A(B(f))</text>

  <!-- ===== COLUMN 2: Decorator Factory Structure ===== -->

  <!-- Outer box: decorator factory -->
  <rect x="452.5" y="121.5625" width="375" height="362.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="141.5" font-family="sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">decorator factory (optional args)</text>

  <!-- Middle box: decorator -->
  <rect x="471.25" y="150.5625" width="337.5" height="279.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="168.6875" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">decorator(func)</text>

  <!-- Inner box: wrapper -->
  <rect x="490" y="179.5625" width="300" height="208.4375" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="197.6875" font-family="sans-serif" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">wrapper(*args, **kwargs)</text>

  <!-- Wrapper content -->
  <text x="508.75" y="219.4375" font-family="monospace" font-size="10.1392" fill="var(--text)">@functools.wraps(func)</text>
  <text x="508.75" y="235.75" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  # pre-processing</text>
  <text x="508.75" y="252.0625" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  print("before call")</text>
  <text x="508.75" y="268.375" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  log_args(*args)</text>
  <rect x="499.375" y="275.625" width="276.5625" height="29" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="637.1875" y="293.75" font-family="monospace" font-size="11.0609" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">result = func(*args, **kwargs)</text>
  <text x="508.75" y="322.75" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  # post-processing</text>
  <text x="508.75" y="339.0625" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  print("after call")</text>
  <text x="508.75" y="355.375" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">  return result</text>
  <text x="508.75" y="377.125" font-family="monospace" font-size="10.1392" fill="var(--primary-accent)">return wrapper</text>

  <!-- Return arrows between levels -->
  <text x="640" y="418.8125" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle">return decorator</text>
  <text x="640" y="442.375" font-family="monospace" font-size="11.0609" fill="var(--text-faint)" text-anchor="middle">usage: @timed(level="DEBUG")</text>

  <!-- ===== COLUMN 3: Runtime Call Flow ===== -->

  <!-- Caller box -->
  <rect x="865" y="121.5625" width="337.5" height="43.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1033.75" y="141.5" font-family="monospace" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">caller: greet("Alice")</text>
  <text x="1033.75" y="157.8125" font-family="sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle">invokes the wrapper, not original</text>

  <line x1="1033.75" y1="165.0625" x2="1033.75" y2="186.8125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Wrapper runs pre -->
  <rect x="865" y="186.8125" width="337.5" height="43.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.75" y="205.8438" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">wrapper: pre-processing</text>
  <text x="1033.75" y="221.25" font-family="monospace" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">start timer / log args / check auth</text>

  <line x1="1033.75" y1="230.3125" x2="1033.75" y2="252.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Original function -->
  <rect x="865" y="252.0625" width="337.5" height="43.5" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="271.0938" font-family="monospace" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">original: greet("Alice")</text>
  <text x="1033.75" y="287.4062" font-family="sans-serif" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">→ returns "Hello, Alice"</text>

  <line x1="1033.75" y1="295.5625" x2="1033.75" y2="317.3125" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Wrapper runs post -->
  <rect x="865" y="317.3125" width="337.5" height="43.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.75" y="336.3438" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">wrapper: post-processing</text>
  <text x="1033.75" y="351.75" font-family="monospace" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">stop timer / log result / cache</text>

  <line x1="1033.75" y1="360.8125" x2="1033.75" y2="382.5625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Return to caller -->
  <rect x="883.75" y="382.5625" width="300" height="36.25" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1033.75" y="404.3125" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)" text-anchor="middle">return result to caller</text>

  <!-- Common decorator uses -->
  <rect x="865" y="436.9375" width="337.5" height="128.6875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1033.75" y="455.0625" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--text)" text-anchor="middle">Common Decorators</text>
  <rect x="880" y="461.4062" width="138.75" height="21.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="949.375" y="475.9062" font-family="monospace" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle">@functools.lru_cache</text>
  <rect x="1024.375" y="461.4062" width="164.0625" height="21.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1105.9375" y="475.9062" font-family="monospace" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle">@functools.wraps(f)</text>
  <rect x="880" y="487.6875" width="121.875" height="21.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940.9375" y="502.1875" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">@staticmethod</text>
  <rect x="1005.625" y="487.6875" width="112.5" height="21.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1061.875" y="502.1875" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">@classmethod</text>
  <rect x="1121.875" y="487.6875" width="75" height="21.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1159.375" y="502.1875" font-family="monospace" font-size="10.1392" fill="var(--ok-accent)" text-anchor="middle">@property</text>
  <rect x="880" y="513.9688" width="103.125" height="21.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="931.5625" y="528.4688" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle">@app.route</text>
  <rect x="986.875" y="513.9688" width="140.625" height="21.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1057.1875" y="528.4688" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle">@login_required</text>
  <rect x="1132.1875" y="513.9688" width="60.9375" height="21.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1162.1875" y="528.4688" font-family="monospace" font-size="10.1392" fill="var(--warn-accent)" text-anchor="middle">@retry</text>
  <text x="880" y="556.5625" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">@A @B @C def f():  →  f = A(B(C(f)))</text>
  <text x="880" y="572.875" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">Applied bottom-up; called top-down at runtime</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#f57c00"/>
    </marker>
  </defs>
  <!-- Title bar -->
  <rect x="40" y="40" width="1200" height="48.645161" fill="var(--primary-fill)" rx="6.096006" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="71.806452" font-family="sans-serif" font-size="20.602773" font-weight="bold" fill="var(--bg)" text-anchor="middle">How @decorator Works: Wrapping and Call Flow</text>

  <!-- Three column labels -->
  <text x="227.5" y="109.225806" font-family="sans-serif" font-size="14.047332" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Syntax Equivalence</text>
  <text x="640" y="109.225806" font-family="sans-serif" font-size="14.047332" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Decorator Factory Structure</text>
  <text x="1033.75" y="109.225806" font-family="sans-serif" font-size="14.047332" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Runtime Call Flow</text>

  <!-- Column dividers -->
  <line x1="433.75" y1="96.129032" x2="433.75" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="846.25" y1="96.129032" x2="846.25" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- ===== COLUMN 1: Syntax Equivalence ===== -->

  <!-- With @ syntax -->
  <rect x="68.125" y="124.193548" width="346.875" height="102.903226" rx="6.096006" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="241.5625" y="144.774194" font-family="sans-serif" font-size="12.174435" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">With @decorator syntax</text>
  <text x="86.875" y="163.483871" font-family="monospace" font-size="12.174435" fill="var(--text)">@my_decorator</text>
  <text x="86.875" y="180.322581" font-family="monospace" font-size="12.174435" fill="var(--text)">def greet(name):</text>
  <text x="86.875" y="197.16129" font-family="monospace" font-size="12.174435" fill="var(--text)">    return f"Hello, {name}"</text>
  <text x="86.875" y="214" font-family="monospace" font-size="12.174435" fill="var(--text-muted)">    # greet is now wrapper</text>

  <!-- Equals sign -->
  <text x="241.5625" y="247.677419" font-family="sans-serif" font-size="20.602773" font-weight="bold" fill="var(--text-faint)" text-anchor="middle">⟺  equivalent to</text>

  <!-- Without @ syntax -->
  <rect x="68.125" y="257.032258" width="346.875" height="117.870968" rx="6.096006" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="241.5625" y="277.612903" font-family="sans-serif" font-size="12.174435" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Without @decorator syntax</text>
  <text x="86.875" y="296.322581" font-family="monospace" font-size="12.174435" fill="var(--text)">def greet(name):</text>
  <text x="86.875" y="313.16129" font-family="monospace" font-size="12.174435" fill="var(--text)">    return f"Hello, {name}"</text>
  <text x="86.875" y="331.870968" font-family="monospace" font-size="12.174435" fill="var(--warn-accent)">greet = my_decorator(greet)</text>
  <text x="86.875" y="350.580645" font-family="monospace" font-size="10.301438" fill="var(--text-faint)"># original greet replaced by wrapper</text>
  <text x="86.875" y="367.419355" font-family="monospace" font-size="10.301438" fill="var(--text-faint)"># applied at definition time</text>

  <!-- Key points -->
  <rect x="68.125" y="395.483871" width="346.875" height="104.774194" rx="6.096006" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="241.5625" y="414.193548" font-family="sans-serif" font-size="12.174435" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Key Points</text>
  <text x="86.875" y="432.903226" font-family="sans-serif" font-size="11.237886" fill="var(--text)">• Applied at function definition time</text>
  <text x="86.875" y="451.612903" font-family="sans-serif" font-size="11.237886" fill="var(--text)">• greet becomes the wrapper function</text>
  <text x="86.875" y="470.322581" font-family="sans-serif" font-size="11.237886" fill="var(--text)">• Use @functools.wraps to keep __name__</text>
  <text x="86.875" y="487.16129" font-family="sans-serif" font-size="11.237886" fill="var(--text)">• Stacking: @A @B def f() → A(B(f))</text>

  <!-- ===== COLUMN 2: Decorator Factory Structure ===== -->

  <!-- Outer box: decorator factory -->
  <rect x="452.5" y="124.193548" width="375" height="374.193548" rx="6.096006" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="144.774194" font-family="sans-serif" font-size="13.110884" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">decorator factory (optional args)</text>

  <!-- Middle box: decorator -->
  <rect x="471.25" y="154.129032" width="337.5" height="288.129032" rx="6.096006" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="172.83871" font-family="sans-serif" font-size="12.174435" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">decorator(func)</text>

  <!-- Inner box: wrapper -->
  <rect x="490" y="184.064516" width="300" height="215.16129" rx="6.096006" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="202.774194" font-family="sans-serif" font-size="11.237886" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">wrapper(*args, **kwargs)</text>

  <!-- Wrapper content -->
  <text x="508.75" y="225.225806" font-family="monospace" font-size="10.301438" fill="var(--text)">@functools.wraps(func)</text>
  <text x="508.75" y="242.064516" font-family="monospace" font-size="10.301438" fill="var(--text-muted)">  # pre-processing</text>
  <text x="508.75" y="258.903226" font-family="monospace" font-size="10.301438" fill="var(--text-muted)">  print("before call")</text>
  <text x="508.75" y="275.741935" font-family="monospace" font-size="10.301438" fill="var(--text-muted)">  log_args(*args)</text>
  <rect x="499.375" y="283.225806" width="276.5625" height="29.935484" rx="6.096006" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="637.1875" y="301.935484" font-family="monospace" font-size="11.237886" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">result = func(*args, **kwargs)</text>
  <text x="508.75" y="331.870968" font-family="monospace" font-size="10.301438" fill="var(--text-muted)">  # post-processing</text>
  <text x="508.75" y="348.709677" font-family="monospace" font-size="10.301438" fill="var(--text-muted)">  print("after call")</text>
  <text x="508.75" y="365.548387" font-family="monospace" font-size="10.301438" fill="var(--text-muted)">  return result</text>
  <text x="508.75" y="388" font-family="monospace" font-size="10.301438" fill="var(--primary-accent)">return wrapper</text>

  <!-- Return arrows between levels -->
  <text x="640" y="431.032258" font-family="monospace" font-size="10.301438" fill="var(--warn-accent)" text-anchor="middle">return decorator</text>
  <text x="640" y="455.354839" font-family="monospace" font-size="11.237886" fill="var(--text-faint)" text-anchor="middle">usage: @timed(level="DEBUG")</text>

  <!-- ===== COLUMN 3: Runtime Call Flow ===== -->

  <!-- Caller box -->
  <rect x="865" y="124.193548" width="337.5" height="44.903226" rx="6.096006" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1033.75" y="144.774194" font-family="monospace" font-size="14.047332" font-weight="bold" fill="var(--bg)" text-anchor="middle">caller: greet("Alice")</text>
  <text x="1033.75" y="161.612903" font-family="sans-serif" font-size="10.301438" fill="var(--primary-accent)" text-anchor="middle">invokes the wrapper, not original</text>

  <line x1="1033.75" y1="169.096774" x2="1033.75" y2="191.548387" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Wrapper runs pre -->
  <rect x="865" y="191.548387" width="337.5" height="44.903226" rx="6.096006" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.75" y="211.1936" font-family="sans-serif" font-size="12.174435" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">wrapper: pre-processing</text>
  <text x="1033.75" y="227.096774" font-family="monospace" font-size="10.301438" fill="var(--text-muted)" text-anchor="middle">start timer / log args / check auth</text>

  <line x1="1033.75" y1="236.451613" x2="1033.75" y2="258.903226" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Original function -->
  <rect x="865" y="258.903226" width="337.5" height="44.903226" rx="6.096006" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="278.548439" font-family="monospace" font-size="13.110884" font-weight="bold" fill="var(--bg)" text-anchor="middle">original: greet("Alice")</text>
  <text x="1033.75" y="295.387045" font-family="sans-serif" font-size="10.301438" fill="var(--ok-accent)" text-anchor="middle">→ returns "Hello, Alice"</text>

  <line x1="1033.75" y1="303.806452" x2="1033.75" y2="326.258065" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Wrapper runs post -->
  <rect x="865" y="326.258065" width="337.5" height="44.903226" rx="6.096006" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.75" y="345.903277" font-family="sans-serif" font-size="12.174435" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">wrapper: post-processing</text>
  <text x="1033.75" y="361.806452" font-family="monospace" font-size="10.301438" fill="var(--text-muted)" text-anchor="middle">stop timer / log result / cache</text>

  <line x1="1033.75" y1="371.16129" x2="1033.75" y2="393.612903" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Return to caller -->
  <rect x="883.75" y="393.612903" width="300" height="37.419355" rx="6.096006" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1033.75" y="416.064516" font-family="sans-serif" font-size="12.174435" font-weight="bold" fill="var(--bg)" text-anchor="middle">return result to caller</text>

  <!-- Common decorator uses -->
  <rect x="865" y="449.741935" width="337.5" height="132.83871" rx="6.096006" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1033.75" y="468.451613" font-family="sans-serif" font-size="12.174435" font-weight="bold" fill="var(--text)" text-anchor="middle">Common Decorators</text>
  <rect x="880" y="474.999948" width="138.75" height="22.451613" rx="6.096006" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.375" y="489.96769" font-family="monospace" font-size="10.301438" fill="var(--primary-accent)" text-anchor="middle">@functools.lru_cache</text>
  <rect x="1024.375" y="474.999948" width="164.0625" height="22.451613" rx="6.096006" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.9375" y="489.96769" font-family="monospace" font-size="10.301438" fill="var(--primary-accent)" text-anchor="middle">@functools.wraps(f)</text>
  <rect x="880" y="502.129032" width="121.875" height="22.451613" rx="6.096006" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.9375" y="517.096774" font-family="monospace" font-size="10.301438" fill="var(--ok-accent)" text-anchor="middle">@staticmethod</text>
  <rect x="1005.625" y="502.129032" width="112.5" height="22.451613" rx="6.096006" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.875" y="517.096774" font-family="monospace" font-size="10.301438" fill="var(--ok-accent)" text-anchor="middle">@classmethod</text>
  <rect x="1121.875" y="502.129032" width="75" height="22.451613" rx="6.096006" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1159.375" y="517.096774" font-family="monospace" font-size="10.301438" fill="var(--ok-accent)" text-anchor="middle">@property</text>
  <rect x="880" y="529.258116" width="103.125" height="22.451613" rx="6.096006" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="931.5625" y="544.225858" font-family="monospace" font-size="10.301438" fill="var(--warn-accent)" text-anchor="middle">@app.route</text>
  <rect x="986.875" y="529.258116" width="140.625" height="22.451613" rx="6.096006" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.1875" y="544.225858" font-family="monospace" font-size="10.301438" fill="var(--warn-accent)" text-anchor="middle">@login_required</text>
  <rect x="1132.1875" y="529.258116" width="60.9375" height="22.451613" rx="6.096006" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1162.1875" y="544.225858" font-family="monospace" font-size="10.301438" fill="var(--warn-accent)" text-anchor="middle">@retry</text>
  <text x="880" y="573.225806" font-family="monospace" font-size="10.301438" fill="var(--text-muted)">@A @B @C def f():  →  f = A(B(C(f)))</text>
  <text x="880" y="590.064516" font-family="sans-serif" font-size="10.301438" fill="var(--text-muted)">Applied bottom-up; called top-down at runtime</text>
</svg>

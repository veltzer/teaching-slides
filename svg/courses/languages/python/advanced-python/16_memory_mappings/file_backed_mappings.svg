<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.127204" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">File-Backed Memory Mappings</text>
  <rect x="40" y="94.86496" width="466.666667" height="431.080927" rx="7.203602" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="273.333333" y="65.473035" text-anchor="middle" font-size="20.867154" fill="var(--text-muted)" font-family="Arial, sans-serif">Memory</text>
  <text x="273.333333" y="87.027057" text-anchor="middle" font-size="16.693627" fill="var(--text-muted)" font-family="Arial, sans-serif">(Virtual Address Space)</text>
  <rect x="73.333333" y="153.64869" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="273.333333" y="192.837843" text-anchor="middle" font-size="18.78039" fill="var(--text)" font-family="Arial, sans-serif">Page 0 (mapped)</text>
  <rect x="73.333333" y="241.824345" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="273.333333" y="281.013498" text-anchor="middle" font-size="18.78039" fill="var(--text)" font-family="Arial, sans-serif">Page 1 (mapped)</text>
  <rect x="73.333333" y="330" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="273.333333" y="369.189153" text-anchor="middle" font-size="18.78039" fill="var(--text)" font-family="Arial, sans-serif">Page 2 (mapped)</text>
  <rect x="73.333333" y="418.175655" width="400" height="68.581079" rx="7.203602" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333"/>
  <text x="273.333333" y="457.364808" text-anchor="middle" font-size="18.78039" fill="var(--text-muted)" font-family="Arial, sans-serif">Page 3 (not loaded)</text>
  <rect x="773.333333" y="94.86496" width="466.666667" height="431.080927" rx="7.203602" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.666667" y="65.473035" text-anchor="middle" font-size="20.867154" fill="var(--text-muted)" font-family="Arial, sans-serif">File on Disk</text>
  <rect x="806.666667" y="153.64869" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="1006.666667" y="192.837843" text-anchor="middle" font-size="18.78039" fill="var(--text)" font-family="Arial, sans-serif">Block 0</text>
  <rect x="806.666667" y="241.824345" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="1006.666667" y="281.013498" text-anchor="middle" font-size="18.78039" fill="var(--text)" font-family="Arial, sans-serif">Block 1</text>
  <rect x="806.666667" y="330" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="1006.666667" y="369.189153" text-anchor="middle" font-size="18.78039" fill="var(--text)" font-family="Arial, sans-serif">Block 2</text>
  <rect x="806.666667" y="418.175655" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="1006.666667" y="457.364808" text-anchor="middle" font-size="18.78039" fill="var(--text)" font-family="Arial, sans-serif">Block 3</text>
  <line x1="506.666667" y1="241.824345" x2="773.333333" y2="241.824345" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="228.108105" text-anchor="middle" font-size="18.78039" fill="var(--text-muted)" font-family="Arial, sans-serif">Page In</text>
  <line x1="773.333333" y1="408.378306" x2="506.666667" y2="408.378306" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="398.580957" text-anchor="middle" font-size="18.78039" fill="var(--text-muted)" font-family="Arial, sans-serif">Page Out</text>
  <rect x="40" y="572.972943" width="1200" height="47.027057" rx="7.203602" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="602.364747" text-anchor="middle" font-size="16.693627" fill="var(--primary-accent)" font-family="Arial, sans-serif">mmap() maps file pages to virtual address space - kernel manages page-in/page-out automatically</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">File-Backed Memory Mappings</text>
  <!-- Memory box -->
  <rect x="100" y="100" width="420" height="440" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" filter="url(#shadow)"/>
  <text x="310" y="70" text-anchor="middle" font-size="20" fill="#555555">Memory</text>
  <text x="310" y="92" text-anchor="middle" font-size="16" fill="#555555">(Virtual Address Space)</text>
  <rect x="130" y="160" width="360" height="70" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="310" y="200" text-anchor="middle" font-size="18" fill="#333333">Page 0 (mapped)</text>
  <rect x="130" y="250" width="360" height="70" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="310" y="290" text-anchor="middle" font-size="18" fill="#333333">Page 1 (mapped)</text>
  <rect x="130" y="340" width="360" height="70" rx="5" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="310" y="380" text-anchor="middle" font-size="18" fill="#333333">Page 2 (mapped)</text>
  <rect x="130" y="430" width="360" height="70" rx="5" fill="#cccccc" stroke="#999999" stroke-width="1.5"/>
  <text x="310" y="470" text-anchor="middle" font-size="18" fill="#666666">Page 3 (not loaded)</text>
  <!-- File box -->
  <rect x="760" y="100" width="420" height="440" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="3" filter="url(#shadow)"/>
  <text x="970" y="70" text-anchor="middle" font-size="20" fill="#555555">File on Disk</text>
  <rect x="790" y="160" width="360" height="70" rx="5" fill="#ffffff" stroke="#e53935" stroke-width="1.5"/>
  <text x="970" y="200" text-anchor="middle" font-size="18" fill="#333333">Block 0</text>
  <rect x="790" y="250" width="360" height="70" rx="5" fill="#ffffff" stroke="#e53935" stroke-width="1.5"/>
  <text x="970" y="290" text-anchor="middle" font-size="18" fill="#333333">Block 1</text>
  <rect x="790" y="340" width="360" height="70" rx="5" fill="#ffffff" stroke="#e53935" stroke-width="1.5"/>
  <text x="970" y="380" text-anchor="middle" font-size="18" fill="#333333">Block 2</text>
  <rect x="790" y="430" width="360" height="70" rx="5" fill="#ffffff" stroke="#e53935" stroke-width="1.5"/>
  <text x="970" y="470" text-anchor="middle" font-size="18" fill="#333333">Block 3</text>
  <!-- Arrows -->
  <line x1="520" y1="250" x2="760" y2="250" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="236" text-anchor="middle" font-size="18" fill="#555555">Page In</text>
  <line x1="760" y1="420" x2="520" y2="420" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="410" text-anchor="middle" font-size="18" fill="#555555">Page Out</text>
  <!-- Note -->
  <rect x="100" y="588" width="1080" height="48" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="618" text-anchor="middle" font-size="16" fill="#1565c0">mmap() maps file pages to virtual address space - kernel manages page-in/page-out automatically</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="75.4444" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--primary-accent)">File-Backed Memory Mappings</text>
  <rect x="133.75" y="120.5556" width="393.75" height="354.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="330.625" y="96.3889" text-anchor="middle" font-size="17.3806" fill="var(--text-muted)">Memory</text>
  <text x="330.625" y="114.1111" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">(Virtual Address Space)</text>
  <rect x="161.875" y="168.8889" width="337.5" height="56.3889" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="330.625" y="201.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)">Page 0 (mapped)</text>
  <rect x="161.875" y="241.3889" width="337.5" height="56.3889" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="330.625" y="273.6111" text-anchor="middle" font-size="15.6425" fill="var(--text)">Page 1 (mapped)</text>
  <rect x="161.875" y="313.8889" width="337.5" height="56.3889" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="330.625" y="346.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)">Page 2 (mapped)</text>
  <rect x="161.875" y="386.3889" width="337.5" height="56.3889" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="330.625" y="418.6111" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Page 3 (not loaded)</text>
  <rect x="752.5" y="120.5556" width="393.75" height="354.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="949.375" y="96.3889" text-anchor="middle" font-size="17.3806" fill="var(--text-muted)">File on Disk</text>
  <rect x="780.625" y="168.8889" width="337.5" height="56.3889" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="949.375" y="201.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)">Block 0</text>
  <rect x="780.625" y="241.3889" width="337.5" height="56.3889" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="949.375" y="273.6111" text-anchor="middle" font-size="15.6425" fill="var(--text)">Block 1</text>
  <rect x="780.625" y="313.8889" width="337.5" height="56.3889" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="949.375" y="346.1111" text-anchor="middle" font-size="15.6425" fill="var(--text)">Block 2</text>
  <rect x="780.625" y="386.3889" width="337.5" height="56.3889" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="949.375" y="418.6111" text-anchor="middle" font-size="15.6425" fill="var(--text)">Block 3</text>
  <line x1="527.5" y1="241.3889" x2="752.5" y2="241.3889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="230.1111" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Page In</text>
  <line x1="752.5" y1="378.3333" x2="527.5" y2="378.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="370.2777" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Page Out</text>
  <rect x="133.75" y="513.6667" width="1012.5" height="38.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="537.8333" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)">mmap() maps file pages to virtual address space - kernel manages page-in/page-out automatically</text>
</svg>
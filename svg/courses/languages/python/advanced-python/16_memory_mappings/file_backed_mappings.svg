  <ns0:text x="275.5556" y="337.7778" text-anchor="middle" font-size="16" fill="#333333">Page 2 (mapped)</ns0:text>
  <ns0:rect x="115.5556" y="382.2222" width="320" height="62.2222" rx="4.4444" fill="#cccccc" stroke="#999999" stroke-width="1.3333" />
  <ns0:text x="275.5556" y="417.7778" text-anchor="middle" font-size="16" fill="#666666">Page 3 (not loaded)</ns0:text>
  <ns0:rect x="675.5556" y="88.8889" width="373.3333" height="391.1111" rx="8.8889" fill="#fce4ec" stroke="#e53935" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="862.2222" y="62.2222" text-anchor="middle" font-size="17.7778" fill="#555555">File on Disk</ns0:text>

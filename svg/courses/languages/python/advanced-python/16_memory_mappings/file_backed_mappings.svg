<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.127204" font-weight="bold" fill="var(--primary-accent)">File-Backed Memory Mappings</text>
  <rect x="40" y="94.86496" width="466.666667" height="431.080927" rx="7.203602" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="273.333333" y="65.473035" text-anchor="middle" font-size="20.867154" fill="var(--text-muted)">Memory</text>
  <text x="273.333333" y="87.027057" text-anchor="middle" font-size="16.693627" fill="var(--text-muted)">(Virtual Address Space)</text>
  <rect x="73.333333" y="153.64869" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="273.333333" y="192.837843" text-anchor="middle" font-size="18.78039" fill="var(--text)">Page 0 (mapped)</text>
  <rect x="73.333333" y="241.824345" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="273.333333" y="281.013498" text-anchor="middle" font-size="18.78039" fill="var(--text)">Page 1 (mapped)</text>
  <rect x="73.333333" y="330" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="273.333333" y="369.189153" text-anchor="middle" font-size="18.78039" fill="var(--text)">Page 2 (mapped)</text>
  <rect x="73.333333" y="418.175655" width="400" height="68.581079" rx="7.203602" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="273.333333" y="457.364808" text-anchor="middle" font-size="18.78039" fill="var(--text-muted)">Page 3 (not loaded)</text>
  <rect x="773.333333" y="94.86496" width="466.666667" height="431.080927" rx="7.203602" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1006.666667" y="65.473035" text-anchor="middle" font-size="20.867154" fill="var(--text-muted)">File on Disk</text>
  <rect x="806.666667" y="153.64869" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="1006.666667" y="192.837843" text-anchor="middle" font-size="18.78039" fill="var(--text)">Block 0</text>
  <rect x="806.666667" y="241.824345" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="1006.666667" y="281.013498" text-anchor="middle" font-size="18.78039" fill="var(--text)">Block 1</text>
  <rect x="806.666667" y="330" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="1006.666667" y="369.189153" text-anchor="middle" font-size="18.78039" fill="var(--text)">Block 2</text>
  <rect x="806.666667" y="418.175655" width="400" height="68.581079" rx="7.203602" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="1006.666667" y="457.364808" text-anchor="middle" font-size="18.78039" fill="var(--text)">Block 3</text>
  <line x1="506.666667" y1="241.824345" x2="773.333333" y2="241.824345" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="228.108105" text-anchor="middle" font-size="18.78039" fill="var(--text-muted)">Page In</text>
  <line x1="773.333333" y1="408.378306" x2="506.666667" y2="408.378306" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="398.580957" text-anchor="middle" font-size="18.78039" fill="var(--text-muted)">Page Out</text>
  <rect x="40" y="572.972943" width="1200" height="47.027057" rx="7.203602" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="602.364747" text-anchor="middle" font-size="16.693627" fill="var(--primary-accent)">mmap() maps file pages to virtual address space - kernel manages page-in/page-out automatically</text>
</svg>
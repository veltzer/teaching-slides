  <ns0:rect x="702.2222" y="302.2222" width="320" height="62.2222" rx="4.4444" fill="#ffffff" stroke="#e53935" stroke-width="1.3333" />
  <ns0:text x="862.2222" y="337.7778" text-anchor="middle" font-size="16" fill="#333333">Block 2</ns0:text>
  <ns0:rect x="702.2222" y="382.2222" width="320" height="62.2222" rx="4.4444" fill="#ffffff" stroke="#e53935" stroke-width="1.3333" />
  <ns0:text x="862.2222" y="417.7778" text-anchor="middle" font-size="16" fill="#333333">Block 3</ns0:text>
  <ns0:line x1="462.2222" y1="222.2222" x2="675.5556" y2="222.2222" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:text x="568.8889" y="209.7778" text-anchor="middle" font-size="16" fill="#555555">Page In</ns0:text>
  <ns0:line x1="675.5556" y1="373.3333" x2="462.2222" y2="373.3333" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:text x="568.8889" y="364.4444" text-anchor="middle" font-size="16" fill="#555555">Page Out</ns0:text>
  <ns0:rect x="88.8889" y="522.6667" width="960" height="42.6667" rx="5.3333" fill="#f9f9f9" stroke="#bbdefb" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="549.3333" text-anchor="middle" font-size="14.2222" fill="#1565c0">mmap() maps file pages to virtual address space - kernel manages page-in/page-out automatically</ns0:text>

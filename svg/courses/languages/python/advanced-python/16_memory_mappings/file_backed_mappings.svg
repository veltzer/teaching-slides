  <ns0:text x="862.2222" y="177.7778" text-anchor="middle" font-size="16" fill="#333333">Block 0</ns0:text>
  <ns0:rect x="702.2222" y="222.2222" width="320" height="62.2222" rx="4.4444" fill="#ffffff" stroke="#e53935" stroke-width="1.3333" />

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="39.1111" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#1565c0">Page Tables: Virtual to Physical Address Translation</ns0:text>
  <ns0:rect x="124.4444" y="80" width="408.8889" height="80" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="328.8889" y="127.1111" text-anchor="middle" font-size="17.7778" fill="#333333" font-weight="bold">Virtual Page Number</ns0:text>
  <ns0:rect x="542.2222" y="80" width="408.8889" height="80" rx="7.1111" fill="#fce4ec" stroke="#e53935" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="746.6667" y="127.1111" text-anchor="middle" font-size="17.7778" fill="#333333" font-weight="bold">Offset</ns0:text>
  <ns0:text x="568.8889" y="67.5556" text-anchor="middle" font-size="14.2222" fill="#555555">Virtual Address</ns0:text>
  <ns0:rect x="248.8889" y="275.5556" width="568.8889" height="115.5556" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="533.3333" y="341.3333" text-anchor="middle" font-size="19.5556" fill="#333333" font-weight="bold">Page Table</ns0:text>
  <ns0:text x="533.3333" y="373.3333" text-anchor="middle" font-size="14.2222" fill="#555555">(Managed by Kernel)</ns0:text>
  <ns0:rect x="248.8889" y="462.2222" width="568.8889" height="88.8889" rx="7.1111" fill="#fff9c4" stroke="#f9a825" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="533.3333" y="513.7778" text-anchor="middle" font-size="19.5556" fill="#555555" font-weight="bold">Physical Memory Frame</ns0:text>
  <ns0:line x1="328.8889" y1="160" x2="444.4444" y2="275.5556" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:line x1="533.3333" y1="391.1111" x2="533.3333" y2="462.2222" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="124.4444" y="577.7778" width="888.8889" height="42.6667" rx="5.3333" fill="#f9f9f9" stroke="#bbdefb" stroke-width="0.8889" />
  <ns0:text x="568.8889" y="604.4444" text-anchor="middle" font-size="14.2222" fill="#1565c0">TLB (Translation Lookaside Buffer) caches recent page table lookups for speed</ns0:text>
</ns0:svg>
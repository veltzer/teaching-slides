<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.173143" font-weight="bold" fill="var(--primary-accent)">Virtual Memory Fundamentals</text>
  <rect x="40" y="75.389821" width="533.333333" height="442.372768" rx="7.215801" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="306.666667" y="63.593174" text-anchor="middle" font-size="20.902492" fill="var(--text-muted)">Virtual Memory</text>
  <text x="306.666667" y="124.5425" text-anchor="middle" font-size="16.721897" fill="var(--text-muted)">(Process view)</text>
  <rect x="73.333333" y="144.203377" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="306.666667" y="185.491583" text-anchor="middle" font-size="18.812194" fill="var(--text)">Address 0x0000 - 0x1000</text>
  <rect x="73.333333" y="232.67793" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="306.666667" y="273.966136" text-anchor="middle" font-size="18.812194" fill="var(--text)">Address 0x1000 - 0x2000</text>
  <rect x="73.333333" y="321.152484" width="466.666667" height="68.813555" rx="7.215801" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="306.666667" y="362.44069" text-anchor="middle" font-size="18.812194" fill="var(--text-muted)">Not mapped (gap)</text>
  <rect x="73.333333" y="409.627037" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="306.666667" y="450.915243" text-anchor="middle" font-size="18.812194" fill="var(--text)">Address 0x8000 - 0x9000</text>
  <rect x="706.666667" y="75.389821" width="533.333333" height="442.372768" rx="7.215801" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="973.333333" y="63.593174" text-anchor="middle" font-size="20.902492" fill="var(--text-muted)">Physical Memory</text>
  <text x="973.333333" y="124.5425" text-anchor="middle" font-size="16.721897" fill="var(--text-muted)">(Actual RAM)</text>
  <rect x="740" y="144.203377" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="973.333333" y="185.491583" text-anchor="middle" font-size="18.812194" fill="var(--text)">Frame 0</text>
  <rect x="740" y="232.67793" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="973.333333" y="273.966136" text-anchor="middle" font-size="18.812194" fill="var(--text)">Frame 1</text>
  <rect x="740" y="321.152484" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="973.333333" y="362.44069" text-anchor="middle" font-size="18.812194" fill="var(--text)">Frame 7 (from another addr)</text>
  <rect x="740" y="409.627037" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="973.333333" y="450.915243" text-anchor="middle" font-size="18.812194" fill="var(--text)">Frame 3</text>
  <line x1="540" y1="178.610093" x2="706.666667" y2="178.610093" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="540" y1="267.084647" x2="706.666667" y2="267.084647" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="540" y1="444.033754" x2="706.666667" y2="355.5592" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="557.084708" width="1200" height="62.915292" rx="7.215801" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="583.627074" text-anchor="middle" font-size="18.812194" fill="var(--primary-accent)" font-weight="bold">Key benefit: Each process sees its own isolated address space</text>
  <text x="640" y="608.203352" text-anchor="middle" font-size="16.721897" fill="var(--text-muted)">Non-contiguous virtual pages can map to any physical frames</text>
</svg>
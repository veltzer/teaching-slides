<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="39.1111" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#1565c0">Virtual Memory Fundamentals</ns0:text>
  <ns0:rect x="88.8889" y="71.1111" width="426.6667" height="400" rx="8.8889" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="302.2222" y="60.4444" text-anchor="middle" font-size="17.7778" fill="#555555">Virtual Memory</ns0:text>
  <ns0:text x="302.2222" y="115.5556" text-anchor="middle" font-size="14.2222" fill="#555555">(Process view)</ns0:text>
  <ns0:rect x="115.5556" y="133.3333" width="373.3333" height="62.2222" rx="4.4444" fill="#ffffff" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="302.2222" y="170.6667" text-anchor="middle" font-size="16" fill="#333333">Address 0x0000 - 0x1000</ns0:text>
  <ns0:rect x="115.5556" y="213.3333" width="373.3333" height="62.2222" rx="4.4444" fill="#ffffff" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="302.2222" y="250.6667" text-anchor="middle" font-size="16" fill="#333333">Address 0x1000 - 0x2000</ns0:text>
  <ns0:rect x="115.5556" y="293.3333" width="373.3333" height="62.2222" rx="4.4444" fill="#cccccc" stroke="#999999" stroke-width="1.3333" />
  <ns0:text x="302.2222" y="330.6667" text-anchor="middle" font-size="16" fill="#666666">Not mapped (gap)</ns0:text>
  <ns0:rect x="115.5556" y="373.3333" width="373.3333" height="62.2222" rx="4.4444" fill="#ffffff" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="302.2222" y="410.6667" text-anchor="middle" font-size="16" fill="#333333">Address 0x8000 - 0x9000</ns0:text>
  <ns0:rect x="622.2222" y="71.1111" width="426.6667" height="400" rx="8.8889" fill="#fce4ec" stroke="#e53935" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="835.5556" y="60.4444" text-anchor="middle" font-size="17.7778" fill="#555555">Physical Memory</ns0:text>
  <ns0:text x="835.5556" y="115.5556" text-anchor="middle" font-size="14.2222" fill="#555555">(Actual RAM)</ns0:text>
  <ns0:rect x="648.8889" y="133.3333" width="373.3333" height="62.2222" rx="4.4444" fill="#ffffff" stroke="#e53935" stroke-width="1.3333" />
  <ns0:text x="835.5556" y="170.6667" text-anchor="middle" font-size="16" fill="#333333">Frame 0</ns0:text>
  <ns0:rect x="648.8889" y="213.3333" width="373.3333" height="62.2222" rx="4.4444" fill="#ffffff" stroke="#e53935" stroke-width="1.3333" />
  <ns0:text x="835.5556" y="250.6667" text-anchor="middle" font-size="16" fill="#333333">Frame 1</ns0:text>
  <ns0:rect x="648.8889" y="293.3333" width="373.3333" height="62.2222" rx="4.4444" fill="#ffffff" stroke="#e53935" stroke-width="1.3333" />
  <ns0:text x="835.5556" y="330.6667" text-anchor="middle" font-size="16" fill="#333333">Frame 7 (from another addr)</ns0:text>
  <ns0:rect x="648.8889" y="373.3333" width="373.3333" height="62.2222" rx="4.4444" fill="#ffffff" stroke="#e53935" stroke-width="1.3333" />
  <ns0:text x="835.5556" y="410.6667" text-anchor="middle" font-size="16" fill="#333333">Frame 3</ns0:text>
  <ns0:line x1="488.8889" y1="164.4444" x2="622.2222" y2="164.4444" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:line x1="488.8889" y1="244.4444" x2="622.2222" y2="244.4444" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:line x1="488.8889" y1="404.4444" x2="622.2222" y2="324.4444" stroke="#555555" stroke-width="2.2222" marker-end="url(#arrow)" />
  <ns0:rect x="88.8889" y="506.6667" width="960" height="56.8889" rx="5.3333" fill="#f9f9f9" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="530.6667" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">Key benefit: Each process sees its own isolated address space</ns0:text>
  <ns0:text x="568.8889" y="552.8889" text-anchor="middle" font-size="14.2222" fill="#555555">Non-contiguous virtual pages can map to any physical frames</ns0:text>
</ns0:svg>
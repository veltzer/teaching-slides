<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="568.8889" y="39.1111" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--primary-accent)">Virtual Memory Fundamentals</text>
  <rect x="88.8889" y="71.1111" width="426.6667" height="400" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="302.2222" y="60.4444" text-anchor="middle" font-size="17.7778" fill="var(--text-muted)">Virtual Memory</text>
  <text x="302.2222" y="115.5556" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">(Process view)</text>
  <rect x="115.5556" y="133.3333" width="373.3333" height="62.2222" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="302.2222" y="170.6667" text-anchor="middle" font-size="16" fill="var(--text)">Address 0x0000 - 0x1000</text>
  <rect x="115.5556" y="213.3333" width="373.3333" height="62.2222" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="302.2222" y="250.6667" text-anchor="middle" font-size="16" fill="var(--text)">Address 0x1000 - 0x2000</text>
  <rect x="115.5556" y="293.3333" width="373.3333" height="62.2222" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="302.2222" y="330.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">Not mapped (gap)</text>
  <rect x="115.5556" y="373.3333" width="373.3333" height="62.2222" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="302.2222" y="410.6667" text-anchor="middle" font-size="16" fill="var(--text)">Address 0x8000 - 0x9000</text>
  <rect x="622.2222" y="71.1111" width="426.6667" height="400" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="835.5556" y="60.4444" text-anchor="middle" font-size="17.7778" fill="var(--text-muted)">Physical Memory</text>
  <text x="835.5556" y="115.5556" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">(Actual RAM)</text>
  <rect x="648.8889" y="133.3333" width="373.3333" height="62.2222" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="835.5556" y="170.6667" text-anchor="middle" font-size="16" fill="var(--text)">Frame 0</text>
  <rect x="648.8889" y="213.3333" width="373.3333" height="62.2222" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="835.5556" y="250.6667" text-anchor="middle" font-size="16" fill="var(--text)">Frame 1</text>
  <rect x="648.8889" y="293.3333" width="373.3333" height="62.2222" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="835.5556" y="330.6667" text-anchor="middle" font-size="16" fill="var(--text)">Frame 7 (from another addr)</text>
  <rect x="648.8889" y="373.3333" width="373.3333" height="62.2222" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="835.5556" y="410.6667" text-anchor="middle" font-size="16" fill="var(--text)">Frame 3</text>
  <line x1="488.8889" y1="164.4444" x2="622.2222" y2="164.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="488.8889" y1="244.4444" x2="622.2222" y2="244.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="488.8889" y1="404.4444" x2="622.2222" y2="324.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="88.8889" y="506.6667" width="960" height="56.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="530.6667" text-anchor="middle" font-size="16" fill="var(--primary-accent)" font-weight="bold">Key benefit: Each process sees its own isolated address space</text>
  <text x="568.8889" y="552.8889" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Non-contiguous virtual pages can map to any physical frames</text>
</svg>
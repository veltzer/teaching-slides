<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="52.296857156098" width="533.333333" height="461.130585482788" rx="7.367197620813" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="306.666667" y="40" text-anchor="middle" font-size="21.3410526886" fill="var(--text-muted)" font-family="Arial, sans-serif">Virtual Memory</text>
  <text x="306.666667" y="103.533744426061" text-anchor="middle" font-size="17.07274352409" fill="var(--text-muted)" font-family="Arial, sans-serif">(Process view)</text>
  <rect x="73.333333" y="124.028296482473" width="466.666667" height="71.731438283972" rx="7.367197620813" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="306.666667" y="167.067235548257" text-anchor="middle" font-size="19.206897595855" fill="var(--text)" font-family="Arial, sans-serif">Address 0x0000 - 0x1000</text>
  <rect x="73.333333" y="216.254412953589" width="466.666667" height="71.731438283972" rx="7.367197620813" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="306.666667" y="259.293352019373" text-anchor="middle" font-size="19.206897595855" fill="var(--text)" font-family="Arial, sans-serif">Address 0x1000 - 0x2000</text>
  <rect x="73.333333" y="308.480530467108" width="466.666667" height="71.731438283972" rx="7.367197620813" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333"/>
  <text x="306.666667" y="351.519469532892" text-anchor="middle" font-size="19.206897595855" fill="var(--text-muted)" font-family="Arial, sans-serif">Not mapped (gap)</text>
  <rect x="73.333333" y="400.706646938224" width="466.666667" height="71.731438283972" rx="7.367197620813" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="306.666667" y="443.745586004008" text-anchor="middle" font-size="19.206897595855" fill="var(--text)" font-family="Arial, sans-serif">Address 0x8000 - 0x9000</text>
  <rect x="706.666667" y="52.296857156098" width="533.333333" height="461.130585482788" rx="7.367197620813" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="973.333333" y="40" text-anchor="middle" font-size="21.3410526886" fill="var(--text-muted)" font-family="Arial, sans-serif">Physical Memory</text>
  <text x="973.333333" y="103.533744426061" text-anchor="middle" font-size="17.07274352409" fill="var(--text-muted)" font-family="Arial, sans-serif">(Actual RAM)</text>
  <rect x="740" y="124.028296482473" width="466.666667" height="71.731438283972" rx="7.367197620813" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="973.333333" y="167.067235548257" text-anchor="middle" font-size="19.206897595855" fill="var(--text)" font-family="Arial, sans-serif">Frame 0</text>
  <rect x="740" y="216.254412953589" width="466.666667" height="71.731438283972" rx="7.367197620813" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="973.333333" y="259.293352019373" text-anchor="middle" font-size="19.206897595855" fill="var(--text)" font-family="Arial, sans-serif">Frame 1</text>
  <rect x="740" y="308.480530467108" width="466.666667" height="71.731438283972" rx="7.367197620813" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="973.333333" y="351.519469532892" text-anchor="middle" font-size="19.206897595855" fill="var(--text)" font-family="Arial, sans-serif">Frame 7 (from another addr)</text>
  <rect x="740" y="400.706646938224" width="466.666667" height="71.731438283972" rx="7.367197620813" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="973.333333" y="443.745586004008" text-anchor="middle" font-size="19.206897595855" fill="var(--text)" font-family="Arial, sans-serif">Frame 3</text>
  <line x1="540" y1="159.893951516691" x2="706.666667" y2="159.893951516691" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="540" y1="252.12006903021" x2="706.666667" y2="252.12006903021" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="540" y1="436.572303014845" x2="706.666667" y2="344.346185501326" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="554.416927228711" width="1200" height="65.583072771289" rx="7.367197620813" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="582.084762274286" text-anchor="middle" font-size="19.206897595855" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Key benefit: Each process sees its own isolated address space</text>
  <text x="640" y="607.703141801499" text-anchor="middle" font-size="17.07274352409" fill="var(--text-muted)" font-family="Arial, sans-serif">Non-contiguous virtual pages can map to any physical frames</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.173143" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Virtual Memory Fundamentals</text>
  <rect x="40" y="75.389821" width="533.333333" height="442.372768" rx="7.215801" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="306.666667" y="63.593174" text-anchor="middle" font-size="20.902492" fill="var(--text-muted)" font-family="Arial, sans-serif">Virtual Memory</text>
  <text x="306.666667" y="124.5425" text-anchor="middle" font-size="16.721897" fill="var(--text-muted)" font-family="Arial, sans-serif">(Process view)</text>
  <rect x="73.333333" y="144.203377" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="306.666667" y="185.491583" text-anchor="middle" font-size="18.812194" fill="var(--text)" font-family="Arial, sans-serif">Address 0x0000 - 0x1000</text>
  <rect x="73.333333" y="232.67793" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="306.666667" y="273.966136" text-anchor="middle" font-size="18.812194" fill="var(--text)" font-family="Arial, sans-serif">Address 0x1000 - 0x2000</text>
  <rect x="73.333333" y="321.152484" width="466.666667" height="68.813555" rx="7.215801" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.3333"/>
  <text x="306.666667" y="362.44069" text-anchor="middle" font-size="18.812194" fill="var(--text-muted)" font-family="Arial, sans-serif">Not mapped (gap)</text>
  <rect x="73.333333" y="409.627037" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="306.666667" y="450.915243" text-anchor="middle" font-size="18.812194" fill="var(--text)" font-family="Arial, sans-serif">Address 0x8000 - 0x9000</text>
  <rect x="706.666667" y="75.389821" width="533.333333" height="442.372768" rx="7.215801" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="973.333333" y="63.593174" text-anchor="middle" font-size="20.902492" fill="var(--text-muted)" font-family="Arial, sans-serif">Physical Memory</text>
  <text x="973.333333" y="124.5425" text-anchor="middle" font-size="16.721897" fill="var(--text-muted)" font-family="Arial, sans-serif">(Actual RAM)</text>
  <rect x="740" y="144.203377" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="973.333333" y="185.491583" text-anchor="middle" font-size="18.812194" fill="var(--text)" font-family="Arial, sans-serif">Frame 0</text>
  <rect x="740" y="232.67793" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="973.333333" y="273.966136" text-anchor="middle" font-size="18.812194" fill="var(--text)" font-family="Arial, sans-serif">Frame 1</text>
  <rect x="740" y="321.152484" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="973.333333" y="362.44069" text-anchor="middle" font-size="18.812194" fill="var(--text)" font-family="Arial, sans-serif">Frame 7 (from another addr)</text>
  <rect x="740" y="409.627037" width="466.666667" height="68.813555" rx="7.215801" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="973.333333" y="450.915243" text-anchor="middle" font-size="18.812194" fill="var(--text)" font-family="Arial, sans-serif">Frame 3</text>
  <line x1="540" y1="178.610093" x2="706.666667" y2="178.610093" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="267.084647" x2="706.666667" y2="267.084647" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="444.033754" x2="706.666667" y2="355.5592" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="557.084708" width="1200" height="62.915292" rx="7.215801" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="583.627074" text-anchor="middle" font-size="18.812194" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Key benefit: Each process sees its own isolated address space</text>
  <text x="640" y="608.203352" text-anchor="middle" font-size="16.721897" fill="var(--text-muted)" font-family="Arial, sans-serif">Non-contiguous virtual pages can map to any physical frames</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="96.666666666667" rx="7.542471885041" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="99.074133333333" text-anchor="middle" font-size="21.848782820836" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Process Virtual Memory Space</text>
  <rect x="106.666667" y="211.851866666667" width="311.111111" height="85.925866666667" rx="7.542471885041" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="262.222222" y="261.259333333333" text-anchor="middle" font-size="19.663854241609" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Code Segment</text>
  <rect x="484.444326" y="211.851866666667" width="311.111111" height="85.925866666667" rx="7.542471885041" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="261.259333333333" text-anchor="middle" font-size="19.663854241609" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Data Segment</text>
  <rect x="862.222222" y="211.851866666667" width="311.111111" height="85.925866666667" rx="7.542471885041" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.777778" y="261.259333333333" text-anchor="middle" font-size="19.663854241609" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Mapped Region</text>
  <rect x="40" y="383.703866666667" width="1200" height="96.666666666667" rx="7.542471885041" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="440.629733333333" text-anchor="middle" font-size="21.848782820836" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Linux Kernel</text>
  <rect x="106.666667" y="534.074133333333" width="311.111111" height="85.925866666667" rx="7.542471885041" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="262.222222" y="583.4816" text-anchor="middle" font-size="19.663854241609" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Page Tables</text>
  <rect x="484.444326" y="534.074133333333" width="311.111111" height="85.925866666667" rx="7.542471885041" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="583.4816" text-anchor="middle" font-size="19.663854241609" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">VMA Structures</text>
  <rect x="862.222222" y="534.074133333333" width="311.111111" height="85.925866666667" rx="7.542471885041" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1017.777778" y="583.4816" text-anchor="middle" font-size="19.663854241609" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Page Cache</text>
  <line x1="262.222222" y1="297.777733333333" x2="262.222222" y2="383.703866666667" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556"/>
  <line x1="640" y1="297.777733333333" x2="640" y2="383.703866666667" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556"/>
  <line x1="1017.777778" y1="297.777733333333" x2="1017.777778" y2="383.703866666667" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556"/>
  <line x1="262.222222" y1="480.370533333333" x2="262.222222" y2="534.074133333333" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556"/>
  <line x1="640" y1="480.370533333333" x2="640" y2="534.074133333333" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556"/>
  <line x1="1017.777778" y1="480.370533333333" x2="1017.777778" y2="534.074133333333" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="5.3333 3.5556"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">Memory Mapping Implementation in Linux</text>
  <!-- Process Virtual Memory Space -->
  <rect x="100" y="80" width="1080" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="640" y="135" text-anchor="middle" font-size="20" fill="#333333" font-weight="bold">Process Virtual Memory Space</text>
  <!-- Segments -->
  <rect x="160" y="240" width="280" height="80" rx="6" fill="#fce4ec" stroke="#e53935" stroke-width="2"/>
  <text x="300" y="286" text-anchor="middle" font-size="18" fill="#c62828" font-weight="bold">Code Segment</text>
  <rect x="500" y="240" width="280" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="640" y="286" text-anchor="middle" font-size="18" fill="#2e7d32" font-weight="bold">Data Segment</text>
  <rect x="840" y="240" width="280" height="80" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="980" y="286" text-anchor="middle" font-size="18" fill="#795548" font-weight="bold">Mapped Region</text>
  <!-- Kernel layer -->
  <rect x="100" y="400" width="1080" height="90" rx="8" fill="#eeeeee" stroke="#757575" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="640" y="453" text-anchor="middle" font-size="20" fill="#333333" font-weight="bold">Linux Kernel</text>
  <!-- Kernel structures -->
  <rect x="160" y="540" width="280" height="80" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="2"/>
  <text x="300" y="586" text-anchor="middle" font-size="18" fill="#555555" font-weight="bold">Page Tables</text>
  <rect x="500" y="540" width="280" height="80" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="2"/>
  <text x="640" y="586" text-anchor="middle" font-size="18" fill="#555555" font-weight="bold">VMA Structures</text>
  <rect x="840" y="540" width="280" height="80" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="2"/>
  <text x="980" y="586" text-anchor="middle" font-size="18" fill="#555555" font-weight="bold">Page Cache</text>
  <!-- Connect arrows -->
  <line x1="300" y1="320" x2="300" y2="400" stroke="#555555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="640" y1="320" x2="640" y2="400" stroke="#555555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="980" y1="320" x2="980" y2="400" stroke="#555555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="300" y1="490" x2="300" y2="540" stroke="#555555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="640" y1="490" x2="640" y2="540" stroke="#555555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="980" y1="490" x2="980" y2="540" stroke="#555555" stroke-width="2" stroke-dasharray="6 4"/>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="35.5556" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#1565c0">Copy-on-Write (COW)</ns0:text>
  <ns0:rect x="124.4444" y="80" width="320" height="80" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="284.4444" y="127.1111" text-anchor="middle" font-size="19.5556" fill="#333333" font-weight="bold">Process A</ns0:text>
  <ns0:rect x="693.3333" y="80" width="320" height="80" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="853.3333" y="127.1111" text-anchor="middle" font-size="19.5556" fill="#333333" font-weight="bold">Process B</ns0:text>
  <ns0:rect x="408.8889" y="257.7778" width="320" height="80" rx="7.1111" fill="#fce4ec" stroke="#e53935" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="304.8889" text-anchor="middle" font-size="19.5556" fill="#333333" font-weight="bold">Shared Page</ns0:text>
  <ns0:rect x="124.4444" y="462.2222" width="320" height="80" rx="7.1111" fill="#fce4ec" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="284.4444" y="509.3333" text-anchor="middle" font-size="19.5556" fill="#333333">Private Copy</ns0:text>
  <ns0:rect x="693.3333" y="462.2222" width="320" height="80" rx="7.1111" fill="#fce4ec" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="853.3333" y="509.3333" text-anchor="middle" font-size="19.5556" fill="#333333">Original Page</ns0:text>
  <ns0:line x1="284.4444" y1="160" x2="480" y2="257.7778" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:line x1="853.3333" y1="160" x2="657.7778" y2="257.7778" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:line x1="284.4444" y1="337.7778" x2="284.4444" y2="462.2222" stroke="#555555" stroke-width="2.6667" stroke-dasharray="8.8889 7.1111" marker-end="url(#arrow)" />
  <ns0:text x="231.1111" y="408.8889" text-anchor="middle" font-size="17.7778" fill="#555555">Write</ns0:text>
  <ns0:line x1="853.3333" y1="337.7778" x2="853.3333" y2="462.2222" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:text x="568.8889" y="586.6667" text-anchor="middle" font-size="16" fill="#555555">On write: kernel allocates a private copy for the writing process only</ns0:text>
</ns0:svg>
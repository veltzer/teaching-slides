<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">Copy-on-Write (COW)</text>
  <!-- Process A -->
  <rect x="140" y="90" width="360" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" filter="url(#shadow)"/>
  <text x="320" y="143" text-anchor="middle" font-size="22" fill="#333333" font-weight="bold">Process A</text>
  <!-- Process B -->
  <rect x="780" y="90" width="360" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" filter="url(#shadow)"/>
  <text x="960" y="143" text-anchor="middle" font-size="22" fill="#333333" font-weight="bold">Process B</text>
  <!-- Shared page -->
  <rect x="460" y="290" width="360" height="90" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="343" text-anchor="middle" font-size="22" fill="#333333" font-weight="bold">Shared Page</text>
  <!-- After write -->
  <rect x="140" y="520" width="360" height="90" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="573" text-anchor="middle" font-size="22" fill="#333333">Private Copy</text>
  <rect x="780" y="520" width="360" height="90" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="573" text-anchor="middle" font-size="22" fill="#333333">Original Page</text>
  <!-- Arrows: processes to shared -->
  <line x1="320" y1="180" x2="540" y2="290" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="960" y1="180" x2="740" y2="290" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Write arrow from A to private copy -->
  <line x1="320" y1="380" x2="320" y2="520" stroke="#555555" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="260" y="460" text-anchor="middle" font-size="20" fill="#555555">Write</text>
  <!-- B reads from original -->
  <line x1="960" y1="380" x2="960" y2="520" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Labels -->
  <text x="640" y="660" text-anchor="middle" font-size="18" fill="#555555">On write: kernel allocates a private copy for the writing process only</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000052" y="40" text-anchor="middle" font-size="24.820515" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Threading and the GIL</text>
  <rect x="40" y="73.354638" width="334.426259" height="194.568758" rx="6.591063" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="207.213129" y="184.536802" font-size="26.729836" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">CPU-bound task</text>
  <text x="207.213129" y="221.597485" font-size="17.18345" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Heavy computation</text>
  <text x="207.213129" y="247.540032" font-size="17.18345" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Number crunching</text>
  <line x1="374.426259" y1="170.638959" x2="423.606591" y2="170.638959" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="427.541017" y="73.354638" width="393.442657" height="194.568758" rx="6.591063" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="624.262346" y="170.638959" font-size="24.820515" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">multiprocessing</text>
  <text x="624.262346" y="203.067258" font-size="16.228845" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Bypasses GIL entirely</text>
  <text x="624.262346" y="230.862713" font-size="16.228845" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">True parallelism</text>
  <rect x="40" y="314.249307" width="334.426259" height="194.568758" rx="6.591063" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="207.213129" y="420.798742" font-size="26.729836" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">I/O-bound task</text>
  <text x="207.213129" y="457.85954" font-size="17.18345" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Network, disk, DB</text>
  <line x1="374.426259" y1="411.533744" x2="423.606591" y2="411.533744" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="427.541017" y="314.249307" width="570.491853" height="194.568758" rx="6.591063" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="712.786944" y="411.533744" font-size="24.820515" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">threading  or  asyncio</text>
  <text x="712.786944" y="443.961813" font-size="16.228845" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">GIL released during I/O waits</text>
  <rect x="40" y="545.878634" width="1200" height="74.121366" rx="6.591063" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.000052" y="575.527341" text-anchor="middle" font-size="17.18345" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">GIL: Global Interpreter Lock</text>
  <text x="640.000052" y="605.175819" text-anchor="middle" font-size="15.274129" fill="var(--text-muted)" font-family="Arial, sans-serif">Allows only one thread to execute Python bytecode at a time. Released during I/O system calls.</text>
</svg>

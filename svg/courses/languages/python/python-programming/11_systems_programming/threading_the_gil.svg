<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="568.8889" y="39.1111" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="#1565c0">Threading and the GIL</ns0:text>
  <ns0:rect x="26.6667" y="71.1111" width="302.2222" height="186.6667" rx="8.8889" fill="#fce4ec" stroke="#c62828" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="177.7778" y="177.7778" font-size="24.8889" font-weight="bold" fill="#c62828" text-anchor="middle">CPU-bound task</ns0:text>
  <ns0:text x="177.7778" y="213.3333" font-size="16" fill="#555555" text-anchor="middle">Heavy computation</ns0:text>
  <ns0:text x="177.7778" y="238.2222" font-size="16" fill="#555555" text-anchor="middle">Number crunching</ns0:text>
  <ns0:line x1="328.8889" y1="164.4444" x2="373.3333" y2="164.4444" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="376.8889" y="71.1111" width="355.5556" height="186.6667" rx="8.8889" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="554.6667" y="164.4444" font-size="23.1111" fill="#1565c0" text-anchor="middle" font-weight="bold">multiprocessing</ns0:text>
  <ns0:text x="554.6667" y="195.5556" font-size="15.1111" fill="#555555" text-anchor="middle">Bypasses GIL entirely</ns0:text>
  <ns0:text x="554.6667" y="222.2222" font-size="15.1111" fill="#555555" text-anchor="middle">True parallelism</ns0:text>
  <ns0:rect x="26.6667" y="302.2222" width="302.2222" height="186.6667" rx="8.8889" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="177.7778" y="404.4444" font-size="24.8889" font-weight="bold" fill="#2e7d32" text-anchor="middle">I/O-bound task</ns0:text>
  <ns0:text x="177.7778" y="440" font-size="16" fill="#555555" text-anchor="middle">Network, disk, DB</ns0:text>
  <ns0:line x1="328.8889" y1="395.5556" x2="373.3333" y2="395.5556" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="376.8889" y="302.2222" width="515.5556" height="186.6667" rx="8.8889" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="634.6667" y="395.5556" font-size="23.1111" fill="#1565c0" text-anchor="middle" font-weight="bold">threading  or  asyncio</ns0:text>
  <ns0:text x="634.6667" y="426.6667" font-size="15.1111" fill="#555555" text-anchor="middle">GIL released during I/O waits</ns0:text>
  <ns0:rect x="26.6667" y="524.4444" width="1084.4444" height="71.1111" rx="7.1111" fill="#f9f9f9" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="552.8889" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">GIL: Global Interpreter Lock</ns0:text>
  <ns0:text x="568.8889" y="581.3333" text-anchor="middle" font-size="14.2222" fill="#555555">Allows only one thread to execute Python bytecode at a time. Released during I/O system calls.</ns0:text>
</ns0:svg>
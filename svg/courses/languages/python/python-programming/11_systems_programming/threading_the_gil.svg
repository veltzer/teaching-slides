<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640.000052" y="40" text-anchor="middle" font-size="24.820515" font-weight="bold" fill="var(--primary-accent)">Threading and the GIL</text>
  <rect x="40" y="73.354638" width="334.426259" height="194.568758" rx="6.591063" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="207.213129" y="184.536802" font-size="26.729836" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">CPU-bound task</text>
  <text x="207.213129" y="221.597485" font-size="17.18345" fill="var(--text-muted)" text-anchor="middle">Heavy computation</text>
  <text x="207.213129" y="247.540032" font-size="17.18345" fill="var(--text-muted)" text-anchor="middle">Number crunching</text>
  <line x1="374.426259" y1="170.638959" x2="423.606591" y2="170.638959" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="427.541017" y="73.354638" width="393.442657" height="194.568758" rx="6.591063" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="624.262346" y="170.638959" font-size="24.820515" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">multiprocessing</text>
  <text x="624.262346" y="203.067258" font-size="16.228845" fill="var(--text-muted)" text-anchor="middle">Bypasses GIL entirely</text>
  <text x="624.262346" y="230.862713" font-size="16.228845" fill="var(--text-muted)" text-anchor="middle">True parallelism</text>
  <rect x="40" y="314.249307" width="334.426259" height="194.568758" rx="6.591063" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="207.213129" y="420.798742" font-size="26.729836" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">I/O-bound task</text>
  <text x="207.213129" y="457.85954" font-size="17.18345" fill="var(--text-muted)" text-anchor="middle">Network, disk, DB</text>
  <line x1="374.426259" y1="411.533744" x2="423.606591" y2="411.533744" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="427.541017" y="314.249307" width="570.491853" height="194.568758" rx="6.591063" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="712.786944" y="411.533744" font-size="24.820515" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">threading  or  asyncio</text>
  <text x="712.786944" y="443.961813" font-size="16.228845" fill="var(--text-muted)" text-anchor="middle">GIL released during I/O waits</text>
  <rect x="40" y="545.878634" width="1200" height="74.121366" rx="6.591063" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000052" y="575.527341" text-anchor="middle" font-size="17.18345" fill="var(--primary-accent)" font-weight="bold">GIL: Global Interpreter Lock</text>
  <text x="640.000052" y="605.175819" text-anchor="middle" font-size="15.274129" fill="var(--text-muted)">Allows only one thread to execute Python bytecode at a time. Released during I/O system calls.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="334.426259" height="206.440752057456" rx="6.78916909739" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="207.213129" y="157.966161615399" font-size="27.533248665581" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">CPU-bound task</text>
  <text x="207.213129" y="197.288174814881" font-size="17.699929089822" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Heavy computation</text>
  <text x="207.213129" y="224.813657158588" font-size="17.699929089822" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Number crunching</text>
  <line x1="374.426259" y1="143.220314489744" x2="423.606591" y2="143.220314489744" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="427.541017" y="40" width="393.442657" height="206.440752057456" rx="6.78916909739" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="624.262346" y="143.220314489744" font-size="25.566539633943" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">multiprocessing</text>
  <text x="624.262346" y="177.627289701582" font-size="16.716631742154" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Bypasses GIL entirely</text>
  <text x="624.262346" y="207.118738857973" font-size="16.716631742154" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">True parallelism</text>
  <rect x="40" y="295.59332930003" width="334.426259" height="206.440752057456" rx="6.78916909739" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="207.213129" y="408.644086876932" font-size="27.533248665581" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">I/O-bound task</text>
  <text x="207.213129" y="447.966222093365" font-size="17.699929089822" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Network, disk, DB</text>
  <line x1="374.426259" y1="398.813766867741" x2="423.606591" y2="398.813766867741" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="427.541017" y="295.59332930003" width="570.491853" height="206.440752057456" rx="6.78916909739" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="712.786944" y="398.813766867741" font-size="25.566539633943" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">threading  or  asyncio</text>
  <text x="712.786944" y="433.220498045678" font-size="16.716631742154" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">GIL released during I/O waits</text>
  <rect x="40" y="541.355973601035" width="1200" height="78.644026398965" rx="6.78916909739" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.000052" y="572.813754559945" text-anchor="middle" font-size="17.699929089822" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">GIL: Global Interpreter Lock</text>
  <text x="640.000052" y="604.271292545971" text-anchor="middle" font-size="15.733220058184" fill="var(--text-muted)" font-family="Arial, sans-serif">Allows only one thread to execute Python bytecode at a time. Released during I/O system calls.</text>
</svg>

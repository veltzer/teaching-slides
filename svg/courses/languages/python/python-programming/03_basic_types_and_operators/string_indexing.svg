<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="650" y="40" text-anchor="middle" font-size="25.605697" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">String Indexing: "Python"</text>
  <rect x="40" y="94.314491" width="190" height="193.979929" rx="6.799567" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="234" y="94.314491" width="190" height="193.979929" rx="6.799567" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="428" y="94.314491" width="190" height="193.979929" rx="6.799567" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="622" y="94.314491" width="190" height="193.979929" rx="6.799567" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="815.999893" y="94.314491" width="190" height="193.979929" rx="6.799567" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1010" y="94.314491" width="190" height="193.979929" rx="6.799567" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="220.401306" font-size="59.090053" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">P</text>
  <text x="329" y="220.401306" font-size="59.090053" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">y</text>
  <text x="523" y="220.401306" font-size="59.090053" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">t</text>
  <text x="716.999893" y="220.401306" font-size="59.090053" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">h</text>
  <text x="911" y="220.401306" font-size="59.090053" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">o</text>
  <text x="1104.999893" y="220.401306" font-size="59.090053" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">n</text>
  <text x="135" y="346.488362" font-size="33.484356" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">0</text>
  <text x="329" y="346.488362" font-size="33.484356" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">1</text>
  <text x="523" y="346.488362" font-size="33.484356" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">2</text>
  <text x="716.999893" y="346.488362" font-size="33.484356" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">3</text>
  <text x="911" y="346.488362" font-size="33.484356" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">4</text>
  <text x="1104.999893" y="346.488362" font-size="33.484356" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">5</text>
  <text x="135" y="443.478387" font-size="33.484356" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">-6</text>
  <text x="329" y="443.478387" font-size="33.484356" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">-5</text>
  <text x="523" y="443.478387" font-size="33.484356" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">-4</text>
  <text x="716.999893" y="443.478387" font-size="33.484356" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">-3</text>
  <text x="911" y="443.478387" font-size="33.484356" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">-2</text>
  <text x="1104.999893" y="443.478387" font-size="33.484356" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">-1</text>
  <text x="40" y="540.468291" font-size="25.605697" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">■ positive index</text>
  <text x="450" y="540.468291" font-size="25.605697" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">■ negative index</text>
  <rect x="40" y="569.565202" width="1200" height="50.434798" rx="6.799567" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650" y="600.60214" text-anchor="middle" font-size="17.727039" fill="var(--text)" font-family="Courier New, monospace">s = "Python"  |  s[0] == 'P'  |  s[-1] == 'n'  |  s[1:4] == 'yth'</text>
</svg>

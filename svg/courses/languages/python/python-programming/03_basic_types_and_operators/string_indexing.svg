<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="650" y="40" text-anchor="middle" font-size="25.605697" font-weight="bold" fill="var(--primary-accent)">String Indexing: "Python"</text>
  <rect x="40" y="94.314491" width="190" height="193.979929" rx="6.799567" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="234" y="94.314491" width="190" height="193.979929" rx="6.799567" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="428" y="94.314491" width="190" height="193.979929" rx="6.799567" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="622" y="94.314491" width="190" height="193.979929" rx="6.799567" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="815.999893" y="94.314491" width="190" height="193.979929" rx="6.799567" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1010" y="94.314491" width="190" height="193.979929" rx="6.799567" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="220.401306" font-size="59.090053" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="monospace">P</text>
  <text x="329" y="220.401306" font-size="59.090053" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="monospace">y</text>
  <text x="523" y="220.401306" font-size="59.090053" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="monospace">t</text>
  <text x="716.999893" y="220.401306" font-size="59.090053" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="monospace">h</text>
  <text x="911" y="220.401306" font-size="59.090053" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="monospace">o</text>
  <text x="1104.999893" y="220.401306" font-size="59.090053" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="monospace">n</text>
  <text x="135" y="346.488362" font-size="33.484356" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">0</text>
  <text x="329" y="346.488362" font-size="33.484356" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">1</text>
  <text x="523" y="346.488362" font-size="33.484356" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">2</text>
  <text x="716.999893" y="346.488362" font-size="33.484356" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">3</text>
  <text x="911" y="346.488362" font-size="33.484356" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">4</text>
  <text x="1104.999893" y="346.488362" font-size="33.484356" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">5</text>
  <text x="135" y="443.478387" font-size="33.484356" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">-6</text>
  <text x="329" y="443.478387" font-size="33.484356" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">-5</text>
  <text x="523" y="443.478387" font-size="33.484356" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">-4</text>
  <text x="716.999893" y="443.478387" font-size="33.484356" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">-3</text>
  <text x="911" y="443.478387" font-size="33.484356" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">-2</text>
  <text x="1104.999893" y="443.478387" font-size="33.484356" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">-1</text>
  <text x="40" y="540.468291" font-size="25.605697" fill="var(--primary-accent)" font-weight="bold">■ positive index</text>
  <text x="450" y="540.468291" font-size="25.605697" fill="var(--danger-accent)" font-weight="bold">■ negative index</text>
  <rect x="40" y="569.565202" width="1200" height="50.434798" rx="6.799567" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="650" y="600.60214" text-anchor="middle" font-size="17.727039" fill="var(--text)" font-family="monospace">s = "Python"  |  s[0] == 'P'  |  s[-1] == 'n'  |  s[1:4] == 'yth'</text>
</svg>
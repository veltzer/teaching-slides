<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">String Indexing: "Python"</text>
  <!-- Character cells -->
  <rect x="30" y="100" width="190" height="200" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <rect x="224" y="100" width="190" height="200" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <rect x="418" y="100" width="190" height="200" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5"/>
  <rect x="612" y="100" width="190" height="200" rx="4" fill="#fce4ec" stroke="#e53935" stroke-width="2.5"/>
  <rect x="806" y="100" width="190" height="200" rx="4" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2.5"/>
  <rect x="1000" y="100" width="190" height="200" rx="4" fill="#e0f7fa" stroke="#00838f" stroke-width="2.5"/>
  <!-- Characters -->
  <text x="125" y="230" font-size="60" font-weight="bold" fill="#222222" text-anchor="middle" font-family="monospace">P</text>
  <text x="319" y="230" font-size="60" font-weight="bold" fill="#222222" text-anchor="middle" font-family="monospace">y</text>
  <text x="513" y="230" font-size="60" font-weight="bold" fill="#222222" text-anchor="middle" font-family="monospace">t</text>
  <text x="707" y="230" font-size="60" font-weight="bold" fill="#222222" text-anchor="middle" font-family="monospace">h</text>
  <text x="901" y="230" font-size="60" font-weight="bold" fill="#222222" text-anchor="middle" font-family="monospace">o</text>
  <text x="1095" y="230" font-size="60" font-weight="bold" fill="#222222" text-anchor="middle" font-family="monospace">n</text>
  <!-- Positive indices -->
  <text x="125" y="360" font-size="34" fill="#1565c0" text-anchor="middle" font-weight="bold">0</text>
  <text x="319" y="360" font-size="34" fill="#1565c0" text-anchor="middle" font-weight="bold">1</text>
  <text x="513" y="360" font-size="34" fill="#1565c0" text-anchor="middle" font-weight="bold">2</text>
  <text x="707" y="360" font-size="34" fill="#1565c0" text-anchor="middle" font-weight="bold">3</text>
  <text x="901" y="360" font-size="34" fill="#1565c0" text-anchor="middle" font-weight="bold">4</text>
  <text x="1095" y="360" font-size="34" fill="#1565c0" text-anchor="middle" font-weight="bold">5</text>
  <!-- Negative indices -->
  <text x="125" y="460" font-size="34" fill="#c62828" text-anchor="middle" font-weight="bold">-6</text>
  <text x="319" y="460" font-size="34" fill="#c62828" text-anchor="middle" font-weight="bold">-5</text>
  <text x="513" y="460" font-size="34" fill="#c62828" text-anchor="middle" font-weight="bold">-4</text>
  <text x="707" y="460" font-size="34" fill="#c62828" text-anchor="middle" font-weight="bold">-3</text>
  <text x="901" y="460" font-size="34" fill="#c62828" text-anchor="middle" font-weight="bold">-2</text>
  <text x="1095" y="460" font-size="34" fill="#c62828" text-anchor="middle" font-weight="bold">-1</text>
  <!-- Legend -->
  <text x="30" y="560" font-size="26" fill="#1565c0" font-weight="bold">&#x25A0; positive index</text>
  <text x="440" y="560" font-size="26" fill="#c62828" font-weight="bold">&#x25A0; negative index</text>
  <!-- Example -->
  <rect x="30" y="590" width="1200" height="52" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="622" text-anchor="middle" font-size="18" fill="#333333" font-family="monospace">s = "Python"  |  s[0] == 'P'  |  s[-1] == 'n'  |  s[1:4] == 'yth'</text>
</svg>

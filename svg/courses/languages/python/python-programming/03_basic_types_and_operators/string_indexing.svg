<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="568.8889" y="39.1111" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--primary-accent)">String Indexing: "Python"</text>
  <rect x="26.6667" y="88.8889" width="168.8889" height="177.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="199.1111" y="88.8889" width="168.8889" height="177.7778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="371.5556" y="88.8889" width="168.8889" height="177.7778" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="544" y="88.8889" width="168.8889" height="177.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="716.4444" y="88.8889" width="168.8889" height="177.7778" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <rect x="888.8889" y="88.8889" width="168.8889" height="177.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="111.1111" y="204.4444" font-size="53.3333" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="monospace">P</text>
  <text x="283.5556" y="204.4444" font-size="53.3333" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="monospace">y</text>
  <text x="456" y="204.4444" font-size="53.3333" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="monospace">t</text>
  <text x="628.4444" y="204.4444" font-size="53.3333" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="monospace">h</text>
  <text x="800.8889" y="204.4444" font-size="53.3333" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="monospace">o</text>
  <text x="973.3333" y="204.4444" font-size="53.3333" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="monospace">n</text>
  <text x="111.1111" y="320" font-size="30.2222" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">0</text>
  <text x="283.5556" y="320" font-size="30.2222" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">1</text>
  <text x="456" y="320" font-size="30.2222" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">2</text>
  <text x="628.4444" y="320" font-size="30.2222" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">3</text>
  <text x="800.8889" y="320" font-size="30.2222" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">4</text>
  <text x="973.3333" y="320" font-size="30.2222" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">5</text>
  <text x="111.1111" y="408.8889" font-size="30.2222" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">-6</text>
  <text x="283.5556" y="408.8889" font-size="30.2222" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">-5</text>
  <text x="456" y="408.8889" font-size="30.2222" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">-4</text>
  <text x="628.4444" y="408.8889" font-size="30.2222" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">-3</text>
  <text x="800.8889" y="408.8889" font-size="30.2222" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">-2</text>
  <text x="973.3333" y="408.8889" font-size="30.2222" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">-1</text>
  <text x="26.6667" y="497.7778" font-size="23.1111" fill="var(--primary-accent)" font-weight="bold">■ positive index</text>
  <text x="391.1111" y="497.7778" font-size="23.1111" fill="var(--danger-accent)" font-weight="bold">■ negative index</text>
  <rect x="26.6667" y="524.4444" width="1066.6667" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="552.8889" text-anchor="middle" font-size="16" fill="var(--text)" font-family="monospace">s = "Python"  |  s[0] == 'P'  |  s[-1] == 'n'  |  s[1:4] == 'yth'</text>
</svg>
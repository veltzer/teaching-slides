<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="853.3333" height="480" fill="var(--code-bg)" rx="6"/>
  <path d="M 320 120 Q 373.3333 60 426.6667 120 L 426.6667 240 Q 426.6667 300 373.3333 300 L 266.6667 300 Q 213.3333 300 213.3333 240 L 213.3333 180" fill="none" stroke="var(--warn-border)" stroke-width="6.4" />
  <path d="M 533.3333 360 Q 480 420 426.6667 360 L 426.6667 240 Q 426.6667 180 480 180 L 586.6667 180 Q 640 180 640 240 L 640 300" fill="none" stroke="var(--primary-border)" stroke-width="6.4" />
  <circle cx="288" cy="156" r="12.8" fill="var(--warn-fill)" />
  <circle cx="565.3333" cy="324" r="12.8" fill="var(--primary-fill)" />
  <rect x="53.3333" y="60" width="170.6667" height="132" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.6" />
  <text x="69.3333" y="90" font-family="monospace" font-size="11.7333" fill="var(--danger-accent)">for</text>
  <text x="96" y="90" font-family="monospace" font-size="11.7333" fill="var(--bg)">i</text>
  <text x="106.6667" y="90" font-family="monospace" font-size="11.7333" fill="var(--danger-accent)">in</text>
  <text x="128" y="90" font-family="monospace" font-size="11.7333" fill="var(--warn-accent)">range</text>
  <text x="176" y="90" font-family="monospace" font-size="11.7333" fill="var(--bg)">(10):</text>
  <text x="85.3333" y="114" font-family="monospace" font-size="11.7333" fill="var(--warn-accent)">print</text>
  <text x="133.3333" y="114" font-family="monospace" font-size="11.7333" fill="var(--bg)">(i)</text>
  <text x="69.3333" y="150" font-family="monospace" font-size="11.7333" fill="var(--primary-accent)">list</text>
  <text x="106.6667" y="150" font-family="monospace" font-size="11.7333" fill="var(--bg)">= [1, 2, 3]</text>
  <text x="69.3333" y="174" font-family="monospace" font-size="11.7333" fill="var(--primary-accent)">dict</text>
  <text x="106.6667" y="174" font-family="monospace" font-size="11.7333" fill="var(--bg)">= {"a": 1}</text>
  <rect x="661.3333" y="60" width="138.6667" height="156" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.6" />
  <text x="693.3333" y="96" font-family="monospace" font-size="13.8667" fill="var(--ok-accent)">str</text>
  <text x="693.3333" y="120" font-family="monospace" font-size="13.8667" fill="var(--primary-accent)">int</text>
  <text x="693.3333" y="144" font-family="monospace" font-size="13.8667" fill="var(--warn-accent)">list</text>
  <text x="693.3333" y="168" font-family="monospace" font-size="13.8667" fill="var(--danger-accent)">dict</text>
  <text x="693.3333" y="192" font-family="monospace" font-size="13.8667" fill="var(--bg)">tuple</text>
  <rect x="53.3333" y="348" width="266.6667" height="96" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.6" />
  <text x="69.3333" y="378" font-family="monospace" font-size="13.8667" fill="var(--ok-accent)">&gt;&gt;&gt;</text>
  <text x="106.6667" y="378" font-family="monospace" font-size="13.8667" fill="var(--bg)">2 + 2</text>
  <text x="69.3333" y="408" font-family="monospace" font-size="13.8667" fill="var(--warn-accent)">4</text>
  <text x="69.3333" y="432" font-family="monospace" font-size="13.8667" fill="var(--ok-accent)">&gt;&gt;&gt;</text>
  <text x="661.3333" y="420" font-family="monospace" font-size="17.0667" fill="var(--primary-accent)">#!/usr/bin/env python</text>
</svg>
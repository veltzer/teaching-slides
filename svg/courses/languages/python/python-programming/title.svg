<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Python logo inspired dual curves -->
  <path d="M300,100 Q350,50 400,100 L400,200 Q400,250 350,250 L250,250 Q200,250 200,200 L200,150" fill="none" stroke="#ffd93d" stroke-width="6"/>
  <path d="M500,300 Q450,350 400,300 L400,200 Q400,150 450,150 L550,150 Q600,150 600,200 L600,250" fill="none" stroke="#53d8fb" stroke-width="6"/>
  <circle cx="270" cy="130" r="12" fill="#ffd93d"/>
  <circle cx="530" cy="270" r="12" fill="#53d8fb"/>
  <!-- Code snippets -->
  <rect x="50" y="50" width="160" height="110" rx="6" fill="#16213e" stroke="#0f3460" stroke-width="1.5"/>
  <text x="65" y="75" font-family="monospace" font-size="11" fill="#e94560">for</text>
  <text x="90" y="75" font-family="monospace" font-size="11" fill="white">i</text>
  <text x="100" y="75" font-family="monospace" font-size="11" fill="#e94560">in</text>
  <text x="120" y="75" font-family="monospace" font-size="11" fill="#ffd93d">range</text>
  <text x="165" y="75" font-family="monospace" font-size="11" fill="white">(10):</text>
  <text x="80" y="95" font-family="monospace" font-size="11" fill="#ffd93d">print</text>
  <text x="125" y="95" font-family="monospace" font-size="11" fill="white">(i)</text>
  <text x="65" y="125" font-family="monospace" font-size="11" fill="#53d8fb">list</text>
  <text x="100" y="125" font-family="monospace" font-size="11" fill="white">= [1, 2, 3]</text>
  <text x="65" y="145" font-family="monospace" font-size="11" fill="#53d8fb">dict</text>
  <text x="100" y="145" font-family="monospace" font-size="11" fill="white">= {"a": 1}</text>
  <!-- Data types -->
  <rect x="620" y="50" width="130" height="130" rx="6" fill="#16213e" stroke="#00b894" stroke-width="1.5"/>
  <text x="650" y="80" font-family="monospace" font-size="13" fill="#00b894">str</text>
  <text x="650" y="100" font-family="monospace" font-size="13" fill="#53d8fb">int</text>
  <text x="650" y="120" font-family="monospace" font-size="13" fill="#ffd93d">list</text>
  <text x="650" y="140" font-family="monospace" font-size="13" fill="#e94560">dict</text>
  <text x="650" y="160" font-family="monospace" font-size="13" fill="white">tuple</text>
  <!-- Interactive prompt -->
  <rect x="50" y="290" width="250" height="80" rx="6" fill="#16213e" stroke="#0f3460" stroke-width="1.5"/>
  <text x="65" y="315" font-family="monospace" font-size="13" fill="#00b894">&gt;&gt;&gt;</text>
  <text x="100" y="315" font-family="monospace" font-size="13" fill="white">2 + 2</text>
  <text x="65" y="340" font-family="monospace" font-size="13" fill="#ffd93d">4</text>
  <text x="65" y="360" font-family="monospace" font-size="13" fill="#00b894">&gt;&gt;&gt;</text>
  <!-- Decorative elements -->
  <text x="620" y="350" font-family="monospace" font-size="16" fill="#0f3460">#!/usr/bin/env python</text>
</svg>

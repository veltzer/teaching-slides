<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="888.8889" height="500" fill="var(--code-bg)" rx="6.25"/>
  <path d="M 528.8889 205 Q 584.4444 142.5 640.0001 205 L 640.0001 330 Q 640.0001 392.5 584.4444 392.5 L 473.3334 392.5 Q 417.7778 392.5 417.7778 330 L 417.7778 267.5" fill="none" stroke="var(--warn-border)" stroke-width="6.4" />
  <path d="M 751.1111 455 Q 695.5556 517.5 640.0001 455 L 640.0001 330 Q 640.0001 267.5 695.5556 267.5 L 806.6667 267.5 Q 862.2222 267.5 862.2222 330 L 862.2222 392.5" fill="none" stroke="var(--primary-border)" stroke-width="6.4" />
  <circle cx="495.5556" cy="242.5" r="13.3333" fill="var(--warn-fill)" />
  <circle cx="784.4444" cy="417.5" r="13.3333" fill="var(--primary-fill)" />
  <rect x="251.1111" y="142.5" width="177.7778" height="137.5" rx="6.25" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.6" />
  <text x="267.7778" y="173.75" font-family="monospace" font-size="12.2222" fill="var(--danger-accent)">for</text>
  <text x="295.5556" y="173.75" font-family="monospace" font-size="12.2222" fill="var(--bg)">i</text>
  <text x="306.6667" y="173.75" font-family="monospace" font-size="12.2222" fill="var(--danger-accent)">in</text>
  <text x="328.8889" y="173.75" font-family="monospace" font-size="12.2222" fill="var(--warn-accent)">range</text>
  <text x="378.8889" y="173.75" font-family="monospace" font-size="12.2222" fill="var(--bg)">(10):</text>
  <text x="284.4444" y="198.75" font-family="monospace" font-size="12.2222" fill="var(--warn-accent)">print</text>
  <text x="334.4444" y="198.75" font-family="monospace" font-size="12.2222" fill="var(--bg)">(i)</text>
  <text x="267.7778" y="236.25" font-family="monospace" font-size="12.2222" fill="var(--primary-accent)">list</text>
  <text x="306.6667" y="236.25" font-family="monospace" font-size="12.2222" fill="var(--bg)">= [1, 2, 3]</text>
  <text x="267.7778" y="261.25" font-family="monospace" font-size="12.2222" fill="var(--primary-accent)">dict</text>
  <text x="306.6667" y="261.25" font-family="monospace" font-size="12.2222" fill="var(--bg)">= {"a": 1}</text>
  <rect x="884.4444" y="142.5" width="144.4445" height="162.5" rx="6.25" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.6" />
  <text x="917.7778" y="180" font-family="monospace" font-size="14.4445" fill="var(--ok-accent)">str</text>
  <text x="917.7778" y="205" font-family="monospace" font-size="14.4445" fill="var(--primary-accent)">int</text>
  <text x="917.7778" y="230" font-family="monospace" font-size="14.4445" fill="var(--warn-accent)">list</text>
  <text x="917.7778" y="255" font-family="monospace" font-size="14.4445" fill="var(--danger-accent)">dict</text>
  <text x="917.7778" y="280" font-family="monospace" font-size="14.4445" fill="var(--bg)">tuple</text>
  <rect x="251.1111" y="442.5" width="277.7778" height="100" rx="6.25" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.6" />
  <text x="267.7778" y="473.75" font-family="monospace" font-size="14.4445" fill="var(--ok-accent)">&gt;&gt;&gt;</text>
  <text x="306.6667" y="473.75" font-family="monospace" font-size="14.4445" fill="var(--bg)">2 + 2</text>
  <text x="267.7778" y="505" font-family="monospace" font-size="14.4445" fill="var(--warn-accent)">4</text>
  <text x="267.7778" y="530" font-family="monospace" font-size="14.4445" fill="var(--ok-accent)">&gt;&gt;&gt;</text>
  <text x="884.4444" y="517.5" font-family="monospace" font-size="17.7778" fill="var(--primary-accent)">#!/usr/bin/env python</text>
</svg>
  <path d="M 964.2546 539.3549 Q 909.1057 596.9585 853.9566 539.3549 L 853.9566 424.1476 Q 853.9566 366.5438 909.1057 366.5438 L 1019.4039 366.5438 Q 1074.5529 366.5438 1074.5529 424.1476 L 1074.5529 481.7512" fill="none" stroke="var(--primary-border)" stroke-width="3.1652"/>
  <circle cx="710.569" cy="343.5023" r="12.7535" fill="var(--warn-fill)"/>
  <circle cx="997.3442" cy="504.7927" r="12.7535" fill="var(--primary-fill)"/>
  <rect x="467.9127" y="251.3364" width="176.4771" height="126.7282" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="0.7913"/>
  <text x="484.4576" y="280.1382" font-size="15.5759" fill="var(--danger-accent)" font-family="Courier New, monospace">for</text>
  <text x="512.0322" y="280.1382" font-size="15.5759" fill="var(--bg)" font-family="Courier New, monospace">i</text>
  <text x="523.062" y="280.1382" font-size="15.5759" fill="var(--danger-accent)" font-family="Courier New, monospace">in</text>
  <text x="545.1216" y="280.1382" font-size="15.5759" fill="var(--warn-accent)" font-family="Courier New, monospace">range</text>
  <text x="594.7557" y="280.1382" font-size="15.5759" fill="var(--bg)" font-family="Courier New, monospace">(10):</text>
  <text x="501.0022" y="303.1798" font-size="15.5759" fill="var(--warn-accent)" font-family="Courier New, monospace">print</text>
  <text x="550.6365" y="303.1798" font-size="15.5759" fill="var(--bg)" font-family="Courier New, monospace">(i)</text>
  <text x="484.4576" y="337.742" font-size="15.5759" fill="var(--primary-accent)" font-family="Courier New, monospace">list</text>
  <text x="523.062" y="337.742" font-size="15.5759" fill="var(--bg)" font-family="Courier New, monospace">= [1, 2, 3]</text>
  <text x="484.4576" y="360.7833" font-size="15.5759" fill="var(--primary-accent)" font-family="Courier New, monospace">dict</text>
  <text x="523.062" y="360.7833" font-size="15.5759" fill="var(--bg)" font-family="Courier New, monospace">= {"a": 1}</text>
  <rect x="1096.6124" y="251.3364" width="143.3876" height="149.7695" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="0.7913"/>
  <text x="1129.702" y="285.8987" font-size="15.5759" fill="var(--ok-accent)" font-family="Courier New, monospace">str</text>
  <text x="1129.702" y="308.9402" font-size="15.5759" fill="var(--primary-accent)" font-family="Courier New, monospace">int</text>
  <text x="1129.702" y="331.9816" font-size="15.5759" fill="var(--warn-accent)" font-family="Courier New, monospace">list</text>
  <text x="1129.702" y="355.0231" font-size="15.5759" fill="var(--danger-accent)" font-family="Courier New, monospace">dict</text>
  <text x="1129.702" y="378.0647" font-size="15.5759" fill="var(--bg)" font-family="Courier New, monospace">tuple</text>
  <rect x="467.9127" y="527.8341" width="275.7455" height="92.1659" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="0.7913"/>
  <text x="484.4576" y="556.6361" font-size="15.5759" fill="var(--ok-accent)" font-family="Courier New, monospace">&gt;&gt;&gt;</text>
  <text x="523.062" y="556.6361" font-size="15.5759" fill="var(--bg)" font-family="Courier New, monospace">2 + 2</text>
  <text x="484.4576" y="585.4379" font-size="15.5759" fill="var(--warn-accent)" font-family="Courier New, monospace">4</text>
  <text x="484.4576" y="608.4793" font-size="15.5759" fill="var(--ok-accent)" font-family="Courier New, monospace">&gt;&gt;&gt;</text>
  <text x="1096.6124" y="596.9585" font-size="17.0046" fill="var(--primary-accent)" font-family="Courier New, monospace">#!/usr/bin/env python</text>
  </g>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Python Programming</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Your First Programming Language</text>
</svg>

  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="26.6667" y="40.8889" font-size="19.5556" fill="#222222" font-family="monospace">reduce(lambda a, b: a + b, [1, 2, 3, 4, 5])</ns0:text>

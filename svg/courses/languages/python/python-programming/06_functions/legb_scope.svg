<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="35.5556" y="17.7778" width="657.7778" height="515.5556" rx="8.8889" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.7778" />
  <ns0:text x="53.3333" y="44.4444" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#9e9e9e">B — Built-in</ns0:text>
  <ns0:text x="53.3333" y="64" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">len, print, range, type, open, …</ns0:text>
  <ns0:rect x="71.1111" y="80" width="586.6667" height="408.8889" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="88.8889" y="106.6667" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#1565c0">G — Global (module level)</ns0:text>
  <ns0:text x="88.8889" y="126.2222" font-family="monospace" font-size="12.4444" fill="#1565c0">x = 10   # module variable</ns0:text>
  <ns0:rect x="106.6667" y="142.2222" width="515.5556" height="311.1111" rx="7.1111" fill="#ffffff" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="124.4444" y="168.8889" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#1565c0">E — Enclosing (outer function)</ns0:text>
  <ns0:text x="124.4444" y="188.4444" font-family="monospace" font-size="12.4444" fill="#555555">def outer():</ns0:text>
  <ns0:text x="142.2222" y="206.2222" font-family="monospace" font-size="12.4444" fill="#555555">    y = 20   # enclosing var</ns0:text>
  <ns0:rect x="142.2222" y="220.4444" width="444.4444" height="204.4444" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="160" y="247.1111" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">L — Local (innermost function)</ns0:text>
  <ns0:text x="160" y="268.4444" font-family="monospace" font-size="12.4444" fill="#bbdefb">    def inner():</ns0:text>
  <ns0:text x="177.7778" y="286.2222" font-family="monospace" font-size="12.4444" fill="#ffffff">        z = 30   # local var</ns0:text>
  <ns0:text x="177.7778" y="307.5556" font-family="monospace" font-size="12.4444" fill="#ffffff">        print(z)  # local   ✓</ns0:text>
  <ns0:text x="177.7778" y="327.1111" font-family="monospace" font-size="12.4444" fill="#ffffff">        print(y)  # enclosing ✓</ns0:text>
  <ns0:text x="177.7778" y="346.6667" font-family="monospace" font-size="12.4444" fill="#ffffff">        print(x)  # global  ✓</ns0:text>
  <ns0:text x="177.7778" y="366.2222" font-family="monospace" font-size="12.4444" fill="#ffffff">        print(len) # built-in ✓</ns0:text>
  <ns0:text x="160" y="410.6667" font-family="sans-serif" font-size="12.4444" fill="#bbdefb" font-style="italic">Python searches L → E → G → B</ns0:text>
  <ns0:text x="755.5556" y="44.4444" font-family="sans-serif" font-size="16" font-weight="bold" fill="#212121">Name lookup order</ns0:text>
  <ns0:rect x="746.6667" y="60.4444" width="355.5556" height="49.7778" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="924.4444" y="90.6667" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1. Local</ns0:text>
  <ns0:line x1="924.4444" y1="112" x2="924.4444" y2="138.6667" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="746.6667" y="140.4444" width="355.5556" height="49.7778" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="924.4444" y="170.6667" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#212121">2. Enclosing</ns0:text>
  <ns0:line x1="924.4444" y1="192" x2="924.4444" y2="218.6667" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="746.6667" y="220.4444" width="355.5556" height="49.7778" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="924.4444" y="250.6667" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#212121">3. Global</ns0:text>
  <ns0:line x1="924.4444" y1="272" x2="924.4444" y2="298.6667" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="746.6667" y="300.4444" width="355.5556" height="49.7778" rx="5.3333" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="924.4444" y="330.6667" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9e9e9e">4. Built-in</ns0:text>
  <ns0:line x1="924.4444" y1="352" x2="924.4444" y2="378.6667" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="746.6667" y="380.4444" width="355.5556" height="49.7778" rx="5.3333" fill="#ffebee" stroke="#c62828" stroke-width="1.3333" />
  <ns0:text x="924.4444" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c62828">NameError</ns0:text>
  <ns0:rect x="746.6667" y="453.3333" width="355.5556" height="80" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="924.4444" y="476.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#1565c0">Override scope for assignment:</ns0:text>
  <ns0:text x="764.4444" y="497.7778" font-family="monospace" font-size="12.4444" fill="#212121">global x      # write to global x</ns0:text>
  <ns0:text x="764.4444" y="517.3333" font-family="monospace" font-size="12.4444" fill="#212121">nonlocal y    # write to enclosing y</ns0:text>
</ns0:svg>
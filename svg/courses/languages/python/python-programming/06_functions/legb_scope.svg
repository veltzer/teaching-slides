<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="77.5" y="56.1111" width="693.75" height="467.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="96.25" y="80.2777" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--text-faint)">B — Built-in</text>
  <text x="96.25" y="98" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">len, print, range, type, open, …</text>
  <rect x="115" y="112.5" width="618.75" height="370.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="133.75" y="136.6667" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">G — Global (module level)</text>
  <text x="133.75" y="154.3889" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">x = 10   # module variable</text>
  <rect x="152.5" y="168.8889" width="543.75" height="281.9444" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="171.25" y="193.0556" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">E — Enclosing (outer function)</text>
  <text x="171.25" y="210.7777" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">def outer():</text>
  <text x="190" y="226.8889" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">    y = 20   # enclosing var</text>
  <rect x="190" y="239.7777" width="468.7499" height="185.2777" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="208.75" y="263.9444" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">L — Local (innermost function)</text>
  <text x="208.75" y="283.2777" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">    def inner():</text>
  <text x="227.5" y="299.3889" font-family="monospace" font-size="12.1663" fill="var(--bg)">        z = 30   # local var</text>
  <text x="227.5" y="318.7223" font-family="monospace" font-size="12.1663" fill="var(--bg)">        print(z)  # local   ✓</text>
  <text x="227.5" y="336.4444" font-family="monospace" font-size="12.1663" fill="var(--bg)">        print(y)  # enclosing ✓</text>
  <text x="227.5" y="354.1667" font-family="monospace" font-size="12.1663" fill="var(--bg)">        print(x)  # global  ✓</text>
  <text x="227.5" y="371.8889" font-family="monospace" font-size="12.1663" fill="var(--bg)">        print(len) # built-in ✓</text>
  <text x="208.75" y="412.1667" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)" font-style="italic">Python searches L → E → G → B</text>
  <text x="836.875" y="80.2777" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Name lookup order</text>
  <rect x="827.5" y="94.7777" width="375" height="45.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1014.9999" y="122.1667" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--bg)">1. Local</text>
  <line x1="1014.9999" y1="141.5" x2="1014.9999" y2="165.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="827.5" y="167.2777" width="375" height="45.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1014.9999" y="194.6667" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text)">2. Enclosing</text>
  <line x1="1014.9999" y1="214" x2="1014.9999" y2="238.1667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="827.5" y="239.7777" width="375" height="45.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1014.9999" y="267.1667" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text)">3. Global</text>
  <line x1="1014.9999" y1="286.5" x2="1014.9999" y2="310.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="827.5" y="312.2777" width="375" height="45.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1014.9999" y="339.6667" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text-faint)">4. Built-in</text>
  <line x1="1014.9999" y1="359" x2="1014.9999" y2="383.1667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="827.5" y="384.7777" width="375" height="45.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1014.9999" y="412.1667" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--danger-accent)">NameError</text>
  <rect x="827.5" y="450.8333" width="375" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1014.9999" y="471.7777" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">Override scope for assignment:</text>
  <text x="846.2499" y="491.1111" font-family="monospace" font-size="12.1663" fill="var(--text)">global x      # write to global x</text>
  <text x="846.2499" y="508.8333" font-family="monospace" font-size="12.1663" fill="var(--text)">nonlocal y    # write to enclosing y</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- 4 nested rectangles: B(uilt-in) → G(lobal) → E(nclosing) → L(ocal) -->

  <!-- Built-in (outermost) -->
  <rect x="40" y="20" width="740" height="580" rx="10" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="2"/>
  <text x="60" y="50" font-family="sans-serif" font-size="20" font-weight="bold" fill="#9e9e9e">B — Built-in</text>
  <text x="60" y="72" font-family="sans-serif" font-size="14" fill="#9e9e9e">len, print, range, type, open, …</text>

  <!-- Global -->
  <rect x="80" y="90" width="660" height="460" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="100" y="120" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1565c0">G — Global (module level)</text>
  <text x="100" y="142" font-family="monospace" font-size="14" fill="#1565c0">x = 10   # module variable</text>

  <!-- Enclosing -->
  <rect x="120" y="160" width="580" height="350" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="140" y="190" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1565c0">E — Enclosing (outer function)</text>
  <text x="140" y="212" font-family="monospace" font-size="14" fill="#555555">def outer():</text>
  <text x="160" y="232" font-family="monospace" font-size="14" fill="#555555">    y = 20   # enclosing var</text>

  <!-- Local -->
  <rect x="160" y="248" width="500" height="230" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="180" y="278" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">L — Local (innermost function)</text>
  <text x="180" y="302" font-family="monospace" font-size="14" fill="#bbdefb">    def inner():</text>
  <text x="200" y="322" font-family="monospace" font-size="14" fill="#ffffff">        z = 30   # local var</text>
  <text x="200" y="346" font-family="monospace" font-size="14" fill="#ffffff">        print(z)  # local   ✓</text>
  <text x="200" y="368" font-family="monospace" font-size="14" fill="#ffffff">        print(y)  # enclosing ✓</text>
  <text x="200" y="390" font-family="monospace" font-size="14" fill="#ffffff">        print(x)  # global  ✓</text>
  <text x="200" y="412" font-family="monospace" font-size="14" fill="#ffffff">        print(len) # built-in ✓</text>
  <text x="180" y="462" font-family="sans-serif" font-size="14" fill="#bbdefb" font-style="italic">Python searches L → E → G → B</text>

  <!-- Search order arrow (right side) -->
  <text x="850" y="50" font-family="sans-serif" font-size="18" font-weight="bold" fill="#212121">Name lookup order</text>
  <rect x="840" y="68" width="400" height="56" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1040" y="102" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">1. Local</text>

  <line x1="1040" y1="126" x2="1040" y2="156" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="840" y="158" width="400" height="56" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1040" y="192" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#212121">2. Enclosing</text>

  <line x1="1040" y1="216" x2="1040" y2="246" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="840" y="248" width="400" height="56" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1040" y="282" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#212121">3. Global</text>

  <line x1="1040" y1="306" x2="1040" y2="336" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="840" y="338" width="400" height="56" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1040" y="372" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9e9e9e">4. Built-in</text>

  <line x1="1040" y1="396" x2="1040" y2="426" stroke="#555555" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="840" y="428" width="400" height="56" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="1040" y="462" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#c62828">NameError</text>

  <!-- global / nonlocal keywords -->
  <rect x="840" y="510" width="400" height="90" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1040" y="536" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Override scope for assignment:</text>
  <text x="860"  y="560" font-family="monospace" font-size="14" fill="#212121">global x      # write to global x</text>
  <text x="860"  y="582" font-family="monospace" font-size="14" fill="#212121">nonlocal y    # write to enclosing y</text>
</svg>

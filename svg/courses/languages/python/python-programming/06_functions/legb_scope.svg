<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="740" height="580" rx="6.904271" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="60" y="69.999912" font-family="sans-serif" font-size="20.000062" font-weight="bold" fill="var(--text-faint)">B — Built-in</text>
  <text x="60" y="92.000005" font-family="sans-serif" font-size="13.999905" fill="var(--text-faint)">len, print, range, type, open, …</text>
  <rect x="80" y="110.000002" width="660" height="459.999979" rx="6.904271" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="140.000039" font-family="sans-serif" font-size="20.000062" font-weight="bold" fill="var(--primary-accent)">G — Global (module level)</text>
  <text x="100" y="162.000007" font-family="monospace" font-size="13.999905" fill="var(--primary-accent)">x = 10   # module variable</text>
  <rect x="120" y="180.000004" width="580" height="349.999887" rx="6.904271" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="140" y="210.000041" font-family="sans-serif" font-size="20.000062" font-weight="bold" fill="var(--primary-accent)">E — Enclosing (outer function)</text>
  <text x="140" y="231.999885" font-family="monospace" font-size="13.999905" fill="var(--text-muted)">def outer():</text>
  <text x="160" y="251.999992" font-family="monospace" font-size="13.999905" fill="var(--text-muted)">    y = 20   # enclosing var</text>
  <rect x="160" y="267.999879" width="499.999893" height="229.999865" rx="6.904271" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="297.999916" font-family="sans-serif" font-size="20.000062" font-weight="bold" fill="var(--bg)">L — Local (innermost function)</text>
  <text x="180" y="321.99987" font-family="monospace" font-size="13.999905" fill="var(--primary-accent)">    def inner():</text>
  <text x="200" y="341.999977" font-family="monospace" font-size="13.999905" fill="var(--bg)">        z = 30   # local var</text>
  <text x="200" y="366.000056" font-family="monospace" font-size="13.999905" fill="var(--bg)">        print(z)  # local   ✓</text>
  <text x="200" y="387.999901" font-family="monospace" font-size="13.999905" fill="var(--bg)">        print(y)  # enclosing ✓</text>
  <text x="200" y="409.999994" font-family="monospace" font-size="13.999905" fill="var(--bg)">        print(x)  # global  ✓</text>
  <text x="200" y="431.999962" font-family="monospace" font-size="13.999905" fill="var(--bg)">        print(len) # built-in ✓</text>
  <text x="180" y="481.999982" font-family="sans-serif" font-size="13.999905" fill="var(--primary-accent)" font-style="italic">Python searches L → E → G → B</text>
  <text x="850" y="69.999912" font-family="sans-serif" font-size="18.00001" font-weight="bold" fill="var(--text)">Name lookup order</text>
  <rect x="840" y="87.999909" width="400" height="55.999977" rx="6.904271" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1039.999893" y="122.000042" text-anchor="middle" font-family="sans-serif" font-size="18.00001" font-weight="bold" fill="var(--bg)">1. Local</text>
  <line x1="1039.999893" y1="145.999996" x2="1039.999893" y2="176.000033" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="840" y="177.999894" width="400" height="55.999977" rx="6.904271" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1039.999893" y="212.000027" text-anchor="middle" font-family="sans-serif" font-size="18.00001" fill="var(--text)">2. Enclosing</text>
  <line x1="1039.999893" y1="235.999981" x2="1039.999893" y2="266.000018" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="840" y="267.999879" width="400" height="55.999977" rx="6.904271" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1039.999893" y="302.000012" text-anchor="middle" font-family="sans-serif" font-size="18.00001" fill="var(--text)">3. Global</text>
  <line x1="1039.999893" y1="325.999966" x2="1039.999893" y2="356.000003" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="840" y="357.999864" width="400" height="55.999977" rx="6.904271" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1039.999893" y="391.999997" text-anchor="middle" font-family="sans-serif" font-size="18.00001" fill="var(--text-faint)">4. Built-in</text>
  <line x1="1039.999893" y1="415.999951" x2="1039.999893" y2="445.999988" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="840" y="447.999849" width="400" height="55.999977" rx="6.904271" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1039.999893" y="481.999982" text-anchor="middle" font-family="sans-serif" font-size="18.00001" fill="var(--danger-accent)">NameError</text>
  <rect x="840" y="529.999891" width="400" height="89.999985" rx="6.904271" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1039.999893" y="555.999831" text-anchor="middle" font-family="sans-serif" font-size="14.999989" font-weight="bold" fill="var(--primary-accent)">Override scope for assignment:</text>
  <text x="859.999893" y="579.99991" font-family="monospace" font-size="13.999905" fill="var(--text)">global x      # write to global x</text>
  <text x="859.999893" y="601.999879" font-family="monospace" font-size="13.999905" fill="var(--text)">nonlocal y    # write to enclosing y</text>
</svg>
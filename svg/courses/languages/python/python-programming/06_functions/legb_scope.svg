<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="35.5556" y="17.7778" width="657.7778" height="515.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="53.3333" y="44.4444" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--text-faint)">B — Built-in</text>
  <text x="53.3333" y="64" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">len, print, range, type, open, …</text>
  <rect x="71.1111" y="80" width="586.6667" height="408.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="88.8889" y="106.6667" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">G — Global (module level)</text>
  <text x="88.8889" y="126.2222" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">x = 10   # module variable</text>
  <rect x="106.6667" y="142.2222" width="515.5556" height="311.1111" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" />
  <text x="124.4444" y="168.8889" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">E — Enclosing (outer function)</text>
  <text x="124.4444" y="188.4444" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">def outer():</text>
  <text x="142.2222" y="206.2222" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">    y = 20   # enclosing var</text>
  <rect x="142.2222" y="220.4444" width="444.4444" height="204.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="160" y="247.1111" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">L — Local (innermost function)</text>
  <text x="160" y="268.4444" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">    def inner():</text>
  <text x="177.7778" y="286.2222" font-family="monospace" font-size="12.4444" fill="var(--bg)">        z = 30   # local var</text>
  <text x="177.7778" y="307.5556" font-family="monospace" font-size="12.4444" fill="var(--bg)">        print(z)  # local   ✓</text>
  <text x="177.7778" y="327.1111" font-family="monospace" font-size="12.4444" fill="var(--bg)">        print(y)  # enclosing ✓</text>
  <text x="177.7778" y="346.6667" font-family="monospace" font-size="12.4444" fill="var(--bg)">        print(x)  # global  ✓</text>
  <text x="177.7778" y="366.2222" font-family="monospace" font-size="12.4444" fill="var(--bg)">        print(len) # built-in ✓</text>
  <text x="160" y="410.6667" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)" font-style="italic">Python searches L → E → G → B</text>
  <text x="755.5556" y="44.4444" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Name lookup order</text>
  <rect x="746.6667" y="60.4444" width="355.5556" height="49.7778" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="924.4444" y="90.6667" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">1. Local</text>
  <line x1="924.4444" y1="112" x2="924.4444" y2="138.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="746.6667" y="140.4444" width="355.5556" height="49.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="924.4444" y="170.6667" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--text)">2. Enclosing</text>
  <line x1="924.4444" y1="192" x2="924.4444" y2="218.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="746.6667" y="220.4444" width="355.5556" height="49.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="924.4444" y="250.6667" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--text)">3. Global</text>
  <line x1="924.4444" y1="272" x2="924.4444" y2="298.6667" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="746.6667" y="300.4444" width="355.5556" height="49.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="924.4444" y="330.6667" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--text-faint)">4. Built-in</text>
  <line x1="924.4444" y1="352" x2="924.4444" y2="378.6667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="746.6667" y="380.4444" width="355.5556" height="49.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="924.4444" y="410.6667" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--danger-accent)">NameError</text>
  <rect x="746.6667" y="453.3333" width="355.5556" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="924.4444" y="476.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">Override scope for assignment:</text>
  <text x="764.4444" y="497.7778" font-family="monospace" font-size="12.4444" fill="var(--text)">global x      # write to global x</text>
  <text x="764.4444" y="517.3333" font-family="monospace" font-size="12.4444" fill="var(--text)">nonlocal y    # write to enclosing y</text>
</svg>
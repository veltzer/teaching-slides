<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="740" height="580" rx="6.904271" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="69.999912" font-size="20.000062" font-weight="bold" fill="var(--text-faint)" font-family="Arial, sans-serif">B — Built-in</text>
  <text x="60" y="92.000005" font-size="13.999905" fill="var(--text-faint)" font-family="Arial, sans-serif">len, print, range, type, open, …</text>
  <rect x="80" y="110.000002" width="660" height="459.999979" rx="6.904271" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="140.000039" font-size="20.000062" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">G — Global (module level)</text>
  <text x="100" y="162.000007" font-size="13.999905" fill="var(--primary-accent)" font-family="Courier New, monospace">x = 10   # module variable</text>
  <rect x="120" y="180.000004" width="580" height="349.999887" rx="6.904271" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333"/>
  <text x="140" y="210.000041" font-size="20.000062" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">E — Enclosing (outer function)</text>
  <text x="140" y="231.999885" font-size="13.999905" fill="var(--text-muted)" font-family="Courier New, monospace">def outer():</text>
  <text x="160" y="251.999992" font-size="13.999905" fill="var(--text-muted)" font-family="Courier New, monospace">    y = 20   # enclosing var</text>
  <rect x="160" y="267.999879" width="499.999893" height="229.999865" rx="6.904271" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="297.999916" font-size="20.000062" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">L — Local (innermost function)</text>
  <text x="180" y="321.99987" font-size="13.999905" fill="var(--primary-accent)" font-family="Courier New, monospace">    def inner():</text>
  <text x="200" y="341.999977" font-size="13.999905" fill="var(--bg)" font-family="Courier New, monospace">        z = 30   # local var</text>
  <text x="200" y="366.000056" font-size="13.999905" fill="var(--bg)" font-family="Courier New, monospace">        print(z)  # local   ✓</text>
  <text x="200" y="387.999901" font-size="13.999905" fill="var(--bg)" font-family="Courier New, monospace">        print(y)  # enclosing ✓</text>
  <text x="200" y="409.999994" font-size="13.999905" fill="var(--bg)" font-family="Courier New, monospace">        print(x)  # global  ✓</text>
  <text x="200" y="431.999962" font-size="13.999905" fill="var(--bg)" font-family="Courier New, monospace">        print(len) # built-in ✓</text>
  <text x="180" y="481.999982" font-size="13.999905" fill="var(--primary-accent)" font-style="italic" font-family="Arial, sans-serif">Python searches L → E → G → B</text>
  <text x="850" y="69.999912" font-size="18.00001" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Name lookup order</text>
  <rect x="840" y="87.999909" width="400" height="55.999977" rx="6.904271" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1039.999893" y="122.000042" text-anchor="middle" font-size="18.00001" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">1. Local</text>
  <line x1="1039.999893" y1="145.999996" x2="1039.999893" y2="176.000033" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="840" y="177.999894" width="400" height="55.999977" rx="6.904271" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1039.999893" y="212.000027" text-anchor="middle" font-size="18.00001" fill="var(--text)" font-family="Arial, sans-serif">2. Enclosing</text>
  <line x1="1039.999893" y1="235.999981" x2="1039.999893" y2="266.000018" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="840" y="267.999879" width="400" height="55.999977" rx="6.904271" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1039.999893" y="302.000012" text-anchor="middle" font-size="18.00001" fill="var(--text)" font-family="Arial, sans-serif">3. Global</text>
  <line x1="1039.999893" y1="325.999966" x2="1039.999893" y2="356.000003" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="840" y="357.999864" width="400" height="55.999977" rx="6.904271" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1039.999893" y="391.999997" text-anchor="middle" font-size="18.00001" fill="var(--text-faint)" font-family="Arial, sans-serif">4. Built-in</text>
  <line x1="1039.999893" y1="415.999951" x2="1039.999893" y2="445.999988" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="840" y="447.999849" width="400" height="55.999977" rx="6.904271" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1039.999893" y="481.999982" text-anchor="middle" font-size="18.00001" fill="var(--danger-accent)" font-family="Arial, sans-serif">NameError</text>
  <rect x="840" y="529.999891" width="400" height="89.999985" rx="6.904271" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1039.999893" y="555.999831" text-anchor="middle" font-size="14.999989" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Override scope for assignment:</text>
  <text x="859.999893" y="579.99991" font-size="13.999905" fill="var(--text)" font-family="Courier New, monospace">global x      # write to global x</text>
  <text x="859.999893" y="601.999879" font-size="13.999905" fill="var(--text)" font-family="Courier New, monospace">nonlocal y    # write to enclosing y</text>
</svg>

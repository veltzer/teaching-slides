<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="29.600354" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dependency Conflict Problem:</text>
  <rect x="40" y="87.508579" width="511.475455" height="158.361807" rx="6.812301" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="295.737727" y="154.812246" font-size="27.627058" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Project A</text>
  <text x="295.737727" y="210.23886" font-size="23.680238" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">requests==2.28</text>
  <rect x="600.655787" y="87.508579" width="511.475455" height="158.361807" rx="6.812301" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="856.393409" y="154.812246" font-size="27.627058" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Project B</text>
  <text x="856.393409" y="210.23886" font-size="23.680238" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">requests==2.31</text>
  <rect x="319.344287" y="334.948772" width="511.475455" height="158.361807" rx="6.812301" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.8889 6.2222" filter="url(#shadow)"/>
  <text x="575.082014" y="404.23207" font-size="27.627058" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">System Python</text>
  <text x="575.082014" y="451.740649" font-size="23.680238" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">??? conflict!</text>
  <rect x="40" y="536.860018" width="1200" height="83.139982" rx="6.812301" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000052" y="572.491421" text-anchor="middle" font-size="19.733645" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Solution: Use virtual environments (venv) to isolate dependencies per project</text>
  <text x="640.000052" y="604.16393" text-anchor="middle" font-size="16.773587" fill="var(--text-muted)" font-family="Arial, sans-serif">python -m venv myenv  |  source myenv/bin/activate  |  pip install requests==2.28</text>
</svg>

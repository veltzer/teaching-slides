<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <line x1="568.8889" y1="17.7778" x2="568.8889" y2="533.3333" stroke="var(--border)" stroke-width="1.6" stroke-dasharray="7.1111 7.1111" />
  <text x="80" y="46.2222" font-size="24.8889" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">break</text>
  <text x="80" y="76.4444" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">(exits loop entirely)</text>
  <rect x="26.6667" y="97.7778" width="480" height="337.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="49.7778" y="151.1111" font-size="19.5556" fill="var(--text)" font-family="monospace">for item in items:</text>
  <text x="49.7778" y="195.5556" font-size="19.5556" fill="var(--text)" font-family="monospace">    ...</text>
  <text x="49.7778" y="240" font-size="19.5556" fill="var(--danger-accent)" font-family="monospace">    if cond:</text>
  <text x="49.7778" y="284.4444" font-size="19.5556" fill="var(--danger-accent)" font-family="monospace">        break</text>
  <text x="49.7778" y="328.8889" font-size="19.5556" fill="var(--text-faint)" font-family="monospace">    ...  ← skipped</text>
  <text x="49.7778" y="373.3333" font-size="19.5556" fill="var(--text-faint)" font-family="monospace">(loop exits here)</text>
  <text x="49.7778" y="417.7778" font-size="17.7778" fill="var(--text-muted)">Everything after break is skipped.</text>
  <text x="853.3333" y="46.2222" font-size="24.8889" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">continue</text>
  <text x="853.3333" y="76.4444" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">(skips to next iteration)</text>
  <rect x="595.5556" y="97.7778" width="515.5556" height="337.7778" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="618.6667" y="151.1111" font-size="19.5556" fill="var(--text)" font-family="monospace">for item in items:</text>
  <text x="618.6667" y="195.5556" font-size="19.5556" fill="var(--text)" font-family="monospace">    ...</text>
  <text x="618.6667" y="240" font-size="19.5556" fill="var(--primary-accent)" font-family="monospace">    if cond:</text>
  <text x="618.6667" y="284.4444" font-size="19.5556" fill="var(--primary-accent)" font-family="monospace">        continue</text>
  <text x="618.6667" y="328.8889" font-size="19.5556" fill="var(--text)" font-family="monospace">    ...  ← this runs</text>
  <text x="618.6667" y="373.3333" font-size="19.5556" fill="var(--text-muted)" font-family="monospace">(next iteration)</text>
  <text x="618.6667" y="417.7778" font-size="17.7778" fill="var(--text-muted)">Code after continue is skipped for this iter.</text>
  <rect x="26.6667" y="480" width="1084.4444" height="46.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="568.8889" y="508.4444" text-anchor="middle" font-size="15.1111" fill="var(--primary-accent)">Both work inside for and while loops. break is more disruptive than continue.</text>
</svg>
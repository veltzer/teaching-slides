<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <line x1="640" y1="40" x2="640" y2="620" stroke="var(--border)" stroke-width="1.6" stroke-dasharray="7.1111 7.1111" />
  <text x="99.016393" y="72.000029" font-size="27.769587" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">break</text>
  <text x="99.016393" y="105.99992" font-size="19.835452" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(exits loop entirely)</text>
  <rect x="40" y="130.000004" width="531.147541" height="380.000004" rx="6.847445" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="65.57377" y="189.999966" font-size="21.818928" fill="var(--text)" font-family="Courier New, monospace">for item in items:</text>
  <text x="65.57377" y="240.00012" font-size="21.818928" fill="var(--text)" font-family="Courier New, monospace">    ...</text>
  <text x="65.57377" y="290.000026" font-size="21.818928" fill="var(--danger-accent)" font-family="Courier New, monospace">    if cond:</text>
  <text x="65.57377" y="339.999932" font-size="21.818928" fill="var(--danger-accent)" font-family="Courier New, monospace">        break</text>
  <text x="65.57377" y="390.000086" font-size="21.818928" fill="var(--text-faint)" font-family="Courier New, monospace">    ...  ← skipped</text>
  <text x="65.57377" y="439.999991" font-size="21.818928" fill="var(--text-faint)" font-family="Courier New, monospace">(loop exits here)</text>
  <text x="65.57377" y="490.000021" font-size="19.835452" fill="var(--text-muted)" font-family="Arial, sans-serif">Everything after break is skipped.</text>
  <text x="954.753993" y="72.000029" font-size="27.769587" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">continue</text>
  <text x="954.753993" y="105.99992" font-size="19.835452" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(skips to next iteration)</text>
  <rect x="669.508197" y="130.000004" width="570.491803" height="380.000004" rx="6.847445" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="695.081967" y="189.999966" font-size="21.818928" fill="var(--text)" font-family="Courier New, monospace">for item in items:</text>
  <text x="695.081967" y="240.00012" font-size="21.818928" fill="var(--text)" font-family="Courier New, monospace">    ...</text>
  <text x="695.081967" y="290.000026" font-size="21.818928" fill="var(--primary-accent)" font-family="Courier New, monospace">    if cond:</text>
  <text x="695.081967" y="339.999932" font-size="21.818928" fill="var(--primary-accent)" font-family="Courier New, monospace">        continue</text>
  <text x="695.081967" y="390.000086" font-size="21.818928" fill="var(--text)" font-family="Courier New, monospace">    ...  ← this runs</text>
  <text x="695.081967" y="439.999991" font-size="21.818928" fill="var(--text-muted)" font-family="Courier New, monospace">(next iteration)</text>
  <text x="695.081967" y="490.000021" font-size="19.835452" fill="var(--text-muted)" font-family="Arial, sans-serif">Code after continue is skipped for this iter.</text>
  <rect x="40" y="560.000039" width="1199.999895" height="52.000016" rx="6.847445" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="591.999943" text-anchor="middle" font-size="16.860123" fill="var(--primary-accent)" font-family="Arial, sans-serif">Both work inside for and while loops. break is more disruptive than continue.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <line x1="640" y1="40" x2="640" y2="620" stroke="var(--border)" stroke-width="1.6" stroke-dasharray="7.1111 7.1111" />
  <text x="99.016393" y="72.000029" font-size="27.769587" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">break</text>
  <text x="99.016393" y="105.99992" font-size="19.835452" fill="var(--text-muted)" text-anchor="middle">(exits loop entirely)</text>
  <rect x="40" y="130.000004" width="531.147541" height="380.000004" rx="6.847445" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="65.57377" y="189.999966" font-size="21.818928" fill="var(--text)" font-family="monospace">for item in items:</text>
  <text x="65.57377" y="240.00012" font-size="21.818928" fill="var(--text)" font-family="monospace">    ...</text>
  <text x="65.57377" y="290.000026" font-size="21.818928" fill="var(--danger-accent)" font-family="monospace">    if cond:</text>
  <text x="65.57377" y="339.999932" font-size="21.818928" fill="var(--danger-accent)" font-family="monospace">        break</text>
  <text x="65.57377" y="390.000086" font-size="21.818928" fill="var(--text-faint)" font-family="monospace">    ...  ← skipped</text>
  <text x="65.57377" y="439.999991" font-size="21.818928" fill="var(--text-faint)" font-family="monospace">(loop exits here)</text>
  <text x="65.57377" y="490.000021" font-size="19.835452" fill="var(--text-muted)">Everything after break is skipped.</text>
  <text x="954.753993" y="72.000029" font-size="27.769587" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">continue</text>
  <text x="954.753993" y="105.99992" font-size="19.835452" fill="var(--text-muted)" text-anchor="middle">(skips to next iteration)</text>
  <rect x="669.508197" y="130.000004" width="570.491803" height="380.000004" rx="6.847445" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="695.081967" y="189.999966" font-size="21.818928" fill="var(--text)" font-family="monospace">for item in items:</text>
  <text x="695.081967" y="240.00012" font-size="21.818928" fill="var(--text)" font-family="monospace">    ...</text>
  <text x="695.081967" y="290.000026" font-size="21.818928" fill="var(--primary-accent)" font-family="monospace">    if cond:</text>
  <text x="695.081967" y="339.999932" font-size="21.818928" fill="var(--primary-accent)" font-family="monospace">        continue</text>
  <text x="695.081967" y="390.000086" font-size="21.818928" fill="var(--text)" font-family="monospace">    ...  ← this runs</text>
  <text x="695.081967" y="439.999991" font-size="21.818928" fill="var(--text-muted)" font-family="monospace">(next iteration)</text>
  <text x="695.081967" y="490.000021" font-size="19.835452" fill="var(--text-muted)">Code after continue is skipped for this iter.</text>
  <rect x="40" y="560.000039" width="1199.999895" height="52.000016" rx="6.847445" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="591.999943" text-anchor="middle" font-size="16.860123" fill="var(--primary-accent)">Both work inside for and while loops. break is more disruptive than continue.</text>
</svg>
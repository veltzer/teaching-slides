<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <text x="66.2069" y="62.6087" font-size="30.8966" font-weight="bold" fill="#c62828" text-anchor="middle" font-family="sans-serif">break</text>
  <text x="66.2069" y="118.9565" font-size="26.4828" fill="#555" text-anchor="middle" font-family="sans-serif">(exits loop)</text>
  <rect x="22.069" y="150.2609" width="529.6552" height="375.6522" fill="#f5f5f5" stroke="#999" stroke-width="2.2069" rx="8.8276" />
  <text x="44.1379" y="212.8696" font-size="26.4828" fill="#222">for item in items:</text>
  <text x="44.1379" y="269.2174" font-size="26.4828" fill="#222">    ...</text>
  <text x="44.1379" y="325.5652" font-size="26.4828" fill="#c62828">    if cond:</text>
  <text x="44.1379" y="381.913" font-size="26.4828" fill="#c62828">        break</text>
  <text x="44.1379" y="438.2609" font-size="26.4828" fill="#888">    ...  ← skipped</text>
  <text x="44.1379" y="494.6087" font-size="26.4828" fill="#888">(loop exits)</text>
  <text x="706.2069" y="62.6087" font-size="30.8966" font-weight="bold" fill="#1565c0" text-anchor="middle" font-family="sans-serif">continue</text>
  <text x="706.2069" y="118.9565" font-size="26.4828" fill="#555" text-anchor="middle" font-family="sans-serif">(next iteration)</text>
  <rect x="662.069" y="150.2609" width="573.7931" height="375.6522" fill="#f5f5f5" stroke="#999" stroke-width="2.2069" rx="8.8276" />
  <text x="684.1379" y="212.8696" font-size="26.4828" fill="#222">for item in items:</text>
  <text x="684.1379" y="269.2174" font-size="26.4828" fill="#222">    ...</text>
  <text x="684.1379" y="325.5652" font-size="26.4828" fill="#1565c0">    if cond:</text>
  <text x="684.1379" y="381.913" font-size="26.4828" fill="#1565c0">        continue</text>
  <text x="684.1379" y="438.2609" font-size="26.4828" fill="#222">    ...  ← this runs</text>
  <text x="684.1379" y="494.6087" font-size="26.4828" fill="#555">(next iteration)</text>
  <line x1="617.931" y1="31.3043" x2="617.931" y2="579.1304" stroke="#ccc" stroke-width="2.2069" stroke-dasharray="8.8276 8.8276" />

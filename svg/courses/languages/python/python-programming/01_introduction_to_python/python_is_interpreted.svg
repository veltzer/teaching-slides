<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="50" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565c0">Python is Interpreted</text>
  <!-- Stage boxes -->
  <rect x="30" y="160" width="260" height="360" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="160" y="350" font-size="26" fill="#222222" text-anchor="middle">source.py</text>
  <text x="160" y="130" text-anchor="middle" font-size="18" fill="#555555">Source Code</text>
  <line x1="290" y1="340" x2="330" y2="340" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="334" y="160" width="300" height="360" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="484" y="350" font-size="22" fill="#222222" text-anchor="middle">bytecode (.pyc)</text>
  <text x="484" y="130" text-anchor="middle" font-size="18" fill="#555555">Compile</text>
  <line x1="634" y1="340" x2="674" y2="340" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="678" y="160" width="200" height="360" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="778" y="350" font-size="26" fill="#222222" text-anchor="middle">PVM</text>
  <text x="778" y="130" text-anchor="middle" font-size="18" fill="#555555">Execute</text>
  <line x1="878" y1="340" x2="918" y2="340" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="922" y="160" width="230" height="360" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1037" y="350" font-size="26" fill="#222222" text-anchor="middle">output</text>
  <text x="1037" y="130" text-anchor="middle" font-size="18" fill="#555555">Result</text>
  <!-- Note -->
  <rect x="30" y="570" width="1220" height="64" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="596" text-anchor="middle" font-size="17" fill="#1565c0">Python compiles to bytecode automatically (.pyc cached in __pycache__/)</text>
  <text x="640" y="622" text-anchor="middle" font-size="16" fill="#555555">The Python Virtual Machine (PVM) interprets bytecode at runtime</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="74.523714838971" width="255.737727" height="414.285713623583" rx="7.34560071357" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.868864" y="293.17442870289" font-size="27.661940481455" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">source.py</text>
  <text x="167.868864" y="40" text-anchor="middle" font-size="19.150593472648" fill="var(--text-muted)" font-family="Arial, sans-serif">Source Code</text>
  <line x1="295.737727" y1="281.666571650762" x2="335.081993" y2="281.666571650762" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="339.01642" y="74.523714838971" width="295.081993" height="414.285713623583" rx="7.34560071357" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="486.557416" y="293.17442870289" font-size="23.406267515273" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">bytecode (.pyc)</text>
  <text x="486.557416" y="40" text-anchor="middle" font-size="19.150593472648" fill="var(--text-muted)" font-family="Arial, sans-serif">Compile</text>
  <line x1="634.098413" y1="281.666571650762" x2="673.442678" y2="281.666571650762" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="677.377105" y="74.523714838971" width="196.721329" height="414.285713623583" rx="7.34560071357" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="775.737769" y="293.17442870289" font-size="27.661940481455" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">PVM</text>
  <text x="775.737769" y="40" text-anchor="middle" font-size="19.150593472648" fill="var(--text-muted)" font-family="Arial, sans-serif">Execute</text>
  <line x1="874.098329" y1="281.666571650762" x2="913.442699" y2="281.666571650762" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="917.377126" y="74.523714838971" width="226.229423" height="414.285713623583" rx="7.34560071357" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030.49189" y="293.17442870289" font-size="27.661940481455" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">output</text>
  <text x="1030.49189" y="40" text-anchor="middle" font-size="19.150593472648" fill="var(--text-muted)" font-family="Arial, sans-serif">Result</text>
  <rect x="40" y="546.349142453494" width="1200" height="73.650857546506" rx="7.34560071357" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.000052" y="576.269714471613" text-anchor="middle" font-size="18.086705640631" fill="var(--primary-accent)" font-family="Arial, sans-serif">Python compiles to bytecode automatically (.pyc cached in __pycache__/)</text>
  <text x="640.000052" y="606.19042901359" text-anchor="middle" font-size="17.022695094058" fill="var(--text-muted)" font-family="Arial, sans-serif">The Python Virtual Machine (PVM) interprets bytecode at runtime</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="68.125" y="86.7223" font-size="24.3328" font-weight="bold" fill="var(--text)">MRO: D → B → C → A → object</text>
  <rect x="68.125" y="120.5556" width="140.625" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="138.4375" y="178.5556" font-size="36.4991" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">D</text>
  <line x1="208.75" y1="168.8889" x2="244.375" y2="168.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="248.125" y="120.5556" width="140.625" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="318.4375" y="178.5556" font-size="36.4991" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">B</text>
  <line x1="388.75" y1="168.8889" x2="424.3749" y2="168.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="428.125" y="120.5556" width="140.625" height="96.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="498.4375" y="178.5556" font-size="36.4991" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">C</text>
  <line x1="568.75" y1="168.8889" x2="604.375" y2="168.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="608.125" y="120.5556" width="140.625" height="96.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="678.4375" y="178.5556" font-size="36.4991" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">A</text>
  <line x1="748.75" y1="168.8889" x2="784.375" y2="168.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="788.125" y="120.5556" width="187.5" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="881.875" y="178.5556" font-size="26.0708" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">object</text>
  <rect x="68.125" y="262.3333" width="843.75" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="92.5" y="305.8333" font-size="20.8566" fill="var(--text)" font-family="monospace">class A: pass</text>
  <text x="92.5" y="334.8333" font-size="20.8566" fill="var(--text)" font-family="monospace">class B(A): pass</text>
  <text x="92.5" y="363.8333" font-size="20.8566" fill="var(--text)" font-family="monospace">class C(A): pass</text>
  <text x="92.5" y="392.8333" font-size="20.8566" fill="var(--text)" font-family="monospace">class D(B, C): pass</text>
  <rect x="68.125" y="426.6667" width="1143.7499" height="45.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="454.0556" text-anchor="middle" font-size="15.6425" fill="var(--primary-accent)" font-family="monospace">D.__mro__  ==  (D, B, C, A, object)</text>
  <text x="68.125" y="515.2777" font-size="15.6425" fill="var(--text-muted)">Python uses C3 linearization to determine the Method Resolution Order (MRO).</text>
  <text x="68.125" y="539.4444" font-size="15.6425" fill="var(--text-muted)">This ensures consistent ordering and avoids the diamond inheritance problem.</text>
</svg>
  <ns0:text x="798.2222" y="152.8889" font-size="26.6667" font-weight="bold" fill="#555555" text-anchor="middle">object</ns0:text>
  <ns0:rect x="26.6667" y="245.3333" width="800" height="160" rx="7.1111" fill="#f5f5f5" stroke="#999999" stroke-width="1.7778" />
  <ns0:text x="49.7778" y="293.3333" font-size="21.3333" fill="#222222" font-family="monospace">class A: pass</ns0:text>
  <ns0:text x="49.7778" y="325.3333" font-size="21.3333" fill="#222222" font-family="monospace">class B(A): pass</ns0:text>
  <ns0:text x="49.7778" y="357.3333" font-size="21.3333" fill="#222222" font-family="monospace">class C(A): pass</ns0:text>
  <ns0:text x="49.7778" y="389.3333" font-size="21.3333" fill="#222222" font-family="monospace">class D(B, C): pass</ns0:text>
  <ns0:rect x="26.6667" y="426.6667" width="1084.4444" height="49.7778" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="456.8889" text-anchor="middle" font-size="16" fill="#1565c0" font-family="monospace">D.__mro__  ==  (D, B, C, A, object)</ns0:text>
  <ns0:text x="26.6667" y="524.4444" font-size="16" fill="#666666">Python uses C3 linearization to determine the Method Resolution Order (MRO).</ns0:text>
  <ns0:text x="26.6667" y="551.1111" font-size="16" fill="#666666">This ensures consistent ordering and avoids the diamond inheritance problem.</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="28.210795" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MRO: D → B → C → A → object</text>
  <rect x="40" y="83.345165" width="147.540997" height="123.843493" rx="6.956239" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="113.770498" y="157.651235" font-size="42.316076" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">D</text>
  <line x1="187.540997" y1="145.266847" x2="224.918049" y2="145.266847" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="228.852476" y="83.345165" width="147.540997" height="123.843493" rx="6.956239" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302.622974" y="157.651235" font-size="42.316076" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">B</text>
  <line x1="376.393472" y1="145.266847" x2="413.77042" y2="145.266847" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="417.704951" y="83.345165" width="147.540997" height="123.843493" rx="6.956239" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="491.475449" y="157.651235" font-size="42.316076" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">C</text>
  <line x1="565.245948" y1="145.266847" x2="602.623" y2="145.266847" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="606.557427" y="83.345165" width="147.540997" height="123.843493" rx="6.956239" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="680.327925" y="157.651235" font-size="42.316076" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">A</text>
  <line x1="754.098423" y1="145.266847" x2="791.475476" y2="145.266847" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="795.409902" y="83.345165" width="196.721329" height="123.843493" rx="6.956239" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="893.770566" y="157.651235" font-size="30.225785" font-weight="bold" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">object</text>
  <rect x="40" y="264.982125" width="885.245979" height="185.765175" rx="6.956239" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="65.573773" y="320.711677" font-size="24.180582" fill="var(--text)" font-family="Courier New, monospace">class A: pass</text>
  <text x="65.573773" y="357.864712" font-size="24.180582" fill="var(--text)" font-family="Courier New, monospace">class B(A): pass</text>
  <text x="65.573773" y="395.017747" font-size="24.180582" fill="var(--text)" font-family="Courier New, monospace">class C(A): pass</text>
  <text x="65.573773" y="432.170782" font-size="24.180582" fill="var(--text)" font-family="Courier New, monospace">class D(B, C): pass</text>
  <rect x="40" y="475.516075" width="1200" height="57.793596" rx="6.956239" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000052" y="510.605067" text-anchor="middle" font-size="18.135494" fill="var(--primary-accent)" font-family="Courier New, monospace">D.__mro__  ==  (D, B, C, A, object)</text>
  <text x="40" y="589.039095" font-size="18.135494" fill="var(--text-muted)" font-family="Arial, sans-serif">Python uses C3 linearization to determine the Method Resolution Order (MRO).</text>
  <text x="40" y="620" font-size="18.135494" fill="var(--text-muted)" font-family="Arial, sans-serif">This ensures consistent ordering and avoids the diamond inheritance problem.</text>
</svg>

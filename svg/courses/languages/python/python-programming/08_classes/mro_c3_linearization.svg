  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="26.6667" y="51.5556" font-size="24.8889" font-weight="bold" fill="#333333">MRO: D → B → C → A → object</ns0:text>
  <ns0:rect x="26.6667" y="88.8889" width="133.3333" height="106.6667" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />

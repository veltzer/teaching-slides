<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="30" y="58" font-size="28" font-weight="bold" fill="#333333">MRO: D &#x2192; B &#x2192; C &#x2192; A &#x2192; object</text>
  <!-- Class boxes in MRO sequence -->
  <rect x="30" y="100" width="150" height="120" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="105" y="172" font-size="42" font-weight="bold" fill="#1565c0" text-anchor="middle">D</text>
  <line x1="180" y1="160" x2="218" y2="160" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="222" y="100" width="150" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="297" y="172" font-size="42" font-weight="bold" fill="#2e7d32" text-anchor="middle">B</text>
  <line x1="372" y1="160" x2="410" y2="160" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="414" y="100" width="150" height="120" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="489" y="172" font-size="42" font-weight="bold" fill="#795548" text-anchor="middle">C</text>
  <line x1="564" y1="160" x2="602" y2="160" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="606" y="100" width="150" height="120" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="681" y="172" font-size="42" font-weight="bold" fill="#c62828" text-anchor="middle">A</text>
  <line x1="756" y1="160" x2="794" y2="160" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="798" y="100" width="200" height="120" rx="8" fill="#f5f5f5" stroke="#757575" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="898" y="172" font-size="30" font-weight="bold" fill="#555555" text-anchor="middle">object</text>
  <!-- Code example -->
  <rect x="30" y="276" width="900" height="180" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="2"/>
  <text x="56" y="330" font-size="24" fill="#222222" font-family="monospace">class A: pass</text>
  <text x="56" y="366" font-size="24" fill="#222222" font-family="monospace">class B(A): pass</text>
  <text x="56" y="402" font-size="24" fill="#222222" font-family="monospace">class C(A): pass</text>
  <text x="56" y="438" font-size="24" fill="#222222" font-family="monospace">class D(B, C): pass</text>
  <!-- MRO note -->
  <rect x="30" y="480" width="1220" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="514" text-anchor="middle" font-size="18" fill="#1565c0" font-family="monospace">D.__mro__  ==  (D, B, C, A, object)</text>
  <text x="30" y="590" font-size="18" fill="#666666">Python uses C3 linearization to determine the Method Resolution Order (MRO).</text>
  <text x="30" y="620" font-size="18" fill="#666666">This ensures consistent ordering and avoids the diamond inheritance problem.</text>
</svg>

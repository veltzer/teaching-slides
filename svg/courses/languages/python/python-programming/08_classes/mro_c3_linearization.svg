<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="26.6667" y="51.5556" font-size="24.8889" font-weight="bold" fill="var(--text)">MRO: D → B → C → A → object</text>
  <rect x="26.6667" y="88.8889" width="133.3333" height="106.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="93.3333" y="152.8889" font-size="37.3333" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">D</text>
  <line x1="160" y1="142.2222" x2="193.7778" y2="142.2222" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="197.3333" y="88.8889" width="133.3333" height="106.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="264" y="152.8889" font-size="37.3333" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">B</text>
  <line x1="330.6667" y1="142.2222" x2="364.4444" y2="142.2222" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="368" y="88.8889" width="133.3333" height="106.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="434.6667" y="152.8889" font-size="37.3333" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">C</text>
  <line x1="501.3333" y1="142.2222" x2="535.1111" y2="142.2222" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="538.6667" y="88.8889" width="133.3333" height="106.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="605.3333" y="152.8889" font-size="37.3333" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">A</text>
  <line x1="672" y1="142.2222" x2="705.7778" y2="142.2222" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="709.3333" y="88.8889" width="177.7778" height="106.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="798.2222" y="152.8889" font-size="26.6667" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">object</text>
  <rect x="26.6667" y="245.3333" width="800" height="160" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="49.7778" y="293.3333" font-size="21.3333" fill="var(--text)" font-family="monospace">class A: pass</text>
  <text x="49.7778" y="325.3333" font-size="21.3333" fill="var(--text)" font-family="monospace">class B(A): pass</text>
  <text x="49.7778" y="357.3333" font-size="21.3333" fill="var(--text)" font-family="monospace">class C(A): pass</text>
  <text x="49.7778" y="389.3333" font-size="21.3333" fill="var(--text)" font-family="monospace">class D(B, C): pass</text>
  <rect x="26.6667" y="426.6667" width="1084.4444" height="49.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="456.8889" text-anchor="middle" font-size="16" fill="var(--primary-accent)" font-family="monospace">D.__mro__  ==  (D, B, C, A, object)</text>
  <text x="26.6667" y="524.4444" font-size="16" fill="var(--text-muted)">Python uses C3 linearization to determine the Method Resolution Order (MRO).</text>
  <text x="26.6667" y="551.1111" font-size="16" fill="var(--text-muted)">This ensures consistent ordering and avoids the diamond inheritance problem.</text>
</svg>
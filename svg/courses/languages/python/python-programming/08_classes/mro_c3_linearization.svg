  <ns0:line x1="160" y1="142.2222" x2="193.7778" y2="142.2222" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="197.3333" y="88.8889" width="133.3333" height="106.6667" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="264" y="152.8889" font-size="37.3333" font-weight="bold" fill="#2e7d32" text-anchor="middle">B</ns0:text>
  <ns0:line x1="330.6667" y1="142.2222" x2="364.4444" y2="142.2222" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="368" y="88.8889" width="133.3333" height="106.6667" rx="7.1111" fill="#fff9c4" stroke="#f9a825" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="434.6667" y="152.8889" font-size="37.3333" font-weight="bold" fill="#795548" text-anchor="middle">C</ns0:text>
  <ns0:line x1="501.3333" y1="142.2222" x2="535.1111" y2="142.2222" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />
  <ns0:rect x="538.6667" y="88.8889" width="133.3333" height="106.6667" rx="7.1111" fill="#fce4ec" stroke="#e53935" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:text x="605.3333" y="152.8889" font-size="37.3333" font-weight="bold" fill="#c62828" text-anchor="middle">A</ns0:text>
  <ns0:line x1="672" y1="142.2222" x2="705.7778" y2="142.2222" stroke="#555555" stroke-width="2.6667" marker-end="url(#arrow)" />

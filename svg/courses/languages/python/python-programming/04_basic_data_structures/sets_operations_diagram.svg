<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" font-family="sans-serif">
  <!-- Venn-like label -->
  <text x="10" y="22" font-size="13" font-weight="bold" fill="#222">A = &#123;1, 2, 3, 4&#125;    B = &#123;3, 4, 5, 6&#125;</text>
  <!-- Table -->
  <rect x="10"  y="35" width="170" height="28" fill="#bbdefb" stroke="#333" stroke-width="1.5"/>
  <rect x="180" y="35" width="400" height="28" fill="#bbdefb" stroke="#333" stroke-width="1.5"/>
  <text x="95"  y="54" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Operation</text>
  <text x="380" y="54" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Result</text>
  <!-- rows -->
  <rect x="10"  y="63" width="170" height="28" fill="#e3f2fd" stroke="#333" stroke-width="1"/>
  <rect x="180" y="63" width="400" height="28" fill="#e3f2fd" stroke="#333" stroke-width="1"/>
  <text x="95"  y="82" font-size="13" fill="#222" text-anchor="middle">A | B  (union)</text>
  <text x="190" y="82" font-size="13" fill="#222">&#123;1, 2, 3, 4, 5, 6&#125;</text>

  <rect x="10"  y="91" width="170" height="28" fill="#f0f4f8" stroke="#333" stroke-width="1"/>
  <rect x="180" y="91" width="400" height="28" fill="#f0f4f8" stroke="#333" stroke-width="1"/>
  <text x="95"  y="110" font-size="13" fill="#222" text-anchor="middle">A &amp; B  (intersection)</text>
  <text x="190" y="110" font-size="13" fill="#222">&#123;3, 4&#125;</text>

  <rect x="10"  y="119" width="170" height="28" fill="#e3f2fd" stroke="#333" stroke-width="1"/>
  <rect x="180" y="119" width="400" height="28" fill="#e3f2fd" stroke="#333" stroke-width="1"/>
  <text x="95"  y="138" font-size="13" fill="#222" text-anchor="middle">A - B  (difference)</text>
  <text x="190" y="138" font-size="13" fill="#222">&#123;1, 2&#125;</text>

  <rect x="10"  y="147" width="170" height="28" fill="#f0f4f8" stroke="#333" stroke-width="1"/>
  <rect x="180" y="147" width="400" height="28" fill="#f0f4f8" stroke="#333" stroke-width="1"/>
  <text x="95"  y="166" font-size="13" fill="#222" text-anchor="middle">B - A  (difference)</text>
  <text x="190" y="166" font-size="13" fill="#222">&#123;5, 6&#125;</text>

  <rect x="10"  y="175" width="170" height="28" fill="#e3f2fd" stroke="#333" stroke-width="1"/>
  <rect x="180" y="175" width="400" height="28" fill="#e3f2fd" stroke="#333" stroke-width="1"/>
  <text x="95"  y="194" font-size="13" fill="#222" text-anchor="middle">A ^ B  (symmetric)</text>
  <text x="190" y="194" font-size="13" fill="#222">&#123;1, 2, 5, 6&#125;</text>
</svg>

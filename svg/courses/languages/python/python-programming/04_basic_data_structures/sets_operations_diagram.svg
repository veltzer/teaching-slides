<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="30" y="52" font-size="24" font-weight="bold" fill="#333333" font-family="monospace">A = {1, 2, 3, 4}    B = {3, 4, 5, 6}</text>
  <!-- Header row -->
  <rect x="30" y="76" width="340" height="70" rx="4" fill="url(#grad-accent)"/>
  <text x="200" y="118" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Operation</text>
  <rect x="374" y="76" width="876" height="70" rx="4" fill="url(#grad-accent)"/>
  <text x="812" y="118" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Result</text>
  <!-- Row 1 -->
  <rect x="30" y="150" width="340" height="70" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1"/>
  <text x="200" y="192" font-size="20" fill="#222222" text-anchor="middle" font-family="monospace">A | B  (union)</text>
  <rect x="374" y="150" width="876" height="70" rx="4" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
  <text x="400" y="192" font-size="20" fill="#222222" font-family="monospace">{1, 2, 3, 4, 5, 6}</text>
  <!-- Row 2 -->
  <rect x="30" y="224" width="340" height="70" rx="4" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="200" y="266" font-size="20" fill="#222222" text-anchor="middle" font-family="monospace">A &amp; B  (intersection)</text>
  <rect x="374" y="224" width="876" height="70" rx="4" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="400" y="266" font-size="20" fill="#222222" font-family="monospace">{3, 4}</text>
  <!-- Row 3 -->
  <rect x="30" y="298" width="340" height="70" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1"/>
  <text x="200" y="340" font-size="20" fill="#222222" text-anchor="middle" font-family="monospace">A - B  (difference)</text>
  <rect x="374" y="298" width="876" height="70" rx="4" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
  <text x="400" y="340" font-size="20" fill="#222222" font-family="monospace">{1, 2}</text>
  <!-- Row 4 -->
  <rect x="30" y="372" width="340" height="70" rx="4" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="200" y="414" font-size="20" fill="#222222" text-anchor="middle" font-family="monospace">B - A  (difference)</text>
  <rect x="374" y="372" width="876" height="70" rx="4" fill="#f7f9ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="400" y="414" font-size="20" fill="#222222" font-family="monospace">{5, 6}</text>
  <!-- Row 5 -->
  <rect x="30" y="446" width="340" height="70" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1"/>
  <text x="200" y="488" font-size="20" fill="#222222" text-anchor="middle" font-family="monospace">A ^ B  (symmetric)</text>
  <rect x="374" y="446" width="876" height="70" rx="4" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
  <text x="400" y="488" font-size="20" fill="#222222" font-family="monospace">{1, 2, 5, 6}</text>
  <!-- Note -->
  <rect x="30" y="560" width="1220" height="52" rx="6" fill="#f2f6ff" stroke="#bbdefb" stroke-width="1"/>
  <text x="640" y="592" text-anchor="middle" font-size="17" fill="#1565c0">Sets are unordered, contain unique elements, and support mathematical set operations</text>
</svg>

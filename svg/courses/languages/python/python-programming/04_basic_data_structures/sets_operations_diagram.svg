<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="40" y="40" font-size="24.22372" font-weight="bold" fill="var(--text)" font-family="monospace">A = {1, 2, 3, 4}    B = {3, 4, 5, 6}</text>
  <rect x="40" y="64.857229" width="334.426259" height="72.500016" rx="6.968649" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="207.213129" y="108.357187" font-size="22.205135" font-weight="bold" fill="var(--bg)" text-anchor="middle">Operation</text>
  <rect x="378.36058" y="64.857229" width="861.63942" height="72.500016" rx="6.968649" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="809.180395" y="108.357187" font-size="22.205135" font-weight="bold" fill="var(--bg)" text-anchor="middle">Result</text>
  <rect x="40" y="141.499945" width="334.426259" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="207.213129" y="185.000032" font-size="20.18655" fill="var(--text)" text-anchor="middle" font-family="monospace">A | B  (union)</text>
  <rect x="378.36058" y="141.499945" width="861.63942" height="72.500016" rx="6.968649" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="403.934458" y="185.000032" font-size="20.18655" fill="var(--text)" font-family="monospace">{1, 2, 3, 4, 5, 6}</text>
  <rect x="40" y="218.14279" width="334.426259" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="207.213129" y="261.642748" font-size="20.18655" fill="var(--text)" text-anchor="middle" font-family="monospace">A &amp; B  (intersection)</text>
  <rect x="378.36058" y="218.14279" width="861.63942" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="403.934458" y="261.642748" font-size="20.18655" fill="var(--text)" font-family="monospace">{3, 4}</text>
  <rect x="40" y="294.785763" width="334.426259" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="207.213129" y="338.285722" font-size="20.18655" fill="var(--text)" text-anchor="middle" font-family="monospace">A - B  (difference)</text>
  <rect x="378.36058" y="294.785763" width="861.63942" height="72.500016" rx="6.968649" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="403.934458" y="338.285722" font-size="20.18655" fill="var(--text)" font-family="monospace">{1, 2}</text>
  <rect x="40" y="371.428608" width="334.426259" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="207.213129" y="414.928566" font-size="20.18655" fill="var(--text)" text-anchor="middle" font-family="monospace">B - A  (difference)</text>
  <rect x="378.36058" y="371.428608" width="861.63942" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="403.934458" y="414.928566" font-size="20.18655" fill="var(--text)" font-family="monospace">{5, 6}</text>
  <rect x="40" y="448.071324" width="334.426259" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="207.213129" y="491.571411" font-size="20.18655" fill="var(--text)" text-anchor="middle" font-family="monospace">A ^ B  (symmetric)</text>
  <rect x="378.36058" y="448.071324" width="861.63942" height="72.500016" rx="6.968649" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="403.934458" y="491.571411" font-size="20.18655" fill="var(--text)" font-family="monospace">{1, 2, 5, 6}</text>
  <rect x="40" y="566.142842" width="1200" height="53.857158" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.000052" y="599.285728" text-anchor="middle" font-size="17.158556" fill="var(--primary-accent)">Sets are unordered, contain unique elements, and support mathematical set operations</text>
</svg>
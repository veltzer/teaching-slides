<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <text x="21.3333" y="66" font-size="27.7333" font-weight="bold" fill="#222">A = {1, 2, 3, 4}    B = {3, 4, 5, 6}</text>

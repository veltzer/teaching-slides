<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="24.22372" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">A = {1, 2, 3, 4}    B = {3, 4, 5, 6}</text>
  <rect x="40" y="64.857229" width="334.426259" height="72.500016" rx="6.968649" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="207.213129" y="108.357187" font-size="22.205135" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Operation</text>
  <rect x="378.36058" y="64.857229" width="861.63942" height="72.500016" rx="6.968649" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="809.180395" y="108.357187" font-size="22.205135" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Result</text>
  <rect x="40" y="141.499945" width="334.426259" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="207.213129" y="185.000032" font-size="20.18655" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">A | B  (union)</text>
  <rect x="378.36058" y="141.499945" width="861.63942" height="72.500016" rx="6.968649" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="403.934458" y="185.000032" font-size="20.18655" fill="var(--text)" font-family="Courier New, monospace">{1, 2, 3, 4, 5, 6}</text>
  <rect x="40" y="218.14279" width="334.426259" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="207.213129" y="261.642748" font-size="20.18655" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">A &amp; B  (intersection)</text>
  <rect x="378.36058" y="218.14279" width="861.63942" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="403.934458" y="261.642748" font-size="20.18655" fill="var(--text)" font-family="Courier New, monospace">{3, 4}</text>
  <rect x="40" y="294.785763" width="334.426259" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="207.213129" y="338.285722" font-size="20.18655" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">A - B  (difference)</text>
  <rect x="378.36058" y="294.785763" width="861.63942" height="72.500016" rx="6.968649" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="403.934458" y="338.285722" font-size="20.18655" fill="var(--text)" font-family="Courier New, monospace">{1, 2}</text>
  <rect x="40" y="371.428608" width="334.426259" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="207.213129" y="414.928566" font-size="20.18655" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">B - A  (difference)</text>
  <rect x="378.36058" y="371.428608" width="861.63942" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="403.934458" y="414.928566" font-size="20.18655" fill="var(--text)" font-family="Courier New, monospace">{5, 6}</text>
  <rect x="40" y="448.071324" width="334.426259" height="72.500016" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="207.213129" y="491.571411" font-size="20.18655" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">A ^ B  (symmetric)</text>
  <rect x="378.36058" y="448.071324" width="861.63942" height="72.500016" rx="6.968649" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="403.934458" y="491.571411" font-size="20.18655" fill="var(--text)" font-family="Courier New, monospace">{1, 2, 5, 6}</text>
  <rect x="40" y="566.142842" width="1200" height="53.857158" rx="6.968649" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.000052" y="599.285728" text-anchor="middle" font-size="17.158556" fill="var(--primary-accent)" font-family="Arial, sans-serif">Sets are unordered, contain unique elements, and support mathematical set operations</text>
</svg>

  <ns0:text x="293.3333" y="400" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Custom exceptions — always inherit from Exception</ns0:text>
  <ns0:text x="44.4444" y="424.8889" font-family="monospace" font-size="13.3333" fill="var(--primary-dk)">class AppError(Exception):       # base for app</ns0:text>
  <ns0:text x="44.4444" y="444.4444" font-family="monospace" font-size="13.3333" fill="var(--primary-dk)">    pass</ns0:text>
  <ns0:text x="44.4444" y="465.7778" font-family="monospace" font-size="13.3333" fill="var(--text)">class ValidationError(AppError):</ns0:text>
  <ns0:text x="44.4444" y="485.3333" font-family="monospace" font-size="13.3333" fill="var(--text)">    def __init__(self, field, msg):</ns0:text>
  <ns0:text x="44.4444" y="504.8889" font-family="monospace" font-size="13.3333" fill="var(--text)">        super().__init__(f"{field}: {msg}")</ns0:text>
  <ns0:rect x="586.6667" y="373.3333" width="524.4444" height="142.2222" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <ns0:text x="848.8889" y="400" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-dk)">Catch specifics before base classes</ns0:text>
  <ns0:text x="604.4444" y="424.8889" font-family="monospace" font-size="13.3333" fill="var(--text)">try:</ns0:text>
  <ns0:text x="604.4444" y="444.4444" font-family="monospace" font-size="13.3333" fill="var(--text)">    risky()</ns0:text>
  <ns0:text x="604.4444" y="464" font-family="monospace" font-size="13.3333" fill="var(--primary-dk)">except ZeroDivisionError:</ns0:text>
  <ns0:text x="604.4444" y="483.5556" font-family="monospace" font-size="13.3333" fill="var(--primary-dk)">    ...                  # specific first</ns0:text>
  <ns0:text x="604.4444" y="503.1111" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">except ArithmeticError:</ns0:text>
  <ns0:text x="604.4444" y="522.6667" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">    ...                  # broader second</ns0:text>

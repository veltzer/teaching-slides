  <ns0:rect x="26.6667" y="373.3333" width="533.3333" height="142.2222" rx="5.3333" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" />
  <ns0:text x="293.3333" y="400" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#212121">Custom exceptions — always inherit from Exception</ns0:text>
  <ns0:text x="44.4444" y="424.8889" font-family="monospace" font-size="13.3333" fill="#1565c0">class AppError(Exception):       # base for app</ns0:text>
  <ns0:text x="44.4444" y="444.4444" font-family="monospace" font-size="13.3333" fill="#1565c0">    pass</ns0:text>
  <ns0:text x="44.4444" y="465.7778" font-family="monospace" font-size="13.3333" fill="#212121">class ValidationError(AppError):</ns0:text>
  <ns0:text x="44.4444" y="485.3333" font-family="monospace" font-size="13.3333" fill="#212121">    def __init__(self, field, msg):</ns0:text>
  <ns0:text x="44.4444" y="504.8889" font-family="monospace" font-size="13.3333" fill="#212121">        super().__init__(f"{field}: {msg}")</ns0:text>
  <ns0:rect x="586.6667" y="373.3333" width="524.4444" height="142.2222" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="848.8889" y="400" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#1565c0">Catch specifics before base classes</ns0:text>
  <ns0:text x="604.4444" y="424.8889" font-family="monospace" font-size="13.3333" fill="#212121">try:</ns0:text>
  <ns0:text x="604.4444" y="444.4444" font-family="monospace" font-size="13.3333" fill="#212121">    risky()</ns0:text>
  <ns0:text x="604.4444" y="464" font-family="monospace" font-size="13.3333" fill="#1565c0">except ZeroDivisionError:</ns0:text>
  <ns0:text x="604.4444" y="483.5556" font-family="monospace" font-size="13.3333" fill="#1565c0">    ...                  # specific first</ns0:text>
  <ns0:text x="604.4444" y="503.1111" font-family="monospace" font-size="13.3333" fill="#555555">except ArithmeticError:</ns0:text>
  <ns0:text x="604.4444" y="522.6667" font-family="monospace" font-size="13.3333" fill="#555555">    ...                  # broader second</ns0:text>
</ns0:svg>
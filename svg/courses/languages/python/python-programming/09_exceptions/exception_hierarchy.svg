<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="499.375" y="48.0556" width="281.25" height="38.6667" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="640" y="72.2223" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">BaseException</text>
  <line x1="583.75" y1="88.3333" x2="227.5" y2="120.5556" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="133.75" y="122.1667" width="187.5" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="227.5" y="144.7223" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-faint)">SystemExit</text>
  <line x1="621.25" y1="88.3333" x2="461.875" y2="120.5556" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="368.125" y="122.1667" width="187.5" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="461.875" y="144.7223" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-faint)">KeyboardInterrupt</text>
  <line x1="640" y1="88.3333" x2="640" y2="120.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="499.375" y="122.1667" width="281.25" height="35.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="144.7223" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">Exception</text>
  <line x1="696.25" y1="88.3333" x2="883.75" y2="120.5556" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="790" y="122.1667" width="187.5" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="883.75" y="144.7223" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-faint)">GeneratorExit</text>
  <line x1="574.375" y1="159.2223" x2="227.5" y2="217.2223" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="115" y="218.8333" width="225" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="227.5" y="241.3889" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text)">ArithmeticError</text>
  <line x1="602.5" y1="159.2223" x2="452.5" y2="217.2223" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="339.9999" y="218.8333" width="225" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="452.5" y="241.3889" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text)">LookupError</text>
  <line x1="640" y1="159.2223" x2="640" y2="217.2223" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="565" y="218.8333" width="150" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="241.3889" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text)">OSError</text>
  <line x1="677.4999" y1="159.2223" x2="827.5" y2="217.2223" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="733.75" y="218.8333" width="187.5" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="827.5" y="241.3889" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text)">TypeError</text>
  <line x1="705.625" y1="159.2223" x2="1014.9999" y2="217.2223" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="939.9999" y="218.8333" width="225" height="35.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1052.5" y="241.3889" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text)">ValueError</text>
  <line x1="227.5" y1="255.8889" x2="143.125" y2="305.8333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="68.125" y="307.4444" width="150" height="32.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="143.125" y="327.5833" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">ZeroDivisionError</text>
  <line x1="227.5" y1="255.8889" x2="246.25" y2="305.8333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="227.5" y="307.4444" width="131.25" height="32.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="293.125" y="327.5833" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">OverflowError</text>
  <line x1="452.5" y1="255.8889" x2="396.25" y2="305.8333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="358.75" y="307.4444" width="121.875" height="32.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="419.6875" y="327.5833" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">IndexError</text>
  <line x1="452.5" y1="255.8889" x2="508.7499" y2="305.8333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="490" y="307.4444" width="112.5" height="32.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="546.25" y="327.5833" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">KeyError</text>
  <line x1="640" y1="255.8889" x2="640" y2="305.8333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="611.875" y="307.4444" width="159.375" height="32.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="691.5625" y="327.5833" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">FileNotFoundError</text>
  <line x1="1052.5" y1="255.8889" x2="1052.5" y2="305.8333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="977.5" y="307.4444" width="150" height="32.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1052.5" y="327.5833" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">UnicodeError</text>
  <rect x="68.125" y="378.3333" width="562.5" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="349.375" y="402.5" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--text)">Custom exceptions — always inherit from Exception</text>
  <text x="86.875" y="425.0556" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">class AppError(Exception):       # base for app</text>
  <text x="86.875" y="442.7777" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">    pass</text>
  <text x="86.875" y="462.1111" font-family="monospace" font-size="13.0354" fill="var(--text)">class ValidationError(AppError):</text>
  <text x="86.875" y="479.8333" font-family="monospace" font-size="13.0354" fill="var(--text)">    def __init__(self, field, msg):</text>
  <text x="86.875" y="497.5556" font-family="monospace" font-size="13.0354" fill="var(--text)">        super().__init__(f"{field}: {msg}")</text>
  <rect x="658.75" y="378.3333" width="553.1249" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="935.3125" y="402.5" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">Catch specifics before base classes</text>
  <text x="677.4999" y="425.0556" font-family="monospace" font-size="13.0354" fill="var(--text)">try:</text>
  <text x="677.4999" y="442.7777" font-family="monospace" font-size="13.0354" fill="var(--text)">    risky()</text>
  <text x="677.4999" y="460.5" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">except ZeroDivisionError:</text>
  <text x="677.4999" y="478.2223" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">    ...                  # specific first</text>
  <text x="677.4999" y="495.9444" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">except ArithmeticError:</text>
  <text x="677.4999" y="513.6667" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">    ...                  # broader second</text>
</svg>
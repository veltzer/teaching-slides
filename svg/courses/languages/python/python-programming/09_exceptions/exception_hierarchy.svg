<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </marker>
  </defs>
  <rect x="492.459056" y="40" width="295.081993" height="48.166133" rx="6.859282" fill="var(--text)" filter="url(#shadow)" />
  <text x="640.000052" y="70.103848" text-anchor="middle" font-family="monospace" font-size="17.88272" font-weight="bold" fill="var(--bg)">BaseException</text>
  <line x1="580.983654" y1="90.172915" x2="207.213129" y2="130.311421" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="108.852465" y="132.318327" width="196.721329" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="207.213129" y="160.415269" text-anchor="middle" font-family="monospace" font-size="14.902248" fill="var(--text-faint)">SystemExit</text>
  <line x1="620.32792" y1="90.172915" x2="453.11479" y2="130.311421" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="354.754126" y="132.318327" width="196.721329" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="453.11479" y="160.415269" text-anchor="middle" font-family="monospace" font-size="14.902248" fill="var(--text-faint)">KeyboardInterrupt</text>
  <line x1="640.000052" y1="90.172915" x2="640.000052" y2="130.311421" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="492.459056" y="132.318327" width="295.081993" height="44.152195" rx="6.859282" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640.000052" y="160.415269" text-anchor="middle" font-family="monospace" font-size="17.88272" font-weight="bold" fill="var(--bg)">Exception</text>
  <line x1="699.016451" y1="90.172915" x2="895.73778" y2="130.311421" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="797.377115" y="132.318327" width="196.721329" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="895.73778" y="160.415269" text-anchor="middle" font-family="monospace" font-size="14.902248" fill="var(--text-faint)">GeneratorExit</text>
  <line x1="571.147587" y1="178.477553" x2="207.213129" y2="250.72669" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="89.180332" y="252.733472" width="236.065594" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="207.213129" y="280.830414" text-anchor="middle" font-family="monospace" font-size="14.902248" fill="var(--text)">ArithmeticError</text>
  <line x1="600.655787" y1="178.477553" x2="443.278724" y2="250.72669" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="325.245822" y="252.733472" width="236.065594" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="443.278724" y="280.830414" text-anchor="middle" font-family="monospace" font-size="14.902248" fill="var(--text)">LookupError</text>
  <line x1="640.000052" y1="178.477553" x2="640.000052" y2="250.72669" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="561.311521" y="252.733472" width="157.377063" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640.000052" y="280.830414" text-anchor="middle" font-family="monospace" font-size="14.902248" fill="var(--text)">OSError</text>
  <line x1="679.344213" y1="178.477553" x2="836.721381" y2="250.72669" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="738.360717" y="252.733472" width="196.721329" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="836.721381" y="280.830414" text-anchor="middle" font-family="monospace" font-size="14.902248" fill="var(--text)">TypeError</text>
  <line x1="708.852517" y1="178.477553" x2="1033.442605" y2="250.72669" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="954.754073" y="252.733472" width="236.065594" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1072.786976" y="280.830414" text-anchor="middle" font-family="monospace" font-size="14.902248" fill="var(--text)">ValueError</text>
  <line x1="207.213129" y1="298.892698" x2="118.688531" y2="361.107177" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="40" y="363.114084" width="157.377063" height="40.138506" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="118.688531" y="388.200603" text-anchor="middle" font-family="monospace" font-size="12.915343" fill="var(--text-muted)">ZeroDivisionError</text>
  <line x1="207.213129" y1="298.892698" x2="226.885262" y2="361.107177" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="207.213129" y="363.114084" width="137.70493" height="40.138506" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="276.065594" y="388.200603" text-anchor="middle" font-family="monospace" font-size="12.915343" fill="var(--text-muted)">OverflowError</text>
  <line x1="443.278724" y1="298.892698" x2="384.262325" y2="361.107177" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="344.918059" y="363.114084" width="127.868864" height="40.138506" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="408.852491" y="388.200603" text-anchor="middle" font-family="monospace" font-size="12.915343" fill="var(--text-muted)">IndexError</text>
  <line x1="443.278724" y1="298.892698" x2="502.295017" y2="361.107177" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="482.62299" y="363.114084" width="118.032797" height="40.138506" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="541.639388" y="388.200603" text-anchor="middle" font-family="monospace" font-size="12.915343" fill="var(--text-muted)">KeyError</text>
  <line x1="640.000052" y1="298.892698" x2="640.000052" y2="361.107177" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="610.491853" y="363.114084" width="167.213129" height="40.138506" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="694.098418" y="388.200603" text-anchor="middle" font-family="monospace" font-size="12.915343" fill="var(--text-muted)">FileNotFoundError</text>
  <line x1="1072.786976" y1="298.892698" x2="1072.786976" y2="361.107177" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="994.098444" y="363.114084" width="157.377063" height="40.138506" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1072.786976" y="388.200603" text-anchor="middle" font-family="monospace" font-size="12.915343" fill="var(--text-muted)">UnicodeError</text>
  <rect x="40" y="451.418598" width="590.163986" height="160.553651" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="335.081993" y="481.522447" text-anchor="middle" font-family="sans-serif" font-size="15.895701" font-weight="bold" fill="var(--text)">Custom exceptions — always inherit from Exception</text>
  <text x="59.672133" y="509.619388" font-family="monospace" font-size="14.902248" fill="var(--primary-accent)">class AppError(Exception):       # base for app</text>
  <text x="59.672133" y="531.695361" font-family="monospace" font-size="14.902248" fill="var(--primary-accent)">    pass</text>
  <text x="59.672133" y="555.77849" font-family="monospace" font-size="14.902248" fill="var(--text)">class ValidationError(AppError):</text>
  <text x="59.672133" y="577.854587" font-family="monospace" font-size="14.902248" fill="var(--text)">    def __init__(self, field, msg):</text>
  <text x="59.672133" y="599.930809" font-family="monospace" font-size="14.902248" fill="var(--text)">        super().__init__(f"{field}: {msg}")</text>
  <rect x="659.672185" y="451.418598" width="580.327815" height="160.553651" rx="6.859282" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="949.836145" y="481.522447" text-anchor="middle" font-family="sans-serif" font-size="15.895701" font-weight="bold" fill="var(--primary-accent)">Catch specifics before base classes</text>
  <text x="679.344213" y="509.619388" font-family="monospace" font-size="14.902248" fill="var(--text)">try:</text>
  <text x="679.344213" y="531.695361" font-family="monospace" font-size="14.902248" fill="var(--text)">    risky()</text>
  <text x="679.344213" y="553.771583" font-family="monospace" font-size="14.902248" fill="var(--primary-accent)">except ZeroDivisionError:</text>
  <text x="679.344213" y="575.847805" font-family="monospace" font-size="14.902248" fill="var(--primary-accent)">    ...                  # specific first</text>
  <text x="679.344213" y="597.923778" font-family="monospace" font-size="14.902248" fill="var(--text-muted)">except ArithmeticError:</text>
  <text x="679.344213" y="620" font-family="monospace" font-size="14.902248" fill="var(--text-muted)">    ...                  # broader second</text>
</svg>
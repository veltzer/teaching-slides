<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="492.459056" y="40" width="295.081993" height="48.166133" rx="6.859282" fill="var(--text)"/>
  <text x="640.000052" y="70.103848" text-anchor="middle" font-size="17.88272" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">BaseException</text>
  <line x1="580.983654" y1="90.172915" x2="207.213129" y2="130.311421" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="108.852465" y="132.318327" width="196.721329" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="207.213129" y="160.415269" text-anchor="middle" font-size="14.902248" fill="var(--text-faint)" font-family="Courier New, monospace">SystemExit</text>
  <line x1="620.32792" y1="90.172915" x2="453.11479" y2="130.311421" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="354.754126" y="132.318327" width="196.721329" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="453.11479" y="160.415269" text-anchor="middle" font-size="14.902248" fill="var(--text-faint)" font-family="Courier New, monospace">KeyboardInterrupt</text>
  <line x1="640.000052" y1="90.172915" x2="640.000052" y2="130.311421" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="492.459056" y="132.318327" width="295.081993" height="44.152195" rx="6.859282" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000052" y="160.415269" text-anchor="middle" font-size="17.88272" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">Exception</text>
  <line x1="699.016451" y1="90.172915" x2="895.73778" y2="130.311421" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="797.377115" y="132.318327" width="196.721329" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="895.73778" y="160.415269" text-anchor="middle" font-size="14.902248" fill="var(--text-faint)" font-family="Courier New, monospace">GeneratorExit</text>
  <line x1="571.147587" y1="178.477553" x2="207.213129" y2="250.72669" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="89.180332" y="252.733472" width="236.065594" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="207.213129" y="280.830414" text-anchor="middle" font-size="14.902248" fill="var(--text)" font-family="Courier New, monospace">ArithmeticError</text>
  <line x1="600.655787" y1="178.477553" x2="443.278724" y2="250.72669" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="325.245822" y="252.733472" width="236.065594" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="443.278724" y="280.830414" text-anchor="middle" font-size="14.902248" fill="var(--text)" font-family="Courier New, monospace">LookupError</text>
  <line x1="640.000052" y1="178.477553" x2="640.000052" y2="250.72669" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="561.311521" y="252.733472" width="157.377063" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.000052" y="280.830414" text-anchor="middle" font-size="14.902248" fill="var(--text)" font-family="Courier New, monospace">OSError</text>
  <line x1="679.344213" y1="178.477553" x2="836.721381" y2="250.72669" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="738.360717" y="252.733472" width="196.721329" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="836.721381" y="280.830414" text-anchor="middle" font-size="14.902248" fill="var(--text)" font-family="Courier New, monospace">TypeError</text>
  <line x1="708.852517" y1="178.477553" x2="1033.442605" y2="250.72669" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="954.754073" y="252.733472" width="236.065594" height="44.152195" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1072.786976" y="280.830414" text-anchor="middle" font-size="14.902248" fill="var(--text)" font-family="Courier New, monospace">ValueError</text>
  <line x1="207.213129" y1="298.892698" x2="118.688531" y2="361.107177" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="40" y="363.114084" width="157.377063" height="40.138506" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="118.688531" y="388.200603" text-anchor="middle" font-size="12.915343" fill="var(--text-muted)" font-family="Courier New, monospace">ZeroDivisionError</text>
  <line x1="207.213129" y1="298.892698" x2="226.885262" y2="361.107177" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="207.213129" y="363.114084" width="137.70493" height="40.138506" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="276.065594" y="388.200603" text-anchor="middle" font-size="12.915343" fill="var(--text-muted)" font-family="Courier New, monospace">OverflowError</text>
  <line x1="443.278724" y1="298.892698" x2="384.262325" y2="361.107177" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="344.918059" y="363.114084" width="127.868864" height="40.138506" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="408.852491" y="388.200603" text-anchor="middle" font-size="12.915343" fill="var(--text-muted)" font-family="Courier New, monospace">IndexError</text>
  <line x1="443.278724" y1="298.892698" x2="502.295017" y2="361.107177" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="482.62299" y="363.114084" width="118.032797" height="40.138506" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="541.639388" y="388.200603" text-anchor="middle" font-size="12.915343" fill="var(--text-muted)" font-family="Courier New, monospace">KeyError</text>
  <line x1="640.000052" y1="298.892698" x2="640.000052" y2="361.107177" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="610.491853" y="363.114084" width="167.213129" height="40.138506" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="694.098418" y="388.200603" text-anchor="middle" font-size="12.915343" fill="var(--text-muted)" font-family="Courier New, monospace">FileNotFoundError</text>
  <line x1="1072.786976" y1="298.892698" x2="1072.786976" y2="361.107177" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <rect x="994.098444" y="363.114084" width="157.377063" height="40.138506" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1072.786976" y="388.200603" text-anchor="middle" font-size="12.915343" fill="var(--text-muted)" font-family="Courier New, monospace">UnicodeError</text>
  <rect x="40" y="451.418598" width="590.163986" height="160.553651" rx="6.859282" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335.081993" y="481.522447" text-anchor="middle" font-size="15.895701" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Custom exceptions — always inherit from Exception</text>
  <text x="59.672133" y="509.619388" font-size="14.902248" fill="var(--primary-accent)" font-family="Courier New, monospace">class AppError(Exception):       # base for app</text>
  <text x="59.672133" y="531.695361" font-size="14.902248" fill="var(--primary-accent)" font-family="Courier New, monospace">    pass</text>
  <text x="59.672133" y="555.77849" font-size="14.902248" fill="var(--text)" font-family="Courier New, monospace">class ValidationError(AppError):</text>
  <text x="59.672133" y="577.854587" font-size="14.902248" fill="var(--text)" font-family="Courier New, monospace">    def __init__(self, field, msg):</text>
  <text x="59.672133" y="599.930809" font-size="14.902248" fill="var(--text)" font-family="Courier New, monospace">        super().__init__(f"{field}: {msg}")</text>
  <rect x="659.672185" y="451.418598" width="580.327815" height="160.553651" rx="6.859282" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.836145" y="481.522447" text-anchor="middle" font-size="15.895701" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Catch specifics before base classes</text>
  <text x="679.344213" y="509.619388" font-size="14.902248" fill="var(--text)" font-family="Courier New, monospace">try:</text>
  <text x="679.344213" y="531.695361" font-size="14.902248" fill="var(--text)" font-family="Courier New, monospace">    risky()</text>
  <text x="679.344213" y="553.771583" font-size="14.902248" fill="var(--primary-accent)" font-family="Courier New, monospace">except ZeroDivisionError:</text>
  <text x="679.344213" y="575.847805" font-size="14.902248" fill="var(--primary-accent)" font-family="Courier New, monospace">    ...                  # specific first</text>
  <text x="679.344213" y="597.923778" font-size="14.902248" fill="var(--text-muted)" font-family="Courier New, monospace">except ArithmeticError:</text>
  <text x="679.344213" y="620" font-size="14.902248" fill="var(--text-muted)" font-family="Courier New, monospace">    ...                  # broader second</text>
</svg>

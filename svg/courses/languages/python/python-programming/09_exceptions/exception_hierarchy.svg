<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#555555" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="435.5556" y="8.8889" width="266.6667" height="42.6667" rx="6" fill="var(--text)" filter="url(#shadow)" />
  <text x="568.8889" y="35.5556" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">BaseException</text>
  <line x1="515.5556" y1="53.3333" x2="177.7778" y2="88.8889" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="88.8889" y="90.6667" width="177.7778" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="177.7778" y="115.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">SystemExit</text>
  <line x1="551.1111" y1="53.3333" x2="400" y2="88.8889" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="311.1111" y="90.6667" width="177.7778" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="400" y="115.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">KeyboardInterrupt</text>
  <line x1="568.8889" y1="53.3333" x2="568.8889" y2="88.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#inherit)" />
  <rect x="435.5556" y="90.6667" width="266.6667" height="39.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="115.5556" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">Exception</text>
  <line x1="622.2222" y1="53.3333" x2="800" y2="88.8889" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="711.1111" y="90.6667" width="177.7778" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="800" y="115.5556" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-faint)">GeneratorExit</text>
  <line x1="506.6667" y1="131.5556" x2="177.7778" y2="195.5556" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="71.1111" y="197.3333" width="213.3333" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="177.7778" y="222.2222" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text)">ArithmeticError</text>
  <line x1="533.3333" y1="131.5556" x2="391.1111" y2="195.5556" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="284.4444" y="197.3333" width="213.3333" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="391.1111" y="222.2222" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text)">LookupError</text>
  <line x1="568.8889" y1="131.5556" x2="568.8889" y2="195.5556" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="497.7778" y="197.3333" width="142.2222" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="222.2222" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text)">OSError</text>
  <line x1="604.4444" y1="131.5556" x2="746.6667" y2="195.5556" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="657.7778" y="197.3333" width="177.7778" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="746.6667" y="222.2222" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text)">TypeError</text>
  <line x1="631.1111" y1="131.5556" x2="924.4444" y2="195.5556" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="853.3333" y="197.3333" width="213.3333" height="39.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="960" y="222.2222" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text)">ValueError</text>
  <line x1="177.7778" y1="238.2222" x2="97.7778" y2="293.3333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="26.6667" y="295.1111" width="142.2222" height="35.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="97.7778" y="317.3333" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">ZeroDivisionError</text>
  <line x1="177.7778" y1="238.2222" x2="195.5556" y2="293.3333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="177.7778" y="295.1111" width="124.4444" height="35.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="240" y="317.3333" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">OverflowError</text>
  <line x1="391.1111" y1="238.2222" x2="337.7778" y2="293.3333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="302.2222" y="295.1111" width="115.5556" height="35.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="360" y="317.3333" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">IndexError</text>
  <line x1="391.1111" y1="238.2222" x2="444.4444" y2="293.3333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="426.6667" y="295.1111" width="106.6667" height="35.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="480" y="317.3333" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">KeyError</text>
  <line x1="568.8889" y1="238.2222" x2="568.8889" y2="293.3333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="542.2222" y="295.1111" width="151.1111" height="35.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.7778" y="317.3333" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">FileNotFoundError</text>
  <line x1="960" y1="238.2222" x2="960" y2="293.3333" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#inherit)" />
  <rect x="888.8889" y="295.1111" width="142.2222" height="35.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="960" y="317.3333" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">UnicodeError</text>
  <rect x="26.6667" y="373.3333" width="533.3333" height="142.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="293.3333" y="400" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--text)">Custom exceptions — always inherit from Exception</text>
  <text x="44.4444" y="424.8889" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">class AppError(Exception):       # base for app</text>
  <text x="44.4444" y="444.4444" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">    pass</text>
  <text x="44.4444" y="465.7778" font-family="monospace" font-size="13.3333" fill="var(--text)">class ValidationError(AppError):</text>
  <text x="44.4444" y="485.3333" font-family="monospace" font-size="13.3333" fill="var(--text)">    def __init__(self, field, msg):</text>
  <text x="44.4444" y="504.8889" font-family="monospace" font-size="13.3333" fill="var(--text)">        super().__init__(f"{field}: {msg}")</text>
  <rect x="586.6667" y="373.3333" width="524.4444" height="142.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="848.8889" y="400" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">Catch specifics before base classes</text>
  <text x="604.4444" y="424.8889" font-family="monospace" font-size="13.3333" fill="var(--text)">try:</text>
  <text x="604.4444" y="444.4444" font-family="monospace" font-size="13.3333" fill="var(--text)">    risky()</text>
  <text x="604.4444" y="464" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">except ZeroDivisionError:</text>
  <text x="604.4444" y="483.5556" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">    ...                  # specific first</text>
  <text x="604.4444" y="503.1111" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">except ArithmeticError:</text>
  <text x="604.4444" y="522.6667" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">    ...                  # broader second</text>
</svg>
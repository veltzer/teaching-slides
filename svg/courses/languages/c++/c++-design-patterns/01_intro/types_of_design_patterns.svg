<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="355.5555" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="217.7778" y="164.2857" text-anchor="middle" font-size="32.7002" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Creational</text>
  <text x="217.7778" y="267.8571" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--primary-text)">Singleton</text>
  <text x="217.7778" y="330" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--primary-text)">Factory Method</text>
  <text x="217.7778" y="392.1429" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--primary-text)">Abstract Factory</text>
  <text x="217.7778" y="454.2857" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--primary-text)">Builder</text>
  <text x="217.7778" y="516.4286" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--primary-text)">Prototype</text>
  <rect x="462.2222" y="40" width="355.5555" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="640" y="164.2857" text-anchor="middle" font-size="32.7002" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Structural</text>
  <text x="640" y="267.8571" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--ok-text)">Adapter, Bridge</text>
  <text x="640" y="330" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--ok-text)">Composite</text>
  <text x="640" y="392.1429" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--ok-text)">Decorator, Facade</text>
  <text x="640" y="454.2857" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--ok-text)">Flyweight, Proxy</text>
  <rect x="884.4445" y="40" width="355.5555" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="1062.2222" y="164.2857" text-anchor="middle" font-size="32.7002" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Behavioral</text>
  <text x="1062.2222" y="267.8571" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--warn-text)">Observer, Strategy</text>
  <text x="1062.2222" y="330" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--warn-text)">Command, State</text>
  <text x="1062.2222" y="392.1429" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--warn-text)">Template Method</text>
  <text x="1062.2222" y="454.2857" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--warn-text)">Visitor, Iterator</text>
  <text x="1062.2222" y="516.4286" text-anchor="middle" font-size="23.3572" font-family="Arial, sans-serif" fill="var(--warn-text)">Mediator, Memento</text>
</svg>

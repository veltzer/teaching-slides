  <text x="279.2727" y="197.2174" text-anchor="middle" font-size="23.2727">strategy: Strategy*</text>
  <text x="279.2727" y="244.1739" text-anchor="middle" font-size="23.2727">+ execute()</text>
  <rect x="698.1818" y="62.6087" width="465.4545" height="187.8261" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="930.9091" y="140.8696" text-anchor="middle" font-size="30.2545" font-weight="bold">Strategy</text>
  <text x="930.9091" y="203.4783" text-anchor="middle" font-size="25.6" font-style="italic">+ algorithm()</text>
  <line x1="488.7273" y1="172.1739" x2="698.1818" y2="156.5217" stroke="var(--text)" stroke-width="2" marker-end="url(#stArr)" />
  <rect x="581.8182" y="469.5652" width="325.8182" height="125.2174" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="744.7273" y="547.8261" text-anchor="middle" font-size="25.6">ConcreteStrategyA</text>
  <rect x="954.1818" y="469.5652" width="325.8182" height="125.2174" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1117.0909" y="547.8261" text-anchor="middle" font-size="25.6">ConcreteStrategyB</text>
  <line x1="744.7273" y1="469.5652" x2="861.0909" y2="250.4348" stroke="var(--text)" stroke-width="2" stroke-dasharray="11.6364 11.6364" />
  <line x1="1117.0909" y1="469.5652" x2="1000.7273" y2="250.4348" stroke="var(--text)" stroke-width="2" stroke-dasharray="11.6364 11.6364" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="69.8182" y="62.6087" width="418.9091" height="219.1304" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>

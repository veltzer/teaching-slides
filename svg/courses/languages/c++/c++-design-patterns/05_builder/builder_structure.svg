<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="424.9057" y="40" width="362.2642" height="145" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="606.0378" y="100.4167" text-anchor="middle" font-size="26.172" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Director</text>
  <text x="606.0378" y="148.75" text-anchor="middle" font-size="22.1456" font-family="Arial, sans-serif" fill="var(--primary-text)">+ construct()</text>
  <rect x="424.9057" y="281.6667" width="362.2642" height="169.1667" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="606.0378" y="330" text-anchor="middle" font-size="26.172" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Builder</text>
  <text x="606.0378" y="378.3333" text-anchor="middle" font-size="22.1456" font-style="italic" font-family="Arial, sans-serif" fill="var(--ok-text)">+ buildStepA()</text>
  <text x="606.0378" y="414.5833" text-anchor="middle" font-size="22.1456" font-style="italic" font-family="Arial, sans-serif" fill="var(--ok-text)">+ buildStepB()</text>
  <rect x="40" y="547.5" width="362.2642" height="72.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="221.1321" y="595.8333" text-anchor="middle" font-size="22.1456" font-family="Arial, sans-serif" fill="var(--warn-text)">ConcreteBuilder1</text>
  <rect x="809.8114" y="547.5" width="362.2642" height="72.5" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="990.9435" y="595.8333" text-anchor="middle" font-size="22.1456" font-family="Arial, sans-serif" fill="var(--warn-text)">ConcreteBuilder2</text>
  <line x1="606.0378" y1="185" x2="606.0378" y2="281.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="221.1321" y1="547.5" x2="515.4718" y2="450.8333" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.4815 9.4815" />
  <line x1="990.9435" y1="547.5" x2="696.6038" y2="450.8333" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.4815 9.4815" />
  <rect x="1013.5849" y="281.6667" width="226.4151" height="96.6667" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1126.7926" y="342.0833" text-anchor="middle" font-size="24.1589" font-family="Arial, sans-serif" fill="var(--danger-text)">Product</text>
  <line x1="787.1699" y1="354.1667" x2="1013.5849" y2="330" stroke="var(--text)" stroke-width="2" stroke-dasharray="5.6889 5.6889" />
  <text x="900.3774" y="317.9167" font-size="20.1323" font-family="Arial, sans-serif" fill="var(--text)">creates</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
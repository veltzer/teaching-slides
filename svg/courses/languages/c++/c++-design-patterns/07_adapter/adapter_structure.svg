  <text x="624.127" y="240.7143" text-anchor="middle" font-size="23.2805" font-style="italic">+ request()</text>
  <rect x="867.5132" y="80" width="296.2963" height="214.2857" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.6964"/>
  <text x="1015.6613" y="169.2857" text-anchor="middle" font-size="27.5132" font-weight="bold">Adapter</text>
  <text x="1015.6613" y="240.7143" text-anchor="middle" font-size="23.2805">+ request()</text>
  <rect x="867.5132" y="437.1429" width="296.2963" height="142.8571" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.6964"/>
  <text x="1015.6613" y="526.4286" text-anchor="middle" font-size="25.3969">Adaptee</text>
  <line x1="391.3227" y1="187.1429" x2="475.9788" y2="187.1429" stroke="var(--text)" stroke-width="2" marker-end="url(#a5d6a7rr)" />
  <line x1="772.2751" y1="187.1429" x2="867.5132" y2="187.1429" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.4815 9.4815" />
  <line x1="1015.6613" y1="294.2857" x2="1015.6613" y2="437.1429" stroke="var(--text)" stroke-width="2" marker-end="url(#a5d6a7rr)" />
  <text x="1047.4074" y="372.8571" font-size="21.164">delegates</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="116.1905" y="80" width="275.1323" height="214.2857" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.6964"/>
  <text x="253.7566" y="169.2857" text-anchor="middle" font-size="27.5132" font-weight="bold">Client</text>
  <text x="253.7566" y="240.7143" text-anchor="middle" font-size="21.164">uses Target</text>
  <rect x="475.9788" y="80" width="296.2963" height="214.2857" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.6964"/>

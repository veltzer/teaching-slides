<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="89.9999" y="40" width="500" height="204.7059" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="340" y="125.2942" text-anchor="middle" font-size="32.7358" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Prototype</text>
  <text x="340" y="193.5295" text-anchor="middle" font-size="27.6996" font-style="italic" font-family="Arial, sans-serif" fill="var(--primary-text)">+ clone(): Prototype</text>
  <rect x="840" y="40" width="400" height="204.7059" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="1040" y="125.2942" text-anchor="middle" font-size="32.7358" font-family="Arial, sans-serif" fill="var(--warn-text)">Client</text>
  <text x="1040" y="193.5295" text-anchor="middle" font-size="27.6996" font-family="Arial, sans-serif" fill="var(--warn-text)">+ operation()</text>
  <line x1="840" y1="142.3529" x2="590" y2="142.3529" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="715" y="115.0589" text-anchor="middle" font-size="25.1814" font-family="Arial, sans-serif" fill="var(--text)">uses</text>
  <rect x="40" y="449.4118" width="400" height="170.5882" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="240" y="517.6471" text-anchor="middle" font-size="27.6996" font-family="Arial, sans-serif" fill="var(--ok-text)">ConcretePrototype1</text>
  <text x="240" y="579.0588" text-anchor="middle" font-size="25.1814" font-family="Arial, sans-serif" fill="var(--ok-text)">+ clone()</text>
  <rect x="515" y="449.4118" width="400" height="170.5882" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="715" y="517.6471" text-anchor="middle" font-size="27.6996" font-family="Arial, sans-serif" fill="var(--ok-text)">ConcretePrototype2</text>
  <text x="715" y="579.0588" text-anchor="middle" font-size="25.1814" font-family="Arial, sans-serif" fill="var(--ok-text)">+ clone()</text>
  <line x1="240" y1="449.4118" x2="290" y2="244.7059" stroke="var(--text)" stroke-width="2" stroke-dasharray="11.6364 11.6364"/>
  <line x1="715" y1="449.4118" x2="390" y2="244.7059" stroke="var(--text)" stroke-width="2" stroke-dasharray="11.6364 11.6364"/>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
</svg>

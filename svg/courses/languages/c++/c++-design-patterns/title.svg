<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <circle cx="339.9999" cy="301" r="97.3311" fill="var(--primary-accent)" opacity="0.7"/>
  <text x="339.9999" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="69.5222" font-weight="bold" fill="var(--bg)" opacity="0.9">C++</text>
  <line x1="609.9999" y1="185" x2="1090" y2="185" stroke="var(--text-faint)" stroke-width="2" opacity="0.4"/>
  <rect x="640" y="141.5" width="60" height="43.5" rx="6" fill="url(#grad-danger)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="760" cy="163.25" r="20.8566" fill="var(--ok-fill)" opacity="0.6"/>
  <polygon points="865,141.5 895,185 835,185" fill="var(--primary-fill)" opacity="0.6"/>
  <rect x="955" y="144.4" width="42" height="40.6" rx="6" fill="url(#grad-warn)" opacity="0.6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="865" cy="359" r="27.8088" fill="var(--info-fill)" opacity="0.6"/>
  <line x1="895" y1="344.5" x2="1000" y2="301" stroke="var(--info-border)" stroke-width="2" opacity="0.4"/>
  <line x1="895" y1="373.5" x2="1000" y2="417" stroke="var(--info-border)" stroke-width="2" opacity="0.4"/>
  <line x1="872.4999" y1="388" x2="879.9999" y2="475" stroke="var(--info-border)" stroke-width="2" opacity="0.4"/>
  <circle cx="1007.4999" cy="298.1" r="11.1236" fill="var(--info-fill)" opacity="0.4"/>
  <circle cx="1007.4999" cy="419.9" r="11.1236" fill="var(--info-fill)" opacity="0.4"/>
  <circle cx="883" cy="482.25" r="11.1236" fill="var(--info-fill)" opacity="0.4"/>
  <circle cx="640" cy="402.5" r="48.6655" fill="none" stroke="var(--warn-border)" stroke-width="4.2667" opacity="0.5"/>
  <circle cx="640" cy="402.5" r="11.1236" fill="var(--warn-fill)" opacity="0.6"/>
  <rect x="190" y="446" width="180" height="101.5" rx="6" fill="var(--text)" stroke="var(--border)" stroke-width="2.1333" opacity="0.6"/>
  <line x1="190" y1="475" x2="370" y2="475" stroke="var(--border)" stroke-width="1.4222" opacity="0.6"/>
  <line x1="190" y1="511.25" x2="370" y2="511.25" stroke="var(--border)" stroke-width="1.4222" opacity="0.6"/>
  <text x="280" y="466.3" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)" opacity="0.7" font-family="Courier New, monospace">AbstractBase</text>
  <text x="280" y="498.2" text-anchor="middle" font-size="13.9044" fill="var(--border)" opacity="0.5" font-family="Courier New, monospace">- data: T</text>
  <text x="280" y="533" text-anchor="middle" font-size="13.9044" fill="var(--border)" opacity="0.5" font-family="Courier New, monospace">+ create()</text>
    
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">C++ Design Patterns</text>
</svg>

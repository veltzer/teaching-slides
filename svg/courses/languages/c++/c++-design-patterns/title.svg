<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <circle cx="339.9999" cy="301" r="97.3311" fill="var(--primary-accent)" opacity="0.7"/>
  <text x="339.9999" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="69.5222" font-weight="bold" fill="var(--bg)" opacity="0.9">C++</text>
  <line x1="609.9999" y1="185" x2="1090" y2="185" stroke="var(--text-faint)" stroke-width="2" opacity="0.4"/>
  <rect x="640" y="141.5" width="60" height="43.5" rx="6" fill="url(#grad-danger)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="760" cy="163.25" r="20.8566" fill="var(--ok-fill)" opacity="0.6"/>
  <polygon points="865,141.5 895,185 835,185" fill="var(--primary-fill)" opacity="0.6"/>
  <rect x="955" y="144.4" width="42" height="40.6" rx="6" fill="url(#grad-warn)" opacity="0.6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="865" cy="359" r="27.8088" fill="var(--info-fill)" opacity="0.6"/>
  <line x1="895" y1="344.5" x2="1000" y2="301" stroke="var(--info-border)" stroke-width="2" opacity="0.4"/>
  <line x1="895" y1="373.5" x2="1000" y2="417" stroke="var(--info-border)" stroke-width="2" opacity="0.4"/>
  <line x1="872.4999" y1="388" x2="879.9999" y2="475" stroke="var(--info-border)" stroke-width="2" opacity="0.4"/>
  <circle cx="1007.4999" cy="298.1" r="11.1236" fill="var(--info-fill)" opacity="0.4"/>
  <circle cx="1007.4999" cy="419.9" r="11.1236" fill="var(--info-fill)" opacity="0.4"/>
  <circle cx="883" cy="482.25" r="11.1236" fill="var(--info-fill)" opacity="0.4"/>
  <circle cx="640" cy="402.5" r="48.6655" fill="none" stroke="var(--warn-border)" stroke-width="4.2667" opacity="0.5"/>
  <circle cx="640" cy="402.5" r="11.1236" fill="var(--warn-fill)" opacity="0.6"/>
  <rect x="190" y="446" width="180" height="101.5" rx="6" fill="var(--text)" stroke="var(--border)" stroke-width="2.1333" opacity="0.6"/>
  <line x1="190" y1="475" x2="370" y2="475" stroke="var(--border)" stroke-width="1.4222" opacity="0.6"/>
  <line x1="190" y1="511.25" x2="370" y2="511.25" stroke="var(--border)" stroke-width="1.4222" opacity="0.6"/>
  <text x="280" y="466.3" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)" opacity="0.7" font-family="Courier New, monospace">AbstractBase</text>
  <text x="280" y="498.2" text-anchor="middle" font-size="13.9044" fill="var(--border)" opacity="0.5" font-family="Courier New, monospace">- data: T</text>
  <text x="280" y="533" text-anchor="middle" font-size="13.9044" fill="var(--border)" opacity="0.5" font-family="Courier New, monospace">+ create()</text>
  <text x="640" y="605.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.028" fill="var(--border)" letter-spacing="3">C++ DESIGN PATTERNS</text>
</svg>

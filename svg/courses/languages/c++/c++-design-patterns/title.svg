<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- C++ logo shape -->
  <circle cx="200" cy="180" r="70" fill="#00599c" opacity="0.7"/>
  <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#fff" opacity="0.9">C++</text>
  <!-- Design pattern: Factory - conveyor belt -->
  <line x1="380" y1="100" x2="700" y2="100" stroke="#868e96" stroke-width="3" opacity="0.4"/>
  <rect x="400" y="70" width="40" height="30" rx="5" fill="#ff6b6b" opacity="0.6"/>
  <circle cx="480" cy="85" r="15" fill="#69db7c" opacity="0.6"/>
  <polygon points="550,70 570,100 530,100" fill="#74c0fc" opacity="0.6"/>
  <rect x="610" y="72" width="28" height="28" rx="3" fill="#ffd43b" opacity="0.6"/>
  <!-- Design pattern: Observer - arrows radiating -->
  <circle cx="550" cy="220" r="20" fill="#e599f7" opacity="0.6"/>
  <line x1="570" y1="210" x2="640" y2="180" stroke="#e599f7" stroke-width="2" opacity="0.4"/>
  <line x1="570" y1="230" x2="640" y2="260" stroke="#e599f7" stroke-width="2" opacity="0.4"/>
  <line x1="555" y1="240" x2="560" y2="300" stroke="#e599f7" stroke-width="2" opacity="0.4"/>
  <circle cx="645" cy="178" r="8" fill="#e599f7" opacity="0.4"/>
  <circle cx="645" cy="262" r="8" fill="#e599f7" opacity="0.4"/>
  <circle cx="562" cy="305" r="8" fill="#e599f7" opacity="0.4"/>
  <!-- Design pattern: Singleton - one ring -->
  <circle cx="400" cy="250" r="35" fill="none" stroke="#ffd43b" stroke-width="3" opacity="0.5"/>
  <circle cx="400" cy="250" r="8" fill="#ffd43b" opacity="0.6"/>
  <!-- UML-style class box -->
  <rect x="100" y="280" width="120" height="70" rx="3" fill="#343a40" stroke="#adb5bd" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="300" x2="220" y2="300" stroke="#adb5bd" stroke-width="1" opacity="0.6"/>
  <line x1="100" y1="325" x2="220" y2="325" stroke="#adb5bd" stroke-width="1" opacity="0.6"/>
  <text x="160" y="294" text-anchor="middle" font-family="monospace" font-size="10" fill="#74c0fc" opacity="0.7">AbstractBase</text>
  <text x="160" y="316" text-anchor="middle" font-family="monospace" font-size="9" fill="#adb5bd" opacity="0.5">- data: T</text>
  <text x="160" y="340" text-anchor="middle" font-family="monospace" font-size="9" fill="#adb5bd" opacity="0.5">+ create()</text>
  <!-- Title -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#adb5bd" letter-spacing="3">C++ DESIGN PATTERNS</text>
</svg>

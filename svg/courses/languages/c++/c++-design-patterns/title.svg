<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--code-bg)" rx="6"/>
  <circle cx="284.4444" cy="288" r="99.5556" fill="var(--primary-accent)" opacity="0.7" />
  <text x="284.4444" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="71.1111" font-weight="bold" fill="var(--bg)" opacity="0.9">C++</text>
  <line x1="540.4444" y1="160" x2="995.5556" y2="160" stroke="var(--text-faint)" stroke-width="2" opacity="0.4" />
  <rect x="568.8889" y="112" width="56.8889" height="48" rx="6" fill="var(--danger-fill)" opacity="0.6" stroke="var(--danger-border)" stroke-width="2"/>
  <circle cx="682.6667" cy="136" r="21.3333" fill="var(--ok-fill)" opacity="0.6" />
  <polygon points="782.2222,112 810.6667,160 753.7778,160" fill="var(--primary-fill)" opacity="0.6" />
  <rect x="867.5556" y="115.2" width="39.8222" height="44.8" rx="6" fill="var(--warn-fill)" opacity="0.6" stroke="var(--warn-border)" stroke-width="2"/>
  <circle cx="782.2222" cy="352" r="28.4444" fill="var(--info-fill)" opacity="0.6" />
  <line x1="810.6667" y1="336" x2="910.2222" y2="288" stroke="var(--info-border)" stroke-width="2" opacity="0.4" />
  <line x1="810.6667" y1="368" x2="910.2222" y2="416" stroke="var(--info-border)" stroke-width="2" opacity="0.4" />
  <line x1="789.3333" y1="384" x2="796.4444" y2="480" stroke="var(--info-border)" stroke-width="2" opacity="0.4" />
  <circle cx="917.3333" cy="284.8" r="11.3778" fill="var(--info-fill)" opacity="0.4" />
  <circle cx="917.3333" cy="419.2" r="11.3778" fill="var(--info-fill)" opacity="0.4" />
  <circle cx="799.2889" cy="488" r="11.3778" fill="var(--info-fill)" opacity="0.4" />
  <circle cx="568.8889" cy="400" r="49.7778" fill="none" stroke="var(--warn-border)" stroke-width="4.2667" opacity="0.5" />
  <circle cx="568.8889" cy="400" r="11.3778" fill="var(--warn-fill)" opacity="0.6" />
  <rect x="142.2222" y="448" width="170.6667" height="112" rx="6" fill="var(--text)" stroke="var(--border)" stroke-width="2.1333" opacity="0.6" />
  <line x1="142.2222" y1="480" x2="312.8889" y2="480" stroke="var(--border)" stroke-width="1.4222" opacity="0.6" />
  <line x1="142.2222" y1="520" x2="312.8889" y2="520" stroke="var(--border)" stroke-width="1.4222" opacity="0.6" />
  <text x="227.5556" y="470.4" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" opacity="0.7">AbstractBase</text>
  <text x="227.5556" y="505.6" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--border)" opacity="0.5">- data: T</text>
  <text x="227.5556" y="544" text-anchor="middle" font-family="monospace" font-size="14.2222" fill="var(--border)" opacity="0.5">+ create()</text>
  <text x="568.8889" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" fill="var(--border)" letter-spacing="3">C++ DESIGN PATTERNS</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="380" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--primary-text)">Originator</text>
  <line x1="60" y1="110" x2="400" y2="110" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="60" y="150" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">state : State</text>
  <line x1="60" y1="180" x2="400" y2="180" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">createMemento() : Memento</text>
  <text x="60" y="255" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">restore(m : Memento) : void</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">setState(s : State) : void</text>
  <text x="60" y="370" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Owns the live state.</text>
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Wraps a snapshot in a</text>
  <text x="60" y="425" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Memento that only it can</text>
  <text x="60" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">read back later.</text>
  <text x="60" y="520" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--primary-text)">Knows its own internals</text>
  <text x="60" y="550" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--primary-text)">and keeps them private</text>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--primary-text)">from every other class.</text>

  <line x1="425" y1="330" x2="475" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">creates</text>

  <rect x="480" y="40" width="380" height="580" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--info-text)">Memento</text>
  <line x1="500" y1="110" x2="840" y2="110" stroke="var(--info-text)" stroke-width="2"/>
  <text x="500" y="150" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">state : State</text>
  <line x1="500" y1="180" x2="840" y2="180" stroke="var(--info-text)" stroke-width="2"/>
  <text x="500" y="220" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">getState() : State</text>
  <text x="500" y="255" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">  [friend: Originator only]</text>
  <text x="500" y="370" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Plain data holder.</text>
  <text x="500" y="400" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Immutable from the</text>
  <text x="500" y="425" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">outside world.</text>
  <text x="500" y="520" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--info-text)">Carries the snapshot</text>
  <text x="500" y="550" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--info-text)">without leaking any of</text>
  <text x="500" y="580" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--info-text)">the Originator fields.</text>

  <line x1="865" y1="330" x2="915" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="890" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">stored by</text>

  <rect x="920" y="40" width="320" height="580" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--warn-text)">Caretaker</text>
  <line x1="940" y1="110" x2="1220" y2="110" stroke="var(--warn-text)" stroke-width="2"/>
  <text x="940" y="150" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">history : Memento[]</text>
  <line x1="940" y1="180" x2="1220" y2="180" stroke="var(--warn-text)" stroke-width="2"/>
  <text x="940" y="220" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">push(m) : void</text>
  <text x="940" y="255" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">pop() : Memento</text>
  <text x="940" y="290" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">undo() : void</text>
  <text x="940" y="370" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Stores and orders the</text>
  <text x="940" y="400" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">mementos as an</text>
  <text x="940" y="425" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">undo stack.</text>
  <text x="940" y="520" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--warn-text)">Never reads the data</text>
  <text x="940" y="550" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--warn-text)">inside a memento. Hands</text>
  <text x="940" y="580" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--warn-text)">it back to the Originator.</text>
</svg>

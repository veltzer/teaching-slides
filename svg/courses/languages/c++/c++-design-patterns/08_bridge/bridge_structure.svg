<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="95.3846" y="40" width="332.3077" height="213.6842" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="261.5384" y="116.3158" text-anchor="middle" font-size="28.1097" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">Abstraction</text>
  <text x="261.5384" y="177.3683" text-anchor="middle" font-size="23.7852" font-family="Arial, sans-serif" fill="var(--primary-text)">impl: Implementor*</text>
  <rect x="686.1538" y="40" width="332.3077" height="213.6842" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="852.3076" y="116.3158" text-anchor="middle" font-size="28.1097" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Implementor</text>
  <text x="852.3076" y="177.3683" text-anchor="middle" font-size="23.7852" font-style="italic" font-family="Arial, sans-serif" fill="var(--ok-text)">+ operationImpl()</text>
  <line x1="427.6923" y1="146.8421" x2="686.1538" y2="146.8421" stroke="var(--text)" stroke-width="2"/>
  <polygon points="667.6923,131.5789 686.1538,146.8421 667.6923,162.1052" fill="var(--text)"/>
  <rect x="40" y="467.3684" width="258.4616" height="152.6316" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="169.2307" y="558.9473" text-anchor="middle" font-size="23.7852" font-family="Arial, sans-serif" fill="var(--primary-text)">RefinedAbstraction</text>
  <rect x="335.3846" y="467.3684" width="258.4616" height="152.6316" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="464.6153" y="558.9473" text-anchor="middle" font-size="23.7852" font-family="Arial, sans-serif" fill="var(--primary-text)">RefinedAbstraction2</text>
  <rect x="686.1538" y="467.3684" width="258.4616" height="152.6316" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="815.3846" y="558.9473" text-anchor="middle" font-size="23.7852" font-family="Arial, sans-serif" fill="var(--ok-text)">ConcreteImplA</text>
  <rect x="981.5384" y="467.3684" width="258.4616" height="152.6316" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1110.7692" y="558.9473" text-anchor="middle" font-size="23.7852" font-family="Arial, sans-serif" fill="var(--ok-text)">ConcreteImplB</text>
  <line x1="169.2307" y1="467.3684" x2="224.6153" y2="253.6842" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.5523 9.5523"/>
  <line x1="464.6153" y1="467.3684" x2="316.923" y2="253.6842" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.5523 9.5523"/>
  <line x1="815.3846" y1="467.3684" x2="852.3076" y2="253.6842" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.5523 9.5523"/>
  <line x1="1110.7692" y1="467.3684" x2="889.2307" y2="253.6842" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.5523 9.5523"/>
</svg>

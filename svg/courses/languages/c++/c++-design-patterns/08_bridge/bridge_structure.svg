  <polygon points="687.7612,138.1663 706.8656,149.6802 687.7612,161.194" fill="var(--text)" />
  <rect x="38.209" y="391.4712" width="267.4627" height="115.1386" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="171.9403" y="460.5543" text-anchor="middle" font-size="21.015">RefinedAbstraction</text>
  <rect x="343.8806" y="391.4712" width="267.4627" height="115.1386" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="477.6119" y="460.5543" text-anchor="middle" font-size="21.015">RefinedAbstraction2</text>
  <rect x="706.8656" y="391.4712" width="267.4627" height="115.1386" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="840.597" y="460.5543" text-anchor="middle" font-size="21.015">ConcreteImplA</text>
  <rect x="1012.5373" y="391.4712" width="267.4627" height="115.1386" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1146.2686" y="460.5543" text-anchor="middle" font-size="21.015">ConcreteImplB</text>
  <line x1="171.9403" y1="391.4712" x2="229.2537" y2="230.2772" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.5523 9.5523" />
  <line x1="477.6119" y1="391.4712" x2="324.7761" y2="230.2772" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.5523 9.5523" />
  <line x1="840.597" y1="391.4712" x2="878.8059" y2="230.2772" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.5523 9.5523" />
  <line x1="1146.2686" y1="391.4712" x2="917.0149" y2="230.2772" stroke="var(--text)" stroke-width="2" stroke-dasharray="9.5523 9.5523" />
</svg>
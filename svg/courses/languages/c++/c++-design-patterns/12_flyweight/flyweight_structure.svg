<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="69.8182" y="57.6" width="349.0909" height="172.8" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="244.3636" y="129.6" text-anchor="middle" font-size="30.2545" font-weight="bold">Client</text>
  <text x="244.3636" y="187.2" text-anchor="middle" font-size="23.2727">extrinsic state</text>
  <rect x="535.2727" y="57.6" width="372.3636" height="172.8" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="40" y="40" width="352.9412" height="198.8571" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="216.4705" y="122.8571" text-anchor="middle" font-size="32.634" font-weight="bold" font-family="Arial, sans-serif" fill="var(--warn-text)">Client</text>
  <text x="216.4705" y="189.1429" text-anchor="middle" font-size="25.1031" font-family="Arial, sans-serif" fill="var(--warn-text)">extrinsic state</text>
  <rect x="510.5882" y="40" width="376.4705" height="198.8571" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="698.8235" y="122.8571" text-anchor="middle" font-size="32.634" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">FlyweightFactory</text>
  <text x="698.8235" y="189.1429" text-anchor="middle" font-size="25.1031" font-family="Arial, sans-serif" fill="var(--primary-text)">+ getFlyweight(key)</text>
  <rect x="510.5882" y="404.5714" width="376.4705" height="198.8571" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="698.8235" y="487.4286" text-anchor="middle" font-size="32.634" font-weight="bold" font-family="Arial, sans-serif" fill="var(--ok-text)">Flyweight</text>
  <text x="698.8235" y="553.7143" text-anchor="middle" font-size="25.1031" font-family="Arial, sans-serif" fill="var(--ok-text)">intrinsic state (shared)</text>
  <rect x="1051.7647" y="404.5714" width="188.2353" height="99.4286" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1145.8824" y="470.8571" text-anchor="middle" font-size="25.1031" font-family="Arial, sans-serif" fill="var(--ok-text)">Flyweight A</text>
  <rect x="1051.7647" y="520.5714" width="188.2353" height="99.4286" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1145.8824" y="586.8571" text-anchor="middle" font-size="25.1031" font-family="Arial, sans-serif" fill="var(--ok-text)">Flyweight B</text>
  <line x1="392.9412" y1="139.4286" x2="510.5882" y2="139.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="698.8235" y1="238.8571" x2="698.8235" y2="404.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="887.0588" y1="470.8571" x2="1051.7647" y2="454.2857" stroke="var(--text)" stroke-width="2" stroke-dasharray="6.9818 6.9818" />
  <line x1="887.0588" y1="537.1429" x2="1051.7647" y2="553.7143" stroke="var(--text)" stroke-width="2" stroke-dasharray="6.9818 6.9818" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
</svg>
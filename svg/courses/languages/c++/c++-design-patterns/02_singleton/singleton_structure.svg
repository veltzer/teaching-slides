<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>

  <text x="640" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="var(--primary-text)">Singleton</text>
  <line x1="40" y1="135" x2="1240" y2="135" stroke="var(--primary-border)" stroke-width="2"/>

  <text x="80" y="200" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--primary-text)">Attributes</text>
  <text x="80" y="255" font-family="Arial, sans-serif" font-size="28" fill="var(--primary-text)">- instance: Singleton*</text>
  <text x="80" y="305" font-family="Arial, sans-serif" font-size="28" fill="var(--primary-text)">- data: state payload</text>
  <text x="80" y="355" font-family="Arial, sans-serif" font-size="28" fill="var(--primary-text)">- initialized: bool</text>

  <line x1="40" y1="385" x2="1240" y2="385" stroke="var(--primary-border)" stroke-width="2"/>

  <text x="80" y="435" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="var(--primary-text)">Operations</text>
  <text x="80" y="485" font-family="Arial, sans-serif" font-size="28" fill="var(--primary-text)">- Singleton()            private ctor blocks new</text>
  <text x="80" y="535" font-family="Arial, sans-serif" font-size="28" fill="var(--primary-text)">+ getInstance(): Singleton&amp;   returns the one copy</text>
  <text x="80" y="585" font-family="Arial, sans-serif" font-size="28" fill="var(--primary-text)">+ doSomething()          operate on shared state</text>
</svg>

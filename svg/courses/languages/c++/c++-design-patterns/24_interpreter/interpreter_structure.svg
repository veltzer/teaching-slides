  <rect x="468.5713" y="40" width="542.8571" height="165.7142" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="739.9998" y="109.0475" text-anchor="middle" font-size="32.8276" font-weight="bold">AbstractExpression</text>
  <text x="739.9998" y="164.2857" text-anchor="middle" font-size="27.7773" font-style="italic">+ interpret(context)</text>
  <rect x="40" y="371.4285" width="457.1427" height="138.0951" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="268.5714" y="426.6666" text-anchor="middle" font-size="27.7773">TerminalExpression</text>
  <text x="268.5714" y="476.381" text-anchor="middle" font-size="25.2521">+ interpret(context)</text>
  <rect x="668.5715" y="371.4285" width="514.2856" height="138.0951" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="925.7143" y="426.6666" text-anchor="middle" font-size="27.7773">NonTerminalExpression</text>
  <text x="925.7143" y="476.381" text-anchor="middle" font-size="25.2521">+ interpret(context)</text>
  <line x1="268.5714" y1="371.4285" x2="611.4283" y2="205.7144" stroke="var(--text)" stroke-width="0.7515" stroke-dasharray="2.6721 2.6721" />
  <line x1="925.7143" y1="371.4285" x2="839.9999" y2="205.7144" stroke="var(--text)" stroke-width="0.7515" stroke-dasharray="2.6721 2.6721" />

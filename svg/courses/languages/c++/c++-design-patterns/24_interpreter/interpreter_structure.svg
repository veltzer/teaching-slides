<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="524.5599" y="80" width="365.5603" height="142.8571" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.1169"/>
  <text x="707.34" y="139.5238" text-anchor="middle" font-size="25.012" font-weight="bold">AbstractExpression</text>
  <text x="707.34" y="187.1429" text-anchor="middle" font-size="21.164" font-style="italic">+ interpret(context)</text>
  <rect x="235.9596" y="365.7143" width="307.8402" height="119.0476" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.1169"/>
  <text x="389.8797" y="413.3333" text-anchor="middle" font-size="21.164">TerminalExpression</text>
  <text x="389.8797" y="456.1905" text-anchor="middle" font-size="19.24">+ interpret(context)</text>
  <rect x="659.2401" y="365.7143" width="346.3203" height="119.0476" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="8.1169"/>
  <text x="832.4002" y="413.3333" text-anchor="middle" font-size="21.164">NonTerminalExpression</text>
  <text x="832.4002" y="456.1905" text-anchor="middle" font-size="19.24">+ interpret(context)</text>
  <line x1="389.8797" y1="365.7143" x2="620.7599" y2="222.8571" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.1111 7.1111" />
  <line x1="832.4002" y1="365.7143" x2="774.6801" y2="222.8571" stroke="var(--text)" stroke-width="2" stroke-dasharray="7.1111 7.1111" />
  <path d="M 832.4002 484.7619 C 832.4002 580 1044.0404 580 1044.0404 187.1429" stroke="var(--text)" stroke-width="1.4222" fill="none" stroke-dasharray="4.2667 4.2667" />
  <text x="986.3203" y="568.0952" font-size="19.24">contains children</text>
</svg>
  <ns0:text x="897.7778" y="423.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#555555">Global state makes testing impossible</ns0:text>
  <ns0:rect x="26.6667" y="467.5556" width="1084.4444" height="39.1111" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="491.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">Design patterns are vocabulary, not recipes — understand the problem before choosing the pattern</ns0:text>

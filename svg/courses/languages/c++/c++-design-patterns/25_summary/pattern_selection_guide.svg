  <text x="283.90246" y="275.755395" text-anchor="middle" font-size="14.123417" fill="var(--primary-accent)" font-family="Courier New, monospace">Builder</text>
  <rect x="40" y="309.13671" width="156.097575" height="52.15816" rx="6.965182" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.048787" y="340.43158" text-anchor="middle" font-size="14.123417" fill="var(--primary-accent)" font-family="Courier New, monospace">Singleton</text>
  <rect x="205.853673" y="309.13671" width="156.097575" height="52.15816" rx="6.965182" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="283.90246" y="340.43158" text-anchor="middle" font-size="14.123417" fill="var(--primary-accent)" font-family="Courier New, monospace">Prototype</text>
  <text x="205.853673" y="388.417237" text-anchor="middle" font-size="13.114742" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Creational Patterns</text>
  <line x1="615.609806" y1="98.417367" x2="498.536521" y2="161.007366" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <rect x="381.463444" y="163.093552" width="273.170755" height="50.071973" rx="6.965182" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="518.048822" y="194.388552" text-anchor="middle" font-size="16.141114" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Composing classes</text>
  <rect x="371.707346" y="244.460525" width="156.097575" height="52.15816" rx="6.965182" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="449.756133" y="275.755395" text-anchor="middle" font-size="14.123417" fill="var(--primary-accent)" font-family="Courier New, monospace">Adapter</text>
  <rect x="537.561019" y="244.460525" width="156.097575" height="52.15816" rx="6.965182" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.609806" y="275.755395" text-anchor="middle" font-size="14.123417" fill="var(--primary-accent)" font-family="Courier New, monospace">Decorator</text>

  <rect x="381.463444" y="163.093552" width="273.170755" height="50.071973" rx="6.965182" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="518.048822" y="194.388552" text-anchor="middle" font-family="sans-serif" font-size="16.141114" font-weight="bold" fill="var(--primary-accent)">Composing classes</text>

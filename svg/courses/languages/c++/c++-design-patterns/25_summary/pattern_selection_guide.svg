  <rect x="40" y="244.460525" width="156.097575" height="52.15816" rx="6.965182" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.048787" y="275.755395" text-anchor="middle" font-size="14.123417" fill="var(--primary-accent)" font-family="Courier New, monospace">Factory</text>

  <rect x="752.5" y="209.1667" width="150" height="40.2777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="827.5" y="233.3333" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">Observer</text>
  <rect x="911.875" y="209.1667" width="150" height="40.2777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />

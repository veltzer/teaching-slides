  <text x="635.122003" y="459.3525" text-anchor="middle" font-family="sans-serif" font-size="17.15002" font-weight="bold" fill="var(--danger-accent)">Anti-patterns to avoid</text>
  <rect x="59.512197" y="473.956842" width="331.707346" height="64.676185" rx="6.965182" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="225.36587" y="500.035857" text-anchor="middle" font-family="sans-serif" font-size="14.123417" font-weight="bold" fill="var(--danger-accent)">Pattern overuse</text>

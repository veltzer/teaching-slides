  <text x="902.5" y="320.3333" text-anchor="middle" font-family="sans-serif" font-size="11.2974" font-weight="bold" fill="var(--text-muted)">Behavioural Patterns</text>
  <rect x="1099.3749" y="146.3333" width="121.875" height="38.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1160.3125" y="170.5" text-anchor="middle" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text)">Modern C++</text>
  <text x="1160.3125" y="230.1111" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-faint)">make_unique</text>
  <text x="1160.3125" y="246.2223" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-faint)">make_shared</text>
  <text x="1160.3125" y="283.2777" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-faint)">std::function</text>
  <text x="1160.3125" y="299.3889" text-anchor="middle" font-family="monospace" font-size="10.4284" fill="var(--text-faint)">lambdas</text>
  <text x="1160.3125" y="185" text-anchor="middle" font-family="sans-serif" font-size="10.4284" fill="var(--text-faint)">replaces some</text>
  <rect x="68.125" y="352.5556" width="1143.7499" height="96.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="375.1111" text-anchor="middle" font-family="sans-serif" font-size="14.7735" font-weight="bold" fill="var(--danger-accent)">Anti-patterns to avoid</text>
  <rect x="86.875" y="386.3889" width="318.75" height="49.9444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="246.25" y="406.5277" text-anchor="middle" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">Pattern overuse</text>
  <text x="246.25" y="423.4444" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Not every class needs a pattern</text>
  <rect x="433.75" y="386.3889" width="318.75" height="49.9444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="593.1249" y="406.5277" text-anchor="middle" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">Premature abstraction</text>
  <text x="593.1249" y="423.4444" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Apply when the problem exists</text>
  <rect x="780.625" y="386.3889" width="412.5" height="49.9444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="986.875" y="406.5277" text-anchor="middle" font-family="sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">God object / Singleton abuse</text>
  <text x="986.875" y="423.4444" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">Global state makes testing impossible</text>
  <rect x="68.125" y="463.7223" width="1143.7499" height="35.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="485.4723" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">Design patterns are vocabulary, not recipes — understand the problem before choosing the pattern</text>

  <text x="635.122003" y="74.424538" text-anchor="middle" font-size="18.158811" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">What problem do you have?</text>
  <line x1="557.073216" y1="98.417367" x2="205.853673" y2="161.007366" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>

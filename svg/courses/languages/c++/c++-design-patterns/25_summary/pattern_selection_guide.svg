  <rect x="781.463479" y="473.956842" width="429.26833" height="64.676185" rx="6.965182" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="996.097644" y="500.035857" text-anchor="middle" font-family="sans-serif" font-size="14.123417" font-weight="bold" fill="var(--danger-accent)">God object / Singleton abuse</text>

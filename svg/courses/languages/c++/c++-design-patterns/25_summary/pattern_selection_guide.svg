  <text x="830.243971" y="340.43158" text-anchor="middle" font-size="14.123417" fill="var(--primary-accent)" font-family="Courier New, monospace">Command</text>
  <rect x="918.048857" y="309.13671" width="156.097575" height="52.15816" rx="6.965182" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="996.097644" y="340.43158" text-anchor="middle" font-size="14.123417" fill="var(--primary-accent)" font-family="Courier New, monospace">Template</text>
  <text x="908.292758" y="388.417237" text-anchor="middle" font-size="13.114742" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Behavioural Patterns</text>
  <rect x="1113.170721" y="163.093552" width="126.829279" height="50.071973" rx="6.965182" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1176.585464" y="194.388552" text-anchor="middle" font-size="14.123417" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Modern C++</text>
  <text x="1176.585464" y="271.582763" text-anchor="middle" font-size="12.105951" fill="var(--text-faint)" font-family="Courier New, monospace">make_unique</text>
  <text x="1176.585464" y="292.446182" text-anchor="middle" font-size="12.105951" fill="var(--text-faint)" font-family="Courier New, monospace">make_shared</text>
  <text x="1176.585464" y="340.43158" text-anchor="middle" font-size="12.105951" fill="var(--text-faint)" font-family="Courier New, monospace">std::function</text>
  <text x="1176.585464" y="361.294999" text-anchor="middle" font-size="12.105951" fill="var(--text-faint)" font-family="Courier New, monospace">lambdas</text>
  <text x="1176.585464" y="213.165525" text-anchor="middle" font-size="12.105951" fill="var(--text-faint)" font-family="Arial, sans-serif">replaces some</text>
  <rect x="40" y="430.143946" width="1190.243902" height="125.179868" rx="6.965182" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.122003" y="459.3525" text-anchor="middle" font-size="17.15002" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Anti-patterns to avoid</text>
  <rect x="59.512197" y="473.956842" width="331.707346" height="64.676185" rx="6.965182" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.36587" y="500.035857" text-anchor="middle" font-size="14.123417" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Pattern overuse</text>
  <text x="225.36587" y="521.94237" text-anchor="middle" font-size="13.114742" fill="var(--text-muted)" font-family="Arial, sans-serif">Not every class needs a pattern</text>
  <rect x="420.487838" y="473.956842" width="331.707346" height="64.676185" rx="6.965182" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="586.341407" y="500.035857" text-anchor="middle" font-size="14.123417" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Premature abstraction</text>
  <text x="586.341407" y="521.94237" text-anchor="middle" font-size="13.114742" fill="var(--text-muted)" font-family="Arial, sans-serif">Apply when the problem exists</text>
  <rect x="781.463479" y="473.956842" width="429.26833" height="64.676185" rx="6.965182" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="996.097644" y="500.035857" text-anchor="middle" font-size="14.123417" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">God object / Singleton abuse</text>
  <text x="996.097644" y="521.94237" text-anchor="middle" font-size="13.114742" fill="var(--text-muted)" font-family="Arial, sans-serif">Global state makes testing impossible</text>
  <rect x="40" y="574.100788" width="1190.243902" height="45.899212" rx="6.965182" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.122003" y="602.266249" text-anchor="middle" font-size="16.141114" fill="var(--primary-accent)" font-family="Arial, sans-serif">Design patterns are vocabulary, not recipes — understand the problem before choosing the pattern</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="426.6667" y="12.4444" width="284.4444" height="48" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="41.7778" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">What problem do you have?</text>
  <line x1="497.7778" y1="62.2222" x2="177.7778" y2="115.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="53.3333" y="117.3333" width="248.8889" height="42.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="177.7778" y="144" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">Creating objects</text>
  <rect x="26.6667" y="186.6667" width="142.2222" height="44.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="97.7778" y="213.3333" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">Factory</text>
  <rect x="177.7778" y="186.6667" width="142.2222" height="44.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="248.8889" y="213.3333" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">Builder</text>
  <rect x="26.6667" y="241.7778" width="142.2222" height="44.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="97.7778" y="268.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">Singleton</text>
  <rect x="177.7778" y="241.7778" width="142.2222" height="44.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="248.8889" y="268.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">Prototype</text>
  <text x="177.7778" y="309.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)">Creational Patterns</text>
  <line x1="551.1111" y1="62.2222" x2="444.4444" y2="115.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="337.7778" y="117.3333" width="248.8889" height="42.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="462.2222" y="144" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">Composing classes</text>
  <rect x="328.8889" y="186.6667" width="142.2222" height="44.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="400" y="213.3333" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">Adapter</text>
  <rect x="480" y="186.6667" width="142.2222" height="44.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="551.1111" y="213.3333" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">Decorator</text>
  <rect x="328.8889" y="241.7778" width="142.2222" height="44.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="400" y="268.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">Facade</text>
  <rect x="480" y="241.7778" width="142.2222" height="44.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="551.1111" y="268.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">Composite</text>
  <text x="462.2222" y="309.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)">Structural Patterns</text>
  <line x1="622.2222" y1="62.2222" x2="800" y2="115.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="693.3333" y="117.3333" width="248.8889" height="42.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="817.7778" y="144" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">Object communication</text>
  <rect x="675.5556" y="186.6667" width="142.2222" height="44.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="746.6667" y="213.3333" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">Observer</text>
  <rect x="826.6667" y="186.6667" width="142.2222" height="44.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="897.7778" y="213.3333" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">Strategy</text>
  <rect x="675.5556" y="241.7778" width="142.2222" height="44.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="746.6667" y="268.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">Command</text>
  <rect x="826.6667" y="241.7778" width="142.2222" height="44.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="897.7778" y="268.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">Template</text>
  <text x="817.7778" y="309.3333" text-anchor="middle" font-family="sans-serif" font-size="11.5556" font-weight="bold" fill="var(--text-muted)">Behavioural Patterns</text>
  <rect x="1004.4444" y="117.3333" width="115.5556" height="42.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1062.2222" y="144" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--text)">Modern C++</text>
  <text x="1062.2222" y="209.7778" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-faint)">make_unique</text>
  <text x="1062.2222" y="227.5556" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-faint)">make_shared</text>
  <text x="1062.2222" y="268.4444" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-faint)">std::function</text>
  <text x="1062.2222" y="286.2222" text-anchor="middle" font-family="monospace" font-size="10.6667" fill="var(--text-faint)">lambdas</text>
  <text x="1062.2222" y="160" text-anchor="middle" font-family="sans-serif" font-size="10.6667" fill="var(--text-faint)">replaces some</text>
  <rect x="26.6667" y="344.8889" width="1084.4444" height="106.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="568.8889" y="369.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--danger-accent)">Anti-patterns to avoid</text>
  <rect x="44.4444" y="382.2222" width="302.2222" height="55.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="195.5556" y="404.4444" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">Pattern overuse</text>
  <text x="195.5556" y="423.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">Not every class needs a pattern</text>
  <rect x="373.3333" y="382.2222" width="302.2222" height="55.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="524.4444" y="404.4444" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">Premature abstraction</text>
  <text x="524.4444" y="423.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">Apply when the problem exists</text>
  <rect x="702.2222" y="382.2222" width="391.1111" height="55.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="897.7778" y="404.4444" text-anchor="middle" font-family="sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">God object / Singleton abuse</text>
  <text x="897.7778" y="423.1111" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">Global state makes testing impossible</text>
  <rect x="26.6667" y="467.5556" width="1084.4444" height="39.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="491.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">Design patterns are vocabulary, not recipes — understand the problem before choosing the pattern</text>
</svg>
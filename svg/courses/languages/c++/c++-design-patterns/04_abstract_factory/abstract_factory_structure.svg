<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="421.8182" y="40" width="436.3637" height="150.3704" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="93.7037" text-anchor="middle" font-size="26.3294" font-weight="bold" font-family="Arial, sans-serif" fill="var(--primary-text)">AbstractFactory</text>
  <text x="640" y="130.2222" text-anchor="middle" font-size="20.2534" font-style="italic" font-family="Arial, sans-serif" fill="var(--primary-text)">+ createButton()</text>
  <text x="640" y="162.4444" text-anchor="middle" font-size="20.2534" font-style="italic" font-family="Arial, sans-serif" fill="var(--primary-text)">+ createCheckbox()</text>
  <rect x="40" y="297.7778" width="392.7272" height="128.8889" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="236.3637" y="351.4815" text-anchor="middle" font-size="24.3041" font-family="Arial, sans-serif" fill="var(--primary-text)">WindowsFactory</text>
  <text x="236.3637" y="394.4444" text-anchor="middle" font-size="20.2534" font-family="Arial, sans-serif" fill="var(--primary-text)">+ createButton()</text>
  <rect x="847.2727" y="297.7778" width="392.7272" height="128.8889" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1043.6363" y="351.4815" text-anchor="middle" font-size="24.3041" font-family="Arial, sans-serif" fill="var(--ok-text)">MacFactory</text>
  <text x="1043.6363" y="394.4444" text-anchor="middle" font-size="20.2534" font-family="Arial, sans-serif" fill="var(--ok-text)">+ createButton()</text>
  <rect x="40" y="534.0741" width="174.5455" height="85.9259" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="127.2728" y="587.7778" text-anchor="middle" font-size="20.2534" font-family="Arial, sans-serif" fill="var(--warn-text)">WinButton</text>
  <rect x="258.1818" y="534.0741" width="174.5455" height="85.9259" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="345.4545" y="587.7778" text-anchor="middle" font-size="20.2534" font-family="Arial, sans-serif" fill="var(--warn-text)">WinCheckbox</text>
  <rect x="847.2727" y="534.0741" width="174.5455" height="85.9259" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="934.5455" y="587.7778" text-anchor="middle" font-size="20.2534" font-family="Arial, sans-serif" fill="var(--danger-text)">MacButton</text>
  <rect x="1065.4545" y="534.0741" width="174.5455" height="85.9259" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1152.7272" y="587.7778" text-anchor="middle" font-size="20.2534" font-family="Arial, sans-serif" fill="var(--danger-text)">MacCheckbox</text>
  <line x1="236.3637" y1="297.7778" x2="541.8182" y2="190.3704" stroke="var(--text)" stroke-width="2" />
  <line x1="1043.6363" y1="297.7778" x2="738.1818" y2="190.3704" stroke="var(--text)" stroke-width="2" />
</svg>
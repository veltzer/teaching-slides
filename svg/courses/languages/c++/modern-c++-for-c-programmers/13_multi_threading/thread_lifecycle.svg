  <path d="M 1082.1051 230.5262 L 1082.1051 330 L 640 330 L 640 230.5262" stroke="var(--text)" fill="none" marker-end="url(#arrow)" />
  <path d="M 640 230.5262 L 640 429.4736" stroke="var(--text)" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">

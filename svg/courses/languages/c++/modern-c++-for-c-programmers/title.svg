<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1137.7778" height="640" fill="var(--code-bg)" rx="6"/>
  <circle cx="284.4444" cy="288" r="85.3333" fill="var(--text-muted)" opacity="0.6" />
  <text x="284.4444" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="71.1111" font-weight="bold" fill="var(--text-faint)" opacity="0.8">C</text>
  <line x1="398.2222" y1="288" x2="625.7778" y2="288" stroke="var(--ok-border)" stroke-width="2" opacity="0.6" />
  <polygon points="625.7778,272 661.3333,288 625.7778,304" fill="var(--ok-fill)" opacity="0.6" />
  <text x="526.2222" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9111" fill="var(--ok-accent)" opacity="0.7">evolve</text>
  <circle cx="782.2222" cy="288" r="99.5556" fill="var(--primary-accent)" opacity="0.8" />
  <text x="782.2222" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="71.1111" font-weight="bold" fill="var(--bg)" opacity="0.9">C++</text>
  <rect x="113.7778" y="448" width="142.2222" height="38.4" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2"/>
  <text x="184.8889" y="473.6" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--surface)" opacity="0.7">auto</text>
  <rect x="284.4444" y="480" width="170.6667" height="38.4" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2"/>
  <text x="369.7778" y="505.6" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--surface)" opacity="0.7">lambda</text>
  <rect x="483.5556" y="448" width="199.1111" height="38.4" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2"/>
  <text x="583.1111" y="473.6" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--surface)" opacity="0.7">smart_ptr</text>
  <rect x="711.1111" y="480" width="170.6667" height="38.4" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2"/>
  <text x="796.4444" y="505.6" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--surface)" opacity="0.7">constexpr</text>
  <rect x="910.2222" y="448" width="142.2222" height="38.4" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2"/>
  <text x="981.3333" y="473.6" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--surface)" opacity="0.7">move</text>
  <rect x="199.1111" y="544" width="184.8889" height="38.4" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2"/>
  <text x="291.5556" y="569.6" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--surface)" opacity="0.7">templates</text>
  <rect x="412.4444" y="544" width="142.2222" height="38.4" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2"/>
  <text x="483.5556" y="569.6" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--surface)" opacity="0.7">RAII</text>
  <rect x="583.1111" y="544" width="170.6667" height="38.4" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2"/>
  <text x="668.4444" y="569.6" text-anchor="middle" font-family="monospace" font-size="15.6444" fill="var(--surface)" opacity="0.7">ranges</text>
  <text x="227.5556" y="128" font-family="monospace" font-size="22.7556" fill="var(--danger-accent)" opacity="0.5">malloc()</text>
  <line x1="192" y1="120" x2="341.3333" y2="120" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <text x="796.4444" y="128" font-family="monospace" font-size="22.7556" fill="var(--ok-accent)" opacity="0.6">unique_ptr</text>
  <text x="568.8889" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" fill="var(--border)" letter-spacing="3">MODERN C++ FOR C PROGRAMMERS</text>
</svg>
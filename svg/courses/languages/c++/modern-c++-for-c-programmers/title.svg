<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- C logo (old) -->
  <circle cx="200" cy="180" r="60" fill="#555a7e" opacity="0.6"/>
  <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#a0a0a0" opacity="0.8">C</text>
  <!-- Arrow from C to C++ -->
  <line x1="280" y1="180" x2="440" y2="180" stroke="#69db7c" stroke-width="4" opacity="0.6"/>
  <polygon points="440,170 465,180 440,190" fill="#69db7c" opacity="0.6"/>
  <text x="370" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#69db7c" opacity="0.7">evolve</text>
  <!-- C++ logo (modern, brighter) -->
  <circle cx="550" cy="180" r="70" fill="#00599c" opacity="0.8"/>
  <text x="550" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#fff" opacity="0.9">C++</text>
  <!-- Modern features floating labels -->
  <rect x="80" y="280" width="100" height="24" rx="12" fill="#845ef7" opacity="0.4"/>
  <text x="130" y="296" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8e8e8" opacity="0.7">auto</text>
  <rect x="200" y="300" width="120" height="24" rx="12" fill="#845ef7" opacity="0.4"/>
  <text x="260" y="316" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8e8e8" opacity="0.7">lambda</text>
  <rect x="340" y="280" width="140" height="24" rx="12" fill="#845ef7" opacity="0.4"/>
  <text x="410" y="296" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8e8e8" opacity="0.7">smart_ptr</text>
  <rect x="500" y="300" width="120" height="24" rx="12" fill="#845ef7" opacity="0.4"/>
  <text x="560" y="316" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8e8e8" opacity="0.7">constexpr</text>
  <rect x="640" y="280" width="100" height="24" rx="12" fill="#845ef7" opacity="0.4"/>
  <text x="690" y="296" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8e8e8" opacity="0.7">move</text>
  <rect x="140" y="340" width="130" height="24" rx="12" fill="#845ef7" opacity="0.4"/>
  <text x="205" y="356" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8e8e8" opacity="0.7">templates</text>
  <rect x="290" y="340" width="100" height="24" rx="12" fill="#845ef7" opacity="0.4"/>
  <text x="340" y="356" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8e8e8" opacity="0.7">RAII</text>
  <rect x="410" y="340" width="120" height="24" rx="12" fill="#845ef7" opacity="0.4"/>
  <text x="470" y="356" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8e8e8" opacity="0.7">ranges</text>
  <!-- Memory management: malloc crossed out vs smart ptr -->
  <text x="160" y="80" font-family="monospace" font-size="16" fill="#ff6b6b" opacity="0.5">malloc()</text>
  <line x1="135" y1="75" x2="240" y2="75" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
  <text x="560" y="80" font-family="monospace" font-size="16" fill="#69db7c" opacity="0.6">unique_ptr</text>
  <!-- Title -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#adb5bd" letter-spacing="3">MODERN C++ FOR C PROGRAMMERS</text>
</svg>

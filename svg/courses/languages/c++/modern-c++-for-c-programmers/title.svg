<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <circle cx="339.9999" cy="301" r="83.4266" fill="var(--text-muted)" opacity="0.6"/>
  <text x="339.9999" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="69.5222" font-weight="bold" fill="var(--text-faint)" opacity="0.8">C</text>
  <line x1="460" y1="301" x2="700" y2="301" stroke="var(--ok-border)" stroke-width="2" opacity="0.6"/>
  <polygon points="700,286.5 737.5,301 700,315.5" fill="var(--ok-fill)" opacity="0.6"/>
  <text x="595" y="279.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4662" fill="var(--ok-accent)" opacity="0.7">evolve</text>
  <circle cx="865" cy="301" r="97.3311" fill="var(--primary-accent)" opacity="0.8"/>
  <text x="865" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="69.5222" font-weight="bold" fill="var(--bg)" opacity="0.9">C++</text>
  <rect x="160" y="446" width="150" height="34.8" rx="6" fill="url(#grad-info)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="469.2" text-anchor="middle" font-size="15.2948" fill="var(--surface)" opacity="0.7" font-family="Courier New, monospace">auto</text>
  <rect x="339.9999" y="475" width="180" height="34.8" rx="6" fill="url(#grad-info)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="498.2" text-anchor="middle" font-size="15.2948" fill="var(--surface)" opacity="0.7" font-family="Courier New, monospace">lambda</text>
  <rect x="550" y="446" width="210" height="34.8" rx="6" fill="url(#grad-info)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655" y="469.2" text-anchor="middle" font-size="15.2948" fill="var(--surface)" opacity="0.7" font-family="Courier New, monospace">smart_ptr</text>
  <rect x="790" y="475" width="180" height="34.8" rx="6" fill="url(#grad-info)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="879.9999" y="498.2" text-anchor="middle" font-size="15.2948" fill="var(--surface)" opacity="0.7" font-family="Courier New, monospace">constexpr</text>
  <rect x="1000" y="446" width="150" height="34.8" rx="6" fill="url(#grad-info)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.9999" y="469.2" text-anchor="middle" font-size="15.2948" fill="var(--surface)" opacity="0.7" font-family="Courier New, monospace">move</text>
  <rect x="250" y="533" width="195" height="34.8" rx="6" fill="url(#grad-info)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="347.5" y="556.2" text-anchor="middle" font-size="15.2948" fill="var(--surface)" opacity="0.7" font-family="Courier New, monospace">templates</text>
  <rect x="474.9999" y="533" width="150" height="34.8" rx="6" fill="url(#grad-info)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="556.2" text-anchor="middle" font-size="15.2948" fill="var(--surface)" opacity="0.7" font-family="Courier New, monospace">RAII</text>
  <rect x="655" y="533" width="180" height="34.8" rx="6" fill="url(#grad-info)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="744.9999" y="556.2" text-anchor="middle" font-size="15.2948" fill="var(--surface)" opacity="0.7" font-family="Courier New, monospace">ranges</text>
  <text x="280" y="156" font-size="22.2471" fill="var(--danger-accent)" opacity="0.5" font-family="Courier New, monospace">malloc()</text>
  <line x1="242.5" y1="148.75" x2="400" y2="148.75" stroke="var(--danger-border)" stroke-width="2" opacity="0.6"/>
  <text x="879.9999" y="156" font-size="22.2471" fill="var(--ok-accent)" opacity="0.6" font-family="Courier New, monospace">unique_ptr</text>
  <text x="640" y="605.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.028" fill="var(--border)" letter-spacing="3">MODERN C++ FOR C PROGRAMMERS</text>
</svg>

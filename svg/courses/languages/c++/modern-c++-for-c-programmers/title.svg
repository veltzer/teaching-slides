<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <circle cx="339.9999" cy="301" r="83.4266" fill="var(--text-muted)" opacity="0.6" />
  <text x="339.9999" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="69.5222" font-weight="bold" fill="var(--text-faint)" opacity="0.8">C</text>
  <line x1="460" y1="301" x2="700" y2="301" stroke="var(--ok-border)" stroke-width="2" opacity="0.6" />
  <polygon points="700,286.5 737.5,301 700,315.5" fill="var(--ok-fill)" opacity="0.6" />
  <text x="595" y="279.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4662" fill="var(--ok-accent)" opacity="0.7">evolve</text>
  <circle cx="865" cy="301" r="97.3311" fill="var(--primary-accent)" opacity="0.8" />
  <text x="865" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="69.5222" font-weight="bold" fill="var(--bg)" opacity="0.9">C++</text>
  <rect x="160" y="446" width="150" height="34.8" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="469.2" text-anchor="middle" font-family="monospace" font-size="15.2948" fill="var(--surface)" opacity="0.7">auto</text>
  <rect x="339.9999" y="475" width="180" height="34.8" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="498.2" text-anchor="middle" font-family="monospace" font-size="15.2948" fill="var(--surface)" opacity="0.7">lambda</text>
  <rect x="550" y="446" width="210" height="34.8" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655" y="469.2" text-anchor="middle" font-family="monospace" font-size="15.2948" fill="var(--surface)" opacity="0.7">smart_ptr</text>
  <rect x="790" y="475" width="180" height="34.8" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="879.9999" y="498.2" text-anchor="middle" font-family="monospace" font-size="15.2948" fill="var(--surface)" opacity="0.7">constexpr</text>
  <rect x="1000" y="446" width="150" height="34.8" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.9999" y="469.2" text-anchor="middle" font-family="monospace" font-size="15.2948" fill="var(--surface)" opacity="0.7">move</text>
  <rect x="250" y="533" width="195" height="34.8" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="347.5" y="556.2" text-anchor="middle" font-family="monospace" font-size="15.2948" fill="var(--surface)" opacity="0.7">templates</text>
  <rect x="474.9999" y="533" width="150" height="34.8" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="556.2" text-anchor="middle" font-family="monospace" font-size="15.2948" fill="var(--surface)" opacity="0.7">RAII</text>
  <rect x="655" y="533" width="180" height="34.8" rx="6" fill="var(--info-fill)" opacity="0.4" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="744.9999" y="556.2" text-anchor="middle" font-family="monospace" font-size="15.2948" fill="var(--surface)" opacity="0.7">ranges</text>
  <text x="280" y="156" font-family="monospace" font-size="22.2471" fill="var(--danger-accent)" opacity="0.5">malloc()</text>
  <line x1="242.5" y1="148.75" x2="400" y2="148.75" stroke="var(--danger-border)" stroke-width="2" opacity="0.6" />
  <text x="879.9999" y="156" font-family="monospace" font-size="22.2471" fill="var(--ok-accent)" opacity="0.6">unique_ptr</text>
  <text x="640" y="605.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.028" fill="var(--border)" letter-spacing="3">MODERN C++ FOR C PROGRAMMERS</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="86.4" text-anchor="middle" font-size="40.96">32-bit Integer: 0x12345678</text>
  <text x="320" y="201.6" text-anchor="middle" font-weight="bold">Big Endian</text>
  <rect x="128" y="230.4" width="102.4" height="86.4" fill="#fce4ec" stroke="black" />
  <text x="179.2" y="288" text-anchor="middle">0x12</text>
  <rect x="230.4" y="230.4" width="102.4" height="86.4" fill="#e3f2fd" stroke="black" />
  <text x="281.6" y="288" text-anchor="middle">0x34</text>
  <rect x="332.8" y="230.4" width="102.4" height="86.4" fill="#e8f5e8" stroke="black" />
  <text x="384" y="288" text-anchor="middle">0x56</text>
  <rect x="435.2" y="230.4" width="102.4" height="86.4" fill="#fff3e0" stroke="black" />
  <text x="486.4" y="288" text-anchor="middle">0x78</text>
  <text x="179.2" y="360">Addr+0</text>
  <text x="281.6" y="360">Addr+1</text>
  <text x="384" y="360">Addr+2</text>
  <text x="486.4" y="360">Addr+3</text>
  <text x="960" y="201.6" text-anchor="middle" font-weight="bold">Little Endian</text>
  <rect x="768" y="230.4" width="102.4" height="86.4" fill="#fff3e0" stroke="black" />
  <text x="819.2" y="288" text-anchor="middle">0x78</text>
  <rect x="870.4" y="230.4" width="102.4" height="86.4" fill="#e8f5e8" stroke="black" />
  <text x="921.6" y="288" text-anchor="middle">0x56</text>
  <rect x="972.8" y="230.4" width="102.4" height="86.4" fill="#e3f2fd" stroke="black" />
  <text x="1024" y="288" text-anchor="middle">0x34</text>
  <rect x="1075.2" y="230.4" width="102.4" height="86.4" fill="#fce4ec" stroke="black" />
  <text x="1126.4" y="288" text-anchor="middle">0x12</text>
  <text x="819.2" y="360">Addr+0</text>
  <text x="921.6" y="360">Addr+1</text>
  <text x="1024" y="360">Addr+2</text>
  <text x="1126.4" y="360">Addr+3</text>
  <text x="640" y="489.6" text-anchor="middle">Most Significant Byte (MSB) placement differs</text>
</svg>
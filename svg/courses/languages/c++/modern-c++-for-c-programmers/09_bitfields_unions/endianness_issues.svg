<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="626.3415" y="114.878" text-anchor="middle" font-size="43.7073">32-bit Integer: 0x12345678</text>
  <text x="284.878" y="237.8049" text-anchor="middle" font-weight="bold">Big Endian</text>
  <rect x="80" y="268.5366" width="109.2683" height="92.1951" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <text x="134.6341" y="330" text-anchor="middle">0x12</text>
  <rect x="189.2683" y="268.5366" width="109.2683" height="92.1951" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <text x="243.9024" y="330" text-anchor="middle">0x34</text>
  <rect x="298.5366" y="268.5366" width="109.2683" height="92.1951" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="353.1707" y="330" text-anchor="middle">0x56</text>
  <rect x="407.8049" y="268.5366" width="109.2683" height="92.1951" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="462.439" y="330" text-anchor="middle">0x78</text>
  <text x="134.6341" y="406.8293">Addr+0</text>
  <text x="243.9024" y="406.8293">Addr+1</text>
  <text x="353.1707" y="406.8293">Addr+2</text>
  <text x="462.439" y="406.8293">Addr+3</text>
  <text x="967.8049" y="237.8049" text-anchor="middle" font-weight="bold">Little Endian</text>
  <rect x="762.9268" y="268.5366" width="109.2683" height="92.1951" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="817.561" y="330" text-anchor="middle">0x78</text>
  <rect x="872.1951" y="268.5366" width="109.2683" height="92.1951" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="926.8293" y="330" text-anchor="middle">0x56</text>
  <rect x="981.4634" y="268.5366" width="109.2683" height="92.1951" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <text x="1036.0976" y="330" text-anchor="middle">0x34</text>
  <rect x="1090.7317" y="268.5366" width="109.2683" height="92.1951" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <text x="1145.3659" y="330" text-anchor="middle">0x12</text>
  <text x="817.561" y="406.8293">Addr+0</text>
  <text x="926.8293" y="406.8293">Addr+1</text>
  <text x="1036.0976" y="406.8293">Addr+2</text>
  <text x="1145.3659" y="406.8293">Addr+3</text>
  <text x="626.3415" y="545.122" text-anchor="middle">Most Significant Byte (MSB) placement differs</text>
</svg>
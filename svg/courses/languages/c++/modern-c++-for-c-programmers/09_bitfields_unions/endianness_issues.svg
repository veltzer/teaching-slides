<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="259.5121" y="40" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Big Endian</text>
  <rect x="40" y="98.000042000001" width="117.0732" height="173.999986" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="7.099295862121" stroke-width="2" filter="url(#shadow)"/>
  <text x="98.5365" y="213.999986" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--danger-text)">0x12</text>
  <rect x="157.0732" y="98.000042000001" width="117.0732" height="173.999986" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="7.099295862121" stroke-width="2" filter="url(#shadow)"/>
  <text x="215.6097" y="213.999986" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--primary-text)">0x34</text>
  <rect x="274.1464" y="98.000042000001" width="117.0732" height="173.999986" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="7.099295862121" stroke-width="2" filter="url(#shadow)"/>
  <text x="332.6829" y="213.999986" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--ok-text)">0x56</text>
  <rect x="391.2195" y="98.000042000001" width="117.0732" height="173.999986" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="7.099295862121" stroke-width="2" filter="url(#shadow)"/>
  <text x="449.7561" y="213.999986" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">0x78</text>
  <text x="98.5365" y="358.999950999998" font-family="Arial, sans-serif" fill="var(--text)">Addr+0</text>
  <text x="215.6097" y="358.999950999998" font-family="Arial, sans-serif" fill="var(--text)">Addr+1</text>
  <text x="332.6829" y="358.999950999998" font-family="Arial, sans-serif" fill="var(--text)">Addr+2</text>
  <text x="449.7561" y="358.999950999998" font-family="Arial, sans-serif" fill="var(--text)">Addr+3</text>
  <text x="991.2195" y="40" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif" fill="var(--text)">Little Endian</text>
  <rect x="771.7073" y="98.000042000001" width="117.0732" height="173.999986" fill="url(#grad-warn)" stroke="var(--warn-border)" rx="7.099295862121" stroke-width="2" filter="url(#shadow)"/>
  <text x="830.2439" y="213.999986" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--warn-text)">0x78</text>
  <rect x="888.7805" y="98.000042000001" width="117.0732" height="173.999986" fill="url(#grad-ok)" stroke="var(--ok-border)" rx="7.099295862121" stroke-width="2" filter="url(#shadow)"/>
  <text x="947.3171" y="213.999986" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--ok-text)">0x56</text>
  <rect x="1005.8536" y="98.000042000001" width="117.0732" height="173.999986" fill="url(#grad-primary)" stroke="var(--primary-border)" rx="7.099295862121" stroke-width="2" filter="url(#shadow)"/>
  <text x="1064.3903" y="213.999986" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--primary-text)">0x34</text>
  <rect x="1122.9268" y="98.000042000001" width="117.0732" height="173.999986" fill="url(#grad-danger)" stroke="var(--danger-border)" rx="7.099295862121" stroke-width="2" filter="url(#shadow)"/>
  <text x="1181.4635" y="213.999986" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--danger-text)">0x12</text>
  <text x="830.2439" y="358.999950999998" font-family="Arial, sans-serif" fill="var(--text)">Addr+0</text>
  <text x="947.3171" y="358.999950999998" font-family="Arial, sans-serif" fill="var(--text)">Addr+1</text>
  <text x="1064.3903" y="358.999950999998" font-family="Arial, sans-serif" fill="var(--text)">Addr+2</text>
  <text x="1181.4635" y="358.999950999998" font-family="Arial, sans-serif" fill="var(--text)">Addr+3</text>
  <text x="625.3659" y="620" text-anchor="middle" font-family="Arial, sans-serif" fill="var(--text)">Most Significant Byte (MSB) placement differs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="86.4" text-anchor="middle" font-size="40.96">32-bit Integer: 0x12345678</text>
  <text x="320" y="201.6" text-anchor="middle" font-weight="bold">Big Endian</text>
  <rect x="128" y="230.4" width="102.4" height="86.4" fill="#ffe6e6" stroke="black" />
  <text x="179.2" y="288" text-anchor="middle">0x12</text>
  <rect x="230.4" y="230.4" width="102.4" height="86.4" fill="#e6f3ff" stroke="black" />
  <text x="281.6" y="288" text-anchor="middle">0x34</text>
  <rect x="332.8" y="230.4" width="102.4" height="86.4" fill="#e6ffe6" stroke="black" />
  <text x="384" y="288" text-anchor="middle">0x56</text>
  <rect x="435.2" y="230.4" width="102.4" height="86.4" fill="#fff3e6" stroke="black" />
  <text x="486.4" y="288" text-anchor="middle">0x78</text>
  <text x="179.2" y="360">Addr+0</text>
  <text x="281.6" y="360">Addr+1</text>
  <text x="384" y="360">Addr+2</text>
  <text x="486.4" y="360">Addr+3</text>
  <text x="960" y="201.6" text-anchor="middle" font-weight="bold">Little Endian</text>
  <rect x="768" y="230.4" width="102.4" height="86.4" fill="#fff3e6" stroke="black" />
  <text x="819.2" y="288" text-anchor="middle">0x78</text>
  <rect x="870.4" y="230.4" width="102.4" height="86.4" fill="#e6ffe6" stroke="black" />
  <text x="921.6" y="288" text-anchor="middle">0x56</text>
  <rect x="972.8" y="230.4" width="102.4" height="86.4" fill="#e6f3ff" stroke="black" />
  <text x="1024" y="288" text-anchor="middle">0x34</text>
  <rect x="1075.2" y="230.4" width="102.4" height="86.4" fill="#ffe6e6" stroke="black" />
  <text x="1126.4" y="288" text-anchor="middle">0x12</text>
  <text x="819.2" y="360">Addr+0</text>
  <text x="921.6" y="360">Addr+1</text>
  <text x="1024" y="360">Addr+2</text>
  <text x="1126.4" y="360">Addr+3</text>
  <text x="640" y="489.6" text-anchor="middle">Most Significant Byte (MSB) placement differs</text>
</svg>
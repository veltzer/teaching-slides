<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <text x="40" y="40" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">bit 31</text>
  <text x="1240" y="40" text-anchor="end" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">bit 0</text>

  <rect x="40" y="62.745097933487" width="650" height="272.941176280277" rx="6.398529432114" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="365" y="176.470588679354" text-anchor="middle" font-family="Arial, sans-serif" font-size="34.125488919977" font-weight="bold" fill="var(--danger-text)">reserved</text>
  <text x="365" y="227.647058760092" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" fill="var(--danger-text)">23 bits, unused</text>
  <text x="365" y="278.823529919262" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--danger-text)">bits 8..30</text>

  <rect x="700" y="62.745097933487" width="130" height="272.941176280277" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="176.470588679354" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.726960526338" font-weight="bold" fill="var(--primary-text)">cat</text>
  <text x="765" y="227.647058760092" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--primary-text)">4 bits</text>
  <text x="765" y="278.823529919262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--primary-text)">bits 4..7</text>

  <rect x="840" y="62.745097933487" width="100" height="272.941176280277" rx="6.398529432114" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="176.470588679354" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.726960526338" font-weight="bold" fill="var(--ok-text)">pri</text>
  <text x="890" y="227.647058760092" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--ok-text)">3 bits</text>
  <text x="890" y="278.823529919262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--ok-text)">bits 1..3</text>

  <rect x="950" y="62.745097933487" width="140" height="272.941176280277" rx="6.398529432114" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="176.470588679354" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.726960526338" font-weight="bold" fill="var(--warn-text)">vis</text>
  <text x="1020" y="227.647058760092" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--warn-text)">1 bit</text>
  <text x="1020" y="278.823529919262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--warn-text)">bit 1</text>

  <rect x="1100" y="62.745097933487" width="140" height="272.941176280277" rx="6.398529432114" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1170" y="176.470588679354" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.726960526338" font-weight="bold" fill="var(--info-text)">act</text>
  <text x="1170" y="227.647058760092" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--info-text)">1 bit</text>
  <text x="1170" y="278.823529919262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901662109" fill="var(--info-text)">bit 0</text>

  <rect x="40" y="369.80392165321" width="590" height="250.19607834679" rx="6.398529432114" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335" y="415.294117520184" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--text)">What the compiler guarantees</text>
  <text x="335" y="460.784313387159" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Packing order within a byte is</text>
  <text x="335" y="489.215686612841" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">implementation-defined.</text>
  <text x="335" y="529.019608266051" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Sizeof may add padding.</text>
  <text x="335" y="563.137254627066" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">No address-of on a bit-field.</text>
  <text x="335" y="597.254902066513" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Read-modify-write, not atomic.</text>

  <rect x="650" y="369.80392165321" width="590" height="250.19607834679" rx="6.398529432114" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="945" y="415.294117520184" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328431094223" font-weight="bold" fill="var(--text)">Don't use bit-fields for</text>
  <text x="945" y="460.784313387159" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Hardware registers (use masks).</text>
  <text x="945" y="494.901960826605" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Wire protocols (endian unspecified).</text>
  <text x="945" y="529.019608266051" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Shared memory across ABIs.</text>
  <text x="945" y="568.823529919262" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">Do use them: memory-tight</text>
  <text x="945" y="597.254902066513" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744459988" fill="var(--text-muted)">process-local structs.</text>
</svg>

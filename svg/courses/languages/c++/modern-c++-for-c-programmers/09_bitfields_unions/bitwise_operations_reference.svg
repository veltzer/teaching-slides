<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="128" y="120" width="307.2" height="96" fill="#ffe6e6" stroke="black" />
  <text x="281.6" y="180" text-anchor="middle">AND (&amp;)</text>
  <rect x="486.4" y="120" width="307.2" height="96" fill="#e6f3ff" stroke="black" />
  <text x="640" y="180" text-anchor="middle">OR (|)</text>
  <rect x="844.8" y="120" width="307.2" height="96" fill="#e6ffe6" stroke="black" />
  <text x="998.4" y="180" text-anchor="middle">XOR (^)</text>
  <rect x="128" y="264" width="307.2" height="96" fill="#fff3e6" stroke="black" />
  <text x="281.6" y="324" text-anchor="middle">NOT (~)</text>
  <rect x="486.4" y="264" width="307.2" height="96" fill="#f3e6ff" stroke="black" />
  <text x="640" y="324" text-anchor="middle">Left (&lt;&lt;)</text>
  <rect x="844.8" y="264" width="307.2" height="96" fill="#ffe6f3" stroke="black" />
  <text x="998.4" y="324" text-anchor="middle">Right (&gt;&gt;)</text>
  <text x="281.6" y="420">Clear bits</text>
  <text x="640" y="420">Set bits</text>
  <text x="998.4" y="420">Toggle bits</text>
  <text x="281.6" y="468">Invert bits</text>
  <text x="640" y="468">Multiply by 2^n</text>
  <text x="998.4" y="468">Divide by 2^n</text>
</svg>
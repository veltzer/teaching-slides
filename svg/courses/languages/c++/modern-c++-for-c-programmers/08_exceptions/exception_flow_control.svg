<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-size="26.821872" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Exception Flow Control</text>

  <rect x="40" y="77.247706" width="280" height="542.752294" rx="6.189663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="119.816514" text-anchor="middle" font-size="20.63221" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">try</text>
  <text x="180" y="173.027523" text-anchor="middle" font-size="15.474157" fill="var(--primary-text)" font-family="Arial, sans-serif">Guarded region</text>
  <text x="180" y="215.59633" text-anchor="middle" font-size="15.474157" fill="var(--primary-text)" font-family="Arial, sans-serif">Code runs normally</text>
  <text x="180" y="279.449541" text-anchor="middle" font-size="15.474157" fill="var(--primary-text)" font-family="Arial, sans-serif">Objects constructed</text>
  <text x="180" y="332.66055" text-anchor="middle" font-size="15.474157" fill="var(--primary-text)" font-family="Arial, sans-serif">RAII tracks lifetime</text>
  <text x="180" y="407.155963" text-anchor="middle" font-size="15.474157" fill="var(--primary-text)" font-family="Arial, sans-serif">No runtime overhead</text>
  <text x="180" y="460.366972" text-anchor="middle" font-size="15.474157" fill="var(--primary-text)" font-family="Arial, sans-serif">on the happy path</text>
  <text x="180" y="545.504587" text-anchor="middle" font-size="15.474157" fill="var(--primary-text)" font-family="Arial, sans-serif">Zero-cost model</text>

  <rect x="340" y="77.247706" width="280" height="542.752294" rx="6.189663" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="119.816514" text-anchor="middle" font-size="20.63221" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">throw</text>
  <text x="480" y="173.027523" text-anchor="middle" font-size="15.474157" fill="var(--danger-text)" font-family="Arial, sans-serif">Allocate exception</text>
  <text x="480" y="215.59633" text-anchor="middle" font-size="15.474157" fill="var(--danger-text)" font-family="Arial, sans-serif">Copy into slot</text>
  <text x="480" y="279.449541" text-anchor="middle" font-size="15.474157" fill="var(--danger-text)" font-family="Arial, sans-serif">Abandon current scope</text>
  <text x="480" y="332.66055" text-anchor="middle" font-size="15.474157" fill="var(--danger-text)" font-family="Arial, sans-serif">Begin unwinding</text>
  <text x="480" y="407.155963" text-anchor="middle" font-size="15.474157" fill="var(--danger-text)" font-family="Arial, sans-serif">Search for handler</text>
  <text x="480" y="460.366972" text-anchor="middle" font-size="15.474157" fill="var(--danger-text)" font-family="Arial, sans-serif">Match by type</text>
  <text x="480" y="545.504587" text-anchor="middle" font-size="15.474157" fill="var(--danger-text)" font-family="Arial, sans-serif">terminate if none</text>

  <rect x="640" y="77.247706" width="280" height="542.752294" rx="6.189663" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="119.816514" text-anchor="middle" font-size="20.63221" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Unwind</text>
  <text x="780" y="173.027523" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">Walk the stack</text>
  <text x="780" y="215.59633" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">Pop each frame</text>
  <text x="780" y="279.449541" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">Call destructors</text>
  <text x="780" y="332.66055" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">Release resources</text>
  <text x="780" y="407.155963" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">RAII guarantees it</text>
  <text x="780" y="460.366972" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">No leaks if disciplined</text>
  <text x="780" y="545.504587" text-anchor="middle" font-size="15.474157" fill="var(--warn-text)" font-family="Arial, sans-serif">Stops at catch</text>

  <rect x="940" y="77.247706" width="300" height="542.752294" rx="6.189663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="119.816514" text-anchor="middle" font-size="20.63221" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">catch</text>
  <text x="1090" y="173.027523" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">Handler executes</text>
  <text x="1090" y="215.59633" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">Exception bound</text>
  <text x="1090" y="279.449541" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">Log, recover, rethrow</text>
  <text x="1090" y="332.66055" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">Control resumes</text>
  <text x="1090" y="407.155963" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">Object destroyed</text>
  <text x="1090" y="460.366972" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">at block end</text>
  <text x="1090" y="545.504587" text-anchor="middle" font-size="15.474157" fill="var(--ok-text)" font-family="Arial, sans-serif">Normal flow resumes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="280" height="580" rx="6.398529361204" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="85.490196748943" text-anchor="middle" font-size="21.328431204015" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">try</text>
  <text x="180" y="142.352941616494" text-anchor="middle" font-size="15.996322886139" fill="var(--primary-text)" font-family="Arial, sans-serif">Guarded region</text>
  <text x="180" y="187.843137296809" text-anchor="middle" font-size="15.996322886139" fill="var(--primary-text)" font-family="Arial, sans-serif">Code runs normally</text>
  <text x="180" y="256.078431351596" text-anchor="middle" font-size="15.996322886139" fill="var(--primary-text)" font-family="Arial, sans-serif">Objects constructed</text>
  <text x="180" y="312.941176219147" text-anchor="middle" font-size="15.996322886139" fill="var(--primary-text)" font-family="Arial, sans-serif">RAII tracks lifetime</text>
  <text x="180" y="392.549019461169" text-anchor="middle" font-size="15.996322886139" fill="var(--primary-text)" font-family="Arial, sans-serif">No runtime overhead</text>
  <text x="180" y="449.41176432872" text-anchor="middle" font-size="15.996322886139" fill="var(--primary-text)" font-family="Arial, sans-serif">on the happy path</text>
  <text x="180" y="540.392156757978" text-anchor="middle" font-size="15.996322886139" fill="var(--primary-text)" font-family="Arial, sans-serif">Zero-cost model</text>

  <rect x="340" y="40" width="280" height="580" rx="6.398529361204" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="85.490196748943" text-anchor="middle" font-size="21.328431204015" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">throw</text>
  <text x="480" y="142.352941616494" text-anchor="middle" font-size="15.996322886139" fill="var(--danger-text)" font-family="Arial, sans-serif">Allocate exception</text>
  <text x="480" y="187.843137296809" text-anchor="middle" font-size="15.996322886139" fill="var(--danger-text)" font-family="Arial, sans-serif">Copy into slot</text>
  <text x="480" y="256.078431351596" text-anchor="middle" font-size="15.996322886139" fill="var(--danger-text)" font-family="Arial, sans-serif">Abandon current scope</text>
  <text x="480" y="312.941176219147" text-anchor="middle" font-size="15.996322886139" fill="var(--danger-text)" font-family="Arial, sans-serif">Begin unwinding</text>
  <text x="480" y="392.549019461169" text-anchor="middle" font-size="15.996322886139" fill="var(--danger-text)" font-family="Arial, sans-serif">Search for handler</text>
  <text x="480" y="449.41176432872" text-anchor="middle" font-size="15.996322886139" fill="var(--danger-text)" font-family="Arial, sans-serif">Match by type</text>
  <text x="480" y="540.392156757978" text-anchor="middle" font-size="15.996322886139" fill="var(--danger-text)" font-family="Arial, sans-serif">terminate if none</text>

  <rect x="640" y="40" width="280" height="580" rx="6.398529361204" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="85.490196748943" text-anchor="middle" font-size="21.328431204015" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Unwind</text>
  <text x="780" y="142.352941616494" text-anchor="middle" font-size="15.996322886139" fill="var(--warn-text)" font-family="Arial, sans-serif">Walk the stack</text>
  <text x="780" y="187.843137296809" text-anchor="middle" font-size="15.996322886139" fill="var(--warn-text)" font-family="Arial, sans-serif">Pop each frame</text>
  <text x="780" y="256.078431351596" text-anchor="middle" font-size="15.996322886139" fill="var(--warn-text)" font-family="Arial, sans-serif">Call destructors</text>
  <text x="780" y="312.941176219147" text-anchor="middle" font-size="15.996322886139" fill="var(--warn-text)" font-family="Arial, sans-serif">Release resources</text>
  <text x="780" y="392.549019461169" text-anchor="middle" font-size="15.996322886139" fill="var(--warn-text)" font-family="Arial, sans-serif">RAII guarantees it</text>
  <text x="780" y="449.41176432872" text-anchor="middle" font-size="15.996322886139" fill="var(--warn-text)" font-family="Arial, sans-serif">No leaks if disciplined</text>
  <text x="780" y="540.392156757978" text-anchor="middle" font-size="15.996322886139" fill="var(--warn-text)" font-family="Arial, sans-serif">Stops at catch</text>

  <rect x="940" y="40" width="300" height="580" rx="6.398529361204" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="85.490196748943" text-anchor="middle" font-size="21.328431204015" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">catch</text>
  <text x="1090" y="142.352941616494" text-anchor="middle" font-size="15.996322886139" fill="var(--ok-text)" font-family="Arial, sans-serif">Handler executes</text>
  <text x="1090" y="187.843137296809" text-anchor="middle" font-size="15.996322886139" fill="var(--ok-text)" font-family="Arial, sans-serif">Exception bound</text>
  <text x="1090" y="256.078431351596" text-anchor="middle" font-size="15.996322886139" fill="var(--ok-text)" font-family="Arial, sans-serif">Log, recover, rethrow</text>
  <text x="1090" y="312.941176219147" text-anchor="middle" font-size="15.996322886139" fill="var(--ok-text)" font-family="Arial, sans-serif">Control resumes</text>
  <text x="1090" y="392.549019461169" text-anchor="middle" font-size="15.996322886139" fill="var(--ok-text)" font-family="Arial, sans-serif">Object destroyed</text>
  <text x="1090" y="449.41176432872" text-anchor="middle" font-size="15.996322886139" fill="var(--ok-text)" font-family="Arial, sans-serif">at block end</text>
  <text x="1090" y="540.392156757978" text-anchor="middle" font-size="15.996322886139" fill="var(--ok-text)" font-family="Arial, sans-serif">Normal flow resumes</text>
</svg>

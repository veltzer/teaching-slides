<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="660.689655" y="40" text-anchor="middle" font-size="27.406406" font-weight="bold" fill="var(--text)">Exception Safety Levels</text>
  <rect x="40" y="72.222222" width="268.965517" height="547.777778" rx="6.324555" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="174.482759" y="168.888889" text-anchor="middle" font-size="29.514591" font-weight="bold" fill="var(--danger-text)">No Guarantee</text>
  <line x1="81.37931" y1="201.111111" x2="267.586207" y2="201.111111" stroke="var(--danger-text)" stroke-width="2"/>
  <text x="174.482759" y="319.259259" text-anchor="middle" font-size="21.081851" fill="var(--danger-text)">May corrupt state</text>
  <text x="174.482759" y="426.666667" text-anchor="middle" font-size="18.973666" fill="var(--danger-text)">Avoid</text>
  <rect x="350.344828" y="72.222222" width="268.965517" height="547.777778" rx="6.324555" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="484.827586" y="168.888889" text-anchor="middle" font-size="29.514591" font-weight="bold" fill="var(--warn-text)">Basic</text>
  <line x1="391.724138" y1="201.111111" x2="577.931034" y2="201.111111" stroke="var(--warn-text)" stroke-width="2"/>
  <text x="484.827586" y="319.259259" text-anchor="middle" font-size="21.081851" fill="var(--warn-text)">Invariants hold</text>
  <text x="484.827586" y="426.666667" text-anchor="middle" font-size="18.973666" fill="var(--warn-text)">Partial changes OK</text>
  <rect x="660.689655" y="72.222222" width="268.965517" height="547.777778" rx="6.324555" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="795.172414" y="168.888889" text-anchor="middle" font-size="29.514591" font-weight="bold" fill="var(--primary-text)">Strong</text>
  <line x1="702.068966" y1="201.111111" x2="888.275862" y2="201.111111" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="795.172414" y="319.259259" text-anchor="middle" font-size="21.081851" fill="var(--primary-text)">Commit or rollback</text>
  <text x="795.172414" y="426.666667" text-anchor="middle" font-size="18.973666" fill="var(--primary-text)">Atomic operations</text>
  <rect x="971.034483" y="72.222222" width="268.965517" height="547.777778" rx="6.324555" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1105.517241" y="168.888889" text-anchor="middle" font-size="29.514591" font-weight="bold" fill="var(--ok-text)">No-throw</text>
  <line x1="1012.413793" y1="201.111111" x2="1198.62069" y2="201.111111" stroke="var(--ok-text)" stroke-width="2"/>
  <text x="1105.517241" y="319.259259" text-anchor="middle" font-size="21.081851" fill="var(--ok-text)">Cannot fail</text>
  <text x="1105.517241" y="426.666667" text-anchor="middle" font-size="18.973666" fill="var(--ok-text)">Dtors, swap, move</text>
  <text x="660.689655" y="609.259259" text-anchor="middle" font-size="18.973666" fill="var(--text-muted)">weaker --- stronger guarantees</text>
</svg>

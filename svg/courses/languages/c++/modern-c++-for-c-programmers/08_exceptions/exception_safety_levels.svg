<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="640" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">Exception Safety Levels</text>
  <rect x="40" y="90" width="260" height="510" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="170.0" y="180" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--danger-text)">No Guarantee</text>
  <line x1="80" y1="210" x2="260" y2="210" stroke="var(--danger-text)" stroke-width="2"/>
  <text x="170.0" y="320" text-anchor="middle" font-size="20" fill="var(--danger-text)">May corrupt state</text>
  <text x="170.0" y="420" text-anchor="middle" font-size="18" fill="var(--danger-text)">Avoid</text>
  <rect x="340" y="90" width="260" height="510" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="470.0" y="180" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--warn-text)">Basic</text>
  <line x1="380" y1="210" x2="560" y2="210" stroke="var(--warn-text)" stroke-width="2"/>
  <text x="470.0" y="320" text-anchor="middle" font-size="20" fill="var(--warn-text)">Invariants hold</text>
  <text x="470.0" y="420" text-anchor="middle" font-size="18" fill="var(--warn-text)">Partial changes OK</text>
  <rect x="640" y="90" width="260" height="510" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="770.0" y="180" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--primary-text)">Strong</text>
  <line x1="680" y1="210" x2="860" y2="210" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="770.0" y="320" text-anchor="middle" font-size="20" fill="var(--primary-text)">Commit or rollback</text>
  <text x="770.0" y="420" text-anchor="middle" font-size="18" fill="var(--primary-text)">Atomic operations</text>
  <rect x="940" y="90" width="260" height="510" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1070.0" y="180" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--ok-text)">No-throw</text>
  <line x1="980" y1="210" x2="1160" y2="210" stroke="var(--ok-text)" stroke-width="2"/>
  <text x="1070.0" y="320" text-anchor="middle" font-size="20" fill="var(--ok-text)">Cannot fail</text>
  <text x="1070.0" y="420" text-anchor="middle" font-size="18" fill="var(--ok-text)">Dtors, swap, move</text>
  <text x="640" y="590" text-anchor="middle" font-size="18" fill="var(--text-muted)">weaker --- stronger guarantees</text>
</svg>

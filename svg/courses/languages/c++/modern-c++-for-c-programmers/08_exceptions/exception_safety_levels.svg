<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="268.965517" height="580" rx="6.507913403616" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="174.482759" y="142.352941487889" text-anchor="middle" font-size="30.370263579199" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">No Guarantee</text>
  <line x1="81.37931" y1="176.470588297578" x2="267.586207" y2="176.470588297578" stroke="var(--danger-text)" stroke-width="2"/>
  <text x="174.482759" y="301.568627305652" text-anchor="middle" font-size="21.693045707711" fill="var(--danger-text)" font-family="Arial, sans-serif">May corrupt state</text>
  <text x="174.482759" y="415.294118083045" text-anchor="middle" font-size="19.523741239839" fill="var(--danger-text)" font-family="Arial, sans-serif">Avoid</text>
  <rect x="350.344828" y="40" width="268.965517" height="580" rx="6.507913403616" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="484.827586" y="142.352941487889" text-anchor="middle" font-size="30.370263579199" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Basic</text>
  <line x1="391.724138" y1="176.470588297578" x2="577.931034" y2="176.470588297578" stroke="var(--warn-text)" stroke-width="2"/>
  <text x="484.827586" y="301.568627305652" text-anchor="middle" font-size="21.693045707711" fill="var(--warn-text)" font-family="Arial, sans-serif">Invariants hold</text>
  <text x="484.827586" y="415.294118083045" text-anchor="middle" font-size="19.523741239839" fill="var(--warn-text)" font-family="Arial, sans-serif">Partial changes OK</text>
  <rect x="660.689655" y="40" width="268.965517" height="580" rx="6.507913403616" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795.172414" y="142.352941487889" text-anchor="middle" font-size="30.370263579199" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Strong</text>
  <line x1="702.068966" y1="176.470588297578" x2="888.275862" y2="176.470588297578" stroke="var(--primary-text)" stroke-width="2"/>
  <text x="795.172414" y="301.568627305652" text-anchor="middle" font-size="21.693045707711" fill="var(--primary-text)" font-family="Arial, sans-serif">Commit or rollback</text>
  <text x="795.172414" y="415.294118083045" text-anchor="middle" font-size="19.523741239839" fill="var(--primary-text)" font-family="Arial, sans-serif">Atomic operations</text>
  <rect x="971.034483" y="40" width="268.965517" height="580" rx="6.507913403616" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.517241" y="142.352941487889" text-anchor="middle" font-size="30.370263579199" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">No-throw</text>
  <line x1="1012.413793" y1="176.470588297578" x2="1198.62069" y2="176.470588297578" stroke="var(--ok-text)" stroke-width="2"/>
  <text x="1105.517241" y="301.568627305652" text-anchor="middle" font-size="21.693045707711" fill="var(--ok-text)" font-family="Arial, sans-serif">Cannot fail</text>
  <text x="1105.517241" y="415.294118083045" text-anchor="middle" font-size="19.523741239839" fill="var(--ok-text)" font-family="Arial, sans-serif">Dtors, swap, move</text>
  <text x="660.689655" y="608.627450710496" text-anchor="middle" font-size="19.523741239839" fill="var(--text-muted)" font-family="Arial, sans-serif">weaker --- stronger guarantees</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="575.3846" y="198.2452" width="215.3846" height="54.5192" fill="var(--primary-fill)" stroke="var(--primary-border)" rx="6" stroke-width="2"/>
  <text x="683.0769" y="234.5913" text-anchor="middle">exception</text>
  <rect x="252.3076" y="307.2837" width="258.4615" height="54.5192" fill="var(--danger-fill)" stroke="var(--danger-border)" rx="6" stroke-width="2"/>
  <text x="381.5384" y="343.6298" text-anchor="middle">logic_error</text>
  <rect x="855.3846" y="307.2837" width="258.4615" height="54.5192" fill="var(--ok-fill)" stroke="var(--ok-border)" rx="6" stroke-width="2"/>
  <text x="984.6154" y="343.6298" text-anchor="middle">runtime_error</text>
  <rect x="80" y="416.3221" width="215.3846" height="45.4327" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="187.6922" y="447.2163" text-anchor="middle">invalid_argument</text>
  <rect x="338.4615" y="416.3221" width="215.3846" height="45.4327" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="446.1538" y="447.2163" text-anchor="middle">out_of_range</text>
  <rect x="726.1539" y="416.3221" width="215.3846" height="45.4327" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="833.8461" y="447.2163" text-anchor="middle">system_error</text>
  <rect x="984.6154" y="416.3221" width="215.3846" height="45.4327" fill="var(--warn-fill)" stroke="var(--warn-border)" rx="6" stroke-width="2"/>
  <text x="1092.3077" y="447.2163" text-anchor="middle">overflow_error</text>
  <line x1="683.0769" y1="252.7644" x2="381.5384" y2="307.2837" stroke="var(--black)" />
  <line x1="683.0769" y1="252.7644" x2="984.6154" y2="307.2837" stroke="var(--black)" />
  <line x1="381.5384" y1="361.8029" x2="187.6922" y2="416.3221" stroke="var(--black)" />
  <line x1="381.5384" y1="361.8029" x2="446.1538" y2="416.3221" stroke="var(--black)" />
  <line x1="984.6154" y1="361.8029" x2="833.8461" y2="416.3221" stroke="var(--black)" />
  <line x1="984.6154" y1="361.8029" x2="1092.3077" y2="416.3221" stroke="var(--black)" />
</svg>
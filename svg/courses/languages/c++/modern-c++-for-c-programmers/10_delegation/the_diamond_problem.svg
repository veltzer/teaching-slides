<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="495.172414" y="40" width="289.655172" height="131.320755139373" rx="6.383941627164" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="94.716980508544" text-anchor="middle" font-size="29.791729658415" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Base</text>
  <text x="640" y="138.490565555002" text-anchor="middle" font-size="17.023845371596" fill="var(--primary-text)" font-family="Arial, sans-serif">shared ancestor</text>
  <rect x="40" y="247.924527638128" width="434.482759" height="153.207547129584" rx="6.383941627164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="257.241379" y="308.113206943752" text-anchor="middle" font-size="29.791729658415" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Left</text>
  <text x="257.241379" y="357.358490787291" text-anchor="middle" font-size="17.023845371596" fill="var(--ok-text)" font-family="Arial, sans-serif">inherits Base</text>
  <rect x="805.517241" y="247.924527638128" width="434.482759" height="153.207547129584" rx="6.383941627164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1022.758621" y="308.113206943752" text-anchor="middle" font-size="29.791729658415" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Right</text>
  <text x="1022.758621" y="357.358490787291" text-anchor="middle" font-size="17.023845371596" fill="var(--ok-text)" font-family="Arial, sans-serif">inherits Base</text>
  <rect x="495.172414" y="477.73584939854" width="289.655172" height="142.26415060146" rx="6.383941627164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="532.452829907084" text-anchor="middle" font-size="29.791729658415" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Derived</text>
  <text x="640" y="576.226414953542" text-anchor="middle" font-size="17.023845371596" fill="var(--danger-text)" font-family="Arial, sans-serif">two Base copies!</text>
  <line x1="546.896552" y1="171.320754073336" x2="319.310345" y2="247.924527638128" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="733.103448" y1="171.320754073336" x2="960.689655" y2="247.924527638128" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="319.310345" y1="401.132074767711" x2="546.896552" y2="477.73584939854" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960.689655" y1="401.132074767711" x2="733.103448" y2="477.73584939854" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

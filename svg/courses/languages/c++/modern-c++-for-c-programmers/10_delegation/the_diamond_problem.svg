<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.79321" font-weight="bold" fill="var(--text)">The Diamond Problem</text>
  <rect x="495.172414" y="75.929204" width="289.655172" height="123.185841" rx="6.183048" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="127.256637" text-anchor="middle" font-size="28.854226" font-weight="bold" fill="var(--primary-text)">Base</text>
  <text x="640" y="168.318584" text-anchor="middle" font-size="16.488129" fill="var(--primary-text)">shared ancestor</text>
  <rect x="40" y="270.973451" width="434.482759" height="143.716814" rx="6.183048" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="257.241379" y="327.433628" text-anchor="middle" font-size="28.854226" font-weight="bold" fill="var(--ok-text)">Left</text>
  <text x="257.241379" y="373.628319" text-anchor="middle" font-size="16.488129" fill="var(--ok-text)">inherits Base</text>
  <rect x="805.517241" y="270.973451" width="434.482759" height="143.716814" rx="6.183048" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1022.758621" y="327.433628" text-anchor="middle" font-size="28.854226" font-weight="bold" fill="var(--ok-text)">Right</text>
  <text x="1022.758621" y="373.628319" text-anchor="middle" font-size="16.488129" fill="var(--ok-text)">inherits Base</text>
  <rect x="495.172414" y="486.548673" width="289.655172" height="133.451327" rx="6.183048" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="537.876106" text-anchor="middle" font-size="28.854226" font-weight="bold" fill="var(--danger-text)">Derived</text>
  <text x="640" y="578.938053" text-anchor="middle" font-size="16.488129" fill="var(--danger-text)">two Base copies!</text>
  <line x1="546.896552" y1="199.115044" x2="319.310345" y2="270.973451" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="733.103448" y1="199.115044" x2="960.689655" y2="270.973451" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="319.310345" y1="414.690265" x2="546.896552" y2="486.548673" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960.689655" y1="414.690265" x2="733.103448" y2="486.548673" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

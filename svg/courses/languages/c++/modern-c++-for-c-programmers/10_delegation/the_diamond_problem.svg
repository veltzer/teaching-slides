<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="640" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">The Diamond Problem</text>
  <rect x="500" y="90" width="280" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="140" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--primary-text)">Base</text>
  <text x="640" y="180" text-anchor="middle" font-size="16" fill="var(--primary-text)">shared ancestor</text>
  <rect x="60" y="280" width="420" height="140" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="270" y="335" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--ok-text)">Left</text>
  <text x="270" y="380" text-anchor="middle" font-size="16" fill="var(--ok-text)">inherits Base</text>
  <rect x="800" y="280" width="420" height="140" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1010" y="335" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--ok-text)">Right</text>
  <text x="1010" y="380" text-anchor="middle" font-size="16" fill="var(--ok-text)">inherits Base</text>
  <rect x="500" y="490" width="280" height="130" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="540" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--danger-text)">Derived</text>
  <text x="640" y="580" text-anchor="middle" font-size="16" fill="var(--danger-text)">two Base copies!</text>
  <line x1="550" y1="210" x2="330" y2="280" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="210" x2="950" y2="280" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="420" x2="550" y2="490" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="420" x2="730" y2="490" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

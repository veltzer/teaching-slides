<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="21.3333" y="24" width="384" height="192" fill="#e6f3ff" stroke="#0066cc" />
  <text x="213.3333" y="72" text-anchor="middle" font-size="29.8667" font-weight="bold">Arithmetic</text>
  <text x="213.3333" y="120" text-anchor="middle" font-size="25.6">+ - * / %</text>
  <text x="213.3333" y="168" text-anchor="middle" font-size="25.6">+= -= *= /= %=</text>
  <rect x="448" y="24" width="384" height="192" fill="#ffe6e6" stroke="#cc0000" />
  <text x="640" y="72" text-anchor="middle" font-size="29.8667" font-weight="bold">Comparison</text>
  <text x="640" y="120" text-anchor="middle" font-size="25.6">== != &lt; &gt; &lt;= &gt;=</text>
  <text x="640" y="168" text-anchor="middle" font-size="25.6">&lt;=&gt;</text>
  <rect x="874.6667" y="24" width="384" height="192" fill="#e6ffe6" stroke="#00cc00" />
  <text x="1066.6667" y="72" text-anchor="middle" font-size="29.8667" font-weight="bold">Logical</text>
  <text x="1066.6667" y="120" text-anchor="middle" font-size="25.6">&amp;&amp; || !</text>
  <rect x="21.3333" y="264" width="384" height="192" fill="#fff0e6" stroke="#ff6600" />
  <text x="213.3333" y="312" text-anchor="middle" font-size="29.8667" font-weight="bold">Bitwise</text>
  <text x="213.3333" y="360" text-anchor="middle" font-size="25.6">&amp; | ^ ~ &lt;&lt; &gt;&gt;</text>
  <text x="213.3333" y="408" text-anchor="middle" font-size="25.6">&amp;= |= ^= &lt;&lt;= &gt;&gt;=</text>
  <rect x="448" y="264" width="384" height="192" fill="#f0e6ff" stroke="#6600cc" />
  <text x="640" y="312" text-anchor="middle" font-size="29.8667" font-weight="bold">Access</text>
  <text x="640" y="360" text-anchor="middle" font-size="25.6">[] () -&gt; *</text>
  <rect x="874.6667" y="264" width="384" height="192" fill="#ffffcc" stroke="#cccc00" />
  <text x="1066.6667" y="312" text-anchor="middle" font-size="29.8667" font-weight="bold">Other</text>
  <text x="1066.6667" y="360" text-anchor="middle" font-size="25.6">++ -- , new delete</text>
</svg>
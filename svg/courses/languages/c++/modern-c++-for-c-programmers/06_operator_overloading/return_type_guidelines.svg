<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="106.6667" y="36" width="426.6667" height="108" fill="#e3f2fd" stroke="#0277bd" />
  <text x="320" y="72" text-anchor="middle" font-size="25.2" font-weight="bold">Arithmetic (+, -, *, /)</text>
  <text x="320" y="108" text-anchor="middle" font-size="21.6">Return by value</text>
  <rect x="640" y="36" width="426.6667" height="108" fill="#fce4ec" stroke="#b71c1c" />
  <text x="853.3333" y="72" text-anchor="middle" font-size="25.2" font-weight="bold">Assignment (=, +=, -=)</text>
  <text x="853.3333" y="108" text-anchor="middle" font-size="21.6">Return by reference</text>
  <rect x="106.6667" y="180" width="426.6667" height="108" fill="#e8f5e8" stroke="#28a745" />
  <text x="320" y="216" text-anchor="middle" font-size="25.2" font-weight="bold">Comparison (==, &lt;)</text>
  <text x="320" y="252" text-anchor="middle" font-size="21.6">Return bool</text>
  <rect x="640" y="180" width="426.6667" height="108" fill="#fff3e0" stroke="#ef6c00" />
  <text x="853.3333" y="216" text-anchor="middle" font-size="25.2" font-weight="bold">Pre-increment (++obj)</text>
  <text x="853.3333" y="252" text-anchor="middle" font-size="21.6">Return by reference</text>
  <rect x="106.6667" y="324" width="426.6667" height="108" fill="#f3e5f5" stroke="#7b1fa2" />
  <text x="320" y="360" text-anchor="middle" font-size="25.2" font-weight="bold">Post-increment (obj++)</text>
  <text x="320" y="396" text-anchor="middle" font-size="21.6">Return by value</text>
  <rect x="640" y="324" width="426.6667" height="108" fill="#fff9c4" stroke="#fbbc04" />
  <text x="853.3333" y="360" text-anchor="middle" font-size="25.2" font-weight="bold">Subscript ([])</text>
  <text x="853.3333" y="396" text-anchor="middle" font-size="21.6">Return by reference</text>
</svg>
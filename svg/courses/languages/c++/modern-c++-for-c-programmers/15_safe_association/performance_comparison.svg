  <text x="1070.5455" y="216" text-anchor="middle" font-size="27.9273">weak_ptr</text>
  <rect x="116.3636" y="316.8" width="232.7273" height="86.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="232.7273" y="374.4" text-anchor="middle" font-size="23.2727">Creation: Fast</text>
  <rect x="395.6364" y="316.8" width="232.7273" height="86.4" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="512" y="374.4" text-anchor="middle" font-size="23.2727">Creation: Fast</text>
  <rect x="674.9091" y="316.8" width="232.7273" height="86.4" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="791.2727" y="374.4" text-anchor="middle" font-size="23.2727">Creation: Slow</text>
  <rect x="954.1818" y="316.8" width="232.7273" height="86.4" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1070.5455" y="374.4" text-anchor="middle" font-size="23.2727">Creation: Medium</text>
  <rect x="116.3636" y="432" width="232.7273" height="86.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="232.7273" y="489.6" text-anchor="middle" font-size="23.2727">Copy: Fast</text>
  <rect x="395.6364" y="432" width="232.7273" height="86.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="512" y="489.6" text-anchor="middle" font-size="23.2727">Copy: Move only</text>
  <rect x="674.9091" y="432" width="232.7273" height="86.4" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="791.2727" y="489.6" text-anchor="middle" font-size="23.2727">Copy: Atomic ops</text>
  <rect x="954.1818" y="432" width="232.7273" height="86.4" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1070.5455" y="489.6" text-anchor="middle" font-size="23.2727">Copy: Fast</text>
  <rect x="116.3636" y="547.2" width="232.7273" height="86.4" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="232.7273" y="604.8" text-anchor="middle" font-size="23.2727">Safety: Poor</text>
  <rect x="395.6364" y="547.2" width="232.7273" height="86.4" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="512" y="604.8" text-anchor="middle" font-size="23.2727">Safety: Excellent</text>
  <rect x="674.9091" y="547.2" width="232.7273" height="86.4" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="791.2727" y="604.8" text-anchor="middle" font-size="23.2727">Safety: Excellent</text>
  <rect x="954.1818" y="547.2" width="232.7273" height="86.4" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1070.5455" y="604.8" text-anchor="middle" font-size="23.2727">Safety: Excellent</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="260.8696" height="136.4706" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="170.4349" y="125.2941" text-anchor="middle" font-size="32.1818" font-family="Arial, sans-serif" fill="var(--danger-text)">Raw Pointer</text>
  <rect x="353.0435" y="40" width="260.8696" height="136.4706" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="483.4782" y="125.2941" text-anchor="middle" font-size="32.1818" font-family="Arial, sans-serif" fill="var(--ok-text)">unique_ptr</text>
  <rect x="666.0869" y="40" width="260.8696" height="136.4706" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="796.5217" y="125.2941" text-anchor="middle" font-size="32.1818" font-family="Arial, sans-serif" fill="var(--warn-text)">shared_ptr</text>
  <rect x="979.1304" y="40" width="260.8696" height="136.4706" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1109.5651" y="125.2941" text-anchor="middle" font-size="32.1818" font-family="Arial, sans-serif" fill="var(--info-text)">weak_ptr</text>
  <rect x="40" y="244.7059" width="260.8696" height="102.3529" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4349" y="312.9412" text-anchor="middle" font-size="26.8182" font-family="Arial, sans-serif" fill="var(--danger-text)">Creation: Fast</text>
  <rect x="353.0435" y="244.7059" width="260.8696" height="102.3529" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.4782" y="312.9412" text-anchor="middle" font-size="26.8182" font-family="Arial, sans-serif" fill="var(--ok-text)">Creation: Fast</text>
  <rect x="666.0869" y="244.7059" width="260.8696" height="102.3529" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="796.5217" y="312.9412" text-anchor="middle" font-size="26.8182" font-family="Arial, sans-serif" fill="var(--warn-text)">Creation: Slow</text>
  <rect x="979.1304" y="244.7059" width="260.8696" height="102.3529" fill="url(#grad-info)" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.5651" y="312.9412" text-anchor="middle" font-size="26.8182" font-family="Arial, sans-serif" fill="var(--info-text)">Creation: Medium</text>
  <rect x="40" y="381.1764" width="260.8696" height="102.3529" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4349" y="449.4118" text-anchor="middle" font-size="26.8182" font-family="Arial, sans-serif" fill="var(--danger-text)">Copy: Fast</text>
  <rect x="353.0435" y="381.1764" width="260.8696" height="102.3529" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.4782" y="449.4118" text-anchor="middle" font-size="26.8182" font-family="Arial, sans-serif" fill="var(--danger-text)">Copy: Move only</text>
  <rect x="666.0869" y="381.1764" width="260.8696" height="102.3529" fill="url(#grad-warn)" rx="6" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="796.5217" y="449.4118" text-anchor="middle" font-size="26.8182" font-family="Arial, sans-serif" fill="var(--warn-text)">Copy: Atomic ops</text>
  <rect x="979.1304" y="381.1764" width="260.8696" height="102.3529" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.5651" y="449.4118" text-anchor="middle" font-size="26.8182" font-family="Arial, sans-serif" fill="var(--ok-text)">Copy: Fast</text>
  <rect x="40" y="517.6471" width="260.8696" height="102.3529" fill="url(#grad-danger)" rx="6" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4349" y="585.8823" text-anchor="middle" font-size="26.8182" font-family="Arial, sans-serif" fill="var(--danger-text)">Safety: Poor</text>
  <rect x="353.0435" y="517.6471" width="260.8696" height="102.3529" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.4782" y="585.8823" text-anchor="middle" font-size="26.8182" font-family="Arial, sans-serif" fill="var(--ok-text)">Safety: Excellent</text>
  <rect x="666.0869" y="517.6471" width="260.8696" height="102.3529" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="796.5217" y="585.8823" text-anchor="middle" font-size="26.8182" font-family="Arial, sans-serif" fill="var(--ok-text)">Safety: Excellent</text>
  <rect x="979.1304" y="517.6471" width="260.8696" height="102.3529" fill="url(#grad-ok)" rx="6" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.5651" y="585.8823" text-anchor="middle" font-size="26.8182" font-family="Arial, sans-serif" fill="var(--ok-text)">Safety: Excellent</text>
</svg>

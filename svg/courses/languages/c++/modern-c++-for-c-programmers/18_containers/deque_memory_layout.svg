<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.316497186031" font-weight="bold" fill="var(--text)">deque Memory Layout</text>

  <!-- Map of pointers -->
  <rect x="40" y="70.796460176991" width="1200" height="118.053097345133" rx="6.079124296508" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="106.725663716814" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--primary-text)">Map of pointers</text>

  <rect x="240" y="127.256637168142" width="100" height="43.115044247788" rx="6.079124296508" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="290" y="154.973451327434" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">ptr 0</text>
  <rect x="360" y="127.256637168142" width="100" height="43.115044247788" rx="6.079124296508" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="410" y="154.973451327434" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">ptr 1</text>
  <rect x="480" y="127.256637168142" width="100" height="43.115044247788" rx="6.079124296508" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="530" y="154.973451327434" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">ptr 2</text>
  <rect x="600" y="127.256637168142" width="100" height="43.115044247788" rx="6.079124296508" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="650" y="154.973451327434" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">ptr 3</text>
  <rect x="720" y="127.256637168142" width="100" height="43.115044247788" rx="6.079124296508" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="770" y="154.973451327434" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">ptr 4</text>
  <rect x="840" y="127.256637168142" width="100" height="43.115044247788" rx="6.079124296508" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="890" y="154.973451327434" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">ptr 5</text>

  <line x1="290" y1="188.849557522124" x2="140" y2="286.371681415929" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="188.849557522124" x2="340" y2="286.371681415929" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="188.849557522124" x2="540" y2="286.371681415929" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="188.849557522124" x2="740" y2="286.371681415929" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="188.849557522124" x2="940" y2="286.371681415929" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="890" y1="188.849557522124" x2="1140" y2="286.371681415929" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Blocks -->
  <rect x="40" y="296.637168141593" width="200" height="107.787610619469" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="332.566371681416" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)">Block 0</text>
  <text x="140" y="363.362831858407" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--ok-text)">[ _ _ a b c d ]</text>
  <text x="140" y="389.026548672566" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">front slack</text>

  <rect x="260" y="296.637168141593" width="200" height="107.787610619469" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="332.566371681416" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)">Block 1</text>
  <text x="360" y="363.362831858407" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--ok-text)">[ e f g h i j ]</text>

  <rect x="480" y="296.637168141593" width="200" height="107.787610619469" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="332.566371681416" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)">Block 2</text>
  <text x="580" y="363.362831858407" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--ok-text)">[ k l m n o p ]</text>

  <rect x="700" y="296.637168141593" width="200" height="107.787610619469" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="332.566371681416" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)">Block 3</text>
  <text x="800" y="363.362831858407" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--ok-text)">[ q r s t u v ]</text>

  <rect x="920" y="296.637168141593" width="150" height="107.787610619469" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995" y="332.566371681416" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)">Block 4</text>
  <text x="995" y="363.362831858407" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--ok-text)">[ w x y z _ _ ]</text>
  <text x="995" y="389.026548672566" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--ok-text)">back slack</text>

  <rect x="1090" y="296.637168141593" width="150" height="107.787610619469" rx="6.079124296508" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="1165" y="332.566371681416" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--text-muted)">Block 5</text>
  <text x="1165" y="363.362831858407" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--text-muted)">reserved</text>

  <!-- Properties -->
  <rect x="40" y="430.088495575221" width="590" height="189.911504424779" rx="6.079124296508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="466.017699115044" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--warn-text)">Why</text>
  <text x="335" y="501.946902654867" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--warn-text)">Fixed-size chunks</text>
  <text x="335" y="532.743362831858" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--warn-text)">Grows at both ends</text>
  <text x="335" y="563.53982300885" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--warn-text)">Stable addresses</text>
  <text x="335" y="594.336283185841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--warn-text)">Random access O(1)</text>

  <rect x="650" y="430.088495575221" width="590" height="189.911504424779" rx="6.079124296508" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="466.017699115044" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--info-text)">Consequences</text>
  <text x="945" y="501.946902654867" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--info-text)">push_front/back amortized O(1)</text>
  <text x="945" y="532.743362831858" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--info-text)">Not contiguous</text>
  <text x="945" y="563.53982300885" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--info-text)">Weaker cache locality</text>
  <text x="945" y="594.336283185841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--info-text)">Middle insert invalidates</text>
</svg>

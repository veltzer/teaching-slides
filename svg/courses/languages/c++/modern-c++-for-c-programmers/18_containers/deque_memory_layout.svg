<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Map of pointers -->
  <rect x="40" y="40" width="1200" height="124.672897196262" rx="6.247242382298" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.943925233645" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727146893" font-weight="bold" fill="var(--primary-text)">Map of pointers</text>

  <rect x="240" y="99.6261682243" width="100" height="45.532710280374" rx="6.247242382298" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="290" y="128.897196261683" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--text)">ptr 0</text>
  <rect x="360" y="99.6261682243" width="100" height="45.532710280374" rx="6.247242382298" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="410" y="128.897196261683" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--text)">ptr 1</text>
  <rect x="480" y="99.6261682243" width="100" height="45.532710280374" rx="6.247242382298" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="530" y="128.897196261683" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--text)">ptr 2</text>
  <rect x="600" y="99.6261682243" width="100" height="45.532710280374" rx="6.247242382298" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="650" y="128.897196261683" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--text)">ptr 3</text>
  <rect x="720" y="99.6261682243" width="100" height="45.532710280374" rx="6.247242382298" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="770" y="128.897196261683" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--text)">ptr 4</text>
  <rect x="840" y="99.6261682243" width="100" height="45.532710280374" rx="6.247242382298" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="890" y="128.897196261683" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--text)">ptr 5</text>

  <line x1="290" y1="164.672897196262" x2="140" y2="267.663551401869" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="410" y1="164.672897196262" x2="340" y2="267.663551401869" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="530" y1="164.672897196262" x2="540" y2="267.663551401869" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="650" y1="164.672897196262" x2="740" y2="267.663551401869" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="770" y1="164.672897196262" x2="940" y2="267.663551401869" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="890" y1="164.672897196262" x2="1140" y2="267.663551401869" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Blocks -->
  <rect x="40" y="278.504672897196" width="200" height="113.831775700935" rx="6.247242382298" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="316.448598130841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--ok-text)">Block 0</text>
  <text x="140" y="348.971962616822" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--ok-text)">[ _ _ a b c d ]</text>
  <text x="140" y="376.07476635514" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.494484764595" fill="var(--ok-text)">front slack</text>

  <rect x="260" y="278.504672897196" width="200" height="113.831775700935" rx="6.247242382298" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="316.448598130841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--ok-text)">Block 1</text>
  <text x="360" y="348.971962616822" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--ok-text)">[ e f g h i j ]</text>

  <rect x="480" y="278.504672897196" width="200" height="113.831775700935" rx="6.247242382298" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="316.448598130841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--ok-text)">Block 2</text>
  <text x="580" y="348.971962616822" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--ok-text)">[ k l m n o p ]</text>

  <rect x="700" y="278.504672897196" width="200" height="113.831775700935" rx="6.247242382298" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="316.448598130841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--ok-text)">Block 3</text>
  <text x="800" y="348.971962616822" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--ok-text)">[ q r s t u v ]</text>

  <rect x="920" y="278.504672897196" width="150" height="113.831775700935" rx="6.247242382298" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995" y="316.448598130841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--ok-text)">Block 4</text>
  <text x="995" y="348.971962616822" text-anchor="middle" font-family="Courier New, monospace" font-size="13.535691828312" fill="var(--ok-text)">[ w x y z _ _ ]</text>
  <text x="995" y="376.07476635514" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.494484764595" fill="var(--ok-text)">back slack</text>

  <rect x="1090" y="278.504672897196" width="150" height="113.831775700935" rx="6.247242382298" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="1165" y="316.448598130841" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" font-weight="bold" fill="var(--text-muted)">Block 5</text>
  <text x="1165" y="348.971962616822" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.494484764595" fill="var(--text-muted)">reserved</text>

  <!-- Properties -->
  <rect x="40" y="419.439252336448" width="590" height="200.560747663552" rx="6.247242382298" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="457.383177570093" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727146893" font-weight="bold" fill="var(--warn-text)">Why</text>
  <text x="335" y="495.327102803738" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">Fixed-size chunks</text>
  <text x="335" y="527.850467289719" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">Grows at both ends</text>
  <text x="335" y="560.373831775701" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">Stable addresses</text>
  <text x="335" y="592.897196261683" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">Random access O(1)</text>

  <rect x="650" y="419.439252336448" width="590" height="200.560747663552" rx="6.247242382298" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="457.383177570093" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727146893" font-weight="bold" fill="var(--info-text)">Consequences</text>
  <text x="945" y="495.327102803738" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">push_front/back amortized O(1)</text>
  <text x="945" y="527.850467289719" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">Not contiguous</text>
  <text x="945" y="560.373831775701" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">Weaker cache locality</text>
  <text x="945" y="592.897196261683" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">Middle insert invalidates</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="72" text-anchor="middle" font-size="34.1333" font-weight="bold">Operation Complexity</text>
  <text x="213.3333" y="144" font-size="25.6" font-weight="bold">Container</text>
  <text x="426.6667" y="144" font-size="25.6" font-weight="bold">Access</text>
  <text x="640" y="144" font-size="25.6" font-weight="bold">Insert</text>
  <text x="853.3333" y="144" font-size="25.6" font-weight="bold">Delete</text>
  <text x="1066.6667" y="144" font-size="25.6" font-weight="bold">Search</text>
  <text x="213.3333" y="216" font-size="25.6">vector</text>
  <text x="426.6667" y="216" font-size="25.6" fill="#4CAF50">O(1)</text>
  <text x="640" y="216" font-size="25.6" fill="#FF9800">O(n)</text>
  <text x="853.3333" y="216" font-size="25.6" fill="#FF9800">O(n)</text>
  <text x="1066.6667" y="216" font-size="25.6" fill="#FF9800">O(n)</text>
  <text x="213.3333" y="288" font-size="25.6">list</text>
  <text x="426.6667" y="288" font-size="25.6" fill="#FF9800">O(n)</text>
  <text x="640" y="288" font-size="25.6" fill="#4CAF50">O(1)</text>
  <text x="853.3333" y="288" font-size="25.6" fill="#4CAF50">O(1)</text>
  <text x="1066.6667" y="288" font-size="25.6" fill="#FF9800">O(n)</text>
  <text x="213.3333" y="360" font-size="25.6">set</text>
  <text x="426.6667" y="360" font-size="25.6" fill="#FFC107">O(log n)</text>
  <text x="640" y="360" font-size="25.6" fill="#FFC107">O(log n)</text>
  <text x="853.3333" y="360" font-size="25.6" fill="#FFC107">O(log n)</text>
  <text x="1066.6667" y="360" font-size="25.6" fill="#FFC107">O(log n)</text>
  <text x="213.3333" y="432" font-size="25.6">unordered_map</text>
  <text x="426.6667" y="432" font-size="25.6" fill="#4CAF50">O(1)*</text>
  <text x="640" y="432" font-size="25.6" fill="#4CAF50">O(1)*</text>
  <text x="853.3333" y="432" font-size="25.6" fill="#4CAF50">O(1)*</text>
  <text x="1066.6667" y="432" font-size="25.6" fill="#4CAF50">O(1)*</text>
  <text x="213.3333" y="528" font-size="21.3333">* average case</text>
</svg>
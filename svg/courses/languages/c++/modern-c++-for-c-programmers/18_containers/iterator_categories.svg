  <ns0:rect x="197.5308" y="266.6667" width="790.1234" height="106.6667" fill="#e8f5e9" stroke="#4CAF50" stroke-width="3.9506" />
  <ns0:text x="592.5926" y="333.3333" text-anchor="middle" font-size="27.6544">Forward Iterator (++)</ns0:text>
  <ns0:rect x="296.2963" y="400" width="592.5926" height="106.6667" fill="#fff3e0" stroke="#FF9800" stroke-width="3.9506" />
  <ns0:text x="592.5926" y="466.6667" text-anchor="middle" font-size="27.6544">Bidirectional Iterator (++, --)</ns0:text>

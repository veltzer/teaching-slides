<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="390" height="580" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="235" y="130" text-anchor="middle" font-size="36" font-weight="bold" fill="var(--info-text)">stack</text>
  <text x="235" y="180" text-anchor="middle" font-size="24" fill="var(--info-text)">(LIFO)</text>
  <text x="235" y="260" text-anchor="middle" font-size="18" fill="var(--info-text)">push / pop / top</text>
  <text x="235" y="330" text-anchor="middle" font-size="18" fill="var(--info-text)">backed by deque</text>
  <text x="235" y="400" text-anchor="middle" font-size="18" fill="var(--info-text)">O(1) ops</text>
  <text x="235" y="470" text-anchor="middle" font-size="18" fill="var(--info-text)">no iteration</text>
  <text x="235" y="540" text-anchor="middle" font-size="18" fill="var(--info-text)">undo, parsers</text>

  <rect x="445" y="40" width="390" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="130" text-anchor="middle" font-size="36" font-weight="bold" fill="var(--primary-text)">queue</text>
  <text x="640" y="180" text-anchor="middle" font-size="24" fill="var(--primary-text)">(FIFO)</text>
  <text x="640" y="260" text-anchor="middle" font-size="18" fill="var(--primary-text)">push / pop / front</text>
  <text x="640" y="330" text-anchor="middle" font-size="18" fill="var(--primary-text)">backed by deque</text>
  <text x="640" y="400" text-anchor="middle" font-size="18" fill="var(--primary-text)">O(1) ops</text>
  <text x="640" y="470" text-anchor="middle" font-size="18" fill="var(--primary-text)">no iteration</text>
  <text x="640" y="540" text-anchor="middle" font-size="18" fill="var(--primary-text)">BFS, buffering</text>

  <rect x="850" y="40" width="390" height="580" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1045" y="130" text-anchor="middle" font-size="34" font-weight="bold" fill="var(--ok-text)">priority_queue</text>
  <text x="1045" y="180" text-anchor="middle" font-size="24" fill="var(--ok-text)">(Heap)</text>
  <text x="1045" y="260" text-anchor="middle" font-size="18" fill="var(--ok-text)">push / pop / top</text>
  <text x="1045" y="330" text-anchor="middle" font-size="18" fill="var(--ok-text)">backed by vector</text>
  <text x="1045" y="400" text-anchor="middle" font-size="18" fill="var(--ok-text)">O(log n) insert</text>
  <text x="1045" y="470" text-anchor="middle" font-size="18" fill="var(--ok-text)">max-heap default</text>
  <text x="1045" y="540" text-anchor="middle" font-size="18" fill="var(--ok-text)">Dijkstra, schedulers</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Before: God class -->
  <rect x="30" y="20" width="500" height="540" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="280" y="54" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c62828">Before: One big class</text>

  <rect x="60" y="72" width="440" height="460" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="280" y="106" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#c62828">UserManager</text>
  <line x1="60" y1="116" x2="500" y2="116" stroke="#c62828" stroke-width="1"/>

  <text x="80" y="144" font-family="monospace" font-size="14" fill="#555555">// User data</text>
  <text x="80" y="164" font-family="monospace" font-size="14" fill="#555555">string name, email;</text>
  <text x="80" y="184" font-family="monospace" font-size="14" fill="#555555">string password_hash;</text>

  <text x="80" y="218" font-family="monospace" font-size="14" fill="#555555">// Authentication</text>
  <text x="80" y="238" font-family="monospace" font-size="14" fill="#c62828">bool login(string, string);</text>
  <text x="80" y="258" font-family="monospace" font-size="14" fill="#c62828">void logout();</text>

  <text x="80" y="292" font-family="monospace" font-size="14" fill="#555555">// Database</text>
  <text x="80" y="312" font-family="monospace" font-size="14" fill="#c62828">void save_to_db();</text>
  <text x="80" y="332" font-family="monospace" font-size="14" fill="#c62828">void load_from_db();</text>

  <text x="80" y="366" font-family="monospace" font-size="14" fill="#555555">// Email</text>
  <text x="80" y="386" font-family="monospace" font-size="14" fill="#c62828">void send_welcome();</text>
  <text x="80" y="406" font-family="monospace" font-size="14" fill="#c62828">void send_reset();</text>

  <text x="80" y="440" font-family="monospace" font-size="14" fill="#555555">// Validation</text>
  <text x="80" y="460" font-family="monospace" font-size="14" fill="#c62828">bool validate_email();</text>
  <text x="80" y="480" font-family="monospace" font-size="14" fill="#c62828">bool validate_pass();</text>

  <text x="280" y="516" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c62828">⚠ Hard to test · changes break everything</text>

  <!-- Arrow -->
  <line x1="534" y1="280" x2="594" y2="280" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="564" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1565c0">SRP</text>

  <!-- After: split into 4 classes -->
  <rect x="600" y="20" width="650" height="540" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="925" y="54" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2e7d32">After: One responsibility each</text>

  <rect x="620" y="72" width="280" height="140" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="760" y="100" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">User</text>
  <line x1="620" y1="110" x2="900" y2="110" stroke="#0d47a1" stroke-width="1"/>
  <text x="636" y="130" font-family="monospace" font-size="13" fill="#bbdefb">string name, email;</text>
  <text x="636" y="150" font-family="monospace" font-size="13" fill="#bbdefb">string id;</text>
  <text x="636" y="174" font-family="sans-serif" font-size="13" fill="#90caf9">data only — no logic</text>
  <text x="636" y="196" font-family="sans-serif" font-size="13" fill="#90caf9">trivially testable</text>

  <rect x="920" y="72" width="300" height="140" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1070" y="100" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">UserAuthenticator</text>
  <line x1="920" y1="110" x2="1220" y2="110" stroke="#e0e0e0" stroke-width="1"/>
  <text x="936" y="130" font-family="monospace" font-size="13" fill="#555555">bool login(User&amp;, string);</text>
  <text x="936" y="150" font-family="monospace" font-size="13" fill="#555555">void logout(User&amp;);</text>
  <text x="936" y="174" font-family="sans-serif" font-size="13" fill="#9e9e9e">auth logic only</text>
  <text x="936" y="196" font-family="sans-serif" font-size="13" fill="#9e9e9e">mock easily in tests</text>

  <rect x="620" y="234" width="280" height="140" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760" y="262" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">UserRepository</text>
  <line x1="620" y1="272" x2="900" y2="272" stroke="#e0e0e0" stroke-width="1"/>
  <text x="636" y="292" font-family="monospace" font-size="13" fill="#555555">void save(User&amp;);</text>
  <text x="636" y="312" font-family="monospace" font-size="13" fill="#555555">User load(string id);</text>
  <text x="636" y="336" font-family="sans-serif" font-size="13" fill="#9e9e9e">DB logic only</text>
  <text x="636" y="356" font-family="sans-serif" font-size="13" fill="#9e9e9e">swap DB without touching auth</text>

  <rect x="920" y="234" width="300" height="140" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1070" y="262" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#212121">EmailService</text>
  <line x1="920" y1="272" x2="1220" y2="272" stroke="#e0e0e0" stroke-width="1"/>
  <text x="936" y="292" font-family="monospace" font-size="13" fill="#555555">void welcome(User&amp;);</text>
  <text x="936" y="312" font-family="monospace" font-size="13" fill="#555555">void reset(User&amp;);</text>
  <text x="936" y="336" font-family="sans-serif" font-size="13" fill="#9e9e9e">email logic only</text>
  <text x="936" y="356" font-family="sans-serif" font-size="13" fill="#9e9e9e">change provider without risk</text>

  <rect x="620" y="402" width="600" height="120" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="920" y="432" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">Benefits</text>
  <text x="640" y="458" font-family="sans-serif" font-size="14" fill="#555555">✓ Each class has one reason to change</text>
  <text x="640" y="480" font-family="sans-serif" font-size="14" fill="#555555">✓ Unit test each class independently with mocks</text>
  <text x="640" y="502" font-family="sans-serif" font-size="14" fill="#555555">✓ Replace implementations without touching callers</text>

  <rect x="30" y="578" width="1220" height="42" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="604" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">SRP: A class should have only one reason to change</text>
</svg>

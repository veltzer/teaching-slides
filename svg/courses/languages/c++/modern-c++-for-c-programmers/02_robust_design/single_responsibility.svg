<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="490" height="536.226415094339" rx="10.461068887267" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="78.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--danger-text)">Before: One big class</text>
  <rect x="70" y="100.188679245284" width="430" height="454.150943396227" rx="8.368855109814" fill="var(--danger-accent)"/>
  <text x="285" y="133.018867924528" text-anchor="middle" font-family="Courier New, monospace" font-size="17.783817108355" font-weight="bold" fill="var(--danger-text)">UserManager</text>
  <line x1="70" y1="143.962264150943" x2="500" y2="143.962264150943" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="90" y="176.792452830189" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--danger-text)">string name, email;</text>
  <text x="90" y="204.150943396227" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--danger-text)">string password_hash;</text>
  <text x="90" y="247.924528301887" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--danger-text)">bool login(...);</text>
  <text x="90" y="275.283018867925" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--danger-text)">void logout();</text>
  <text x="90" y="319.056603773585" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--danger-text)">void save_to_db();</text>
  <text x="90" y="346.415094339623" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--danger-text)">void load_from_db();</text>
  <text x="90" y="390.188679245283" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--danger-text)">void send_welcome();</text>
  <text x="90" y="417.547169811321" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--danger-text)">void send_reset();</text>
  <text x="90" y="461.320754716981" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--danger-text)">bool validate_email();</text>
  <text x="90" y="488.679245283019" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--danger-text)">bool validate_pass();</text>
  <text x="285" y="532.452830188679" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--danger-text)">Hard to test</text>

  <line x1="535" y1="264.339622641509" x2="595" y2="264.339622641509" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="565" y="253.396226415095" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-accent)">SRP</text>

  <rect x="600" y="40" width="640" height="536.226415094339" rx="10.461068887267" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="78.301886792453" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--ok-text)">After: One responsibility each</text>

  <rect x="620" y="100.188679245284" width="290" height="142.264150943396" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="133.018867924528" text-anchor="middle" font-family="Courier New, monospace" font-size="15.691603330901" font-weight="bold" fill="var(--primary-text)">User</text>
  <line x1="620" y1="143.962264150943" x2="910" y2="143.962264150943" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="635" y="174.603773584906" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--primary-text)">string name, email;</text>
  <text x="635" y="200.867924528302" font-family="Arial, sans-serif" font-size="12.553282664721" fill="var(--primary-text)">data only</text>

  <rect x="925" y="100.188679245284" width="300" height="142.264150943396" rx="8.368855109814" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1075" y="133.018867924528" text-anchor="middle" font-family="Courier New, monospace" font-size="15.691603330901" font-weight="bold" fill="var(--text)">UserAuthenticator</text>
  <line x1="925" y1="143.962264150943" x2="1225" y2="143.962264150943" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="174.603773584906" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--text)">bool login(...)</text>
  <text x="940" y="200.867924528302" font-family="Arial, sans-serif" font-size="12.553282664721" fill="var(--text-muted)">auth only</text>

  <rect x="620" y="269.811320754717" width="290" height="142.264150943396" rx="8.368855109814" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="765" y="302.641509433962" text-anchor="middle" font-family="Courier New, monospace" font-size="15.691603330901" font-weight="bold" fill="var(--text)">UserRepository</text>
  <line x1="620" y1="313.584905660377" x2="910" y2="313.584905660377" stroke="var(--border)" stroke-width="1"/>
  <text x="635" y="344.22641509434" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--text)">void save(User&amp;)</text>
  <text x="635" y="370.490566037736" font-family="Arial, sans-serif" font-size="12.553282664721" fill="var(--text-muted)">DB only</text>

  <rect x="925" y="269.811320754717" width="300" height="142.264150943396" rx="8.368855109814" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1075" y="302.641509433962" text-anchor="middle" font-family="Courier New, monospace" font-size="15.691603330901" font-weight="bold" fill="var(--text)">EmailService</text>
  <line x1="925" y1="313.584905660377" x2="1225" y2="313.584905660377" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="344.22641509434" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--text)">void welcome(...)</text>
  <text x="940" y="370.490566037736" font-family="Arial, sans-serif" font-size="12.553282664721" fill="var(--text-muted)">email only</text>

  <rect x="620" y="439.433962264151" width="605" height="120.377358490566" rx="8.368855109814" fill="var(--ok-accent)"/>
  <text x="920" y="472.264150943396" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--ok-text)">Benefits</text>
  <text x="640" y="505.094339622641" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--ok-text)">One reason to change</text>
  <text x="640" y="532.452830188679" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--ok-text)">Test with mocks</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" font-weight="bold" fill="var(--text)">SRP: one reason to change</text>
</svg>

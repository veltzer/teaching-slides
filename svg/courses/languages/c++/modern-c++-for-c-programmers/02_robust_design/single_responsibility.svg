<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="491.803174" height="522.000036" rx="6.732354" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.901639" y="72.866682" text-anchor="middle" font-size="19.502059" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Before: One big class</text>
  <rect x="69.508197" y="90.266683" width="432.786885" height="444.666751" rx="6.732354" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.901639" y="123.133366" text-anchor="middle" font-size="17.551808" font-weight="bold" fill="var(--danger-accent)" font-family="Courier New, monospace">UserManager</text>
  <line x1="69.508197" y1="132.799966" x2="502.294977" y2="132.799966" stroke="var(--danger-border)" stroke-width="0.8889" />
  <text x="89.180328" y="159.866688" font-size="13.651307" fill="var(--text-muted)" font-family="Courier New, monospace">// User data</text>
  <text x="89.180328" y="179.20001" font-size="13.651307" fill="var(--text-muted)" font-family="Courier New, monospace">string name, email;</text>
  <text x="89.180328" y="198.533451" font-size="13.651307" fill="var(--text-muted)" font-family="Courier New, monospace">string password_hash;</text>
  <text x="89.180328" y="231.400013" font-size="13.651307" fill="var(--text-muted)" font-family="Courier New, monospace">// Authentication</text>
  <text x="89.180328" y="250.733455" font-size="13.651307" fill="var(--danger-accent)" font-family="Courier New, monospace">bool login(string, string);</text>
  <text x="89.180328" y="270.066656" font-size="13.651307" fill="var(--danger-accent)" font-family="Courier New, monospace">void logout();</text>
  <text x="89.180328" y="302.933458" font-size="13.651307" fill="var(--text-muted)" font-family="Courier New, monospace">// Database</text>
  <text x="89.180328" y="322.266659" font-size="13.651307" fill="var(--danger-accent)" font-family="Courier New, monospace">void save_to_db();</text>
  <text x="89.180328" y="341.599981" font-size="13.651307" fill="var(--danger-accent)" font-family="Courier New, monospace">void load_from_db();</text>
  <text x="89.180328" y="374.466663" font-size="13.651307" fill="var(--text-muted)" font-family="Courier New, monospace">// Email</text>
  <text x="89.180328" y="393.799984" font-size="13.651307" fill="var(--danger-accent)" font-family="Courier New, monospace">void send_welcome();</text>
  <text x="89.180328" y="413.133426" font-size="13.651307" fill="var(--danger-accent)" font-family="Courier New, monospace">void send_reset();</text>
  <text x="89.180328" y="445.999988" font-size="13.651307" fill="var(--text-muted)" font-family="Courier New, monospace">// Validation</text>
  <text x="89.180328" y="465.333429" font-size="13.651307" fill="var(--danger-accent)" font-family="Courier New, monospace">bool validate_email();</text>
  <text x="89.180328" y="484.666751" font-size="13.651307" fill="var(--danger-accent)" font-family="Courier New, monospace">bool validate_pass();</text>
  <text x="285.901639" y="519.466753" text-anchor="middle" font-size="13.651307" fill="var(--danger-accent)" font-family="Arial, sans-serif">⚠ Hard to test · changes break everything</text>
  <line x1="535.737705" y1="291.333417" x2="594.754098" y2="291.333417" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="565.245902" y="279.733377" text-anchor="middle" font-size="13.651307" fill="var(--primary-accent)" font-family="Arial, sans-serif">SRP</text>
  <rect x="600.655738" y="40" width="639.344262" height="522.000036" rx="6.732354" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920.327869" y="72.866682" text-anchor="middle" font-size="19.502059" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">After: One responsibility each</text>
  <rect x="620.327869" y="90.266683" width="275.409836" height="135.333249" rx="6.732354" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="758.032787" y="117.333405" text-anchor="middle" font-size="15.601558" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">User</text>
  <line x1="620.327869" y1="127.000006" x2="895.737705" y2="127.000006" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="636.065574" y="146.333447" font-size="12.67635" fill="var(--primary-accent)" font-family="Courier New, monospace">string name, email;</text>
  <text x="636.065574" y="165.666649" font-size="12.67635" fill="var(--primary-accent)" font-family="Courier New, monospace">string id;</text>
  <text x="636.065574" y="188.86673" font-size="12.67635" fill="var(--primary-accent)" font-family="Arial, sans-serif">data only — no logic</text>
  <text x="636.065574" y="210.133372" font-size="12.67635" fill="var(--primary-accent)" font-family="Arial, sans-serif">trivially testable</text>
  <rect x="915.409836" y="90.266683" width="295.081967" height="135.333249" rx="6.732354" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1062.95082" y="117.333405" text-anchor="middle" font-size="15.601558" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">UserAuthenticator</text>
  <line x1="915.409836" y1="127.000006" x2="1210.491698" y2="127.000006" stroke="var(--border)" stroke-width="0.8889" />
  <text x="931.147541" y="146.333447" font-size="12.67635" fill="var(--text-muted)" font-family="Courier New, monospace">bool login(User&amp;, string);</text>
  <text x="931.147541" y="165.666649" font-size="12.67635" fill="var(--text-muted)" font-family="Courier New, monospace">void logout(User&amp;);</text>
  <text x="931.147541" y="188.86673" font-size="12.67635" fill="var(--text-faint)" font-family="Arial, sans-serif">auth logic only</text>
  <text x="931.147541" y="210.133372" font-size="12.67635" fill="var(--text-faint)" font-family="Arial, sans-serif">mock easily in tests</text>
  <rect x="620.327869" y="246.866694" width="275.409836" height="135.333249" rx="6.732354" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="758.032787" y="273.933416" text-anchor="middle" font-size="15.601558" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">UserRepository</text>
  <line x1="620.327869" y1="283.600017" x2="895.737705" y2="283.600017" stroke="var(--border)" stroke-width="0.8889" />
  <text x="636.065574" y="302.933458" font-size="12.67635" fill="var(--text-muted)" font-family="Courier New, monospace">void save(User&amp;);</text>
  <text x="636.065574" y="322.266659" font-size="12.67635" fill="var(--text-muted)" font-family="Courier New, monospace">User load(string id);</text>
  <text x="636.065574" y="345.466741" font-size="12.67635" fill="var(--text-faint)" font-family="Arial, sans-serif">DB logic only</text>
  <text x="636.065574" y="364.799942" font-size="12.67635" fill="var(--text-faint)" font-family="Arial, sans-serif">swap DB without touching auth</text>
  <rect x="915.409836" y="246.866694" width="295.081967" height="135.333249" rx="6.732354" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1062.95082" y="273.933416" text-anchor="middle" font-size="15.601558" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">EmailService</text>
  <line x1="915.409836" y1="283.600017" x2="1210.491698" y2="283.600017" stroke="var(--border)" stroke-width="0.8889" />
  <text x="931.147541" y="302.933458" font-size="12.67635" fill="var(--text-muted)" font-family="Courier New, monospace">void welcome(User&amp;);</text>
  <text x="931.147541" y="322.266659" font-size="12.67635" fill="var(--text-muted)" font-family="Courier New, monospace">void reset(User&amp;);</text>
  <text x="931.147541" y="345.466741" font-size="12.67635" fill="var(--text-faint)" font-family="Arial, sans-serif">email logic only</text>
  <text x="931.147541" y="364.799942" font-size="12.67635" fill="var(--text-faint)" font-family="Arial, sans-serif">change provider without risk</text>
  <rect x="620.327869" y="409.266665" width="590.163934" height="116.000048" rx="6.732354" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915.409836" y="438.266707" text-anchor="middle" font-size="15.601558" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Benefits</text>
  <text x="640" y="463.399989" font-size="13.651307" fill="var(--text-muted)" font-family="Arial, sans-serif">✓ Each class has one reason to change</text>
  <text x="640" y="484.666751" font-size="13.651307" fill="var(--text-muted)" font-family="Arial, sans-serif">✓ Unit test each class independently with mocks</text>
  <text x="640" y="505.933392" font-size="13.651307" fill="var(--text-muted)" font-family="Arial, sans-serif">✓ Replace implementations without touching callers</text>
  <rect x="40" y="579.400037" width="1199.999895" height="40.599963" rx="6.732354" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="604.533439" text-anchor="middle" font-size="15.601558" fill="var(--primary-accent)" font-family="Arial, sans-serif">SRP: A class should have only one reason to change</text>
</svg>
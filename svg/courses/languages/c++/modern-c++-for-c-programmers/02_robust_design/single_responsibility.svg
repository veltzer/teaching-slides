<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="491.803174" height="522.000036" rx="6.732354" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285.901639" y="72.866682" text-anchor="middle" font-family="sans-serif" font-size="19.502059" font-weight="bold" fill="var(--danger-accent)">Before: One big class</text>
  <rect x="69.508197" y="90.266683" width="432.786885" height="444.666751" rx="6.732354" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="285.901639" y="123.133366" text-anchor="middle" font-family="monospace" font-size="17.551808" font-weight="bold" fill="var(--danger-accent)">UserManager</text>
  <line x1="69.508197" y1="132.799966" x2="502.294977" y2="132.799966" stroke="var(--danger-border)" stroke-width="0.8889" />
  <text x="89.180328" y="159.866688" font-family="monospace" font-size="13.651307" fill="var(--text-muted)">// User data</text>
  <text x="89.180328" y="179.20001" font-family="monospace" font-size="13.651307" fill="var(--text-muted)">string name, email;</text>
  <text x="89.180328" y="198.533451" font-family="monospace" font-size="13.651307" fill="var(--text-muted)">string password_hash;</text>
  <text x="89.180328" y="231.400013" font-family="monospace" font-size="13.651307" fill="var(--text-muted)">// Authentication</text>
  <text x="89.180328" y="250.733455" font-family="monospace" font-size="13.651307" fill="var(--danger-accent)">bool login(string, string);</text>
  <text x="89.180328" y="270.066656" font-family="monospace" font-size="13.651307" fill="var(--danger-accent)">void logout();</text>
  <text x="89.180328" y="302.933458" font-family="monospace" font-size="13.651307" fill="var(--text-muted)">// Database</text>
  <text x="89.180328" y="322.266659" font-family="monospace" font-size="13.651307" fill="var(--danger-accent)">void save_to_db();</text>
  <text x="89.180328" y="341.599981" font-family="monospace" font-size="13.651307" fill="var(--danger-accent)">void load_from_db();</text>
  <text x="89.180328" y="374.466663" font-family="monospace" font-size="13.651307" fill="var(--text-muted)">// Email</text>
  <text x="89.180328" y="393.799984" font-family="monospace" font-size="13.651307" fill="var(--danger-accent)">void send_welcome();</text>
  <text x="89.180328" y="413.133426" font-family="monospace" font-size="13.651307" fill="var(--danger-accent)">void send_reset();</text>
  <text x="89.180328" y="445.999988" font-family="monospace" font-size="13.651307" fill="var(--text-muted)">// Validation</text>
  <text x="89.180328" y="465.333429" font-family="monospace" font-size="13.651307" fill="var(--danger-accent)">bool validate_email();</text>
  <text x="89.180328" y="484.666751" font-family="monospace" font-size="13.651307" fill="var(--danger-accent)">bool validate_pass();</text>
  <text x="285.901639" y="519.466753" text-anchor="middle" font-family="sans-serif" font-size="13.651307" fill="var(--danger-accent)">⚠ Hard to test · changes break everything</text>
  <line x1="535.737705" y1="291.333417" x2="594.754098" y2="291.333417" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="565.245902" y="279.733377" text-anchor="middle" font-family="sans-serif" font-size="13.651307" fill="var(--primary-accent)">SRP</text>
  <rect x="600.655738" y="40" width="639.344262" height="522.000036" rx="6.732354" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920.327869" y="72.866682" text-anchor="middle" font-family="sans-serif" font-size="19.502059" font-weight="bold" fill="var(--ok-accent)">After: One responsibility each</text>
  <rect x="620.327869" y="90.266683" width="275.409836" height="135.333249" rx="6.732354" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="758.032787" y="117.333405" text-anchor="middle" font-family="monospace" font-size="15.601558" font-weight="bold" fill="var(--bg)">User</text>
  <line x1="620.327869" y1="127.000006" x2="895.737705" y2="127.000006" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="636.065574" y="146.333447" font-family="monospace" font-size="12.67635" fill="var(--primary-accent)">string name, email;</text>
  <text x="636.065574" y="165.666649" font-family="monospace" font-size="12.67635" fill="var(--primary-accent)">string id;</text>
  <text x="636.065574" y="188.86673" font-family="sans-serif" font-size="12.67635" fill="var(--primary-accent)">data only — no logic</text>
  <text x="636.065574" y="210.133372" font-family="sans-serif" font-size="12.67635" fill="var(--primary-accent)">trivially testable</text>
  <rect x="915.409836" y="90.266683" width="295.081967" height="135.333249" rx="6.732354" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1062.95082" y="117.333405" text-anchor="middle" font-family="monospace" font-size="15.601558" font-weight="bold" fill="var(--text)">UserAuthenticator</text>
  <line x1="915.409836" y1="127.000006" x2="1210.491698" y2="127.000006" stroke="var(--border)" stroke-width="0.8889" />
  <text x="931.147541" y="146.333447" font-family="monospace" font-size="12.67635" fill="var(--text-muted)">bool login(User&amp;, string);</text>
  <text x="931.147541" y="165.666649" font-family="monospace" font-size="12.67635" fill="var(--text-muted)">void logout(User&amp;);</text>
  <text x="931.147541" y="188.86673" font-family="sans-serif" font-size="12.67635" fill="var(--text-faint)">auth logic only</text>
  <text x="931.147541" y="210.133372" font-family="sans-serif" font-size="12.67635" fill="var(--text-faint)">mock easily in tests</text>
  <rect x="620.327869" y="246.866694" width="275.409836" height="135.333249" rx="6.732354" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="758.032787" y="273.933416" text-anchor="middle" font-family="monospace" font-size="15.601558" font-weight="bold" fill="var(--text)">UserRepository</text>
  <line x1="620.327869" y1="283.600017" x2="895.737705" y2="283.600017" stroke="var(--border)" stroke-width="0.8889" />
  <text x="636.065574" y="302.933458" font-family="monospace" font-size="12.67635" fill="var(--text-muted)">void save(User&amp;);</text>
  <text x="636.065574" y="322.266659" font-family="monospace" font-size="12.67635" fill="var(--text-muted)">User load(string id);</text>
  <text x="636.065574" y="345.466741" font-family="sans-serif" font-size="12.67635" fill="var(--text-faint)">DB logic only</text>
  <text x="636.065574" y="364.799942" font-family="sans-serif" font-size="12.67635" fill="var(--text-faint)">swap DB without touching auth</text>
  <rect x="915.409836" y="246.866694" width="295.081967" height="135.333249" rx="6.732354" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1062.95082" y="273.933416" text-anchor="middle" font-family="monospace" font-size="15.601558" font-weight="bold" fill="var(--text)">EmailService</text>
  <line x1="915.409836" y1="283.600017" x2="1210.491698" y2="283.600017" stroke="var(--border)" stroke-width="0.8889" />
  <text x="931.147541" y="302.933458" font-family="monospace" font-size="12.67635" fill="var(--text-muted)">void welcome(User&amp;);</text>
  <text x="931.147541" y="322.266659" font-family="monospace" font-size="12.67635" fill="var(--text-muted)">void reset(User&amp;);</text>
  <text x="931.147541" y="345.466741" font-family="sans-serif" font-size="12.67635" fill="var(--text-faint)">email logic only</text>
  <text x="931.147541" y="364.799942" font-family="sans-serif" font-size="12.67635" fill="var(--text-faint)">change provider without risk</text>
  <rect x="620.327869" y="409.266665" width="590.163934" height="116.000048" rx="6.732354" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915.409836" y="438.266707" text-anchor="middle" font-family="sans-serif" font-size="15.601558" font-weight="bold" fill="var(--ok-accent)">Benefits</text>
  <text x="640" y="463.399989" font-family="sans-serif" font-size="13.651307" fill="var(--text-muted)">✓ Each class has one reason to change</text>
  <text x="640" y="484.666751" font-family="sans-serif" font-size="13.651307" fill="var(--text-muted)">✓ Unit test each class independently with mocks</text>
  <text x="640" y="505.933392" font-family="sans-serif" font-size="13.651307" fill="var(--text-muted)">✓ Replace implementations without touching callers</text>
  <rect x="40" y="579.400037" width="1199.999895" height="40.599963" rx="6.732354" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="604.533439" text-anchor="middle" font-family="sans-serif" font-size="15.601558" fill="var(--primary-accent)">SRP: A class should have only one reason to change</text>
</svg>
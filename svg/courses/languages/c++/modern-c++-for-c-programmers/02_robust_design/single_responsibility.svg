  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="17.7778" width="444.4444" height="480" rx="7.1111" fill="#ffebee" stroke="#c62828" stroke-width="1.7778" />
  <ns0:text x="248.8889" y="48" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#c62828">Before: One big class</ns0:text>
  <ns0:rect x="53.3333" y="64" width="391.1111" height="408.8889" rx="5.3333" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="248.8889" y="94.2222" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#c62828">UserManager</ns0:text>
  <ns0:line x1="53.3333" y1="103.1111" x2="444.4444" y2="103.1111" stroke="#c62828" stroke-width="0.8889" />
  <ns0:text x="71.1111" y="128" font-family="monospace" font-size="12.4444" fill="#555555">// User data</ns0:text>
  <ns0:text x="71.1111" y="145.7778" font-family="monospace" font-size="12.4444" fill="#555555">string name, email;</ns0:text>
  <ns0:text x="71.1111" y="163.5556" font-family="monospace" font-size="12.4444" fill="#555555">string password_hash;</ns0:text>
  <ns0:text x="71.1111" y="193.7778" font-family="monospace" font-size="12.4444" fill="#555555">// Authentication</ns0:text>
  <ns0:text x="71.1111" y="211.5556" font-family="monospace" font-size="12.4444" fill="#c62828">bool login(string, string);</ns0:text>
  <ns0:text x="71.1111" y="229.3333" font-family="monospace" font-size="12.4444" fill="#c62828">void logout();</ns0:text>
  <ns0:text x="71.1111" y="259.5556" font-family="monospace" font-size="12.4444" fill="#555555">// Database</ns0:text>
  <ns0:text x="71.1111" y="277.3333" font-family="monospace" font-size="12.4444" fill="#c62828">void save_to_db();</ns0:text>
  <ns0:text x="71.1111" y="295.1111" font-family="monospace" font-size="12.4444" fill="#c62828">void load_from_db();</ns0:text>
  <ns0:text x="71.1111" y="325.3333" font-family="monospace" font-size="12.4444" fill="#555555">// Email</ns0:text>
  <ns0:text x="71.1111" y="343.1111" font-family="monospace" font-size="12.4444" fill="#c62828">void send_welcome();</ns0:text>
  <ns0:text x="71.1111" y="360.8889" font-family="monospace" font-size="12.4444" fill="#c62828">void send_reset();</ns0:text>
  <ns0:text x="71.1111" y="391.1111" font-family="monospace" font-size="12.4444" fill="#555555">// Validation</ns0:text>
  <ns0:text x="71.1111" y="408.8889" font-family="monospace" font-size="12.4444" fill="#c62828">bool validate_email();</ns0:text>
  <ns0:text x="71.1111" y="426.6667" font-family="monospace" font-size="12.4444" fill="#c62828">bool validate_pass();</ns0:text>
  <ns0:text x="248.8889" y="458.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#c62828">⚠ Hard to test · changes break everything</ns0:text>
  <ns0:line x1="474.6667" y1="248.8889" x2="528" y2="248.8889" stroke="#1565c0" stroke-width="2.6667" marker-end="url(#arrow-accent)" />
  <ns0:text x="501.3333" y="238.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="#1565c0">SRP</ns0:text>
  <ns0:rect x="533.3333" y="17.7778" width="577.7778" height="480" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:text x="822.2222" y="48" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#2e7d32">After: One responsibility each</ns0:text>
  <ns0:rect x="551.1111" y="64" width="248.8889" height="124.4444" rx="5.3333" fill="url(#grad-accent)" filter="url(#shadow)" />
  <ns0:text x="675.5556" y="88.8889" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#ffffff">User</ns0:text>
  <ns0:line x1="551.1111" y1="97.7778" x2="800" y2="97.7778" stroke="#0d47a1" stroke-width="0.8889" />
  <ns0:text x="565.3333" y="115.5556" font-family="monospace" font-size="11.5556" fill="#bbdefb">string name, email;</ns0:text>
  <ns0:text x="565.3333" y="133.3333" font-family="monospace" font-size="11.5556" fill="#bbdefb">string id;</ns0:text>
  <ns0:text x="565.3333" y="154.6667" font-family="sans-serif" font-size="11.5556" fill="#90caf9">data only — no logic</ns0:text>
  <ns0:text x="565.3333" y="174.2222" font-family="sans-serif" font-size="11.5556" fill="#90caf9">trivially testable</ns0:text>
  <ns0:rect x="817.7778" y="64" width="266.6667" height="124.4444" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="951.1111" y="88.8889" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#212121">UserAuthenticator</ns0:text>
  <ns0:line x1="817.7778" y1="97.7778" x2="1084.4444" y2="97.7778" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="832" y="115.5556" font-family="monospace" font-size="11.5556" fill="#555555">bool login(User&amp;, string);</ns0:text>
  <ns0:text x="832" y="133.3333" font-family="monospace" font-size="11.5556" fill="#555555">void logout(User&amp;);</ns0:text>
  <ns0:text x="832" y="154.6667" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">auth logic only</ns0:text>
  <ns0:text x="832" y="174.2222" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">mock easily in tests</ns0:text>
  <ns0:rect x="551.1111" y="208" width="248.8889" height="124.4444" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="675.5556" y="232.8889" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#212121">UserRepository</ns0:text>
  <ns0:line x1="551.1111" y1="241.7778" x2="800" y2="241.7778" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="565.3333" y="259.5556" font-family="monospace" font-size="11.5556" fill="#555555">void save(User&amp;);</ns0:text>
  <ns0:text x="565.3333" y="277.3333" font-family="monospace" font-size="11.5556" fill="#555555">User load(string id);</ns0:text>
  <ns0:text x="565.3333" y="298.6667" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">DB logic only</ns0:text>
  <ns0:text x="565.3333" y="316.4444" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">swap DB without touching auth</ns0:text>
  <ns0:rect x="817.7778" y="208" width="266.6667" height="124.4444" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="951.1111" y="232.8889" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="#212121">EmailService</ns0:text>
  <ns0:line x1="817.7778" y1="241.7778" x2="1084.4444" y2="241.7778" stroke="#e0e0e0" stroke-width="0.8889" />
  <ns0:text x="832" y="259.5556" font-family="monospace" font-size="11.5556" fill="#555555">void welcome(User&amp;);</ns0:text>
  <ns0:text x="832" y="277.3333" font-family="monospace" font-size="11.5556" fill="#555555">void reset(User&amp;);</ns0:text>
  <ns0:text x="832" y="298.6667" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">email logic only</ns0:text>
  <ns0:text x="832" y="316.4444" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">change provider without risk</ns0:text>
  <ns0:rect x="551.1111" y="357.3333" width="533.3333" height="106.6667" rx="5.3333" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.3333" />
  <ns0:text x="817.7778" y="384" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#2e7d32">Benefits</ns0:text>
  <ns0:text x="568.8889" y="407.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">✓ Each class has one reason to change</ns0:text>
  <ns0:text x="568.8889" y="426.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">✓ Unit test each class independently with mocks</ns0:text>
  <ns0:text x="568.8889" y="446.2222" font-family="sans-serif" font-size="12.4444" fill="#555555">✓ Replace implementations without touching callers</ns0:text>
  <ns0:rect x="26.6667" y="513.7778" width="1084.4444" height="37.3333" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="536.8889" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="#1565c0">SRP: A class should have only one reason to change</ns0:text>
</ns0:svg>
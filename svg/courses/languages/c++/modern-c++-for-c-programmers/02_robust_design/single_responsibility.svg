<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="17.7778" width="444.4444" height="480" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="248.8889" y="48" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">Before: One big class</text>
  <rect x="53.3333" y="64" width="391.1111" height="408.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="248.8889" y="94.2222" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--danger-accent)">UserManager</text>
  <line x1="53.3333" y1="103.1111" x2="444.4444" y2="103.1111" stroke="var(--danger-border)" stroke-width="0.8889" />
  <text x="71.1111" y="128" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">// User data</text>
  <text x="71.1111" y="145.7778" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">string name, email;</text>
  <text x="71.1111" y="163.5556" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">string password_hash;</text>
  <text x="71.1111" y="193.7778" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">// Authentication</text>
  <text x="71.1111" y="211.5556" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">bool login(string, string);</text>
  <text x="71.1111" y="229.3333" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">void logout();</text>
  <text x="71.1111" y="259.5556" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">// Database</text>
  <text x="71.1111" y="277.3333" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">void save_to_db();</text>
  <text x="71.1111" y="295.1111" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">void load_from_db();</text>
  <text x="71.1111" y="325.3333" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">// Email</text>
  <text x="71.1111" y="343.1111" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">void send_welcome();</text>
  <text x="71.1111" y="360.8889" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">void send_reset();</text>
  <text x="71.1111" y="391.1111" font-family="monospace" font-size="12.4444" fill="var(--text-muted)">// Validation</text>
  <text x="71.1111" y="408.8889" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">bool validate_email();</text>
  <text x="71.1111" y="426.6667" font-family="monospace" font-size="12.4444" fill="var(--danger-accent)">bool validate_pass();</text>
  <text x="248.8889" y="458.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--danger-accent)">⚠ Hard to test · changes break everything</text>
  <line x1="474.6667" y1="248.8889" x2="528" y2="248.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="501.3333" y="238.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">SRP</text>
  <rect x="533.3333" y="17.7778" width="577.7778" height="480" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="822.2222" y="48" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">After: One responsibility each</text>
  <rect x="551.1111" y="64" width="248.8889" height="124.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="675.5556" y="88.8889" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--bg)">User</text>
  <line x1="551.1111" y1="97.7778" x2="800" y2="97.7778" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="565.3333" y="115.5556" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">string name, email;</text>
  <text x="565.3333" y="133.3333" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">string id;</text>
  <text x="565.3333" y="154.6667" font-family="sans-serif" font-size="11.5556" fill="var(--primary-accent)">data only — no logic</text>
  <text x="565.3333" y="174.2222" font-family="sans-serif" font-size="11.5556" fill="var(--primary-accent)">trivially testable</text>
  <rect x="817.7778" y="64" width="266.6667" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="951.1111" y="88.8889" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">UserAuthenticator</text>
  <line x1="817.7778" y1="97.7778" x2="1084.4444" y2="97.7778" stroke="var(--border)" stroke-width="0.8889" />
  <text x="832" y="115.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">bool login(User&amp;, string);</text>
  <text x="832" y="133.3333" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">void logout(User&amp;);</text>
  <text x="832" y="154.6667" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">auth logic only</text>
  <text x="832" y="174.2222" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">mock easily in tests</text>
  <rect x="551.1111" y="208" width="248.8889" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="675.5556" y="232.8889" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">UserRepository</text>
  <line x1="551.1111" y1="241.7778" x2="800" y2="241.7778" stroke="var(--border)" stroke-width="0.8889" />
  <text x="565.3333" y="259.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">void save(User&amp;);</text>
  <text x="565.3333" y="277.3333" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">User load(string id);</text>
  <text x="565.3333" y="298.6667" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">DB logic only</text>
  <text x="565.3333" y="316.4444" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">swap DB without touching auth</text>
  <rect x="817.7778" y="208" width="266.6667" height="124.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="951.1111" y="232.8889" text-anchor="middle" font-family="monospace" font-size="14.2222" font-weight="bold" fill="var(--text)">EmailService</text>
  <line x1="817.7778" y1="241.7778" x2="1084.4444" y2="241.7778" stroke="var(--border)" stroke-width="0.8889" />
  <text x="832" y="259.5556" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">void welcome(User&amp;);</text>
  <text x="832" y="277.3333" font-family="monospace" font-size="11.5556" fill="var(--text-muted)">void reset(User&amp;);</text>
  <text x="832" y="298.6667" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">email logic only</text>
  <text x="832" y="316.4444" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">change provider without risk</text>
  <rect x="551.1111" y="357.3333" width="533.3333" height="106.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="817.7778" y="384" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--ok-accent)">Benefits</text>
  <text x="568.8889" y="407.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Each class has one reason to change</text>
  <text x="568.8889" y="426.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Unit test each class independently with mocks</text>
  <text x="568.8889" y="446.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">✓ Replace implementations without touching callers</text>
  <rect x="26.6667" y="513.7778" width="1084.4444" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="536.8889" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">SRP: A class should have only one reason to change</text>
</svg>
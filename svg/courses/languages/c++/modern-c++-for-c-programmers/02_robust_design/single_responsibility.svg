<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534586728656" font-weight="bold" fill="var(--text)">Single Responsibility</text>

  <rect x="40" y="66.126126126126" width="490" height="512.072072072072" rx="10.222744470273" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--danger-text)">Before: One big class</text>
  <rect x="70" y="123.603603603604" width="430" height="433.693693693694" rx="8.178195576219" fill="var(--danger-accent)"/>
  <text x="285" y="154.954954954955" text-anchor="middle" font-family="Courier New, monospace" font-size="17.378665599465" font-weight="bold" fill="var(--danger-text)">UserManager</text>
  <line x1="70" y1="165.405405405405" x2="500" y2="165.405405405405" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="90" y="196.756756756757" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">string name, email;</text>
  <text x="90" y="222.882882882883" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">string password_hash;</text>
  <text x="90" y="264.684684684685" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">bool login(...);</text>
  <text x="90" y="290.810810810811" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">void logout();</text>
  <text x="90" y="332.612612612613" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">void save_to_db();</text>
  <text x="90" y="358.738738738739" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">void load_from_db();</text>
  <text x="90" y="400.540540540541" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">void send_welcome();</text>
  <text x="90" y="426.666666666667" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">void send_reset();</text>
  <text x="90" y="468.468468468468" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">bool validate_email();</text>
  <text x="90" y="494.594594594595" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--danger-text)">bool validate_pass();</text>
  <text x="285" y="536.396396396396" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--danger-text)">Hard to test</text>

  <line x1="535" y1="280.36036036036" x2="595" y2="280.36036036036" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="565" y="269.90990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-accent)">SRP</text>

  <rect x="600" y="66.126126126126" width="640" height="512.072072072072" rx="10.222744470273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--ok-text)">After: One responsibility each</text>

  <rect x="620" y="123.603603603604" width="290" height="135.855855855856" rx="8.178195576219" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="154.954954954955" text-anchor="middle" font-family="Courier New, monospace" font-size="15.33411670541" font-weight="bold" fill="var(--primary-text)">User</text>
  <line x1="620" y1="165.405405405405" x2="910" y2="165.405405405405" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="635" y="194.666666666667" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--primary-text)">string name, email;</text>
  <text x="635" y="219.747747747748" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--primary-text)">data only</text>

  <rect x="925" y="123.603603603604" width="300" height="135.855855855856" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1075" y="154.954954954955" text-anchor="middle" font-family="Courier New, monospace" font-size="15.33411670541" font-weight="bold" fill="var(--text)">UserAuthenticator</text>
  <line x1="925" y1="165.405405405405" x2="1225" y2="165.405405405405" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="194.666666666667" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--text)">bool login(...)</text>
  <text x="940" y="219.747747747748" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">auth only</text>

  <rect x="620" y="285.585585585586" width="290" height="135.855855855856" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="765" y="316.936936936937" text-anchor="middle" font-family="Courier New, monospace" font-size="15.33411670541" font-weight="bold" fill="var(--text)">UserRepository</text>
  <line x1="620" y1="327.387387387387" x2="910" y2="327.387387387387" stroke="var(--border)" stroke-width="1"/>
  <text x="635" y="356.648648648649" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--text)">void save(User&amp;)</text>
  <text x="635" y="381.72972972973" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">DB only</text>

  <rect x="925" y="285.585585585586" width="300" height="135.855855855856" rx="8.178195576219" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1075" y="316.936936936937" text-anchor="middle" font-family="Courier New, monospace" font-size="15.33411670541" font-weight="bold" fill="var(--text)">EmailService</text>
  <line x1="925" y1="327.387387387387" x2="1225" y2="327.387387387387" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="356.648648648649" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--text)">void welcome(...)</text>
  <text x="940" y="381.72972972973" font-family="Arial, sans-serif" font-size="12.267293364328" fill="var(--text-muted)">email only</text>

  <rect x="620" y="447.567567567568" width="605" height="114.954954954955" rx="8.178195576219" fill="var(--ok-accent)"/>
  <text x="920" y="478.918918918919" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--ok-text)">Benefits</text>
  <text x="640" y="510.27027027027" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">One reason to change</text>
  <text x="640" y="536.396396396396" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">Test with mocks</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.33411670541" font-weight="bold" fill="var(--text)">SRP: one reason to change</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="56.1111" width="468.7499" height="435" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="302.5" y="83.5" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--danger-accent)">Before: One big class</text>
  <rect x="96.25" y="98" width="412.5" height="370.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="302.5" y="125.3889" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--danger-accent)">UserManager</text>
  <line x1="96.25" y1="133.4444" x2="508.7499" y2="133.4444" stroke="var(--danger-border)" stroke-width="0.8889" />
  <text x="115" y="156" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">// User data</text>
  <text x="115" y="172.1111" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">string name, email;</text>
  <text x="115" y="188.2223" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">string password_hash;</text>
  <text x="115" y="215.6111" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">// Authentication</text>
  <text x="115" y="231.7223" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">bool login(string, string);</text>
  <text x="115" y="247.8333" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">void logout();</text>
  <text x="115" y="275.2223" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">// Database</text>
  <text x="115" y="291.3333" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">void save_to_db();</text>
  <text x="115" y="307.4444" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">void load_from_db();</text>
  <text x="115" y="334.8333" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">// Email</text>
  <text x="115" y="350.9444" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">void send_welcome();</text>
  <text x="115" y="367.0556" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">void send_reset();</text>
  <text x="115" y="394.4444" font-family="monospace" font-size="12.1663" fill="var(--text-muted)">// Validation</text>
  <text x="115" y="410.5556" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">bool validate_email();</text>
  <text x="115" y="426.6667" font-family="monospace" font-size="12.1663" fill="var(--danger-accent)">bool validate_pass();</text>
  <text x="302.5" y="455.6667" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--danger-accent)">⚠ Hard to test · changes break everything</text>
  <line x1="540.625" y1="265.5556" x2="596.875" y2="265.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="568.75" y="255.8889" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">SRP</text>
  <rect x="602.5" y="56.1111" width="609.375" height="435" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="907.1875" y="83.5" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">After: One responsibility each</text>
  <rect x="621.25" y="98" width="262.5" height="112.7777" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="752.5" y="120.5556" text-anchor="middle" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--bg)">User</text>
  <line x1="621.25" y1="128.6111" x2="883.75" y2="128.6111" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="636.25" y="144.7223" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">string name, email;</text>
  <text x="636.25" y="160.8333" font-family="monospace" font-size="11.2974" fill="var(--primary-accent)">string id;</text>
  <text x="636.25" y="180.1667" font-family="sans-serif" font-size="11.2974" fill="var(--primary-accent)">data only — no logic</text>
  <text x="636.25" y="197.8889" font-family="sans-serif" font-size="11.2974" fill="var(--primary-accent)">trivially testable</text>
  <rect x="902.5" y="98" width="281.25" height="112.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1043.125" y="120.5556" text-anchor="middle" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--text)">UserAuthenticator</text>
  <line x1="902.5" y1="128.6111" x2="1183.7499" y2="128.6111" stroke="var(--border)" stroke-width="0.8889" />
  <text x="917.5" y="144.7223" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">bool login(User&amp;, string);</text>
  <text x="917.5" y="160.8333" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">void logout(User&amp;);</text>
  <text x="917.5" y="180.1667" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">auth logic only</text>
  <text x="917.5" y="197.8889" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">mock easily in tests</text>
  <rect x="621.25" y="228.5" width="262.5" height="112.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="752.5" y="251.0556" text-anchor="middle" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--text)">UserRepository</text>
  <line x1="621.25" y1="259.1111" x2="883.75" y2="259.1111" stroke="var(--border)" stroke-width="0.8889" />
  <text x="636.25" y="275.2223" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">void save(User&amp;);</text>
  <text x="636.25" y="291.3333" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">User load(string id);</text>
  <text x="636.25" y="310.6667" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">DB logic only</text>
  <text x="636.25" y="326.7777" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">swap DB without touching auth</text>
  <rect x="902.5" y="228.5" width="281.25" height="112.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1043.125" y="251.0556" text-anchor="middle" font-family="monospace" font-size="13.9044" font-weight="bold" fill="var(--text)">EmailService</text>
  <line x1="902.5" y1="259.1111" x2="1183.7499" y2="259.1111" stroke="var(--border)" stroke-width="0.8889" />
  <text x="917.5" y="275.2223" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">void welcome(User&amp;);</text>
  <text x="917.5" y="291.3333" font-family="monospace" font-size="11.2974" fill="var(--text-muted)">void reset(User&amp;);</text>
  <text x="917.5" y="310.6667" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">email logic only</text>
  <text x="917.5" y="326.7777" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">change provider without risk</text>
  <rect x="621.25" y="363.8333" width="562.5" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="902.5" y="388" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--ok-accent)">Benefits</text>
  <text x="640" y="408.9444" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✓ Each class has one reason to change</text>
  <text x="640" y="426.6667" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✓ Unit test each class independently with mocks</text>
  <text x="640" y="444.3889" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">✓ Replace implementations without touching callers</text>
  <rect x="68.125" y="505.6111" width="1143.7499" height="33.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="526.5556" text-anchor="middle" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">SRP: A class should have only one reason to change</text>
</svg>
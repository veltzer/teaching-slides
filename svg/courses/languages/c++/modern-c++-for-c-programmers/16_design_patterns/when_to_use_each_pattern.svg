<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="116.3636" y="72" width="1047.2727" height="96" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="640" y="132" text-anchor="middle" font-size="32.5818">Pattern Selection Guide</text>
  <rect x="116.3636" y="216" width="279.2727" height="192" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="256" y="276" text-anchor="middle" font-size="25.6">Creational</text>
  <text x="256" y="324" text-anchor="middle" font-size="23.2727">Complex object creation</text>
  <text x="256" y="360" text-anchor="middle" font-size="23.2727">Hide implementation</text>
  <text x="256" y="396" text-anchor="middle" font-size="23.2727">Configurable creation</text>
  <rect x="442.1818" y="216" width="279.2727" height="192" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="581.8182" y="276" text-anchor="middle" font-size="25.6">Structural</text>
  <text x="581.8182" y="324" text-anchor="middle" font-size="23.2727">Object composition</text>
  <text x="581.8182" y="360" text-anchor="middle" font-size="23.2727">Interface adaptation</text>
  <text x="581.8182" y="396" text-anchor="middle" font-size="23.2727">Hierarchies</text>
  <rect x="768" y="216" width="279.2727" height="192" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="907.6364" y="276" text-anchor="middle" font-size="25.6">Behavioral</text>
  <text x="907.6364" y="324" text-anchor="middle" font-size="23.2727">Object interaction</text>
  <text x="907.6364" y="360" text-anchor="middle" font-size="23.2727">Algorithm variation</text>
  <text x="907.6364" y="396" text-anchor="middle" font-size="23.2727">Communication</text>
  <rect x="116.3636" y="456" width="349.0909" height="144" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="290.9091" y="516" text-anchor="middle" font-size="25.6">Avoid Over-engineering</text>
  <text x="290.9091" y="564" text-anchor="middle" font-size="23.2727">Simple solutions first</text>
  <rect x="512" y="456" width="349.0909" height="144" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="686.5455" y="516" text-anchor="middle" font-size="25.6">Know When to Apply</text>
  <text x="686.5455" y="564" text-anchor="middle" font-size="23.2727">Solve actual problems</text>
  <rect x="907.6364" y="456" width="349.0909" height="144" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="1082.1818" y="516" text-anchor="middle" font-size="25.6">Modern C++ Features</text>
  <text x="1082.1818" y="564" text-anchor="middle" font-size="23.2727">Smart pointers, lambdas</text>
</svg>
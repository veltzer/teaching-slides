<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1102.0407" height="105.4545" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="591.0204" y="105.9091" text-anchor="middle" font-size="35.0301" font-family="Arial, sans-serif" fill="var(--primary-text)">Pattern Selection Guide</text>
  <rect x="40" y="198.1818" width="293.8775" height="210.9091" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="186.9388" y="264.0909" text-anchor="middle" font-size="27.5236" font-family="Arial, sans-serif" fill="var(--ok-text)">Creational</text>
  <text x="186.9388" y="316.8182" text-anchor="middle" font-size="25.0215" font-family="Arial, sans-serif" fill="var(--ok-text)">Complex object creation</text>
  <text x="186.9388" y="356.3636" text-anchor="middle" font-size="25.0215" font-family="Arial, sans-serif" fill="var(--ok-text)">Hide implementation</text>
  <text x="186.9388" y="395.9091" text-anchor="middle" font-size="25.0215" font-family="Arial, sans-serif" fill="var(--ok-text)">Configurable creation</text>
  <rect x="382.8571" y="198.1818" width="293.8775" height="210.9091" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="529.7959" y="264.0909" text-anchor="middle" font-size="27.5236" font-family="Arial, sans-serif" fill="var(--warn-text)">Structural</text>
  <text x="529.7959" y="316.8182" text-anchor="middle" font-size="25.0215" font-family="Arial, sans-serif" fill="var(--warn-text)">Object composition</text>
  <text x="529.7959" y="356.3636" text-anchor="middle" font-size="25.0215" font-family="Arial, sans-serif" fill="var(--warn-text)">Interface adaptation</text>
  <text x="529.7959" y="395.9091" text-anchor="middle" font-size="25.0215" font-family="Arial, sans-serif" fill="var(--warn-text)">Hierarchies</text>
  <rect x="725.7143" y="198.1818" width="293.8775" height="210.9091" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="872.6531" y="264.0909" text-anchor="middle" font-size="27.5236" font-family="Arial, sans-serif" fill="var(--info-text)">Behavioral</text>
  <text x="872.6531" y="316.8182" text-anchor="middle" font-size="25.0215" font-family="Arial, sans-serif" fill="var(--info-text)">Object interaction</text>
  <text x="872.6531" y="356.3636" text-anchor="middle" font-size="25.0215" font-family="Arial, sans-serif" fill="var(--info-text)">Algorithm variation</text>
  <text x="872.6531" y="395.9091" text-anchor="middle" font-size="25.0215" font-family="Arial, sans-serif" fill="var(--info-text)">Communication</text>
  <rect x="40" y="461.8182" width="367.3469" height="158.1818" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="223.6735" y="527.7273" text-anchor="middle" font-size="27.5236" font-family="Arial, sans-serif" fill="var(--danger-text)">Avoid Over-engineering</text>
  <text x="223.6735" y="580.4545" text-anchor="middle" font-size="25.0215" font-family="Arial, sans-serif" fill="var(--danger-text)">Simple solutions first</text>
  <rect x="456.3265" y="461.8182" width="367.3469" height="158.1818" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="527.7273" text-anchor="middle" font-size="27.5236" font-family="Arial, sans-serif" fill="var(--ok-text)">Know When to Apply</text>
  <text x="640.0001" y="580.4545" text-anchor="middle" font-size="25.0215" font-family="Arial, sans-serif" fill="var(--ok-text)">Solve actual problems</text>
  <rect x="872.6531" y="461.8182" width="367.3469" height="158.1818" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1056.3265" y="527.7273" text-anchor="middle" font-size="27.5236" font-family="Arial, sans-serif" fill="var(--primary-text)">Modern C++ Features</text>
  <text x="1056.3265" y="580.4545" text-anchor="middle" font-size="25.0215" font-family="Arial, sans-serif" fill="var(--primary-text)">Smart pointers, lambdas</text>
</svg>

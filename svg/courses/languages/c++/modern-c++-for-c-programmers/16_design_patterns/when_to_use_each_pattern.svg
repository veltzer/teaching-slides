<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1102.0407" height="105.4545" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="591.0204" y="105.9091" text-anchor="middle" font-size="35.0301">Pattern Selection Guide</text>
  <rect x="40" y="198.1818" width="293.8775" height="210.9091" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="186.9388" y="264.0909" text-anchor="middle" font-size="27.5236">Creational</text>
  <text x="186.9388" y="316.8182" text-anchor="middle" font-size="25.0215">Complex object creation</text>
  <text x="186.9388" y="356.3636" text-anchor="middle" font-size="25.0215">Hide implementation</text>
  <text x="186.9388" y="395.9091" text-anchor="middle" font-size="25.0215">Configurable creation</text>
  <rect x="382.8571" y="198.1818" width="293.8775" height="210.9091" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="529.7959" y="264.0909" text-anchor="middle" font-size="27.5236">Structural</text>
  <text x="529.7959" y="316.8182" text-anchor="middle" font-size="25.0215">Object composition</text>
  <text x="529.7959" y="356.3636" text-anchor="middle" font-size="25.0215">Interface adaptation</text>
  <text x="529.7959" y="395.9091" text-anchor="middle" font-size="25.0215">Hierarchies</text>
  <rect x="725.7143" y="198.1818" width="293.8775" height="210.9091" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="872.6531" y="264.0909" text-anchor="middle" font-size="27.5236">Behavioral</text>
  <text x="872.6531" y="316.8182" text-anchor="middle" font-size="25.0215">Object interaction</text>
  <text x="872.6531" y="356.3636" text-anchor="middle" font-size="25.0215">Algorithm variation</text>
  <text x="872.6531" y="395.9091" text-anchor="middle" font-size="25.0215">Communication</text>
  <rect x="40" y="461.8182" width="367.3469" height="158.1818" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="223.6735" y="527.7273" text-anchor="middle" font-size="27.5236">Avoid Over-engineering</text>
  <text x="223.6735" y="580.4545" text-anchor="middle" font-size="25.0215">Simple solutions first</text>
  <rect x="456.3265" y="461.8182" width="367.3469" height="158.1818" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="527.7273" text-anchor="middle" font-size="27.5236">Know When to Apply</text>
  <text x="640.0001" y="580.4545" text-anchor="middle" font-size="25.0215">Solve actual problems</text>
  <rect x="872.6531" y="461.8182" width="367.3469" height="158.1818" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1056.3265" y="527.7273" text-anchor="middle" font-size="27.5236">Modern C++ Features</text>
  <text x="1056.3265" y="580.4545" text-anchor="middle" font-size="25.0215">Smart pointers, lambdas</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="367.3469" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="223.6735" y="136.6667" text-anchor="middle" font-size="38.7272" font-family="Arial, sans-serif" fill="var(--primary-text)">Creational</text>
  <text x="223.6735" y="233.3333" text-anchor="middle" font-size="30.4285" font-family="Arial, sans-serif" fill="var(--primary-text)">Object creation</text>
  <text x="223.6735" y="310.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--primary-text)">• Factory</text>
  <text x="223.6735" y="368.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--primary-text)">• Abstract Factory</text>
  <text x="223.6735" y="426.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--primary-text)">• Builder</text>
  <text x="223.6735" y="484.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--primary-text)">• Prototype</text>
  <text x="223.6735" y="542.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--primary-text)">• Singleton</text>
  <rect x="456.3265" y="40" width="367.3469" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640.0001" y="136.6667" text-anchor="middle" font-size="38.7272" font-family="Arial, sans-serif" fill="var(--ok-text)">Structural</text>
  <text x="640.0001" y="233.3333" text-anchor="middle" font-size="30.4285" font-family="Arial, sans-serif" fill="var(--ok-text)">Object composition</text>
  <text x="640.0001" y="310.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--ok-text)">• Adapter</text>
  <text x="640.0001" y="368.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--ok-text)">• Bridge</text>
  <text x="640.0001" y="426.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--ok-text)">• Composite</text>
  <text x="640.0001" y="484.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--ok-text)">• Decorator</text>
  <text x="640.0001" y="542.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--ok-text)">• Facade</text>
  <text x="640.0001" y="600.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--ok-text)">• Proxy</text>
  <rect x="872.6531" y="40" width="367.3469" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1056.3265" y="136.6667" text-anchor="middle" font-size="38.7272" font-family="Arial, sans-serif" fill="var(--warn-text)">Behavioral</text>
  <text x="1056.3265" y="233.3333" text-anchor="middle" font-size="30.4285" font-family="Arial, sans-serif" fill="var(--warn-text)">Object interaction</text>
  <text x="1056.3265" y="310.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--warn-text)">• Observer</text>
  <text x="1056.3265" y="368.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--warn-text)">• Strategy</text>
  <text x="1056.3265" y="426.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--warn-text)">• Command</text>
  <text x="1056.3265" y="484.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--warn-text)">• Template Method</text>
  <text x="1056.3265" y="542.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--warn-text)">• Visitor</text>
  <text x="1056.3265" y="600.6667" text-anchor="middle" font-size="27.6623" font-family="Arial, sans-serif" fill="var(--warn-text)">• State</text>
</svg>

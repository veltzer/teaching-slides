<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Address column header -->
  <text x="50" y="80" font-size="16" font-weight="bold" fill="#555555">Address</text>

  <!-- char - 1 byte -->
  <text x="50" y="126" font-size="13" fill="#999999">0x1000</text>
  <rect x="170" y="108" width="90" height="36" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="132" text-anchor="middle" font-size="14" fill="#222222">char</text>
  <text x="275" y="132" font-size="13" fill="#555555">1 byte</text>

  <!-- short - 2 bytes -->
  <text x="50" y="172" font-size="13" fill="#999999">0x1002</text>
  <rect x="170" y="154" width="180" height="36" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="178" text-anchor="middle" font-size="14" fill="#222222">short</text>
  <text x="365" y="178" font-size="13" fill="#555555">2 bytes</text>

  <!-- int - 4 bytes -->
  <text x="50" y="218" font-size="13" fill="#999999">0x1004</text>
  <rect x="170" y="200" width="320" height="36" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="224" text-anchor="middle" font-size="14" fill="#222222">int</text>
  <text x="505" y="224" font-size="13" fill="#555555">4 bytes</text>

  <!-- long - 8 bytes -->
  <text x="50" y="264" font-size="13" fill="#999999">0x1008</text>
  <rect x="170" y="246" width="560" height="36" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="270" text-anchor="middle" font-size="14" fill="#222222">long (64-bit)</text>
  <text x="745" y="270" font-size="13" fill="#555555">8 bytes</text>

  <!-- float - 4 bytes -->
  <text x="50" y="310" font-size="13" fill="#999999">0x1010</text>
  <rect x="170" y="292" width="320" height="36" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="316" text-anchor="middle" font-size="14" fill="#222222">float</text>
  <text x="505" y="316" font-size="13" fill="#555555">4 bytes</text>

  <!-- double - 8 bytes -->
  <text x="50" y="356" font-size="13" fill="#999999">0x1014</text>
  <rect x="170" y="338" width="560" height="36" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="362" text-anchor="middle" font-size="14" fill="#222222">double</text>
  <text x="745" y="362" font-size="13" fill="#555555">8 bytes</text>

  <!-- pointer - 8 bytes -->
  <text x="50" y="402" font-size="13" fill="#999999">0x101C</text>
  <rect x="170" y="384" width="560" height="36" rx="6" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="408" text-anchor="middle" font-size="14" fill="#222222">pointer (void *)</text>
  <text x="745" y="408" font-size="13" fill="#555555">8 bytes (64-bit)</text>

  <!-- Struct padding example box -->
  <rect x="50" y="450" width="1180" height="200" rx="7" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="484" text-anchor="middle" font-size="19" font-weight="bold" fill="#222222">Struct Padding Example</text>
  <text x="80" y="514" font-size="14" fill="#555555">struct { char a; int b; char c; }</text>

  <!-- padding blocks -->
  <rect x="80" y="528" width="75" height="32" rx="3" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2"/>
  <text x="117" y="549" text-anchor="middle" font-size="13" fill="#222222">a (1B)</text>
  <rect x="158" y="528" width="165" height="32" rx="3" fill="#fce4ec" stroke="#e53935" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="241" y="549" text-anchor="middle" font-size="13" fill="#e53935">pad (3B)</text>
  <rect x="326" y="528" width="210" height="32" rx="3" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2"/>
  <text x="431" y="549" text-anchor="middle" font-size="13" fill="#222222">b (4B)</text>
  <rect x="539" y="528" width="75" height="32" rx="3" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2"/>
  <text x="577" y="549" text-anchor="middle" font-size="13" fill="#222222">c (1B)</text>
  <rect x="617" y="528" width="165" height="32" rx="3" fill="#fce4ec" stroke="#e53935" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="700" y="549" text-anchor="middle" font-size="13" fill="#e53935">pad (3B)</text>
  <text x="800" y="549" font-size="14" fill="#555555">Total: 12 bytes (not 6!)</text>

  <text x="80" y="625" font-size="14" fill="#555555">Alignment: each field aligned to its size boundary. Use __attribute__((packed)) to disable.</text>
</svg>

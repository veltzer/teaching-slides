<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="86.875" y="104.4444" font-size="13.9044" font-weight="bold" fill="var(--text-muted)">Address</text>
  <text x="86.875" y="141.5" font-size="11.2974" fill="var(--text-faint)">0x1000</text>
  <rect x="199.375" y="127" width="84.375" height="29" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="241.5625" y="146.3333" text-anchor="middle" font-size="12.1663" fill="var(--text)">char</text>
  <text x="297.8124" y="146.3333" font-size="11.2974" fill="var(--text-muted)">1 byte</text>
  <text x="86.875" y="178.5556" font-size="11.2974" fill="var(--text-faint)">0x1002</text>
  <rect x="199.375" y="164.0556" width="168.75" height="29" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="283.75" y="183.3889" text-anchor="middle" font-size="12.1663" fill="var(--text)">short</text>
  <text x="382.1874" y="183.3889" font-size="11.2974" fill="var(--text-muted)">2 bytes</text>
  <text x="86.875" y="215.6111" font-size="11.2974" fill="var(--text-faint)">0x1004</text>
  <rect x="199.375" y="201.1111" width="299.9999" height="29" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="349.375" y="220.4444" text-anchor="middle" font-size="12.1663" fill="var(--text)">int</text>
  <text x="513.4375" y="220.4444" font-size="11.2974" fill="var(--text-muted)">4 bytes</text>
  <text x="86.875" y="252.6667" font-size="11.2974" fill="var(--text-faint)">0x1008</text>
  <rect x="199.375" y="238.1667" width="525" height="29" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="461.875" y="257.5" text-anchor="middle" font-size="12.1663" fill="var(--text)">long (64-bit)</text>
  <text x="738.4375" y="257.5" font-size="11.2974" fill="var(--text-muted)">8 bytes</text>
  <text x="86.875" y="289.7223" font-size="11.2974" fill="var(--text-faint)">0x1010</text>
  <rect x="199.375" y="275.2223" width="299.9999" height="29" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="349.375" y="294.5556" text-anchor="middle" font-size="12.1663" fill="var(--text)">float</text>
  <text x="513.4375" y="294.5556" font-size="11.2974" fill="var(--text-muted)">4 bytes</text>
  <text x="86.875" y="326.7777" font-size="11.2974" fill="var(--text-faint)">0x1014</text>
  <rect x="199.375" y="312.2777" width="525" height="29" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="461.875" y="331.6111" text-anchor="middle" font-size="12.1663" fill="var(--text)">double</text>
  <text x="738.4375" y="331.6111" font-size="11.2974" fill="var(--text-muted)">8 bytes</text>
  <text x="86.875" y="363.8333" font-size="11.2974" fill="var(--text-faint)">0x101C</text>
  <rect x="199.375" y="349.3333" width="525" height="29" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="461.875" y="368.6667" text-anchor="middle" font-size="12.1663" fill="var(--text)">pointer (void *)</text>
  <text x="738.4375" y="368.6667" font-size="11.2974" fill="var(--text-muted)">8 bytes (64-bit)</text>
  <rect x="86.875" y="402.5" width="1106.25" height="161.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="429.8889" text-anchor="middle" font-size="16.5115" font-weight="bold" fill="var(--text)">Struct Padding Example</text>
  <text x="115" y="454.0556" font-size="12.1663" fill="var(--text-muted)">struct { char a; int b; char c; }</text>
  <rect x="115" y="465.3333" width="70.3125" height="25.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="149.6875" y="482.25" text-anchor="middle" font-size="11.2974" fill="var(--text)">a (1B)</text>
  <rect x="188.125" y="465.3333" width="154.6875" height="25.7777" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="4.4444 2.6667" />
  <text x="265.9375" y="482.25" text-anchor="middle" font-size="11.2974" fill="var(--danger-accent)">pad (3B)</text>
  <rect x="345.625" y="465.3333" width="196.875" height="25.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="444.0625" y="482.25" text-anchor="middle" font-size="11.2974" fill="var(--text)">b (4B)</text>
  <rect x="545.3125" y="465.3333" width="70.3125" height="25.7777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="580.9375" y="482.25" text-anchor="middle" font-size="11.2974" fill="var(--text)">c (1B)</text>
  <rect x="618.4374" y="465.3333" width="154.6875" height="25.7777" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="4.4444 2.6667" />
  <text x="696.25" y="482.25" text-anchor="middle" font-size="11.2974" fill="var(--danger-accent)">pad (3B)</text>
  <text x="790" y="482.25" font-size="12.1663" fill="var(--text-muted)">Total: 12 bytes (not 6!)</text>
  <text x="115" y="543.4723" font-size="12.1663" fill="var(--text-muted)">Alignment: each field aligned to its size boundary. Use __attribute__((packed)) to disable.</text>
</svg>
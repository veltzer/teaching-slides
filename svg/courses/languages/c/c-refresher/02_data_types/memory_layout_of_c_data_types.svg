<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="44.4444" y="71.1111" font-size="14.2222" font-weight="bold" fill="var(--text-muted)">Address</text>
  <text x="44.4444" y="112" font-size="11.5556" fill="var(--text-faint)">0x1000</text>
  <rect x="151.1111" y="96" width="80" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="191.1111" y="117.3333" text-anchor="middle" font-size="12.4444" fill="var(--text)">char</text>
  <text x="244.4444" y="117.3333" font-size="11.5556" fill="var(--text-muted)">1 byte</text>
  <text x="44.4444" y="152.8889" font-size="11.5556" fill="var(--text-faint)">0x1002</text>
  <rect x="151.1111" y="136.8889" width="160" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="231.1111" y="158.2222" text-anchor="middle" font-size="12.4444" fill="var(--text)">short</text>
  <text x="324.4444" y="158.2222" font-size="11.5556" fill="var(--text-muted)">2 bytes</text>
  <text x="44.4444" y="193.7778" font-size="11.5556" fill="var(--text-faint)">0x1004</text>
  <rect x="151.1111" y="177.7778" width="284.4444" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="293.3333" y="199.1111" text-anchor="middle" font-size="12.4444" fill="var(--text)">int</text>
  <text x="448.8889" y="199.1111" font-size="11.5556" fill="var(--text-muted)">4 bytes</text>
  <text x="44.4444" y="234.6667" font-size="11.5556" fill="var(--text-faint)">0x1008</text>
  <rect x="151.1111" y="218.6667" width="497.7778" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="400" y="240" text-anchor="middle" font-size="12.4444" fill="var(--text)">long (64-bit)</text>
  <text x="662.2222" y="240" font-size="11.5556" fill="var(--text-muted)">8 bytes</text>
  <text x="44.4444" y="275.5556" font-size="11.5556" fill="var(--text-faint)">0x1010</text>
  <rect x="151.1111" y="259.5556" width="284.4444" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="293.3333" y="280.8889" text-anchor="middle" font-size="12.4444" fill="var(--text)">float</text>
  <text x="448.8889" y="280.8889" font-size="11.5556" fill="var(--text-muted)">4 bytes</text>
  <text x="44.4444" y="316.4444" font-size="11.5556" fill="var(--text-faint)">0x1014</text>
  <rect x="151.1111" y="300.4444" width="497.7778" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="400" y="321.7778" text-anchor="middle" font-size="12.4444" fill="var(--text)">double</text>
  <text x="662.2222" y="321.7778" font-size="11.5556" fill="var(--text-muted)">8 bytes</text>
  <text x="44.4444" y="357.3333" font-size="11.5556" fill="var(--text-faint)">0x101C</text>
  <rect x="151.1111" y="341.3333" width="497.7778" height="32" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="400" y="362.6667" text-anchor="middle" font-size="12.4444" fill="var(--text)">pointer (void *)</text>
  <text x="662.2222" y="362.6667" font-size="11.5556" fill="var(--text-muted)">8 bytes (64-bit)</text>
  <rect x="44.4444" y="400" width="1048.8889" height="177.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="430.2222" text-anchor="middle" font-size="16.8889" font-weight="bold" fill="var(--text)">Struct Padding Example</text>
  <text x="71.1111" y="456.8889" font-size="12.4444" fill="var(--text-muted)">struct { char a; int b; char c; }</text>
  <rect x="71.1111" y="469.3333" width="66.6667" height="28.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="104" y="488" text-anchor="middle" font-size="11.5556" fill="var(--text)">a (1B)</text>
  <rect x="140.4444" y="469.3333" width="146.6667" height="28.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="4.4444 2.6667" />
  <text x="214.2222" y="488" text-anchor="middle" font-size="11.5556" fill="var(--danger-accent)">pad (3B)</text>
  <rect x="289.7778" y="469.3333" width="186.6667" height="28.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="383.1111" y="488" text-anchor="middle" font-size="11.5556" fill="var(--text)">b (4B)</text>
  <rect x="479.1111" y="469.3333" width="66.6667" height="28.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="512.8889" y="488" text-anchor="middle" font-size="11.5556" fill="var(--text)">c (1B)</text>
  <rect x="548.4444" y="469.3333" width="146.6667" height="28.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="4.4444 2.6667" />
  <text x="622.2222" y="488" text-anchor="middle" font-size="11.5556" fill="var(--danger-accent)">pad (3B)</text>
  <text x="711.1111" y="488" font-size="12.4444" fill="var(--text-muted)">Total: 12 bytes (not 6!)</text>
  <text x="71.1111" y="555.5556" font-size="12.4444" fill="var(--text-muted)">Alignment: each field aligned to its size boundary. Use __attribute__((packed)) to disable.</text>
</svg>
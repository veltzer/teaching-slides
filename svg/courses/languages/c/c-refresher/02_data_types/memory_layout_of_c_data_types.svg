  <text x="268.813451" y="92.912291" font-size="13.224257" fill="var(--text-muted)" font-family="Arial, sans-serif">1 byte</text>
  <text x="40" y="133.614141" font-size="13.224257" fill="var(--text-faint)" font-family="Arial, sans-serif">0x1002</text>
  <rect x="162.033898" y="115.298352" width="183.050847" height="36.631576" rx="7.023346" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="253.559322" y="139.719361" text-anchor="middle" font-size="14.241355" fill="var(--text)" font-family="Arial, sans-serif">short</text>
  <text x="360.338875" y="139.719361" font-size="13.224257" fill="var(--text-muted)" font-family="Arial, sans-serif">2 bytes</text>
  <text x="40" y="180.421085" font-size="13.224257" fill="var(--text-faint)" font-family="Arial, sans-serif">0x1004</text>
  <rect x="162.033898" y="162.105296" width="325.42362" height="36.631576" rx="7.023346" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="324.745763" y="186.526305" text-anchor="middle" font-size="14.241355" fill="var(--text)" font-family="Arial, sans-serif">int</text>
  <text x="502.711864" y="186.526305" font-size="13.224257" fill="var(--text-muted)" font-family="Arial, sans-serif">4 bytes</text>
  <text x="40" y="227.228155" font-size="13.224257" fill="var(--text-faint)" font-family="Arial, sans-serif">0x1008</text>
  <rect x="162.033898" y="208.912367" width="569.491525" height="36.631576" rx="7.023346" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="446.779661" y="233.333375" text-anchor="middle" font-size="14.241355" fill="var(--text)" font-family="Arial, sans-serif">long (64-bit)</text>
  <text x="746.779661" y="233.333375" font-size="13.224257" fill="var(--text-muted)" font-family="Arial, sans-serif">8 bytes</text>

  <text x="234.237288" y="517.228092" text-anchor="middle" font-size="13.224257" fill="var(--danger-accent)">pad (3B)</text>
  <rect x="320.677966" y="495.85963" width="213.559322" height="32.561303" rx="7.023346" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="427.457627" y="517.228092" text-anchor="middle" font-size="13.224257" fill="var(--text)">b (4B)</text>
  <rect x="537.288136" y="495.85963" width="76.271186" height="32.561303" rx="7.023346" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="575.932203" y="517.228092" text-anchor="middle" font-size="13.224257" fill="var(--text)">c (1B)</text>
  <rect x="616.610061" y="495.85963" width="167.79661" height="32.561303" rx="7.023346" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="4.4444 2.6667" filter="url(#shadow)"/>
  <text x="701.016949" y="517.228092" text-anchor="middle" font-size="13.224257" fill="var(--danger-accent)">pad (3B)</text>
  <text x="802.711864" y="517.228092" font-size="14.241355" fill="var(--text-muted)">Total: 12 bytes (not 6!)</text>
  <text x="70.508475" y="594.561518" font-size="14.241355" fill="var(--text-muted)">Alignment: each field aligned to its size boundary. Use __attribute__((packed)) to disable.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 520" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="375" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Memory Layout of C Data Types</text>
  <!-- Memory address column -->
  <text x="30" y="70" font-size="12" font-weight="bold" fill="#555">Address</text>
  <!-- char -->
  <text x="30" y="105" font-size="10" fill="#999">0x1000</text>
  <rect x="100" y="88" width="60" height="28" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="130" y="107" text-anchor="middle" font-size="11" fill="#333">char</text>
  <text x="175" y="107" font-size="10" fill="#555">1 byte</text>
  <!-- short -->
  <text x="30" y="145" font-size="10" fill="#999">0x1002</text>
  <rect x="100" y="128" width="120" height="28" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="160" y="147" text-anchor="middle" font-size="11" fill="#333">short</text>
  <text x="235" y="147" font-size="10" fill="#555">2 bytes</text>
  <!-- int -->
  <text x="30" y="185" font-size="10" fill="#999">0x1004</text>
  <rect x="100" y="168" width="200" height="28" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="200" y="187" text-anchor="middle" font-size="11" fill="#333">int</text>
  <text x="315" y="187" font-size="10" fill="#555">4 bytes</text>
  <!-- long (64-bit) -->
  <text x="30" y="225" font-size="10" fill="#999">0x1008</text>
  <rect x="100" y="208" width="350" height="28" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="275" y="227" text-anchor="middle" font-size="11" fill="#333">long (64-bit)</text>
  <text x="465" y="227" font-size="10" fill="#555">8 bytes</text>
  <!-- float -->
  <text x="30" y="265" font-size="10" fill="#999">0x1010</text>
  <rect x="100" y="248" width="200" height="28" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="200" y="267" text-anchor="middle" font-size="11" fill="#333">float</text>
  <text x="315" y="267" font-size="10" fill="#555">4 bytes</text>
  <!-- double -->
  <text x="30" y="305" font-size="10" fill="#999">0x1014</text>
  <rect x="100" y="288" width="350" height="28" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="275" y="307" text-anchor="middle" font-size="11" fill="#333">double</text>
  <text x="465" y="307" font-size="10" fill="#555">8 bytes</text>
  <!-- pointer -->
  <text x="30" y="345" font-size="10" fill="#999">0x101C</text>
  <rect x="100" y="328" width="350" height="28" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="275" y="347" text-anchor="middle" font-size="11" fill="#333">pointer (void *)</text>
  <text x="465" y="347" font-size="10" fill="#555">8 bytes (64-bit)</text>
  <!-- Struct padding example -->
  <rect x="30" y="380" width="690" height="120" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Struct Padding Example</text>
  <text x="50" y="425" font-size="11" fill="#555">struct { char a; int b; char c; }</text>
  <!-- Padded layout -->
  <rect x="50" y="438" width="50" height="25" rx="2" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="75" y="455" text-anchor="middle" font-size="10" fill="#333">a (1B)</text>
  <rect x="100" y="438" width="110" height="25" rx="2" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="155" y="455" text-anchor="middle" font-size="10" fill="#dc3545">pad (3B)</text>
  <rect x="210" y="438" width="140" height="25" rx="2" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="280" y="455" text-anchor="middle" font-size="10" fill="#333">b (4B)</text>
  <rect x="350" y="438" width="50" height="25" rx="2" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="375" y="455" text-anchor="middle" font-size="10" fill="#333">c (1B)</text>
  <rect x="400" y="438" width="110" height="25" rx="2" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="455" y="455" text-anchor="middle" font-size="10" fill="#dc3545">pad (3B)</text>
  <text x="540" y="455" font-size="11" fill="#555">Total: 12 bytes (not 6!)</text>
  <text x="50" y="488" font-size="11" fill="#555">Alignment: each field aligned to its size boundary. Use __attribute__((packed)) to disable.</text>
</svg>
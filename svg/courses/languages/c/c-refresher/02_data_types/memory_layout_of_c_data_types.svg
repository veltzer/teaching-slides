  <text x="575.932203" y="517.228092" text-anchor="middle" font-size="13.224257" fill="var(--text)" font-family="Arial, sans-serif">c (1B)</text>
  <rect x="616.610061" y="495.85963" width="167.79661" height="32.561303" rx="7.023346" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="4.4444 2.6667" filter="url(#shadow)"/>
  <text x="701.016949" y="517.228092" text-anchor="middle" font-size="13.224257" fill="var(--danger-accent)" font-family="Arial, sans-serif">pad (3B)</text>
  <text x="802.711864" y="517.228092" font-size="14.241355" fill="var(--text-muted)" font-family="Arial, sans-serif">Total: 12 bytes (not 6!)</text>
  <text x="70.508475" y="594.561518" font-size="14.241355" fill="var(--text-muted)" font-family="Arial, sans-serif">Alignment: each field aligned to its size boundary. Use __attribute__((packed)) to disable.</text>
</svg>

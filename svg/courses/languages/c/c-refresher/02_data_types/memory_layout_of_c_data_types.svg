  <text x="234.237288" y="517.228092" text-anchor="middle" font-size="13.224257" fill="var(--danger-accent)" font-family="Arial, sans-serif">pad (3B)</text>
  <rect x="320.677966" y="495.85963" width="213.559322" height="32.561303" rx="7.023346" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

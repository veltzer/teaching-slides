  <rect x="162.033898" y="255.719437" width="325.42362" height="36.631576" rx="7.023346" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="324.745763" y="280.140446" text-anchor="middle" font-size="14.241355" fill="var(--text)" font-family="Arial, sans-serif">float</text>
  <text x="502.711864" y="280.140446" font-size="13.224257" fill="var(--text-muted)" font-family="Arial, sans-serif">4 bytes</text>
  <text x="40" y="320.842043" font-size="13.224257" fill="var(--text-faint)" font-family="Arial, sans-serif">0x1014</text>
  <rect x="162.033898" y="302.526255" width="569.491525" height="36.631576" rx="7.023346" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="446.779661" y="326.94739" text-anchor="middle" font-size="14.241355" fill="var(--text)" font-family="Arial, sans-serif">double</text>
  <text x="746.779661" y="326.94739" font-size="13.224257" fill="var(--text-muted)" font-family="Arial, sans-serif">8 bytes</text>
  <text x="40" y="367.649113" font-size="13.224257" fill="var(--text-faint)" font-family="Arial, sans-serif">0x101C</text>
  <rect x="162.033898" y="349.333325" width="569.491525" height="36.631576" rx="7.023346" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="446.779661" y="373.75446" text-anchor="middle" font-size="14.241355" fill="var(--text)" font-family="Arial, sans-serif">pointer (void *)</text>
  <text x="746.779661" y="373.75446" font-size="13.224257" fill="var(--text-muted)" font-family="Arial, sans-serif">8 bytes (64-bit)</text>

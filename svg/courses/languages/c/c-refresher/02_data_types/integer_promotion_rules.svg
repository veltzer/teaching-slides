<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1155.555557" height="52.270383738537" rx="10.319003135976" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="617.777778" y="73.171539058763" text-anchor="middle" font-size="29.891742414421" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">long double</text>
  <text x="706.666667" y="110.363973735619" text-anchor="middle" font-size="32.880814308157" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="115.389873637731" width="1155.555557" height="52.270383738537" rx="10.319003135976" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="617.777778" y="148.561537895831" text-anchor="middle" font-size="29.891742414421" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">double</text>
  <text x="706.666667" y="185.753972572686" text-anchor="middle" font-size="32.880814308157" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="190.779872474798" width="1155.555557" height="52.270383738537" rx="10.319003135976" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="617.777778" y="223.951411533562" text-anchor="middle" font-size="29.891742414421" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">float</text>
  <text x="706.666667" y="261.143846210417" text-anchor="middle" font-size="32.880814308157" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="266.169871311866" width="1155.555557" height="52.270383738537" rx="10.319003135976" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="617.777778" y="299.341410370629" text-anchor="middle" font-size="29.891742414421" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">unsigned long long</text>
  <text x="706.666667" y="336.533845047484" text-anchor="middle" font-size="32.880814308157" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="341.559744949597" width="1155.555557" height="52.270383738537" rx="10.319003135976" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="617.777778" y="374.731409207696" text-anchor="middle" font-size="29.891742414421" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">long long</text>
  <text x="706.666667" y="411.923843884552" text-anchor="middle" font-size="32.880814308157" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="416.949743786664" width="1155.555557" height="52.270383738537" rx="10.319003135976" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="617.777778" y="450.121282845427" text-anchor="middle" font-size="29.891742414421" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">unsigned long</text>
  <text x="706.666667" y="487.313717522283" text-anchor="middle" font-size="32.880814308157" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="492.339741580404" width="1155.555557" height="52.270383738537" rx="10.319003135976" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="617.777778" y="525.511281682495" text-anchor="middle" font-size="29.891742414421" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">unsigned int</text>
  <text x="706.666667" y="562.70371635935" text-anchor="middle" font-size="32.880814308157" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="567.729616261463" width="1155.555557" height="52.270383738537" rx="10.319003135976" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="617.777778" y="600.901280519562" text-anchor="middle" font-size="29.891742414421" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">int</text>
  <text x="1240" y="600.901280519562" font-size="22.418721521061" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">char, short promoted here</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" font-family="Arial, sans-serif">
  <text x="250" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Implicit Conversion Hierarchy</text>
  <rect x="50" y="40" width="400" height="420" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <!-- Type boxes from top to bottom -->
  <rect x="130" y="55" width="200" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="230" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">long double</text>
  <text x="250" y="100" text-anchor="middle" font-size="14" fill="#4a90e2">^</text>
  <rect x="130" y="105" width="200" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="230" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">double</text>
  <text x="250" y="150" text-anchor="middle" font-size="14" fill="#4a90e2">^</text>
  <rect x="130" y="155" width="200" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="230" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">float</text>
  <text x="250" y="200" text-anchor="middle" font-size="14" fill="#4a90e2">^</text>
  <rect x="130" y="205" width="200" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="230" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">unsigned long long</text>
  <text x="250" y="250" text-anchor="middle" font-size="14" fill="#4a90e2">^</text>
  <rect x="130" y="255" width="200" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="230" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">long long</text>
  <text x="250" y="300" text-anchor="middle" font-size="14" fill="#4a90e2">^</text>
  <rect x="130" y="305" width="200" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="230" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">unsigned long</text>
  <text x="250" y="350" text-anchor="middle" font-size="14" fill="#4a90e2">^</text>
  <rect x="130" y="355" width="200" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="230" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">unsigned int</text>
  <text x="250" y="400" text-anchor="middle" font-size="14" fill="#4a90e2">^</text>
  <rect x="130" y="405" width="200" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="230" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">int</text>
  <text x="350" y="425" font-size="10" fill="#dc3545">char, short promoted here</text>
</svg>
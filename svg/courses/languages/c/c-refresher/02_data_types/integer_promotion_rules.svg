<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="80.2777" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--text)">Implicit Conversion Hierarchy</text>
  <rect x="358.75" y="100.4167" width="487.5" height="41.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="602.5" y="127" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)">long double</text>
  <text x="640" y="156.8056" text-anchor="middle" font-size="19.1186" fill="var(--primary-accent)">^</text>
  <rect x="358.75" y="160.8333" width="487.5" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="602.5" y="187.4167" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">double</text>
  <text x="640" y="217.2223" text-anchor="middle" font-size="19.1186" fill="var(--primary-accent)">^</text>
  <rect x="358.75" y="221.25" width="487.5" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="602.5" y="247.8333" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">float</text>
  <text x="640" y="277.6389" text-anchor="middle" font-size="19.1186" fill="var(--primary-accent)">^</text>
  <rect x="358.75" y="281.6667" width="487.5" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="602.5" y="308.25" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">unsigned long long</text>
  <text x="640" y="338.0556" text-anchor="middle" font-size="19.1186" fill="var(--primary-accent)">^</text>
  <rect x="358.75" y="342.0833" width="487.5" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="602.5" y="368.6667" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">long long</text>
  <text x="640" y="398.4723" text-anchor="middle" font-size="19.1186" fill="var(--primary-accent)">^</text>
  <rect x="358.75" y="402.5" width="487.5" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="602.5" y="429.0833" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">unsigned long</text>
  <text x="640" y="458.8889" text-anchor="middle" font-size="19.1186" fill="var(--primary-accent)">^</text>
  <rect x="358.75" y="462.9167" width="487.5" height="41.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="602.5" y="489.5" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">unsigned int</text>
  <text x="640" y="519.3056" text-anchor="middle" font-size="19.1186" fill="var(--primary-accent)">^</text>
  <rect x="358.75" y="523.3333" width="487.5" height="41.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="602.5" y="549.9167" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)">int</text>
  <text x="865" y="549.9167" font-size="13.0354" fill="var(--primary-accent)" font-weight="bold">char, short promoted here</text>
</svg>
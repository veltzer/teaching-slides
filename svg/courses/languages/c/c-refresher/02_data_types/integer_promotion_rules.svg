<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="50" text-anchor="middle" font-size="26" font-weight="bold" fill="#222222">Implicit Conversion Hierarchy</text>

  <!-- Hierarchy rows, bottom = int (lowest), top = long double (highest) -->
  <!-- long double - top -->
  <rect x="340" y="75" width="520" height="52" rx="7" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="600" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">long double</text>
  <text x="640" y="145" text-anchor="middle" font-size="22" fill="#1565c0">^</text>

  <rect x="340" y="150" width="520" height="52" rx="7" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="183" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">double</text>
  <text x="640" y="220" text-anchor="middle" font-size="22" fill="#1565c0">^</text>

  <rect x="340" y="225" width="520" height="52" rx="7" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="258" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">float</text>
  <text x="640" y="295" text-anchor="middle" font-size="22" fill="#1565c0">^</text>

  <rect x="340" y="300" width="520" height="52" rx="7" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="333" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">unsigned long long</text>
  <text x="640" y="370" text-anchor="middle" font-size="22" fill="#1565c0">^</text>

  <rect x="340" y="375" width="520" height="52" rx="7" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="408" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">long long</text>
  <text x="640" y="445" text-anchor="middle" font-size="22" fill="#1565c0">^</text>

  <rect x="340" y="450" width="520" height="52" rx="7" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="483" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">unsigned long</text>
  <text x="640" y="520" text-anchor="middle" font-size="22" fill="#1565c0">^</text>

  <rect x="340" y="525" width="520" height="52" rx="7" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="558" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">unsigned int</text>
  <text x="640" y="595" text-anchor="middle" font-size="22" fill="#1565c0">^</text>

  <!-- int - bottom, highlighted -->
  <rect x="340" y="600" width="520" height="52" rx="7" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="633" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">int</text>
  <text x="880" y="633" font-size="15" fill="#1565c0" font-weight="bold">char, short promoted here</text>
</svg>

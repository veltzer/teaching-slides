<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="706.666667" y="40" text-anchor="middle" font-size="38.043692" font-weight="bold" fill="var(--text)">Implicit Conversion Hierarchy</text>
  <rect x="40" y="64.086509" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="617.777778" y="95.880485" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--bg)">long double</text>
  <text x="706.666667" y="131.528375" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)">^</text>
  <rect x="40" y="136.345557" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.777778" y="168.139653" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)">double</text>
  <text x="706.666667" y="203.787543" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)">^</text>
  <rect x="40" y="208.604725" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.777778" y="240.398701" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)">float</text>
  <text x="706.666667" y="276.046591" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)">^</text>
  <rect x="40" y="280.863893" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.777778" y="312.657869" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)">unsigned long long</text>
  <text x="706.666667" y="348.305759" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)">^</text>
  <rect x="40" y="353.122941" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.777778" y="384.917037" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)">long long</text>
  <text x="706.666667" y="420.564927" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)">^</text>
  <rect x="40" y="425.382109" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.777778" y="457.176085" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)">unsigned long</text>
  <text x="706.666667" y="492.823975" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)">^</text>
  <rect x="40" y="497.641276" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.777778" y="529.435253" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)">unsigned int</text>
  <text x="706.666667" y="565.083143" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)">^</text>
  <rect x="40" y="569.900325" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="617.777778" y="601.694421" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)">int</text>
  <text x="1240" y="601.694421" font-size="21.948278" fill="var(--primary-accent)" font-weight="bold">char, short promoted here</text>
</svg>
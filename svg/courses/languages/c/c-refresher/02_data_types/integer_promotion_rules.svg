<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="706.666667" y="40" text-anchor="middle" font-size="38.043692" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Implicit Conversion Hierarchy</text>
  <rect x="40" y="64.086509" width="1155.555557" height="50.099675" rx="10.102465" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="617.777778" y="95.880485" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">long double</text>
  <text x="706.666667" y="131.528375" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="136.345557" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.777778" y="168.139653" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">double</text>
  <text x="706.666667" y="203.787543" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="208.604725" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.777778" y="240.398701" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">float</text>
  <text x="706.666667" y="276.046591" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="280.863893" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.777778" y="312.657869" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">unsigned long long</text>
  <text x="706.666667" y="348.305759" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="353.122941" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.777778" y="384.917037" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">long long</text>
  <text x="706.666667" y="420.564927" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="425.382109" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.777778" y="457.176085" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">unsigned long</text>
  <text x="706.666667" y="492.823975" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="497.641276" width="1155.555557" height="50.099675" rx="10.102465" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="617.777778" y="529.435253" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">unsigned int</text>
  <text x="706.666667" y="565.083143" text-anchor="middle" font-size="32.19083" fill="var(--primary-accent)" font-family="Arial, sans-serif">^</text>
  <rect x="40" y="569.900325" width="1155.555557" height="50.099675" rx="10.102465" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="617.777778" y="601.694421" text-anchor="middle" font-size="29.264482" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">int</text>
  <text x="1240" y="601.694421" font-size="21.948278" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">char, short promoted here</text>
</svg>
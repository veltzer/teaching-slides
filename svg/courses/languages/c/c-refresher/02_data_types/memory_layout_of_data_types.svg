<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="53.3333" y="80" font-size="17.7778" font-weight="bold" fill="var(--text)" font-family="monospace">char c = 'A';</text>
  <text x="355.5556" y="80" font-size="14.2222" fill="var(--text-muted)">(1 byte)</text>
  <rect x="53.3333" y="94.2222" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="85.3333" y="126.2222" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">41</text>
  <text x="128" y="126.2222" font-size="14.2222" fill="var(--text-muted)">(0x41 = 65 = 'A')</text>
  <text x="53.3333" y="204.4444" font-size="17.7778" font-weight="bold" fill="var(--text)" font-family="monospace">int x = 0x12345678;</text>
  <text x="435.5556" y="204.4444" font-size="14.2222" fill="var(--text-muted)">(4 bytes, little-endian)</text>
  <rect x="53.3333" y="218.6667" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="85.3333" y="250.6667" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">78</text>
  <rect x="120.8889" y="218.6667" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="152.8889" y="250.6667" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">56</text>
  <rect x="188.4444" y="218.6667" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="220.4444" y="250.6667" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">34</text>
  <rect x="256" y="218.6667" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="288" y="250.6667" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">12</text>
  <text x="71.1111" y="289.7778" font-size="13.3333" fill="var(--text-faint)">addr</text>
  <text x="138.6667" y="289.7778" font-size="13.3333" fill="var(--text-faint)">+1</text>
  <text x="206.2222" y="289.7778" font-size="13.3333" fill="var(--text-faint)">+2</text>
  <text x="273.7778" y="289.7778" font-size="13.3333" fill="var(--text-faint)">+3</text>
  <text x="53.3333" y="355.5556" font-size="17.7778" font-weight="bold" fill="var(--text)" font-family="monospace">double d = 3.14;</text>
  <text x="355.5556" y="355.5556" font-size="14.2222" fill="var(--text-muted)">(8 bytes, IEEE 754)</text>
  <rect x="53.3333" y="369.7778" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="85.3333" y="401.7778" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">1F</text>
  <rect x="120.8889" y="369.7778" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="152.8889" y="401.7778" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">85</text>
  <rect x="188.4444" y="369.7778" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="220.4444" y="401.7778" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">EB</text>
  <rect x="256" y="369.7778" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="288" y="401.7778" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">51</text>
  <rect x="323.5556" y="369.7778" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="355.5556" y="401.7778" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">B8</text>
  <rect x="391.1111" y="369.7778" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="423.1111" y="401.7778" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">1E</text>
  <rect x="458.6667" y="369.7778" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="490.6667" y="401.7778" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">09</text>
  <rect x="526.2222" y="369.7778" width="64" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="558.2222" y="401.7778" text-anchor="middle" font-size="16" font-family="monospace" fill="var(--text)">40</text>
  <rect x="53.3333" y="471.1111" width="800" height="53.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="453.3333" y="504" text-anchor="middle" font-size="16" fill="var(--text-muted)">All multi-byte values stored in little-endian order on x86</text>
</svg>
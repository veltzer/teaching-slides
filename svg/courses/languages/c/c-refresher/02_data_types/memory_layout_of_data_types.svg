<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="40" y="40" font-size="24.873092" font-weight="bold" fill="var(--text)" font-family="monospace">char c = 'A';</text>
  <text x="493.333333" y="40" font-size="19.898359" fill="var(--text-muted)">(1 byte)</text>
  <rect x="40" y="58.56002" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="88" y="100.320028" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">41</text>
  <text x="152" y="100.320028" font-size="19.898359" fill="var(--text-muted)">(0x41 = 65 = 'A')</text>
  <text x="40" y="202.399919" font-size="24.873092" font-weight="bold" fill="var(--text)" font-family="monospace">int x = 0x12345678;</text>
  <text x="613.333333" y="202.399919" font-size="19.898359" fill="var(--text-muted)">(4 bytes, little-endian)</text>
  <rect x="40" y="220.960083" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="88" y="262.720091" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">78</text>
  <rect x="141.333333" y="220.960083" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="189.333333" y="262.720091" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">56</text>
  <rect x="242.666524" y="220.960083" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="290.666524" y="262.720091" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">34</text>
  <rect x="344" y="220.960083" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="392" y="262.720091" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">12</text>
  <text x="66.666667" y="313.760037" font-size="18.654748" fill="var(--text-faint)">addr</text>
  <text x="168" y="313.760037" font-size="18.654748" fill="var(--text-faint)">+1</text>
  <text x="269.333333" y="313.760037" font-size="18.654748" fill="var(--text-faint)">+2</text>
  <text x="370.666667" y="313.760037" font-size="18.654748" fill="var(--text-faint)">+3</text>
  <text x="40" y="399.600181" font-size="24.873092" font-weight="bold" fill="var(--text)" font-family="monospace">double d = 3.14;</text>
  <text x="493.333333" y="399.600181" font-size="19.898359" fill="var(--text-muted)">(8 bytes, IEEE 754)</text>
  <rect x="40" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="88" y="459.920065" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">1F</text>
  <rect x="141.333333" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="189.333333" y="459.920065" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">85</text>
  <rect x="242.666524" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="290.666524" y="459.920065" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">EB</text>
  <rect x="344" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="392" y="459.920065" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">51</text>
  <rect x="445.333333" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="493.333333" y="459.920065" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">B8</text>
  <rect x="546.666667" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="594.666667" y="459.920065" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">1E</text>
  <rect x="648" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="696" y="459.920065" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">09</text>
  <rect x="749.333333" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="797.333333" y="459.920065" text-anchor="middle" font-size="22.385726" font-family="monospace" fill="var(--text)">40</text>
  <rect x="40" y="550.400035" width="1200" height="69.599965" rx="8.586502" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="593.320107" text-anchor="middle" font-size="22.385726" fill="var(--text-muted)">All multi-byte values stored in little-endian order on x86</text>
</svg>
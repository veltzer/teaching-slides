<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="96.25" y="112.5" font-size="17.3806" font-weight="bold" fill="var(--text)" font-family="monospace">char c = 'A';</text>
  <text x="415" y="112.5" font-size="13.9044" fill="var(--text-muted)">(1 byte)</text>
  <rect x="96.25" y="125.3889" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="130" y="154.3889" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">41</text>
  <text x="175" y="154.3889" font-size="13.9044" fill="var(--text-muted)">(0x41 = 65 = 'A')</text>
  <text x="96.25" y="225.2777" font-size="17.3806" font-weight="bold" fill="var(--text)" font-family="monospace">int x = 0x12345678;</text>
  <text x="499.375" y="225.2777" font-size="13.9044" fill="var(--text-muted)">(4 bytes, little-endian)</text>
  <rect x="96.25" y="238.1667" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="130" y="267.1667" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">78</text>
  <rect x="167.5" y="238.1667" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="201.25" y="267.1667" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">56</text>
  <rect x="238.7499" y="238.1667" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="272.4999" y="267.1667" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">34</text>
  <rect x="310" y="238.1667" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="343.75" y="267.1667" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">12</text>
  <text x="115" y="302.6111" font-size="13.0354" fill="var(--text-faint)">addr</text>
  <text x="186.25" y="302.6111" font-size="13.0354" fill="var(--text-faint)">+1</text>
  <text x="257.5" y="302.6111" font-size="13.0354" fill="var(--text-faint)">+2</text>
  <text x="328.75" y="302.6111" font-size="13.0354" fill="var(--text-faint)">+3</text>
  <text x="96.25" y="362.2223" font-size="17.3806" font-weight="bold" fill="var(--text)" font-family="monospace">double d = 3.14;</text>
  <text x="415" y="362.2223" font-size="13.9044" fill="var(--text-muted)">(8 bytes, IEEE 754)</text>
  <rect x="96.25" y="375.1111" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="130" y="404.1111" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">1F</text>
  <rect x="167.5" y="375.1111" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="201.25" y="404.1111" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">85</text>
  <rect x="238.7499" y="375.1111" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="272.4999" y="404.1111" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">EB</text>
  <rect x="310" y="375.1111" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="343.75" y="404.1111" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">51</text>
  <rect x="381.25" y="375.1111" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="415" y="404.1111" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">B8</text>
  <rect x="452.5" y="375.1111" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="486.25" y="404.1111" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">1E</text>
  <rect x="523.75" y="375.1111" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="557.5" y="404.1111" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">09</text>
  <rect x="595" y="375.1111" width="67.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="628.75" y="404.1111" text-anchor="middle" font-size="15.6425" font-family="monospace" fill="var(--text)">40</text>
  <rect x="96.25" y="466.9444" width="843.75" height="48.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="518.125" y="496.75" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">All multi-byte values stored in little-endian order on x86</text>
</svg>
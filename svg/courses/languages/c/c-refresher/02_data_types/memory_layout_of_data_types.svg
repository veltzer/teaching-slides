<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="40" y="40" font-size="24.873092" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">char c = 'A';</text>
  <text x="493.333333" y="40" font-size="19.898359" fill="var(--text-muted)" font-family="Arial, sans-serif">(1 byte)</text>
  <rect x="40" y="58.56002" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="88" y="100.320028" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">41</text>
  <text x="152" y="100.320028" font-size="19.898359" fill="var(--text-muted)" font-family="Arial, sans-serif">(0x41 = 65 = 'A')</text>
  <text x="40" y="202.399919" font-size="24.873092" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">int x = 0x12345678;</text>
  <text x="613.333333" y="202.399919" font-size="19.898359" fill="var(--text-muted)" font-family="Arial, sans-serif">(4 bytes, little-endian)</text>
  <rect x="40" y="220.960083" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="88" y="262.720091" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">78</text>
  <rect x="141.333333" y="220.960083" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="189.333333" y="262.720091" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">56</text>
  <rect x="242.666524" y="220.960083" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="290.666524" y="262.720091" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">34</text>
  <rect x="344" y="220.960083" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="392" y="262.720091" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">12</text>
  <text x="66.666667" y="313.760037" font-size="18.654748" fill="var(--text-faint)" font-family="Arial, sans-serif">addr</text>
  <text x="168" y="313.760037" font-size="18.654748" fill="var(--text-faint)" font-family="Arial, sans-serif">+1</text>
  <text x="269.333333" y="313.760037" font-size="18.654748" fill="var(--text-faint)" font-family="Arial, sans-serif">+2</text>
  <text x="370.666667" y="313.760037" font-size="18.654748" fill="var(--text-faint)" font-family="Arial, sans-serif">+3</text>
  <text x="40" y="399.600181" font-size="24.873092" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">double d = 3.14;</text>
  <text x="493.333333" y="399.600181" font-size="19.898359" fill="var(--text-muted)" font-family="Arial, sans-serif">(8 bytes, IEEE 754)</text>
  <rect x="40" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="88" y="459.920065" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">1F</text>
  <rect x="141.333333" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="189.333333" y="459.920065" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">85</text>
  <rect x="242.666524" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="290.666524" y="459.920065" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">EB</text>
  <rect x="344" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="392" y="459.920065" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">51</text>
  <rect x="445.333333" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="493.333333" y="459.920065" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">B8</text>
  <rect x="546.666667" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="594.666667" y="459.920065" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">1E</text>
  <rect x="648" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="696" y="459.920065" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">09</text>
  <rect x="749.333333" y="418.160057" width="96" height="67.280125" rx="8.586502" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="797.333333" y="459.920065" text-anchor="middle" font-size="22.385726" fill="var(--text)" font-family="Courier New, monospace">40</text>
  <rect x="40" y="550.400035" width="1200" height="69.599965" rx="8.586502" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="593.320107" text-anchor="middle" font-size="22.385726" fill="var(--text-muted)" font-family="Arial, sans-serif">All multi-byte values stored in little-endian order on x86</text>
</svg>
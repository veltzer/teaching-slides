<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="96.25" y="56.1111" width="150" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="84.3056" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--primary-accent)">main.c</text>
  <rect x="283.75" y="56.1111" width="150" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="358.75" y="84.3056" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--primary-accent)">utils.c</text>
  <rect x="471.25" y="56.1111" width="150" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="546.25" y="84.3056" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--primary-accent)">math.c</text>
  <rect x="752.5" y="56.1111" width="150" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="827.5" y="84.3056" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--warn-accent)">utils.h</text>
  <rect x="939.9999" y="56.1111" width="150" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1014.9999" y="84.3056" text-anchor="middle" font-family="monospace" font-size="15.6425" fill="var(--warn-accent)">math.h</text>
  <line x1="171.25" y1="106.0556" x2="827.5" y2="193.0556" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <line x1="358.75" y1="106.0556" x2="827.5" y2="193.0556" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <line x1="546.25" y1="106.0556" x2="1014.9999" y2="193.0556" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <text x="508.7499" y="128.6111" font-family="sans-serif" font-size="11.2974" fill="var(--warn-accent)">#include</text>
  <text x="68.125" y="193.0556" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">1. Preprocess</text>
  <rect x="96.25" y="201.1111" width="150" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="171.25" y="225.2777" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">main.i</text>
  <rect x="283.75" y="201.1111" width="150" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="358.75" y="225.2777" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">utils.i</text>
  <rect x="471.25" y="201.1111" width="150" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="546.25" y="225.2777" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text-muted)">math.i</text>
  <line x1="171.25" y1="106.0556" x2="171.25" y2="199.5" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="358.75" y1="106.0556" x2="358.75" y2="199.5" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="546.25" y1="106.0556" x2="546.25" y2="199.5" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="68.125" y="297.7777" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">2. Compile</text>
  <rect x="96.25" y="305.8333" width="150" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="171.25" y="330" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text)">main.o</text>
  <rect x="283.75" y="305.8333" width="150" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="358.75" y="330" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text)">utils.o</text>
  <rect x="471.25" y="305.8333" width="150" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="546.25" y="330" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--text)">math.o</text>
  <line x1="171.25" y1="243" x2="171.25" y2="304.2223" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="358.75" y1="243" x2="358.75" y2="304.2223" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="546.25" y1="243" x2="546.25" y2="304.2223" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="752.5" y="305.8333" width="187.5" height="40.2777" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="846.2499" y="330" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--warn-accent)">libm.a / libc.a</text>
  <text x="846.2499" y="281.6667" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--warn-accent)">system libraries</text>
  <text x="68.125" y="426.6667" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">3. Link</text>
  <line x1="171.25" y1="347.7223" x2="415" y2="410.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="358.75" y1="347.7223" x2="415" y2="410.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="546.25" y1="347.7223" x2="415" y2="410.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="846.2499" y1="347.7223" x2="565" y2="410.5556" stroke="var(--warn-border)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <rect x="330.625" y="412.1667" width="337.5" height="48.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="499.375" y="441.1667" text-anchor="middle" font-family="monospace" font-size="19.1186" font-weight="bold" fill="var(--bg)">./program</text>
  <rect x="752.5" y="412.1667" width="450" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="977.5" y="434.7223" text-anchor="middle" font-family="sans-serif" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">Header files (.h) are shared contracts</text>
  <text x="771.25" y="454.0556" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">• Declare functions — never define them</text>
  <text x="771.25" y="470.1667" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">• Use include guards: #ifndef MY_H / #define MY_H</text>
  <text x="771.25" y="486.2777" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">• Each .c file compiled independently</text>
  <rect x="96.25" y="507.2223" width="618.75" height="32.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="405.625" y="527.3611" text-anchor="middle" font-family="monospace" font-size="13.0354" fill="var(--primary-accent)">gcc main.c utils.c math.c -o program   # or use Make</text>
</svg>
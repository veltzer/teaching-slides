  <rect x="763.966942" y="339.666537" width="198.347107" height="48.333223" rx="6.760115" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="863.14039" y="368.666567" text-anchor="middle" font-size="14.686801" fill="var(--warn-accent)" font-family="Courier New, monospace">libm.a / libc.a</text>
  <text x="863.14039" y="310.666627" text-anchor="middle" font-size="13.707598" fill="var(--warn-accent)" font-family="Arial, sans-serif">system libraries</text>
  <text x="40" y="484.666567" font-size="13.707598" fill="var(--text-faint)" font-family="Arial, sans-serif">3. Link</text>
  <line x1="149.090909" y1="389.933319" x2="406.942149" y2="465.333253" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="347.438017" y1="389.933319" x2="406.942149" y2="465.333253" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="545.785124" y1="389.933319" x2="406.942149" y2="465.333253" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="863.14039" y1="389.933319" x2="565.619835" y2="465.333253" stroke="var(--warn-border)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <rect x="317.68595" y="467.266573" width="357.024793" height="57.99994" rx="6.760115" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="496.198347" y="502.066561" text-anchor="middle" font-size="21.540656" font-weight="bold" fill="var(--bg)" font-family="Courier New, monospace">./program</text>
  <rect x="763.966942" y="467.266573" width="476.033058" height="96.666687" rx="6.760115" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1001.983471" y="494.333283" text-anchor="middle" font-size="15.665891" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Header files (.h) are shared contracts</text>
  <text x="783.801653" y="517.533235" font-size="13.707598" fill="var(--text-muted)" font-family="Arial, sans-serif">• Declare functions — never define them</text>
  <text x="783.801653" y="536.866549" font-size="13.707598" fill="var(--text-muted)" font-family="Arial, sans-serif">• Use include guards: #ifndef MY_H / #define MY_H</text>
  <text x="783.801653" y="556.199742" font-size="13.707598" fill="var(--text-muted)" font-family="Arial, sans-serif">• Each .c file compiled independently</text>
  <rect x="69.752066" y="581.333253" width="654.545455" height="38.666747" rx="6.760115" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="397.024793" y="605.499805" text-anchor="middle" font-size="14.686801" fill="var(--primary-accent)" font-family="Courier New, monospace">gcc main.c utils.c math.c -o program   # or use Make</text>
</svg>
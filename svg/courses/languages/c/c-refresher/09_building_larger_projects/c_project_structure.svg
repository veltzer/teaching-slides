<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Source files -->
  <rect x="60"  y="20" width="160" height="60" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="55" text-anchor="middle" font-family="monospace" font-size="18" fill="#1565c0">main.c</text>

  <rect x="260" y="20" width="160" height="60" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="55" text-anchor="middle" font-family="monospace" font-size="18" fill="#1565c0">utils.c</text>

  <rect x="460" y="20" width="160" height="60" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="540" y="55" text-anchor="middle" font-family="monospace" font-size="18" fill="#1565c0">math.c</text>

  <!-- Header files included -->
  <rect x="760" y="20" width="160" height="60" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="55" text-anchor="middle" font-family="monospace" font-size="18" fill="#e65100">utils.h</text>

  <rect x="960" y="20" width="160" height="60" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1040" y="55" text-anchor="middle" font-family="monospace" font-size="18" fill="#e65100">math.h</text>

  <!-- Include arrows from .c to .h -->
  <line x1="140" y1="82" x2="840" y2="190" stroke="#e65100" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <line x1="340" y1="82" x2="840" y2="190" stroke="#e65100" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <line x1="540" y1="82" x2="1040" y2="190" stroke="#e65100" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="500" y="110" font-family="sans-serif" font-size="13" fill="#e65100">#include</text>

  <!-- Preprocessor stage -->
  <text x="30" y="190" font-family="sans-serif" font-size="14" fill="#9e9e9e">1. Preprocess</text>
  <rect x="60"  y="200" width="160" height="50" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="140" y="230" text-anchor="middle" font-family="monospace" font-size="15" fill="#555555">main.i</text>
  <rect x="260" y="200" width="160" height="50" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="340" y="230" text-anchor="middle" font-family="monospace" font-size="15" fill="#555555">utils.i</text>
  <rect x="460" y="200" width="160" height="50" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="540" y="230" text-anchor="middle" font-family="monospace" font-size="15" fill="#555555">math.i</text>

  <line x1="140" y1="82" x2="140" y2="198" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="82" x2="340" y2="198" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="82" x2="540" y2="198" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Compile stage -->
  <text x="30" y="320" font-family="sans-serif" font-size="14" fill="#9e9e9e">2. Compile</text>
  <rect x="60"  y="330" width="160" height="50" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="360" text-anchor="middle" font-family="monospace" font-size="15" fill="#212121">main.o</text>
  <rect x="260" y="330" width="160" height="50" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="360" text-anchor="middle" font-family="monospace" font-size="15" fill="#212121">utils.o</text>
  <rect x="460" y="330" width="160" height="50" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="540" y="360" text-anchor="middle" font-family="monospace" font-size="15" fill="#212121">math.o</text>

  <line x1="140" y1="252" x2="140" y2="328" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="252" x2="340" y2="328" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="252" x2="540" y2="328" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Library -->
  <rect x="760" y="330" width="200" height="50" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="860" y="360" text-anchor="middle" font-family="monospace" font-size="15" fill="#e65100">libm.a / libc.a</text>
  <text x="860" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e65100">system libraries</text>

  <!-- Link stage -->
  <text x="30" y="480" font-family="sans-serif" font-size="14" fill="#9e9e9e">3. Link</text>
  <line x1="140" y1="382" x2="400" y2="460" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="340" y1="382" x2="400" y2="460" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="540" y1="382" x2="400" y2="460" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="860" y1="382" x2="560" y2="460" stroke="#e65100" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <rect x="310" y="462" width="360" height="60" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="490" y="498" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">./program</text>

  <!-- Key insight -->
  <rect x="760" y="462" width="480" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1000" y="490" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1565c0">Header files (.h) are shared contracts</text>
  <text x="780"  y="514" font-family="sans-serif" font-size="14" fill="#555555">• Declare functions — never define them</text>
  <text x="780"  y="534" font-family="sans-serif" font-size="14" fill="#555555">• Use include guards: #ifndef MY_H / #define MY_H</text>
  <text x="780"  y="554" font-family="sans-serif" font-size="14" fill="#555555">• Each .c file compiled independently</text>

  <rect x="60" y="580" width="660" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="390" y="605" text-anchor="middle" font-family="monospace" font-size="15" fill="#1565c0">gcc main.c utils.c math.c -o program   # or use Make</text>
</svg>

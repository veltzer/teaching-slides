<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="53.3333" y="17.7778" width="142.2222" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="124.4444" y="48.8889" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--primary-accent)">main.c</text>
  <rect x="231.1111" y="17.7778" width="142.2222" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="302.2222" y="48.8889" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--primary-accent)">utils.c</text>
  <rect x="408.8889" y="17.7778" width="142.2222" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="480" y="48.8889" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--primary-accent)">math.c</text>
  <rect x="675.5556" y="17.7778" width="142.2222" height="53.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="746.6667" y="48.8889" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--warn-accent)">utils.h</text>
  <rect x="853.3333" y="17.7778" width="142.2222" height="53.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="924.4444" y="48.8889" text-anchor="middle" font-family="monospace" font-size="16" fill="var(--warn-accent)">math.h</text>
  <line x1="124.4444" y1="72.8889" x2="746.6667" y2="168.8889" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <line x1="302.2222" y1="72.8889" x2="746.6667" y2="168.8889" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <line x1="480" y1="72.8889" x2="924.4444" y2="168.8889" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <text x="444.4444" y="97.7778" font-family="sans-serif" font-size="11.5556" fill="var(--warn-accent)">#include</text>
  <text x="26.6667" y="168.8889" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">1. Preprocess</text>
  <rect x="53.3333" y="177.7778" width="142.2222" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="124.4444" y="204.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">main.i</text>
  <rect x="231.1111" y="177.7778" width="142.2222" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="302.2222" y="204.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">utils.i</text>
  <rect x="408.8889" y="177.7778" width="142.2222" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="480" y="204.4444" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text-muted)">math.i</text>
  <line x1="124.4444" y1="72.8889" x2="124.4444" y2="176" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="302.2222" y1="72.8889" x2="302.2222" y2="176" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="480" y1="72.8889" x2="480" y2="176" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="26.6667" y="284.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">2. Compile</text>
  <rect x="53.3333" y="293.3333" width="142.2222" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="124.4444" y="320" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text)">main.o</text>
  <rect x="231.1111" y="293.3333" width="142.2222" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="302.2222" y="320" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text)">utils.o</text>
  <rect x="408.8889" y="293.3333" width="142.2222" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="480" y="320" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--text)">math.o</text>
  <line x1="124.4444" y1="224" x2="124.4444" y2="291.5556" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="302.2222" y1="224" x2="302.2222" y2="291.5556" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="480" y1="224" x2="480" y2="291.5556" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <rect x="675.5556" y="293.3333" width="177.7778" height="44.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="764.4444" y="320" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--warn-accent)">libm.a / libc.a</text>
  <text x="764.4444" y="266.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--warn-accent)">system libraries</text>
  <text x="26.6667" y="426.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">3. Link</text>
  <line x1="124.4444" y1="339.5556" x2="355.5556" y2="408.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="302.2222" y1="339.5556" x2="355.5556" y2="408.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="480" y1="339.5556" x2="355.5556" y2="408.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <line x1="764.4444" y1="339.5556" x2="497.7778" y2="408.8889" stroke="var(--warn-border)" stroke-width="1.7778" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <rect x="275.5556" y="410.6667" width="320" height="53.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="435.5556" y="442.6667" text-anchor="middle" font-family="monospace" font-size="19.5556" font-weight="bold" fill="var(--bg)">./program</text>
  <rect x="675.5556" y="410.6667" width="426.6667" height="88.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="888.8889" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">Header files (.h) are shared contracts</text>
  <text x="693.3333" y="456.8889" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Declare functions — never define them</text>
  <text x="693.3333" y="474.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Use include guards: #ifndef MY_H / #define MY_H</text>
  <text x="693.3333" y="492.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Each .c file compiled independently</text>
  <rect x="53.3333" y="515.5556" width="586.6667" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="346.6667" y="537.7778" text-anchor="middle" font-family="monospace" font-size="13.3333" fill="var(--primary-accent)">gcc main.c utils.c math.c -o program   # or use Make</text>
</svg>
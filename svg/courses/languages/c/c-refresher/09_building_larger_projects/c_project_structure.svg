  <text x="1041.652787" y="73.833388" text-anchor="middle" font-size="17.624184" fill="var(--warn-accent)" font-family="Courier New, monospace">math.h</text>
  <line x1="149.090909" y1="99.933379" x2="843.305785" y2="204.333343" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <line x1="347.438017" y1="99.933379" x2="843.305785" y2="204.333343" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <line x1="545.785124" y1="99.933379" x2="1041.652787" y2="204.333343" stroke="var(--warn-border)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" marker-end="url(#arrow)" />
  <text x="506.115597" y="126.99997" font-size="12.728621" fill="var(--warn-accent)" font-family="Arial, sans-serif">#include</text>
  <text x="40" y="204.333343" font-size="13.707598" fill="var(--text-faint)" font-family="Arial, sans-serif">1. Preprocess</text>
  <rect x="69.752066" y="213.99994" width="158.677686" height="48.333223" rx="6.760115" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="149.090909" y="242.99985" text-anchor="middle" font-size="14.686801" fill="var(--text-muted)" font-family="Courier New, monospace">main.i</text>
  <rect x="268.099174" y="213.99994" width="158.677686" height="48.333223" rx="6.760115" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="347.438017" y="242.99985" text-anchor="middle" font-size="14.686801" fill="var(--text-muted)" font-family="Courier New, monospace">utils.i</text>
  <rect x="466.446281" y="213.99994" width="158.677686" height="48.333223" rx="6.760115" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="545.785124" y="242.99985" text-anchor="middle" font-size="14.686801" fill="var(--text-muted)" font-family="Courier New, monospace">math.i</text>
  <line x1="149.090909" y1="99.933379" x2="149.090909" y2="212.066621" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="347.438017" y1="99.933379" x2="347.438017" y2="212.066621" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="545.785124" y1="99.933379" x2="545.785124" y2="212.066621" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="40" y="329.99982" font-size="13.707598" fill="var(--text-faint)" font-family="Arial, sans-serif">2. Compile</text>

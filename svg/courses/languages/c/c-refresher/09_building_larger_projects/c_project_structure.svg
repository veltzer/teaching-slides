  <text x="149.090909" y="368.666567" text-anchor="middle" font-size="14.686801" fill="var(--text)" font-family="Courier New, monospace">main.o</text>
  <rect x="268.099174" y="339.666537" width="158.677686" height="48.333223" rx="6.760115" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />

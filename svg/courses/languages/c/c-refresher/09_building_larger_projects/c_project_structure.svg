  <text x="1001.983471" y="494.333283" text-anchor="middle" font-family="sans-serif" font-size="15.665891" font-weight="bold" fill="var(--primary-accent)">Header files (.h) are shared contracts</text>
  <text x="783.801653" y="517.533235" font-family="sans-serif" font-size="13.707598" fill="var(--text-muted)">• Declare functions — never define them</text>
  <text x="783.801653" y="536.866549" font-family="sans-serif" font-size="13.707598" fill="var(--text-muted)">• Use include guards: #ifndef MY_H / #define MY_H</text>
  <text x="783.801653" y="556.199742" font-family="sans-serif" font-size="13.707598" fill="var(--text-muted)">• Each .c file compiled independently</text>
  <rect x="69.752066" y="581.333253" width="654.545455" height="38.666747" rx="6.760115" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />

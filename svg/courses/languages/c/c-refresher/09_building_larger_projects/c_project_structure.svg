  <text x="888.8889" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="var(--primary-dk)">Header files (.h) are shared contracts</text>
  <text x="693.3333" y="456.8889" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Declare functions — never define them</text>
  <text x="693.3333" y="474.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• Use include guards: #ifndef MY_H / #define MY_H</text>

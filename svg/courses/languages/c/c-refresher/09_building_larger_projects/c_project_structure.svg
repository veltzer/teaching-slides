  <ns0:text x="888.8889" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="14.2222" font-weight="bold" fill="#1565c0">Header files (.h) are shared contracts</ns0:text>
  <ns0:text x="693.3333" y="456.8889" font-family="sans-serif" font-size="12.4444" fill="#555555">• Declare functions — never define them</ns0:text>
  <ns0:text x="693.3333" y="474.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">• Use include guards: #ifndef MY_H / #define MY_H</ns0:text>
  <ns0:text x="693.3333" y="492.4444" font-family="sans-serif" font-size="12.4444" fill="#555555">• Each .c file compiled independently</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <text x="19.3939" y="42.3529" font-size="25.2121" fill="#222">int arr[5] = {10, 20, 30, 40, 50};</text>
  <text x="19.3939" y="84.7059" font-size="25.2121" fill="#555" font-family="sans-serif">Contiguous memory (4 bytes per int):</text>
  <rect x="19.3939" y="105.8824" width="232.7273" height="84.7059" fill="#e3f2fd" stroke="#333" stroke-width="2.9091" />
  <rect x="252.1212" y="105.8824" width="232.7273" height="84.7059" fill="#e8f5e9" stroke="#333" stroke-width="2.9091" />
  <rect x="484.8485" y="105.8824" width="232.7273" height="84.7059" fill="#fff3e0" stroke="#333" stroke-width="2.9091" />
  <rect x="717.5758" y="105.8824" width="232.7273" height="84.7059" fill="#e3f2fd" stroke="#333" stroke-width="2.9091" />
  <rect x="950.303" y="105.8824" width="232.7273" height="84.7059" fill="#e8f5e9" stroke="#333" stroke-width="2.9091" />
  <text x="135.7576" y="144" font-size="27.1515" font-weight="bold" fill="#222" text-anchor="middle">10</text>
  <text x="368.4848" y="144" font-size="27.1515" font-weight="bold" fill="#222" text-anchor="middle">20</text>
  <text x="601.2121" y="144" font-size="27.1515" font-weight="bold" fill="#222" text-anchor="middle">30</text>
  <text x="833.9394" y="144" font-size="27.1515" font-weight="bold" fill="#222" text-anchor="middle">40</text>
  <text x="1066.6667" y="144" font-size="27.1515" font-weight="bold" fill="#222" text-anchor="middle">50</text>
  <text x="135.7576" y="177.8824" font-size="23.2727" fill="#555" text-anchor="middle">arr[0]</text>
  <text x="368.4848" y="177.8824" font-size="23.2727" fill="#555" text-anchor="middle">arr[1]</text>
  <text x="601.2121" y="177.8824" font-size="23.2727" fill="#555" text-anchor="middle">arr[2]</text>
  <text x="833.9394" y="177.8824" font-size="23.2727" fill="#555" text-anchor="middle">arr[3]</text>
  <text x="1066.6667" y="177.8824" font-size="23.2727" fill="#555" text-anchor="middle">arr[4]</text>
  <text x="19.3939" y="220.2353" font-size="21.3333" fill="#777">0x1000</text>
  <text x="252.1212" y="220.2353" font-size="21.3333" fill="#777">0x1004</text>
  <text x="484.8485" y="220.2353" font-size="21.3333" fill="#777">0x1008</text>
  <text x="717.5758" y="220.2353" font-size="21.3333" fill="#777">0x100C</text>
  <text x="950.303" y="220.2353" font-size="21.3333" fill="#777">0x1010</text>
  <text x="19.3939" y="264.7059" font-size="25.2121" fill="#222">arr      == &amp;arr[0] == 0x1000</text>
  <text x="19.3939" y="302.8235" font-size="25.2121" fill="#222">arr + 1  == &amp;arr[1] == 0x1004  (advances by sizeof(int))</text>
  <text x="19.3939" y="340.9412" font-size="25.2121" fill="#222">*(arr+i) == arr[i]             (pointer arithmetic identity)</text>
  <text x="19.3939" y="398.1176" font-size="25.2121" fill="#555" font-family="sans-serif">2D array: int matrix[2][3] = {{1,2,3},{4,5,6}};</text>
  <text x="19.3939" y="444.7059" font-size="25.2121" fill="#555" font-family="sans-serif">Row-major layout in memory:</text>
  <rect x="19.3939" y="461.6471" width="193.9394" height="84.7059" fill="#e3f2fd" stroke="#333" stroke-width="2.9091" />
  <rect x="213.3333" y="461.6471" width="193.9394" height="84.7059" fill="#e8f5e9" stroke="#333" stroke-width="2.9091" />
  <rect x="407.2727" y="461.6471" width="193.9394" height="84.7059" fill="#fff3e0" stroke="#333" stroke-width="2.9091" />
  <rect x="601.2121" y="461.6471" width="193.9394" height="84.7059" fill="#fce4ec" stroke="#333" stroke-width="2.9091" />
  <rect x="795.1515" y="461.6471" width="193.9394" height="84.7059" fill="#ede7f6" stroke="#333" stroke-width="2.9091" />
  <rect x="989.0909" y="461.6471" width="193.9394" height="84.7059" fill="#e0f7fa" stroke="#333" stroke-width="2.9091" />
  <text x="116.3636" y="499.7647" font-size="27.1515" font-weight="bold" fill="#222" text-anchor="middle">1</text>
  <text x="310.303" y="499.7647" font-size="27.1515" font-weight="bold" fill="#222" text-anchor="middle">2</text>
  <text x="504.2424" y="499.7647" font-size="27.1515" font-weight="bold" fill="#222" text-anchor="middle">3</text>
  <text x="698.1818" y="499.7647" font-size="27.1515" font-weight="bold" fill="#222" text-anchor="middle">4</text>
  <text x="892.1212" y="499.7647" font-size="27.1515" font-weight="bold" fill="#222" text-anchor="middle">5</text>
  <text x="1086.0606" y="499.7647" font-size="27.1515" font-weight="bold" fill="#222" text-anchor="middle">6</text>
  <text x="116.3636" y="533.6471" font-size="21.3333" fill="#555" text-anchor="middle">[0][0]</text>
  <text x="310.303" y="533.6471" font-size="21.3333" fill="#555" text-anchor="middle">[0][1]</text>
  <text x="504.2424" y="533.6471" font-size="21.3333" fill="#555" text-anchor="middle">[0][2]</text>
  <text x="698.1818" y="533.6471" font-size="21.3333" fill="#555" text-anchor="middle">[1][0]</text>
  <text x="892.1212" y="533.6471" font-size="21.3333" fill="#555" text-anchor="middle">[1][1]</text>
  <text x="1086.0606" y="533.6471" font-size="21.3333" fill="#555" text-anchor="middle">[1][2]</text>
  <text x="19.3939" y="588.7059" font-size="25.2121" fill="#222">matrix[i][j] is at offset (i * 3 + j) * sizeof(int)</text>
</svg>
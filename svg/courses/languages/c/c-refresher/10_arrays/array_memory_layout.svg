<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f0f0f0" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="17.7778" y="35.5556" font-size="21.3333" fill="#222222">int arr[5] = {10, 20, 30, 40, 50};</ns0:text>
  <ns0:text x="17.7778" y="69.3333" font-size="19.5556" fill="#555555" font-family="sans-serif">Contiguous memory (4 bytes per int):</ns0:text>
  <ns0:rect x="17.7778" y="84.4444" width="202.6667" height="69.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="222.2222" y="84.4444" width="202.6667" height="69.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="426.6667" y="84.4444" width="202.6667" height="69.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="631.1111" y="84.4444" width="202.6667" height="69.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="835.5556" y="84.4444" width="202.6667" height="69.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="119.1111" y="124.4444" font-size="23.1111" font-weight="bold" fill="#222222" text-anchor="middle">10</ns0:text>
  <ns0:text x="323.5556" y="124.4444" font-size="23.1111" font-weight="bold" fill="#222222" text-anchor="middle">20</ns0:text>
  <ns0:text x="528" y="124.4444" font-size="23.1111" font-weight="bold" fill="#222222" text-anchor="middle">30</ns0:text>
  <ns0:text x="732.4444" y="124.4444" font-size="23.1111" font-weight="bold" fill="#222222" text-anchor="middle">40</ns0:text>
  <ns0:text x="936.8889" y="124.4444" font-size="23.1111" font-weight="bold" fill="#222222" text-anchor="middle">50</ns0:text>
  <ns0:text x="119.1111" y="149.3333" font-size="17.7778" fill="#555555" text-anchor="middle">arr[0]</ns0:text>
  <ns0:text x="323.5556" y="149.3333" font-size="17.7778" fill="#555555" text-anchor="middle">arr[1]</ns0:text>
  <ns0:text x="528" y="149.3333" font-size="17.7778" fill="#555555" text-anchor="middle">arr[2]</ns0:text>
  <ns0:text x="732.4444" y="149.3333" font-size="17.7778" fill="#555555" text-anchor="middle">arr[3]</ns0:text>
  <ns0:text x="936.8889" y="149.3333" font-size="17.7778" fill="#555555" text-anchor="middle">arr[4]</ns0:text>
  <ns0:text x="17.7778" y="183.1111" font-size="16.8889" fill="#888888">0x1000</ns0:text>
  <ns0:text x="222.2222" y="183.1111" font-size="16.8889" fill="#888888">0x1004</ns0:text>
  <ns0:text x="426.6667" y="183.1111" font-size="16.8889" fill="#888888">0x1008</ns0:text>
  <ns0:text x="631.1111" y="183.1111" font-size="16.8889" fill="#888888">0x100C</ns0:text>
  <ns0:text x="835.5556" y="183.1111" font-size="16.8889" fill="#888888">0x1010</ns0:text>
  <ns0:text x="17.7778" y="224" font-size="21.3333" fill="#222222">arr      == &amp;arr[0] == 0x1000</ns0:text>
  <ns0:text x="17.7778" y="256" font-size="21.3333" fill="#222222">arr + 1  == &amp;arr[1] == 0x1004  (advances by sizeof(int))</ns0:text>
  <ns0:text x="17.7778" y="288" font-size="21.3333" fill="#222222">*(arr+i) == arr[i]             (pointer arithmetic identity)</ns0:text>
  <ns0:text x="17.7778" y="334.2222" font-size="19.5556" fill="#555555" font-family="sans-serif">2D array: int matrix[2][3] = {{1,2,3},{4,5,6}};</ns0:text>
  <ns0:text x="17.7778" y="368" font-size="19.5556" fill="#555555" font-family="sans-serif">Row-major layout in memory:</ns0:text>
  <ns0:rect x="17.7778" y="380.4444" width="168.8889" height="69.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="188.4444" y="380.4444" width="168.8889" height="69.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="359.1111" y="380.4444" width="168.8889" height="69.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="529.7778" y="380.4444" width="168.8889" height="69.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="700.4444" y="380.4444" width="168.8889" height="69.3333" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:rect x="871.1111" y="380.4444" width="168.8889" height="69.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="102.2222" y="420.4444" font-size="23.1111" font-weight="bold" fill="#222222" text-anchor="middle">1</ns0:text>
  <ns0:text x="272.8889" y="420.4444" font-size="23.1111" font-weight="bold" fill="#222222" text-anchor="middle">2</ns0:text>
  <ns0:text x="443.5556" y="420.4444" font-size="23.1111" font-weight="bold" fill="#222222" text-anchor="middle">3</ns0:text>
  <ns0:text x="614.2222" y="420.4444" font-size="23.1111" font-weight="bold" fill="#222222" text-anchor="middle">4</ns0:text>
  <ns0:text x="784.8889" y="420.4444" font-size="23.1111" font-weight="bold" fill="#222222" text-anchor="middle">5</ns0:text>
  <ns0:text x="955.5556" y="420.4444" font-size="23.1111" font-weight="bold" fill="#222222" text-anchor="middle">6</ns0:text>
  <ns0:text x="102.2222" y="444.4444" font-size="16.8889" fill="#555555" text-anchor="middle">[0][0]</ns0:text>
  <ns0:text x="272.8889" y="444.4444" font-size="16.8889" fill="#555555" text-anchor="middle">[0][1]</ns0:text>
  <ns0:text x="443.5556" y="444.4444" font-size="16.8889" fill="#555555" text-anchor="middle">[0][2]</ns0:text>
  <ns0:text x="614.2222" y="444.4444" font-size="16.8889" fill="#555555" text-anchor="middle">[1][0]</ns0:text>
  <ns0:text x="784.8889" y="444.4444" font-size="16.8889" fill="#555555" text-anchor="middle">[1][1]</ns0:text>
  <ns0:text x="955.5556" y="444.4444" font-size="16.8889" fill="#555555" text-anchor="middle">[1][2]</ns0:text>
  <ns0:text x="17.7778" y="497.7778" font-size="21.3333" fill="#222222">matrix[i][j] is at offset (i * 3 + j) * sizeof(int)</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="58.75" y="72.2223" font-size="20.8566" fill="var(--text)">int arr[5] = {10, 20, 30, 40, 50};</text>
  <text x="58.75" y="102.8333" font-size="19.1186" fill="var(--text-muted)" font-family="sans-serif">Contiguous memory (4 bytes per int):</text>
  <rect x="58.75" y="116.5277" width="213.75" height="62.8333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="274.375" y="116.5277" width="213.75" height="62.8333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="490" y="116.5277" width="213.75" height="62.8333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="705.625" y="116.5277" width="213.75" height="62.8333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="921.25" y="116.5277" width="213.75" height="62.8333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="165.625" y="152.7777" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">10</text>
  <text x="381.25" y="152.7777" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">20</text>
  <text x="596.875" y="152.7777" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">30</text>
  <text x="812.4999" y="152.7777" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">40</text>
  <text x="1028.125" y="152.7777" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">50</text>
  <text x="165.625" y="175.3333" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">arr[0]</text>
  <text x="381.25" y="175.3333" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">arr[1]</text>
  <text x="596.875" y="175.3333" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">arr[2]</text>
  <text x="812.4999" y="175.3333" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">arr[3]</text>
  <text x="1028.125" y="175.3333" font-size="17.3806" fill="var(--text-muted)" text-anchor="middle">arr[4]</text>
  <text x="58.75" y="205.9444" font-size="16.5115" fill="var(--text-faint)">0x1000</text>
  <text x="274.375" y="205.9444" font-size="16.5115" fill="var(--text-faint)">0x1004</text>
  <text x="490" y="205.9444" font-size="16.5115" fill="var(--text-faint)">0x1008</text>
  <text x="705.625" y="205.9444" font-size="16.5115" fill="var(--text-faint)">0x100C</text>
  <text x="921.25" y="205.9444" font-size="16.5115" fill="var(--text-faint)">0x1010</text>
  <text x="58.75" y="243" font-size="20.8566" fill="var(--text)">arr      == &amp;arr[0] == 0x1000</text>
  <text x="58.75" y="272" font-size="20.8566" fill="var(--text)">arr + 1  == &amp;arr[1] == 0x1004  (advances by sizeof(int))</text>
  <text x="58.75" y="301" font-size="20.8566" fill="var(--text)">*(arr+i) == arr[i]             (pointer arithmetic identity)</text>
  <text x="58.75" y="342.8889" font-size="19.1186" fill="var(--text-muted)" font-family="sans-serif">2D array: int matrix[2][3] = {{1,2,3},{4,5,6}};</text>
  <text x="58.75" y="373.5" font-size="19.1186" fill="var(--text-muted)" font-family="sans-serif">Row-major layout in memory:</text>
  <rect x="58.75" y="384.7777" width="178.125" height="62.8333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="238.7499" y="384.7777" width="178.125" height="62.8333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="418.75" y="384.7777" width="178.125" height="62.8333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="598.75" y="384.7777" width="178.125" height="62.8333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="778.7499" y="384.7777" width="178.125" height="62.8333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="958.75" y="384.7777" width="178.125" height="62.8333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="147.8125" y="421.0277" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">1</text>
  <text x="327.8125" y="421.0277" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">2</text>
  <text x="507.8125" y="421.0277" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">3</text>
  <text x="687.8125" y="421.0277" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">4</text>
  <text x="867.8125" y="421.0277" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">5</text>
  <text x="1047.8125" y="421.0277" font-size="22.5947" font-weight="bold" fill="var(--text)" text-anchor="middle">6</text>
  <text x="147.8125" y="442.7777" font-size="16.5115" fill="var(--text-muted)" text-anchor="middle">[0][0]</text>
  <text x="327.8125" y="442.7777" font-size="16.5115" fill="var(--text-muted)" text-anchor="middle">[0][1]</text>
  <text x="507.8125" y="442.7777" font-size="16.5115" fill="var(--text-muted)" text-anchor="middle">[0][2]</text>
  <text x="687.8125" y="442.7777" font-size="16.5115" fill="var(--text-muted)" text-anchor="middle">[1][0]</text>
  <text x="867.8125" y="442.7777" font-size="16.5115" fill="var(--text-muted)" text-anchor="middle">[1][1]</text>
  <text x="1047.8125" y="442.7777" font-size="16.5115" fill="var(--text-muted)" text-anchor="middle">[1][2]</text>
  <text x="58.75" y="491.1111" font-size="20.8566" fill="var(--text)">matrix[i][j] is at offset (i * 3 + j) * sizeof(int)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="17.7778" y="35.5556" font-size="21.3333" fill="var(--text)">int arr[5] = {10, 20, 30, 40, 50};</text>
  <text x="17.7778" y="69.3333" font-size="19.5556" fill="var(--text-muted)" font-family="sans-serif">Contiguous memory (4 bytes per int):</text>
  <rect x="17.7778" y="84.4444" width="202.6667" height="69.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="222.2222" y="84.4444" width="202.6667" height="69.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="426.6667" y="84.4444" width="202.6667" height="69.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="631.1111" y="84.4444" width="202.6667" height="69.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="835.5556" y="84.4444" width="202.6667" height="69.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="119.1111" y="124.4444" font-size="23.1111" font-weight="bold" fill="var(--text)" text-anchor="middle">10</text>
  <text x="323.5556" y="124.4444" font-size="23.1111" font-weight="bold" fill="var(--text)" text-anchor="middle">20</text>
  <text x="528" y="124.4444" font-size="23.1111" font-weight="bold" fill="var(--text)" text-anchor="middle">30</text>
  <text x="732.4444" y="124.4444" font-size="23.1111" font-weight="bold" fill="var(--text)" text-anchor="middle">40</text>
  <text x="936.8889" y="124.4444" font-size="23.1111" font-weight="bold" fill="var(--text)" text-anchor="middle">50</text>
  <text x="119.1111" y="149.3333" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">arr[0]</text>
  <text x="323.5556" y="149.3333" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">arr[1]</text>
  <text x="528" y="149.3333" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">arr[2]</text>
  <text x="732.4444" y="149.3333" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">arr[3]</text>
  <text x="936.8889" y="149.3333" font-size="17.7778" fill="var(--text-muted)" text-anchor="middle">arr[4]</text>
  <text x="17.7778" y="183.1111" font-size="16.8889" fill="var(--text-faint)">0x1000</text>
  <text x="222.2222" y="183.1111" font-size="16.8889" fill="var(--text-faint)">0x1004</text>
  <text x="426.6667" y="183.1111" font-size="16.8889" fill="var(--text-faint)">0x1008</text>
  <text x="631.1111" y="183.1111" font-size="16.8889" fill="var(--text-faint)">0x100C</text>
  <text x="835.5556" y="183.1111" font-size="16.8889" fill="var(--text-faint)">0x1010</text>
  <text x="17.7778" y="224" font-size="21.3333" fill="var(--text)">arr      == &amp;arr[0] == 0x1000</text>
  <text x="17.7778" y="256" font-size="21.3333" fill="var(--text)">arr + 1  == &amp;arr[1] == 0x1004  (advances by sizeof(int))</text>
  <text x="17.7778" y="288" font-size="21.3333" fill="var(--text)">*(arr+i) == arr[i]             (pointer arithmetic identity)</text>
  <text x="17.7778" y="334.2222" font-size="19.5556" fill="var(--text-muted)" font-family="sans-serif">2D array: int matrix[2][3] = {{1,2,3},{4,5,6}};</text>
  <text x="17.7778" y="368" font-size="19.5556" fill="var(--text-muted)" font-family="sans-serif">Row-major layout in memory:</text>
  <rect x="17.7778" y="380.4444" width="168.8889" height="69.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="188.4444" y="380.4444" width="168.8889" height="69.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="359.1111" y="380.4444" width="168.8889" height="69.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="529.7778" y="380.4444" width="168.8889" height="69.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="700.4444" y="380.4444" width="168.8889" height="69.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <rect x="871.1111" y="380.4444" width="168.8889" height="69.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="102.2222" y="420.4444" font-size="23.1111" font-weight="bold" fill="var(--text)" text-anchor="middle">1</text>
  <text x="272.8889" y="420.4444" font-size="23.1111" font-weight="bold" fill="var(--text)" text-anchor="middle">2</text>
  <text x="443.5556" y="420.4444" font-size="23.1111" font-weight="bold" fill="var(--text)" text-anchor="middle">3</text>
  <text x="614.2222" y="420.4444" font-size="23.1111" font-weight="bold" fill="var(--text)" text-anchor="middle">4</text>
  <text x="784.8889" y="420.4444" font-size="23.1111" font-weight="bold" fill="var(--text)" text-anchor="middle">5</text>
  <text x="955.5556" y="420.4444" font-size="23.1111" font-weight="bold" fill="var(--text)" text-anchor="middle">6</text>
  <text x="102.2222" y="444.4444" font-size="16.8889" fill="var(--text-muted)" text-anchor="middle">[0][0]</text>
  <text x="272.8889" y="444.4444" font-size="16.8889" fill="var(--text-muted)" text-anchor="middle">[0][1]</text>
  <text x="443.5556" y="444.4444" font-size="16.8889" fill="var(--text-muted)" text-anchor="middle">[0][2]</text>
  <text x="614.2222" y="444.4444" font-size="16.8889" fill="var(--text-muted)" text-anchor="middle">[1][0]</text>
  <text x="784.8889" y="444.4444" font-size="16.8889" fill="var(--text-muted)" text-anchor="middle">[1][1]</text>
  <text x="955.5556" y="444.4444" font-size="16.8889" fill="var(--text-muted)" text-anchor="middle">[1][2]</text>
  <text x="17.7778" y="497.7778" font-size="21.3333" fill="var(--text)">matrix[i][j] is at offset (i * 3 + j) * sizeof(int)</text>
</svg>
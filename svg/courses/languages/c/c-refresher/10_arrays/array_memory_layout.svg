<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="20" y="40" font-size="24" fill="#222222">int arr[5] = {10, 20, 30, 40, 50};</text>
  <text x="20" y="78" font-size="22" fill="#555555" font-family="sans-serif">Contiguous memory (4 bytes per int):</text>

  <!-- Array cells -->
  <rect x="20" y="95" width="228" height="78" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="250" y="95" width="228" height="78" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="480" y="95" width="228" height="78" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="710" y="95" width="228" height="78" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="95" width="228" height="78" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>

  <text x="134" y="140" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">10</text>
  <text x="364" y="140" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">20</text>
  <text x="594" y="140" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">30</text>
  <text x="824" y="140" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">40</text>
  <text x="1054" y="140" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">50</text>

  <text x="134" y="168" font-size="20" fill="#555555" text-anchor="middle">arr[0]</text>
  <text x="364" y="168" font-size="20" fill="#555555" text-anchor="middle">arr[1]</text>
  <text x="594" y="168" font-size="20" fill="#555555" text-anchor="middle">arr[2]</text>
  <text x="824" y="168" font-size="20" fill="#555555" text-anchor="middle">arr[3]</text>
  <text x="1054" y="168" font-size="20" fill="#555555" text-anchor="middle">arr[4]</text>

  <text x="20" y="206" font-size="19" fill="#888888">0x1000</text>
  <text x="250" y="206" font-size="19" fill="#888888">0x1004</text>
  <text x="480" y="206" font-size="19" fill="#888888">0x1008</text>
  <text x="710" y="206" font-size="19" fill="#888888">0x100C</text>
  <text x="940" y="206" font-size="19" fill="#888888">0x1010</text>

  <!-- Pointer arithmetic facts -->
  <text x="20" y="252" font-size="24" fill="#222222">arr      == &amp;arr[0] == 0x1000</text>
  <text x="20" y="288" font-size="24" fill="#222222">arr + 1  == &amp;arr[1] == 0x1004  (advances by sizeof(int))</text>
  <text x="20" y="324" font-size="24" fill="#222222">*(arr+i) == arr[i]             (pointer arithmetic identity)</text>

  <!-- 2D array -->
  <text x="20" y="376" font-size="22" fill="#555555" font-family="sans-serif">2D array: int matrix[2][3] = {{1,2,3},{4,5,6}};</text>
  <text x="20" y="414" font-size="22" fill="#555555" font-family="sans-serif">Row-major layout in memory:</text>

  <rect x="20" y="428" width="190" height="78" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="212" y="428" width="190" height="78" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="404" y="428" width="190" height="78" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="596" y="428" width="190" height="78" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="788" y="428" width="190" height="78" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="980" y="428" width="190" height="78" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>

  <text x="115" y="473" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">1</text>
  <text x="307" y="473" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">2</text>
  <text x="499" y="473" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">3</text>
  <text x="691" y="473" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">4</text>
  <text x="883" y="473" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">5</text>
  <text x="1075" y="473" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">6</text>

  <text x="115" y="500" font-size="19" fill="#555555" text-anchor="middle">[0][0]</text>
  <text x="307" y="500" font-size="19" fill="#555555" text-anchor="middle">[0][1]</text>
  <text x="499" y="500" font-size="19" fill="#555555" text-anchor="middle">[0][2]</text>
  <text x="691" y="500" font-size="19" fill="#555555" text-anchor="middle">[1][0]</text>
  <text x="883" y="500" font-size="19" fill="#555555" text-anchor="middle">[1][1]</text>
  <text x="1075" y="500" font-size="19" fill="#555555" text-anchor="middle">[1][2]</text>

  <text x="20" y="560" font-size="24" fill="#222222">matrix[i][j] is at offset (i * 3 + j) * sizeof(int)</text>
</svg>

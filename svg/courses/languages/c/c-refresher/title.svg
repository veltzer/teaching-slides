<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--code-bg)" rx="6"/>
  <text x="113.7778" y="400" font-family="serif" font-size="284.4444" fill="var(--code-bg)" stroke="var(--primary-accent)" stroke-width="4.4444" font-weight="bold">C</text>
  <rect x="455.1111" y="64" width="597.3333" height="320" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.6667" filter="url(#shadow)" />
  <text x="483.5556" y="112" font-family="monospace" font-size="18.6667" fill="var(--danger-accent)">#include</text>
  <text x="604.4444" y="112" font-family="monospace" font-size="18.6667" fill="var(--primary-accent)">&lt;stdio.h&gt;</text>
  <text x="483.5556" y="160" font-family="monospace" font-size="18.6667" fill="var(--primary-accent)">int</text>
  <text x="526.2222" y="160" font-family="monospace" font-size="18.6667" fill="var(--text-muted)">main</text>
  <text x="583.1111" y="160" font-family="monospace" font-size="18.6667" fill="var(--text)">(</text>
  <text x="597.3333" y="160" font-family="monospace" font-size="18.6667" fill="var(--primary-accent)">void</text>
  <text x="647.1111" y="160" font-family="monospace" font-size="18.6667" fill="var(--text)">) {</text>
  <text x="512" y="200" font-family="monospace" font-size="18.6667" fill="var(--primary-accent)">int</text>
  <text x="554.6667" y="200" font-family="monospace" font-size="18.6667" fill="var(--text)">*ptr = </text>
  <text x="654.2222" y="200" font-family="monospace" font-size="18.6667" fill="var(--text-muted)">malloc</text>
  <text x="725.3333" y="200" font-family="monospace" font-size="18.6667" fill="var(--text)">(</text>
  <text x="739.5556" y="200" font-family="monospace" font-size="18.6667" fill="var(--danger-accent)">sizeof</text>
  <text x="817.7778" y="200" font-family="monospace" font-size="18.6667" fill="var(--text)">(</text>
  <text x="829.3333" y="200" font-family="monospace" font-size="18.6667" fill="var(--primary-accent)">int</text>
  <text x="867.5556" y="200" font-family="monospace" font-size="18.6667" fill="var(--text)">));</text>
  <text x="512" y="240" font-family="monospace" font-size="18.6667" fill="var(--text)">*ptr = </text>
  <text x="597.3333" y="240" font-family="monospace" font-size="18.6667" fill="var(--danger-accent)">42</text>
  <text x="625.7778" y="240" font-family="monospace" font-size="18.6667" fill="var(--text)">;</text>
  <text x="512" y="280" font-family="monospace" font-size="18.6667" fill="var(--text-muted)">printf</text>
  <text x="583.1111" y="280" font-family="monospace" font-size="18.6667" fill="var(--text)">(</text>
  <text x="597.3333" y="280" font-family="monospace" font-size="18.6667" fill="var(--primary-accent)">"%d\n"</text>
  <text x="675.5556" y="280" font-family="monospace" font-size="18.6667" fill="var(--text)">, *ptr);</text>
  <text x="512" y="320" font-family="monospace" font-size="18.6667" fill="var(--text-muted)">free</text>
  <text x="561.7778" y="320" font-family="monospace" font-size="18.6667" fill="var(--text)">(ptr);</text>
  <text x="512" y="360" font-family="monospace" font-size="18.6667" fill="var(--danger-accent)">return</text>
  <text x="590.2222" y="360" font-family="monospace" font-size="18.6667" fill="var(--text)">0;</text>
  <text x="483.5556" y="384" font-family="monospace" font-size="18.6667" fill="var(--text)">}</text>
  <rect x="483.5556" y="435.5556" width="88.8889" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="528" y="467.5556" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)" text-anchor="middle">stack</text>
  <rect x="592" y="435.5556" width="88.8889" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="636.4444" y="467.5556" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" text-anchor="middle">heap</text>
  <rect x="700.4444" y="435.5556" width="88.8889" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="744.8889" y="467.5556" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" text-anchor="middle">bss</text>
  <rect x="808.8889" y="435.5556" width="88.8889" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="853.3333" y="467.5556" font-family="monospace" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">data</text>
  <rect x="917.3333" y="435.5556" width="88.8889" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="961.7778" y="467.5556" font-family="monospace" font-size="14.2222" fill="var(--text)" text-anchor="middle">text</text>
  <line x1="547.5556" y1="524.4444" x2="636.4444" y2="524.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="592" y="551.1111" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" text-anchor="middle">ptr</text>
</svg>
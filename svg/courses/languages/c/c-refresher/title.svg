  <rect x="512" y="72" width="672" height="360" rx="12" fill="#16213e" stroke="#1565c0" stroke-width="3" filter="url(#shadow)"/>
  <text x="544" y="126" font-family="monospace" font-size="21" fill="#e94560">#include</text>
  <text x="680" y="126" font-family="monospace" font-size="21" fill="#1e88e5">&lt;stdio.h&gt;</text>

  <text x="728" y="180" font-family="monospace" font-size="21" fill="#333333">) {</text>
  <text x="576" y="225" font-family="monospace" font-size="21" fill="#1565c0">int</text>
  <text x="624" y="225" font-family="monospace" font-size="21" fill="#333333">*ptr = </text>
  <text x="736" y="225" font-family="monospace" font-size="21" fill="#555555">malloc</text>

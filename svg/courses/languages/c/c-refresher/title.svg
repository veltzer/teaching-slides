  <text x="933" y="225" font-family="monospace" font-size="21" fill="#1565c0">int</text>
  <text x="976" y="225" font-family="monospace" font-size="21" fill="#333333">));</text>
  <text x="576" y="270" font-family="monospace" font-size="21" fill="#333333">*ptr = </text>
  <text x="672" y="270" font-family="monospace" font-size="21" fill="#e94560">42</text>
  <text x="704" y="270" font-family="monospace" font-size="21" fill="#333333">;</text>
  <text x="576" y="315" font-family="monospace" font-size="21" fill="#555555">printf</text>

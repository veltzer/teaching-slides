<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Large C letter -->
  <text x="80" y="250" font-family="serif" font-size="200" fill="#16213e" stroke="#53d8fb" stroke-width="3" font-weight="bold">C</text>
  <!-- Code snippet -->
  <rect x="320" y="40" width="420" height="200" rx="8" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="340" y="70" font-family="monospace" font-size="13" fill="#e94560">#include</text>
  <text x="425" y="70" font-family="monospace" font-size="13" fill="#00b894">&lt;stdio.h&gt;</text>
  <text x="340" y="100" font-family="monospace" font-size="13" fill="#53d8fb">int</text>
  <text x="370" y="100" font-family="monospace" font-size="13" fill="#ffd93d">main</text>
  <text x="410" y="100" font-family="monospace" font-size="13" fill="white">(</text>
  <text x="420" y="100" font-family="monospace" font-size="13" fill="#53d8fb">void</text>
  <text x="455" y="100" font-family="monospace" font-size="13" fill="white">) {</text>
  <text x="360" y="125" font-family="monospace" font-size="13" fill="#53d8fb">int</text>
  <text x="390" y="125" font-family="monospace" font-size="13" fill="white">*ptr = </text>
  <text x="460" y="125" font-family="monospace" font-size="13" fill="#ffd93d">malloc</text>
  <text x="510" y="125" font-family="monospace" font-size="13" fill="white">(</text>
  <text x="520" y="125" font-family="monospace" font-size="13" fill="#e94560">sizeof</text>
  <text x="575" y="125" font-family="monospace" font-size="13" fill="white">(</text>
  <text x="583" y="125" font-family="monospace" font-size="13" fill="#53d8fb">int</text>
  <text x="610" y="125" font-family="monospace" font-size="13" fill="white">));</text>
  <text x="360" y="150" font-family="monospace" font-size="13" fill="white">*ptr = </text>
  <text x="420" y="150" font-family="monospace" font-size="13" fill="#e94560">42</text>
  <text x="440" y="150" font-family="monospace" font-size="13" fill="white">;</text>
  <text x="360" y="175" font-family="monospace" font-size="13" fill="#ffd93d">printf</text>
  <text x="410" y="175" font-family="monospace" font-size="13" fill="white">(</text>
  <text x="420" y="175" font-family="monospace" font-size="13" fill="#00b894">"%d\n"</text>
  <text x="475" y="175" font-family="monospace" font-size="13" fill="white">, *ptr);</text>
  <text x="360" y="200" font-family="monospace" font-size="13" fill="#ffd93d">free</text>
  <text x="395" y="200" font-family="monospace" font-size="13" fill="white">(ptr);</text>
  <text x="360" y="225" font-family="monospace" font-size="13" fill="#e94560">return</text>
  <text x="415" y="225" font-family="monospace" font-size="13" fill="white">0;</text>
  <text x="340" y="230" font-family="monospace" font-size="13" fill="white">}</text>
  <!-- Memory blocks -->
  <rect x="340" y="280" width="60" height="40" rx="4" fill="#0f3460" stroke="#e94560" stroke-width="1.5"/>
  <text x="350" y="305" font-family="monospace" font-size="11" fill="#e94560">stack</text>
  <rect x="420" y="280" width="60" height="40" rx="4" fill="#0f3460" stroke="#53d8fb" stroke-width="1.5"/>
  <text x="432" y="305" font-family="monospace" font-size="11" fill="#53d8fb">heap</text>
  <rect x="500" y="280" width="60" height="40" rx="4" fill="#0f3460" stroke="#00b894" stroke-width="1.5"/>
  <text x="515" y="305" font-family="monospace" font-size="11" fill="#00b894">bss</text>
  <rect x="580" y="280" width="60" height="40" rx="4" fill="#0f3460" stroke="#ffd93d" stroke-width="1.5"/>
  <text x="592" y="305" font-family="monospace" font-size="11" fill="#ffd93d">data</text>
  <rect x="660" y="280" width="60" height="40" rx="4" fill="#0f3460" stroke="white" stroke-width="1.5"/>
  <text x="672" y="305" font-family="monospace" font-size="11" fill="white">text</text>
  <!-- Pointer arrow -->
  <line x1="380" y1="340" x2="450" y2="340" stroke="#53d8fb" stroke-width="2"/>
  <polygon points="450,335 460,340 450,345" fill="#53d8fb"/>
  <text x="390" y="365" font-family="monospace" font-size="11" fill="#53d8fb">ptr</text>
</svg>

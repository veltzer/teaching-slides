<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <text x="160" y="402.5" font-size="278.0887" fill="var(--code-bg)" stroke="var(--primary-accent)" stroke-width="4.4444" font-weight="bold" font-family="Arial, sans-serif">C</text>
  <rect x="520" y="98" width="630" height="290" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.6667"/>
  <text x="550" y="141.5" font-size="18.2496" fill="var(--danger-accent)" font-family="Courier New, monospace">#include</text>
  <text x="677.4999" y="141.5" font-size="18.2496" fill="var(--primary-accent)" font-family="Courier New, monospace">&lt;stdio.h&gt;</text>
  <text x="550" y="185" font-size="18.2496" fill="var(--primary-accent)" font-family="Courier New, monospace">int</text>
  <text x="595" y="185" font-size="18.2496" fill="var(--text-muted)" font-family="Courier New, monospace">main</text>
  <text x="655" y="185" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">(</text>
  <text x="670" y="185" font-size="18.2496" fill="var(--primary-accent)" font-family="Courier New, monospace">void</text>
  <text x="722.5" y="185" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">) {</text>
  <text x="580" y="221.25" font-size="18.2496" fill="var(--primary-accent)" font-family="Courier New, monospace">int</text>
  <text x="625" y="221.25" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">*ptr = </text>
  <text x="730" y="221.25" font-size="18.2496" fill="var(--text-muted)" font-family="Courier New, monospace">malloc</text>
  <text x="804.9999" y="221.25" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">(</text>
  <text x="820" y="221.25" font-size="18.2496" fill="var(--danger-accent)" font-family="Courier New, monospace">sizeof</text>
  <text x="902.5" y="221.25" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">(</text>
  <text x="914.6874" y="221.25" font-size="18.2496" fill="var(--primary-accent)" font-family="Courier New, monospace">int</text>
  <text x="955" y="221.25" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">));</text>
  <text x="580" y="257.5" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">*ptr = </text>
  <text x="670" y="257.5" font-size="18.2496" fill="var(--danger-accent)" font-family="Courier New, monospace">42</text>
  <text x="700" y="257.5" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">;</text>
  <text x="580" y="293.75" font-size="18.2496" fill="var(--text-muted)" font-family="Courier New, monospace">printf</text>
  <text x="655" y="293.75" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">(</text>
  <text x="670" y="293.75" font-size="18.2496" fill="var(--primary-accent)" font-family="Courier New, monospace">"%d\n"</text>
  <text x="752.5" y="293.75" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">, *ptr);</text>
  <text x="580" y="330" font-size="18.2496" fill="var(--text-muted)" font-family="Courier New, monospace">free</text>
  <text x="632.5" y="330" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">(ptr);</text>
  <text x="580" y="366.25" font-size="18.2496" fill="var(--danger-accent)" font-family="Courier New, monospace">return</text>
  <text x="662.5" y="366.25" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">0;</text>
  <text x="550" y="388" font-size="18.2496" fill="var(--text)" font-family="Courier New, monospace">}</text>
  <rect x="550" y="434.7223" width="93.75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="596.875" y="463.7223" font-size="13.9044" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">stack</text>
  <rect x="664.375" y="434.7223" width="93.75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="711.2499" y="463.7223" font-size="13.9044" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">heap</text>
  <rect x="778.7499" y="434.7223" width="93.75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="825.625" y="463.7223" font-size="13.9044" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">bss</text>
  <rect x="893.125" y="434.7223" width="93.75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="939.9999" y="463.7223" font-size="13.9044" fill="var(--text-muted)" text-anchor="middle" font-family="Courier New, monospace">data</text>
  <rect x="1007.4999" y="434.7223" width="93.75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1054.375" y="463.7223" font-size="13.9044" fill="var(--text)" text-anchor="middle" font-family="Courier New, monospace">text</text>
  <line x1="617.5" y1="515.2777" x2="711.2499" y2="515.2777" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="664.375" y="539.4444" font-size="13.9044" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">ptr</text>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">C Refresher</text>
</svg>

  <text x="672" y="315" font-family="monospace" font-size="21" fill="#1e88e5">"%d\n"</text>
  <text x="760" y="315" font-family="monospace" font-size="21" fill="#333333">, *ptr);</text>
  <text x="576" y="360" font-family="monospace" font-size="21" fill="#555555">free</text>
  <text x="632" y="360" font-family="monospace" font-size="21" fill="#333333">(ptr);</text>
  <text x="576" y="405" font-family="monospace" font-size="21" fill="#e94560">return</text>
  <text x="664" y="405" font-family="monospace" font-size="21" fill="#333333">0;</text>
  <text x="544" y="432" font-family="monospace" font-size="21" fill="#333333">}</text>

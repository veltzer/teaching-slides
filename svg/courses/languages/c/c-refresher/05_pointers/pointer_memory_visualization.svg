<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="142.389499" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.847089" />
  <text x="82.857144" y="83.666177" font-size="34.229468" fill="var(--text)">int x = 42;</text>
  <text x="82.857144" y="117.839667" font-size="34.229468" fill="var(--text)">int *p = &amp;x;</text>
  <text x="82.857144" y="152.013156" font-size="34.229468" fill="var(--text)">int **pp = &amp;p;</text>
  <text x="40" y="226.055794" font-size="34.229468" font-weight="bold" fill="var(--text)" font-family="sans-serif">Stack Memory:</text>
  <rect x="40" y="245.040935" width="814.285715" height="72.144124" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.847089"/>
  <text x="82.857144" y="292.504141" font-size="34.229468" fill="var(--text)">pp: 0x7FF008</text>
  <rect x="40" y="320.98197" width="814.285715" height="72.144124" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.847089"/>
  <text x="82.857144" y="368.445293" font-size="34.229468" fill="var(--text)">p:  0x7FF010</text>
  <rect x="40" y="396.92324" width="814.285715" height="72.144124" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.847089"/>
  <text x="82.857144" y="434.89364" font-size="34.229468" fill="var(--text)">x:  42</text>
  <text x="82.857144" y="459.574558" font-size="29.950908" fill="var(--text-faint)">    0x7FF018</text>
  <line x1="854.285715" y1="281.112938" x2="1025.714285" y2="281.112938" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="1025.714285" y1="281.112938" x2="1025.714285" y2="357.054091" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="854.285715" y1="357.054091" x2="1006.428571" y2="357.054091" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="854.285715" y1="357.054091" x2="1090" y2="357.054091" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="1090" y1="357.054091" x2="1090" y2="432.995126" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="854.285715" y1="432.995126" x2="1070.714286" y2="432.995126" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="40" y="534.566277" font-size="34.229468" fill="var(--text)">**pp == *p == x == 42</text>
  <text x="40" y="577.283139" font-size="34.229468" fill="var(--text)"> *pp == p  == 0x7FF018</text>
  <text x="40" y="620" font-size="34.229468" fill="var(--text)">  pp       == 0x7FF010</text>
</svg>
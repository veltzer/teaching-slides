<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="59.3333" width="525" height="120.8333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="77.5" y="96.3889" font-size="20.8566" fill="var(--text)">int x = 42;</text>
  <text x="77.5" y="125.3889" font-size="20.8566" fill="var(--text)">int *p = &amp;x;</text>
  <text x="77.5" y="154.3889" font-size="20.8566" fill="var(--text)">int **pp = &amp;p;</text>
  <text x="58.75" y="217.2223" font-size="20.8566" font-weight="bold" fill="var(--text)" font-family="sans-serif">Stack Memory:</text>
  <rect x="58.75" y="233.3333" width="356.25" height="61.2223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="77.5" y="273.6111" font-size="20.8566" fill="var(--text)">pp: 0x7FF008</text>
  <rect x="58.75" y="297.7777" width="356.25" height="61.2223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="77.5" y="338.0556" font-size="20.8566" fill="var(--text)">p:  0x7FF010</text>
  <rect x="58.75" y="362.2223" width="356.25" height="61.2223" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="77.5" y="394.4444" font-size="20.8566" fill="var(--text)">x:  42</text>
  <text x="77.5" y="415.3889" font-size="18.2496" fill="var(--text-faint)">    0x7FF018</text>
  <line x1="415" y1="263.9444" x2="490" y2="263.9444" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="490" y1="263.9444" x2="490" y2="328.3889" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="415" y1="328.3889" x2="481.5625" y2="328.3889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="415" y1="328.3889" x2="518.125" y2="328.3889" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="518.125" y1="328.3889" x2="518.125" y2="392.8333" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="415" y1="392.8333" x2="509.6875" y2="392.8333" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="58.75" y="479.0277" font-size="20.8566" fill="var(--text)">**pp == *p == x == 42</text>
  <text x="58.75" y="515.2777" font-size="20.8566" fill="var(--text)"> *pp == p  == 0x7FF018</text>
  <text x="58.75" y="551.5277" font-size="20.8566" fill="var(--text)">  pp       == 0x7FF010</text>
</svg>
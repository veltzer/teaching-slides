<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="21.3333" width="497.7778" height="133.3333" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="35.5556" y="62.2222" font-size="21.3333" fill="var(--text)">int x = 42;</text>
  <text x="35.5556" y="94.2222" font-size="21.3333" fill="var(--text)">int *p = &amp;x;</text>
  <text x="35.5556" y="126.2222" font-size="21.3333" fill="var(--text)">int **pp = &amp;p;</text>
  <text x="17.7778" y="195.5556" font-size="21.3333" font-weight="bold" fill="var(--text)" font-family="sans-serif">Stack Memory:</text>
  <rect x="17.7778" y="213.3333" width="337.7778" height="67.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="35.5556" y="257.7778" font-size="21.3333" fill="var(--text)">pp: 0x7FF008</text>
  <rect x="17.7778" y="284.4444" width="337.7778" height="67.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="35.5556" y="328.8889" font-size="21.3333" fill="var(--text)">p:  0x7FF010</text>
  <rect x="17.7778" y="355.5556" width="337.7778" height="67.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="35.5556" y="391.1111" font-size="21.3333" fill="var(--text)">x:  42</text>
  <text x="35.5556" y="414.2222" font-size="18.6667" fill="var(--text-faint)">    0x7FF018</text>
  <line x1="355.5556" y1="247.1111" x2="426.6667" y2="247.1111" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="426.6667" y1="247.1111" x2="426.6667" y2="318.2222" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="355.5556" y1="318.2222" x2="418.6667" y2="318.2222" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="355.5556" y1="318.2222" x2="453.3333" y2="318.2222" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="453.3333" y1="318.2222" x2="453.3333" y2="389.3333" stroke="var(--text-muted)" stroke-width="1.7778" />
  <line x1="355.5556" y1="389.3333" x2="445.3333" y2="389.3333" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="17.7778" y="484.4444" font-size="21.3333" fill="var(--text)">**pp == *p == x == 42</text>
  <text x="17.7778" y="524.4444" font-size="21.3333" fill="var(--text)"> *pp == p  == 0x7FF018</text>
  <text x="17.7778" y="564.4444" font-size="21.3333" fill="var(--text)">  pp       == 0x7FF010</text>
</svg>
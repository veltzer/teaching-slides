<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Code box -->
  <rect x="20" y="24" width="560" height="150" fill="#f5f5f5" stroke="#cccccc" stroke-width="2" rx="7"/>
  <text x="40" y="70" font-size="24" fill="#222222">int x = 42;</text>
  <text x="40" y="106" font-size="24" fill="#222222">int *p = &amp;x;</text>
  <text x="40" y="142" font-size="24" fill="#222222">int **pp = &amp;p;</text>

  <!-- Stack memory label -->
  <text x="20" y="220" font-size="24" font-weight="bold" fill="#333333" font-family="sans-serif">Stack Memory:</text>

  <!-- pp -->
  <rect x="20" y="240" width="380" height="76" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="40" y="290" font-size="24" fill="#222222">pp: 0x7FF008</text>

  <!-- p -->
  <rect x="20" y="320" width="380" height="76" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="40" y="370" font-size="24" fill="#222222">p:  0x7FF010</text>

  <!-- x -->
  <rect x="20" y="400" width="380" height="76" fill="url(#grad-surface)" stroke="#555555" stroke-width="2" filter="url(#shadow)"/>
  <text x="40" y="440" font-size="24" fill="#222222">x:  42</text>
  <text x="40" y="466" font-size="21" fill="#888888">    0x7FF018</text>

  <!-- Arrows: pp -> p -->
  <line x1="400" y1="278" x2="480" y2="278" stroke="#555555" stroke-width="2"/>
  <line x1="480" y1="278" x2="480" y2="358" stroke="#555555" stroke-width="2"/>
  <line x1="400" y1="358" x2="471" y2="358" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: p -> x -->
  <line x1="400" y1="358" x2="510" y2="358" stroke="#555555" stroke-width="2"/>
  <line x1="510" y1="358" x2="510" y2="438" stroke="#555555" stroke-width="2"/>
  <line x1="400" y1="438" x2="501" y2="438" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Summary lines -->
  <text x="20" y="545" font-size="24" fill="#222222">**pp == *p == x == 42</text>
  <text x="20" y="590" font-size="24" fill="#222222"> *pp == p  == 0x7FF018</text>
  <text x="20" y="635" font-size="24" fill="#222222">  pp       == 0x7FF010</text>
</svg>

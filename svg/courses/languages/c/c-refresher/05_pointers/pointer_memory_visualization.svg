<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="142.389499" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.847089"/>
  <text x="82.857144" y="83.666177" font-size="34.229468" fill="var(--text)" font-family="Arial, sans-serif">int x = 42;</text>
  <text x="82.857144" y="117.839667" font-size="34.229468" fill="var(--text)" font-family="Arial, sans-serif">int *p = &amp;x;</text>
  <text x="82.857144" y="152.013156" font-size="34.229468" fill="var(--text)" font-family="Arial, sans-serif">int **pp = &amp;p;</text>
  <text x="40" y="226.055794" font-size="34.229468" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Stack Memory:</text>
  <rect x="40" y="245.040935" width="814.285715" height="72.144124" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.847089"/>
  <text x="82.857144" y="292.504141" font-size="34.229468" fill="var(--text)" font-family="Arial, sans-serif">pp: 0x7FF008</text>
  <rect x="40" y="320.98197" width="814.285715" height="72.144124" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.847089"/>
  <text x="82.857144" y="368.445293" font-size="34.229468" fill="var(--text)" font-family="Arial, sans-serif">p:  0x7FF010</text>
  <rect x="40" y="396.92324" width="814.285715" height="72.144124" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="9.847089"/>
  <text x="82.857144" y="434.89364" font-size="34.229468" fill="var(--text)" font-family="Arial, sans-serif">x:  42</text>
  <text x="82.857144" y="459.574558" font-size="29.950908" fill="var(--text-faint)" font-family="Arial, sans-serif">    0x7FF018</text>
  <line x1="854.285715" y1="281.112938" x2="1025.714285" y2="281.112938" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="1025.714285" y1="281.112938" x2="1025.714285" y2="357.054091" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="854.285715" y1="357.054091" x2="1006.428571" y2="357.054091" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="854.285715" y1="357.054091" x2="1090" y2="357.054091" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="1090" y1="357.054091" x2="1090" y2="432.995126" stroke="var(--text-muted)" stroke-width="1.7778"/>
  <line x1="854.285715" y1="432.995126" x2="1070.714286" y2="432.995126" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="40" y="534.566277" font-size="34.229468" fill="var(--text)" font-family="Arial, sans-serif">**pp == *p == x == 42</text>
  <text x="40" y="577.283139" font-size="34.229468" fill="var(--text)" font-family="Arial, sans-serif"> *pp == p  == 0x7FF018</text>
  <text x="40" y="620" font-size="34.229468" fill="var(--text)" font-family="Arial, sans-serif">  pp       == 0x7FF010</text>
</svg>

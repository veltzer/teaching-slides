<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Table outer border -->
  <rect x="30" y="20" width="1220" height="600" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>

  <!-- Column header row background -->
  <rect x="30" y="20" width="1220" height="52" rx="6" fill="url(#grad-header)"/>
  <!-- Square off bottom-left and bottom-right corners of header -->
  <rect x="30" y="52" width="1220" height="20" fill="url(#grad-header)" rx="6"/>

  <!-- Column headers -->
  <text x="150" y="52" font-family="sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">Tool</text>
  <text x="490" y="52" font-family="sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">What It Detects</text>
  <text x="875" y="52" font-family="sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">Key Command</text>
  <text x="1145" y="52" font-family="sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">Speed</text>

  <!-- Column dividers in header -->
  <line x1="270" y1="20" x2="270" y2="72" stroke="var(--bg)" stroke-width="1" opacity="0.4"/>
  <line x1="710" y1="20" x2="710" y2="72" stroke="var(--bg)" stroke-width="1" opacity="0.4"/>
  <line x1="1040" y1="20" x2="1040" y2="72" stroke="var(--bg)" stroke-width="1" opacity="0.4"/>

  <!-- ============================================================ -->
  <!-- ROW 1: GDB -->
  <!-- ============================================================ -->
  <rect x="30" y="72" width="1220" height="83" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <!-- tool badge -->
  <rect x="50" y="83" width="100" height="34" rx="6" fill="var(--primary-accent)" filter="url(#shadow)"/>
  <text x="100" y="105" font-family="monospace" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">GDB</text>
  <text x="175" y="105" font-family="sans-serif" font-size="12" fill="var(--text-muted)">Interactive</text>
  <text x="175" y="121" font-family="sans-serif" font-size="12" fill="var(--text-muted)">debugger</text>
  <!-- what it detects -->
  <text x="285" y="98" font-family="sans-serif" font-size="13" fill="var(--text)">Crashes, segfaults, logic bugs, wrong values</text>
  <text x="285" y="116" font-family="sans-serif" font-size="13" fill="var(--text)">Breakpoints, watchpoints, stack traces, memory inspection</text>
  <text x="285" y="134" font-family="sans-serif" font-size="12" fill="var(--text-faint)">Post-mortem analysis via core dumps</text>
  <!-- key command -->
  <rect x="720" y="83" width="310" height="26" rx="6" fill="var(--primary-accent)" opacity="0.08"/>
  <text x="730" y="100" font-family="monospace" font-size="13" fill="var(--primary-accent)">gcc -g -O0 -o prog prog.c</text>
  <rect x="720" y="114" width="218" height="26" rx="6" fill="var(--primary-accent)" opacity="0.08"/>
  <text x="730" y="131" font-family="monospace" font-size="13" fill="var(--primary-accent)">gdb ./prog</text>
  <!-- speed -->
  <text x="1145" y="118" font-family="sans-serif" font-size="13" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Native</text>

  <!-- ROW divider -->
  <line x1="30" y1="155" x2="1250" y2="155" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 2: Valgrind -->
  <!-- ============================================================ -->
  <rect x="30" y="155" width="1220" height="83" fill="var(--surface)" rx="6"/>
  <rect x="50" y="166" width="100" height="34" rx="6" fill="var(--info-accent)" filter="url(#shadow)"/>
  <text x="100" y="188" font-family="monospace" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">Valgrind</text>
  <text x="175" y="188" font-family="sans-serif" font-size="12" fill="var(--text-muted)">Memory</text>
  <text x="175" y="204" font-family="sans-serif" font-size="12" fill="var(--text-muted)">checker</text>

  <text x="285" y="181" font-family="sans-serif" font-size="13" fill="var(--text)">Memory leaks, invalid reads/writes, use-after-free</text>
  <text x="285" y="199" font-family="sans-serif" font-size="13" fill="var(--text)">Uninit value use, double free, overlapping memcpy</text>
  <text x="285" y="217" font-family="sans-serif" font-size="12" fill="var(--text-faint)">No recompilation needed  |  Helgrind: data races</text>

  <rect x="720" y="166" width="312" height="26" rx="6" fill="var(--info-accent)" opacity="0.08"/>
  <text x="730" y="183" font-family="monospace" font-size="12" fill="var(--info-accent)">valgrind --leak-check=full ./prog</text>
  <rect x="720" y="197" width="310" height="26" rx="6" fill="var(--info-accent)" opacity="0.08"/>
  <text x="730" y="214" font-family="monospace" font-size="12" fill="var(--info-accent)">valgrind --tool=helgrind ./prog</text>
  <text x="1145" y="205" font-family="sans-serif" font-size="13" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">~10-20x slower</text>

  <line x1="30" y1="238" x2="1250" y2="238" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 3: ASan -->
  <!-- ============================================================ -->
  <rect x="30" y="238" width="1220" height="83" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="50" y="249" width="100" height="34" rx="6" fill="var(--ok-accent)" filter="url(#shadow)"/>
  <text x="100" y="271" font-family="monospace" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">ASan</text>
  <text x="175" y="271" font-family="sans-serif" font-size="12" fill="var(--text-muted)">Address</text>
  <text x="175" y="287" font-family="sans-serif" font-size="12" fill="var(--text-muted)">Sanitizer</text>

  <text x="285" y="264" font-family="sans-serif" font-size="13" fill="var(--text)">Heap/stack buffer overflows, use-after-free</text>
  <text x="285" y="282" font-family="sans-serif" font-size="13" fill="var(--text)">Use-after-return, use-after-scope, global overflows</text>
  <text x="285" y="300" font-family="sans-serif" font-size="12" fill="var(--text-faint)">Requires recompilation  |  Cannot combine with TSan</text>

  <rect x="720" y="249" width="312" height="26" rx="6" fill="var(--ok-accent)" opacity="0.08"/>
  <text x="730" y="266" font-family="monospace" font-size="12" fill="var(--ok-accent)">gcc -fsanitize=address \</text>
  <rect x="720" y="279" width="312" height="26" rx="6" fill="var(--ok-accent)" opacity="0.08"/>
  <text x="730" y="296" font-family="monospace" font-size="12" fill="var(--ok-accent)">    -fno-omit-frame-pointer ./prog</text>
  <text x="1145" y="288" font-family="sans-serif" font-size="13" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">~2x slower</text>

  <line x1="30" y1="321" x2="1250" y2="321" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 4: UBSan -->
  <!-- ============================================================ -->
  <rect x="30" y="321" width="1220" height="83" fill="var(--surface)" rx="6"/>
  <rect x="50" y="332" width="100" height="34" rx="6" fill="var(--warn-accent)" filter="url(#shadow)"/>
  <text x="100" y="354" font-family="monospace" font-size="14" font-weight="bold" fill="var(--bg)" text-anchor="middle">UBSan</text>
  <text x="175" y="354" font-family="sans-serif" font-size="12" fill="var(--text-muted)">Undefined</text>
  <text x="175" y="370" font-family="sans-serif" font-size="12" fill="var(--text-muted)">Behavior</text>

  <text x="285" y="347" font-family="sans-serif" font-size="13" fill="var(--text)">Signed integer overflow, shift overflow, div-by-zero</text>
  <text x="285" y="365" font-family="sans-serif" font-size="13" fill="var(--text)">NULL dereference, type-punning violations</text>
  <text x="285" y="383" font-family="sans-serif" font-size="12" fill="var(--text-faint)">Combine with ASan for maximum coverage</text>

  <rect x="720" y="332" width="312" height="26" rx="6" fill="var(--danger-accent)" opacity="0.08"/>
  <text x="730" y="349" font-family="monospace" font-size="12" fill="var(--danger-accent)">gcc -fsanitize=undefined \</text>
  <rect x="720" y="362" width="312" height="26" rx="6" fill="var(--danger-accent)" opacity="0.08"/>
  <text x="730" y="379" font-family="monospace" font-size="12" fill="var(--danger-accent)">    -fsanitize=address ./prog</text>
  <text x="1145" y="371" font-family="sans-serif" font-size="13" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">~2x slower</text>

  <line x1="30" y1="404" x2="1250" y2="404" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 5: perf -->
  <!-- ============================================================ -->
  <rect x="30" y="404" width="1220" height="83" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="50" y="415" width="100" height="34" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="100" y="437" font-family="monospace" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">perf</text>
  <text x="175" y="437" font-family="sans-serif" font-size="12" fill="var(--text-muted)">CPU</text>
  <text x="175" y="453" font-family="sans-serif" font-size="12" fill="var(--text-muted)">profiler</text>

  <text x="285" y="430" font-family="sans-serif" font-size="13" fill="var(--text)">CPU hotspots, cache misses, branch mispredictions</text>
  <text x="285" y="448" font-family="sans-serif" font-size="13" fill="var(--text)">IPC (instructions/cycle), page faults, context switches</text>
  <text x="285" y="466" font-family="sans-serif" font-size="12" fill="var(--text-faint)">Flamegraph generation  |  Linux kernel profiling</text>

  <rect x="720" y="415" width="218" height="26" rx="6" fill="var(--warn-accent)" opacity="0.08"/>
  <text x="730" y="432" font-family="monospace" font-size="13" fill="var(--warn-accent)">perf stat ./prog</text>
  <rect x="720" y="447" width="218" height="26" rx="6" fill="var(--warn-accent)" opacity="0.08"/>
  <text x="730" y="464" font-family="monospace" font-size="13" fill="var(--warn-accent)">perf record -g ./prog</text>
  <text x="1145" y="454" font-family="sans-serif" font-size="13" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Near-native</text>

  <line x1="30" y1="487" x2="1250" y2="487" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 6: clang-tidy -->
  <!-- ============================================================ -->
  <rect x="30" y="487" width="1220" height="83" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="50" y="498" width="100" height="34" rx="6" fill="var(--danger-accent)" filter="url(#shadow)"/>
  <text x="100" y="516" font-family="monospace" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">clang-tidy</text>
  <text x="175" y="516" font-family="sans-serif" font-size="12" fill="var(--text-muted)">Static</text>
  <text x="175" y="532" font-family="sans-serif" font-size="12" fill="var(--text-muted)">analysis</text>

  <text x="285" y="513" font-family="sans-serif" font-size="13" fill="var(--text)">Code quality, bug-prone patterns, cert compliance</text>
  <text x="285" y="531" font-family="sans-serif" font-size="13" fill="var(--text)">NULL deref, sizeof misuse, unchecked return values</text>
  <text x="285" y="549" font-family="sans-serif" font-size="12" fill="var(--text-faint)">Static — no runtime needed  |  Can auto-fix issues (-fix)</text>

  <rect x="720" y="498" width="312" height="26" rx="6" fill="var(--danger-accent)" opacity="0.08"/>
  <text x="730" y="515" font-family="monospace" font-size="12" fill="var(--danger-accent)">clang-tidy file.c -- -std=c11</text>
  <rect x="720" y="530" width="312" height="26" rx="6" fill="var(--danger-accent)" opacity="0.08"/>
  <text x="730" y="547" font-family="monospace" font-size="12" fill="var(--danger-accent)">clang-tidy -checks='bugprone-*' f.c</text>
  <text x="1145" y="537" font-family="sans-serif" font-size="13" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Compile-time</text>

  <!-- ============================================================ -->
  <!-- FOOTER BAR: recommended workflow -->
  <!-- ============================================================ -->
  <rect x="30" y="578" width="1220" height="42" rx="6" fill="var(--text-muted)"/>
  <rect x="30" y="590" width="1220" height="30" fill="var(--text-muted)" rx="6"/>
  <rect x="30" y="578" width="1220" height="42" rx="6" fill="var(--text-muted)"/>
  <text x="640" y="591" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Recommended workflow:</text>
  <text x="640" y="610" font-family="monospace" font-size="12" fill="var(--ok-accent)" text-anchor="middle">Warnings → clang-tidy → ASan+UBSan → Valgrind → GDB (on crash) → perf (on slowness)</text>

  <!-- Column dividers (full height) -->
  <line x1="270" y1="72" x2="270" y2="578" stroke="var(--border)" stroke-width="1"/>
  <line x1="710" y1="72" x2="710" y2="578" stroke="var(--border)" stroke-width="1"/>
  <line x1="1040" y1="72" x2="1040" y2="578" stroke="var(--border)" stroke-width="1"/>
</svg>

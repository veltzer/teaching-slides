<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- Table outer border -->
  <rect x="40" y="40" width="1200" height="580" rx="6.347324" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>

  <!-- Column header row background -->
  <rect x="40" y="40" width="1200" height="50.266667" rx="6.347324" fill="url(#grad-header)"/>
  <!-- Square off bottom-left and bottom-right corners of header -->
  <rect x="40" y="70.933333" width="1200" height="19.333333" fill="url(#grad-header)" rx="6.347324"/>

  <!-- Column headers -->
  <text x="158.032787" y="70.933333" font-family="sans-serif" font-size="16.576672" font-weight="bold" fill="var(--bg)" text-anchor="middle">Tool</text>
  <text x="492.459016" y="70.933333" font-family="sans-serif" font-size="16.576672" font-weight="bold" fill="var(--bg)" text-anchor="middle">What It Detects</text>
  <text x="871.147541" y="70.933333" font-family="sans-serif" font-size="16.576672" font-weight="bold" fill="var(--bg)" text-anchor="middle">Key Command</text>
  <text x="1136.721311" y="70.933333" font-family="sans-serif" font-size="16.576672" font-weight="bold" fill="var(--bg)" text-anchor="middle">Speed</text>

  <!-- Column dividers in header -->
  <line x1="276.065574" y1="40" x2="276.065574" y2="90.266667" stroke="var(--bg)" stroke-width="1" opacity="0.4"/>
  <line x1="708.852459" y1="40" x2="708.852459" y2="90.266667" stroke="var(--bg)" stroke-width="1" opacity="0.4"/>
  <line x1="1033.442623" y1="40" x2="1033.442623" y2="90.266667" stroke="var(--bg)" stroke-width="1" opacity="0.4"/>

  <!-- ============================================================ -->
  <!-- ROW 1: GDB -->
  <!-- ============================================================ -->
  <rect x="40" y="90.266667" width="1200" height="80.233387" fill="var(--primary-fill)" rx="6.347324" stroke="var(--primary-border)" stroke-width="2"/>
  <!-- tool badge -->
  <rect x="59.672131" y="100.900053" width="98.360656" height="32.866667" rx="6.347324" fill="var(--primary-accent)" filter="url(#shadow)"/>
  <text x="108.852459" y="122.166613" font-family="monospace" font-size="14.626457" font-weight="bold" fill="var(--bg)" text-anchor="middle">GDB</text>
  <text x="182.622951" y="122.166613" font-family="sans-serif" font-size="11.701186" fill="var(--text-muted)">Interactive</text>
  <text x="182.622951" y="137.63328" font-family="sans-serif" font-size="11.701186" fill="var(--text-muted)">debugger</text>
  <!-- what it detects -->
  <text x="290.819672" y="115.4" font-family="sans-serif" font-size="12.676347" fill="var(--text)">Crashes, segfaults, logic bugs, wrong values</text>
  <text x="290.819672" y="132.8" font-family="sans-serif" font-size="12.676347" fill="var(--text)">Breakpoints, watchpoints, stack traces, memory inspection</text>
  <text x="290.819672" y="150.2" font-family="sans-serif" font-size="11.701186" fill="var(--text-faint)">Post-mortem analysis via core dumps</text>
  <!-- key command -->
  <rect x="718.688525" y="100.900053" width="304.918033" height="25.133333" rx="6.347324" fill="var(--primary-accent)" opacity="0.08"/>
  <text x="728.52459" y="117.333333" font-family="monospace" font-size="12.676347" fill="var(--primary-accent)">gcc -g -O0 -o prog prog.c</text>
  <rect x="718.688525" y="130.866667" width="214.42623" height="25.133333" rx="6.347324" fill="var(--primary-accent)" opacity="0.08"/>
  <text x="728.52459" y="147.300053" font-family="monospace" font-size="12.676347" fill="var(--primary-accent)">gdb ./prog</text>
  <!-- speed -->
  <text x="1136.721311" y="134.733333" font-family="sans-serif" font-size="12.676347" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Native</text>

  <!-- ROW divider -->
  <line x1="40" y1="170.500053" x2="1240" y2="170.500053" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 2: Valgrind -->
  <!-- ============================================================ -->
  <rect x="40" y="170.500053" width="1200" height="80.233387" fill="var(--surface)" rx="6.347324"/>
  <rect x="59.672131" y="181.133333" width="98.360656" height="32.866667" rx="6.347324" fill="var(--info-accent)" filter="url(#shadow)"/>
  <text x="108.852459" y="202.4" font-family="monospace" font-size="13.651402" font-weight="bold" fill="var(--bg)" text-anchor="middle">Valgrind</text>
  <text x="182.622951" y="202.4" font-family="sans-serif" font-size="11.701186" fill="var(--text-muted)">Memory</text>
  <text x="182.622951" y="217.866667" font-family="sans-serif" font-size="11.701186" fill="var(--text-muted)">checker</text>

  <text x="290.819672" y="195.63328" font-family="sans-serif" font-size="12.676347" fill="var(--text)">Memory leaks, invalid reads/writes, use-after-free</text>
  <text x="290.819672" y="213.033387" font-family="sans-serif" font-size="12.676347" fill="var(--text)">Uninit value use, double free, overlapping memcpy</text>
  <text x="290.819672" y="230.43328" font-family="sans-serif" font-size="11.701186" fill="var(--text-faint)">No recompilation needed  |  Helgrind: data races</text>

  <rect x="718.688525" y="181.133333" width="306.885246" height="25.133333" rx="6.347324" fill="var(--info-accent)" opacity="0.08"/>
  <text x="728.52459" y="197.56672" font-family="monospace" font-size="11.701186" fill="var(--info-accent)">valgrind --leak-check=full ./prog</text>
  <rect x="718.688525" y="211.099947" width="304.918033" height="25.133333" rx="6.347324" fill="var(--info-accent)" opacity="0.08"/>
  <text x="728.52459" y="227.533333" font-family="monospace" font-size="11.701186" fill="var(--info-accent)">valgrind --tool=helgrind ./prog</text>
  <text x="1136.721311" y="218.83328" font-family="sans-serif" font-size="12.676347" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">~10-20x slower</text>

  <line x1="40" y1="250.733333" x2="1240" y2="250.733333" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 3: ASan -->
  <!-- ============================================================ -->
  <rect x="40" y="250.733333" width="1200" height="80.233387" fill="var(--ok-fill)" rx="6.347324" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="59.672131" y="261.366613" width="98.360656" height="32.866667" rx="6.347324" fill="var(--ok-accent)" filter="url(#shadow)"/>
  <text x="108.852459" y="282.633387" font-family="monospace" font-size="14.626457" font-weight="bold" fill="var(--bg)" text-anchor="middle">ASan</text>
  <text x="182.622951" y="282.633387" font-family="sans-serif" font-size="11.701186" fill="var(--text-muted)">Address</text>
  <text x="182.622951" y="298.100053" font-family="sans-serif" font-size="11.701186" fill="var(--text-muted)">Sanitizer</text>

  <text x="290.819672" y="275.866667" font-family="sans-serif" font-size="12.676347" fill="var(--text)">Heap/stack buffer overflows, use-after-free</text>
  <text x="290.819672" y="293.266667" font-family="sans-serif" font-size="12.676347" fill="var(--text)">Use-after-return, use-after-scope, global overflows</text>
  <text x="290.819672" y="310.666667" font-family="sans-serif" font-size="11.701186" fill="var(--text-faint)">Requires recompilation  |  Cannot combine with TSan</text>

  <rect x="718.688525" y="261.366613" width="306.885246" height="25.133333" rx="6.347324" fill="var(--ok-accent)" opacity="0.08"/>
  <text x="728.52459" y="277.8" font-family="monospace" font-size="11.701186" fill="var(--ok-accent)">gcc -fsanitize=address \</text>
  <rect x="718.688525" y="290.36672" width="306.885246" height="25.133333" rx="6.347324" fill="var(--ok-accent)" opacity="0.08"/>
  <text x="728.52459" y="306.8" font-family="monospace" font-size="11.701186" fill="var(--ok-accent)">    -fno-omit-frame-pointer ./prog</text>
  <text x="1136.721311" y="299.066667" font-family="sans-serif" font-size="12.676347" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">~2x slower</text>

  <line x1="40" y1="330.966613" x2="1240" y2="330.966613" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 4: UBSan -->
  <!-- ============================================================ -->
  <rect x="40" y="330.966613" width="1200" height="80.233387" fill="var(--surface)" rx="6.347324"/>
  <rect x="59.672131" y="341.6" width="98.360656" height="32.866667" rx="6.347324" fill="var(--warn-accent)" filter="url(#shadow)"/>
  <text x="108.852459" y="362.866667" font-family="monospace" font-size="13.651402" font-weight="bold" fill="var(--bg)" text-anchor="middle">UBSan</text>
  <text x="182.622951" y="362.866667" font-family="sans-serif" font-size="11.701186" fill="var(--text-muted)">Undefined</text>
  <text x="182.622951" y="378.333333" font-family="sans-serif" font-size="11.701186" fill="var(--text-muted)">Behavior</text>

  <text x="290.819672" y="356.100053" font-family="sans-serif" font-size="12.676347" fill="var(--text)">Signed integer overflow, shift overflow, div-by-zero</text>
  <text x="290.819672" y="373.499947" font-family="sans-serif" font-size="12.676347" fill="var(--text)">NULL dereference, type-punning violations</text>
  <text x="290.819672" y="390.900053" font-family="sans-serif" font-size="11.701186" fill="var(--text-faint)">Combine with ASan for maximum coverage</text>

  <rect x="718.688525" y="341.6" width="306.885246" height="25.133333" rx="6.347324" fill="var(--danger-accent)" opacity="0.08"/>
  <text x="728.52459" y="358.03328" font-family="monospace" font-size="11.701186" fill="var(--danger-accent)">gcc -fsanitize=undefined \</text>
  <rect x="718.688525" y="370.6" width="306.885246" height="25.133333" rx="6.347324" fill="var(--danger-accent)" opacity="0.08"/>
  <text x="728.52459" y="387.033387" font-family="monospace" font-size="11.701186" fill="var(--danger-accent)">    -fsanitize=address ./prog</text>
  <text x="1136.721311" y="379.300053" font-family="sans-serif" font-size="12.676347" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">~2x slower</text>

  <line x1="40" y1="411.2" x2="1240" y2="411.2" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 5: perf -->
  <!-- ============================================================ -->
  <rect x="40" y="411.2" width="1200" height="80.233387" fill="var(--warn-fill)" rx="6.347324" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="59.672131" y="421.833387" width="98.360656" height="32.866667" rx="6.347324" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="108.852459" y="443.099947" font-family="monospace" font-size="14.626457" font-weight="bold" fill="var(--bg)" text-anchor="middle">perf</text>
  <text x="182.622951" y="443.099947" font-family="sans-serif" font-size="11.701186" fill="var(--text-muted)">CPU</text>
  <text x="182.622951" y="458.566613" font-family="sans-serif" font-size="11.701186" fill="var(--text-muted)">profiler</text>

  <text x="290.819672" y="436.333333" font-family="sans-serif" font-size="12.676347" fill="var(--text)">CPU hotspots, cache misses, branch mispredictions</text>
  <text x="290.819672" y="453.733333" font-family="sans-serif" font-size="12.676347" fill="var(--text)">IPC (instructions/cycle), page faults, context switches</text>
  <text x="290.819672" y="471.133333" font-family="sans-serif" font-size="11.701186" fill="var(--text-faint)">Flamegraph generation  |  Linux kernel profiling</text>

  <rect x="718.688525" y="421.833387" width="214.42623" height="25.133333" rx="6.347324" fill="var(--warn-accent)" opacity="0.08"/>
  <text x="728.52459" y="438.266667" font-family="monospace" font-size="12.676347" fill="var(--warn-accent)">perf stat ./prog</text>
  <rect x="718.688525" y="452.76672" width="214.42623" height="25.133333" rx="6.347324" fill="var(--warn-accent)" opacity="0.08"/>
  <text x="728.52459" y="469.2" font-family="monospace" font-size="12.676347" fill="var(--warn-accent)">perf record -g ./prog</text>
  <text x="1136.721311" y="459.533333" font-family="sans-serif" font-size="12.676347" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Near-native</text>

  <line x1="40" y1="491.433387" x2="1240" y2="491.433387" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 6: clang-tidy -->
  <!-- ============================================================ -->
  <rect x="40" y="491.433387" width="1200" height="80.233387" fill="var(--danger-fill)" rx="6.347324" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="59.672131" y="502.066667" width="98.360656" height="32.866667" rx="6.347324" fill="var(--danger-accent)" filter="url(#shadow)"/>
  <text x="108.852459" y="519.466667" font-family="monospace" font-size="11.701186" font-weight="bold" fill="var(--bg)" text-anchor="middle">clang-tidy</text>
  <text x="182.622951" y="519.466667" font-family="sans-serif" font-size="11.701186" fill="var(--text-muted)">Static</text>
  <text x="182.622951" y="534.933333" font-family="sans-serif" font-size="11.701186" fill="var(--text-muted)">analysis</text>

  <text x="290.819672" y="516.566613" font-family="sans-serif" font-size="12.676347" fill="var(--text)">Code quality, bug-prone patterns, cert compliance</text>
  <text x="290.819672" y="533.96672" font-family="sans-serif" font-size="12.676347" fill="var(--text)">NULL deref, sizeof misuse, unchecked return values</text>
  <text x="290.819672" y="551.366613" font-family="sans-serif" font-size="11.701186" fill="var(--text-faint)">Static — no runtime needed  |  Can auto-fix issues (-fix)</text>

  <rect x="718.688525" y="502.066667" width="306.885246" height="25.133333" rx="6.347324" fill="var(--danger-accent)" opacity="0.08"/>
  <text x="728.52459" y="518.500053" font-family="monospace" font-size="11.701186" fill="var(--danger-accent)">clang-tidy file.c -- -std=c11</text>
  <rect x="718.688525" y="533" width="306.885246" height="25.133333" rx="6.347324" fill="var(--danger-accent)" opacity="0.08"/>
  <text x="728.52459" y="549.433387" font-family="monospace" font-size="11.701186" fill="var(--danger-accent)">clang-tidy -checks='bugprone-*' f.c</text>
  <text x="1136.721311" y="539.766613" font-family="sans-serif" font-size="12.676347" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Compile-time</text>

  <!-- ============================================================ -->
  <!-- FOOTER BAR: recommended workflow -->
  <!-- ============================================================ -->
  <rect x="40" y="579.4" width="1200" height="40.6" rx="6.347324" fill="var(--text-muted)"/>
  <rect x="40" y="591" width="1200" height="29" fill="var(--text-muted)" rx="6.347324"/>
  <rect x="40" y="579.4" width="1200" height="40.6" rx="6.347324" fill="var(--text-muted)"/>
  <text x="640" y="591.96672" font-family="sans-serif" font-size="12.676347" font-weight="bold" fill="var(--bg)" text-anchor="middle">Recommended workflow:</text>
  <text x="640" y="610.333333" font-family="monospace" font-size="11.701186" fill="var(--ok-accent)" text-anchor="middle">Warnings → clang-tidy → ASan+UBSan → Valgrind → GDB (on crash) → perf (on slowness)</text>

  <!-- Column dividers (full height) -->
  <line x1="276.065574" y1="90.266667" x2="276.065574" y2="579.4" stroke="var(--border)" stroke-width="1"/>
  <line x1="708.852459" y1="90.266667" x2="708.852459" y2="579.4" stroke="var(--border)" stroke-width="1"/>
  <line x1="1033.442623" y1="90.266667" x2="1033.442623" y2="579.4" stroke="var(--border)" stroke-width="1"/>
</svg>

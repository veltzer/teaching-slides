<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Table outer border -->
  <rect x="68.125" y="58.125" width="1143.75" height="543.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>

  <!-- Column header row background -->
  <rect x="68.125" y="58.125" width="1143.75" height="47.125" rx="6" fill="url(#grad-header)"/>
  <!-- Square off bottom-left and bottom-right corners of header -->
  <rect x="68.125" y="87.125" width="1143.75" height="18.125" fill="url(#grad-header)" rx="6"/>

  <!-- Column headers -->
  <text x="180.625" y="87.125" font-family="sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">Tool</text>
  <text x="499.375" y="87.125" font-family="sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">What It Detects</text>
  <text x="860.3125" y="87.125" font-family="sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">Key Command</text>
  <text x="1113.4375" y="87.125" font-family="sans-serif" font-size="15.6696" font-weight="bold" fill="var(--bg)" text-anchor="middle">Speed</text>

  <!-- Column dividers in header -->
  <line x1="293.125" y1="58.125" x2="293.125" y2="105.25" stroke="var(--bg)" stroke-width="1" opacity="0.4"/>
  <line x1="705.625" y1="58.125" x2="705.625" y2="105.25" stroke="var(--bg)" stroke-width="1" opacity="0.4"/>
  <line x1="1015" y1="58.125" x2="1015" y2="105.25" stroke="var(--bg)" stroke-width="1" opacity="0.4"/>

  <!-- ============================================================ -->
  <!-- ROW 1: GDB -->
  <!-- ============================================================ -->
  <rect x="68.125" y="105.25" width="1143.75" height="75.2188" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <!-- tool badge -->
  <rect x="86.875" y="115.2188" width="93.75" height="30.8125" rx="6" fill="var(--primary-accent)" filter="url(#shadow)"/>
  <text x="133.75" y="135.1562" font-family="monospace" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">GDB</text>
  <text x="204.0625" y="135.1562" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)">Interactive</text>
  <text x="204.0625" y="149.6562" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)">debugger</text>
  <!-- what it detects -->
  <text x="307.1875" y="128.8125" font-family="sans-serif" font-size="11.9827" fill="var(--text)">Crashes, segfaults, logic bugs, wrong values</text>
  <text x="307.1875" y="145.125" font-family="sans-serif" font-size="11.9827" fill="var(--text)">Breakpoints, watchpoints, stack traces, memory inspection</text>
  <text x="307.1875" y="161.4375" font-family="sans-serif" font-size="11.0609" fill="var(--text-faint)">Post-mortem analysis via core dumps</text>
  <!-- key command -->
  <rect x="715" y="115.2188" width="290.625" height="23.5625" rx="6" fill="var(--primary-accent)" opacity="0.08"/>
  <text x="724.375" y="130.625" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">gcc -g -O0 -o prog prog.c</text>
  <rect x="715" y="143.3125" width="204.375" height="23.5625" rx="6" fill="var(--primary-accent)" opacity="0.08"/>
  <text x="724.375" y="158.7188" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">gdb ./prog</text>
  <!-- speed -->
  <text x="1113.4375" y="146.9375" font-family="sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Native</text>

  <!-- ROW divider -->
  <line x1="68.125" y1="180.4688" x2="1211.875" y2="180.4688" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 2: Valgrind -->
  <!-- ============================================================ -->
  <rect x="68.125" y="180.4688" width="1143.75" height="75.2188" fill="var(--surface)" rx="6"/>
  <rect x="86.875" y="190.4375" width="93.75" height="30.8125" rx="6" fill="var(--info-accent)" filter="url(#shadow)"/>
  <text x="133.75" y="210.375" font-family="monospace" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">Valgrind</text>
  <text x="204.0625" y="210.375" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)">Memory</text>
  <text x="204.0625" y="224.875" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)">checker</text>

  <text x="307.1875" y="204.0312" font-family="sans-serif" font-size="11.9827" fill="var(--text)">Memory leaks, invalid reads/writes, use-after-free</text>
  <text x="307.1875" y="220.3438" font-family="sans-serif" font-size="11.9827" fill="var(--text)">Uninit value use, double free, overlapping memcpy</text>
  <text x="307.1875" y="236.6562" font-family="sans-serif" font-size="11.0609" fill="var(--text-faint)">No recompilation needed  |  Helgrind: data races</text>

  <rect x="715" y="190.4375" width="292.5" height="23.5625" rx="6" fill="var(--info-accent)" opacity="0.08"/>
  <text x="724.375" y="205.8438" font-family="monospace" font-size="11.0609" fill="var(--info-accent)">valgrind --leak-check=full ./prog</text>
  <rect x="715" y="218.5312" width="290.625" height="23.5625" rx="6" fill="var(--info-accent)" opacity="0.08"/>
  <text x="724.375" y="233.9375" font-family="monospace" font-size="11.0609" fill="var(--info-accent)">valgrind --tool=helgrind ./prog</text>
  <text x="1113.4375" y="225.7812" font-family="sans-serif" font-size="11.9827" fill="var(--danger-accent)" text-anchor="middle" font-weight="bold">~10-20x slower</text>

  <line x1="68.125" y1="255.6875" x2="1211.875" y2="255.6875" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 3: ASan -->
  <!-- ============================================================ -->
  <rect x="68.125" y="255.6875" width="1143.75" height="75.2188" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="86.875" y="265.6562" width="93.75" height="30.8125" rx="6" fill="var(--ok-accent)" filter="url(#shadow)"/>
  <text x="133.75" y="285.5938" font-family="monospace" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">ASan</text>
  <text x="204.0625" y="285.5938" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)">Address</text>
  <text x="204.0625" y="300.0938" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)">Sanitizer</text>

  <text x="307.1875" y="279.25" font-family="sans-serif" font-size="11.9827" fill="var(--text)">Heap/stack buffer overflows, use-after-free</text>
  <text x="307.1875" y="295.5625" font-family="sans-serif" font-size="11.9827" fill="var(--text)">Use-after-return, use-after-scope, global overflows</text>
  <text x="307.1875" y="311.875" font-family="sans-serif" font-size="11.0609" fill="var(--text-faint)">Requires recompilation  |  Cannot combine with TSan</text>

  <rect x="715" y="265.6562" width="292.5" height="23.5625" rx="6" fill="var(--ok-accent)" opacity="0.08"/>
  <text x="724.375" y="281.0625" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">gcc -fsanitize=address \</text>
  <rect x="715" y="292.8438" width="292.5" height="23.5625" rx="6" fill="var(--ok-accent)" opacity="0.08"/>
  <text x="724.375" y="308.25" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)">    -fno-omit-frame-pointer ./prog</text>
  <text x="1113.4375" y="301" font-family="sans-serif" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">~2x slower</text>

  <line x1="68.125" y1="330.9062" x2="1211.875" y2="330.9062" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 4: UBSan -->
  <!-- ============================================================ -->
  <rect x="68.125" y="330.9062" width="1143.75" height="75.2188" fill="var(--surface)" rx="6"/>
  <rect x="86.875" y="340.875" width="93.75" height="30.8125" rx="6" fill="var(--warn-accent)" filter="url(#shadow)"/>
  <text x="133.75" y="360.8125" font-family="monospace" font-size="12.9044" font-weight="bold" fill="var(--bg)" text-anchor="middle">UBSan</text>
  <text x="204.0625" y="360.8125" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)">Undefined</text>
  <text x="204.0625" y="375.3125" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)">Behavior</text>

  <text x="307.1875" y="354.4688" font-family="sans-serif" font-size="11.9827" fill="var(--text)">Signed integer overflow, shift overflow, div-by-zero</text>
  <text x="307.1875" y="370.7812" font-family="sans-serif" font-size="11.9827" fill="var(--text)">NULL dereference, type-punning violations</text>
  <text x="307.1875" y="387.0938" font-family="sans-serif" font-size="11.0609" fill="var(--text-faint)">Combine with ASan for maximum coverage</text>

  <rect x="715" y="340.875" width="292.5" height="23.5625" rx="6" fill="var(--danger-accent)" opacity="0.08"/>
  <text x="724.375" y="356.2812" font-family="monospace" font-size="11.0609" fill="var(--danger-accent)">gcc -fsanitize=undefined \</text>
  <rect x="715" y="368.0625" width="292.5" height="23.5625" rx="6" fill="var(--danger-accent)" opacity="0.08"/>
  <text x="724.375" y="383.4688" font-family="monospace" font-size="11.0609" fill="var(--danger-accent)">    -fsanitize=address ./prog</text>
  <text x="1113.4375" y="376.2188" font-family="sans-serif" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle" font-weight="bold">~2x slower</text>

  <line x1="68.125" y1="406.125" x2="1211.875" y2="406.125" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 5: perf -->
  <!-- ============================================================ -->
  <rect x="68.125" y="406.125" width="1143.75" height="75.2188" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="86.875" y="416.0938" width="93.75" height="30.8125" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="133.75" y="436.0312" font-family="monospace" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">perf</text>
  <text x="204.0625" y="436.0312" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)">CPU</text>
  <text x="204.0625" y="450.5312" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)">profiler</text>

  <text x="307.1875" y="429.6875" font-family="sans-serif" font-size="11.9827" fill="var(--text)">CPU hotspots, cache misses, branch mispredictions</text>
  <text x="307.1875" y="446" font-family="sans-serif" font-size="11.9827" fill="var(--text)">IPC (instructions/cycle), page faults, context switches</text>
  <text x="307.1875" y="462.3125" font-family="sans-serif" font-size="11.0609" fill="var(--text-faint)">Flamegraph generation  |  Linux kernel profiling</text>

  <rect x="715" y="416.0938" width="204.375" height="23.5625" rx="6" fill="var(--warn-accent)" opacity="0.08"/>
  <text x="724.375" y="431.5" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)">perf stat ./prog</text>
  <rect x="715" y="445.0938" width="204.375" height="23.5625" rx="6" fill="var(--warn-accent)" opacity="0.08"/>
  <text x="724.375" y="460.5" font-family="monospace" font-size="11.9827" fill="var(--warn-accent)">perf record -g ./prog</text>
  <text x="1113.4375" y="451.4375" font-family="sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Near-native</text>

  <line x1="68.125" y1="481.3438" x2="1211.875" y2="481.3438" stroke="var(--border)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- ROW 6: clang-tidy -->
  <!-- ============================================================ -->
  <rect x="68.125" y="481.3438" width="1143.75" height="75.2188" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="86.875" y="491.3125" width="93.75" height="30.8125" rx="6" fill="var(--danger-accent)" filter="url(#shadow)"/>
  <text x="133.75" y="507.625" font-family="monospace" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">clang-tidy</text>
  <text x="204.0625" y="507.625" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)">Static</text>
  <text x="204.0625" y="522.125" font-family="sans-serif" font-size="11.0609" fill="var(--text-muted)">analysis</text>

  <text x="307.1875" y="504.9062" font-family="sans-serif" font-size="11.9827" fill="var(--text)">Code quality, bug-prone patterns, cert compliance</text>
  <text x="307.1875" y="521.2188" font-family="sans-serif" font-size="11.9827" fill="var(--text)">NULL deref, sizeof misuse, unchecked return values</text>
  <text x="307.1875" y="537.5312" font-family="sans-serif" font-size="11.0609" fill="var(--text-faint)">Static — no runtime needed  |  Can auto-fix issues (-fix)</text>

  <rect x="715" y="491.3125" width="292.5" height="23.5625" rx="6" fill="var(--danger-accent)" opacity="0.08"/>
  <text x="724.375" y="506.7188" font-family="monospace" font-size="11.0609" fill="var(--danger-accent)">clang-tidy file.c -- -std=c11</text>
  <rect x="715" y="520.3125" width="292.5" height="23.5625" rx="6" fill="var(--danger-accent)" opacity="0.08"/>
  <text x="724.375" y="535.7188" font-family="monospace" font-size="11.0609" fill="var(--danger-accent)">clang-tidy -checks='bugprone-*' f.c</text>
  <text x="1113.4375" y="526.6562" font-family="sans-serif" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle" font-weight="bold">Compile-time</text>

  <!-- ============================================================ -->
  <!-- FOOTER BAR: recommended workflow -->
  <!-- ============================================================ -->
  <rect x="68.125" y="563.8125" width="1143.75" height="38.0625" rx="6" fill="var(--text-muted)"/>
  <rect x="68.125" y="574.6875" width="1143.75" height="27.1875" fill="var(--text-muted)" rx="6"/>
  <rect x="68.125" y="563.8125" width="1143.75" height="38.0625" rx="6" fill="var(--text-muted)"/>
  <text x="640" y="575.5938" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)" text-anchor="middle">Recommended workflow:</text>
  <text x="640" y="592.8125" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">Warnings → clang-tidy → ASan+UBSan → Valgrind → GDB (on crash) → perf (on slowness)</text>

  <!-- Column dividers (full height) -->
  <line x1="293.125" y1="105.25" x2="293.125" y2="563.8125" stroke="var(--border)" stroke-width="1"/>
  <line x1="705.625" y1="105.25" x2="705.625" y2="563.8125" stroke="var(--border)" stroke-width="1"/>
  <line x1="1015" y1="105.25" x2="1015" y2="563.8125" stroke="var(--border)" stroke-width="1"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- 6 tool cards 3x2 -->
  <rect x="40" y="40" width="386.440677966102" height="172.982456140351" rx="8.137971701086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.338983050847" y="75.614035087719" font-family="Courier New, monospace" font-size="20.344929252714" font-weight="bold" fill="var(--primary-text)">GDB</text>
  <text x="60.338983050847" y="106.140350877193" font-family="Arial, sans-serif" font-size="14.2414504769" fill="var(--primary-text)">Interactive debugger</text>
  <text x="60.338983050847" y="136.666666666667" font-family="Arial, sans-serif" font-size="13.224204014264" fill="var(--primary-text)">Breakpoints, stack traces</text>
  <text x="60.338983050847" y="167.19298245614" font-family="Courier New, monospace" font-size="13.224204014264" fill="var(--primary-text)">gcc -g -O0</text>
  <text x="60.338983050847" y="192.631578947368" font-family="Arial, sans-serif" font-size="12.206957551629" font-weight="bold" fill="var(--primary-text)">Native speed</text>

  <rect x="446.779661016949" y="40" width="386.440677966102" height="172.982456140351" rx="8.137971701086" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="467.118644067797" y="75.614035087719" font-family="Courier New, monospace" font-size="20.344929252714" font-weight="bold" fill="var(--info-text)">Valgrind</text>
  <text x="467.118644067797" y="106.140350877193" font-family="Arial, sans-serif" font-size="14.2414504769" fill="var(--info-text)">Memory checker</text>
  <text x="467.118644067797" y="136.666666666667" font-family="Arial, sans-serif" font-size="13.224204014264" fill="var(--info-text)">Leaks, use-after-free</text>
  <text x="467.118644067797" y="167.19298245614" font-family="Courier New, monospace" font-size="13.224204014264" fill="var(--info-text)">valgrind --leak-check</text>
  <text x="467.118644067797" y="192.631578947368" font-family="Arial, sans-serif" font-size="12.206957551629" font-weight="bold" fill="var(--info-text)">10-20x slower</text>

  <rect x="853.559322033898" y="40" width="386.440677966102" height="172.982456140351" rx="8.137971701086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="873.898305084746" y="75.614035087719" font-family="Courier New, monospace" font-size="20.344929252714" font-weight="bold" fill="var(--ok-text)">ASan</text>
  <text x="873.898305084746" y="106.140350877193" font-family="Arial, sans-serif" font-size="14.2414504769" fill="var(--ok-text)">Address sanitizer</text>
  <text x="873.898305084746" y="136.666666666667" font-family="Arial, sans-serif" font-size="13.224204014264" fill="var(--ok-text)">Buffer overflows</text>
  <text x="873.898305084746" y="167.19298245614" font-family="Courier New, monospace" font-size="13.224204014264" fill="var(--ok-text)">-fsanitize=address</text>
  <text x="873.898305084746" y="192.631578947368" font-family="Arial, sans-serif" font-size="12.206957551629" font-weight="bold" fill="var(--ok-text)">2x slower</text>

  <rect x="40" y="243.508771929825" width="386.440677966102" height="172.982456140351" rx="8.137971701086" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.338983050847" y="279.122807017544" font-family="Courier New, monospace" font-size="20.344929252714" font-weight="bold" fill="var(--warn-text)">UBSan</text>
  <text x="60.338983050847" y="309.649122807018" font-family="Arial, sans-serif" font-size="14.2414504769" fill="var(--warn-text)">Undefined behavior</text>
  <text x="60.338983050847" y="340.175438596491" font-family="Arial, sans-serif" font-size="13.224204014264" fill="var(--warn-text)">Overflow, div/0</text>
  <text x="60.338983050847" y="370.701754385965" font-family="Courier New, monospace" font-size="13.224204014264" fill="var(--warn-text)">-fsanitize=undefined</text>
  <text x="60.338983050847" y="396.140350877193" font-family="Arial, sans-serif" font-size="12.206957551629" font-weight="bold" fill="var(--warn-text)">2x slower</text>

  <rect x="446.779661016949" y="243.508771929825" width="386.440677966102" height="172.982456140351" rx="8.137971701086" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="467.118644067797" y="279.122807017544" font-family="Courier New, monospace" font-size="20.344929252714" font-weight="bold" fill="var(--danger-text)">perf</text>
  <text x="467.118644067797" y="309.649122807018" font-family="Arial, sans-serif" font-size="14.2414504769" fill="var(--danger-text)">CPU profiler</text>
  <text x="467.118644067797" y="340.175438596491" font-family="Arial, sans-serif" font-size="13.224204014264" fill="var(--danger-text)">Hotspots, cache misses</text>
  <text x="467.118644067797" y="370.701754385965" font-family="Courier New, monospace" font-size="13.224204014264" fill="var(--danger-text)">perf record -g</text>
  <text x="467.118644067797" y="396.140350877193" font-family="Arial, sans-serif" font-size="12.206957551629" font-weight="bold" fill="var(--danger-text)">Near-native</text>

  <rect x="853.559322033898" y="243.508771929825" width="386.440677966102" height="172.982456140351" rx="8.137971701086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="873.898305084746" y="279.122807017544" font-family="Courier New, monospace" font-size="20.344929252714" font-weight="bold" fill="var(--primary-text)">clang-tidy</text>
  <text x="873.898305084746" y="309.649122807018" font-family="Arial, sans-serif" font-size="14.2414504769" fill="var(--primary-text)">Static analysis</text>
  <text x="873.898305084746" y="340.175438596491" font-family="Arial, sans-serif" font-size="13.224204014264" fill="var(--primary-text)">Bug patterns</text>
  <text x="873.898305084746" y="370.701754385965" font-family="Courier New, monospace" font-size="13.224204014264" fill="var(--primary-text)">clang-tidy file.c</text>
  <text x="873.898305084746" y="396.140350877193" font-family="Arial, sans-serif" font-size="12.206957551629" font-weight="bold" fill="var(--primary-text)">Compile-time</text>

  <!-- Workflow bar -->
  <rect x="40" y="457.19298245614" width="1200" height="162.80701754386" rx="8.137971701086" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="497.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.310436327443" font-weight="bold" fill="var(--primary-accent)">Workflow</text>
  <text x="640" y="538.59649122807" text-anchor="middle" font-family="Courier New, monospace" font-size="14.2414504769" fill="var(--text-muted)">clang-tidy to ASan+UBSan to Valgrind</text>
  <text x="640" y="569.122807017544" text-anchor="middle" font-family="Courier New, monospace" font-size="14.2414504769" fill="var(--text-muted)">GDB on crash  perf on slowness</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="40" y="60.714272" font-size="24.424749" font-weight="bold" fill="var(--text)" font-family="sans-serif">Big-Endian (network byte order)</text>
  <text x="40" y="133.214288" font-size="22.389412" fill="var(--text-muted)">uint32_t val = 0x12345678</text>
  <text x="40" y="226.428576" font-size="20.354075" fill="var(--text-faint)">Address:  0x00  0x01  0x02  0x03</text>
  <rect x="40" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="156" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="272" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="388" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="96" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle">0x12</text>
  <text x="212" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle">0x34</text>
  <text x="328" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle">0x56</text>
  <text x="444" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle">0x78</text>
  <text x="40" y="433.571424" font-size="22.389412" fill="var(--text-muted)" font-family="sans-serif">MSB first (most significant byte at lowest address)</text>
  <text x="680" y="60.714272" font-size="24.424749" font-weight="bold" fill="var(--text)" font-family="sans-serif">Little-Endian (x86)</text>
  <text x="680" y="133.214288" font-size="22.389412" fill="var(--text-muted)">uint32_t val = 0x12345678</text>
  <text x="680" y="226.428576" font-size="20.354075" fill="var(--text-faint)">Address:  0x00  0x01  0x02  0x03</text>
  <rect x="680" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="796" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="912" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="1028" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="735.999893" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle">0x78</text>
  <text x="852" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle">0x56</text>
  <text x="968" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle">0x34</text>
  <text x="1084" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle">0x12</text>
  <text x="680" y="433.571424" font-size="22.389412" fill="var(--text-muted)" font-family="sans-serif">LSB first (least significant byte at lowest address)</text>
  <line x1="660" y1="40" x2="660" y2="620" stroke="var(--border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" />
  <rect x="80" y="506.07144" width="1160" height="82.857088" rx="7.026481" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="555.78577" text-anchor="middle" font-size="18.31862" fill="var(--text-muted)">Use htonl() / ntohl() when sending multi-byte values over a network</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="60.714272" font-size="24.424749" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Big-Endian (network byte order)</text>
  <text x="40" y="133.214288" font-size="22.389412" fill="var(--text-muted)" font-family="Arial, sans-serif">uint32_t val = 0x12345678</text>
  <text x="40" y="226.428576" font-size="20.354075" fill="var(--text-faint)" font-family="Arial, sans-serif">Address:  0x00  0x01  0x02  0x03</text>
  <rect x="40" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="156" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="272" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="388" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="96" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">0x12</text>
  <text x="212" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">0x34</text>
  <text x="328" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">0x56</text>
  <text x="444" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">0x78</text>
  <text x="40" y="433.571424" font-size="22.389412" fill="var(--text-muted)" font-family="Arial, sans-serif">MSB first (most significant byte at lowest address)</text>
  <text x="680" y="60.714272" font-size="24.424749" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Little-Endian (x86)</text>
  <text x="680" y="133.214288" font-size="22.389412" fill="var(--text-muted)" font-family="Arial, sans-serif">uint32_t val = 0x12345678</text>
  <text x="680" y="226.428576" font-size="20.354075" fill="var(--text-faint)" font-family="Arial, sans-serif">Address:  0x00  0x01  0x02  0x03</text>
  <rect x="680" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="796" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="912" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1028" y="247.142848" width="112" height="134.64296" rx="7.026481" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="735.999893" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">0x78</text>
  <text x="852" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">0x56</text>
  <text x="968" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">0x34</text>
  <text x="1084" y="327.928521" font-size="24.424749" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">0x12</text>
  <text x="680" y="433.571424" font-size="22.389412" fill="var(--text-muted)" font-family="Arial, sans-serif">LSB first (least significant byte at lowest address)</text>
  <line x1="660" y1="40" x2="660" y2="620" stroke="var(--border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556"/>
  <rect x="80" y="506.07144" width="1160" height="82.857088" rx="7.026481" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="555.78577" text-anchor="middle" font-size="18.31862" fill="var(--text-muted)" font-family="Arial, sans-serif">Use htonl() / ntohl() when sending multi-byte values over a network</text>
</svg>

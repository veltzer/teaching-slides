  <ns0:text x="17.7778" y="133.3333" font-size="19.5556" fill="#555555">uint32_t val = 0x12345678</ns0:text>
  <ns0:text x="17.7778" y="213.3333" font-size="17.7778" fill="#888888">Address:  0x00  0x01  0x02  0x03</ns0:text>

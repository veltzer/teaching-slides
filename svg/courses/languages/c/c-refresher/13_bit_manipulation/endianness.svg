  <ns0:text x="17.7778" y="391.1111" font-size="19.5556" fill="#555555" font-family="sans-serif">MSB first (most significant byte at lowest address)</ns0:text>
  <ns0:text x="586.6667" y="71.1111" font-size="21.3333" font-weight="bold" fill="#222222" font-family="sans-serif">Little-Endian (x86)</ns0:text>
  <ns0:text x="586.6667" y="133.3333" font-size="19.5556" fill="#555555">uint32_t val = 0x12345678</ns0:text>

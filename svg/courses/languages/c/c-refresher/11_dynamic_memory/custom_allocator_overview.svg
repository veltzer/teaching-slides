<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="281.318680952918" height="74.358923285128" rx="8.057275899151" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.659340476459" y="85.854768532935" text-anchor="middle" font-size="23.340048136508" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Strategy</text>
  <rect x="330.109890728575" y="40" width="909.890109271425" height="74.358923285128" rx="8.057275899151" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785.054945364288" y="85.854768532935" text-anchor="middle" font-size="23.340048136508" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Description</text>
  <rect x="40" y="124.273692643332" width="281.318680952918" height="74.358923285128" rx="8.057275899151" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.659340476459" y="170.12815356948" text-anchor="middle" font-size="22.172952283138" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bump / Arena</text>
  <rect x="330.109890728575" y="124.273692643332" width="909.890109271425" height="74.358923285128" rx="8.057275899151" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="367.472527229334" y="170.12815356948" font-size="22.172952283138" fill="var(--text)" font-family="Arial, sans-serif">Linear allocation, bulk free</text>
  <rect x="40" y="208.547076419194" width="281.318680952918" height="74.358923285128" rx="8.057275899151" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.659340476459" y="254.401846212813" text-anchor="middle" font-size="22.172952283138" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pool</text>
  <rect x="330.109890728575" y="208.547076419194" width="909.890109271425" height="74.358923285128" rx="8.057275899151" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="367.472527229334" y="254.401846212813" font-size="22.172952283138" fill="var(--text)" font-family="Arial, sans-serif">Fixed-size blocks, O(1) alloc/free</text>
  <rect x="40" y="292.820461455739" width="281.318680952918" height="74.358923285128" rx="8.057275899151" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.659340476459" y="338.675229988674" text-anchor="middle" font-size="22.172952283138" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Free List</text>
  <rect x="330.109890728575" y="292.820461455739" width="909.890109271425" height="74.358923285128" rx="8.057275899151" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="367.472527229334" y="338.675229988674" font-size="22.172952283138" fill="var(--text)" font-family="Arial, sans-serif">Variable size, linked free blocks</text>
  <rect x="40" y="377.094154099072" width="281.318680952918" height="74.358923285128" rx="8.057275899151" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.659340476459" y="422.948768828613" text-anchor="middle" font-size="22.172952283138" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Slab</text>
  <rect x="330.109890728575" y="377.094154099072" width="909.890109271425" height="74.358923285128" rx="8.057275899151" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="367.472527229334" y="422.948768828613" font-size="22.172952283138" fill="var(--text)" font-family="Arial, sans-serif">Caches of same-type objects</text>
  <rect x="40" y="461.367537874933" width="281.318680952918" height="74.358923285128" rx="8.057275899151" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.659340476459" y="507.222307668552" text-anchor="middle" font-size="22.172952283138" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Buddy</text>
  <rect x="330.109890728575" y="461.367537874933" width="909.890109271425" height="74.358923285128" rx="8.057275899151" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="367.472527229334" y="507.222307668552" font-size="22.172952283138" fill="var(--text)" font-family="Arial, sans-serif">Power-of-2 splitting / coalescing</text>
  <rect x="40" y="545.641076714872" width="281.318680952918" height="74.358923285128" rx="8.057275899151" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.659340476459" y="591.495846508491" text-anchor="middle" font-size="22.172952283138" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">jemalloc</text>
  <rect x="330.109890728575" y="545.641076714872" width="909.890109271425" height="74.358923285128" rx="8.057275899151" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="367.472527229334" y="591.495846508491" font-size="22.172952283138" fill="var(--text)" font-family="Arial, sans-serif">Thread-local caches, size classes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 340" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Custom Allocator Strategies</text>
  <rect x="30" y="40" width="590" height="280" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <!-- Header -->
  <rect x="50" y="55" width="130" height="30" rx="3" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="115" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Strategy</text>
  <rect x="180" y="55" width="420" height="30" rx="3" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="390" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Description</text>
  <!-- Rows -->
  <rect x="50" y="90" width="130" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="115" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Bump/Arena</text>
  <rect x="180" y="90" width="420" height="30" rx="3" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="200" y="110" font-size="11" fill="#333">Linear allocation, bulk free</text>
  <rect x="50" y="125" width="130" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="115" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Pool</text>
  <rect x="180" y="125" width="420" height="30" rx="3" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="200" y="145" font-size="11" fill="#333">Fixed-size blocks, O(1) alloc/free</text>
  <rect x="50" y="160" width="130" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="115" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Free List</text>
  <rect x="180" y="160" width="420" height="30" rx="3" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="200" y="180" font-size="11" fill="#333">Variable size, linked free blocks</text>
  <rect x="50" y="195" width="130" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="115" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Slab</text>
  <rect x="180" y="195" width="420" height="30" rx="3" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="200" y="215" font-size="11" fill="#333">Caches of same-type objects</text>
  <rect x="50" y="230" width="130" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="115" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Buddy</text>
  <rect x="180" y="230" width="420" height="30" rx="3" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="200" y="250" font-size="11" fill="#333">Power-of-2 splitting/coalescing</text>
  <rect x="50" y="265" width="130" height="30" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="115" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">jemalloc</text>
  <rect x="180" y="265" width="420" height="30" rx="3" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="200" y="285" font-size="11" fill="#333">Thread-local caches, size classes</text>
</svg>
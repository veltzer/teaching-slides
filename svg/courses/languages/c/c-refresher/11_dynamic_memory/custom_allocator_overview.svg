<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <rect x="60" y="50" width="1160" height="590" rx="9" fill="#f8f9fa" stroke="#cccccc" stroke-width="2"/>

  <!-- Header row -->
  <rect x="100" y="80" width="256" height="60" rx="5" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="228" y="117" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Strategy</text>
  <rect x="364" y="80" width="828" height="60" rx="5" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="778" y="117" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Description</text>

  <!-- Bump/Arena -->
  <rect x="100" y="148" width="256" height="60" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="228" y="185" text-anchor="middle" font-size="19" font-weight="bold" fill="#222222">Bump / Arena</text>
  <rect x="364" y="148" width="828" height="60" rx="5" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="398" y="185" font-size="19" fill="#333333">Linear allocation, bulk free</text>

  <!-- Pool -->
  <rect x="100" y="216" width="256" height="60" rx="5" fill="#e8f5e9" stroke="#1565c0" stroke-width="2"/>
  <text x="228" y="253" text-anchor="middle" font-size="19" font-weight="bold" fill="#222222">Pool</text>
  <rect x="364" y="216" width="828" height="60" rx="5" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="398" y="253" font-size="19" fill="#333333">Fixed-size blocks, O(1) alloc/free</text>

  <!-- Free List -->
  <rect x="100" y="284" width="256" height="60" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="228" y="321" text-anchor="middle" font-size="19" font-weight="bold" fill="#222222">Free List</text>
  <rect x="364" y="284" width="828" height="60" rx="5" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="398" y="321" font-size="19" fill="#333333">Variable size, linked free blocks</text>

  <!-- Slab -->
  <rect x="100" y="352" width="256" height="60" rx="5" fill="#e8f5e9" stroke="#1565c0" stroke-width="2"/>
  <text x="228" y="389" text-anchor="middle" font-size="19" font-weight="bold" fill="#222222">Slab</text>
  <rect x="364" y="352" width="828" height="60" rx="5" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="398" y="389" font-size="19" fill="#333333">Caches of same-type objects</text>

  <!-- Buddy -->
  <rect x="100" y="420" width="256" height="60" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="228" y="457" text-anchor="middle" font-size="19" font-weight="bold" fill="#222222">Buddy</text>
  <rect x="364" y="420" width="828" height="60" rx="5" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="398" y="457" font-size="19" fill="#333333">Power-of-2 splitting / coalescing</text>

  <!-- jemalloc -->
  <rect x="100" y="488" width="256" height="60" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="228" y="525" text-anchor="middle" font-size="19" font-weight="bold" fill="#222222">jemalloc</text>
  <rect x="364" y="488" width="828" height="60" rx="5" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>
  <text x="398" y="525" font-size="19" fill="#333333">Thread-local caches, size classes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="81.37931" y="69.491571" width="264.827586" height="58.98302" rx="6.962537" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="213.793103" y="105.864512" text-anchor="middle" font-size="20.168845" font-weight="bold" fill="var(--bg)">Strategy</text>
  <rect x="354.482759" y="69.491571" width="856.551724" height="58.98302" rx="6.962537" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="782.758621" y="105.864512" text-anchor="middle" font-size="20.168845" font-weight="bold" fill="var(--bg)">Description</text>
  <rect x="81.37931" y="136.339189" width="264.827586" height="58.98302" rx="6.962537" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="213.793103" y="172.711886" text-anchor="middle" font-size="19.160322" font-weight="bold" fill="var(--text)">Bump / Arena</text>
  <rect x="354.482759" y="136.339189" width="856.551724" height="58.98302" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.655172" y="172.711886" font-size="19.160322" fill="var(--text)">Linear allocation, bulk free</text>
  <rect x="81.37931" y="203.186562" width="264.827586" height="58.98302" rx="6.962537" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="213.793103" y="239.559504" text-anchor="middle" font-size="19.160322" font-weight="bold" fill="var(--text)">Pool</text>
  <rect x="354.482759" y="203.186562" width="856.551724" height="58.98302" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.655172" y="239.559504" font-size="19.160322" fill="var(--text)">Fixed-size blocks, O(1) alloc/free</text>
  <rect x="81.37931" y="270.033936" width="264.827586" height="58.98302" rx="6.962537" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="213.793103" y="306.406877" text-anchor="middle" font-size="19.160322" font-weight="bold" fill="var(--text)">Free List</text>
  <rect x="354.482759" y="270.033936" width="856.551724" height="58.98302" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.655172" y="306.406877" font-size="19.160322" fill="var(--text)">Variable size, linked free blocks</text>
  <rect x="81.37931" y="336.881554" width="264.827586" height="58.98302" rx="6.962537" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="213.793103" y="373.254373" text-anchor="middle" font-size="19.160322" font-weight="bold" fill="var(--text)">Slab</text>
  <rect x="354.482759" y="336.881554" width="856.551724" height="58.98302" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.655172" y="373.254373" font-size="19.160322" fill="var(--text)">Caches of same-type objects</text>
  <rect x="81.37931" y="403.728927" width="264.827586" height="58.98302" rx="6.962537" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="213.793103" y="440.101869" text-anchor="middle" font-size="19.160322" font-weight="bold" fill="var(--text)">Buddy</text>
  <rect x="354.482759" y="403.728927" width="856.551724" height="58.98302" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.655172" y="440.101869" font-size="19.160322" fill="var(--text)">Power-of-2 splitting / coalescing</text>
  <rect x="81.37931" y="470.576423" width="264.827586" height="58.98302" rx="6.962537" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="213.793103" y="506.949365" text-anchor="middle" font-size="19.160322" font-weight="bold" fill="var(--text)">jemalloc</text>
  <rect x="354.482759" y="470.576423" width="856.551724" height="58.98302" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.655172" y="506.949365" font-size="19.160322" fill="var(--text)">Thread-local caches, size classes</text>
</svg>
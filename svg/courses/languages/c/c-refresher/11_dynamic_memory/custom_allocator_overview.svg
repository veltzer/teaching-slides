<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="81.37931" y="69.491571" width="264.827586" height="58.98302" rx="6.962537" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="213.793103" y="105.864512" text-anchor="middle" font-size="20.168845" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Strategy</text>
  <rect x="354.482759" y="69.491571" width="856.551724" height="58.98302" rx="6.962537" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="782.758621" y="105.864512" text-anchor="middle" font-size="20.168845" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Description</text>
  <rect x="81.37931" y="136.339189" width="264.827586" height="58.98302" rx="6.962537" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="213.793103" y="172.711886" text-anchor="middle" font-size="19.160322" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bump / Arena</text>
  <rect x="354.482759" y="136.339189" width="856.551724" height="58.98302" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.655172" y="172.711886" font-size="19.160322" fill="var(--text)" font-family="Arial, sans-serif">Linear allocation, bulk free</text>
  <rect x="81.37931" y="203.186562" width="264.827586" height="58.98302" rx="6.962537" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="213.793103" y="239.559504" text-anchor="middle" font-size="19.160322" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pool</text>
  <rect x="354.482759" y="203.186562" width="856.551724" height="58.98302" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.655172" y="239.559504" font-size="19.160322" fill="var(--text)" font-family="Arial, sans-serif">Fixed-size blocks, O(1) alloc/free</text>
  <rect x="81.37931" y="270.033936" width="264.827586" height="58.98302" rx="6.962537" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="213.793103" y="306.406877" text-anchor="middle" font-size="19.160322" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Free List</text>
  <rect x="354.482759" y="270.033936" width="856.551724" height="58.98302" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.655172" y="306.406877" font-size="19.160322" fill="var(--text)" font-family="Arial, sans-serif">Variable size, linked free blocks</text>
  <rect x="81.37931" y="336.881554" width="264.827586" height="58.98302" rx="6.962537" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="213.793103" y="373.254373" text-anchor="middle" font-size="19.160322" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Slab</text>
  <rect x="354.482759" y="336.881554" width="856.551724" height="58.98302" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.655172" y="373.254373" font-size="19.160322" fill="var(--text)" font-family="Arial, sans-serif">Caches of same-type objects</text>
  <rect x="81.37931" y="403.728927" width="264.827586" height="58.98302" rx="6.962537" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="213.793103" y="440.101869" text-anchor="middle" font-size="19.160322" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Buddy</text>
  <rect x="354.482759" y="403.728927" width="856.551724" height="58.98302" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.655172" y="440.101869" font-size="19.160322" fill="var(--text)" font-family="Arial, sans-serif">Power-of-2 splitting / coalescing</text>
  <rect x="81.37931" y="470.576423" width="264.827586" height="58.98302" rx="6.962537" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="213.793103" y="506.949365" text-anchor="middle" font-size="19.160322" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">jemalloc</text>
  <rect x="354.482759" y="470.576423" width="856.551724" height="58.98302" rx="6.962537" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="389.655172" y="506.949365" font-size="19.160322" fill="var(--text)" font-family="Arial, sans-serif">Thread-local caches, size classes</text>
</svg>
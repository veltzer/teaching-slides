<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Before box -->
  <rect x="60" y="60" width="530" height="250" rx="8" fill="#e8f5e9" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="325" y="98" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Before free(p):</text>
  <rect x="100" y="115" width="150" height="66" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="175" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">p</text>
  <line x1="250" y1="148" x2="370" y2="148" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <rect x="374" y="115" width="150" height="66" rx="8" fill="#e8f5e9" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="449" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">42</text>
  <text x="540" y="155" font-size="17" fill="#888888">(heap)</text>

  <rect x="100" y="205" width="150" height="66" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="175" y="245" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">alias</text>
  <line x1="250" y1="238" x2="440" y2="190" stroke="#1565c0" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- After box -->
  <rect x="650" y="60" width="570" height="250" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="935" y="98" text-anchor="middle" font-size="22" font-weight="bold" fill="#e53935">After free(p); p = NULL;</text>
  <rect x="690" y="115" width="150" height="66" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">NULL</text>
  <rect x="990" y="115" width="150" height="66" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065" y="155" text-anchor="middle" font-size="20" font-weight="bold" fill="#e53935">???</text>
  <text x="1155" y="155" font-size="17" fill="#888888">(freed)</text>

  <rect x="690" y="205" width="150" height="66" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="3" filter="url(#shadow)"/>
  <text x="765" y="245" text-anchor="middle" font-size="20" font-weight="bold" fill="#f57f17">alias</text>
  <line x1="840" y1="238" x2="1055" y2="190" stroke="#e53935" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="990" y="302" font-size="18" fill="#e53935" font-weight="bold">DANGLING!</text>

  <!-- Why box -->
  <rect x="120" y="360" width="1040" height="250" rx="8" fill="#f5f5f5" stroke="#cccccc" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="402" text-anchor="middle" font-size="22" font-weight="bold" fill="#e53935">Why is this dangerous?</text>
  <text x="160" y="444" font-size="20" fill="#333333">1. alias still points to freed memory (dangling pointer)</text>
  <text x="160" y="484" font-size="20" fill="#333333">2. Using alias leads to undefined behavior</text>
  <text x="160" y="524" font-size="20" fill="#333333">3. Memory may be reused for other allocations</text>
  <text x="160" y="572" font-size="20" fill="#1565c0" font-weight="bold">Fix: Set ALL pointers to NULL after freeing, or use ownership patterns</text>
</svg>

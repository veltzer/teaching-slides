<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Dangling Pointer Problem</text>
  <!-- Before free -->
  <rect x="30" y="40" width="280" height="130" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="170" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Before free(p):</text>
  <rect x="50" y="75" width="80" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">p</text>
  <line x1="130" y1="92" x2="195" y2="92" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="190,87 200,92 190,97" fill="#4a90e2"/>
  <rect x="200" y="75" width="80" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="240" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">42</text>
  <text x="290" y="98" font-size="9" fill="#666">(heap)</text>
  <rect x="50" y="120" width="80" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="90" y="143" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">alias</text>
  <line x1="130" y1="137" x2="235" y2="110" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="4"/>
  <!-- After free -->
  <rect x="340" y="40" width="290" height="130" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="485" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">After free(p); p = NULL;</text>
  <rect x="360" y="75" width="80" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="400" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">NULL</text>
  <rect x="510" y="75" width="80" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="550" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">???</text>
  <text x="600" y="98" font-size="9" fill="#666">(freed)</text>
  <rect x="360" y="120" width="80" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="143" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">alias</text>
  <line x1="440" y1="137" x2="545" y2="110" stroke="#dc3545" stroke-width="2"/>
  <polygon points="540,105 550,110 540,115" fill="#dc3545"/>
  <text x="510" y="148" font-size="10" fill="#dc3545" font-weight="bold">DANGLING!</text>
  <!-- Explanation -->
  <rect x="60" y="195" width="530" height="130" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="325" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Why is this dangerous?</text>
  <text x="80" y="245" font-size="11" fill="#333">1. alias still points to freed memory (dangling pointer)</text>
  <text x="80" y="265" font-size="11" fill="#333">2. Using alias leads to undefined behavior</text>
  <text x="80" y="285" font-size="11" fill="#333">3. Memory may be reused for other allocations</text>
  <text x="80" y="305" font-size="11" fill="#28a745" font-weight="bold">Fix: Set ALL pointers to NULL after freeing, or use ownership patterns</text>
</svg>
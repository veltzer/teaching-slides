<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
    <ns0:marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#e53935" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="53.3333" y="53.3333" width="471.1111" height="222.2222" rx="7.1111" fill="#e8f5e9" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="288.8889" y="87.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#1565c0">Before free(p):</ns0:text>
  <ns0:rect x="88.8889" y="102.2222" width="133.3333" height="58.6667" rx="7.1111" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="155.5556" y="137.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#222222">p</ns0:text>
  <ns0:line x1="222.2222" y1="131.5556" x2="328.8889" y2="131.5556" stroke="#1565c0" stroke-width="2.6667" marker-end="url(#arrow-accent)" />
  <ns0:rect x="332.4444" y="102.2222" width="133.3333" height="58.6667" rx="7.1111" fill="#e8f5e9" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="399.1111" y="137.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#222222">42</ns0:text>
  <ns0:text x="480" y="137.7778" font-size="15.1111" fill="#888888">(heap)</ns0:text>
  <ns0:rect x="88.8889" y="182.2222" width="133.3333" height="58.6667" rx="7.1111" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="155.5556" y="217.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#222222">alias</ns0:text>
  <ns0:line x1="222.2222" y1="211.5556" x2="391.1111" y2="168.8889" stroke="#1565c0" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" />
  <ns0:rect x="577.7778" y="53.3333" width="506.6667" height="222.2222" rx="7.1111" fill="#fce4ec" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="831.1111" y="87.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#e53935">After free(p); p = NULL;</ns0:text>
  <ns0:rect x="613.3333" y="102.2222" width="133.3333" height="58.6667" rx="7.1111" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="680" y="137.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#222222">NULL</ns0:text>
  <ns0:rect x="880" y="102.2222" width="133.3333" height="58.6667" rx="7.1111" fill="#fce4ec" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="946.6667" y="137.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#e53935">???</ns0:text>
  <ns0:text x="1026.6667" y="137.7778" font-size="15.1111" fill="#888888">(freed)</ns0:text>
  <ns0:rect x="613.3333" y="182.2222" width="133.3333" height="58.6667" rx="7.1111" fill="#fff8e1" stroke="#f9a825" stroke-width="2.6667" filter="url(#shadow)" />
  <ns0:text x="680" y="217.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#f57f17">alias</ns0:text>
  <ns0:line x1="746.6667" y1="211.5556" x2="937.7778" y2="168.8889" stroke="#e53935" stroke-width="2.6667" marker-end="url(#arrow-red)" />
  <ns0:text x="880" y="268.4444" font-size="16" fill="#e53935" font-weight="bold">DANGLING!</ns0:text>
  <ns0:rect x="106.6667" y="320" width="924.4444" height="222.2222" rx="7.1111" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="357.3333" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#e53935">Why is this dangerous?</ns0:text>
  <ns0:text x="142.2222" y="394.6667" font-size="17.7778" fill="#333333">1. alias still points to freed memory (dangling pointer)</ns0:text>
  <ns0:text x="142.2222" y="430.2222" font-size="17.7778" fill="#333333">2. Using alias leads to undefined behavior</ns0:text>
  <ns0:text x="142.2222" y="465.7778" font-size="17.7778" fill="#333333">3. Memory may be reused for other allocations</ns0:text>
  <ns0:text x="142.2222" y="508.4444" font-size="17.7778" fill="#1565c0" font-weight="bold">Fix: Set ALL pointers to NULL after freeing, or use ownership patterns</ns0:text>
</ns0:svg>
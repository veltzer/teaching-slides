<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="53.3333" y="53.3333" width="471.1111" height="222.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="288.8889" y="87.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">Before free(p):</text>
  <rect x="88.8889" y="102.2222" width="133.3333" height="58.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="155.5556" y="137.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text)">p</text>
  <line x1="222.2222" y1="131.5556" x2="328.8889" y2="131.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="332.4444" y="102.2222" width="133.3333" height="58.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="399.1111" y="137.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text)">42</text>
  <text x="480" y="137.7778" font-size="15.1111" fill="var(--text-faint)">(heap)</text>
  <rect x="88.8889" y="182.2222" width="133.3333" height="58.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="155.5556" y="217.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text)">alias</text>
  <line x1="222.2222" y1="211.5556" x2="391.1111" y2="168.8889" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" />
  <rect x="577.7778" y="53.3333" width="506.6667" height="222.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="831.1111" y="87.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--danger-accent)">After free(p); p = NULL;</text>
  <rect x="613.3333" y="102.2222" width="133.3333" height="58.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="680" y="137.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text)">NULL</text>
  <rect x="880" y="102.2222" width="133.3333" height="58.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="946.6667" y="137.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--danger-accent)">???</text>
  <text x="1026.6667" y="137.7778" font-size="15.1111" fill="var(--text-faint)">(freed)</text>
  <rect x="613.3333" y="182.2222" width="133.3333" height="58.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="680" y="217.7778" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--warn-accent)">alias</text>
  <line x1="746.6667" y1="211.5556" x2="937.7778" y2="168.8889" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="880" y="268.4444" font-size="16" fill="var(--danger-accent)" font-weight="bold">DANGLING!</text>
  <rect x="106.6667" y="320" width="924.4444" height="222.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="357.3333" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--danger-accent)">Why is this dangerous?</text>
  <text x="142.2222" y="394.6667" font-size="17.7778" fill="var(--text)">1. alias still points to freed memory (dangling pointer)</text>
  <text x="142.2222" y="430.2222" font-size="17.7778" fill="var(--text)">2. Using alias leads to undefined behavior</text>
  <text x="142.2222" y="465.7778" font-size="17.7778" fill="var(--text)">3. Memory may be reused for other allocations</text>
  <text x="142.2222" y="508.4444" font-size="17.7778" fill="var(--primary-accent)" font-weight="bold">Fix: Set ALL pointers to NULL after freeing, or use ownership patterns</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="548.275862" height="263.636352" rx="7.211276" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.137931" y="80.072709" text-anchor="middle" font-size="22.97825" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Before free(p):</text>
  <rect x="81.37931" y="98.000052" width="155.172414" height="69.600037" rx="7.211276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="158.965517" y="140.181837" text-anchor="middle" font-size="20.889384" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">p</text>
  <line x1="236.551724" y1="132.800136" x2="360.689655" y2="132.800136" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="364.827476" y="98.000052" width="155.172414" height="69.600037" rx="7.211276" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="442.413793" y="140.181837" text-anchor="middle" font-size="20.889384" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">42</text>
  <text x="536.551724" y="140.181837" font-size="17.755965" fill="var(--text-faint)" font-family="Arial, sans-serif">(heap)</text>
  <rect x="81.37931" y="192.909134" width="155.172414" height="69.600037" rx="7.211276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="158.965517" y="235.090919" text-anchor="middle" font-size="20.889384" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">alias</text>
  <line x1="236.551724" y1="227.709218" x2="433.103448" y2="177.090997" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" />
  <rect x="650.344828" y="40" width="589.655172" height="263.636352" rx="7.211276" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.172414" y="80.072709" text-anchor="middle" font-size="22.97825" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">After free(p); p = NULL;</text>
  <rect x="691.724138" y="98.000052" width="155.172414" height="69.600037" rx="7.211276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="769.310345" y="140.181837" text-anchor="middle" font-size="20.889384" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">NULL</text>
  <rect x="1002.068966" y="98.000052" width="155.172414" height="69.600037" rx="7.211276" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1079.655172" y="140.181837" text-anchor="middle" font-size="20.889384" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">???</text>
  <text x="1172.758621" y="140.181837" font-size="17.755965" fill="var(--text-faint)" font-family="Arial, sans-serif">(freed)</text>
  <rect x="691.724138" y="192.909134" width="155.172414" height="69.600037" rx="7.211276" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="769.310345" y="235.090919" text-anchor="middle" font-size="20.889384" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">alias</text>
  <line x1="846.896552" y1="227.709218" x2="1069.310345" y2="177.090997" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="1002.068966" y="295.199916" font-size="18.800398" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">DANGLING!</text>
  <rect x="102.068966" y="356.363648" width="1075.861959" height="263.636352" rx="7.211276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="400.654509" text-anchor="middle" font-size="22.97825" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Why is this dangerous?</text>
  <text x="143.448276" y="444.945501" font-size="20.889384" fill="var(--text)" font-family="Arial, sans-serif">1. alias still points to freed memory (dangling pointer)</text>
  <text x="143.448276" y="487.127286" font-size="20.889384" fill="var(--text)" font-family="Arial, sans-serif">2. Using alias leads to undefined behavior</text>
  <text x="143.448276" y="529.309071" font-size="20.889384" fill="var(--text)" font-family="Arial, sans-serif">3. Memory may be reused for other allocations</text>
  <text x="143.448276" y="579.92716" font-size="20.889384" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Fix: Set ALL pointers to NULL after freeing, or use ownership patterns</text>
</svg>
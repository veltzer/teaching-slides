<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Dynamic Memory Lifecycle</text>
  <!-- Step 1: Request -->
  <rect x="30" y="60" width="160" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="110" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1. Request</text>
  <text x="110" y="105" text-anchor="middle" font-size="10" fill="#555">malloc(size)</text>
  <text x="110" y="120" text-anchor="middle" font-size="10" fill="#555">calloc(n, size)</text>
  <line x1="190" y1="95" x2="230" y2="95" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 2: Check -->
  <rect x="240" y="60" width="140" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="310" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2. Check</text>
  <text x="310" y="105" text-anchor="middle" font-size="10" fill="#555">if (ptr == NULL)</text>
  <text x="310" y="120" text-anchor="middle" font-size="10" fill="#dc3545">Handle failure!</text>
  <line x1="380" y1="95" x2="420" y2="95" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 3: Use -->
  <rect x="430" y="60" width="140" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="500" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3. Use</text>
  <text x="500" y="105" text-anchor="middle" font-size="10" fill="#555">Read / Write</text>
  <text x="500" y="120" text-anchor="middle" font-size="10" fill="#555">within bounds</text>
  <line x1="570" y1="95" x2="610" y2="95" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 4: Free -->
  <rect x="620" y="60" width="140" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="690" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">4. Free</text>
  <text x="690" y="105" text-anchor="middle" font-size="10" fill="#555">free(ptr);</text>
  <text x="690" y="120" text-anchor="middle" font-size="10" fill="#555">ptr = NULL;</text>
  <!-- Realloc path -->
  <rect x="430" y="170" width="140" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="500" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Resize?</text>
  <text x="500" y="210" text-anchor="middle" font-size="10" fill="#555">realloc(ptr, new)</text>
  <line x1="500" y1="130" x2="500" y2="170" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="195" x2="380" y2="95" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="155" font-size="9" fill="#ffc107">back to check</text>
  <!-- Memory allocator internals -->
  <rect x="30" y="260" width="730" height="170" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="395" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Under the Hood: Memory Allocator</text>
  <!-- User call -->
  <rect x="50" y="300" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="115" y="325" text-anchor="middle" font-size="11" fill="#333">malloc(64)</text>
  <line x1="180" y1="320" x2="210" y2="320" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Allocator -->
  <rect x="220" y="300" width="170" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="305" y="318" text-anchor="middle" font-size="11" fill="#333">glibc allocator</text>
  <text x="305" y="332" text-anchor="middle" font-size="9" fill="#555">(ptmalloc2 / bins)</text>
  <line x1="390" y1="320" x2="420" y2="320" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- sbrk/mmap -->
  <rect x="430" y="300" width="150" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="505" y="318" text-anchor="middle" font-size="11" fill="#333">sbrk() / mmap()</text>
  <text x="505" y="332" text-anchor="middle" font-size="9" fill="#555">system calls</text>
  <line x1="580" y1="320" x2="610" y2="320" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Kernel -->
  <rect x="620" y="300" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="680" y="325" text-anchor="middle" font-size="11" fill="#333">Kernel (VM)</text>
  <text x="395" y="380" text-anchor="middle" font-size="11" fill="#555">Small allocations (&lt;128KB): sbrk() grows heap | Large allocations: mmap() creates new mapping</text>
  <text x="395" y="400" text-anchor="middle" font-size="11" fill="#555">Metadata stored before each allocation (chunk header: size + flags)</text>
</svg>
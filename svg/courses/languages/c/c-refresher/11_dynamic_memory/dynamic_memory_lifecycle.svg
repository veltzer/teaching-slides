<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="11.2" refX="16" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="11.2" refX="16" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Dynamic Memory Lifecycle</text>
  <rect x="48" y="96" width="256" height="112" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="176" y="136" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">1. Request</text>
  <text x="176" y="168" text-anchor="middle" font-size="16" fill="#555">malloc(size)</text>
  <text x="176" y="192" text-anchor="middle" font-size="16" fill="#555">calloc(n, size)</text>
  <line x1="304" y1="152" x2="368" y2="152" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="384" y="96" width="224" height="112" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="496" y="136" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">2. Check</text>
  <text x="496" y="168" text-anchor="middle" font-size="16" fill="#555">if (ptr == NULL)</text>
  <text x="496" y="192" text-anchor="middle" font-size="16" fill="#dc3545">Handle failure!</text>
  <line x1="608" y1="152" x2="672" y2="152" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="688" y="96" width="224" height="112" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="800" y="136" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">3. Use</text>
  <text x="800" y="168" text-anchor="middle" font-size="16" fill="#555">Read / Write</text>
  <text x="800" y="192" text-anchor="middle" font-size="16" fill="#555">within bounds</text>
  <line x1="912" y1="152" x2="976" y2="152" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="992" y="96" width="224" height="112" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="1104" y="136" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">4. Free</text>
  <text x="1104" y="168" text-anchor="middle" font-size="16" fill="#555">free(ptr);</text>
  <text x="1104" y="192" text-anchor="middle" font-size="16" fill="#555">ptr = NULL;</text>
  <rect x="688" y="272" width="224" height="80" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="800" y="307.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Resize?</text>
  <text x="800" y="336" text-anchor="middle" font-size="16" fill="#555">realloc(ptr, new)</text>
  <line x1="800" y1="208" x2="800" y2="272" stroke="#ffc107" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="688" y1="312" x2="608" y2="152" stroke="#ffc107" stroke-width="2.4" marker-end="url(#arrow)" />
  <text x="608" y="248" font-size="16" fill="#ffc107">back to check</text>
  <rect x="48" y="416" width="1168" height="272" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="632" y="456" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Under the Hood: Memory Allocator</text>
  <rect x="80" y="480" width="208" height="64" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="184" y="520" text-anchor="middle" font-size="17.6" fill="#333">malloc(64)</text>
  <line x1="288" y1="512" x2="336" y2="512" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="352" y="480" width="272" height="64" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="488" y="508.8" text-anchor="middle" font-size="17.6" fill="#333">glibc allocator</text>
  <text x="488" y="531.2" text-anchor="middle" font-size="16" fill="#555">(ptmalloc2 / bins)</text>
  <line x1="624" y1="512" x2="672" y2="512" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="688" y="480" width="240" height="64" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="808" y="508.8" text-anchor="middle" font-size="17.6" fill="#333">sbrk() / mmap()</text>
  <text x="808" y="531.2" text-anchor="middle" font-size="16" fill="#555">system calls</text>
  <line x1="928" y1="512" x2="976" y2="512" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="992" y="480" width="192" height="64" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="1088" y="520" text-anchor="middle" font-size="17.6" fill="#333">Kernel (VM)</text>
  <text x="632" y="608" text-anchor="middle" font-size="17.6" fill="#555">Small allocations (&lt;128KB): sbrk() grows heap | Large allocations: mmap() creates new mapping</text>
  <text x="632" y="640" text-anchor="middle" font-size="17.6" fill="#555">Metadata stored before each allocation (chunk header: size + flags)</text>
</svg>
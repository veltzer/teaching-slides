<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="0.8889">
      <ns0:stop offset="0%" stop-color="#ffffff" />
      <ns0:stop offset="100%" stop-color="#f2f2f2" />
    </ns0:linearGradient>
    <ns0:filter id="shadow" x="-3.5556%" y="-7.1111%" width="96%" height="110.2222%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </ns0:filter>
    <ns0:marker id="arrow" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#555555" />
    </ns0:marker>
    <ns0:marker id="arrow-accent" markerWidth="8.8889" markerHeight="8.8889" refX="8" refY="4.4444" orient="auto">
      <ns0:path d="M 0.8889 1.7778 L 8 4.4444 L 0.8889 7.1111 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="42.6667" y="35.5556" width="497.7778" height="124.4444" rx="5.3333" fill="#fce4ec" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="291.5556" y="64" text-anchor="middle" font-size="16" font-weight="bold" fill="#e53935">Memory Leak</ns0:text>
  <ns0:text x="64" y="87.1111" font-size="11.5556" fill="#555555" font-family="monospace">void leak() {</ns0:text>
  <ns0:text x="78.2222" y="103.1111" font-size="11.5556" fill="#555555" font-family="monospace">  int *p = malloc(sizeof(int));</ns0:text>
  <ns0:text x="78.2222" y="119.1111" font-size="11.5556" fill="#e53935" font-family="monospace">  return; // forgot free(p)!</ns0:text>
  <ns0:text x="64" y="135.1111" font-size="11.5556" fill="#555555" font-family="monospace">}</ns0:text>
  <ns0:text x="64" y="151.1111" font-size="10.6667" fill="#e53935">Memory never reclaimed until process exits</ns0:text>
  <ns0:rect x="583.1111" y="35.5556" width="512" height="124.4444" rx="5.3333" fill="#fce4ec" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="839.1111" y="64" text-anchor="middle" font-size="16" font-weight="bold" fill="#e53935">Use After Free</ns0:text>
  <ns0:text x="604.4444" y="87.1111" font-size="11.5556" fill="#555555" font-family="monospace">int *p = malloc(sizeof(int));</ns0:text>
  <ns0:text x="604.4444" y="103.1111" font-size="11.5556" fill="#555555" font-family="monospace">free(p);</ns0:text>
  <ns0:text x="604.4444" y="119.1111" font-size="11.5556" fill="#e53935" font-family="monospace">*p = 42; // UNDEFINED BEHAVIOR!</ns0:text>
  <ns0:text x="604.4444" y="144" font-size="11.5556" fill="#555555">Fix: set p = NULL after free</ns0:text>
  <ns0:rect x="42.6667" y="176" width="497.7778" height="124.4444" rx="5.3333" fill="#fce4ec" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="291.5556" y="204.4444" text-anchor="middle" font-size="16" font-weight="bold" fill="#e53935">Double Free</ns0:text>
  <ns0:text x="64" y="227.5556" font-size="11.5556" fill="#555555" font-family="monospace">int *p = malloc(sizeof(int));</ns0:text>
  <ns0:text x="64" y="243.5556" font-size="11.5556" fill="#555555" font-family="monospace">free(p);</ns0:text>
  <ns0:text x="64" y="259.5556" font-size="11.5556" fill="#e53935" font-family="monospace">free(p); // CRASH or heap corruption!</ns0:text>
  <ns0:text x="64" y="289.7778" font-size="11.5556" fill="#555555">Heap metadata corrupted, exploitable</ns0:text>
  <ns0:rect x="583.1111" y="176" width="512" height="124.4444" rx="5.3333" fill="#fce4ec" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="839.1111" y="204.4444" text-anchor="middle" font-size="16" font-weight="bold" fill="#e53935">Buffer Overflow</ns0:text>
  <ns0:text x="604.4444" y="227.5556" font-size="11.5556" fill="#555555" font-family="monospace">int *arr = malloc(5 * sizeof(int));</ns0:text>
  <ns0:text x="604.4444" y="243.5556" font-size="11.5556" fill="#e53935" font-family="monospace">arr[5] = 99; // out of bounds!</ns0:text>
  <ns0:text x="604.4444" y="259.5556" font-size="11.5556" fill="#555555">Writes to adjacent memory</ns0:text>
  <ns0:text x="604.4444" y="280.8889" font-size="11.5556" fill="#555555">May corrupt other allocations</ns0:text>
  <ns0:rect x="42.6667" y="316.4444" width="497.7778" height="115.5556" rx="5.3333" fill="#fff8e1" stroke="#f9a825" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="291.5556" y="344.8889" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">Uninitialized Memory</ns0:text>
  <ns0:text x="64" y="368" font-size="11.5556" fill="#555555" font-family="monospace">int *p = malloc(sizeof(int));</ns0:text>
  <ns0:text x="64" y="384" font-size="11.5556" fill="#e53935" font-family="monospace">printf("%d", *p); // garbage value!</ns0:text>
  <ns0:text x="64" y="421.3333" font-size="11.5556" fill="#555555">Fix: use calloc() or memset()</ns0:text>
  <ns0:rect x="583.1111" y="316.4444" width="512" height="115.5556" rx="5.3333" fill="#fff8e1" stroke="#f9a825" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="839.1111" y="344.8889" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">NULL Dereference</ns0:text>
  <ns0:text x="604.4444" y="368" font-size="11.5556" fill="#555555" font-family="monospace">int *p = malloc(huge_size);</ns0:text>
  <ns0:text x="604.4444" y="384" font-size="11.5556" fill="#e53935" font-family="monospace">*p = 1; // SEGFAULT if malloc failed!</ns0:text>
  <ns0:text x="604.4444" y="421.3333" font-size="11.5556" fill="#555555">Always check malloc return value</ns0:text>
  <ns0:rect x="142.2222" y="453.3333" width="853.3333" height="62.2222" rx="5.3333" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="480" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="#222222">Detection Tools</ns0:text>
  <ns0:text x="266.6667" y="504.8889" text-anchor="middle" font-size="12.4444" fill="#555555">Valgrind</ns0:text>
  <ns0:text x="444.4444" y="504.8889" text-anchor="middle" font-size="12.4444" fill="#555555">AddressSanitizer</ns0:text>
  <ns0:text x="640" y="504.8889" text-anchor="middle" font-size="12.4444" fill="#555555">LeakSanitizer</ns0:text>
  <ns0:text x="853.3333" y="504.8889" text-anchor="middle" font-size="12.4444" fill="#555555">Electric Fence</ns0:text>
</ns0:svg>
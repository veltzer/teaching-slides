<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:rect x="42.6667" y="35.5556" width="497.7778" height="124.4444" rx="5.3333" fill="var(--danger-pale3)" stroke="var(--danger)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="291.5556" y="64" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--danger)">Memory Leak</ns0:text>
  <ns0:text x="64" y="87.1111" font-size="11.5556" fill="var(--text-muted)" font-family="monospace">void leak() {</ns0:text>
  <ns0:text x="78.2222" y="103.1111" font-size="11.5556" fill="var(--text-muted)" font-family="monospace">  int *p = malloc(sizeof(int));</ns0:text>
  <ns0:text x="78.2222" y="119.1111" font-size="11.5556" fill="var(--danger)" font-family="monospace">  return; // forgot free(p)!</ns0:text>
  <ns0:text x="64" y="135.1111" font-size="11.5556" fill="var(--text-muted)" font-family="monospace">}</ns0:text>
  <ns0:text x="64" y="151.1111" font-size="10.6667" fill="var(--danger)">Memory never reclaimed until process exits</ns0:text>
  <ns0:rect x="583.1111" y="35.5556" width="512" height="124.4444" rx="5.3333" fill="var(--danger-pale3)" stroke="var(--danger)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="839.1111" y="64" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--danger)">Use After Free</ns0:text>
  <ns0:text x="604.4444" y="87.1111" font-size="11.5556" fill="var(--text-muted)" font-family="monospace">int *p = malloc(sizeof(int));</ns0:text>
  <ns0:text x="604.4444" y="103.1111" font-size="11.5556" fill="var(--text-muted)" font-family="monospace">free(p);</ns0:text>
  <ns0:text x="604.4444" y="119.1111" font-size="11.5556" fill="var(--danger)" font-family="monospace">*p = 42; // UNDEFINED BEHAVIOR!</ns0:text>
  <ns0:text x="604.4444" y="144" font-size="11.5556" fill="var(--text-muted)">Fix: set p = NULL after free</ns0:text>
  <ns0:rect x="42.6667" y="176" width="497.7778" height="124.4444" rx="5.3333" fill="var(--danger-pale3)" stroke="var(--danger)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="291.5556" y="204.4444" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--danger)">Double Free</ns0:text>
  <ns0:text x="64" y="227.5556" font-size="11.5556" fill="var(--text-muted)" font-family="monospace">int *p = malloc(sizeof(int));</ns0:text>
  <ns0:text x="64" y="243.5556" font-size="11.5556" fill="var(--text-muted)" font-family="monospace">free(p);</ns0:text>
  <ns0:text x="64" y="259.5556" font-size="11.5556" fill="var(--danger)" font-family="monospace">free(p); // CRASH or heap corruption!</ns0:text>
  <ns0:text x="64" y="289.7778" font-size="11.5556" fill="var(--text-muted)">Heap metadata corrupted, exploitable</ns0:text>
  <ns0:rect x="583.1111" y="176" width="512" height="124.4444" rx="5.3333" fill="var(--danger-pale3)" stroke="var(--danger)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="839.1111" y="204.4444" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--danger)">Buffer Overflow</ns0:text>
  <ns0:text x="604.4444" y="227.5556" font-size="11.5556" fill="var(--text-muted)" font-family="monospace">int *arr = malloc(5 * sizeof(int));</ns0:text>
  <ns0:text x="604.4444" y="243.5556" font-size="11.5556" fill="var(--danger)" font-family="monospace">arr[5] = 99; // out of bounds!</ns0:text>
  <ns0:text x="604.4444" y="259.5556" font-size="11.5556" fill="var(--text-muted)">Writes to adjacent memory</ns0:text>
  <ns0:text x="604.4444" y="280.8889" font-size="11.5556" fill="var(--text-muted)">May corrupt other allocations</ns0:text>
  <ns0:rect x="42.6667" y="316.4444" width="497.7778" height="115.5556" rx="5.3333" fill="var(--warn-pale3)" stroke="var(--warn-amber)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="291.5556" y="344.8889" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text-darker)">Uninitialized Memory</ns0:text>
  <ns0:text x="64" y="368" font-size="11.5556" fill="var(--text-muted)" font-family="monospace">int *p = malloc(sizeof(int));</ns0:text>
  <ns0:text x="64" y="384" font-size="11.5556" fill="var(--danger)" font-family="monospace">printf("%d", *p); // garbage value!</ns0:text>
  <ns0:text x="64" y="421.3333" font-size="11.5556" fill="var(--text-muted)">Fix: use calloc() or memset()</ns0:text>
  <ns0:rect x="583.1111" y="316.4444" width="512" height="115.5556" rx="5.3333" fill="var(--warn-pale3)" stroke="var(--warn-amber)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="839.1111" y="344.8889" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text-darker)">NULL Dereference</ns0:text>
  <ns0:text x="604.4444" y="368" font-size="11.5556" fill="var(--text-muted)" font-family="monospace">int *p = malloc(huge_size);</ns0:text>
  <ns0:text x="604.4444" y="384" font-size="11.5556" fill="var(--danger)" font-family="monospace">*p = 1; // SEGFAULT if malloc failed!</ns0:text>
  <ns0:text x="604.4444" y="421.3333" font-size="11.5556" fill="var(--text-muted)">Always check malloc return value</ns0:text>
  <ns0:rect x="142.2222" y="453.3333" width="853.3333" height="62.2222" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="480" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="var(--text-darker)">Detection Tools</ns0:text>
  <ns0:text x="266.6667" y="504.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">Valgrind</ns0:text>
  <ns0:text x="444.4444" y="504.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">AddressSanitizer</ns0:text>
  <ns0:text x="640" y="504.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">LeakSanitizer</ns0:text>
  <ns0:text x="853.3333" y="504.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">Electric Fence</ns0:text>
</ns0:svg>
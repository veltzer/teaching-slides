<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="567.567568" height="150.370301" rx="7.203604" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="323.783784" y="74.370275" text-anchor="middle" font-size="18.780395" font-weight="bold" fill="var(--danger-accent)">Memory Leak</text>
  <text x="64.324324" y="102.296148" font-size="13.563665" fill="var(--text-muted)" font-family="monospace">void leak() {</text>
  <text x="80.540541" y="121.629485" font-size="13.563665" fill="var(--text-muted)" font-family="monospace">  int *p = malloc(sizeof(int));</text>
  <text x="80.540541" y="140.962823" font-size="13.563665" fill="var(--danger-accent)" font-family="monospace">  return; // forgot free(p)!</text>
  <text x="64.324324" y="160.296161" font-size="13.563665" fill="var(--text-muted)" font-family="monospace">}</text>
  <text x="64.324324" y="179.629499" font-size="12.520343" fill="var(--danger-accent)">Memory never reclaimed until process exits</text>
  <rect x="656.216216" y="40" width="583.783784" height="150.370301" rx="7.203604" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="948.108108" y="74.370275" text-anchor="middle" font-size="18.780395" font-weight="bold" fill="var(--danger-accent)">Use After Free</text>
  <text x="680.540432" y="102.296148" font-size="13.563665" fill="var(--text-muted)" font-family="monospace">int *p = malloc(sizeof(int));</text>
  <text x="680.540432" y="121.629485" font-size="13.563665" fill="var(--text-muted)" font-family="monospace">free(p);</text>
  <text x="680.540432" y="140.962823" font-size="13.563665" fill="var(--danger-accent)" font-family="monospace">*p = 42; // UNDEFINED BEHAVIOR!</text>
  <text x="680.540432" y="171.036963" font-size="13.563665" fill="var(--text-muted)">Fix: set p = NULL after free</text>
  <rect x="40" y="209.703639" width="567.567568" height="150.370301" rx="7.203604" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="323.783784" y="244.073914" text-anchor="middle" font-size="18.780395" font-weight="bold" fill="var(--danger-accent)">Double Free</text>
  <text x="64.324324" y="272.000053" font-size="13.563665" fill="var(--text-muted)" font-family="monospace">int *p = malloc(sizeof(int));</text>
  <text x="64.324324" y="291.333391" font-size="13.563665" fill="var(--text-muted)" font-family="monospace">free(p);</text>
  <text x="64.324324" y="310.666729" font-size="13.563665" fill="var(--danger-accent)" font-family="monospace">free(p); // CRASH or heap corruption!</text>
  <text x="64.324324" y="347.185137" font-size="13.563665" fill="var(--text-muted)">Heap metadata corrupted, exploitable</text>
  <rect x="656.216216" y="209.703639" width="583.783784" height="150.370301" rx="7.203604" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="948.108108" y="244.073914" text-anchor="middle" font-size="18.780395" font-weight="bold" fill="var(--danger-accent)">Buffer Overflow</text>
  <text x="680.540432" y="272.000053" font-size="13.563665" fill="var(--text-muted)" font-family="monospace">int *arr = malloc(5 * sizeof(int));</text>
  <text x="680.540432" y="291.333391" font-size="13.563665" fill="var(--danger-accent)" font-family="monospace">arr[5] = 99; // out of bounds!</text>
  <text x="680.540432" y="310.666729" font-size="13.563665" fill="var(--text-muted)">Writes to adjacent memory</text>
  <text x="680.540432" y="336.444468" font-size="13.563665" fill="var(--text-muted)">May corrupt other allocations</text>
  <rect x="40" y="379.407278" width="567.567568" height="139.629765" rx="7.203604" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="323.783784" y="413.777819" text-anchor="middle" font-size="18.780395" font-weight="bold" fill="var(--text)">Uninitialized Memory</text>
  <text x="64.324324" y="441.703692" font-size="13.563665" fill="var(--text-muted)" font-family="monospace">int *p = malloc(sizeof(int));</text>
  <text x="64.324324" y="461.03703" font-size="13.563665" fill="var(--danger-accent)" font-family="monospace">printf("%d", *p); // garbage value!</text>
  <text x="64.324324" y="506.148107" font-size="13.563665" fill="var(--text-muted)">Fix: use calloc() or memset()</text>
  <rect x="656.216216" y="379.407278" width="583.783784" height="139.629765" rx="7.203604" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="948.108108" y="413.777819" text-anchor="middle" font-size="18.780395" font-weight="bold" fill="var(--text)">NULL Dereference</text>
  <text x="680.540432" y="441.703692" font-size="13.563665" fill="var(--text-muted)" font-family="monospace">int *p = malloc(huge_size);</text>
  <text x="680.540432" y="461.03703" font-size="13.563665" fill="var(--danger-accent)" font-family="monospace">*p = 1; // SEGFAULT if malloc failed!</text>
  <text x="680.540432" y="506.148107" font-size="13.563665" fill="var(--text-muted)">Always check malloc return value</text>
  <rect x="153.513514" y="544.814783" width="972.972865" height="75.185217" rx="7.203604" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="577.037057" text-anchor="middle" font-size="17.737073" font-weight="bold" fill="var(--text)">Detection Tools</text>
  <text x="295.405405" y="607.111197" text-anchor="middle" font-size="14.606867" fill="var(--text-muted)">Valgrind</text>
  <text x="498.108" y="607.111197" text-anchor="middle" font-size="14.606867" fill="var(--text-muted)">AddressSanitizer</text>
  <text x="721.081081" y="607.111197" text-anchor="middle" font-size="14.606867" fill="var(--text-muted)">LeakSanitizer</text>
  <text x="964.324216" y="607.111197" text-anchor="middle" font-size="14.606867" fill="var(--text-muted)">Electric Fence</text>
</svg>
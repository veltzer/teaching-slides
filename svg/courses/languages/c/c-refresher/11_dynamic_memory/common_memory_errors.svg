<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="85" y="72.2223" width="525" height="112.7777" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="347.5" y="98" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--danger-accent)">Memory Leak</text>
  <text x="107.5" y="118.9444" font-size="11.2974" fill="var(--text-muted)" font-family="monospace">void leak() {</text>
  <text x="122.5" y="133.4444" font-size="11.2974" fill="var(--text-muted)" font-family="monospace">  int *p = malloc(sizeof(int));</text>
  <text x="122.5" y="147.9444" font-size="11.2974" fill="var(--danger-accent)" font-family="monospace">  return; // forgot free(p)!</text>
  <text x="107.5" y="162.4444" font-size="11.2974" fill="var(--text-muted)" font-family="monospace">}</text>
  <text x="107.5" y="176.9444" font-size="10.4284" fill="var(--danger-accent)">Memory never reclaimed until process exits</text>
  <rect x="655" y="72.2223" width="540" height="112.7777" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="925" y="98" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--danger-accent)">Use After Free</text>
  <text x="677.4999" y="118.9444" font-size="11.2974" fill="var(--text-muted)" font-family="monospace">int *p = malloc(sizeof(int));</text>
  <text x="677.4999" y="133.4444" font-size="11.2974" fill="var(--text-muted)" font-family="monospace">free(p);</text>
  <text x="677.4999" y="147.9444" font-size="11.2974" fill="var(--danger-accent)" font-family="monospace">*p = 42; // UNDEFINED BEHAVIOR!</text>
  <text x="677.4999" y="170.5" font-size="11.2974" fill="var(--text-muted)">Fix: set p = NULL after free</text>
  <rect x="85" y="199.5" width="525" height="112.7777" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="347.5" y="225.2777" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--danger-accent)">Double Free</text>
  <text x="107.5" y="246.2223" font-size="11.2974" fill="var(--text-muted)" font-family="monospace">int *p = malloc(sizeof(int));</text>
  <text x="107.5" y="260.7223" font-size="11.2974" fill="var(--text-muted)" font-family="monospace">free(p);</text>
  <text x="107.5" y="275.2223" font-size="11.2974" fill="var(--danger-accent)" font-family="monospace">free(p); // CRASH or heap corruption!</text>
  <text x="107.5" y="302.6111" font-size="11.2974" fill="var(--text-muted)">Heap metadata corrupted, exploitable</text>
  <rect x="655" y="199.5" width="540" height="112.7777" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="925" y="225.2777" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--danger-accent)">Buffer Overflow</text>
  <text x="677.4999" y="246.2223" font-size="11.2974" fill="var(--text-muted)" font-family="monospace">int *arr = malloc(5 * sizeof(int));</text>
  <text x="677.4999" y="260.7223" font-size="11.2974" fill="var(--danger-accent)" font-family="monospace">arr[5] = 99; // out of bounds!</text>
  <text x="677.4999" y="275.2223" font-size="11.2974" fill="var(--text-muted)">Writes to adjacent memory</text>
  <text x="677.4999" y="294.5556" font-size="11.2974" fill="var(--text-muted)">May corrupt other allocations</text>
  <rect x="85" y="326.7777" width="525" height="104.7223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="347.5" y="352.5556" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--text)">Uninitialized Memory</text>
  <text x="107.5" y="373.5" font-size="11.2974" fill="var(--text-muted)" font-family="monospace">int *p = malloc(sizeof(int));</text>
  <text x="107.5" y="388" font-size="11.2974" fill="var(--danger-accent)" font-family="monospace">printf("%d", *p); // garbage value!</text>
  <text x="107.5" y="421.8333" font-size="11.2974" fill="var(--text-muted)">Fix: use calloc() or memset()</text>
  <rect x="655" y="326.7777" width="540" height="104.7223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="925" y="352.5556" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--text)">NULL Dereference</text>
  <text x="677.4999" y="373.5" font-size="11.2974" fill="var(--text-muted)" font-family="monospace">int *p = malloc(huge_size);</text>
  <text x="677.4999" y="388" font-size="11.2974" fill="var(--danger-accent)" font-family="monospace">*p = 1; // SEGFAULT if malloc failed!</text>
  <text x="677.4999" y="421.8333" font-size="11.2974" fill="var(--text-muted)">Always check malloc return value</text>
  <rect x="190" y="450.8333" width="899.9999" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="475" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--text)">Detection Tools</text>
  <text x="321.25" y="497.5556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">Valgrind</text>
  <text x="508.7499" y="497.5556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">AddressSanitizer</text>
  <text x="715" y="497.5556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">LeakSanitizer</text>
  <text x="939.9999" y="497.5556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">Electric Fence</text>
</svg>
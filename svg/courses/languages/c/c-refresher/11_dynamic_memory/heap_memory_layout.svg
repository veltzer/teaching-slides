<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Heap Memory Layout</text>
  <!-- Process memory layout -->
  <rect x="40" y="50" width="250" height="470" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="165" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Process Address Space</text>
  <!-- Stack -->
  <rect x="55" y="90" width="220" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="165" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Stack</text>
  <text x="165" y="130" text-anchor="middle" font-size="9" fill="#555">grows downward</text>
  <text x="290" y="118" font-size="10" fill="#999">High addr</text>
  <!-- Arrow down -->
  <line x1="165" y1="140" x2="165" y2="165" stroke="#4a90e2" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- gap -->
  <rect x="55" y="170" width="220" height="30" rx="0" fill="#fff" stroke="#ddd" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="165" y="190" text-anchor="middle" font-size="10" fill="#999">... free space ...</text>
  <!-- Heap -->
  <rect x="55" y="210" width="220" height="160" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="165" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Heap</text>
  <text x="165" y="255" text-anchor="middle" font-size="9" fill="#555">grows upward</text>
  <!-- Heap internals -->
  <rect x="70" y="265" width="190" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="165" y="282" text-anchor="middle" font-size="9" fill="#333">Allocated chunk (64 bytes)</text>
  <rect x="70" y="293" width="190" height="25" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="165" y="310" text-anchor="middle" font-size="9" fill="#dc3545">Free chunk (128 bytes)</text>
  <rect x="70" y="321" width="190" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="165" y="338" text-anchor="middle" font-size="9" fill="#333">Allocated chunk (32 bytes)</text>
  <text x="165" y="363" text-anchor="middle" font-size="9" fill="#555">brk/program break</text>
  <!-- BSS -->
  <rect x="55" y="380" width="220" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="165" y="402" text-anchor="middle" font-size="11" fill="#333">BSS (uninitialized globals)</text>
  <!-- Data -->
  <rect x="55" y="420" width="220" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="165" y="442" text-anchor="middle" font-size="11" fill="#333">Data (initialized globals)</text>
  <!-- Text -->
  <rect x="55" y="460" width="220" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="165" y="482" text-anchor="middle" font-size="11" fill="#333">Text (code)</text>
  <text x="290" y="482" font-size="10" fill="#999">Low addr</text>
  <!-- Chunk detail -->
  <rect x="350" y="90" width="320" height="200" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="510" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Heap Chunk Structure</text>
  <rect x="370" y="130" width="280" height="25" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="510" y="147" text-anchor="middle" font-size="10" fill="#333">prev_size (8 bytes) - if prev is free</text>
  <rect x="370" y="158" width="280" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="510" y="175" text-anchor="middle" font-size="10" fill="#333">size | flags (8 bytes) [A|M|P]</text>
  <rect x="370" y="186" width="280" height="70" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="510" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">User Data</text>
  <text x="510" y="235" text-anchor="middle" font-size="10" fill="#555">returned by malloc()</text>
  <text x="510" y="250" text-anchor="middle" font-size="10" fill="#555">minimum 16 bytes</text>
  <!-- Arrow showing what malloc returns -->
  <line x1="360" y1="210" x2="340" y2="210" stroke="#28a745" stroke-width="2"/>
  <text x="330" y="215" text-anchor="end" font-size="9" fill="#28a745">ptr</text>
  <!-- Fragmentation -->
  <rect x="350" y="310" width="320" height="140" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="510" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Fragmentation</text>
  <rect x="370" y="350" width="40" height="30" rx="2" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <rect x="412" y="350" width="60" height="30" rx="2" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <rect x="474" y="350" width="30" height="30" rx="2" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <rect x="506" y="350" width="45" height="30" rx="2" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <rect x="553" y="350" width="50" height="30" rx="2" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <rect x="605" y="350" width="45" height="30" rx="2" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="510" y="405" text-anchor="middle" font-size="10" fill="#555">Free chunks (red) scattered between</text>
  <text x="510" y="420" text-anchor="middle" font-size="10" fill="#555">allocated chunks (green) = fragmentation</text>
  <text x="510" y="440" text-anchor="middle" font-size="10" fill="#dc3545">Total free space enough, but no single block fits</text>
</svg>
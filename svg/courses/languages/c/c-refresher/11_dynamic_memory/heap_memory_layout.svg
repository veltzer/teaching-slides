  <text x="932.5714" y="530.1818" text-anchor="middle" font-size="13.0909" fill="#555">Free chunks (red) scattered between</text>
  <text x="932.5714" y="549.8182" text-anchor="middle" font-size="13.0909" fill="#555">allocated chunks (green) = fragmentation</text>
  <text x="932.5714" y="576" text-anchor="middle" font-size="13.0909" fill="#dc3545">Total free space enough, but no single block fits</text>
</svg>
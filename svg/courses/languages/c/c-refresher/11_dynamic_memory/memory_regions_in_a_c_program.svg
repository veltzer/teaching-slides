<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="42.8571" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#333">Memory Regions in a C Program</text>
  <text x="1047.2727" y="94.2857" font-size="17.1429" fill="#666">High addresses</text>
  <rect x="232.7273" y="85.7143" width="581.8182" height="111.4286" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4286" />
  <text x="523.6364" y="123.4286" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="#4a90e2">Stack</text>
  <text x="523.6364" y="154.2857" text-anchor="middle" font-size="17.1429" fill="#666">Local variables, function frames</text>
  <text x="523.6364" y="180" text-anchor="middle" font-size="17.1429" fill="#4a90e2">(grows downward)</text>
  <polygon points="512,180 523.6364,197.1429 535.2727,180" fill="#4a90e2" />
  <text x="523.6364" y="240" text-anchor="middle" font-size="34.2857" fill="#ccc">...</text>
  <polygon points="512,265.7143 523.6364,248.5714 535.2727,265.7143" fill="#28a745" />
  <rect x="232.7273" y="265.7143" width="581.8182" height="111.4286" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="3.4286" />
  <text x="523.6364" y="303.4286" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="#28a745">Heap</text>
  <text x="523.6364" y="334.2857" text-anchor="middle" font-size="17.1429" fill="#666">malloc/calloc/realloc</text>
  <text x="523.6364" y="360" text-anchor="middle" font-size="17.1429" fill="#28a745">(grows upward)</text>
  <rect x="232.7273" y="385.7143" width="581.8182" height="77.1429" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4286" />
  <text x="523.6364" y="423.4286" text-anchor="middle" font-size="20.5714" font-weight="bold" fill="#856404">Uninitialized Data (.bss)</text>
  <text x="523.6364" y="450.8571" text-anchor="middle" font-size="17.1429" fill="#666">static int x;</text>
  <rect x="232.7273" y="471.4286" width="581.8182" height="77.1429" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5714" />
  <text x="523.6364" y="509.1429" text-anchor="middle" font-size="20.5714" font-weight="bold" fill="#856404">Initialized Data (.data)</text>
  <text x="523.6364" y="536.5714" text-anchor="middle" font-size="17.1429" fill="#666">static int x = 5;</text>
  <rect x="232.7273" y="557.1429" width="581.8182" height="77.1429" rx="8.5714" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5714" />
  <text x="523.6364" y="594.8571" text-anchor="middle" font-size="20.5714" font-weight="bold" fill="#dc3545">Read-Only Data (.rodata)</text>
  <text x="523.6364" y="622.2857" text-anchor="middle" font-size="17.1429" fill="#666">string literals</text>
  <rect x="232.7273" y="642.8571" width="581.8182" height="68.5714" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5714" />
  <text x="523.6364" y="685.7143" text-anchor="middle" font-size="20.5714" font-weight="bold" fill="#4a90e2">Text / Code (.text)</text>
  <text x="1047.2727" y="685.7143" font-size="17.1429" fill="#666">Low addresses</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="1240" y="40" font-size="19.125966" fill="var(--text-faint)">High addresses</text>
  <rect x="40" y="44.882062" width="848.780488" height="97.643172" rx="8.2532" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="464.390244" y="83.939403" text-anchor="middle" font-size="26.298272" font-weight="bold" fill="var(--primary-accent)">Stack</text>
  <text x="464.390244" y="111.279409" text-anchor="middle" font-size="19.125966" fill="var(--text-muted)">Local variables, function frames</text>
  <text x="464.390244" y="132.760868" text-anchor="middle" font-size="17.930628" fill="var(--primary-accent)">(grows downward)</text>
  <polygon points="449.756098,140.572263 464.390244,156.195297 479.02439,140.572263" fill="var(--primary-fill)" />
  <text x="464.390244" y="199.158215" text-anchor="middle" font-size="38.251932" fill="var(--border)">...</text>
  <polygon points="449.756098,212.828279 464.390244,197.205366 479.02439,212.828279" fill="var(--primary-fill)" />
  <rect x="40" y="220.639674" width="848.780488" height="97.643172" rx="8.2532" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="464.390244" y="259.697016" text-anchor="middle" font-size="26.298272" font-weight="bold" fill="var(--primary-accent)">Heap</text>
  <text x="464.390244" y="287.037021" text-anchor="middle" font-size="19.125966" fill="var(--text-muted)">malloc / calloc / realloc</text>
  <text x="464.390244" y="308.51848" text-anchor="middle" font-size="17.930628" fill="var(--primary-accent)">(grows upward)</text>
  <rect x="40" y="328.047091" width="848.780488" height="68.350196" rx="8.2532" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="464.390244" y="362.222249" text-anchor="middle" font-size="23.907595" font-weight="bold" fill="var(--warn-accent)">Uninitialized Data (.bss)</text>
  <text x="464.390244" y="386.632921" text-anchor="middle" font-size="17.930628" fill="var(--text-muted)">static int x;</text>
  <rect x="40" y="404.208682" width="848.780488" height="68.350196" rx="8.2532" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="464.390244" y="438.383962" text-anchor="middle" font-size="23.907595" font-weight="bold" fill="var(--warn-accent)">Initialized Data (.data)</text>
  <text x="464.390244" y="462.794634" text-anchor="middle" font-size="17.930628" fill="var(--text-muted)">static int x = 5;</text>
  <rect x="40" y="480.370395" width="848.780488" height="68.350196" rx="8.2532" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="464.390244" y="514.545554" text-anchor="middle" font-size="23.907595" font-weight="bold" fill="var(--danger-accent)">Read-Only Data (.rodata)</text>
  <text x="464.390244" y="538.956225" text-anchor="middle" font-size="17.930628" fill="var(--text-muted)">string literals</text>
  <rect x="40" y="556.531987" width="848.780488" height="63.468013" rx="8.2532" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="464.390244" y="595.589328" text-anchor="middle" font-size="23.907595" font-weight="bold" fill="var(--primary-accent)">Text / Code (.text)</text>
  <text x="1240" y="595.589328" font-size="19.125966" fill="var(--text-faint)">Low addresses</text>
</svg>
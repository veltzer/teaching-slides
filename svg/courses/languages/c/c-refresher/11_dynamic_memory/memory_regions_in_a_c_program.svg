<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="1240" y="40" font-size="19.125966" fill="var(--text-faint)" font-family="Arial, sans-serif">High addresses</text>
  <rect x="40" y="44.882062" width="848.780488" height="97.643172" rx="8.2532" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.390244" y="83.939403" text-anchor="middle" font-size="26.298272" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Stack</text>
  <text x="464.390244" y="111.279409" text-anchor="middle" font-size="19.125966" fill="var(--text-muted)" font-family="Arial, sans-serif">Local variables, function frames</text>
  <text x="464.390244" y="132.760868" text-anchor="middle" font-size="17.930628" fill="var(--primary-accent)" font-family="Arial, sans-serif">(grows downward)</text>
  <polygon points="449.756098,140.572263 464.390244,156.195297 479.02439,140.572263" fill="var(--primary-fill)"/>
  <text x="464.390244" y="199.158215" text-anchor="middle" font-size="38.251932" fill="var(--border)" font-family="Arial, sans-serif">...</text>
  <polygon points="449.756098,212.828279 464.390244,197.205366 479.02439,212.828279" fill="var(--primary-fill)"/>
  <rect x="40" y="220.639674" width="848.780488" height="97.643172" rx="8.2532" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.390244" y="259.697016" text-anchor="middle" font-size="26.298272" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Heap</text>
  <text x="464.390244" y="287.037021" text-anchor="middle" font-size="19.125966" fill="var(--text-muted)" font-family="Arial, sans-serif">malloc / calloc / realloc</text>
  <text x="464.390244" y="308.51848" text-anchor="middle" font-size="17.930628" fill="var(--primary-accent)" font-family="Arial, sans-serif">(grows upward)</text>
  <rect x="40" y="328.047091" width="848.780488" height="68.350196" rx="8.2532" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.390244" y="362.222249" text-anchor="middle" font-size="23.907595" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Uninitialized Data (.bss)</text>
  <text x="464.390244" y="386.632921" text-anchor="middle" font-size="17.930628" fill="var(--text-muted)" font-family="Arial, sans-serif">static int x;</text>
  <rect x="40" y="404.208682" width="848.780488" height="68.350196" rx="8.2532" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.390244" y="438.383962" text-anchor="middle" font-size="23.907595" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Initialized Data (.data)</text>
  <text x="464.390244" y="462.794634" text-anchor="middle" font-size="17.930628" fill="var(--text-muted)" font-family="Arial, sans-serif">static int x = 5;</text>
  <rect x="40" y="480.370395" width="848.780488" height="68.350196" rx="8.2532" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.390244" y="514.545554" text-anchor="middle" font-size="23.907595" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Read-Only Data (.rodata)</text>
  <text x="464.390244" y="538.956225" text-anchor="middle" font-size="17.930628" fill="var(--text-muted)" font-family="Arial, sans-serif">string literals</text>
  <rect x="40" y="556.531987" width="848.780488" height="63.468013" rx="8.2532" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="464.390244" y="595.589328" text-anchor="middle" font-size="23.907595" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Text / Code (.text)</text>
  <text x="1240" y="595.589328" font-size="19.125966" fill="var(--text-faint)" font-family="Arial, sans-serif">Low addresses</text>
</svg>

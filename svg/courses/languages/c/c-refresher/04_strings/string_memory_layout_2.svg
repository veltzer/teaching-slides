<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Code declaration -->
  <text x="100" y="58" font-size="22" font-weight="bold" fill="#222222" font-family="monospace">char *ptr = "Hello";</text>

  <!-- Stack section -->
  <text x="100" y="110" font-size="18" fill="#888888">Stack:</text>
  <rect x="100" y="125" width="200" height="110" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="186" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222" font-family="monospace">ptr: 0x1000</text>

  <!-- Arrow from pointer to string -->
  <line x1="300" y1="180" x2="500" y2="180" stroke="#1565c0" stroke-width="2" stroke-dasharray="10 5" marker-end="url(#arrow-accent)"/>

  <!-- Read-only data section -->
  <text x="505" y="110" font-size="18" fill="#888888">Read-only data:</text>
  <rect x="505" y="125" width="105" height="110" rx="5" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="557" y="186" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">'H'</text>
  <rect x="613" y="125" width="105" height="110" rx="5" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="665" y="186" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">'e'</text>
  <rect x="721" y="125" width="105" height="110" rx="5" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="773" y="186" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">'l'</text>
  <rect x="829" y="125" width="105" height="110" rx="5" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="881" y="186" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">'l'</text>
  <rect x="937" y="125" width="105" height="110" rx="5" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="989" y="186" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">'o'</text>
  <rect x="1045" y="125" width="105" height="110" rx="5" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="186" text-anchor="middle" font-size="18" font-weight="bold" fill="#e53935">'\0'</text>

  <!-- Warning box -->
  <rect x="185" y="310" width="910" height="140" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="365" text-anchor="middle" font-size="20" fill="#e53935" font-weight="bold">String literal is in read-only memory!</text>
  <text x="640" y="414" text-anchor="middle" font-size="18" fill="#555555">Writing to ptr[0] = 'h' is undefined behavior (segfault)</text>
</svg>

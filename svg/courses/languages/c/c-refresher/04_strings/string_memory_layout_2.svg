<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="28.608145" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">char *ptr = "Hello";</text>
  <text x="40" y="116.938631" font-size="23.406677" fill="var(--text-faint)" font-family="Arial, sans-serif">Stack:</text>
  <rect x="40" y="139.132453" width="228.571429" height="162.755121" rx="8.978109" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="154.285714" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">ptr: 0x1000</text>
  <line x1="268.571429" y1="220.510107" x2="497.142735" y2="220.510107" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="8.8889 4.4444" marker-end="url(#arrow-primary)"/>
  <text x="502.857143" y="116.938631" font-size="23.406677" fill="var(--text-faint)" font-family="Arial, sans-serif">Read-only data:</text>
  <rect x="502.857143" y="139.132453" width="120" height="162.755121" rx="8.978109" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="562.285714" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">'H'</text>
  <rect x="626.285714" y="139.132453" width="120" height="162.755121" rx="8.978109" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="685.714286" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">'e'</text>
  <rect x="749.714286" y="139.132453" width="120" height="162.755121" rx="8.978109" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="809.142857" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">'l'</text>
  <rect x="873.142857" y="139.132453" width="120" height="162.755121" rx="8.978109" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="932.571429" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">'l'</text>
  <rect x="996.571429" y="139.132453" width="120" height="162.755121" rx="8.978109" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1056" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">'o'</text>
  <rect x="1120" y="139.132453" width="120" height="162.755121" rx="8.978109" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1179.428571" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">'\0'</text>
  <rect x="137.142735" y="412.857235" width="1040" height="207.142765" rx="8.978109" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="657.142857" y="494.234519" text-anchor="middle" font-size="26.007486" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">String literal is in read-only memory!</text>
  <text x="657.142857" y="566.734681" text-anchor="middle" font-size="23.406677" fill="var(--text-muted)" font-family="Arial, sans-serif">Writing to ptr[0] = 'h' is undefined behavior (segfault)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" font-family="Arial, sans-serif">
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">String Memory Layout: char* (pointer to literal)</text>
  <text x="50" y="55" font-size="12" font-weight="bold" fill="#333" font-family="monospace">char *ptr = "Hello";</text>
  <!-- Stack pointer -->
  <text x="50" y="85" font-size="11" fill="#666">Stack:</text>
  <rect x="50" y="95" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="105" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" font-family="monospace">ptr: 0x--</text>
  <!-- Arrow -->
  <line x1="160" y1="115" x2="275" y2="115" stroke="#4a90e2" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="270,110 280,115 270,120" fill="#4a90e2"/>
  <!-- Read-only data -->
  <text x="280" y="85" font-size="11" fill="#666">Read-only data:</text>
  <rect x="280" y="95" width="60" height="40" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="310" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">'H'</text>
  <rect x="340" y="95" width="60" height="40" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="370" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">'e'</text>
  <rect x="400" y="95" width="60" height="40" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="430" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">'l'</text>
  <rect x="460" y="95" width="60" height="40" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="490" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">'l'</text>
  <rect x="520" y="95" width="60" height="40" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="550" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">'o'</text>
  <rect x="580" y="95" width="60" height="40" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="610" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">'\0'</text>
  <!-- Warning -->
  <rect x="100" y="160" width="500" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="350" y="180" text-anchor="middle" font-size="11" fill="#dc3545" font-weight="bold">String literal is in read-only memory!</text>
  <text x="350" y="196" text-anchor="middle" font-size="11" fill="#666">Writing to ptr[0] = 'h' is undefined behavior (segfault)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="40" y="40" font-size="28.608145" font-weight="bold" fill="var(--text)" font-family="monospace">char *ptr = "Hello";</text>
  <text x="40" y="116.938631" font-size="23.406677" fill="var(--text-faint)">Stack:</text>
  <rect x="40" y="139.132453" width="228.571429" height="162.755121" rx="8.978109" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="154.285714" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--text)" font-family="monospace">ptr: 0x1000</text>
  <line x1="268.571429" y1="220.510107" x2="497.142735" y2="220.510107" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="8.8889 4.4444" marker-end="url(#arrow-primary)" />
  <text x="502.857143" y="116.938631" font-size="23.406677" fill="var(--text-faint)">Read-only data:</text>
  <rect x="502.857143" y="139.132453" width="120" height="162.755121" rx="8.978109" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="562.285714" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--text)">'H'</text>
  <rect x="626.285714" y="139.132453" width="120" height="162.755121" rx="8.978109" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="685.714286" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--text)">'e'</text>
  <rect x="749.714286" y="139.132453" width="120" height="162.755121" rx="8.978109" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="809.142857" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--text)">'l'</text>
  <rect x="873.142857" y="139.132453" width="120" height="162.755121" rx="8.978109" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="932.571429" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--text)">'l'</text>
  <rect x="996.571429" y="139.132453" width="120" height="162.755121" rx="8.978109" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1056" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--text)">'o'</text>
  <rect x="1120" y="139.132453" width="120" height="162.755121" rx="8.978109" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1179.428571" y="229.387597" text-anchor="middle" font-size="23.406677" font-weight="bold" fill="var(--danger-accent)">'\0'</text>
  <rect x="137.142735" y="412.857235" width="1040" height="207.142765" rx="8.978109" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="657.142857" y="494.234519" text-anchor="middle" font-size="26.007486" fill="var(--danger-accent)" font-weight="bold">String literal is in read-only memory!</text>
  <text x="657.142857" y="566.734681" text-anchor="middle" font-size="23.406677" fill="var(--text-muted)">Writing to ptr[0] = 'h' is undefined behavior (segfault)</text>
</svg>
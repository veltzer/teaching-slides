  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:text x="62.2222" y="46.2222" font-size="19.5556" font-weight="bold" fill="#222222" font-family="monospace">char *str = "Hello";</ns0:text>

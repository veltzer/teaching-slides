<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="105.625" y="81.8889" font-size="19.1186" font-weight="bold" fill="var(--text)" font-family="monospace">char *str = "Hello";</text>
  <rect x="77.5" y="96.3889" width="75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="115" y="118.1389" text-anchor="middle" font-size="17.3806" fill="var(--text)">'H'</text>
  <text x="115" y="135.0556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">0x48</text>
  <rect x="156.25" y="96.3889" width="75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="193.75" y="118.1389" text-anchor="middle" font-size="17.3806" fill="var(--text)">'e'</text>
  <text x="193.75" y="135.0556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">0x65</text>
  <rect x="235" y="96.3889" width="75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="272.4999" y="118.1389" text-anchor="middle" font-size="17.3806" fill="var(--text)">'l'</text>
  <text x="272.4999" y="135.0556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">0x6C</text>
  <rect x="313.75" y="96.3889" width="75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="351.25" y="118.1389" text-anchor="middle" font-size="17.3806" fill="var(--text)">'l'</text>
  <text x="351.25" y="135.0556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">0x6C</text>
  <rect x="392.5" y="96.3889" width="75" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="430" y="118.1389" text-anchor="middle" font-size="17.3806" fill="var(--text)">'o'</text>
  <text x="430" y="135.0556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">0x6F</text>
  <rect x="471.25" y="96.3889" width="75" height="48.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="508.7499" y="118.1389" text-anchor="middle" font-size="17.3806" fill="var(--danger-accent)">'\0'</text>
  <text x="508.7499" y="135.0556" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">0x00</text>
  <text x="686.875" y="128.6111" font-size="14.7735" fill="var(--danger-accent)" font-weight="bold">Null terminator</text>
  <line x1="685" y1="123.7777" x2="553.75" y2="123.7777" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="761.8749" y="96.3889" width="375" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="949.375" y="123.7777" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--text)">str (pointer)</text>
  <text x="949.375" y="146.3333" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">stores address: 0x1000</text>
  <line x1="761.8749" y1="128.6111" x2="560.3125" y2="128.6111" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow-primary)" />
  <rect x="105.625" y="201.1111" width="496.875" height="169.1667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="354.0625" y="231.7223" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)" font-family="monospace">char str[] = "Hello";</text>
  <text x="133.75" y="261.5277" font-size="13.9044" fill="var(--text-muted)">- Array on stack (6 bytes)</text>
  <text x="133.75" y="285.6944" font-size="13.9044" fill="var(--text-muted)">- Modifiable contents</text>
  <text x="133.75" y="309.8611" font-size="13.9044" fill="var(--text-muted)">- sizeof(str) == 6</text>
  <text x="133.75" y="334.0277" font-size="13.9044" fill="var(--primary-accent)">- str[0] = 'h'; // OK</text>
  <rect x="649.375" y="201.1111" width="525" height="169.1667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="911.875" y="231.7223" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--text)" font-family="monospace">char *str = "Hello";</text>
  <text x="677.4999" y="261.5277" font-size="13.9044" fill="var(--text-muted)">- Pointer to read-only data</text>
  <text x="677.4999" y="285.6944" font-size="13.9044" fill="var(--text-muted)">- String in .rodata section</text>
  <text x="677.4999" y="309.8611" font-size="13.9044" fill="var(--text-muted)">- sizeof(str) == 8 (pointer)</text>
  <text x="677.4999" y="334.0277" font-size="13.9044" fill="var(--danger-accent)">- str[0] = 'h'; // SEGFAULT!</text>
  <rect x="105.625" y="402.5" width="1068.7499" height="136.9444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="434.7223" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--text)">strlen() vs sizeof()</text>
  <text x="358.75" y="470.9723" text-anchor="middle" font-size="15.6425" fill="var(--text)">strlen("Hello") = 5</text>
  <text x="358.75" y="497.5556" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">Counts chars until '\0'</text>
  <text x="358.75" y="520.1111" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">Runtime function, O(n)</text>
  <text x="846.2499" y="470.9723" text-anchor="middle" font-size="15.6425" fill="var(--text)">sizeof("Hello") = 6</text>
  <text x="846.2499" y="497.5556" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">Includes null terminator</text>
  <text x="846.2499" y="520.1111" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">Compile-time operator</text>
</svg>
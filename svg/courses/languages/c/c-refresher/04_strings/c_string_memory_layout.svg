<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="62.2222" y="46.2222" font-size="19.5556" font-weight="bold" fill="var(--text)" font-family="monospace">char *str = "Hello";</text>
  <rect x="35.5556" y="62.2222" width="71.1111" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="71.1111" y="86.2222" text-anchor="middle" font-size="17.7778" fill="var(--text)">'H'</text>
  <text x="71.1111" y="104.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">0x48</text>
  <rect x="110.2222" y="62.2222" width="71.1111" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="145.7778" y="86.2222" text-anchor="middle" font-size="17.7778" fill="var(--text)">'e'</text>
  <text x="145.7778" y="104.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">0x65</text>
  <rect x="184.8889" y="62.2222" width="71.1111" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="220.4444" y="86.2222" text-anchor="middle" font-size="17.7778" fill="var(--text)">'l'</text>
  <text x="220.4444" y="104.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">0x6C</text>
  <rect x="259.5556" y="62.2222" width="71.1111" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="295.1111" y="86.2222" text-anchor="middle" font-size="17.7778" fill="var(--text)">'l'</text>
  <text x="295.1111" y="104.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">0x6C</text>
  <rect x="334.2222" y="62.2222" width="71.1111" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="369.7778" y="86.2222" text-anchor="middle" font-size="17.7778" fill="var(--text)">'o'</text>
  <text x="369.7778" y="104.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">0x6F</text>
  <rect x="408.8889" y="62.2222" width="71.1111" height="53.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="444.4444" y="86.2222" text-anchor="middle" font-size="17.7778" fill="var(--danger-accent)">'\0'</text>
  <text x="444.4444" y="104.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">0x00</text>
  <text x="613.3333" y="97.7778" font-size="15.1111" fill="var(--danger-accent)" font-weight="bold">Null terminator</text>
  <line x1="611.5556" y1="92.4444" x2="487.1111" y2="92.4444" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="684.4444" y="62.2222" width="355.5556" height="71.1111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="862.2222" y="92.4444" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">str (pointer)</text>
  <text x="862.2222" y="117.3333" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">stores address: 0x1000</text>
  <line x1="684.4444" y1="97.7778" x2="493.3333" y2="97.7778" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow-primary)" />
  <rect x="62.2222" y="177.7778" width="471.1111" height="186.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="297.7778" y="211.5556" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text)" font-family="monospace">char str[] = "Hello";</text>
  <text x="88.8889" y="244.4444" font-size="14.2222" fill="var(--text-muted)">- Array on stack (6 bytes)</text>
  <text x="88.8889" y="271.1111" font-size="14.2222" fill="var(--text-muted)">- Modifiable contents</text>
  <text x="88.8889" y="297.7778" font-size="14.2222" fill="var(--text-muted)">- sizeof(str) == 6</text>
  <text x="88.8889" y="324.4444" font-size="14.2222" fill="var(--primary-accent)">- str[0] = 'h'; // OK</text>
  <rect x="577.7778" y="177.7778" width="497.7778" height="186.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="826.6667" y="211.5556" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--text)" font-family="monospace">char *str = "Hello";</text>
  <text x="604.4444" y="244.4444" font-size="14.2222" fill="var(--text-muted)">- Pointer to read-only data</text>
  <text x="604.4444" y="271.1111" font-size="14.2222" fill="var(--text-muted)">- String in .rodata section</text>
  <text x="604.4444" y="297.7778" font-size="14.2222" fill="var(--text-muted)">- sizeof(str) == 8 (pointer)</text>
  <text x="604.4444" y="324.4444" font-size="14.2222" fill="var(--danger-accent)">- str[0] = 'h'; // SEGFAULT!</text>
  <rect x="62.2222" y="400" width="1013.3333" height="151.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="435.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--text)">strlen() vs sizeof()</text>
  <text x="302.2222" y="475.5556" text-anchor="middle" font-size="16" fill="var(--text)">strlen("Hello") = 5</text>
  <text x="302.2222" y="504.8889" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Counts chars until '\0'</text>
  <text x="302.2222" y="529.7778" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Runtime function, O(n)</text>
  <text x="764.4444" y="475.5556" text-anchor="middle" font-size="16" fill="var(--text)">sizeof("Hello") = 6</text>
  <text x="764.4444" y="504.8889" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Includes null terminator</text>
  <text x="764.4444" y="529.7778" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Compile-time operator</text>
</svg>
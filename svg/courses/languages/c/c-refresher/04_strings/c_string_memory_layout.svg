  <ns0:text x="71.1111" y="104.8889" text-anchor="middle" font-size="12.4444" fill="#555555">0x48</ns0:text>
  <ns0:rect x="110.2222" y="62.2222" width="71.1111" height="53.3333" rx="6.2222" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="145.7778" y="86.2222" text-anchor="middle" font-size="17.7778" fill="#222222">'e'</ns0:text>
  <ns0:text x="145.7778" y="104.8889" text-anchor="middle" font-size="12.4444" fill="#555555">0x65</ns0:text>
  <ns0:rect x="184.8889" y="62.2222" width="71.1111" height="53.3333" rx="6.2222" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="220.4444" y="86.2222" text-anchor="middle" font-size="17.7778" fill="#222222">'l'</ns0:text>
  <ns0:text x="220.4444" y="104.8889" text-anchor="middle" font-size="12.4444" fill="#555555">0x6C</ns0:text>
  <ns0:rect x="259.5556" y="62.2222" width="71.1111" height="53.3333" rx="6.2222" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="295.1111" y="86.2222" text-anchor="middle" font-size="17.7778" fill="#222222">'l'</ns0:text>
  <ns0:text x="295.1111" y="104.8889" text-anchor="middle" font-size="12.4444" fill="#555555">0x6C</ns0:text>
  <ns0:rect x="334.2222" y="62.2222" width="71.1111" height="53.3333" rx="6.2222" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="369.7778" y="86.2222" text-anchor="middle" font-size="17.7778" fill="#222222">'o'</ns0:text>
  <ns0:text x="369.7778" y="104.8889" text-anchor="middle" font-size="12.4444" fill="#555555">0x6F</ns0:text>
  <ns0:rect x="408.8889" y="62.2222" width="71.1111" height="53.3333" rx="6.2222" fill="#fce4ec" stroke="#e53935" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="444.4444" y="86.2222" text-anchor="middle" font-size="17.7778" fill="#e53935">'\0'</ns0:text>
  <ns0:text x="444.4444" y="104.8889" text-anchor="middle" font-size="12.4444" fill="#555555">0x00</ns0:text>
  <ns0:text x="613.3333" y="97.7778" font-size="15.1111" fill="#e53935" font-weight="bold">Null terminator</ns0:text>
  <ns0:line x1="611.5556" y1="92.4444" x2="487.1111" y2="92.4444" stroke="#e53935" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="684.4444" y="62.2222" width="355.5556" height="71.1111" rx="6.2222" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="862.2222" y="92.4444" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">str (pointer)</ns0:text>
  <ns0:text x="862.2222" y="117.3333" text-anchor="middle" font-size="14.2222" fill="#555555">stores address: 0x1000</ns0:text>
  <ns0:line x1="684.4444" y1="97.7778" x2="493.3333" y2="97.7778" stroke="#1565c0" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow-accent)" />
  <ns0:rect x="62.2222" y="177.7778" width="471.1111" height="186.6667" rx="7.1111" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="297.7778" y="211.5556" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#222222" font-family="monospace">char str[] = "Hello";</ns0:text>
  <ns0:text x="88.8889" y="244.4444" font-size="14.2222" fill="#555555">- Array on stack (6 bytes)</ns0:text>
  <ns0:text x="88.8889" y="271.1111" font-size="14.2222" fill="#555555">- Modifiable contents</ns0:text>
  <ns0:text x="88.8889" y="297.7778" font-size="14.2222" fill="#555555">- sizeof(str) == 6</ns0:text>
  <ns0:text x="88.8889" y="324.4444" font-size="14.2222" fill="#1e88e5">- str[0] = 'h'; // OK</ns0:text>
  <ns0:rect x="577.7778" y="177.7778" width="497.7778" height="186.6667" rx="7.1111" fill="#fff8e1" stroke="#f9a825" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="826.6667" y="211.5556" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="#222222" font-family="monospace">char *str = "Hello";</ns0:text>
  <ns0:text x="604.4444" y="244.4444" font-size="14.2222" fill="#555555">- Pointer to read-only data</ns0:text>
  <ns0:text x="604.4444" y="271.1111" font-size="14.2222" fill="#555555">- String in .rodata section</ns0:text>
  <ns0:text x="604.4444" y="297.7778" font-size="14.2222" fill="#555555">- sizeof(str) == 8 (pointer)</ns0:text>
  <ns0:text x="604.4444" y="324.4444" font-size="14.2222" fill="#e53935">- str[0] = 'h'; // SEGFAULT!</ns0:text>
  <ns0:rect x="62.2222" y="400" width="1013.3333" height="151.1111" rx="7.1111" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.7778" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="435.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#222222">strlen() vs sizeof()</ns0:text>
  <ns0:text x="302.2222" y="475.5556" text-anchor="middle" font-size="16" fill="#222222">strlen("Hello") = 5</ns0:text>
  <ns0:text x="302.2222" y="504.8889" text-anchor="middle" font-size="14.2222" fill="#555555">Counts chars until '\0'</ns0:text>
  <ns0:text x="302.2222" y="529.7778" text-anchor="middle" font-size="14.2222" fill="#555555">Runtime function, O(n)</ns0:text>
  <ns0:text x="764.4444" y="475.5556" text-anchor="middle" font-size="16" fill="#222222">sizeof("Hello") = 6</ns0:text>
  <ns0:text x="764.4444" y="504.8889" text-anchor="middle" font-size="14.2222" fill="#555555">Includes null terminator</ns0:text>
  <ns0:text x="764.4444" y="529.7778" text-anchor="middle" font-size="14.2222" fill="#555555">Compile-time operator</ns0:text>
</ns0:svg>
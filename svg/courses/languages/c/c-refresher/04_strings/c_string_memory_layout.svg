<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="375" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">C String Memory Layout</text>
  <!-- String literal -->
  <text x="40" y="70" font-size="14" font-weight="bold" fill="#333">char *str = "Hello";</text>
  <!-- Memory cells -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="50" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
    <text x="25" y="18" text-anchor="middle" font-size="14" fill="#333">'H'</text>
    <text x="25" y="34" text-anchor="middle" font-size="9" fill="#555">0x48</text>
    <rect x="52" y="0" width="50" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
    <text x="77" y="18" text-anchor="middle" font-size="14" fill="#333">'e'</text>
    <text x="77" y="34" text-anchor="middle" font-size="9" fill="#555">0x65</text>
    <rect x="104" y="0" width="50" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
    <text x="129" y="18" text-anchor="middle" font-size="14" fill="#333">'l'</text>
    <text x="129" y="34" text-anchor="middle" font-size="9" fill="#555">0x6C</text>
    <rect x="156" y="0" width="50" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
    <text x="181" y="18" text-anchor="middle" font-size="14" fill="#333">'l'</text>
    <text x="181" y="34" text-anchor="middle" font-size="9" fill="#555">0x6C</text>
    <rect x="208" y="0" width="50" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
    <text x="233" y="18" text-anchor="middle" font-size="14" fill="#333">'o'</text>
    <text x="233" y="34" text-anchor="middle" font-size="9" fill="#555">0x6F</text>
    <rect x="260" y="0" width="50" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
    <text x="285" y="18" text-anchor="middle" font-size="14" fill="#333">'\0'</text>
    <text x="285" y="34" text-anchor="middle" font-size="9" fill="#555">0x00</text>
  </g>
  <text x="400" y="115" font-size="12" fill="#dc3545" font-weight="bold">Null terminator</text>
  <line x1="370" y1="108" x2="350" y2="108" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Pointer variable -->
  <rect x="450" y="85" width="250" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="575" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">str (pointer)</text>
  <text x="575" y="125" text-anchor="middle" font-size="11" fill="#555">stores address: 0x1000</text>
  <line x1="450" y1="110" x2="350" y2="105" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Array vs Pointer -->
  <rect x="40" y="160" width="320" height="120" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="200" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">char str[] = "Hello";</text>
  <text x="55" y="210" font-size="11" fill="#555">- Array on stack (6 bytes)</text>
  <text x="55" y="230" font-size="11" fill="#555">- Modifiable contents</text>
  <text x="55" y="250" font-size="11" fill="#555">- sizeof(str) == 6</text>
  <text x="55" y="270" font-size="11" fill="#28a745">- str[0] = 'h'; // OK</text>
  <rect x="390" y="160" width="320" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="550" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">char *str = "Hello";</text>
  <text x="405" y="210" font-size="11" fill="#555">- Pointer to read-only data</text>
  <text x="405" y="230" font-size="11" fill="#555">- String in .rodata section</text>
  <text x="405" y="250" font-size="11" fill="#555">- sizeof(str) == 8 (pointer)</text>
  <text x="405" y="270" font-size="11" fill="#dc3545">- str[0] = 'h'; // SEGFAULT!</text>
  <!-- strlen vs sizeof -->
  <rect x="40" y="310" width="670" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="375" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">strlen() vs sizeof()</text>
  <text x="200" y="370" text-anchor="middle" font-size="12" fill="#333">strlen("Hello") = 5</text>
  <text x="200" y="395" text-anchor="middle" font-size="11" fill="#555">Counts chars until '\0'</text>
  <text x="200" y="415" text-anchor="middle" font-size="11" fill="#555">Runtime function, O(n)</text>
  <text x="500" y="370" text-anchor="middle" font-size="12" fill="#333">sizeof("Hello") = 6</text>
  <text x="500" y="395" text-anchor="middle" font-size="11" fill="#555">Includes null terminator</text>
  <text x="500" y="415" text-anchor="middle" font-size="11" fill="#555">Compile-time operator</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Code -->
  <text x="70" y="52" font-size="22" font-weight="bold" fill="#222222" font-family="monospace">char *str = "Hello";</text>

  <!-- Characters in memory (heap/rodata) -->
  <rect x="40" y="70" width="80" height="60" rx="7" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="97" text-anchor="middle" font-size="20" fill="#222222">'H'</text>
  <text x="80" y="118" text-anchor="middle" font-size="14" fill="#555555">0x48</text>

  <rect x="124" y="70" width="80" height="60" rx="7" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="164" y="97" text-anchor="middle" font-size="20" fill="#222222">'e'</text>
  <text x="164" y="118" text-anchor="middle" font-size="14" fill="#555555">0x65</text>

  <rect x="208" y="70" width="80" height="60" rx="7" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="248" y="97" text-anchor="middle" font-size="20" fill="#222222">'l'</text>
  <text x="248" y="118" text-anchor="middle" font-size="14" fill="#555555">0x6C</text>

  <rect x="292" y="70" width="80" height="60" rx="7" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="332" y="97" text-anchor="middle" font-size="20" fill="#222222">'l'</text>
  <text x="332" y="118" text-anchor="middle" font-size="14" fill="#555555">0x6C</text>

  <rect x="376" y="70" width="80" height="60" rx="7" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="416" y="97" text-anchor="middle" font-size="20" fill="#222222">'o'</text>
  <text x="416" y="118" text-anchor="middle" font-size="14" fill="#555555">0x6F</text>

  <rect x="460" y="70" width="80" height="60" rx="7" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="97" text-anchor="middle" font-size="20" fill="#e53935">'\0'</text>
  <text x="500" y="118" text-anchor="middle" font-size="14" fill="#555555">0x00</text>

  <!-- Null terminator label -->
  <text x="690" y="110" font-size="17" fill="#e53935" font-weight="bold">Null terminator</text>
  <line x1="688" y1="104" x2="548" y2="104" stroke="#e53935" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pointer box -->
  <rect x="770" y="70" width="400" height="80" rx="7" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="970" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">str (pointer)</text>
  <text x="970" y="132" text-anchor="middle" font-size="16" fill="#555555">stores address: 0x1000</text>
  <line x1="770" y1="110" x2="555" y2="110" stroke="#1565c0" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow-accent)"/>

  <!-- Two comparison boxes -->
  <rect x="70" y="200" width="530" height="210" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222" font-family="monospace">char str[] = "Hello";</text>
  <text x="100" y="275" font-size="16" fill="#555555">- Array on stack (6 bytes)</text>
  <text x="100" y="305" font-size="16" fill="#555555">- Modifiable contents</text>
  <text x="100" y="335" font-size="16" fill="#555555">- sizeof(str) == 6</text>
  <text x="100" y="365" font-size="16" fill="#1e88e5">- str[0] = 'h'; // OK</text>

  <rect x="650" y="200" width="560" height="210" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222" font-family="monospace">char *str = "Hello";</text>
  <text x="680" y="275" font-size="16" fill="#555555">- Pointer to read-only data</text>
  <text x="680" y="305" font-size="16" fill="#555555">- String in .rodata section</text>
  <text x="680" y="335" font-size="16" fill="#555555">- sizeof(str) == 8 (pointer)</text>
  <text x="680" y="365" font-size="16" fill="#e53935">- str[0] = 'h'; // SEGFAULT!</text>

  <!-- strlen vs sizeof box -->
  <rect x="70" y="450" width="1140" height="170" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="490" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">strlen() vs sizeof()</text>
  <text x="340" y="535" text-anchor="middle" font-size="18" fill="#222222">strlen("Hello") = 5</text>
  <text x="340" y="568" text-anchor="middle" font-size="16" fill="#555555">Counts chars until '\0'</text>
  <text x="340" y="596" text-anchor="middle" font-size="16" fill="#555555">Runtime function, O(n)</text>
  <text x="860" y="535" text-anchor="middle" font-size="18" fill="#222222">sizeof("Hello") = 6</text>
  <text x="860" y="568" text-anchor="middle" font-size="16" fill="#555555">Includes null terminator</text>
  <text x="860" y="596" text-anchor="middle" font-size="16" fill="#555555">Compile-time operator</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="17.0667" markerHeight="11.2" refX="17.0667" refY="5.6" orient="auto">
      <polygon points="0,16 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">C String Memory Layout</text>
  <text x="68.2667" y="112" font-size="22.4" font-weight="bold" fill="#333">char *str = "Hello";</text>
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="85.3333" height="64" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
    <text x="42.6667" y="28.8" text-anchor="middle" font-size="22.4" fill="#333">'H'</text>
    <text x="42.6667" y="54.4" text-anchor="middle" font-size="16" fill="#555">0x48</text>
    <rect x="88.7467" y="0" width="85.3333" height="64" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
    <text x="131.4133" y="28.8" text-anchor="middle" font-size="22.4" fill="#333">'e'</text>
    <text x="131.4133" y="54.4" text-anchor="middle" font-size="16" fill="#555">0x65</text>
    <rect x="177.4933" y="0" width="85.3333" height="64" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
    <text x="220.16" y="28.8" text-anchor="middle" font-size="22.4" fill="#333">'l'</text>
    <text x="220.16" y="54.4" text-anchor="middle" font-size="16" fill="#555">0x6C</text>
    <rect x="266.24" y="0" width="85.3333" height="64" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
    <text x="308.9067" y="28.8" text-anchor="middle" font-size="22.4" fill="#333">'l'</text>
    <text x="308.9067" y="54.4" text-anchor="middle" font-size="16" fill="#555">0x6C</text>
    <rect x="354.9867" y="0" width="85.3333" height="64" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
    <text x="397.6533" y="28.8" text-anchor="middle" font-size="22.4" fill="#333">'o'</text>
    <text x="397.6533" y="54.4" text-anchor="middle" font-size="16" fill="#555">0x6F</text>
    <rect x="443.7333" y="0" width="85.3333" height="64" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
    <text x="486.4" y="28.8" text-anchor="middle" font-size="22.4" fill="#333">'\0'</text>
    <text x="486.4" y="54.4" text-anchor="middle" font-size="16" fill="#555">0x00</text>
  </g>
  <text x="682.6667" y="184" font-size="19.2" fill="#dc3545" font-weight="bold">Null terminator</text>
  <line x1="631.4667" y1="172.8" x2="597.3333" y2="172.8" stroke="#dc3545" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="768" y="136" width="426.6667" height="80" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="981.3333" y="171.2" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">str (pointer)</text>
  <text x="981.3333" y="200" text-anchor="middle" font-size="17.6" fill="#555">stores address: 0x1000</text>
  <line x1="768" y1="176" x2="597.3333" y2="168" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="68.2667" y="256" width="546.1333" height="192" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="341.3333" y="296" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">char str[] = "Hello";</text>
  <text x="93.8667" y="336" font-size="17.6" fill="#555">- Array on stack (6 bytes)</text>
  <text x="93.8667" y="368" font-size="17.6" fill="#555">- Modifiable contents</text>
  <text x="93.8667" y="400" font-size="17.6" fill="#555">- sizeof(str) == 6</text>
  <text x="93.8667" y="432" font-size="17.6" fill="#28a745">- str[0] = 'h'; // OK</text>
  <rect x="665.6" y="256" width="546.1333" height="192" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="938.6667" y="296" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">char *str = "Hello";</text>
  <text x="691.2" y="336" font-size="17.6" fill="#555">- Pointer to read-only data</text>
  <text x="691.2" y="368" font-size="17.6" fill="#555">- String in .rodata section</text>
  <text x="691.2" y="400" font-size="17.6" fill="#555">- sizeof(str) == 8 (pointer)</text>
  <text x="691.2" y="432" font-size="17.6" fill="#dc3545">- str[0] = 'h'; // SEGFAULT!</text>
  <rect x="68.2667" y="496" width="1143.4667" height="192" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="640" y="544" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">strlen() vs sizeof()</text>
  <text x="341.3333" y="592" text-anchor="middle" font-size="19.2" fill="#333">strlen("Hello") = 5</text>
  <text x="341.3333" y="632" text-anchor="middle" font-size="17.6" fill="#555">Counts chars until '\0'</text>
  <text x="341.3333" y="664" text-anchor="middle" font-size="17.6" fill="#555">Runtime function, O(n)</text>
  <text x="853.3333" y="592" text-anchor="middle" font-size="19.2" fill="#333">sizeof("Hello") = 6</text>
  <text x="853.3333" y="632" text-anchor="middle" font-size="17.6" fill="#555">Includes null terminator</text>
  <text x="853.3333" y="664" text-anchor="middle" font-size="17.6" fill="#555">Compile-time operator</text>
</svg>
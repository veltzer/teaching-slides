<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="33.524574" font-weight="bold" fill="var(--text)" font-family="Courier New, monospace">char greeting[] = "Hello";</text>
  <rect x="40" y="82.439093" width="193.103472" height="183.902619" rx="9.644307" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="136.551736" y="164.487854" text-anchor="middle" font-size="36.318369" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">'H'</text>
  <text x="136.551736" y="223.902619" text-anchor="middle" font-size="25.143511" fill="var(--text-faint)" font-family="Courier New, monospace">0x48</text>
  <rect x="238.620714" y="82.439093" width="193.103472" height="183.902619" rx="9.644307" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335.17245" y="164.487854" text-anchor="middle" font-size="36.318369" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">'e'</text>
  <text x="335.17245" y="223.902619" text-anchor="middle" font-size="25.143511" fill="var(--text-faint)" font-family="Courier New, monospace">0x65</text>
  <rect x="437.241428" y="82.439093" width="193.103472" height="183.902619" rx="9.644307" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="533.793164" y="164.487854" text-anchor="middle" font-size="36.318369" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">'l'</text>
  <text x="533.793164" y="223.902619" text-anchor="middle" font-size="25.143511" fill="var(--text-faint)" font-family="Courier New, monospace">0x6C</text>
  <rect x="635.862142" y="82.439093" width="193.103472" height="183.902619" rx="9.644307" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="732.413878" y="164.487854" text-anchor="middle" font-size="36.318369" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">'l'</text>
  <text x="732.413878" y="223.902619" text-anchor="middle" font-size="25.143511" fill="var(--text-faint)" font-family="Courier New, monospace">0x6C</text>
  <rect x="834.482856" y="82.439093" width="193.103472" height="183.902619" rx="9.644307" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="931.034592" y="164.487854" text-anchor="middle" font-size="36.318369" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">'o'</text>
  <text x="931.034592" y="223.902619" text-anchor="middle" font-size="25.143511" fill="var(--text-faint)" font-family="Courier New, monospace">0x6F</text>
  <rect x="1033.10357" y="82.439093" width="193.103472" height="183.902619" rx="9.644307" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1129.655306" y="164.487854" text-anchor="middle" font-size="36.318369" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">'\0'</text>
  <text x="1129.655306" y="223.902619" text-anchor="middle" font-size="25.143511" fill="var(--text-faint)" font-family="Courier New, monospace">0x00</text>
  <text x="136.551736" y="320.097627" text-anchor="middle" font-size="25.143511" fill="var(--text-faint)" font-family="Arial, sans-serif">[0]</text>
  <text x="335.17245" y="320.097627" text-anchor="middle" font-size="25.143511" fill="var(--text-faint)" font-family="Arial, sans-serif">[1]</text>
  <text x="533.793164" y="320.097627" text-anchor="middle" font-size="25.143511" fill="var(--text-faint)" font-family="Arial, sans-serif">[2]</text>
  <text x="732.413878" y="320.097627" text-anchor="middle" font-size="25.143511" fill="var(--text-faint)" font-family="Arial, sans-serif">[3]</text>
  <text x="931.034592" y="320.097627" text-anchor="middle" font-size="25.143511" fill="var(--text-faint)" font-family="Arial, sans-serif">[4]</text>
  <text x="1129.655306" y="320.097627" text-anchor="middle" font-size="25.143511" fill="var(--text-faint)" font-family="Arial, sans-serif">[5]</text>
  <rect x="40" y="379.512217" width="1200" height="240.487783" rx="9.644307" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999926" y="453.073405" text-anchor="middle" font-size="30.73094" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">sizeof(greeting) = 6  (includes '\0')</text>
  <text x="639.999926" y="540.780664" text-anchor="middle" font-size="30.73094" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">strlen(greeting) = 5  (excludes '\0')</text>
</svg>

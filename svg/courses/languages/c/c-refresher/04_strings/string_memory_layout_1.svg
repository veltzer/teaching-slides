<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" font-family="Arial, sans-serif">
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">String Memory Layout: char[]</text>
  <text x="50" y="55" font-size="12" font-weight="bold" fill="#333" font-family="monospace">char greeting[] = "Hello";</text>
  <!-- Cells -->
  <rect x="60" y="70" width="70" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="95" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">'H'</text>
  <text x="95" y="108" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">0x48</text>
  <rect x="130" y="70" width="70" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="165" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">'e'</text>
  <text x="165" y="108" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">0x65</text>
  <rect x="200" y="70" width="70" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="235" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">'l'</text>
  <text x="235" y="108" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">0x6C</text>
  <rect x="270" y="70" width="70" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="305" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">'l'</text>
  <text x="305" y="108" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">0x6C</text>
  <rect x="340" y="70" width="70" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">'o'</text>
  <text x="375" y="108" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">0x6F</text>
  <rect x="410" y="70" width="70" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="445" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">'\0'</text>
  <text x="445" y="108" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">0x00</text>
  <!-- Index labels -->
  <text x="95" y="140" text-anchor="middle" font-size="10" fill="#666">[0]</text>
  <text x="165" y="140" text-anchor="middle" font-size="10" fill="#666">[1]</text>
  <text x="235" y="140" text-anchor="middle" font-size="10" fill="#666">[2]</text>
  <text x="305" y="140" text-anchor="middle" font-size="10" fill="#666">[3]</text>
  <text x="375" y="140" text-anchor="middle" font-size="10" fill="#666">[4]</text>
  <text x="445" y="140" text-anchor="middle" font-size="10" fill="#666">[5]</text>
  <!-- Info -->
  <rect x="60" y="160" width="420" height="65" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="270" y="183" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">sizeof(greeting) = 6  (includes '\0')</text>
  <text x="270" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">strlen(greeting) = 5  (excludes '\0')</text>
</svg>
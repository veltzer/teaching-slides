<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="128" y="80" font-size="24" font-weight="bold" fill="#222222" font-family="monospace">char greeting[] = "Hello";</text>

  <!-- Character cells -->
  <rect x="128" y="110" width="140" height="130" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="198" y="168" text-anchor="middle" font-size="26" font-weight="bold" fill="#222222">'H'</text>
  <text x="198" y="210" text-anchor="middle" font-size="18" fill="#888888" font-family="monospace">0x48</text>

  <rect x="272" y="110" width="140" height="130" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="342" y="168" text-anchor="middle" font-size="26" font-weight="bold" fill="#222222">'e'</text>
  <text x="342" y="210" text-anchor="middle" font-size="18" fill="#888888" font-family="monospace">0x65</text>

  <rect x="416" y="110" width="140" height="130" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="486" y="168" text-anchor="middle" font-size="26" font-weight="bold" fill="#222222">'l'</text>
  <text x="486" y="210" text-anchor="middle" font-size="18" fill="#888888" font-family="monospace">0x6C</text>

  <rect x="560" y="110" width="140" height="130" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="630" y="168" text-anchor="middle" font-size="26" font-weight="bold" fill="#222222">'l'</text>
  <text x="630" y="210" text-anchor="middle" font-size="18" fill="#888888" font-family="monospace">0x6C</text>

  <rect x="704" y="110" width="140" height="130" rx="10" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="774" y="168" text-anchor="middle" font-size="26" font-weight="bold" fill="#222222">'o'</text>
  <text x="774" y="210" text-anchor="middle" font-size="18" fill="#888888" font-family="monospace">0x6F</text>

  <!-- Null terminator - highlighted red -->
  <rect x="848" y="110" width="140" height="130" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="3" filter="url(#shadow)"/>
  <text x="918" y="168" text-anchor="middle" font-size="26" font-weight="bold" fill="#e53935">'\0'</text>
  <text x="918" y="210" text-anchor="middle" font-size="18" fill="#888888" font-family="monospace">0x00</text>

  <!-- Index labels -->
  <text x="198" y="278" text-anchor="middle" font-size="18" fill="#888888">[0]</text>
  <text x="342" y="278" text-anchor="middle" font-size="18" fill="#888888">[1]</text>
  <text x="486" y="278" text-anchor="middle" font-size="18" fill="#888888">[2]</text>
  <text x="630" y="278" text-anchor="middle" font-size="18" fill="#888888">[3]</text>
  <text x="774" y="278" text-anchor="middle" font-size="18" fill="#888888">[4]</text>
  <text x="918" y="278" text-anchor="middle" font-size="18" fill="#888888">[5]</text>

  <!-- Info box -->
  <rect x="128" y="320" width="870" height="170" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="563" y="372" text-anchor="middle" font-size="22" fill="#222222" font-weight="bold">sizeof(greeting) = 6  (includes '\0')</text>
  <text x="563" y="434" text-anchor="middle" font-size="22" fill="#222222" font-weight="bold">strlen(greeting) = 5  (excludes '\0')</text>
</svg>

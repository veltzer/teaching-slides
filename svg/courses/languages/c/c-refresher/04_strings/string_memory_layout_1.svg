<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="113.7778" y="71.1111" font-size="21.3333" font-weight="bold" fill="var(--text)" font-family="monospace">char greeting[] = "Hello";</text>
  <rect x="113.7778" y="97.7778" width="124.4444" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="176" y="149.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">'H'</text>
  <text x="176" y="186.6667" text-anchor="middle" font-size="16" fill="var(--text-faint)" font-family="monospace">0x48</text>
  <rect x="241.7778" y="97.7778" width="124.4444" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="304" y="149.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">'e'</text>
  <text x="304" y="186.6667" text-anchor="middle" font-size="16" fill="var(--text-faint)" font-family="monospace">0x65</text>
  <rect x="369.7778" y="97.7778" width="124.4444" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="432" y="149.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">'l'</text>
  <text x="432" y="186.6667" text-anchor="middle" font-size="16" fill="var(--text-faint)" font-family="monospace">0x6C</text>
  <rect x="497.7778" y="97.7778" width="124.4444" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="560" y="149.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">'l'</text>
  <text x="560" y="186.6667" text-anchor="middle" font-size="16" fill="var(--text-faint)" font-family="monospace">0x6C</text>
  <rect x="625.7778" y="97.7778" width="124.4444" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="688" y="149.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">'o'</text>
  <text x="688" y="186.6667" text-anchor="middle" font-size="16" fill="var(--text-faint)" font-family="monospace">0x6F</text>
  <rect x="753.7778" y="97.7778" width="124.4444" height="115.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="816" y="149.3333" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--danger-accent)">'\0'</text>
  <text x="816" y="186.6667" text-anchor="middle" font-size="16" fill="var(--text-faint)" font-family="monospace">0x00</text>
  <text x="176" y="247.1111" text-anchor="middle" font-size="16" fill="var(--text-faint)">[0]</text>
  <text x="304" y="247.1111" text-anchor="middle" font-size="16" fill="var(--text-faint)">[1]</text>
  <text x="432" y="247.1111" text-anchor="middle" font-size="16" fill="var(--text-faint)">[2]</text>
  <text x="560" y="247.1111" text-anchor="middle" font-size="16" fill="var(--text-faint)">[3]</text>
  <text x="688" y="247.1111" text-anchor="middle" font-size="16" fill="var(--text-faint)">[4]</text>
  <text x="816" y="247.1111" text-anchor="middle" font-size="16" fill="var(--text-faint)">[5]</text>
  <rect x="113.7778" y="284.4444" width="773.3333" height="151.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="500.4444" y="330.6667" text-anchor="middle" font-size="19.5556" fill="var(--text)" font-weight="bold">sizeof(greeting) = 6  (includes '\0')</text>
  <text x="500.4444" y="385.7778" text-anchor="middle" font-size="19.5556" fill="var(--text)" font-weight="bold">strlen(greeting) = 5  (excludes '\0')</text>
</svg>
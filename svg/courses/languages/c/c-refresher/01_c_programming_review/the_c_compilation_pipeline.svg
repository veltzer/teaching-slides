<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="203.208556" height="349.589168" rx="9.000769" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="40" y="40" width="203.208556" height="63.561792" rx="9.000769" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="84.493235" width="203.208556" height="19.068557" fill="url(#grad-primary)" rx="9.000769" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="141.604278" y="81.315175" font-size="23.465754" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Source</text>
  <text x="141.604278" y="148.054831" font-size="20.858381" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(.c / .h)</text>
  <text x="141.604278" y="230.684785" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">#include</text>
  <text x="141.604278" y="270.411029" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">#define</text>
  <text x="141.604278" y="310.137075" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">#ifdef</text>
  <line x1="243.208556" y1="214.794683" x2="280.641711" y2="214.794683" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="283.850267" y="40" width="224.59893" height="349.589168" rx="9.000769" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="283.850267" y="40" width="224.59893" height="63.561792" rx="9.000769" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="283.850267" y="84.493235" width="224.59893" height="19.068557" fill="url(#grad-primary)" rx="9.000769" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="396.149733" y="81.315175" font-size="23.465754" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Preprocessor</text>
  <text x="396.149733" y="148.054831" font-size="20.858381" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(cpp)</text>
  <text x="396.149733" y="230.684785" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">Expands macros</text>
  <text x="396.149733" y="270.411029" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">Includes headers</text>
  <text x="396.149733" y="310.137075" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">Strips comments</text>
  <line x1="508.449198" y1="214.794683" x2="545.882353" y2="214.794683" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="549.090909" y="40" width="203.208556" height="349.589168" rx="9.000769" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="549.090909" y="40" width="203.208556" height="63.561792" rx="9.000769" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="549.090909" y="84.493235" width="203.208556" height="19.068557" fill="url(#grad-primary)" rx="9.000769" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.695187" y="81.315175" font-size="23.465754" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Compiler</text>
  <text x="650.695187" y="148.054831" font-size="20.858381" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(cc1)</text>
  <text x="650.695187" y="230.684785" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">C code</text>
  <text x="650.695187" y="270.411029" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">to assembly</text>
  <text x="650.695187" y="310.137075" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">(.s)</text>
  <line x1="752.299465" y1="214.794683" x2="789.73262" y2="214.794683" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="792.941062" y="40" width="203.208556" height="349.589168" rx="9.000769" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="792.941062" y="40" width="203.208556" height="63.561792" rx="9.000769" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="792.941062" y="84.493235" width="203.208556" height="19.068557" fill="url(#grad-primary)" rx="9.000769" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="894.545455" y="81.315175" font-size="23.465754" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Assembler</text>
  <text x="894.545455" y="148.054831" font-size="20.858381" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(as)</text>
  <text x="894.545455" y="230.684785" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">Assembly</text>
  <text x="894.545455" y="270.411029" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">to object</text>
  <text x="894.545455" y="310.137075" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">files (.o)</text>
  <line x1="996.149619" y1="214.794683" x2="1033.582774" y2="214.794683" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="1036.791444" y="40" width="203.208556" height="349.589168" rx="9.000769" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="1036.791444" y="40" width="203.208556" height="63.561792" rx="9.000769" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1036.791444" y="84.493235" width="203.208556" height="19.068557" fill="url(#grad-primary)" rx="9.000769" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1138.395722" y="81.315175" font-size="23.465754" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">Linker</text>
  <text x="1138.395722" y="148.054831" font-size="20.858381" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(ld)</text>
  <text x="1138.395722" y="230.684785" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">Links objects</text>
  <text x="1138.395722" y="270.411029" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">and libraries</text>
  <text x="1138.395722" y="310.137075" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">executable</text>
  <text x="141.604278" y="453.150764" font-size="18.251009" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Input</text>
  <text x="1138.395722" y="453.150764" font-size="18.251009" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Output</text>
  <line x1="40" y1="564.383457" x2="1240" y2="564.383457" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow-primary)" />
  <text x="640" y="620" font-size="20.858381" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">gcc source.c -o program</text>
</svg>
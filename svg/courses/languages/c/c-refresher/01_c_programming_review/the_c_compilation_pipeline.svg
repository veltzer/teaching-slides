<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="177.7778" width="168.8889" height="195.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="26.6667" y="177.7778" width="168.8889" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="26.6667" y="202.6667" width="168.8889" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="111.1111" y="200.8889" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Source</text>
  <text x="111.1111" y="238.2222" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">(.c / .h)</text>
  <text x="111.1111" y="284.4444" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">#include</text>
  <text x="111.1111" y="306.6667" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">#define</text>
  <text x="111.1111" y="328.8889" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">#ifdef</text>
  <line x1="195.5556" y1="275.5556" x2="226.6667" y2="275.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="229.3333" y="177.7778" width="186.6667" height="195.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="229.3333" y="177.7778" width="186.6667" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="229.3333" y="202.6667" width="186.6667" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="322.6667" y="200.8889" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Preprocessor</text>
  <text x="322.6667" y="238.2222" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">(cpp)</text>
  <text x="322.6667" y="284.4444" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">Expands macros</text>
  <text x="322.6667" y="306.6667" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">Includes headers</text>
  <text x="322.6667" y="328.8889" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">Strips comments</text>
  <line x1="416" y1="275.5556" x2="447.1111" y2="275.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="449.7778" y="177.7778" width="168.8889" height="195.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="449.7778" y="177.7778" width="168.8889" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="449.7778" y="202.6667" width="168.8889" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="534.2222" y="200.8889" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Compiler</text>
  <text x="534.2222" y="238.2222" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">(cc1)</text>
  <text x="534.2222" y="284.4444" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">C code</text>
  <text x="534.2222" y="306.6667" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">to assembly</text>
  <text x="534.2222" y="328.8889" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">(.s)</text>
  <line x1="618.6667" y1="275.5556" x2="649.7778" y2="275.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="652.4444" y="177.7778" width="168.8889" height="195.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="652.4444" y="177.7778" width="168.8889" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="652.4444" y="202.6667" width="168.8889" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="736.8889" y="200.8889" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Assembler</text>
  <text x="736.8889" y="238.2222" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">(as)</text>
  <text x="736.8889" y="284.4444" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">Assembly</text>
  <text x="736.8889" y="306.6667" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">to object</text>
  <text x="736.8889" y="328.8889" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">files (.o)</text>
  <line x1="821.3333" y1="275.5556" x2="852.4444" y2="275.5556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="855.1111" y="177.7778" width="168.8889" height="195.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="855.1111" y="177.7778" width="168.8889" height="35.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="855.1111" y="202.6667" width="168.8889" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="939.5556" y="200.8889" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Linker</text>
  <text x="939.5556" y="238.2222" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">(ld)</text>
  <text x="939.5556" y="284.4444" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">Links objects</text>
  <text x="939.5556" y="306.6667" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">and libraries</text>
  <text x="939.5556" y="328.8889" font-size="12.4444" fill="var(--text-faint)" text-anchor="middle">executable</text>
  <text x="111.1111" y="408.8889" font-size="12.4444" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Input</text>
  <text x="939.5556" y="408.8889" font-size="12.4444" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Output</text>
  <line x1="26.6667" y1="471.1111" x2="1024" y2="471.1111" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow-primary)" />
  <text x="525.3333" y="502.2222" font-size="14.2222" fill="var(--text-muted)" text-anchor="middle">gcc source.c -o program</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="203.208556" height="349.589168" rx="9.000769" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="40" y="40" width="203.208556" height="63.561792" rx="9.000769" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="84.493235" width="203.208556" height="19.068557" fill="var(--primary-fill)" rx="9.000769" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="141.604278" y="81.315175" font-size="23.465754" font-weight="bold" fill="var(--bg)" text-anchor="middle">Source</text>
  <text x="141.604278" y="148.054831" font-size="20.858381" fill="var(--text-muted)" text-anchor="middle">(.c / .h)</text>
  <text x="141.604278" y="230.684785" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">#include</text>
  <text x="141.604278" y="270.411029" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">#define</text>
  <text x="141.604278" y="310.137075" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">#ifdef</text>
  <line x1="243.208556" y1="214.794683" x2="280.641711" y2="214.794683" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="283.850267" y="40" width="224.59893" height="349.589168" rx="9.000769" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="283.850267" y="40" width="224.59893" height="63.561792" rx="9.000769" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="283.850267" y="84.493235" width="224.59893" height="19.068557" fill="var(--primary-fill)" rx="9.000769" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="396.149733" y="81.315175" font-size="23.465754" font-weight="bold" fill="var(--bg)" text-anchor="middle">Preprocessor</text>
  <text x="396.149733" y="148.054831" font-size="20.858381" fill="var(--text-muted)" text-anchor="middle">(cpp)</text>
  <text x="396.149733" y="230.684785" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">Expands macros</text>
  <text x="396.149733" y="270.411029" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">Includes headers</text>
  <text x="396.149733" y="310.137075" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">Strips comments</text>
  <line x1="508.449198" y1="214.794683" x2="545.882353" y2="214.794683" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="549.090909" y="40" width="203.208556" height="349.589168" rx="9.000769" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="549.090909" y="40" width="203.208556" height="63.561792" rx="9.000769" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="549.090909" y="84.493235" width="203.208556" height="19.068557" fill="var(--primary-fill)" rx="9.000769" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="650.695187" y="81.315175" font-size="23.465754" font-weight="bold" fill="var(--bg)" text-anchor="middle">Compiler</text>
  <text x="650.695187" y="148.054831" font-size="20.858381" fill="var(--text-muted)" text-anchor="middle">(cc1)</text>
  <text x="650.695187" y="230.684785" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">C code</text>
  <text x="650.695187" y="270.411029" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">to assembly</text>
  <text x="650.695187" y="310.137075" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">(.s)</text>
  <line x1="752.299465" y1="214.794683" x2="789.73262" y2="214.794683" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="792.941062" y="40" width="203.208556" height="349.589168" rx="9.000769" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="792.941062" y="40" width="203.208556" height="63.561792" rx="9.000769" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="792.941062" y="84.493235" width="203.208556" height="19.068557" fill="var(--primary-fill)" rx="9.000769" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="894.545455" y="81.315175" font-size="23.465754" font-weight="bold" fill="var(--bg)" text-anchor="middle">Assembler</text>
  <text x="894.545455" y="148.054831" font-size="20.858381" fill="var(--text-muted)" text-anchor="middle">(as)</text>
  <text x="894.545455" y="230.684785" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">Assembly</text>
  <text x="894.545455" y="270.411029" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">to object</text>
  <text x="894.545455" y="310.137075" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">files (.o)</text>
  <line x1="996.149619" y1="214.794683" x2="1033.582774" y2="214.794683" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="1036.791444" y="40" width="203.208556" height="349.589168" rx="9.000769" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <rect x="1036.791444" y="40" width="203.208556" height="63.561792" rx="9.000769" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1036.791444" y="84.493235" width="203.208556" height="19.068557" fill="var(--primary-fill)" rx="9.000769" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1138.395722" y="81.315175" font-size="23.465754" font-weight="bold" fill="var(--bg)" text-anchor="middle">Linker</text>
  <text x="1138.395722" y="148.054831" font-size="20.858381" fill="var(--text-muted)" text-anchor="middle">(ld)</text>
  <text x="1138.395722" y="230.684785" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">Links objects</text>
  <text x="1138.395722" y="270.411029" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">and libraries</text>
  <text x="1138.395722" y="310.137075" font-size="18.251009" fill="var(--text-faint)" text-anchor="middle">executable</text>
  <text x="141.604278" y="453.150764" font-size="18.251009" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Input</text>
  <text x="1138.395722" y="453.150764" font-size="18.251009" fill="var(--primary-accent)" text-anchor="middle" font-weight="bold">Output</text>
  <line x1="40" y1="564.383457" x2="1240" y2="564.383457" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="7.1111 3.5556" marker-end="url(#arrow-primary)" />
  <text x="640" y="620" font-size="20.858381" fill="var(--text-muted)" text-anchor="middle">gcc source.c -o program</text>
</svg>
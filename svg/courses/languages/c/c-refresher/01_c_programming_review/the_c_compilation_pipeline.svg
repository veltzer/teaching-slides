<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Stage boxes -->
  <rect x="30" y="200" width="190" height="220" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="200" width="190" height="40" rx="8" fill="url(#grad-accent)"/>
  <rect x="30" y="228" width="190" height="12" fill="url(#grad-accent)"/>
  <text x="125" y="226" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Source</text>
  <text x="125" y="268" font-size="16" fill="#555555" text-anchor="middle">(.c / .h)</text>
  <text x="125" y="320" font-size="14" fill="#888888" text-anchor="middle">#include</text>
  <text x="125" y="345" font-size="14" fill="#888888" text-anchor="middle">#define</text>
  <text x="125" y="370" font-size="14" fill="#888888" text-anchor="middle">#ifdef</text>

  <line x1="220" y1="310" x2="255" y2="310" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="258" y="200" width="210" height="220" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="258" y="200" width="210" height="40" rx="8" fill="url(#grad-accent)"/>
  <rect x="258" y="228" width="210" height="12" fill="url(#grad-accent)"/>
  <text x="363" y="226" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Preprocessor</text>
  <text x="363" y="268" font-size="16" fill="#555555" text-anchor="middle">(cpp)</text>
  <text x="363" y="320" font-size="14" fill="#888888" text-anchor="middle">Expands macros</text>
  <text x="363" y="345" font-size="14" fill="#888888" text-anchor="middle">Includes headers</text>
  <text x="363" y="370" font-size="14" fill="#888888" text-anchor="middle">Strips comments</text>

  <line x1="468" y1="310" x2="503" y2="310" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="506" y="200" width="190" height="220" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="506" y="200" width="190" height="40" rx="8" fill="url(#grad-accent)"/>
  <rect x="506" y="228" width="190" height="12" fill="url(#grad-accent)"/>
  <text x="601" y="226" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Compiler</text>
  <text x="601" y="268" font-size="16" fill="#555555" text-anchor="middle">(cc1)</text>
  <text x="601" y="320" font-size="14" fill="#888888" text-anchor="middle">C code</text>
  <text x="601" y="345" font-size="14" fill="#888888" text-anchor="middle">to assembly</text>
  <text x="601" y="370" font-size="14" fill="#888888" text-anchor="middle">(.s)</text>

  <line x1="696" y1="310" x2="731" y2="310" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="734" y="200" width="190" height="220" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="734" y="200" width="190" height="40" rx="8" fill="url(#grad-accent)"/>
  <rect x="734" y="228" width="190" height="12" fill="url(#grad-accent)"/>
  <text x="829" y="226" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Assembler</text>
  <text x="829" y="268" font-size="16" fill="#555555" text-anchor="middle">(as)</text>
  <text x="829" y="320" font-size="14" fill="#888888" text-anchor="middle">Assembly</text>
  <text x="829" y="345" font-size="14" fill="#888888" text-anchor="middle">to object</text>
  <text x="829" y="370" font-size="14" fill="#888888" text-anchor="middle">files (.o)</text>

  <line x1="924" y1="310" x2="959" y2="310" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="962" y="200" width="190" height="220" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="962" y="200" width="190" height="40" rx="8" fill="url(#grad-accent)"/>
  <rect x="962" y="228" width="190" height="12" fill="url(#grad-accent)"/>
  <text x="1057" y="226" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Linker</text>
  <text x="1057" y="268" font-size="16" fill="#555555" text-anchor="middle">(ld)</text>
  <text x="1057" y="320" font-size="14" fill="#888888" text-anchor="middle">Links objects</text>
  <text x="1057" y="345" font-size="14" fill="#888888" text-anchor="middle">and libraries</text>
  <text x="1057" y="370" font-size="14" fill="#888888" text-anchor="middle">executable</text>

  <!-- Labels below -->
  <text x="125" y="460" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">Input</text>
  <text x="1057" y="460" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">Output</text>

  <!-- Overall arrow label -->
  <line x1="30" y1="530" x2="1152" y2="530" stroke="#1e88e5" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow-accent)"/>
  <text x="591" y="565" font-size="16" fill="#555555" text-anchor="middle">gcc source.c -o program</text>
</svg>

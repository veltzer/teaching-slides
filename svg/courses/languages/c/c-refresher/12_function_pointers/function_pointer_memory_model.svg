<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="grad-code" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Section labels row -->
  <rect x="30" y="15" width="360" height="36" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="210" y="38" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">STACK (main)</text>

  <rect x="500" y="15" width="360" height="36" rx="6" fill="var(--ok-dk)" filter="url(#shadow)"/>
  <text x="680" y="38" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">CODE SEGMENT (text)</text>

  <rect x="970" y="15" width="280" height="36" rx="6" fill="var(--warn-mid)" filter="url(#shadow)"/>
  <text x="1110" y="38" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">DISPATCH TABLE</text>

  <!-- ============================================================ -->
  <!-- STACK panel -->
  <!-- ============================================================ -->
  <rect x="30" y="62" width="360" height="200" rx="8" fill="url(#grad-stack)" filter="url(#shadow)" stroke="var(--primary)" stroke-width="1.5"/>

  <!-- Stack variable: op -->
  <rect x="60" y="82" width="300" height="60" rx="6" fill="var(--bg)" stroke="var(--primary-dk)" stroke-width="1.5"/>
  <text x="80" y="105" font-family="monospace" font-size="14" fill="var(--text-muted)">variable: op</text>
  <text x="80" y="127" font-family="monospace" font-size="14" fill="var(--primary-dk)">0x004010a0  ← address of add()</text>

  <!-- Stack variable: a, b -->
  <rect x="60" y="154" width="300" height="48" rx="6" fill="var(--bg)" stroke="var(--primary-dk)" stroke-width="1.5"/>
  <text x="80" y="175" font-family="monospace" font-size="14" fill="var(--text-muted)">a = 3,  b = 4</text>
  <text x="80" y="193" font-family="monospace" font-size="12" fill="var(--text-faint)">int parameters</text>

  <!-- Arrow from op value to code segment -->
  <line x1="363" y1="112" x2="497" y2="112" stroke="var(--primary-dk)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="425" y="106" font-family="sans-serif" font-size="11" fill="var(--primary-dk)" text-anchor="middle">points to</text>

  <!-- ============================================================ -->
  <!-- CODE SEGMENT panel -->
  <!-- ============================================================ -->
  <rect x="500" y="62" width="360" height="200" rx="8" fill="url(#grad-code)" filter="url(#shadow)" stroke="var(--ok-dk)" stroke-width="1.5"/>

  <!-- add() -->
  <rect x="520" y="82" width="148" height="80" rx="6" fill="var(--bg)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="594" y="104" font-family="monospace" font-size="13" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">add()</text>
  <text x="530" y="122" font-family="monospace" font-size="11" fill="var(--text-dark)">0x004010a0:</text>
  <text x="530" y="138" font-family="monospace" font-size="11" fill="var(--text-dark)">  return a + b;</text>
  <text x="530" y="154" font-family="monospace" font-size="11" fill="var(--text-faint)">// body</text>

  <!-- sub() -->
  <rect x="692" y="82" width="148" height="80" rx="6" fill="var(--bg)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="766" y="104" font-family="monospace" font-size="13" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">sub()</text>
  <text x="702" y="122" font-family="monospace" font-size="11" fill="var(--text-dark)">0x004010c0:</text>
  <text x="702" y="138" font-family="monospace" font-size="11" fill="var(--text-dark)">  return a - b;</text>
  <text x="702" y="154" font-family="monospace" font-size="11" fill="var(--text-faint)">// body</text>

  <!-- reassign arrow note -->
  <text x="680" y="195" font-family="sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle">op = sub; → pointer changes, function stays</text>

  <!-- ============================================================ -->
  <!-- DISPATCH TABLE panel -->
  <!-- ============================================================ -->
  <rect x="970" y="62" width="280" height="200" rx="8" fill="url(#grad-warn)" filter="url(#shadow)" stroke="var(--warn-mid)" stroke-width="1.5"/>

  <!-- Array entries -->
  <rect x="990" y="82" width="240" height="36" rx="4" fill="var(--bg)" stroke="var(--warn-mid)" stroke-width="1"/>
  <text x="1000" y="103" font-family="monospace" font-size="12" fill="var(--text-dark)">dispatch[0]: { '+', op_add }</text>

  <rect x="990" y="124" width="240" height="36" rx="4" fill="var(--bg)" stroke="var(--warn-mid)" stroke-width="1"/>
  <text x="1000" y="145" font-family="monospace" font-size="12" fill="var(--text-dark)">dispatch[1]: { '-', op_sub }</text>

  <rect x="990" y="166" width="240" height="36" rx="4" fill="var(--bg)" stroke="var(--warn-mid)" stroke-width="1"/>
  <text x="1000" y="187" font-family="monospace" font-size="12" fill="var(--text-dark)">dispatch[2]: { '*', op_mul }</text>

  <rect x="990" y="208" width="240" height="36" rx="4" fill="var(--bg)" stroke="var(--warn-mid)" stroke-width="1"/>
  <text x="1000" y="229" font-family="monospace" font-size="12" fill="var(--text-dark)">dispatch[3]: { '/', op_div }</text>

  <!-- ============================================================ -->
  <!-- SYNTAX BREAKDOWN SECTION -->
  <!-- ============================================================ -->
  <rect x="30" y="278" width="610" height="165" rx="8" fill="url(#grad-surface)" filter="url(#shadow)" stroke="var(--border-faint)" stroke-width="1.5"/>
  <text x="50" y="303" font-family="sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)">Declaration Syntax Breakdown</text>

  <!-- Declaration label boxes -->
  <text x="90" y="345" font-family="monospace" font-size="22" fill="var(--primary-dk)" text-anchor="middle">int</text>
  <text x="220" y="345" font-family="monospace" font-size="22" fill="var(--danger)" text-anchor="middle">(*op)</text>
  <text x="380" y="345" font-family="monospace" font-size="22" fill="var(--ok-dk)" text-anchor="middle">(int, int)</text>
  <text x="540" y="345" font-family="monospace" font-size="22" fill="var(--text-faint)" text-anchor="middle">;</text>

  <!-- Underline labels -->
  <line x1="55" y1="352" x2="125" y2="352" stroke="var(--primary-dk)" stroke-width="2"/>
  <text x="90" y="372" font-family="sans-serif" font-size="12" fill="var(--primary-dk)" text-anchor="middle">return type</text>

  <line x1="175" y1="352" x2="265" y2="352" stroke="var(--danger)" stroke-width="2"/>
  <text x="220" y="372" font-family="sans-serif" font-size="12" fill="var(--danger)" text-anchor="middle">pointer name</text>

  <line x1="305" y1="352" x2="455" y2="352" stroke="var(--ok-dk)" stroke-width="2"/>
  <text x="380" y="372" font-family="sans-serif" font-size="12" fill="var(--ok-dk)" text-anchor="middle">parameter types</text>

  <!-- typedef row -->
  <rect x="50" y="390" width="570" height="40" rx="6" fill="var(--warn-pale3)" stroke="var(--warn-amber)" stroke-width="1.5"/>
  <text x="65" y="407" font-family="monospace" font-size="13" fill="var(--text-muted)">typedef</text>
  <text x="135" y="407" font-family="monospace" font-size="13" fill="var(--primary-dk)">int</text>
  <text x="165" y="407" font-family="monospace" font-size="13" fill="var(--danger)">(*BinaryOp)</text>
  <text x="283" y="407" font-family="monospace" font-size="13" fill="var(--ok-dk)">(int, int)</text>
  <text x="390" y="407" font-family="monospace" font-size="13" fill="var(--text-muted)">;</text>
  <text x="65" y="422" font-family="sans-serif" font-size="11" fill="var(--text-faint)">→ now use:  BinaryOp op;   BinaryOp ops[] = {add, mul};</text>

  <!-- ============================================================ -->
  <!-- PATTERNS / USE CASES ROW -->
  <!-- ============================================================ -->
  <rect x="30" y="460" width="286" height="150" rx="8" fill="var(--danger-pale3)" filter="url(#shadow)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="173" y="483" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Callbacks</text>
  <text x="50" y="503" font-family="monospace" font-size="11" fill="var(--text-dark)">typedef void (*CB)(const char*);</text>
  <text x="50" y="521" font-family="monospace" font-size="11" fill="var(--text-dark)">void register(CB callback);</text>
  <text x="50" y="542" font-family="sans-serif" font-size="11" fill="var(--text-muted)">Pass function as argument to</text>
  <text x="50" y="557" font-family="sans-serif" font-size="11" fill="var(--text-muted)">be called later (event systems,</text>
  <text x="50" y="572" font-family="sans-serif" font-size="11" fill="var(--text-muted)">qsort, signal handlers)</text>

  <rect x="330" y="460" width="286" height="150" rx="8" fill="var(--ok-pale)" filter="url(#shadow)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="473" y="483" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--ok-deep)" text-anchor="middle">State Machine</text>
  <text x="350" y="503" font-family="monospace" font-size="11" fill="var(--text-dark)">StateHandler handlers[] = {</text>
  <text x="350" y="521" font-family="monospace" font-size="11" fill="var(--text-dark)">  [IDLE]    = handle_idle,</text>
  <text x="350" y="539" font-family="monospace" font-size="11" fill="var(--text-dark)">  [RUNNING] = handle_run,</text>
  <text x="350" y="557" font-family="monospace" font-size="11" fill="var(--text-dark)">};</text>
  <text x="350" y="577" font-family="sans-serif" font-size="11" fill="var(--text-muted)">Map states to handler functions</text>
  <text x="350" y="592" font-family="sans-serif" font-size="11" fill="var(--text-muted)">for clean transitions</text>

  <rect x="630" y="460" width="286" height="150" rx="8" fill="var(--primary-pale)" filter="url(#shadow)" stroke="var(--primary-dk)" stroke-width="1.5"/>
  <text x="773" y="483" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--primary-deep)" text-anchor="middle">Plugin System</text>
  <text x="648" y="503" font-family="monospace" font-size="11" fill="var(--text-dark)">typedef struct {</text>
  <text x="648" y="521" font-family="monospace" font-size="11" fill="var(--text-dark)">  int (*init)(void);</text>
  <text x="648" y="539" font-family="monospace" font-size="11" fill="var(--text-dark)">  void (*process)(char*);</text>
  <text x="648" y="557" font-family="monospace" font-size="11" fill="var(--text-dark)">  void (*shutdown)(void);</text>
  <text x="648" y="575" font-family="monospace" font-size="11" fill="var(--text-dark)">} Plugin;</text>
  <text x="648" y="596" font-family="sans-serif" font-size="11" fill="var(--text-muted)">Struct of function pointers</text>

  <rect x="930" y="460" width="320" height="150" rx="8" fill="var(--warn-pale)" filter="url(#shadow)" stroke="var(--warn-mid)" stroke-width="1.5"/>
  <text x="1090" y="483" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">NULL Safety Rule</text>
  <text x="950" y="508" font-family="monospace" font-size="12" fill="var(--text-dark)">if (op != NULL) {</text>
  <text x="950" y="526" font-family="monospace" font-size="12" fill="var(--text-dark)">    result = op(a, b);</text>
  <text x="950" y="544" font-family="monospace" font-size="12" fill="var(--text-dark)">}</text>
  <text x="950" y="568" font-family="sans-serif" font-size="11" fill="var(--text-muted)">Always check before calling</text>
  <text x="950" y="583" font-family="sans-serif" font-size="11" fill="var(--text-muted)">through a function pointer.</text>
  <text x="950" y="598" font-family="sans-serif" font-size="11" fill="var(--danger)">NULL dereference = crash!</text>

  <!-- connect dispatch table arrow to code segment -->
  <line x1="860" y1="135" x2="967" y2="155" stroke="var(--warn-mid)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-ok)"/>
  <text x="912" y="135" font-family="sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">each entry</text>
  <text x="912" y="148" font-family="sans-serif" font-size="11" fill="var(--text-faint)" text-anchor="middle">→ fn addr</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="grad-code" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
  </defs>
  <!-- Section labels row -->
  <rect x="40" y="40" width="354.098361" height="35.09244" rx="6.373938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="217.04918" y="62.420116" font-size="15.667034" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">STACK (main)</text>

  <rect x="502.295082" y="40" width="354.098361" height="35.09244" rx="6.373938" fill="var(--ok-accent)"/>
  <text x="679.344262" y="62.420116" font-size="15.667034" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">CODE SEGMENT (text)</text>

  <rect x="964.590164" y="40" width="275.409836" height="35.09244" rx="6.373938" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.295082" y="62.420116" font-size="15.667034" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Courier New, monospace">DISPATCH TABLE</text>

  <!-- ============================================================ -->
  <!-- STACK panel -->
  <!-- ============================================================ -->
  <rect x="40" y="85.815077" width="354.098361" height="194.958001" rx="6.373938" fill="url(#grad-stack)" stroke="var(--primary-border)" stroke-width="1.5"/>

  <!-- Stack variable: op -->
  <rect x="69.508197" y="105.310877" width="295.081967" height="58.4874" rx="6.373938" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="89.180328" y="127.730993" font-size="13.708641" fill="var(--text-muted)" font-family="Courier New, monospace">variable: op</text>
  <text x="89.180328" y="149.176481" font-size="13.708641" fill="var(--primary-accent)" font-family="Courier New, monospace">0x004010a0  ← address of add()</text>

  <!-- Stack variable: a, b -->
  <rect x="69.508197" y="175.495757" width="295.081967" height="46.78992" rx="6.373938" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="89.180328" y="195.966401" font-size="13.708641" fill="var(--text-muted)" font-family="Courier New, monospace">a = 3,  b = 4</text>
  <text x="89.180328" y="213.512514" font-size="11.750249" fill="var(--text-faint)" font-family="Courier New, monospace">int parameters</text>

  <!-- Arrow from op value to code segment -->
  <line x1="367.540984" y1="134.554577" x2="499.344262" y2="134.554577" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="428.52459" y="128.705837" font-size="10.771106" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">points to</text>

  <!-- ============================================================ -->
  <!-- CODE SEGMENT panel -->
  <!-- ============================================================ -->
  <rect x="502.295082" y="85.815077" width="354.098361" height="194.958001" rx="6.373938" fill="url(#grad-code)" stroke="var(--ok-border)" stroke-width="1.5"/>

  <!-- add() -->
  <rect x="521.967213" y="105.310877" width="145.57377" height="77.983201" rx="6.373938" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="594.754098" y="126.756257" font-size="12.729498" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">add()</text>
  <text x="531.803279" y="144.302477" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">0x004010a0:</text>
  <text x="531.803279" y="159.899117" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">  return a + b;</text>
  <text x="531.803279" y="175.495757" font-size="10.771106" fill="var(--text-faint)" font-family="Courier New, monospace">// body</text>

  <!-- sub() -->
  <rect x="691.147541" y="105.310877" width="145.57377" height="77.983201" rx="6.373938" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="763.934426" y="126.756257" font-size="12.729498" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">sub()</text>
  <text x="700.983607" y="144.302477" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">0x004010c0:</text>
  <text x="700.983607" y="159.899117" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">  return a - b;</text>
  <text x="700.983607" y="175.495757" font-size="10.771106" fill="var(--text-faint)" font-family="Courier New, monospace">// body</text>

  <!-- reassign arrow note -->
  <text x="679.344262" y="215.462201" font-size="11.750249" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">op = sub; → pointer changes, function stays</text>

  <!-- ============================================================ -->
  <!-- DISPATCH TABLE panel -->
  <!-- ============================================================ -->
  <rect x="964.590164" y="85.815077" width="275.409836" height="194.958001" rx="6.373938" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Array entries -->
  <rect x="984.262295" y="105.310877" width="236.065574" height="35.09244" rx="6.373938" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="994.098361" y="125.781521" font-size="11.750249" fill="var(--text)" font-family="Courier New, monospace">dispatch[0]: { '+', op_add }</text>

  <rect x="984.262295" y="146.252057" width="236.065574" height="35.09244" rx="6.373938" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="994.098361" y="166.722593" font-size="11.750249" fill="var(--text)" font-family="Courier New, monospace">dispatch[1]: { '-', op_sub }</text>

  <rect x="984.262295" y="187.193237" width="236.065574" height="35.09244" rx="6.373938" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="994.098361" y="207.663881" font-size="11.750249" fill="var(--text)" font-family="Courier New, monospace">dispatch[2]: { '*', op_mul }</text>

  <rect x="984.262295" y="228.134417" width="236.065574" height="35.09244" rx="6.373938" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="994.098361" y="248.604954" font-size="11.750249" fill="var(--text)" font-family="Courier New, monospace">dispatch[3]: { '/', op_div }</text>

  <!-- ============================================================ -->
  <!-- SYNTAX BREAKDOWN SECTION -->
  <!-- ============================================================ -->
  <rect x="40" y="296.369718" width="600" height="160.840297" rx="6.373938" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="59.672131" y="320.739522" font-size="13.708641" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Declaration Syntax Breakdown</text>

  <!-- Declaration label boxes -->
  <text x="99.016393" y="361.680595" font-size="21.542105" fill="var(--primary-accent)" text-anchor="middle" font-family="Courier New, monospace">int</text>
  <text x="226.885246" y="361.680595" font-size="21.542105" fill="var(--danger-accent)" text-anchor="middle" font-family="Courier New, monospace">(*op)</text>
  <text x="384.262295" y="361.680595" font-size="21.542105" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">(int, int)</text>
  <text x="541.639344" y="361.680595" font-size="21.542105" fill="var(--text-faint)" text-anchor="middle" font-family="Courier New, monospace">;</text>

  <!-- Underline labels -->
  <line x1="64.590164" y1="368.504178" x2="133.442623" y2="368.504178" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="99.016393" y="387.999978" font-size="11.750249" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">return type</text>

  <line x1="182.622951" y1="368.504178" x2="271.147541" y2="368.504178" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="226.885246" y="387.999978" font-size="11.750249" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">pointer name</text>

  <line x1="310.491803" y1="368.504178" x2="458.032787" y2="368.504178" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="384.262295" y="387.999978" font-size="11.750249" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">parameter types</text>

  <!-- typedef row -->
  <rect x="59.672131" y="405.546199" width="560.655738" height="38.9916" rx="6.373938" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="74.42623" y="422.117682" font-size="12.729498" fill="var(--text-muted)" font-family="Courier New, monospace">typedef</text>
  <text x="143.278689" y="422.117682" font-size="12.729498" fill="var(--primary-accent)" font-family="Courier New, monospace">int</text>
  <text x="172.786885" y="422.117682" font-size="12.729498" fill="var(--danger-accent)" font-family="Courier New, monospace">(*BinaryOp)</text>
  <text x="288.852459" y="422.117682" font-size="12.729498" fill="var(--ok-accent)" font-family="Courier New, monospace">(int, int)</text>
  <text x="394.098361" y="422.117682" font-size="12.729498" fill="var(--text-muted)" font-family="Courier New, monospace">;</text>
  <text x="74.42623" y="436.739479" font-size="10.771106" fill="var(--text-faint)" font-family="Arial, sans-serif">→ now use:  BinaryOp op;   BinaryOp ops[] = {add, mul};</text>

  <!-- ============================================================ -->
  <!-- PATTERNS / USE CASES ROW -->
  <!-- ============================================================ -->
  <rect x="40" y="473.781499" width="281.311475" height="146.218501" rx="6.373938" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.655738" y="496.201723" font-size="12.729498" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Callbacks</text>
  <text x="59.672131" y="515.697523" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">typedef void (*CB)(const char*);</text>
  <text x="59.672131" y="533.243636" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">void register(CB callback);</text>
  <text x="59.672131" y="553.71428" font-size="10.771106" fill="var(--text-muted)" font-family="Arial, sans-serif">Pass function as argument to</text>
  <text x="59.672131" y="568.336076" font-size="10.771106" fill="var(--text-muted)" font-family="Arial, sans-serif">be called later (event systems,</text>
  <text x="59.672131" y="582.95798" font-size="10.771106" fill="var(--text-muted)" font-family="Arial, sans-serif">qsort, signal handlers)</text>

  <rect x="335.081967" y="473.781499" width="281.311475" height="146.218501" rx="6.373938" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="475.737705" y="496.201723" font-size="12.729498" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle" font-family="Arial, sans-serif">State Machine</text>
  <text x="354.754098" y="515.697523" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">StateHandler handlers[] = {</text>
  <text x="354.754098" y="533.243636" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">  [IDLE]    = handle_idle,</text>
  <text x="354.754098" y="550.789963" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">  [RUNNING] = handle_run,</text>
  <text x="354.754098" y="568.336076" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">};</text>
  <text x="354.754098" y="587.831876" font-size="10.771106" fill="var(--text-muted)" font-family="Arial, sans-serif">Map states to handler functions</text>
  <text x="354.754098" y="602.45378" font-size="10.771106" fill="var(--text-muted)" font-family="Arial, sans-serif">for clean transitions</text>

  <rect x="630.163934" y="473.781499" width="281.311475" height="146.218501" rx="6.373938" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770.819672" y="496.201723" font-size="12.729498" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">Plugin System</text>
  <text x="647.868852" y="515.697523" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">typedef struct {</text>
  <text x="647.868852" y="533.243636" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">  int (*init)(void);</text>
  <text x="647.868852" y="550.789963" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">  void (*process)(char*);</text>
  <text x="647.868852" y="568.336076" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">  void (*shutdown)(void);</text>
  <text x="647.868852" y="585.882404" font-size="10.771106" fill="var(--text)" font-family="Courier New, monospace">} Plugin;</text>
  <text x="647.868852" y="606.35294" font-size="10.771106" fill="var(--text-muted)" font-family="Arial, sans-serif">Struct of function pointers</text>

  <rect x="925.245902" y="473.781499" width="314.754098" height="146.218501" rx="6.373938" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.622951" y="496.201723" font-size="12.729498" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle" font-family="Arial, sans-serif">NULL Safety Rule</text>
  <text x="944.918033" y="520.571419" font-size="11.750249" fill="var(--text)" font-family="Courier New, monospace">if (op != NULL) {</text>
  <text x="944.918033" y="538.117639" font-size="11.750249" fill="var(--text)" font-family="Courier New, monospace">    result = op(a, b);</text>
  <text x="944.918033" y="555.66386" font-size="11.750249" fill="var(--text)" font-family="Courier New, monospace">}</text>
  <text x="944.918033" y="579.05882" font-size="10.771106" fill="var(--text-muted)" font-family="Arial, sans-serif">Always check before calling</text>
  <text x="944.918033" y="593.680724" font-size="10.771106" fill="var(--text-muted)" font-family="Arial, sans-serif">through a function pointer.</text>
  <text x="944.918033" y="608.30252" font-size="10.771106" fill="var(--danger-accent)" font-family="Arial, sans-serif">NULL dereference = crash!</text>

  <!-- connect dispatch table arrow to code segment -->
  <line x1="856.393443" y1="156.974801" x2="961.639344" y2="176.470601" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-ok)"/>
  <text x="907.540984" y="156.974801" font-size="10.771106" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">each entry</text>
  <text x="907.540984" y="169.647017" font-size="10.771106" fill="var(--text-faint)" text-anchor="middle" font-family="Arial, sans-serif">→ fn addr</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="grad-code" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Section labels row -->
  <rect x="68.125" y="53.5938" width="337.5" height="32.625" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="236.875" y="74.4375" font-family="monospace" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">STACK (main)</text>

  <rect x="508.75" y="53.5938" width="337.5" height="32.625" rx="6" fill="var(--ok-accent)" filter="url(#shadow)"/>
  <text x="677.5" y="74.4375" font-family="monospace" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">CODE SEGMENT (text)</text>

  <rect x="949.375" y="53.5938" width="262.5" height="32.625" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1080.625" y="74.4375" font-family="monospace" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">DISPATCH TABLE</text>

  <!-- ============================================================ -->
  <!-- STACK panel -->
  <!-- ============================================================ -->
  <rect x="68.125" y="96.1875" width="337.5" height="181.25" rx="6" fill="url(#grad-stack)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="1.5"/>

  <!-- Stack variable: op -->
  <rect x="96.25" y="114.3125" width="281.25" height="54.375" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="115" y="135.1562" font-family="monospace" font-size="12.9044" fill="var(--text-muted)">variable: op</text>
  <text x="115" y="155.0938" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)">0x004010a0  ← address of add()</text>

  <!-- Stack variable: a, b -->
  <rect x="96.25" y="179.5625" width="281.25" height="43.5" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="115" y="198.5938" font-family="monospace" font-size="12.9044" fill="var(--text-muted)">a = 3,  b = 4</text>
  <text x="115" y="214.9062" font-family="monospace" font-size="11.0609" fill="var(--text-faint)">int parameters</text>

  <!-- Arrow from op value to code segment -->
  <line x1="380.3125" y1="141.5" x2="505.9375" y2="141.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="438.4375" y="136.0625" font-family="sans-serif" font-size="10.1392" fill="var(--primary-accent)" text-anchor="middle">points to</text>

  <!-- ============================================================ -->
  <!-- CODE SEGMENT panel -->
  <!-- ============================================================ -->
  <rect x="508.75" y="96.1875" width="337.5" height="181.25" rx="6" fill="url(#grad-code)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="1.5"/>

  <!-- add() -->
  <rect x="527.5" y="114.3125" width="138.75" height="72.5" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="596.875" y="134.25" font-family="monospace" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">add()</text>
  <text x="536.875" y="150.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">0x004010a0:</text>
  <text x="536.875" y="165.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">  return a + b;</text>
  <text x="536.875" y="179.5625" font-family="monospace" font-size="10.1392" fill="var(--text-faint)">// body</text>

  <!-- sub() -->
  <rect x="688.75" y="114.3125" width="138.75" height="72.5" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="758.125" y="134.25" font-family="monospace" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">sub()</text>
  <text x="698.125" y="150.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">0x004010c0:</text>
  <text x="698.125" y="165.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">  return a - b;</text>
  <text x="698.125" y="179.5625" font-family="monospace" font-size="10.1392" fill="var(--text-faint)">// body</text>

  <!-- reassign arrow note -->
  <text x="677.5" y="216.7188" font-family="sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">op = sub; → pointer changes, function stays</text>

  <!-- ============================================================ -->
  <!-- DISPATCH TABLE panel -->
  <!-- ============================================================ -->
  <rect x="949.375" y="96.1875" width="262.5" height="181.25" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>

  <!-- Array entries -->
  <rect x="968.125" y="114.3125" width="225" height="32.625" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="977.5" y="133.3438" font-family="monospace" font-size="11.0609" fill="var(--text)">dispatch[0]: { '+', op_add }</text>

  <rect x="968.125" y="152.375" width="225" height="32.625" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="977.5" y="171.4062" font-family="monospace" font-size="11.0609" fill="var(--text)">dispatch[1]: { '-', op_sub }</text>

  <rect x="968.125" y="190.4375" width="225" height="32.625" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="977.5" y="209.4688" font-family="monospace" font-size="11.0609" fill="var(--text)">dispatch[2]: { '*', op_mul }</text>

  <rect x="968.125" y="228.5" width="225" height="32.625" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="977.5" y="247.5312" font-family="monospace" font-size="11.0609" fill="var(--text)">dispatch[3]: { '/', op_div }</text>

  <!-- ============================================================ -->
  <!-- SYNTAX BREAKDOWN SECTION -->
  <!-- ============================================================ -->
  <rect x="68.125" y="291.9375" width="571.875" height="149.5312" rx="6" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1"/>
  <text x="86.875" y="314.5938" font-family="sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)">Declaration Syntax Breakdown</text>

  <!-- Declaration label boxes -->
  <text x="124.375" y="352.6562" font-family="monospace" font-size="20.2783" fill="var(--primary-accent)" text-anchor="middle">int</text>
  <text x="246.25" y="352.6562" font-family="monospace" font-size="20.2783" fill="var(--danger-accent)" text-anchor="middle">(*op)</text>
  <text x="396.25" y="352.6562" font-family="monospace" font-size="20.2783" fill="var(--ok-accent)" text-anchor="middle">(int, int)</text>
  <text x="546.25" y="352.6562" font-family="monospace" font-size="20.2783" fill="var(--text-faint)" text-anchor="middle">;</text>

  <!-- Underline labels -->
  <line x1="91.5625" y1="359" x2="157.1875" y2="359" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="124.375" y="377.125" font-family="sans-serif" font-size="11.0609" fill="var(--primary-accent)" text-anchor="middle">return type</text>

  <line x1="204.0625" y1="359" x2="288.4375" y2="359" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="246.25" y="377.125" font-family="sans-serif" font-size="11.0609" fill="var(--danger-accent)" text-anchor="middle">pointer name</text>

  <line x1="325.9375" y1="359" x2="466.5625" y2="359" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="396.25" y="377.125" font-family="sans-serif" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">parameter types</text>

  <!-- typedef row -->
  <rect x="86.875" y="393.4375" width="534.375" height="36.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="100.9375" y="408.8438" font-family="monospace" font-size="11.9827" fill="var(--text-muted)">typedef</text>
  <text x="166.5625" y="408.8438" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)">int</text>
  <text x="194.6875" y="408.8438" font-family="monospace" font-size="11.9827" fill="var(--danger-accent)">(*BinaryOp)</text>
  <text x="305.3125" y="408.8438" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)">(int, int)</text>
  <text x="405.625" y="408.8438" font-family="monospace" font-size="11.9827" fill="var(--text-muted)">;</text>
  <text x="100.9375" y="422.4375" font-family="sans-serif" font-size="10.1392" fill="var(--text-faint)">→ now use:  BinaryOp op;   BinaryOp ops[] = {add, mul};</text>

  <!-- ============================================================ -->
  <!-- PATTERNS / USE CASES ROW -->
  <!-- ============================================================ -->
  <rect x="68.125" y="456.875" width="268.125" height="135.9375" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="202.1875" y="477.7188" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Callbacks</text>
  <text x="86.875" y="495.8438" font-family="monospace" font-size="10.1392" fill="var(--text)">typedef void (*CB)(const char*);</text>
  <text x="86.875" y="512.1562" font-family="monospace" font-size="10.1392" fill="var(--text)">void register(CB callback);</text>
  <text x="86.875" y="531.1875" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">Pass function as argument to</text>
  <text x="86.875" y="544.7812" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">be called later (event systems,</text>
  <text x="86.875" y="558.375" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">qsort, signal handlers)</text>

  <rect x="349.375" y="456.875" width="268.125" height="135.9375" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="483.4375" y="477.7188" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">State Machine</text>
  <text x="368.125" y="495.8438" font-family="monospace" font-size="10.1392" fill="var(--text)">StateHandler handlers[] = {</text>
  <text x="368.125" y="512.1562" font-family="monospace" font-size="10.1392" fill="var(--text)">  [IDLE]    = handle_idle,</text>
  <text x="368.125" y="528.4688" font-family="monospace" font-size="10.1392" fill="var(--text)">  [RUNNING] = handle_run,</text>
  <text x="368.125" y="544.7812" font-family="monospace" font-size="10.1392" fill="var(--text)">};</text>
  <text x="368.125" y="562.9062" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">Map states to handler functions</text>
  <text x="368.125" y="576.5" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">for clean transitions</text>

  <rect x="630.625" y="456.875" width="268.125" height="135.9375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="764.6875" y="477.7188" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Plugin System</text>
  <text x="647.5" y="495.8438" font-family="monospace" font-size="10.1392" fill="var(--text)">typedef struct {</text>
  <text x="647.5" y="512.1562" font-family="monospace" font-size="10.1392" fill="var(--text)">  int (*init)(void);</text>
  <text x="647.5" y="528.4688" font-family="monospace" font-size="10.1392" fill="var(--text)">  void (*process)(char*);</text>
  <text x="647.5" y="544.7812" font-family="monospace" font-size="10.1392" fill="var(--text)">  void (*shutdown)(void);</text>
  <text x="647.5" y="561.0938" font-family="monospace" font-size="10.1392" fill="var(--text)">} Plugin;</text>
  <text x="647.5" y="580.125" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">Struct of function pointers</text>

  <rect x="911.875" y="456.875" width="300" height="135.9375" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1061.875" y="477.7188" font-family="sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">NULL Safety Rule</text>
  <text x="930.625" y="500.375" font-family="monospace" font-size="11.0609" fill="var(--text)">if (op != NULL) {</text>
  <text x="930.625" y="516.6875" font-family="monospace" font-size="11.0609" fill="var(--text)">    result = op(a, b);</text>
  <text x="930.625" y="533" font-family="monospace" font-size="11.0609" fill="var(--text)">}</text>
  <text x="930.625" y="554.75" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">Always check before calling</text>
  <text x="930.625" y="568.3438" font-family="sans-serif" font-size="10.1392" fill="var(--text-muted)">through a function pointer.</text>
  <text x="930.625" y="581.9375" font-family="sans-serif" font-size="10.1392" fill="var(--danger-accent)">NULL dereference = crash!</text>

  <!-- connect dispatch table arrow to code segment -->
  <line x1="846.25" y1="162.3438" x2="946.5625" y2="180.4688" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-ok)"/>
  <text x="895" y="162.3438" font-family="sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">each entry</text>
  <text x="895" y="174.125" font-family="sans-serif" font-size="10.1392" fill="var(--text-faint)" text-anchor="middle">→ fn addr</text>
</svg>

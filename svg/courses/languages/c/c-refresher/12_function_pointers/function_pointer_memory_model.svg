<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="354" height="35" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="217" y="63" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="var(--primary-text)">STACK</text>

  <rect x="502" y="40" width="354" height="35" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="679" y="63" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="var(--ok-text)">CODE</text>

  <rect x="964" y="40" width="276" height="35" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102" y="63" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="var(--warn-text)">DISPATCH</text>

  <rect x="40" y="85" width="354" height="195" rx="6" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <rect x="69" y="105" width="295" height="58" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="89" y="127" font-family="Courier New, monospace" font-size="13" fill="var(--text-muted)">op:</text>
  <text x="89" y="149" font-family="Courier New, monospace" font-size="13" fill="var(--primary-accent)">0x004010a0</text>
  <rect x="69" y="175" width="295" height="46" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="89" y="195" font-family="Courier New, monospace" font-size="13" fill="var(--text-muted)">a = 3, b = 4</text>

  <line x1="367" y1="135" x2="499" y2="135" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="502" y="85" width="354" height="195" rx="6" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <rect x="521" y="105" width="146" height="78" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="594" y="126" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="var(--ok-accent)">add()</text>
  <text x="531" y="150" font-family="Courier New, monospace" font-size="11" fill="var(--text)">0x004010a0</text>
  <text x="531" y="170" font-family="Courier New, monospace" font-size="11" fill="var(--text)">return a+b;</text>

  <rect x="691" y="105" width="146" height="78" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="764" y="126" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="var(--ok-accent)">sub()</text>
  <text x="700" y="150" font-family="Courier New, monospace" font-size="11" fill="var(--text)">0x004010c0</text>
  <text x="700" y="170" font-family="Courier New, monospace" font-size="11" fill="var(--text)">return a-b;</text>

  <text x="679" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">op = sub: pointer flips</text>

  <rect x="964" y="85" width="276" height="195" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="984" y="105" width="236" height="35" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="994" y="126" font-family="Courier New, monospace" font-size="12" fill="var(--text)">{'+', op_add}</text>
  <rect x="984" y="146" width="236" height="35" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="994" y="167" font-family="Courier New, monospace" font-size="12" fill="var(--text)">{'-', op_sub}</text>
  <rect x="984" y="187" width="236" height="35" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="994" y="208" font-family="Courier New, monospace" font-size="12" fill="var(--text)">{'*', op_mul}</text>
  <rect x="984" y="228" width="236" height="35" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="994" y="249" font-family="Courier New, monospace" font-size="12" fill="var(--text)">{'/', op_div}</text>

  <rect x="40" y="295" width="600" height="160" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Declaration Syntax</text>
  <text x="99" y="360" text-anchor="middle" font-family="Courier New, monospace" font-size="20" fill="var(--primary-accent)">int</text>
  <text x="227" y="360" text-anchor="middle" font-family="Courier New, monospace" font-size="20" fill="var(--danger-accent)">(*op)</text>
  <text x="384" y="360" text-anchor="middle" font-family="Courier New, monospace" font-size="20" fill="var(--ok-accent)">(int, int)</text>
  <text x="99" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">return type</text>
  <text x="227" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-accent)">pointer</text>
  <text x="384" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">params</text>
  <rect x="60" y="405" width="560" height="40" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="430" font-family="Courier New, monospace" font-size="13" fill="var(--warn-text)">typedef int (*BinaryOp)(int, int);</text>

  <rect x="40" y="475" width="280" height="145" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-text)">Callbacks</text>
  <text x="60" y="525" font-family="Courier New, monospace" font-size="11" fill="var(--danger-text)">void register(CB cb);</text>
  <text x="60" y="550" font-family="Arial, sans-serif" font-size="11" fill="var(--danger-text)">qsort, signal handlers</text>

  <rect x="335" y="475" width="280" height="145" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-text)">State Machine</text>
  <text x="355" y="525" font-family="Courier New, monospace" font-size="11" fill="var(--ok-text)">Handler h[] = {...};</text>
  <text x="355" y="550" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-text)">state to handler</text>

  <rect x="630" y="475" width="280" height="145" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">Plugin System</text>
  <text x="650" y="525" font-family="Courier New, monospace" font-size="11" fill="var(--primary-text)">struct { init, ... }</text>
  <text x="650" y="550" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-text)">struct of fn pointers</text>

  <rect x="925" y="475" width="315" height="145" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">NULL Safety</text>
  <text x="945" y="525" font-family="Courier New, monospace" font-size="11" fill="var(--warn-text)">if (op) op(a, b);</text>
  <text x="945" y="550" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-text)">check before calling</text>
</svg>

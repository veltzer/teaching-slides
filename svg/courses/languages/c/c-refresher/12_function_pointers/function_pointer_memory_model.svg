<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="grad-code" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Section labels row -->
  <rect x="30" y="15" width="360" height="36" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="210" y="38" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">STACK (main)</text>

  <rect x="500" y="15" width="360" height="36" rx="6" fill="#2e7d32" filter="url(#shadow)"/>
  <text x="680" y="38" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">CODE SEGMENT (text)</text>

  <rect x="970" y="15" width="280" height="36" rx="6" fill="#f57c00" filter="url(#shadow)"/>
  <text x="1110" y="38" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">DISPATCH TABLE</text>

  <!-- ============================================================ -->
  <!-- STACK panel -->
  <!-- ============================================================ -->
  <rect x="30" y="62" width="360" height="200" rx="8" fill="url(#grad-stack)" filter="url(#shadow)" stroke="#1e88e5" stroke-width="1.5"/>

  <!-- Stack variable: op -->
  <rect x="60" y="82" width="300" height="60" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="105" font-family="monospace" font-size="14" fill="#555555">variable: op</text>
  <text x="80" y="127" font-family="monospace" font-size="14" fill="#1565c0">0x004010a0  ← address of add()</text>

  <!-- Stack variable: a, b -->
  <rect x="60" y="154" width="300" height="48" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="175" font-family="monospace" font-size="14" fill="#555555">a = 3,  b = 4</text>
  <text x="80" y="193" font-family="monospace" font-size="12" fill="#888888">int parameters</text>

  <!-- Arrow from op value to code segment -->
  <line x1="363" y1="112" x2="497" y2="112" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="425" y="106" font-family="sans-serif" font-size="11" fill="#1565c0" text-anchor="middle">points to</text>

  <!-- ============================================================ -->
  <!-- CODE SEGMENT panel -->
  <!-- ============================================================ -->
  <rect x="500" y="62" width="360" height="200" rx="8" fill="url(#grad-code)" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.5"/>

  <!-- add() -->
  <rect x="520" y="82" width="148" height="80" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="594" y="104" font-family="monospace" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">add()</text>
  <text x="530" y="122" font-family="monospace" font-size="11" fill="#333333">0x004010a0:</text>
  <text x="530" y="138" font-family="monospace" font-size="11" fill="#333333">  return a + b;</text>
  <text x="530" y="154" font-family="monospace" font-size="11" fill="#888888">// body</text>

  <!-- sub() -->
  <rect x="692" y="82" width="148" height="80" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="766" y="104" font-family="monospace" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">sub()</text>
  <text x="702" y="122" font-family="monospace" font-size="11" fill="#333333">0x004010c0:</text>
  <text x="702" y="138" font-family="monospace" font-size="11" fill="#333333">  return a - b;</text>
  <text x="702" y="154" font-family="monospace" font-size="11" fill="#888888">// body</text>

  <!-- reassign arrow note -->
  <text x="680" y="195" font-family="sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle">op = sub; → pointer changes, function stays</text>

  <!-- ============================================================ -->
  <!-- DISPATCH TABLE panel -->
  <!-- ============================================================ -->
  <rect x="970" y="62" width="280" height="200" rx="8" fill="url(#grad-warn)" filter="url(#shadow)" stroke="#f57c00" stroke-width="1.5"/>

  <!-- Array entries -->
  <rect x="990" y="82" width="240" height="36" rx="4" fill="#ffffff" stroke="#f57c00" stroke-width="1"/>
  <text x="1000" y="103" font-family="monospace" font-size="12" fill="#333333">dispatch[0]: { '+', op_add }</text>

  <rect x="990" y="124" width="240" height="36" rx="4" fill="#ffffff" stroke="#f57c00" stroke-width="1"/>
  <text x="1000" y="145" font-family="monospace" font-size="12" fill="#333333">dispatch[1]: { '-', op_sub }</text>

  <rect x="990" y="166" width="240" height="36" rx="4" fill="#ffffff" stroke="#f57c00" stroke-width="1"/>
  <text x="1000" y="187" font-family="monospace" font-size="12" fill="#333333">dispatch[2]: { '*', op_mul }</text>

  <rect x="990" y="208" width="240" height="36" rx="4" fill="#ffffff" stroke="#f57c00" stroke-width="1"/>
  <text x="1000" y="229" font-family="monospace" font-size="12" fill="#333333">dispatch[3]: { '/', op_div }</text>

  <!-- ============================================================ -->
  <!-- SYNTAX BREAKDOWN SECTION -->
  <!-- ============================================================ -->
  <rect x="30" y="278" width="610" height="165" rx="8" fill="url(#grad-surface)" filter="url(#shadow)" stroke="#cccccc" stroke-width="1.5"/>
  <text x="50" y="303" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333333">Declaration Syntax Breakdown</text>

  <!-- Declaration label boxes -->
  <text x="90" y="345" font-family="monospace" font-size="22" fill="#1565c0" text-anchor="middle">int</text>
  <text x="220" y="345" font-family="monospace" font-size="22" fill="#e53935" text-anchor="middle">(*op)</text>
  <text x="380" y="345" font-family="monospace" font-size="22" fill="#2e7d32" text-anchor="middle">(int, int)</text>
  <text x="540" y="345" font-family="monospace" font-size="22" fill="#888888" text-anchor="middle">;</text>

  <!-- Underline labels -->
  <line x1="55" y1="352" x2="125" y2="352" stroke="#1565c0" stroke-width="2"/>
  <text x="90" y="372" font-family="sans-serif" font-size="12" fill="#1565c0" text-anchor="middle">return type</text>

  <line x1="175" y1="352" x2="265" y2="352" stroke="#e53935" stroke-width="2"/>
  <text x="220" y="372" font-family="sans-serif" font-size="12" fill="#e53935" text-anchor="middle">pointer name</text>

  <line x1="305" y1="352" x2="455" y2="352" stroke="#2e7d32" stroke-width="2"/>
  <text x="380" y="372" font-family="sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle">parameter types</text>

  <!-- typedef row -->
  <rect x="50" y="390" width="570" height="40" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="65" y="407" font-family="monospace" font-size="13" fill="#555555">typedef</text>
  <text x="135" y="407" font-family="monospace" font-size="13" fill="#1565c0">int</text>
  <text x="165" y="407" font-family="monospace" font-size="13" fill="#e53935">(*BinaryOp)</text>
  <text x="283" y="407" font-family="monospace" font-size="13" fill="#2e7d32">(int, int)</text>
  <text x="390" y="407" font-family="monospace" font-size="13" fill="#555555">;</text>
  <text x="65" y="422" font-family="sans-serif" font-size="11" fill="#888888">→ now use:  BinaryOp op;   BinaryOp ops[] = {add, mul};</text>

  <!-- ============================================================ -->
  <!-- PATTERNS / USE CASES ROW -->
  <!-- ============================================================ -->
  <rect x="30" y="460" width="286" height="150" rx="8" fill="#fce4ec" filter="url(#shadow)" stroke="#e53935" stroke-width="1.5"/>
  <text x="173" y="483" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">Callbacks</text>
  <text x="50" y="503" font-family="monospace" font-size="11" fill="#333333">typedef void (*CB)(const char*);</text>
  <text x="50" y="521" font-family="monospace" font-size="11" fill="#333333">void register(CB callback);</text>
  <text x="50" y="542" font-family="sans-serif" font-size="11" fill="#555555">Pass function as argument to</text>
  <text x="50" y="557" font-family="sans-serif" font-size="11" fill="#555555">be called later (event systems,</text>
  <text x="50" y="572" font-family="sans-serif" font-size="11" fill="#555555">qsort, signal handlers)</text>

  <rect x="330" y="460" width="286" height="150" rx="8" fill="#e8f5e9" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="473" y="483" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">State Machine</text>
  <text x="350" y="503" font-family="monospace" font-size="11" fill="#333333">StateHandler handlers[] = {</text>
  <text x="350" y="521" font-family="monospace" font-size="11" fill="#333333">  [IDLE]    = handle_idle,</text>
  <text x="350" y="539" font-family="monospace" font-size="11" fill="#333333">  [RUNNING] = handle_run,</text>
  <text x="350" y="557" font-family="monospace" font-size="11" fill="#333333">};</text>
  <text x="350" y="577" font-family="sans-serif" font-size="11" fill="#555555">Map states to handler functions</text>
  <text x="350" y="592" font-family="sans-serif" font-size="11" fill="#555555">for clean transitions</text>

  <rect x="630" y="460" width="286" height="150" rx="8" fill="#e3f2fd" filter="url(#shadow)" stroke="#1565c0" stroke-width="1.5"/>
  <text x="773" y="483" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle">Plugin System</text>
  <text x="648" y="503" font-family="monospace" font-size="11" fill="#333333">typedef struct {</text>
  <text x="648" y="521" font-family="monospace" font-size="11" fill="#333333">  int (*init)(void);</text>
  <text x="648" y="539" font-family="monospace" font-size="11" fill="#333333">  void (*process)(char*);</text>
  <text x="648" y="557" font-family="monospace" font-size="11" fill="#333333">  void (*shutdown)(void);</text>
  <text x="648" y="575" font-family="monospace" font-size="11" fill="#333333">} Plugin;</text>
  <text x="648" y="596" font-family="sans-serif" font-size="11" fill="#555555">Struct of function pointers</text>

  <rect x="930" y="460" width="320" height="150" rx="8" fill="#fff3e0" filter="url(#shadow)" stroke="#f57c00" stroke-width="1.5"/>
  <text x="1090" y="483" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e65100" text-anchor="middle">NULL Safety Rule</text>
  <text x="950" y="508" font-family="monospace" font-size="12" fill="#333333">if (op != NULL) {</text>
  <text x="950" y="526" font-family="monospace" font-size="12" fill="#333333">    result = op(a, b);</text>
  <text x="950" y="544" font-family="monospace" font-size="12" fill="#333333">}</text>
  <text x="950" y="568" font-family="sans-serif" font-size="11" fill="#555555">Always check before calling</text>
  <text x="950" y="583" font-family="sans-serif" font-size="11" fill="#555555">through a function pointer.</text>
  <text x="950" y="598" font-family="sans-serif" font-size="11" fill="#e53935">NULL dereference = crash!</text>

  <!-- connect dispatch table arrow to code segment -->
  <line x1="860" y1="135" x2="967" y2="155" stroke="#f57c00" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-ok)"/>
  <text x="912" y="135" font-family="sans-serif" font-size="11" fill="#888888" text-anchor="middle">each entry</text>
  <text x="912" y="148" font-family="sans-serif" font-size="11" fill="#888888" text-anchor="middle">→ fn addr</text>
</svg>

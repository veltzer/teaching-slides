<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="grad-code" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
  </defs>
  <!-- Section labels row -->
  <rect x="40" y="40" width="354.098361" height="35.09244" rx="6.373938" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="217.04918" y="62.420116" font-family="monospace" font-size="15.667034" font-weight="bold" fill="var(--bg)" text-anchor="middle">STACK (main)</text>

  <rect x="502.295082" y="40" width="354.098361" height="35.09244" rx="6.373938" fill="var(--ok-accent)" filter="url(#shadow)"/>
  <text x="679.344262" y="62.420116" font-family="monospace" font-size="15.667034" font-weight="bold" fill="var(--bg)" text-anchor="middle">CODE SEGMENT (text)</text>

  <rect x="964.590164" y="40" width="275.409836" height="35.09244" rx="6.373938" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1102.295082" y="62.420116" font-family="monospace" font-size="15.667034" font-weight="bold" fill="var(--bg)" text-anchor="middle">DISPATCH TABLE</text>

  <!-- ============================================================ -->
  <!-- STACK panel -->
  <!-- ============================================================ -->
  <rect x="40" y="85.815077" width="354.098361" height="194.958001" rx="6.373938" fill="url(#grad-stack)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="1.5"/>

  <!-- Stack variable: op -->
  <rect x="69.508197" y="105.310877" width="295.081967" height="58.4874" rx="6.373938" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="89.180328" y="127.730993" font-family="monospace" font-size="13.708641" fill="var(--text-muted)">variable: op</text>
  <text x="89.180328" y="149.176481" font-family="monospace" font-size="13.708641" fill="var(--primary-accent)">0x004010a0  ← address of add()</text>

  <!-- Stack variable: a, b -->
  <rect x="69.508197" y="175.495757" width="295.081967" height="46.78992" rx="6.373938" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="89.180328" y="195.966401" font-family="monospace" font-size="13.708641" fill="var(--text-muted)">a = 3,  b = 4</text>
  <text x="89.180328" y="213.512514" font-family="monospace" font-size="11.750249" fill="var(--text-faint)">int parameters</text>

  <!-- Arrow from op value to code segment -->
  <line x1="367.540984" y1="134.554577" x2="499.344262" y2="134.554577" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="428.52459" y="128.705837" font-family="sans-serif" font-size="10.771106" fill="var(--primary-accent)" text-anchor="middle">points to</text>

  <!-- ============================================================ -->
  <!-- CODE SEGMENT panel -->
  <!-- ============================================================ -->
  <rect x="502.295082" y="85.815077" width="354.098361" height="194.958001" rx="6.373938" fill="url(#grad-code)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="1.5"/>

  <!-- add() -->
  <rect x="521.967213" y="105.310877" width="145.57377" height="77.983201" rx="6.373938" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="594.754098" y="126.756257" font-family="monospace" font-size="12.729498" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">add()</text>
  <text x="531.803279" y="144.302477" font-family="monospace" font-size="10.771106" fill="var(--text)">0x004010a0:</text>
  <text x="531.803279" y="159.899117" font-family="monospace" font-size="10.771106" fill="var(--text)">  return a + b;</text>
  <text x="531.803279" y="175.495757" font-family="monospace" font-size="10.771106" fill="var(--text-faint)">// body</text>

  <!-- sub() -->
  <rect x="691.147541" y="105.310877" width="145.57377" height="77.983201" rx="6.373938" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="763.934426" y="126.756257" font-family="monospace" font-size="12.729498" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">sub()</text>
  <text x="700.983607" y="144.302477" font-family="monospace" font-size="10.771106" fill="var(--text)">0x004010c0:</text>
  <text x="700.983607" y="159.899117" font-family="monospace" font-size="10.771106" fill="var(--text)">  return a - b;</text>
  <text x="700.983607" y="175.495757" font-family="monospace" font-size="10.771106" fill="var(--text-faint)">// body</text>

  <!-- reassign arrow note -->
  <text x="679.344262" y="215.462201" font-family="sans-serif" font-size="11.750249" fill="var(--ok-accent)" text-anchor="middle">op = sub; → pointer changes, function stays</text>

  <!-- ============================================================ -->
  <!-- DISPATCH TABLE panel -->
  <!-- ============================================================ -->
  <rect x="964.590164" y="85.815077" width="275.409836" height="194.958001" rx="6.373938" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>

  <!-- Array entries -->
  <rect x="984.262295" y="105.310877" width="236.065574" height="35.09244" rx="6.373938" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="994.098361" y="125.781521" font-family="monospace" font-size="11.750249" fill="var(--text)">dispatch[0]: { '+', op_add }</text>

  <rect x="984.262295" y="146.252057" width="236.065574" height="35.09244" rx="6.373938" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="994.098361" y="166.722593" font-family="monospace" font-size="11.750249" fill="var(--text)">dispatch[1]: { '-', op_sub }</text>

  <rect x="984.262295" y="187.193237" width="236.065574" height="35.09244" rx="6.373938" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="994.098361" y="207.663881" font-family="monospace" font-size="11.750249" fill="var(--text)">dispatch[2]: { '*', op_mul }</text>

  <rect x="984.262295" y="228.134417" width="236.065574" height="35.09244" rx="6.373938" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="994.098361" y="248.604954" font-family="monospace" font-size="11.750249" fill="var(--text)">dispatch[3]: { '/', op_div }</text>

  <!-- ============================================================ -->
  <!-- SYNTAX BREAKDOWN SECTION -->
  <!-- ============================================================ -->
  <rect x="40" y="296.369718" width="600" height="160.840297" rx="6.373938" fill="var(--surface)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1"/>
  <text x="59.672131" y="320.739522" font-family="sans-serif" font-size="13.708641" font-weight="bold" fill="var(--text)">Declaration Syntax Breakdown</text>

  <!-- Declaration label boxes -->
  <text x="99.016393" y="361.680595" font-family="monospace" font-size="21.542105" fill="var(--primary-accent)" text-anchor="middle">int</text>
  <text x="226.885246" y="361.680595" font-family="monospace" font-size="21.542105" fill="var(--danger-accent)" text-anchor="middle">(*op)</text>
  <text x="384.262295" y="361.680595" font-family="monospace" font-size="21.542105" fill="var(--ok-accent)" text-anchor="middle">(int, int)</text>
  <text x="541.639344" y="361.680595" font-family="monospace" font-size="21.542105" fill="var(--text-faint)" text-anchor="middle">;</text>

  <!-- Underline labels -->
  <line x1="64.590164" y1="368.504178" x2="133.442623" y2="368.504178" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="99.016393" y="387.999978" font-family="sans-serif" font-size="11.750249" fill="var(--primary-accent)" text-anchor="middle">return type</text>

  <line x1="182.622951" y1="368.504178" x2="271.147541" y2="368.504178" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="226.885246" y="387.999978" font-family="sans-serif" font-size="11.750249" fill="var(--danger-accent)" text-anchor="middle">pointer name</text>

  <line x1="310.491803" y1="368.504178" x2="458.032787" y2="368.504178" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="384.262295" y="387.999978" font-family="sans-serif" font-size="11.750249" fill="var(--ok-accent)" text-anchor="middle">parameter types</text>

  <!-- typedef row -->
  <rect x="59.672131" y="405.546199" width="560.655738" height="38.9916" rx="6.373938" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="74.42623" y="422.117682" font-family="monospace" font-size="12.729498" fill="var(--text-muted)">typedef</text>
  <text x="143.278689" y="422.117682" font-family="monospace" font-size="12.729498" fill="var(--primary-accent)">int</text>
  <text x="172.786885" y="422.117682" font-family="monospace" font-size="12.729498" fill="var(--danger-accent)">(*BinaryOp)</text>
  <text x="288.852459" y="422.117682" font-family="monospace" font-size="12.729498" fill="var(--ok-accent)">(int, int)</text>
  <text x="394.098361" y="422.117682" font-family="monospace" font-size="12.729498" fill="var(--text-muted)">;</text>
  <text x="74.42623" y="436.739479" font-family="sans-serif" font-size="10.771106" fill="var(--text-faint)">→ now use:  BinaryOp op;   BinaryOp ops[] = {add, mul};</text>

  <!-- ============================================================ -->
  <!-- PATTERNS / USE CASES ROW -->
  <!-- ============================================================ -->
  <rect x="40" y="473.781499" width="281.311475" height="146.218501" rx="6.373938" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="180.655738" y="496.201723" font-family="sans-serif" font-size="12.729498" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Callbacks</text>
  <text x="59.672131" y="515.697523" font-family="monospace" font-size="10.771106" fill="var(--text)">typedef void (*CB)(const char*);</text>
  <text x="59.672131" y="533.243636" font-family="monospace" font-size="10.771106" fill="var(--text)">void register(CB callback);</text>
  <text x="59.672131" y="553.71428" font-family="sans-serif" font-size="10.771106" fill="var(--text-muted)">Pass function as argument to</text>
  <text x="59.672131" y="568.336076" font-family="sans-serif" font-size="10.771106" fill="var(--text-muted)">be called later (event systems,</text>
  <text x="59.672131" y="582.95798" font-family="sans-serif" font-size="10.771106" fill="var(--text-muted)">qsort, signal handlers)</text>

  <rect x="335.081967" y="473.781499" width="281.311475" height="146.218501" rx="6.373938" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="475.737705" y="496.201723" font-family="sans-serif" font-size="12.729498" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">State Machine</text>
  <text x="354.754098" y="515.697523" font-family="monospace" font-size="10.771106" fill="var(--text)">StateHandler handlers[] = {</text>
  <text x="354.754098" y="533.243636" font-family="monospace" font-size="10.771106" fill="var(--text)">  [IDLE]    = handle_idle,</text>
  <text x="354.754098" y="550.789963" font-family="monospace" font-size="10.771106" fill="var(--text)">  [RUNNING] = handle_run,</text>
  <text x="354.754098" y="568.336076" font-family="monospace" font-size="10.771106" fill="var(--text)">};</text>
  <text x="354.754098" y="587.831876" font-family="sans-serif" font-size="10.771106" fill="var(--text-muted)">Map states to handler functions</text>
  <text x="354.754098" y="602.45378" font-family="sans-serif" font-size="10.771106" fill="var(--text-muted)">for clean transitions</text>

  <rect x="630.163934" y="473.781499" width="281.311475" height="146.218501" rx="6.373938" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="770.819672" y="496.201723" font-family="sans-serif" font-size="12.729498" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Plugin System</text>
  <text x="647.868852" y="515.697523" font-family="monospace" font-size="10.771106" fill="var(--text)">typedef struct {</text>
  <text x="647.868852" y="533.243636" font-family="monospace" font-size="10.771106" fill="var(--text)">  int (*init)(void);</text>
  <text x="647.868852" y="550.789963" font-family="monospace" font-size="10.771106" fill="var(--text)">  void (*process)(char*);</text>
  <text x="647.868852" y="568.336076" font-family="monospace" font-size="10.771106" fill="var(--text)">  void (*shutdown)(void);</text>
  <text x="647.868852" y="585.882404" font-family="monospace" font-size="10.771106" fill="var(--text)">} Plugin;</text>
  <text x="647.868852" y="606.35294" font-family="sans-serif" font-size="10.771106" fill="var(--text-muted)">Struct of function pointers</text>

  <rect x="925.245902" y="473.781499" width="314.754098" height="146.218501" rx="6.373938" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1082.622951" y="496.201723" font-family="sans-serif" font-size="12.729498" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">NULL Safety Rule</text>
  <text x="944.918033" y="520.571419" font-family="monospace" font-size="11.750249" fill="var(--text)">if (op != NULL) {</text>
  <text x="944.918033" y="538.117639" font-family="monospace" font-size="11.750249" fill="var(--text)">    result = op(a, b);</text>
  <text x="944.918033" y="555.66386" font-family="monospace" font-size="11.750249" fill="var(--text)">}</text>
  <text x="944.918033" y="579.05882" font-family="sans-serif" font-size="10.771106" fill="var(--text-muted)">Always check before calling</text>
  <text x="944.918033" y="593.680724" font-family="sans-serif" font-size="10.771106" fill="var(--text-muted)">through a function pointer.</text>
  <text x="944.918033" y="608.30252" font-family="sans-serif" font-size="10.771106" fill="var(--danger-accent)">NULL dereference = crash!</text>

  <!-- connect dispatch table arrow to code segment -->
  <line x1="856.393443" y1="156.974801" x2="961.639344" y2="176.470601" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-ok)"/>
  <text x="907.540984" y="156.974801" font-family="sans-serif" font-size="10.771106" fill="var(--text-faint)" text-anchor="middle">each entry</text>
  <text x="907.540984" y="169.647017" font-family="sans-serif" font-size="10.771106" fill="var(--text-faint)" text-anchor="middle">→ fn addr</text>
</svg>

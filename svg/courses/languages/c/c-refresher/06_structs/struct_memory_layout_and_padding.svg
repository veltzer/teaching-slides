<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="890.025575" height="307.876837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.523397" />
  <text x="70.690537" y="103.561705" font-size="29.628179" fill="var(--text)">struct Example {</text>
  <text x="70.690537" y="163.15071" font-size="29.628179" fill="var(--text)">    char  a;  /* 1 byte  */</text>
  <text x="70.690537" y="222.739839" font-size="29.628179" fill="var(--text)">    int   b;  /* 4 bytes */</text>
  <text x="70.690537" y="282.328845" font-size="29.628179" fill="var(--text)">    char  c;  /* 1 byte  */</text>
  <text x="70.690537" y="341.91785" font-size="29.628179" fill="var(--text)">};</text>
  <text x="40" y="421.369858" font-size="29.628179" font-weight="bold" fill="var(--text)" font-family="sans-serif">Memory layout (with padding on 64-bit):</text>
  <rect x="40" y="451.164422" width="168.797954" height="119.178135" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.523397"/>
  <text x="124.398977" y="508.767263" text-anchor="middle" font-size="27.159235" font-weight="bold" fill="var(--text)">a</text>
  <text x="124.398977" y="548.493144" text-anchor="middle" font-size="22.221206" fill="var(--text-muted)">1B</text>
  <rect x="213.401535" y="451.164422" width="253.196931" height="119.178135" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5.3333 2.6667" rx="8.523397" filter="url(#shadow)"/>
  <text x="340.767263" y="508.767263" text-anchor="middle" font-size="27.159235" fill="var(--text-faint)">padding</text>
  <text x="340.767263" y="548.493144" text-anchor="middle" font-size="22.221206" fill="var(--text-faint)">3B</text>
  <rect x="471.202046" y="451.164422" width="337.595908" height="119.178135" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.523397"/>
  <text x="640" y="508.767263" text-anchor="middle" font-size="27.159235" font-weight="bold" fill="var(--text)">b</text>
  <text x="640" y="548.493144" text-anchor="middle" font-size="22.221206" fill="var(--text-muted)">4B</text>
  <rect x="813.401535" y="451.164422" width="168.797954" height="119.178135" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.523397"/>
  <text x="897.800512" y="508.767263" text-anchor="middle" font-size="27.159235" font-weight="bold" fill="var(--text)">c</text>
  <text x="897.800512" y="548.493144" text-anchor="middle" font-size="22.221206" fill="var(--text-muted)">1B</text>
  <rect x="986.803069" y="451.164422" width="253.196931" height="119.178135" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5.3333 2.6667" rx="8.523397" filter="url(#shadow)"/>
  <text x="1114.168798" y="508.767263" text-anchor="middle" font-size="27.159235" fill="var(--text-faint)">padding</text>
  <text x="1114.168798" y="548.493144" text-anchor="middle" font-size="22.221206" fill="var(--text-faint)">3B</text>
  <text x="40" y="620" font-size="27.159235" fill="var(--text-muted)" font-family="sans-serif">Offset: 0    1         4              8      9     -- Total: 12 bytes (not 6!)</text>
</svg>
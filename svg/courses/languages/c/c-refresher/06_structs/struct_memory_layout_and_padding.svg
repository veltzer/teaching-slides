<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="890.025575" height="307.876837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.523397"/>
  <text x="70.690537" y="103.561705" font-size="29.628179" fill="var(--text)" font-family="Arial, sans-serif">struct Example {</text>
  <text x="70.690537" y="163.15071" font-size="29.628179" fill="var(--text)" font-family="Arial, sans-serif">    char  a;  /* 1 byte  */</text>
  <text x="70.690537" y="222.739839" font-size="29.628179" fill="var(--text)" font-family="Arial, sans-serif">    int   b;  /* 4 bytes */</text>
  <text x="70.690537" y="282.328845" font-size="29.628179" fill="var(--text)" font-family="Arial, sans-serif">    char  c;  /* 1 byte  */</text>
  <text x="70.690537" y="341.91785" font-size="29.628179" fill="var(--text)" font-family="Arial, sans-serif">};</text>
  <text x="40" y="421.369858" font-size="29.628179" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory layout (with padding on 64-bit):</text>
  <rect x="40" y="451.164422" width="168.797954" height="119.178135" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.523397"/>
  <text x="124.398977" y="508.767263" text-anchor="middle" font-size="27.159235" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">a</text>
  <text x="124.398977" y="548.493144" text-anchor="middle" font-size="22.221206" fill="var(--text-muted)" font-family="Arial, sans-serif">1B</text>
  <rect x="213.401535" y="451.164422" width="253.196931" height="119.178135" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5.3333 2.6667" rx="8.523397" filter="url(#shadow)"/>
  <text x="340.767263" y="508.767263" text-anchor="middle" font-size="27.159235" fill="var(--text-faint)" font-family="Arial, sans-serif">padding</text>
  <text x="340.767263" y="548.493144" text-anchor="middle" font-size="22.221206" fill="var(--text-faint)" font-family="Arial, sans-serif">3B</text>
  <rect x="471.202046" y="451.164422" width="337.595908" height="119.178135" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.523397"/>
  <text x="640" y="508.767263" text-anchor="middle" font-size="27.159235" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">b</text>
  <text x="640" y="548.493144" text-anchor="middle" font-size="22.221206" fill="var(--text-muted)" font-family="Arial, sans-serif">4B</text>
  <rect x="813.401535" y="451.164422" width="168.797954" height="119.178135" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.523397"/>
  <text x="897.800512" y="508.767263" text-anchor="middle" font-size="27.159235" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">c</text>
  <text x="897.800512" y="548.493144" text-anchor="middle" font-size="22.221206" fill="var(--text-muted)" font-family="Arial, sans-serif">1B</text>
  <rect x="986.803069" y="451.164422" width="253.196931" height="119.178135" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5.3333 2.6667" rx="8.523397" filter="url(#shadow)"/>
  <text x="1114.168798" y="508.767263" text-anchor="middle" font-size="27.159235" fill="var(--text-faint)" font-family="Arial, sans-serif">padding</text>
  <text x="1114.168798" y="548.493144" text-anchor="middle" font-size="22.221206" fill="var(--text-faint)" font-family="Arial, sans-serif">3B</text>
  <text x="40" y="620" font-size="27.159235" fill="var(--text-muted)" font-family="Arial, sans-serif">Offset: 0    1         4              8      9     -- Total: 12 bytes (not 6!)</text>
</svg>

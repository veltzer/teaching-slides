<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="monospace">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="32" width="515.5556" height="275.5556" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="35.5556" y="88.8889" font-size="21.3333" fill="var(--text)">struct Example {</text>
  <text x="35.5556" y="142.2222" font-size="21.3333" fill="var(--text)">    char  a;  /* 1 byte  */</text>
  <text x="35.5556" y="195.5556" font-size="21.3333" fill="var(--text)">    int   b;  /* 4 bytes */</text>
  <text x="35.5556" y="248.8889" font-size="21.3333" fill="var(--text)">    char  c;  /* 1 byte  */</text>
  <text x="35.5556" y="302.2222" font-size="21.3333" fill="var(--text)">};</text>
  <text x="17.7778" y="373.3333" font-size="21.3333" font-weight="bold" fill="var(--text)" font-family="sans-serif">Memory layout (with padding on 64-bit):</text>
  <rect x="17.7778" y="400" width="97.7778" height="106.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="66.6667" y="451.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--text)">a</text>
  <text x="66.6667" y="487.1111" text-anchor="middle" font-size="16" fill="var(--text-muted)">1B</text>
  <rect x="118.2222" y="400" width="146.6667" height="106.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5.3333 2.6667" rx="6"/>
  <text x="192" y="451.5556" text-anchor="middle" font-size="19.5556" fill="var(--text-faint)">padding</text>
  <text x="192" y="487.1111" text-anchor="middle" font-size="16" fill="var(--text-faint)">3B</text>
  <rect x="267.5556" y="400" width="195.5556" height="106.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="365.3333" y="451.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--text)">b</text>
  <text x="365.3333" y="487.1111" text-anchor="middle" font-size="16" fill="var(--text-muted)">4B</text>
  <rect x="465.7778" y="400" width="97.7778" height="106.6667" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" rx="6"/>
  <text x="514.6667" y="451.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--text)">c</text>
  <text x="514.6667" y="487.1111" text-anchor="middle" font-size="16" fill="var(--text-muted)">1B</text>
  <rect x="566.2222" y="400" width="146.6667" height="106.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5.3333 2.6667" rx="6"/>
  <text x="640" y="451.5556" text-anchor="middle" font-size="19.5556" fill="var(--text-faint)">padding</text>
  <text x="640" y="487.1111" text-anchor="middle" font-size="16" fill="var(--text-faint)">3B</text>
  <text x="17.7778" y="551.1111" font-size="19.5556" fill="var(--text-muted)" font-family="sans-serif">Offset: 0    1         4              8      9     -- Total: 12 bytes (not 6!)</text>
</svg>
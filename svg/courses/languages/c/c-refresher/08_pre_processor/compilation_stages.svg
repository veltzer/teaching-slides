<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-tool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#673ab7"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>
    <linearGradient id="grad-file" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Title bar -->
  <rect x="40" y="30" width="1200" height="48" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="62" font-family="Arial, sans-serif" font-size="20" fill="var(--bg)" font-weight="bold" text-anchor="middle">C Compilation Pipeline</text>

  <!-- ====== Stage 1: Source file ====== -->
  <!-- File box -->
  <rect x="40" y="120" width="155" height="100" rx="8" fill="url(#grad-surface)" stroke="var(--ok-soft)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="120" width="155" height="30" rx="8" fill="url(#grad-file)"/>
  <rect x="40" y="140" width="155" height="10" fill="url(#grad-file)"/>
  <text x="117" y="142" font-family="monospace" font-size="14" fill="var(--bg)" font-weight="bold" text-anchor="middle">source.c</text>
  <text x="117" y="172" font-family="monospace" font-size="13" fill="var(--ok-deep)" text-anchor="middle">#include ...</text>
  <text x="117" y="191" font-family="monospace" font-size="13" fill="var(--ok-deep)" text-anchor="middle">#define ...</text>
  <text x="117" y="210" font-family="monospace" font-size="13" fill="var(--ok-deep)" text-anchor="middle">int main() {...}</text>

  <!-- Arrow -->
  <line x1="195" y1="170" x2="245" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tool: Preprocessor (cpp) -->
  <rect x="246" y="135" width="155" height="70" rx="8" fill="url(#grad-tool)" filter="url(#shadow)"/>
  <text x="323" y="163" font-family="Arial, sans-serif" font-size="15" fill="var(--bg)" font-weight="bold" text-anchor="middle">Preprocessor</text>
  <text x="323" y="182" font-family="monospace" font-size="13" fill="var(--info-tint)" text-anchor="middle">cpp / gcc -E</text>
  <text x="323" y="199" font-family="Arial, sans-serif" font-size="12" fill="var(--info-lt)" text-anchor="middle">macro expand · #include</text>

  <!-- Arrow -->
  <line x1="401" y1="170" x2="451" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- File: preprocessed.i -->
  <rect x="452" y="120" width="155" height="100" rx="8" fill="url(#grad-surface)" stroke="var(--ok-soft)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="452" y="120" width="155" height="30" rx="8" fill="url(#grad-file)"/>
  <rect x="452" y="140" width="155" height="10" fill="url(#grad-file)"/>
  <text x="529" y="142" font-family="monospace" font-size="14" fill="var(--bg)" font-weight="bold" text-anchor="middle">preprocessed.i</text>
  <text x="529" y="172" font-family="monospace" font-size="12" fill="var(--ok-deep)" text-anchor="middle">// no directives</text>
  <text x="529" y="191" font-family="monospace" font-size="12" fill="var(--ok-deep)" text-anchor="middle">int printf(...);</text>
  <text x="529" y="210" font-family="monospace" font-size="12" fill="var(--ok-deep)" text-anchor="middle">int main() {...}</text>

  <!-- Arrow -->
  <line x1="607" y1="170" x2="657" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tool: Compiler (cc1) -->
  <rect x="658" y="135" width="155" height="70" rx="8" fill="url(#grad-tool)" filter="url(#shadow)"/>
  <text x="735" y="163" font-family="Arial, sans-serif" font-size="15" fill="var(--bg)" font-weight="bold" text-anchor="middle">Compiler</text>
  <text x="735" y="182" font-family="monospace" font-size="13" fill="var(--info-tint)" text-anchor="middle">cc1 / gcc -S</text>
  <text x="735" y="199" font-family="Arial, sans-serif" font-size="12" fill="var(--info-lt)" text-anchor="middle">parse · optimize · codegen</text>

  <!-- Arrow -->
  <line x1="813" y1="170" x2="863" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- File: assembly.s -->
  <rect x="864" y="120" width="155" height="100" rx="8" fill="url(#grad-surface)" stroke="var(--ok-soft)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="864" y="120" width="155" height="30" rx="8" fill="url(#grad-file)"/>
  <rect x="864" y="140" width="155" height="10" fill="url(#grad-file)"/>
  <text x="941" y="142" font-family="monospace" font-size="14" fill="var(--bg)" font-weight="bold" text-anchor="middle">assembly.s</text>
  <text x="941" y="172" font-family="monospace" font-size="12" fill="var(--ok-deep)" text-anchor="middle">movl $0, %eax</text>
  <text x="941" y="191" font-family="monospace" font-size="12" fill="var(--ok-deep)" text-anchor="middle">call printf</text>
  <text x="941" y="210" font-family="monospace" font-size="12" fill="var(--ok-deep)" text-anchor="middle">ret</text>

  <!-- Arrow -->
  <line x1="1019" y1="170" x2="1069" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tool: Assembler (as) -->
  <rect x="1070" y="135" width="155" height="70" rx="8" fill="url(#grad-tool)" filter="url(#shadow)"/>
  <text x="1147" y="163" font-family="Arial, sans-serif" font-size="15" fill="var(--bg)" font-weight="bold" text-anchor="middle">Assembler</text>
  <text x="1147" y="182" font-family="monospace" font-size="13" fill="var(--info-tint)" text-anchor="middle">as / gcc -c</text>
  <text x="1147" y="199" font-family="Arial, sans-serif" font-size="12" fill="var(--info-lt)" text-anchor="middle">asm → machine code</text>

  <!-- ====== Second row ====== -->
  <!-- Arrow down from assembler -->
  <line x1="1147" y1="205" x2="1147" y2="280" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- File: object.o -->
  <rect x="1070" y="282" width="155" height="100" rx="8" fill="url(#grad-surface)" stroke="var(--ok-soft)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1070" y="282" width="155" height="30" rx="8" fill="url(#grad-file)"/>
  <rect x="1070" y="302" width="155" height="10" fill="url(#grad-file)"/>
  <text x="1147" y="304" font-family="monospace" font-size="14" fill="var(--bg)" font-weight="bold" text-anchor="middle">object.o</text>
  <text x="1147" y="334" font-family="monospace" font-size="12" fill="var(--ok-deep)" text-anchor="middle">ELF binary</text>
  <text x="1147" y="353" font-family="monospace" font-size="12" fill="var(--ok-deep)" text-anchor="middle">symbols: extern</text>
  <text x="1147" y="372" font-family="monospace" font-size="12" fill="var(--ok-deep)" text-anchor="middle">unresolved refs</text>

  <!-- Arrow left from object.o -->
  <line x1="1070" y1="332" x2="1020" y2="332" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tool: Linker (ld) -->
  <rect x="864" y="297" width="155" height="70" rx="8" fill="url(#grad-tool)" filter="url(#shadow)"/>
  <text x="941" y="325" font-family="Arial, sans-serif" font-size="15" fill="var(--bg)" font-weight="bold" text-anchor="middle">Linker</text>
  <text x="941" y="344" font-family="monospace" font-size="13" fill="var(--info-tint)" text-anchor="middle">ld / gcc (link)</text>
  <text x="941" y="361" font-family="Arial, sans-serif" font-size="12" fill="var(--info-lt)" text-anchor="middle">resolve symbols</text>

  <!-- Libraries input -->
  <rect x="864" y="390" width="155" height="40" rx="6" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="1.5"/>
  <text x="941" y="415" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-dk)" text-anchor="middle">libc.a / libc.so</text>
  <line x1="941" y1="390" x2="941" y2="367" stroke="var(--warn-mid)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow left from linker -->
  <line x1="864" y1="332" x2="814" y2="332" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- File: executable -->
  <rect x="628" y="282" width="185" height="100" rx="8" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="628" y="282" width="185" height="30" rx="8" fill="url(#grad-file)"/>
  <rect x="628" y="302" width="185" height="10" fill="url(#grad-file)"/>
  <text x="720" y="304" font-family="monospace" font-size="14" fill="var(--bg)" font-weight="bold" text-anchor="middle">./program</text>
  <text x="720" y="334" font-family="monospace" font-size="12" fill="var(--ok-deep)" text-anchor="middle">ELF executable</text>
  <text x="720" y="353" font-family="monospace" font-size="12" fill="var(--ok-deep)" text-anchor="middle">fully linked</text>
  <text x="720" y="372" font-family="monospace" font-size="12" fill="var(--ok-deep)" font-weight="bold" text-anchor="middle">ready to run!</text>

  <!-- Commands reference panel -->
  <rect x="40" y="282" width="570" height="160" rx="8" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="308" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-dk)" font-weight="bold">GCC Flags to Inspect Each Stage</text>
  <text x="60" y="332" font-family="monospace" font-size="14" fill="var(--text-dark)">gcc -E source.c -o preprocessed.i</text>
  <text x="60" y="354" font-family="monospace" font-size="14" fill="var(--text-dark)">gcc -S source.c -o assembly.s</text>
  <text x="60" y="376" font-family="monospace" font-size="14" fill="var(--text-dark)">gcc -c source.c -o object.o</text>
  <text x="60" y="398" font-family="monospace" font-size="14" fill="var(--text-dark)">gcc source.c -o program  </text>
  <text x="358" y="398" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">(all stages)</text>
  <text x="60" y="428" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Add -v to see each sub-command invoked by gcc</text>

  <!-- Bottom notes -->
  <rect x="40" y="460" width="1200" height="88" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="484" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-dk)" font-weight="bold">Key Points</text>
  <text x="60" y="506" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">• Preprocessor runs first: expands macros, includes headers, strips comments — output is plain C text</text>
  <text x="60" y="526" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">• Compiler performs type checking, optimization, and code generation — this is where most errors are caught</text>
  <text x="60" y="546" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">• Linker resolves extern symbols and pulls in library code — produces the final executable binary</text>
</svg>

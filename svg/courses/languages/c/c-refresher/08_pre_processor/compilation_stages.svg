<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-tool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#673ab7"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>
    <linearGradient id="grad-file" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <!-- Title bar -->
  <rect x="40" y="40" width="1200" height="53.745174" rx="6.887962" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="75.830116" font-family="Arial, sans-serif" font-size="21.163147" fill="var(--bg)" font-weight="bold" text-anchor="middle">C Compilation Pipeline</text>

  <!-- ====== Stage 1: Source file ====== -->
  <!-- File box -->
  <rect x="40" y="140.772201" width="155" height="111.969112" rx="6.887962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="140.772201" width="155" height="33.590734" rx="6.887962" fill="url(#grad-file)"/>
  <rect x="40" y="163.166023" width="155" height="11.196911" fill="url(#grad-file)" rx="6.887962"/>
  <text x="117" y="165.405405" font-family="monospace" font-size="14.814169" fill="var(--bg)" font-weight="bold" text-anchor="middle">source.c</text>
  <text x="117" y="198.996139" font-family="monospace" font-size="13.756063" fill="var(--ok-accent)" text-anchor="middle">#include ...</text>
  <text x="117" y="220.270332" font-family="monospace" font-size="13.756063" fill="var(--ok-accent)" text-anchor="middle">#define ...</text>
  <text x="117" y="241.544402" font-family="monospace" font-size="13.756063" fill="var(--ok-accent)" text-anchor="middle">int main() {...}</text>

  <!-- Arrow -->
  <line x1="195" y1="196.756757" x2="245" y2="196.756757" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tool: Preprocessor (cpp) -->
  <rect x="246" y="157.567629" width="155" height="78.378378" rx="6.887962" fill="url(#grad-tool)"/>
  <text x="323" y="188.918981" font-family="Arial, sans-serif" font-size="15.872274" fill="var(--bg)" font-weight="bold" text-anchor="middle">Preprocessor</text>
  <text x="323" y="210.19305" font-family="monospace" font-size="13.756063" fill="var(--info-accent)" text-anchor="middle">cpp / gcc -E</text>
  <text x="323" y="229.227861" font-family="Arial, sans-serif" font-size="12.697842" fill="var(--info-accent)" text-anchor="middle">macro expand · #include</text>

  <!-- Arrow -->
  <line x1="401" y1="196.756757" x2="451" y2="196.756757" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- File: preprocessed.i -->
  <rect x="452" y="140.772201" width="155" height="111.969112" rx="6.887962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="452" y="140.772201" width="155" height="33.590734" rx="6.887962" fill="url(#grad-file)"/>
  <rect x="452" y="163.166023" width="155" height="11.196911" fill="url(#grad-file)" rx="6.887962"/>
  <text x="529" y="165.405405" font-family="monospace" font-size="14.814169" fill="var(--bg)" font-weight="bold" text-anchor="middle">preprocessed.i</text>
  <text x="529" y="198.996139" font-family="monospace" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle">// no directives</text>
  <text x="529" y="220.270332" font-family="monospace" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle">int printf(...);</text>
  <text x="529" y="241.544402" font-family="monospace" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle">int main() {...}</text>

  <!-- Arrow -->
  <line x1="607" y1="196.756757" x2="657" y2="196.756757" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tool: Compiler (cc1) -->
  <rect x="658" y="157.567629" width="155" height="78.378378" rx="6.887962" fill="url(#grad-tool)"/>
  <text x="735" y="188.918981" font-family="Arial, sans-serif" font-size="15.872274" fill="var(--bg)" font-weight="bold" text-anchor="middle">Compiler</text>
  <text x="735" y="210.19305" font-family="monospace" font-size="13.756063" fill="var(--info-accent)" text-anchor="middle">cc1 / gcc -S</text>
  <text x="735" y="229.227861" font-family="Arial, sans-serif" font-size="12.697842" fill="var(--info-accent)" text-anchor="middle">parse · optimize · codegen</text>

  <!-- Arrow -->
  <line x1="813" y1="196.756757" x2="863" y2="196.756757" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- File: assembly.s -->
  <rect x="864" y="140.772201" width="155" height="111.969112" rx="6.887962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="864" y="140.772201" width="155" height="33.590734" rx="6.887962" fill="url(#grad-file)"/>
  <rect x="864" y="163.166023" width="155" height="11.196911" fill="url(#grad-file)" rx="6.887962"/>
  <text x="941" y="165.405405" font-family="monospace" font-size="14.814169" fill="var(--bg)" font-weight="bold" text-anchor="middle">assembly.s</text>
  <text x="941" y="198.996139" font-family="monospace" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle">movl $0, %eax</text>
  <text x="941" y="220.270332" font-family="monospace" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle">call printf</text>
  <text x="941" y="241.544402" font-family="monospace" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle">ret</text>

  <!-- Arrow -->
  <line x1="1019" y1="196.756757" x2="1069" y2="196.756757" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tool: Assembler (as) -->
  <rect x="1070" y="157.567629" width="155" height="78.378378" rx="6.887962" fill="url(#grad-tool)"/>
  <text x="1147" y="188.918981" font-family="Arial, sans-serif" font-size="15.872274" fill="var(--bg)" font-weight="bold" text-anchor="middle">Assembler</text>
  <text x="1147" y="210.19305" font-family="monospace" font-size="13.756063" fill="var(--info-accent)" text-anchor="middle">as / gcc -c</text>
  <text x="1147" y="229.227861" font-family="Arial, sans-serif" font-size="12.697842" fill="var(--info-accent)" text-anchor="middle">asm → machine code</text>

  <!-- ====== Second row ====== -->
  <!-- Arrow down from assembler -->
  <line x1="1147" y1="235.945884" x2="1147" y2="319.92278" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- File: object.o -->
  <rect x="1070" y="322.162162" width="155" height="111.969112" rx="6.887962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="1070" y="322.162162" width="155" height="33.590734" rx="6.887962" fill="url(#grad-file)"/>
  <rect x="1070" y="344.555985" width="155" height="11.196911" fill="url(#grad-file)" rx="6.887962"/>
  <text x="1147" y="346.795367" font-family="monospace" font-size="14.814169" fill="var(--bg)" font-weight="bold" text-anchor="middle">object.o</text>
  <text x="1147" y="380.3861" font-family="monospace" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle">ELF binary</text>
  <text x="1147" y="401.66017" font-family="monospace" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle">symbols: extern</text>
  <text x="1147" y="422.934363" font-family="monospace" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle">unresolved refs</text>

  <!-- Arrow left from object.o -->
  <line x1="1070" y1="378.146718" x2="1020" y2="378.146718" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tool: Linker (ld) -->
  <rect x="864" y="338.957467" width="155" height="78.378378" rx="6.887962" fill="url(#grad-tool)"/>
  <text x="941" y="370.308819" font-family="Arial, sans-serif" font-size="15.872274" fill="var(--bg)" font-weight="bold" text-anchor="middle">Linker</text>
  <text x="941" y="391.583012" font-family="monospace" font-size="13.756063" fill="var(--info-accent)" text-anchor="middle">ld / gcc (link)</text>
  <text x="941" y="410.617699" font-family="Arial, sans-serif" font-size="12.697842" fill="var(--info-accent)" text-anchor="middle">resolve symbols</text>

  <!-- Libraries input -->
  <rect x="864" y="443.088803" width="155" height="44.787645" rx="6.887962" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="941" y="471.081143" font-family="Arial, sans-serif" font-size="13.756063" fill="var(--warn-accent)" text-anchor="middle">libc.a / libc.so</text>
  <line x1="941" y1="443.088803" x2="941" y2="417.335969" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow left from linker -->
  <line x1="864" y1="378.146718" x2="814" y2="378.146718" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- File: executable -->
  <rect x="628" y="322.162162" width="185" height="111.969112" rx="6.887962" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="628" y="322.162162" width="185" height="33.590734" rx="6.887962" fill="url(#grad-file)"/>
  <rect x="628" y="344.555985" width="185" height="11.196911" fill="url(#grad-file)" rx="6.887962"/>
  <text x="720" y="346.795367" font-family="monospace" font-size="14.814169" fill="var(--bg)" font-weight="bold" text-anchor="middle">./program</text>
  <text x="720" y="380.3861" font-family="monospace" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle">ELF executable</text>
  <text x="720" y="401.66017" font-family="monospace" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle">fully linked</text>
  <text x="720" y="422.934363" font-family="monospace" font-size="12.697842" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">ready to run!</text>

  <!-- Commands reference panel -->
  <rect x="40" y="322.162162" width="570" height="179.150579" rx="6.887962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="351.274131" font-family="Arial, sans-serif" font-size="15.872274" fill="var(--primary-accent)" font-weight="bold">GCC Flags to Inspect Each Stage</text>
  <text x="60" y="378.146718" font-family="monospace" font-size="14.814169" fill="var(--text)">gcc -E source.c -o preprocessed.i</text>
  <text x="60" y="402.779923" font-family="monospace" font-size="14.814169" fill="var(--text)">gcc -S source.c -o assembly.s</text>
  <text x="60" y="427.413127" font-family="monospace" font-size="14.814169" fill="var(--text)">gcc -c source.c -o object.o</text>
  <text x="60" y="452.046332" font-family="monospace" font-size="14.814169" fill="var(--text)">gcc source.c -o program  </text>
  <text x="358" y="452.046332" font-family="Arial, sans-serif" font-size="13.756063" fill="var(--text-faint)">(all stages)</text>
  <text x="60" y="485.637066" font-family="Arial, sans-serif" font-size="13.756063" fill="var(--text-faint)">Add -v to see each sub-command invoked by gcc</text>

  <!-- Bottom notes -->
  <rect x="40" y="521.467181" width="1200" height="98.532819" rx="6.887962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="548.339768" font-family="Arial, sans-serif" font-size="15.872274" fill="var(--primary-accent)" font-weight="bold">Key Points</text>
  <text x="60" y="572.972973" font-family="Arial, sans-serif" font-size="14.814169" fill="var(--text)">• Preprocessor runs first: expands macros, includes headers, strips comments — output is plain C text</text>
  <text x="60" y="595.366795" font-family="Arial, sans-serif" font-size="14.814169" fill="var(--text)">• Compiler performs type checking, optimization, and code generation — this is where most errors are caught</text>
  <text x="60" y="617.760618" font-family="Arial, sans-serif" font-size="14.814169" fill="var(--text)">• Linker resolves extern symbols and pulls in library code — produces the final executable binary</text>
</svg>

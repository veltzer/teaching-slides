<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Title bar -->
  <rect x="40" y="40" width="1200" height="53.745174" rx="6.887962" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.830116" font-family="Arial, sans-serif" font-size="21.163147" fill="var(--bg)" font-weight="bold" text-anchor="middle">C Compilation Pipeline</text>

  <!-- ====== Stage 1: Source file ====== -->
  <!-- File box -->
  <rect x="40" y="140.772201" width="155" height="111.969112" rx="6.887962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="40" y="140.772201" width="155" height="33.590734" rx="6.887962" fill="url(#grad-file)"/>
  <rect x="40" y="163.166023" width="155" height="11.196911" fill="url(#grad-file)" rx="6.887962"/>
  <text x="117" y="165.405405" font-size="14.814169" fill="var(--bg)" font-weight="bold" text-anchor="middle" font-family="Courier New, monospace">source.c</text>
  <text x="117" y="198.996139" font-size="13.756063" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">#include</text>
  <text x="117" y="220.270332" font-size="13.756063" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">#define</text>
  <text x="117" y="241.544402" font-size="13.756063" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">main()</text>

  <!-- Arrow -->
  <line x1="195" y1="196.756757" x2="245" y2="196.756757" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Tool: Preprocessor (cpp) -->
  <rect x="246" y="157.567629" width="155" height="78.378378" rx="6.887962" fill="url(#grad-tool)"/>
  <text x="323" y="188.918981" font-family="Arial, sans-serif" font-size="15.872274" fill="var(--bg)" font-weight="bold" text-anchor="middle">Preprocessor</text>
  <text x="323" y="210.19305" font-size="13.756063" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">gcc -E</text>
  <text x="323" y="229.227861" font-family="Arial, sans-serif" font-size="12.697842" fill="var(--info-accent)" text-anchor="middle">macros · includes</text>

  <!-- Arrow -->
  <line x1="401" y1="196.756757" x2="451" y2="196.756757" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- File: preprocessed.i -->
  <rect x="452" y="140.772201" width="155" height="111.969112" rx="6.887962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="452" y="140.772201" width="155" height="33.590734" rx="6.887962" fill="url(#grad-file)"/>
  <rect x="452" y="163.166023" width="155" height="11.196911" fill="url(#grad-file)" rx="6.887962"/>
  <text x="529" y="165.405405" font-size="14.814169" fill="var(--bg)" font-weight="bold" text-anchor="middle" font-family="Courier New, monospace">preprocessed.i</text>
  <text x="529" y="198.996139" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">no directives</text>
  <text x="529" y="220.270332" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">int printf();</text>
  <text x="529" y="241.544402" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">main()</text>

  <!-- Arrow -->
  <line x1="607" y1="196.756757" x2="657" y2="196.756757" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Tool: Compiler (cc1) -->
  <rect x="658" y="157.567629" width="155" height="78.378378" rx="6.887962" fill="url(#grad-tool)"/>
  <text x="735" y="188.918981" font-family="Arial, sans-serif" font-size="15.872274" fill="var(--bg)" font-weight="bold" text-anchor="middle">Compiler</text>
  <text x="735" y="210.19305" font-size="13.756063" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">gcc -S</text>
  <text x="735" y="229.227861" font-family="Arial, sans-serif" font-size="12.697842" fill="var(--info-accent)" text-anchor="middle">parse · optimize</text>

  <!-- Arrow -->
  <line x1="813" y1="196.756757" x2="863" y2="196.756757" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- File: assembly.s -->
  <rect x="864" y="140.772201" width="155" height="111.969112" rx="6.887962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="864" y="140.772201" width="155" height="33.590734" rx="6.887962" fill="url(#grad-file)"/>
  <rect x="864" y="163.166023" width="155" height="11.196911" fill="url(#grad-file)" rx="6.887962"/>
  <text x="941" y="165.405405" font-size="14.814169" fill="var(--bg)" font-weight="bold" text-anchor="middle" font-family="Courier New, monospace">assembly.s</text>
  <text x="941" y="198.996139" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">movl</text>
  <text x="941" y="220.270332" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">call</text>
  <text x="941" y="241.544402" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">ret</text>

  <!-- Arrow -->
  <line x1="1019" y1="196.756757" x2="1069" y2="196.756757" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Tool: Assembler (as) -->
  <rect x="1070" y="157.567629" width="155" height="78.378378" rx="6.887962" fill="url(#grad-tool)"/>
  <text x="1147" y="188.918981" font-family="Arial, sans-serif" font-size="15.872274" fill="var(--bg)" font-weight="bold" text-anchor="middle">Assembler</text>
  <text x="1147" y="210.19305" font-size="13.756063" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">gcc -c</text>
  <text x="1147" y="229.227861" font-family="Arial, sans-serif" font-size="12.697842" fill="var(--info-accent)" text-anchor="middle">→ machine code</text>

  <!-- ====== Second row ====== -->
  <!-- Arrow down from assembler -->
  <line x1="1147" y1="235.945884" x2="1147" y2="319.92278" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- File: object.o -->
  <rect x="1070" y="322.162162" width="155" height="111.969112" rx="6.887962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="1070" y="322.162162" width="155" height="33.590734" rx="6.887962" fill="url(#grad-file)"/>
  <rect x="1070" y="344.555985" width="155" height="11.196911" fill="url(#grad-file)" rx="6.887962"/>
  <text x="1147" y="346.795367" font-size="14.814169" fill="var(--bg)" font-weight="bold" text-anchor="middle" font-family="Courier New, monospace">object.o</text>
  <text x="1147" y="380.3861" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">ELF binary</text>
  <text x="1147" y="401.66017" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">extern symbols</text>
  <text x="1147" y="422.934363" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">unresolved</text>

  <!-- Arrow left from object.o -->
  <line x1="1070" y1="378.146718" x2="1020" y2="378.146718" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Tool: Linker (ld) -->
  <rect x="864" y="338.957467" width="155" height="78.378378" rx="6.887962" fill="url(#grad-tool)"/>
  <text x="941" y="370.308819" font-family="Arial, sans-serif" font-size="15.872274" fill="var(--bg)" font-weight="bold" text-anchor="middle">Linker</text>
  <text x="941" y="391.583012" font-size="13.756063" fill="var(--info-accent)" text-anchor="middle" font-family="Courier New, monospace">ld</text>
  <text x="941" y="410.617699" font-family="Arial, sans-serif" font-size="12.697842" fill="var(--info-accent)" text-anchor="middle">resolve symbols</text>

  <!-- Libraries input -->
  <rect x="864" y="443.088803" width="155" height="44.787645" rx="6.887962" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="941" y="471.081143" font-family="Arial, sans-serif" font-size="13.756063" fill="var(--warn-accent)" text-anchor="middle">libc.a / libc.so</text>
  <line x1="941" y1="443.088803" x2="941" y2="417.335969" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow left from linker -->
  <line x1="864" y1="378.146718" x2="814" y2="378.146718" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- File: executable -->
  <rect x="628" y="322.162162" width="185" height="111.969112" rx="6.887962" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="628" y="322.162162" width="185" height="33.590734" rx="6.887962" fill="url(#grad-file)"/>
  <rect x="628" y="344.555985" width="185" height="11.196911" fill="url(#grad-file)" rx="6.887962"/>
  <text x="720" y="346.795367" font-size="14.814169" fill="var(--bg)" font-weight="bold" text-anchor="middle" font-family="Courier New, monospace">./program</text>
  <text x="720" y="380.3861" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">ELF executable</text>
  <text x="720" y="401.66017" font-size="12.697842" fill="var(--ok-accent)" text-anchor="middle" font-family="Courier New, monospace">linked</text>
  <text x="720" y="422.934363" font-size="12.697842" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle" font-family="Courier New, monospace">runnable</text>

  <!-- Commands reference panel -->
  <rect x="40" y="322.162162" width="570" height="179.150579" rx="6.887962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="351.274131" font-family="Arial, sans-serif" font-size="15.872274" fill="var(--primary-accent)" font-weight="bold">GCC Flags</text>
  <text x="60" y="378.146718" font-size="14.814169" fill="var(--text)" font-family="Courier New, monospace">gcc -E  → preprocessed.i</text>
  <text x="60" y="402.779923" font-size="14.814169" fill="var(--text)" font-family="Courier New, monospace">gcc -S  → assembly.s</text>
  <text x="60" y="427.413127" font-size="14.814169" fill="var(--text)" font-family="Courier New, monospace">gcc -c  → object.o</text>
  <text x="60" y="452.046332" font-size="14.814169" fill="var(--text)" font-family="Courier New, monospace">gcc     → program (all)</text>
  <text x="60" y="485.637066" font-family="Arial, sans-serif" font-size="13.756063" fill="var(--text-faint)">Use -v to trace sub-commands</text>

  <!-- Bottom notes -->
  <rect x="40" y="521.467181" width="1200" height="98.532819" rx="6.887962" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="548.339768" font-family="Arial, sans-serif" font-size="15.872274" fill="var(--primary-accent)" font-weight="bold">Key Points</text>
  <text x="60" y="572.972973" font-family="Arial, sans-serif" font-size="14.814169" fill="var(--text)">• Preprocessor: expands macros, includes headers, strips comments</text>
  <text x="60" y="595.366795" font-family="Arial, sans-serif" font-size="14.814169" fill="var(--text)">• Compiler: type-checks, optimizes, generates code — most errors caught here</text>
  <text x="60" y="617.760618" font-family="Arial, sans-serif" font-size="14.814169" fill="var(--text)">• Linker: resolves externs, pulls in libraries, emits the executable</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-tool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#673ab7"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>
    <linearGradient id="grad-file" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Title bar -->
  <rect x="77.5" y="67.1875" width="1125" height="43.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="96.1875" font-family="Arial, sans-serif" font-size="18.4349" fill="var(--bg)" font-weight="bold" text-anchor="middle">C Compilation Pipeline</text>

  <!-- ====== Stage 1: Source file ====== -->
  <!-- File box -->
  <rect x="77.5" y="148.75" width="145.3125" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="77.5" y="148.75" width="145.3125" height="27.1875" rx="6" fill="url(#grad-file)"/>
  <rect x="77.5" y="166.875" width="145.3125" height="9.0625" fill="url(#grad-file)" rx="6"/>
  <text x="149.6875" y="168.6875" font-family="monospace" font-size="12.9044" fill="var(--bg)" font-weight="bold" text-anchor="middle">source.c</text>
  <text x="149.6875" y="195.875" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">#include ...</text>
  <text x="149.6875" y="213.0938" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">#define ...</text>
  <text x="149.6875" y="230.3125" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">int main() {...}</text>

  <!-- Arrow -->
  <line x1="222.8125" y1="194.0625" x2="269.6875" y2="194.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tool: Preprocessor (cpp) -->
  <rect x="270.625" y="162.3438" width="145.3125" height="63.4375" rx="6" fill="url(#grad-tool)" filter="url(#shadow)"/>
  <text x="342.8125" y="187.7188" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--bg)" font-weight="bold" text-anchor="middle">Preprocessor</text>
  <text x="342.8125" y="204.9375" font-family="monospace" font-size="11.9827" fill="var(--info-accent)" text-anchor="middle">cpp / gcc -E</text>
  <text x="342.8125" y="220.3438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" text-anchor="middle">macro expand · #include</text>

  <!-- Arrow -->
  <line x1="415.9375" y1="194.0625" x2="462.8125" y2="194.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- File: preprocessed.i -->
  <rect x="463.75" y="148.75" width="145.3125" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="463.75" y="148.75" width="145.3125" height="27.1875" rx="6" fill="url(#grad-file)"/>
  <rect x="463.75" y="166.875" width="145.3125" height="9.0625" fill="url(#grad-file)" rx="6"/>
  <text x="535.9375" y="168.6875" font-family="monospace" font-size="12.9044" fill="var(--bg)" font-weight="bold" text-anchor="middle">preprocessed.i</text>
  <text x="535.9375" y="195.875" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">// no directives</text>
  <text x="535.9375" y="213.0938" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">int printf(...);</text>
  <text x="535.9375" y="230.3125" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">int main() {...}</text>

  <!-- Arrow -->
  <line x1="609.0625" y1="194.0625" x2="655.9375" y2="194.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tool: Compiler (cc1) -->
  <rect x="656.875" y="162.3438" width="145.3125" height="63.4375" rx="6" fill="url(#grad-tool)" filter="url(#shadow)"/>
  <text x="729.0625" y="187.7188" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--bg)" font-weight="bold" text-anchor="middle">Compiler</text>
  <text x="729.0625" y="204.9375" font-family="monospace" font-size="11.9827" fill="var(--info-accent)" text-anchor="middle">cc1 / gcc -S</text>
  <text x="729.0625" y="220.3438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" text-anchor="middle">parse · optimize · codegen</text>

  <!-- Arrow -->
  <line x1="802.1875" y1="194.0625" x2="849.0625" y2="194.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- File: assembly.s -->
  <rect x="850" y="148.75" width="145.3125" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="850" y="148.75" width="145.3125" height="27.1875" rx="6" fill="url(#grad-file)"/>
  <rect x="850" y="166.875" width="145.3125" height="9.0625" fill="url(#grad-file)" rx="6"/>
  <text x="922.1875" y="168.6875" font-family="monospace" font-size="12.9044" fill="var(--bg)" font-weight="bold" text-anchor="middle">assembly.s</text>
  <text x="922.1875" y="195.875" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">movl $0, %eax</text>
  <text x="922.1875" y="213.0938" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">call printf</text>
  <text x="922.1875" y="230.3125" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">ret</text>

  <!-- Arrow -->
  <line x1="995.3125" y1="194.0625" x2="1042.1875" y2="194.0625" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tool: Assembler (as) -->
  <rect x="1043.125" y="162.3438" width="145.3125" height="63.4375" rx="6" fill="url(#grad-tool)" filter="url(#shadow)"/>
  <text x="1115.3125" y="187.7188" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--bg)" font-weight="bold" text-anchor="middle">Assembler</text>
  <text x="1115.3125" y="204.9375" font-family="monospace" font-size="11.9827" fill="var(--info-accent)" text-anchor="middle">as / gcc -c</text>
  <text x="1115.3125" y="220.3438" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" text-anchor="middle">asm → machine code</text>

  <!-- ====== Second row ====== -->
  <!-- Arrow down from assembler -->
  <line x1="1115.3125" y1="225.7812" x2="1115.3125" y2="293.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- File: object.o -->
  <rect x="1043.125" y="295.5625" width="145.3125" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="1043.125" y="295.5625" width="145.3125" height="27.1875" rx="6" fill="url(#grad-file)"/>
  <rect x="1043.125" y="313.6875" width="145.3125" height="9.0625" fill="url(#grad-file)" rx="6"/>
  <text x="1115.3125" y="315.5" font-family="monospace" font-size="12.9044" fill="var(--bg)" font-weight="bold" text-anchor="middle">object.o</text>
  <text x="1115.3125" y="342.6875" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">ELF binary</text>
  <text x="1115.3125" y="359.9062" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">symbols: extern</text>
  <text x="1115.3125" y="377.125" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">unresolved refs</text>

  <!-- Arrow left from object.o -->
  <line x1="1043.125" y1="340.875" x2="996.25" y2="340.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tool: Linker (ld) -->
  <rect x="850" y="309.1562" width="145.3125" height="63.4375" rx="6" fill="url(#grad-tool)" filter="url(#shadow)"/>
  <text x="922.1875" y="334.5312" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--bg)" font-weight="bold" text-anchor="middle">Linker</text>
  <text x="922.1875" y="351.75" font-family="monospace" font-size="11.9827" fill="var(--info-accent)" text-anchor="middle">ld / gcc (link)</text>
  <text x="922.1875" y="367.1562" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)" text-anchor="middle">resolve symbols</text>

  <!-- Libraries input -->
  <rect x="850" y="393.4375" width="145.3125" height="36.25" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="922.1875" y="416.0938" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle">libc.a / libc.so</text>
  <line x1="922.1875" y1="393.4375" x2="922.1875" y2="372.5938" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow left from linker -->
  <line x1="850" y1="340.875" x2="803.125" y2="340.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- File: executable -->
  <rect x="628.75" y="295.5625" width="173.4375" height="90.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="628.75" y="295.5625" width="173.4375" height="27.1875" rx="6" fill="url(#grad-file)"/>
  <rect x="628.75" y="313.6875" width="173.4375" height="9.0625" fill="url(#grad-file)" rx="6"/>
  <text x="715" y="315.5" font-family="monospace" font-size="12.9044" fill="var(--bg)" font-weight="bold" text-anchor="middle">./program</text>
  <text x="715" y="342.6875" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">ELF executable</text>
  <text x="715" y="359.9062" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" text-anchor="middle">fully linked</text>
  <text x="715" y="377.125" font-family="monospace" font-size="11.0609" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">ready to run!</text>

  <!-- Commands reference panel -->
  <rect x="77.5" y="295.5625" width="534.375" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="96.25" y="319.125" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--primary-accent)" font-weight="bold">GCC Flags to Inspect Each Stage</text>
  <text x="96.25" y="340.875" font-family="monospace" font-size="12.9044" fill="var(--text)">gcc -E source.c -o preprocessed.i</text>
  <text x="96.25" y="360.8125" font-family="monospace" font-size="12.9044" fill="var(--text)">gcc -S source.c -o assembly.s</text>
  <text x="96.25" y="380.75" font-family="monospace" font-size="12.9044" fill="var(--text)">gcc -c source.c -o object.o</text>
  <text x="96.25" y="400.6875" font-family="monospace" font-size="12.9044" fill="var(--text)">gcc source.c -o program  </text>
  <text x="375.625" y="400.6875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)">(all stages)</text>
  <text x="96.25" y="427.875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)">Add -v to see each sub-command invoked by gcc</text>

  <!-- Bottom notes -->
  <rect x="77.5" y="456.875" width="1125" height="79.75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="96.25" y="478.625" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--primary-accent)" font-weight="bold">Key Points</text>
  <text x="96.25" y="498.5625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">• Preprocessor runs first: expands macros, includes headers, strips comments — output is plain C text</text>
  <text x="96.25" y="516.6875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">• Compiler performs type checking, optimization, and code generation — this is where most errors are caught</text>
  <text x="96.25" y="534.8125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">• Linker resolves extern symbols and pulls in library code — produces the final executable binary</text>
</svg>

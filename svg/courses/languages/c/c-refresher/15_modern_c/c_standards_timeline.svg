<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow-sm" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000022"/>
    </filter>
    <marker id="arrow-r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9e9e9e"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--surface)" rx="6"/>

  <!-- Timeline spine -->
  <rect x="60" y="155" width="1160" height="8" rx="6" fill="var(--text-faint)"/>
  <!-- Arrow at end -->
  <polygon points="1220,147 1240,159 1220,171" fill="var(--text-faint)"/>

  <!-- ============================================================ -->
  <!-- Helper: define x positions for each standard -->
  <!-- K&R=95  C89=255  C99=445  C11=635  C17=825  C23=1015 -->
  <!-- ============================================================ -->

  <!-- ============================================================ -->
  <!-- K&R 1978 -->
  <!-- ============================================================ -->
  <!-- dot -->
  <circle cx="95" cy="159" r="14" fill="var(--text-muted)" filter="url(#shadow-sm)"/>
  <circle cx="95" cy="159" r="8" fill="var(--bg)"/>

  <!-- card above -->
  <rect x="20" y="28" width="150" height="110" rx="6" fill="var(--text-muted)" filter="url(#shadow)"/>
  <text x="95" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">K&amp;R C</text>
  <text x="95" y="68" font-family="sans-serif" font-size="13" fill="var(--border)" text-anchor="middle">1978</text>
  <line x1="95" y1="74" x2="95" y2="80" stroke="var(--text-faint)" stroke-width="1.5"/>
  <text x="30" y="96" font-family="sans-serif" font-size="11" fill="var(--surface)">Pre-standard era</text>
  <text x="30" y="112" font-family="sans-serif" font-size="11" fill="var(--surface)">No prototypes</text>
  <text x="30" y="128" font-family="sans-serif" font-size="11" fill="var(--surface)">int-return default</text>

  <!-- stem down from dot -->
  <line x1="95" y1="173" x2="95" y2="200" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ============================================================ -->
  <!-- C89 / ANSI 1989 -->
  <!-- ============================================================ -->
  <circle cx="255" cy="159" r="14" fill="var(--primary-accent)" filter="url(#shadow-sm)"/>
  <circle cx="255" cy="159" r="8" fill="var(--bg)"/>

  <rect x="180" y="28" width="150" height="118" rx="6" fill="var(--primary-accent)" filter="url(#shadow)"/>
  <text x="255" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">C89 / ANSI</text>
  <text x="255" y="68" font-family="sans-serif" font-size="13" fill="var(--primary-accent)" text-anchor="middle">1989</text>
  <line x1="255" y1="74" x2="255" y2="80" stroke="var(--text-faint)" stroke-width="1.5"/>
  <text x="190" y="96" font-family="sans-serif" font-size="11" fill="var(--primary-accent)">Function prototypes</text>
  <text x="190" y="112" font-family="sans-serif" font-size="11" fill="var(--primary-accent)">Standard library</text>
  <text x="190" y="128" font-family="sans-serif" font-size="11" fill="var(--primary-accent)">Strict types</text>

  <line x1="255" y1="173" x2="255" y2="200" stroke="var(--primary-border)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ============================================================ -->
  <!-- C99 1999 -->
  <!-- ============================================================ -->
  <circle cx="445" cy="159" r="14" fill="var(--ok-accent)" filter="url(#shadow-sm)"/>
  <circle cx="445" cy="159" r="8" fill="var(--bg)"/>

  <!-- card below the line -->
  <line x1="445" y1="173" x2="445" y2="210" stroke="var(--ok-border)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="365" y="210" width="160" height="138" rx="6" fill="var(--ok-accent)" filter="url(#shadow)"/>
  <text x="445" y="232" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">C99</text>
  <text x="445" y="250" font-family="sans-serif" font-size="13" fill="var(--ok-accent)" text-anchor="middle">1999</text>
  <line x1="445" y1="256" x2="445" y2="262" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="375" y="278" font-family="sans-serif" font-size="11" fill="var(--ok-accent)">// line comments</text>
  <text x="375" y="294" font-family="sans-serif" font-size="11" fill="var(--ok-accent)">VLAs (variable arrays)</text>
  <text x="375" y="310" font-family="sans-serif" font-size="11" fill="var(--ok-accent)">_Bool, stdbool.h</text>
  <text x="375" y="326" font-family="sans-serif" font-size="11" fill="var(--ok-accent)">stdint.h (int32_t...)</text>
  <text x="375" y="342" font-family="sans-serif" font-size="11" fill="var(--ok-accent)">Designated initializers</text>

  <!-- ============================================================ -->
  <!-- C11 2011 -->
  <!-- ============================================================ -->
  <circle cx="635" cy="159" r="14" fill="var(--info-accent)" filter="url(#shadow-sm)"/>
  <circle cx="635" cy="159" r="8" fill="var(--bg)"/>

  <rect x="558" y="28" width="154" height="118" rx="6" fill="var(--info-accent)" filter="url(#shadow)"/>
  <text x="635" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">C11</text>
  <text x="635" y="68" font-family="sans-serif" font-size="13" fill="var(--info-accent)" text-anchor="middle">2011</text>
  <line x1="635" y1="74" x2="635" y2="80" stroke="var(--info-border)" stroke-width="1.5"/>
  <text x="568" y="96" font-family="sans-serif" font-size="11" fill="var(--info-accent)">_Generic dispatch</text>
  <text x="568" y="112" font-family="sans-serif" font-size="11" fill="var(--info-accent)">_Atomic / threads</text>
  <text x="568" y="128" font-family="sans-serif" font-size="11" fill="var(--info-accent)">_Static_assert</text>

  <line x1="635" y1="173" x2="635" y2="200" stroke="var(--info-border)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ============================================================ -->
  <!-- C17 2018 -->
  <!-- ============================================================ -->
  <circle cx="825" cy="159" r="14" fill="var(--warn-fill)" filter="url(#shadow-sm)"/>
  <circle cx="825" cy="159" r="8" fill="var(--bg)"/>

  <line x1="825" y1="173" x2="825" y2="210" stroke="var(--warn-border)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="748" y="210" width="154" height="128" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="825" y="232" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">C17</text>
  <text x="825" y="250" font-family="sans-serif" font-size="13" fill="var(--warn-accent)" text-anchor="middle">2017 / 2018</text>
  <line x1="825" y1="256" x2="825" y2="262" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="758" y="278" font-family="sans-serif" font-size="11" fill="var(--warn-accent)">Bug-fix release only</text>
  <text x="758" y="294" font-family="sans-serif" font-size="11" fill="var(--warn-accent)">No new features</text>
  <text x="758" y="310" font-family="sans-serif" font-size="11" fill="var(--warn-accent)">Clarifies C11 defects</text>
  <text x="758" y="326" font-family="sans-serif" font-size="11" fill="var(--warn-accent)">Compiler quirks fixed</text>

  <!-- ============================================================ -->
  <!-- C23 2023 -->
  <!-- ============================================================ -->
  <circle cx="1015" cy="159" r="14" fill="var(--danger-fill)" filter="url(#shadow-sm)"/>
  <circle cx="1015" cy="159" r="8" fill="var(--bg)"/>

  <rect x="938" y="28" width="154" height="128" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1015" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">C23</text>
  <text x="1015" y="68" font-family="sans-serif" font-size="13" fill="var(--danger-accent)" text-anchor="middle">2023 / 2024</text>
  <line x1="1015" y1="74" x2="1015" y2="80" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="948" y="96" font-family="sans-serif" font-size="11" fill="var(--danger-accent)">typeof, nullptr</text>
  <text x="948" y="112" font-family="sans-serif" font-size="11" fill="var(--danger-accent)">constexpr, auto</text>
  <text x="948" y="128" font-family="sans-serif" font-size="11" fill="var(--danger-accent)">#embed, 1'000'000</text>

  <line x1="1015" y1="173" x2="1015" y2="200" stroke="var(--danger-border)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ============================================================ -->
  <!-- FEATURE COMPARISON TABLE (lower half) -->
  <!-- ============================================================ -->
  <rect x="30" y="360" width="1220" height="252" rx="6" fill="var(--bg)" filter="url(#shadow)" stroke="var(--border)" stroke-width="1"/>

  <!-- Table header -->
  <rect x="30" y="360" width="1220" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="30" y="380" width="1220" height="20" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="385" font-family="sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Key Feature Comparison Across Standards</text>

  <!-- Table column headers -->
  <text x="115" y="420" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--text)" text-anchor="middle">Feature</text>
  <text x="310" y="420" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--text-muted)" text-anchor="middle">K&amp;R/C89</text>
  <text x="490" y="420" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">C99</text>
  <text x="670" y="420" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">C11</text>
  <text x="850" y="420" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">C17</text>
  <text x="1030" y="420" font-family="sans-serif" font-size="13" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">C23</text>
  <line x1="30" y1="428" x2="1250" y2="428" stroke="var(--surface)" stroke-width="1.5"/>

  <!-- Row 1: Comments -->
  <rect x="30" y="428" width="1220" height="36" fill="var(--surface)" rx="6"/>
  <text x="50" y="451" font-family="sans-serif" font-size="12" fill="var(--text)">Comments</text>
  <text x="310" y="451" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">/* only */</text>
  <text x="490" y="451" font-family="monospace" font-size="12" fill="var(--ok-accent)" text-anchor="middle">// added</text>
  <text x="670" y="451" font-family="monospace" font-size="12" fill="var(--info-accent)" text-anchor="middle">// (same)</text>
  <text x="850" y="451" font-family="monospace" font-size="12" fill="var(--warn-accent)" text-anchor="middle">// (same)</text>
  <text x="1030" y="451" font-family="monospace" font-size="12" fill="var(--danger-accent)" text-anchor="middle">// (same)</text>
  <line x1="30" y1="464" x2="1250" y2="464" stroke="var(--surface)" stroke-width="1"/>

  <!-- Row 2: Null pointer -->
  <rect x="30" y="464" width="1220" height="36" fill="var(--bg)" rx="6"/>
  <text x="50" y="487" font-family="sans-serif" font-size="12" fill="var(--text)">Null pointer constant</text>
  <text x="310" y="487" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">NULL / 0</text>
  <text x="490" y="487" font-family="monospace" font-size="12" fill="var(--ok-accent)" text-anchor="middle">NULL</text>
  <text x="670" y="487" font-family="monospace" font-size="12" fill="var(--info-accent)" text-anchor="middle">NULL</text>
  <text x="850" y="487" font-family="monospace" font-size="12" fill="var(--warn-accent)" text-anchor="middle">NULL</text>
  <text x="1030" y="487" font-family="monospace" font-size="12" fill="var(--danger-accent)" text-anchor="middle">nullptr ✓</text>
  <line x1="30" y1="500" x2="1250" y2="500" stroke="var(--surface)" stroke-width="1"/>

  <!-- Row 3: Compile-time constants -->
  <rect x="30" y="500" width="1220" height="36" fill="var(--surface)" rx="6"/>
  <text x="50" y="523" font-family="sans-serif" font-size="12" fill="var(--text)">Compile-time constants</text>
  <text x="310" y="523" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">#define</text>
  <text x="490" y="523" font-family="monospace" font-size="12" fill="var(--ok-accent)" text-anchor="middle">enum / #define</text>
  <text x="670" y="523" font-family="monospace" font-size="12" fill="var(--info-accent)" text-anchor="middle">_Static_assert</text>
  <text x="850" y="523" font-family="monospace" font-size="12" fill="var(--warn-accent)" text-anchor="middle">(same)</text>
  <text x="1030" y="523" font-family="monospace" font-size="12" fill="var(--danger-accent)" text-anchor="middle">constexpr ✓</text>
  <line x1="30" y1="536" x2="1250" y2="536" stroke="var(--surface)" stroke-width="1"/>

  <!-- Row 4: Type inference -->
  <rect x="30" y="536" width="1220" height="36" fill="var(--bg)" rx="6"/>
  <text x="50" y="559" font-family="sans-serif" font-size="12" fill="var(--text)">Type inference</text>
  <text x="310" y="559" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">none</text>
  <text x="490" y="559" font-family="monospace" font-size="12" fill="var(--ok-accent)" text-anchor="middle">none</text>
  <text x="670" y="559" font-family="monospace" font-size="12" fill="var(--info-accent)" text-anchor="middle">none</text>
  <text x="850" y="559" font-family="monospace" font-size="12" fill="var(--warn-accent)" text-anchor="middle">none</text>
  <text x="1030" y="559" font-family="monospace" font-size="12" fill="var(--danger-accent)" text-anchor="middle">auto / typeof ✓</text>
  <line x1="30" y1="572" x2="1250" y2="572" stroke="var(--surface)" stroke-width="1"/>

  <!-- Row 5: Thread/atomic support -->
  <rect x="30" y="572" width="1220" height="36" fill="var(--surface)" rx="6"/>
  <text x="50" y="595" font-family="sans-serif" font-size="12" fill="var(--text)">Thread / atomic support</text>
  <text x="310" y="595" font-family="monospace" font-size="12" fill="var(--text-muted)" text-anchor="middle">none</text>
  <text x="490" y="595" font-family="monospace" font-size="12" fill="var(--ok-accent)" text-anchor="middle">none</text>
  <text x="670" y="595" font-family="monospace" font-size="12" fill="var(--info-accent)" text-anchor="middle">_Atomic / threads ✓</text>
  <text x="850" y="595" font-family="monospace" font-size="12" fill="var(--warn-accent)" text-anchor="middle">(same)</text>
  <text x="1030" y="595" font-family="monospace" font-size="12" fill="var(--danger-accent)" text-anchor="middle">(same)</text>
  <line x1="30" y1="608" x2="1250" y2="608" stroke="var(--surface)" stroke-width="1"/>

  <!-- Column dividers in table -->
  <line x1="215" y1="400" x2="215" y2="608" stroke="var(--surface)" stroke-width="1.5"/>
  <line x1="395" y1="400" x2="395" y2="608" stroke="var(--surface)" stroke-width="1.5"/>
  <line x1="575" y1="400" x2="575" y2="608" stroke="var(--surface)" stroke-width="1.5"/>
  <line x1="755" y1="400" x2="755" y2="608" stroke="var(--surface)" stroke-width="1.5"/>
  <line x1="935" y1="400" x2="935" y2="608" stroke="var(--surface)" stroke-width="1.5"/>

  <!-- Compiler flag hint at bottom -->
  <rect x="1060" y="362" width="185" height="34" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1152" y="381" font-family="monospace" font-size="12" fill="var(--ok-accent)" text-anchor="middle">-std=c99 / c11 / c23</text>
</svg>

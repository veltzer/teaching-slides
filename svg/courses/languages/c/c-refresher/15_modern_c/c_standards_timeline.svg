<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <line x1="80" y1="319.259259259259" x2="1200" y2="319.259259259259" stroke="var(--text-faint)" stroke-width="6"/>

  <rect x="40" y="40" width="190" height="214.814814814815" rx="6.218252702059" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="135" y="77.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--text)">K&amp;R C</text>
  <text x="135" y="104.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--text-muted)">1978</text>
  <text x="135" y="147.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text-muted)">pre-standard</text>
  <text x="135" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--text-muted)">no prototypes</text>

  <rect x="245" y="40" width="190" height="214.814814814815" rx="6.218252702059" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="77.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--primary-text)">C89 / ANSI</text>
  <text x="340" y="104.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--primary-text)">1989</text>
  <text x="340" y="147.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--primary-text)">prototypes</text>
  <text x="340" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--primary-text)">stdlib</text>
  <text x="340" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--primary-text)">strict types</text>

  <rect x="450" y="340.740740740741" width="190" height="236.296296296296" rx="6.218252702059" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="545" y="378.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--ok-text)">C99</text>
  <text x="545" y="405.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">1999</text>
  <text x="545" y="448.148148148148" text-anchor="middle" font-family="Courier New, monospace" font-size="13.472880854462" fill="var(--ok-text)">// comments</text>
  <text x="545" y="480.37037037037" text-anchor="middle" font-family="Courier New, monospace" font-size="13.472880854462" fill="var(--ok-text)">stdbool, stdint</text>
  <text x="545" y="512.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--ok-text)">VLAs</text>
  <text x="545" y="544.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--ok-text)">designated init</text>

  <rect x="655" y="40" width="190" height="214.814814814815" rx="6.218252702059" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="77.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--info-text)">C11</text>
  <text x="750" y="104.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--info-text)">2011</text>
  <text x="750" y="147.407407407407" text-anchor="middle" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--info-text)">_Generic</text>
  <text x="750" y="179.62962962963" text-anchor="middle" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--info-text)">_Atomic, threads</text>
  <text x="750" y="211.851851851852" text-anchor="middle" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--info-text)">_Static_assert</text>

  <rect x="860" y="340.740740740741" width="190" height="193.333333333333" rx="6.218252702059" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955" y="378.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--warn-text)">C17</text>
  <text x="955" y="405.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">2018</text>
  <text x="955" y="448.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">bug-fix only</text>
  <text x="955" y="480.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">no new features</text>

  <rect x="1065" y="40" width="175" height="214.814814814815" rx="6.218252702059" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1152" y="77.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--danger-text)">C23</text>
  <text x="1152" y="104.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--danger-text)">2024</text>
  <text x="1152" y="147.407407407407" text-anchor="middle" font-family="Courier New, monospace" font-size="13.472880854462" fill="var(--danger-text)">nullptr</text>
  <text x="1152" y="179.62962962963" text-anchor="middle" font-family="Courier New, monospace" font-size="13.472880854462" fill="var(--danger-text)">constexpr, auto</text>
  <text x="1152" y="211.851851851852" text-anchor="middle" font-family="Courier New, monospace" font-size="13.472880854462" fill="var(--danger-text)">#embed, typeof</text>

  <rect x="40" y="598.518518518518" width="1200" height="21.481481481481" rx="6.218252702059" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
</svg>

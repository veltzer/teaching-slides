<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Left panel: anatomy blocks -->
  <!-- Preprocessor Directives -->
  <rect x="96.25" y="85.3125" width="487.5" height="68.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96.25" y="85.3125" width="7.5" height="68.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="120.625" y="110.6875" font-family="monospace" font-size="15.6696" fill="var(--primary-accent)" font-weight="bold">#include &lt;stdio.h&gt;</text>
  <text x="120.625" y="131.5312" font-family="monospace" font-size="15.6696" fill="var(--primary-accent)">#include &lt;stdlib.h&gt;</text>
  <text x="611.875" y="123.375" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" font-weight="bold">Preprocessor Directives</text>
  <text x="611.875" y="143.3125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Pull in standard headers</text>

  <!-- Arrow -->
  <line x1="340" y1="154.1875" x2="340" y2="177.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Macro Definitions -->
  <rect x="96.25" y="177.75" width="487.5" height="52.5625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96.25" y="177.75" width="7.5" height="52.5625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="120.625" y="200.4062" font-family="monospace" font-size="15.6696" fill="var(--danger-accent)" font-weight="bold">#define MAX_SIZE 100</text>
  <text x="120.625" y="220.3438" font-family="monospace" font-size="15.6696" fill="var(--danger-accent)">#define SQUARE(x) ((x)*(x))</text>
  <text x="611.875" y="201.3125" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--warn-accent)" font-weight="bold">Macro Definitions</text>
  <text x="611.875" y="221.25" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Constants and function-like macros</text>

  <!-- Arrow -->
  <line x1="340" y1="230.3125" x2="340" y2="253.875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Global Declarations -->
  <rect x="96.25" y="253.875" width="487.5" height="52.5625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96.25" y="253.875" width="7.5" height="52.5625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="120.625" y="276.5312" font-family="monospace" font-size="15.6696" fill="var(--ok-accent)" font-weight="bold">int global_var = 0;</text>
  <text x="120.625" y="296.4688" font-family="monospace" font-size="15.6696" fill="var(--ok-accent)">int helper(int a, int b);</text>
  <text x="611.875" y="276.5312" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)" font-weight="bold">Global Variables &amp; Prototypes</text>
  <text x="611.875" y="296.4688" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Forward declarations; file scope</text>

  <!-- Arrow -->
  <line x1="340" y1="306.4375" x2="340" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- main() function -->
  <rect x="96.25" y="330" width="487.5" height="150.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96.25" y="330" width="7.5" height="150.4375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="120.625" y="353.5625" font-family="monospace" font-size="15.6696" fill="var(--primary-accent)" font-weight="bold">int main(void) &#123;</text>
  <text x="120.625" y="374.4062" font-family="monospace" font-size="15.6696" fill="var(--primary-accent)">    /* local variables */</text>
  <text x="120.625" y="395.25" font-family="monospace" font-size="15.6696" fill="var(--primary-accent)">    int result;</text>
  <text x="120.625" y="416.0938" font-family="monospace" font-size="15.6696" fill="var(--primary-accent)">    /* function body */</text>
  <text x="120.625" y="436.9375" font-family="monospace" font-size="15.6696" fill="var(--primary-accent)">    result = helper(3, 4);</text>
  <text x="120.625" y="457.7812" font-family="monospace" font-size="15.6696" fill="var(--primary-accent)">    return 0;  /* success */</text>
  <text x="120.625" y="470.4688" font-family="monospace" font-size="15.6696" fill="var(--primary-accent)">&#125;</text>
  <text x="611.875" y="352.6562" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" font-weight="bold">main() — Entry Point</text>
  <text x="611.875" y="372.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Program execution starts here</text>
  <text x="611.875" y="392.5312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">• Local variables (block scope)</text>
  <text x="611.875" y="412.4688" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">• Statements &amp; function calls</text>
  <text x="611.875" y="432.4062" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">• return 0 → success (POSIX)</text>
  <text x="611.875" y="452.3438" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">• return 1+ → failure code</text>

  <!-- Arrow -->
  <line x1="340" y1="480.4375" x2="340" y2="504" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Helper functions -->
  <rect x="96.25" y="504" width="487.5" height="68.875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96.25" y="504" width="7.5" height="68.875" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="120.625" y="526.6562" font-family="monospace" font-size="15.6696" fill="var(--danger-accent)" font-weight="bold">int helper(int a, int b) &#123;</text>
  <text x="120.625" y="547.5" font-family="monospace" font-size="15.6696" fill="var(--danger-accent)">    return a + b;</text>
  <text x="120.625" y="563.8125" font-family="monospace" font-size="15.6696" fill="var(--danger-accent)">&#125;</text>
  <text x="611.875" y="526.6562" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--danger-accent)" font-weight="bold">Helper Functions</text>
  <text x="611.875" y="546.5938" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">Defined after main (or before, if no</text>
  <text x="611.875" y="566.5312" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text-muted)">prototype declared above)</text>

  <!-- Divider line between panels -->
  <line x1="597.8125" y1="76.25" x2="597.8125" y2="592.8125" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Right panel legend: key points summary -->
  <rect x="611.875" y="592.8125" width="590.625" height="1.8125" fill="var(--border)" rx="6"/>

  <!-- Section label top right -->
  <rect x="855.625" y="85.3125" width="346.875" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1029.0625" y="110.6875" font-family="Arial, sans-serif" font-size="17.5131" fill="var(--bg)" font-weight="bold" text-anchor="middle">C Program Anatomy</text>

  <!-- Key rules box -->
  <rect x="855.625" y="143.3125" width="346.875" height="170.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="874.375" y="166.875" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--primary-accent)" font-weight="bold">Execution Order (runtime)</text>
  <text x="874.375" y="186.8125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">1. OS calls main()</text>
  <text x="874.375" y="206.75" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">2. main() calls helper functions</text>
  <text x="874.375" y="226.6875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">3. Functions return values</text>
  <text x="874.375" y="246.625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">4. main() returns exit code</text>
  <text x="874.375" y="266.5625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">5. OS receives exit code</text>
  <text x="874.375" y="298.2812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)">Preprocessor runs BEFORE compiler</text>

  <!-- Translation order box -->
  <rect x="855.625" y="331.8125" width="346.875" height="170.375" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="874.375" y="355.375" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--primary-accent)" font-weight="bold">Compilation Order (build time)</text>
  <text x="874.375" y="375.3125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">1. Preprocessor expands #include/#define</text>
  <text x="874.375" y="395.25" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">2. Compiler reads top-to-bottom</text>
  <text x="874.375" y="415.1875" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">3. Functions must be declared before use</text>
  <text x="874.375" y="435.125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">   (prototype or full definition)</text>
  <text x="874.375" y="455.0625" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">4. Linker connects object files</text>
  <text x="874.375" y="486.7812" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-faint)">Use -Wall -Wextra for strict checking</text>

  <!-- return values box -->
  <rect x="855.625" y="520.3125" width="346.875" height="79.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="874.375" y="543.875" font-family="Arial, sans-serif" font-size="13.8261" fill="var(--warn-accent)" font-weight="bold">Return Value Convention</text>
  <text x="874.375" y="563.8125" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">return 0  →  EXIT_SUCCESS (OK)</text>
  <text x="874.375" y="583.75" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--text)">return 1  →  EXIT_FAILURE (error)</text>
</svg>

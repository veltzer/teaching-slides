<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Left panel: anatomy blocks -->
  <!-- Preprocessor Directives -->
  <rect x="60" y="50" width="520" height="76" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="50" width="8" height="76" rx="3" fill="url(#grad-primary)"/>
  <text x="86" y="78" font-family="monospace" font-size="17" fill="var(--primary-deep)" font-weight="bold">#include &lt;stdio.h&gt;</text>
  <text x="86" y="101" font-family="monospace" font-size="17" fill="var(--primary-deep)">#include &lt;stdlib.h&gt;</text>
  <text x="610" y="92" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-dk)" font-weight="bold">Preprocessor Directives</text>
  <text x="610" y="114" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Pull in standard headers</text>

  <!-- Arrow -->
  <line x1="320" y1="126" x2="320" y2="152" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Macro Definitions -->
  <rect x="60" y="152" width="520" height="58" rx="6" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="152" width="8" height="58" rx="3" fill="url(#grad-warn)"/>
  <text x="86" y="177" font-family="monospace" font-size="17" fill="var(--danger-deeper)" font-weight="bold">#define MAX_SIZE 100</text>
  <text x="86" y="199" font-family="monospace" font-size="17" fill="var(--danger-deeper)">#define SQUARE(x) ((x)*(x))</text>
  <text x="610" y="178" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-dk)" font-weight="bold">Macro Definitions</text>
  <text x="610" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Constants and function-like macros</text>

  <!-- Arrow -->
  <line x1="320" y1="210" x2="320" y2="236" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Global Declarations -->
  <rect x="60" y="236" width="520" height="58" rx="6" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="236" width="8" height="58" rx="3" fill="url(#grad-ok)"/>
  <text x="86" y="261" font-family="monospace" font-size="17" fill="var(--ok-deep)" font-weight="bold">int global_var = 0;</text>
  <text x="86" y="283" font-family="monospace" font-size="17" fill="var(--ok-deep)">int helper(int a, int b);</text>
  <text x="610" y="261" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-dk)" font-weight="bold">Global Variables &amp; Prototypes</text>
  <text x="610" y="283" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Forward declarations; file scope</text>

  <!-- Arrow -->
  <line x1="320" y1="294" x2="320" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- main() function -->
  <rect x="60" y="320" width="520" height="166" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="3" filter="url(#shadow)"/>
  <rect x="60" y="320" width="8" height="166" rx="3" fill="url(#grad-primary)"/>
  <text x="86" y="346" font-family="monospace" font-size="17" fill="var(--primary-deep)" font-weight="bold">int main(void) &#123;</text>
  <text x="86" y="369" font-family="monospace" font-size="17" fill="var(--primary-deep)">    /* local variables */</text>
  <text x="86" y="392" font-family="monospace" font-size="17" fill="var(--primary-deep)">    int result;</text>
  <text x="86" y="415" font-family="monospace" font-size="17" fill="var(--primary-deep)">    /* function body */</text>
  <text x="86" y="438" font-family="monospace" font-size="17" fill="var(--primary-deep)">    result = helper(3, 4);</text>
  <text x="86" y="461" font-family="monospace" font-size="17" fill="var(--primary-deep)">    return 0;  /* success */</text>
  <text x="86" y="475" font-family="monospace" font-size="17" fill="var(--primary-deep)">&#125;</text>
  <text x="610" y="345" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-dk)" font-weight="bold">main() — Entry Point</text>
  <text x="610" y="367" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Program execution starts here</text>
  <text x="610" y="389" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">• Local variables (block scope)</text>
  <text x="610" y="411" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">• Statements &amp; function calls</text>
  <text x="610" y="433" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">• return 0 → success (POSIX)</text>
  <text x="610" y="455" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">• return 1+ → failure code</text>

  <!-- Arrow -->
  <line x1="320" y1="486" x2="320" y2="512" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Helper functions -->
  <rect x="60" y="512" width="520" height="76" rx="6" fill="var(--danger-pale3)" stroke="var(--danger-pink)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="512" width="8" height="76" rx="3" fill="var(--danger-pink)"/>
  <text x="86" y="537" font-family="monospace" font-size="17" fill="var(--danger-pink)" font-weight="bold">int helper(int a, int b) &#123;</text>
  <text x="86" y="560" font-family="monospace" font-size="17" fill="var(--danger-pink)">    return a + b;</text>
  <text x="86" y="578" font-family="monospace" font-size="17" fill="var(--danger-pink)">&#125;</text>
  <text x="610" y="537" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-pink)" font-weight="bold">Helper Functions</text>
  <text x="610" y="559" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Defined after main (or before, if no</text>
  <text x="610" y="581" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">prototype declared above)</text>

  <!-- Divider line between panels -->
  <line x1="595" y1="40" x2="595" y2="610" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Right panel legend: key points summary -->
  <rect x="610" y="610" width="630" height="2" fill="var(--border)"/>

  <!-- Section label top right -->
  <rect x="870" y="50" width="370" height="44" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="1055" y="78" font-family="Arial, sans-serif" font-size="19" fill="var(--bg)" font-weight="bold" text-anchor="middle">C Program Anatomy</text>

  <!-- Key rules box -->
  <rect x="870" y="114" width="370" height="188" rx="8" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="1" filter="url(#shadow)"/>
  <text x="890" y="140" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-dk)" font-weight="bold">Execution Order (runtime)</text>
  <text x="890" y="162" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">1. OS calls main()</text>
  <text x="890" y="184" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">2. main() calls helper functions</text>
  <text x="890" y="206" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">3. Functions return values</text>
  <text x="890" y="228" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">4. main() returns exit code</text>
  <text x="890" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">5. OS receives exit code</text>
  <text x="890" y="285" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Preprocessor runs BEFORE compiler</text>

  <!-- Translation order box -->
  <rect x="870" y="322" width="370" height="188" rx="8" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="1" filter="url(#shadow)"/>
  <text x="890" y="348" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-dk)" font-weight="bold">Compilation Order (build time)</text>
  <text x="890" y="370" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">1. Preprocessor expands #include/#define</text>
  <text x="890" y="392" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">2. Compiler reads top-to-bottom</text>
  <text x="890" y="414" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">3. Functions must be declared before use</text>
  <text x="890" y="436" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">   (prototype or full definition)</text>
  <text x="890" y="458" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">4. Linker connects object files</text>
  <text x="890" y="493" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Use -Wall -Wextra for strict checking</text>

  <!-- return values box -->
  <rect x="870" y="530" width="370" height="88" rx="8" fill="var(--warn-pale)" stroke="var(--warn-mid)" stroke-width="1" filter="url(#shadow)"/>
  <text x="890" y="556" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-dk)" font-weight="bold">Return Value Convention</text>
  <text x="890" y="578" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">return 0  →  EXIT_SUCCESS (OK)</text>
  <text x="890" y="600" font-family="Arial, sans-serif" font-size="14" fill="var(--text-dark)">return 1  →  EXIT_FAILURE (error)</text>
</svg>

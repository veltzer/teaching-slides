<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.347106429722" font-weight="bold" fill="var(--primary-accent)">C Program Anatomy</text>

  <rect x="40" y="68.155339805825" width="520" height="73.203883495146" rx="6.367392662652" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="99.68932038835" font-family="Courier New, monospace" font-size="15.918481656629" font-weight="bold" fill="var(--primary-text)">#include &lt;stdio.h&gt;</text>
  <text x="60" y="127.844660194175" font-family="Courier New, monospace" font-size="15.918481656629" fill="var(--primary-text)">#include &lt;stdlib.h&gt;</text>
  <text x="580" y="107.572815533981" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--primary-accent)">Preprocessor</text>

  <line x1="300" y1="141.359223300971" x2="300" y2="163.883495145631" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="169.514563106796" width="520" height="61.941747572816" rx="6.367392662652" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="197.669902912621" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--warn-text)">#define MAX 100</text>
  <text x="60" y="221.320388349515" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--warn-text)">#define SQR(x) ((x)*(x))</text>
  <text x="580" y="208.932038834951" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--warn-accent)">Macros</text>

  <line x1="300" y1="231.456310679612" x2="300" y2="253.980582524272" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="259.611650485437" width="520" height="61.941747572816" rx="6.367392662652" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="287.766990291262" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--ok-text)">int global_var = 0;</text>
  <text x="60" y="311.417475728155" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--ok-text)">int helper(int a, int b);</text>
  <text x="580" y="299.029126213592" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--ok-accent)">Globals / Prototypes</text>

  <line x1="300" y1="321.553398058252" x2="300" y2="344.077669902913" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="349.708737864078" width="520" height="168.932038834951" rx="6.367392662652" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="377.864077669903" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--primary-text)">int main(void) {</text>
  <text x="60" y="403.766990291262" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--primary-text)">    int result;</text>
  <text x="60" y="429.669902912621" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--primary-text)">    result = helper(3, 4);</text>
  <text x="60" y="455.572815533981" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--primary-text)">    return 0;</text>
  <text x="60" y="481.47572815534" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--primary-text)">}</text>
  <text x="580" y="383.495145631068" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--primary-text)">main() entry</text>
  <text x="580" y="417.281553398058" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">return 0 = success</text>

  <line x1="300" y1="518.640776699029" x2="300" y2="541.165048543689" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="546.796116504854" width="520" height="73.203883495146" rx="6.367392662652" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="574.95145631068" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--danger-text)">int helper(int a, int b) {</text>
  <text x="60" y="600.854368932039" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--danger-text)">    return a + b;</text>
  <text x="580" y="586.21359223301" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--danger-accent)">Helpers</text>

  <rect x="760" y="68.155339805825" width="480" height="168.932038834951" rx="6.367392662652" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="780" y="101.941747572816" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--primary-accent)">Runtime</text>
  <text x="780" y="133.47572815534" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--text)">1. OS calls main()</text>
  <text x="780" y="160.504854368932" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--text)">2. main() calls helpers</text>
  <text x="780" y="187.533980582524" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--text)">3. functions return</text>
  <text x="780" y="214.563106796116" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--text)">4. OS gets exit code</text>

  <rect x="760" y="259.611650485437" width="480" height="168.932038834951" rx="6.367392662652" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="780" y="293.398058252427" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--primary-accent)">Compilation</text>
  <text x="780" y="324.932038834951" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--text)">1. preprocessor expands</text>
  <text x="780" y="351.961165048544" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--text)">2. compiler: top to bottom</text>
  <text x="780" y="378.990291262136" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--text)">3. declare before use</text>
  <text x="780" y="406.019417475728" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--text)">4. linker joins objects</text>

  <rect x="760" y="451.067961165049" width="480" height="168.932038834951" rx="6.367392662652" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="484.854368932039" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--warn-text)">Return Convention</text>
  <text x="780" y="518.640776699029" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--warn-text)">return 0 → EXIT_SUCCESS</text>
  <text x="780" y="546.796116504854" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--warn-text)">return 1 → EXIT_FAILURE</text>
  <text x="780" y="586.21359223301" font-family="Arial, sans-serif" font-size="12.734785325303" fill="var(--warn-text)">Use -Wall -Wextra</text>
</svg>

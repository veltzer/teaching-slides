<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Left panel: anatomy blocks -->
  <!-- Preprocessor Directives -->
  <rect x="60" y="50" width="520" height="76" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="50" width="8" height="76" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="86" y="78" font-family="monospace" font-size="17" fill="var(--primary-accent)" font-weight="bold">#include &lt;stdio.h&gt;</text>
  <text x="86" y="101" font-family="monospace" font-size="17" fill="var(--primary-accent)">#include &lt;stdlib.h&gt;</text>
  <text x="610" y="92" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)" font-weight="bold">Preprocessor Directives</text>
  <text x="610" y="114" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Pull in standard headers</text>

  <!-- Arrow -->
  <line x1="320" y1="126" x2="320" y2="152" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Macro Definitions -->
  <rect x="60" y="152" width="520" height="58" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="152" width="8" height="58" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="86" y="177" font-family="monospace" font-size="17" fill="var(--danger-accent)" font-weight="bold">#define MAX_SIZE 100</text>
  <text x="86" y="199" font-family="monospace" font-size="17" fill="var(--danger-accent)">#define SQUARE(x) ((x)*(x))</text>
  <text x="610" y="178" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-accent)" font-weight="bold">Macro Definitions</text>
  <text x="610" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Constants and function-like macros</text>

  <!-- Arrow -->
  <line x1="320" y1="210" x2="320" y2="236" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Global Declarations -->
  <rect x="60" y="236" width="520" height="58" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="236" width="8" height="58" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="86" y="261" font-family="monospace" font-size="17" fill="var(--ok-accent)" font-weight="bold">int global_var = 0;</text>
  <text x="86" y="283" font-family="monospace" font-size="17" fill="var(--ok-accent)">int helper(int a, int b);</text>
  <text x="610" y="261" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-accent)" font-weight="bold">Global Variables &amp; Prototypes</text>
  <text x="610" y="283" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Forward declarations; file scope</text>

  <!-- Arrow -->
  <line x1="320" y1="294" x2="320" y2="320" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- main() function -->
  <rect x="60" y="320" width="520" height="166" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="320" width="8" height="166" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="86" y="346" font-family="monospace" font-size="17" fill="var(--primary-accent)" font-weight="bold">int main(void) &#123;</text>
  <text x="86" y="369" font-family="monospace" font-size="17" fill="var(--primary-accent)">    /* local variables */</text>
  <text x="86" y="392" font-family="monospace" font-size="17" fill="var(--primary-accent)">    int result;</text>
  <text x="86" y="415" font-family="monospace" font-size="17" fill="var(--primary-accent)">    /* function body */</text>
  <text x="86" y="438" font-family="monospace" font-size="17" fill="var(--primary-accent)">    result = helper(3, 4);</text>
  <text x="86" y="461" font-family="monospace" font-size="17" fill="var(--primary-accent)">    return 0;  /* success */</text>
  <text x="86" y="475" font-family="monospace" font-size="17" fill="var(--primary-accent)">&#125;</text>
  <text x="610" y="345" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)" font-weight="bold">main() — Entry Point</text>
  <text x="610" y="367" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Program execution starts here</text>
  <text x="610" y="389" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">• Local variables (block scope)</text>
  <text x="610" y="411" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">• Statements &amp; function calls</text>
  <text x="610" y="433" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">• return 0 → success (POSIX)</text>
  <text x="610" y="455" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">• return 1+ → failure code</text>

  <!-- Arrow -->
  <line x1="320" y1="486" x2="320" y2="512" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Helper functions -->
  <rect x="60" y="512" width="520" height="76" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="512" width="8" height="76" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="86" y="537" font-family="monospace" font-size="17" fill="var(--danger-accent)" font-weight="bold">int helper(int a, int b) &#123;</text>
  <text x="86" y="560" font-family="monospace" font-size="17" fill="var(--danger-accent)">    return a + b;</text>
  <text x="86" y="578" font-family="monospace" font-size="17" fill="var(--danger-accent)">&#125;</text>
  <text x="610" y="537" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-accent)" font-weight="bold">Helper Functions</text>
  <text x="610" y="559" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Defined after main (or before, if no</text>
  <text x="610" y="581" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">prototype declared above)</text>

  <!-- Divider line between panels -->
  <line x1="595" y1="40" x2="595" y2="610" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Right panel legend: key points summary -->
  <rect x="610" y="610" width="630" height="2" fill="var(--border)" rx="6"/>

  <!-- Section label top right -->
  <rect x="870" y="50" width="370" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1055" y="78" font-family="Arial, sans-serif" font-size="19" fill="var(--bg)" font-weight="bold" text-anchor="middle">C Program Anatomy</text>

  <!-- Key rules box -->
  <rect x="870" y="114" width="370" height="188" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="890" y="140" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-accent)" font-weight="bold">Execution Order (runtime)</text>
  <text x="890" y="162" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1. OS calls main()</text>
  <text x="890" y="184" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">2. main() calls helper functions</text>
  <text x="890" y="206" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">3. Functions return values</text>
  <text x="890" y="228" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">4. main() returns exit code</text>
  <text x="890" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">5. OS receives exit code</text>
  <text x="890" y="285" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Preprocessor runs BEFORE compiler</text>

  <!-- Translation order box -->
  <rect x="870" y="322" width="370" height="188" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="890" y="348" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-accent)" font-weight="bold">Compilation Order (build time)</text>
  <text x="890" y="370" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">1. Preprocessor expands #include/#define</text>
  <text x="890" y="392" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">2. Compiler reads top-to-bottom</text>
  <text x="890" y="414" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">3. Functions must be declared before use</text>
  <text x="890" y="436" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">   (prototype or full definition)</text>
  <text x="890" y="458" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">4. Linker connects object files</text>
  <text x="890" y="493" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">Use -Wall -Wextra for strict checking</text>

  <!-- return values box -->
  <rect x="870" y="530" width="370" height="88" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="556" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-accent)" font-weight="bold">Return Value Convention</text>
  <text x="890" y="578" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">return 0  →  EXIT_SUCCESS (OK)</text>
  <text x="890" y="600" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">return 1  →  EXIT_FAILURE (error)</text>
</svg>

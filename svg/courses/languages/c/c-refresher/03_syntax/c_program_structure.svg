<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <!-- Left panel: anatomy blocks -->
  <!-- Preprocessor Directives -->
  <rect x="40" y="50.034602" width="528.813559" height="76.262976" rx="6.57569" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="50.034602" width="8.135593" height="76.262976" rx="6.57569" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.440678" y="78.131488" font-size="17.173071" fill="var(--primary-accent)" font-weight="bold" font-family="Courier New, monospace">#include &lt;stdio.h&gt;</text>
  <text x="66.440678" y="101.211017" font-size="17.173071" fill="var(--primary-accent)" font-family="Courier New, monospace">#include &lt;stdlib.h&gt;</text>
  <text x="599.322034" y="92.179931" font-family="Arial, sans-serif" font-size="16.162935" fill="var(--primary-accent)" font-weight="bold">Preprocessor Directives</text>
  <text x="599.322034" y="114.256055" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text-muted)">Pull in standard headers</text>

  <!-- Arrow -->
  <line x1="304.40678" y1="126.297578" x2="304.40678" y2="152.387543" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Macro Definitions -->
  <rect x="40" y="152.387543" width="528.813559" height="58.200692" rx="6.57569" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="152.387543" width="8.135593" height="58.200692" rx="6.57569" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.440678" y="177.473993" font-size="17.173071" fill="var(--danger-accent)" font-weight="bold" font-family="Courier New, monospace">#define MAX_SIZE 100</text>
  <text x="66.440678" y="199.550228" font-size="17.173071" fill="var(--danger-accent)" font-family="Courier New, monospace">#define SQUARE(x) ((x)*(x))</text>
  <text x="599.322034" y="178.477509" font-family="Arial, sans-serif" font-size="16.162935" fill="var(--warn-accent)" font-weight="bold">Macro Definitions</text>
  <text x="599.322034" y="200.553633" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text-muted)">Constants and function-like macros</text>

  <!-- Arrow -->
  <line x1="304.40678" y1="210.588235" x2="304.40678" y2="236.678201" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Global Declarations -->
  <rect x="40" y="236.678201" width="528.813559" height="58.200692" rx="6.57569" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="236.678201" width="8.135593" height="58.200692" rx="6.57569" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.440678" y="261.764651" font-size="17.173071" fill="var(--ok-accent)" font-weight="bold" font-family="Courier New, monospace">int global_var = 0;</text>
  <text x="66.440678" y="283.840886" font-size="17.173071" fill="var(--ok-accent)" font-family="Courier New, monospace">int helper(int a, int b);</text>
  <text x="599.322034" y="261.764651" font-family="Arial, sans-serif" font-size="16.162935" fill="var(--ok-accent)" font-weight="bold">Global Variables &amp; Prototypes</text>
  <text x="599.322034" y="283.840886" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text-muted)">Forward declarations; file scope</text>

  <!-- Arrow -->
  <line x1="304.40678" y1="294.878893" x2="304.40678" y2="320.968858" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- main() function -->
  <rect x="40" y="320.968858" width="528.813559" height="166.574394" rx="6.57569" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="320.968858" width="8.135593" height="166.574394" rx="6.57569" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.440678" y="347.058824" font-size="17.173071" fill="var(--primary-accent)" font-weight="bold" font-family="Courier New, monospace">int main(void) &#123;</text>
  <text x="66.440678" y="370.138353" font-size="17.173071" fill="var(--primary-accent)" font-family="Courier New, monospace">    /* local variables */</text>
  <text x="66.440678" y="393.217993" font-size="17.173071" fill="var(--primary-accent)" font-family="Courier New, monospace">    int result;</text>
  <text x="66.440678" y="416.297633" font-size="17.173071" fill="var(--primary-accent)" font-family="Courier New, monospace">    /* function body */</text>
  <text x="66.440678" y="439.377163" font-size="17.173071" fill="var(--primary-accent)" font-family="Courier New, monospace">    result = helper(3, 4);</text>
  <text x="66.440678" y="462.456692" font-size="17.173071" fill="var(--primary-accent)" font-family="Courier New, monospace">    return 0;  /* success */</text>
  <text x="66.440678" y="476.505246" font-size="17.173071" fill="var(--primary-accent)" font-family="Courier New, monospace">&#125;</text>
  <text x="599.322034" y="346.055308" font-family="Arial, sans-serif" font-size="16.162935" fill="var(--primary-accent)" font-weight="bold">main() — Entry Point</text>
  <text x="599.322034" y="368.131543" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text-muted)">Program execution starts here</text>
  <text x="599.322034" y="390.207557" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text-muted)">• Local variables (block scope)</text>
  <text x="599.322034" y="412.283792" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text-muted)">• Statements &amp; function calls</text>
  <text x="599.322034" y="434.359806" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text-muted)">• return 0 → success (POSIX)</text>
  <text x="599.322034" y="456.436042" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text-muted)">• return 1+ → failure code</text>

  <!-- Arrow -->
  <line x1="304.40678" y1="487.543253" x2="304.40678" y2="513.633218" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Helper functions -->
  <rect x="40" y="513.633218" width="528.813559" height="76.262976" rx="6.57569" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="513.633218" width="8.135593" height="76.262976" rx="6.57569" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="66.440678" y="538.719668" font-size="17.173071" fill="var(--danger-accent)" font-weight="bold" font-family="Courier New, monospace">int helper(int a, int b) &#123;</text>
  <text x="66.440678" y="561.799308" font-size="17.173071" fill="var(--danger-accent)" font-family="Courier New, monospace">    return a + b;</text>
  <text x="66.440678" y="579.861592" font-size="17.173071" fill="var(--danger-accent)" font-family="Courier New, monospace">&#125;</text>
  <text x="599.322034" y="538.719668" font-family="Arial, sans-serif" font-size="16.162935" fill="var(--danger-accent)" font-weight="bold">Helper Functions</text>
  <text x="599.322034" y="560.795903" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text-muted)">Defined after main (or before, if no</text>
  <text x="599.322034" y="582.871917" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text-muted)">prototype declared above)</text>

  <!-- Divider line between panels -->
  <line x1="584.067797" y1="40" x2="584.067797" y2="611.972318" stroke="var(--border)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Right panel legend: key points summary -->
  <rect x="599.322034" y="611.972318" width="640.677966" height="2.00692" fill="var(--border)" rx="6.57569"/>

  <!-- Section label top right -->
  <rect x="863.728814" y="50.034602" width="376.271186" height="44.152249" rx="6.57569" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.864407" y="78.131488" font-family="Arial, sans-serif" font-size="19.193451" fill="var(--bg)" font-weight="bold" text-anchor="middle">C Program Anatomy</text>

  <!-- Key rules box -->
  <rect x="863.728814" y="114.256055" width="376.271186" height="188.650519" rx="6.57569" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="884.067797" y="140.346021" font-family="Arial, sans-serif" font-size="15.15269" fill="var(--primary-accent)" font-weight="bold">Execution Order (runtime)</text>
  <text x="884.067797" y="162.422145" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text)">1. OS calls main()</text>
  <text x="884.067797" y="184.49827" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text)">2. main() calls helper functions</text>
  <text x="884.067797" y="206.574394" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text)">3. Functions return values</text>
  <text x="884.067797" y="228.650519" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text)">4. main() returns exit code</text>
  <text x="884.067797" y="250.726644" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text)">5. OS receives exit code</text>
  <text x="884.067797" y="285.847696" font-family="Arial, sans-serif" font-size="13.132419" fill="var(--text-faint)">Preprocessor runs BEFORE compiler</text>

  <!-- Translation order box -->
  <rect x="863.728814" y="322.975779" width="376.271186" height="188.650519" rx="6.57569" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="884.067797" y="349.065744" font-family="Arial, sans-serif" font-size="15.15269" fill="var(--primary-accent)" font-weight="bold">Compilation Order (build time)</text>
  <text x="884.067797" y="371.141869" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text)">1. Preprocessor expands #include/#define</text>
  <text x="884.067797" y="393.217993" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text)">2. Compiler reads top-to-bottom</text>
  <text x="884.067797" y="415.294118" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text)">3. Functions must be declared before use</text>
  <text x="884.067797" y="437.370242" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text)">   (prototype or full definition)</text>
  <text x="884.067797" y="459.446367" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text)">4. Linker connects object files</text>
  <text x="884.067797" y="494.567419" font-family="Arial, sans-serif" font-size="13.132419" fill="var(--text-faint)">Use -Wall -Wextra for strict checking</text>

  <!-- return values box -->
  <rect x="863.728814" y="531.695502" width="376.271186" height="88.304498" rx="6.57569" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="884.067797" y="557.785467" font-family="Arial, sans-serif" font-size="15.15269" fill="var(--warn-accent)" font-weight="bold">Return Value Convention</text>
  <text x="884.067797" y="579.861592" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text)">return 0  →  EXIT_SUCCESS (OK)</text>
  <text x="884.067797" y="601.937716" font-family="Arial, sans-serif" font-size="14.142555" fill="var(--text)">return 1  →  EXIT_FAILURE (error)</text>
</svg>

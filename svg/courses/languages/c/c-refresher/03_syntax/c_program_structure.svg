<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="520" height="76.938775510204" rx="6.527805519312" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="73.142857142858" font-family="Courier New, monospace" font-size="16.31951379828" font-weight="bold" fill="var(--primary-text)">#include &lt;stdio.h&gt;</text>
  <text x="60" y="102.734693877552" font-family="Courier New, monospace" font-size="16.31951379828" fill="var(--primary-text)">#include &lt;stdlib.h&gt;</text>
  <text x="580" y="81.428571428572" font-family="Arial, sans-serif" font-size="16.31951379828" font-weight="bold" fill="var(--primary-accent)">Preprocessor</text>

  <line x1="300" y1="116.938775510204" x2="300" y2="140.612244897959" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="146.530612244898" width="520" height="65.102040816327" rx="6.527805519312" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="176.122448979592" font-family="Courier New, monospace" font-size="15.231546211728" fill="var(--warn-text)">#define MAX 100</text>
  <text x="60" y="200.979591836735" font-family="Courier New, monospace" font-size="15.231546211728" fill="var(--warn-text)">#define SQR(x) ((x)*(x))</text>
  <text x="580" y="187.959183673469" font-family="Arial, sans-serif" font-size="16.31951379828" font-weight="bold" fill="var(--warn-accent)">Macros</text>

  <line x1="300" y1="211.632653061225" x2="300" y2="235.30612244898" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="241.224489795919" width="520" height="65.102040816327" rx="6.527805519312" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="270.816326530612" font-family="Courier New, monospace" font-size="15.231546211728" fill="var(--ok-text)">int global_var = 0;</text>
  <text x="60" y="295.673469387755" font-family="Courier New, monospace" font-size="15.231546211728" fill="var(--ok-text)">int helper(int a, int b);</text>
  <text x="580" y="282.65306122449" font-family="Arial, sans-serif" font-size="16.31951379828" font-weight="bold" fill="var(--ok-accent)">Globals / Prototypes</text>

  <line x1="300" y1="306.326530612245" x2="300" y2="330.000000000001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="335.918367346939" width="520" height="177.551020408163" rx="6.527805519312" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="365.510204081633" font-family="Courier New, monospace" font-size="15.231546211728" fill="var(--primary-text)">int main(void) {</text>
  <text x="60" y="392.734693877551" font-family="Courier New, monospace" font-size="15.231546211728" fill="var(--primary-text)">    int result;</text>
  <text x="60" y="419.959183673469" font-family="Courier New, monospace" font-size="15.231546211728" fill="var(--primary-text)">    result = helper(3, 4);</text>
  <text x="60" y="447.183673469388" font-family="Courier New, monospace" font-size="15.231546211728" fill="var(--primary-text)">    return 0;</text>
  <text x="60" y="474.408163265306" font-family="Courier New, monospace" font-size="15.231546211728" fill="var(--primary-text)">}</text>
  <text x="580" y="371.428571428572" font-family="Arial, sans-serif" font-size="16.31951379828" font-weight="bold" fill="var(--primary-text)">main() entry</text>
  <text x="580" y="406.938775510204" font-family="Arial, sans-serif" font-size="14.143578625176" fill="var(--primary-text)">return 0 = success</text>

  <line x1="300" y1="513.469387755102" x2="300" y2="537.142857142857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="543.061224489796" width="520" height="76.938775510204" rx="6.527805519312" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="572.65306122449" font-family="Courier New, monospace" font-size="15.231546211728" fill="var(--danger-text)">int helper(int a, int b) {</text>
  <text x="60" y="599.877551020408" font-family="Courier New, monospace" font-size="15.231546211728" fill="var(--danger-text)">    return a + b;</text>
  <text x="580" y="584.489795918368" font-family="Arial, sans-serif" font-size="16.31951379828" font-weight="bold" fill="var(--danger-accent)">Helpers</text>

  <rect x="760" y="40" width="480" height="177.551020408163" rx="6.527805519312" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="780" y="75.510204081633" font-family="Arial, sans-serif" font-size="16.31951379828" font-weight="bold" fill="var(--primary-accent)">Runtime</text>
  <text x="780" y="108.65306122449" font-family="Arial, sans-serif" font-size="14.143578625176" fill="var(--text)">1. OS calls main()</text>
  <text x="780" y="137.061224489796" font-family="Arial, sans-serif" font-size="14.143578625176" fill="var(--text)">2. main() calls helpers</text>
  <text x="780" y="165.469387755102" font-family="Arial, sans-serif" font-size="14.143578625176" fill="var(--text)">3. functions return</text>
  <text x="780" y="193.877551020408" font-family="Arial, sans-serif" font-size="14.143578625176" fill="var(--text)">4. OS gets exit code</text>

  <rect x="760" y="241.224489795919" width="480" height="177.551020408163" rx="6.527805519312" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="780" y="276.734693877551" font-family="Arial, sans-serif" font-size="16.31951379828" font-weight="bold" fill="var(--primary-accent)">Compilation</text>
  <text x="780" y="309.877551020408" font-family="Arial, sans-serif" font-size="14.143578625176" fill="var(--text)">1. preprocessor expands</text>
  <text x="780" y="338.285714285715" font-family="Arial, sans-serif" font-size="14.143578625176" fill="var(--text)">2. compiler: top to bottom</text>
  <text x="780" y="366.693877551021" font-family="Arial, sans-serif" font-size="14.143578625176" fill="var(--text)">3. declare before use</text>
  <text x="780" y="395.102040816327" font-family="Arial, sans-serif" font-size="14.143578625176" fill="var(--text)">4. linker joins objects</text>

  <rect x="760" y="442.448979591837" width="480" height="177.551020408163" rx="6.527805519312" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="477.95918367347" font-family="Arial, sans-serif" font-size="16.31951379828" font-weight="bold" fill="var(--warn-text)">Return Convention</text>
  <text x="780" y="513.469387755102" font-family="Courier New, monospace" font-size="14.143578625176" fill="var(--warn-text)">return 0 → EXIT_SUCCESS</text>
  <text x="780" y="543.061224489796" font-family="Courier New, monospace" font-size="14.143578625176" fill="var(--warn-text)">return 1 → EXIT_FAILURE</text>
  <text x="780" y="584.489795918368" font-family="Arial, sans-serif" font-size="13.055611038624" fill="var(--warn-text)">Use -Wall -Wextra</text>
</svg>

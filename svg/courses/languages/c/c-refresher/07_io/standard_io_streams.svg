<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Keyboard (stdin source) -->
  <rect x="77.5" y="139.6875" width="168.75" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="161.875" y="174.125" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--primary-accent)" font-weight="bold" text-anchor="middle">Keyboard</text>
  <text x="161.875" y="194.0625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">⌨  stdin source</text>
  <text x="161.875" y="214" font-family="monospace" font-size="11.9827" fill="var(--primary-accent)" text-anchor="middle">fd = 0</text>

  <!-- Screen (stdout target) -->
  <rect x="77.5" y="330" width="168.75" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="161.875" y="364.4375" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">Terminal</text>
  <text x="161.875" y="384.375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">▣  stdout target</text>
  <text x="161.875" y="404.3125" font-family="monospace" font-size="11.9827" fill="var(--ok-accent)" text-anchor="middle">fd = 1</text>

  <!-- Screen (stderr target) -->
  <rect x="77.5" y="520.3125" width="168.75" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="161.875" y="554.75" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">Terminal</text>
  <text x="161.875" y="574.6875" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">⚠  stderr target</text>
  <text x="161.875" y="594.625" font-family="monospace" font-size="11.9827" fill="var(--danger-accent)" text-anchor="middle">fd = 2</text>

  <!-- C Program box (center) -->
  <rect x="443.125" y="239.375" width="393.75" height="262.8125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="443.125" y="239.375" width="393.75" height="39.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="443.125" y="261.125" width="393.75" height="18.125" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="264.75" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--bg)" font-weight="bold" text-anchor="middle">C Program</text>

  <!-- stdin stream label -->
  <rect x="461.875" y="291.9375" width="346.875" height="52.5625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="480.625" y="312.7812" font-family="monospace" font-size="13.8261" fill="var(--primary-accent)" font-weight="bold">stdin  (FILE *)</text>
  <text x="480.625" y="332.7188" font-family="monospace" font-size="12.9044" fill="var(--primary-accent)">scanf(), fgets(), getchar()</text>

  <!-- stdout stream label -->
  <rect x="461.875" y="357.1875" width="346.875" height="52.5625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="480.625" y="378.0312" font-family="monospace" font-size="13.8261" fill="var(--ok-accent)" font-weight="bold">stdout  (FILE *)</text>
  <text x="480.625" y="397.9688" font-family="monospace" font-size="12.9044" fill="var(--ok-accent)">printf(), puts(), putchar()</text>

  <!-- stderr stream label -->
  <rect x="461.875" y="422.4375" width="346.875" height="52.5625" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="480.625" y="443.2812" font-family="monospace" font-size="13.8261" fill="var(--danger-accent)" font-weight="bold">stderr  (FILE *)</text>
  <text x="480.625" y="463.2188" font-family="monospace" font-size="12.9044" fill="var(--danger-accent)">fprintf(stderr,...), perror()</text>

  <!-- Arrows: keyboard → stdin -->
  <line x1="246.25" y1="185" x2="441.25" y2="316.4062" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="316.5625" y="234.8438" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" font-weight="bold" transform="rotate(-22,295,215)">reads input</text>

  <!-- Arrows: stdout → screen -->
  <line x1="808.75" y1="382.5625" x2="921.25" y2="375.3125" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <!-- Arrows: stderr → screen-err -->
  <line x1="808.75" y1="447.8125" x2="921.25" y2="565.625" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <!-- Right side outputs -->
  <rect x="925.9375" y="320.9375" width="271.875" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1061.875" y="355.375" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">Screen (normal)</text>
  <text x="1061.875" y="375.3125" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">Hello, World!</text>
  <text x="1061.875" y="395.25" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">Buffered (line or full)</text>

  <rect x="925.9375" y="520.3125" width="271.875" height="90.625" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1061.875" y="554.75" font-family="Arial, sans-serif" font-size="14.7479" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">Screen (error)</text>
  <text x="1061.875" y="574.6875" font-family="monospace" font-size="11.9827" fill="var(--text)" text-anchor="middle">Error: file not found</text>
  <text x="1061.875" y="594.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text-muted)" text-anchor="middle">Unbuffered (immediate)</text>

  <!-- Redirection note -->
  <rect x="443.125" y="513.0625" width="393.75" height="50.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="461.875" y="533.9062" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--warn-accent)" font-weight="bold">Shell Redirection</text>
  <text x="461.875" y="552.0312" font-family="monospace" font-size="11.9827" fill="var(--text-muted)">./prog &lt;in.txt &gt;out.txt 2&gt;err.txt</text>

  <!-- File I/O side note -->
  <rect x="77.5" y="76.25" width="525" height="47.125" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="340" y="105.25" font-family="Arial, sans-serif" font-size="16.5914" fill="var(--bg)" font-weight="bold" text-anchor="middle">Standard I/O Streams in C</text>

</svg>

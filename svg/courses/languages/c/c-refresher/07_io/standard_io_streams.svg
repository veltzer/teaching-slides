<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Keyboard (stdin source) -->
  <rect x="40" y="110" width="180" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="130" y="148" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-accent)" font-weight="bold" text-anchor="middle">Keyboard</text>
  <text x="130" y="170" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">⌨  stdin source</text>
  <text x="130" y="192" font-family="monospace" font-size="13" fill="var(--primary-accent)" text-anchor="middle">fd = 0</text>

  <!-- Screen (stdout target) -->
  <rect x="40" y="320" width="180" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="130" y="358" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">Terminal</text>
  <text x="130" y="380" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">▣  stdout target</text>
  <text x="130" y="402" font-family="monospace" font-size="13" fill="var(--ok-accent)" text-anchor="middle">fd = 1</text>

  <!-- Screen (stderr target) -->
  <rect x="40" y="530" width="180" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="130" y="568" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">Terminal</text>
  <text x="130" y="590" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">⚠  stderr target</text>
  <text x="130" y="612" font-family="monospace" font-size="13" fill="var(--danger-accent)" text-anchor="middle">fd = 2</text>

  <!-- C Program box (center) -->
  <rect x="430" y="220" width="420" height="290" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="430" y="220" width="420" height="44" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="430" y="244" width="420" height="20" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="248" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)" font-weight="bold" text-anchor="middle">C Program</text>

  <!-- stdin stream label -->
  <rect x="450" y="278" width="370" height="58" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="470" y="301" font-family="monospace" font-size="15" fill="var(--primary-accent)" font-weight="bold">stdin  (FILE *)</text>
  <text x="470" y="323" font-family="monospace" font-size="14" fill="var(--primary-accent)">scanf(), fgets(), getchar()</text>

  <!-- stdout stream label -->
  <rect x="450" y="350" width="370" height="58" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="470" y="373" font-family="monospace" font-size="15" fill="var(--ok-accent)" font-weight="bold">stdout  (FILE *)</text>
  <text x="470" y="395" font-family="monospace" font-size="14" fill="var(--ok-accent)">printf(), puts(), putchar()</text>

  <!-- stderr stream label -->
  <rect x="450" y="422" width="370" height="58" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="470" y="445" font-family="monospace" font-size="15" fill="var(--danger-accent)" font-weight="bold">stderr  (FILE *)</text>
  <text x="470" y="467" font-family="monospace" font-size="14" fill="var(--danger-accent)">fprintf(stderr,...), perror()</text>

  <!-- Arrows: keyboard → stdin -->
  <line x1="220" y1="160" x2="428" y2="305" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="295" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-accent)" font-weight="bold" transform="rotate(-22,295,215)">reads input</text>

  <!-- Arrows: stdout → screen -->
  <line x1="820" y1="378" x2="940" y2="370" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <!-- Arrows: stderr → screen-err -->
  <line x1="820" y1="450" x2="940" y2="580" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <!-- Right side outputs -->
  <rect x="945" y="310" width="290" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1090" y="348" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">Screen (normal)</text>
  <text x="1090" y="370" font-family="monospace" font-size="13" fill="var(--text)" text-anchor="middle">Hello, World!</text>
  <text x="1090" y="392" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">Buffered (line or full)</text>

  <rect x="945" y="530" width="290" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1090" y="568" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">Screen (error)</text>
  <text x="1090" y="590" font-family="monospace" font-size="13" fill="var(--text)" text-anchor="middle">Error: file not found</text>
  <text x="1090" y="612" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">Unbuffered (immediate)</text>

  <!-- Redirection note -->
  <rect x="430" y="522" width="420" height="56" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="450" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-accent)" font-weight="bold">Shell Redirection</text>
  <text x="450" y="565" font-family="monospace" font-size="13" fill="var(--text-muted)">./prog &lt;in.txt &gt;out.txt 2&gt;err.txt</text>

  <!-- File I/O side note -->
  <rect x="40" y="40" width="560" height="52" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="320" y="72" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)" font-weight="bold" text-anchor="middle">Standard I/O Streams in C</text>

</svg>

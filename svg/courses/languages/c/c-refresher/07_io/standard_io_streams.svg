<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935"/>
    </marker>
  </defs>
  <!-- Keyboard (stdin source) -->
  <rect x="40" y="108.813559" width="180.753138" height="98.305085" rx="6.467497" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130.376569" y="146.169492" font-family="Arial, sans-serif" font-size="15.897001" fill="var(--primary-accent)" font-weight="bold" text-anchor="middle">Keyboard</text>
  <text x="130.376569" y="167.79661" font-family="Arial, sans-serif" font-size="12.916347" fill="var(--text-muted)" text-anchor="middle">⌨  stdin source</text>
  <text x="130.376569" y="189.423729" font-family="monospace" font-size="12.916347" fill="var(--primary-accent)" text-anchor="middle">fd = 0</text>

  <!-- Screen (stdout target) -->
  <rect x="40" y="315.254237" width="180.753138" height="98.305085" rx="6.467497" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130.376569" y="352.610169" font-family="Arial, sans-serif" font-size="15.897001" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">Terminal</text>
  <text x="130.376569" y="374.237288" font-family="Arial, sans-serif" font-size="12.916347" fill="var(--text-muted)" text-anchor="middle">▣  stdout target</text>
  <text x="130.376569" y="395.864407" font-family="monospace" font-size="12.916347" fill="var(--ok-accent)" text-anchor="middle">fd = 1</text>

  <!-- Screen (stderr target) -->
  <rect x="40" y="521.694915" width="180.753138" height="98.305085" rx="6.467497" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="130.376569" y="559.050847" font-family="Arial, sans-serif" font-size="15.897001" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">Terminal</text>
  <text x="130.376569" y="580.677966" font-family="Arial, sans-serif" font-size="12.916347" fill="var(--text-muted)" text-anchor="middle">⚠  stderr target</text>
  <text x="130.376569" y="602.305085" font-family="monospace" font-size="12.916347" fill="var(--danger-accent)" text-anchor="middle">fd = 2</text>

  <!-- C Program box (center) -->
  <rect x="431.631799" y="216.949153" width="421.757322" height="285.084746" rx="6.467497" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="431.631799" y="216.949153" width="421.757322" height="43.254237" rx="6.467497" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="431.631799" y="240.542373" width="421.757322" height="19.661017" fill="var(--primary-fill)" rx="6.467497" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642.51046" y="244.474576" font-family="Arial, sans-serif" font-size="17.884139" fill="var(--bg)" font-weight="bold" text-anchor="middle">C Program</text>

  <!-- stdin stream label -->
  <rect x="451.715481" y="273.966102" width="371.548117" height="57.016949" rx="6.467497" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="471.799163" y="296.576217" font-family="monospace" font-size="14.903378" fill="var(--primary-accent)" font-weight="bold">stdin  (FILE *)</text>
  <text x="471.799163" y="318.203444" font-family="monospace" font-size="13.909862" fill="var(--primary-accent)">scanf(), fgets(), getchar()</text>

  <!-- stdout stream label -->
  <rect x="451.715481" y="344.745763" width="371.548117" height="57.016949" rx="6.467497" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="471.799163" y="367.355878" font-family="monospace" font-size="14.903378" fill="var(--ok-accent)" font-weight="bold">stdout  (FILE *)</text>
  <text x="471.799163" y="388.983105" font-family="monospace" font-size="13.909862" fill="var(--ok-accent)">printf(), puts(), putchar()</text>

  <!-- stderr stream label -->
  <rect x="451.715481" y="415.525424" width="371.548117" height="57.016949" rx="6.467497" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="471.799163" y="438.135539" font-family="monospace" font-size="14.903378" fill="var(--danger-accent)" font-weight="bold">stderr  (FILE *)</text>
  <text x="471.799163" y="459.762766" font-family="monospace" font-size="13.909862" fill="var(--danger-accent)">fprintf(stderr,...), perror()</text>

  <!-- Arrows: keyboard → stdin -->
  <line x1="220.753138" y1="157.966102" x2="429.623431" y2="300.50842" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="316.5625" y="234.8438" font-family="Arial, sans-serif" font-size="12.9044" fill="var(--primary-accent)" font-weight="bold" transform="rotate(-22,295,215)">reads input</text>

  <!-- Arrows: stdout → screen -->
  <line x1="823.263598" y1="372.271186" x2="943.76569" y2="364.40678" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <!-- Arrows: stderr → screen-err -->
  <line x1="823.263598" y1="443.050847" x2="943.76569" y2="570.847458" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>

  <!-- Right side outputs -->
  <rect x="948.786611" y="305.423729" width="291.213389" height="98.305085" rx="6.467497" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1094.393305" y="342.779661" font-family="Arial, sans-serif" font-size="15.897001" fill="var(--ok-accent)" font-weight="bold" text-anchor="middle">Screen (normal)</text>
  <text x="1094.393305" y="364.40678" font-family="monospace" font-size="12.916347" fill="var(--text)" text-anchor="middle">Hello, World!</text>
  <text x="1094.393305" y="386.033898" font-family="Arial, sans-serif" font-size="12.916347" fill="var(--text-muted)" text-anchor="middle">Buffered (line or full)</text>

  <rect x="948.786611" y="521.694915" width="291.213389" height="98.305085" rx="6.467497" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1094.393305" y="559.050847" font-family="Arial, sans-serif" font-size="15.897001" fill="var(--danger-accent)" font-weight="bold" text-anchor="middle">Screen (error)</text>
  <text x="1094.393305" y="580.677966" font-family="monospace" font-size="12.916347" fill="var(--text)" text-anchor="middle">Error: file not found</text>
  <text x="1094.393305" y="602.305085" font-family="Arial, sans-serif" font-size="12.916347" fill="var(--text-muted)" text-anchor="middle">Unbuffered (immediate)</text>

  <!-- Redirection note -->
  <rect x="431.631799" y="513.830508" width="421.757322" height="55.050847" rx="6.467497" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="451.715481" y="536.440624" font-family="Arial, sans-serif" font-size="13.909862" fill="var(--warn-accent)" font-weight="bold">Shell Redirection</text>
  <text x="451.715481" y="556.101641" font-family="monospace" font-size="12.916347" fill="var(--text-muted)">./prog &lt;in.txt &gt;out.txt 2&gt;err.txt</text>

  <!-- File I/O side note -->
  <rect x="40" y="40" width="562.343096" height="51.118644" rx="6.467497" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="321.171548" y="71.457627" font-family="Arial, sans-serif" font-size="17.884139" fill="var(--bg)" font-weight="bold" text-anchor="middle">Standard I/O Streams in C</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Keyboard (stdin source) -->
  <rect x="40" y="110" width="180" height="100" rx="10" fill="url(#grad-surface)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="148" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-dk)" font-weight="bold" text-anchor="middle">Keyboard</text>
  <text x="130" y="170" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">⌨  stdin source</text>
  <text x="130" y="192" font-family="monospace" font-size="13" fill="var(--primary-dk)" text-anchor="middle">fd = 0</text>

  <!-- Screen (stdout target) -->
  <rect x="40" y="320" width="180" height="100" rx="10" fill="url(#grad-surface)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="358" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-dk)" font-weight="bold" text-anchor="middle">Terminal</text>
  <text x="130" y="380" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">▣  stdout target</text>
  <text x="130" y="402" font-family="monospace" font-size="13" fill="var(--ok-dk)" text-anchor="middle">fd = 1</text>

  <!-- Screen (stderr target) -->
  <rect x="40" y="530" width="180" height="100" rx="10" fill="url(#grad-surface)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="568" font-family="Arial, sans-serif" font-size="16" fill="var(--danger)" font-weight="bold" text-anchor="middle">Terminal</text>
  <text x="130" y="590" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">⚠  stderr target</text>
  <text x="130" y="612" font-family="monospace" font-size="13" fill="var(--danger)" text-anchor="middle">fd = 2</text>

  <!-- C Program box (center) -->
  <rect x="430" y="220" width="420" height="290" rx="12" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="430" y="220" width="420" height="44" rx="12" fill="url(#grad-primary)"/>
  <rect x="430" y="244" width="420" height="20" fill="url(#grad-primary)"/>
  <text x="640" y="248" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)" font-weight="bold" text-anchor="middle">C Program</text>

  <!-- stdin stream label -->
  <rect x="450" y="278" width="370" height="58" rx="6" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="470" y="301" font-family="monospace" font-size="15" fill="var(--primary-deep)" font-weight="bold">stdin  (FILE *)</text>
  <text x="470" y="323" font-family="monospace" font-size="14" fill="var(--primary-dk)">scanf(), fgets(), getchar()</text>

  <!-- stdout stream label -->
  <rect x="450" y="350" width="370" height="58" rx="6" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.5"/>
  <text x="470" y="373" font-family="monospace" font-size="15" fill="var(--ok-deep)" font-weight="bold">stdout  (FILE *)</text>
  <text x="470" y="395" font-family="monospace" font-size="14" fill="var(--ok-dk)">printf(), puts(), putchar()</text>

  <!-- stderr stream label -->
  <rect x="450" y="422" width="370" height="58" rx="6" fill="var(--danger-pale)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="470" y="445" font-family="monospace" font-size="15" fill="var(--danger-deep)" font-weight="bold">stderr  (FILE *)</text>
  <text x="470" y="467" font-family="monospace" font-size="14" fill="var(--danger)">fprintf(stderr,...), perror()</text>

  <!-- Arrows: keyboard → stdin -->
  <line x1="220" y1="160" x2="428" y2="305" stroke="var(--primary)" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
  <text x="295" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-dk)" font-weight="bold" transform="rotate(-22,295,215)">reads input</text>

  <!-- Arrows: stdout → screen -->
  <line x1="820" y1="378" x2="940" y2="370" stroke="var(--ok-dk)" stroke-width="2.5" marker-end="url(#arrow-ok)"/>

  <!-- Arrows: stderr → screen-err -->
  <line x1="820" y1="450" x2="940" y2="580" stroke="var(--danger)" stroke-width="2.5" marker-end="url(#arrow-danger)"/>

  <!-- Right side outputs -->
  <rect x="945" y="310" width="290" height="100" rx="10" fill="url(#grad-surface)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="348" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-dk)" font-weight="bold" text-anchor="middle">Screen (normal)</text>
  <text x="1090" y="370" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">Hello, World!</text>
  <text x="1090" y="392" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">Buffered (line or full)</text>

  <rect x="945" y="530" width="290" height="100" rx="10" fill="url(#grad-surface)" stroke="var(--danger)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="568" font-family="Arial, sans-serif" font-size="16" fill="var(--danger)" font-weight="bold" text-anchor="middle">Screen (error)</text>
  <text x="1090" y="590" font-family="monospace" font-size="13" fill="var(--text-dark)" text-anchor="middle">Error: file not found</text>
  <text x="1090" y="612" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)" text-anchor="middle">Unbuffered (immediate)</text>

  <!-- Redirection note -->
  <rect x="430" y="522" width="420" height="56" rx="6" fill="var(--warn-pale3)" stroke="var(--warn-amber)" stroke-width="1.5"/>
  <text x="450" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-mid)" font-weight="bold">Shell Redirection</text>
  <text x="450" y="565" font-family="monospace" font-size="13" fill="var(--text-muted)">./prog &lt;in.txt &gt;out.txt 2&gt;err.txt</text>

  <!-- File I/O side note -->
  <rect x="40" y="40" width="560" height="52" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="320" y="72" font-family="Arial, sans-serif" font-size="18" fill="var(--bg)" font-weight="bold" text-anchor="middle">Standard I/O Streams in C</text>

</svg>

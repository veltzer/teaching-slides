  <ns0:text x="110.2222" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--ok-tint)"> </ns0:text>
  <ns0:text x="88.8889" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">fn read_config(path: &amp;str) -&gt; Result&lt;Config&gt; {</ns0:text>
  <ns0:text x="88.8889" y="417.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">    let s = fs::read_to_string(path)</ns0:text>
  <ns0:text x="88.8889" y="433.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">        .context("reading config file")?;</ns0:text>
  <ns0:text x="88.8889" y="449.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--ok-tint)">    // ? converts any error to anyhow::Error</ns0:text>
  <ns0:text x="88.8889" y="465.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">    Ok(toml::from_str(&amp;s)?) }</ns0:text>

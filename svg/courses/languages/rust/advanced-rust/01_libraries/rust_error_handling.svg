<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="433.103448" y="40" width="413.793103" height="70.947954" fill="url(#grad-primary)" rx="6.613092" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="69.266125" font-size="18.198679" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">std::error::Error</text>
  <text x="640" y="87.889902" font-size="12.451792" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">trait Error: Debug + Display</text>
  <text x="640" y="103.853203" font-size="11.493995" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">fn source(&amp;self) → Option&lt;&amp;dyn Error&gt;</text>
  <line x1="557.241379" y1="110.947954" x2="319.310345" y2="204.954181" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="722.758621" y1="110.947954" x2="960.689545" y2="204.954181" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="40" y="204.954181" width="537.931034" height="301.529026" fill="url(#grad-ok)" rx="6.613092" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="204.954181" width="537.931034" height="40.795151" fill="url(#grad-ok)" rx="6.613092" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="231.559609" width="537.931034" height="14.189613" fill="url(#grad-ok)" rx="6.613092" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="91.724138" y="231.559609" font-size="19.156585" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">anyhow</text>
  <text x="484.827586" y="229.786031" font-size="12.451792" fill="var(--ok-accent)" text-anchor="end" font-family="Arial, sans-serif">crate: anyhow = "1.0"</text>
  <text x="68.965517" y="268.807384" font-size="13.409478" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Target: Applications</text>
  <text x="68.965517" y="288.31806" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">Single opaque type: anyhow::Error</text>
  <text x="68.965517" y="304.281361" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">Wraps any error implementing std::error::Error</text>
  <text x="68.965517" y="320.244662" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">Automatic conversion via ? operator</text>
  <text x="68.965517" y="336.207963" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">Context: .context("reading config file")</text>
  <text x="68.965517" y="352.171263" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">Backtraces with RUST_BACKTRACE=1</text>
  <rect x="62.758621" y="368.134564" width="492.413793" height="120.611654" fill="var(--text)" rx="6.613092" />
  <text x="81.37931" y="387.64524" font-size="11.493995" fill="var(--ok-accent)" font-family="Courier New, monospace">use anyhow::{Result, Context};</text>
  <text x="81.37931" y="403.608541" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace"> </text>
  <text x="81.37931" y="419.571842" font-size="11.493995" fill="var(--ok-accent)" font-family="Courier New, monospace">fn</text>
  <text x="106.206897" y="419.571842" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace"> read_config(path: &amp;</text>
  <text x="106.206897" y="419.571842" font-size="11.493995" fill="var(--ok-accent)" font-family="Courier New, monospace"> </text>
  <text x="81.37931" y="419.571842" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">fn read_config(path: &amp;str) -&gt; Result&lt;Config&gt; {</text>
  <text x="81.37931" y="435.535143" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">    let s = fs::read_to_string(path)</text>
  <text x="81.37931" y="451.498443" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">        .context("reading config file")?;</text>
  <text x="81.37931" y="467.461744" font-size="11.493995" fill="var(--ok-accent)" font-family="Courier New, monospace">    // ? converts any error to anyhow::Error</text>
  <text x="81.37931" y="483.425045" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">    Ok(toml::from_str(&amp;s)?) }</text>
  <rect x="702.068966" y="204.954181" width="537.931034" height="301.529026" fill="url(#grad-warn)" rx="6.613092" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="702.068966" y="204.954181" width="537.931034" height="40.795151" fill="var(--warn-accent)" rx="6.613092" />
  <rect x="702.068966" y="231.559609" width="537.931034" height="14.189613" fill="var(--warn-accent)" rx="6.613092"/>
  <text x="751.724138" y="231.559609" font-size="19.156585" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">thiserror</text>
  <text x="1144.827586" y="229.786031" font-size="12.451792" fill="var(--warn-accent)" text-anchor="end" font-family="Arial, sans-serif">crate: thiserror = "1.0"</text>
  <text x="726.896552" y="268.807384" font-size="13.409478" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Target: Libraries</text>
  <text x="726.896552" y="288.31806" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">Derive macro: #[derive(Error)]</text>
  <text x="726.896552" y="304.281361" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">Generates std::error::Error impl</text>
  <text x="726.896552" y="320.244662" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">Custom error enums with variants</text>
  <text x="726.896552" y="336.207963" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">#[error("...")] — Display format</text>
  <text x="726.896552" y="352.171263" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">#[from] — auto From conversion</text>
  <rect x="724.827586" y="368.134564" width="492.413793" height="120.611654" fill="var(--text)" rx="6.613092" />
  <text x="743.448276" y="387.64524" font-size="11.493995" fill="var(--warn-accent)" font-family="Courier New, monospace">use thiserror::Error;</text>
  <text x="743.448276" y="403.608541" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace"> </text>
  <text x="743.448276" y="419.571842" font-size="11.493995" fill="var(--warn-accent)" font-family="Courier New, monospace">#[derive(Debug, Error)]</text>
  <text x="743.448276" y="435.535143" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">pub enum MyError {</text>
  <text x="743.448276" y="451.498443" font-size="11.493995" fill="var(--warn-accent)" font-family="Courier New, monospace">    #[error("io error: {0}")]</text>
  <text x="743.448276" y="467.461744" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">    Io(#[from] std::io::Error),</text>
  <text x="743.448276" y="483.425045" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">    #[error("parse failed")] Parse, }</text>
  <rect x="184.827586" y="531.314947" width="910.344828" height="88.685053" fill="url(#grad-primary)" rx="6.613092" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="554.373109" font-size="14.367384" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">? Operator Flow</text>
  <text x="267.586207" y="577.431161" font-size="12.451792" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">call returns</text>
  <text x="267.586207" y="593.394462" font-size="12.451792" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Result&lt;T, E&gt;</text>
  <line x1="350.344828" y1="584.525913" x2="433.103448" y2="584.525913" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="484.827586" y="577.431161" font-size="12.451792" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Ok(v)</text>
  <text x="484.827586" y="593.394462" font-size="12.451792" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">→ unwrap v</text>
  <line x1="536.551724" y1="584.525913" x2="619.310345" y2="584.525913" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="681.3792" y="577.431161" font-size="12.451792" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Err(e)</text>
  <text x="681.3792" y="593.394462" font-size="12.451792" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">→ From::from(e)</text>
  <line x1="751.724138" y1="584.525913" x2="834.482759" y2="584.525913" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="929.655172" y="577.431161" font-size="12.451792" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">early return</text>
  <text x="929.655172" y="593.394462" font-size="12.451792" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Err(converted)</text>
</svg>
  <ns0:text x="88.8889" y="385.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)"> </ns0:text>
  <ns0:text x="88.8889" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--ok-tint)">fn</ns0:text>

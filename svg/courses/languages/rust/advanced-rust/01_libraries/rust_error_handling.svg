<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="452.5" y="59.3333" width="375" height="64.4444" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="85.9167" font-family="Arial,sans-serif" font-size="16.5115" font-weight="bold" fill="var(--bg)" text-anchor="middle">std::error::Error</text>
  <text x="640" y="102.8333" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--primary-accent)" text-anchor="middle">trait Error: Debug + Display</text>
  <text x="640" y="117.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--primary-accent)" text-anchor="middle">fn source(&amp;self) → Option&lt;&amp;dyn Error&gt;</text>
  <line x1="565" y1="123.7777" x2="349.375" y2="209.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="715" y1="123.7777" x2="930.6249" y2="209.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="96.25" y="209.1667" width="487.5" height="273.8889" fill="var(--ok-fill)" rx="6" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="96.25" y="209.1667" width="487.5" height="37.0556" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="96.25" y="233.3333" width="487.5" height="12.8889" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="143.125" y="233.3333" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">anyhow</text>
  <text x="499.375" y="231.7223" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--ok-accent)" text-anchor="end">crate: anyhow = "1.0"</text>
  <text x="122.5" y="267.1667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)">Target: Applications</text>
  <text x="122.5" y="284.8889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Single opaque type: anyhow::Error</text>
  <text x="122.5" y="299.3889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Wraps any error implementing std::error::Error</text>
  <text x="122.5" y="313.8889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Automatic conversion via ? operator</text>
  <text x="122.5" y="328.3889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Context: .context("reading config file")</text>
  <text x="122.5" y="342.8889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Backtraces with RUST_BACKTRACE=1</text>
  <rect x="116.875" y="357.3889" width="446.25" height="109.5556" fill="var(--text)" rx="6" />
  <text x="133.75" y="375.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--ok-accent)">use anyhow::{Result, Context};</text>
  <text x="133.75" y="389.6111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--bg)"> </text>
  <text x="133.75" y="404.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--ok-accent)">fn</text>
  <text x="156.25" y="404.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--bg)"> read_config(path: &amp;</text>
  <text x="156.25" y="404.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--ok-accent)"> </text>
  <text x="133.75" y="404.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--bg)">fn read_config(path: &amp;str) -&gt; Result&lt;Config&gt; {</text>
  <text x="133.75" y="418.6111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--bg)">    let s = fs::read_to_string(path)</text>
  <text x="133.75" y="433.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--bg)">        .context("reading config file")?;</text>
  <text x="133.75" y="447.6111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--ok-accent)">    // ? converts any error to anyhow::Error</text>
  <text x="133.75" y="462.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--bg)">    Ok(toml::from_str(&amp;s)?) }</text>
  <rect x="696.25" y="209.1667" width="487.5" height="273.8889" fill="var(--warn-fill)" rx="6" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="696.25" y="209.1667" width="487.5" height="37.0556" fill="var(--warn-accent)" rx="6" />
  <rect x="696.25" y="233.3333" width="487.5" height="12.8889" fill="var(--warn-accent)" rx="6"/>
  <text x="741.25" y="233.3333" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">thiserror</text>
  <text x="1097.5" y="231.7223" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--warn-accent)" text-anchor="end">crate: thiserror = "1.0"</text>
  <text x="718.75" y="267.1667" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">Target: Libraries</text>
  <text x="718.75" y="284.8889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Derive macro: #[derive(Error)]</text>
  <text x="718.75" y="299.3889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Generates std::error::Error impl</text>
  <text x="718.75" y="313.8889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Custom error enums with variants</text>
  <text x="718.75" y="328.3889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">#[error("...")] — Display format</text>
  <text x="718.75" y="342.8889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">#[from] — auto From conversion</text>
  <rect x="716.875" y="357.3889" width="446.25" height="109.5556" fill="var(--text)" rx="6" />
  <text x="733.75" y="375.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--warn-accent)">use thiserror::Error;</text>
  <text x="733.75" y="389.6111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--bg)"> </text>
  <text x="733.75" y="404.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--warn-accent)">#[derive(Debug, Error)]</text>
  <text x="733.75" y="418.6111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--bg)">pub enum MyError {</text>
  <text x="733.75" y="433.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--warn-accent)">    #[error("io error: {0}")]</text>
  <text x="733.75" y="447.6111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--bg)">    Io(#[from] std::io::Error),</text>
  <text x="733.75" y="462.1111" font-family="Courier New,monospace" font-size="10.4284" fill="var(--bg)">    #[error("parse failed")] Parse, }</text>
  <rect x="227.5" y="505.6111" width="825" height="80.5556" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="526.5556" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">? Operator Flow</text>
  <text x="302.5" y="547.5" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">call returns</text>
  <text x="302.5" y="562" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">Result&lt;T, E&gt;</text>
  <line x1="377.5" y1="553.9444" x2="452.5" y2="553.9444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="499.375" y="547.5" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">Ok(v)</text>
  <text x="499.375" y="562" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">→ unwrap v</text>
  <line x1="546.25" y1="553.9444" x2="621.25" y2="553.9444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="677.4999" y="547.5" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--danger-accent)" text-anchor="middle">Err(e)</text>
  <text x="677.4999" y="562" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">→ From::from(e)</text>
  <line x1="741.25" y1="553.9444" x2="816.25" y2="553.9444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="902.5" y="547.5" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">early return</text>
  <text x="902.5" y="562" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">Err(converted)</text>
</svg>
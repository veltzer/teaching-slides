<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="391.1111" y="21.3333" width="355.5556" height="71.1111" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="50.6667" font-family="Arial,sans-serif" font-size="16.8889" font-weight="bold" fill="var(--bg)" text-anchor="middle">std::error::Error</text>
  <text x="568.8889" y="69.3333" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--primary-accent)" text-anchor="middle">trait Error: Debug + Display</text>
  <text x="568.8889" y="85.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--primary-accent)" text-anchor="middle">fn source(&amp;self) → Option&lt;&amp;dyn Error&gt;</text>
  <line x1="497.7778" y1="92.4444" x2="293.3333" y2="186.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="640" y1="92.4444" x2="844.4444" y2="186.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="53.3333" y="186.6667" width="462.2222" height="302.2222" fill="var(--ok-fill)" rx="6" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="53.3333" y="186.6667" width="462.2222" height="40.8889" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="53.3333" y="213.3333" width="462.2222" height="14.2222" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="97.7778" y="213.3333" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">anyhow</text>
  <text x="435.5556" y="211.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--ok-accent)" text-anchor="end">crate: anyhow = "1.0"</text>
  <text x="78.2222" y="250.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)">Target: Applications</text>
  <text x="78.2222" y="270.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Single opaque type: anyhow::Error</text>
  <text x="78.2222" y="286.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Wraps any error implementing std::error::Error</text>
  <text x="78.2222" y="302.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Automatic conversion via ? operator</text>
  <text x="78.2222" y="318.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Context: .context("reading config file")</text>
  <text x="78.2222" y="334.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Backtraces with RUST_BACKTRACE=1</text>
  <rect x="72.8889" y="350.2222" width="423.1111" height="120.8889" fill="var(--text)" rx="6" />
  <text x="88.8889" y="369.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--ok-accent)">use anyhow::{Result, Context};</text>
  <text x="88.8889" y="385.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)"> </text>
  <text x="88.8889" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--ok-accent)">fn</text>
  <text x="110.2222" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)"> read_config(path: &amp;</text>
  <text x="110.2222" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--ok-accent)"> </text>
  <text x="88.8889" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">fn read_config(path: &amp;str) -&gt; Result&lt;Config&gt; {</text>
  <text x="88.8889" y="417.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">    let s = fs::read_to_string(path)</text>
  <text x="88.8889" y="433.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">        .context("reading config file")?;</text>
  <text x="88.8889" y="449.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--ok-accent)">    // ? converts any error to anyhow::Error</text>
  <text x="88.8889" y="465.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">    Ok(toml::from_str(&amp;s)?) }</text>
  <rect x="622.2222" y="186.6667" width="462.2222" height="302.2222" fill="var(--warn-fill)" rx="6" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="622.2222" y="186.6667" width="462.2222" height="40.8889" fill="var(--warn-accent)" rx="6" />
  <rect x="622.2222" y="213.3333" width="462.2222" height="14.2222" fill="var(--warn-accent)" rx="6"/>
  <text x="664.8889" y="213.3333" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">thiserror</text>
  <text x="1002.6667" y="211.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--warn-accent)" text-anchor="end">crate: thiserror = "1.0"</text>
  <text x="643.5556" y="250.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">Target: Libraries</text>
  <text x="643.5556" y="270.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Derive macro: #[derive(Error)]</text>
  <text x="643.5556" y="286.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Generates std::error::Error impl</text>
  <text x="643.5556" y="302.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Custom error enums with variants</text>
  <text x="643.5556" y="318.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">#[error("...")] — Display format</text>
  <text x="643.5556" y="334.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">#[from] — auto From conversion</text>
  <rect x="641.7778" y="350.2222" width="423.1111" height="120.8889" fill="var(--text)" rx="6" />
  <text x="657.7778" y="369.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--warn-accent)">use thiserror::Error;</text>
  <text x="657.7778" y="385.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)"> </text>
  <text x="657.7778" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--warn-accent)">#[derive(Debug, Error)]</text>
  <text x="657.7778" y="417.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">pub enum MyError {</text>
  <text x="657.7778" y="433.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--warn-accent)">    #[error("io error: {0}")]</text>
  <text x="657.7778" y="449.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">    Io(#[from] std::io::Error),</text>
  <text x="657.7778" y="465.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">    #[error("parse failed")] Parse, }</text>
  <rect x="177.7778" y="513.7778" width="782.2222" height="88.8889" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="536.8889" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">? Operator Flow</text>
  <text x="248.8889" y="560" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">call returns</text>
  <text x="248.8889" y="576" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">Result&lt;T, E&gt;</text>
  <line x1="320" y1="567.1111" x2="391.1111" y2="567.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="435.5556" y="560" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">Ok(v)</text>
  <text x="435.5556" y="576" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">→ unwrap v</text>
  <line x1="480" y1="567.1111" x2="551.1111" y2="567.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="604.4444" y="560" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--danger-accent)" text-anchor="middle">Err(e)</text>
  <text x="604.4444" y="576" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">→ From::from(e)</text>
  <line x1="664.8889" y1="567.1111" x2="736" y2="567.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="817.7778" y="560" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">early return</text>
  <text x="817.7778" y="576" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">Err(converted)</text>
</svg>
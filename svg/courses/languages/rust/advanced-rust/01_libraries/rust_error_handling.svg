  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="391.1111" y="21.3333" width="355.5556" height="71.1111" fill="url(#grad-accent)" rx="10.6667" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="50.6667" font-family="Arial,sans-serif" font-size="16.8889" font-weight="bold" fill="#ffffff" text-anchor="middle">std::error::Error</ns0:text>
  <ns0:text x="568.8889" y="69.3333" font-family="Arial,sans-serif" font-size="11.5556" fill="#cce5ff" text-anchor="middle">trait Error: Debug + Display</ns0:text>
  <ns0:text x="568.8889" y="85.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#cce5ff" text-anchor="middle">fn source(&amp;self) → Option&lt;&amp;dyn Error&gt;</ns0:text>
  <ns0:line x1="497.7778" y1="92.4444" x2="293.3333" y2="186.6667" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:line x1="640" y1="92.4444" x2="844.4444" y2="186.6667" stroke="#1565c0" stroke-width="2.2222" marker-end="url(#arrow-accent)" />
  <ns0:rect x="53.3333" y="186.6667" width="462.2222" height="302.2222" fill="#e8f5e9" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="53.3333" y="186.6667" width="462.2222" height="40.8889" fill="#388e3c" rx="10.6667" />
  <ns0:rect x="53.3333" y="213.3333" width="462.2222" height="14.2222" fill="#388e3c" />
  <ns0:text x="97.7778" y="213.3333" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">anyhow</ns0:text>
  <ns0:text x="435.5556" y="211.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="#c8e6c9" text-anchor="end">crate: anyhow = "1.0"</ns0:text>
  <ns0:text x="78.2222" y="250.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">Target: Applications</ns0:text>
  <ns0:text x="78.2222" y="270.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333">Single opaque type: anyhow::Error</ns0:text>
  <ns0:text x="78.2222" y="286.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333">Wraps any error implementing std::error::Error</ns0:text>
  <ns0:text x="78.2222" y="302.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333">Automatic conversion via ? operator</ns0:text>
  <ns0:text x="78.2222" y="318.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333">Context: .context("reading config file")</ns0:text>
  <ns0:text x="78.2222" y="334.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333">Backtraces with RUST_BACKTRACE=1</ns0:text>
  <ns0:rect x="72.8889" y="350.2222" width="423.1111" height="120.8889" fill="#1e2a1e" rx="7.1111" />
  <ns0:text x="88.8889" y="369.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#a5d6a7">use anyhow::{Result, Context};</ns0:text>
  <ns0:text x="88.8889" y="385.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffffff"> </ns0:text>
  <ns0:text x="88.8889" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#80cbc4">fn</ns0:text>
  <ns0:text x="110.2222" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffffff"> read_config(path: &amp;</ns0:text>
  <ns0:text x="110.2222" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#80cbc4"> </ns0:text>
  <ns0:text x="88.8889" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffffff">fn read_config(path: &amp;str) -&gt; Result&lt;Config&gt; {</ns0:text>
  <ns0:text x="88.8889" y="417.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffffff">    let s = fs::read_to_string(path)</ns0:text>
  <ns0:text x="88.8889" y="433.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffffff">        .context("reading config file")?;</ns0:text>
  <ns0:text x="88.8889" y="449.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#a5d6a7">    // ? converts any error to anyhow::Error</ns0:text>
  <ns0:text x="88.8889" y="465.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffffff">    Ok(toml::from_str(&amp;s)?) }</ns0:text>
  <ns0:rect x="622.2222" y="186.6667" width="462.2222" height="302.2222" fill="#fff3e0" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="622.2222" y="186.6667" width="462.2222" height="40.8889" fill="#e65100" rx="10.6667" />
  <ns0:rect x="622.2222" y="213.3333" width="462.2222" height="14.2222" fill="#e65100" />
  <ns0:text x="664.8889" y="213.3333" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">thiserror</ns0:text>
  <ns0:text x="1002.6667" y="211.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="#ffe0b2" text-anchor="end">crate: thiserror = "1.0"</ns0:text>
  <ns0:text x="643.5556" y="250.6667" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#bf360c">Target: Libraries</ns0:text>
  <ns0:text x="643.5556" y="270.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333">Derive macro: #[derive(Error)]</ns0:text>
  <ns0:text x="643.5556" y="286.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333">Generates std::error::Error impl</ns0:text>
  <ns0:text x="643.5556" y="302.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333">Custom error enums with variants</ns0:text>
  <ns0:text x="643.5556" y="318.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333">#[error("...")] — Display format</ns0:text>
  <ns0:text x="643.5556" y="334.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333">#[from] — auto From conversion</ns0:text>
  <ns0:rect x="641.7778" y="350.2222" width="423.1111" height="120.8889" fill="#2a1e1a" rx="7.1111" />
  <ns0:text x="657.7778" y="369.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffcc80">use thiserror::Error;</ns0:text>
  <ns0:text x="657.7778" y="385.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffffff"> </ns0:text>
  <ns0:text x="657.7778" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffcc80">#[derive(Debug, Error)]</ns0:text>
  <ns0:text x="657.7778" y="417.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffffff">pub enum MyError {</ns0:text>
  <ns0:text x="657.7778" y="433.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffcc80">    #[error("io error: {0}")]</ns0:text>
  <ns0:text x="657.7778" y="449.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffffff">    Io(#[from] std::io::Error),</ns0:text>
  <ns0:text x="657.7778" y="465.7778" font-family="Courier New,monospace" font-size="10.6667" fill="#ffffff">    #[error("parse failed")] Parse, }</ns0:text>
  <ns0:rect x="177.7778" y="513.7778" width="782.2222" height="88.8889" fill="#e3f2fd" rx="10.6667" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="536.8889" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="#1565c0" text-anchor="middle">? Operator Flow</ns0:text>
  <ns0:text x="248.8889" y="560" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333" text-anchor="middle">call returns</ns0:text>
  <ns0:text x="248.8889" y="576" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333" text-anchor="middle">Result&lt;T, E&gt;</ns0:text>
  <ns0:line x1="320" y1="567.1111" x2="391.1111" y2="567.1111" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:text x="435.5556" y="560" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333" text-anchor="middle">Ok(v)</ns0:text>
  <ns0:text x="435.5556" y="576" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333" text-anchor="middle">→ unwrap v</ns0:text>
  <ns0:line x1="480" y1="567.1111" x2="551.1111" y2="567.1111" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:text x="604.4444" y="560" font-family="Arial,sans-serif" font-size="11.5556" fill="#e53935" text-anchor="middle">Err(e)</ns0:text>
  <ns0:text x="604.4444" y="576" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333" text-anchor="middle">→ From::from(e)</ns0:text>
  <ns0:line x1="664.8889" y1="567.1111" x2="736" y2="567.1111" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-accent)" />
  <ns0:text x="817.7778" y="560" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333" text-anchor="middle">early return</ns0:text>
  <ns0:text x="817.7778" y="576" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333" text-anchor="middle">Err(converted)</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="433.103448" y="40" width="413.793103" height="70.947954" fill="var(--primary-fill)" rx="6.613092" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="69.266125" font-family="Arial,sans-serif" font-size="18.198679" font-weight="bold" fill="var(--bg)" text-anchor="middle">std::error::Error</text>
  <text x="640" y="87.889902" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--primary-accent)" text-anchor="middle">trait Error: Debug + Display</text>
  <text x="640" y="103.853203" font-family="Arial,sans-serif" font-size="11.493995" fill="var(--primary-accent)" text-anchor="middle">fn source(&amp;self) → Option&lt;&amp;dyn Error&gt;</text>
  <line x1="557.241379" y1="110.947954" x2="319.310345" y2="204.954181" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="722.758621" y1="110.947954" x2="960.689545" y2="204.954181" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="40" y="204.954181" width="537.931034" height="301.529026" fill="var(--ok-fill)" rx="6.613092" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="40" y="204.954181" width="537.931034" height="40.795151" fill="var(--ok-fill)" rx="6.613092" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="40" y="231.559609" width="537.931034" height="14.189613" fill="var(--ok-fill)" rx="6.613092" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="91.724138" y="231.559609" font-family="Arial,sans-serif" font-size="19.156585" font-weight="bold" fill="var(--bg)">anyhow</text>
  <text x="484.827586" y="229.786031" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--ok-accent)" text-anchor="end">crate: anyhow = "1.0"</text>
  <text x="68.965517" y="268.807384" font-family="Arial,sans-serif" font-size="13.409478" font-weight="bold" fill="var(--ok-accent)">Target: Applications</text>
  <text x="68.965517" y="288.31806" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)">Single opaque type: anyhow::Error</text>
  <text x="68.965517" y="304.281361" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)">Wraps any error implementing std::error::Error</text>
  <text x="68.965517" y="320.244662" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)">Automatic conversion via ? operator</text>
  <text x="68.965517" y="336.207963" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)">Context: .context("reading config file")</text>
  <text x="68.965517" y="352.171263" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)">Backtraces with RUST_BACKTRACE=1</text>
  <rect x="62.758621" y="368.134564" width="492.413793" height="120.611654" fill="var(--text)" rx="6.613092" />
  <text x="81.37931" y="387.64524" font-family="Courier New,monospace" font-size="11.493995" fill="var(--ok-accent)">use anyhow::{Result, Context};</text>
  <text x="81.37931" y="403.608541" font-family="Courier New,monospace" font-size="11.493995" fill="var(--bg)"> </text>
  <text x="81.37931" y="419.571842" font-family="Courier New,monospace" font-size="11.493995" fill="var(--ok-accent)">fn</text>
  <text x="106.206897" y="419.571842" font-family="Courier New,monospace" font-size="11.493995" fill="var(--bg)"> read_config(path: &amp;</text>
  <text x="106.206897" y="419.571842" font-family="Courier New,monospace" font-size="11.493995" fill="var(--ok-accent)"> </text>
  <text x="81.37931" y="419.571842" font-family="Courier New,monospace" font-size="11.493995" fill="var(--bg)">fn read_config(path: &amp;str) -&gt; Result&lt;Config&gt; {</text>
  <text x="81.37931" y="435.535143" font-family="Courier New,monospace" font-size="11.493995" fill="var(--bg)">    let s = fs::read_to_string(path)</text>
  <text x="81.37931" y="451.498443" font-family="Courier New,monospace" font-size="11.493995" fill="var(--bg)">        .context("reading config file")?;</text>
  <text x="81.37931" y="467.461744" font-family="Courier New,monospace" font-size="11.493995" fill="var(--ok-accent)">    // ? converts any error to anyhow::Error</text>
  <text x="81.37931" y="483.425045" font-family="Courier New,monospace" font-size="11.493995" fill="var(--bg)">    Ok(toml::from_str(&amp;s)?) }</text>
  <rect x="702.068966" y="204.954181" width="537.931034" height="301.529026" fill="var(--warn-fill)" rx="6.613092" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="702.068966" y="204.954181" width="537.931034" height="40.795151" fill="var(--warn-accent)" rx="6.613092" />
  <rect x="702.068966" y="231.559609" width="537.931034" height="14.189613" fill="var(--warn-accent)" rx="6.613092"/>
  <text x="751.724138" y="231.559609" font-family="Arial,sans-serif" font-size="19.156585" font-weight="bold" fill="var(--bg)">thiserror</text>
  <text x="1144.827586" y="229.786031" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--warn-accent)" text-anchor="end">crate: thiserror = "1.0"</text>
  <text x="726.896552" y="268.807384" font-family="Arial,sans-serif" font-size="13.409478" font-weight="bold" fill="var(--danger-accent)">Target: Libraries</text>
  <text x="726.896552" y="288.31806" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)">Derive macro: #[derive(Error)]</text>
  <text x="726.896552" y="304.281361" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)">Generates std::error::Error impl</text>
  <text x="726.896552" y="320.244662" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)">Custom error enums with variants</text>
  <text x="726.896552" y="336.207963" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)">#[error("...")] — Display format</text>
  <text x="726.896552" y="352.171263" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)">#[from] — auto From conversion</text>
  <rect x="724.827586" y="368.134564" width="492.413793" height="120.611654" fill="var(--text)" rx="6.613092" />
  <text x="743.448276" y="387.64524" font-family="Courier New,monospace" font-size="11.493995" fill="var(--warn-accent)">use thiserror::Error;</text>
  <text x="743.448276" y="403.608541" font-family="Courier New,monospace" font-size="11.493995" fill="var(--bg)"> </text>
  <text x="743.448276" y="419.571842" font-family="Courier New,monospace" font-size="11.493995" fill="var(--warn-accent)">#[derive(Debug, Error)]</text>
  <text x="743.448276" y="435.535143" font-family="Courier New,monospace" font-size="11.493995" fill="var(--bg)">pub enum MyError {</text>
  <text x="743.448276" y="451.498443" font-family="Courier New,monospace" font-size="11.493995" fill="var(--warn-accent)">    #[error("io error: {0}")]</text>
  <text x="743.448276" y="467.461744" font-family="Courier New,monospace" font-size="11.493995" fill="var(--bg)">    Io(#[from] std::io::Error),</text>
  <text x="743.448276" y="483.425045" font-family="Courier New,monospace" font-size="11.493995" fill="var(--bg)">    #[error("parse failed")] Parse, }</text>
  <rect x="184.827586" y="531.314947" width="910.344828" height="88.685053" fill="var(--primary-fill)" rx="6.613092" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="554.373109" font-family="Arial,sans-serif" font-size="14.367384" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">? Operator Flow</text>
  <text x="267.586207" y="577.431161" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)" text-anchor="middle">call returns</text>
  <text x="267.586207" y="593.394462" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)" text-anchor="middle">Result&lt;T, E&gt;</text>
  <line x1="350.344828" y1="584.525913" x2="433.103448" y2="584.525913" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="484.827586" y="577.431161" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)" text-anchor="middle">Ok(v)</text>
  <text x="484.827586" y="593.394462" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)" text-anchor="middle">→ unwrap v</text>
  <line x1="536.551724" y1="584.525913" x2="619.310345" y2="584.525913" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="681.3792" y="577.431161" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--danger-accent)" text-anchor="middle">Err(e)</text>
  <text x="681.3792" y="593.394462" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)" text-anchor="middle">→ From::from(e)</text>
  <line x1="751.724138" y1="584.525913" x2="834.482759" y2="584.525913" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="929.655172" y="577.431161" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)" text-anchor="middle">early return</text>
  <text x="929.655172" y="593.394462" font-family="Arial,sans-serif" font-size="12.451792" fill="var(--text)" text-anchor="middle">Err(converted)</text>
</svg>
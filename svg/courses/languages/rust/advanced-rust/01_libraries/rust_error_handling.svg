  <ns0:text x="657.7778" y="401.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--warn-tint)">#[derive(Debug, Error)]</ns0:text>
  <ns0:text x="657.7778" y="417.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">pub enum MyError {</ns0:text>
  <ns0:text x="657.7778" y="433.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--warn-tint)">    #[error("io error: {0}")]</ns0:text>
  <ns0:text x="657.7778" y="449.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">    Io(#[from] std::io::Error),</ns0:text>
  <ns0:text x="657.7778" y="465.7778" font-family="Courier New,monospace" font-size="10.6667" fill="var(--bg)">    #[error("parse failed")] Parse, }</ns0:text>

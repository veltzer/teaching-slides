  <ns0:text x="643.5556" y="286.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-dark)">Generates std::error::Error impl</ns0:text>
  <ns0:text x="643.5556" y="302.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-dark)">Custom error enums with variants</ns0:text>
  <ns0:text x="643.5556" y="318.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-dark)">#[error("...")] — Display format</ns0:text>

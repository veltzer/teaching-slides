<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="433.103448" y="40" width="413.793103" height="70.947954" fill="url(#grad-primary)" rx="6.613092" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="69.266125" font-size="18.198679" font-weight="bold" fill="var(--bg)" text-anchor="middle" font-family="Arial, sans-serif">std::error::Error</text>
  <text x="640" y="95" font-size="12.451792" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">trait Error: Debug + Display + source()</text>
  <line x1="557.241379" y1="110.947954" x2="319.310345" y2="204.954181" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="722.758621" y1="110.947954" x2="960.689545" y2="204.954181" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="40" y="204.954181" width="537.931034" height="301.529026" fill="url(#grad-ok)" rx="6.613092" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="204.954181" width="537.931034" height="40.795151" fill="url(#grad-ok)" rx="6.613092" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="231.559609" width="537.931034" height="14.189613" fill="url(#grad-ok)" rx="6.613092" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="91.724138" y="231.559609" font-size="19.156585" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">anyhow</text>
  <text x="484.827586" y="229.786031" font-size="12.451792" fill="var(--ok-accent)" text-anchor="end" font-family="Arial, sans-serif">anyhow = "1.0"</text>
  <text x="68.965517" y="268.807384" font-size="13.409478" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Target: Applications</text>
  <text x="68.965517" y="295" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">anyhow::Error wraps any error</text>
  <text x="68.965517" y="320" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">? auto converts; .context adds info</text>
  <text x="68.965517" y="345" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">RUST_BACKTRACE=1 for traces</text>
  <rect x="62.758621" y="368.134564" width="492.413793" height="120.611654" fill="var(--text)" rx="6.613092"/>
  <text x="81.37931" y="390" font-size="11.493995" fill="var(--ok-accent)" font-family="Courier New, monospace">use anyhow::{Result, Context};</text>
  <text x="81.37931" y="415" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">fn read(p: &amp;str) -&gt; Result&lt;Config&gt; {</text>
  <text x="81.37931" y="435" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">  let s = fs::read_to_string(p)</text>
  <text x="81.37931" y="455" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">    .context("reading")?;</text>
  <text x="81.37931" y="475" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">  Ok(toml::from_str(&amp;s)?) }</text>
  <rect x="702.068966" y="204.954181" width="537.931034" height="301.529026" fill="url(#grad-warn)" rx="6.613092" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="702.068966" y="204.954181" width="537.931034" height="40.795151" fill="var(--warn-accent)" rx="6.613092"/>
  <rect x="702.068966" y="231.559609" width="537.931034" height="14.189613" fill="var(--warn-accent)" rx="6.613092"/>
  <text x="751.724138" y="231.559609" font-size="19.156585" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">thiserror</text>
  <text x="1144.827586" y="229.786031" font-size="12.451792" fill="var(--warn-accent)" text-anchor="end" font-family="Arial, sans-serif">thiserror = "1.0"</text>
  <text x="726.896552" y="268.807384" font-size="13.409478" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Target: Libraries</text>
  <text x="726.896552" y="290" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">#[derive(Error)] on enums</text>
  <text x="726.896552" y="310" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">Generates impl</text>
  <text x="726.896552" y="330" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">#[error("...")] Display</text>
  <text x="726.896552" y="350" font-size="12.451792" fill="var(--text)" font-family="Arial, sans-serif">#[from] auto-From</text>
  <rect x="724.827586" y="368.134564" width="492.413793" height="120.611654" fill="var(--text)" rx="6.613092"/>
  <text x="743.448276" y="390" font-size="11.493995" fill="var(--warn-accent)" font-family="Courier New, monospace">#[derive(Debug, Error)]</text>
  <text x="743.448276" y="415" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">pub enum MyError {</text>
  <text x="743.448276" y="435" font-size="11.493995" fill="var(--warn-accent)" font-family="Courier New, monospace">  #[error("io: {0}")]</text>
  <text x="743.448276" y="455" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">  Io(#[from] io::Error),</text>
  <text x="743.448276" y="475" font-size="11.493995" fill="var(--bg)" font-family="Courier New, monospace">  Parse, }</text>
  <rect x="184.827586" y="531.314947" width="910.344828" height="88.685053" fill="url(#grad-primary)" rx="6.613092" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="554.373109" font-size="14.367384" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle" font-family="Arial, sans-serif">? Operator Flow</text>
  <text x="267.586207" y="585" font-size="12.451792" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Result&lt;T,E&gt;</text>
  <line x1="350.344828" y1="584.525913" x2="433.103448" y2="584.525913" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <text x="484.827586" y="585" font-size="12.451792" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Ok(v) → v</text>
  <line x1="536.551724" y1="584.525913" x2="619.310345" y2="584.525913" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <text x="681.3792" y="585" font-size="12.451792" fill="var(--danger-accent)" text-anchor="middle" font-family="Arial, sans-serif">Err → From::from</text>
  <line x1="751.724138" y1="584.525913" x2="834.482759" y2="584.525913" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <text x="929.655172" y="585" font-size="12.451792" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">early return Err</text>
</svg>

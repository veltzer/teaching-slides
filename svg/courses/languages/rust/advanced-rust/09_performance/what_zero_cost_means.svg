<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr" markerWidth="15.5152" markerHeight="21.3333" refX="11.6364" refY="8" orient="auto">
      <path d="M 0 0 L 0 16 L 15.5152 8 z" fill="#555" />
    </marker>
  </defs>
  <rect x="19.3939" y="26.6667" width="1241.2121" height="240" fill="#e3f2fd" stroke="#333" stroke-width="2.9091" rx="7.7576" />
  <text x="38.7879" y="80" font-family="sans-serif" font-size="25.2121" fill="#1565c0" text-anchor="start" font-weight="bold">Bjarne Stroustrup's Principle:</text>
  <text x="54.303" y="133.3333" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start">"What you don't use, you don't pay for.</text>
  <text x="54.303" y="176" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start"> What you do use, you couldn't hand-code any better."</text>
  <text x="38.7879" y="320" font-family="sans-serif" font-size="25.2121" fill="#222" text-anchor="start" font-weight="bold">Rust zero-cost abstractions:</text>
  <text x="54.303" y="368" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="start">• Iterators compile to the same code as hand-written loops</text>
  <text x="54.303" y="426.6667" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="start">• Generics are monomorphized (no virtual dispatch overhead)</text>
  <text x="54.303" y="485.3333" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="start">• Traits with static dispatch are inlined away</text>
  <text x="54.303" y="544" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="start">• Option&lt;&amp;T&gt; is the same size as *const T (null pointer opt)</text>
  <text x="54.303" y="602.6667" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="start">• String bounds checks are elided when the compiler can prove safety</text>
</svg>
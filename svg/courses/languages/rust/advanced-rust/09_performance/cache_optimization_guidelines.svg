<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 12 L 15.0588 6 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="58.1818" y="74.1176" font-family="sans-serif" font-size="23.9197" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Cache Optimization Rules</text>
  <text x="58.1818" y="101.4118" font-family="sans-serif" font-size="20.5026" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">1. Sequential access beats random access</text>
  <text x="72.7273" y="127.0001" font-family="sans-serif" font-size="18.7941" fill="var(--text)" text-anchor="start">Vec&lt;T&gt;  &gt;&gt;  LinkedList&lt;T&gt; for iteration</text>
  <text x="58.1818" y="162.8236" font-family="sans-serif" font-size="20.5026" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">2. Keep hot data together</text>
  <text x="72.7273" y="188.4117" font-family="sans-serif" font-size="18.7941" fill="var(--text)" text-anchor="start">SoA layout: few fields, many items   |   AoS layout: all fields, few items</text>
  <text x="58.1818" y="224.2353" font-family="sans-serif" font-size="20.5026" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">3. Minimize struct size</text>
  <text x="72.7273" y="249.8235" font-family="sans-serif" font-size="18.7941" fill="var(--text)" text-anchor="start">Less data per cache line = more items per line. Use #[repr(C)] or reorder fields.</text>
  <text x="58.1818" y="285.6471" font-family="sans-serif" font-size="20.5026" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">4. Avoid pointer chasing</text>
  <text x="72.7273" y="311.2353" font-family="sans-serif" font-size="18.7941" fill="var(--text)" text-anchor="start">Vec&lt;T&gt; instead of Vec&lt;Box&lt;T&gt;&gt;   |   Flatten nested structures when possible</text>
  <text x="58.1818" y="347.0589" font-family="sans-serif" font-size="20.5026" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">5. Use indices instead of pointers for graphs/trees</text>
  <text x="72.7273" y="372.647" font-family="sans-serif" font-size="18.7941" fill="var(--text)" text-anchor="start">Store nodes in a Vec, reference by index  (arena allocation pattern)</text>
  <line x1="58.1818" y1="411.8824" x2="1221.8182" y2="411.8824" stroke="var(--text-faint)" stroke-width="1.7211" />
  <text x="58.1818" y="439.1764" font-family="sans-serif" font-size="18.7941" fill="var(--text-muted)" text-anchor="start">Cache line = 64 bytes on x86.  L1 ~1ns,  L2 ~5ns,  L3 ~20ns,  DRAM ~100ns.</text>
</svg>
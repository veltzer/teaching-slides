<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <ns0:marker id="arr" markerWidth="13.768" markerHeight="14.6286" refX="10.326" refY="5.4857" orient="auto">
      <ns0:path d="M 0 0 L 0 10.9714 L 13.768 5.4857 z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="17.2101" y="18.2857" width="1135.8655" height="621.7143" fill="#e3f2fd" stroke="#333" stroke-width="2.5815" rx="6.884" />
  <ns0:text x="34.4202" y="54.8571" font-family="sans-serif" font-size="24.0941" fill="#0d47a1" text-anchor="start" font-weight="bold">Cache Optimization Rules</ns0:text>
  <ns0:text x="34.4202" y="84.1143" font-family="sans-serif" font-size="20.6521" fill="#1565c0" text-anchor="start" font-weight="bold">1. Sequential access beats random access</ns0:text>
  <ns0:text x="48.1883" y="111.5429" font-family="sans-serif" font-size="18.9311" fill="#333" text-anchor="start">Vec&lt;T&gt;  &gt;&gt;  LinkedList&lt;T&gt; for iteration</ns0:text>
  <ns0:text x="34.4202" y="149.9429" font-family="sans-serif" font-size="20.6521" fill="#1565c0" text-anchor="start" font-weight="bold">2. Keep hot data together</ns0:text>
  <ns0:text x="48.1883" y="177.3714" font-family="sans-serif" font-size="18.9311" fill="#333" text-anchor="start">SoA layout: few fields, many items   |   AoS layout: all fields, few items</ns0:text>
  <ns0:text x="34.4202" y="215.7714" font-family="sans-serif" font-size="20.6521" fill="#1565c0" text-anchor="start" font-weight="bold">3. Minimize struct size</ns0:text>
  <ns0:text x="48.1883" y="243.2" font-family="sans-serif" font-size="18.9311" fill="#333" text-anchor="start">Less data per cache line = more items per line. Use #[repr(C)] or reorder fields.</ns0:text>
  <ns0:text x="34.4202" y="281.6" font-family="sans-serif" font-size="20.6521" fill="#1565c0" text-anchor="start" font-weight="bold">4. Avoid pointer chasing</ns0:text>
  <ns0:text x="48.1883" y="309.0286" font-family="sans-serif" font-size="18.9311" fill="#333" text-anchor="start">Vec&lt;T&gt; instead of Vec&lt;Box&lt;T&gt;&gt;   |   Flatten nested structures when possible</ns0:text>
  <ns0:text x="34.4202" y="347.4286" font-family="sans-serif" font-size="20.6521" fill="#1565c0" text-anchor="start" font-weight="bold">5. Use indices instead of pointers for graphs/trees</ns0:text>
  <ns0:text x="48.1883" y="374.8571" font-family="sans-serif" font-size="18.9311" fill="#333" text-anchor="start">Store nodes in a Vec, reference by index  (arena allocation pattern)</ns0:text>
  <ns0:line x1="34.4202" y1="416.9143" x2="1135.8655" y2="416.9143" stroke="#aaa" stroke-width="1.7211" />
  <ns0:text x="34.4202" y="446.1714" font-family="sans-serif" font-size="18.9311" fill="#555" text-anchor="start">Cache line = 64 bytes on x86.  L1 ~1ns,  L2 ~5ns,  L3 ~20ns,  DRAM ~100ns.</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr" markerWidth="15.0588" markerHeight="16" refX="11.2941" refY="6" orient="auto">
      <path d="M 0 0 L 0 12 L 15.0588 6 z" fill="#555" />
    </marker>
  </defs>
  <rect x="18.8235" y="20" width="1242.3529" height="680" fill="#e3f2fd" stroke="#333" stroke-width="2.8235" rx="7.5294" />
  <text x="37.6471" y="60" font-family="sans-serif" font-size="26.3529" fill="#0d47a1" text-anchor="start" font-weight="bold">Cache Optimization Rules</text>
  <text x="37.6471" y="92" font-family="sans-serif" font-size="22.5882" fill="#1565c0" text-anchor="start" font-weight="bold">1. Sequential access beats random access</text>
  <text x="52.7059" y="122" font-family="sans-serif" font-size="20.7059" fill="#333" text-anchor="start">Vec&lt;T&gt;  &gt;&gt;  LinkedList&lt;T&gt; for iteration</text>
  <text x="37.6471" y="164" font-family="sans-serif" font-size="22.5882" fill="#1565c0" text-anchor="start" font-weight="bold">2. Keep hot data together</text>
  <text x="52.7059" y="194" font-family="sans-serif" font-size="20.7059" fill="#333" text-anchor="start">SoA layout: few fields, many items   |   AoS layout: all fields, few items</text>
  <text x="37.6471" y="236" font-family="sans-serif" font-size="22.5882" fill="#1565c0" text-anchor="start" font-weight="bold">3. Minimize struct size</text>
  <text x="52.7059" y="266" font-family="sans-serif" font-size="20.7059" fill="#333" text-anchor="start">Less data per cache line = more items per line. Use #[repr(C)] or reorder fields.</text>
  <text x="37.6471" y="308" font-family="sans-serif" font-size="22.5882" fill="#1565c0" text-anchor="start" font-weight="bold">4. Avoid pointer chasing</text>
  <text x="52.7059" y="338" font-family="sans-serif" font-size="20.7059" fill="#333" text-anchor="start">Vec&lt;T&gt; instead of Vec&lt;Box&lt;T&gt;&gt;   |   Flatten nested structures when possible</text>
  <text x="37.6471" y="380" font-family="sans-serif" font-size="22.5882" fill="#1565c0" text-anchor="start" font-weight="bold">5. Use indices instead of pointers for graphs/trees</text>
  <text x="52.7059" y="410" font-family="sans-serif" font-size="20.7059" fill="#333" text-anchor="start">Store nodes in a Vec, reference by index  (arena allocation pattern)</text>
  <line x1="37.6471" y1="456" x2="1242.3529" y2="456" stroke="#aaa" stroke-width="1.8824" />
  <text x="37.6471" y="488" font-family="sans-serif" font-size="20.7059" fill="#555" text-anchor="start">Cache line = 64 bytes on x86.  L1 ~1ns,  L2 ~5ns,  L3 ~20ns,  DRAM ~100ns.</text>
</svg>
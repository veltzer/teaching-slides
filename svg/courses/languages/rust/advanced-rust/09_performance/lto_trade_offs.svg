<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 14.6286 8.64 z" fill="#555" />
    </marker>
  </defs>
  <rect x="18.2857" y="28.8" width="1243.4286" height="74.88" fill="var(--primary-accent)" stroke="var(--text)" stroke-width="2.7429" rx="6" />
  <text x="29.2571" y="77.76" font-family="sans-serif" font-size="21.9429" fill="var(--bg)" text-anchor="start" font-weight="bold">Setting</text>
  <text x="349.2571" y="77.76" font-family="sans-serif" font-size="21.9429" fill="var(--bg)" text-anchor="start" font-weight="bold">Compile</text>
  <text x="532.1143" y="77.76" font-family="sans-serif" font-size="21.9429" fill="var(--bg)" text-anchor="start" font-weight="bold">Binary Size</text>
  <text x="705.8286" y="77.76" font-family="sans-serif" font-size="21.9429" fill="var(--bg)" text-anchor="start" font-weight="bold">Runtime Performance</text>
  <line x1="338.2857" y1="28.8" x2="338.2857" y2="426.24" stroke="var(--text-faint)" stroke-width="1.8286" />
  <line x1="521.1429" y1="28.8" x2="521.1429" y2="426.24" stroke="var(--text-faint)" stroke-width="1.8286" />
  <line x1="694.8571" y1="28.8" x2="694.8571" y2="426.24" stroke="var(--text-faint)" stroke-width="1.8286" />
  <rect x="18.2857" y="103.68" width="1243.4286" height="80.64" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="29.2571" y="155.52" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">lto = false</text>
  <text x="349.2571" y="155.52" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">Fast</text>
  <text x="532.1143" y="155.52" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">Larger</text>
  <text x="705.8286" y="155.52" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">Baseline</text>
  <rect x="18.2857" y="184.32" width="1243.4286" height="80.64" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="29.2571" y="236.16" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">lto = "thin"</text>
  <text x="349.2571" y="236.16" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">Moderate</text>
  <text x="532.1143" y="236.16" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">Smaller</text>
  <text x="705.8286" y="236.16" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">Good (5–15% faster)</text>
  <rect x="18.2857" y="264.96" width="1243.4286" height="80.64" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="29.2571" y="316.8" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">lto = true</text>
  <text x="349.2571" y="316.8" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">Slow</text>
  <text x="532.1143" y="316.8" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">Smallest</text>
  <text x="705.8286" y="316.8" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">Best (10–20% faster)</text>
  <rect x="18.2857" y="345.6" width="1243.4286" height="80.64" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="29.2571" y="397.44" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">codegen-units=1</text>
  <text x="349.2571" y="397.44" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">Slower</text>
  <text x="532.1143" y="397.44" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">Smaller</text>
  <text x="705.8286" y="397.44" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">Better inlining</text>
  <text x="36.5714" y="495.36" font-family="sans-serif" font-size="21.9429" fill="var(--text)" text-anchor="start" font-weight="bold">Recommended release profile for maximum performance:</text>
  <rect x="18.2857" y="518.4" width="1243.4286" height="69.12" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="32.9143" y="564.48" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="start">[profile.release]  lto=true  codegen-units=1  opt-level=3  strip=true  panic="abort"</text>
</svg>
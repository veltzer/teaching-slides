<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 15.4286 L 14.6286 7.7143 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="181.8181" height="138.7559" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130.9091" y="95.5023" font-family="sans-serif" font-size="24.6247" fill="var(--text)" text-anchor="middle" font-weight="bold">Rust Source</text>
  <text x="130.9091" y="145.4544" font-family="sans-serif" font-size="20.8363" fill="var(--text-muted)" text-anchor="middle">(.rs)</text>
  <rect x="367.2728" y="40" width="200" height="138.7559" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="467.2727" y="95.5023" font-family="sans-serif" font-size="24.6247" fill="var(--text)" text-anchor="middle" font-weight="bold">rustc</text>
  <text x="467.2727" y="145.4544" font-family="sans-serif" font-size="20.8363" fill="var(--text-muted)" text-anchor="middle">frontend</text>
  <rect x="712.7273" y="40" width="181.8181" height="138.7559" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="803.6363" y="95.5023" font-family="sans-serif" font-size="24.6247" fill="var(--text)" text-anchor="middle" font-weight="bold">LLVM IR</text>
  <rect x="1040" y="40" width="200" height="138.7559" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1139.9999" y="95.5023" font-family="sans-serif" font-size="24.6247" fill="var(--text)" text-anchor="middle" font-weight="bold">Machine</text>
  <text x="1139.9999" y="145.4544" font-family="sans-serif" font-size="20.8363" fill="var(--text-muted)" text-anchor="middle">Code</text>
  <line x1="221.8182" y1="109.378" x2="367.2728" y2="109.378" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="567.2727" y1="109.378" x2="712.7273" y2="109.378" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="894.5454" y1="109.378" x2="1040" y2="109.378" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="803.6363" y1="178.7559" x2="803.6363" y2="267.5598" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="818.1818" y="245.3588" font-family="sans-serif" font-size="20.8363" fill="var(--text-muted)" text-anchor="start">Optimization Passes</text>
  <rect x="58.1818" y="317.5119" width="272.7272" height="122.1053" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="194.5455" y="361.9138" font-family="sans-serif" font-size="20.8363" fill="var(--text)" text-anchor="middle">Inlining</text>
  <rect x="421.8182" y="317.5119" width="272.7272" height="122.1053" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="558.1818" y="361.9138" font-family="sans-serif" font-size="20.8363" fill="var(--text)" text-anchor="middle">Dead Code</text>
  <text x="558.1818" y="406.3157" font-family="sans-serif" font-size="20.8363" fill="var(--text)" text-anchor="middle">Elimination</text>
  <rect x="785.4545" y="317.5119" width="272.7272" height="122.1053" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="921.8182" y="361.9138" font-family="sans-serif" font-size="20.8363" fill="var(--text)" text-anchor="middle">Vectorize</text>
  <text x="921.8182" y="406.3157" font-family="sans-serif" font-size="20.8363" fill="var(--text)" text-anchor="middle">(SIMD)</text>
  <rect x="58.1818" y="497.8947" width="272.7272" height="122.1053" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="194.5455" y="542.2965" font-family="sans-serif" font-size="20.8363" fill="var(--text)" text-anchor="middle">Constant</text>
  <text x="194.5455" y="586.6985" font-family="sans-serif" font-size="20.8363" fill="var(--text)" text-anchor="middle">Folding</text>
  <rect x="421.8182" y="497.8947" width="272.7272" height="122.1053" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="558.1818" y="542.2965" font-family="sans-serif" font-size="20.8363" fill="var(--text)" text-anchor="middle">Loop</text>
  <text x="558.1818" y="586.6985" font-family="sans-serif" font-size="20.8363" fill="var(--text)" text-anchor="middle">Unrolling</text>
  <rect x="785.4545" y="497.8947" width="272.7272" height="122.1053" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="921.8182" y="542.2965" font-family="sans-serif" font-size="20.8363" fill="var(--text)" text-anchor="middle">Tail Call</text>
  <text x="921.8182" y="586.6985" font-family="sans-serif" font-size="20.8363" fill="var(--text)" text-anchor="middle">Opt</text>
</svg>
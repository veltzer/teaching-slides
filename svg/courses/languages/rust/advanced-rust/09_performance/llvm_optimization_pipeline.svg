<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 15.4286 L 14.6286 7.7143 z" fill="#555" />
    </marker>
  </defs>
  <rect x="36.5714" y="77.1429" width="182.8571" height="128.5714" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="128" y="128.5714" font-family="sans-serif" font-size="23.7714" fill="var(--text)" text-anchor="middle" font-weight="bold">Rust Source</text>
  <text x="128" y="174.8571" font-family="sans-serif" font-size="20.1143" fill="var(--text-muted)" text-anchor="middle">(.rs)</text>
  <rect x="365.7143" y="77.1429" width="201.1429" height="128.5714" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="466.2857" y="128.5714" font-family="sans-serif" font-size="23.7714" fill="var(--text)" text-anchor="middle" font-weight="bold">rustc</text>
  <text x="466.2857" y="174.8571" font-family="sans-serif" font-size="20.1143" fill="var(--text-muted)" text-anchor="middle">frontend</text>
  <rect x="713.1429" y="77.1429" width="182.8571" height="128.5714" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="804.5714" y="128.5714" font-family="sans-serif" font-size="23.7714" fill="var(--text)" text-anchor="middle" font-weight="bold">LLVM IR</text>
  <rect x="1042.2857" y="77.1429" width="201.1429" height="128.5714" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1142.8571" y="128.5714" font-family="sans-serif" font-size="23.7714" fill="var(--text)" text-anchor="middle" font-weight="bold">Machine</text>
  <text x="1142.8571" y="174.8571" font-family="sans-serif" font-size="20.1143" fill="var(--text-muted)" text-anchor="middle">Code</text>
  <line x1="219.4286" y1="141.4286" x2="365.7143" y2="141.4286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="566.8571" y1="141.4286" x2="713.1429" y2="141.4286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="896" y1="141.4286" x2="1042.2857" y2="141.4286" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="804.5714" y1="205.7143" x2="804.5714" y2="288" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="819.2" y="267.4286" font-family="sans-serif" font-size="20.1143" fill="var(--text-muted)" text-anchor="start">Optimization Passes</text>
  <rect x="54.8571" y="334.2857" width="274.2857" height="113.1429" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="192" y="375.4286" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="middle">Inlining</text>
  <rect x="420.5714" y="334.2857" width="274.2857" height="113.1429" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="557.7143" y="375.4286" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="middle">Dead Code</text>
  <text x="557.7143" y="416.5714" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="middle">Elimination</text>
  <rect x="786.2857" y="334.2857" width="274.2857" height="113.1429" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="923.4286" y="375.4286" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="middle">Vectorize</text>
  <text x="923.4286" y="416.5714" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="middle">(SIMD)</text>
  <rect x="54.8571" y="501.4286" width="274.2857" height="113.1429" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="192" y="542.5714" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="middle">Constant</text>
  <text x="192" y="583.7143" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="middle">Folding</text>
  <rect x="420.5714" y="501.4286" width="274.2857" height="113.1429" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="557.7143" y="542.5714" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="middle">Loop</text>
  <text x="557.7143" y="583.7143" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="middle">Unrolling</text>
  <rect x="786.2857" y="501.4286" width="274.2857" height="113.1429" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="923.4286" y="542.5714" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="middle">Tail Call</text>
  <text x="923.4286" y="583.7143" font-family="sans-serif" font-size="20.1143" fill="var(--text)" text-anchor="middle">Opt</text>
</svg>
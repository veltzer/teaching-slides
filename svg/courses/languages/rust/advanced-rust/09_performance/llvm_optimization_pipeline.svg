<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="181.8181" height="138.7559" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130.9091" y="95.5023" font-size="24.6247" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Rust Source</text>
  <text x="130.9091" y="145.4544" font-size="20.8363" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">(.rs)</text>
  <rect x="367.2728" y="40" width="200" height="138.7559" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="467.2727" y="95.5023" font-size="24.6247" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">rustc</text>
  <text x="467.2727" y="145.4544" font-size="20.8363" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">frontend</text>
  <rect x="712.7273" y="40" width="181.8181" height="138.7559" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="803.6363" y="95.5023" font-size="24.6247" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">LLVM IR</text>
  <rect x="1040" y="40" width="200" height="138.7559" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1139.9999" y="95.5023" font-size="24.6247" fill="var(--text)" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Machine</text>
  <text x="1139.9999" y="145.4544" font-size="20.8363" fill="var(--text-muted)" text-anchor="middle" font-family="Arial, sans-serif">Code</text>
  <line x1="221.8182" y1="109.378" x2="367.2728" y2="109.378" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="567.2727" y1="109.378" x2="712.7273" y2="109.378" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="894.5454" y1="109.378" x2="1040" y2="109.378" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="803.6363" y1="178.7559" x2="803.6363" y2="267.5598" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="818.1818" y="245.3588" font-size="20.8363" fill="var(--text-muted)" text-anchor="start" font-family="Arial, sans-serif">Optimization Passes</text>
  <rect x="58.1818" y="317.5119" width="272.7272" height="122.1053" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="194.5455" y="361.9138" font-size="20.8363" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Inlining</text>
  <rect x="421.8182" y="317.5119" width="272.7272" height="122.1053" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="558.1818" y="361.9138" font-size="20.8363" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Dead Code</text>
  <text x="558.1818" y="406.3157" font-size="20.8363" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Elimination</text>
  <rect x="785.4545" y="317.5119" width="272.7272" height="122.1053" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="921.8182" y="361.9138" font-size="20.8363" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Vectorize</text>
  <text x="921.8182" y="406.3157" font-size="20.8363" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">(SIMD)</text>
  <rect x="58.1818" y="497.8947" width="272.7272" height="122.1053" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="194.5455" y="542.2965" font-size="20.8363" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Constant</text>
  <text x="194.5455" y="586.6985" font-size="20.8363" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Folding</text>
  <rect x="421.8182" y="497.8947" width="272.7272" height="122.1053" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="558.1818" y="542.2965" font-size="20.8363" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Loop</text>
  <text x="558.1818" y="586.6985" font-size="20.8363" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Unrolling</text>
  <rect x="785.4545" y="497.8947" width="272.7272" height="122.1053" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="921.8182" y="542.2965" font-size="20.8363" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Tail Call</text>
  <text x="921.8182" y="586.6985" font-size="20.8363" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Opt</text>
</svg>
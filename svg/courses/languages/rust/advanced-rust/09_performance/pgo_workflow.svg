<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arr" markerWidth="15.5152" markerHeight="16" refX="11.6364" refY="6" orient="auto">
      <path d="M 0 0 L 0 12 L 15.5152 6 z" fill="#555" />
    </marker>
  </defs>
  <rect x="19.3939" y="20" width="1241.2121" height="136" fill="#e3f2fd" stroke="#333" stroke-width="2.9091" rx="7.7576" />
  <text x="38.7879" y="60" font-family="sans-serif" font-size="25.2121" fill="#1565c0" text-anchor="start" font-weight="bold">Step 1: Build with instrumentation</text>
  <text x="50.4242" y="96" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="start">Source  →  Instrumented Binary</text>
  <rect x="19.3939" y="220" width="1241.2121" height="176" fill="#e8f5e9" stroke="#333" stroke-width="2.9091" rx="7.7576" />
  <text x="38.7879" y="260" font-family="sans-serif" font-size="25.2121" fill="#2e7d32" text-anchor="start" font-weight="bold">Step 2: Run representative workload</text>
  <text x="50.4242" y="296" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="start">Instrumented Binary + real workload</text>
  <text x="50.4242" y="336" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="start">→ writes profile data to profile_data/*.profraw</text>
  <line x1="640" y1="156" x2="640" y2="220" stroke="#555" stroke-width="2.9091" marker-end="url(#arr)" />
  <rect x="19.3939" y="460" width="1241.2121" height="136" fill="#fff3e0" stroke="#333" stroke-width="2.9091" rx="7.7576" />
  <text x="38.7879" y="500" font-family="sans-serif" font-size="25.2121" fill="#e65100" text-anchor="start" font-weight="bold">Step 3: Rebuild with profile data</text>
  <text x="50.4242" y="536" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="start">Source + profiles  →  Optimized Binary (5–20% faster)</text>
  <line x1="640" y1="396" x2="640" y2="460" stroke="#555" stroke-width="2.9091" marker-end="url(#arr)" />
</svg>
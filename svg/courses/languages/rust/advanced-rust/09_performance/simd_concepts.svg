  <text x="33.734" y="451.6129" font-family="sans-serif" font-size="20.2403" fill="var(--ok-deep)" text-anchor="start">→ 1 instruction for 4 elements  (4× throughput)</text>
  <text x="33.734" y="516.129" font-family="sans-serif" font-size="18.5537" fill="var(--text-darker)" text-anchor="start" font-weight="bold">SSE:</text>
  <text x="151.8027" y="516.129" font-family="sans-serif" font-size="18.5537" fill="var(--text-dark)" text-anchor="start">128-bit  (4× f32, 2× f64, 16× u8)</text>
  <text x="33.734" y="557.4194" font-family="sans-serif" font-size="18.5537" fill="var(--text-darker)" text-anchor="start" font-weight="bold">AVX2:</text>
  <text x="151.8027" y="557.4194" font-family="sans-serif" font-size="18.5537" fill="var(--text-dark)" text-anchor="start">256-bit  (8× f32, 4× f64, 32× u8)</text>
  <text x="33.734" y="598.7097" font-family="sans-serif" font-size="18.5537" fill="var(--text-darker)" text-anchor="start" font-weight="bold">AVX-512:</text>
  <text x="151.8027" y="598.7097" font-family="sans-serif" font-size="18.5537" fill="var(--text-dark)" text-anchor="start">512-bit (16× f32, 8× f64, 64× u8)</text>
  <text x="33.734" y="640" font-family="sans-serif" font-size="18.5537" fill="var(--text-darker)" text-anchor="start" font-weight="bold">NEON:</text>
  <text x="151.8027" y="640" font-family="sans-serif" font-size="18.5537" fill="var(--text-dark)" text-anchor="start">128-bit  (ARM)</text>

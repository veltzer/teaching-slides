    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 15.0588 8.64 z" fill="#555" />
    </marker>
  </defs>
  <text x="33.734" y="51.6129" font-family="sans-serif" font-size="21.9271" fill="var(--text-darker)" text-anchor="start" font-weight="bold">Scalar operation (one element at a time):</text>
  <rect x="33.734" y="103.2258" width="84.3348" height="77.4194" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="64.0944" y="157.4194" font-family="sans-serif" font-size="21.9271" fill="var(--text-darker)" text-anchor="start" font-weight="bold">a</text>
  <text x="168.6696" y="154.8387" font-family="sans-serif" font-size="26.9871" fill="var(--text-darker)" text-anchor="start" font-weight="bold">+</text>
  <rect x="269.8714" y="103.2258" width="84.3348" height="77.4194" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="300.2319" y="157.4194" font-family="sans-serif" font-size="21.9271" fill="var(--text-darker)" text-anchor="start" font-weight="bold">b</text>
  <text x="404.8071" y="154.8387" font-family="sans-serif" font-size="26.9871" fill="var(--text-darker)" text-anchor="start" font-weight="bold">=</text>
  <rect x="506.0089" y="103.2258" width="84.3348" height="77.4194" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="536.3694" y="157.4194" font-family="sans-serif" font-size="21.9271" fill="var(--text-darker)" text-anchor="start" font-weight="bold">c</text>
  <text x="674.6785" y="154.8387" font-family="sans-serif" font-size="20.2403" fill="var(--text-muted)" text-anchor="start">→ 1 instruction per element</text>
  <text x="33.734" y="283.871" font-family="sans-serif" font-size="21.9271" fill="var(--text-darker)" text-anchor="start" font-weight="bold">SIMD operation (four elements at a time with SSE/NEON):</text>
  <rect x="33.734" y="309.6774" width="84.3348" height="77.4194" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="57.3477" y="363.871" font-family="sans-serif" font-size="20.2403" fill="var(--text-darker)" text-anchor="start">a0</text>
  <rect x="124.8155" y="309.6774" width="84.3348" height="77.4194" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="148.4293" y="363.871" font-family="sans-serif" font-size="20.2403" fill="var(--text-darker)" text-anchor="start">a1</text>
  <rect x="215.8971" y="309.6774" width="84.3348" height="77.4194" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="239.5108" y="363.871" font-family="sans-serif" font-size="20.2403" fill="var(--text-darker)" text-anchor="start">a2</text>
  <rect x="306.9787" y="309.6774" width="84.3348" height="77.4194" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="330.5925" y="363.871" font-family="sans-serif" font-size="20.2403" fill="var(--text-darker)" text-anchor="start">a3</text>
  <rect x="438.541" y="309.6774" width="84.3348" height="77.4194" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="462.1547" y="363.871" font-family="sans-serif" font-size="20.2403" fill="var(--text-darker)" text-anchor="start">b0</text>
  <rect x="529.6226" y="309.6774" width="84.3348" height="77.4194" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="553.2364" y="363.871" font-family="sans-serif" font-size="20.2403" fill="var(--text-darker)" text-anchor="start">b1</text>
  <rect x="620.7042" y="309.6774" width="84.3348" height="77.4194" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="644.3179" y="363.871" font-family="sans-serif" font-size="20.2403" fill="var(--text-darker)" text-anchor="start">b2</text>
  <rect x="711.7858" y="309.6774" width="84.3348" height="77.4194" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="735.3996" y="363.871" font-family="sans-serif" font-size="20.2403" fill="var(--text-darker)" text-anchor="start">b3</text>
  <rect x="843.3481" y="309.6774" width="84.3348" height="77.4194" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="866.9618" y="363.871" font-family="sans-serif" font-size="20.2403" fill="var(--text-darker)" text-anchor="start">c0</text>
  <rect x="934.4297" y="309.6774" width="84.3348" height="77.4194" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="958.0435" y="363.871" font-family="sans-serif" font-size="20.2403" fill="var(--text-darker)" text-anchor="start">c1</text>
  <rect x="1025.5113" y="309.6774" width="84.3348" height="77.4194" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />
  <text x="1049.125" y="363.871" font-family="sans-serif" font-size="20.2403" fill="var(--text-darker)" text-anchor="start">c2</text>
  <rect x="1116.5928" y="309.6774" width="84.3348" height="77.4194" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="2.53" rx="6.7468" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 17.28 L 15.0588 8.64 z" fill="#555" />
    </marker>
  </defs>
  <text x="40" y="40" font-family="sans-serif" font-size="22.0741" fill="var(--text)" text-anchor="start" font-weight="bold">Scalar operation (one element at a time):</text>
  <rect x="40" y="90.8772" width="86.7052" height="76.3158" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="71.2137" y="144.2983" font-family="sans-serif" font-size="22.0741" fill="var(--text)" text-anchor="start" font-weight="bold">a</text>
  <text x="178.7282" y="141.7544" font-family="sans-serif" font-size="27.168" fill="var(--text)" text-anchor="start" font-weight="bold">+</text>
  <rect x="282.7745" y="90.8772" width="86.7052" height="76.3158" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="313.9884" y="144.2983" font-family="sans-serif" font-size="22.0741" fill="var(--text)" text-anchor="start" font-weight="bold">b</text>
  <text x="421.5029" y="141.7544" font-family="sans-serif" font-size="27.168" fill="var(--text)" text-anchor="start" font-weight="bold">=</text>
  <rect x="525.5492" y="90.8772" width="86.7052" height="76.3158" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="556.763" y="144.2983" font-family="sans-serif" font-size="22.0741" fill="var(--text)" text-anchor="start" font-weight="bold">c</text>
  <text x="698.9596" y="141.7544" font-family="sans-serif" font-size="20.376" fill="var(--text-muted)" text-anchor="start">→ 1 instruction per element</text>
  <text x="40" y="268.9474" font-family="sans-serif" font-size="22.0741" fill="var(--text)" text-anchor="start" font-weight="bold">SIMD operation (four elements at a time with SSE/NEON):</text>
  <rect x="40" y="294.3859" width="86.7052" height="76.3158" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="64.2774" y="347.8071" font-family="sans-serif" font-size="20.376" fill="var(--text)" text-anchor="start">a0</text>
  <rect x="133.6415" y="294.3859" width="86.7052" height="76.3158" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="157.919" y="347.8071" font-family="sans-serif" font-size="20.376" fill="var(--text)" text-anchor="start">a1</text>
  <rect x="227.2832" y="294.3859" width="86.7052" height="76.3158" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="251.5606" y="347.8071" font-family="sans-serif" font-size="20.376" fill="var(--text)" text-anchor="start">a2</text>
  <rect x="320.9248" y="294.3859" width="86.7052" height="76.3158" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="345.2023" y="347.8071" font-family="sans-serif" font-size="20.376" fill="var(--text)" text-anchor="start">a3</text>
  <rect x="456.1849" y="294.3859" width="86.7052" height="76.3158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="480.4624" y="347.8071" font-family="sans-serif" font-size="20.376" fill="var(--text)" text-anchor="start">b0</text>
  <rect x="549.8266" y="294.3859" width="86.7052" height="76.3158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="574.1041" y="347.8071" font-family="sans-serif" font-size="20.376" fill="var(--text)" text-anchor="start">b1</text>
  <rect x="643.4682" y="294.3859" width="86.7052" height="76.3158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="667.7456" y="347.8071" font-family="sans-serif" font-size="20.376" fill="var(--text)" text-anchor="start">b2</text>
  <rect x="737.1099" y="294.3859" width="86.7052" height="76.3158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="761.3874" y="347.8071" font-family="sans-serif" font-size="20.376" fill="var(--text)" text-anchor="start">b3</text>
  <rect x="872.37" y="294.3859" width="86.7052" height="76.3158" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="896.6474" y="347.8071" font-family="sans-serif" font-size="20.376" fill="var(--text)" text-anchor="start">c0</text>
  <rect x="966.0116" y="294.3859" width="86.7052" height="76.3158" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="990.2891" y="347.8071" font-family="sans-serif" font-size="20.376" fill="var(--text)" text-anchor="start">c1</text>
  <rect x="1059.6533" y="294.3859" width="86.7052" height="76.3158" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1083.9307" y="347.8071" font-family="sans-serif" font-size="20.376" fill="var(--text)" text-anchor="start">c2</text>
  <rect x="1153.2948" y="294.3859" width="86.7052" height="76.3158" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="1177.5723" y="347.8071" font-family="sans-serif" font-size="20.376" fill="var(--text)" text-anchor="start">c3</text>
  <text x="407.63" y="347.8071" font-family="sans-serif" font-size="27.168" fill="var(--text)" text-anchor="start" font-weight="bold">+</text>
  <text x="823.8151" y="347.8071" font-family="sans-serif" font-size="27.168" fill="var(--text)" text-anchor="start" font-weight="bold">=</text>
  <text x="40" y="434.2982" font-family="sans-serif" font-size="20.376" fill="var(--ok-accent)" text-anchor="start">→ 1 instruction for 4 elements  (4× throughput)</text>
  <text x="40" y="497.8947" font-family="sans-serif" font-size="18.6781" fill="var(--text)" text-anchor="start" font-weight="bold">SSE:</text>
  <text x="161.3873" y="497.8947" font-family="sans-serif" font-size="18.6781" fill="var(--text)" text-anchor="start">128-bit  (4× f32, 2× f64, 16× u8)</text>
  <text x="40" y="538.5965" font-family="sans-serif" font-size="18.6781" fill="var(--text)" text-anchor="start" font-weight="bold">AVX2:</text>
  <text x="161.3873" y="538.5965" font-family="sans-serif" font-size="18.6781" fill="var(--text)" text-anchor="start">256-bit  (8× f32, 4× f64, 32× u8)</text>
  <text x="40" y="579.2983" font-family="sans-serif" font-size="18.6781" fill="var(--text)" text-anchor="start" font-weight="bold">AVX-512:</text>
  <text x="161.3873" y="579.2983" font-family="sans-serif" font-size="18.6781" fill="var(--text)" text-anchor="start">512-bit (16× f32, 8× f64, 64× u8)</text>
  <text x="40" y="620" font-family="sans-serif" font-size="18.6781" fill="var(--text)" text-anchor="start" font-weight="bold">NEON:</text>
  <text x="161.3873" y="620" font-family="sans-serif" font-size="18.6781" fill="var(--text)" text-anchor="start">128-bit  (ARM)</text>
</svg>
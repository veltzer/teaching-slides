  <ns0:text x="33.734" y="598.7097" font-family="sans-serif" font-size="18.5537" fill="#222" text-anchor="start" font-weight="bold">AVX-512:</ns0:text>
  <ns0:text x="151.8027" y="598.7097" font-family="sans-serif" font-size="18.5537" fill="#333" text-anchor="start">512-bit (16× f32, 8× f64, 64× u8)</ns0:text>
  <ns0:text x="33.734" y="640" font-family="sans-serif" font-size="18.5537" fill="#222" text-anchor="start" font-weight="bold">NEON:</ns0:text>
  <ns0:text x="151.8027" y="640" font-family="sans-serif" font-size="18.5537" fill="#333" text-anchor="start">128-bit  (ARM)</ns0:text>

  <ns0:text x="151.8027" y="516.129" font-family="sans-serif" font-size="18.5537" fill="#333" text-anchor="start">128-bit  (4× f32, 2× f64, 16× u8)</ns0:text>
  <ns0:text x="33.734" y="557.4194" font-family="sans-serif" font-size="18.5537" fill="#222" text-anchor="start" font-weight="bold">AVX2:</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="58.1819" y="70.5263" font-size="22.8063" fill="var(--ok-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Performance Optimization Cheatsheet</text>
  <rect x="50.9091" y="88.8421" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="110.2105" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Zero-cost abstractions</text>
  <text x="440.0001" y="110.2105" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Iterators, generics, Option&lt;&amp;T&gt;</text>
  <rect x="50.9091" y="120.8947" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="142.2631" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">LLVM passes</text>
  <text x="440.0001" y="142.2631" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Inlining, vectorization, DCE</text>
  <rect x="50.9091" y="152.9474" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="174.3157" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">opt-level = 3</text>
  <text x="440.0001" y="174.3157" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Maximum runtime optimization</text>
  <rect x="50.9091" y="185" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="206.3684" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">perf + flamegraph</text>
  <text x="440.0001" y="206.3684" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Find bottlenecks before optimizing</text>
  <rect x="50.9091" y="217.0526" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="238.421" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">criterion</text>
  <text x="440.0001" y="238.421" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Statistical benchmarking</text>
  <rect x="50.9091" y="249.1053" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="270.4736" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">jemalloc / mimalloc</text>
  <text x="440.0001" y="270.4736" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Faster multi-threaded allocation</text>
  <rect x="50.9091" y="281.1579" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="302.5263" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">SIMD</text>
  <text x="440.0001" y="302.5263" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">4–16× throughput for data-parallel work</text>
  <rect x="50.9091" y="313.2105" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="334.5789" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">SoA layout</text>
  <text x="440.0001" y="334.5789" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Cache-friendly field access</text>
  <rect x="50.9091" y="345.2632" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="366.6315" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Arena alloc</text>
  <text x="440.0001" y="366.6315" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Cache-friendly graph/tree traversal</text>
  <rect x="50.9091" y="377.3158" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="398.6842" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">const fn</text>
  <text x="440.0001" y="398.6842" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Move computation to compile time</text>
  <rect x="50.9091" y="409.3684" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="430.7368" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">const generics</text>
  <text x="440.0001" y="430.7368" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Type-safe compile-time parameters</text>
  <rect x="50.9091" y="441.421" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="462.7895" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">LTO</text>
  <text x="440.0001" y="462.7895" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Cross-crate optimization (10–20%)</text>
  <rect x="50.9091" y="473.4736" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="494.8421" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">PGO</text>
  <text x="440.0001" y="494.8421" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Workload-guided optimization</text>
  <rect x="50.9091" y="505.5263" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="526.8947" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">#[inline]</text>
  <text x="440.0001" y="526.8947" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Cross-crate inlining hint</text>
  <rect x="50.9091" y="537.5789" width="1178.1819" height="32.0526" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="558.9474" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">codegen-units = 1</text>
  <text x="440.0001" y="558.9474" font-size="17.9192" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Better optimization, slower compile</text>
  <text x="58.1819" y="597.1052" font-size="19.5482" fill="var(--danger-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Golden rule: MEASURE FIRST. Profile, benchmark, then optimize.</text>
</svg>

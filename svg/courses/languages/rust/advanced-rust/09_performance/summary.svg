  <text x="436.296361368308" y="83.71013726528" font-size="18.979524897548" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Iterators, generics, Option&lt;&amp;T&gt;</text>
  <rect x="40" y="95.478242671706" width="1200" height="35.304316219279" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.355035346739" filter="url(#shadow)"/>
  <text x="54.814961934146" y="119.014453484559" font-size="18.979524897548" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">LLVM passes</text>
  <text x="436.296361368308" y="119.014453484559" font-size="18.979524897548" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Inlining, vectorization, DCE</text>
  <rect x="40" y="130.782669035922" width="1200" height="35.304316219279" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.355035346739" filter="url(#shadow)"/>
  <text x="54.814961934146" y="154.318769703837" font-size="18.979524897548" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">opt-level = 3</text>
  <text x="436.296361368308" y="154.318769703837" font-size="18.979524897548" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Maximum runtime optimization</text>

  <text x="436.296361368308" y="224.927512287332" font-size="18.979524897548" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Statistical benchmarking</text>
  <rect x="40" y="236.695727838696" width="1200" height="35.304316219279" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.355035346739" filter="url(#shadow)"/>
  <text x="54.814961934146" y="260.231828506611" font-size="18.979524897548" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">jemalloc / mimalloc</text>
  <text x="436.296361368308" y="260.231828506611" font-size="18.979524897548" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Faster multi-threaded allocation</text>

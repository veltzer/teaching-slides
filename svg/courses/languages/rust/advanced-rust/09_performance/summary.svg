<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 10.8 L 15.0588 5.4 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="58.1819" y="70.5263" font-family="sans-serif" font-size="22.8063" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">Performance Optimization Cheatsheet</text>
  <rect x="50.9091" y="88.8421" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="110.2105" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">Zero-cost abstractions</text>
  <text x="440.0001" y="110.2105" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Iterators, generics, Option&lt;&amp;T&gt;</text>
  <rect x="50.9091" y="120.8947" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="142.2631" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">LLVM passes</text>
  <text x="440.0001" y="142.2631" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Inlining, vectorization, DCE</text>
  <rect x="50.9091" y="152.9474" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="174.3157" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">opt-level = 3</text>
  <text x="440.0001" y="174.3157" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Maximum runtime optimization</text>
  <rect x="50.9091" y="185" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="206.3684" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">perf + flamegraph</text>
  <text x="440.0001" y="206.3684" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Find bottlenecks before optimizing</text>
  <rect x="50.9091" y="217.0526" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="238.421" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">criterion</text>
  <text x="440.0001" y="238.421" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Statistical benchmarking</text>
  <rect x="50.9091" y="249.1053" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="270.4736" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">jemalloc / mimalloc</text>
  <text x="440.0001" y="270.4736" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Faster multi-threaded allocation</text>
  <rect x="50.9091" y="281.1579" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="302.5263" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">SIMD</text>
  <text x="440.0001" y="302.5263" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">4–16× throughput for data-parallel work</text>
  <rect x="50.9091" y="313.2105" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="334.5789" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">SoA layout</text>
  <text x="440.0001" y="334.5789" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Cache-friendly field access</text>
  <rect x="50.9091" y="345.2632" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="366.6315" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">Arena alloc</text>
  <text x="440.0001" y="366.6315" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Cache-friendly graph/tree traversal</text>
  <rect x="50.9091" y="377.3158" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="398.6842" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">const fn</text>
  <text x="440.0001" y="398.6842" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Move computation to compile time</text>
  <rect x="50.9091" y="409.3684" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="430.7368" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">const generics</text>
  <text x="440.0001" y="430.7368" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Type-safe compile-time parameters</text>
  <rect x="50.9091" y="441.421" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="462.7895" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">LTO</text>
  <text x="440.0001" y="462.7895" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Cross-crate optimization (10–20%)</text>
  <rect x="50.9091" y="473.4736" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="494.8421" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">PGO</text>
  <text x="440.0001" y="494.8421" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Workload-guided optimization</text>
  <rect x="50.9091" y="505.5263" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="526.8947" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">#[inline]</text>
  <text x="440.0001" y="526.8947" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Cross-crate inlining hint</text>
  <rect x="50.9091" y="537.5789" width="1178.1819" height="32.0526" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="65.4547" y="558.9474" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start" font-weight="bold">codegen-units = 1</text>
  <text x="440.0001" y="558.9474" font-family="sans-serif" font-size="17.9192" fill="var(--text)" text-anchor="start">Better optimization, slower compile</text>
  <text x="58.1819" y="597.1052" font-family="sans-serif" font-size="19.5482" fill="var(--danger-accent)" text-anchor="start" font-weight="bold">Golden rule: MEASURE FIRST. Profile, benchmark, then optimize.</text>
</svg>
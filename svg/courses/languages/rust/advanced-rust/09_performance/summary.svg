  <ns0:text x="394.7042" y="574.359" font-family="sans-serif" font-size="18.0513" fill="#333" text-anchor="start">Better optimization, slower compile</ns0:text>
  <ns0:text x="34.3221" y="615.3846" font-family="sans-serif" font-size="19.6923" fill="#b71c1c" text-anchor="start" font-weight="bold">Golden rule: MEASURE FIRST. Profile, benchmark, then optimize.</ns0:text>

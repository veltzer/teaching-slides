<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="94.4187" fill="var(--primary-accent)" stroke="var(--text)" stroke-width="2.4783" rx="6"/>
  <text x="50.5882" y="100.6978" font-size="20.0652" fill="var(--bg)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Allocator</text>
  <text x="324.1176" y="100.6978" font-size="20.0652" fill="var(--bg)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Throughput</text>
  <text x="535.8824" y="100.6978" font-size="20.0652" fill="var(--bg)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Fragmentation</text>
  <text x="765.2942" y="100.6978" font-size="20.0652" fill="var(--bg)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Best For</text>
  <line x1="313.5294" y1="40" x2="313.5294" y2="620" stroke="var(--text-faint)" stroke-width="1.6522"/>
  <line x1="525.2941" y1="40" x2="525.2941" y2="620" stroke="var(--text-faint)" stroke-width="1.6522"/>
  <line x1="754.7059" y1="40" x2="754.7059" y2="620" stroke="var(--text-faint)" stroke-width="1.6522"/>
  <line x1="975.2942" y1="40" x2="975.2942" y2="620" stroke="var(--text-faint)" stroke-width="1.6522"/>
  <rect x="40" y="134.4187" width="1200" height="121.3953" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="50.5882" y="188.3722" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">System (glibc)</text>
  <text x="324.1176" y="188.3722" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Baseline</text>
  <text x="535.8824" y="188.3722" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Moderate</text>
  <text x="765.2942" y="188.3722" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Default</text>
  <rect x="40" y="255.814" width="1200" height="121.3953" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="50.5882" y="309.7675" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">jemalloc</text>
  <text x="324.1176" y="309.7675" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">1.2–2×</text>
  <text x="535.8824" y="309.7675" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Low</text>
  <text x="765.2942" y="309.7675" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Servers</text>
  <text x="765.2942" y="363.7209" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">multi-thread</text>
  <rect x="40" y="377.2093" width="1200" height="121.3953" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="50.5882" y="431.1629" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">mimalloc</text>
  <text x="324.1176" y="431.1629" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">1.5–2×</text>
  <text x="535.8824" y="431.1629" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Low</text>
  <text x="765.2942" y="431.1629" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">General use</text>
  <rect x="40" y="498.6047" width="1200" height="121.3953" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="50.5882" y="552.5582" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Custom arena</text>
  <text x="324.1176" y="552.5582" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Varies</text>
  <text x="535.8824" y="552.5582" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">None (reset)</text>
  <text x="765.2942" y="552.5582" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Game loops</text>
  <text x="765.2942" y="606.5117" font-size="18.3931" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">batch work</text>
</svg>

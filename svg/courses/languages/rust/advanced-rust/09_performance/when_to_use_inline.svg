<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 9.3913 L 15.0588 4.6957 z" fill="#555" />
    </marker>
  </defs>
  <rect x="17.1038" y="14.2222" width="1128.8539" height="625.7778" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="34.2077" y="42.6666" font-family="sans-serif" font-size="19.9111" fill="var(--info-accent)" text-anchor="start" font-weight="bold">#[inline] Guidelines</text>
  <rect x="27.3661" y="68.2666" width="1108.3293" height="119.4667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="41.0493" y="93.8666" font-family="sans-serif" font-size="17.0667" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">#[inline] — USE FOR:</text>
  <text x="41.0493" y="110.9334" font-family="sans-serif" font-size="15.6445" fill="var(--text)" text-anchor="start">• Small functions in library crates (enables cross-crate inlining without LTO)</text>
  <text x="41.0493" y="136.5333" font-family="sans-serif" font-size="15.6445" fill="var(--text)" text-anchor="start">• Wrapper / delegation functions</text>
  <text x="41.0493" y="162.1333" font-family="sans-serif" font-size="15.6445" fill="var(--text)" text-anchor="start">• Hot-path functions identified by profiling</text>
  <rect x="27.3661" y="196.2666" width="1108.3293" height="119.4667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="41.0493" y="221.8666" font-family="sans-serif" font-size="17.0667" fill="var(--warn-accent)" text-anchor="start" font-weight="bold">#[inline(always)] — USE FOR:</text>
  <text x="41.0493" y="238.9333" font-family="sans-serif" font-size="15.6445" fill="var(--text)" text-anchor="start">• Very small functions (1–3 lines) that MUST be fast</text>
  <text x="41.0493" y="264.5333" font-family="sans-serif" font-size="15.6445" fill="var(--text)" text-anchor="start">• Functions in performance-critical inner loops</text>
  <text x="41.0493" y="290.1333" font-family="sans-serif" font-size="15.6445" fill="var(--text)" text-anchor="start">• Only when benchmarks prove it helps</text>
  <rect x="27.3661" y="324.2667" width="1108.3293" height="119.4667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="41.0493" y="349.8666" font-family="sans-serif" font-size="17.0667" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">#[inline(never)] — USE FOR:</text>
  <text x="41.0493" y="366.9333" font-family="sans-serif" font-size="15.6445" fill="var(--text)" text-anchor="start">• Error handling paths (keeps hot path small)</text>
  <text x="41.0493" y="392.5333" font-family="sans-serif" font-size="15.6445" fill="var(--text)" text-anchor="start">• Functions you want to see in profiler output</text>
  <text x="41.0493" y="418.1333" font-family="sans-serif" font-size="15.6445" fill="var(--text)" text-anchor="start">• Large functions called from many places (reduce code bloat)</text>
  <rect x="27.3661" y="452.2666" width="1108.3293" height="93.8666" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="41.0493" y="477.8666" font-family="sans-serif" font-size="17.0667" fill="var(--danger-accent)" text-anchor="start" font-weight="bold">DO NOT USE when:</text>
  <text x="41.0493" y="494.9333" font-family="sans-serif" font-size="15.6445" fill="var(--text)" text-anchor="start">• On every function 'just in case' (hurts compile time, may increase binary size)</text>
  <text x="41.0493" y="520.5333" font-family="sans-serif" font-size="15.6445" fill="var(--text)" text-anchor="start">• Without profiling data to justify it</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="47.407481595794" y="40" font-size="22.237179511164" fill="var(--info-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">#[inline] Guidelines</text>
  <rect x="40" y="69.491569663905" width="1200" height="137.627200804395" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.750881767018" filter="url(#shadow)"/>
  <text x="54.814963191589" y="98.983015033981" font-size="19.060552095694" fill="var(--ok-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">#[inline] — USE FOR:</text>
  <text x="54.814963191589" y="118.644185770414" font-size="17.472182130611" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Small library functions (cross-crate inlining)</text>
  <text x="54.814963191589" y="148.13563114049" font-size="17.472182130611" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Wrapper / delegation</text>
  <text x="54.814963191589" y="177.627200804395" font-size="17.472182130611" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Hot-path functions (profiled)</text>
  <rect x="40" y="216.949169395773" width="1200" height="137.627200804395" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.750881767018" filter="url(#shadow)"/>
  <text x="54.814963191589" y="246.440739059679" font-size="19.060552095694" fill="var(--warn-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">#[inline(always)] — USE FOR:</text>
  <text x="54.814963191589" y="266.101785502282" font-size="17.472182130611" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Tiny functions (1–3 lines) that must be fast</text>
  <text x="54.814963191589" y="295.593355166187" font-size="17.472182130611" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Inner-loop hot paths</text>
  <text x="54.814963191589" y="325.084924830092" font-size="17.472182130611" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Only if benchmarks prove it</text>
  <rect x="40" y="364.407017715299" width="1200" height="137.627200804395" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.750881767018" filter="url(#shadow)"/>
  <text x="54.814963191589" y="393.898463085376" font-size="19.060552095694" fill="var(--primary-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">#[inline(never)] — USE FOR:</text>
  <text x="54.814963191589" y="413.559509527979" font-size="17.472182130611" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Error paths (keep hot path small)</text>
  <text x="54.814963191589" y="443.050954898055" font-size="17.472182130611" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Functions you want in profiler output</text>
  <text x="54.814963191589" y="472.542524561961" font-size="17.472182130611" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Large functions called many times (code bloat)</text>
  <rect x="40" y="511.864493153339" width="1200" height="108.135506846661" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.750881767018" filter="url(#shadow)"/>
  <text x="54.814963191589" y="541.356062817244" font-size="19.060552095694" fill="var(--danger-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">DO NOT USE when:</text>
  <text x="54.814963191589" y="561.017109259847" font-size="17.472182130611" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• On every function (hurts compile time, bloats binary)</text>
  <text x="54.814963191589" y="590.508678923753" font-size="17.472182130611" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Without profiling data</text>
</svg>

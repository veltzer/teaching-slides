<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="15.0588" markerHeight="12.5217" refX="11.2941" refY="4.6957" orient="auto">
      <ns0:path d="M 0 0 L 0 9.3913 L 15.0588 4.6957 z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="17.1038" y="14.2222" width="1128.8539" height="625.7778" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="5.6889" />
  <ns0:text x="34.2077" y="42.6666" font-family="sans-serif" font-size="19.9111" fill="#4a148c" text-anchor="start" font-weight="bold">#[inline] Guidelines</ns0:text>
  <ns0:rect x="27.3661" y="68.2666" width="1108.3293" height="119.4667" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="5.6889" />
  <ns0:text x="41.0493" y="93.8666" font-family="sans-serif" font-size="17.0667" fill="#1b5e20" text-anchor="start" font-weight="bold">#[inline] — USE FOR:</ns0:text>
  <ns0:text x="41.0493" y="110.9334" font-family="sans-serif" font-size="15.6445" fill="#333" text-anchor="start">• Small functions in library crates (enables cross-crate inlining without LTO)</ns0:text>
  <ns0:text x="41.0493" y="136.5333" font-family="sans-serif" font-size="15.6445" fill="#333" text-anchor="start">• Wrapper / delegation functions</ns0:text>
  <ns0:text x="41.0493" y="162.1333" font-family="sans-serif" font-size="15.6445" fill="#333" text-anchor="start">• Hot-path functions identified by profiling</ns0:text>
  <ns0:rect x="27.3661" y="196.2666" width="1108.3293" height="119.4667" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="5.6889" />
  <ns0:text x="41.0493" y="221.8666" font-family="sans-serif" font-size="17.0667" fill="#e65100" text-anchor="start" font-weight="bold">#[inline(always)] — USE FOR:</ns0:text>
  <ns0:text x="41.0493" y="238.9333" font-family="sans-serif" font-size="15.6445" fill="#333" text-anchor="start">• Very small functions (1–3 lines) that MUST be fast</ns0:text>
  <ns0:text x="41.0493" y="264.5333" font-family="sans-serif" font-size="15.6445" fill="#333" text-anchor="start">• Functions in performance-critical inner loops</ns0:text>
  <ns0:text x="41.0493" y="290.1333" font-family="sans-serif" font-size="15.6445" fill="#333" text-anchor="start">• Only when benchmarks prove it helps</ns0:text>
  <ns0:rect x="27.3661" y="324.2667" width="1108.3293" height="119.4667" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="5.6889" />
  <ns0:text x="41.0493" y="349.8666" font-family="sans-serif" font-size="17.0667" fill="#1565c0" text-anchor="start" font-weight="bold">#[inline(never)] — USE FOR:</ns0:text>
  <ns0:text x="41.0493" y="366.9333" font-family="sans-serif" font-size="15.6445" fill="#333" text-anchor="start">• Error handling paths (keeps hot path small)</ns0:text>
  <ns0:text x="41.0493" y="392.5333" font-family="sans-serif" font-size="15.6445" fill="#333" text-anchor="start">• Functions you want to see in profiler output</ns0:text>
  <ns0:text x="41.0493" y="418.1333" font-family="sans-serif" font-size="15.6445" fill="#333" text-anchor="start">• Large functions called from many places (reduce code bloat)</ns0:text>
  <ns0:rect x="27.3661" y="452.2666" width="1108.3293" height="93.8666" fill="#fce4ec" stroke="#333" stroke-width="2.1333" rx="5.6889" />
  <ns0:text x="41.0493" y="477.8666" font-family="sans-serif" font-size="17.0667" fill="#b71c1c" text-anchor="start" font-weight="bold">DO NOT USE when:</ns0:text>
  <ns0:text x="41.0493" y="494.9333" font-family="sans-serif" font-size="15.6445" fill="#333" text-anchor="start">• On every function 'just in case' (hurts compile time, may increase binary size)</ns0:text>
  <ns0:text x="41.0493" y="520.5333" font-family="sans-serif" font-size="15.6445" fill="#333" text-anchor="start">• Without profiling data to justify it</ns0:text>
</ns0:svg>
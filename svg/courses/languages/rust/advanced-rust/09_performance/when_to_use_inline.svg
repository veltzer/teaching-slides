<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 9.3913 L 15.0588 4.6957 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="58.1819" y="66.3636" font-family="sans-serif" font-size="19.7638" fill="var(--info-accent)" text-anchor="start" font-weight="bold">#[inline] Guidelines</text>
  <rect x="50.9091" y="90.0909" width="1178.1818" height="110.7273" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="113.8181" font-family="sans-serif" font-size="16.9405" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">#[inline] — USE FOR:</text>
  <text x="65.4547" y="129.6364" font-family="sans-serif" font-size="15.5288" fill="var(--text)" text-anchor="start">• Small functions in library crates (enables cross-crate inlining without LTO)</text>
  <text x="65.4547" y="153.3636" font-family="sans-serif" font-size="15.5288" fill="var(--text)" text-anchor="start">• Wrapper / delegation functions</text>
  <text x="65.4547" y="177.0909" font-family="sans-serif" font-size="15.5288" fill="var(--text)" text-anchor="start">• Hot-path functions identified by profiling</text>
  <rect x="50.9091" y="208.7272" width="1178.1818" height="110.7273" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="232.4545" font-family="sans-serif" font-size="16.9405" fill="var(--warn-accent)" text-anchor="start" font-weight="bold">#[inline(always)] — USE FOR:</text>
  <text x="65.4547" y="248.2727" font-family="sans-serif" font-size="15.5288" fill="var(--text)" text-anchor="start">• Very small functions (1–3 lines) that MUST be fast</text>
  <text x="65.4547" y="272" font-family="sans-serif" font-size="15.5288" fill="var(--text)" text-anchor="start">• Functions in performance-critical inner loops</text>
  <text x="65.4547" y="295.7273" font-family="sans-serif" font-size="15.5288" fill="var(--text)" text-anchor="start">• Only when benchmarks prove it helps</text>
  <rect x="50.9091" y="327.3637" width="1178.1818" height="110.7273" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="351.0909" font-family="sans-serif" font-size="16.9405" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">#[inline(never)] — USE FOR:</text>
  <text x="65.4547" y="366.9091" font-family="sans-serif" font-size="15.5288" fill="var(--text)" text-anchor="start">• Error handling paths (keeps hot path small)</text>
  <text x="65.4547" y="390.6363" font-family="sans-serif" font-size="15.5288" fill="var(--text)" text-anchor="start">• Functions you want to see in profiler output</text>
  <text x="65.4547" y="414.3636" font-family="sans-serif" font-size="15.5288" fill="var(--text)" text-anchor="start">• Large functions called from many places (reduce code bloat)</text>
  <rect x="50.9091" y="445.9999" width="1178.1818" height="86.9999" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="469.7272" font-family="sans-serif" font-size="16.9405" fill="var(--danger-accent)" text-anchor="start" font-weight="bold">DO NOT USE when:</text>
  <text x="65.4547" y="485.5454" font-family="sans-serif" font-size="15.5288" fill="var(--text)" text-anchor="start">• On every function 'just in case' (hurts compile time, may increase binary size)</text>
  <text x="65.4547" y="509.2727" font-family="sans-serif" font-size="15.5288" fill="var(--text)" text-anchor="start">• Without profiling data to justify it</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="58.1819" y="66.3636" font-size="19.7638" fill="var(--info-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">#[inline] Guidelines</text>
  <rect x="50.9091" y="90.0909" width="1178.1818" height="110.7273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="113.8181" font-size="16.9405" fill="var(--ok-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">#[inline] — USE FOR:</text>
  <text x="65.4547" y="129.6364" font-size="15.5288" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Small library functions (cross-crate inlining)</text>
  <text x="65.4547" y="153.3636" font-size="15.5288" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Wrapper / delegation</text>
  <text x="65.4547" y="177.0909" font-size="15.5288" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Hot-path functions (profiled)</text>
  <rect x="50.9091" y="208.7272" width="1178.1818" height="110.7273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="232.4545" font-size="16.9405" fill="var(--warn-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">#[inline(always)] — USE FOR:</text>
  <text x="65.4547" y="248.2727" font-size="15.5288" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Tiny functions (1–3 lines) that must be fast</text>
  <text x="65.4547" y="272" font-size="15.5288" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Inner-loop hot paths</text>
  <text x="65.4547" y="295.7273" font-size="15.5288" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Only if benchmarks prove it</text>
  <rect x="50.9091" y="327.3637" width="1178.1818" height="110.7273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="351.0909" font-size="16.9405" fill="var(--primary-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">#[inline(never)] — USE FOR:</text>
  <text x="65.4547" y="366.9091" font-size="15.5288" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Error paths (keep hot path small)</text>
  <text x="65.4547" y="390.6363" font-size="15.5288" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Functions you want in profiler output</text>
  <text x="65.4547" y="414.3636" font-size="15.5288" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Large functions called many times (code bloat)</text>
  <rect x="50.9091" y="445.9999" width="1178.1818" height="86.9999" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="65.4547" y="469.7272" font-size="16.9405" fill="var(--danger-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">DO NOT USE when:</text>
  <text x="65.4547" y="485.5454" font-size="15.5288" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• On every function (hurts compile time, bloats binary)</text>
  <text x="65.4547" y="509.2727" font-size="15.5288" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Without profiling data</text>
</svg>

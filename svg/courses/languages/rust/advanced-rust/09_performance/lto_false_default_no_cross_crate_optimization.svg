<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 13.9355 L 15.0588 6.9677 z" fill="#555" />
    </marker>
  </defs>
  <text x="33.6814" y="54.026" font-family="sans-serif" font-size="21.8929" fill="var(--text)" text-anchor="start" font-weight="bold">Without LTO</text>
  <rect x="33.6814" y="70.6493" width="269.4509" height="103.8961" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="168.4068" y="112.2078" font-family="sans-serif" font-size="20.2088" fill="var(--text)" text-anchor="middle" font-weight="bold">Crate A</text>
  <text x="168.4068" y="149.6104" font-family="sans-serif" font-size="18.5248" fill="var(--text-muted)" text-anchor="middle">optimize alone</text>
  <line x1="168.4068" y1="174.5455" x2="168.4068" y2="218.1819" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="353.6542" y="70.6493" width="269.4509" height="103.8961" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="488.3797" y="112.2078" font-family="sans-serif" font-size="20.2088" fill="var(--text)" text-anchor="middle" font-weight="bold">Crate B</text>
  <text x="488.3797" y="149.6104" font-family="sans-serif" font-size="18.5248" fill="var(--text-muted)" text-anchor="middle">optimize alone</text>
  <line x1="488.3797" y1="174.5455" x2="488.3797" y2="218.1819" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="673.6271" y="70.6493" width="269.4509" height="103.8961" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="808.3525" y="112.2078" font-family="sans-serif" font-size="20.2088" fill="var(--text)" text-anchor="middle" font-weight="bold">Crate C</text>
  <text x="808.3525" y="149.6104" font-family="sans-serif" font-size="18.5248" fill="var(--text-muted)" text-anchor="middle">optimize alone</text>
  <line x1="808.3525" y1="174.5455" x2="808.3525" y2="218.1819" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="168.4068" y1="220.2597" x2="976.7592" y2="220.2597" stroke="var(--text-muted)" stroke-width="1.6841" />
  <line x1="572.583" y1="220.2597" x2="572.583" y2="245.1948" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="581.0034" y="236.8831" font-family="sans-serif" font-size="16.8407" fill="var(--text-muted)" text-anchor="start">link</text>
  <rect x="446.2779" y="253.5065" width="252.6101" height="62.3376" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="572.583" y="295.065" font-family="sans-serif" font-size="20.2088" fill="var(--text)" text-anchor="middle" font-weight="bold">Binary</text>
  <text x="572.583" y="328.3117" font-family="sans-serif" font-size="18.5248" fill="var(--text-muted)" text-anchor="middle">Cross-crate calls NOT inlined</text>
  <text x="33.6814" y="365.7143" font-family="sans-serif" font-size="21.8929" fill="var(--text)" text-anchor="start" font-weight="bold">With LTO</text>
  <rect x="33.6814" y="382.3376" width="269.4509" height="103.8961" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="168.4068" y="423.8962" font-family="sans-serif" font-size="20.2088" fill="var(--text)" text-anchor="middle" font-weight="bold">Crate A</text>
  <text x="168.4068" y="461.2987" font-family="sans-serif" font-size="18.5248" fill="var(--text-muted)" text-anchor="middle">(IR)</text>
  <line x1="168.4068" y1="486.2338" x2="168.4068" y2="529.8702" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="353.6542" y="382.3376" width="269.4509" height="103.8961" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="488.3797" y="423.8962" font-family="sans-serif" font-size="20.2088" fill="var(--text)" text-anchor="middle" font-weight="bold">Crate B</text>
  <text x="488.3797" y="461.2987" font-family="sans-serif" font-size="18.5248" fill="var(--text-muted)" text-anchor="middle">(IR)</text>
  <line x1="488.3797" y1="486.2338" x2="488.3797" y2="529.8702" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="673.6271" y="382.3376" width="269.4509" height="103.8961" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="808.3525" y="423.8962" font-family="sans-serif" font-size="20.2088" fill="var(--text)" text-anchor="middle" font-weight="bold">Crate C</text>
  <text x="808.3525" y="461.2987" font-family="sans-serif" font-size="18.5248" fill="var(--text-muted)" text-anchor="middle">(IR)</text>
  <line x1="808.3525" y1="486.2338" x2="808.3525" y2="529.8702" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="168.4068" y1="531.948" x2="976.7592" y2="531.948" stroke="var(--text-muted)" stroke-width="1.6841" />
  <line x1="572.583" y1="531.948" x2="572.583" y2="556.8831" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="581.0034" y="548.5715" font-family="sans-serif" font-size="16.8407" fill="var(--text-muted)" text-anchor="start">merge + optimize</text>
  <rect x="446.2779" y="565.1948" width="252.6101" height="62.3376" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="572.583" y="606.7532" font-family="sans-serif" font-size="20.2088" fill="var(--text)" text-anchor="middle" font-weight="bold">Binary</text>
  <text x="572.583" y="640" font-family="sans-serif" font-size="18.5248" fill="var(--text-muted)" text-anchor="middle">Full cross-crate optimization</text>
</svg>
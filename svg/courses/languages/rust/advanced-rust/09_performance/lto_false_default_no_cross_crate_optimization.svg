<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 13.9355 L 15.0588 6.9677 z" fill="#555" />
    </marker>
  </defs>
  <text x="40" y="40" font-family="sans-serif" font-size="24.5694" fill="var(--text)" text-anchor="start" font-weight="bold">Without LTO</text>
  <rect x="40" y="56.4538" width="342.8573" height="102.8369" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="211.4286" y="97.5886" font-family="sans-serif" font-size="22.6794" fill="var(--text)" text-anchor="middle" font-weight="bold">Crate A</text>
  <text x="211.4286" y="134.6099" font-family="sans-serif" font-size="20.7896" fill="var(--text-muted)" text-anchor="middle">optimize alone</text>
  <line x1="211.4286" y1="159.2908" x2="211.4286" y2="202.4823" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="447.1428" y="56.4538" width="342.8573" height="102.8369" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="618.5715" y="97.5886" font-family="sans-serif" font-size="22.6794" fill="var(--text)" text-anchor="middle" font-weight="bold">Crate B</text>
  <text x="618.5715" y="134.6099" font-family="sans-serif" font-size="20.7896" fill="var(--text-muted)" text-anchor="middle">optimize alone</text>
  <line x1="618.5715" y1="159.2908" x2="618.5715" y2="202.4823" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="854.2858" y="56.4538" width="342.8573" height="102.8369" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1025.7143" y="97.5886" font-family="sans-serif" font-size="22.6794" fill="var(--text)" text-anchor="middle" font-weight="bold">Crate C</text>
  <text x="1025.7143" y="134.6099" font-family="sans-serif" font-size="20.7896" fill="var(--text-muted)" text-anchor="middle">optimize alone</text>
  <line x1="1025.7143" y1="159.2908" x2="1025.7143" y2="202.4823" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="211.4286" y1="204.5389" x2="1240" y2="204.5389" stroke="var(--text-muted)" stroke-width="1.6841" />
  <line x1="725.7143" y1="204.5389" x2="725.7143" y2="229.2198" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="736.4287" y="220.9929" font-family="sans-serif" font-size="18.8996" fill="var(--text-muted)" text-anchor="start">link</text>
  <rect x="565" y="237.4468" width="321.4285" height="61.7021" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="725.7143" y="278.5816" font-family="sans-serif" font-size="22.6794" fill="var(--text)" text-anchor="middle" font-weight="bold">Binary</text>
  <text x="725.7143" y="311.4894" font-family="sans-serif" font-size="20.7896" fill="var(--text-muted)" text-anchor="middle">Cross-crate calls NOT inlined</text>
  <text x="40" y="348.5106" font-family="sans-serif" font-size="24.5694" fill="var(--text)" text-anchor="start" font-weight="bold">With LTO</text>
  <rect x="40" y="364.9645" width="342.8573" height="102.8369" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="211.4286" y="406.0994" font-family="sans-serif" font-size="22.6794" fill="var(--text)" text-anchor="middle" font-weight="bold">Crate A</text>
  <text x="211.4286" y="443.1206" font-family="sans-serif" font-size="20.7896" fill="var(--text-muted)" text-anchor="middle">(IR)</text>
  <line x1="211.4286" y1="467.8014" x2="211.4286" y2="510.993" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="447.1428" y="364.9645" width="342.8573" height="102.8369" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="618.5715" y="406.0994" font-family="sans-serif" font-size="22.6794" fill="var(--text)" text-anchor="middle" font-weight="bold">Crate B</text>
  <text x="618.5715" y="443.1206" font-family="sans-serif" font-size="20.7896" fill="var(--text-muted)" text-anchor="middle">(IR)</text>
  <line x1="618.5715" y1="467.8014" x2="618.5715" y2="510.993" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="854.2858" y="364.9645" width="342.8573" height="102.8369" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="1025.7143" y="406.0994" font-family="sans-serif" font-size="22.6794" fill="var(--text)" text-anchor="middle" font-weight="bold">Crate C</text>
  <text x="1025.7143" y="443.1206" font-family="sans-serif" font-size="20.7896" fill="var(--text-muted)" text-anchor="middle">(IR)</text>
  <line x1="1025.7143" y1="467.8014" x2="1025.7143" y2="510.993" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="211.4286" y1="513.0496" x2="1240" y2="513.0496" stroke="var(--text-muted)" stroke-width="1.6841" />
  <line x1="725.7143" y1="513.0496" x2="725.7143" y2="537.7305" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="736.4287" y="529.5036" font-family="sans-serif" font-size="18.8996" fill="var(--text-muted)" text-anchor="start">merge + optimize</text>
  <rect x="565" y="545.9574" width="321.4285" height="61.7021" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="725.7143" y="587.0922" font-family="sans-serif" font-size="22.6794" fill="var(--text)" text-anchor="middle" font-weight="bold">Binary</text>
  <text x="725.7143" y="620" font-family="sans-serif" font-size="20.7896" fill="var(--text-muted)" text-anchor="middle">Full cross-crate optimization</text>
</svg>
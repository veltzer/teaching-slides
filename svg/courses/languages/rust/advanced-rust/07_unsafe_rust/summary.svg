<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="582.857046530625" height="41.090004083433" rx="8.132799145251" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.428776122422" y="68.446959439842" text-anchor="middle" font-size="23.341133546868" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">5 superpowers</text>
  <text x="691.428691836719" y="68.446959439842" font-size="21.21915070322" fill="var(--text)" font-family="Arial, sans-serif">raw ptrs, unsafe fn, static mut, unsafe traits, union fields</text>
  <rect x="40" y="88.991906985676" width="582.857046530625" height="41.090004083433" rx="8.132799145251" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.428776122422" y="117.438757433754" text-anchor="middle" font-size="23.341133546868" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Raw pointers</text>
  <text x="691.428691836719" y="117.438757433754" font-size="23.341133546868" fill="var(--text)" font-family="Courier New, monospace">*const T, *mut T</text>
  <text x="1240" y="117.438757433754" font-size="21.21915070322" fill="var(--text-muted)" font-family="Arial, sans-serif">(no borrow check)</text>
  <rect x="40" y="137.983595987825" width="582.857046530625" height="41.090004083433" rx="8.132799145251" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.428776122422" y="166.430555427667" text-anchor="middle" font-size="23.341133546868" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cell&lt;T&gt;</text>
  <text x="691.428691836719" y="166.430555427667" font-size="23.341133546868" fill="var(--text)" font-family="Arial, sans-serif">Copy-based interior mutability</text>
  <rect x="40" y="186.975502973502" width="582.857046530625" height="41.090004083433" rx="8.132799145251" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.428776122422" y="215.42235342158" text-anchor="middle" font-size="23.341133546868" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">RefCell&lt;T&gt;</text>
  <text x="691.428691836719" y="215.42235342158" font-size="23.341133546868" fill="var(--text)" font-family="Arial, sans-serif">runtime borrow checking</text>
  <rect x="40" y="235.967300967414" width="582.857046530625" height="41.090004083433" rx="8.132799145251" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.428776122422" y="264.414151415493" text-anchor="middle" font-size="23.341133546868" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">UnsafeCell&lt;T&gt;</text>
  <text x="691.428691836719" y="264.414151415493" font-size="23.341133546868" fill="var(--text)" font-family="Arial, sans-serif">foundation of interior mutability</text>
  <rect x="40" y="284.959098961327" width="582.857046530625" height="41.090004083433" rx="8.132799145251" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.428776122422" y="313.405949409405" text-anchor="middle" font-size="23.341133546868" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">repr(C)</text>
  <text x="691.428691836719" y="313.405949409405" font-size="23.341133546868" fill="var(--text)" font-family="Arial, sans-serif">C-compatible layout</text>
  <rect x="40" y="333.950787963476" width="582.857046530625" height="41.090004083433" rx="8.132799145251" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.428776122422" y="362.397856395083" text-anchor="middle" font-size="23.341133546868" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">repr(packed)</text>
  <text x="691.428691836719" y="362.397856395083" font-size="23.341133546868" fill="var(--text)" font-family="Arial, sans-serif">no padding</text>
  <rect x="40" y="382.942694949152" width="582.857046530625" height="41.090004083433" rx="8.132799145251" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.428776122422" y="411.389654388994" text-anchor="middle" font-size="23.341133546868" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">repr(align(N))</text>
  <text x="691.428691836719" y="411.389654388994" font-size="23.341133546868" fill="var(--text)" font-family="Arial, sans-serif">minimum alignment</text>
  <rect x="40" y="431.934492943065" width="582.857046530625" height="41.090004083433" rx="8.132799145251" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.428776122422" y="460.381343391143" text-anchor="middle" font-size="23.341133546868" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">transmute</text>
  <text x="691.428691836719" y="460.381343391143" font-size="23.341133546868" fill="var(--text)" font-family="Arial, sans-serif">reinterpret bits as another type</text>
  <rect x="40" y="480.926399928742" width="582.857046530625" height="41.090004083433" rx="8.132799145251" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.428776122422" y="509.373141385056" text-anchor="middle" font-size="23.341133546868" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">MaybeUninit</text>
  <text x="691.428691836719" y="509.373141385056" font-size="23.341133546868" fill="var(--text)" font-family="Arial, sans-serif">safe uninitialized memory handling</text>
  <rect x="40" y="529.918088930891" width="582.857046530625" height="41.090004083433" rx="8.132799145251" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.428776122422" y="558.365048370733" text-anchor="middle" font-size="23.341133546868" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">SAFETY comment</text>
  <text x="691.428691836719" y="558.365048370733" font-size="23.341133546868" fill="var(--text)" font-family="Arial, sans-serif">document why unsafe code is sound</text>
  <rect x="40" y="578.909995916567" width="582.857046530625" height="41.090004083433" rx="8.132799145251" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="331.428776122422" y="607.356737372881" text-anchor="middle" font-size="23.341133546868" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Miri</text>
  <text x="691.428691836719" y="607.356737372881" font-size="23.341133546868" fill="var(--text)" font-family="Arial, sans-serif">runtime UB detector</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.0472" font-weight="bold" fill="var(--text)">Unsafe Rust Cheatsheet</text>
  <rect x="40" y="61.75" width="1200" height="558.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="80.6779" y="83.4999" width="345.7627" height="37.7001" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="253.5594" y="109.6" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--danger-accent)">5 superpowers</text>
  <text x="467.1187" y="109.6" font-size="15.6545" fill="var(--text)">raw ptrs, unsafe fn, static mut, unsafe traits, union fields</text>
  <rect x="80.6779" y="128.45" width="345.7627" height="37.7001" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="253.5594" y="154.55" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--primary-accent)">Raw pointers</text>
  <text x="467.1187" y="154.55" font-size="17.22" fill="var(--text)" font-family="monospace">*const T, *mut T</text>
  <text x="792.5424" y="154.55" font-size="15.6545" fill="var(--text-muted)">(no borrow check)</text>
  <rect x="80.6779" y="173.3999" width="345.7627" height="37.7001" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="253.5594" y="199.5" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--ok-accent)">Cell&lt;T&gt;</text>
  <text x="467.1187" y="199.5" font-size="17.22" fill="var(--text)">Copy-based interior mutability</text>
  <rect x="80.6779" y="218.35" width="345.7627" height="37.7001" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="253.5594" y="244.45" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--ok-accent)">RefCell&lt;T&gt;</text>
  <text x="467.1187" y="244.45" font-size="17.22" fill="var(--text)">runtime borrow checking</text>
  <rect x="80.6779" y="263.3" width="345.7627" height="37.7001" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="253.5594" y="289.4" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--ok-accent)">UnsafeCell&lt;T&gt;</text>
  <text x="467.1187" y="289.4" font-size="17.22" fill="var(--text)">foundation of interior mutability</text>
  <rect x="80.6779" y="308.25" width="345.7627" height="37.7001" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="253.5594" y="334.35" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--primary-accent)">repr(C)</text>
  <text x="467.1187" y="334.35" font-size="17.22" fill="var(--text)">C-compatible layout</text>
  <rect x="80.6779" y="353.1999" width="345.7627" height="37.7001" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="253.5594" y="379.3001" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--primary-accent)">repr(packed)</text>
  <text x="467.1187" y="379.3001" font-size="17.22" fill="var(--text)">no padding</text>
  <rect x="80.6779" y="398.15" width="345.7627" height="37.7001" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="253.5594" y="424.2501" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--primary-accent)">repr(align(N))</text>
  <text x="467.1187" y="424.2501" font-size="17.22" fill="var(--text)">minimum alignment</text>
  <rect x="80.6779" y="443.1" width="345.7627" height="37.7001" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="253.5594" y="469.2" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--danger-accent)">transmute</text>
  <text x="467.1187" y="469.2" font-size="17.22" fill="var(--text)">reinterpret bits as another type</text>
  <rect x="80.6779" y="488.0501" width="345.7627" height="37.7001" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="253.5594" y="514.15" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--danger-accent)">MaybeUninit</text>
  <text x="467.1187" y="514.15" font-size="17.22" fill="var(--text)">safe uninitialized memory handling</text>
  <rect x="80.6779" y="533" width="345.7627" height="37.7001" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="253.5594" y="559.1001" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--ok-accent)">SAFETY comment</text>
  <text x="467.1187" y="559.1001" font-size="17.22" fill="var(--text)">document why unsafe code is sound</text>
  <rect x="80.6779" y="577.9501" width="345.7627" height="37.7001" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="253.5594" y="604.05" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--ok-accent)">Miri</text>
  <text x="467.1187" y="604.05" font-size="17.22" fill="var(--text)">runtime UB detector</text>
</svg>
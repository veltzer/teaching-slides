<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.0472" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Unsafe Rust Cheatsheet</text>
  <rect x="40" y="61.75" width="1200" height="558.25" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="80.6779" y="83.4999" width="345.7627" height="37.7001" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="109.6" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">5 superpowers</text>
  <text x="467.1187" y="109.6" font-size="15.6545" fill="var(--text)" font-family="Arial, sans-serif">raw ptrs, unsafe fn, static mut, unsafe traits, union fields</text>
  <rect x="80.6779" y="128.45" width="345.7627" height="37.7001" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="154.55" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Raw pointers</text>
  <text x="467.1187" y="154.55" font-size="17.22" fill="var(--text)" font-family="Courier New, monospace">*const T, *mut T</text>
  <text x="792.5424" y="154.55" font-size="15.6545" fill="var(--text-muted)" font-family="Arial, sans-serif">(no borrow check)</text>
  <rect x="80.6779" y="173.3999" width="345.7627" height="37.7001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="199.5" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cell&lt;T&gt;</text>
  <text x="467.1187" y="199.5" font-size="17.22" fill="var(--text)" font-family="Arial, sans-serif">Copy-based interior mutability</text>
  <rect x="80.6779" y="218.35" width="345.7627" height="37.7001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="244.45" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">RefCell&lt;T&gt;</text>
  <text x="467.1187" y="244.45" font-size="17.22" fill="var(--text)" font-family="Arial, sans-serif">runtime borrow checking</text>
  <rect x="80.6779" y="263.3" width="345.7627" height="37.7001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="289.4" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">UnsafeCell&lt;T&gt;</text>
  <text x="467.1187" y="289.4" font-size="17.22" fill="var(--text)" font-family="Arial, sans-serif">foundation of interior mutability</text>
  <rect x="80.6779" y="308.25" width="345.7627" height="37.7001" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="334.35" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">repr(C)</text>
  <text x="467.1187" y="334.35" font-size="17.22" fill="var(--text)" font-family="Arial, sans-serif">C-compatible layout</text>
  <rect x="80.6779" y="353.1999" width="345.7627" height="37.7001" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="379.3001" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">repr(packed)</text>
  <text x="467.1187" y="379.3001" font-size="17.22" fill="var(--text)" font-family="Arial, sans-serif">no padding</text>
  <rect x="80.6779" y="398.15" width="345.7627" height="37.7001" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="424.2501" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">repr(align(N))</text>
  <text x="467.1187" y="424.2501" font-size="17.22" fill="var(--text)" font-family="Arial, sans-serif">minimum alignment</text>
  <rect x="80.6779" y="443.1" width="345.7627" height="37.7001" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="469.2" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">transmute</text>
  <text x="467.1187" y="469.2" font-size="17.22" fill="var(--text)" font-family="Arial, sans-serif">reinterpret bits as another type</text>
  <rect x="80.6779" y="488.0501" width="345.7627" height="37.7001" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="514.15" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">MaybeUninit</text>
  <text x="467.1187" y="514.15" font-size="17.22" fill="var(--text)" font-family="Arial, sans-serif">safe uninitialized memory handling</text>
  <rect x="80.6779" y="533" width="345.7627" height="37.7001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="559.1001" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">SAFETY comment</text>
  <text x="467.1187" y="559.1001" font-size="17.22" fill="var(--text)" font-family="Arial, sans-serif">document why unsafe code is sound</text>
  <rect x="80.6779" y="577.9501" width="345.7627" height="37.7001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="604.05" text-anchor="middle" font-size="17.22" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Miri</text>
  <text x="467.1187" y="604.05" font-size="17.22" fill="var(--text)" font-family="Arial, sans-serif">runtime UB detector</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.9674" y="37.6471" text-anchor="middle" font-size="24.0941" font-weight="bold" fill="var(--text)">Unsafe Rust Cheatsheet</text>
  <rect x="54.3662" y="60.2353" width="1069.2023" height="579.7647" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="90.6103" y="82.8235" width="308.0752" height="39.153" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="244.648" y="109.9294" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="var(--danger-accent)">5 superpowers</text>
  <text x="434.9298" y="109.9294" font-size="15.0588" fill="var(--text)">raw ptrs, unsafe fn, static mut, unsafe traits, union fields</text>
  <rect x="90.6103" y="129.5059" width="308.0752" height="39.153" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="244.648" y="156.6118" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="var(--primary-accent)">Raw pointers</text>
  <text x="434.9298" y="156.6118" font-size="16.5647" fill="var(--text)" font-family="monospace">*const T, *mut T</text>
  <text x="724.8829" y="156.6118" font-size="15.0588" fill="var(--text-muted)">(no borrow check)</text>
  <rect x="90.6103" y="176.1882" width="308.0752" height="39.153" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="244.648" y="203.2941" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="var(--ok-accent)">Cell&lt;T&gt;</text>
  <text x="434.9298" y="203.2941" font-size="16.5647" fill="var(--text)">Copy-based interior mutability</text>
  <rect x="90.6103" y="222.8706" width="308.0752" height="39.153" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="244.648" y="249.9765" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="var(--ok-accent)">RefCell&lt;T&gt;</text>
  <text x="434.9298" y="249.9765" font-size="16.5647" fill="var(--text)">runtime borrow checking</text>
  <rect x="90.6103" y="269.553" width="308.0752" height="39.153" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="244.648" y="296.6588" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="var(--ok-accent)">UnsafeCell&lt;T&gt;</text>
  <text x="434.9298" y="296.6588" font-size="16.5647" fill="var(--text)">foundation of interior mutability</text>
  <rect x="90.6103" y="316.2353" width="308.0752" height="39.153" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="244.648" y="343.3412" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="var(--primary-accent)">repr(C)</text>
  <text x="434.9298" y="343.3412" font-size="16.5647" fill="var(--text)">C-compatible layout</text>
  <rect x="90.6103" y="362.9176" width="308.0752" height="39.153" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="244.648" y="390.0236" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="var(--primary-accent)">repr(packed)</text>
  <text x="434.9298" y="390.0236" font-size="16.5647" fill="var(--text)">no padding</text>
  <rect x="90.6103" y="409.6" width="308.0752" height="39.153" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="244.648" y="436.706" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="var(--primary-accent)">repr(align(N))</text>
  <text x="434.9298" y="436.706" font-size="16.5647" fill="var(--text)">minimum alignment</text>
  <rect x="90.6103" y="456.2824" width="308.0752" height="39.153" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="244.648" y="483.3882" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="var(--danger-accent)">transmute</text>
  <text x="434.9298" y="483.3882" font-size="16.5647" fill="var(--text)">reinterpret bits as another type</text>
  <rect x="90.6103" y="502.9648" width="308.0752" height="39.153" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="244.648" y="530.0706" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="var(--danger-accent)">MaybeUninit</text>
  <text x="434.9298" y="530.0706" font-size="16.5647" fill="var(--text)">safe uninitialized memory handling</text>
  <rect x="90.6103" y="549.6471" width="308.0752" height="39.153" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="244.648" y="576.753" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="var(--ok-accent)">SAFETY comment</text>
  <text x="434.9298" y="576.753" font-size="16.5647" fill="var(--text)">document why unsafe code is sound</text>
  <rect x="90.6103" y="596.3295" width="308.0752" height="39.153" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="244.648" y="623.4353" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="var(--ok-accent)">Miri</text>
  <text x="434.9298" y="623.4353" font-size="16.5647" fill="var(--text)">runtime UB detector</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="588.9674" y="37.6471" text-anchor="middle" font-size="24.0941" font-weight="bold" fill="#333">Unsafe Rust Cheatsheet</ns0:text>
  <ns0:rect x="54.3662" y="60.2353" width="1069.2023" height="579.7647" rx="7.5294" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5059" />
  <ns0:rect x="90.6103" y="82.8235" width="308.0752" height="39.153" rx="4.5177" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5059" />
  <ns0:text x="244.648" y="109.9294" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#dc3545">5 superpowers</ns0:text>
  <ns0:text x="434.9298" y="109.9294" font-size="15.0588" fill="#333">raw ptrs, unsafe fn, static mut, unsafe traits, union fields</ns0:text>
  <ns0:rect x="90.6103" y="129.5059" width="308.0752" height="39.153" rx="4.5177" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5059" />
  <ns0:text x="244.648" y="156.6118" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#4a90e2">Raw pointers</ns0:text>
  <ns0:text x="434.9298" y="156.6118" font-size="16.5647" fill="#333" font-family="monospace">*const T, *mut T</ns0:text>
  <ns0:text x="724.8829" y="156.6118" font-size="15.0588" fill="#666">(no borrow check)</ns0:text>
  <ns0:rect x="90.6103" y="176.1882" width="308.0752" height="39.153" rx="4.5177" fill="#d4edda" stroke="#28a745" stroke-width="1.5059" />
  <ns0:text x="244.648" y="203.2941" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#28a745">Cell&lt;T&gt;</ns0:text>
  <ns0:text x="434.9298" y="203.2941" font-size="16.5647" fill="#333">Copy-based interior mutability</ns0:text>
  <ns0:rect x="90.6103" y="222.8706" width="308.0752" height="39.153" rx="4.5177" fill="#d4edda" stroke="#28a745" stroke-width="1.5059" />
  <ns0:text x="244.648" y="249.9765" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#28a745">RefCell&lt;T&gt;</ns0:text>
  <ns0:text x="434.9298" y="249.9765" font-size="16.5647" fill="#333">runtime borrow checking</ns0:text>
  <ns0:rect x="90.6103" y="269.553" width="308.0752" height="39.153" rx="4.5177" fill="#d4edda" stroke="#28a745" stroke-width="1.5059" />
  <ns0:text x="244.648" y="296.6588" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#28a745">UnsafeCell&lt;T&gt;</ns0:text>
  <ns0:text x="434.9298" y="296.6588" font-size="16.5647" fill="#333">foundation of interior mutability</ns0:text>
  <ns0:rect x="90.6103" y="316.2353" width="308.0752" height="39.153" rx="4.5177" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5059" />
  <ns0:text x="244.648" y="343.3412" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#4a90e2">repr(C)</ns0:text>
  <ns0:text x="434.9298" y="343.3412" font-size="16.5647" fill="#333">C-compatible layout</ns0:text>
  <ns0:rect x="90.6103" y="362.9176" width="308.0752" height="39.153" rx="4.5177" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5059" />
  <ns0:text x="244.648" y="390.0236" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#4a90e2">repr(packed)</ns0:text>
  <ns0:text x="434.9298" y="390.0236" font-size="16.5647" fill="#333">no padding</ns0:text>
  <ns0:rect x="90.6103" y="409.6" width="308.0752" height="39.153" rx="4.5177" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5059" />
  <ns0:text x="244.648" y="436.706" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#4a90e2">repr(align(N))</ns0:text>
  <ns0:text x="434.9298" y="436.706" font-size="16.5647" fill="#333">minimum alignment</ns0:text>
  <ns0:rect x="90.6103" y="456.2824" width="308.0752" height="39.153" rx="4.5177" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5059" />
  <ns0:text x="244.648" y="483.3882" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#dc3545">transmute</ns0:text>
  <ns0:text x="434.9298" y="483.3882" font-size="16.5647" fill="#333">reinterpret bits as another type</ns0:text>
  <ns0:rect x="90.6103" y="502.9648" width="308.0752" height="39.153" rx="4.5177" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5059" />
  <ns0:text x="244.648" y="530.0706" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#856404">MaybeUninit</ns0:text>
  <ns0:text x="434.9298" y="530.0706" font-size="16.5647" fill="#333">safe uninitialized memory handling</ns0:text>
  <ns0:rect x="90.6103" y="549.6471" width="308.0752" height="39.153" rx="4.5177" fill="#d4edda" stroke="#28a745" stroke-width="1.5059" />
  <ns0:text x="244.648" y="576.753" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#28a745">SAFETY comment</ns0:text>
  <ns0:text x="434.9298" y="576.753" font-size="16.5647" fill="#333">document why unsafe code is sound</ns0:text>
  <ns0:rect x="90.6103" y="596.3295" width="308.0752" height="39.153" rx="4.5177" fill="#d4edda" stroke="#28a745" stroke-width="1.5059" />
  <ns0:text x="244.648" y="623.4353" text-anchor="middle" font-size="16.5647" font-weight="bold" fill="#28a745">Miri</ns0:text>
  <ns0:text x="434.9298" y="623.4353" font-size="16.5647" fill="#333">runtime UB detector</ns0:text>
</ns0:svg>
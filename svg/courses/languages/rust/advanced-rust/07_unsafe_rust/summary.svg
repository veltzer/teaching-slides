<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.115766297252" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="80.6779" y="62.597298701299" width="345.7627" height="39.168935064935" rx="6.115766297252" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="89.714285714286" text-anchor="middle" font-size="17.552249273112" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">5 superpowers</text>
  <text x="467.1187" y="89.714285714286" font-size="15.956543916721" fill="var(--text)" font-family="Arial, sans-serif">raw ptrs, unsafe fn, static mut, unsafe traits, union fields</text>
  <rect x="80.6779" y="109.298701298701" width="345.7627" height="39.168935064935" rx="6.115766297252" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="136.415584415584" text-anchor="middle" font-size="17.552249273112" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Raw pointers</text>
  <text x="467.1187" y="136.415584415584" font-size="17.552249273112" fill="var(--text)" font-family="Courier New, monospace">*const T, *mut T</text>
  <text x="792.5424" y="136.415584415584" font-size="15.956543916721" fill="var(--text-muted)" font-family="Arial, sans-serif">(no borrow check)</text>
  <rect x="80.6779" y="155.999896103896" width="345.7627" height="39.168935064935" rx="6.115766297252" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="183.116883116883" text-anchor="middle" font-size="17.552249273112" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cell&lt;T&gt;</text>
  <text x="467.1187" y="183.116883116883" font-size="17.552249273112" fill="var(--text)" font-family="Arial, sans-serif">Copy-based interior mutability</text>
  <rect x="80.6779" y="202.701298701299" width="345.7627" height="39.168935064935" rx="6.115766297252" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="229.818181818182" text-anchor="middle" font-size="17.552249273112" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">RefCell&lt;T&gt;</text>
  <text x="467.1187" y="229.818181818182" font-size="17.552249273112" fill="var(--text)" font-family="Arial, sans-serif">runtime borrow checking</text>
  <rect x="80.6779" y="249.402597402597" width="345.7627" height="39.168935064935" rx="6.115766297252" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="276.519480519481" text-anchor="middle" font-size="17.552249273112" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">UnsafeCell&lt;T&gt;</text>
  <text x="467.1187" y="276.519480519481" font-size="17.552249273112" fill="var(--text)" font-family="Arial, sans-serif">foundation of interior mutability</text>
  <rect x="80.6779" y="296.103896103896" width="345.7627" height="39.168935064935" rx="6.115766297252" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="323.220779220779" text-anchor="middle" font-size="17.552249273112" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">repr(C)</text>
  <text x="467.1187" y="323.220779220779" font-size="17.552249273112" fill="var(--text)" font-family="Arial, sans-serif">C-compatible layout</text>
  <rect x="80.6779" y="342.805090909091" width="345.7627" height="39.168935064935" rx="6.115766297252" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="369.922181818182" text-anchor="middle" font-size="17.552249273112" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">repr(packed)</text>
  <text x="467.1187" y="369.922181818182" font-size="17.552249273112" fill="var(--text)" font-family="Arial, sans-serif">no padding</text>
  <rect x="80.6779" y="389.506493506493" width="345.7627" height="39.168935064935" rx="6.115766297252" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="416.62348051948" text-anchor="middle" font-size="17.552249273112" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">repr(align(N))</text>
  <text x="467.1187" y="416.62348051948" font-size="17.552249273112" fill="var(--text)" font-family="Arial, sans-serif">minimum alignment</text>
  <rect x="80.6779" y="436.207792207792" width="345.7627" height="39.168935064935" rx="6.115766297252" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="463.324675324675" text-anchor="middle" font-size="17.552249273112" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">transmute</text>
  <text x="467.1187" y="463.324675324675" font-size="17.552249273112" fill="var(--text)" font-family="Arial, sans-serif">reinterpret bits as another type</text>
  <rect x="80.6779" y="482.909194805195" width="345.7627" height="39.168935064935" rx="6.115766297252" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="510.025974025974" text-anchor="middle" font-size="17.552249273112" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">MaybeUninit</text>
  <text x="467.1187" y="510.025974025974" font-size="17.552249273112" fill="var(--text)" font-family="Arial, sans-serif">safe uninitialized memory handling</text>
  <rect x="80.6779" y="529.61038961039" width="345.7627" height="39.168935064935" rx="6.115766297252" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="556.727376623377" text-anchor="middle" font-size="17.552249273112" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">SAFETY comment</text>
  <text x="467.1187" y="556.727376623377" font-size="17.552249273112" fill="var(--text)" font-family="Arial, sans-serif">document why unsafe code is sound</text>
  <rect x="80.6779" y="576.311792207792" width="345.7627" height="39.168935064935" rx="6.115766297252" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="603.428571428571" text-anchor="middle" font-size="17.552249273112" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Miri</text>
  <text x="467.1187" y="603.428571428571" font-size="17.552249273112" fill="var(--text)" font-family="Arial, sans-serif">runtime UB detector</text>
</svg>

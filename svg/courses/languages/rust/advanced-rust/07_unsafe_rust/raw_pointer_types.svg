<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="30.6682" font-weight="bold" fill="var(--text)">Raw Pointer Types</text>
  <rect x="40" y="76.25" width="551.3513" height="217.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.6756" y="112.5" text-anchor="middle" font-size="21.4678" font-weight="bold" fill="var(--primary-accent)">*const T (immutable raw ptr)</text>
  <text x="64.3242" y="148.75" font-size="16.8675" fill="var(--text-muted)">let x = 42;</text>
  <text x="64.3242" y="177.75" font-size="16.8675" fill="var(--text-muted)">let ptr: *const i32 = &amp;x;</text>
  <text x="64.3242" y="214" font-size="16.8675" fill="var(--text-muted)">// Creating is safe</text>
  <text x="64.3242" y="243" font-size="16.8675" fill="var(--danger-accent)">// Dereferencing requires unsafe</text>
  <text x="64.3242" y="272" font-size="16.8675" fill="var(--danger-accent)">unsafe { println!("{}", *ptr); }</text>
  <rect x="656.2162" y="76.25" width="583.7838" height="217.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.108" y="112.5" text-anchor="middle" font-size="21.4678" font-weight="bold" fill="var(--text)">*mut T (mutable raw ptr)</text>
  <text x="680.5404" y="148.75" font-size="16.8675" fill="var(--text-muted)">let mut x = 42;</text>
  <text x="680.5404" y="177.75" font-size="16.8675" fill="var(--text-muted)">let ptr: *mut i32 = &amp;mut x;</text>
  <text x="680.5404" y="214" font-size="16.8675" fill="var(--text-muted)">// Can read AND write</text>
  <text x="680.5404" y="243" font-size="16.8675" fill="var(--danger-accent)">unsafe { *ptr = 99; }</text>
  <text x="680.5404" y="272" font-size="16.8675" fill="var(--danger-accent)">// No aliasing rules enforced!</text>
  <rect x="40" y="330" width="1199.9999" height="290" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="366.25" text-anchor="middle" font-size="21.4678" font-weight="bold" fill="var(--text)">Raw Pointers vs References</text>
  <text x="315.6756" y="402.5" text-anchor="middle" font-size="18.401" font-weight="bold" fill="var(--text)">Property</text>
  <text x="672.4324" y="402.5" text-anchor="middle" font-size="18.401" font-weight="bold" fill="var(--ok-accent)">&amp;T / &amp;mut T</text>
  <text x="1029.1891" y="402.5" text-anchor="middle" font-size="18.401" font-weight="bold" fill="var(--danger-accent)">*const T / *mut T</text>
  <line x1="72.4324" y1="414.1" x2="1207.5675" y2="414.1" stroke="var(--danger-border)" stroke-width="1.4884" />
  <text x="315.6756" y="443.1" text-anchor="middle" font-size="16.8675" fill="var(--text-muted)">Null</text>
  <text x="672.4324" y="443.1" text-anchor="middle" font-size="16.8675" fill="var(--ok-accent)">Never null</text>
  <text x="1029.1891" y="443.1" text-anchor="middle" font-size="16.8675" fill="var(--danger-accent)">Can be null</text>
  <text x="315.6756" y="475" text-anchor="middle" font-size="16.8675" fill="var(--text-muted)">Validity</text>
  <text x="672.4324" y="475" text-anchor="middle" font-size="16.8675" fill="var(--ok-accent)">Always valid</text>
  <text x="1029.1891" y="475" text-anchor="middle" font-size="16.8675" fill="var(--danger-accent)">May be dangling</text>
  <text x="315.6756" y="506.9" text-anchor="middle" font-size="16.8675" fill="var(--text-muted)">Aliasing</text>
  <text x="672.4324" y="506.9" text-anchor="middle" font-size="16.8675" fill="var(--ok-accent)">Enforced by borrow checker</text>
  <text x="1029.1891" y="506.9" text-anchor="middle" font-size="16.8675" fill="var(--danger-accent)">No rules</text>
  <text x="315.6756" y="538.8" text-anchor="middle" font-size="16.8675" fill="var(--text-muted)">Alignment</text>
  <text x="672.4324" y="538.8" text-anchor="middle" font-size="16.8675" fill="var(--ok-accent)">Guaranteed aligned</text>
  <text x="1029.1891" y="538.8" text-anchor="middle" font-size="16.8675" fill="var(--danger-accent)">May be unaligned</text>
  <text x="315.6756" y="570.6999" text-anchor="middle" font-size="16.8675" fill="var(--text-muted)">Send/Sync</text>
  <text x="672.4324" y="570.6999" text-anchor="middle" font-size="16.8675" fill="var(--ok-accent)">Automatic</text>
  <text x="1029.1891" y="570.6999" text-anchor="middle" font-size="16.8675" fill="var(--danger-accent)">Neither Send nor Sync</text>
  <text x="315.6756" y="602.6" text-anchor="middle" font-size="16.8675" fill="var(--text-muted)">Deref</text>
  <text x="672.4324" y="602.6" text-anchor="middle" font-size="16.8675" fill="var(--ok-accent)">Safe</text>
  <text x="1029.1891" y="602.6" text-anchor="middle" font-size="16.8675" fill="var(--danger-accent)">Requires unsafe</text>
</svg>
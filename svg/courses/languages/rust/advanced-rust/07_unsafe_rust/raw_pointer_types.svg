<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="11.2" refX="16" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Raw Pointer Types</text>
  <rect x="48" y="88" width="544" height="240" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="320" y="128" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#4a90e2">*const T (immutable raw ptr)</text>
  <text x="72" y="168" font-size="17.6" fill="#555">let x = 42;</text>
  <text x="72" y="200" font-size="17.6" fill="#555">let ptr: *const i32 = &amp;x;</text>
  <text x="72" y="240" font-size="17.6" fill="#555">// Creating is safe</text>
  <text x="72" y="272" font-size="17.6" fill="#dc3545">// Dereferencing requires unsafe</text>
  <text x="72" y="304" font-size="17.6" fill="#dc3545">unsafe { println!("{}", *ptr); }</text>
  <rect x="656" y="88" width="576" height="240" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="944" y="128" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">*mut T (mutable raw ptr)</text>
  <text x="680" y="168" font-size="17.6" fill="#555">let mut x = 42;</text>
  <text x="680" y="200" font-size="17.6" fill="#555">let ptr: *mut i32 = &amp;mut x;</text>
  <text x="680" y="240" font-size="17.6" fill="#555">// Can read AND write</text>
  <text x="680" y="272" font-size="17.6" fill="#dc3545">unsafe { *ptr = 99; }</text>
  <text x="680" y="304" font-size="17.6" fill="#dc3545">// No aliasing rules enforced!</text>
  <rect x="48" y="368" width="1184" height="320" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="640" y="408" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Raw Pointers vs References</text>
  <text x="320" y="448" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Property</text>
  <text x="672" y="448" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">&amp;T / &amp;mut T</text>
  <text x="1024" y="448" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#dc3545">*const T / *mut T</text>
  <line x1="80" y1="460.8" x2="1200" y2="460.8" stroke="#dc3545" stroke-width="1.6" />
  <text x="320" y="492.8" text-anchor="middle" font-size="17.6" fill="#555">Null</text>
  <text x="672" y="492.8" text-anchor="middle" font-size="17.6" fill="#28a745">Never null</text>
  <text x="1024" y="492.8" text-anchor="middle" font-size="17.6" fill="#dc3545">Can be null</text>
  <text x="320" y="528" text-anchor="middle" font-size="17.6" fill="#555">Validity</text>
  <text x="672" y="528" text-anchor="middle" font-size="17.6" fill="#28a745">Always valid</text>
  <text x="1024" y="528" text-anchor="middle" font-size="17.6" fill="#dc3545">May be dangling</text>
  <text x="320" y="563.2" text-anchor="middle" font-size="17.6" fill="#555">Aliasing</text>
  <text x="672" y="563.2" text-anchor="middle" font-size="17.6" fill="#28a745">Enforced by borrow checker</text>
  <text x="1024" y="563.2" text-anchor="middle" font-size="17.6" fill="#dc3545">No rules</text>
  <text x="320" y="598.4" text-anchor="middle" font-size="17.6" fill="#555">Alignment</text>
  <text x="672" y="598.4" text-anchor="middle" font-size="17.6" fill="#28a745">Guaranteed aligned</text>
  <text x="1024" y="598.4" text-anchor="middle" font-size="17.6" fill="#dc3545">May be unaligned</text>
  <text x="320" y="633.6" text-anchor="middle" font-size="17.6" fill="#555">Send/Sync</text>
  <text x="672" y="633.6" text-anchor="middle" font-size="17.6" fill="#28a745">Automatic</text>
  <text x="1024" y="633.6" text-anchor="middle" font-size="17.6" fill="#dc3545">Neither Send nor Sync</text>
  <text x="320" y="668.8" text-anchor="middle" font-size="17.6" fill="#555">Deref</text>
  <text x="672" y="668.8" text-anchor="middle" font-size="17.6" fill="#28a745">Safe</text>
  <text x="1024" y="668.8" text-anchor="middle" font-size="17.6" fill="#dc3545">Requires unsafe</text>
</svg>
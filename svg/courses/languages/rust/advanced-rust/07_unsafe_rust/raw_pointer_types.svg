<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="30.6682" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Raw Pointer Types</text>
  <rect x="40" y="76.25" width="551.3513" height="217.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.6756" y="112.5" text-anchor="middle" font-size="21.4678" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">*const T (immutable)</text>
  <text x="64.3242" y="148.75" font-size="16.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">let x = 42;</text>
  <text x="64.3242" y="177.75" font-size="16.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">let ptr: *const i32 = &amp;x;</text>
  <text x="64.3242" y="214" font-size="16.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">// Safe to create</text>
  <text x="64.3242" y="243" font-size="16.8675" fill="var(--danger-accent)" font-family="Arial, sans-serif">// Deref needs unsafe</text>
  <text x="64.3242" y="272" font-size="16.8675" fill="var(--danger-accent)" font-family="Arial, sans-serif">unsafe { *ptr }</text>
  <rect x="656.2162" y="76.25" width="583.7838" height="217.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.108" y="112.5" text-anchor="middle" font-size="21.4678" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">*mut T (mutable)</text>
  <text x="680.5404" y="148.75" font-size="16.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">let mut x = 42;</text>
  <text x="680.5404" y="177.75" font-size="16.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">let ptr: *mut i32 = &amp;mut x;</text>
  <text x="680.5404" y="214" font-size="16.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">// Read + write</text>
  <text x="680.5404" y="243" font-size="16.8675" fill="var(--danger-accent)" font-family="Arial, sans-serif">unsafe { *ptr = 99; }</text>
  <text x="680.5404" y="272" font-size="16.8675" fill="var(--danger-accent)" font-family="Arial, sans-serif">// No aliasing rules</text>
  <rect x="40" y="330" width="1199.9999" height="290" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="366.25" text-anchor="middle" font-size="21.4678" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Raw Pointers vs References</text>
  <text x="315.6756" y="402.5" text-anchor="middle" font-size="18.401" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Property</text>
  <text x="672.4324" y="402.5" text-anchor="middle" font-size="18.401" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">&amp;T / &amp;mut T</text>
  <text x="1029.1891" y="402.5" text-anchor="middle" font-size="18.401" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">*const T / *mut T</text>
  <line x1="72.4324" y1="414.1" x2="1207.5675" y2="414.1" stroke="var(--danger-border)" stroke-width="1.4884"/>
  <text x="315.6756" y="443.1" text-anchor="middle" font-size="16.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">Null</text>
  <text x="672.4324" y="443.1" text-anchor="middle" font-size="16.8675" fill="var(--ok-accent)" font-family="Arial, sans-serif">Never null</text>
  <text x="1029.1891" y="443.1" text-anchor="middle" font-size="16.8675" fill="var(--danger-accent)" font-family="Arial, sans-serif">Can be null</text>
  <text x="315.6756" y="475" text-anchor="middle" font-size="16.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">Validity</text>
  <text x="672.4324" y="475" text-anchor="middle" font-size="16.8675" fill="var(--ok-accent)" font-family="Arial, sans-serif">Always valid</text>
  <text x="1029.1891" y="475" text-anchor="middle" font-size="16.8675" fill="var(--danger-accent)" font-family="Arial, sans-serif">May be dangling</text>
  <text x="315.6756" y="506.9" text-anchor="middle" font-size="16.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">Aliasing</text>
  <text x="672.4324" y="506.9" text-anchor="middle" font-size="16.8675" fill="var(--ok-accent)" font-family="Arial, sans-serif">Borrow-checked</text>
  <text x="1029.1891" y="506.9" text-anchor="middle" font-size="16.8675" fill="var(--danger-accent)" font-family="Arial, sans-serif">No rules</text>
  <text x="315.6756" y="538.8" text-anchor="middle" font-size="16.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">Alignment</text>
  <text x="672.4324" y="538.8" text-anchor="middle" font-size="16.8675" fill="var(--ok-accent)" font-family="Arial, sans-serif">Aligned</text>
  <text x="1029.1891" y="538.8" text-anchor="middle" font-size="16.8675" fill="var(--danger-accent)" font-family="Arial, sans-serif">May be unaligned</text>
  <text x="315.6756" y="570.6999" text-anchor="middle" font-size="16.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">Send/Sync</text>
  <text x="672.4324" y="570.6999" text-anchor="middle" font-size="16.8675" fill="var(--ok-accent)" font-family="Arial, sans-serif">Automatic</text>
  <text x="1029.1891" y="570.6999" text-anchor="middle" font-size="16.8675" fill="var(--danger-accent)" font-family="Arial, sans-serif">Neither</text>
  <text x="315.6756" y="602.6" text-anchor="middle" font-size="16.8675" fill="var(--text-muted)" font-family="Arial, sans-serif">Deref</text>
  <text x="672.4324" y="602.6" text-anchor="middle" font-size="16.8675" fill="var(--ok-accent)" font-family="Arial, sans-serif">Safe</text>
  <text x="1029.1891" y="602.6" text-anchor="middle" font-size="16.8675" fill="var(--danger-accent)" font-family="Arial, sans-serif">Needs unsafe</text>
</svg>

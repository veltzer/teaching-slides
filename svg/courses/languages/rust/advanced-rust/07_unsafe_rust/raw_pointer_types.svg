<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="595.3488" y="44.6512" text-anchor="middle" font-size="29.7674" font-weight="bold" fill="var(--text-dark)">Raw Pointer Types</text>
  <rect x="44.6512" y="81.8605" width="506.0465" height="223.2558" rx="7.4419" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9767" />
  <text x="297.6744" y="119.0698" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--primary-bright)">*const T (immutable raw ptr)</text>
  <text x="66.9767" y="156.2791" font-size="16.3721" fill="var(--text-muted)">let x = 42;</text>
  <text x="66.9767" y="186.0465" font-size="16.3721" fill="var(--text-muted)">let ptr: *const i32 = &amp;x;</text>
  <text x="66.9767" y="223.2558" font-size="16.3721" fill="var(--text-muted)">// Creating is safe</text>
  <text x="66.9767" y="253.0233" font-size="16.3721" fill="var(--danger-bright)">// Dereferencing requires unsafe</text>
  <text x="66.9767" y="282.7907" font-size="16.3721" fill="var(--danger-bright)">unsafe { println!("{}", *ptr); }</text>
  <rect x="610.2326" y="81.8605" width="535.814" height="223.2558" rx="7.4419" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9767" />
  <text x="878.1395" y="119.0698" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--text-dark)">*mut T (mutable raw ptr)</text>
  <text x="632.5581" y="156.2791" font-size="16.3721" fill="var(--text-muted)">let mut x = 42;</text>
  <text x="632.5581" y="186.0465" font-size="16.3721" fill="var(--text-muted)">let ptr: *mut i32 = &amp;mut x;</text>
  <text x="632.5581" y="223.2558" font-size="16.3721" fill="var(--text-muted)">// Can read AND write</text>
  <text x="632.5581" y="253.0233" font-size="16.3721" fill="var(--danger-bright)">unsafe { *ptr = 99; }</text>
  <text x="632.5581" y="282.7907" font-size="16.3721" fill="var(--danger-bright)">// No aliasing rules enforced!</text>
  <rect x="44.6512" y="342.3256" width="1101.3953" height="297.6744" rx="7.4419" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9767" />
  <text x="595.3488" y="379.5349" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--text-dark)">Raw Pointers vs References</text>
  <text x="297.6744" y="416.7442" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--text-dark)">Property</text>
  <text x="625.1163" y="416.7442" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--ok-bright)">&amp;T / &amp;mut T</text>
  <text x="952.5581" y="416.7442" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--danger-bright)">*const T / *mut T</text>
  <line x1="74.4186" y1="428.6512" x2="1116.2791" y2="428.6512" stroke="var(--danger-bright)" stroke-width="1.4884" />
  <text x="297.6744" y="458.4186" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">Null</text>
  <text x="625.1163" y="458.4186" text-anchor="middle" font-size="16.3721" fill="var(--ok-bright)">Never null</text>
  <text x="952.5581" y="458.4186" text-anchor="middle" font-size="16.3721" fill="var(--danger-bright)">Can be null</text>
  <text x="297.6744" y="491.1628" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">Validity</text>
  <text x="625.1163" y="491.1628" text-anchor="middle" font-size="16.3721" fill="var(--ok-bright)">Always valid</text>
  <text x="952.5581" y="491.1628" text-anchor="middle" font-size="16.3721" fill="var(--danger-bright)">May be dangling</text>
  <text x="297.6744" y="523.907" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">Aliasing</text>
  <text x="625.1163" y="523.907" text-anchor="middle" font-size="16.3721" fill="var(--ok-bright)">Enforced by borrow checker</text>
  <text x="952.5581" y="523.907" text-anchor="middle" font-size="16.3721" fill="var(--danger-bright)">No rules</text>
  <text x="297.6744" y="556.6512" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">Alignment</text>
  <text x="625.1163" y="556.6512" text-anchor="middle" font-size="16.3721" fill="var(--ok-bright)">Guaranteed aligned</text>
  <text x="952.5581" y="556.6512" text-anchor="middle" font-size="16.3721" fill="var(--danger-bright)">May be unaligned</text>
  <text x="297.6744" y="589.3953" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">Send/Sync</text>
  <text x="625.1163" y="589.3953" text-anchor="middle" font-size="16.3721" fill="var(--ok-bright)">Automatic</text>
  <text x="952.5581" y="589.3953" text-anchor="middle" font-size="16.3721" fill="var(--danger-bright)">Neither Send nor Sync</text>
  <text x="297.6744" y="622.1395" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">Deref</text>
  <text x="625.1163" y="622.1395" text-anchor="middle" font-size="16.3721" fill="var(--ok-bright)">Safe</text>
  <text x="952.5581" y="622.1395" text-anchor="middle" font-size="16.3721" fill="var(--danger-bright)">Requires unsafe</text>
</svg>
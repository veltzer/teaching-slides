<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </ns0:defs>
  <ns0:text x="595.3488" y="44.6512" text-anchor="middle" font-size="29.7674" font-weight="bold" fill="#333">Raw Pointer Types</ns0:text>
  <ns0:rect x="44.6512" y="81.8605" width="506.0465" height="223.2558" rx="7.4419" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9767" />
  <ns0:text x="297.6744" y="119.0698" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="#4a90e2">*const T (immutable raw ptr)</ns0:text>
  <ns0:text x="66.9767" y="156.2791" font-size="16.3721" fill="#555">let x = 42;</ns0:text>
  <ns0:text x="66.9767" y="186.0465" font-size="16.3721" fill="#555">let ptr: *const i32 = &amp;x;</ns0:text>
  <ns0:text x="66.9767" y="223.2558" font-size="16.3721" fill="#555">// Creating is safe</ns0:text>
  <ns0:text x="66.9767" y="253.0233" font-size="16.3721" fill="#dc3545">// Dereferencing requires unsafe</ns0:text>
  <ns0:text x="66.9767" y="282.7907" font-size="16.3721" fill="#dc3545">unsafe { println!("{}", *ptr); }</ns0:text>
  <ns0:rect x="610.2326" y="81.8605" width="535.814" height="223.2558" rx="7.4419" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9767" />
  <ns0:text x="878.1395" y="119.0698" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="#333">*mut T (mutable raw ptr)</ns0:text>
  <ns0:text x="632.5581" y="156.2791" font-size="16.3721" fill="#555">let mut x = 42;</ns0:text>
  <ns0:text x="632.5581" y="186.0465" font-size="16.3721" fill="#555">let ptr: *mut i32 = &amp;mut x;</ns0:text>
  <ns0:text x="632.5581" y="223.2558" font-size="16.3721" fill="#555">// Can read AND write</ns0:text>
  <ns0:text x="632.5581" y="253.0233" font-size="16.3721" fill="#dc3545">unsafe { *ptr = 99; }</ns0:text>
  <ns0:text x="632.5581" y="282.7907" font-size="16.3721" fill="#dc3545">// No aliasing rules enforced!</ns0:text>
  <ns0:rect x="44.6512" y="342.3256" width="1101.3953" height="297.6744" rx="7.4419" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9767" />
  <ns0:text x="595.3488" y="379.5349" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="#333">Raw Pointers vs References</ns0:text>
  <ns0:text x="297.6744" y="416.7442" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="#333">Property</ns0:text>
  <ns0:text x="625.1163" y="416.7442" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="#28a745">&amp;T / &amp;mut T</ns0:text>
  <ns0:text x="952.5581" y="416.7442" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="#dc3545">*const T / *mut T</ns0:text>
  <ns0:line x1="74.4186" y1="428.6512" x2="1116.2791" y2="428.6512" stroke="#dc3545" stroke-width="1.4884" />
  <ns0:text x="297.6744" y="458.4186" text-anchor="middle" font-size="16.3721" fill="#555">Null</ns0:text>
  <ns0:text x="625.1163" y="458.4186" text-anchor="middle" font-size="16.3721" fill="#28a745">Never null</ns0:text>
  <ns0:text x="952.5581" y="458.4186" text-anchor="middle" font-size="16.3721" fill="#dc3545">Can be null</ns0:text>
  <ns0:text x="297.6744" y="491.1628" text-anchor="middle" font-size="16.3721" fill="#555">Validity</ns0:text>
  <ns0:text x="625.1163" y="491.1628" text-anchor="middle" font-size="16.3721" fill="#28a745">Always valid</ns0:text>
  <ns0:text x="952.5581" y="491.1628" text-anchor="middle" font-size="16.3721" fill="#dc3545">May be dangling</ns0:text>
  <ns0:text x="297.6744" y="523.907" text-anchor="middle" font-size="16.3721" fill="#555">Aliasing</ns0:text>
  <ns0:text x="625.1163" y="523.907" text-anchor="middle" font-size="16.3721" fill="#28a745">Enforced by borrow checker</ns0:text>
  <ns0:text x="952.5581" y="523.907" text-anchor="middle" font-size="16.3721" fill="#dc3545">No rules</ns0:text>
  <ns0:text x="297.6744" y="556.6512" text-anchor="middle" font-size="16.3721" fill="#555">Alignment</ns0:text>
  <ns0:text x="625.1163" y="556.6512" text-anchor="middle" font-size="16.3721" fill="#28a745">Guaranteed aligned</ns0:text>
  <ns0:text x="952.5581" y="556.6512" text-anchor="middle" font-size="16.3721" fill="#dc3545">May be unaligned</ns0:text>
  <ns0:text x="297.6744" y="589.3953" text-anchor="middle" font-size="16.3721" fill="#555">Send/Sync</ns0:text>
  <ns0:text x="625.1163" y="589.3953" text-anchor="middle" font-size="16.3721" fill="#28a745">Automatic</ns0:text>
  <ns0:text x="952.5581" y="589.3953" text-anchor="middle" font-size="16.3721" fill="#dc3545">Neither Send nor Sync</ns0:text>
  <ns0:text x="297.6744" y="622.1395" text-anchor="middle" font-size="16.3721" fill="#555">Deref</ns0:text>
  <ns0:text x="625.1163" y="622.1395" text-anchor="middle" font-size="16.3721" fill="#28a745">Safe</ns0:text>
  <ns0:text x="952.5581" y="622.1395" text-anchor="middle" font-size="16.3721" fill="#dc3545">Requires unsafe</ns0:text>
</ns0:svg>
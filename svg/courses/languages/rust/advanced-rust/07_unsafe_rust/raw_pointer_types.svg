<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="595.3488" y="44.6512" text-anchor="middle" font-size="29.7674" font-weight="bold" fill="var(--text)">Raw Pointer Types</text>
  <rect x="44.6512" y="81.8605" width="506.0465" height="223.2558" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="297.6744" y="119.0698" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--primary-accent)">*const T (immutable raw ptr)</text>
  <text x="66.9767" y="156.2791" font-size="16.3721" fill="var(--text-muted)">let x = 42;</text>
  <text x="66.9767" y="186.0465" font-size="16.3721" fill="var(--text-muted)">let ptr: *const i32 = &amp;x;</text>
  <text x="66.9767" y="223.2558" font-size="16.3721" fill="var(--text-muted)">// Creating is safe</text>
  <text x="66.9767" y="253.0233" font-size="16.3721" fill="var(--danger-accent)">// Dereferencing requires unsafe</text>
  <text x="66.9767" y="282.7907" font-size="16.3721" fill="var(--danger-accent)">unsafe { println!("{}", *ptr); }</text>
  <rect x="610.2326" y="81.8605" width="535.814" height="223.2558" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="878.1395" y="119.0698" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--text)">*mut T (mutable raw ptr)</text>
  <text x="632.5581" y="156.2791" font-size="16.3721" fill="var(--text-muted)">let mut x = 42;</text>
  <text x="632.5581" y="186.0465" font-size="16.3721" fill="var(--text-muted)">let ptr: *mut i32 = &amp;mut x;</text>
  <text x="632.5581" y="223.2558" font-size="16.3721" fill="var(--text-muted)">// Can read AND write</text>
  <text x="632.5581" y="253.0233" font-size="16.3721" fill="var(--danger-accent)">unsafe { *ptr = 99; }</text>
  <text x="632.5581" y="282.7907" font-size="16.3721" fill="var(--danger-accent)">// No aliasing rules enforced!</text>
  <rect x="44.6512" y="342.3256" width="1101.3953" height="297.6744" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="595.3488" y="379.5349" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--text)">Raw Pointers vs References</text>
  <text x="297.6744" y="416.7442" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--text)">Property</text>
  <text x="625.1163" y="416.7442" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--ok-accent)">&amp;T / &amp;mut T</text>
  <text x="952.5581" y="416.7442" text-anchor="middle" font-size="17.8605" font-weight="bold" fill="var(--danger-accent)">*const T / *mut T</text>
  <line x1="74.4186" y1="428.6512" x2="1116.2791" y2="428.6512" stroke="var(--danger-border)" stroke-width="1.4884" />
  <text x="297.6744" y="458.4186" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">Null</text>
  <text x="625.1163" y="458.4186" text-anchor="middle" font-size="16.3721" fill="var(--ok-accent)">Never null</text>
  <text x="952.5581" y="458.4186" text-anchor="middle" font-size="16.3721" fill="var(--danger-accent)">Can be null</text>
  <text x="297.6744" y="491.1628" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">Validity</text>
  <text x="625.1163" y="491.1628" text-anchor="middle" font-size="16.3721" fill="var(--ok-accent)">Always valid</text>
  <text x="952.5581" y="491.1628" text-anchor="middle" font-size="16.3721" fill="var(--danger-accent)">May be dangling</text>
  <text x="297.6744" y="523.907" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">Aliasing</text>
  <text x="625.1163" y="523.907" text-anchor="middle" font-size="16.3721" fill="var(--ok-accent)">Enforced by borrow checker</text>
  <text x="952.5581" y="523.907" text-anchor="middle" font-size="16.3721" fill="var(--danger-accent)">No rules</text>
  <text x="297.6744" y="556.6512" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">Alignment</text>
  <text x="625.1163" y="556.6512" text-anchor="middle" font-size="16.3721" fill="var(--ok-accent)">Guaranteed aligned</text>
  <text x="952.5581" y="556.6512" text-anchor="middle" font-size="16.3721" fill="var(--danger-accent)">May be unaligned</text>
  <text x="297.6744" y="589.3953" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">Send/Sync</text>
  <text x="625.1163" y="589.3953" text-anchor="middle" font-size="16.3721" fill="var(--ok-accent)">Automatic</text>
  <text x="952.5581" y="589.3953" text-anchor="middle" font-size="16.3721" fill="var(--danger-accent)">Neither Send nor Sync</text>
  <text x="297.6744" y="622.1395" text-anchor="middle" font-size="16.3721" fill="var(--text-muted)">Deref</text>
  <text x="625.1163" y="622.1395" text-anchor="middle" font-size="16.3721" fill="var(--ok-accent)">Safe</text>
  <text x="952.5581" y="622.1395" text-anchor="middle" font-size="16.3721" fill="var(--danger-accent)">Requires unsafe</text>
</svg>
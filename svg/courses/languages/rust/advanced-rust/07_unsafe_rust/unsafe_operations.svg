<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.4748" font-weight="bold" fill="var(--text)">Unsafe Operations in Rust</text>
  <rect x="40" y="73.3333" width="1200" height="53.3334" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="639.9999" y="106.6667" text-anchor="middle" font-size="19.9323" font-weight="bold" fill="var(--danger-accent)">Five Unsafe Superpowers</text>
  <rect x="40" y="146.6666" width="567.5675" height="93.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="323.7838" y="177.3334" text-anchor="middle" font-size="17.0848" font-weight="bold" fill="var(--text)">1. Dereference Raw Pointers</text>
  <text x="64.3243" y="206.6666" font-size="14.2373" fill="var(--text-muted)">unsafe { *raw_ptr = 42; }</text>
  <text x="64.3243" y="226.6667" font-size="14.2373" fill="var(--danger-accent)">May be null, dangling, or unaligned</text>
  <rect x="656.2162" y="146.6666" width="583.7837" height="93.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="948.1081" y="177.3334" text-anchor="middle" font-size="17.0848" font-weight="bold" fill="var(--text)">2. Call Unsafe Functions</text>
  <text x="680.5406" y="206.6666" font-size="14.2373" fill="var(--text-muted)">unsafe { dangerous_fn(); }</text>
  <text x="680.5406" y="226.6667" font-size="14.2373" fill="var(--danger-accent)">Function has preconditions caller must ensure</text>
  <rect x="40" y="260" width="567.5675" height="93.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="323.7838" y="290.6667" text-anchor="middle" font-size="17.0848" font-weight="bold" fill="var(--text)">3. Access Mutable Statics</text>
  <text x="64.3243" y="320" font-size="14.2373" fill="var(--text-muted)">static mut COUNTER: u32 = 0;</text>
  <text x="64.3243" y="340" font-size="14.2373" fill="var(--danger-accent)">Data races possible with threads</text>
  <rect x="656.2162" y="260" width="583.7837" height="93.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="948.1081" y="290.6667" text-anchor="middle" font-size="17.0848" font-weight="bold" fill="var(--text)">4. Implement Unsafe Traits</text>
  <text x="680.5406" y="320" font-size="14.2373" fill="var(--text-muted)">unsafe impl Send for MyType {}</text>
  <text x="680.5406" y="340" font-size="14.2373" fill="var(--danger-accent)">Promises invariants compiler can't verify</text>
  <rect x="315.6757" y="373.3333" width="648.6486" height="93.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9999" y="404" text-anchor="middle" font-size="17.0848" font-weight="bold" fill="var(--text)">5. Access Union Fields</text>
  <text x="340" y="433.3333" font-size="14.2373" fill="var(--text-muted)">unsafe { my_union.field1 }</text>
  <text x="340" y="453.3334" font-size="14.2373" fill="var(--danger-accent)">Wrong field = misinterpreted bytes</text>
  <rect x="40" y="493.3333" width="1200" height="126.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="639.9999" y="526.6667" text-anchor="middle" font-size="19.9323" font-weight="bold" fill="var(--ok-accent)">What unsafe Does NOT Disable</text>
  <text x="218.3784" y="560" text-anchor="middle" font-size="15.6611" fill="var(--text-muted)">Borrow checker</text>
  <text x="477.8378" y="560" text-anchor="middle" font-size="15.6611" fill="var(--text-muted)">Type checking</text>
  <text x="737.2973" y="560" text-anchor="middle" font-size="15.6611" fill="var(--text-muted)">Lifetime checking</text>
  <text x="1029.1891" y="560" text-anchor="middle" font-size="15.6611" fill="var(--text-muted)">Bounds checking</text>
  <text x="639.9999" y="600" text-anchor="middle" font-size="15.6611" fill="var(--ok-accent)" font-weight="bold">unsafe only unlocks the 5 superpowers above - everything else still enforced!</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="14.681" markerHeight="9.6344" refX="14.681" refY="4.8172" orient="auto">
      <ns0:polygon points="0,13.7634 5.1384,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="587.2401" y="41.2903" text-anchor="middle" font-size="27.5269" font-weight="bold" fill="#333">Unsafe Operations in Rust</ns0:text>
  <ns0:rect x="44.043" y="75.6989" width="1086.3943" height="55.0538" rx="6.8817" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7527" />
  <ns0:text x="587.2401" y="110.1075" text-anchor="middle" font-size="19.2688" font-weight="bold" fill="#dc3545">Five Unsafe Superpowers</ns0:text>
  <ns0:rect x="44.043" y="151.3978" width="513.8351" height="96.3441" rx="6.8817" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7527" />
  <ns0:text x="300.9606" y="183.0538" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="#333">1. Dereference Raw Pointers</ns0:text>
  <ns0:text x="66.0645" y="213.3333" font-size="13.7634" fill="#555">unsafe { *raw_ptr = 42; }</ns0:text>
  <ns0:text x="66.0645" y="233.9785" font-size="13.7634" fill="#dc3545">May be null, dangling, or unaligned</ns0:text>
  <ns0:rect x="601.9211" y="151.3978" width="528.5161" height="96.3441" rx="6.8817" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7527" />
  <ns0:text x="866.1792" y="183.0538" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="#333">2. Call Unsafe Functions</ns0:text>
  <ns0:text x="623.9427" y="213.3333" font-size="13.7634" fill="#555">unsafe { dangerous_fn(); }</ns0:text>
  <ns0:text x="623.9427" y="233.9785" font-size="13.7634" fill="#dc3545">Function has preconditions caller must ensure</ns0:text>
  <ns0:rect x="44.043" y="268.3871" width="513.8351" height="96.3441" rx="6.8817" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7527" />
  <ns0:text x="300.9606" y="300.043" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="#333">3. Access Mutable Statics</ns0:text>
  <ns0:text x="66.0645" y="330.3226" font-size="13.7634" fill="#555">static mut COUNTER: u32 = 0;</ns0:text>
  <ns0:text x="66.0645" y="350.9677" font-size="13.7634" fill="#dc3545">Data races possible with threads</ns0:text>
  <ns0:rect x="601.9211" y="268.3871" width="528.5161" height="96.3441" rx="6.8817" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7527" />
  <ns0:text x="866.1792" y="300.043" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="#333">4. Implement Unsafe Traits</ns0:text>
  <ns0:text x="623.9427" y="330.3226" font-size="13.7634" fill="#555">unsafe impl Send for MyType {}</ns0:text>
  <ns0:text x="623.9427" y="350.9677" font-size="13.7634" fill="#dc3545">Promises invariants compiler can't verify</ns0:text>
  <ns0:rect x="293.6201" y="385.3763" width="587.2401" height="96.3441" rx="6.8817" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7527" />
  <ns0:text x="587.2401" y="417.0323" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="#333">5. Access Union Fields</ns0:text>
  <ns0:text x="315.6416" y="447.3118" font-size="13.7634" fill="#555">unsafe { my_union.field1 }</ns0:text>
  <ns0:text x="315.6416" y="467.957" font-size="13.7634" fill="#dc3545">Wrong field = misinterpreted bytes</ns0:text>
  <ns0:rect x="44.043" y="509.2473" width="1086.3943" height="130.7527" rx="6.8817" fill="#d4edda" stroke="#28a745" stroke-width="2.7527" />
  <ns0:text x="587.2401" y="543.6559" text-anchor="middle" font-size="19.2688" font-weight="bold" fill="#28a745">What unsafe Does NOT Disable</ns0:text>
  <ns0:text x="205.5341" y="578.0645" text-anchor="middle" font-size="15.1398" fill="#555">Borrow checker</ns0:text>
  <ns0:text x="440.4301" y="578.0645" text-anchor="middle" font-size="15.1398" fill="#555">Type checking</ns0:text>
  <ns0:text x="675.3262" y="578.0645" text-anchor="middle" font-size="15.1398" fill="#555">Lifetime checking</ns0:text>
  <ns0:text x="939.5842" y="578.0645" text-anchor="middle" font-size="15.1398" fill="#555">Bounds checking</ns0:text>
  <ns0:text x="587.2401" y="619.3548" text-anchor="middle" font-size="15.1398" fill="#28a745" font-weight="bold">unsafe only unlocks the 5 superpowers above - everything else still enforced!</ns0:text>
</ns0:svg>
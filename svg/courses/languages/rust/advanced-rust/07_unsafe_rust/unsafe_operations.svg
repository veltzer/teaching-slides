<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="587.2401" y="41.2903" text-anchor="middle" font-size="27.5269" font-weight="bold" fill="var(--text)">Unsafe Operations in Rust</text>
  <rect x="44.043" y="75.6989" width="1086.3943" height="55.0538" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="587.2401" y="110.1075" text-anchor="middle" font-size="19.2688" font-weight="bold" fill="var(--danger-accent)">Five Unsafe Superpowers</text>
  <rect x="44.043" y="151.3978" width="513.8351" height="96.3441" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="300.9606" y="183.0538" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="var(--text)">1. Dereference Raw Pointers</text>
  <text x="66.0645" y="213.3333" font-size="13.7634" fill="var(--text-muted)">unsafe { *raw_ptr = 42; }</text>
  <text x="66.0645" y="233.9785" font-size="13.7634" fill="var(--danger-accent)">May be null, dangling, or unaligned</text>
  <rect x="601.9211" y="151.3978" width="528.5161" height="96.3441" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="866.1792" y="183.0538" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="var(--text)">2. Call Unsafe Functions</text>
  <text x="623.9427" y="213.3333" font-size="13.7634" fill="var(--text-muted)">unsafe { dangerous_fn(); }</text>
  <text x="623.9427" y="233.9785" font-size="13.7634" fill="var(--danger-accent)">Function has preconditions caller must ensure</text>
  <rect x="44.043" y="268.3871" width="513.8351" height="96.3441" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="300.9606" y="300.043" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="var(--text)">3. Access Mutable Statics</text>
  <text x="66.0645" y="330.3226" font-size="13.7634" fill="var(--text-muted)">static mut COUNTER: u32 = 0;</text>
  <text x="66.0645" y="350.9677" font-size="13.7634" fill="var(--danger-accent)">Data races possible with threads</text>
  <rect x="601.9211" y="268.3871" width="528.5161" height="96.3441" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="866.1792" y="300.043" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="var(--text)">4. Implement Unsafe Traits</text>
  <text x="623.9427" y="330.3226" font-size="13.7634" fill="var(--text-muted)">unsafe impl Send for MyType {}</text>
  <text x="623.9427" y="350.9677" font-size="13.7634" fill="var(--danger-accent)">Promises invariants compiler can't verify</text>
  <rect x="293.6201" y="385.3763" width="587.2401" height="96.3441" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="587.2401" y="417.0323" text-anchor="middle" font-size="16.5161" font-weight="bold" fill="var(--text)">5. Access Union Fields</text>
  <text x="315.6416" y="447.3118" font-size="13.7634" fill="var(--text-muted)">unsafe { my_union.field1 }</text>
  <text x="315.6416" y="467.957" font-size="13.7634" fill="var(--danger-accent)">Wrong field = misinterpreted bytes</text>
  <rect x="44.043" y="509.2473" width="1086.3943" height="130.7527" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="587.2401" y="543.6559" text-anchor="middle" font-size="19.2688" font-weight="bold" fill="var(--ok-accent)">What unsafe Does NOT Disable</text>
  <text x="205.5341" y="578.0645" text-anchor="middle" font-size="15.1398" fill="var(--text-muted)">Borrow checker</text>
  <text x="440.4301" y="578.0645" text-anchor="middle" font-size="15.1398" fill="var(--text-muted)">Type checking</text>
  <text x="675.3262" y="578.0645" text-anchor="middle" font-size="15.1398" fill="var(--text-muted)">Lifetime checking</text>
  <text x="939.5842" y="578.0645" text-anchor="middle" font-size="15.1398" fill="var(--text-muted)">Bounds checking</text>
  <text x="587.2401" y="619.3548" text-anchor="middle" font-size="15.1398" fill="var(--ok-accent)" font-weight="bold">unsafe only unlocks the 5 superpowers above - everything else still enforced!</text>
</svg>
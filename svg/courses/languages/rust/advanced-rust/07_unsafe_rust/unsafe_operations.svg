<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="56.585433135035" rx="6.180220030246" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="75.365922233785" text-anchor="middle" font-size="20.530999951477" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Five Unsafe Superpowers</text>
  <rect x="40" y="117.804837938729" width="567.5675" height="99.024348839979" rx="6.180220030246" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="150.341562784051" text-anchor="middle" font-size="17.59797052879" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1. Dereference Raw Pointers</text>
  <text x="64.3243" y="181.463370642477" font-size="14.664941106103" fill="var(--text-muted)" font-family="Arial, sans-serif">unsafe { *raw_ptr = 42; }</text>
  <text x="64.3243" y="202.682987641281" font-size="14.664941106103" fill="var(--danger-accent)" font-family="Arial, sans-serif">May be null, dangling, or unaligned</text>
  <rect x="656.2162" y="117.804837938729" width="583.7837" height="99.024348839979" rx="6.180220030246" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.1081" y="150.341562784051" text-anchor="middle" font-size="17.59797052879" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">2. Call Unsafe Functions</text>
  <text x="680.5406" y="181.463370642477" font-size="14.664941106103" fill="var(--text-muted)" font-family="Arial, sans-serif">unsafe { dangerous_fn(); }</text>
  <text x="680.5406" y="202.682987641281" font-size="14.664941106103" fill="var(--danger-accent)" font-family="Arial, sans-serif">Function has preconditions caller must ensure</text>
  <rect x="40" y="238.048803777512" width="567.5675" height="99.024348839979" rx="6.180220030246" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="270.585422525279" text-anchor="middle" font-size="17.59797052879" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3. Access Mutable Statics</text>
  <text x="64.3243" y="301.70733648126" font-size="14.664941106103" fill="var(--text-muted)" font-family="Arial, sans-serif">static mut COUNTER: u32 = 0;</text>
  <text x="64.3243" y="322.926847382509" font-size="14.664941106103" fill="var(--danger-accent)" font-family="Arial, sans-serif">Data races possible with threads</text>
  <rect x="656.2162" y="238.048803777512" width="583.7837" height="99.024348839979" rx="6.180220030246" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.1081" y="270.585422525279" text-anchor="middle" font-size="17.59797052879" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">4. Implement Unsafe Traits</text>
  <text x="680.5406" y="301.70733648126" font-size="14.664941106103" fill="var(--text-muted)" font-family="Arial, sans-serif">unsafe impl Send for MyType {}</text>
  <text x="680.5406" y="322.926847382509" font-size="14.664941106103" fill="var(--danger-accent)" font-family="Arial, sans-serif">Promises invariants compiler can't verify</text>
  <rect x="315.6757" y="358.29266351874" width="648.6486" height="99.024348839979" rx="6.180220030246" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="390.829282266507" text-anchor="middle" font-size="17.59797052879" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">5. Access Union Fields</text>
  <text x="340" y="421.951196222488" font-size="14.664941106103" fill="var(--text-muted)" font-family="Arial, sans-serif">unsafe { my_union.field1 }</text>
  <text x="340" y="443.170813221292" font-size="14.664941106103" fill="var(--danger-accent)" font-family="Arial, sans-serif">Wrong field = misinterpreted bytes</text>
  <rect x="40" y="485.609728926236" width="1200" height="134.390271073764" rx="6.180220030246" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="520.975651160021" text-anchor="middle" font-size="20.530999951477" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">What unsafe Does NOT Disable</text>
  <text x="218.3784" y="556.341467296252" text-anchor="middle" font-size="16.13150731928" fill="var(--text-muted)" font-family="Arial, sans-serif">Borrow checker</text>
  <text x="477.8378" y="556.341467296252" text-anchor="middle" font-size="16.13150731928" fill="var(--text-muted)" font-family="Arial, sans-serif">Type checking</text>
  <text x="737.2973" y="556.341467296252" text-anchor="middle" font-size="16.13150731928" fill="var(--text-muted)" font-family="Arial, sans-serif">Lifetime checking</text>
  <text x="1029.1891" y="556.341467296252" text-anchor="middle" font-size="16.13150731928" fill="var(--text-muted)" font-family="Arial, sans-serif">Bounds checking</text>
  <text x="639.9999" y="598.780489098751" text-anchor="middle" font-size="16.13150731928" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">unsafe only unlocks the 5 superpowers above - everything else still enforced!</text>
</svg>

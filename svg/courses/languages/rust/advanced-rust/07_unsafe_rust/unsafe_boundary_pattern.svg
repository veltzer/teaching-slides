<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Unsafe Boundary Pattern</text>
  <!-- Outer safe API -->
  <rect x="50" y="55" width="700" height="350" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#28a745">Safe Public API</text>
  <text x="400" y="100" text-anchor="middle" font-size="11" fill="#555">Users only interact with this layer - all invariants enforced here</text>
  <!-- Safe methods -->
  <rect x="80" y="115" width="200" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="180" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">pub fn new() -&gt; Self</text>
  <text x="180" y="160" text-anchor="middle" font-size="10" fill="#555">Validates inputs</text>
  <rect x="300" y="115" width="200" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="400" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">pub fn get(&amp;self) -&gt; T</text>
  <text x="400" y="160" text-anchor="middle" font-size="10" fill="#555">Bounds checking</text>
  <rect x="520" y="115" width="200" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="620" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">pub fn push(&amp;mut self)</text>
  <text x="620" y="160" text-anchor="middle" font-size="10" fill="#555">Maintains invariants</text>
  <!-- Arrows down -->
  <line x1="180" y1="175" x2="180" y2="210" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="175" x2="400" y2="210" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="175" x2="620" y2="210" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Unsafe internals -->
  <rect x="100" y="215" width="600" height="150" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="400" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">unsafe Internals (private)</text>
  <rect x="130" y="260" width="180" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="220" y="280" text-anchor="middle" font-size="10" fill="#333">Raw pointer manipulation</text>
  <text x="220" y="295" text-anchor="middle" font-size="10" fill="#555">ptr::write, ptr::read</text>
  <rect x="330" y="260" width="180" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="420" y="280" text-anchor="middle" font-size="10" fill="#333">FFI calls</text>
  <text x="420" y="295" text-anchor="middle" font-size="10" fill="#555">libc::malloc, etc.</text>
  <rect x="530" y="260" width="150" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="605" y="280" text-anchor="middle" font-size="10" fill="#333">Transmute</text>
  <text x="605" y="295" text-anchor="middle" font-size="10" fill="#555">Type reinterpretation</text>
  <text x="400" y="340" text-anchor="middle" font-size="11" fill="#dc3545">Safety invariants documented with // SAFETY: comments</text>
  <!-- Example: Vec -->
  <rect x="160" y="380" width="480" height="20" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="400" y="395" text-anchor="middle" font-size="10" fill="#333">Example: Vec&lt;T&gt; is safe API around unsafe { ptr, len, capacity } internals</text>
  <!-- Key principle -->
  <rect x="100" y="415" width="600" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="435" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Minimize unsafe surface area. Safe API must uphold all invariants for soundness.</text>
</svg>
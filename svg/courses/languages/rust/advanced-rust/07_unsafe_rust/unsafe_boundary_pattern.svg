<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="11.2" refX="16" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Unsafe Boundary Pattern</text>
  <rect x="80" y="88" width="1120" height="560" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="640" y="128" text-anchor="middle" font-size="24" font-weight="bold" fill="#28a745">Safe Public API</text>
  <text x="640" y="160" text-anchor="middle" font-size="17.6" fill="#555">Users only interact with this layer - all invariants enforced here</text>
  <rect x="128" y="184" width="320" height="96" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="288" y="224" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">pub fn new() -&gt; Self</text>
  <text x="288" y="256" text-anchor="middle" font-size="16" fill="#555">Validates inputs</text>
  <rect x="480" y="184" width="320" height="96" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="640" y="224" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">pub fn get(&amp;self) -&gt; T</text>
  <text x="640" y="256" text-anchor="middle" font-size="16" fill="#555">Bounds checking</text>
  <rect x="832" y="184" width="320" height="96" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="992" y="224" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">pub fn push(&amp;mut self)</text>
  <text x="992" y="256" text-anchor="middle" font-size="16" fill="#555">Maintains invariants</text>
  <line x1="288" y1="280" x2="288" y2="336" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="640" y1="280" x2="640" y2="336" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="992" y1="280" x2="992" y2="336" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="160" y="344" width="960" height="240" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="640" y="384" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#dc3545">unsafe Internals (private)</text>
  <rect x="208" y="416" width="288" height="72" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="352" y="448" text-anchor="middle" font-size="16" fill="#333">Raw pointer manipulation</text>
  <text x="352" y="472" text-anchor="middle" font-size="16" fill="#555">ptr::write, ptr::read</text>
  <rect x="528" y="416" width="288" height="72" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="672" y="448" text-anchor="middle" font-size="16" fill="#333">FFI calls</text>
  <text x="672" y="472" text-anchor="middle" font-size="16" fill="#555">libc::malloc, etc.</text>
  <rect x="848" y="416" width="240" height="72" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="968" y="448" text-anchor="middle" font-size="16" fill="#333">Transmute</text>
  <text x="968" y="472" text-anchor="middle" font-size="16" fill="#555">Type reinterpretation</text>
  <text x="640" y="544" text-anchor="middle" font-size="17.6" fill="#dc3545">Safety invariants documented with // SAFETY: comments</text>
  <rect x="256" y="608" width="768" height="32" rx="4.8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <text x="640" y="632" text-anchor="middle" font-size="16" fill="#333">Example: Vec&lt;T&gt; is safe API around unsafe { ptr, len, capacity } internals</text>
  <rect x="160" y="664" width="960" height="48" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="640" y="696" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Minimize unsafe surface area. Safe API must uphold all invariants for soundness.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="545.88237785467" rx="6.173948939898" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="80.678" y="74.11762214533" width="345.7626" height="63.686326828141" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="117.333396862743" text-anchor="middle" font-size="21.785293330175" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Type</text>
  <rect x="426.4408" y="74.11762214533" width="772.8813" height="63.686326828141" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="812.8813" y="117.333396862743" text-anchor="middle" font-size="21.785293330175" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Description</text>
  <rect x="80.678" y="149.176560276813" width="345.7626" height="59.137303483274" rx="6.173948939898" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="190.117664498269" text-anchor="middle" font-size="21.785293330175" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">UnsafeCell&lt;T&gt;</text>
  <text x="467.1187" y="190.117664498269" font-size="21.785293330175" fill="var(--text)" font-family="Arial, sans-serif">Foundation - raw unsafe mutation</text>
  <rect x="80.678" y="219.686263298732" width="345.7626" height="59.137303483274" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="260.627367520188" text-anchor="middle" font-size="21.785293330175" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Cell&lt;T&gt;</text>
  <text x="467.1187" y="260.627367520188" font-size="21.785293330175" fill="var(--text)" font-family="Arial, sans-serif">Copy types, no borrows given out</text>
  <rect x="80.678" y="290.196072202999" width="345.7626" height="59.137303483274" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="331.137176424455" text-anchor="middle" font-size="21.785293330175" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">RefCell&lt;T&gt;</text>
  <text x="467.1187" y="331.137176424455" font-size="21.785293330175" fill="var(--text)" font-family="Arial, sans-serif">Runtime borrow checking</text>
  <rect x="80.678" y="360.705881107267" width="345.7626" height="59.137303483274" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="401.647091211071" text-anchor="middle" font-size="21.785293330175" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Mutex&lt;T&gt;</text>
  <text x="467.1187" y="401.647091211071" font-size="21.785293330175" fill="var(--text)" font-family="Arial, sans-serif">Thread-safe locking</text>
  <rect x="80.678" y="431.215690011534" width="345.7626" height="59.137303483274" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="472.15679423299" text-anchor="middle" font-size="21.785293330175" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">RwLock&lt;T&gt;</text>
  <text x="467.1187" y="472.15679423299" font-size="21.785293330175" fill="var(--text)" font-family="Arial, sans-serif">Multiple readers OR one writer</text>
  <rect x="80.678" y="501.725498915801" width="345.7626" height="59.137303483274" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="542.666603137258" text-anchor="middle" font-size="21.785293330175" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Atomic*</text>
  <text x="467.1187" y="542.666603137258" font-size="21.785293330175" fill="var(--text)" font-family="Arial, sans-serif">Lock-free thread-safe mutation</text>
  <text x="640" y="620" text-anchor="middle" font-size="23.765793250946" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">All built on top of UnsafeCell&lt;T&gt;</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.7949" font-weight="bold" fill="var(--text)">Interior Mutability Types</text>
  <rect x="40" y="72.2222" width="1200" height="515.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="80.678" y="104.4444" width="345.7626" height="60.1482" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="145.2593" text-anchor="middle" font-size="21.1715" font-weight="bold" fill="var(--bg)">Type</text>
  <rect x="426.4408" y="104.4444" width="772.8813" height="60.1482" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="812.8813" y="145.2593" text-anchor="middle" font-size="21.1715" font-weight="bold" fill="var(--bg)">Description</text>
  <rect x="80.678" y="175.3334" width="345.7626" height="55.8519" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="214" text-anchor="middle" font-size="21.1715" font-weight="bold" fill="var(--danger-accent)">UnsafeCell&lt;T&gt;</text>
  <text x="467.1187" y="214" font-size="21.1715" fill="var(--text)">Foundation - raw unsafe mutation</text>
  <rect x="80.678" y="241.9259" width="345.7626" height="55.8519" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="280.5925" text-anchor="middle" font-size="21.1715" font-weight="bold" fill="var(--primary-accent)">Cell&lt;T&gt;</text>
  <text x="467.1187" y="280.5925" font-size="21.1715" fill="var(--text)">Copy types, no borrows given out</text>
  <rect x="80.678" y="308.5185" width="345.7626" height="55.8519" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="347.1851" text-anchor="middle" font-size="21.1715" font-weight="bold" fill="var(--primary-accent)">RefCell&lt;T&gt;</text>
  <text x="467.1187" y="347.1851" font-size="21.1715" fill="var(--text)">Runtime borrow checking</text>
  <rect x="80.678" y="375.1111" width="345.7626" height="55.8519" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="413.7778" text-anchor="middle" font-size="21.1715" font-weight="bold" fill="var(--ok-accent)">Mutex&lt;T&gt;</text>
  <text x="467.1187" y="413.7778" font-size="21.1715" fill="var(--text)">Thread-safe locking</text>
  <rect x="80.678" y="441.7037" width="345.7626" height="55.8519" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="480.3703" text-anchor="middle" font-size="21.1715" font-weight="bold" fill="var(--ok-accent)">RwLock&lt;T&gt;</text>
  <text x="467.1187" y="480.3703" font-size="21.1715" fill="var(--text)">Multiple readers OR one writer</text>
  <rect x="80.678" y="508.2963" width="345.7626" height="55.8519" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5595" y="546.9629" text-anchor="middle" font-size="21.1715" font-weight="bold" fill="var(--ok-accent)">Atomic*</text>
  <text x="467.1187" y="546.9629" font-size="21.1715" fill="var(--text)">Lock-free thread-safe mutation</text>
  <text x="640" y="620" text-anchor="middle" font-size="23.0962" fill="var(--danger-accent)" font-weight="bold">All built on top of UnsafeCell&lt;T&gt;</text>
</svg>
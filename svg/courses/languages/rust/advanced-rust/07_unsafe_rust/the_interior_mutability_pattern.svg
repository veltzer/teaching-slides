<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 310" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Interior Mutability Types</text>
  <rect x="30" y="40" width="590" height="240" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <!-- Header -->
  <rect x="50" y="55" width="170" height="28" rx="3" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="135" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Type</text>
  <rect x="220" y="55" width="380" height="28" rx="3" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="410" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Description</text>
  <!-- Rows -->
  <rect x="50" y="88" width="170" height="26" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="135" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">UnsafeCell&lt;T&gt;</text>
  <text x="240" y="106" font-size="11" fill="#333">Foundation - raw unsafe mutation</text>
  <rect x="50" y="119" width="170" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="135" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Cell&lt;T&gt;</text>
  <text x="240" y="137" font-size="11" fill="#333">Copy types, no borrows given out</text>
  <rect x="50" y="150" width="170" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="135" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">RefCell&lt;T&gt;</text>
  <text x="240" y="168" font-size="11" fill="#333">Runtime borrow checking</text>
  <rect x="50" y="181" width="170" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="135" y="199" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Mutex&lt;T&gt;</text>
  <text x="240" y="199" font-size="11" fill="#333">Thread-safe locking</text>
  <rect x="50" y="212" width="170" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="135" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">RwLock&lt;T&gt;</text>
  <text x="240" y="230" font-size="11" fill="#333">Multiple readers OR one writer</text>
  <rect x="50" y="243" width="170" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="135" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Atomic*</text>
  <text x="240" y="261" font-size="11" fill="#333">Lock-free thread-safe mutation</text>
  <!-- Footer note -->
  <text x="325" y="295" text-anchor="middle" font-size="12" fill="#dc3545" font-weight="bold">All built on top of UnsafeCell&lt;T&gt;</text>
</svg>
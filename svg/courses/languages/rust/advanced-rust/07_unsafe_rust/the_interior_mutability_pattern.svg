<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="597.8154" y="54.2373" text-anchor="middle" font-size="29.4309" font-weight="bold" fill="#333">Interior Mutability Types</ns0:text>
  <ns0:rect x="55.1829" y="86.7796" width="1085.265" height="520.678" rx="9.1972" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1.8394" />
  <ns0:rect x="91.9716" y="119.322" width="312.7034" height="60.7458" rx="5.5183" fill="#4a90e2" stroke="#4a90e2" stroke-width="1.8394" />
  <ns0:text x="248.3234" y="160.5424" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="#fff">Type</ns0:text>
  <ns0:rect x="404.6751" y="119.322" width="698.9842" height="60.7458" rx="5.5183" fill="#4a90e2" stroke="#4a90e2" stroke-width="1.8394" />
  <ns0:text x="754.1671" y="160.5424" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="#fff">Description</ns0:text>
  <ns0:rect x="91.9716" y="190.9153" width="312.7034" height="56.4068" rx="5.5183" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8394" />
  <ns0:text x="248.3234" y="229.9661" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="#dc3545">UnsafeCell&lt;T&gt;</ns0:text>
  <ns0:text x="441.4637" y="229.9661" font-size="20.2337" fill="#333">Foundation - raw unsafe mutation</ns0:text>
  <ns0:rect x="91.9716" y="258.1695" width="312.7034" height="56.4068" rx="5.5183" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.8394" />
  <ns0:text x="248.3234" y="297.2203" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="#4a90e2">Cell&lt;T&gt;</ns0:text>
  <ns0:text x="441.4637" y="297.2203" font-size="20.2337" fill="#333">Copy types, no borrows given out</ns0:text>
  <ns0:rect x="91.9716" y="325.4237" width="312.7034" height="56.4068" rx="5.5183" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.8394" />
  <ns0:text x="248.3234" y="364.4745" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="#4a90e2">RefCell&lt;T&gt;</ns0:text>
  <ns0:text x="441.4637" y="364.4745" font-size="20.2337" fill="#333">Runtime borrow checking</ns0:text>
  <ns0:rect x="91.9716" y="392.678" width="312.7034" height="56.4068" rx="5.5183" fill="#d4edda" stroke="#28a745" stroke-width="1.8394" />
  <ns0:text x="248.3234" y="431.7288" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="#28a745">Mutex&lt;T&gt;</ns0:text>
  <ns0:text x="441.4637" y="431.7288" font-size="20.2337" fill="#333">Thread-safe locking</ns0:text>
  <ns0:rect x="91.9716" y="459.9322" width="312.7034" height="56.4068" rx="5.5183" fill="#d4edda" stroke="#28a745" stroke-width="1.8394" />
  <ns0:text x="248.3234" y="498.983" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="#28a745">RwLock&lt;T&gt;</ns0:text>
  <ns0:text x="441.4637" y="498.983" font-size="20.2337" fill="#333">Multiple readers OR one writer</ns0:text>
  <ns0:rect x="91.9716" y="527.1864" width="312.7034" height="56.4068" rx="5.5183" fill="#d4edda" stroke="#28a745" stroke-width="1.8394" />
  <ns0:text x="248.3234" y="566.2372" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="#28a745">Atomic*</ns0:text>
  <ns0:text x="441.4637" y="566.2372" font-size="20.2337" fill="#333">Lock-free thread-safe mutation</ns0:text>
  <ns0:text x="597.8154" y="640" text-anchor="middle" font-size="22.0732" fill="#dc3545" font-weight="bold">All built on top of UnsafeCell&lt;T&gt;</ns0:text>
</ns0:svg>
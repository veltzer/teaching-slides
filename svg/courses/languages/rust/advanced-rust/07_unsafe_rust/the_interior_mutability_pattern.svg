<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="597.8154" y="54.2373" text-anchor="middle" font-size="29.4309" font-weight="bold" fill="var(--text)">Interior Mutability Types</text>
  <rect x="55.1829" y="86.7796" width="1085.265" height="520.678" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="91.9716" y="119.322" width="312.7034" height="60.7458" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="248.3234" y="160.5424" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="var(--bg)">Type</text>
  <rect x="404.6751" y="119.322" width="698.9842" height="60.7458" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="754.1671" y="160.5424" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="var(--bg)">Description</text>
  <rect x="91.9716" y="190.9153" width="312.7034" height="56.4068" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="248.3234" y="229.9661" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="var(--danger-accent)">UnsafeCell&lt;T&gt;</text>
  <text x="441.4637" y="229.9661" font-size="20.2337" fill="var(--text)">Foundation - raw unsafe mutation</text>
  <rect x="91.9716" y="258.1695" width="312.7034" height="56.4068" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="248.3234" y="297.2203" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="var(--primary-accent)">Cell&lt;T&gt;</text>
  <text x="441.4637" y="297.2203" font-size="20.2337" fill="var(--text)">Copy types, no borrows given out</text>
  <rect x="91.9716" y="325.4237" width="312.7034" height="56.4068" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="248.3234" y="364.4745" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="var(--primary-accent)">RefCell&lt;T&gt;</text>
  <text x="441.4637" y="364.4745" font-size="20.2337" fill="var(--text)">Runtime borrow checking</text>
  <rect x="91.9716" y="392.678" width="312.7034" height="56.4068" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="248.3234" y="431.7288" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="var(--ok-accent)">Mutex&lt;T&gt;</text>
  <text x="441.4637" y="431.7288" font-size="20.2337" fill="var(--text)">Thread-safe locking</text>
  <rect x="91.9716" y="459.9322" width="312.7034" height="56.4068" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="248.3234" y="498.983" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="var(--ok-accent)">RwLock&lt;T&gt;</text>
  <text x="441.4637" y="498.983" font-size="20.2337" fill="var(--text)">Multiple readers OR one writer</text>
  <rect x="91.9716" y="527.1864" width="312.7034" height="56.4068" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="248.3234" y="566.2372" text-anchor="middle" font-size="20.2337" font-weight="bold" fill="var(--ok-accent)">Atomic*</text>
  <text x="441.4637" y="566.2372" font-size="20.2337" fill="var(--text)">Lock-free thread-safe mutation</text>
  <text x="597.8154" y="640" text-anchor="middle" font-size="22.0732" fill="var(--danger-accent)" font-weight="bold">All built on top of UnsafeCell&lt;T&gt;</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="50" text-anchor="middle" font-size="31.5077" font-weight="bold" fill="#333">Undefined Behavior in Rust</text>
  <rect x="59.0769" y="80" width="1161.8462" height="610" rx="9.8462" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.9692" />
  <text x="640" y="130" text-anchor="middle" font-size="23.6308" fill="#dc3545" font-weight="bold">The Nomicon: Things You Must Never Do</text>
  <rect x="98.4615" y="160" width="59.0769" height="48" rx="23.6308" fill="#f8d7da" stroke="#dc3545" stroke-width="1.9692" />
  <text x="128" y="194" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="#dc3545">1</text>
  <text x="187.0769" y="194" font-size="21.6615" fill="#333">Dereferencing dangling or unaligned pointers</text>
  <rect x="98.4615" y="220" width="59.0769" height="48" rx="23.6308" fill="#f8d7da" stroke="#dc3545" stroke-width="1.9692" />
  <text x="128" y="254" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="#dc3545">2</text>
  <text x="187.0769" y="254" font-size="21.6615" fill="#333">Breaking aliasing rules (multiple &amp;mut to same data)</text>
  <rect x="98.4615" y="280" width="59.0769" height="48" rx="23.6308" fill="#f8d7da" stroke="#dc3545" stroke-width="1.9692" />
  <text x="128" y="314" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="#dc3545">3</text>
  <text x="187.0769" y="314" font-size="21.6615" fill="#333">Invalid values (null refs, invalid bool/enum)</text>
  <rect x="98.4615" y="340" width="59.0769" height="48" rx="23.6308" fill="#f8d7da" stroke="#dc3545" stroke-width="1.9692" />
  <text x="128" y="374" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="#dc3545">4</text>
  <text x="187.0769" y="374" font-size="21.6615" fill="#333">Unwinding into C code (panic across FFI)</text>
  <rect x="98.4615" y="400" width="59.0769" height="48" rx="23.6308" fill="#f8d7da" stroke="#dc3545" stroke-width="1.9692" />
  <text x="128" y="434" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="#dc3545">5</text>
  <text x="187.0769" y="434" font-size="21.6615" fill="#333">Data races (unsynchronized concurrent mutation)</text>
  <rect x="98.4615" y="460" width="59.0769" height="48" rx="23.6308" fill="#f8d7da" stroke="#dc3545" stroke-width="1.9692" />
  <text x="128" y="494" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="#dc3545">6</text>
  <text x="187.0769" y="494" font-size="21.6615" fill="#333">Reading uninitialized memory</text>
  <rect x="98.4615" y="520" width="59.0769" height="48" rx="23.6308" fill="#f8d7da" stroke="#dc3545" stroke-width="1.9692" />
  <text x="128" y="554" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="#dc3545">7</text>
  <text x="187.0769" y="554" font-size="21.6615" fill="#333">Breaking pointer provenance rules</text>
  <rect x="98.4615" y="580" width="59.0769" height="48" rx="23.6308" fill="#f8d7da" stroke="#dc3545" stroke-width="1.9692" />
  <text x="128" y="614" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="#dc3545">8</text>
  <text x="187.0769" y="614" font-size="21.6615" fill="#333">Calling mismatched function signatures</text>
  <rect x="98.4615" y="640" width="59.0769" height="48" rx="23.6308" fill="#f8d7da" stroke="#dc3545" stroke-width="1.9692" />
  <text x="128" y="674" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="#dc3545">9</text>
  <text x="187.0769" y="674" font-size="21.6615" fill="#333">Producing invalid primitive values</text>
</svg>
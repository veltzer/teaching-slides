<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.4829" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Undefined Behavior in Rust</text>
  <rect x="40" y="67.1875" width="1200" height="552.8125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="112.5" text-anchor="middle" font-size="22.8622" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">The Nomicon: Things You Must Never Do</text>
  <rect x="80.6779" y="139.6875" width="61.017" height="43.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="170.5" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">1</text>
  <text x="172.2033" y="170.5" font-size="20.957" fill="var(--text)" font-family="Arial, sans-serif">Dereferencing dangling or unaligned pointers</text>
  <rect x="80.6779" y="194.0625" width="61.017" height="43.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="224.875" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2</text>
  <text x="172.2033" y="224.875" font-size="20.957" fill="var(--text)" font-family="Arial, sans-serif">Breaking aliasing rules (multiple &amp;mut to same data)</text>
  <rect x="80.6779" y="248.4375" width="61.017" height="43.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="279.25" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3</text>
  <text x="172.2033" y="279.25" font-size="20.957" fill="var(--text)" font-family="Arial, sans-serif">Invalid values (null refs, invalid bool/enum)</text>
  <rect x="80.6779" y="302.8125" width="61.017" height="43.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="333.6251" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">4</text>
  <text x="172.2033" y="333.6251" font-size="20.957" fill="var(--text)" font-family="Arial, sans-serif">Unwinding into C code (panic across FFI)</text>
  <rect x="80.6779" y="357.1875" width="61.017" height="43.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="388" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">5</text>
  <text x="172.2033" y="388" font-size="20.957" fill="var(--text)" font-family="Arial, sans-serif">Data races (unsynchronized concurrent mutation)</text>
  <rect x="80.6779" y="411.5625" width="61.017" height="43.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="442.375" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">6</text>
  <text x="172.2033" y="442.375" font-size="20.957" fill="var(--text)" font-family="Arial, sans-serif">Reading uninitialized memory</text>
  <rect x="80.6779" y="465.9375" width="61.017" height="43.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="496.75" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">7</text>
  <text x="172.2033" y="496.75" font-size="20.957" fill="var(--text)" font-family="Arial, sans-serif">Breaking pointer provenance rules</text>
  <rect x="80.6779" y="520.3125" width="61.017" height="43.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="551.125" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">8</text>
  <text x="172.2033" y="551.125" font-size="20.957" fill="var(--text)" font-family="Arial, sans-serif">Calling mismatched function signatures</text>
  <rect x="80.6779" y="574.6875" width="61.017" height="43.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="605.5" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">9</text>
  <text x="172.2033" y="605.5" font-size="20.957" fill="var(--text)" font-family="Arial, sans-serif">Producing invalid primitive values</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="593.6232" y="46.3768" text-anchor="middle" font-size="29.2245" font-weight="bold" fill="var(--text-dark)">Undefined Behavior in Rust</text>
  <rect x="54.796" y="74.2029" width="1077.6544" height="565.7971" rx="9.1327" fill="var(--surface-light)" stroke="var(--border)" stroke-width="1.8265" />
  <text x="593.6232" y="120.5797" text-anchor="middle" font-size="21.9184" fill="var(--danger-bright)" font-weight="bold">The Nomicon: Things You Must Never Do</text>
  <rect x="91.3266" y="148.4058" width="54.796" height="44.5217" rx="21.9184" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.8265" />
  <text x="118.7246" y="179.942" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-bright)">1</text>
  <text x="173.5206" y="179.942" font-size="20.0918" fill="var(--text-dark)">Dereferencing dangling or unaligned pointers</text>
  <rect x="91.3266" y="204.058" width="54.796" height="44.5217" rx="21.9184" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.8265" />
  <text x="118.7246" y="235.5942" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-bright)">2</text>
  <text x="173.5206" y="235.5942" font-size="20.0918" fill="var(--text-dark)">Breaking aliasing rules (multiple &amp;mut to same data)</text>
  <rect x="91.3266" y="259.7101" width="54.796" height="44.5217" rx="21.9184" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.8265" />
  <text x="118.7246" y="291.2464" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-bright)">3</text>
  <text x="173.5206" y="291.2464" font-size="20.0918" fill="var(--text-dark)">Invalid values (null refs, invalid bool/enum)</text>
  <rect x="91.3266" y="315.3623" width="54.796" height="44.5217" rx="21.9184" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.8265" />
  <text x="118.7246" y="346.8986" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-bright)">4</text>
  <text x="173.5206" y="346.8986" font-size="20.0918" fill="var(--text-dark)">Unwinding into C code (panic across FFI)</text>
  <rect x="91.3266" y="371.0145" width="54.796" height="44.5217" rx="21.9184" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.8265" />
  <text x="118.7246" y="402.5507" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-bright)">5</text>
  <text x="173.5206" y="402.5507" font-size="20.0918" fill="var(--text-dark)">Data races (unsynchronized concurrent mutation)</text>
  <rect x="91.3266" y="426.6667" width="54.796" height="44.5217" rx="21.9184" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.8265" />
  <text x="118.7246" y="458.2029" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-bright)">6</text>
  <text x="173.5206" y="458.2029" font-size="20.0918" fill="var(--text-dark)">Reading uninitialized memory</text>
  <rect x="91.3266" y="482.3188" width="54.796" height="44.5217" rx="21.9184" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.8265" />
  <text x="118.7246" y="513.8551" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-bright)">7</text>
  <text x="173.5206" y="513.8551" font-size="20.0918" fill="var(--text-dark)">Breaking pointer provenance rules</text>
  <rect x="91.3266" y="537.971" width="54.796" height="44.5217" rx="21.9184" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.8265" />
  <text x="118.7246" y="569.5072" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-bright)">8</text>
  <text x="173.5206" y="569.5072" font-size="20.0918" fill="var(--text-dark)">Calling mismatched function signatures</text>
  <rect x="91.3266" y="593.6232" width="54.796" height="44.5217" rx="21.9184" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.8265" />
  <text x="118.7246" y="625.1594" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-bright)">9</text>
  <text x="173.5206" y="625.1594" font-size="20.0918" fill="var(--text-dark)">Producing invalid primitive values</text>
</svg>
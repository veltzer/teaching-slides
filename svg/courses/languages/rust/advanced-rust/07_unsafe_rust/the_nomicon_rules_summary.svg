<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.4829" font-weight="bold" fill="var(--text)">Undefined Behavior in Rust</text>
  <rect x="40" y="67.1875" width="1200" height="552.8125" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="112.5" text-anchor="middle" font-size="22.8622" fill="var(--danger-accent)" font-weight="bold">The Nomicon: Things You Must Never Do</text>
  <rect x="80.6779" y="139.6875" width="61.017" height="43.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="170.5" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)">1</text>
  <text x="172.2033" y="170.5" font-size="20.957" fill="var(--text)">Dereferencing dangling or unaligned pointers</text>
  <rect x="80.6779" y="194.0625" width="61.017" height="43.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="224.875" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)">2</text>
  <text x="172.2033" y="224.875" font-size="20.957" fill="var(--text)">Breaking aliasing rules (multiple &amp;mut to same data)</text>
  <rect x="80.6779" y="248.4375" width="61.017" height="43.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="279.25" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)">3</text>
  <text x="172.2033" y="279.25" font-size="20.957" fill="var(--text)">Invalid values (null refs, invalid bool/enum)</text>
  <rect x="80.6779" y="302.8125" width="61.017" height="43.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="333.6251" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)">4</text>
  <text x="172.2033" y="333.6251" font-size="20.957" fill="var(--text)">Unwinding into C code (panic across FFI)</text>
  <rect x="80.6779" y="357.1875" width="61.017" height="43.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="388" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)">5</text>
  <text x="172.2033" y="388" font-size="20.957" fill="var(--text)">Data races (unsynchronized concurrent mutation)</text>
  <rect x="80.6779" y="411.5625" width="61.017" height="43.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="442.375" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)">6</text>
  <text x="172.2033" y="442.375" font-size="20.957" fill="var(--text)">Reading uninitialized memory</text>
  <rect x="80.6779" y="465.9375" width="61.017" height="43.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="496.75" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)">7</text>
  <text x="172.2033" y="496.75" font-size="20.957" fill="var(--text)">Breaking pointer provenance rules</text>
  <rect x="80.6779" y="520.3125" width="61.017" height="43.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="551.125" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)">8</text>
  <text x="172.2033" y="551.125" font-size="20.957" fill="var(--text)">Calling mismatched function signatures</text>
  <rect x="80.6779" y="574.6875" width="61.017" height="43.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.1864" y="605.5" text-anchor="middle" font-size="19.0518" font-weight="bold" fill="var(--danger-accent)">9</text>
  <text x="172.2033" y="605.5" font-size="20.957" fill="var(--text)">Producing invalid primitive values</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="1240" y="40" text-anchor="middle" font-size="35.863324054792" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">The Nomicon: Things You Must Never Do</text>
  <rect x="40" y="71.182795698925" width="130.909184528915" height="49.892473118279" rx="9.4120401505" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="105.454592264457" y="106.52329749104" text-anchor="middle" font-size="29.886051089881" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">1</text>
  <text x="236.363562247943" y="106.52329749104" font-size="32.874687572337" fill="var(--text)" font-family="Arial, sans-serif">Dereferencing dangling or unaligned pointers</text>
  <rect x="40" y="133.548387096775" width="130.909184528915" height="49.892473118279" rx="9.4120401505" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="105.454592264457" y="168.88888888889" text-anchor="middle" font-size="29.886051089881" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">2</text>
  <text x="236.363562247943" y="168.88888888889" font-size="32.874687572337" fill="var(--text)" font-family="Arial, sans-serif">Breaking aliasing rules (multiple &amp;mut to same data)</text>
  <rect x="40" y="195.913978494624" width="130.909184528915" height="49.892473118279" rx="9.4120401505" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="105.454592264457" y="231.254480286739" text-anchor="middle" font-size="29.886051089881" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3</text>
  <text x="236.363562247943" y="231.254480286739" font-size="32.874687572337" fill="var(--text)" font-family="Arial, sans-serif">Invalid values (null refs, invalid bool/enum)</text>
  <rect x="40" y="258.279569892473" width="130.909184528915" height="49.892473118279" rx="9.4120401505" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="105.454592264457" y="293.620186379928" text-anchor="middle" font-size="29.886051089881" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">4</text>
  <text x="236.363562247943" y="293.620186379928" font-size="32.874687572337" fill="var(--text)" font-family="Arial, sans-serif">Unwinding into C code (panic across FFI)</text>
  <rect x="40" y="320.645161290322" width="130.909184528915" height="49.892473118279" rx="9.4120401505" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="105.454592264457" y="355.985663082437" text-anchor="middle" font-size="29.886051089881" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">5</text>
  <text x="236.363562247943" y="355.985663082437" font-size="32.874687572337" fill="var(--text)" font-family="Arial, sans-serif">Data races (unsynchronized concurrent mutation)</text>
  <rect x="40" y="383.010752688172" width="130.909184528915" height="49.892473118279" rx="9.4120401505" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="105.454592264457" y="418.351254480287" text-anchor="middle" font-size="29.886051089881" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">6</text>
  <text x="236.363562247943" y="418.351254480287" font-size="32.874687572337" fill="var(--text)" font-family="Arial, sans-serif">Reading uninitialized memory</text>
  <rect x="40" y="445.376344086021" width="130.909184528915" height="49.892473118279" rx="9.4120401505" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="105.454592264457" y="480.716845878136" text-anchor="middle" font-size="29.886051089881" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">7</text>
  <text x="236.363562247943" y="480.716845878136" font-size="32.874687572337" fill="var(--text)" font-family="Arial, sans-serif">Breaking pointer provenance rules</text>
  <rect x="40" y="507.741935483871" width="130.909184528915" height="49.892473118279" rx="9.4120401505" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="105.454592264457" y="543.082437275986" text-anchor="middle" font-size="29.886051089881" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">8</text>
  <text x="236.363562247943" y="543.082437275986" font-size="32.874687572337" fill="var(--text)" font-family="Arial, sans-serif">Calling mismatched function signatures</text>
  <rect x="40" y="570.107526881721" width="130.909184528915" height="49.892473118279" rx="9.4120401505" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="105.454592264457" y="605.448028673835" text-anchor="middle" font-size="29.886051089881" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">9</text>
  <text x="236.363562247943" y="605.448028673835" font-size="32.874687572337" fill="var(--text)" font-family="Arial, sans-serif">Producing invalid primitive values</text>
</svg>

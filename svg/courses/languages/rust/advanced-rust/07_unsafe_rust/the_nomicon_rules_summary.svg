<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="593.6232" y="46.3768" text-anchor="middle" font-size="29.2245" font-weight="bold" fill="#333">Undefined Behavior in Rust</ns0:text>
  <ns0:rect x="54.796" y="74.2029" width="1077.6544" height="565.7971" rx="9.1327" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1.8265" />
  <ns0:text x="593.6232" y="120.5797" text-anchor="middle" font-size="21.9184" fill="#dc3545" font-weight="bold">The Nomicon: Things You Must Never Do</ns0:text>
  <ns0:rect x="91.3266" y="148.4058" width="54.796" height="44.5217" rx="21.9184" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8265" />
  <ns0:text x="118.7246" y="179.942" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="#dc3545">1</ns0:text>
  <ns0:text x="173.5206" y="179.942" font-size="20.0918" fill="#333">Dereferencing dangling or unaligned pointers</ns0:text>
  <ns0:rect x="91.3266" y="204.058" width="54.796" height="44.5217" rx="21.9184" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8265" />
  <ns0:text x="118.7246" y="235.5942" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="#dc3545">2</ns0:text>
  <ns0:text x="173.5206" y="235.5942" font-size="20.0918" fill="#333">Breaking aliasing rules (multiple &amp;mut to same data)</ns0:text>
  <ns0:rect x="91.3266" y="259.7101" width="54.796" height="44.5217" rx="21.9184" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8265" />
  <ns0:text x="118.7246" y="291.2464" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="#dc3545">3</ns0:text>
  <ns0:text x="173.5206" y="291.2464" font-size="20.0918" fill="#333">Invalid values (null refs, invalid bool/enum)</ns0:text>
  <ns0:rect x="91.3266" y="315.3623" width="54.796" height="44.5217" rx="21.9184" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8265" />
  <ns0:text x="118.7246" y="346.8986" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="#dc3545">4</ns0:text>
  <ns0:text x="173.5206" y="346.8986" font-size="20.0918" fill="#333">Unwinding into C code (panic across FFI)</ns0:text>
  <ns0:rect x="91.3266" y="371.0145" width="54.796" height="44.5217" rx="21.9184" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8265" />
  <ns0:text x="118.7246" y="402.5507" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="#dc3545">5</ns0:text>
  <ns0:text x="173.5206" y="402.5507" font-size="20.0918" fill="#333">Data races (unsynchronized concurrent mutation)</ns0:text>
  <ns0:rect x="91.3266" y="426.6667" width="54.796" height="44.5217" rx="21.9184" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8265" />
  <ns0:text x="118.7246" y="458.2029" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="#dc3545">6</ns0:text>
  <ns0:text x="173.5206" y="458.2029" font-size="20.0918" fill="#333">Reading uninitialized memory</ns0:text>
  <ns0:rect x="91.3266" y="482.3188" width="54.796" height="44.5217" rx="21.9184" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8265" />
  <ns0:text x="118.7246" y="513.8551" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="#dc3545">7</ns0:text>
  <ns0:text x="173.5206" y="513.8551" font-size="20.0918" fill="#333">Breaking pointer provenance rules</ns0:text>
  <ns0:rect x="91.3266" y="537.971" width="54.796" height="44.5217" rx="21.9184" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8265" />
  <ns0:text x="118.7246" y="569.5072" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="#dc3545">8</ns0:text>
  <ns0:text x="173.5206" y="569.5072" font-size="20.0918" fill="#333">Calling mismatched function signatures</ns0:text>
  <ns0:rect x="91.3266" y="593.6232" width="54.796" height="44.5217" rx="21.9184" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8265" />
  <ns0:text x="118.7246" y="625.1594" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="#dc3545">9</ns0:text>
  <ns0:text x="173.5206" y="625.1594" font-size="20.0918" fill="#333">Producing invalid primitive values</ns0:text>
</ns0:svg>
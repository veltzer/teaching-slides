<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="593.6232" y="46.3768" text-anchor="middle" font-size="29.2245" font-weight="bold" fill="var(--text)">Undefined Behavior in Rust</text>
  <rect x="54.796" y="74.2029" width="1077.6544" height="565.7971" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="593.6232" y="120.5797" text-anchor="middle" font-size="21.9184" fill="var(--danger-accent)" font-weight="bold">The Nomicon: Things You Must Never Do</text>
  <rect x="91.3266" y="148.4058" width="54.796" height="44.5217" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="118.7246" y="179.942" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-accent)">1</text>
  <text x="173.5206" y="179.942" font-size="20.0918" fill="var(--text)">Dereferencing dangling or unaligned pointers</text>
  <rect x="91.3266" y="204.058" width="54.796" height="44.5217" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="118.7246" y="235.5942" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-accent)">2</text>
  <text x="173.5206" y="235.5942" font-size="20.0918" fill="var(--text)">Breaking aliasing rules (multiple &amp;mut to same data)</text>
  <rect x="91.3266" y="259.7101" width="54.796" height="44.5217" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="118.7246" y="291.2464" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-accent)">3</text>
  <text x="173.5206" y="291.2464" font-size="20.0918" fill="var(--text)">Invalid values (null refs, invalid bool/enum)</text>
  <rect x="91.3266" y="315.3623" width="54.796" height="44.5217" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="118.7246" y="346.8986" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-accent)">4</text>
  <text x="173.5206" y="346.8986" font-size="20.0918" fill="var(--text)">Unwinding into C code (panic across FFI)</text>
  <rect x="91.3266" y="371.0145" width="54.796" height="44.5217" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="118.7246" y="402.5507" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-accent)">5</text>
  <text x="173.5206" y="402.5507" font-size="20.0918" fill="var(--text)">Data races (unsynchronized concurrent mutation)</text>
  <rect x="91.3266" y="426.6667" width="54.796" height="44.5217" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="118.7246" y="458.2029" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-accent)">6</text>
  <text x="173.5206" y="458.2029" font-size="20.0918" fill="var(--text)">Reading uninitialized memory</text>
  <rect x="91.3266" y="482.3188" width="54.796" height="44.5217" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="118.7246" y="513.8551" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-accent)">7</text>
  <text x="173.5206" y="513.8551" font-size="20.0918" fill="var(--text)">Breaking pointer provenance rules</text>
  <rect x="91.3266" y="537.971" width="54.796" height="44.5217" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="118.7246" y="569.5072" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-accent)">8</text>
  <text x="173.5206" y="569.5072" font-size="20.0918" fill="var(--text)">Calling mismatched function signatures</text>
  <rect x="91.3266" y="593.6232" width="54.796" height="44.5217" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="118.7246" y="625.1594" text-anchor="middle" font-size="18.2653" font-weight="bold" fill="var(--danger-accent)">9</text>
  <text x="173.5206" y="625.1594" font-size="20.0918" fill="var(--text)">Producing invalid primitive values</text>
</svg>
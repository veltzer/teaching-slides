<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="10.08" refX="16" refY="5.04" orient="auto">
      <polygon points="0,14.4 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowRed" markerWidth="16" markerHeight="10.08" refX="16" refY="5.04" orient="auto">
      <polygon points="0,14.4 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="43.2" text-anchor="middle" font-size="28.8" font-weight="bold" fill="#333">Self-Referential Struct Problem</text>
  <rect x="48" y="79.2" width="480" height="172.8" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.88" />
  <text x="288" y="115.2" text-anchor="middle" font-size="18.72" font-weight="bold" fill="#333">struct SelfRef {</text>
  <text x="80" y="151.2" font-size="15.84" fill="#555">  data: String,</text>
  <text x="80" y="180" font-size="15.84" fill="#dc3545">  slice: &amp;str, // points into data!</text>
  <text x="80" y="208.8" font-size="15.84" fill="#555">}</text>
  <text x="80" y="237.6" font-size="14.4" fill="#dc3545">Cannot express this lifetime in Rust!</text>
  <rect x="640" y="79.2" width="592" height="172.8" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="2.88" />
  <text x="936" y="115.2" text-anchor="middle" font-size="18.72" font-weight="bold" fill="#28a745">Before Move (valid)</text>
  <rect x="672" y="136.8" width="240" height="43.2" rx="4.32" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.44" />
  <text x="792" y="165.6" text-anchor="middle" font-size="14.4" fill="#333">data: "Hello" @ 0x100</text>
  <rect x="672" y="187.2" width="240" height="43.2" rx="4.32" fill="#fff3cd" stroke="#ffc107" stroke-width="1.44" />
  <text x="792" y="216" text-anchor="middle" font-size="14.4" fill="#333">slice: ptr to 0x100</text>
  <line x1="912" y1="208.8" x2="960" y2="208.8" stroke="#28a745" stroke-width="2.16" />
  <line x1="960" y1="208.8" x2="960" y2="158.4" stroke="#28a745" stroke-width="2.16" />
  <line x1="960" y1="158.4" x2="912" y2="158.4" stroke="#28a745" stroke-width="2.16" marker-end="url(#arrow)" />
  <text x="992" y="187.2" font-size="14.4" fill="#28a745">OK!</text>
  <rect x="48" y="302.4" width="592" height="201.6" rx="7.2" fill="#f8d7da" stroke="#dc3545" stroke-width="2.88" />
  <text x="344" y="338.4" text-anchor="middle" font-size="18.72" font-weight="bold" fill="#dc3545">After Move (DANGLING!)</text>
  <rect x="80" y="367.2" width="240" height="43.2" rx="4.32" fill="#f8d7da" stroke="#dc3545" stroke-width="1.44" stroke-dasharray="5.76 2.88" />
  <text x="200" y="396" text-anchor="middle" font-size="14.4" fill="#999">old data (freed)</text>
  <text x="336" y="396" font-size="14.4" fill="#999">@ 0x100</text>
  <rect x="80" y="424.8" width="240" height="43.2" rx="4.32" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.44" />
  <text x="200" y="453.6" text-anchor="middle" font-size="14.4" fill="#333">data: "Hello" @ 0x200</text>
  <rect x="80" y="475.2" width="240" height="43.2" rx="4.32" fill="#f8d7da" stroke="#dc3545" stroke-width="2.16" />
  <text x="200" y="504" text-anchor="middle" font-size="14.4" fill="#dc3545">slice: still 0x100!</text>
  <text x="352" y="489.6" font-size="14.4" fill="#dc3545" font-weight="bold">DANGLING POINTER!</text>
  <rect x="688" y="302.4" width="544" height="201.6" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="2.88" />
  <text x="960" y="338.4" text-anchor="middle" font-size="20.16" font-weight="bold" fill="#333">Solutions</text>
  <text x="712" y="374.4" font-size="15.84" fill="#555">1. Use indices instead of references</text>
  <text x="712" y="406.08" font-size="15.84" fill="#555">2. Pin&lt;Box&lt;T&gt;&gt; - prevent moves</text>
  <text x="712" y="437.76" font-size="15.84" fill="#555">3. ouroboros / self_cell crates</text>
  <text x="712" y="469.44" font-size="15.84" fill="#555">4. Rc&lt;str&gt; / Arc&lt;str&gt; shared ownership</text>
  <rect x="48" y="547.2" width="1184" height="144" rx="7.2" fill="#fff3cd" stroke="#ffc107" stroke-width="2.88" />
  <text x="640" y="583.2" text-anchor="middle" font-size="20.16" font-weight="bold" fill="#333">Pin&lt;P&gt; - The Standard Library Solution</text>
  <text x="80" y="619.2" font-size="15.84" fill="#555">Pin guarantees that the pointed-to value will not be moved in memory.</text>
  <text x="80" y="648" font-size="15.84" fill="#555">Used extensively in async/await: Futures are self-referential (they capture references across .await points).</text>
  <text x="80" y="676.8" font-size="15.84" fill="#555">Unpin trait: types that are safe to move even when pinned (most types). !Unpin = truly pinned.</text>
</svg>
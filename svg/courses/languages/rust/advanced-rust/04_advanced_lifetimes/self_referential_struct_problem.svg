<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="27.4305" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Self-Referential Struct Problem</text>
  <rect x="40" y="72.2222" width="486.4864" height="154.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="283.2433" y="104.4445" text-anchor="middle" font-size="17.8298" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">struct SelfRef {</text>
  <text x="72.4325" y="136.6667" font-size="15.0868" fill="var(--text-muted)" font-family="Arial, sans-serif">  data: String,</text>
  <text x="72.4325" y="162.4445" font-size="15.0868" fill="var(--danger-accent)" font-family="Arial, sans-serif">  slice: &amp;str, // points into data!</text>
  <text x="72.4325" y="188.2222" font-size="15.0868" fill="var(--text-muted)" font-family="Arial, sans-serif">}</text>
  <text x="72.4325" y="214" font-size="13.7152" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cannot express this lifetime in Rust!</text>
  <rect x="640.0001" y="72.2222" width="599.9999" height="154.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.0001" y="104.4445" text-anchor="middle" font-size="17.8298" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Before Move (valid)</text>
  <rect x="672.4325" y="123.7778" width="243.2432" height="38.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.0541" y="149.5555" text-anchor="middle" font-size="13.7152" fill="var(--text)" font-family="Arial, sans-serif">data: "Hello" @ 0x100</text>
  <rect x="672.4325" y="168.8889" width="243.2432" height="38.6667" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.0541" y="194.6667" text-anchor="middle" font-size="13.7152" fill="var(--text)" font-family="Arial, sans-serif">slice: ptr to 0x100</text>
  <line x1="915.6757" y1="188.2222" x2="964.3244" y2="188.2222" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="964.3244" y1="188.2222" x2="964.3244" y2="143.1111" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="964.3244" y1="143.1111" x2="915.6757" y2="143.1111" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="996.7568" y="168.8889" font-size="13.7152" fill="var(--ok-accent)" font-family="Arial, sans-serif">OK!</text>
  <rect x="40" y="272" width="599.9999" height="180.4445" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="304.2222" text-anchor="middle" font-size="17.8298" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">After Move (DANGLING!)</text>
  <rect x="72.4325" y="330" width="243.2432" height="38.6667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5.3333 2.6667" filter="url(#shadow)"/>
  <text x="194.0541" y="355.7778" text-anchor="middle" font-size="13.7152" fill="var(--text-faint)" font-family="Arial, sans-serif">old data (freed)</text>
  <text x="331.8919" y="355.7778" font-size="13.7152" fill="var(--text-faint)" font-family="Arial, sans-serif">@ 0x100</text>
  <rect x="72.4325" y="381.5555" width="243.2432" height="38.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="194.0541" y="407.3333" text-anchor="middle" font-size="13.7152" fill="var(--text)" font-family="Arial, sans-serif">data: "Hello" @ 0x200</text>
  <rect x="72.4325" y="426.6667" width="243.2432" height="38.6667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="194.0541" y="452.4445" text-anchor="middle" font-size="13.7152" fill="var(--danger-accent)" font-family="Arial, sans-serif">slice: still 0x100!</text>
  <text x="348.1081" y="439.5555" font-size="13.7152" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">DANGLING POINTER!</text>
  <rect x="688.6487" y="272" width="551.3513" height="180.4445" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="964.3244" y="304.2222" text-anchor="middle" font-size="19.2014" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Solutions</text>
  <text x="712.9731" y="336.4445" font-size="15.0868" fill="var(--text-muted)" font-family="Arial, sans-serif">1. Use indices instead of references</text>
  <text x="712.9731" y="364.8" font-size="15.0868" fill="var(--text-muted)" font-family="Arial, sans-serif">2. Pin&lt;Box&lt;T&gt;&gt; - prevent moves</text>
  <text x="712.9731" y="393.1555" font-size="15.0868" fill="var(--text-muted)" font-family="Arial, sans-serif">3. ouroboros / self_cell crates</text>
  <text x="712.9731" y="421.5111" font-size="15.0868" fill="var(--text-muted)" font-family="Arial, sans-serif">4. Rc&lt;str&gt; / Arc&lt;str&gt; shared ownership</text>
  <rect x="40" y="491.1111" width="1200" height="128.8889" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="523.3333" text-anchor="middle" font-size="19.2014" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pin&lt;P&gt; - The Standard Library Solution</text>
  <text x="72.4325" y="555.5555" font-size="15.0868" fill="var(--text-muted)" font-family="Arial, sans-serif">Pin guarantees that the pointed-to value will not be moved in memory.</text>
  <text x="72.4325" y="581.3333" font-size="15.0868" fill="var(--text-muted)" font-family="Arial, sans-serif">Used extensively in async/await: Futures are self-referential (they capture references across .await points).</text>
  <text x="72.4325" y="607.1111" font-size="15.0868" fill="var(--text-muted)" font-family="Arial, sans-serif">Unpin trait: types that are safe to move even when pinned (most types). !Unpin = truly pinned.</text>
</svg>
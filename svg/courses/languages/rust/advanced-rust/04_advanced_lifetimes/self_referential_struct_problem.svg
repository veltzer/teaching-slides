<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="592.5926" y="40" text-anchor="middle" font-size="26.6667" font-weight="bold" fill="var(--text)">Self-Referential Struct Problem</text>
  <rect x="44.4444" y="73.3333" width="444.4444" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="266.6667" y="106.6667" text-anchor="middle" font-size="17.3333" font-weight="bold" fill="var(--text)">struct SelfRef {</text>
  <text x="74.0741" y="140" font-size="14.6667" fill="var(--text-muted)">  data: String,</text>
  <text x="74.0741" y="166.6667" font-size="14.6667" fill="var(--danger-accent)">  slice: &amp;str, // points into data!</text>
  <text x="74.0741" y="193.3333" font-size="14.6667" fill="var(--text-muted)">}</text>
  <text x="74.0741" y="220" font-size="13.3333" fill="var(--danger-accent)">Cannot express this lifetime in Rust!</text>
  <rect x="592.5926" y="73.3333" width="548.1481" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="866.6667" y="106.6667" text-anchor="middle" font-size="17.3333" font-weight="bold" fill="var(--ok-accent)">Before Move (valid)</text>
  <rect x="622.2222" y="126.6667" width="222.2222" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="733.3333" y="153.3333" text-anchor="middle" font-size="13.3333" fill="var(--text)">data: "Hello" @ 0x100</text>
  <rect x="622.2222" y="173.3333" width="222.2222" height="40" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="733.3333" y="200" text-anchor="middle" font-size="13.3333" fill="var(--text)">slice: ptr to 0x100</text>
  <line x1="844.4444" y1="193.3333" x2="888.8889" y2="193.3333" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="888.8889" y1="193.3333" x2="888.8889" y2="146.6667" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="888.8889" y1="146.6667" x2="844.4444" y2="146.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="918.5185" y="173.3333" font-size="13.3333" fill="var(--ok-accent)">OK!</text>
  <rect x="44.4444" y="280" width="548.1481" height="186.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="318.5185" y="313.3333" text-anchor="middle" font-size="17.3333" font-weight="bold" fill="var(--danger-accent)">After Move (DANGLING!)</text>
  <rect x="74.0741" y="340" width="222.2222" height="40" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="5.3333 2.6667" />
  <text x="185.1852" y="366.6667" text-anchor="middle" font-size="13.3333" fill="var(--text-faint)">old data (freed)</text>
  <text x="311.1111" y="366.6667" font-size="13.3333" fill="var(--text-faint)">@ 0x100</text>
  <rect x="74.0741" y="393.3333" width="222.2222" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="185.1852" y="420" text-anchor="middle" font-size="13.3333" fill="var(--text)">data: "Hello" @ 0x200</text>
  <rect x="74.0741" y="440" width="222.2222" height="40" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="185.1852" y="466.6667" text-anchor="middle" font-size="13.3333" fill="var(--danger-accent)">slice: still 0x100!</text>
  <text x="325.9259" y="453.3333" font-size="13.3333" fill="var(--danger-accent)" font-weight="bold">DANGLING POINTER!</text>
  <rect x="637.037" y="280" width="503.7037" height="186.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="888.8889" y="313.3333" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--text)">Solutions</text>
  <text x="659.2593" y="346.6667" font-size="14.6667" fill="var(--text-muted)">1. Use indices instead of references</text>
  <text x="659.2593" y="376" font-size="14.6667" fill="var(--text-muted)">2. Pin&lt;Box&lt;T&gt;&gt; - prevent moves</text>
  <text x="659.2593" y="405.3333" font-size="14.6667" fill="var(--text-muted)">3. ouroboros / self_cell crates</text>
  <text x="659.2593" y="434.6667" font-size="14.6667" fill="var(--text-muted)">4. Rc&lt;str&gt; / Arc&lt;str&gt; shared ownership</text>
  <rect x="44.4444" y="506.6667" width="1096.2963" height="133.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="592.5926" y="540" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--text)">Pin&lt;P&gt; - The Standard Library Solution</text>
  <text x="74.0741" y="573.3333" font-size="14.6667" fill="var(--text-muted)">Pin guarantees that the pointed-to value will not be moved in memory.</text>
  <text x="74.0741" y="600" font-size="14.6667" fill="var(--text-muted)">Used extensively in async/await: Futures are self-referential (they capture references across .await points).</text>
  <text x="74.0741" y="626.6667" font-size="14.6667" fill="var(--text-muted)">Unpin trait: types that are safe to move even when pinned (most types). !Unpin = truly pinned.</text>
</svg>
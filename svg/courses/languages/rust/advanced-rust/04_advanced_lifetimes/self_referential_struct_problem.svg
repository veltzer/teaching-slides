<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Self-Referential Struct Problem</text>
  <!-- The struct -->
  <rect x="30" y="55" width="300" height="120" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="180" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">struct SelfRef {</text>
  <text x="50" y="105" font-size="11" fill="#555">  data: String,</text>
  <text x="50" y="125" font-size="11" fill="#dc3545">  slice: &amp;str, // points into data!</text>
  <text x="50" y="145" font-size="11" fill="#555">}</text>
  <text x="50" y="165" font-size="10" fill="#dc3545">Cannot express this lifetime in Rust!</text>
  <!-- Memory before move -->
  <rect x="400" y="55" width="370" height="120" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="585" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Before Move (valid)</text>
  <rect x="420" y="95" width="150" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="495" y="115" text-anchor="middle" font-size="10" fill="#333">data: "Hello" @ 0x100</text>
  <rect x="420" y="130" width="150" height="30" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="495" y="150" text-anchor="middle" font-size="10" fill="#333">slice: ptr to 0x100</text>
  <!-- Self-reference arrow -->
  <line x1="570" y1="145" x2="600" y2="145" stroke="#28a745" stroke-width="1.5"/>
  <line x1="600" y1="145" x2="600" y2="110" stroke="#28a745" stroke-width="1.5"/>
  <line x1="600" y1="110" x2="570" y2="110" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="130" font-size="10" fill="#28a745">OK!</text>
  <!-- After move -->
  <rect x="30" y="210" width="370" height="140" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="215" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">After Move (DANGLING!)</text>
  <rect x="50" y="255" width="150" height="30" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="125" y="275" text-anchor="middle" font-size="10" fill="#999">old data (freed)</text>
  <text x="210" y="275" font-size="10" fill="#999">@ 0x100</text>
  <rect x="50" y="295" width="150" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="125" y="315" text-anchor="middle" font-size="10" fill="#333">data: "Hello" @ 0x200</text>
  <rect x="50" y="330" width="150" height="30" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="125" y="350" text-anchor="middle" font-size="10" fill="#dc3545">slice: still 0x100!</text>
  <text x="220" y="340" font-size="10" fill="#dc3545" font-weight="bold">DANGLING POINTER!</text>
  <!-- Solutions -->
  <rect x="430" y="210" width="340" height="140" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="600" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Solutions</text>
  <text x="445" y="260" font-size="11" fill="#555">1. Use indices instead of references</text>
  <text x="445" y="282" font-size="11" fill="#555">2. Pin&lt;Box&lt;T&gt;&gt; - prevent moves</text>
  <text x="445" y="304" font-size="11" fill="#555">3. ouroboros / self_cell crates</text>
  <text x="445" y="326" font-size="11" fill="#555">4. Rc&lt;str&gt; / Arc&lt;str&gt; shared ownership</text>
  <!-- Pin explanation -->
  <rect x="30" y="380" width="740" height="100" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Pin&lt;P&gt; - The Standard Library Solution</text>
  <text x="50" y="430" font-size="11" fill="#555">Pin guarantees that the pointed-to value will not be moved in memory.</text>
  <text x="50" y="450" font-size="11" fill="#555">Used extensively in async/await: Futures are self-referential (they capture references across .await points).</text>
  <text x="50" y="470" font-size="11" fill="#555">Unpin trait: types that are safe to move even when pinned (most types). !Unpin = truly pinned.</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="16" markerHeight="10.08" refX="16" refY="5.04" orient="auto">
      <ns0:polygon points="0,14.4 5.6,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowRed" markerWidth="16" markerHeight="10.08" refX="16" refY="5.04" orient="auto">
      <ns0:polygon points="0,14.4 5.6,0" fill="#dc3545" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="592.5926" y="40" text-anchor="middle" font-size="26.6667" font-weight="bold" fill="#333">Self-Referential Struct Problem</ns0:text>
  <ns0:rect x="44.4444" y="73.3333" width="444.4444" height="160" rx="6.6667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6667" />
  <ns0:text x="266.6667" y="106.6667" text-anchor="middle" font-size="17.3333" font-weight="bold" fill="#333">struct SelfRef {</ns0:text>
  <ns0:text x="74.0741" y="140" font-size="14.6667" fill="#555">  data: String,</ns0:text>
  <ns0:text x="74.0741" y="166.6667" font-size="14.6667" fill="#dc3545">  slice: &amp;str, // points into data!</ns0:text>
  <ns0:text x="74.0741" y="193.3333" font-size="14.6667" fill="#555">}</ns0:text>
  <ns0:text x="74.0741" y="220" font-size="13.3333" fill="#dc3545">Cannot express this lifetime in Rust!</ns0:text>
  <ns0:rect x="592.5926" y="73.3333" width="548.1481" height="160" rx="6.6667" fill="#d4edda" stroke="#28a745" stroke-width="2.6667" />
  <ns0:text x="866.6667" y="106.6667" text-anchor="middle" font-size="17.3333" font-weight="bold" fill="#28a745">Before Move (valid)</ns0:text>
  <ns0:rect x="622.2222" y="126.6667" width="222.2222" height="40" rx="4" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3333" />
  <ns0:text x="733.3333" y="153.3333" text-anchor="middle" font-size="13.3333" fill="#333">data: "Hello" @ 0x100</ns0:text>
  <ns0:rect x="622.2222" y="173.3333" width="222.2222" height="40" rx="4" fill="#fff3cd" stroke="#ffc107" stroke-width="1.3333" />
  <ns0:text x="733.3333" y="200" text-anchor="middle" font-size="13.3333" fill="#333">slice: ptr to 0x100</ns0:text>
  <ns0:line x1="844.4444" y1="193.3333" x2="888.8889" y2="193.3333" stroke="#28a745" stroke-width="2" />
  <ns0:line x1="888.8889" y1="193.3333" x2="888.8889" y2="146.6667" stroke="#28a745" stroke-width="2" />
  <ns0:line x1="888.8889" y1="146.6667" x2="844.4444" y2="146.6667" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)" />
  <ns0:text x="918.5185" y="173.3333" font-size="13.3333" fill="#28a745">OK!</ns0:text>
  <ns0:rect x="44.4444" y="280" width="548.1481" height="186.6667" rx="6.6667" fill="#f8d7da" stroke="#dc3545" stroke-width="2.6667" />
  <ns0:text x="318.5185" y="313.3333" text-anchor="middle" font-size="17.3333" font-weight="bold" fill="#dc3545">After Move (DANGLING!)</ns0:text>
  <ns0:rect x="74.0741" y="340" width="222.2222" height="40" rx="4" fill="#f8d7da" stroke="#dc3545" stroke-width="1.3333" stroke-dasharray="5.3333 2.6667" />
  <ns0:text x="185.1852" y="366.6667" text-anchor="middle" font-size="13.3333" fill="#999">old data (freed)</ns0:text>
  <ns0:text x="311.1111" y="366.6667" font-size="13.3333" fill="#999">@ 0x100</ns0:text>
  <ns0:rect x="74.0741" y="393.3333" width="222.2222" height="40" rx="4" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3333" />
  <ns0:text x="185.1852" y="420" text-anchor="middle" font-size="13.3333" fill="#333">data: "Hello" @ 0x200</ns0:text>
  <ns0:rect x="74.0741" y="440" width="222.2222" height="40" rx="4" fill="#f8d7da" stroke="#dc3545" stroke-width="2" />
  <ns0:text x="185.1852" y="466.6667" text-anchor="middle" font-size="13.3333" fill="#dc3545">slice: still 0x100!</ns0:text>
  <ns0:text x="325.9259" y="453.3333" font-size="13.3333" fill="#dc3545" font-weight="bold">DANGLING POINTER!</ns0:text>
  <ns0:rect x="637.037" y="280" width="503.7037" height="186.6667" rx="6.6667" fill="#d4edda" stroke="#28a745" stroke-width="2.6667" />
  <ns0:text x="888.8889" y="313.3333" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="#333">Solutions</ns0:text>
  <ns0:text x="659.2593" y="346.6667" font-size="14.6667" fill="#555">1. Use indices instead of references</ns0:text>
  <ns0:text x="659.2593" y="376" font-size="14.6667" fill="#555">2. Pin&lt;Box&lt;T&gt;&gt; - prevent moves</ns0:text>
  <ns0:text x="659.2593" y="405.3333" font-size="14.6667" fill="#555">3. ouroboros / self_cell crates</ns0:text>
  <ns0:text x="659.2593" y="434.6667" font-size="14.6667" fill="#555">4. Rc&lt;str&gt; / Arc&lt;str&gt; shared ownership</ns0:text>
  <ns0:rect x="44.4444" y="506.6667" width="1096.2963" height="133.3333" rx="6.6667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.6667" />
  <ns0:text x="592.5926" y="540" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="#333">Pin&lt;P&gt; - The Standard Library Solution</ns0:text>
  <ns0:text x="74.0741" y="573.3333" font-size="14.6667" fill="#555">Pin guarantees that the pointed-to value will not be moved in memory.</ns0:text>
  <ns0:text x="74.0741" y="600" font-size="14.6667" fill="#555">Used extensively in async/await: Futures are self-referential (they capture references across .await points).</ns0:text>
  <ns0:text x="74.0741" y="626.6667" font-size="14.6667" fill="#555">Unpin trait: types that are safe to move even when pinned (most types). !Unpin = truly pinned.</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.290122420528" font-weight="bold" fill="var(--text)">Self-Referential Struct Problem</text>

  <rect x="40" y="65.663716814159" width="486" height="164.247787610619" rx="6.079124296508" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="101.592920353982" font-family="Courier New, monospace" font-size="15.197810741269" font-weight="bold" fill="var(--primary-text)">struct SelfRef {</text>
  <text x="60" y="132.389380530973" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--primary-text)">  data: String,</text>
  <text x="60" y="160.106194690266" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--primary-text)">  slice: &amp;str,</text>
  <text x="60" y="187.823008849558" font-family="Courier New, monospace" font-size="15.197810741269" font-weight="bold" fill="var(--primary-text)">}</text>
  <text x="60" y="214.513274336283" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--primary-text)">Cannot express this lifetime</text>

  <rect x="640" y="65.663716814159" width="600" height="164.247787610619" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="101.592920353982" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--ok-text)">Before Move</text>
  <rect x="672" y="116.991150442478" width="243" height="39.008849557522" rx="6.079124296508" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="793" y="142.654867256637" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">data @ 0x100</text>
  <rect x="672" y="163.185840707965" width="243" height="39.008849557522" rx="6.079124296508" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="793" y="188.849557522124" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">slice &#8594; 0x100</text>
  <text x="960" y="188.849557522124" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--ok-text)">Valid</text>

  <rect x="40" y="260.70796460177" width="600" height="184.778761061947" rx="6.079124296508" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="296.637168141593" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.224185506772" font-weight="bold" fill="var(--danger-text)">After Move: DANGLING</text>
  <rect x="72" y="317.16814159292" width="243" height="39.008849557522" rx="6.079124296508" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="193" y="342.83185840708" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text-faint)">freed @ 0x100</text>
  <rect x="72" y="368.495575221239" width="243" height="39.008849557522" rx="6.079124296508" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="193" y="394.159292035398" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text)">data @ 0x200</text>
  <rect x="72" y="414.690265486726" width="243" height="20.530973451327" rx="6.079124296508" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1"/>
  <text x="360" y="399.29203539823" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--danger-text)">slice still points to 0x100</text>

  <rect x="688" y="260.70796460177" width="552" height="184.778761061947" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="964" y="296.637168141593" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--ok-text)">Solutions</text>
  <text x="712" y="332.566371681416" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--ok-text)">1. Use indices</text>
  <text x="712" y="363.362831858407" font-family="Courier New, monospace" font-size="15.197810741269" fill="var(--ok-text)">2. Pin&lt;Box&lt;T&gt;&gt;</text>
  <text x="712" y="394.159292035398" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--ok-text)">3. ouroboros crate</text>
  <text x="712" y="424.955752212389" font-family="Courier New, monospace" font-size="15.197810741269" fill="var(--ok-text)">4. Rc&lt;str&gt; / Arc&lt;str&gt;</text>

  <rect x="40" y="476.283185840708" width="1200" height="143.716814159292" rx="6.079124296508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="512.212389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--warn-text)">Pin&lt;P&gt; - stdlib solution</text>
  <text x="70" y="548.141592920354" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--warn-text)">Guarantees the value will not move in memory</text>
  <text x="70" y="578.938053097345" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--warn-text)">Used by async Futures (self-referential across await)</text>
  <text x="70" y="609.734513274336" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--warn-text)">Unpin = safe to move; !Unpin = truly pinned</text>
</svg>

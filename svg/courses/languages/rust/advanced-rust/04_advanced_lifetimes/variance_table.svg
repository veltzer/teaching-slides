<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 370" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Variance Table</text>
  <rect x="30" y="40" width="590" height="315" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <!-- Header -->
  <rect x="50" y="55" width="180" height="28" rx="3" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="140" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Type</text>
  <rect x="230" y="55" width="170" height="28" rx="3" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="315" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Variance in 'a</text>
  <rect x="400" y="55" width="200" height="28" rx="3" fill="#4a90e2" stroke="#4a90e2" stroke-width="1"/>
  <text x="500" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Variance in T</text>
  <!-- Rows -->
  <rect x="50" y="88" width="180" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="140" y="106" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">&amp;'a T</text>
  <text x="315" y="106" text-anchor="middle" font-size="11" fill="#28a745" font-weight="bold">covariant</text>
  <text x="500" y="106" text-anchor="middle" font-size="11" fill="#28a745" font-weight="bold">covariant</text>
  <rect x="50" y="119" width="180" height="26" rx="3" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="140" y="137" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">&amp;'a mut T</text>
  <text x="315" y="137" text-anchor="middle" font-size="11" fill="#28a745" font-weight="bold">covariant</text>
  <text x="500" y="137" text-anchor="middle" font-size="11" fill="#dc3545" font-weight="bold">invariant</text>
  <rect x="50" y="150" width="180" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="140" y="168" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">Box&lt;T&gt;</text>
  <text x="315" y="168" text-anchor="middle" font-size="11" fill="#666">-</text>
  <text x="500" y="168" text-anchor="middle" font-size="11" fill="#28a745" font-weight="bold">covariant</text>
  <rect x="50" y="181" width="180" height="26" rx="3" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="140" y="199" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">Vec&lt;T&gt;</text>
  <text x="315" y="199" text-anchor="middle" font-size="11" fill="#666">-</text>
  <text x="500" y="199" text-anchor="middle" font-size="11" fill="#28a745" font-weight="bold">covariant</text>
  <rect x="50" y="212" width="180" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="140" y="230" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">Cell&lt;T&gt;</text>
  <text x="315" y="230" text-anchor="middle" font-size="11" fill="#666">-</text>
  <text x="500" y="230" text-anchor="middle" font-size="11" fill="#dc3545" font-weight="bold">invariant</text>
  <rect x="50" y="243" width="180" height="26" rx="3" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="140" y="261" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">UnsafeCell&lt;T&gt;</text>
  <text x="315" y="261" text-anchor="middle" font-size="11" fill="#666">-</text>
  <text x="500" y="261" text-anchor="middle" font-size="11" fill="#dc3545" font-weight="bold">invariant</text>
  <rect x="50" y="274" width="180" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="140" y="292" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">fn(T) -&gt; U</text>
  <text x="315" y="292" text-anchor="middle" font-size="11" fill="#666">-</text>
  <text x="500" y="292" text-anchor="middle" font-size="11" fill="#856404" font-weight="bold">contra / co</text>
  <rect x="50" y="305" width="180" height="26" rx="3" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="140" y="323" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">*const T / *mut T</text>
  <text x="315" y="323" text-anchor="middle" font-size="11" fill="#666">-</text>
  <text x="500" y="323" text-anchor="middle" font-size="11" fill="#333">covariant / invariant</text>
</svg>
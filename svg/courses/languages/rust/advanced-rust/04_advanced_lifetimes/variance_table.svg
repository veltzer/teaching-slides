<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.0717" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Variance Table</text>
  <rect x="40" y="66.3636" width="1200" height="553.6364" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="80.6779" y="92.7273" width="366.1016" height="49.2121" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="126.1213" text-anchor="middle" font-size="20.6743" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Type</text>
  <rect x="446.7796" y="92.7273" width="345.7626" height="49.2121" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.661" y="126.1213" text-anchor="middle" font-size="20.6743" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Variance in 'a</text>
  <rect x="792.5423" y="92.7273" width="406.7797" height="49.2121" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.9322" y="126.1213" text-anchor="middle" font-size="20.6743" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Variance in T</text>
  <rect x="80.6779" y="150.7272" width="366.1016" height="45.6969" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="182.3637" text-anchor="middle" font-size="20.6743" fill="var(--text)" font-family="Courier New, monospace">&amp;'a T</text>
  <text x="619.661" y="182.3637" text-anchor="middle" font-size="20.6743" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">covariant</text>
  <text x="995.9322" y="182.3637" text-anchor="middle" font-size="20.6743" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">covariant</text>
  <rect x="80.6779" y="205.2121" width="366.1016" height="45.6969" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.8028"/>
  <text x="263.7288" y="236.8485" text-anchor="middle" font-size="20.6743" fill="var(--text)" font-family="Courier New, monospace">&amp;'a mut T</text>
  <text x="619.661" y="236.8485" text-anchor="middle" font-size="20.6743" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">covariant</text>
  <text x="995.9322" y="236.8485" text-anchor="middle" font-size="20.6743" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">invariant</text>
  <rect x="80.6779" y="259.6969" width="366.1016" height="45.6969" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="291.3333" text-anchor="middle" font-size="20.6743" fill="var(--text)" font-family="Courier New, monospace">Box&lt;T&gt;</text>
  <text x="619.661" y="291.3333" text-anchor="middle" font-size="20.6743" fill="var(--text-muted)" font-family="Arial, sans-serif">-</text>
  <text x="995.9322" y="291.3333" text-anchor="middle" font-size="20.6743" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">covariant</text>
  <rect x="80.6779" y="314.1818" width="366.1016" height="45.6969" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.8028"/>
  <text x="263.7288" y="345.8181" text-anchor="middle" font-size="20.6743" fill="var(--text)" font-family="Courier New, monospace">Vec&lt;T&gt;</text>
  <text x="619.661" y="345.8181" text-anchor="middle" font-size="20.6743" fill="var(--text-muted)" font-family="Arial, sans-serif">-</text>
  <text x="995.9322" y="345.8181" text-anchor="middle" font-size="20.6743" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">covariant</text>
  <rect x="80.6779" y="368.6667" width="366.1016" height="45.6969" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="400.3031" text-anchor="middle" font-size="20.6743" fill="var(--text)" font-family="Courier New, monospace">Cell&lt;T&gt;</text>
  <text x="619.661" y="400.3031" text-anchor="middle" font-size="20.6743" fill="var(--text-muted)" font-family="Arial, sans-serif">-</text>
  <text x="995.9322" y="400.3031" text-anchor="middle" font-size="20.6743" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">invariant</text>
  <rect x="80.6779" y="423.1515" width="366.1016" height="45.6969" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.8028"/>
  <text x="263.7288" y="454.7879" text-anchor="middle" font-size="20.6743" fill="var(--text)" font-family="Courier New, monospace">UnsafeCell&lt;T&gt;</text>
  <text x="619.661" y="454.7879" text-anchor="middle" font-size="20.6743" fill="var(--text-muted)" font-family="Arial, sans-serif">-</text>
  <text x="995.9322" y="454.7879" text-anchor="middle" font-size="20.6743" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">invariant</text>
  <rect x="80.6779" y="477.6363" width="366.1016" height="45.6969" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="509.2727" text-anchor="middle" font-size="20.6743" fill="var(--text)" font-family="Courier New, monospace">fn(T) -&gt; U</text>
  <text x="619.661" y="509.2727" text-anchor="middle" font-size="20.6743" fill="var(--text-muted)" font-family="Arial, sans-serif">-</text>
  <text x="995.9322" y="509.2727" text-anchor="middle" font-size="20.6743" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">contra / co</text>
  <rect x="80.6779" y="532.1213" width="366.1016" height="45.6969" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.8028"/>
  <text x="263.7288" y="563.7575" text-anchor="middle" font-size="20.6743" fill="var(--text)" font-family="Courier New, monospace">*const T / *mut T</text>
  <text x="619.661" y="563.7575" text-anchor="middle" font-size="20.6743" fill="var(--text-muted)" font-family="Arial, sans-serif">-</text>
  <text x="995.9322" y="563.7575" text-anchor="middle" font-size="20.6743" fill="var(--text)" font-family="Arial, sans-serif">covariant / invariant</text>
</svg>

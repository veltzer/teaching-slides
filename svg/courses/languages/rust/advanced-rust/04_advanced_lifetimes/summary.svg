<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.136900101603" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="80.6779" y="66.769092355013" width="345.7626" height="46.400066953854" rx="6.136900101603" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5593" y="98.892296104141" text-anchor="middle" font-size="20.556876552007" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Elision rule 1</text>
  <text x="467.1186" y="98.892296104141" font-size="20.556876552007" fill="var(--text)" font-family="Arial, sans-serif">each param gets own lifetime</text>
  <rect x="80.6779" y="122.092224965671" width="345.7626" height="46.400066953854" rx="6.136900101603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5593" y="154.215324099401" text-anchor="middle" font-size="20.556876552007" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Elision rule 2</text>
  <text x="467.1186" y="154.215324099401" font-size="20.556876552007" fill="var(--text)" font-family="Arial, sans-serif">single input -&gt; all outputs</text>
  <rect x="80.6779" y="177.415357576328" width="345.7626" height="46.400066953854" rx="6.136900101603" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5593" y="209.538352094662" text-anchor="middle" font-size="20.556876552007" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Elision rule 3</text>
  <text x="467.1186" y="209.538352094662" font-size="20.556876552007" fill="var(--text)" font-family="Arial, sans-serif">&amp;self lifetime -&gt; all outputs</text>
  <rect x="80.6779" y="232.738490186986" width="345.7626" height="46.400066953854" rx="6.136900101603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5593" y="264.861484705319" text-anchor="middle" font-size="20.556876552007" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">'static</text>
  <text x="467.1186" y="264.861484705319" font-size="20.556876552007" fill="var(--text)" font-family="Arial, sans-serif">no non-static borrows (or string lits)</text>
  <rect x="80.6779" y="288.061518182246" width="345.7626" height="46.400066953854" rx="6.136900101603" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5593" y="320.184617315977" text-anchor="middle" font-size="20.556876552007" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">T: 'a</text>
  <text x="467.1186" y="320.184617315977" font-size="20.556876552007" fill="var(--text)" font-family="Arial, sans-serif">all refs in T outlive 'a</text>
  <rect x="80.6779" y="343.384546177507" width="345.7626" height="46.400066953854" rx="6.136900101603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5593" y="375.507645311237" text-anchor="middle" font-size="20.556876552007" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">for&lt;'a&gt;</text>
  <text x="467.1186" y="375.507645311237" font-size="20.556876552007" fill="var(--text)" font-family="Arial, sans-serif">works for ALL lifetimes</text>
  <rect x="80.6779" y="398.707678788164" width="345.7626" height="46.400066953854" rx="6.136900101603" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5593" y="430.830673306498" text-anchor="middle" font-size="20.556876552007" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Covariant</text>
  <text x="467.1186" y="430.830673306498" font-size="20.556876552007" fill="var(--text)" font-family="Arial, sans-serif">longer life usable as shorter</text>
  <rect x="80.6779" y="454.030706783425" width="345.7626" height="46.400066953854" rx="6.136900101603" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5593" y="486.153805917155" text-anchor="middle" font-size="20.556876552007" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Invariant</text>
  <text x="467.1186" y="486.153805917155" font-size="20.556876552007" fill="var(--text)" font-family="Arial, sans-serif">exact lifetime match required</text>
  <rect x="80.6779" y="509.353839394082" width="345.7626" height="46.400066953854" rx="6.136900101603" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5593" y="541.476833912416" text-anchor="middle" font-size="20.556876552007" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Self-ref</text>
  <text x="467.1186" y="541.476833912416" font-size="20.556876552007" fill="var(--text)" font-family="Arial, sans-serif">use indices, Pin, or ouroboros</text>
  <rect x="80.6779" y="564.676867389343" width="345.7626" height="46.400066953854" rx="6.136900101603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5593" y="596.80007113847" text-anchor="middle" font-size="20.556876552007" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Reborrowing</text>
  <text x="467.1186" y="596.80007113847" font-size="20.556876552007" fill="var(--text)" font-family="Arial, sans-serif">&amp;mut *r creates shorter-lived &amp;mut</text>
</svg>

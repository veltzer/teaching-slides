<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="47.3684" text-anchor="middle" font-size="30.3158" font-weight="bold" fill="#333">Advanced Lifetimes Cheatsheet</text>
  <rect x="59.0769" y="75.7895" width="1161.8462" height="615.7895" rx="9.4737" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.8947" />
  <rect x="98.4615" y="104.2105" width="334.7692" height="49.2632" rx="5.6842" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.8947" />
  <text x="265.8462" y="138.3158" text-anchor="middle" font-size="20.8421" font-weight="bold" fill="#4a90e2">Elision rule 1</text>
  <text x="472.6154" y="138.3158" font-size="20.8421" fill="#333">each param gets own lifetime</text>
  <rect x="98.4615" y="162.9474" width="334.7692" height="49.2632" rx="5.6842" fill="#d4edda" stroke="#28a745" stroke-width="1.8947" />
  <text x="265.8462" y="197.0526" text-anchor="middle" font-size="20.8421" font-weight="bold" fill="#28a745">Elision rule 2</text>
  <text x="472.6154" y="197.0526" font-size="20.8421" fill="#333">single input -&gt; all outputs</text>
  <rect x="98.4615" y="221.6842" width="334.7692" height="49.2632" rx="5.6842" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.8947" />
  <text x="265.8462" y="255.7895" text-anchor="middle" font-size="20.8421" font-weight="bold" fill="#4a90e2">Elision rule 3</text>
  <text x="472.6154" y="255.7895" font-size="20.8421" fill="#333">&amp;self lifetime -&gt; all outputs</text>
  <rect x="98.4615" y="280.4211" width="334.7692" height="49.2632" rx="5.6842" fill="#d4edda" stroke="#28a745" stroke-width="1.8947" />
  <text x="265.8462" y="314.5263" text-anchor="middle" font-size="20.8421" font-weight="bold" fill="#28a745">'static</text>
  <text x="472.6154" y="314.5263" font-size="20.8421" fill="#333">no non-static borrows (or string lits)</text>
  <rect x="98.4615" y="339.1579" width="334.7692" height="49.2632" rx="5.6842" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.8947" />
  <text x="265.8462" y="373.2632" text-anchor="middle" font-size="20.8421" font-weight="bold" fill="#4a90e2">T: 'a</text>
  <text x="472.6154" y="373.2632" font-size="20.8421" fill="#333">all refs in T outlive 'a</text>
  <rect x="98.4615" y="397.8947" width="334.7692" height="49.2632" rx="5.6842" fill="#d4edda" stroke="#28a745" stroke-width="1.8947" />
  <text x="265.8462" y="432" text-anchor="middle" font-size="20.8421" font-weight="bold" fill="#28a745">for&lt;'a&gt;</text>
  <text x="472.6154" y="432" font-size="20.8421" fill="#333">works for ALL lifetimes</text>
  <rect x="98.4615" y="456.6316" width="334.7692" height="49.2632" rx="5.6842" fill="#fff3cd" stroke="#ffc107" stroke-width="1.8947" />
  <text x="265.8462" y="490.7368" text-anchor="middle" font-size="20.8421" font-weight="bold" fill="#856404">Covariant</text>
  <text x="472.6154" y="490.7368" font-size="20.8421" fill="#333">longer life usable as shorter</text>
  <rect x="98.4615" y="515.3684" width="334.7692" height="49.2632" rx="5.6842" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8947" />
  <text x="265.8462" y="549.4737" text-anchor="middle" font-size="20.8421" font-weight="bold" fill="#dc3545">Invariant</text>
  <text x="472.6154" y="549.4737" font-size="20.8421" fill="#333">exact lifetime match required</text>
  <rect x="98.4615" y="574.1053" width="334.7692" height="49.2632" rx="5.6842" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.8947" />
  <text x="265.8462" y="608.2105" text-anchor="middle" font-size="20.8421" font-weight="bold" fill="#4a90e2">Self-ref</text>
  <text x="472.6154" y="608.2105" font-size="20.8421" fill="#333">use indices, Pin, or ouroboros</text>
  <rect x="98.4615" y="632.8421" width="334.7692" height="49.2632" rx="5.6842" fill="#d4edda" stroke="#28a745" stroke-width="1.8947" />
  <text x="265.8462" y="666.9474" text-anchor="middle" font-size="20.8421" font-weight="bold" fill="#28a745">Reborrowing</text>
  <text x="472.6154" y="666.9474" font-size="20.8421" fill="#333">&amp;mut *r creates shorter-lived &amp;mut</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="592.2678" y="43.8356" text-anchor="middle" font-size="28.0548" font-weight="bold" fill="var(--text)">Advanced Lifetimes Cheatsheet</text>
  <rect x="54.6709" y="70.137" width="1075.194" height="569.863" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="91.1181" y="96.4383" width="309.8016" height="45.5891" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="246.019" y="128" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--primary-accent)">Elision rule 1</text>
  <text x="437.367" y="128" font-size="19.2877" fill="var(--text)">each param gets own lifetime</text>
  <rect x="91.1181" y="150.7945" width="309.8016" height="45.5891" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="246.019" y="182.3561" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--ok-accent)">Elision rule 2</text>
  <text x="437.367" y="182.3561" font-size="19.2877" fill="var(--text)">single input -&gt; all outputs</text>
  <rect x="91.1181" y="205.1507" width="309.8016" height="45.5891" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="246.019" y="236.7123" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--primary-accent)">Elision rule 3</text>
  <text x="437.367" y="236.7123" font-size="19.2877" fill="var(--text)">&amp;self lifetime -&gt; all outputs</text>
  <rect x="91.1181" y="259.5069" width="309.8016" height="45.5891" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="246.019" y="291.0685" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--ok-accent)">'static</text>
  <text x="437.367" y="291.0685" font-size="19.2877" fill="var(--text)">no non-static borrows (or string lits)</text>
  <rect x="91.1181" y="313.863" width="309.8016" height="45.5891" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="246.019" y="345.4247" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--primary-accent)">T: 'a</text>
  <text x="437.367" y="345.4247" font-size="19.2877" fill="var(--text)">all refs in T outlive 'a</text>
  <rect x="91.1181" y="368.2191" width="309.8016" height="45.5891" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="246.019" y="399.7808" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--ok-accent)">for&lt;'a&gt;</text>
  <text x="437.367" y="399.7808" font-size="19.2877" fill="var(--text)">works for ALL lifetimes</text>
  <rect x="91.1181" y="422.5753" width="309.8016" height="45.5891" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="246.019" y="454.1369" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--danger-accent)">Covariant</text>
  <text x="437.367" y="454.1369" font-size="19.2877" fill="var(--text)">longer life usable as shorter</text>
  <rect x="91.1181" y="476.9315" width="309.8016" height="45.5891" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="246.019" y="508.4931" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--danger-accent)">Invariant</text>
  <text x="437.367" y="508.4931" font-size="19.2877" fill="var(--text)">exact lifetime match required</text>
  <rect x="91.1181" y="531.2877" width="309.8016" height="45.5891" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="246.019" y="562.8492" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--primary-accent)">Self-ref</text>
  <text x="437.367" y="562.8492" font-size="19.2877" fill="var(--text)">use indices, Pin, or ouroboros</text>
  <rect x="91.1181" y="585.6438" width="309.8016" height="45.5891" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="246.019" y="617.2055" text-anchor="middle" font-size="19.2877" font-weight="bold" fill="var(--ok-accent)">Reborrowing</text>
  <text x="437.367" y="617.2055" font-size="19.2877" fill="var(--text)">&amp;mut *r creates shorter-lived &amp;mut</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Advanced Lifetimes Cheatsheet</text>
  <rect x="30" y="40" width="590" height="325" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <!-- Rows -->
  <rect x="50" y="55" width="170" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="135" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Elision rule 1</text>
  <text x="240" y="73" font-size="11" fill="#333">each param gets own lifetime</text>
  <rect x="50" y="86" width="170" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="135" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Elision rule 2</text>
  <text x="240" y="104" font-size="11" fill="#333">single input -&gt; all outputs</text>
  <rect x="50" y="117" width="170" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="135" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Elision rule 3</text>
  <text x="240" y="135" font-size="11" fill="#333">&amp;self lifetime -&gt; all outputs</text>
  <rect x="50" y="148" width="170" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="135" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">'static</text>
  <text x="240" y="166" font-size="11" fill="#333">no non-static borrows (or string lits)</text>
  <rect x="50" y="179" width="170" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="135" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">T: 'a</text>
  <text x="240" y="197" font-size="11" fill="#333">all refs in T outlive 'a</text>
  <rect x="50" y="210" width="170" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="135" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">for&lt;'a&gt;</text>
  <text x="240" y="228" font-size="11" fill="#333">works for ALL lifetimes</text>
  <rect x="50" y="241" width="170" height="26" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="135" y="259" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">Covariant</text>
  <text x="240" y="259" font-size="11" fill="#333">longer life usable as shorter</text>
  <rect x="50" y="272" width="170" height="26" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="135" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc3545">Invariant</text>
  <text x="240" y="290" font-size="11" fill="#333">exact lifetime match required</text>
  <rect x="50" y="303" width="170" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="135" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Self-ref</text>
  <text x="240" y="321" font-size="11" fill="#333">use indices, Pin, or ouroboros</text>
  <rect x="50" y="334" width="170" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="135" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Reborrowing</text>
  <text x="240" y="352" font-size="11" fill="#333">&amp;mut *r creates shorter-lived &amp;mut</text>
</svg>
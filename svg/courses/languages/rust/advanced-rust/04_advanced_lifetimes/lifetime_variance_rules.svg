<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="395" height="225.555555555556" rx="10.363754503432" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="77.592592592592" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--ok-text)">Covariant</text>
  <text x="237" y="115.185185185185" text-anchor="middle" font-family="Courier New, monospace" font-size="15.545631755148" fill="var(--ok-text)">&amp;'a T covariant in 'a</text>
  <text x="237" y="152.777777777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--ok-text)">If 'long: 'short,</text>
  <text x="237" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--ok-text)">&amp;'long works as &amp;'short</text>
  <text x="237" y="227.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854461" font-style="italic" fill="var(--ok-text)">Longer is a subtype</text>

  <rect x="445" y="40" width="395" height="225.555555555556" rx="10.363754503432" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="77.592592592592" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--warn-text)">Contravariant</text>
  <text x="642" y="115.185185185185" text-anchor="middle" font-family="Courier New, monospace" font-size="15.545631755148" fill="var(--warn-text)">fn(&amp;'a T)</text>
  <text x="642" y="152.777777777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--warn-text)">If 'long: 'short,</text>
  <text x="642" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--warn-text)">fn(&amp;'short) fits fn(&amp;'long)</text>
  <text x="642" y="227.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854461" font-style="italic" fill="var(--warn-text)">Shorter is a subtype</text>

  <rect x="850" y="40" width="390" height="225.555555555556" rx="10.363754503432" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="77.592592592592" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--danger-text)">Invariant</text>
  <text x="1045" y="115.185185185185" text-anchor="middle" font-family="Courier New, monospace" font-size="15.545631755148" fill="var(--danger-text)">&amp;'a mut T in T</text>
  <text x="1045" y="152.777777777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--danger-text)">No substitution</text>
  <text x="1045" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--danger-text)">Must match exactly</text>
  <text x="1045" y="227.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854461" font-style="italic" fill="var(--danger-text)">Needed for soundness</text>

  <rect x="75" y="297.777777777777" width="1130" height="236.296296296296" rx="10.363754503432" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="335.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106177" font-weight="bold" fill="var(--primary-text)">Variance of Common Types</text>

  <text x="240" y="372.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" font-weight="bold" fill="var(--primary-text)">Type</text>
  <text x="560" y="372.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" font-weight="bold" fill="var(--primary-text)">in 'a</text>
  <text x="935" y="372.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" font-weight="bold" fill="var(--primary-text)">in T</text>

  <text x="240" y="405.185185185185" text-anchor="middle" font-family="Courier New, monospace" font-size="14.509256304804" fill="var(--primary-text)">&amp;'a T</text>
  <text x="560" y="405.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--primary-text)">covariant</text>
  <text x="935" y="405.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--primary-text)">covariant</text>

  <text x="240" y="435.259259259259" text-anchor="middle" font-family="Courier New, monospace" font-size="14.509256304804" fill="var(--primary-text)">&amp;'a mut T</text>
  <text x="560" y="435.259259259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--primary-text)">covariant</text>
  <text x="935" y="435.259259259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--primary-text)">invariant</text>

  <text x="240" y="465.333333333333" text-anchor="middle" font-family="Courier New, monospace" font-size="14.509256304804" fill="var(--primary-text)">Cell&lt;T&gt;</text>
  <text x="560" y="465.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--primary-text)">-</text>
  <text x="935" y="465.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--primary-text)">invariant</text>

  <text x="240" y="495.407407407408" text-anchor="middle" font-family="Courier New, monospace" font-size="14.509256304804" fill="var(--primary-text)">fn(T)-&gt;U</text>
  <text x="560" y="495.407407407408" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--primary-text)">-</text>
  <text x="935" y="495.407407407408" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--primary-text)">T contra, U co</text>

  <rect x="150" y="571.666666666667" width="980" height="48.333333333334" rx="10.363754503432" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="601.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304804" fill="var(--warn-text)">&amp;mut T invariant prevents aliasing tricks</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.227078547234" font-weight="bold" fill="var(--text)">Lifetime Variance Rules</text>

  <rect x="40" y="70.526315789474" width="395" height="213.684210526316" rx="10.087337902782" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="106.140350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--ok-text)">Covariant</text>
  <text x="237" y="141.754385964912" text-anchor="middle" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--ok-text)">&amp;'a T covariant in 'a</text>
  <text x="237" y="177.368421052632" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">If 'long: 'short,</text>
  <text x="237" y="202.80701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">&amp;'long works as &amp;'short</text>
  <text x="237" y="248.59649122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--ok-text)">Longer is a subtype</text>

  <rect x="445" y="70.526315789474" width="395" height="213.684210526316" rx="10.087337902782" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="106.140350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--warn-text)">Contravariant</text>
  <text x="642" y="141.754385964912" text-anchor="middle" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--warn-text)">fn(&amp;'a T)</text>
  <text x="642" y="177.368421052632" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--warn-text)">If 'long: 'short,</text>
  <text x="642" y="202.80701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--warn-text)">fn(&amp;'short) fits fn(&amp;'long)</text>
  <text x="642" y="248.59649122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--warn-text)">Shorter is a subtype</text>

  <rect x="850" y="70.526315789474" width="390" height="213.684210526316" rx="10.087337902782" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="106.140350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--danger-text)">Invariant</text>
  <text x="1045" y="141.754385964912" text-anchor="middle" font-family="Courier New, monospace" font-size="15.131006854174" fill="var(--danger-text)">&amp;'a mut T in T</text>
  <text x="1045" y="177.368421052632" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--danger-text)">No substitution</text>
  <text x="1045" y="202.80701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--danger-text)">Must match exactly</text>
  <text x="1045" y="248.59649122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--danger-text)">Needed for soundness</text>

  <rect x="75" y="314.736842105263" width="1130" height="223.859649122807" rx="10.087337902782" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="350.350877192982" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--primary-text)">Variance of Common Types</text>

  <text x="240" y="385.964912280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--primary-text)">Type</text>
  <text x="560" y="385.964912280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--primary-text)">in 'a</text>
  <text x="935" y="385.964912280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--primary-text)">in T</text>

  <text x="240" y="416.491228070175" text-anchor="middle" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--primary-text)">&amp;'a T</text>
  <text x="560" y="416.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">covariant</text>
  <text x="935" y="416.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">covariant</text>

  <text x="240" y="444.982456140351" text-anchor="middle" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--primary-text)">&amp;'a mut T</text>
  <text x="560" y="444.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">covariant</text>
  <text x="935" y="444.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">invariant</text>

  <text x="240" y="473.473684210526" text-anchor="middle" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--primary-text)">Cell&lt;T&gt;</text>
  <text x="560" y="473.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">-</text>
  <text x="935" y="473.473684210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">invariant</text>

  <text x="240" y="501.964912280702" text-anchor="middle" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--primary-text)">fn(T)-&gt;U</text>
  <text x="560" y="501.964912280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">-</text>
  <text x="935" y="501.964912280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">T contra, U co</text>

  <rect x="150" y="574.21052631579" width="980" height="45.789473684211" rx="10.087337902782" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="602.701754385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--warn-text)">&amp;mut T invariant prevents aliasing tricks</text>
</svg>

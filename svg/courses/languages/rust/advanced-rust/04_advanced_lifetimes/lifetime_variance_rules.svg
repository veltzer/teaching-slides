<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.3124" font-weight="bold" fill="var(--text)">Lifetime Variance Rules</text>
  <rect x="40" y="72.9545" width="372.973" height="210.9091" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="105.9091" text-anchor="middle" font-size="19.8187" font-weight="bold" fill="var(--ok-accent)">Covariant</text>
  <text x="64.3243" y="138.8636" font-size="15.5718" fill="var(--text-muted)">&amp;'a T is covariant in 'a</text>
  <text x="64.3243" y="171.8182" font-size="14.1562" fill="var(--text-muted)">If 'long: 'short, then</text>
  <text x="64.3243" y="198.1818" font-size="14.1562" fill="var(--text-muted)">&amp;'long T can be used</text>
  <text x="64.3243" y="224.5455" font-size="14.1562" fill="var(--text-muted)">where &amp;'short T expected</text>
  <rect x="64.3243" y="237.7273" width="324.3244" height="32.9546" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="260.1363" text-anchor="middle" font-size="14.1562" fill="var(--text)">Longer lifetime is subtype</text>
  <rect x="453.5135" y="72.9545" width="372.973" height="210.9091" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="105.9091" text-anchor="middle" font-size="19.8187" font-weight="bold" fill="var(--text)">Contravariant</text>
  <text x="477.8379" y="138.8636" font-size="15.5718" fill="var(--text-muted)">fn(&amp;'a T) is contra-</text>
  <text x="477.8379" y="165.2273" font-size="15.5718" fill="var(--text-muted)">variant in 'a</text>
  <text x="477.8379" y="198.1818" font-size="14.1562" fill="var(--text-muted)">If 'long: 'short, then</text>
  <text x="477.8379" y="224.5455" font-size="14.1562" fill="var(--text-muted)">fn(&amp;'short) can be used</text>
  <text x="477.8379" y="250.9091" font-size="14.1562" fill="var(--text-muted)">where fn(&amp;'long) expected</text>
  <rect x="477.8379" y="237.7273" width="324.3244" height="32.9546" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="260.1363" text-anchor="middle" font-size="14.1562" fill="var(--text)">Shorter lifetime is subtype</text>
  <rect x="867.027" y="72.9545" width="372.973" height="210.9091" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5136" y="105.9091" text-anchor="middle" font-size="19.8187" font-weight="bold" fill="var(--danger-accent)">Invariant</text>
  <text x="891.3514" y="138.8636" font-size="15.5718" fill="var(--text-muted)">&amp;'a mut T is invariant</text>
  <text x="891.3514" y="165.2273" font-size="15.5718" fill="var(--text-muted)">in T</text>
  <text x="891.3514" y="198.1818" font-size="14.1562" fill="var(--text-muted)">No substitution allowed</text>
  <text x="891.3514" y="224.5455" font-size="14.1562" fill="var(--text-muted)">Must match exactly</text>
  <rect x="891.3514" y="237.7273" width="324.3244" height="32.9546" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5136" y="260.1363" text-anchor="middle" font-size="14.1562" fill="var(--text)">Required for soundness</text>
  <rect x="72.4324" y="316.8182" width="1135.1352" height="237.2728" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="349.7727" text-anchor="middle" font-size="19.8187" font-weight="bold" fill="var(--text)">Variance of Common Types</text>
  <text x="234.5945" y="382.7272" text-anchor="middle" font-size="16.9875" font-weight="bold" fill="var(--text)">Type</text>
  <text x="558.9189" y="382.7272" text-anchor="middle" font-size="16.9875" font-weight="bold" fill="var(--text)">Variance in 'a</text>
  <text x="931.8919" y="382.7272" text-anchor="middle" font-size="16.9875" font-weight="bold" fill="var(--text)">Variance in T</text>
  <line x1="104.8649" y1="393.2727" x2="1175.1352" y2="393.2727" stroke="var(--primary-border)" stroke-width="1.3617" />
  <text x="234.5945" y="419.6364" text-anchor="middle" font-size="15.5718" fill="var(--text-muted)">&amp;'a T</text>
  <text x="558.9189" y="419.6364" text-anchor="middle" font-size="15.5718" fill="var(--ok-accent)">covariant</text>
  <text x="931.8919" y="419.6364" text-anchor="middle" font-size="15.5718" fill="var(--ok-accent)">covariant</text>
  <text x="234.5945" y="448.6363" text-anchor="middle" font-size="15.5718" fill="var(--text-muted)">&amp;'a mut T</text>
  <text x="558.9189" y="448.6363" text-anchor="middle" font-size="15.5718" fill="var(--ok-accent)">covariant</text>
  <text x="931.8919" y="448.6363" text-anchor="middle" font-size="15.5718" fill="var(--danger-accent)">invariant</text>
  <text x="234.5945" y="477.6364" text-anchor="middle" font-size="15.5718" fill="var(--text-muted)">Box&lt;T&gt;</text>
  <text x="558.9189" y="477.6364" text-anchor="middle" font-size="15.5718" fill="var(--text-faint)">N/A</text>
  <text x="931.8919" y="477.6364" text-anchor="middle" font-size="15.5718" fill="var(--ok-accent)">covariant</text>
  <text x="234.5945" y="506.6363" text-anchor="middle" font-size="15.5718" fill="var(--text-muted)">Cell&lt;T&gt;</text>
  <text x="558.9189" y="506.6363" text-anchor="middle" font-size="15.5718" fill="var(--text-faint)">N/A</text>
  <text x="931.8919" y="506.6363" text-anchor="middle" font-size="15.5718" fill="var(--danger-accent)">invariant</text>
  <text x="234.5945" y="535.6364" text-anchor="middle" font-size="15.5718" fill="var(--text-muted)">fn(T) -&gt; U</text>
  <text x="558.9189" y="535.6364" text-anchor="middle" font-size="15.5718" fill="var(--text-faint)">N/A</text>
  <text x="931.8919" y="535.6364" text-anchor="middle" font-size="15.5718" fill="var(--text-muted)">T: contra, U: co</text>
  <rect x="153.5135" y="573.8636" width="972.9731" height="46.1364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="602.8637" text-anchor="middle" font-size="16.9875" fill="var(--text)">&amp;mut T must be invariant in T to prevent aliasing through lifetime tricks</text>
</svg>
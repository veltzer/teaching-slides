<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="580.9929" y="40.8511" text-anchor="middle" font-size="27.234" font-weight="bold" fill="var(--text)">Lifetime Variance Rules</text>
  <rect x="43.5745" y="74.8936" width="334.0709" height="217.8723" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="210.6099" y="108.9362" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="var(--ok-accent)">Covariant</text>
  <text x="65.3617" y="142.9787" font-size="14.9787" fill="var(--text-muted)">&amp;'a T is covariant in 'a</text>
  <text x="65.3617" y="177.0213" font-size="13.617" fill="var(--text-muted)">If 'long: 'short, then</text>
  <text x="65.3617" y="204.2553" font-size="13.617" fill="var(--text-muted)">&amp;'long T can be used</text>
  <text x="65.3617" y="231.4894" font-size="13.617" fill="var(--text-muted)">where &amp;'short T expected</text>
  <rect x="65.3617" y="245.1064" width="290.4965" height="34.0426" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="210.6099" y="268.2553" text-anchor="middle" font-size="13.617" fill="var(--text)">Longer lifetime is subtype</text>
  <rect x="413.9574" y="74.8936" width="334.0709" height="217.8723" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="580.9929" y="108.9362" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="var(--text)">Contravariant</text>
  <text x="435.7447" y="142.9787" font-size="14.9787" fill="var(--text-muted)">fn(&amp;'a T) is contra-</text>
  <text x="435.7447" y="170.2128" font-size="14.9787" fill="var(--text-muted)">variant in 'a</text>
  <text x="435.7447" y="204.2553" font-size="13.617" fill="var(--text-muted)">If 'long: 'short, then</text>
  <text x="435.7447" y="231.4894" font-size="13.617" fill="var(--text-muted)">fn(&amp;'short) can be used</text>
  <text x="435.7447" y="258.7234" font-size="13.617" fill="var(--text-muted)">where fn(&amp;'long) expected</text>
  <rect x="435.7447" y="245.1064" width="290.4965" height="34.0426" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.9929" y="268.2553" text-anchor="middle" font-size="13.617" fill="var(--text)">Shorter lifetime is subtype</text>
  <rect x="784.3404" y="74.8936" width="334.0709" height="217.8723" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="951.3759" y="108.9362" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="var(--danger-accent)">Invariant</text>
  <text x="806.1277" y="142.9787" font-size="14.9787" fill="var(--text-muted)">&amp;'a mut T is invariant</text>
  <text x="806.1277" y="170.2128" font-size="14.9787" fill="var(--text-muted)">in T</text>
  <text x="806.1277" y="204.2553" font-size="13.617" fill="var(--text-muted)">No substitution allowed</text>
  <text x="806.1277" y="231.4894" font-size="13.617" fill="var(--text-muted)">Must match exactly</text>
  <rect x="806.1277" y="245.1064" width="290.4965" height="34.0426" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="951.3759" y="268.2553" text-anchor="middle" font-size="13.617" fill="var(--text)">Required for soundness</text>
  <rect x="72.6241" y="326.8085" width="1016.7376" height="245.1064" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.9929" y="360.8511" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="var(--text)">Variance of Common Types</text>
  <text x="217.8723" y="394.8936" text-anchor="middle" font-size="16.3404" font-weight="bold" fill="var(--text)">Type</text>
  <text x="508.3688" y="394.8936" text-anchor="middle" font-size="16.3404" font-weight="bold" fill="var(--text)">Variance in 'a</text>
  <text x="842.4397" y="394.8936" text-anchor="middle" font-size="16.3404" font-weight="bold" fill="var(--text)">Variance in T</text>
  <line x1="101.6738" y1="405.7872" x2="1060.3121" y2="405.7872" stroke="var(--primary-border)" stroke-width="1.3617" />
  <text x="217.8723" y="433.0213" text-anchor="middle" font-size="14.9787" fill="var(--text-muted)">&amp;'a T</text>
  <text x="508.3688" y="433.0213" text-anchor="middle" font-size="14.9787" fill="var(--ok-accent)">covariant</text>
  <text x="842.4397" y="433.0213" text-anchor="middle" font-size="14.9787" fill="var(--ok-accent)">covariant</text>
  <text x="217.8723" y="462.9787" text-anchor="middle" font-size="14.9787" fill="var(--text-muted)">&amp;'a mut T</text>
  <text x="508.3688" y="462.9787" text-anchor="middle" font-size="14.9787" fill="var(--ok-accent)">covariant</text>
  <text x="842.4397" y="462.9787" text-anchor="middle" font-size="14.9787" fill="var(--danger-accent)">invariant</text>
  <text x="217.8723" y="492.9362" text-anchor="middle" font-size="14.9787" fill="var(--text-muted)">Box&lt;T&gt;</text>
  <text x="508.3688" y="492.9362" text-anchor="middle" font-size="14.9787" fill="var(--text-faint)">N/A</text>
  <text x="842.4397" y="492.9362" text-anchor="middle" font-size="14.9787" fill="var(--ok-accent)">covariant</text>
  <text x="217.8723" y="522.8936" text-anchor="middle" font-size="14.9787" fill="var(--text-muted)">Cell&lt;T&gt;</text>
  <text x="508.3688" y="522.8936" text-anchor="middle" font-size="14.9787" fill="var(--text-faint)">N/A</text>
  <text x="842.4397" y="522.8936" text-anchor="middle" font-size="14.9787" fill="var(--danger-accent)">invariant</text>
  <text x="217.8723" y="552.8511" text-anchor="middle" font-size="14.9787" fill="var(--text-muted)">fn(T) -&gt; U</text>
  <text x="508.3688" y="552.8511" text-anchor="middle" font-size="14.9787" fill="var(--text-faint)">N/A</text>
  <text x="842.4397" y="552.8511" text-anchor="middle" font-size="14.9787" fill="var(--text-muted)">T: contra, U: co</text>
  <rect x="145.2482" y="592.3404" width="871.4894" height="47.6596" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="580.9929" y="622.2979" text-anchor="middle" font-size="16.3404" fill="var(--text)">&amp;mut T must be invariant in T to prevent aliasing through lifetime tricks</text>
</svg>
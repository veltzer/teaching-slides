<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="10.5" refX="16" refY="5.25" orient="auto">
      <polygon points="0,15 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Lifetime Variance Rules</text>
  <rect x="48" y="82.5" width="368" height="240" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="232" y="120" text-anchor="middle" font-size="21" font-weight="bold" fill="#28a745">Covariant</text>
  <text x="72" y="157.5" font-size="16.5" fill="#555">&amp;'a T is covariant in 'a</text>
  <text x="72" y="195" font-size="15" fill="#555">If 'long: 'short, then</text>
  <text x="72" y="225" font-size="15" fill="#555">&amp;'long T can be used</text>
  <text x="72" y="255" font-size="15" fill="#555">where &amp;'short T expected</text>
  <rect x="72" y="270" width="320" height="37.5" rx="4.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="232" y="295.5" text-anchor="middle" font-size="15" fill="#333">Longer lifetime is subtype</text>
  <rect x="456" y="82.5" width="368" height="240" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="640" y="120" text-anchor="middle" font-size="21" font-weight="bold" fill="#333">Contravariant</text>
  <text x="480" y="157.5" font-size="16.5" fill="#555">fn(&amp;'a T) is contra-</text>
  <text x="480" y="187.5" font-size="16.5" fill="#555">variant in 'a</text>
  <text x="480" y="225" font-size="15" fill="#555">If 'long: 'short, then</text>
  <text x="480" y="255" font-size="15" fill="#555">fn(&amp;'short) can be used</text>
  <text x="480" y="285" font-size="15" fill="#555">where fn(&amp;'long) expected</text>
  <rect x="480" y="270" width="320" height="37.5" rx="4.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="640" y="295.5" text-anchor="middle" font-size="15" fill="#333">Shorter lifetime is subtype</text>
  <rect x="864" y="82.5" width="368" height="240" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="3" />
  <text x="1048" y="120" text-anchor="middle" font-size="21" font-weight="bold" fill="#dc3545">Invariant</text>
  <text x="888" y="157.5" font-size="16.5" fill="#555">&amp;'a mut T is invariant</text>
  <text x="888" y="187.5" font-size="16.5" fill="#555">in T</text>
  <text x="888" y="225" font-size="15" fill="#555">No substitution allowed</text>
  <text x="888" y="255" font-size="15" fill="#555">Must match exactly</text>
  <rect x="888" y="270" width="320" height="37.5" rx="4.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="1048" y="295.5" text-anchor="middle" font-size="15" fill="#333">Required for soundness</text>
  <rect x="80" y="360" width="1120" height="270" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="397.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#333">Variance of Common Types</text>
  <text x="240" y="435" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Type</text>
  <text x="560" y="435" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Variance in 'a</text>
  <text x="928" y="435" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Variance in T</text>
  <line x1="112" y1="447" x2="1168" y2="447" stroke="#4a90e2" stroke-width="1.5" />
  <text x="240" y="477" text-anchor="middle" font-size="16.5" fill="#555">&amp;'a T</text>
  <text x="560" y="477" text-anchor="middle" font-size="16.5" fill="#28a745">covariant</text>
  <text x="928" y="477" text-anchor="middle" font-size="16.5" fill="#28a745">covariant</text>
  <text x="240" y="510" text-anchor="middle" font-size="16.5" fill="#555">&amp;'a mut T</text>
  <text x="560" y="510" text-anchor="middle" font-size="16.5" fill="#28a745">covariant</text>
  <text x="928" y="510" text-anchor="middle" font-size="16.5" fill="#dc3545">invariant</text>
  <text x="240" y="543" text-anchor="middle" font-size="16.5" fill="#555">Box&lt;T&gt;</text>
  <text x="560" y="543" text-anchor="middle" font-size="16.5" fill="#999">N/A</text>
  <text x="928" y="543" text-anchor="middle" font-size="16.5" fill="#28a745">covariant</text>
  <text x="240" y="576" text-anchor="middle" font-size="16.5" fill="#555">Cell&lt;T&gt;</text>
  <text x="560" y="576" text-anchor="middle" font-size="16.5" fill="#999">N/A</text>
  <text x="928" y="576" text-anchor="middle" font-size="16.5" fill="#dc3545">invariant</text>
  <text x="240" y="609" text-anchor="middle" font-size="16.5" fill="#555">fn(T) -&gt; U</text>
  <text x="560" y="609" text-anchor="middle" font-size="16.5" fill="#999">N/A</text>
  <text x="928" y="609" text-anchor="middle" font-size="16.5" fill="#555">T: contra, U: co</text>
  <rect x="160" y="652.5" width="960" height="52.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="640" y="685.5" text-anchor="middle" font-size="18" fill="#333">&amp;mut T must be invariant in T to prevent aliasing through lifetime tricks</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.3124" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Lifetime Variance Rules</text>
  <rect x="40" y="72.9545" width="372.973" height="210.9091" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="105.9091" text-anchor="middle" font-size="19.8187" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Covariant</text>
  <text x="64.3243" y="138.8636" font-size="15.5718" fill="var(--text-muted)" font-family="Arial, sans-serif">&amp;'a T is covariant in 'a</text>
  <text x="64.3243" y="171.8182" font-size="14.1562" fill="var(--text-muted)" font-family="Arial, sans-serif">If 'long: 'short, then</text>
  <text x="64.3243" y="198.1818" font-size="14.1562" fill="var(--text-muted)" font-family="Arial, sans-serif">&amp;'long T can be used</text>
  <text x="64.3243" y="224.5455" font-size="14.1562" fill="var(--text-muted)" font-family="Arial, sans-serif">where &amp;'short T expected</text>
  <rect x="64.3243" y="237.7273" width="324.3244" height="32.9546" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="260.1363" text-anchor="middle" font-size="14.1562" fill="var(--text)" font-family="Arial, sans-serif">Longer lifetime is subtype</text>
  <rect x="453.5135" y="72.9545" width="372.973" height="210.9091" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="105.9091" text-anchor="middle" font-size="19.8187" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Contravariant</text>
  <text x="477.8379" y="138.8636" font-size="15.5718" fill="var(--text-muted)" font-family="Arial, sans-serif">fn(&amp;'a T) is contra-</text>
  <text x="477.8379" y="165.2273" font-size="15.5718" fill="var(--text-muted)" font-family="Arial, sans-serif">variant in 'a</text>
  <text x="477.8379" y="198.1818" font-size="14.1562" fill="var(--text-muted)" font-family="Arial, sans-serif">If 'long: 'short, then</text>
  <text x="477.8379" y="224.5455" font-size="14.1562" fill="var(--text-muted)" font-family="Arial, sans-serif">fn(&amp;'short) can be used</text>
  <text x="477.8379" y="250.9091" font-size="14.1562" fill="var(--text-muted)" font-family="Arial, sans-serif">where fn(&amp;'long) expected</text>
  <rect x="477.8379" y="237.7273" width="324.3244" height="32.9546" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="260.1363" text-anchor="middle" font-size="14.1562" fill="var(--text)" font-family="Arial, sans-serif">Shorter lifetime is subtype</text>
  <rect x="867.027" y="72.9545" width="372.973" height="210.9091" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5136" y="105.9091" text-anchor="middle" font-size="19.8187" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Invariant</text>
  <text x="891.3514" y="138.8636" font-size="15.5718" fill="var(--text-muted)" font-family="Arial, sans-serif">&amp;'a mut T is invariant</text>
  <text x="891.3514" y="165.2273" font-size="15.5718" fill="var(--text-muted)" font-family="Arial, sans-serif">in T</text>
  <text x="891.3514" y="198.1818" font-size="14.1562" fill="var(--text-muted)" font-family="Arial, sans-serif">No substitution allowed</text>
  <text x="891.3514" y="224.5455" font-size="14.1562" fill="var(--text-muted)" font-family="Arial, sans-serif">Must match exactly</text>
  <rect x="891.3514" y="237.7273" width="324.3244" height="32.9546" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5136" y="260.1363" text-anchor="middle" font-size="14.1562" fill="var(--text)" font-family="Arial, sans-serif">Required for soundness</text>
  <rect x="72.4324" y="316.8182" width="1135.1352" height="237.2728" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="349.7727" text-anchor="middle" font-size="19.8187" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Variance of Common Types</text>
  <text x="234.5945" y="382.7272" text-anchor="middle" font-size="16.9875" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Type</text>
  <text x="558.9189" y="382.7272" text-anchor="middle" font-size="16.9875" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Variance in 'a</text>
  <text x="931.8919" y="382.7272" text-anchor="middle" font-size="16.9875" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Variance in T</text>
  <line x1="104.8649" y1="393.2727" x2="1175.1352" y2="393.2727" stroke="var(--primary-border)" stroke-width="1.3617" />
  <text x="234.5945" y="419.6364" text-anchor="middle" font-size="15.5718" fill="var(--text-muted)" font-family="Arial, sans-serif">&amp;'a T</text>
  <text x="558.9189" y="419.6364" text-anchor="middle" font-size="15.5718" fill="var(--ok-accent)" font-family="Arial, sans-serif">covariant</text>
  <text x="931.8919" y="419.6364" text-anchor="middle" font-size="15.5718" fill="var(--ok-accent)" font-family="Arial, sans-serif">covariant</text>
  <text x="234.5945" y="448.6363" text-anchor="middle" font-size="15.5718" fill="var(--text-muted)" font-family="Arial, sans-serif">&amp;'a mut T</text>
  <text x="558.9189" y="448.6363" text-anchor="middle" font-size="15.5718" fill="var(--ok-accent)" font-family="Arial, sans-serif">covariant</text>
  <text x="931.8919" y="448.6363" text-anchor="middle" font-size="15.5718" fill="var(--danger-accent)" font-family="Arial, sans-serif">invariant</text>
  <text x="234.5945" y="477.6364" text-anchor="middle" font-size="15.5718" fill="var(--text-muted)" font-family="Arial, sans-serif">Box&lt;T&gt;</text>
  <text x="558.9189" y="477.6364" text-anchor="middle" font-size="15.5718" fill="var(--text-faint)" font-family="Arial, sans-serif">N/A</text>
  <text x="931.8919" y="477.6364" text-anchor="middle" font-size="15.5718" fill="var(--ok-accent)" font-family="Arial, sans-serif">covariant</text>
  <text x="234.5945" y="506.6363" text-anchor="middle" font-size="15.5718" fill="var(--text-muted)" font-family="Arial, sans-serif">Cell&lt;T&gt;</text>
  <text x="558.9189" y="506.6363" text-anchor="middle" font-size="15.5718" fill="var(--text-faint)" font-family="Arial, sans-serif">N/A</text>
  <text x="931.8919" y="506.6363" text-anchor="middle" font-size="15.5718" fill="var(--danger-accent)" font-family="Arial, sans-serif">invariant</text>
  <text x="234.5945" y="535.6364" text-anchor="middle" font-size="15.5718" fill="var(--text-muted)" font-family="Arial, sans-serif">fn(T) -&gt; U</text>
  <text x="558.9189" y="535.6364" text-anchor="middle" font-size="15.5718" fill="var(--text-faint)" font-family="Arial, sans-serif">N/A</text>
  <text x="931.8919" y="535.6364" text-anchor="middle" font-size="15.5718" fill="var(--text-muted)" font-family="Arial, sans-serif">T: contra, U: co</text>
  <rect x="153.5135" y="573.8636" width="972.9731" height="46.1364" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="602.8637" text-anchor="middle" font-size="16.9875" fill="var(--text)" font-family="Arial, sans-serif">&amp;mut T must be invariant in T to prevent aliasing through lifetime tricks</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </ns0:defs>
  <ns0:text x="580.9929" y="40.8511" text-anchor="middle" font-size="27.234" font-weight="bold" fill="#333">Lifetime Variance Rules</ns0:text>
  <ns0:rect x="43.5745" y="74.8936" width="334.0709" height="217.8723" rx="6.8085" fill="#d4edda" stroke="#28a745" stroke-width="2.7234" />
  <ns0:text x="210.6099" y="108.9362" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="#28a745">Covariant</ns0:text>
  <ns0:text x="65.3617" y="142.9787" font-size="14.9787" fill="#555">&amp;'a T is covariant in 'a</ns0:text>
  <ns0:text x="65.3617" y="177.0213" font-size="13.617" fill="#555">If 'long: 'short, then</ns0:text>
  <ns0:text x="65.3617" y="204.2553" font-size="13.617" fill="#555">&amp;'long T can be used</ns0:text>
  <ns0:text x="65.3617" y="231.4894" font-size="13.617" fill="#555">where &amp;'short T expected</ns0:text>
  <ns0:rect x="65.3617" y="245.1064" width="290.4965" height="34.0426" rx="4.0851" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3617" />
  <ns0:text x="210.6099" y="268.2553" text-anchor="middle" font-size="13.617" fill="#333">Longer lifetime is subtype</ns0:text>
  <ns0:rect x="413.9574" y="74.8936" width="334.0709" height="217.8723" rx="6.8085" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7234" />
  <ns0:text x="580.9929" y="108.9362" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="#333">Contravariant</ns0:text>
  <ns0:text x="435.7447" y="142.9787" font-size="14.9787" fill="#555">fn(&amp;'a T) is contra-</ns0:text>
  <ns0:text x="435.7447" y="170.2128" font-size="14.9787" fill="#555">variant in 'a</ns0:text>
  <ns0:text x="435.7447" y="204.2553" font-size="13.617" fill="#555">If 'long: 'short, then</ns0:text>
  <ns0:text x="435.7447" y="231.4894" font-size="13.617" fill="#555">fn(&amp;'short) can be used</ns0:text>
  <ns0:text x="435.7447" y="258.7234" font-size="13.617" fill="#555">where fn(&amp;'long) expected</ns0:text>
  <ns0:rect x="435.7447" y="245.1064" width="290.4965" height="34.0426" rx="4.0851" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3617" />
  <ns0:text x="580.9929" y="268.2553" text-anchor="middle" font-size="13.617" fill="#333">Shorter lifetime is subtype</ns0:text>
  <ns0:rect x="784.3404" y="74.8936" width="334.0709" height="217.8723" rx="6.8085" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7234" />
  <ns0:text x="951.3759" y="108.9362" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="#dc3545">Invariant</ns0:text>
  <ns0:text x="806.1277" y="142.9787" font-size="14.9787" fill="#555">&amp;'a mut T is invariant</ns0:text>
  <ns0:text x="806.1277" y="170.2128" font-size="14.9787" fill="#555">in T</ns0:text>
  <ns0:text x="806.1277" y="204.2553" font-size="13.617" fill="#555">No substitution allowed</ns0:text>
  <ns0:text x="806.1277" y="231.4894" font-size="13.617" fill="#555">Must match exactly</ns0:text>
  <ns0:rect x="806.1277" y="245.1064" width="290.4965" height="34.0426" rx="4.0851" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3617" />
  <ns0:text x="951.3759" y="268.2553" text-anchor="middle" font-size="13.617" fill="#333">Required for soundness</ns0:text>
  <ns0:rect x="72.6241" y="326.8085" width="1016.7376" height="245.1064" rx="6.8085" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7234" />
  <ns0:text x="580.9929" y="360.8511" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="#333">Variance of Common Types</ns0:text>
  <ns0:text x="217.8723" y="394.8936" text-anchor="middle" font-size="16.3404" font-weight="bold" fill="#333">Type</ns0:text>
  <ns0:text x="508.3688" y="394.8936" text-anchor="middle" font-size="16.3404" font-weight="bold" fill="#333">Variance in 'a</ns0:text>
  <ns0:text x="842.4397" y="394.8936" text-anchor="middle" font-size="16.3404" font-weight="bold" fill="#333">Variance in T</ns0:text>
  <ns0:line x1="101.6738" y1="405.7872" x2="1060.3121" y2="405.7872" stroke="#4a90e2" stroke-width="1.3617" />
  <ns0:text x="217.8723" y="433.0213" text-anchor="middle" font-size="14.9787" fill="#555">&amp;'a T</ns0:text>
  <ns0:text x="508.3688" y="433.0213" text-anchor="middle" font-size="14.9787" fill="#28a745">covariant</ns0:text>
  <ns0:text x="842.4397" y="433.0213" text-anchor="middle" font-size="14.9787" fill="#28a745">covariant</ns0:text>
  <ns0:text x="217.8723" y="462.9787" text-anchor="middle" font-size="14.9787" fill="#555">&amp;'a mut T</ns0:text>
  <ns0:text x="508.3688" y="462.9787" text-anchor="middle" font-size="14.9787" fill="#28a745">covariant</ns0:text>
  <ns0:text x="842.4397" y="462.9787" text-anchor="middle" font-size="14.9787" fill="#dc3545">invariant</ns0:text>
  <ns0:text x="217.8723" y="492.9362" text-anchor="middle" font-size="14.9787" fill="#555">Box&lt;T&gt;</ns0:text>
  <ns0:text x="508.3688" y="492.9362" text-anchor="middle" font-size="14.9787" fill="#999">N/A</ns0:text>
  <ns0:text x="842.4397" y="492.9362" text-anchor="middle" font-size="14.9787" fill="#28a745">covariant</ns0:text>
  <ns0:text x="217.8723" y="522.8936" text-anchor="middle" font-size="14.9787" fill="#555">Cell&lt;T&gt;</ns0:text>
  <ns0:text x="508.3688" y="522.8936" text-anchor="middle" font-size="14.9787" fill="#999">N/A</ns0:text>
  <ns0:text x="842.4397" y="522.8936" text-anchor="middle" font-size="14.9787" fill="#dc3545">invariant</ns0:text>
  <ns0:text x="217.8723" y="552.8511" text-anchor="middle" font-size="14.9787" fill="#555">fn(T) -&gt; U</ns0:text>
  <ns0:text x="508.3688" y="552.8511" text-anchor="middle" font-size="14.9787" fill="#999">N/A</ns0:text>
  <ns0:text x="842.4397" y="552.8511" text-anchor="middle" font-size="14.9787" fill="#555">T: contra, U: co</ns0:text>
  <ns0:rect x="145.2482" y="592.3404" width="871.4894" height="47.6596" rx="6.8085" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7234" />
  <ns0:text x="580.9929" y="622.2979" text-anchor="middle" font-size="16.3404" fill="#333">&amp;mut T must be invariant in T to prevent aliasing through lifetime tricks</ns0:text>
</ns0:svg>
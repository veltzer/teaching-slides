<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="31.4874" font-weight="bold" fill="var(--text)">Blanket Implementation Pattern</text>
  <rect x="40" y="82.963" width="461.5385" height="114.5678" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="270.7692" y="118.7655" text-anchor="middle" font-size="20.4667" font-weight="bold" fill="var(--text)">trait Display</text>
  <text x="67.6923" y="151.7038" font-size="17.318" fill="var(--text-muted)">fn fmt(&amp;self, f: &amp;mut Formatter)</text>
  <text x="67.6923" y="180.3457" font-size="17.318" fill="var(--text-muted)">  -&gt; fmt::Result;</text>
  <rect x="316.9231" y="240.4938" width="646.1538" height="114.5678" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="276.2964" text-anchor="middle" font-size="20.4667" font-weight="bold" fill="var(--ok-accent)">Blanket Implementation</text>
  <text x="344.6153" y="309.2346" font-size="17.318" fill="var(--text-muted)">impl&lt;T: Display&gt; ToString for T {</text>
  <text x="363.0769" y="337.8765" font-size="17.318" fill="var(--text-muted)">fn to_string(&amp;self) -&gt; String { ... }</text>
  <rect x="778.4615" y="82.963" width="461.5385" height="114.5678" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1009.2306" y="118.7655" text-anchor="middle" font-size="20.4667" font-weight="bold" fill="var(--text)">trait ToString</text>
  <text x="806.1538" y="151.7038" font-size="17.318" fill="var(--text-muted)">fn to_string(&amp;self) -&gt; String;</text>
  <text x="806.1538" y="180.3457" font-size="15.7436" fill="var(--text-muted)">// automatically available!</text>
  <line x1="270.7692" y1="197.5309" x2="501.5385" y2="240.4938" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="824.6154" y1="240.4938" x2="1009.2306" y2="197.5309" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="412.3457" width="276.9231" height="71.6049" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.4616" y="440.9877" text-anchor="middle" font-size="18.8924" font-weight="bold" fill="var(--text)">i32</text>
  <text x="178.4616" y="466.7654" text-anchor="middle" font-size="15.7436" fill="var(--text-muted)">impl Display</text>
  <rect x="372.3077" y="412.3457" width="276.9231" height="71.6049" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.7692" y="440.9877" text-anchor="middle" font-size="18.8924" font-weight="bold" fill="var(--text)">String</text>
  <text x="510.7692" y="466.7654" text-anchor="middle" font-size="15.7436" fill="var(--text-muted)">impl Display</text>
  <rect x="704.6153" y="412.3457" width="276.9231" height="71.6049" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="843.0769" y="440.9877" text-anchor="middle" font-size="18.8924" font-weight="bold" fill="var(--text)">MyStruct</text>
  <text x="843.0769" y="466.7654" text-anchor="middle" font-size="15.7436" fill="var(--text-muted)">impl Display</text>
  <line x1="501.5385" y1="355.0618" x2="178.4616" y2="412.3457" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="639.9999" y1="355.0618" x2="510.7692" y2="412.3457" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="723.0769" y1="355.0618" x2="843.0769" y2="412.3457" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="639.9999" y="380.8396" text-anchor="middle" font-size="15.7436" fill="var(--ok-accent)">All get ToString for free!</text>
  <rect x="40" y="526.9136" width="1199.9999" height="93.0864" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="562.716" text-anchor="middle" font-size="20.4667" font-weight="bold" fill="var(--text)">Key Insight</text>
  <text x="67.6923" y="595.6543" font-size="17.318" fill="var(--text-muted)">Blanket impls provide trait implementations for ALL types matching a bound.</text>
  <text x="67.6923" y="609.9753" font-size="17.318" fill="var(--text-muted)">This is how the standard library provides ToString for any type implementing Display.</text>
</svg>
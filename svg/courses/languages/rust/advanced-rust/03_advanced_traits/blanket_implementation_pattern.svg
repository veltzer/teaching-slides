<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.5057" y="44.1379" text-anchor="middle" font-size="29.4253" font-weight="bold" fill="var(--text)">Blanket Implementation Pattern</text>
  <rect x="78.4674" y="88.2759" width="392.3372" height="117.7011" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="274.636" y="125.0575" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text)">trait Display</text>
  <text x="102.0076" y="158.8966" font-size="16.1839" fill="var(--text-muted)">fn fmt(&amp;self, f: &amp;mut Formatter)</text>
  <text x="102.0076" y="188.3218" font-size="16.1839" fill="var(--text-muted)">  -&gt; fmt::Result;</text>
  <rect x="313.8697" y="250.1149" width="549.272" height="117.7011" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="588.5057" y="286.8966" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--ok-accent)">Blanket Implementation</text>
  <text x="337.4099" y="320.7356" font-size="16.1839" fill="var(--text-muted)">impl&lt;T: Display&gt; ToString for T {</text>
  <text x="353.1034" y="350.1609" font-size="16.1839" fill="var(--text-muted)">fn to_string(&amp;self) -&gt; String { ... }</text>
  <rect x="706.2069" y="88.2759" width="392.3372" height="117.7011" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="902.3754" y="125.0575" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text)">trait ToString</text>
  <text x="729.7471" y="158.8966" font-size="16.1839" fill="var(--text-muted)">fn to_string(&amp;self) -&gt; String;</text>
  <text x="729.7471" y="188.3218" font-size="14.7126" fill="var(--text-muted)">// automatically available!</text>
  <line x1="274.636" y1="205.977" x2="470.8046" y2="250.1149" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="745.4406" y1="250.1149" x2="902.3754" y2="205.977" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="78.4674" y="426.6667" width="235.4023" height="73.5632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="196.1686" y="456.092" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text)">i32</text>
  <text x="196.1686" y="482.5747" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">impl Display</text>
  <rect x="360.9502" y="426.6667" width="235.4023" height="73.5632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="478.6513" y="456.092" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text)">String</text>
  <text x="478.6513" y="482.5747" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">impl Display</text>
  <rect x="643.4329" y="426.6667" width="235.4023" height="73.5632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="761.1341" y="456.092" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--text)">MyStruct</text>
  <text x="761.1341" y="482.5747" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">impl Display</text>
  <line x1="470.8046" y1="367.8161" x2="196.1686" y2="426.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="588.5057" y1="367.8161" x2="478.6513" y2="426.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="659.1264" y1="367.8161" x2="761.1341" y2="426.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="588.5057" y="394.2989" text-anchor="middle" font-size="14.7126" fill="var(--ok-accent)">All get ToString for free!</text>
  <rect x="78.4674" y="544.3678" width="1020.0766" height="95.6322" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="588.5057" y="581.1494" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text)">Key Insight</text>
  <text x="102.0076" y="614.9885" font-size="16.1839" fill="var(--text-muted)">Blanket impls provide trait implementations for ALL types matching a bound.</text>
  <text x="102.0076" y="629.7011" font-size="16.1839" fill="var(--text-muted)">This is how the standard library provides ToString for any type implementing Display.</text>
</svg>
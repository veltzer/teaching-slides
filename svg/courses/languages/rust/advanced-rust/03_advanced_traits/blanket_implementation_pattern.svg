<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="31.4874" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Blanket Implementation Pattern</text>
  <rect x="40" y="82.963" width="461.5385" height="114.5678" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="270.7692" y="118.7655" text-anchor="middle" font-size="20.4667" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">trait Display</text>
  <text x="67.6923" y="151.7038" font-size="17.318" fill="var(--text-muted)" font-family="Arial, sans-serif">fn fmt(&amp;self, f: &amp;mut Formatter)</text>
  <text x="67.6923" y="180.3457" font-size="17.318" fill="var(--text-muted)" font-family="Arial, sans-serif">  -&gt; fmt::Result;</text>
  <rect x="316.9231" y="240.4938" width="646.1538" height="114.5678" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="276.2964" text-anchor="middle" font-size="20.4667" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Blanket Implementation</text>
  <text x="344.6153" y="309.2346" font-size="17.318" fill="var(--text-muted)" font-family="Arial, sans-serif">impl&lt;T: Display&gt; ToString for T {</text>
  <text x="363.0769" y="337.8765" font-size="17.318" fill="var(--text-muted)" font-family="Arial, sans-serif">fn to_string(&amp;self) -&gt; String { ... }</text>
  <rect x="778.4615" y="82.963" width="461.5385" height="114.5678" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1009.2306" y="118.7655" text-anchor="middle" font-size="20.4667" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">trait ToString</text>
  <text x="806.1538" y="151.7038" font-size="17.318" fill="var(--text-muted)" font-family="Arial, sans-serif">fn to_string(&amp;self) -&gt; String;</text>
  <text x="806.1538" y="180.3457" font-size="15.7436" fill="var(--text-muted)" font-family="Arial, sans-serif">// automatically available!</text>
  <line x1="270.7692" y1="197.5309" x2="501.5385" y2="240.4938" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="824.6154" y1="240.4938" x2="1009.2306" y2="197.5309" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="412.3457" width="276.9231" height="71.6049" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.4616" y="440.9877" text-anchor="middle" font-size="18.8924" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">i32</text>
  <text x="178.4616" y="466.7654" text-anchor="middle" font-size="15.7436" fill="var(--text-muted)" font-family="Arial, sans-serif">impl Display</text>
  <rect x="372.3077" y="412.3457" width="276.9231" height="71.6049" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.7692" y="440.9877" text-anchor="middle" font-size="18.8924" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">String</text>
  <text x="510.7692" y="466.7654" text-anchor="middle" font-size="15.7436" fill="var(--text-muted)" font-family="Arial, sans-serif">impl Display</text>
  <rect x="704.6153" y="412.3457" width="276.9231" height="71.6049" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="843.0769" y="440.9877" text-anchor="middle" font-size="18.8924" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MyStruct</text>
  <text x="843.0769" y="466.7654" text-anchor="middle" font-size="15.7436" fill="var(--text-muted)" font-family="Arial, sans-serif">impl Display</text>
  <line x1="501.5385" y1="355.0618" x2="178.4616" y2="412.3457" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="639.9999" y1="355.0618" x2="510.7692" y2="412.3457" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="723.0769" y1="355.0618" x2="843.0769" y2="412.3457" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="639.9999" y="380.8396" text-anchor="middle" font-size="15.7436" fill="var(--ok-accent)" font-family="Arial, sans-serif">All get ToString for free!</text>
  <rect x="40" y="526.9136" width="1199.9999" height="93.0864" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="562.716" text-anchor="middle" font-size="20.4667" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Insight</text>
  <text x="67.6923" y="595.6543" font-size="17.318" fill="var(--text-muted)" font-family="Arial, sans-serif">Blanket impls provide trait implementations for ALL types matching a bound.</text>
  <text x="67.6923" y="609.9753" font-size="17.318" fill="var(--text-muted)" font-family="Arial, sans-serif">This is how the standard library provides ToString for any type implementing Display.</text>
</svg>
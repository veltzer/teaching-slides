<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="17.0667" markerHeight="11.2" refX="17.0667" refY="5.6" orient="auto">
      <polygon points="0,16 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Blanket Implementation Pattern</text>
  <rect x="85.3333" y="96" width="426.6667" height="128" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="298.6667" y="136" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">trait Display</text>
  <text x="110.9333" y="172.8" font-size="17.6" fill="#555">fn fmt(&amp;self, f: &amp;mut Formatter)</text>
  <text x="110.9333" y="204.8" font-size="17.6" fill="#555">  -&gt; fmt::Result;</text>
  <rect x="341.3333" y="272" width="597.3333" height="128" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="640" y="312" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">Blanket Implementation</text>
  <text x="366.9333" y="348.8" font-size="17.6" fill="#555">impl&lt;T: Display&gt; ToString for T {</text>
  <text x="384" y="380.8" font-size="17.6" fill="#555">fn to_string(&amp;self) -&gt; String { ... }</text>
  <rect x="768" y="96" width="426.6667" height="128" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="981.3333" y="136" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">trait ToString</text>
  <text x="793.6" y="172.8" font-size="17.6" fill="#555">fn to_string(&amp;self) -&gt; String;</text>
  <text x="793.6" y="204.8" font-size="16" fill="#555">// automatically available!</text>
  <line x1="298.6667" y1="224" x2="512" y2="272" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="810.6667" y1="272" x2="981.3333" y2="224" stroke="#ffc107" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="85.3333" y="464" width="256" height="80" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="213.3333" y="496" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">i32</text>
  <text x="213.3333" y="524.8" text-anchor="middle" font-size="16" fill="#555">impl Display</text>
  <rect x="392.5333" y="464" width="256" height="80" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="520.5333" y="496" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">String</text>
  <text x="520.5333" y="524.8" text-anchor="middle" font-size="16" fill="#555">impl Display</text>
  <rect x="699.7333" y="464" width="256" height="80" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="827.7333" y="496" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">MyStruct</text>
  <text x="827.7333" y="524.8" text-anchor="middle" font-size="16" fill="#555">impl Display</text>
  <line x1="512" y1="400" x2="213.3333" y2="464" stroke="#28a745" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="640" y1="400" x2="520.5333" y2="464" stroke="#28a745" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="716.8" y1="400" x2="827.7333" y2="464" stroke="#28a745" stroke-width="2.4" marker-end="url(#arrow)" />
  <text x="640" y="428.8" text-anchor="middle" font-size="16" fill="#28a745">All get ToString for free!</text>
  <rect x="85.3333" y="592" width="1109.3333" height="104" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="640" y="632" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Key Insight</text>
  <text x="110.9333" y="668.8" font-size="17.6" fill="#555">Blanket impls provide trait implementations for ALL types matching a bound.</text>
  <text x="110.9333" y="684.8" font-size="17.6" fill="#555">This is how the standard library provides ToString for any type implementing Display.</text>
</svg>
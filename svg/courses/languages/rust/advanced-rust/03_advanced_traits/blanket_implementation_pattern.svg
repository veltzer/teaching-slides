<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="461.5385" height="123.733232533326" rx="6.235383122261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="270.7692" y="78.666702666669" text-anchor="middle" font-size="21.269619291397" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">trait Display</text>
  <text x="67.6923" y="114.240069120005" font-size="17.997394151886" fill="var(--text-muted)" font-family="Arial, sans-serif">fn fmt(&amp;self, f: &amp;mut Formatter)</text>
  <text x="67.6923" y="145.173323253333" font-size="17.997394151886" fill="var(--text-muted)" font-family="Arial, sans-serif">  -&gt; fmt::Result;</text>
  <rect x="316.9231" y="210.133275733329" width="646.1538" height="123.733232533326" rx="6.235383122261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="248.800086400006" text-anchor="middle" font-size="21.269619291397" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Blanket Implementation</text>
  <text x="344.6153" y="284.373344853334" font-size="17.997394151886" fill="var(--text-muted)" font-family="Arial, sans-serif">impl&lt;T: Display&gt; ToString for T {</text>
  <text x="363.0769" y="315.306598986662" font-size="17.997394151886" fill="var(--text-muted)" font-family="Arial, sans-serif">fn to_string(&amp;self) -&gt; String { ... }</text>
  <rect x="778.4615" y="40" width="461.5385" height="123.733232533326" rx="6.235383122261" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1009.2306" y="78.666702666669" text-anchor="middle" font-size="21.269619291397" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">trait ToString</text>
  <text x="806.1538" y="114.240069120005" font-size="17.997394151886" fill="var(--text-muted)" font-family="Arial, sans-serif">fn to_string(&amp;self) -&gt; String;</text>
  <text x="806.1538" y="145.173323253333" font-size="16.361229620605" fill="var(--text-muted)" font-family="Arial, sans-serif">// automatically available!</text>
  <line x1="270.7692" y1="163.733340533334" x2="501.5385" y2="210.133275733329" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="824.6154" y1="210.133275733329" x2="1009.2306" y2="163.733340533334" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="395.733340533334" width="276.9231" height="77.333297333331" rx="6.235383122261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178.4616" y="426.666702666669" text-anchor="middle" font-size="19.633558683168" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">i32</text>
  <text x="178.4616" y="454.506620586663" text-anchor="middle" font-size="16.361229620605" fill="var(--text-muted)" font-family="Arial, sans-serif">impl Display</text>
  <rect x="372.3077" y="395.733340533334" width="276.9231" height="77.333297333331" rx="6.235383122261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.7692" y="426.666702666669" text-anchor="middle" font-size="19.633558683168" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">String</text>
  <text x="510.7692" y="454.506620586663" text-anchor="middle" font-size="16.361229620605" fill="var(--text-muted)" font-family="Arial, sans-serif">impl Display</text>
  <rect x="704.6153" y="395.733340533334" width="276.9231" height="77.333297333331" rx="6.235383122261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="843.0769" y="426.666702666669" text-anchor="middle" font-size="19.633558683168" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MyStruct</text>
  <text x="843.0769" y="454.506620586663" text-anchor="middle" font-size="16.361229620605" fill="var(--text-muted)" font-family="Arial, sans-serif">impl Display</text>
  <line x1="501.5385" y1="333.866724266671" x2="178.4616" y2="395.733340533334" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="639.9999" y1="333.866724266671" x2="510.7692" y2="395.733340533334" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="723.0769" y1="333.866724266671" x2="843.0769" y2="395.733340533334" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="639.9999" y="361.706750186672" text-anchor="middle" font-size="16.361229620605" fill="var(--ok-accent)" font-family="Arial, sans-serif">All get ToString for free!</text>
  <rect x="40" y="519.466681066668" width="1199.9999" height="100.533318933332" rx="6.235383122261" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="558.133275733329" text-anchor="middle" font-size="21.269619291397" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Insight</text>
  <text x="67.6923" y="593.706642186665" font-size="17.997394151886" fill="var(--text-muted)" font-family="Arial, sans-serif">Blanket impls provide trait implementations for ALL types matching a bound.</text>
  <text x="67.6923" y="609.173323253332" font-size="17.997394151886" fill="var(--text-muted)" font-family="Arial, sans-serif">This is how the standard library provides ToString for any type implementing Display.</text>
</svg>

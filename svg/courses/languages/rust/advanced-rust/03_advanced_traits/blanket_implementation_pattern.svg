  <ns0:text x="761.1341" y="482.5747" text-anchor="middle" font-size="14.7126" fill="#555">impl Display</ns0:text>
  <ns0:line x1="470.8046" y1="367.8161" x2="196.1686" y2="426.6667" stroke="#28a745" stroke-width="2.2069" marker-end="url(#arrow)" />

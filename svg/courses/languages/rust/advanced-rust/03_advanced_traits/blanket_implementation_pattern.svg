  <ns0:text x="274.636" y="125.0575" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">trait Display</ns0:text>
  <ns0:text x="102.0076" y="158.8966" font-size="16.1839" fill="#555">fn fmt(&amp;self, f: &amp;mut Formatter)</ns0:text>
  <ns0:text x="102.0076" y="188.3218" font-size="16.1839" fill="#555">  -&gt; fmt::Result;</ns0:text>
  <ns0:rect x="313.8697" y="250.1149" width="549.272" height="117.7011" rx="7.3563" fill="#d4edda" stroke="#28a745" stroke-width="2.9425" />
  <ns0:text x="588.5057" y="286.8966" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#28a745">Blanket Implementation</ns0:text>
  <ns0:text x="337.4099" y="320.7356" font-size="16.1839" fill="#555">impl&lt;T: Display&gt; ToString for T {</ns0:text>
  <ns0:text x="353.1034" y="350.1609" font-size="16.1839" fill="#555">fn to_string(&amp;self) -&gt; String { ... }</ns0:text>
  <ns0:rect x="706.2069" y="88.2759" width="392.3372" height="117.7011" rx="7.3563" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9425" />
  <ns0:text x="902.3754" y="125.0575" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">trait ToString</ns0:text>
  <ns0:text x="729.7471" y="158.8966" font-size="16.1839" fill="#555">fn to_string(&amp;self) -&gt; String;</ns0:text>
  <ns0:text x="729.7471" y="188.3218" font-size="14.7126" fill="#555">// automatically available!</ns0:text>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </ns0:defs>
  <ns0:text x="588.5057" y="44.1379" text-anchor="middle" font-size="29.4253" font-weight="bold" fill="#333">Blanket Implementation Pattern</ns0:text>
  <ns0:rect x="78.4674" y="88.2759" width="392.3372" height="117.7011" rx="7.3563" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9425" />
  <ns0:text x="274.636" y="125.0575" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">trait Display</ns0:text>
  <ns0:text x="102.0076" y="158.8966" font-size="16.1839" fill="#555">fn fmt(&amp;self, f: &amp;mut Formatter)</ns0:text>
  <ns0:text x="102.0076" y="188.3218" font-size="16.1839" fill="#555">  -&gt; fmt::Result;</ns0:text>
  <ns0:rect x="313.8697" y="250.1149" width="549.272" height="117.7011" rx="7.3563" fill="#d4edda" stroke="#28a745" stroke-width="2.9425" />
  <ns0:text x="588.5057" y="286.8966" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#28a745">Blanket Implementation</ns0:text>
  <ns0:text x="337.4099" y="320.7356" font-size="16.1839" fill="#555">impl&lt;T: Display&gt; ToString for T {</ns0:text>
  <ns0:text x="353.1034" y="350.1609" font-size="16.1839" fill="#555">fn to_string(&amp;self) -&gt; String { ... }</ns0:text>
  <ns0:rect x="706.2069" y="88.2759" width="392.3372" height="117.7011" rx="7.3563" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9425" />
  <ns0:text x="902.3754" y="125.0575" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">trait ToString</ns0:text>
  <ns0:text x="729.7471" y="158.8966" font-size="16.1839" fill="#555">fn to_string(&amp;self) -&gt; String;</ns0:text>
  <ns0:text x="729.7471" y="188.3218" font-size="14.7126" fill="#555">// automatically available!</ns0:text>
  <ns0:line x1="274.636" y1="205.977" x2="470.8046" y2="250.1149" stroke="#4a90e2" stroke-width="2.9425" marker-end="url(#arrow)" />
  <ns0:line x1="745.4406" y1="250.1149" x2="902.3754" y2="205.977" stroke="#ffc107" stroke-width="2.9425" marker-end="url(#arrow)" />
  <ns0:rect x="78.4674" y="426.6667" width="235.4023" height="73.5632" rx="7.3563" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2069" />
  <ns0:text x="196.1686" y="456.092" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#333">i32</ns0:text>
  <ns0:text x="196.1686" y="482.5747" text-anchor="middle" font-size="14.7126" fill="#555">impl Display</ns0:text>
  <ns0:rect x="360.9502" y="426.6667" width="235.4023" height="73.5632" rx="7.3563" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2069" />
  <ns0:text x="478.6513" y="456.092" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#333">String</ns0:text>
  <ns0:text x="478.6513" y="482.5747" text-anchor="middle" font-size="14.7126" fill="#555">impl Display</ns0:text>
  <ns0:rect x="643.4329" y="426.6667" width="235.4023" height="73.5632" rx="7.3563" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.2069" />
  <ns0:text x="761.1341" y="456.092" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#333">MyStruct</ns0:text>
  <ns0:text x="761.1341" y="482.5747" text-anchor="middle" font-size="14.7126" fill="#555">impl Display</ns0:text>
  <ns0:line x1="470.8046" y1="367.8161" x2="196.1686" y2="426.6667" stroke="#28a745" stroke-width="2.2069" marker-end="url(#arrow)" />
  <ns0:line x1="588.5057" y1="367.8161" x2="478.6513" y2="426.6667" stroke="#28a745" stroke-width="2.2069" marker-end="url(#arrow)" />
  <ns0:line x1="659.1264" y1="367.8161" x2="761.1341" y2="426.6667" stroke="#28a745" stroke-width="2.2069" marker-end="url(#arrow)" />
  <ns0:text x="588.5057" y="394.2989" text-anchor="middle" font-size="14.7126" fill="#28a745">All get ToString for free!</ns0:text>
  <ns0:rect x="78.4674" y="544.3678" width="1020.0766" height="95.6322" rx="7.3563" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9425" />
  <ns0:text x="588.5057" y="581.1494" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">Key Insight</ns0:text>
  <ns0:text x="102.0076" y="614.9885" font-size="16.1839" fill="#555">Blanket impls provide trait implementations for ALL types matching a bound.</ns0:text>
  <ns0:text x="102.0076" y="629.7011" font-size="16.1839" fill="#555">This is how the standard library provides ToString for any type implementing Display.</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="46.98794158804" width="389.1892" height="139.75904380897" rx="6.178079922381" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="234.5945" y="81.927755552326" text-anchor="middle" font-size="20.406918759614" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">&amp;dyn Draw (Fat Pointer)</text>
  <rect x="64.3243" y="102.891580316445" width="162.1621" height="48.915697140366" rx="6.178079922381" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.4054" y="133.638565713455" text-anchor="middle" font-size="16.033970822554" fill="var(--text)" font-family="Arial, sans-serif">data ptr</text>
  <rect x="242.7027" y="102.891580316445" width="162.1621" height="48.915697140366" rx="6.178079922381" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="133.638565713455" text-anchor="middle" font-size="16.033970822554" fill="var(--text)" font-family="Arial, sans-serif">vtable ptr</text>
  <text x="234.5945" y="172.77110222093" text-anchor="middle" font-size="14.576355832867" fill="var(--text-muted)" font-family="Arial, sans-serif">16 bytes (2 x usize)</text>
  <rect x="558.9189" y="40" width="324.3244" height="153.73492698505" rx="6.178079922381" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="721.0811" y="74.939813964286" text-anchor="middle" font-size="18.949303769927" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Concrete Data</text>
  <text x="583.2432" y="105.686693337209" font-size="16.033970822554" fill="var(--text-muted)" font-family="Arial, sans-serif">Circle {</text>
  <text x="599.4595" y="130.843452692692" font-size="16.033970822554" fill="var(--text-muted)" font-family="Arial, sans-serif">  radius: 5.0,</text>
  <text x="599.4595" y="156" font-size="16.033970822554" fill="var(--text-muted)" font-family="Arial, sans-serif">  x: 10, y: 20</text>
  <text x="583.2432" y="181.156653331396" font-size="16.033970822554" fill="var(--text-muted)" font-family="Arial, sans-serif">}</text>
  <line x1="226.4864" y1="126.650518101328" x2="558.9189" y2="102.891580316445" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="558.9189" y="242.650624125416" width="648.6487" height="279.51808761794" rx="6.178079922381" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.2432" y="277.590438089702" text-anchor="middle" font-size="20.406918759614" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">VTable (static, one per type+trait)</text>
  <rect x="583.2432" y="298.554262853821" width="600" height="39.132536507475" rx="6.178079922381" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.2432" y="325.108525707642" text-anchor="middle" font-size="16.033970822554" fill="var(--text)" font-family="Arial, sans-serif">drop_in_place: fn(*mut Circle)</text>
  <rect x="583.2432" y="344.674740949336" width="600" height="39.132536507475" rx="6.178079922381" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.2432" y="371.22889777907" text-anchor="middle" font-size="16.033970822554" fill="var(--text)" font-family="Arial, sans-serif">size: 24 bytes</text>
  <rect x="583.2432" y="390.795219044851" width="600" height="39.132536507475" rx="6.178079922381" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.2432" y="417.349375874584" text-anchor="middle" font-size="16.033970822554" fill="var(--text)" font-family="Arial, sans-serif">align: 8 bytes</text>
  <rect x="583.2432" y="436.915697140366" width="600" height="39.132536507475" rx="6.178079922381" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.2432" y="463.469959994187" text-anchor="middle" font-size="16.033970822554" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">draw: fn(&amp;Circle) -- trait method</text>
  <rect x="583.2432" y="483.036175235881" width="600" height="25.156547307308" rx="6.178079922381" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.2432" y="502.602390477574" text-anchor="middle" font-size="14.576355832867" fill="var(--text-muted)" font-family="Arial, sans-serif">... more trait methods ...</text>
  <line x1="323.7838" y1="151.807277456811" x2="558.9189" y2="312.530146029901" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="550.120478095515" width="551.3514" height="69.879521904485" rx="6.178079922381" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.6757" y="578.072244447674" text-anchor="middle" font-size="17.49168878024" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Static Dispatch (impl Trait)</text>
  <text x="315.6757" y="603.22889777907" text-anchor="middle" font-size="14.576355832867" fill="var(--text-muted)" font-family="Arial, sans-serif">Monomorphized, inlined, zero-cost</text>
  <rect x="640" y="550.120478095515" width="600" height="69.879521904485" rx="6.178079922381" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="578.072244447674" text-anchor="middle" font-size="17.49168878024" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Dynamic Dispatch (dyn Trait)</text>
  <text x="940" y="603.22889777907" text-anchor="middle" font-size="14.576355832867" fill="var(--text-muted)" font-family="Arial, sans-serif">VTable lookup, no inlining, runtime flexibility</text>
</svg>

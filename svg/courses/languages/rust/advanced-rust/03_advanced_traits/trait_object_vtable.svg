<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="10.5" refX="16" refY="5.25" orient="auto">
      <polygon points="0,15 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Trait Object VTable</text>
  <rect x="48" y="90" width="384" height="150" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="240" y="127.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#333">&amp;dyn Draw (Fat Pointer)</text>
  <rect x="72" y="150" width="160" height="52.5" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="152" y="183" text-anchor="middle" font-size="16.5" fill="#333">data ptr</text>
  <rect x="248" y="150" width="160" height="52.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="328" y="183" text-anchor="middle" font-size="16.5" fill="#333">vtable ptr</text>
  <text x="240" y="225" text-anchor="middle" font-size="15" fill="#555">16 bytes (2 x usize)</text>
  <rect x="560" y="82.5" width="320" height="165" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="720" y="120" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Concrete Data</text>
  <text x="584" y="153" font-size="16.5" fill="#555">Circle {</text>
  <text x="600" y="180" font-size="16.5" fill="#555">  radius: 5.0,</text>
  <text x="600" y="207" font-size="16.5" fill="#555">  x: 10, y: 20</text>
  <text x="584" y="234" font-size="16.5" fill="#555">}</text>
  <line x1="232" y1="175.5" x2="560" y2="150" stroke="#28a745" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="560" y="300" width="640" height="300" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="880" y="337.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#333">VTable (static, one per type+trait)</text>
  <rect x="584" y="360" width="592" height="42" rx="4.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="880" y="388.5" text-anchor="middle" font-size="16.5" fill="#333">drop_in_place: fn(*mut Circle)</text>
  <rect x="584" y="409.5" width="592" height="42" rx="4.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="880" y="438" text-anchor="middle" font-size="16.5" fill="#333">size: 24 bytes</text>
  <rect x="584" y="459" width="592" height="42" rx="4.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="880" y="487.5" text-anchor="middle" font-size="16.5" fill="#333">align: 8 bytes</text>
  <rect x="584" y="508.5" width="592" height="42" rx="4.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="880" y="537" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#333">draw: fn(&amp;Circle) -- trait method</text>
  <rect x="584" y="558" width="592" height="27" rx="4.5" fill="#d4edda" stroke="#28a745" stroke-width="1.5" />
  <text x="880" y="579" text-anchor="middle" font-size="15" fill="#555">... more trait methods ...</text>
  <line x1="328" y1="202.5" x2="560" y2="375" stroke="#ffc107" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="48" y="630" width="544" height="75" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="320" y="660" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Static Dispatch (impl Trait)</text>
  <text x="320" y="687" text-anchor="middle" font-size="15" fill="#555">Monomorphized, inlined, zero-cost</text>
  <rect x="640" y="630" width="592" height="75" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="936" y="660" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Dynamic Dispatch (dyn Trait)</text>
  <text x="936" y="687" text-anchor="middle" font-size="15" fill="#555">VTable lookup, no inlining, runtime flexibility</text>
</svg>
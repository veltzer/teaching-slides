<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="580.9929" y="40.8511" text-anchor="middle" font-size="27.234" font-weight="bold" fill="var(--text)">Trait Object VTable</text>
  <rect x="43.5745" y="81.7021" width="348.5957" height="136.1702" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="217.8723" y="115.7447" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="var(--text)">&amp;dyn Draw (Fat Pointer)</text>
  <rect x="65.3617" y="136.1702" width="145.2482" height="47.6596" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="137.9858" y="166.1277" text-anchor="middle" font-size="14.9787" fill="var(--text)">data ptr</text>
  <rect x="225.1348" y="136.1702" width="145.2482" height="47.6596" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="297.7589" y="166.1277" text-anchor="middle" font-size="14.9787" fill="var(--text)">vtable ptr</text>
  <text x="217.8723" y="204.2553" text-anchor="middle" font-size="13.617" fill="var(--text-muted)">16 bytes (2 x usize)</text>
  <rect x="508.3688" y="74.8936" width="290.4965" height="149.7872" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="653.617" y="108.9362" text-anchor="middle" font-size="17.7021" font-weight="bold" fill="var(--text)">Concrete Data</text>
  <text x="530.156" y="138.8936" font-size="14.9787" fill="var(--text-muted)">Circle {</text>
  <text x="544.6809" y="163.4043" font-size="14.9787" fill="var(--text-muted)">  radius: 5.0,</text>
  <text x="544.6809" y="187.9149" font-size="14.9787" fill="var(--text-muted)">  x: 10, y: 20</text>
  <text x="530.156" y="212.4255" font-size="14.9787" fill="var(--text-muted)">}</text>
  <line x1="210.6099" y1="159.3191" x2="508.3688" y2="136.1702" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="508.3688" y="272.3404" width="580.9929" height="272.3404" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="798.8652" y="306.383" text-anchor="middle" font-size="19.0638" font-weight="bold" fill="var(--text)">VTable (static, one per type+trait)</text>
  <rect x="530.156" y="326.8085" width="537.4184" height="38.1277" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="798.8652" y="352.6809" text-anchor="middle" font-size="14.9787" fill="var(--text)">drop_in_place: fn(*mut Circle)</text>
  <rect x="530.156" y="371.7447" width="537.4184" height="38.1277" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="798.8652" y="397.617" text-anchor="middle" font-size="14.9787" fill="var(--text)">size: 24 bytes</text>
  <rect x="530.156" y="416.6809" width="537.4184" height="38.1277" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="798.8652" y="442.5532" text-anchor="middle" font-size="14.9787" fill="var(--text)">align: 8 bytes</text>
  <rect x="530.156" y="461.617" width="537.4184" height="38.1277" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="798.8652" y="487.4894" text-anchor="middle" font-size="14.9787" font-weight="bold" fill="var(--text)">draw: fn(&amp;Circle) -- trait method</text>
  <rect x="530.156" y="506.5532" width="537.4184" height="24.5106" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="798.8652" y="525.617" text-anchor="middle" font-size="13.617" fill="var(--text-muted)">... more trait methods ...</text>
  <line x1="297.7589" y1="183.8298" x2="508.3688" y2="340.4255" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="43.5745" y="571.9149" width="493.844" height="68.0851" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="290.4965" y="599.1489" text-anchor="middle" font-size="16.3404" font-weight="bold" fill="var(--text)">Static Dispatch (impl Trait)</text>
  <text x="290.4965" y="623.6596" text-anchor="middle" font-size="13.617" fill="var(--text-muted)">Monomorphized, inlined, zero-cost</text>
  <rect x="580.9929" y="571.9149" width="537.4184" height="68.0851" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="849.7021" y="599.1489" text-anchor="middle" font-size="16.3404" font-weight="bold" fill="var(--text)">Dynamic Dispatch (dyn Trait)</text>
  <text x="849.7021" y="623.6596" text-anchor="middle" font-size="13.617" fill="var(--text-muted)">VTable lookup, no inlining, runtime flexibility</text>
</svg>
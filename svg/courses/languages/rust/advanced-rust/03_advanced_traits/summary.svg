<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="26.3027" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Advanced Traits Cheatsheet</text>
  <rect x="40" y="62.8948" width="1200" height="557.1052" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="80.678" y="85.7896" width="366.1016" height="39.6842" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="113.2633" text-anchor="middle" font-size="18.0831" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Static dispatch</text>
  <text x="487.4576" y="113.2633" font-size="18.0831" fill="var(--text)" font-family="Courier New, monospace">fn foo&lt;T: Trait&gt;(x: T)</text>
  <rect x="80.678" y="133.1054" width="366.1016" height="39.6842" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="160.579" text-anchor="middle" font-size="18.0831" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Dynamic dispatch</text>
  <text x="487.4576" y="160.579" font-size="18.0831" fill="var(--text)" font-family="Courier New, monospace">fn foo(x: &amp;dyn Trait)</text>
  <rect x="80.678" y="180.4211" width="366.1016" height="39.6842" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="207.8949" text-anchor="middle" font-size="18.0831" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Associated types</text>
  <text x="487.4576" y="207.8949" font-size="18.0831" fill="var(--text)" font-family="Arial, sans-serif">type Item; (one impl per type)</text>
  <rect x="80.678" y="227.7369" width="366.1016" height="39.6842" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="255.2106" text-anchor="middle" font-size="18.0831" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Type parameters</text>
  <text x="487.4576" y="255.2106" font-size="18.0831" fill="var(--text)" font-family="Courier New, monospace">Trait&lt;T&gt;</text>
  <text x="690.8475" y="255.2106" font-size="18.0831" fill="var(--text-muted)" font-family="Arial, sans-serif">(many impls per type)</text>
  <rect x="80.678" y="275.0527" width="366.1016" height="39.6842" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="302.5264" text-anchor="middle" font-size="18.0831" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Supertraits</text>
  <text x="487.4576" y="302.5264" font-size="18.0831" fill="var(--text)" font-family="Courier New, monospace">trait Sub: Super { }</text>
  <rect x="80.678" y="322.3685" width="366.1016" height="39.6842" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="349.8421" text-anchor="middle" font-size="18.0831" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Blanket impl</text>
  <text x="487.4576" y="349.8421" font-size="18.0831" fill="var(--text)" font-family="Courier New, monospace">impl&lt;T: X&gt; Y for T { }</text>
  <rect x="80.678" y="369.6843" width="366.1016" height="39.6842" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="397.158" text-anchor="middle" font-size="18.0831" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Orphan rule</text>
  <text x="487.4576" y="397.158" font-size="18.0831" fill="var(--text)" font-family="Arial, sans-serif">your trait OR your type</text>
  <rect x="80.678" y="417.0001" width="366.1016" height="39.6842" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="444.4738" text-anchor="middle" font-size="18.0831" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Newtype pattern</text>
  <text x="487.4576" y="444.4738" font-size="18.0831" fill="var(--text)" font-family="Courier New, monospace">struct W(ForeignType);</text>
  <rect x="80.678" y="464.3159" width="366.1016" height="39.6842" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="491.7895" text-anchor="middle" font-size="18.0831" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Send</text>
  <text x="487.4576" y="491.7895" font-size="18.0831" fill="var(--text)" font-family="Arial, sans-serif">safe to move between threads</text>
  <rect x="80.678" y="511.6316" width="366.1016" height="39.6842" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="539.1054" text-anchor="middle" font-size="18.0831" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Sync</text>
  <text x="487.4576" y="539.1054" font-size="18.0831" fill="var(--text)" font-family="Arial, sans-serif">safe to share references</text>
  <rect x="80.678" y="558.9474" width="366.1016" height="39.6842" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="263.7288" y="586.4211" text-anchor="middle" font-size="18.0831" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Sized / Unpin</text>
  <text x="487.4576" y="586.4211" font-size="18.0831" fill="var(--text)" font-family="Arial, sans-serif">compile-time size / safe to move after pinning</text>
</svg>

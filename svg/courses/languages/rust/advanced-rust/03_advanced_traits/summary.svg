<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="589.9589" y="39.5061" text-anchor="middle" font-size="25.284" font-weight="bold" fill="#333">Advanced Traits Cheatsheet</ns0:text>
  <ns0:rect x="54.4577" y="63.2099" width="1071.0023" height="576.7901" rx="7.9012" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1.5803" />
  <ns0:rect x="90.7629" y="86.9136" width="326.7464" height="41.0864" rx="4.7408" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5803" />
  <ns0:text x="254.1361" y="115.3581" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="#4a90e2">Static dispatch</ns0:text>
  <ns0:text x="453.8145" y="115.3581" font-size="17.3827" fill="#333" font-family="monospace">fn foo&lt;T: Trait&gt;(x: T)</ns0:text>
  <ns0:rect x="90.7629" y="135.9013" width="326.7464" height="41.0864" rx="4.7408" fill="#d4edda" stroke="#28a745" stroke-width="1.5803" />
  <ns0:text x="254.1361" y="164.3457" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="#28a745">Dynamic dispatch</ns0:text>
  <ns0:text x="453.8145" y="164.3457" font-size="17.3827" fill="#333" font-family="monospace">fn foo(x: &amp;dyn Trait)</ns0:text>
  <ns0:rect x="90.7629" y="184.8889" width="326.7464" height="41.0864" rx="4.7408" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5803" />
  <ns0:text x="254.1361" y="213.3334" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="#4a90e2">Associated types</ns0:text>
  <ns0:text x="453.8145" y="213.3334" font-size="17.3827" fill="#333">type Item; (one impl per type)</ns0:text>
  <ns0:rect x="90.7629" y="233.8766" width="326.7464" height="41.0864" rx="4.7408" fill="#d4edda" stroke="#28a745" stroke-width="1.5803" />
  <ns0:text x="254.1361" y="262.321" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="#28a745">Type parameters</ns0:text>
  <ns0:text x="453.8145" y="262.321" font-size="17.3827" fill="#333" font-family="monospace">Trait&lt;T&gt;</ns0:text>
  <ns0:text x="635.3403" y="262.321" font-size="17.3827" fill="#666">(many impls per type)</ns0:text>
  <ns0:rect x="90.7629" y="282.8642" width="326.7464" height="41.0864" rx="4.7408" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5803" />
  <ns0:text x="254.1361" y="311.3087" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="#4a90e2">Supertraits</ns0:text>
  <ns0:text x="453.8145" y="311.3087" font-size="17.3827" fill="#333" font-family="monospace">trait Sub: Super { }</ns0:text>
  <ns0:rect x="90.7629" y="331.8519" width="326.7464" height="41.0864" rx="4.7408" fill="#d4edda" stroke="#28a745" stroke-width="1.5803" />
  <ns0:text x="254.1361" y="360.2963" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="#28a745">Blanket impl</ns0:text>
  <ns0:text x="453.8145" y="360.2963" font-size="17.3827" fill="#333" font-family="monospace">impl&lt;T: X&gt; Y for T { }</ns0:text>
  <ns0:rect x="90.7629" y="380.8396" width="326.7464" height="41.0864" rx="4.7408" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5803" />
  <ns0:text x="254.1361" y="409.284" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="#4a90e2">Orphan rule</ns0:text>
  <ns0:text x="453.8145" y="409.284" font-size="17.3827" fill="#333">your trait OR your type</ns0:text>
  <ns0:rect x="90.7629" y="429.8272" width="326.7464" height="41.0864" rx="4.7408" fill="#d4edda" stroke="#28a745" stroke-width="1.5803" />
  <ns0:text x="254.1361" y="458.2717" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="#28a745">Newtype pattern</ns0:text>
  <ns0:text x="453.8145" y="458.2717" font-size="17.3827" fill="#333" font-family="monospace">struct W(ForeignType);</ns0:text>
  <ns0:rect x="90.7629" y="478.8149" width="326.7464" height="41.0864" rx="4.7408" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5803" />
  <ns0:text x="254.1361" y="507.2593" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="#bf360c">Send</ns0:text>
  <ns0:text x="453.8145" y="507.2593" font-size="17.3827" fill="#333">safe to move between threads</ns0:text>
  <ns0:rect x="90.7629" y="527.8025" width="326.7464" height="41.0864" rx="4.7408" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5803" />
  <ns0:text x="254.1361" y="556.247" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="#bf360c">Sync</ns0:text>
  <ns0:text x="453.8145" y="556.247" font-size="17.3827" fill="#333">safe to share references</ns0:text>
  <ns0:rect x="90.7629" y="576.7901" width="326.7464" height="41.0864" rx="4.7408" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5803" />
  <ns0:text x="254.1361" y="605.2346" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="#bf360c">Sized / Unpin</ns0:text>
  <ns0:text x="453.8145" y="605.2346" font-size="17.3827" fill="#333">compile-time size / safe to move after pinning</ns0:text>
</ns0:svg>
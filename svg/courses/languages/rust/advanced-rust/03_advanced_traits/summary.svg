<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Advanced Traits Cheatsheet</text>
  <rect x="30" y="40" width="590" height="365" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <!-- Rows -->
  <rect x="50" y="55" width="180" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="140" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Static dispatch</text>
  <text x="250" y="73" font-size="11" fill="#333" font-family="monospace">fn foo&lt;T: Trait&gt;(x: T)</text>
  <rect x="50" y="86" width="180" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="140" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Dynamic dispatch</text>
  <text x="250" y="104" font-size="11" fill="#333" font-family="monospace">fn foo(x: &amp;dyn Trait)</text>
  <rect x="50" y="117" width="180" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="140" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Associated types</text>
  <text x="250" y="135" font-size="11" fill="#333">type Item; (one impl per type)</text>
  <rect x="50" y="148" width="180" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="140" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Type parameters</text>
  <text x="250" y="166" font-size="11" fill="#333" font-family="monospace">Trait&lt;T&gt;</text>
  <text x="350" y="166" font-size="11" fill="#666">(many impls per type)</text>
  <rect x="50" y="179" width="180" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="140" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Supertraits</text>
  <text x="250" y="197" font-size="11" fill="#333" font-family="monospace">trait Sub: Super { }</text>
  <rect x="50" y="210" width="180" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="140" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Blanket impl</text>
  <text x="250" y="228" font-size="11" fill="#333" font-family="monospace">impl&lt;T: X&gt; Y for T { }</text>
  <rect x="50" y="241" width="180" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="140" y="259" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Orphan rule</text>
  <text x="250" y="259" font-size="11" fill="#333">your trait OR your type</text>
  <rect x="50" y="272" width="180" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="140" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Newtype pattern</text>
  <text x="250" y="290" font-size="11" fill="#333" font-family="monospace">struct W(ForeignType);</text>
  <rect x="50" y="303" width="180" height="26" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="140" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">Send</text>
  <text x="250" y="321" font-size="11" fill="#333">safe to move between threads</text>
  <rect x="50" y="334" width="180" height="26" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="140" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">Sync</text>
  <text x="250" y="352" font-size="11" fill="#333">safe to share references</text>
  <rect x="50" y="365" width="180" height="26" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="140" y="383" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">Sized / Unpin</text>
  <text x="250" y="383" font-size="11" fill="#333">compile-time size / safe to move after pinning</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="589.9589" y="39.5061" text-anchor="middle" font-size="25.284" font-weight="bold" fill="var(--text-dark)">Advanced Traits Cheatsheet</text>
  <rect x="54.4577" y="63.2099" width="1071.0023" height="576.7901" rx="7.9012" fill="var(--surface-light)" stroke="var(--border)" stroke-width="1.5803" />
  <rect x="90.7629" y="86.9136" width="326.7464" height="41.0864" rx="4.7408" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5803" />
  <text x="254.1361" y="115.3581" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--primary-bright)">Static dispatch</text>
  <text x="453.8145" y="115.3581" font-size="17.3827" fill="var(--text-dark)" font-family="monospace">fn foo&lt;T: Trait&gt;(x: T)</text>
  <rect x="90.7629" y="135.9013" width="326.7464" height="41.0864" rx="4.7408" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5803" />
  <text x="254.1361" y="164.3457" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-bright)">Dynamic dispatch</text>
  <text x="453.8145" y="164.3457" font-size="17.3827" fill="var(--text-dark)" font-family="monospace">fn foo(x: &amp;dyn Trait)</text>
  <rect x="90.7629" y="184.8889" width="326.7464" height="41.0864" rx="4.7408" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5803" />
  <text x="254.1361" y="213.3334" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--primary-bright)">Associated types</text>
  <text x="453.8145" y="213.3334" font-size="17.3827" fill="var(--text-dark)">type Item; (one impl per type)</text>
  <rect x="90.7629" y="233.8766" width="326.7464" height="41.0864" rx="4.7408" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5803" />
  <text x="254.1361" y="262.321" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-bright)">Type parameters</text>
  <text x="453.8145" y="262.321" font-size="17.3827" fill="var(--text-dark)" font-family="monospace">Trait&lt;T&gt;</text>
  <text x="635.3403" y="262.321" font-size="17.3827" fill="var(--text-mid)">(many impls per type)</text>
  <rect x="90.7629" y="282.8642" width="326.7464" height="41.0864" rx="4.7408" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5803" />
  <text x="254.1361" y="311.3087" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--primary-bright)">Supertraits</text>
  <text x="453.8145" y="311.3087" font-size="17.3827" fill="var(--text-dark)" font-family="monospace">trait Sub: Super { }</text>
  <rect x="90.7629" y="331.8519" width="326.7464" height="41.0864" rx="4.7408" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5803" />
  <text x="254.1361" y="360.2963" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-bright)">Blanket impl</text>
  <text x="453.8145" y="360.2963" font-size="17.3827" fill="var(--text-dark)" font-family="monospace">impl&lt;T: X&gt; Y for T { }</text>
  <rect x="90.7629" y="380.8396" width="326.7464" height="41.0864" rx="4.7408" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5803" />
  <text x="254.1361" y="409.284" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--primary-bright)">Orphan rule</text>
  <text x="453.8145" y="409.284" font-size="17.3827" fill="var(--text-dark)">your trait OR your type</text>
  <rect x="90.7629" y="429.8272" width="326.7464" height="41.0864" rx="4.7408" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5803" />
  <text x="254.1361" y="458.2717" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-bright)">Newtype pattern</text>
  <text x="453.8145" y="458.2717" font-size="17.3827" fill="var(--text-dark)" font-family="monospace">struct W(ForeignType);</text>
  <rect x="90.7629" y="478.8149" width="326.7464" height="41.0864" rx="4.7408" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.5803" />
  <text x="254.1361" y="507.2593" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--danger-deeper)">Send</text>
  <text x="453.8145" y="507.2593" font-size="17.3827" fill="var(--text-dark)">safe to move between threads</text>
  <rect x="90.7629" y="527.8025" width="326.7464" height="41.0864" rx="4.7408" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.5803" />
  <text x="254.1361" y="556.247" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--danger-deeper)">Sync</text>
  <text x="453.8145" y="556.247" font-size="17.3827" fill="var(--text-dark)">safe to share references</text>
  <rect x="90.7629" y="576.7901" width="326.7464" height="41.0864" rx="4.7408" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.5803" />
  <text x="254.1361" y="605.2346" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--danger-deeper)">Sized / Unpin</text>
  <text x="453.8145" y="605.2346" font-size="17.3827" fill="var(--text-dark)">compile-time size / safe to move after pinning</text>
</svg>
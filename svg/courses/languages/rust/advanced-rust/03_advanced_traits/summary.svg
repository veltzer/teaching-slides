<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="589.9589" y="39.5061" text-anchor="middle" font-size="25.284" font-weight="bold" fill="var(--text)">Advanced Traits Cheatsheet</text>
  <rect x="54.4577" y="63.2099" width="1071.0023" height="576.7901" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="90.7629" y="86.9136" width="326.7464" height="41.0864" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="254.1361" y="115.3581" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--primary-accent)">Static dispatch</text>
  <text x="453.8145" y="115.3581" font-size="17.3827" fill="var(--text)" font-family="monospace">fn foo&lt;T: Trait&gt;(x: T)</text>
  <rect x="90.7629" y="135.9013" width="326.7464" height="41.0864" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="254.1361" y="164.3457" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-accent)">Dynamic dispatch</text>
  <text x="453.8145" y="164.3457" font-size="17.3827" fill="var(--text)" font-family="monospace">fn foo(x: &amp;dyn Trait)</text>
  <rect x="90.7629" y="184.8889" width="326.7464" height="41.0864" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="254.1361" y="213.3334" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--primary-accent)">Associated types</text>
  <text x="453.8145" y="213.3334" font-size="17.3827" fill="var(--text)">type Item; (one impl per type)</text>
  <rect x="90.7629" y="233.8766" width="326.7464" height="41.0864" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="254.1361" y="262.321" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-accent)">Type parameters</text>
  <text x="453.8145" y="262.321" font-size="17.3827" fill="var(--text)" font-family="monospace">Trait&lt;T&gt;</text>
  <text x="635.3403" y="262.321" font-size="17.3827" fill="var(--text-muted)">(many impls per type)</text>
  <rect x="90.7629" y="282.8642" width="326.7464" height="41.0864" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="254.1361" y="311.3087" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--primary-accent)">Supertraits</text>
  <text x="453.8145" y="311.3087" font-size="17.3827" fill="var(--text)" font-family="monospace">trait Sub: Super { }</text>
  <rect x="90.7629" y="331.8519" width="326.7464" height="41.0864" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="254.1361" y="360.2963" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-accent)">Blanket impl</text>
  <text x="453.8145" y="360.2963" font-size="17.3827" fill="var(--text)" font-family="monospace">impl&lt;T: X&gt; Y for T { }</text>
  <rect x="90.7629" y="380.8396" width="326.7464" height="41.0864" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="254.1361" y="409.284" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--primary-accent)">Orphan rule</text>
  <text x="453.8145" y="409.284" font-size="17.3827" fill="var(--text)">your trait OR your type</text>
  <rect x="90.7629" y="429.8272" width="326.7464" height="41.0864" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="254.1361" y="458.2717" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--ok-accent)">Newtype pattern</text>
  <text x="453.8145" y="458.2717" font-size="17.3827" fill="var(--text)" font-family="monospace">struct W(ForeignType);</text>
  <rect x="90.7629" y="478.8149" width="326.7464" height="41.0864" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="254.1361" y="507.2593" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--danger-accent)">Send</text>
  <text x="453.8145" y="507.2593" font-size="17.3827" fill="var(--text)">safe to move between threads</text>
  <rect x="90.7629" y="527.8025" width="326.7464" height="41.0864" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="254.1361" y="556.247" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--danger-accent)">Sync</text>
  <text x="453.8145" y="556.247" font-size="17.3827" fill="var(--text)">safe to share references</text>
  <rect x="90.7629" y="576.7901" width="326.7464" height="41.0864" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="254.1361" y="605.2346" text-anchor="middle" font-size="17.3827" font-weight="bold" fill="var(--danger-accent)">Sized / Unpin</text>
  <text x="453.8145" y="605.2346" font-size="17.3827" fill="var(--text)">compile-time size / safe to move after pinning</text>
</svg>
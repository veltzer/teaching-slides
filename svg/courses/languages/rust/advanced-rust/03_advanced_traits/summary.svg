<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="719.999803333336" height="44.880949688208" rx="8.948264853833" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="399.999901666668" y="71.071452806128" text-anchor="middle" font-size="26.968728029725" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Static dispatch</text>
  <text x="839.999868888891" y="71.071452806128" font-size="26.968728029725" fill="var(--text)" font-family="Courier New, monospace">fn foo&lt;T: Trait&gt;(x: T)</text>
  <rect x="40" y="93.511927650231" width="719.999803333336" height="44.880949688208" rx="8.948264853833" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="399.999901666668" y="124.583267361098" text-anchor="middle" font-size="26.968728029725" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Dynamic dispatch</text>
  <text x="839.999868888891" y="124.583267361098" font-size="26.968728029725" fill="var(--text)" font-family="Courier New, monospace">fn foo(x: &amp;dyn Trait)</text>
  <rect x="40" y="147.023742205202" width="719.999803333336" height="44.880949688208" rx="8.948264853833" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="399.999901666668" y="178.095308106591" text-anchor="middle" font-size="26.968728029725" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Associated types</text>
  <text x="839.999868888891" y="178.095308106591" font-size="26.968728029725" fill="var(--text)" font-family="Arial, sans-serif">type Item; (one impl per type)</text>
  <rect x="40" y="200.535669855434" width="719.999803333336" height="44.880949688208" rx="8.948264853833" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="399.999901666668" y="231.607122661561" text-anchor="middle" font-size="26.968728029725" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Type parameters</text>
  <text x="839.999868888891" y="231.607122661561" font-size="26.968728029725" fill="var(--text)" font-family="Courier New, monospace">Trait&lt;T&gt;</text>
  <text x="1240" y="231.607122661561" font-size="26.968728029725" fill="var(--text-muted)" font-family="Arial, sans-serif">(many impls per type)</text>
  <rect x="40" y="254.047597505665" width="719.999803333336" height="44.880949688208" rx="8.948264853833" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="399.999901666668" y="285.119050311792" text-anchor="middle" font-size="26.968728029725" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Supertraits</text>
  <text x="839.999868888891" y="285.119050311792" font-size="26.968728029725" fill="var(--text)" font-family="Courier New, monospace">trait Sub: Super { }</text>
  <rect x="40" y="307.559525155896" width="719.999803333336" height="44.880949688208" rx="8.948264853833" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="399.999901666668" y="338.630864866763" text-anchor="middle" font-size="26.968728029725" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Blanket impl</text>
  <text x="839.999868888891" y="338.630864866763" font-size="26.968728029725" fill="var(--text)" font-family="Courier New, monospace">impl&lt;T: X&gt; Y for T { }</text>
  <rect x="40" y="361.071452806128" width="719.999803333336" height="44.880949688208" rx="8.948264853833" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="399.999901666668" y="392.142905612256" text-anchor="middle" font-size="26.968728029725" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Orphan rule</text>
  <text x="839.999868888891" y="392.142905612256" font-size="26.968728029725" fill="var(--text)" font-family="Arial, sans-serif">your trait OR your type</text>
  <rect x="40" y="414.583380456359" width="719.999803333336" height="44.880949688208" rx="8.948264853833" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="399.999901666668" y="445.654833262487" text-anchor="middle" font-size="26.968728029725" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Newtype pattern</text>
  <text x="839.999868888891" y="445.654833262487" font-size="26.968728029725" fill="var(--text)" font-family="Courier New, monospace">struct W(ForeignType);</text>
  <rect x="40" y="468.095308106591" width="719.999803333336" height="44.880949688208" rx="8.948264853833" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="399.999901666668" y="499.166647817457" text-anchor="middle" font-size="26.968728029725" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Send</text>
  <text x="839.999868888891" y="499.166647817457" font-size="26.968728029725" fill="var(--text)" font-family="Arial, sans-serif">safe to move between threads</text>
  <rect x="40" y="521.607122661561" width="719.999803333336" height="44.880949688208" rx="8.948264853833" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="399.999901666668" y="552.678688562949" text-anchor="middle" font-size="26.968728029725" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Sync</text>
  <text x="839.999868888891" y="552.678688562949" font-size="26.968728029725" fill="var(--text)" font-family="Arial, sans-serif">safe to share references</text>
  <rect x="40" y="575.119050311792" width="719.999803333336" height="44.880949688208" rx="8.948264853833" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="399.999901666668" y="606.190503117921" text-anchor="middle" font-size="26.968728029725" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Sized / Unpin</text>
  <text x="839.999868888891" y="606.190503117921" font-size="26.968728029725" fill="var(--text)" font-family="Arial, sans-serif">compile-time size / safe to move after pinning</text>
</svg>

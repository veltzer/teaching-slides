<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.0635" font-weight="bold" fill="var(--text)">VTable Layout for dyn Trait (Fat Pointer)</text>
  <text x="40" y="156" font-size="21.7976" font-weight="bold" fill="var(--primary-accent)">dyn Shape</text>
  <text x="40" y="197.76" font-size="18.1647" fill="var(--text-muted)">(fat pointer)</text>
  <rect x="220" y="121.2" width="400" height="127.6" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="419.9999" y="172.24" text-anchor="middle" font-size="19.9812" font-weight="bold" fill="var(--text)">data pointer</text>
  <text x="419.9999" y="214" text-anchor="middle" font-size="19.9812" font-weight="bold" fill="var(--text)">vtable pointer</text>
  <line x1="620" y1="162.9599" x2="820" y2="162.9599" stroke="var(--ok-border)" stroke-width="2" />
  <polygon points="810,151.36 830,162.9599 810,174.5601" fill="var(--ok-fill)" />
  <rect x="840" y="121.2" width="360" height="81.2" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1020" y="172.24" text-anchor="middle" font-size="19.9812" font-weight="bold" fill="var(--ok-accent)">actual struct data</text>
  <line x1="620" y1="209.36" x2="820" y2="306.8" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="810,295.2 830,306.8 810,318.4" fill="var(--primary-fill)" />
  <rect x="840" y="260.4" width="400" height="324.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1040" y="311.44" text-anchor="middle" font-size="21.7976" font-weight="bold" fill="var(--danger-accent)">VTable</text>
  <line x1="840" y1="330" x2="1240" y2="330" stroke="var(--warn-border)" stroke-width="1.655" />
  <text x="880" y="376.4" font-size="19.9812" fill="var(--text)" font-family="monospace">drop()</text>
  <text x="880" y="422.8" font-size="19.9812" fill="var(--text)" font-family="monospace">size</text>
  <text x="880" y="469.1999" font-size="19.9812" fill="var(--text)" font-family="monospace">alignment</text>
  <text x="880" y="515.6" font-size="19.9812" fill="var(--text)" font-family="monospace">area()</text>
  <text x="880" y="561.9999" font-size="19.9812" fill="var(--text)" font-family="monospace">name()</text>
  <text x="640" y="620" text-anchor="middle" font-size="19.9812" fill="var(--text-muted)">Each trait object carries two pointers: data + vtable (16 bytes on 64-bit)</text>
</svg>
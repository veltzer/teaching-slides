<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.0635" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">VTable Layout for dyn Trait (Fat Pointer)</text>
  <text x="40" y="156" font-size="21.7976" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">dyn Shape</text>
  <text x="40" y="197.76" font-size="18.1647" fill="var(--text-muted)" font-family="Arial, sans-serif">(fat pointer)</text>
  <rect x="220" y="121.2" width="400" height="127.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="419.9999" y="172.24" text-anchor="middle" font-size="19.9812" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">data pointer</text>
  <text x="419.9999" y="214" text-anchor="middle" font-size="19.9812" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">vtable pointer</text>
  <line x1="620" y1="162.9599" x2="820" y2="162.9599" stroke="var(--ok-border)" stroke-width="2"/>
  <polygon points="810,151.36 830,162.9599 810,174.5601" fill="var(--ok-fill)"/>
  <rect x="840" y="121.2" width="360" height="81.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="172.24" text-anchor="middle" font-size="19.9812" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">actual struct data</text>
  <line x1="620" y1="209.36" x2="820" y2="306.8" stroke="var(--primary-border)" stroke-width="2"/>
  <polygon points="810,295.2 830,306.8 810,318.4" fill="var(--primary-fill)"/>
  <rect x="840" y="260.4" width="400" height="324.8" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="311.44" text-anchor="middle" font-size="21.7976" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">VTable</text>
  <line x1="840" y1="330" x2="1240" y2="330" stroke="var(--warn-border)" stroke-width="1.655"/>
  <text x="880" y="376.4" font-size="19.9812" fill="var(--text)" font-family="Courier New, monospace">drop()</text>
  <text x="880" y="422.8" font-size="19.9812" fill="var(--text)" font-family="Courier New, monospace">size</text>
  <text x="880" y="469.1999" font-size="19.9812" fill="var(--text)" font-family="Courier New, monospace">alignment</text>
  <text x="880" y="515.6" font-size="19.9812" fill="var(--text)" font-family="Courier New, monospace">area()</text>
  <text x="880" y="561.9999" font-size="19.9812" fill="var(--text)" font-family="Courier New, monospace">name()</text>
  <text x="640" y="620" text-anchor="middle" font-size="19.9812" fill="var(--text-muted)" font-family="Arial, sans-serif">Each trait object carries two pointers: data + vtable (16 bytes on 64-bit)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="579.2323" y="58.1818" text-anchor="middle" font-size="26.4792" font-weight="bold" fill="var(--text-dark)">VTable Layout for dyn Trait (Fat Pointer)</text>
  <text x="82.7475" y="174.5454" font-size="19.8594" font-weight="bold" fill="var(--primary-bright)">dyn Shape</text>
  <text x="82.7475" y="216.4364" font-size="16.5495" fill="var(--text-mid)">(fat pointer)</text>
  <rect x="231.6929" y="139.6363" width="330.9899" height="128" rx="8.2748" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.3099" />
  <text x="397.1878" y="190.8363" text-anchor="middle" font-size="18.2045" font-weight="bold" fill="var(--text-dark)">data pointer</text>
  <text x="397.1878" y="232.7273" text-anchor="middle" font-size="18.2045" font-weight="bold" fill="var(--text-dark)">vtable pointer</text>
  <line x1="562.6828" y1="181.5272" x2="728.1777" y2="181.5272" stroke="var(--ok-bright)" stroke-width="3.3099" />
  <polygon points="719.903,169.8909 736.4525,181.5272 719.903,193.1637" fill="var(--ok-bright)" />
  <rect x="744.7272" y="139.6363" width="297.8909" height="81.4545" rx="8.2748" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.3099" />
  <text x="893.6727" y="190.8363" text-anchor="middle" font-size="18.2045" font-weight="bold" fill="var(--ok-bright)">actual struct data</text>
  <line x1="562.6828" y1="228.0727" x2="728.1777" y2="325.8182" stroke="var(--primary-bright)" stroke-width="3.3099" />
  <polygon points="719.903,314.1818 736.4525,325.8182 719.903,337.4545" fill="var(--primary-bright)" />
  <rect x="744.7272" y="279.2727" width="330.9899" height="325.8182" rx="8.2748" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.3099" />
  <text x="910.2222" y="330.4727" text-anchor="middle" font-size="19.8594" font-weight="bold" fill="var(--danger-deeper)">VTable</text>
  <line x1="744.7272" y1="349.0909" x2="1075.7171" y2="349.0909" stroke="var(--warn-yellow)" stroke-width="1.655" />
  <text x="777.8262" y="395.6364" font-size="18.2045" fill="var(--text-dark)" font-family="monospace">drop()</text>
  <text x="777.8262" y="442.1818" font-size="18.2045" fill="var(--text-dark)" font-family="monospace">size</text>
  <text x="777.8262" y="488.7272" font-size="18.2045" fill="var(--text-dark)" font-family="monospace">alignment</text>
  <text x="777.8262" y="535.2727" font-size="18.2045" fill="var(--text-dark)" font-family="monospace">area()</text>
  <text x="777.8262" y="581.8181" font-size="18.2045" fill="var(--text-dark)" font-family="monospace">name()</text>
  <text x="579.2323" y="640" text-anchor="middle" font-size="18.2045" fill="var(--text-mid)">Each trait object carries two pointers: data + vtable (16 bytes on 64-bit)</text>
</svg>
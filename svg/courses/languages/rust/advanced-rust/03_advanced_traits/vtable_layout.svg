<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="579.2323" y="58.1818" text-anchor="middle" font-size="26.4792" font-weight="bold" fill="var(--text)">VTable Layout for dyn Trait (Fat Pointer)</text>
  <text x="82.7475" y="174.5454" font-size="19.8594" font-weight="bold" fill="var(--primary-accent)">dyn Shape</text>
  <text x="82.7475" y="216.4364" font-size="16.5495" fill="var(--text-muted)">(fat pointer)</text>
  <rect x="231.6929" y="139.6363" width="330.9899" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="397.1878" y="190.8363" text-anchor="middle" font-size="18.2045" font-weight="bold" fill="var(--text)">data pointer</text>
  <text x="397.1878" y="232.7273" text-anchor="middle" font-size="18.2045" font-weight="bold" fill="var(--text)">vtable pointer</text>
  <line x1="562.6828" y1="181.5272" x2="728.1777" y2="181.5272" stroke="var(--ok-border)" stroke-width="2" />
  <polygon points="719.903,169.8909 736.4525,181.5272 719.903,193.1637" fill="var(--ok-fill)" />
  <rect x="744.7272" y="139.6363" width="297.8909" height="81.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="893.6727" y="190.8363" text-anchor="middle" font-size="18.2045" font-weight="bold" fill="var(--ok-accent)">actual struct data</text>
  <line x1="562.6828" y1="228.0727" x2="728.1777" y2="325.8182" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="719.903,314.1818 736.4525,325.8182 719.903,337.4545" fill="var(--primary-fill)" />
  <rect x="744.7272" y="279.2727" width="330.9899" height="325.8182" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="910.2222" y="330.4727" text-anchor="middle" font-size="19.8594" font-weight="bold" fill="var(--danger-accent)">VTable</text>
  <line x1="744.7272" y1="349.0909" x2="1075.7171" y2="349.0909" stroke="var(--warn-border)" stroke-width="1.655" />
  <text x="777.8262" y="395.6364" font-size="18.2045" fill="var(--text)" font-family="monospace">drop()</text>
  <text x="777.8262" y="442.1818" font-size="18.2045" fill="var(--text)" font-family="monospace">size</text>
  <text x="777.8262" y="488.7272" font-size="18.2045" fill="var(--text)" font-family="monospace">alignment</text>
  <text x="777.8262" y="535.2727" font-size="18.2045" fill="var(--text)" font-family="monospace">area()</text>
  <text x="777.8262" y="581.8181" font-size="18.2045" fill="var(--text)" font-family="monospace">name()</text>
  <text x="579.2323" y="640" text-anchor="middle" font-size="18.2045" fill="var(--text-muted)">Each trait object carries two pointers: data + vtable (16 bytes on 64-bit)</text>
</svg>
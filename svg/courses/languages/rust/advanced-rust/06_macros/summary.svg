<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="584.6914" y="44.4444" text-anchor="middle" font-size="28.4444" font-weight="bold" fill="var(--text)">Macros Cheatsheet</text>
  <rect x="53.9715" y="71.1111" width="1061.4398" height="560.0001" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="89.9525" y="97.7778" width="305.8385" height="46.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="242.8719" y="129.7778" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">macro_rules!</text>
  <text x="431.7721" y="129.7778" font-size="19.5556" fill="var(--text)">pattern-based, hygienic</text>
  <rect x="89.9525" y="152.8889" width="305.8385" height="46.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="242.8719" y="184.8889" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--ok-accent)">Fragments</text>
  <text x="431.7721" y="184.8889" font-size="19.5556" fill="var(--text)">expr, ident, ty, pat, tt, etc.</text>
  <rect x="89.9525" y="208" width="305.8385" height="46.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="242.8719" y="240" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">Repetitions</text>
  <text x="431.7721" y="240" font-size="19.5556" fill="var(--text)" font-family="monospace">$( ... ),*  $( ... ),+  $( ... )?</text>
  <rect x="89.9525" y="263.1111" width="305.8385" height="46.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="242.8719" y="295.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--ok-accent)">Proc macros</text>
  <text x="431.7721" y="295.1111" font-size="19.5556" fill="var(--text)">require separate crate</text>
  <rect x="89.9525" y="318.2222" width="305.8385" height="46.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="242.8719" y="350.2223" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">#[derive(X)]</text>
  <text x="431.7721" y="350.2223" font-size="19.5556" fill="var(--text)">generates impl blocks</text>
  <rect x="89.9525" y="373.3333" width="305.8385" height="46.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="242.8719" y="405.3334" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--ok-accent)">#[attribute]</text>
  <text x="431.7721" y="405.3334" font-size="19.5556" fill="var(--text)">transforms any item</text>
  <rect x="89.9525" y="428.4445" width="305.8385" height="46.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="242.8719" y="460.4445" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">fn_like!(...)</text>
  <text x="431.7721" y="460.4445" font-size="19.5556" fill="var(--text)">arbitrary token transformation</text>
  <rect x="89.9525" y="483.5556" width="305.8385" height="46.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="242.8719" y="515.5556" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--danger-accent)">syn</text>
  <text x="431.7721" y="515.5556" font-size="19.5556" fill="var(--text)">parse TokenStream into AST</text>
  <rect x="89.9525" y="538.6667" width="305.8385" height="46.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="242.8719" y="570.6667" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--danger-accent)">quote</text>
  <text x="431.7721" y="570.6667" font-size="19.5556" fill="var(--text)">generate TokenStream from template</text>
  <rect x="89.9525" y="593.7778" width="305.8385" height="46.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="242.8719" y="625.7778" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--danger-accent)">cargo expand</text>
  <text x="431.7721" y="625.7778" font-size="19.5556" fill="var(--text)">view expanded macro output</text>
</svg>
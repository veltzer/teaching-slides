  <ns0:rect x="89.9525" y="538.6667" width="305.8385" height="46.2222" rx="5.3333" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7777" />
  <ns0:text x="242.8719" y="570.6667" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#bf360c">quote</ns0:text>
  <ns0:text x="431.7721" y="570.6667" font-size="19.5556" fill="#333">generate TokenStream from template</ns0:text>
  <ns0:rect x="89.9525" y="593.7778" width="305.8385" height="46.2222" rx="5.3333" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7777" />
  <ns0:text x="242.8719" y="625.7778" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#bf360c">cargo expand</ns0:text>
  <ns0:text x="431.7721" y="625.7778" font-size="19.5556" fill="#333">view expanded macro output</ns0:text>

  <ns0:text x="431.7721" y="184.8889" font-size="19.5556" fill="#333">expr, ident, ty, pat, tt, etc.</ns0:text>
  <ns0:rect x="89.9525" y="208" width="305.8385" height="46.2222" rx="5.3333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7777" />
  <ns0:text x="242.8719" y="240" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#4a90e2">Repetitions</ns0:text>
  <ns0:text x="431.7721" y="240" font-size="19.5556" fill="#333" font-family="monospace">$( ... ),*  $( ... ),+  $( ... )?</ns0:text>
  <ns0:rect x="89.9525" y="263.1111" width="305.8385" height="46.2222" rx="5.3333" fill="#d4edda" stroke="#28a745" stroke-width="1.7777" />
  <ns0:text x="242.8719" y="295.1111" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#28a745">Proc macros</ns0:text>
  <ns0:text x="431.7721" y="295.1111" font-size="19.5556" fill="#333">require separate crate</ns0:text>
  <ns0:rect x="89.9525" y="318.2222" width="305.8385" height="46.2222" rx="5.3333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7777" />
  <ns0:text x="242.8719" y="350.2223" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#4a90e2">#[derive(X)]</ns0:text>
  <ns0:text x="431.7721" y="350.2223" font-size="19.5556" fill="#333">generates impl blocks</ns0:text>
  <ns0:rect x="89.9525" y="373.3333" width="305.8385" height="46.2222" rx="5.3333" fill="#d4edda" stroke="#28a745" stroke-width="1.7777" />

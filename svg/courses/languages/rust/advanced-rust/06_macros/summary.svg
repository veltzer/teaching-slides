  <ns0:text x="431.7721" y="405.3334" font-size="19.5556" fill="#333">transforms any item</ns0:text>
  <ns0:rect x="89.9525" y="428.4445" width="305.8385" height="46.2222" rx="5.3333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7777" />
  <ns0:text x="242.8719" y="460.4445" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="#4a90e2">fn_like!(...)</ns0:text>

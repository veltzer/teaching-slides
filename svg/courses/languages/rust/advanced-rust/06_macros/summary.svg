<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.8464" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Macros Cheatsheet</text>
  <rect x="40" y="65.9702" width="1200" height="545.3732" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="80.678" y="91.9404" width="345.7626" height="45.0149" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="123.1045" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">macro_rules!</text>
  <text x="467.1186" y="123.1045" font-size="20.5195" fill="var(--text)" font-family="Arial, sans-serif">pattern-based, hygienic</text>
  <rect x="80.678" y="145.612" width="345.7626" height="45.0149" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="176.7762" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Fragments</text>
  <text x="467.1186" y="176.7762" font-size="20.5195" fill="var(--text)" font-family="Arial, sans-serif">expr, ident, ty, pat, tt, etc.</text>
  <rect x="80.678" y="199.2836" width="345.7626" height="45.0149" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="230.4478" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Repetitions</text>
  <text x="467.1186" y="230.4478" font-size="20.5195" fill="var(--text)" font-family="Courier New, monospace">$( ... ),*  $( ... ),+  $( ... )?</text>
  <rect x="80.678" y="252.9552" width="345.7626" height="45.0149" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="284.1194" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Proc macros</text>
  <text x="467.1186" y="284.1194" font-size="20.5195" fill="var(--text)" font-family="Arial, sans-serif">require separate crate</text>
  <rect x="80.678" y="306.6269" width="345.7626" height="45.0149" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="337.7911" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">#[derive(X)]</text>
  <text x="467.1186" y="337.7911" font-size="20.5195" fill="var(--text)" font-family="Arial, sans-serif">generates impl blocks</text>
  <rect x="80.678" y="360.2985" width="345.7626" height="45.0149" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="391.4628" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">#[attribute]</text>
  <text x="467.1186" y="391.4628" font-size="20.5195" fill="var(--text)" font-family="Arial, sans-serif">transforms any item</text>
  <rect x="80.678" y="413.9702" width="345.7626" height="45.0149" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="445.1344" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">fn_like!(...)</text>
  <text x="467.1186" y="445.1344" font-size="20.5195" fill="var(--text)" font-family="Arial, sans-serif">arbitrary token transformation</text>
  <rect x="80.678" y="467.6418" width="345.7626" height="45.0149" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="498.806" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">syn</text>
  <text x="467.1186" y="498.806" font-size="20.5195" fill="var(--text)" font-family="Arial, sans-serif">parse TokenStream into AST</text>
  <rect x="80.678" y="521.3135" width="345.7626" height="45.0149" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="552.4776" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">quote</text>
  <text x="467.1186" y="552.4776" font-size="20.5195" fill="var(--text)" font-family="Arial, sans-serif">generate TokenStream from template</text>
  <rect x="80.678" y="574.9851" width="345.7626" height="45.0149" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="606.1493" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">cargo expand</text>
  <text x="467.1186" y="606.1493" font-size="20.5195" fill="var(--text)" font-family="Arial, sans-serif">view expanded macro output</text>
</svg>
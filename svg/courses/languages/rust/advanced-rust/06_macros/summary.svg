<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 370" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Macros Cheatsheet</text>
  <rect x="30" y="40" width="590" height="315" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <!-- Rows -->
  <rect x="50" y="55" width="170" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="135" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">macro_rules!</text>
  <text x="240" y="73" font-size="11" fill="#333">pattern-based, hygienic</text>
  <rect x="50" y="86" width="170" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="135" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Fragments</text>
  <text x="240" y="104" font-size="11" fill="#333">expr, ident, ty, pat, tt, etc.</text>
  <rect x="50" y="117" width="170" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="135" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">Repetitions</text>
  <text x="240" y="135" font-size="11" fill="#333" font-family="monospace">$( ... ),*  $( ... ),+  $( ... )?</text>
  <rect x="50" y="148" width="170" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="135" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">Proc macros</text>
  <text x="240" y="166" font-size="11" fill="#333">require separate crate</text>
  <rect x="50" y="179" width="170" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="135" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">#[derive(X)]</text>
  <text x="240" y="197" font-size="11" fill="#333">generates impl blocks</text>
  <rect x="50" y="210" width="170" height="26" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="135" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#28a745">#[attribute]</text>
  <text x="240" y="228" font-size="11" fill="#333">transforms any item</text>
  <rect x="50" y="241" width="170" height="26" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="135" y="259" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90e2">fn_like!(...)</text>
  <text x="240" y="259" font-size="11" fill="#333">arbitrary token transformation</text>
  <rect x="50" y="272" width="170" height="26" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="135" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">syn</text>
  <text x="240" y="290" font-size="11" fill="#333">parse TokenStream into AST</text>
  <rect x="50" y="303" width="170" height="26" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="135" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">quote</text>
  <text x="240" y="321" font-size="11" fill="#333">generate TokenStream from template</text>
  <rect x="50" y="334" width="170" height="26" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="135" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">cargo expand</text>
  <text x="240" y="352" font-size="11" fill="#333">view expanded macro output</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.8464" font-weight="bold" fill="var(--text)">Macros Cheatsheet</text>
  <rect x="40" y="65.9702" width="1200" height="545.3732" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="80.678" y="91.9404" width="345.7626" height="45.0149" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="253.5594" y="123.1045" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--primary-accent)">macro_rules!</text>
  <text x="467.1186" y="123.1045" font-size="20.5195" fill="var(--text)">pattern-based, hygienic</text>
  <rect x="80.678" y="145.612" width="345.7626" height="45.0149" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="253.5594" y="176.7762" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--ok-accent)">Fragments</text>
  <text x="467.1186" y="176.7762" font-size="20.5195" fill="var(--text)">expr, ident, ty, pat, tt, etc.</text>
  <rect x="80.678" y="199.2836" width="345.7626" height="45.0149" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="253.5594" y="230.4478" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--primary-accent)">Repetitions</text>
  <text x="467.1186" y="230.4478" font-size="20.5195" fill="var(--text)" font-family="monospace">$( ... ),*  $( ... ),+  $( ... )?</text>
  <rect x="80.678" y="252.9552" width="345.7626" height="45.0149" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="253.5594" y="284.1194" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--ok-accent)">Proc macros</text>
  <text x="467.1186" y="284.1194" font-size="20.5195" fill="var(--text)">require separate crate</text>
  <rect x="80.678" y="306.6269" width="345.7626" height="45.0149" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="253.5594" y="337.7911" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--primary-accent)">#[derive(X)]</text>
  <text x="467.1186" y="337.7911" font-size="20.5195" fill="var(--text)">generates impl blocks</text>
  <rect x="80.678" y="360.2985" width="345.7626" height="45.0149" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="253.5594" y="391.4628" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--ok-accent)">#[attribute]</text>
  <text x="467.1186" y="391.4628" font-size="20.5195" fill="var(--text)">transforms any item</text>
  <rect x="80.678" y="413.9702" width="345.7626" height="45.0149" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="253.5594" y="445.1344" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--primary-accent)">fn_like!(...)</text>
  <text x="467.1186" y="445.1344" font-size="20.5195" fill="var(--text)">arbitrary token transformation</text>
  <rect x="80.678" y="467.6418" width="345.7626" height="45.0149" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="253.5594" y="498.806" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--danger-accent)">syn</text>
  <text x="467.1186" y="498.806" font-size="20.5195" fill="var(--text)">parse TokenStream into AST</text>
  <rect x="80.678" y="521.3135" width="345.7626" height="45.0149" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="253.5594" y="552.4776" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--danger-accent)">quote</text>
  <text x="467.1186" y="552.4776" font-size="20.5195" fill="var(--text)">generate TokenStream from template</text>
  <rect x="80.678" y="574.9851" width="345.7626" height="45.0149" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="253.5594" y="606.1493" text-anchor="middle" font-size="20.5195" font-weight="bold" fill="var(--danger-accent)">cargo expand</text>
  <text x="467.1186" y="606.1493" font-size="20.5195" fill="var(--text)">view expanded macro output</text>
</svg>
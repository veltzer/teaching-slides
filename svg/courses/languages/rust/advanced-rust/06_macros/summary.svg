<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="48.6486" text-anchor="middle" font-size="31.1351" font-weight="bold" fill="#333">Macros Cheatsheet</text>
  <rect x="59.0769" y="77.8378" width="1161.8462" height="612.973" rx="9.7297" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.9459" />
  <rect x="98.4615" y="107.027" width="334.7692" height="50.5946" rx="5.8378" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.9459" />
  <text x="265.8462" y="142.0541" text-anchor="middle" font-size="21.4054" font-weight="bold" fill="#4a90e2">macro_rules!</text>
  <text x="472.6154" y="142.0541" font-size="21.4054" fill="#333">pattern-based, hygienic</text>
  <rect x="98.4615" y="167.3514" width="334.7692" height="50.5946" rx="5.8378" fill="#d4edda" stroke="#28a745" stroke-width="1.9459" />
  <text x="265.8462" y="202.3784" text-anchor="middle" font-size="21.4054" font-weight="bold" fill="#28a745">Fragments</text>
  <text x="472.6154" y="202.3784" font-size="21.4054" fill="#333">expr, ident, ty, pat, tt, etc.</text>
  <rect x="98.4615" y="227.6757" width="334.7692" height="50.5946" rx="5.8378" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.9459" />
  <text x="265.8462" y="262.7027" text-anchor="middle" font-size="21.4054" font-weight="bold" fill="#4a90e2">Repetitions</text>
  <text x="472.6154" y="262.7027" font-size="21.4054" fill="#333" font-family="monospace">$( ... ),*  $( ... ),+  $( ... )?</text>
  <rect x="98.4615" y="288" width="334.7692" height="50.5946" rx="5.8378" fill="#d4edda" stroke="#28a745" stroke-width="1.9459" />
  <text x="265.8462" y="323.027" text-anchor="middle" font-size="21.4054" font-weight="bold" fill="#28a745">Proc macros</text>
  <text x="472.6154" y="323.027" font-size="21.4054" fill="#333">require separate crate</text>
  <rect x="98.4615" y="348.3243" width="334.7692" height="50.5946" rx="5.8378" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.9459" />
  <text x="265.8462" y="383.3514" text-anchor="middle" font-size="21.4054" font-weight="bold" fill="#4a90e2">#[derive(X)]</text>
  <text x="472.6154" y="383.3514" font-size="21.4054" fill="#333">generates impl blocks</text>
  <rect x="98.4615" y="408.6486" width="334.7692" height="50.5946" rx="5.8378" fill="#d4edda" stroke="#28a745" stroke-width="1.9459" />
  <text x="265.8462" y="443.6757" text-anchor="middle" font-size="21.4054" font-weight="bold" fill="#28a745">#[attribute]</text>
  <text x="472.6154" y="443.6757" font-size="21.4054" fill="#333">transforms any item</text>
  <rect x="98.4615" y="468.973" width="334.7692" height="50.5946" rx="5.8378" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.9459" />
  <text x="265.8462" y="504" text-anchor="middle" font-size="21.4054" font-weight="bold" fill="#4a90e2">fn_like!(...)</text>
  <text x="472.6154" y="504" font-size="21.4054" fill="#333">arbitrary token transformation</text>
  <rect x="98.4615" y="529.2973" width="334.7692" height="50.5946" rx="5.8378" fill="#fff3cd" stroke="#ffc107" stroke-width="1.9459" />
  <text x="265.8462" y="564.3243" text-anchor="middle" font-size="21.4054" font-weight="bold" fill="#856404">syn</text>
  <text x="472.6154" y="564.3243" font-size="21.4054" fill="#333">parse TokenStream into AST</text>
  <rect x="98.4615" y="589.6216" width="334.7692" height="50.5946" rx="5.8378" fill="#fff3cd" stroke="#ffc107" stroke-width="1.9459" />
  <text x="265.8462" y="624.6486" text-anchor="middle" font-size="21.4054" font-weight="bold" fill="#856404">quote</text>
  <text x="472.6154" y="624.6486" font-size="21.4054" fill="#333">generate TokenStream from template</text>
  <rect x="98.4615" y="649.9459" width="334.7692" height="50.5946" rx="5.8378" fill="#fff3cd" stroke="#ffc107" stroke-width="1.9459" />
  <text x="265.8462" y="684.973" text-anchor="middle" font-size="21.4054" font-weight="bold" fill="#856404">cargo expand</text>
  <text x="472.6154" y="684.973" font-size="21.4054" fill="#333">view expanded macro output</text>
</svg>
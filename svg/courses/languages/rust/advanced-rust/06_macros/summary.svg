<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="570.937621044933" rx="6.139014860055" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="80.678" y="67.187555615239" width="345.7626" height="47.124977753904" rx="6.139014860055" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="99.812475791013" text-anchor="middle" font-size="20.994919236818" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">macro_rules!</text>
  <text x="467.1186" y="99.812475791013" font-size="20.994919236818" fill="var(--text)" font-family="Arial, sans-serif">pattern-based, hygienic</text>
  <rect x="80.678" y="123.37501701172" width="345.7626" height="47.124977753904" rx="6.139014860055" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="156.000041875004" text-anchor="middle" font-size="20.994919236818" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Fragments</text>
  <text x="467.1186" y="156.000041875004" font-size="20.994919236818" fill="var(--text)" font-family="Arial, sans-serif">expr, ident, ty, pat, tt, etc.</text>
  <rect x="80.678" y="179.562478408201" width="345.7626" height="47.124977753904" rx="6.139014860055" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="212.187503271485" text-anchor="middle" font-size="20.994919236818" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Repetitions</text>
  <text x="467.1186" y="212.187503271485" font-size="20.994919236818" fill="var(--text)" font-family="Courier New, monospace">$( ... ),*  $( ... ),+  $( ... )?</text>
  <rect x="80.678" y="235.749939804682" width="345.7626" height="47.124977753904" rx="6.139014860055" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="268.374964667966" text-anchor="middle" font-size="20.994919236818" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Proc macros</text>
  <text x="467.1186" y="268.374964667966" font-size="20.994919236818" fill="var(--text)" font-family="Arial, sans-serif">require separate crate</text>
  <rect x="80.678" y="291.937505888672" width="345.7626" height="47.124977753904" rx="6.139014860055" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="324.562530751956" text-anchor="middle" font-size="20.994919236818" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">#[derive(X)]</text>
  <text x="467.1186" y="324.562530751956" font-size="20.994919236818" fill="var(--text)" font-family="Arial, sans-serif">generates impl blocks</text>
  <rect x="80.678" y="348.124967285153" width="345.7626" height="47.124977753904" rx="6.139014860055" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="380.750096835946" text-anchor="middle" font-size="20.994919236818" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">#[attribute]</text>
  <text x="467.1186" y="380.750096835946" font-size="20.994919236818" fill="var(--text)" font-family="Arial, sans-serif">transforms any item</text>
  <rect x="80.678" y="404.312533369144" width="345.7626" height="47.124977753904" rx="6.139014860055" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="436.937558232427" text-anchor="middle" font-size="20.994919236818" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">fn_like!(...)</text>
  <text x="467.1186" y="436.937558232427" font-size="20.994919236818" fill="var(--text)" font-family="Arial, sans-serif">arbitrary token transformation</text>
  <rect x="80.678" y="460.499994765625" width="345.7626" height="47.124977753904" rx="6.139014860055" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="493.125019628908" text-anchor="middle" font-size="20.994919236818" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">syn</text>
  <text x="467.1186" y="493.125019628908" font-size="20.994919236818" fill="var(--text)" font-family="Arial, sans-serif">parse TokenStream into AST</text>
  <rect x="80.678" y="516.687560849615" width="345.7626" height="47.124977753904" rx="6.139014860055" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="549.312481025389" text-anchor="middle" font-size="20.994919236818" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">quote</text>
  <text x="467.1186" y="549.312481025389" font-size="20.994919236818" fill="var(--text)" font-family="Arial, sans-serif">generate TokenStream from template</text>
  <rect x="80.678" y="572.875022246096" width="345.7626" height="47.124977753904" rx="6.139014860055" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="253.5594" y="605.500047109379" text-anchor="middle" font-size="20.994919236818" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">cargo expand</text>
  <text x="467.1186" y="605.500047109379" font-size="20.994919236818" fill="var(--text)" font-family="Arial, sans-serif">view expanded macro output</text>
</svg>

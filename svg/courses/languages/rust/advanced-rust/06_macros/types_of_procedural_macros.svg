<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="31.3708" font-weight="bold" fill="var(--text)">Types of Procedural Macros</text>
  <rect x="40" y="77.0212" width="1200" height="542.9788" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="80.6779" y="114.0425" width="244.0678" height="135.7447" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.7119" y="170.8085" text-anchor="middle" font-size="25.4888" font-weight="bold" fill="var(--primary-accent)">Derive</text>
  <rect x="365.4237" y="114.0425" width="833.8982" height="135.7447" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.885" />
  <text x="782.3729" y="163.4042" text-anchor="middle" font-size="23.5281" font-family="monospace" fill="var(--text)">#[derive(MyTrait)]</text>
  <text x="782.3729" y="212.766" text-anchor="middle" font-size="21.5674" fill="var(--text-muted)">Adds impl blocks to structs/enums</text>
  <rect x="80.6779" y="274.468" width="244.0678" height="135.7447" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.7119" y="331.234" text-anchor="middle" font-size="25.4888" font-weight="bold" fill="var(--ok-accent)">Attribute</text>
  <rect x="365.4237" y="274.468" width="833.8982" height="135.7447" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.885" />
  <text x="782.3729" y="323.8298" text-anchor="middle" font-size="23.5281" font-family="monospace" fill="var(--text)">#[my_attribute]</text>
  <text x="782.3729" y="373.1915" text-anchor="middle" font-size="21.5674" fill="var(--text-muted)">Transforms any item</text>
  <rect x="80.6779" y="434.8936" width="244.0678" height="135.7447" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.7119" y="484.2553" text-anchor="middle" font-size="25.4888" font-weight="bold" fill="var(--danger-accent)">Function</text>
  <text x="202.7119" y="526.2127" text-anchor="middle" font-size="25.4888" font-weight="bold" fill="var(--danger-accent)">-like</text>
  <rect x="365.4237" y="434.8936" width="833.8982" height="135.7447" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.885" />
  <text x="782.3729" y="484.2553" text-anchor="middle" font-size="23.5281" font-family="monospace" fill="var(--text)">my_macro!(...)</text>
  <text x="782.3729" y="533.6171" text-anchor="middle" font-size="21.5674" fill="var(--text-muted)">Arbitrary token transformation</text>
</svg>
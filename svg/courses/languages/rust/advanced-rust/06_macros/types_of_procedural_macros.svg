<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Types of Procedural Macros</text>
  <rect x="30" y="40" width="590" height="220" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <!-- Derive -->
  <rect x="50" y="55" width="120" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="110" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Derive</text>
  <rect x="190" y="55" width="410" height="55" rx="5" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="395" y="75" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">#[derive(MyTrait)]</text>
  <text x="395" y="95" text-anchor="middle" font-size="11" fill="#666">Adds impl blocks to structs/enums</text>
  <!-- Attribute -->
  <rect x="50" y="120" width="120" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="110" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Attribute</text>
  <rect x="190" y="120" width="410" height="55" rx="5" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="395" y="140" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">#[my_attribute]</text>
  <text x="395" y="160" text-anchor="middle" font-size="11" fill="#666">Transforms any item</text>
  <!-- Function-like -->
  <rect x="50" y="185" width="120" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="110" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Function</text>
  <text x="110" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">-like</text>
  <rect x="190" y="185" width="410" height="55" rx="5" fill="#fff" stroke="#ffc107" stroke-width="1"/>
  <text x="395" y="205" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">my_macro!(...)</text>
  <text x="395" y="225" text-anchor="middle" font-size="11" fill="#666">Arbitrary token transformation</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="31.3708" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Types of Procedural Macros</text>
  <rect x="40" y="77.0212" width="1200" height="542.9788" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="80.6779" y="114.0425" width="244.0678" height="135.7447" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.7119" y="170.8085" text-anchor="middle" font-size="25.4888" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Derive</text>
  <rect x="365.4237" y="114.0425" width="833.8982" height="135.7447" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.885"/>
  <text x="782.3729" y="163.4042" text-anchor="middle" font-size="23.5281" fill="var(--text)" font-family="Courier New, monospace">#[derive(MyTrait)]</text>
  <text x="782.3729" y="212.766" text-anchor="middle" font-size="21.5674" fill="var(--text-muted)" font-family="Arial, sans-serif">Adds impl blocks to structs/enums</text>
  <rect x="80.6779" y="274.468" width="244.0678" height="135.7447" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.7119" y="331.234" text-anchor="middle" font-size="25.4888" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Attribute</text>
  <rect x="365.4237" y="274.468" width="833.8982" height="135.7447" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.885"/>
  <text x="782.3729" y="323.8298" text-anchor="middle" font-size="23.5281" fill="var(--text)" font-family="Courier New, monospace">#[my_attribute]</text>
  <text x="782.3729" y="373.1915" text-anchor="middle" font-size="21.5674" fill="var(--text-muted)" font-family="Arial, sans-serif">Transforms any item</text>
  <rect x="80.6779" y="434.8936" width="244.0678" height="135.7447" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.7119" y="484.2553" text-anchor="middle" font-size="25.4888" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Function</text>
  <text x="202.7119" y="526.2127" text-anchor="middle" font-size="25.4888" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">-like</text>
  <rect x="365.4237" y="434.8936" width="833.8982" height="135.7447" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.885"/>
  <text x="782.3729" y="484.2553" text-anchor="middle" font-size="23.5281" fill="var(--text)" font-family="Courier New, monospace">my_macro!(...)</text>
  <text x="782.3729" y="533.6171" text-anchor="middle" font-size="21.5674" fill="var(--text-muted)" font-family="Arial, sans-serif">Arbitrary token transformation</text>
</svg>

  <ns0:text x="744.6049" y="184.6154" text-anchor="middle" font-size="22.6209" font-family="monospace" fill="var(--text-dark)">#[derive(MyTrait)]</ns0:text>
  <ns0:text x="744.6049" y="233.8462" text-anchor="middle" font-size="20.7358" fill="var(--text-mid)">Adds impl blocks to structs/enums</ns0:text>
  <ns0:rect x="94.2537" y="295.3846" width="226.2091" height="135.3846" rx="9.4254" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.7702" />
  <ns0:text x="207.3583" y="352" text-anchor="middle" font-size="24.506" font-weight="bold" fill="var(--ok-bright)">Attribute</ns0:text>
  <ns0:rect x="358.1643" y="295.3846" width="772.881" height="135.3846" rx="9.4254" fill="var(--bg)" stroke="var(--ok-bright)" stroke-width="1.885" />
  <ns0:text x="744.6049" y="344.6154" text-anchor="middle" font-size="22.6209" font-family="monospace" fill="var(--text-dark)">#[my_attribute]</ns0:text>
  <ns0:text x="744.6049" y="393.8462" text-anchor="middle" font-size="20.7358" fill="var(--text-mid)">Transforms any item</ns0:text>
  <ns0:rect x="94.2537" y="455.3846" width="226.2091" height="135.3846" rx="9.4254" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.7702" />
  <ns0:text x="207.3583" y="504.6154" text-anchor="middle" font-size="24.506" font-weight="bold" fill="var(--danger-deeper)">Function</ns0:text>
  <ns0:text x="207.3583" y="546.4615" text-anchor="middle" font-size="24.506" font-weight="bold" fill="var(--danger-deeper)">-like</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="261.818201322315" height="172.432435865595" rx="7.003964968875" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.909207933891" y="112.108153425853" text-anchor="middle" font-size="29.75377704978" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Derive</text>
  <rect x="345.454603966946" y="40" width="894.545396033054" height="172.432435865595" rx="7.003964968875" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.885"/>
  <text x="792.727409256207" y="102.702692403216" text-anchor="middle" font-size="27.464998030701" fill="var(--text)" font-family="Courier New, monospace">#[derive(MyTrait)]</text>
  <text x="792.727409256207" y="165.405511833443" text-anchor="middle" font-size="25.176219011621" fill="var(--text-muted)" font-family="Arial, sans-serif">Adds impl blocks to structs/enums</text>
  <rect x="40" y="243.783718553697" width="261.818201322315" height="172.432435865595" rx="7.003964968875" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.909207933891" y="315.89187197955" text-anchor="middle" font-size="29.75377704978" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Attribute</text>
  <rect x="345.454603966946" y="243.783718553697" width="894.545396033054" height="172.432435865595" rx="7.003964968875" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.885"/>
  <text x="792.727409256207" y="306.486537983923" text-anchor="middle" font-size="27.464998030701" fill="var(--text)" font-family="Courier New, monospace">#[my_attribute]</text>
  <text x="792.727409256207" y="369.18923038714" text-anchor="middle" font-size="25.176219011621" fill="var(--text-muted)" font-family="Arial, sans-serif">Transforms any item</text>
  <rect x="40" y="447.567564134405" width="261.818201322315" height="172.432435865595" rx="7.003964968875" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.909207933891" y="510.27025653762" text-anchor="middle" font-size="29.75377704978" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Function</text>
  <text x="170.909207933891" y="563.567487918198" text-anchor="middle" font-size="29.75377704978" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">-like</text>
  <rect x="345.454603966946" y="447.567564134405" width="894.545396033054" height="172.432435865595" rx="7.003964968875" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.885"/>
  <text x="792.727409256207" y="510.27025653762" text-anchor="middle" font-size="27.464998030701" fill="var(--text)" font-family="Courier New, monospace">my_macro!(...)</text>
  <text x="792.727409256207" y="572.973075967847" text-anchor="middle" font-size="25.176219011621" fill="var(--text-muted)" font-family="Arial, sans-serif">Arbitrary token transformation</text>
</svg>

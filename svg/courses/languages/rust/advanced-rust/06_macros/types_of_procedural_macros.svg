  <ns0:rect x="94.2537" y="135.3846" width="226.2091" height="135.3846" rx="9.4254" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.7702" />
  <ns0:text x="207.3583" y="192" text-anchor="middle" font-size="24.506" font-weight="bold" fill="var(--primary-bright)">Derive</ns0:text>

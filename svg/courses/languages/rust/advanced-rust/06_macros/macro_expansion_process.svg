<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Macro Expansion Process</text>
  <rect x="48" y="99" width="256" height="117" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="176" y="140.4" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">1. Source Code</text>
  <text x="176" y="180" text-anchor="middle" font-size="16" fill="#555">vec![1, 2, 3]</text>
  <line x1="304" y1="156.6" x2="368" y2="156.6" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="384" y="99" width="256" height="117" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="512" y="140.4" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">2. Tokenize</text>
  <text x="512" y="180" text-anchor="middle" font-size="16" fill="#555">Token Stream</text>
  <line x1="640" y1="156.6" x2="704" y2="156.6" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="720" y="99" width="256" height="117" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="848" y="140.4" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">3. Pattern Match</text>
  <text x="848" y="180" text-anchor="middle" font-size="16" fill="#555">Match macro arm</text>
  <line x1="976" y1="156.6" x2="1024" y2="156.6" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="1040" y="99" width="208" height="117" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="1144" y="140.4" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">4. Expand</text>
  <text x="1144" y="180" text-anchor="middle" font-size="16" fill="#555">Generate code</text>
  <rect x="48" y="270" width="1184" height="162" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="315" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Expanded Result</text>
  <text x="80" y="356.4" font-size="17.6" fill="#555">{</text>
  <text x="96" y="387" font-size="17.6" fill="#555">  let mut tmp = Vec::new(); tmp.push(1); tmp.push(2); tmp.push(3); tmp</text>
  <text x="80" y="417.6" font-size="17.6" fill="#555">}</text>
  <line x1="1144" y1="216" x2="1144" y2="252" stroke="#4a90e2" stroke-width="3.2" />
  <line x1="1144" y1="252" x2="640" y2="270" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="48" y="477" width="560" height="216" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="328" y="522" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Macro Hygiene</text>
  <text x="72" y="567" font-size="16" fill="#555">- Variables inside macros don't leak out</text>
  <text x="72" y="603" font-size="16" fill="#555">- Each expansion gets unique identifiers</text>
  <text x="72" y="639" font-size="16" fill="#555">- Prevents accidental name collisions</text>
  <text x="72" y="675" font-size="16" fill="#555">- Rust macros are hygienic by default</text>
  <rect x="656" y="477" width="576" height="216" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="944" y="522" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Recursive Expansion</text>
  <text x="680" y="567" font-size="16" fill="#555">- Macros can call other macros</text>
  <text x="680" y="603" font-size="16" fill="#555">- Expansion repeats until no macros left</text>
  <text x="680" y="639" font-size="16" fill="#555">- Default recursion limit: 128</text>
  <text x="680" y="675" font-size="16" fill="#555">- #![recursion_limit = "256"]</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="Arial, sans-serif">
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">When to Use What?</text>
  <!-- Generics -->
  <rect x="30" y="45" width="640" height="110" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="50" y="72" font-size="13" font-weight="bold" fill="#4a90e2">Use GENERICS when:</text>
  <text x="60" y="95" font-size="11" fill="#333">- Behavior varies by type but interface is the same</text>
  <text x="60" y="112" font-size="11" fill="#333">- You want type checking at call sites</text>
  <text x="60" y="129" font-size="11" fill="#333">- The pattern fits trait bounds</text>
  <text x="350" y="95" font-size="11" fill="#666">Best for: polymorphism, type-safe APIs</text>
  <!-- Declarative Macros -->
  <rect x="30" y="170" width="640" height="110" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="197" font-size="13" font-weight="bold" fill="#28a745">Use DECLARATIVE MACROS when:</text>
  <text x="60" y="220" font-size="11" fill="#333">- Reducing boilerplate code</text>
  <text x="60" y="237" font-size="11" fill="#333">- Variadic arguments (different numbers of args)</text>
  <text x="60" y="254" font-size="11" fill="#333">- DSL-like syntax</text>
  <text x="350" y="220" font-size="11" fill="#666">Best for: repetitive patterns, syntax sugar</text>
  <text x="350" y="237" font-size="11" fill="#333">- Code that varies in structure, not just types</text>
  <!-- Proc Macros -->
  <rect x="30" y="295" width="640" height="125" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="50" y="322" font-size="13" font-weight="bold" fill="#856404">Use PROC MACROS when:</text>
  <text x="60" y="345" font-size="11" fill="#333">- Deriving trait implementations</text>
  <text x="60" y="362" font-size="11" fill="#333">- Transforming item definitions</text>
  <text x="60" y="379" font-size="11" fill="#333">- Compile-time validation (SQL, regex, etc.)</text>
  <text x="60" y="396" font-size="11" fill="#333">- Generating code from external data (schemas, etc.)</text>
  <text x="400" y="345" font-size="11" fill="#666">Best for: derive, code generation, validation</text>
</svg>
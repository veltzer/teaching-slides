<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="595.9788" y="38.0952" text-anchor="middle" font-size="24.3809" font-weight="bold" fill="var(--text)">When to Use What?</text>
  <rect x="51.0839" y="68.5715" width="1089.7897" height="167.619" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="85.1399" y="109.7143" font-size="19.8095" font-weight="bold" fill="var(--primary-accent)">Use GENERICS when:</text>
  <text x="102.1678" y="144.7618" font-size="16.7619" fill="var(--text)">- Behavior varies by type but interface is the same</text>
  <text x="102.1678" y="170.6666" font-size="16.7619" fill="var(--text)">- You want type checking at call sites</text>
  <text x="102.1678" y="196.5714" font-size="16.7619" fill="var(--text)">- The pattern fits trait bounds</text>
  <text x="595.9788" y="144.7618" font-size="16.7619" fill="var(--text-muted)">Best for: polymorphism, type-safe APIs</text>
  <rect x="51.0839" y="259.0476" width="1089.7897" height="167.619" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="85.1399" y="300.1904" font-size="19.8095" font-weight="bold" fill="var(--ok-accent)">Use DECLARATIVE MACROS when:</text>
  <text x="102.1678" y="335.2381" font-size="16.7619" fill="var(--text)">- Reducing boilerplate code</text>
  <text x="102.1678" y="361.1428" font-size="16.7619" fill="var(--text)">- Variadic arguments (different numbers of args)</text>
  <text x="102.1678" y="387.0476" font-size="16.7619" fill="var(--text)">- DSL-like syntax</text>
  <text x="595.9788" y="335.2381" font-size="16.7619" fill="var(--text-muted)">Best for: repetitive patterns, syntax sugar</text>
  <text x="595.9788" y="361.1428" font-size="16.7619" fill="var(--text)">- Code that varies in structure, not just types</text>
  <rect x="51.0839" y="449.5238" width="1089.7897" height="190.4762" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="85.1399" y="490.6666" font-size="19.8095" font-weight="bold" fill="var(--danger-accent)">Use PROC MACROS when:</text>
  <text x="102.1678" y="525.7143" font-size="16.7619" fill="var(--text)">- Deriving trait implementations</text>
  <text x="102.1678" y="551.619" font-size="16.7619" fill="var(--text)">- Transforming item definitions</text>
  <text x="102.1678" y="577.5237" font-size="16.7619" fill="var(--text)">- Compile-time validation (SQL, regex, etc.)</text>
  <text x="102.1678" y="603.4285" font-size="16.7619" fill="var(--text)">- Generating code from external data (schemas, etc.)</text>
  <text x="681.1186" y="525.7143" font-size="16.7619" fill="var(--text-muted)">Best for: derive, code generation, validation</text>
</svg>
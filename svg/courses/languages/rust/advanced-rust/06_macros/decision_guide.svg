<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="595.9788" y="38.0952" text-anchor="middle" font-size="24.3809" font-weight="bold" fill="var(--text-dark)">When to Use What?</text>
  <rect x="51.0839" y="68.5715" width="1089.7897" height="167.619" rx="7.619" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.0476" />
  <text x="85.1399" y="109.7143" font-size="19.8095" font-weight="bold" fill="var(--primary-bright)">Use GENERICS when:</text>
  <text x="102.1678" y="144.7618" font-size="16.7619" fill="var(--text-dark)">- Behavior varies by type but interface is the same</text>
  <text x="102.1678" y="170.6666" font-size="16.7619" fill="var(--text-dark)">- You want type checking at call sites</text>
  <text x="102.1678" y="196.5714" font-size="16.7619" fill="var(--text-dark)">- The pattern fits trait bounds</text>
  <text x="595.9788" y="144.7618" font-size="16.7619" fill="var(--text-mid)">Best for: polymorphism, type-safe APIs</text>
  <rect x="51.0839" y="259.0476" width="1089.7897" height="167.619" rx="7.619" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.0476" />
  <text x="85.1399" y="300.1904" font-size="19.8095" font-weight="bold" fill="var(--ok-bright)">Use DECLARATIVE MACROS when:</text>
  <text x="102.1678" y="335.2381" font-size="16.7619" fill="var(--text-dark)">- Reducing boilerplate code</text>
  <text x="102.1678" y="361.1428" font-size="16.7619" fill="var(--text-dark)">- Variadic arguments (different numbers of args)</text>
  <text x="102.1678" y="387.0476" font-size="16.7619" fill="var(--text-dark)">- DSL-like syntax</text>
  <text x="595.9788" y="335.2381" font-size="16.7619" fill="var(--text-mid)">Best for: repetitive patterns, syntax sugar</text>
  <text x="595.9788" y="361.1428" font-size="16.7619" fill="var(--text-dark)">- Code that varies in structure, not just types</text>
  <rect x="51.0839" y="449.5238" width="1089.7897" height="190.4762" rx="7.619" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.0476" />
  <text x="85.1399" y="490.6666" font-size="19.8095" font-weight="bold" fill="var(--danger-deeper)">Use PROC MACROS when:</text>
  <text x="102.1678" y="525.7143" font-size="16.7619" fill="var(--text-dark)">- Deriving trait implementations</text>
  <text x="102.1678" y="551.619" font-size="16.7619" fill="var(--text-dark)">- Transforming item definitions</text>
  <text x="102.1678" y="577.5237" font-size="16.7619" fill="var(--text-dark)">- Compile-time validation (SQL, regex, etc.)</text>
  <text x="102.1678" y="603.4285" font-size="16.7619" fill="var(--text-dark)">- Generating code from external data (schemas, etc.)</text>
  <text x="681.1186" y="525.7143" font-size="16.7619" fill="var(--text-mid)">Best for: derive, code generation, validation</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.1142" font-weight="bold" fill="var(--text)">When to Use What?</text>
  <rect x="40" y="69.3672" width="1200" height="161.5189" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="109.0127" font-size="20.4053" font-weight="bold" fill="var(--primary-accent)">Use GENERICS when:</text>
  <text x="96.25" y="142.7847" font-size="17.266" fill="var(--text)">- Behavior varies by type but interface is the same</text>
  <text x="96.25" y="167.7468" font-size="17.266" fill="var(--text)">- You want type checking at call sites</text>
  <text x="96.25" y="192.7089" font-size="17.266" fill="var(--text)">- The pattern fits trait bounds</text>
  <text x="640.0001" y="142.7847" font-size="17.266" fill="var(--text-muted)">Best for: polymorphism, type-safe APIs</text>
  <rect x="40" y="252.9114" width="1200" height="161.5189" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="292.5569" font-size="20.4053" font-weight="bold" fill="var(--ok-accent)">Use DECLARATIVE MACROS when:</text>
  <text x="96.25" y="326.3291" font-size="17.266" fill="var(--text)">- Reducing boilerplate code</text>
  <text x="96.25" y="351.2911" font-size="17.266" fill="var(--text)">- Variadic arguments (different numbers of args)</text>
  <text x="96.25" y="376.2532" font-size="17.266" fill="var(--text)">- DSL-like syntax</text>
  <text x="640.0001" y="326.3291" font-size="17.266" fill="var(--text-muted)">Best for: repetitive patterns, syntax sugar</text>
  <text x="640.0001" y="351.2911" font-size="17.266" fill="var(--text)">- Code that varies in structure, not just types</text>
  <rect x="40" y="436.4557" width="1200" height="183.5443" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="476.1012" font-size="20.4053" font-weight="bold" fill="var(--danger-accent)">Use PROC MACROS when:</text>
  <text x="96.25" y="509.8734" font-size="17.266" fill="var(--text)">- Deriving trait implementations</text>
  <text x="96.25" y="534.8354" font-size="17.266" fill="var(--text)">- Transforming item definitions</text>
  <text x="96.25" y="559.7974" font-size="17.266" fill="var(--text)">- Compile-time validation (SQL, regex, etc.)</text>
  <text x="96.25" y="584.7594" font-size="17.266" fill="var(--text)">- Generating code from external data (schemas, etc.)</text>
  <text x="733.75" y="509.8734" font-size="17.266" fill="var(--text-muted)">Best for: derive, code generation, validation</text>
</svg>
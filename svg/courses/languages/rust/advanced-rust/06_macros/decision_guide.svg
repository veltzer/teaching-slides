<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="595.9788" y="38.0952" text-anchor="middle" font-size="24.3809" font-weight="bold" fill="#333">When to Use What?</ns0:text>
  <ns0:rect x="51.0839" y="68.5715" width="1089.7897" height="167.619" rx="7.619" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.0476" />
  <ns0:text x="85.1399" y="109.7143" font-size="19.8095" font-weight="bold" fill="#4a90e2">Use GENERICS when:</ns0:text>
  <ns0:text x="102.1678" y="144.7618" font-size="16.7619" fill="#333">- Behavior varies by type but interface is the same</ns0:text>
  <ns0:text x="102.1678" y="170.6666" font-size="16.7619" fill="#333">- You want type checking at call sites</ns0:text>
  <ns0:text x="102.1678" y="196.5714" font-size="16.7619" fill="#333">- The pattern fits trait bounds</ns0:text>
  <ns0:text x="595.9788" y="144.7618" font-size="16.7619" fill="#666">Best for: polymorphism, type-safe APIs</ns0:text>
  <ns0:rect x="51.0839" y="259.0476" width="1089.7897" height="167.619" rx="7.619" fill="#d4edda" stroke="#28a745" stroke-width="3.0476" />
  <ns0:text x="85.1399" y="300.1904" font-size="19.8095" font-weight="bold" fill="#28a745">Use DECLARATIVE MACROS when:</ns0:text>
  <ns0:text x="102.1678" y="335.2381" font-size="16.7619" fill="#333">- Reducing boilerplate code</ns0:text>
  <ns0:text x="102.1678" y="361.1428" font-size="16.7619" fill="#333">- Variadic arguments (different numbers of args)</ns0:text>
  <ns0:text x="102.1678" y="387.0476" font-size="16.7619" fill="#333">- DSL-like syntax</ns0:text>
  <ns0:text x="595.9788" y="335.2381" font-size="16.7619" fill="#666">Best for: repetitive patterns, syntax sugar</ns0:text>
  <ns0:text x="595.9788" y="361.1428" font-size="16.7619" fill="#333">- Code that varies in structure, not just types</ns0:text>
  <ns0:rect x="51.0839" y="449.5238" width="1089.7897" height="190.4762" rx="7.619" fill="#fff3cd" stroke="#ffc107" stroke-width="3.0476" />
  <ns0:text x="85.1399" y="490.6666" font-size="19.8095" font-weight="bold" fill="#856404">Use PROC MACROS when:</ns0:text>
  <ns0:text x="102.1678" y="525.7143" font-size="16.7619" fill="#333">- Deriving trait implementations</ns0:text>
  <ns0:text x="102.1678" y="551.619" font-size="16.7619" fill="#333">- Transforming item definitions</ns0:text>
  <ns0:text x="102.1678" y="577.5237" font-size="16.7619" fill="#333">- Compile-time validation (SQL, regex, etc.)</ns0:text>
  <ns0:text x="102.1678" y="603.4285" font-size="16.7619" fill="#333">- Generating code from external data (schemas, etc.)</ns0:text>
  <ns0:text x="681.1186" y="525.7143" font-size="16.7619" fill="#666">Best for: derive, code generation, validation</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="40.9091" text-anchor="middle" font-size="26.1818" font-weight="bold" fill="#333">When to Use What?</text>
  <rect x="54.8571" y="73.6364" width="1170.2857" height="180" rx="8.1818" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2727" />
  <text x="91.4286" y="117.8182" font-size="21.2727" font-weight="bold" fill="#4a90e2">Use GENERICS when:</text>
  <text x="109.7143" y="155.4545" font-size="18" fill="#333">- Behavior varies by type but interface is the same</text>
  <text x="109.7143" y="183.2727" font-size="18" fill="#333">- You want type checking at call sites</text>
  <text x="109.7143" y="211.0909" font-size="18" fill="#333">- The pattern fits trait bounds</text>
  <text x="640" y="155.4545" font-size="18" fill="#666">Best for: polymorphism, type-safe APIs</text>
  <rect x="54.8571" y="278.1818" width="1170.2857" height="180" rx="8.1818" fill="#d4edda" stroke="#28a745" stroke-width="3.2727" />
  <text x="91.4286" y="322.3636" font-size="21.2727" font-weight="bold" fill="#28a745">Use DECLARATIVE MACROS when:</text>
  <text x="109.7143" y="360" font-size="18" fill="#333">- Reducing boilerplate code</text>
  <text x="109.7143" y="387.8182" font-size="18" fill="#333">- Variadic arguments (different numbers of args)</text>
  <text x="109.7143" y="415.6364" font-size="18" fill="#333">- DSL-like syntax</text>
  <text x="640" y="360" font-size="18" fill="#666">Best for: repetitive patterns, syntax sugar</text>
  <text x="640" y="387.8182" font-size="18" fill="#333">- Code that varies in structure, not just types</text>
  <rect x="54.8571" y="482.7273" width="1170.2857" height="204.5455" rx="8.1818" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2727" />
  <text x="91.4286" y="526.9091" font-size="21.2727" font-weight="bold" fill="#856404">Use PROC MACROS when:</text>
  <text x="109.7143" y="564.5455" font-size="18" fill="#333">- Deriving trait implementations</text>
  <text x="109.7143" y="592.3636" font-size="18" fill="#333">- Transforming item definitions</text>
  <text x="109.7143" y="620.1818" font-size="18" fill="#333">- Compile-time validation (SQL, regex, etc.)</text>
  <text x="109.7143" y="648" font-size="18" fill="#333">- Generating code from external data (schemas, etc.)</text>
  <text x="731.4286" y="564.5455" font-size="18" fill="#666">Best for: derive, code generation, validation</text>
</svg>
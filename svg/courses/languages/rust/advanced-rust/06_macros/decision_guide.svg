<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.1142" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">When to Use What?</text>
  <rect x="40" y="69.3672" width="1200" height="161.5189" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="109.0127" font-size="20.4053" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use GENERICS when:</text>
  <text x="96.25" y="142.7847" font-size="17.266" fill="var(--text)" font-family="Arial, sans-serif">- Behavior varies by type but interface is the same</text>
  <text x="96.25" y="167.7468" font-size="17.266" fill="var(--text)" font-family="Arial, sans-serif">- You want type checking at call sites</text>
  <text x="96.25" y="192.7089" font-size="17.266" fill="var(--text)" font-family="Arial, sans-serif">- The pattern fits trait bounds</text>
  <text x="640.0001" y="142.7847" font-size="17.266" fill="var(--text-muted)" font-family="Arial, sans-serif">Best for: polymorphism, type-safe APIs</text>
  <rect x="40" y="252.9114" width="1200" height="161.5189" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="292.5569" font-size="20.4053" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Use DECLARATIVE MACROS when:</text>
  <text x="96.25" y="326.3291" font-size="17.266" fill="var(--text)" font-family="Arial, sans-serif">- Reducing boilerplate code</text>
  <text x="96.25" y="351.2911" font-size="17.266" fill="var(--text)" font-family="Arial, sans-serif">- Variadic arguments (different numbers of args)</text>
  <text x="96.25" y="376.2532" font-size="17.266" fill="var(--text)" font-family="Arial, sans-serif">- DSL-like syntax</text>
  <text x="640.0001" y="326.3291" font-size="17.266" fill="var(--text-muted)" font-family="Arial, sans-serif">Best for: repetitive patterns, syntax sugar</text>
  <text x="640.0001" y="351.2911" font-size="17.266" fill="var(--text)" font-family="Arial, sans-serif">- Code that varies in structure, not just types</text>
  <rect x="40" y="436.4557" width="1200" height="183.5443" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="476.1012" font-size="20.4053" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Use PROC MACROS when:</text>
  <text x="96.25" y="509.8734" font-size="17.266" fill="var(--text)" font-family="Arial, sans-serif">- Deriving trait implementations</text>
  <text x="96.25" y="534.8354" font-size="17.266" fill="var(--text)" font-family="Arial, sans-serif">- Transforming item definitions</text>
  <text x="96.25" y="559.7974" font-size="17.266" fill="var(--text)" font-family="Arial, sans-serif">- Compile-time validation (SQL, regex, etc.)</text>
  <text x="96.25" y="584.7594" font-size="17.266" fill="var(--text)" font-family="Arial, sans-serif">- Generating code from external data (schemas, etc.)</text>
  <text x="733.75" y="509.8734" font-size="17.266" fill="var(--text-muted)" font-family="Arial, sans-serif">Best for: derive, code generation, validation</text>
</svg>
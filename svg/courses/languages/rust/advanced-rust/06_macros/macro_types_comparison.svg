<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="10.5" refX="16" refY="5.25" orient="auto">
      <polygon points="0,15 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Macro Types Comparison</text>
  <rect x="48" y="82.5" width="560" height="285" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="328" y="120" text-anchor="middle" font-size="21" font-weight="bold" fill="#28a745">Declarative (macro_rules!)</text>
  <text x="72" y="157.5" font-size="16.5" fill="#555">macro_rules! say_hello {</text>
  <text x="88" y="184.5" font-size="16.5" fill="#555">  () =&gt; { println!("Hello!") };</text>
  <text x="88" y="211.5" font-size="16.5" fill="#555">  ($name:expr) =&gt; {</text>
  <text x="104" y="238.5" font-size="16.5" fill="#555">    println!("Hello, {}!", $name)</text>
  <text x="88" y="265.5" font-size="16.5" fill="#555">  };</text>
  <text x="72" y="292.5" font-size="16.5" fill="#555">}</text>
  <rect x="72" y="315" width="512" height="33" rx="4.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="328" y="339" text-anchor="middle" font-size="15" fill="#333">Pattern matching on token trees</text>
  <rect x="672" y="82.5" width="560" height="285" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="952" y="120" text-anchor="middle" font-size="21" font-weight="bold" fill="#4a90e2">Procedural (proc_macro)</text>
  <text x="696" y="157.5" font-size="16.5" fill="#555">#[proc_macro]</text>
  <text x="696" y="184.5" font-size="16.5" fill="#555">pub fn my_macro(input:</text>
  <text x="712" y="211.5" font-size="16.5" fill="#555">  TokenStream) -&gt; TokenStream</text>
  <text x="696" y="238.5" font-size="16.5" fill="#555">{</text>
  <text x="712" y="265.5" font-size="16.5" fill="#555">  // full Rust code here</text>
  <text x="696" y="292.5" font-size="16.5" fill="#555">}</text>
  <rect x="696" y="315" width="512" height="33" rx="4.5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5" />
  <text x="952" y="339" text-anchor="middle" font-size="15" fill="#333">Arbitrary Rust code transforms tokens</text>
  <rect x="48" y="405" width="1184" height="292.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="640" y="442.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#333">Comparison</text>
  <text x="288" y="480" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Feature</text>
  <text x="640" y="480" text-anchor="middle" font-size="18" font-weight="bold" fill="#28a745">Declarative</text>
  <text x="992" y="480" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a90e2">Procedural</text>
  <line x1="80" y1="492" x2="1200" y2="492" stroke="#ffc107" stroke-width="1.5" />
  <text x="288" y="522" text-anchor="middle" font-size="16.5" fill="#555">Complexity</text>
  <text x="640" y="522" text-anchor="middle" font-size="16.5" fill="#555">Simple patterns</text>
  <text x="992" y="522" text-anchor="middle" font-size="16.5" fill="#555">Full Rust power</text>
  <text x="288" y="555" text-anchor="middle" font-size="16.5" fill="#555">Crate type</text>
  <text x="640" y="555" text-anchor="middle" font-size="16.5" fill="#555">Same crate</text>
  <text x="992" y="555" text-anchor="middle" font-size="16.5" fill="#555">Separate crate</text>
  <text x="288" y="588" text-anchor="middle" font-size="16.5" fill="#555">Debugging</text>
  <text x="640" y="588" text-anchor="middle" font-size="16.5" fill="#555">cargo expand</text>
  <text x="992" y="588" text-anchor="middle" font-size="16.5" fill="#555">cargo expand + logs</text>
  <text x="288" y="621" text-anchor="middle" font-size="16.5" fill="#555">Use cases</text>
  <text x="640" y="621" text-anchor="middle" font-size="16.5" fill="#555">vec!, println!</text>
  <text x="992" y="621" text-anchor="middle" font-size="16.5" fill="#555">#[derive], #[tokio::main]</text>
  <text x="288" y="654" text-anchor="middle" font-size="16.5" fill="#555">Hygiene</text>
  <text x="640" y="654" text-anchor="middle" font-size="16.5" fill="#555">Fully hygienic</text>
  <text x="992" y="654" text-anchor="middle" font-size="16.5" fill="#555">Semi-hygienic</text>
  <text x="288" y="687" text-anchor="middle" font-size="16.5" fill="#555">Compile time</text>
  <text x="640" y="687" text-anchor="middle" font-size="16.5" fill="#555">Fast</text>
  <text x="992" y="687" text-anchor="middle" font-size="16.5" fill="#555">Slower (compiles crate)</text>
</svg>
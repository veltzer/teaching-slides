<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Macro Types Comparison</text>
  <!-- Declarative -->
  <rect x="30" y="55" width="350" height="190" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="205" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Declarative (macro_rules!)</text>
  <text x="45" y="105" font-size="11" fill="#555">macro_rules! say_hello {</text>
  <text x="55" y="123" font-size="11" fill="#555">  () =&gt; { println!("Hello!") };</text>
  <text x="55" y="141" font-size="11" fill="#555">  ($name:expr) =&gt; {</text>
  <text x="65" y="159" font-size="11" fill="#555">    println!("Hello, {}!", $name)</text>
  <text x="55" y="177" font-size="11" fill="#555">  };</text>
  <text x="45" y="195" font-size="11" fill="#555">}</text>
  <rect x="45" y="210" width="320" height="22" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="205" y="226" text-anchor="middle" font-size="10" fill="#333">Pattern matching on token trees</text>
  <!-- Procedural -->
  <rect x="420" y="55" width="350" height="190" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="595" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Procedural (proc_macro)</text>
  <text x="435" y="105" font-size="11" fill="#555">#[proc_macro]</text>
  <text x="435" y="123" font-size="11" fill="#555">pub fn my_macro(input:</text>
  <text x="445" y="141" font-size="11" fill="#555">  TokenStream) -&gt; TokenStream</text>
  <text x="435" y="159" font-size="11" fill="#555">{</text>
  <text x="445" y="177" font-size="11" fill="#555">  // full Rust code here</text>
  <text x="435" y="195" font-size="11" fill="#555">}</text>
  <rect x="435" y="210" width="320" height="22" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="595" y="226" text-anchor="middle" font-size="10" fill="#333">Arbitrary Rust code transforms tokens</text>
  <!-- Comparison table -->
  <rect x="30" y="270" width="740" height="195" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Comparison</text>
  <!-- Headers -->
  <text x="180" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Feature</text>
  <text x="400" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Declarative</text>
  <text x="620" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Procedural</text>
  <line x1="50" y1="328" x2="750" y2="328" stroke="#ffc107" stroke-width="1"/>
  <text x="180" y="348" text-anchor="middle" font-size="11" fill="#555">Complexity</text>
  <text x="400" y="348" text-anchor="middle" font-size="11" fill="#555">Simple patterns</text>
  <text x="620" y="348" text-anchor="middle" font-size="11" fill="#555">Full Rust power</text>
  <text x="180" y="370" text-anchor="middle" font-size="11" fill="#555">Crate type</text>
  <text x="400" y="370" text-anchor="middle" font-size="11" fill="#555">Same crate</text>
  <text x="620" y="370" text-anchor="middle" font-size="11" fill="#555">Separate crate</text>
  <text x="180" y="392" text-anchor="middle" font-size="11" fill="#555">Debugging</text>
  <text x="400" y="392" text-anchor="middle" font-size="11" fill="#555">cargo expand</text>
  <text x="620" y="392" text-anchor="middle" font-size="11" fill="#555">cargo expand + logs</text>
  <text x="180" y="414" text-anchor="middle" font-size="11" fill="#555">Use cases</text>
  <text x="400" y="414" text-anchor="middle" font-size="11" fill="#555">vec!, println!</text>
  <text x="620" y="414" text-anchor="middle" font-size="11" fill="#555">#[derive], #[tokio::main]</text>
  <text x="180" y="436" text-anchor="middle" font-size="11" fill="#555">Hygiene</text>
  <text x="400" y="436" text-anchor="middle" font-size="11" fill="#555">Fully hygienic</text>
  <text x="620" y="436" text-anchor="middle" font-size="11" fill="#555">Semi-hygienic</text>
  <text x="180" y="458" text-anchor="middle" font-size="11" fill="#555">Compile time</text>
  <text x="400" y="458" text-anchor="middle" font-size="11" fill="#555">Fast</text>
  <text x="620" y="458" text-anchor="middle" font-size="11" fill="#555">Slower (compiles crate)</text>
</svg>
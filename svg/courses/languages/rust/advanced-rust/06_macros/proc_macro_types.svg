<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="11.2" refX="16" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Procedural Macro Types</text>
  <rect x="48" y="88" width="368" height="272" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="232" y="128" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">Function-like</text>
  <text x="72" y="168" font-size="16" fill="#555">#[proc_macro]</text>
  <text x="72" y="196.8" font-size="16" fill="#555">pub fn sql(input:</text>
  <text x="88" y="222.4" font-size="16" fill="#555">TokenStream)</text>
  <text x="88" y="248" font-size="16" fill="#555">-&gt; TokenStream</text>
  <line x1="72" y1="268.8" x2="392" y2="268.8" stroke="#28a745" stroke-width="1.6" />
  <text x="232" y="300.8" text-anchor="middle" font-size="16" fill="#555">Usage:</text>
  <text x="232" y="328" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">sql!(SELECT * FROM users)</text>
  <rect x="456" y="88" width="368" height="272" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="128" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#4a90e2">Derive Macro</text>
  <text x="480" y="168" font-size="16" fill="#555">#[proc_macro_derive(</text>
  <text x="496" y="193.6" font-size="16" fill="#555">MyTrait)]</text>
  <text x="480" y="222.4" font-size="16" fill="#555">pub fn derive_my(</text>
  <text x="496" y="248" font-size="16" fill="#555">input: TokenStream)</text>
  <line x1="480" y1="268.8" x2="800" y2="268.8" stroke="#4a90e2" stroke-width="1.6" />
  <text x="640" y="300.8" text-anchor="middle" font-size="16" fill="#555">Usage:</text>
  <text x="640" y="328" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">#[derive(MyTrait)]</text>
  <rect x="864" y="88" width="368" height="272" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="1048" y="128" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Attribute Macro</text>
  <text x="888" y="168" font-size="16" fill="#555">#[proc_macro_attribute]</text>
  <text x="888" y="196.8" font-size="16" fill="#555">pub fn route(attr:</text>
  <text x="904" y="222.4" font-size="16" fill="#555">TokenStream, item:</text>
  <text x="904" y="248" font-size="16" fill="#555">TokenStream)</text>
  <line x1="888" y1="268.8" x2="1208" y2="268.8" stroke="#ffc107" stroke-width="1.6" />
  <text x="1048" y="300.8" text-anchor="middle" font-size="16" fill="#555">Usage:</text>
  <text x="1048" y="328" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">#[route(GET, "/")]</text>
  <rect x="48" y="408" width="1184" height="128" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="448" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Common Processing Pipeline</text>
  <rect x="80" y="472" width="192" height="44.8" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="176" y="502.4" text-anchor="middle" font-size="16" fill="#333">TokenStream</text>
  <line x1="272" y1="494.4" x2="336" y2="494.4" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="352" y="472" width="192" height="44.8" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="448" y="502.4" text-anchor="middle" font-size="16" fill="#333">syn::parse</text>
  <line x1="544" y1="494.4" x2="608" y2="494.4" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="624" y="472" width="192" height="44.8" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="720" y="502.4" text-anchor="middle" font-size="16" fill="#333">Transform AST</text>
  <line x1="816" y1="494.4" x2="880" y2="494.4" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="896" y="472" width="192" height="44.8" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="992" y="502.4" text-anchor="middle" font-size="16" fill="#333">quote! {}</text>
  <line x1="1088" y1="494.4" x2="1136" y2="494.4" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="1184" y="502.4" font-size="16" fill="#555">Output</text>
  <rect x="48" y="576" width="1184" height="120" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="640" y="616" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Essential Crates</text>
  <text x="224" y="656" text-anchor="middle" font-size="17.6" fill="#555">syn - parsing</text>
  <text x="480" y="656" text-anchor="middle" font-size="17.6" fill="#555">quote - code gen</text>
  <text x="768" y="656" text-anchor="middle" font-size="17.6" fill="#555">proc-macro2 - tokens</text>
  <text x="1056" y="656" text-anchor="middle" font-size="17.6" fill="#555">darling - attributes</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="12.6" refX="16" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Pipeline Concurrency Pattern</text>
  <rect x="48" y="126" width="240" height="144" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="168" y="171" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Stage 1</text>
  <text x="168" y="207" text-anchor="middle" font-size="16" fill="#555">Read / Parse</text>
  <text x="168" y="243" text-anchor="middle" font-size="16" fill="#555">Thread/Task A</text>
  <line x1="288" y1="198" x2="384" y2="198" stroke="#ffc107" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="312" y="171" width="48" height="54" rx="4.8" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6" />
  <text x="336" y="207" text-anchor="middle" font-size="16" fill="#333">ch</text>
  <rect x="400" y="126" width="240" height="144" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="520" y="171" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Stage 2</text>
  <text x="520" y="207" text-anchor="middle" font-size="16" fill="#555">Transform</text>
  <text x="520" y="243" text-anchor="middle" font-size="16" fill="#555">Thread/Task B</text>
  <line x1="640" y1="198" x2="736" y2="198" stroke="#ffc107" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="664" y="171" width="48" height="54" rx="4.8" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6" />
  <text x="688" y="207" text-anchor="middle" font-size="16" fill="#333">ch</text>
  <rect x="752" y="126" width="240" height="144" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="872" y="171" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Stage 3</text>
  <text x="872" y="207" text-anchor="middle" font-size="16" fill="#555">Filter</text>
  <text x="872" y="243" text-anchor="middle" font-size="16" fill="#555">Thread/Task C</text>
  <line x1="992" y1="198" x2="1088" y2="198" stroke="#ffc107" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="1016" y="171" width="48" height="54" rx="4.8" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6" />
  <text x="1040" y="207" text-anchor="middle" font-size="16" fill="#333">ch</text>
  <rect x="1104" y="126" width="128" height="144" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="1168" y="171" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Sink</text>
  <text x="1168" y="207" text-anchor="middle" font-size="16" fill="#555">Write</text>
  <rect x="48" y="324" width="1184" height="162" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="640" y="369" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Why Pipelines Improve Throughput</text>
  <text x="80" y="414" font-size="16" fill="#555">Item 1:</text>
  <rect x="176" y="392.4" width="96" height="27" rx="3.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <rect x="272" y="392.4" width="96" height="27" rx="3.2" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <rect x="368" y="392.4" width="96" height="27" rx="3.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <text x="80" y="450" font-size="16" fill="#555">Item 2:</text>
  <rect x="272" y="428.4" width="96" height="27" rx="3.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <rect x="368" y="428.4" width="96" height="27" rx="3.2" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <rect x="464" y="428.4" width="96" height="27" rx="3.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <text x="80" y="477" font-size="16" fill="#555">Item 3:</text>
  <rect x="368" y="459" width="96" height="27" rx="3.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <rect x="464" y="459" width="96" height="27" rx="3.2" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <rect x="560" y="459" width="96" height="27" rx="3.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <text x="800" y="441" font-size="16" fill="#555">All stages run concurrently!</text>
  <text x="800" y="471.6" font-size="16" fill="#555">Throughput = speed of slowest stage</text>
  <rect x="48" y="531" width="1184" height="162" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="640" y="576" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Rust Implementation</text>
  <text x="72" y="617.4" font-size="16" fill="#555">Connect stages with mpsc channels: each stage reads from rx, processes, writes to next tx</text>
  <text x="72" y="653.4" font-size="16" fill="#555">Bounded channels provide natural backpressure when a stage is slower</text>
  <text x="72" y="680.4" font-size="16" fill="#555">Drop sender to signal completion; receiver returns None to terminate the stage</text>
</svg>
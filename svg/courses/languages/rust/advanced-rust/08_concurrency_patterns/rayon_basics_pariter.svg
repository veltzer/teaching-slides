<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-size="30.3158" font-weight="bold" fill="#333">Rayon par_iter: Work-Stealing Parallelism</ns0:text>
  <ns0:text x="598.8304" y="109.4737" text-anchor="middle" font-size="25.2632" font-weight="bold" fill="#4a90e2">Sequential</ns0:text>
  <ns0:rect x="85.5472" y="126.3158" width="1026.5665" height="75.7895" rx="8.4211" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3684" />
  <ns0:text x="136.8755" y="171.7895" font-size="20.2105" fill="#333">[1, 2, 3, 4, 5, 6, 7, 8]</ns0:text>
  <ns0:text x="479.0643" y="171.7895" font-size="20.2105" fill="#555">--&gt; map --&gt; map --&gt; map --&gt; ... --&gt; sum</ns0:text>
  <ns0:text x="598.8304" y="261.0526" text-anchor="middle" font-size="25.2632" font-weight="bold" fill="#28a745">Parallel (rayon work-stealing)</ns0:text>
  <ns0:rect x="256.6416" y="286.3158" width="684.3776" height="58.9474" rx="8.4211" fill="#fff3cd" stroke="#ffc107" stroke-width="3.3684" />
  <ns0:text x="598.8304" y="325.0526" text-anchor="middle" font-size="21.8947" fill="#333">[1, 2, 3, 4, 5, 6, 7, 8]</ns0:text>
  <ns0:line x1="461.9549" y1="345.2632" x2="342.1888" y2="387.3684" stroke="#28a745" stroke-width="3.3684" marker-end="url(#arrowG)" />
  <ns0:line x1="735.7059" y1="345.2632" x2="855.472" y2="387.3684" stroke="#28a745" stroke-width="3.3684" marker-end="url(#arrowG)" />
  <ns0:rect x="171.0944" y="387.3684" width="342.1888" height="117.8947" rx="8.4211" fill="#d4edda" stroke="#28a745" stroke-width="3.3684" />
  <ns0:text x="342.1888" y="429.4737" text-anchor="middle" font-size="21.8947" font-weight="bold" fill="#333">Thread 1</ns0:text>
  <ns0:text x="342.1888" y="463.1579" text-anchor="middle" font-size="20.2105" fill="#555">[1, 2, 3, 4] map+sum</ns0:text>
  <ns0:rect x="684.3776" y="387.3684" width="342.1888" height="117.8947" rx="8.4211" fill="#d4edda" stroke="#28a745" stroke-width="3.3684" />
  <ns0:text x="855.472" y="429.4737" text-anchor="middle" font-size="21.8947" font-weight="bold" fill="#333">Thread 2</ns0:text>
  <ns0:text x="855.472" y="463.1579" text-anchor="middle" font-size="20.2105" fill="#555">[5, 6, 7, 8] map+sum</ns0:text>
  <ns0:line x1="342.1888" y1="505.2632" x2="547.5021" y2="572.6316" stroke="#28a745" stroke-width="3.3684" marker-end="url(#arrowG)" />
  <ns0:line x1="855.472" y1="505.2632" x2="650.1587" y2="572.6316" stroke="#28a745" stroke-width="3.3684" marker-end="url(#arrowG)" />
  <ns0:rect x="496.1738" y="572.6316" width="205.3133" height="67.3684" rx="8.4211" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3684" />
  <ns0:text x="598.8304" y="614.7368" text-anchor="middle" font-size="23.5789" font-weight="bold" fill="#333">combine</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>

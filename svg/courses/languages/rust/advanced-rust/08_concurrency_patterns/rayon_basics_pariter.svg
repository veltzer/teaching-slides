<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="54" text-anchor="middle" font-size="32.4" font-weight="bold" fill="#333">Rayon par_iter: Work-Stealing Parallelism</text>
  <text x="640" y="117" text-anchor="middle" font-size="27" font-weight="bold" fill="#4a90e2">Sequential</text>
  <rect x="91.4286" y="135" width="1097.1429" height="81" rx="9" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6" />
  <text x="146.2857" y="183.6" font-size="21.6" fill="#333">[1, 2, 3, 4, 5, 6, 7, 8]</text>
  <text x="512" y="183.6" font-size="21.6" fill="#555">--&gt; map --&gt; map --&gt; map --&gt; ... --&gt; sum</text>
  <text x="640" y="279" text-anchor="middle" font-size="27" font-weight="bold" fill="#28a745">Parallel (rayon work-stealing)</text>
  <rect x="274.2857" y="306" width="731.4286" height="63" rx="9" fill="#fff3cd" stroke="#ffc107" stroke-width="3.6" />
  <text x="640" y="347.4" text-anchor="middle" font-size="23.4" fill="#333">[1, 2, 3, 4, 5, 6, 7, 8]</text>
  <line x1="493.7143" y1="369" x2="365.7143" y2="414" stroke="#28a745" stroke-width="3.6" marker-end="url(#arrowG)" />
  <line x1="786.2857" y1="369" x2="914.2857" y2="414" stroke="#28a745" stroke-width="3.6" marker-end="url(#arrowG)" />
  <rect x="182.8571" y="414" width="365.7143" height="126" rx="9" fill="#d4edda" stroke="#28a745" stroke-width="3.6" />
  <text x="365.7143" y="459" text-anchor="middle" font-size="23.4" font-weight="bold" fill="#333">Thread 1</text>
  <text x="365.7143" y="495" text-anchor="middle" font-size="21.6" fill="#555">[1, 2, 3, 4] map+sum</text>
  <rect x="731.4286" y="414" width="365.7143" height="126" rx="9" fill="#d4edda" stroke="#28a745" stroke-width="3.6" />
  <text x="914.2857" y="459" text-anchor="middle" font-size="23.4" font-weight="bold" fill="#333">Thread 2</text>
  <text x="914.2857" y="495" text-anchor="middle" font-size="21.6" fill="#555">[5, 6, 7, 8] map+sum</text>
  <line x1="365.7143" y1="540" x2="585.1429" y2="612" stroke="#28a745" stroke-width="3.6" marker-end="url(#arrowG)" />
  <line x1="914.2857" y1="540" x2="694.8571" y2="612" stroke="#28a745" stroke-width="3.6" marker-end="url(#arrowG)" />
  <rect x="530.2857" y="612" width="219.4286" height="72" rx="9" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6" />
  <text x="640" y="657" text-anchor="middle" font-size="25.2" font-weight="bold" fill="#333">combine</text>
  <defs>
    <marker id="arrowG" markerWidth="18.2857" markerHeight="12.6" refX="18.2857" refY="6.3" orient="auto">
      <polygon points="0,18 6.4,0" fill="#28a745" />
    </marker>
  </defs>
</svg>
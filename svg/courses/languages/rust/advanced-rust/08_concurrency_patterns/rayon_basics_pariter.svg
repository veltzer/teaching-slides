<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="598.8304" y="50.5263" text-anchor="middle" font-size="30.3158" font-weight="bold" fill="var(--text)">Rayon par_iter: Work-Stealing Parallelism</text>
  <text x="598.8304" y="109.4737" text-anchor="middle" font-size="25.2632" font-weight="bold" fill="var(--primary-accent)">Sequential</text>
  <rect x="85.5472" y="126.3158" width="1026.5665" height="75.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136.8755" y="171.7895" font-size="20.2105" fill="var(--text)">[1, 2, 3, 4, 5, 6, 7, 8]</text>
  <text x="479.0643" y="171.7895" font-size="20.2105" fill="var(--text-muted)">--&gt; map --&gt; map --&gt; map --&gt; ... --&gt; sum</text>
  <text x="598.8304" y="261.0526" text-anchor="middle" font-size="25.2632" font-weight="bold" fill="var(--ok-accent)">Parallel (rayon work-stealing)</text>
  <rect x="256.6416" y="286.3158" width="684.3776" height="58.9474" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="598.8304" y="325.0526" text-anchor="middle" font-size="21.8947" fill="var(--text)">[1, 2, 3, 4, 5, 6, 7, 8]</text>
  <line x1="461.9549" y1="345.2632" x2="342.1888" y2="387.3684" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <line x1="735.7059" y1="345.2632" x2="855.472" y2="387.3684" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <rect x="171.0944" y="387.3684" width="342.1888" height="117.8947" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="342.1888" y="429.4737" text-anchor="middle" font-size="21.8947" font-weight="bold" fill="var(--text)">Thread 1</text>
  <text x="342.1888" y="463.1579" text-anchor="middle" font-size="20.2105" fill="var(--text-muted)">[1, 2, 3, 4] map+sum</text>
  <rect x="684.3776" y="387.3684" width="342.1888" height="117.8947" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="855.472" y="429.4737" text-anchor="middle" font-size="21.8947" font-weight="bold" fill="var(--text)">Thread 2</text>
  <text x="855.472" y="463.1579" text-anchor="middle" font-size="20.2105" fill="var(--text-muted)">[5, 6, 7, 8] map+sum</text>
  <line x1="342.1888" y1="505.2632" x2="547.5021" y2="572.6316" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <line x1="855.472" y1="505.2632" x2="650.1587" y2="572.6316" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <rect x="496.1738" y="572.6316" width="205.3133" height="67.3684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="598.8304" y="614.7368" text-anchor="middle" font-size="23.5789" font-weight="bold" fill="var(--text)">combine</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.4,0" fill="#28a745" />
    </marker>
  </defs>
</svg>
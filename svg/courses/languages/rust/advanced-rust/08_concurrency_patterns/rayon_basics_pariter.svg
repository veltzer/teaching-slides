<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Rayon par_iter: Work-Stealing Parallelism</text>
  <!-- Sequential -->
  <text x="350" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a90e2">Sequential</text>
  <rect x="50" y="75" width="600" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="80" y="102" font-size="12" fill="#333">[1, 2, 3, 4, 5, 6, 7, 8]</text>
  <text x="280" y="102" font-size="12" fill="#555">--&gt; map --&gt; map --&gt; map --&gt; ... --&gt; sum</text>
  <!-- Parallel -->
  <text x="350" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#28a745">Parallel (rayon work-stealing)</text>
  <!-- Input array -->
  <rect x="150" y="170" width="400" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="193" text-anchor="middle" font-size="13" fill="#333">[1, 2, 3, 4, 5, 6, 7, 8]</text>
  <!-- Split arrows -->
  <line x1="270" y1="205" x2="200" y2="230" stroke="#28a745" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="430" y1="205" x2="500" y2="230" stroke="#28a745" stroke-width="2" marker-end="url(#arrowG)"/>
  <!-- Thread 1 -->
  <rect x="100" y="230" width="200" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="200" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Thread 1</text>
  <text x="200" y="275" text-anchor="middle" font-size="12" fill="#555">[1, 2, 3, 4] map+sum</text>
  <!-- Thread 2 -->
  <rect x="400" y="230" width="200" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="500" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Thread 2</text>
  <text x="500" y="275" text-anchor="middle" font-size="12" fill="#555">[5, 6, 7, 8] map+sum</text>
  <!-- Combine arrows -->
  <line x1="200" y1="300" x2="320" y2="340" stroke="#28a745" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="500" y1="300" x2="380" y2="340" stroke="#28a745" stroke-width="2" marker-end="url(#arrowG)"/>
  <!-- Combine box -->
  <rect x="290" y="340" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">combine</text>
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
</svg>
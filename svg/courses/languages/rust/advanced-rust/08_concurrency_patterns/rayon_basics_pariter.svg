<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="639.9999" y="40" text-anchor="middle" font-size="32.5123" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Rayon par_iter: Work-Stealing Parallelism</text>
  <text x="639.9999" y="98" text-anchor="middle" font-size="27.0936" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Sequential</text>
  <rect x="40" y="114.5715" width="1200" height="74.5715" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="159.3143" font-size="21.6748" fill="var(--text)" font-family="Arial, sans-serif">[1, 2, 3, 4, 5, 6, 7, 8]</text>
  <text x="499.9999" y="159.3143" font-size="21.6748" fill="var(--text-muted)" font-family="Arial, sans-serif">--&gt; map --&gt; map --&gt; map --&gt; ... --&gt; sum</text>
  <text x="639.9999" y="247.1428" text-anchor="middle" font-size="27.0936" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Parallel (rayon work-stealing)</text>
  <rect x="240" y="272" width="799.9999" height="58" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="310.1143" text-anchor="middle" font-size="23.4811" fill="var(--text)" font-family="Arial, sans-serif">[1, 2, 3, 4, 5, 6, 7, 8]</text>
  <line x1="480" y1="330" x2="340" y2="371.4286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="799.9999" y1="330" x2="939.9999" y2="371.4286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="140" y="371.4286" width="400" height="116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="412.8572" text-anchor="middle" font-size="23.4811" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Thread 1</text>
  <text x="340" y="446" text-anchor="middle" font-size="21.6748" fill="var(--text-muted)" font-family="Arial, sans-serif">[1, 2, 3, 4] map+sum</text>
  <rect x="739.9999" y="371.4286" width="400" height="116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="939.9999" y="412.8572" text-anchor="middle" font-size="23.4811" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Thread 2</text>
  <text x="939.9999" y="446" text-anchor="middle" font-size="21.6748" fill="var(--text-muted)" font-family="Arial, sans-serif">[5, 6, 7, 8] map+sum</text>
  <line x1="340" y1="487.4286" x2="580" y2="553.7143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="939.9999" y1="487.4286" x2="699.9999" y2="553.7143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="553.7143" width="240" height="66.2857" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="595.1428" text-anchor="middle" font-size="25.2873" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">combine</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="32.5123" font-weight="bold" fill="var(--text)">Rayon par_iter: Work-Stealing Parallelism</text>
  <text x="639.9999" y="98" text-anchor="middle" font-size="27.0936" font-weight="bold" fill="var(--primary-accent)">Sequential</text>
  <rect x="40" y="114.5715" width="1200" height="74.5715" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="100" y="159.3143" font-size="21.6748" fill="var(--text)">[1, 2, 3, 4, 5, 6, 7, 8]</text>
  <text x="499.9999" y="159.3143" font-size="21.6748" fill="var(--text-muted)">--&gt; map --&gt; map --&gt; map --&gt; ... --&gt; sum</text>
  <text x="639.9999" y="247.1428" text-anchor="middle" font-size="27.0936" font-weight="bold" fill="var(--ok-accent)">Parallel (rayon work-stealing)</text>
  <rect x="240" y="272" width="799.9999" height="58" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9999" y="310.1143" text-anchor="middle" font-size="23.4811" fill="var(--text)">[1, 2, 3, 4, 5, 6, 7, 8]</text>
  <line x1="480" y1="330" x2="340" y2="371.4286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <line x1="799.9999" y1="330" x2="939.9999" y2="371.4286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <rect x="140" y="371.4286" width="400" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="340" y="412.8572" text-anchor="middle" font-size="23.4811" font-weight="bold" fill="var(--text)">Thread 1</text>
  <text x="340" y="446" text-anchor="middle" font-size="21.6748" fill="var(--text-muted)">[1, 2, 3, 4] map+sum</text>
  <rect x="739.9999" y="371.4286" width="400" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="939.9999" y="412.8572" text-anchor="middle" font-size="23.4811" font-weight="bold" fill="var(--text)">Thread 2</text>
  <text x="939.9999" y="446" text-anchor="middle" font-size="21.6748" fill="var(--text-muted)">[5, 6, 7, 8] map+sum</text>
  <line x1="340" y1="487.4286" x2="580" y2="553.7143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <line x1="939.9999" y1="487.4286" x2="699.9999" y2="553.7143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrowG)" />
  <rect x="520" y="553.7143" width="240" height="66.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="595.1428" text-anchor="middle" font-size="25.2873" font-weight="bold" fill="var(--text)">combine</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 6.4,0" fill="#28a745" />
    </marker>
  </defs>
</svg>
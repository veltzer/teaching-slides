<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="583.4758" y="49.2308" text-anchor="middle" font-size="28.0068" font-weight="bold" fill="#333">When to Use Mutex vs RwLock</ns0:text>
  <ns0:rect x="31.1187" y="82.0513" width="311.1871" height="65.641" rx="7.7796" fill="#4a90e2" stroke="#4a90e2" stroke-width="2.3339" />
  <ns0:text x="186.7123" y="123.0769" text-anchor="middle" font-size="21.7831" font-weight="bold" fill="#fff">Property</ns0:text>
  <ns0:rect x="342.3058" y="82.0513" width="373.4245" height="65.641" rx="7.7796" fill="#ffc107" stroke="#ffc107" stroke-width="2.3339" />
  <ns0:text x="529.0181" y="123.0769" text-anchor="middle" font-size="21.7831" font-weight="bold" fill="#333">Mutex</ns0:text>
  <ns0:rect x="715.7303" y="82.0513" width="420.1026" height="65.641" rx="7.7796" fill="#28a745" stroke="#28a745" stroke-width="2.3339" />
  <ns0:text x="925.7816" y="123.0769" text-anchor="middle" font-size="21.7831" font-weight="bold" fill="#fff">RwLock</ns0:text>
  <ns0:rect x="31.1187" y="155.8974" width="311.1871" height="57.4359" rx="4.6678" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.556" />
  <ns0:rect x="342.3058" y="155.8974" width="373.4245" height="57.4359" rx="4.6678" fill="#fff3cd" stroke="#ffc107" stroke-width="1.556" />
  <ns0:rect x="715.7303" y="155.8974" width="420.1026" height="57.4359" rx="4.6678" fill="#d4edda" stroke="#28a745" stroke-width="1.556" />
  <ns0:text x="46.6781" y="192" font-size="18.6712" fill="#333">Read concurrency</ns0:text>
  <ns0:text x="357.8651" y="192" font-size="18.6712" fill="#333">One at a time</ns0:text>
  <ns0:text x="731.2896" y="192" font-size="18.6712" fill="#28a745">Many concurrent reads</ns0:text>
  <ns0:rect x="31.1187" y="221.5385" width="311.1871" height="57.4359" rx="4.6678" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.556" />
  <ns0:rect x="342.3058" y="221.5385" width="373.4245" height="57.4359" rx="4.6678" fill="#f9f9f9" stroke="#ddd" stroke-width="1.556" />
  <ns0:rect x="715.7303" y="221.5385" width="420.1026" height="57.4359" rx="4.6678" fill="#f9f9f9" stroke="#ddd" stroke-width="1.556" />
  <ns0:text x="46.6781" y="257.641" font-size="18.6712" fill="#333">Write concurrency</ns0:text>
  <ns0:text x="357.8651" y="257.641" font-size="18.6712" fill="#333">One at a time</ns0:text>
  <ns0:text x="731.2896" y="257.641" font-size="18.6712" fill="#333">One at a time</ns0:text>
  <ns0:rect x="31.1187" y="287.1795" width="311.1871" height="57.4359" rx="4.6678" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.556" />
  <ns0:rect x="342.3058" y="287.1795" width="373.4245" height="57.4359" rx="4.6678" fill="#d4edda" stroke="#28a745" stroke-width="1.556" />
  <ns0:rect x="715.7303" y="287.1795" width="420.1026" height="57.4359" rx="4.6678" fill="#fff3cd" stroke="#ffc107" stroke-width="1.556" />
  <ns0:text x="46.6781" y="323.2821" font-size="18.6712" fill="#333">Overhead</ns0:text>
  <ns0:text x="357.8651" y="323.2821" font-size="18.6712" fill="#28a745">Lower</ns0:text>
  <ns0:text x="731.2896" y="323.2821" font-size="18.6712" fill="#bf360c">Higher (tracking)</ns0:text>
  <ns0:rect x="31.1187" y="352.8205" width="311.1871" height="57.4359" rx="4.6678" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.556" />
  <ns0:rect x="342.3058" y="352.8205" width="373.4245" height="57.4359" rx="4.6678" fill="#fff3cd" stroke="#ffc107" stroke-width="1.556" />
  <ns0:rect x="715.7303" y="352.8205" width="420.1026" height="57.4359" rx="4.6678" fill="#d4edda" stroke="#28a745" stroke-width="1.556" />
  <ns0:text x="46.6781" y="388.9231" font-size="18.6712" fill="#333">Best for</ns0:text>
  <ns0:text x="357.8651" y="388.9231" font-size="18.6712" fill="#333">Write-heavy / short sections</ns0:text>
  <ns0:text x="731.2896" y="388.9231" font-size="18.6712" fill="#28a745">Read-heavy workloads</ns0:text>
  <ns0:rect x="31.1187" y="418.4615" width="311.1871" height="57.4359" rx="4.6678" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.556" />
  <ns0:rect x="342.3058" y="418.4615" width="373.4245" height="57.4359" rx="4.6678" fill="#d4edda" stroke="#28a745" stroke-width="1.556" />
  <ns0:rect x="715.7303" y="418.4615" width="420.1026" height="57.4359" rx="4.6678" fill="#f8d7da" stroke="#dc3545" stroke-width="1.556" />
  <ns0:text x="46.6781" y="454.5641" font-size="18.6712" fill="#333">Starvation risk</ns0:text>
  <ns0:text x="357.8651" y="454.5641" font-size="18.6712" fill="#28a745">No</ns0:text>
  <ns0:text x="731.2896" y="454.5641" font-size="18.6712" fill="#dc3545">Writers can starve</ns0:text>
  <ns0:rect x="31.1187" y="508.7179" width="1104.7141" height="131.2821" rx="7.7796" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1118" />
  <ns0:text x="62.2374" y="549.7436" font-size="21.7831" font-weight="bold" fill="#4a90e2">Rule of thumb:</ns0:text>
  <ns0:text x="62.2374" y="587.4872" font-size="20.2272" fill="#333">Mostly reads, few writes =&gt; RwLock</ns0:text>
  <ns0:text x="62.2374" y="620.3077" font-size="20.2272" fill="#333">Frequent writes or very short locks =&gt; Mutex</ns0:text>
</ns0:svg>
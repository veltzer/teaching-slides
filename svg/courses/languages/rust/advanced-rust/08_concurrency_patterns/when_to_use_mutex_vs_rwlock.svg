<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="54" text-anchor="middle" font-size="30.72" font-weight="bold" fill="#333">When to Use Mutex vs RwLock</text>
  <rect x="34.1333" y="90" width="341.3333" height="72" rx="8.5333" fill="#4a90e2" stroke="#4a90e2" stroke-width="2.56" />
  <text x="204.8" y="135" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#fff">Property</text>
  <rect x="375.4667" y="90" width="409.6" height="72" rx="8.5333" fill="#ffc107" stroke="#ffc107" stroke-width="2.56" />
  <text x="580.2667" y="135" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Mutex</text>
  <rect x="785.0667" y="90" width="460.8" height="72" rx="8.5333" fill="#28a745" stroke="#28a745" stroke-width="2.56" />
  <text x="1015.4667" y="135" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#fff">RwLock</text>
  <rect x="34.1333" y="171" width="341.3333" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="375.4667" y="171" width="409.6" height="63" rx="5.12" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7067" />
  <rect x="785.0667" y="171" width="460.8" height="63" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="51.2" y="210.6" font-size="20.48" fill="#333">Read concurrency</text>
  <text x="392.5333" y="210.6" font-size="20.48" fill="#333">One at a time</text>
  <text x="802.1333" y="210.6" font-size="20.48" fill="#28a745">Many concurrent reads</text>
  <rect x="34.1333" y="243" width="341.3333" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="375.4667" y="243" width="409.6" height="63" rx="5.12" fill="#f8f9fa" stroke="#ddd" stroke-width="1.7067" />
  <rect x="785.0667" y="243" width="460.8" height="63" rx="5.12" fill="#f8f9fa" stroke="#ddd" stroke-width="1.7067" />
  <text x="51.2" y="282.6" font-size="20.48" fill="#333">Write concurrency</text>
  <text x="392.5333" y="282.6" font-size="20.48" fill="#333">One at a time</text>
  <text x="802.1333" y="282.6" font-size="20.48" fill="#333">One at a time</text>
  <rect x="34.1333" y="315" width="341.3333" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="375.4667" y="315" width="409.6" height="63" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <rect x="785.0667" y="315" width="460.8" height="63" rx="5.12" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7067" />
  <text x="51.2" y="354.6" font-size="20.48" fill="#333">Overhead</text>
  <text x="392.5333" y="354.6" font-size="20.48" fill="#28a745">Lower</text>
  <text x="802.1333" y="354.6" font-size="20.48" fill="#856404">Higher (tracking)</text>
  <rect x="34.1333" y="387" width="341.3333" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="375.4667" y="387" width="409.6" height="63" rx="5.12" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7067" />
  <rect x="785.0667" y="387" width="460.8" height="63" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="51.2" y="426.6" font-size="20.48" fill="#333">Best for</text>
  <text x="392.5333" y="426.6" font-size="20.48" fill="#333">Write-heavy / short sections</text>
  <text x="802.1333" y="426.6" font-size="20.48" fill="#28a745">Read-heavy workloads</text>
  <rect x="34.1333" y="459" width="341.3333" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="375.4667" y="459" width="409.6" height="63" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <rect x="785.0667" y="459" width="460.8" height="63" rx="5.12" fill="#f8d7da" stroke="#dc3545" stroke-width="1.7067" />
  <text x="51.2" y="498.6" font-size="20.48" fill="#333">Starvation risk</text>
  <text x="392.5333" y="498.6" font-size="20.48" fill="#28a745">No</text>
  <text x="802.1333" y="498.6" font-size="20.48" fill="#dc3545">Writers can starve</text>
  <rect x="34.1333" y="558" width="1211.7333" height="144" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="68.2667" y="603" font-size="23.8933" font-weight="bold" fill="#4a90e2">Rule of thumb:</text>
  <text x="68.2667" y="644.4" font-size="22.1867" fill="#333">Mostly reads, few writes =&gt; RwLock</text>
  <text x="68.2667" y="680.4" font-size="22.1867" fill="#333">Frequent writes or very short locks =&gt; Mutex</text>
</svg>
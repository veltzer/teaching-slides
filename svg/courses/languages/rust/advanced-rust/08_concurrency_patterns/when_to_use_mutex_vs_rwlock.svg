<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.9224" font-weight="bold" fill="var(--text)">When to Use Mutex vs RwLock</text>
  <rect x="40" y="72.2222" width="338.0282" height="64.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="209.0141" y="112.5" text-anchor="middle" font-size="22.4952" font-weight="bold" fill="var(--bg)">Property</text>
  <rect x="378.0282" y="72.2222" width="405.6338" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="580.8451" y="112.5" text-anchor="middle" font-size="22.4952" font-weight="bold" fill="var(--text)">Mutex</text>
  <rect x="783.662" y="72.2222" width="456.338" height="64.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1011.831" y="112.5" text-anchor="middle" font-size="22.4952" font-weight="bold" fill="var(--bg)">RwLock</text>
  <rect x="40" y="144.7222" width="338.0282" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="378.0282" y="144.7222" width="405.6338" height="56.3889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="783.662" y="144.7222" width="456.338" height="56.3889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="56.9015" y="180.1666" font-size="19.2816" fill="var(--text)">Read concurrency</text>
  <text x="394.9295" y="180.1666" font-size="19.2816" fill="var(--text)">One at a time</text>
  <text x="800.5633" y="180.1666" font-size="19.2816" fill="var(--ok-accent)">Many concurrent reads</text>
  <rect x="40" y="209.1667" width="338.0282" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="378.0282" y="209.1667" width="405.6338" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="783.662" y="209.1667" width="456.338" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="56.9015" y="244.6111" font-size="19.2816" fill="var(--text)">Write concurrency</text>
  <text x="394.9295" y="244.6111" font-size="19.2816" fill="var(--text)">One at a time</text>
  <text x="800.5633" y="244.6111" font-size="19.2816" fill="var(--text)">One at a time</text>
  <rect x="40" y="273.6111" width="338.0282" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="378.0282" y="273.6111" width="405.6338" height="56.3889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="783.662" y="273.6111" width="456.338" height="56.3889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="56.9015" y="309.0556" font-size="19.2816" fill="var(--text)">Overhead</text>
  <text x="394.9295" y="309.0556" font-size="19.2816" fill="var(--ok-accent)">Lower</text>
  <text x="800.5633" y="309.0556" font-size="19.2816" fill="var(--danger-accent)">Higher (tracking)</text>
  <rect x="40" y="338.0555" width="338.0282" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="378.0282" y="338.0555" width="405.6338" height="56.3889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="783.662" y="338.0555" width="456.338" height="56.3889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="56.9015" y="373.5" font-size="19.2816" fill="var(--text)">Best for</text>
  <text x="394.9295" y="373.5" font-size="19.2816" fill="var(--text)">Write-heavy / short sections</text>
  <text x="800.5633" y="373.5" font-size="19.2816" fill="var(--ok-accent)">Read-heavy workloads</text>
  <rect x="40" y="402.5" width="338.0282" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="378.0282" y="402.5" width="405.6338" height="56.3889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="783.662" y="402.5" width="456.338" height="56.3889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="56.9015" y="437.9444" font-size="19.2816" fill="var(--text)">Starvation risk</text>
  <text x="394.9295" y="437.9444" font-size="19.2816" fill="var(--ok-accent)">No</text>
  <text x="800.5633" y="437.9444" font-size="19.2816" fill="var(--danger-accent)">Writers can starve</text>
  <rect x="40" y="491.1111" width="1199.9999" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="73.8028" y="531.3889" font-size="22.4952" font-weight="bold" fill="var(--primary-accent)">Rule of thumb:</text>
  <text x="73.8028" y="568.4445" font-size="20.8885" fill="var(--text)">Mostly reads, few writes =&gt; RwLock</text>
  <text x="73.8028" y="600.6667" font-size="20.8885" fill="var(--text)">Frequent writes or very short locks =&gt; Mutex</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="338.0282" height="68.235244290659" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.0141" y="82.647080622836" text-anchor="middle" font-size="23.147369365466" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Property</text>
  <rect x="378.0282" y="40" width="405.6338" height="68.235244290659" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580.8451" y="82.647080622836" text-anchor="middle" font-size="23.147369365466" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mutex</text>
  <rect x="783.662" y="40" width="456.338" height="68.235244290659" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1011.831" y="82.647080622836" text-anchor="middle" font-size="23.147369365466" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">RwLock</text>
  <rect x="40" y="116.764702768166" width="338.0282" height="59.705891695501" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="116.764702768166" width="405.6338" height="59.705891695501" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="116.764702768166" width="456.338" height="59.705891695501" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="154.294065951559" font-size="19.840602313257" fill="var(--text)" font-family="Arial, sans-serif">Read concurrency</text>
  <text x="394.9295" y="154.294065951559" font-size="19.840602313257" fill="var(--text)" font-family="Arial, sans-serif">One at a time</text>
  <text x="800.5633" y="154.294065951559" font-size="19.840602313257" fill="var(--ok-accent)" font-family="Arial, sans-serif">Many concurrent reads</text>
  <rect x="40" y="185.000052941174" width="338.0282" height="59.705891695501" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="185.000052941174" width="405.6338" height="59.705891695501" rx="6.173948939898" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="783.662" y="185.000052941174" width="456.338" height="59.705891695501" rx="6.173948939898" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="56.9015" y="222.529416124567" font-size="19.840602313257" fill="var(--text)" font-family="Arial, sans-serif">Write concurrency</text>
  <text x="394.9295" y="222.529416124567" font-size="19.840602313257" fill="var(--text)" font-family="Arial, sans-serif">One at a time</text>
  <text x="800.5633" y="222.529416124567" font-size="19.840602313257" fill="var(--text)" font-family="Arial, sans-serif">One at a time</text>
  <rect x="40" y="253.235297231834" width="338.0282" height="59.705891695501" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="253.235297231834" width="405.6338" height="59.705891695501" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="253.235297231834" width="456.338" height="59.705891695501" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="290.764766297575" font-size="19.840602313257" fill="var(--text)" font-family="Arial, sans-serif">Overhead</text>
  <text x="394.9295" y="290.764766297575" font-size="19.840602313257" fill="var(--ok-accent)" font-family="Arial, sans-serif">Lower</text>
  <text x="800.5633" y="290.764766297575" font-size="19.840602313257" fill="var(--danger-accent)" font-family="Arial, sans-serif">Higher (tracking)</text>
  <rect x="40" y="321.470541522493" width="338.0282" height="59.705891695501" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="321.470541522493" width="405.6338" height="59.705891695501" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="321.470541522493" width="456.338" height="59.705891695501" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="359.000010588235" font-size="19.840602313257" fill="var(--text)" font-family="Arial, sans-serif">Best for</text>
  <text x="394.9295" y="359.000010588235" font-size="19.840602313257" fill="var(--text)" font-family="Arial, sans-serif">Write-heavy / short sections</text>
  <text x="800.5633" y="359.000010588235" font-size="19.840602313257" fill="var(--ok-accent)" font-family="Arial, sans-serif">Read-heavy workloads</text>
  <rect x="40" y="389.705891695501" width="338.0282" height="59.705891695501" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="389.705891695501" width="405.6338" height="59.705891695501" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="389.705891695501" width="456.338" height="59.705891695501" rx="6.173948939898" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="427.235254878894" font-size="19.840602313257" fill="var(--text)" font-family="Arial, sans-serif">Starvation risk</text>
  <text x="394.9295" y="427.235254878894" font-size="19.840602313257" fill="var(--ok-accent)" font-family="Arial, sans-serif">No</text>
  <text x="800.5633" y="427.235254878894" font-size="19.840602313257" fill="var(--danger-accent)" font-family="Arial, sans-serif">Writers can starve</text>
  <rect x="40" y="483.529405536332" width="1199.9999" height="136.470594463668" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="73.8028" y="526.176486159169" font-size="23.147369365466" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Rule of thumb:</text>
  <text x="73.8028" y="565.411825743942" font-size="21.49408873851" fill="var(--text)" font-family="Arial, sans-serif">Mostly reads, few writes =&gt; RwLock</text>
  <text x="73.8028" y="599.529447889272" font-size="21.49408873851" fill="var(--text)" font-family="Arial, sans-serif">Frequent writes or very short locks =&gt; Mutex</text>
</svg>

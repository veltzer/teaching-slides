<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="583.4758" y="49.2308" text-anchor="middle" font-size="28.0068" font-weight="bold" fill="var(--text)">When to Use Mutex vs RwLock</text>
  <rect x="31.1187" y="82.0513" width="311.1871" height="65.641" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="186.7123" y="123.0769" text-anchor="middle" font-size="21.7831" font-weight="bold" fill="var(--bg)">Property</text>
  <rect x="342.3058" y="82.0513" width="373.4245" height="65.641" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="529.0181" y="123.0769" text-anchor="middle" font-size="21.7831" font-weight="bold" fill="var(--text)">Mutex</text>
  <rect x="715.7303" y="82.0513" width="420.1026" height="65.641" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="925.7816" y="123.0769" text-anchor="middle" font-size="21.7831" font-weight="bold" fill="var(--bg)">RwLock</text>
  <rect x="31.1187" y="155.8974" width="311.1871" height="57.4359" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="342.3058" y="155.8974" width="373.4245" height="57.4359" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="715.7303" y="155.8974" width="420.1026" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="46.6781" y="192" font-size="18.6712" fill="var(--text)">Read concurrency</text>
  <text x="357.8651" y="192" font-size="18.6712" fill="var(--text)">One at a time</text>
  <text x="731.2896" y="192" font-size="18.6712" fill="var(--ok-accent)">Many concurrent reads</text>
  <rect x="31.1187" y="221.5385" width="311.1871" height="57.4359" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="342.3058" y="221.5385" width="373.4245" height="57.4359" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="715.7303" y="221.5385" width="420.1026" height="57.4359" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="46.6781" y="257.641" font-size="18.6712" fill="var(--text)">Write concurrency</text>
  <text x="357.8651" y="257.641" font-size="18.6712" fill="var(--text)">One at a time</text>
  <text x="731.2896" y="257.641" font-size="18.6712" fill="var(--text)">One at a time</text>
  <rect x="31.1187" y="287.1795" width="311.1871" height="57.4359" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="342.3058" y="287.1795" width="373.4245" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="715.7303" y="287.1795" width="420.1026" height="57.4359" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="46.6781" y="323.2821" font-size="18.6712" fill="var(--text)">Overhead</text>
  <text x="357.8651" y="323.2821" font-size="18.6712" fill="var(--ok-accent)">Lower</text>
  <text x="731.2896" y="323.2821" font-size="18.6712" fill="var(--danger-accent)">Higher (tracking)</text>
  <rect x="31.1187" y="352.8205" width="311.1871" height="57.4359" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="342.3058" y="352.8205" width="373.4245" height="57.4359" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="715.7303" y="352.8205" width="420.1026" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="46.6781" y="388.9231" font-size="18.6712" fill="var(--text)">Best for</text>
  <text x="357.8651" y="388.9231" font-size="18.6712" fill="var(--text)">Write-heavy / short sections</text>
  <text x="731.2896" y="388.9231" font-size="18.6712" fill="var(--ok-accent)">Read-heavy workloads</text>
  <rect x="31.1187" y="418.4615" width="311.1871" height="57.4359" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="342.3058" y="418.4615" width="373.4245" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="715.7303" y="418.4615" width="420.1026" height="57.4359" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="46.6781" y="454.5641" font-size="18.6712" fill="var(--text)">Starvation risk</text>
  <text x="357.8651" y="454.5641" font-size="18.6712" fill="var(--ok-accent)">No</text>
  <text x="731.2896" y="454.5641" font-size="18.6712" fill="var(--danger-accent)">Writers can starve</text>
  <rect x="31.1187" y="508.7179" width="1104.7141" height="131.2821" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="62.2374" y="549.7436" font-size="21.7831" font-weight="bold" fill="var(--primary-accent)">Rule of thumb:</text>
  <text x="62.2374" y="587.4872" font-size="20.2272" fill="var(--text)">Mostly reads, few writes =&gt; RwLock</text>
  <text x="62.2374" y="620.3077" font-size="20.2272" fill="var(--text)">Frequent writes or very short locks =&gt; Mutex</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.7798" font-weight="bold" fill="var(--text)">Channel Types Comparison</text>
  <rect x="40" y="74.9399" width="372.9729" height="195.6626" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="109.8796" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--ok-accent)">mpsc (std / tokio)</text>
  <text x="64.3243" y="137.8314" font-size="14.8899" fill="var(--text-muted)">Multiple Producer</text>
  <text x="64.3243" y="162.988" font-size="14.8899" fill="var(--text-muted)">Single Consumer</text>
  <rect x="72.4324" y="179.7591" width="64.8649" height="27.9518" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="104.8649" y="199.3253" text-anchor="middle" font-size="14.8899" fill="var(--text)">tx1</text>
  <rect x="153.5134" y="179.7591" width="64.8649" height="27.9518" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="199.3253" text-anchor="middle" font-size="14.8899" fill="var(--text)">tx2</text>
  <line x1="218.3783" y1="193.735" x2="267.027" y2="214.6989" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="137.2972" y1="207.7109" x2="267.027" y2="214.6989" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="267.027" y="200.7229" width="113.5135" height="34.9397" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="224.482" text-anchor="middle" font-size="14.8899" fill="var(--text)">rx (one)</text>
  <text x="226.4864" y="259.4218" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)">Bounded or unbounded</text>
  <rect x="453.5135" y="74.9399" width="372.9729" height="195.6626" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="109.8796" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--primary-accent)">oneshot (tokio)</text>
  <text x="477.8378" y="137.8314" font-size="14.8899" fill="var(--text-muted)">Single Producer</text>
  <text x="477.8378" y="162.988" font-size="14.8899" fill="var(--text-muted)">Single Consumer</text>
  <text x="477.8378" y="188.1446" font-size="14.8899" fill="var(--text-muted)">Exactly ONE message</text>
  <rect x="485.9459" y="200.7229" width="113.5135" height="34.9397" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="542.7026" y="224.482" text-anchor="middle" font-size="14.8899" fill="var(--text)">tx</text>
  <line x1="599.4594" y1="217.494" x2="672.4324" y2="217.494" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="680.5405" y="200.7229" width="113.5135" height="34.9397" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="737.2972" y="224.482" text-anchor="middle" font-size="14.8899" fill="var(--text)">rx</text>
  <text x="640" y="259.4218" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)">Great for request/response</text>
  <rect x="867.027" y="74.9399" width="372.9729" height="195.6626" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="109.8796" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--text)">broadcast (tokio)</text>
  <text x="891.3513" y="137.8314" font-size="14.8899" fill="var(--text-muted)">Single Producer</text>
  <text x="891.3513" y="162.988" font-size="14.8899" fill="var(--text-muted)">Multiple Consumers</text>
  <rect x="996.7567" y="179.7591" width="81.0811" height="27.9518" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1037.2972" y="199.3253" text-anchor="middle" font-size="14.8899" fill="var(--text)">tx</text>
  <line x1="1037.2972" y1="207.7109" x2="931.8919" y2="221.6868" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1037.2972" y1="207.7109" x2="1037.2972" y2="221.6868" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1037.2972" y1="207.7109" x2="1142.7026" y2="221.6868" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="899.4594" y="224.482" width="56.7568" height="25.1566" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="927.027" y="242.6507" text-anchor="middle" font-size="14.8899" fill="var(--text)">rx1</text>
  <rect x="1009.7297" y="224.482" width="56.7568" height="25.1566" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1037.2972" y="242.6507" text-anchor="middle" font-size="14.8899" fill="var(--text)">rx2</text>
  <rect x="1118.3784" y="224.482" width="56.7568" height="25.1566" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.9459" y="242.6507" text-anchor="middle" font-size="14.8899" fill="var(--text)">rx3</text>
  <text x="1053.5135" y="270.6025" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)">All receivers get clone</text>
  <rect x="40" y="298.5543" width="372.9729" height="153.7349" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="333.4941" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--primary-accent)">watch (tokio)</text>
  <text x="64.3243" y="361.4458" font-size="14.8899" fill="var(--text-muted)">Single latest value</text>
  <text x="64.3243" y="386.6024" font-size="14.8899" fill="var(--text-muted)">Multiple observers</text>
  <text x="64.3243" y="411.759" font-size="14.8899" fill="var(--text-muted)">Only keeps most recent</text>
  <text x="64.3243" y="436.9158" font-size="14.8899" fill="var(--text-muted)">Config changes, state updates</text>
  <rect x="453.5135" y="298.5543" width="372.9729" height="153.7349" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="333.4941" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--ok-accent)">crossbeam-channel</text>
  <text x="477.8378" y="361.4458" font-size="14.8899" fill="var(--text-muted)">MPMC support</text>
  <text x="477.8378" y="386.6024" font-size="14.8899" fill="var(--text-muted)">select! macro</text>
  <text x="477.8378" y="411.759" font-size="14.8899" fill="var(--text-muted)">Bounded &amp; unbounded</text>
  <text x="477.8378" y="436.9158" font-size="14.8899" fill="var(--text-muted)">Faster than std for sync code</text>
  <rect x="867.027" y="298.5543" width="372.9729" height="153.7349" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="333.4941" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--text)">flume</text>
  <text x="891.3513" y="361.4458" font-size="14.8899" fill="var(--text-muted)">MPMC, async + sync</text>
  <text x="891.3513" y="386.6024" font-size="14.8899" fill="var(--text-muted)">Drop-in std replacement</text>
  <text x="891.3513" y="411.759" font-size="14.8899" fill="var(--text-muted)">Works in both contexts</text>
  <text x="891.3513" y="436.9158" font-size="14.8899" fill="var(--text-muted)">Bridge sync &amp; async code</text>
  <rect x="40" y="480.241" width="1200" height="139.759" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="515.1807" text-anchor="middle" font-size="20.8458" font-weight="bold" fill="var(--text)">When to Use What</text>
  <text x="64.3243" y="550.1205" font-size="14.8899" fill="var(--text-muted)">Request/Response: oneshot | Fan-out: broadcast | Config/State: watch</text>
  <text x="64.3243" y="578.0724" font-size="14.8899" fill="var(--text-muted)">Work distribution: mpsc (bounded for backpressure) | Sync MPMC: crossbeam | Mixed: flume</text>
  <text x="64.3243" y="606.0241" font-size="14.8899" fill="var(--danger-accent)">Unbounded channels can cause OOM - prefer bounded with backpressure in production</text>
</svg>
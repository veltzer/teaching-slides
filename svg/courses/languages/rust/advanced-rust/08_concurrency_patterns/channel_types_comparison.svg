    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</ns0:defs>
  <ns0:text x="588.065" y="43.146" text-anchor="middle" font-size="28.764" font-weight="bold" fill="var(--text-dark)">Channel Types Comparison</ns0:text>
  <ns0:rect x="44.1049" y="79.1012" width="338.1373" height="201.3483" rx="7.191" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8764" />
  <ns0:text x="213.1735" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--ok-bright)">mpsc (std / tokio)</ns0:text>
  <ns0:text x="66.1573" y="143.8202" font-size="14.382" fill="var(--text-muted)">Multiple Producer</ns0:text>
  <ns0:text x="66.1573" y="169.7079" font-size="14.382" fill="var(--text-muted)">Single Consumer</ns0:text>
  <ns0:rect x="73.5081" y="186.9663" width="58.8065" height="28.764" rx="4.3147" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4382" />
  <ns0:text x="102.9114" y="207.1011" text-anchor="middle" font-size="14.382" fill="var(--text-dark)">tx1</ns0:text>
  <ns0:rect x="147.0162" y="186.9663" width="58.8065" height="28.764" rx="4.3147" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4382" />
  <ns0:text x="176.4195" y="207.1011" text-anchor="middle" font-size="14.382" fill="var(--text-dark)">tx2</ns0:text>
  <ns0:line x1="205.8227" y1="201.3483" x2="249.9276" y2="222.9214" stroke="var(--primary-bright)" stroke-width="2.1573" marker-end="url(#arrow)" />
  <ns0:line x1="132.3146" y1="215.7303" x2="249.9276" y2="222.9214" stroke="var(--primary-bright)" stroke-width="2.1573" />
  <ns0:rect x="249.9276" y="208.5393" width="102.9114" height="35.955" rx="4.3147" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.4382" />
  <ns0:text x="301.3833" y="232.9888" text-anchor="middle" font-size="14.382" fill="var(--text-dark)">rx (one)</ns0:text>
  <ns0:text x="213.1735" y="268.9439" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">Bounded or unbounded</ns0:text>
  <ns0:rect x="418.9963" y="79.1012" width="338.1373" height="201.3483" rx="7.191" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8764" />
  <ns0:text x="588.065" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--primary-bright)">oneshot (tokio)</ns0:text>
  <ns0:text x="441.0487" y="143.8202" font-size="14.382" fill="var(--text-muted)">Single Producer</ns0:text>
  <ns0:text x="441.0487" y="169.7079" font-size="14.382" fill="var(--text-muted)">Single Consumer</ns0:text>
  <ns0:text x="441.0487" y="195.5955" font-size="14.382" fill="var(--text-muted)">Exactly ONE message</ns0:text>
  <ns0:rect x="448.3995" y="208.5393" width="102.9114" height="35.955" rx="4.3147" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4382" />
  <ns0:text x="499.8552" y="232.9888" text-anchor="middle" font-size="14.382" fill="var(--text-dark)">tx</ns0:text>
  <ns0:line x1="551.3109" y1="225.7977" x2="617.4682" y2="225.7977" stroke="var(--primary-bright)" stroke-width="2.1573" marker-end="url(#arrow)" />
  <ns0:rect x="624.819" y="208.5393" width="102.9114" height="35.955" rx="4.3147" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.4382" />
  <ns0:text x="676.2747" y="232.9888" text-anchor="middle" font-size="14.382" fill="var(--text-dark)">rx</ns0:text>
  <ns0:text x="588.065" y="268.9439" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">Great for request/response</ns0:text>
  <ns0:rect x="793.8877" y="79.1012" width="338.1373" height="201.3483" rx="7.191" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8764" />
  <ns0:text x="962.9564" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--text-dark)">broadcast (tokio)</ns0:text>
  <ns0:text x="815.9401" y="143.8202" font-size="14.382" fill="var(--text-muted)">Single Producer</ns0:text>
  <ns0:text x="815.9401" y="169.7079" font-size="14.382" fill="var(--text-muted)">Multiple Consumers</ns0:text>
  <ns0:rect x="911.5007" y="186.9663" width="73.5081" height="28.764" rx="4.3147" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4382" />
  <ns0:text x="948.2547" y="207.1011" text-anchor="middle" font-size="14.382" fill="var(--text-dark)">tx</ns0:text>
  <ns0:line x1="948.2547" y1="215.7303" x2="852.6942" y2="230.1124" stroke="var(--primary-bright)" stroke-width="2.1573" marker-end="url(#arrow)" />
  <ns0:line x1="948.2547" y1="215.7303" x2="948.2547" y2="230.1124" stroke="var(--primary-bright)" stroke-width="2.1573" marker-end="url(#arrow)" />
  <ns0:line x1="948.2547" y1="215.7303" x2="1043.8153" y2="230.1124" stroke="var(--primary-bright)" stroke-width="2.1573" marker-end="url(#arrow)" />
  <ns0:rect x="823.2909" y="232.9888" width="51.4557" height="25.8876" rx="4.3147" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4382" />
  <ns0:text x="848.2837" y="251.6854" text-anchor="middle" font-size="14.382" fill="var(--text-dark)">rx1</ns0:text>
  <ns0:rect x="923.262" y="232.9888" width="51.4557" height="25.8876" rx="4.3147" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4382" />
  <ns0:text x="948.2547" y="251.6854" text-anchor="middle" font-size="14.382" fill="var(--text-dark)">rx2</ns0:text>
  <ns0:rect x="1021.7629" y="232.9888" width="51.4557" height="25.8876" rx="4.3147" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4382" />
  <ns0:text x="1046.7556" y="251.6854" text-anchor="middle" font-size="14.382" fill="var(--text-dark)">rx3</ns0:text>
  <ns0:text x="962.9564" y="280.4495" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">All receivers get clone</ns0:text>
  <ns0:rect x="44.1049" y="309.2135" width="338.1373" height="158.2022" rx="7.191" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8764" />
  <ns0:text x="213.1735" y="345.1686" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--primary-bright)">watch (tokio)</ns0:text>
  <ns0:text x="66.1573" y="373.9326" font-size="14.382" fill="var(--text-muted)">Single latest value</ns0:text>
  <ns0:text x="66.1573" y="399.8202" font-size="14.382" fill="var(--text-muted)">Multiple observers</ns0:text>
  <ns0:text x="66.1573" y="425.7078" font-size="14.382" fill="var(--text-muted)">Only keeps most recent</ns0:text>
  <ns0:text x="66.1573" y="451.5956" font-size="14.382" fill="var(--text-muted)">Config changes, state updates</ns0:text>
  <ns0:rect x="418.9963" y="309.2135" width="338.1373" height="158.2022" rx="7.191" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8764" />
  <ns0:text x="588.065" y="345.1686" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--ok-bright)">crossbeam-channel</ns0:text>
  <ns0:text x="441.0487" y="373.9326" font-size="14.382" fill="var(--text-muted)">MPMC support</ns0:text>
  <ns0:text x="441.0487" y="399.8202" font-size="14.382" fill="var(--text-muted)">select! macro</ns0:text>
  <ns0:text x="441.0487" y="425.7078" font-size="14.382" fill="var(--text-muted)">Bounded &amp; unbounded</ns0:text>
  <ns0:text x="441.0487" y="451.5956" font-size="14.382" fill="var(--text-muted)">Faster than std for sync code</ns0:text>
  <ns0:rect x="793.8877" y="309.2135" width="338.1373" height="158.2022" rx="7.191" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8764" />
  <ns0:text x="962.9564" y="345.1686" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--text-dark)">flume</ns0:text>
  <ns0:text x="815.9401" y="373.9326" font-size="14.382" fill="var(--text-muted)">MPMC, async + sync</ns0:text>
  <ns0:text x="815.9401" y="399.8202" font-size="14.382" fill="var(--text-muted)">Drop-in std replacement</ns0:text>
  <ns0:text x="815.9401" y="425.7078" font-size="14.382" fill="var(--text-muted)">Works in both contexts</ns0:text>
  <ns0:text x="815.9401" y="451.5956" font-size="14.382" fill="var(--text-muted)">Bridge sync &amp; async code</ns0:text>
  <ns0:rect x="44.1049" y="496.1798" width="1087.9202" height="143.8202" rx="7.191" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8764" />
  <ns0:text x="588.065" y="532.1348" text-anchor="middle" font-size="20.1348" font-weight="bold" fill="var(--text-dark)">When to Use What</ns0:text>
  <ns0:text x="66.1573" y="568.0899" font-size="14.382" fill="var(--text-muted)">Request/Response: oneshot | Fan-out: broadcast | Config/State: watch</ns0:text>
  <ns0:text x="66.1573" y="596.854" font-size="14.382" fill="var(--text-muted)">Work distribution: mpsc (bounded for backpressure) | Sync MPMC: crossbeam | Mixed: flume</ns0:text>
  <ns0:text x="66.1573" y="625.618" font-size="14.382" fill="var(--danger-bright)">Unbounded channels can cause OOM - prefer bounded with backpressure in production</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="10.9565" refX="16" refY="5.4783" orient="auto">
      <polygon points="0,15.6522 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="46.9565" text-anchor="middle" font-size="31.3043" font-weight="bold" fill="#333">Channel Types Comparison</text>
  <rect x="48" y="86.087" width="368" height="219.1304" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="3.1304" />
  <text x="232" y="125.2174" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#28a745">mpsc (std / tokio)</text>
  <text x="72" y="156.5217" font-size="15.6522" fill="#555">Multiple Producer</text>
  <text x="72" y="184.6957" font-size="15.6522" fill="#555">Single Consumer</text>
  <rect x="80" y="203.4783" width="64" height="31.3043" rx="4.6957" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5652" />
  <text x="112" y="225.3913" text-anchor="middle" font-size="15.6522" fill="#333">tx1</text>
  <rect x="160" y="203.4783" width="64" height="31.3043" rx="4.6957" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5652" />
  <text x="192" y="225.3913" text-anchor="middle" font-size="15.6522" fill="#333">tx2</text>
  <line x1="224" y1="219.1304" x2="272" y2="242.6087" stroke="#4a90e2" stroke-width="2.3478" marker-end="url(#arrow)" />
  <line x1="144" y1="234.7826" x2="272" y2="242.6087" stroke="#4a90e2" stroke-width="2.3478" />
  <rect x="272" y="226.9565" width="112" height="39.1304" rx="4.6957" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5652" />
  <text x="328" y="253.5652" text-anchor="middle" font-size="15.6522" fill="#333">rx (one)</text>
  <text x="232" y="292.6957" text-anchor="middle" font-size="15.6522" fill="#555">Bounded or unbounded</text>
  <rect x="456" y="86.087" width="368" height="219.1304" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1304" />
  <text x="640" y="125.2174" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#4a90e2">oneshot (tokio)</text>
  <text x="480" y="156.5217" font-size="15.6522" fill="#555">Single Producer</text>
  <text x="480" y="184.6957" font-size="15.6522" fill="#555">Single Consumer</text>
  <text x="480" y="212.8696" font-size="15.6522" fill="#555">Exactly ONE message</text>
  <rect x="488" y="226.9565" width="112" height="39.1304" rx="4.6957" fill="#d4edda" stroke="#28a745" stroke-width="1.5652" />
  <text x="544" y="253.5652" text-anchor="middle" font-size="15.6522" fill="#333">tx</text>
  <line x1="600" y1="245.7391" x2="672" y2="245.7391" stroke="#4a90e2" stroke-width="2.3478" marker-end="url(#arrow)" />
  <rect x="680" y="226.9565" width="112" height="39.1304" rx="4.6957" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5652" />
  <text x="736" y="253.5652" text-anchor="middle" font-size="15.6522" fill="#333">rx</text>
  <text x="640" y="292.6957" text-anchor="middle" font-size="15.6522" fill="#555">Great for request/response</text>
  <rect x="864" y="86.087" width="368" height="219.1304" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1304" />
  <text x="1048" y="125.2174" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#333">broadcast (tokio)</text>
  <text x="888" y="156.5217" font-size="15.6522" fill="#555">Single Producer</text>
  <text x="888" y="184.6957" font-size="15.6522" fill="#555">Multiple Consumers</text>
  <rect x="992" y="203.4783" width="80" height="31.3043" rx="4.6957" fill="#d4edda" stroke="#28a745" stroke-width="1.5652" />
  <text x="1032" y="225.3913" text-anchor="middle" font-size="15.6522" fill="#333">tx</text>
  <line x1="1032" y1="234.7826" x2="928" y2="250.4348" stroke="#4a90e2" stroke-width="2.3478" marker-end="url(#arrow)" />
  <line x1="1032" y1="234.7826" x2="1032" y2="250.4348" stroke="#4a90e2" stroke-width="2.3478" marker-end="url(#arrow)" />
  <line x1="1032" y1="234.7826" x2="1136" y2="250.4348" stroke="#4a90e2" stroke-width="2.3478" marker-end="url(#arrow)" />
  <rect x="896" y="253.5652" width="56" height="28.1739" rx="4.6957" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5652" />
  <text x="923.2" y="273.913" text-anchor="middle" font-size="15.6522" fill="#333">rx1</text>
  <rect x="1004.8" y="253.5652" width="56" height="28.1739" rx="4.6957" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5652" />
  <text x="1032" y="273.913" text-anchor="middle" font-size="15.6522" fill="#333">rx2</text>
  <rect x="1112" y="253.5652" width="56" height="28.1739" rx="4.6957" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5652" />
  <text x="1139.2" y="273.913" text-anchor="middle" font-size="15.6522" fill="#333">rx3</text>
  <text x="1048" y="305.2174" text-anchor="middle" font-size="15.6522" fill="#555">All receivers get clone</text>
  <rect x="48" y="336.5217" width="368" height="172.1739" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1304" />
  <text x="232" y="375.6522" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#4a90e2">watch (tokio)</text>
  <text x="72" y="406.9565" font-size="15.6522" fill="#555">Single latest value</text>
  <text x="72" y="435.1304" font-size="15.6522" fill="#555">Multiple observers</text>
  <text x="72" y="463.3043" font-size="15.6522" fill="#555">Only keeps most recent</text>
  <text x="72" y="491.4783" font-size="15.6522" fill="#555">Config changes, state updates</text>
  <rect x="456" y="336.5217" width="368" height="172.1739" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="3.1304" />
  <text x="640" y="375.6522" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#28a745">crossbeam-channel</text>
  <text x="480" y="406.9565" font-size="15.6522" fill="#555">MPMC support</text>
  <text x="480" y="435.1304" font-size="15.6522" fill="#555">select! macro</text>
  <text x="480" y="463.3043" font-size="15.6522" fill="#555">Bounded &amp; unbounded</text>
  <text x="480" y="491.4783" font-size="15.6522" fill="#555">Faster than std for sync code</text>
  <rect x="864" y="336.5217" width="368" height="172.1739" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1304" />
  <text x="1048" y="375.6522" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#333">flume</text>
  <text x="888" y="406.9565" font-size="15.6522" fill="#555">MPMC, async + sync</text>
  <text x="888" y="435.1304" font-size="15.6522" fill="#555">Drop-in std replacement</text>
  <text x="888" y="463.3043" font-size="15.6522" fill="#555">Works in both contexts</text>
  <text x="888" y="491.4783" font-size="15.6522" fill="#555">Bridge sync &amp; async code</text>
  <rect x="48" y="540" width="1184" height="156.5217" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1304" />
  <text x="640" y="579.1304" text-anchor="middle" font-size="21.913" font-weight="bold" fill="#333">When to Use What</text>
  <text x="72" y="618.2609" font-size="15.6522" fill="#555">Request/Response: oneshot | Fan-out: broadcast | Config/State: watch</text>
  <text x="72" y="649.5652" font-size="15.6522" fill="#555">Work distribution: mpsc (bounded for backpressure) | Sync MPMC: crossbeam | Mixed: flume</text>
  <text x="72" y="680.8696" font-size="15.6522" fill="#dc3545">Unbounded channels can cause OOM - prefer bounded with backpressure in production</text>
</svg>
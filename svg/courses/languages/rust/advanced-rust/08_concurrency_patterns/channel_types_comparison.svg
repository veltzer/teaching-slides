<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Channel Types Comparison</text>
  <!-- MPSC -->
  <rect x="30" y="55" width="230" height="140" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="145" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">mpsc (std / tokio)</text>
  <text x="45" y="100" font-size="10" fill="#555">Multiple Producer</text>
  <text x="45" y="118" font-size="10" fill="#555">Single Consumer</text>
  <rect x="50" y="130" width="40" height="20" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="70" y="144" text-anchor="middle" font-size="10" fill="#333">tx1</text>
  <rect x="100" y="130" width="40" height="20" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="120" y="144" text-anchor="middle" font-size="10" fill="#333">tx2</text>
  <line x1="140" y1="140" x2="170" y2="155" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="150" x2="170" y2="155" stroke="#4a90e2" stroke-width="1.5"/>
  <rect x="170" y="145" width="70" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="205" y="162" text-anchor="middle" font-size="10" fill="#333">rx (one)</text>
  <text x="145" y="187" text-anchor="middle" font-size="10" fill="#555">Bounded or unbounded</text>
  <!-- Oneshot -->
  <rect x="285" y="55" width="230" height="140" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">oneshot (tokio)</text>
  <text x="300" y="100" font-size="10" fill="#555">Single Producer</text>
  <text x="300" y="118" font-size="10" fill="#555">Single Consumer</text>
  <text x="300" y="136" font-size="10" fill="#555">Exactly ONE message</text>
  <rect x="305" y="145" width="70" height="25" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="340" y="162" text-anchor="middle" font-size="10" fill="#333">tx</text>
  <line x1="375" y1="157" x2="420" y2="157" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="425" y="145" width="70" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="460" y="162" text-anchor="middle" font-size="10" fill="#333">rx</text>
  <text x="400" y="187" text-anchor="middle" font-size="10" fill="#555">Great for request/response</text>
  <!-- Broadcast -->
  <rect x="540" y="55" width="230" height="140" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="655" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">broadcast (tokio)</text>
  <text x="555" y="100" font-size="10" fill="#555">Single Producer</text>
  <text x="555" y="118" font-size="10" fill="#555">Multiple Consumers</text>
  <rect x="620" y="130" width="50" height="20" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="645" y="144" text-anchor="middle" font-size="10" fill="#333">tx</text>
  <line x1="645" y1="150" x2="580" y2="160" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="645" y1="150" x2="645" y2="160" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="645" y1="150" x2="710" y2="160" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="162" width="35" height="18" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="577" y="175" text-anchor="middle" font-size="10" fill="#333">rx1</text>
  <rect x="628" y="162" width="35" height="18" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="645" y="175" text-anchor="middle" font-size="10" fill="#333">rx2</text>
  <rect x="695" y="162" width="35" height="18" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="712" y="175" text-anchor="middle" font-size="10" fill="#333">rx3</text>
  <text x="655" y="195" text-anchor="middle" font-size="10" fill="#555">All receivers get clone</text>
  <!-- Watch -->
  <rect x="30" y="215" width="230" height="110" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="145" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">watch (tokio)</text>
  <text x="45" y="260" font-size="10" fill="#555">Single latest value</text>
  <text x="45" y="278" font-size="10" fill="#555">Multiple observers</text>
  <text x="45" y="296" font-size="10" fill="#555">Only keeps most recent</text>
  <text x="45" y="314" font-size="10" fill="#555">Config changes, state updates</text>
  <!-- Crossbeam -->
  <rect x="285" y="215" width="230" height="110" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="400" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">crossbeam-channel</text>
  <text x="300" y="260" font-size="10" fill="#555">MPMC support</text>
  <text x="300" y="278" font-size="10" fill="#555">select! macro</text>
  <text x="300" y="296" font-size="10" fill="#555">Bounded &amp; unbounded</text>
  <text x="300" y="314" font-size="10" fill="#555">Faster than std for sync code</text>
  <!-- Flume -->
  <rect x="540" y="215" width="230" height="110" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="655" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">flume</text>
  <text x="555" y="260" font-size="10" fill="#555">MPMC, async + sync</text>
  <text x="555" y="278" font-size="10" fill="#555">Drop-in std replacement</text>
  <text x="555" y="296" font-size="10" fill="#555">Works in both contexts</text>
  <text x="555" y="314" font-size="10" fill="#555">Bridge sync &amp; async code</text>
  <!-- Decision guide -->
  <rect x="30" y="345" width="740" height="100" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">When to Use What</text>
  <text x="45" y="395" font-size="10" fill="#555">Request/Response: oneshot | Fan-out: broadcast | Config/State: watch</text>
  <text x="45" y="415" font-size="10" fill="#555">Work distribution: mpsc (bounded for backpressure) | Sync MPMC: crossbeam | Mixed: flume</text>
  <text x="45" y="435" font-size="10" fill="#dc3545">Unbounded channels can cause OOM - prefer bounded with backpressure in production</text>
</svg>
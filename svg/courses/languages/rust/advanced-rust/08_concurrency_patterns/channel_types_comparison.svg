<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.7798" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Channel Types Comparison</text>
  <rect x="40" y="74.9399" width="372.9729" height="195.6626" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="109.8796" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">mpsc (std / tokio)</text>
  <text x="64.3243" y="150" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Many producers, one consumer</text>
  <rect x="72.4324" y="179.7591" width="64.8649" height="27.9518" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="104.8649" y="199.3253" text-anchor="middle" font-size="14.8899" fill="var(--text)" font-family="Arial, sans-serif">tx1</text>
  <rect x="153.5134" y="179.7591" width="64.8649" height="27.9518" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="199.3253" text-anchor="middle" font-size="14.8899" fill="var(--text)" font-family="Arial, sans-serif">tx2</text>
  <line x1="218.3783" y1="193.735" x2="267.027" y2="214.6989" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="137.2972" y1="207.7109" x2="267.027" y2="214.6989" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="267.027" y="200.7229" width="113.5135" height="34.9397" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="224.482" text-anchor="middle" font-size="14.8899" fill="var(--text)" font-family="Arial, sans-serif">rx (one)</text>
  <text x="226.4864" y="259.4218" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Bounded/unbounded</text>
  <rect x="453.5135" y="74.9399" width="372.9729" height="195.6626" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="109.8796" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">oneshot (tokio)</text>
  <text x="477.8378" y="150" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">One sender, one receiver</text>
  <text x="477.8378" y="180" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Exactly ONE message</text>
  <rect x="485.9459" y="200.7229" width="113.5135" height="34.9397" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="542.7026" y="224.482" text-anchor="middle" font-size="14.8899" fill="var(--text)" font-family="Arial, sans-serif">tx</text>
  <line x1="599.4594" y1="217.494" x2="672.4324" y2="217.494" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="680.5405" y="200.7229" width="113.5135" height="34.9397" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="737.2972" y="224.482" text-anchor="middle" font-size="14.8899" fill="var(--text)" font-family="Arial, sans-serif">rx</text>
  <text x="640" y="259.4218" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Request/response</text>
  <rect x="867.027" y="74.9399" width="372.9729" height="195.6626" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="109.8796" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">broadcast (tokio)</text>
  <text x="891.3513" y="150" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">One sender, many receivers</text>
  <rect x="996.7567" y="179.7591" width="81.0811" height="27.9518" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1037.2972" y="199.3253" text-anchor="middle" font-size="14.8899" fill="var(--text)" font-family="Arial, sans-serif">tx</text>
  <line x1="1037.2972" y1="207.7109" x2="931.8919" y2="221.6868" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1037.2972" y1="207.7109" x2="1037.2972" y2="221.6868" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1037.2972" y1="207.7109" x2="1142.7026" y2="221.6868" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="899.4594" y="224.482" width="56.7568" height="25.1566" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="927.027" y="242.6507" text-anchor="middle" font-size="14.8899" fill="var(--text)" font-family="Arial, sans-serif">rx1</text>
  <rect x="1009.7297" y="224.482" width="56.7568" height="25.1566" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1037.2972" y="242.6507" text-anchor="middle" font-size="14.8899" fill="var(--text)" font-family="Arial, sans-serif">rx2</text>
  <rect x="1118.3784" y="224.482" width="56.7568" height="25.1566" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.9459" y="242.6507" text-anchor="middle" font-size="14.8899" fill="var(--text)" font-family="Arial, sans-serif">rx3</text>
  <text x="1053.5135" y="270.6025" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Each gets clone</text>
  <rect x="40" y="298.5543" width="372.9729" height="153.7349" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="333.4941" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">watch (tokio)</text>
  <text x="64.3243" y="370" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Latest value, many observers</text>
  <text x="64.3243" y="400" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Keeps most recent only</text>
  <text x="64.3243" y="430" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Config/state updates</text>
  <rect x="453.5135" y="298.5543" width="372.9729" height="153.7349" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="333.4941" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">crossbeam-channel</text>
  <text x="477.8378" y="370" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">MPMC + select! macro</text>
  <text x="477.8378" y="400" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Bounded/unbounded</text>
  <text x="477.8378" y="430" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Faster than std sync</text>
  <rect x="867.027" y="298.5543" width="372.9729" height="153.7349" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="333.4941" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">flume</text>
  <text x="891.3513" y="370" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">MPMC, async + sync</text>
  <text x="891.3513" y="400" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Drop-in std replacement</text>
  <text x="891.3513" y="430" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Bridges sync/async</text>
  <rect x="40" y="480.241" width="1200" height="139.759" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="515.1807" text-anchor="middle" font-size="20.8458" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">When to Use What</text>
  <text x="64.3243" y="550.1205" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Req/resp: oneshot | Fan-out: broadcast | State: watch</text>
  <text x="64.3243" y="578.0724" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Work: mpsc | Sync MPMC: crossbeam | Mixed: flume</text>
  <text x="64.3243" y="606.0241" font-size="14.8899" fill="var(--danger-accent)" font-family="Arial, sans-serif">Prefer bounded in production (unbounded risks OOM)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.065" y="43.146" text-anchor="middle" font-size="28.764" font-weight="bold" fill="var(--text)">Channel Types Comparison</text>
  <rect x="44.1049" y="79.1012" width="338.1373" height="201.3483" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="213.1735" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--ok-accent)">mpsc (std / tokio)</text>
  <text x="66.1573" y="143.8202" font-size="14.382" fill="var(--text-muted)">Multiple Producer</text>
  <text x="66.1573" y="169.7079" font-size="14.382" fill="var(--text-muted)">Single Consumer</text>
  <rect x="73.5081" y="186.9663" width="58.8065" height="28.764" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="102.9114" y="207.1011" text-anchor="middle" font-size="14.382" fill="var(--text)">tx1</text>
  <rect x="147.0162" y="186.9663" width="58.8065" height="28.764" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="176.4195" y="207.1011" text-anchor="middle" font-size="14.382" fill="var(--text)">tx2</text>
  <line x1="205.8227" y1="201.3483" x2="249.9276" y2="222.9214" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="132.3146" y1="215.7303" x2="249.9276" y2="222.9214" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="249.9276" y="208.5393" width="102.9114" height="35.955" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="301.3833" y="232.9888" text-anchor="middle" font-size="14.382" fill="var(--text)">rx (one)</text>
  <text x="213.1735" y="268.9439" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">Bounded or unbounded</text>
  <rect x="418.9963" y="79.1012" width="338.1373" height="201.3483" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="588.065" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--primary-accent)">oneshot (tokio)</text>
  <text x="441.0487" y="143.8202" font-size="14.382" fill="var(--text-muted)">Single Producer</text>
  <text x="441.0487" y="169.7079" font-size="14.382" fill="var(--text-muted)">Single Consumer</text>
  <text x="441.0487" y="195.5955" font-size="14.382" fill="var(--text-muted)">Exactly ONE message</text>
  <rect x="448.3995" y="208.5393" width="102.9114" height="35.955" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="499.8552" y="232.9888" text-anchor="middle" font-size="14.382" fill="var(--text)">tx</text>
  <line x1="551.3109" y1="225.7977" x2="617.4682" y2="225.7977" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="624.819" y="208.5393" width="102.9114" height="35.955" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="676.2747" y="232.9888" text-anchor="middle" font-size="14.382" fill="var(--text)">rx</text>
  <text x="588.065" y="268.9439" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">Great for request/response</text>
  <rect x="793.8877" y="79.1012" width="338.1373" height="201.3483" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="962.9564" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--text)">broadcast (tokio)</text>
  <text x="815.9401" y="143.8202" font-size="14.382" fill="var(--text-muted)">Single Producer</text>
  <text x="815.9401" y="169.7079" font-size="14.382" fill="var(--text-muted)">Multiple Consumers</text>
  <rect x="911.5007" y="186.9663" width="73.5081" height="28.764" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="948.2547" y="207.1011" text-anchor="middle" font-size="14.382" fill="var(--text)">tx</text>
  <line x1="948.2547" y1="215.7303" x2="852.6942" y2="230.1124" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="948.2547" y1="215.7303" x2="948.2547" y2="230.1124" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="948.2547" y1="215.7303" x2="1043.8153" y2="230.1124" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="823.2909" y="232.9888" width="51.4557" height="25.8876" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="848.2837" y="251.6854" text-anchor="middle" font-size="14.382" fill="var(--text)">rx1</text>
  <rect x="923.262" y="232.9888" width="51.4557" height="25.8876" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="948.2547" y="251.6854" text-anchor="middle" font-size="14.382" fill="var(--text)">rx2</text>
  <rect x="1021.7629" y="232.9888" width="51.4557" height="25.8876" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1046.7556" y="251.6854" text-anchor="middle" font-size="14.382" fill="var(--text)">rx3</text>
  <text x="962.9564" y="280.4495" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">All receivers get clone</text>
  <rect x="44.1049" y="309.2135" width="338.1373" height="158.2022" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="213.1735" y="345.1686" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--primary-accent)">watch (tokio)</text>
  <text x="66.1573" y="373.9326" font-size="14.382" fill="var(--text-muted)">Single latest value</text>
  <text x="66.1573" y="399.8202" font-size="14.382" fill="var(--text-muted)">Multiple observers</text>
  <text x="66.1573" y="425.7078" font-size="14.382" fill="var(--text-muted)">Only keeps most recent</text>
  <text x="66.1573" y="451.5956" font-size="14.382" fill="var(--text-muted)">Config changes, state updates</text>
  <rect x="418.9963" y="309.2135" width="338.1373" height="158.2022" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="588.065" y="345.1686" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--ok-accent)">crossbeam-channel</text>
  <text x="441.0487" y="373.9326" font-size="14.382" fill="var(--text-muted)">MPMC support</text>
  <text x="441.0487" y="399.8202" font-size="14.382" fill="var(--text-muted)">select! macro</text>
  <text x="441.0487" y="425.7078" font-size="14.382" fill="var(--text-muted)">Bounded &amp; unbounded</text>
  <text x="441.0487" y="451.5956" font-size="14.382" fill="var(--text-muted)">Faster than std for sync code</text>
  <rect x="793.8877" y="309.2135" width="338.1373" height="158.2022" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="962.9564" y="345.1686" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--text)">flume</text>
  <text x="815.9401" y="373.9326" font-size="14.382" fill="var(--text-muted)">MPMC, async + sync</text>
  <text x="815.9401" y="399.8202" font-size="14.382" fill="var(--text-muted)">Drop-in std replacement</text>
  <text x="815.9401" y="425.7078" font-size="14.382" fill="var(--text-muted)">Works in both contexts</text>
  <text x="815.9401" y="451.5956" font-size="14.382" fill="var(--text-muted)">Bridge sync &amp; async code</text>
  <rect x="44.1049" y="496.1798" width="1087.9202" height="143.8202" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="588.065" y="532.1348" text-anchor="middle" font-size="20.1348" font-weight="bold" fill="var(--text)">When to Use What</text>
  <text x="66.1573" y="568.0899" font-size="14.382" fill="var(--text-muted)">Request/Response: oneshot | Fan-out: broadcast | Config/State: watch</text>
  <text x="66.1573" y="596.854" font-size="14.382" fill="var(--text-muted)">Work distribution: mpsc (bounded for backpressure) | Sync MPMC: crossbeam | Mixed: flume</text>
  <text x="66.1573" y="625.618" font-size="14.382" fill="var(--danger-accent)">Unbounded channels can cause OOM - prefer bounded with backpressure in production</text>
</svg>
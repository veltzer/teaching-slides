<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="54" text-anchor="middle" font-size="30.72" font-weight="bold" fill="#333">DashMap vs Mutex&lt;HashMap&gt;</text>
  <rect x="34.1333" y="90" width="307.2" height="72" rx="8.5333" fill="#4a90e2" stroke="#4a90e2" stroke-width="2.56" />
  <text x="187.7333" y="135" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#fff">Property</text>
  <rect x="341.3333" y="90" width="426.6667" height="72" rx="8.5333" fill="#ffc107" stroke="#ffc107" stroke-width="2.56" />
  <text x="554.6667" y="135" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Mutex&lt;HashMap&gt;</text>
  <rect x="768" y="90" width="477.8667" height="72" rx="8.5333" fill="#28a745" stroke="#28a745" stroke-width="2.56" />
  <text x="1006.9333" y="135" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#fff">DashMap</text>
  <rect x="34.1333" y="171" width="307.2" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="341.3333" y="171" width="426.6667" height="63" rx="5.12" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7067" />
  <rect x="768" y="171" width="477.8667" height="63" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="51.2" y="210.6" font-size="20.48" fill="#333">Granularity</text>
  <text x="358.4" y="210.6" font-size="20.48" fill="#333">Entire map locked</text>
  <text x="785.0667" y="210.6" font-size="20.48" fill="#333">Per-shard locking</text>
  <rect x="34.1333" y="243" width="307.2" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="341.3333" y="243" width="426.6667" height="63" rx="5.12" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7067" />
  <rect x="768" y="243" width="477.8667" height="63" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="51.2" y="282.6" font-size="20.48" fill="#333">Read concurrency</text>
  <text x="358.4" y="282.6" font-size="20.48" fill="#333">One at a time</text>
  <text x="785.0667" y="282.6" font-size="20.48" fill="#333">Many concurrent reads</text>
  <rect x="34.1333" y="315" width="307.2" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="341.3333" y="315" width="426.6667" height="63" rx="5.12" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7067" />
  <rect x="768" y="315" width="477.8667" height="63" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="51.2" y="354.6" font-size="20.48" fill="#333">Write concurrency</text>
  <text x="358.4" y="354.6" font-size="20.48" fill="#333">One at a time</text>
  <text x="785.0667" y="354.6" font-size="20.48" fill="#333">Concurrent on different shards</text>
  <rect x="34.1333" y="387" width="307.2" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="341.3333" y="387" width="426.6667" height="63" rx="5.12" fill="#f9f9f9" stroke="#ddd" stroke-width="1.7067" />
  <rect x="768" y="387" width="477.8667" height="63" rx="5.12" fill="#f9f9f9" stroke="#ddd" stroke-width="1.7067" />
  <text x="51.2" y="426.6" font-size="20.48" fill="#333">API</text>
  <text x="358.4" y="426.6" font-size="20.48" fill="#333">Standard HashMap</text>
  <text x="785.0667" y="426.6" font-size="20.48" fill="#333">Similar to HashMap</text>
  <rect x="34.1333" y="459" width="307.2" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="341.3333" y="459" width="426.6667" height="63" rx="5.12" fill="#f9f9f9" stroke="#ddd" stroke-width="1.7067" />
  <rect x="768" y="459" width="477.8667" height="63" rx="5.12" fill="#f9f9f9" stroke="#ddd" stroke-width="1.7067" />
  <text x="51.2" y="498.6" font-size="20.48" fill="#333">Overhead</text>
  <text x="358.4" y="498.6" font-size="20.48" fill="#333">Minimal</text>
  <text x="785.0667" y="498.6" font-size="20.48" fill="#333">Some (shard metadata)</text>
  <rect x="34.1333" y="531" width="307.2" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="341.3333" y="531" width="426.6667" height="63" rx="5.12" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7067" />
  <rect x="768" y="531" width="477.8667" height="63" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="51.2" y="570.6" font-size="20.48" fill="#333">Best for</text>
  <text x="358.4" y="570.6" font-size="20.48" fill="#333">Simple cases, few threads</text>
  <text x="785.0667" y="570.6" font-size="20.48" fill="#333">High-contention, many threads</text>
</svg>
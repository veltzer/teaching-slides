<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="54" text-anchor="middle" font-size="30.72" font-weight="bold" fill="var(--text)">DashMap vs Mutex&lt;HashMap&gt;</text>
  <rect x="34.1333" y="90" width="307.2" height="72" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="187.7333" y="135" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--bg)">Property</text>
  <rect x="341.3333" y="90" width="426.6667" height="72" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="554.6667" y="135" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Mutex&lt;HashMap&gt;</text>
  <rect x="768" y="90" width="477.8667" height="72" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1006.9333" y="135" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--bg)">DashMap</text>
  <rect x="34.1333" y="171" width="307.2" height="63" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="341.3333" y="171" width="426.6667" height="63" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="768" y="171" width="477.8667" height="63" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="51.2" y="210.6" font-size="20.48" fill="var(--text)">Granularity</text>
  <text x="358.4" y="210.6" font-size="20.48" fill="var(--text)">Entire map locked</text>
  <text x="785.0667" y="210.6" font-size="20.48" fill="var(--text)">Per-shard locking</text>
  <rect x="34.1333" y="243" width="307.2" height="63" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="341.3333" y="243" width="426.6667" height="63" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="768" y="243" width="477.8667" height="63" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="51.2" y="282.6" font-size="20.48" fill="var(--text)">Read concurrency</text>
  <text x="358.4" y="282.6" font-size="20.48" fill="var(--text)">One at a time</text>
  <text x="785.0667" y="282.6" font-size="20.48" fill="var(--text)">Many concurrent reads</text>
  <rect x="34.1333" y="315" width="307.2" height="63" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="341.3333" y="315" width="426.6667" height="63" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="768" y="315" width="477.8667" height="63" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="51.2" y="354.6" font-size="20.48" fill="var(--text)">Write concurrency</text>
  <text x="358.4" y="354.6" font-size="20.48" fill="var(--text)">One at a time</text>
  <text x="785.0667" y="354.6" font-size="20.48" fill="var(--text)">Concurrent on different shards</text>
  <rect x="34.1333" y="387" width="307.2" height="63" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="341.3333" y="387" width="426.6667" height="63" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="768" y="387" width="477.8667" height="63" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="51.2" y="426.6" font-size="20.48" fill="var(--text)">API</text>
  <text x="358.4" y="426.6" font-size="20.48" fill="var(--text)">Standard HashMap</text>
  <text x="785.0667" y="426.6" font-size="20.48" fill="var(--text)">Similar to HashMap</text>
  <rect x="34.1333" y="459" width="307.2" height="63" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="341.3333" y="459" width="426.6667" height="63" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="768" y="459" width="477.8667" height="63" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="51.2" y="498.6" font-size="20.48" fill="var(--text)">Overhead</text>
  <text x="358.4" y="498.6" font-size="20.48" fill="var(--text)">Minimal</text>
  <text x="785.0667" y="498.6" font-size="20.48" fill="var(--text)">Some (shard metadata)</text>
  <rect x="34.1333" y="531" width="307.2" height="63" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="341.3333" y="531" width="426.6667" height="63" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="768" y="531" width="477.8667" height="63" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="51.2" y="570.6" font-size="20.48" fill="var(--text)">Best for</text>
  <text x="358.4" y="570.6" font-size="20.48" fill="var(--text)">Simple cases, few threads</text>
  <text x="785.0667" y="570.6" font-size="20.48" fill="var(--text)">High-contention, many threads</text>
</svg>
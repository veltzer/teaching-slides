<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="304.2253" height="82.857112244896" rx="6.210590225294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.1127" y="91.785681760202" text-anchor="middle" font-size="25.507101074956" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Property</text>
  <rect x="344.2253" y="40" width="422.5352" height="82.857112244896" rx="6.210590225294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="555.493" y="91.785681760202" text-anchor="middle" font-size="25.507101074956" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mutex&lt;HashMap&gt;</text>
  <rect x="766.7606" y="40" width="473.2394" height="82.857112244896" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.3802" y="91.785681760202" text-anchor="middle" font-size="25.507101074956" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">DashMap</text>
  <rect x="40" y="133.214291454082" width="304.2253" height="72.500040178574" rx="6.210590225294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="344.2253" y="133.214291454082" width="422.5352" height="72.500040178574" rx="6.210590225294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="766.7606" y="133.214291454082" width="473.2394" height="72.500040178574" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9014" y="178.785687117345" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Granularity</text>
  <text x="361.1268" y="178.785687117345" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Entire map locked</text>
  <text x="783.662" y="178.785687117345" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Per-shard locking</text>
  <rect x="40" y="216.071403698978" width="304.2253" height="72.500040178574" rx="6.210590225294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="344.2253" y="216.071403698978" width="422.5352" height="72.500040178574" rx="6.210590225294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="766.7606" y="216.071403698978" width="473.2394" height="72.500040178574" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9014" y="261.642799362241" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Read concurrency</text>
  <text x="361.1268" y="261.642799362241" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">One at a time</text>
  <text x="783.662" y="261.642799362241" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Many concurrent reads</text>
  <rect x="40" y="298.928515943874" width="304.2253" height="72.500040178574" rx="6.210590225294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="344.2253" y="298.928515943874" width="422.5352" height="72.500040178574" rx="6.210590225294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="766.7606" y="298.928515943874" width="473.2394" height="72.500040178574" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9014" y="344.500018750001" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Write concurrency</text>
  <text x="361.1268" y="344.500018750001" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">One at a time</text>
  <text x="783.662" y="344.500018750001" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Concurrent on different shards</text>
  <rect x="40" y="381.785735331634" width="304.2253" height="72.500040178574" rx="6.210590225294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="344.2253" y="381.785735331634" width="422.5352" height="72.500040178574" rx="6.210590225294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="766.7606" y="381.785735331634" width="473.2394" height="72.500040178574" rx="6.210590225294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="56.9014" y="427.357130994897" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">API</text>
  <text x="361.1268" y="427.357130994897" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Standard HashMap</text>
  <text x="783.662" y="427.357130994897" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Similar to HashMap</text>
  <rect x="40" y="464.64284757653" width="304.2253" height="72.500040178574" rx="6.210590225294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="344.2253" y="464.64284757653" width="422.5352" height="72.500040178574" rx="6.210590225294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="766.7606" y="464.64284757653" width="473.2394" height="72.500040178574" rx="6.210590225294" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="56.9014" y="510.214243239793" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Overhead</text>
  <text x="361.1268" y="510.214243239793" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Minimal</text>
  <text x="783.662" y="510.214243239793" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Some (shard metadata)</text>
  <rect x="40" y="547.499959821426" width="304.2253" height="72.500040178574" rx="6.210590225294" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="344.2253" y="547.499959821426" width="422.5352" height="72.500040178574" rx="6.210590225294" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="766.7606" y="547.499959821426" width="473.2394" height="72.500040178574" rx="6.210590225294" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9014" y="593.071462627553" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Best for</text>
  <text x="361.1268" y="593.071462627553" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">Simple cases, few threads</text>
  <text x="783.662" y="593.071462627553" font-size="21.863347789776" fill="var(--text)" font-family="Arial, sans-serif">High-contention, many threads</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="54" text-anchor="middle" font-size="30.72" font-weight="bold" fill="#333">DashMap vs Mutex&lt;HashMap&gt;</text>

  <text x="554.6667" y="135" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Mutex&lt;HashMap&gt;</text>
  <rect x="768" y="90" width="477.8667" height="72" rx="8.5333" fill="#28a745" stroke="#28a745" stroke-width="2.56" />
  <text x="1006.9333" y="135" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#fff">DashMap</text>

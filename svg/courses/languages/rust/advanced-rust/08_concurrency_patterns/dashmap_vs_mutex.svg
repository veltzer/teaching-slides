  <rect x="768" y="171" width="477.8667" height="63" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="51.2" y="210.6" font-size="20.48" fill="#333">Granularity</text>
  <text x="358.4" y="210.6" font-size="20.48" fill="#333">Entire map locked</text>
  <text x="785.0667" y="210.6" font-size="20.48" fill="#333">Per-shard locking</text>
  <rect x="34.1333" y="243" width="307.2" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="341.3333" y="243" width="426.6667" height="63" rx="5.12" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7067" />
  <rect x="768" y="243" width="477.8667" height="63" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="51.2" y="282.6" font-size="20.48" fill="#333">Read concurrency</text>
  <text x="358.4" y="282.6" font-size="20.48" fill="#333">One at a time</text>
  <text x="785.0667" y="282.6" font-size="20.48" fill="#333">Many concurrent reads</text>
  <rect x="34.1333" y="315" width="307.2" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="341.3333" y="315" width="426.6667" height="63" rx="5.12" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7067" />
  <rect x="768" y="315" width="477.8667" height="63" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="51.2" y="354.6" font-size="20.48" fill="#333">Write concurrency</text>
  <text x="358.4" y="354.6" font-size="20.48" fill="#333">One at a time</text>
  <text x="785.0667" y="354.6" font-size="20.48" fill="#333">Concurrent on different shards</text>
  <rect x="34.1333" y="387" width="307.2" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="341.3333" y="387" width="426.6667" height="63" rx="5.12" fill="#f8f9fa" stroke="#ddd" stroke-width="1.7067" />
  <rect x="768" y="387" width="477.8667" height="63" rx="5.12" fill="#f8f9fa" stroke="#ddd" stroke-width="1.7067" />
  <text x="51.2" y="426.6" font-size="20.48" fill="#333">API</text>
  <text x="358.4" y="426.6" font-size="20.48" fill="#333">Standard HashMap</text>
  <text x="785.0667" y="426.6" font-size="20.48" fill="#333">Similar to HashMap</text>
  <rect x="34.1333" y="459" width="307.2" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="341.3333" y="459" width="426.6667" height="63" rx="5.12" fill="#f8f9fa" stroke="#ddd" stroke-width="1.7067" />
  <rect x="768" y="459" width="477.8667" height="63" rx="5.12" fill="#f8f9fa" stroke="#ddd" stroke-width="1.7067" />
  <text x="51.2" y="498.6" font-size="20.48" fill="#333">Overhead</text>
  <text x="358.4" y="498.6" font-size="20.48" fill="#333">Minimal</text>
  <text x="785.0667" y="498.6" font-size="20.48" fill="#333">Some (shard metadata)</text>
  <rect x="34.1333" y="531" width="307.2" height="63" rx="5.12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7067" />
  <rect x="341.3333" y="531" width="426.6667" height="63" rx="5.12" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7067" />
  <rect x="768" y="531" width="477.8667" height="63" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="51.2" y="570.6" font-size="20.48" fill="#333">Best for</text>
  <text x="358.4" y="570.6" font-size="20.48" fill="#333">Simple cases, few threads</text>
  <text x="785.0667" y="570.6" font-size="20.48" fill="#333">High-contention, many threads</text>
</svg>
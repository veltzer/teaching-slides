<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:text x="597.3333" y="48" text-anchor="middle" font-size="28.672" font-weight="bold" fill="var(--text-dark)">Scoped Threads vs Regular Threads</ns0:text>
  <ns0:rect x="31.8577" y="80" width="318.5777" height="64" rx="7.9644" fill="var(--primary-bright)" stroke="var(--primary-bright)" stroke-width="2.3893" />
  <ns0:text x="191.1467" y="120" text-anchor="middle" font-size="22.3004" font-weight="bold" fill="var(--bg)">Property</ns0:text>
  <ns0:rect x="350.4356" y="80" width="382.2933" height="64" rx="7.9644" fill="var(--warn-yellow)" stroke="var(--warn-yellow)" stroke-width="2.3893" />
  <ns0:text x="541.5822" y="120" text-anchor="middle" font-size="22.3004" font-weight="bold" fill="var(--text-dark)">thread::spawn</ns0:text>
  <ns0:rect x="732.7289" y="80" width="430.08" height="64" rx="7.9644" fill="var(--ok-bright)" stroke="var(--ok-bright)" stroke-width="2.3893" />
  <ns0:text x="947.7689" y="120" text-anchor="middle" font-size="22.3004" font-weight="bold" fill="var(--bg)">thread::scope</ns0:text>
  <ns0:rect x="31.8577" y="152" width="318.5777" height="56" rx="4.7787" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5929" />
  <ns0:rect x="350.4356" y="152" width="382.2933" height="56" rx="4.7787" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.5929" />
  <ns0:rect x="732.7289" y="152" width="430.08" height="56" rx="4.7787" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5929" />
  <ns0:text x="47.7867" y="187.2" font-size="19.1147" fill="var(--text-dark)">Lifetime bounds</ns0:text>
  <ns0:text x="366.3644" y="187.2" font-size="19.1147" fill="var(--text-dark)">'static required</ns0:text>
  <ns0:text x="748.6577" y="187.2" font-size="19.1147" fill="var(--ok-bright)">Can borrow locals</ns0:text>
  <ns0:rect x="31.8577" y="216" width="318.5777" height="56" rx="4.7787" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5929" />
  <ns0:rect x="350.4356" y="216" width="382.2933" height="56" rx="4.7787" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.5929" />
  <ns0:rect x="732.7289" y="216" width="430.08" height="56" rx="4.7787" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5929" />
  <ns0:text x="47.7867" y="251.2" font-size="19.1147" fill="var(--text-dark)">Sharing data</ns0:text>
  <ns0:text x="366.3644" y="251.2" font-size="19.1147" fill="var(--text-dark)">Arc&lt;T&gt; needed</ns0:text>
  <ns0:text x="748.6577" y="251.2" font-size="19.1147" fill="var(--ok-bright)">&amp;T works directly</ns0:text>
  <ns0:rect x="31.8577" y="280" width="318.5777" height="56" rx="4.7787" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5929" />
  <ns0:rect x="350.4356" y="280" width="382.2933" height="56" rx="4.7787" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.5929" />
  <ns0:rect x="732.7289" y="280" width="430.08" height="56" rx="4.7787" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5929" />
  <ns0:text x="47.7867" y="315.2" font-size="19.1147" fill="var(--text-dark)">Mutable sharing</ns0:text>
  <ns0:text x="366.3644" y="315.2" font-size="19.1147" fill="var(--text-dark)">Arc&lt;Mutex&lt;T&gt;&gt;</ns0:text>
  <ns0:text x="748.6577" y="315.2" font-size="19.1147" fill="var(--ok-bright)">Split borrows work</ns0:text>
  <ns0:rect x="31.8577" y="344" width="318.5777" height="56" rx="4.7787" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5929" />
  <ns0:rect x="350.4356" y="344" width="382.2933" height="56" rx="4.7787" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.5929" />
  <ns0:rect x="732.7289" y="344" width="430.08" height="56" rx="4.7787" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5929" />
  <ns0:text x="47.7867" y="379.2" font-size="19.1147" fill="var(--text-dark)">Join behavior</ns0:text>
  <ns0:text x="366.3644" y="379.2" font-size="19.1147" fill="var(--text-dark)">Manual join</ns0:text>
  <ns0:text x="748.6577" y="379.2" font-size="19.1147" fill="var(--ok-bright)">Auto-joined at scope</ns0:text>
  <ns0:rect x="31.8577" y="408" width="318.5777" height="56" rx="4.7787" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.5929" />
  <ns0:rect x="350.4356" y="408" width="382.2933" height="56" rx="4.7787" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.5929" />
  <ns0:rect x="732.7289" y="408" width="430.08" height="56" rx="4.7787" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.5929" />
  <ns0:text x="47.7867" y="443.2" font-size="19.1147" fill="var(--text-dark)">Error handling</ns0:text>
  <ns0:text x="366.3644" y="443.2" font-size="19.1147" fill="var(--text-dark)">JoinHandle result</ns0:text>
  <ns0:text x="748.6577" y="443.2" font-size="19.1147" fill="var(--ok-bright)">Panics propagate</ns0:text>
  <ns0:rect x="31.8577" y="496" width="1130.9511" height="144" rx="7.9644" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.1857" />
  <ns0:text x="63.7156" y="536" font-size="22.3004" font-weight="bold" fill="var(--primary-bright)">Use thread::scope when:</ns0:text>
  <ns0:text x="63.7156" y="572.8" font-size="20.7076" fill="var(--text-dark)">- You need to borrow data from the stack</ns0:text>
  <ns0:text x="63.7156" y="604.8" font-size="20.7076" fill="var(--text-dark)">- You want guaranteed cleanup (all threads join)</ns0:text>
  <ns0:text x="63.7156" y="636.8" font-size="20.7076" fill="var(--text-dark)">- The threads should not outlive the calling function</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.2334" font-weight="bold" fill="var(--text)">Scoped Threads vs Regular Threads</text>
  <rect x="40" y="71.3514" width="338.0281" height="62.7027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="209.0142" y="110.5405" text-anchor="middle" font-size="22.7371" font-weight="bold" fill="var(--bg)">Property</text>
  <rect x="378.0283" y="71.3514" width="405.6337" height="62.7027" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="580.8451" y="110.5405" text-anchor="middle" font-size="22.7371" font-weight="bold" fill="var(--text)">thread::spawn</text>
  <rect x="783.662" y="71.3514" width="456.338" height="62.7027" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1011.831" y="110.5405" text-anchor="middle" font-size="22.7371" font-weight="bold" fill="var(--bg)">thread::scope</text>
  <rect x="40" y="141.8919" width="338.0281" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="378.0283" y="141.8919" width="405.6337" height="54.8649" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="783.662" y="141.8919" width="456.338" height="54.8649" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="56.9015" y="176.3784" font-size="19.489" fill="var(--text)">Lifetime bounds</text>
  <text x="394.9296" y="176.3784" font-size="19.489" fill="var(--text)">'static required</text>
  <text x="800.5633" y="176.3784" font-size="19.489" fill="var(--ok-accent)">Can borrow locals</text>
  <rect x="40" y="204.5946" width="338.0281" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="378.0283" y="204.5946" width="405.6337" height="54.8649" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="783.662" y="204.5946" width="456.338" height="54.8649" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="56.9015" y="239.0811" font-size="19.489" fill="var(--text)">Sharing data</text>
  <text x="394.9296" y="239.0811" font-size="19.489" fill="var(--text)">Arc&lt;T&gt; needed</text>
  <text x="800.5633" y="239.0811" font-size="19.489" fill="var(--ok-accent)">&amp;T works directly</text>
  <rect x="40" y="267.2973" width="338.0281" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="378.0283" y="267.2973" width="405.6337" height="54.8649" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="783.662" y="267.2973" width="456.338" height="54.8649" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="56.9015" y="301.7838" font-size="19.489" fill="var(--text)">Mutable sharing</text>
  <text x="394.9296" y="301.7838" font-size="19.489" fill="var(--text)">Arc&lt;Mutex&lt;T&gt;&gt;</text>
  <text x="800.5633" y="301.7838" font-size="19.489" fill="var(--ok-accent)">Split borrows work</text>
  <rect x="40" y="330" width="338.0281" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="378.0283" y="330" width="405.6337" height="54.8649" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="783.662" y="330" width="456.338" height="54.8649" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="56.9015" y="364.4865" font-size="19.489" fill="var(--text)">Join behavior</text>
  <text x="394.9296" y="364.4865" font-size="19.489" fill="var(--text)">Manual join</text>
  <text x="800.5633" y="364.4865" font-size="19.489" fill="var(--ok-accent)">Auto-joined at scope</text>
  <rect x="40" y="392.7027" width="338.0281" height="54.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="378.0283" y="392.7027" width="405.6337" height="54.8649" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="783.662" y="392.7027" width="456.338" height="54.8649" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="56.9015" y="427.1892" font-size="19.489" fill="var(--text)">Error handling</text>
  <text x="394.9296" y="427.1892" font-size="19.489" fill="var(--text)">JoinHandle result</text>
  <text x="800.5633" y="427.1892" font-size="19.489" fill="var(--ok-accent)">Panics propagate</text>
  <rect x="40" y="478.9189" width="1199.9999" height="141.0811" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="73.8029" y="518.1081" font-size="22.7371" font-weight="bold" fill="var(--primary-accent)">Use thread::scope when:</text>
  <text x="73.8029" y="554.1622" font-size="21.1131" fill="var(--text)">- You need to borrow data from the stack</text>
  <text x="73.8029" y="585.5135" font-size="21.1131" fill="var(--text)">- You want guaranteed cleanup (all threads join)</text>
  <text x="73.8029" y="616.8649" font-size="21.1131" fill="var(--text)">- The threads should not outlive the calling function</text>
</svg>
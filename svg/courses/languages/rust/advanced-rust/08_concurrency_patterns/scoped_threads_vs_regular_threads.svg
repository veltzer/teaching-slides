<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="597.3333" y="48" text-anchor="middle" font-size="28.672" font-weight="bold" fill="#333">Scoped Threads vs Regular Threads</ns0:text>
  <ns0:rect x="31.8577" y="80" width="318.5777" height="64" rx="7.9644" fill="#4a90e2" stroke="#4a90e2" stroke-width="2.3893" />
  <ns0:text x="191.1467" y="120" text-anchor="middle" font-size="22.3004" font-weight="bold" fill="#fff">Property</ns0:text>
  <ns0:rect x="350.4356" y="80" width="382.2933" height="64" rx="7.9644" fill="#ffc107" stroke="#ffc107" stroke-width="2.3893" />
  <ns0:text x="541.5822" y="120" text-anchor="middle" font-size="22.3004" font-weight="bold" fill="#333">thread::spawn</ns0:text>
  <ns0:rect x="732.7289" y="80" width="430.08" height="64" rx="7.9644" fill="#28a745" stroke="#28a745" stroke-width="2.3893" />
  <ns0:text x="947.7689" y="120" text-anchor="middle" font-size="22.3004" font-weight="bold" fill="#fff">thread::scope</ns0:text>
  <ns0:rect x="31.8577" y="152" width="318.5777" height="56" rx="4.7787" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5929" />
  <ns0:rect x="350.4356" y="152" width="382.2933" height="56" rx="4.7787" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5929" />
  <ns0:rect x="732.7289" y="152" width="430.08" height="56" rx="4.7787" fill="#d4edda" stroke="#28a745" stroke-width="1.5929" />
  <ns0:text x="47.7867" y="187.2" font-size="19.1147" fill="#333">Lifetime bounds</ns0:text>
  <ns0:text x="366.3644" y="187.2" font-size="19.1147" fill="#333">'static required</ns0:text>
  <ns0:text x="748.6577" y="187.2" font-size="19.1147" fill="#28a745">Can borrow locals</ns0:text>
  <ns0:rect x="31.8577" y="216" width="318.5777" height="56" rx="4.7787" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5929" />
  <ns0:rect x="350.4356" y="216" width="382.2933" height="56" rx="4.7787" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5929" />
  <ns0:rect x="732.7289" y="216" width="430.08" height="56" rx="4.7787" fill="#d4edda" stroke="#28a745" stroke-width="1.5929" />
  <ns0:text x="47.7867" y="251.2" font-size="19.1147" fill="#333">Sharing data</ns0:text>
  <ns0:text x="366.3644" y="251.2" font-size="19.1147" fill="#333">Arc&lt;T&gt; needed</ns0:text>
  <ns0:text x="748.6577" y="251.2" font-size="19.1147" fill="#28a745">&amp;T works directly</ns0:text>
  <ns0:rect x="31.8577" y="280" width="318.5777" height="56" rx="4.7787" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5929" />
  <ns0:rect x="350.4356" y="280" width="382.2933" height="56" rx="4.7787" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5929" />
  <ns0:rect x="732.7289" y="280" width="430.08" height="56" rx="4.7787" fill="#d4edda" stroke="#28a745" stroke-width="1.5929" />
  <ns0:text x="47.7867" y="315.2" font-size="19.1147" fill="#333">Mutable sharing</ns0:text>
  <ns0:text x="366.3644" y="315.2" font-size="19.1147" fill="#333">Arc&lt;Mutex&lt;T&gt;&gt;</ns0:text>
  <ns0:text x="748.6577" y="315.2" font-size="19.1147" fill="#28a745">Split borrows work</ns0:text>
  <ns0:rect x="31.8577" y="344" width="318.5777" height="56" rx="4.7787" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5929" />
  <ns0:rect x="350.4356" y="344" width="382.2933" height="56" rx="4.7787" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5929" />
  <ns0:rect x="732.7289" y="344" width="430.08" height="56" rx="4.7787" fill="#d4edda" stroke="#28a745" stroke-width="1.5929" />
  <ns0:text x="47.7867" y="379.2" font-size="19.1147" fill="#333">Join behavior</ns0:text>
  <ns0:text x="366.3644" y="379.2" font-size="19.1147" fill="#333">Manual join</ns0:text>
  <ns0:text x="748.6577" y="379.2" font-size="19.1147" fill="#28a745">Auto-joined at scope</ns0:text>
  <ns0:rect x="31.8577" y="408" width="318.5777" height="56" rx="4.7787" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5929" />
  <ns0:rect x="350.4356" y="408" width="382.2933" height="56" rx="4.7787" fill="#f8f9fa" stroke="#ddd" stroke-width="1.5929" />
  <ns0:rect x="732.7289" y="408" width="430.08" height="56" rx="4.7787" fill="#d4edda" stroke="#28a745" stroke-width="1.5929" />
  <ns0:text x="47.7867" y="443.2" font-size="19.1147" fill="#333">Error handling</ns0:text>
  <ns0:text x="366.3644" y="443.2" font-size="19.1147" fill="#333">JoinHandle result</ns0:text>
  <ns0:text x="748.6577" y="443.2" font-size="19.1147" fill="#28a745">Panics propagate</ns0:text>
  <ns0:rect x="31.8577" y="496" width="1130.9511" height="144" rx="7.9644" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1857" />
  <ns0:text x="63.7156" y="536" font-size="22.3004" font-weight="bold" fill="#4a90e2">Use thread::scope when:</ns0:text>
  <ns0:text x="63.7156" y="572.8" font-size="20.7076" fill="#333">- You need to borrow data from the stack</ns0:text>
  <ns0:text x="63.7156" y="604.8" font-size="20.7076" fill="#333">- You want guaranteed cleanup (all threads join)</ns0:text>
  <ns0:text x="63.7156" y="636.8" font-size="20.7076" fill="#333">- The threads should not outlive the calling function</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="338.0281" height="66.285717306123" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.0142" y="81.428480816318" text-anchor="middle" font-size="23.377708065138" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Property</text>
  <rect x="378.0283" y="40" width="405.6337" height="66.285717306123" rx="6.169047433086" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580.8451" y="81.428480816318" text-anchor="middle" font-size="23.377708065138" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">thread::spawn</text>
  <rect x="783.662" y="40" width="456.338" height="66.285717306123" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1011.831" y="81.428480816318" text-anchor="middle" font-size="23.377708065138" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">thread::scope</text>
  <rect x="40" y="114.571392326527" width="338.0281" height="58.000042285718" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0283" y="114.571392326527" width="405.6337" height="58.000042285718" rx="6.169047433086" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="114.571392326527" width="456.338" height="58.000042285718" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="151.028552702039" font-size="20.038094237236" fill="var(--text)" font-family="Arial, sans-serif">Lifetime bounds</text>
  <text x="394.9296" y="151.028552702039" font-size="20.038094237236" fill="var(--text)" font-family="Arial, sans-serif">'static required</text>
  <text x="800.5633" y="151.028552702039" font-size="20.038094237236" fill="var(--ok-accent)" font-family="Arial, sans-serif">Can borrow locals</text>
  <rect x="40" y="180.85710963265" width="338.0281" height="58.000042285718" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0283" y="180.85710963265" width="405.6337" height="58.000042285718" rx="6.169047433086" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="180.85710963265" width="456.338" height="58.000042285718" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="217.314270008162" font-size="20.038094237236" fill="var(--text)" font-family="Arial, sans-serif">Sharing data</text>
  <text x="394.9296" y="217.314270008162" font-size="20.038094237236" fill="var(--text)" font-family="Arial, sans-serif">Arc&lt;T&gt; needed</text>
  <text x="800.5633" y="217.314270008162" font-size="20.038094237236" fill="var(--ok-accent)" font-family="Arial, sans-serif">&amp;T works directly</text>
  <rect x="40" y="247.142826938773" width="338.0281" height="58.000042285718" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0283" y="247.142826938773" width="405.6337" height="58.000042285718" rx="6.169047433086" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="247.142826938773" width="456.338" height="58.000042285718" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="283.599987314285" font-size="20.038094237236" fill="var(--text)" font-family="Arial, sans-serif">Mutable sharing</text>
  <text x="394.9296" y="283.599987314285" font-size="20.038094237236" fill="var(--text)" font-family="Arial, sans-serif">Arc&lt;Mutex&lt;T&gt;&gt;</text>
  <text x="800.5633" y="283.599987314285" font-size="20.038094237236" fill="var(--ok-accent)" font-family="Arial, sans-serif">Split borrows work</text>
  <rect x="40" y="313.428544244896" width="338.0281" height="58.000042285718" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0283" y="313.428544244896" width="405.6337" height="58.000042285718" rx="6.169047433086" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="313.428544244896" width="456.338" height="58.000042285718" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="349.885704620407" font-size="20.038094237236" fill="var(--text)" font-family="Arial, sans-serif">Join behavior</text>
  <text x="394.9296" y="349.885704620407" font-size="20.038094237236" fill="var(--text)" font-family="Arial, sans-serif">Manual join</text>
  <text x="800.5633" y="349.885704620407" font-size="20.038094237236" fill="var(--ok-accent)" font-family="Arial, sans-serif">Auto-joined at scope</text>
  <rect x="40" y="379.714261551018" width="338.0281" height="58.000042285718" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0283" y="379.714261551018" width="405.6337" height="58.000042285718" rx="6.169047433086" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="783.662" y="379.714261551018" width="456.338" height="58.000042285718" rx="6.169047433086" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="416.17142192653" font-size="20.038094237236" fill="var(--text)" font-family="Arial, sans-serif">Error handling</text>
  <text x="394.9296" y="416.17142192653" font-size="20.038094237236" fill="var(--text)" font-family="Arial, sans-serif">JoinHandle result</text>
  <text x="800.5633" y="416.17142192653" font-size="20.038094237236" fill="var(--ok-accent)" font-family="Arial, sans-serif">Panics propagate</text>
  <rect x="40" y="470.85710963265" width="1199.9999" height="149.14289036735" rx="6.169047433086" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="73.8029" y="512.285696163264" font-size="23.377708065138" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use thread::scope when:</text>
  <text x="73.8029" y="550.400033828574" font-size="21.707952559916" fill="var(--text)" font-family="Arial, sans-serif">- You need to borrow data from the stack</text>
  <text x="73.8029" y="583.542839624488" font-size="21.707952559916" fill="var(--text)" font-family="Arial, sans-serif">- You want guaranteed cleanup (all threads join)</text>
  <text x="73.8029" y="616.685751134697" font-size="21.707952559916" fill="var(--text)" font-family="Arial, sans-serif">- The threads should not outlive the calling function</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="597.3333" y="48" text-anchor="middle" font-size="28.672" font-weight="bold" fill="var(--text)">Scoped Threads vs Regular Threads</text>
  <rect x="31.8577" y="80" width="318.5777" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="191.1467" y="120" text-anchor="middle" font-size="22.3004" font-weight="bold" fill="var(--bg)">Property</text>
  <rect x="350.4356" y="80" width="382.2933" height="64" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="541.5822" y="120" text-anchor="middle" font-size="22.3004" font-weight="bold" fill="var(--text)">thread::spawn</text>
  <rect x="732.7289" y="80" width="430.08" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="947.7689" y="120" text-anchor="middle" font-size="22.3004" font-weight="bold" fill="var(--bg)">thread::scope</text>
  <rect x="31.8577" y="152" width="318.5777" height="56" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="350.4356" y="152" width="382.2933" height="56" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="732.7289" y="152" width="430.08" height="56" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="47.7867" y="187.2" font-size="19.1147" fill="var(--text)">Lifetime bounds</text>
  <text x="366.3644" y="187.2" font-size="19.1147" fill="var(--text)">'static required</text>
  <text x="748.6577" y="187.2" font-size="19.1147" fill="var(--ok-accent)">Can borrow locals</text>
  <rect x="31.8577" y="216" width="318.5777" height="56" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="350.4356" y="216" width="382.2933" height="56" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="732.7289" y="216" width="430.08" height="56" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="47.7867" y="251.2" font-size="19.1147" fill="var(--text)">Sharing data</text>
  <text x="366.3644" y="251.2" font-size="19.1147" fill="var(--text)">Arc&lt;T&gt; needed</text>
  <text x="748.6577" y="251.2" font-size="19.1147" fill="var(--ok-accent)">&amp;T works directly</text>
  <rect x="31.8577" y="280" width="318.5777" height="56" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="350.4356" y="280" width="382.2933" height="56" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="732.7289" y="280" width="430.08" height="56" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="47.7867" y="315.2" font-size="19.1147" fill="var(--text)">Mutable sharing</text>
  <text x="366.3644" y="315.2" font-size="19.1147" fill="var(--text)">Arc&lt;Mutex&lt;T&gt;&gt;</text>
  <text x="748.6577" y="315.2" font-size="19.1147" fill="var(--ok-accent)">Split borrows work</text>
  <rect x="31.8577" y="344" width="318.5777" height="56" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="350.4356" y="344" width="382.2933" height="56" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="732.7289" y="344" width="430.08" height="56" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="47.7867" y="379.2" font-size="19.1147" fill="var(--text)">Join behavior</text>
  <text x="366.3644" y="379.2" font-size="19.1147" fill="var(--text)">Manual join</text>
  <text x="748.6577" y="379.2" font-size="19.1147" fill="var(--ok-accent)">Auto-joined at scope</text>
  <rect x="31.8577" y="408" width="318.5777" height="56" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="350.4356" y="408" width="382.2933" height="56" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="732.7289" y="408" width="430.08" height="56" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="47.7867" y="443.2" font-size="19.1147" fill="var(--text)">Error handling</text>
  <text x="366.3644" y="443.2" font-size="19.1147" fill="var(--text)">JoinHandle result</text>
  <text x="748.6577" y="443.2" font-size="19.1147" fill="var(--ok-accent)">Panics propagate</text>
  <rect x="31.8577" y="496" width="1130.9511" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="63.7156" y="536" font-size="22.3004" font-weight="bold" fill="var(--primary-accent)">Use thread::scope when:</text>
  <text x="63.7156" y="572.8" font-size="20.7076" fill="var(--text)">- You need to borrow data from the stack</text>
  <text x="63.7156" y="604.8" font-size="20.7076" fill="var(--text)">- You want guaranteed cleanup (all threads join)</text>
  <text x="63.7156" y="636.8" font-size="20.7076" fill="var(--text)">- The threads should not outlive the calling function</text>
</svg>
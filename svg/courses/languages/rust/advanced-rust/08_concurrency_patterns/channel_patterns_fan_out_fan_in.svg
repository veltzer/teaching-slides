  <text x="143.4483" y="323.7857" text-anchor="middle" font-size="21.4698" fill="var(--text)">work</text>
  <rect x="71.0345" y="350.7143" width="144.8276" height="51.7857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.4483" y="385.9285" text-anchor="middle" font-size="21.4698" fill="var(--text)">work</text>
  <rect x="71.0345" y="412.8571" width="144.8276" height="51.7857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.4483" y="448.0714" text-anchor="middle" font-size="21.4698" fill="var(--text)">work</text>
  <line x1="246.8966" y1="247.1429" x2="453.7931" y2="205.7143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="246.8966" y1="319.6429" x2="453.7931" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="246.8966" y1="392.1429" x2="453.7931" y2="454.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="453.7931" y="143.5714" width="248.2759" height="103.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="577.931" y="205.7143" text-anchor="middle" font-size="25.3734" font-weight="bold" fill="var(--text)">Worker 1</text>

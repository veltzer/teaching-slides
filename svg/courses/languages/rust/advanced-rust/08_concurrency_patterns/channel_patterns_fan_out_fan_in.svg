<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="702.069" y="40" text-anchor="middle" font-size="35.1324" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Fan-Out / Fan-In Channel Pattern</text>
  <rect x="40" y="143.5714" width="206.8965" height="372.8571" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.4483" y="205.7143" text-anchor="middle" font-size="25.3734" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Work Queue</text>
  <rect x="71.0345" y="226.4285" width="144.8276" height="51.7857" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.4483" y="261.6429" text-anchor="middle" font-size="21.4698" fill="var(--text)" font-family="Arial, sans-serif">work</text>
  <rect x="71.0345" y="288.5714" width="144.8276" height="51.7857" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.4483" y="323.7857" text-anchor="middle" font-size="21.4698" fill="var(--text)" font-family="Arial, sans-serif">work</text>
  <rect x="71.0345" y="350.7143" width="144.8276" height="51.7857" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.4483" y="385.9285" text-anchor="middle" font-size="21.4698" fill="var(--text)" font-family="Arial, sans-serif">work</text>
  <rect x="71.0345" y="412.8571" width="144.8276" height="51.7857" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.4483" y="448.0714" text-anchor="middle" font-size="21.4698" fill="var(--text)" font-family="Arial, sans-serif">work</text>
  <line x1="246.8966" y1="247.1429" x2="453.7931" y2="205.7143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="246.8966" y1="319.6429" x2="453.7931" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="246.8966" y1="392.1429" x2="453.7931" y2="454.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="453.7931" y="143.5714" width="248.2759" height="103.5714" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="577.931" y="205.7143" text-anchor="middle" font-size="25.3734" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Worker 1</text>
  <rect x="453.7931" y="278.2143" width="248.2759" height="103.5714" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="577.931" y="340.3571" text-anchor="middle" font-size="25.3734" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Worker 2</text>
  <rect x="453.7931" y="412.8571" width="248.2759" height="103.5714" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="577.931" y="475" text-anchor="middle" font-size="25.3734" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Worker 3</text>
  <line x1="702.069" y1="195.3571" x2="950.3448" y2="298.9285" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="702.069" y1="330" x2="950.3448" y2="330" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="702.069" y1="464.6429" x2="950.3448" y2="361.0714" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="950.3448" y="247.1429" width="289.6552" height="165.7143" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.1724" y="319.6429" text-anchor="middle" font-size="27.3252" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Collector</text>
  <text x="1095.1724" y="361.0714" text-anchor="middle" font-size="23.4216" fill="var(--text-muted)" font-family="Arial, sans-serif">(fan-in)</text>
  <text x="329.6552" y="620" text-anchor="middle" font-size="25.3734" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Fan-Out</text>
  <text x="846.8965" y="620" text-anchor="middle" font-size="25.3734" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Fan-In</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

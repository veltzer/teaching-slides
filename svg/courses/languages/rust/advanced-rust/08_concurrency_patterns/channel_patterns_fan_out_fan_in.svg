  <rect x="71.0345" y="226.4285" width="144.8276" height="51.7857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.4483" y="261.6429" text-anchor="middle" font-size="21.4698" fill="var(--text)">work</text>

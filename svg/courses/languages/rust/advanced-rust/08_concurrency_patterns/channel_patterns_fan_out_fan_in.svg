<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Fan-Out / Fan-In Channel Pattern</text>
  <!-- Work queue -->
  <rect x="30" y="80" width="100" height="180" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="80" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Work Queue</text>
  <rect x="45" y="120" width="70" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="80" y="137" text-anchor="middle" font-size="11" fill="#333">work</text>
  <rect x="45" y="150" width="70" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="80" y="167" text-anchor="middle" font-size="11" fill="#333">work</text>
  <rect x="45" y="180" width="70" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="80" y="197" text-anchor="middle" font-size="11" fill="#333">work</text>
  <rect x="45" y="210" width="70" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="80" y="227" text-anchor="middle" font-size="11" fill="#333">work</text>
  <!-- Fan-out arrows -->
  <line x1="130" y1="130" x2="230" y2="110" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="130" y1="165" x2="230" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="130" y1="200" x2="230" y2="230" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Workers -->
  <rect x="230" y="80" width="120" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="290" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Worker 1</text>
  <rect x="230" y="145" width="120" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="290" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Worker 2</text>
  <rect x="230" y="210" width="120" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="290" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Worker 3</text>
  <!-- Fan-in arrows -->
  <line x1="350" y1="105" x2="470" y2="155" stroke="#28a745" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="350" y1="170" x2="470" y2="170" stroke="#28a745" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="350" y1="235" x2="470" y2="185" stroke="#28a745" stroke-width="2" marker-end="url(#arrow2)"/>
  <!-- Collector -->
  <rect x="470" y="130" width="140" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="540" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Collector</text>
  <text x="540" y="185" text-anchor="middle" font-size="12" fill="#555">(fan-in)</text>
  <!-- Labels -->
  <text x="170" y="310" text-anchor="middle" font-size="13" fill="#4a90e2" font-weight="bold">Fan-Out</text>
  <text x="420" y="310" text-anchor="middle" font-size="13" fill="#28a745" font-weight="bold">Fan-In</text>
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
</svg>
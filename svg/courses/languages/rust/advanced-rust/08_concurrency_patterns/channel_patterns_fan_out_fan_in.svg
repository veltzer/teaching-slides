<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="702.069" y="40" text-anchor="middle" font-size="35.1324" font-weight="bold" fill="var(--text)">Fan-Out / Fan-In Channel Pattern</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="61.7143" text-anchor="middle" font-size="32.9143" font-weight="bold" fill="var(--text)">Fan-Out / Fan-In Channel Pattern</text>
  <rect x="54.8571" y="164.5714" width="182.8571" height="370.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="146.2857" y="226.2857" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="var(--text)">Work Queue</text>
  <rect x="82.2857" y="246.8571" width="128" height="51.4286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="146.2857" y="281.8286" text-anchor="middle" font-size="20.1143" fill="var(--text)">work</text>
  <rect x="82.2857" y="308.5714" width="128" height="51.4286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="146.2857" y="343.5429" text-anchor="middle" font-size="20.1143" fill="var(--text)">work</text>
  <rect x="82.2857" y="370.2857" width="128" height="51.4286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="146.2857" y="405.2571" text-anchor="middle" font-size="20.1143" fill="var(--text)">work</text>
  <rect x="82.2857" y="432" width="128" height="51.4286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="146.2857" y="466.9714" text-anchor="middle" font-size="20.1143" fill="var(--text)">work</text>
  <line x1="237.7143" y1="267.4286" x2="420.5714" y2="226.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="237.7143" y1="339.4286" x2="420.5714" y2="349.7143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="237.7143" y1="411.4286" x2="420.5714" y2="473.1429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="420.5714" y="164.5714" width="219.4286" height="102.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="530.2857" y="226.2857" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="var(--text)">Worker 1</text>
  <rect x="420.5714" y="298.2857" width="219.4286" height="102.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="530.2857" y="360" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="var(--text)">Worker 2</text>
  <rect x="420.5714" y="432" width="219.4286" height="102.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="530.2857" y="493.7143" text-anchor="middle" font-size="23.7714" font-weight="bold" fill="var(--text)">Worker 3</text>
  <line x1="640" y1="216" x2="859.4286" y2="318.8571" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="349.7143" x2="859.4286" y2="349.7143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="483.4286" x2="859.4286" y2="380.5714" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="859.4286" y="267.4286" width="256" height="164.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="987.4286" y="339.4286" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">Collector</text>
  <text x="987.4286" y="380.5714" text-anchor="middle" font-size="21.9429" fill="var(--text-muted)">(fan-in)</text>
  <text x="310.8571" y="637.7143" text-anchor="middle" font-size="23.7714" fill="var(--primary-accent)" font-weight="bold">Fan-Out</text>
  <text x="768" y="637.7143" text-anchor="middle" font-size="23.7714" fill="var(--ok-accent)" font-weight="bold">Fan-In</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#28a745" />
    </marker>
  </defs>
</svg>
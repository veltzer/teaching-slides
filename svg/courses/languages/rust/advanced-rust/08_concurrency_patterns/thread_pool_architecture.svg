<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="48.40575668977" width="194.5946" height="67.246375257299" rx="6.21358965687" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2973" y="90.434754631379" text-anchor="middle" font-size="15.951320247461" fill="var(--text)" font-family="Arial, sans-serif">Caller 1</text>
  <rect x="40" y="132.463752572989" width="194.5946" height="67.246375257299" rx="6.21358965687" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2973" y="174.492750514598" text-anchor="middle" font-size="15.951320247461" fill="var(--text)" font-family="Arial, sans-serif">Caller 2</text>
  <rect x="40" y="216.521748456207" width="194.5946" height="67.246375257299" rx="6.21358965687" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2973" y="258.550746397816" text-anchor="middle" font-size="15.951320247461" fill="var(--text)" font-family="Arial, sans-serif">Caller N</text>
  <line x1="234.5946" y1="82.028997941609" x2="348.1081" y2="149.275373198908" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="234.5946" y1="166.086993824827" x2="348.1081" y2="166.086993824827" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="234.5946" y1="250.144882461667" x2="348.1081" y2="182.898507204368" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="364.3244" y="65.21737731569" width="291.8919" height="201.739125771897" rx="6.21358965687" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.2703" y="107.246375257299" text-anchor="middle" font-size="20.7367163217" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Task Queue</text>
  <rect x="388.6487" y="124.057995883218" width="243.2432" height="33.623241251839" rx="6.21358965687" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.2703" y="147.594178962402" text-anchor="middle" font-size="15.951320247461" fill="var(--text)" font-family="Arial, sans-serif">Task A</text>
  <rect x="388.6487" y="162.724605351816" width="243.2432" height="33.623241251839" rx="6.21358965687" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.2703" y="186.260895677379" text-anchor="middle" font-size="15.951320247461" fill="var(--text)" font-family="Arial, sans-serif">Task B</text>
  <rect x="388.6487" y="201.391322066793" width="243.2432" height="33.623241251839" rx="6.21358965687" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.2703" y="224.927505145977" text-anchor="middle" font-size="15.951320247461" fill="var(--text)" font-family="Arial, sans-serif">Task C</text>
  <rect x="769.7297" y="40" width="470.2703" height="302.608742281034" rx="6.21358965687" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1004.8648" y="78.666609468598" text-anchor="middle" font-size="20.7367163217" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Worker Threads (fixed pool)</text>
  <line x1="656.2162" y1="115.652131947069" x2="769.7297" y2="115.652131947069" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="656.2162" y1="166.086993824827" x2="769.7297" y2="182.898507204368" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="656.2162" y1="216.521748456207" x2="769.7297" y2="250.144882461667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="802.1622" y="98.840618567529" width="194.5946" height="50.434754631379" rx="6.21358965687" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="899.4594" y="132.463752572989" text-anchor="middle" font-size="15.951320247461" fill="var(--text)" font-family="Arial, sans-serif">Worker 1 (busy)</text>
  <rect x="802.1622" y="162.724605351816" width="194.5946" height="50.434754631379" rx="6.21358965687" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="899.4594" y="196.347846603655" text-anchor="middle" font-size="15.951320247461" fill="var(--text)" font-family="Arial, sans-serif">Worker 2 (busy)</text>
  <rect x="802.1622" y="226.608699382483" width="194.5946" height="50.434754631379" rx="6.21358965687" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="899.4594" y="260.231833387943" text-anchor="middle" font-size="15.951320247461" fill="var(--text)" font-family="Arial, sans-serif">Worker 3 (idle)</text>
  <rect x="802.1622" y="290.492793413149" width="194.5946" height="36.985522478471" rx="6.21358965687" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="899.4594" y="317.391257718966" text-anchor="middle" font-size="15.951320247461" fill="var(--text)" font-family="Arial, sans-serif">Worker 4 (idle)</text>
  <text x="1061.6216" y="140.869509262759" font-size="15.951320247461" fill="var(--text-muted)" font-family="Arial, sans-serif">= num_cpus</text>
  <rect x="40" y="384.637632976265" width="567.5676" height="235.362367023735" rx="6.21358965687" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7837" y="426.666630917874" text-anchor="middle" font-size="20.7367163217" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Benefits</text>
  <text x="64.3243" y="468.695628859483" font-size="15.951320247461" fill="var(--text-muted)" font-family="Arial, sans-serif">- Avoids thread creation overhead</text>
  <text x="64.3243" y="498.956481638311" font-size="15.951320247461" fill="var(--text-muted)" font-family="Arial, sans-serif">- Bounded concurrency (no fork bomb)</text>
  <text x="64.3243" y="529.217441663517" font-size="15.951320247461" fill="var(--text-muted)" font-family="Arial, sans-serif">- Resource reuse (thread stack, TLS)</text>
  <text x="64.3243" y="559.478294442345" font-size="15.951320247461" fill="var(--text-muted)" font-family="Arial, sans-serif">- Backpressure via bounded queue</text>
  <text x="64.3243" y="589.739039974793" font-size="15.951320247461" fill="var(--text-muted)" font-family="Arial, sans-serif">- Graceful shutdown support</text>
  <rect x="672.4324" y="384.637632976265" width="567.5676" height="235.362367023735" rx="6.21358965687" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2162" y="426.666630917874" text-anchor="middle" font-size="20.7367163217" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Rust Implementations</text>
  <text x="696.7567" y="468.695628859483" font-size="15.951320247461" fill="var(--text-muted)" font-family="Arial, sans-serif">rayon::ThreadPool - work-stealing</text>
  <text x="696.7567" y="498.956481638311" font-size="15.951320247461" fill="var(--text-muted)" font-family="Arial, sans-serif">tokio::runtime - async tasks</text>
  <text x="696.7567" y="529.217441663517" font-size="15.951320247461" fill="var(--text-muted)" font-family="Arial, sans-serif">threadpool crate - simple API</text>
  <text x="696.7567" y="559.478294442345" font-size="15.951320247461" fill="var(--text-muted)" font-family="Arial, sans-serif">crossbeam + manual threads</text>
  <text x="696.7567" y="589.739039974793" font-size="15.951320247461" fill="var(--text-muted)" font-family="Arial, sans-serif">std::thread::available_parallelism()</text>
</svg>

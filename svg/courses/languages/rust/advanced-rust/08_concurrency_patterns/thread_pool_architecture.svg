<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="30.8061" font-weight="bold" fill="var(--text)">Thread Pool Architecture</text>
  <rect x="40" y="87.027" width="194.5946" height="62.7027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="137.2973" y="126.2162" text-anchor="middle" font-size="15.403" fill="var(--text)">Caller 1</text>
  <rect x="40" y="165.4054" width="194.5946" height="62.7027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="137.2973" y="204.5946" text-anchor="middle" font-size="15.403" fill="var(--text)">Caller 2</text>
  <rect x="40" y="243.7838" width="194.5946" height="62.7027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="137.2973" y="282.973" text-anchor="middle" font-size="15.403" fill="var(--text)">Caller N</text>
  <line x1="234.5946" y1="118.3784" x2="348.1081" y2="181.0811" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="234.5946" y1="196.7568" x2="348.1081" y2="196.7568" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="234.5946" y1="275.1351" x2="348.1081" y2="212.4324" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="364.3244" y="102.7027" width="291.8919" height="188.1081" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="510.2703" y="141.8919" text-anchor="middle" font-size="20.0239" font-weight="bold" fill="var(--text)">Task Queue</text>
  <rect x="388.6487" y="157.5676" width="243.2432" height="31.3514" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="510.2703" y="179.5135" text-anchor="middle" font-size="15.403" fill="var(--text)">Task A</text>
  <rect x="388.6487" y="193.6216" width="243.2432" height="31.3514" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="510.2703" y="215.5676" text-anchor="middle" font-size="15.403" fill="var(--text)">Task B</text>
  <rect x="388.6487" y="229.6757" width="243.2432" height="31.3514" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="510.2703" y="251.6216" text-anchor="middle" font-size="15.403" fill="var(--text)">Task C</text>
  <rect x="769.7297" y="79.1892" width="470.2703" height="282.1622" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1004.8648" y="115.2432" text-anchor="middle" font-size="20.0239" font-weight="bold" fill="var(--text)">Worker Threads (fixed pool)</text>
  <line x1="656.2162" y1="149.7297" x2="769.7297" y2="149.7297" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="656.2162" y1="196.7568" x2="769.7297" y2="212.4324" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="656.2162" y1="243.7838" x2="769.7297" y2="275.1351" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="802.1622" y="134.0541" width="194.5946" height="47.027" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="899.4594" y="165.4054" text-anchor="middle" font-size="15.403" fill="var(--text)">Worker 1 (busy)</text>
  <rect x="802.1622" y="193.6216" width="194.5946" height="47.027" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="899.4594" y="224.973" text-anchor="middle" font-size="15.403" fill="var(--text)">Worker 2 (busy)</text>
  <rect x="802.1622" y="253.1892" width="194.5946" height="47.027" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="899.4594" y="284.5405" text-anchor="middle" font-size="15.403" fill="var(--text)">Worker 3 (idle)</text>
  <rect x="802.1622" y="312.7568" width="194.5946" height="34.4865" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="899.4594" y="337.8378" text-anchor="middle" font-size="15.403" fill="var(--text)">Worker 4 (idle)</text>
  <text x="1061.6216" y="173.2432" font-size="15.403" fill="var(--text-muted)">= num_cpus</text>
  <rect x="40" y="400.5405" width="567.5676" height="219.4595" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="323.7837" y="439.7297" text-anchor="middle" font-size="20.0239" font-weight="bold" fill="var(--text)">Benefits</text>
  <text x="64.3243" y="478.9189" font-size="15.403" fill="var(--text-muted)">- Avoids thread creation overhead</text>
  <text x="64.3243" y="507.1351" font-size="15.403" fill="var(--text-muted)">- Bounded concurrency (no fork bomb)</text>
  <text x="64.3243" y="535.3514" font-size="15.403" fill="var(--text-muted)">- Resource reuse (thread stack, TLS)</text>
  <text x="64.3243" y="563.5676" font-size="15.403" fill="var(--text-muted)">- Backpressure via bounded queue</text>
  <text x="64.3243" y="591.7837" font-size="15.403" fill="var(--text-muted)">- Graceful shutdown support</text>
  <rect x="672.4324" y="400.5405" width="567.5676" height="219.4595" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="956.2162" y="439.7297" text-anchor="middle" font-size="20.0239" font-weight="bold" fill="var(--text)">Rust Implementations</text>
  <text x="696.7567" y="478.9189" font-size="15.403" fill="var(--text-muted)">rayon::ThreadPool - work-stealing</text>
  <text x="696.7567" y="507.1351" font-size="15.403" fill="var(--text-muted)">tokio::runtime - async tasks</text>
  <text x="696.7567" y="535.3514" font-size="15.403" fill="var(--text-muted)">threadpool crate - simple API</text>
  <text x="696.7567" y="563.5676" font-size="15.403" fill="var(--text-muted)">crossbeam + manual threads</text>
  <text x="696.7567" y="591.7837" font-size="15.403" fill="var(--text-muted)">std::thread::available_parallelism()</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </ns0:defs>
  <ns0:text x="597.3333" y="48" text-anchor="middle" font-size="29.8667" font-weight="bold" fill="#333">Thread Pool Architecture</ns0:text>
  <ns0:rect x="44.8" y="96" width="179.2" height="64" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.24" />
  <ns0:text x="134.4" y="136" text-anchor="middle" font-size="14.9333" fill="#333">Caller 1</ns0:text>
  <ns0:rect x="44.8" y="176" width="179.2" height="64" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.24" />
  <ns0:text x="134.4" y="216" text-anchor="middle" font-size="14.9333" fill="#333">Caller 2</ns0:text>
  <ns0:rect x="44.8" y="256" width="179.2" height="64" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.24" />
  <ns0:text x="134.4" y="296" text-anchor="middle" font-size="14.9333" fill="#333">Caller N</ns0:text>
  <ns0:line x1="224" y1="128" x2="328.5333" y2="192" stroke="#4a90e2" stroke-width="2.24" marker-end="url(#arrow)" />
  <ns0:line x1="224" y1="208" x2="328.5333" y2="208" stroke="#4a90e2" stroke-width="2.24" marker-end="url(#arrow)" />
  <ns0:line x1="224" y1="288" x2="328.5333" y2="224" stroke="#4a90e2" stroke-width="2.24" marker-end="url(#arrow)" />
  <ns0:rect x="343.4667" y="112" width="268.8" height="192" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9867" />
  <ns0:text x="477.8667" y="152" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#333">Task Queue</ns0:text>
  <ns0:rect x="365.8667" y="168" width="224" height="32" rx="4.48" fill="#d4edda" stroke="#28a745" stroke-width="1.4933" />
  <ns0:text x="477.8667" y="190.4" text-anchor="middle" font-size="14.9333" fill="#333">Task A</ns0:text>
  <ns0:rect x="365.8667" y="204.8" width="224" height="32" rx="4.48" fill="#d4edda" stroke="#28a745" stroke-width="1.4933" />
  <ns0:text x="477.8667" y="227.2" text-anchor="middle" font-size="14.9333" fill="#333">Task B</ns0:text>
  <ns0:rect x="365.8667" y="241.6" width="224" height="32" rx="4.48" fill="#d4edda" stroke="#28a745" stroke-width="1.4933" />
  <ns0:text x="477.8667" y="264" text-anchor="middle" font-size="14.9333" fill="#333">Task C</ns0:text>
  <ns0:rect x="716.8" y="88" width="433.0667" height="288" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9867" />
  <ns0:text x="933.3333" y="124.8" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#333">Worker Threads (fixed pool)</ns0:text>
  <ns0:line x1="612.2667" y1="160" x2="716.8" y2="160" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="612.2667" y1="208" x2="716.8" y2="224" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:line x1="612.2667" y1="256" x2="716.8" y2="288" stroke="#4a90e2" stroke-width="2.9867" marker-end="url(#arrow)" />
  <ns0:rect x="746.6667" y="144" width="179.2" height="48" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.24" />
  <ns0:text x="836.2666" y="176" text-anchor="middle" font-size="14.9333" fill="#333">Worker 1 (busy)</ns0:text>
  <ns0:rect x="746.6667" y="204.8" width="179.2" height="48" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.24" />
  <ns0:text x="836.2666" y="236.8" text-anchor="middle" font-size="14.9333" fill="#333">Worker 2 (busy)</ns0:text>
  <ns0:rect x="746.6667" y="265.6" width="179.2" height="48" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.24" />
  <ns0:text x="836.2666" y="297.6" text-anchor="middle" font-size="14.9333" fill="#333">Worker 3 (idle)</ns0:text>
  <ns0:rect x="746.6667" y="326.4" width="179.2" height="35.2" rx="7.4667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.24" />
  <ns0:text x="836.2666" y="352" text-anchor="middle" font-size="14.9333" fill="#333">Worker 4 (idle)</ns0:text>
  <ns0:text x="985.6" y="184" font-size="14.9333" fill="#555">= num_cpus</ns0:text>
  <ns0:rect x="44.8" y="416" width="522.6667" height="224" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.9867" />
  <ns0:text x="306.1333" y="456" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#333">Benefits</ns0:text>
  <ns0:text x="67.2" y="496" font-size="14.9333" fill="#555">- Avoids thread creation overhead</ns0:text>
  <ns0:text x="67.2" y="524.8" font-size="14.9333" fill="#555">- Bounded concurrency (no fork bomb)</ns0:text>
  <ns0:text x="67.2" y="553.6" font-size="14.9333" fill="#555">- Resource reuse (thread stack, TLS)</ns0:text>
  <ns0:text x="67.2" y="582.4" font-size="14.9333" fill="#555">- Backpressure via bounded queue</ns0:text>
  <ns0:text x="67.2" y="611.1999" font-size="14.9333" fill="#555">- Graceful shutdown support</ns0:text>
  <ns0:rect x="627.2" y="416" width="522.6667" height="224" rx="7.4667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9867" />
  <ns0:text x="888.5333" y="456" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="#333">Rust Implementations</ns0:text>
  <ns0:text x="649.6" y="496" font-size="14.9333" fill="#555">rayon::ThreadPool - work-stealing</ns0:text>
  <ns0:text x="649.6" y="524.8" font-size="14.9333" fill="#555">tokio::runtime - async tasks</ns0:text>
  <ns0:text x="649.6" y="553.6" font-size="14.9333" fill="#555">threadpool crate - simple API</ns0:text>
  <ns0:text x="649.6" y="582.4" font-size="14.9333" fill="#555">crossbeam + manual threads</ns0:text>
  <ns0:text x="649.6" y="611.1999" font-size="14.9333" fill="#555">std::thread::available_parallelism()</ns0:text>
</ns0:svg>
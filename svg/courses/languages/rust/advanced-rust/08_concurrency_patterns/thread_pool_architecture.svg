  <ns0:text x="836.2666" y="176" text-anchor="middle" font-size="14.9333" fill="#333">Worker 1 (busy)</ns0:text>
  <ns0:rect x="746.6667" y="204.8" width="179.2" height="48" rx="7.4667" fill="#d4edda" stroke="#28a745" stroke-width="2.24" />

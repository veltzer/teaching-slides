<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="597.3333" y="48" text-anchor="middle" font-size="29.8667" font-weight="bold" fill="var(--text)">Thread Pool Architecture</text>
  <rect x="44.8" y="96" width="179.2" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="134.4" y="136" text-anchor="middle" font-size="14.9333" fill="var(--text)">Caller 1</text>
  <rect x="44.8" y="176" width="179.2" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="134.4" y="216" text-anchor="middle" font-size="14.9333" fill="var(--text)">Caller 2</text>
  <rect x="44.8" y="256" width="179.2" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="134.4" y="296" text-anchor="middle" font-size="14.9333" fill="var(--text)">Caller N</text>
  <line x1="224" y1="128" x2="328.5333" y2="192" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="224" y1="208" x2="328.5333" y2="208" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="224" y1="288" x2="328.5333" y2="224" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="343.4667" y="112" width="268.8" height="192" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="477.8667" y="152" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="var(--text)">Task Queue</text>
  <rect x="365.8667" y="168" width="224" height="32" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="477.8667" y="190.4" text-anchor="middle" font-size="14.9333" fill="var(--text)">Task A</text>
  <rect x="365.8667" y="204.8" width="224" height="32" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="477.8667" y="227.2" text-anchor="middle" font-size="14.9333" fill="var(--text)">Task B</text>
  <rect x="365.8667" y="241.6" width="224" height="32" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="477.8667" y="264" text-anchor="middle" font-size="14.9333" fill="var(--text)">Task C</text>
  <rect x="716.8" y="88" width="433.0667" height="288" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="933.3333" y="124.8" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="var(--text)">Worker Threads (fixed pool)</text>
  <line x1="612.2667" y1="160" x2="716.8" y2="160" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="612.2667" y1="208" x2="716.8" y2="224" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="612.2667" y1="256" x2="716.8" y2="288" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="746.6667" y="144" width="179.2" height="48" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="836.2666" y="176" text-anchor="middle" font-size="14.9333" fill="var(--text)">Worker 1 (busy)</text>
  <rect x="746.6667" y="204.8" width="179.2" height="48" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="836.2666" y="236.8" text-anchor="middle" font-size="14.9333" fill="var(--text)">Worker 2 (busy)</text>
  <rect x="746.6667" y="265.6" width="179.2" height="48" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="836.2666" y="297.6" text-anchor="middle" font-size="14.9333" fill="var(--text)">Worker 3 (idle)</text>
  <rect x="746.6667" y="326.4" width="179.2" height="35.2" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="836.2666" y="352" text-anchor="middle" font-size="14.9333" fill="var(--text)">Worker 4 (idle)</text>
  <text x="985.6" y="184" font-size="14.9333" fill="var(--text-muted)">= num_cpus</text>
  <rect x="44.8" y="416" width="522.6667" height="224" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="306.1333" y="456" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="var(--text)">Benefits</text>
  <text x="67.2" y="496" font-size="14.9333" fill="var(--text-muted)">- Avoids thread creation overhead</text>
  <text x="67.2" y="524.8" font-size="14.9333" fill="var(--text-muted)">- Bounded concurrency (no fork bomb)</text>
  <text x="67.2" y="553.6" font-size="14.9333" fill="var(--text-muted)">- Resource reuse (thread stack, TLS)</text>
  <text x="67.2" y="582.4" font-size="14.9333" fill="var(--text-muted)">- Backpressure via bounded queue</text>
  <text x="67.2" y="611.1999" font-size="14.9333" fill="var(--text-muted)">- Graceful shutdown support</text>
  <rect x="627.2" y="416" width="522.6667" height="224" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="888.5333" y="456" text-anchor="middle" font-size="19.4133" font-weight="bold" fill="var(--text)">Rust Implementations</text>
  <text x="649.6" y="496" font-size="14.9333" fill="var(--text-muted)">rayon::ThreadPool - work-stealing</text>
  <text x="649.6" y="524.8" font-size="14.9333" fill="var(--text-muted)">tokio::runtime - async tasks</text>
  <text x="649.6" y="553.6" font-size="14.9333" fill="var(--text-muted)">threadpool crate - simple API</text>
  <text x="649.6" y="582.4" font-size="14.9333" fill="var(--text-muted)">crossbeam + manual threads</text>
  <text x="649.6" y="611.1999" font-size="14.9333" fill="var(--text-muted)">std::thread::available_parallelism()</text>
</svg>
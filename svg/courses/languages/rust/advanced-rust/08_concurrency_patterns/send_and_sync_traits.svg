<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="11.2" refX="16" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Send and Sync Traits</text>
  <rect x="48" y="88" width="560" height="256" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="328" y="128" text-anchor="middle" font-size="24" font-weight="bold" fill="#28a745">Send</text>
  <text x="328" y="160" text-anchor="middle" font-size="19.2" fill="#555">"Ownership can transfer between threads"</text>
  <text x="72" y="200" font-size="17.6" fill="#555">T: Send means T can be moved to</text>
  <text x="72" y="232" font-size="17.6" fill="#555">another thread safely.</text>
  <rect x="80" y="256" width="208" height="35.2" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="184" y="281.6" text-anchor="middle" font-size="16" fill="#333">String: Send</text>
  <rect x="304" y="256" width="208" height="35.2" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="408" y="281.6" text-anchor="middle" font-size="16" fill="#333">Vec&lt;T&gt;: Send</text>
  <rect x="80" y="299.2" width="432" height="35.2" rx="4.8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6" />
  <text x="296" y="324.8" text-anchor="middle" font-size="16" fill="#dc3545">Rc&lt;T&gt;: NOT Send (non-atomic refcount)</text>
  <rect x="672" y="88" width="560" height="256" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="952" y="128" text-anchor="middle" font-size="24" font-weight="bold" fill="#4a90e2">Sync</text>
  <text x="952" y="160" text-anchor="middle" font-size="19.2" fill="#555">"References can be shared between threads"</text>
  <text x="696" y="200" font-size="17.6" fill="#555">T: Sync means &amp;T can be sent to</text>
  <text x="696" y="232" font-size="17.6" fill="#555">another thread (T: Sync iff &amp;T: Send)</text>
  <rect x="704" y="256" width="224" height="35.2" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="816" y="281.6" text-anchor="middle" font-size="16" fill="#333">Mutex&lt;T&gt;: Sync</text>
  <rect x="944" y="256" width="224" height="35.2" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="1056" y="281.6" text-anchor="middle" font-size="16" fill="#333">Arc&lt;T&gt;: Sync</text>
  <rect x="704" y="299.2" width="464" height="35.2" rx="4.8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6" />
  <text x="936" y="324.8" text-anchor="middle" font-size="16" fill="#dc3545">Cell&lt;T&gt;: NOT Sync (interior mutability)</text>
  <rect x="48" y="384" width="1184" height="128" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="640" y="424" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">The Relationship</text>
  <text x="72" y="464" font-size="17.6" fill="#555">T: Sync  is equivalent to  &amp;T: Send</text>
  <text x="72" y="496" font-size="17.6" fill="#555">Most types are both Send + Sync. The compiler auto-derives these for you.</text>
  <rect x="48" y="544" width="1184" height="160" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="579.2" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Common Types</text>
  <text x="240" y="616" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Type</text>
  <text x="560" y="616" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Send</text>
  <text x="800" y="616" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Sync</text>
  <text x="1056" y="616" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Thread-safe?</text>
  <line x1="80" y1="627.2" x2="1200" y2="627.2" stroke="#4a90e2" stroke-width="1.6" />
  <text x="240" y="656" text-anchor="middle" font-size="16" fill="#555">Arc&lt;Mutex&lt;T&gt;&gt;</text>
  <text x="560" y="656" text-anchor="middle" font-size="16" fill="#28a745">Yes</text>
  <text x="800" y="656" text-anchor="middle" font-size="16" fill="#28a745">Yes</text>
  <text x="1056" y="656" text-anchor="middle" font-size="16" fill="#28a745">Fully safe</text>
  <text x="240" y="688" text-anchor="middle" font-size="16" fill="#555">Rc&lt;RefCell&lt;T&gt;&gt;</text>
  <text x="560" y="688" text-anchor="middle" font-size="16" fill="#dc3545">No</text>
  <text x="800" y="688" text-anchor="middle" font-size="16" fill="#dc3545">No</text>
  <text x="1056" y="688" text-anchor="middle" font-size="16" fill="#dc3545">Single-thread only</text>
</svg>
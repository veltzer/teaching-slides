<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Send and Sync Traits</text>
  <!-- Send -->
  <rect x="30" y="55" width="350" height="160" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="205" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#28a745">Send</text>
  <text x="205" y="100" text-anchor="middle" font-size="12" fill="#555">"Ownership can transfer between threads"</text>
  <text x="45" y="125" font-size="11" fill="#555">T: Send means T can be moved to</text>
  <text x="45" y="145" font-size="11" fill="#555">another thread safely.</text>
  <rect x="50" y="160" width="130" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="115" y="176" text-anchor="middle" font-size="10" fill="#333">String: Send</text>
  <rect x="190" y="160" width="130" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="255" y="176" text-anchor="middle" font-size="10" fill="#333">Vec&lt;T&gt;: Send</text>
  <rect x="50" y="187" width="270" height="22" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="185" y="203" text-anchor="middle" font-size="10" fill="#dc3545">Rc&lt;T&gt;: NOT Send (non-atomic refcount)</text>
  <!-- Sync -->
  <rect x="420" y="55" width="350" height="160" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="595" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a90e2">Sync</text>
  <text x="595" y="100" text-anchor="middle" font-size="12" fill="#555">"References can be shared between threads"</text>
  <text x="435" y="125" font-size="11" fill="#555">T: Sync means &amp;T can be sent to</text>
  <text x="435" y="145" font-size="11" fill="#555">another thread (T: Sync iff &amp;T: Send)</text>
  <rect x="440" y="160" width="140" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="510" y="176" text-anchor="middle" font-size="10" fill="#333">Mutex&lt;T&gt;: Sync</text>
  <rect x="590" y="160" width="140" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="660" y="176" text-anchor="middle" font-size="10" fill="#333">Arc&lt;T&gt;: Sync</text>
  <rect x="440" y="187" width="290" height="22" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="585" y="203" text-anchor="middle" font-size="10" fill="#dc3545">Cell&lt;T&gt;: NOT Sync (interior mutability)</text>
  <!-- Relationship -->
  <rect x="30" y="240" width="740" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">The Relationship</text>
  <text x="45" y="290" font-size="11" fill="#555">T: Sync  is equivalent to  &amp;T: Send</text>
  <text x="45" y="310" font-size="11" fill="#555">Most types are both Send + Sync. The compiler auto-derives these for you.</text>
  <!-- Table -->
  <rect x="30" y="340" width="740" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Common Types</text>
  <text x="150" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Type</text>
  <text x="350" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Send</text>
  <text x="500" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Sync</text>
  <text x="660" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Thread-safe?</text>
  <line x1="50" y1="392" x2="750" y2="392" stroke="#4a90e2" stroke-width="1"/>
  <text x="150" y="410" text-anchor="middle" font-size="10" fill="#555">Arc&lt;Mutex&lt;T&gt;&gt;</text>
  <text x="350" y="410" text-anchor="middle" font-size="10" fill="#28a745">Yes</text>
  <text x="500" y="410" text-anchor="middle" font-size="10" fill="#28a745">Yes</text>
  <text x="660" y="410" text-anchor="middle" font-size="10" fill="#28a745">Fully safe</text>
  <text x="150" y="430" text-anchor="middle" font-size="10" fill="#555">Rc&lt;RefCell&lt;T&gt;&gt;</text>
  <text x="350" y="430" text-anchor="middle" font-size="10" fill="#dc3545">No</text>
  <text x="500" y="430" text-anchor="middle" font-size="10" fill="#dc3545">No</text>
  <text x="660" y="430" text-anchor="middle" font-size="10" fill="#dc3545">Single-thread only</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.6596" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Why Use the Actor Pattern?</text>
  <rect x="40" y="62.3076" width="1200" height="557.6924" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="80.6779" y="84.6153" width="81.3559" height="59.4871" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.356" y="123.282" text-anchor="middle" font-size="25.6596" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1</text>
  <text x="202.7119" y="109.8973" font-size="20.8484" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">No shared mutable state</text>
  <text x="202.7119" y="136.6666" font-size="17.641" fill="var(--text-muted)" font-family="Arial, sans-serif">Each actor owns its data exclusively.</text>
  <rect x="80.6779" y="166.4101" width="81.3559" height="59.4871" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.356" y="205.0768" text-anchor="middle" font-size="25.6596" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2</text>
  <text x="202.7119" y="191.6923" font-size="20.8484" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">No locks, no deadlocks</text>
  <text x="202.7119" y="218.4615" font-size="17.641" fill="var(--text-muted)" font-family="Arial, sans-serif">Communication via messages only.</text>
  <rect x="80.6779" y="248.2051" width="81.3559" height="59.4871" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.356" y="286.8718" text-anchor="middle" font-size="25.6596" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3</text>
  <text x="202.7119" y="273.4871" font-size="20.8484" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Sequential message processing</text>
  <text x="202.7119" y="300.2563" font-size="17.641" fill="var(--text-muted)" font-family="Arial, sans-serif">Each actor processes one message at a time. No data races within an actor.</text>
  <rect x="80.6779" y="330" width="81.3559" height="59.4871" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.356" y="368.6666" text-anchor="middle" font-size="25.6596" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">4</text>
  <text x="202.7119" y="355.282" font-size="20.8484" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Natural isolation</text>
  <text x="202.7119" y="382.0512" font-size="17.641" fill="var(--text-muted)" font-family="Arial, sans-serif">Actors can crash independently. Supervision strategies for fault tolerance.</text>
  <rect x="80.6779" y="411.7949" width="81.3559" height="59.4871" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.356" y="450.4615" text-anchor="middle" font-size="25.6596" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">5</text>
  <text x="202.7119" y="437.0768" font-size="20.8484" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Scalable</text>
  <text x="202.7119" y="463.8461" font-size="17.641" fill="var(--text-muted)" font-family="Arial, sans-serif">Actors can be distributed across threads or even machines.</text>
  <rect x="141.6949" y="508.4615" width="996.6102" height="74.359" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="541.1794" text-anchor="middle" font-size="19.2447" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Rust Actor Libraries</text>
  <text x="640" y="567.9487" text-anchor="middle" font-size="19.2447" fill="var(--text)" font-family="Courier New, monospace">actix    xactor    stakker</text>
</svg>

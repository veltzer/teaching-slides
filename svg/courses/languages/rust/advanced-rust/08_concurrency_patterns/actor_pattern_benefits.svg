<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="589.4512" y="38.5543" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--text)">Why Use the Actor Pattern?</text>
  <rect x="54.4109" y="61.6867" width="1070.0806" height="578.3133" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="90.6848" y="84.8193" width="72.5478" height="61.6867" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="126.9588" y="124.9157" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--primary-accent)">1</text>
  <text x="199.5066" y="111.0361" font-size="20.0482" font-weight="bold" fill="var(--text)">No shared mutable state</text>
  <text x="199.5066" y="138.7952" font-size="16.9639" fill="var(--text-muted)">Each actor owns its data exclusively.</text>
  <rect x="90.6848" y="169.6385" width="72.5478" height="61.6867" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="126.9588" y="209.7349" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--ok-accent)">2</text>
  <text x="199.5066" y="195.8555" font-size="20.0482" font-weight="bold" fill="var(--text)">No locks, no deadlocks</text>
  <text x="199.5066" y="223.6145" font-size="16.9639" fill="var(--text-muted)">Communication via messages only.</text>
  <rect x="90.6848" y="254.4579" width="72.5478" height="61.6867" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="126.9588" y="294.5543" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--danger-accent)">3</text>
  <text x="199.5066" y="280.6747" font-size="20.0482" font-weight="bold" fill="var(--text)">Sequential message processing</text>
  <text x="199.5066" y="308.4337" font-size="16.9639" fill="var(--text-muted)">Each actor processes one message at a time. No data races within an actor.</text>
  <rect x="90.6848" y="339.2771" width="72.5478" height="61.6867" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="126.9588" y="379.3735" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--primary-accent)">4</text>
  <text x="199.5066" y="365.494" font-size="20.0482" font-weight="bold" fill="var(--text)">Natural isolation</text>
  <text x="199.5066" y="393.253" font-size="16.9639" fill="var(--text-muted)">Actors can crash independently. Supervision strategies for fault tolerance.</text>
  <rect x="90.6848" y="424.0964" width="72.5478" height="61.6867" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="126.9588" y="464.1928" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--ok-accent)">5</text>
  <text x="199.5066" y="450.3132" font-size="20.0482" font-weight="bold" fill="var(--text)">Scalable</text>
  <text x="199.5066" y="478.0723" font-size="16.9639" fill="var(--text-muted)">Actors can be distributed across threads or even machines.</text>
  <rect x="145.0957" y="524.3373" width="888.711" height="77.1084" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="589.4512" y="558.265" text-anchor="middle" font-size="18.506" font-weight="bold" fill="var(--primary-accent)">Rust Actor Libraries</text>
  <text x="589.4512" y="586.0241" text-anchor="middle" font-size="18.506" fill="var(--text)" font-family="monospace">actix    xactor    stakker</text>
</svg>
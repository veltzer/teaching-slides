<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="589.4512" y="38.5543" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--text-dark)">Why Use the Actor Pattern?</text>
  <rect x="54.4109" y="61.6867" width="1070.0806" height="578.3133" rx="7.7109" fill="var(--surface-light)" stroke="var(--border)" stroke-width="1.5422" />
  <rect x="90.6848" y="84.8193" width="72.5478" height="61.6867" rx="30.8434" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.0843" />
  <text x="126.9588" y="124.9157" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--primary-bright)">1</text>
  <text x="199.5066" y="111.0361" font-size="20.0482" font-weight="bold" fill="var(--text-dark)">No shared mutable state</text>
  <text x="199.5066" y="138.7952" font-size="16.9639" fill="var(--text-mid)">Each actor owns its data exclusively.</text>
  <rect x="90.6848" y="169.6385" width="72.5478" height="61.6867" rx="30.8434" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.0843" />
  <text x="126.9588" y="209.7349" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--ok-bright)">2</text>
  <text x="199.5066" y="195.8555" font-size="20.0482" font-weight="bold" fill="var(--text-dark)">No locks, no deadlocks</text>
  <text x="199.5066" y="223.6145" font-size="16.9639" fill="var(--text-mid)">Communication via messages only.</text>
  <rect x="90.6848" y="254.4579" width="72.5478" height="61.6867" rx="30.8434" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.0843" />
  <text x="126.9588" y="294.5543" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--danger-deeper)">3</text>
  <text x="199.5066" y="280.6747" font-size="20.0482" font-weight="bold" fill="var(--text-dark)">Sequential message processing</text>
  <text x="199.5066" y="308.4337" font-size="16.9639" fill="var(--text-mid)">Each actor processes one message at a time. No data races within an actor.</text>
  <rect x="90.6848" y="339.2771" width="72.5478" height="61.6867" rx="30.8434" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.0843" />
  <text x="126.9588" y="379.3735" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--primary-bright)">4</text>
  <text x="199.5066" y="365.494" font-size="20.0482" font-weight="bold" fill="var(--text-dark)">Natural isolation</text>
  <text x="199.5066" y="393.253" font-size="16.9639" fill="var(--text-mid)">Actors can crash independently. Supervision strategies for fault tolerance.</text>
  <rect x="90.6848" y="424.0964" width="72.5478" height="61.6867" rx="30.8434" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.0843" />
  <text x="126.9588" y="464.1928" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--ok-bright)">5</text>
  <text x="199.5066" y="450.3132" font-size="20.0482" font-weight="bold" fill="var(--text-dark)">Scalable</text>
  <text x="199.5066" y="478.0723" font-size="16.9639" fill="var(--text-mid)">Actors can be distributed across threads or even machines.</text>
  <rect x="145.0957" y="524.3373" width="888.711" height="77.1084" rx="7.7109" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.3132" />
  <text x="589.4512" y="558.265" text-anchor="middle" font-size="18.506" font-weight="bold" fill="var(--primary-bright)">Rust Actor Libraries</text>
  <text x="589.4512" y="586.0241" text-anchor="middle" font-size="18.506" fill="var(--text-dark)" font-family="monospace">actix    xactor    stakker</text>
</svg>
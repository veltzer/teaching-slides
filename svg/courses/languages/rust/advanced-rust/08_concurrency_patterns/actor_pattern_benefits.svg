<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="589.4512" y="38.5543" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="#333">Why Use the Actor Pattern?</ns0:text>
  <ns0:rect x="54.4109" y="61.6867" width="1070.0806" height="578.3133" rx="7.7109" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5422" />
  <ns0:rect x="90.6848" y="84.8193" width="72.5478" height="61.6867" rx="30.8434" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.0843" />
  <ns0:text x="126.9588" y="124.9157" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="#4a90e2">1</ns0:text>
  <ns0:text x="199.5066" y="111.0361" font-size="20.0482" font-weight="bold" fill="#333">No shared mutable state</ns0:text>
  <ns0:text x="199.5066" y="138.7952" font-size="16.9639" fill="#666">Each actor owns its data exclusively.</ns0:text>
  <ns0:rect x="90.6848" y="169.6385" width="72.5478" height="61.6867" rx="30.8434" fill="#d4edda" stroke="#28a745" stroke-width="3.0843" />
  <ns0:text x="126.9588" y="209.7349" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="#28a745">2</ns0:text>
  <ns0:text x="199.5066" y="195.8555" font-size="20.0482" font-weight="bold" fill="#333">No locks, no deadlocks</ns0:text>
  <ns0:text x="199.5066" y="223.6145" font-size="16.9639" fill="#666">Communication via messages only.</ns0:text>
  <ns0:rect x="90.6848" y="254.4579" width="72.5478" height="61.6867" rx="30.8434" fill="#fff3cd" stroke="#ffc107" stroke-width="3.0843" />
  <ns0:text x="126.9588" y="294.5543" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="#856404">3</ns0:text>
  <ns0:text x="199.5066" y="280.6747" font-size="20.0482" font-weight="bold" fill="#333">Sequential message processing</ns0:text>
  <ns0:text x="199.5066" y="308.4337" font-size="16.9639" fill="#666">Each actor processes one message at a time. No data races within an actor.</ns0:text>
  <ns0:rect x="90.6848" y="339.2771" width="72.5478" height="61.6867" rx="30.8434" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.0843" />
  <ns0:text x="126.9588" y="379.3735" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="#4a90e2">4</ns0:text>
  <ns0:text x="199.5066" y="365.494" font-size="20.0482" font-weight="bold" fill="#333">Natural isolation</ns0:text>
  <ns0:text x="199.5066" y="393.253" font-size="16.9639" fill="#666">Actors can crash independently. Supervision strategies for fault tolerance.</ns0:text>
  <ns0:rect x="90.6848" y="424.0964" width="72.5478" height="61.6867" rx="30.8434" fill="#d4edda" stroke="#28a745" stroke-width="3.0843" />
  <ns0:text x="126.9588" y="464.1928" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="#28a745">5</ns0:text>
  <ns0:text x="199.5066" y="450.3132" font-size="20.0482" font-weight="bold" fill="#333">Scalable</ns0:text>
  <ns0:text x="199.5066" y="478.0723" font-size="16.9639" fill="#666">Actors can be distributed across threads or even machines.</ns0:text>
  <ns0:rect x="145.0957" y="524.3373" width="888.711" height="77.1084" rx="7.7109" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.3132" />
  <ns0:text x="589.4512" y="558.265" text-anchor="middle" font-size="18.506" font-weight="bold" fill="#4a90e2">Rust Actor Libraries</ns0:text>
  <ns0:text x="589.4512" y="586.0241" text-anchor="middle" font-size="18.506" fill="#333" font-family="monospace">actix    xactor    stakker</ns0:text>
</ns0:svg>
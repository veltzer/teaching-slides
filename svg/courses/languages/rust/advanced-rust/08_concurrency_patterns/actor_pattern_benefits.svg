<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="92.307648668642" height="69.253628826033" rx="6.895812373861" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153994526616" y="85.014957692132" text-anchor="middle" font-size="29.490631198054" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1</text>
  <text x="178.461643195258" y="69.432771877933" font-size="23.961109115868" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">No shared mutable state</text>
  <text x="178.461643195258" y="100.597027088437" font-size="20.274837681214" fill="var(--text-muted)" font-family="Arial, sans-serif">Each actor owns its data exclusively.</text>
  <rect x="40" y="135.223783292507" width="92.307648668642" height="69.253628826033" rx="6.895812373861" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153994526616" y="180.238740984638" text-anchor="middle" font-size="29.490631198054" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2</text>
  <text x="178.461643195258" y="164.656788006227" font-size="23.961109115868" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">No locks, no deadlocks</text>
  <text x="178.461643195258" y="195.820926798837" font-size="20.274837681214" fill="var(--text-muted)" font-family="Arial, sans-serif">Communication via messages only.</text>
  <rect x="40" y="230.447799420801" width="92.307648668642" height="69.253628826033" rx="6.895812373861" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153994526616" y="275.462757112933" text-anchor="middle" font-size="29.490631198054" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3</text>
  <text x="178.461643195258" y="259.880571298734" font-size="23.961109115868" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Sequential message processing</text>
  <text x="178.461643195258" y="291.044710091344" font-size="20.274837681214" fill="var(--text-muted)" font-family="Arial, sans-serif">Each actor processes one message at a time. No data races within an actor.</text>
  <rect x="40" y="325.671699131201" width="92.307648668642" height="69.253628826033" rx="6.895812373861" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153994526616" y="370.686540405439" text-anchor="middle" font-size="29.490631198054" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">4</text>
  <text x="178.461643195258" y="355.104471009134" font-size="23.961109115868" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Natural isolation</text>
  <text x="178.461643195258" y="386.268609801743" font-size="20.274837681214" fill="var(--text-muted)" font-family="Arial, sans-serif">Actors can crash independently. Supervision strategies for fault tolerance.</text>
  <rect x="40" y="420.895598841601" width="92.307648668642" height="69.253628826033" rx="6.895812373861" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153994526616" y="465.910440115839" text-anchor="middle" font-size="29.490631198054" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">5</text>
  <text x="178.461643195258" y="450.328254301641" font-size="23.961109115868" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Scalable</text>
  <text x="178.461643195258" y="481.492509512144" font-size="20.274837681214" fill="var(--text-muted)" font-family="Arial, sans-serif">Actors can be distributed across threads or even machines.</text>
  <rect x="109.230821597629" y="533.43281844509" width="1130.769178402371" height="86.56718155491" rx="6.895812373861" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.615410798815" y="571.522308478514" text-anchor="middle" font-size="22.11797339854" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Rust Actor Libraries</text>
  <text x="674.615410798815" y="602.686563689018" text-anchor="middle" font-size="22.11797339854" fill="var(--text)" font-family="Courier New, monospace">actix    xactor    stakker</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 430" font-family="Arial, sans-serif">
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Why Use the Actor Pattern?</text>
  <rect x="30" y="40" width="590" height="375" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <!-- 1 -->
  <rect x="50" y="55" width="40" height="40" rx="20" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="70" y="81" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a90e2">1</text>
  <text x="110" y="72" font-size="13" font-weight="bold" fill="#333">No shared mutable state</text>
  <text x="110" y="90" font-size="11" fill="#666">Each actor owns its data exclusively.</text>
  <!-- 2 -->
  <rect x="50" y="110" width="40" height="40" rx="20" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="70" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#28a745">2</text>
  <text x="110" y="127" font-size="13" font-weight="bold" fill="#333">No locks, no deadlocks</text>
  <text x="110" y="145" font-size="11" fill="#666">Communication via messages only.</text>
  <!-- 3 -->
  <rect x="50" y="165" width="40" height="40" rx="20" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="70" y="191" text-anchor="middle" font-size="16" font-weight="bold" fill="#856404">3</text>
  <text x="110" y="182" font-size="13" font-weight="bold" fill="#333">Sequential message processing</text>
  <text x="110" y="200" font-size="11" fill="#666">Each actor processes one message at a time. No data races within an actor.</text>
  <!-- 4 -->
  <rect x="50" y="220" width="40" height="40" rx="20" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="70" y="246" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a90e2">4</text>
  <text x="110" y="237" font-size="13" font-weight="bold" fill="#333">Natural isolation</text>
  <text x="110" y="255" font-size="11" fill="#666">Actors can crash independently. Supervision strategies for fault tolerance.</text>
  <!-- 5 -->
  <rect x="50" y="275" width="40" height="40" rx="20" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="70" y="301" text-anchor="middle" font-size="16" font-weight="bold" fill="#28a745">5</text>
  <text x="110" y="292" font-size="13" font-weight="bold" fill="#333">Scalable</text>
  <text x="110" y="310" font-size="11" fill="#666">Actors can be distributed across threads or even machines.</text>
  <!-- Libraries -->
  <rect x="80" y="340" width="490" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="325" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Rust Actor Libraries</text>
  <text x="325" y="380" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">actix    xactor    stakker</text>
</svg>
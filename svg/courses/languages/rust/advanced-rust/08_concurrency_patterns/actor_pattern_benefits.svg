<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="25.6596" font-weight="bold" fill="var(--text)">Why Use the Actor Pattern?</text>
  <rect x="40" y="62.3076" width="1200" height="557.6924" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="80.6779" y="84.6153" width="81.3559" height="59.4871" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="121.356" y="123.282" text-anchor="middle" font-size="25.6596" font-weight="bold" fill="var(--primary-accent)">1</text>
  <text x="202.7119" y="109.8973" font-size="20.8484" font-weight="bold" fill="var(--text)">No shared mutable state</text>
  <text x="202.7119" y="136.6666" font-size="17.641" fill="var(--text-muted)">Each actor owns its data exclusively.</text>
  <rect x="80.6779" y="166.4101" width="81.3559" height="59.4871" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="121.356" y="205.0768" text-anchor="middle" font-size="25.6596" font-weight="bold" fill="var(--ok-accent)">2</text>
  <text x="202.7119" y="191.6923" font-size="20.8484" font-weight="bold" fill="var(--text)">No locks, no deadlocks</text>
  <text x="202.7119" y="218.4615" font-size="17.641" fill="var(--text-muted)">Communication via messages only.</text>
  <rect x="80.6779" y="248.2051" width="81.3559" height="59.4871" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="121.356" y="286.8718" text-anchor="middle" font-size="25.6596" font-weight="bold" fill="var(--danger-accent)">3</text>
  <text x="202.7119" y="273.4871" font-size="20.8484" font-weight="bold" fill="var(--text)">Sequential message processing</text>
  <text x="202.7119" y="300.2563" font-size="17.641" fill="var(--text-muted)">Each actor processes one message at a time. No data races within an actor.</text>
  <rect x="80.6779" y="330" width="81.3559" height="59.4871" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="121.356" y="368.6666" text-anchor="middle" font-size="25.6596" font-weight="bold" fill="var(--primary-accent)">4</text>
  <text x="202.7119" y="355.282" font-size="20.8484" font-weight="bold" fill="var(--text)">Natural isolation</text>
  <text x="202.7119" y="382.0512" font-size="17.641" fill="var(--text-muted)">Actors can crash independently. Supervision strategies for fault tolerance.</text>
  <rect x="80.6779" y="411.7949" width="81.3559" height="59.4871" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="121.356" y="450.4615" text-anchor="middle" font-size="25.6596" font-weight="bold" fill="var(--ok-accent)">5</text>
  <text x="202.7119" y="437.0768" font-size="20.8484" font-weight="bold" fill="var(--text)">Scalable</text>
  <text x="202.7119" y="463.8461" font-size="17.641" fill="var(--text-muted)">Actors can be distributed across threads or even machines.</text>
  <rect x="141.6949" y="508.4615" width="996.6102" height="74.359" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="541.1794" text-anchor="middle" font-size="19.2447" font-weight="bold" fill="var(--primary-accent)">Rust Actor Libraries</text>
  <text x="640" y="567.9487" text-anchor="middle" font-size="19.2447" fill="var(--text)" font-family="monospace">actix    xactor    stakker</text>
</svg>
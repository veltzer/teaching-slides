<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="41.8605" text-anchor="middle" font-size="26.7907" font-weight="bold" fill="#333">Why Use the Actor Pattern?</text>
  <rect x="59.0769" y="66.9767" width="1161.8462" height="627.907" rx="8.3721" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.6744" />
  <rect x="98.4615" y="92.093" width="78.7692" height="66.9767" rx="33.4884" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3488" />
  <text x="137.8462" y="135.6279" text-anchor="middle" font-size="26.7907" font-weight="bold" fill="#4a90e2">1</text>
  <text x="216.6154" y="120.5581" font-size="21.7674" font-weight="bold" fill="#333">No shared mutable state</text>
  <text x="216.6154" y="150.6977" font-size="18.4186" fill="#666">Each actor owns its data exclusively.</text>
  <rect x="98.4615" y="184.186" width="78.7692" height="66.9767" rx="33.4884" fill="#d4edda" stroke="#28a745" stroke-width="3.3488" />
  <text x="137.8462" y="227.7209" text-anchor="middle" font-size="26.7907" font-weight="bold" fill="#28a745">2</text>
  <text x="216.6154" y="212.6512" font-size="21.7674" font-weight="bold" fill="#333">No locks, no deadlocks</text>
  <text x="216.6154" y="242.7907" font-size="18.4186" fill="#666">Communication via messages only.</text>
  <rect x="98.4615" y="276.2791" width="78.7692" height="66.9767" rx="33.4884" fill="#fff3cd" stroke="#ffc107" stroke-width="3.3488" />
  <text x="137.8462" y="319.814" text-anchor="middle" font-size="26.7907" font-weight="bold" fill="#856404">3</text>
  <text x="216.6154" y="304.7442" font-size="21.7674" font-weight="bold" fill="#333">Sequential message processing</text>
  <text x="216.6154" y="334.8837" font-size="18.4186" fill="#666">Each actor processes one message at a time. No data races within an actor.</text>
  <rect x="98.4615" y="368.3721" width="78.7692" height="66.9767" rx="33.4884" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.3488" />
  <text x="137.8462" y="411.907" text-anchor="middle" font-size="26.7907" font-weight="bold" fill="#4a90e2">4</text>
  <text x="216.6154" y="396.8372" font-size="21.7674" font-weight="bold" fill="#333">Natural isolation</text>
  <text x="216.6154" y="426.9767" font-size="18.4186" fill="#666">Actors can crash independently. Supervision strategies for fault tolerance.</text>
  <rect x="98.4615" y="460.4651" width="78.7692" height="66.9767" rx="33.4884" fill="#d4edda" stroke="#28a745" stroke-width="3.3488" />
  <text x="137.8462" y="504" text-anchor="middle" font-size="26.7907" font-weight="bold" fill="#28a745">5</text>
  <text x="216.6154" y="488.9302" font-size="21.7674" font-weight="bold" fill="#333">Scalable</text>
  <text x="216.6154" y="519.0698" font-size="18.4186" fill="#666">Actors can be distributed across threads or even machines.</text>
  <rect x="157.5385" y="569.3023" width="964.9231" height="83.7209" rx="8.3721" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5116" />
  <text x="640" y="606.1395" text-anchor="middle" font-size="20.093" font-weight="bold" fill="#4a90e2">Rust Actor Libraries</text>
  <text x="640" y="636.2791" text-anchor="middle" font-size="20.093" fill="#333" font-family="monospace">actix    xactor    stakker</text>
</svg>
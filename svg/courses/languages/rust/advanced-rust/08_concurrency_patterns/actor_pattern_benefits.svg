<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.118822909926" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="80.6779" y="63.200004159999" width="81.3559" height="61.866573760015" rx="6.118822909926" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.356" y="103.413365503995" text-anchor="middle" font-size="26.16775805659" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1</text>
  <text x="202.7119" y="89.493279808009" font-size="21.261277925884" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">No shared mutable state</text>
  <text x="202.7119" y="117.333347199998" font-size="17.990359159001" fill="var(--text-muted)" font-family="Arial, sans-serif">Each actor owns its data exclusively.</text>
  <rect x="80.6779" y="148.266582080014" width="81.3559" height="61.866573760015" rx="6.118822909926" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.356" y="188.479943424009" text-anchor="middle" font-size="26.16775805659" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2</text>
  <text x="202.7119" y="174.560065727989" font-size="21.261277925884" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">No locks, no deadlocks</text>
  <text x="202.7119" y="202.400029119995" font-size="17.990359159001" fill="var(--text-muted)" font-family="Arial, sans-serif">Communication via messages only.</text>
  <rect x="80.6779" y="233.333367999994" width="81.3559" height="61.866573760015" rx="6.118822909926" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.356" y="273.54672934399" text-anchor="middle" font-size="26.16775805659" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3</text>
  <text x="202.7119" y="259.626643648004" font-size="21.261277925884" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Sequential message processing</text>
  <text x="202.7119" y="287.46660704001" font-size="17.990359159001" fill="var(--text-muted)" font-family="Arial, sans-serif">Each actor processes one message at a time. No data races within an actor.</text>
  <rect x="80.6779" y="318.400049919992" width="81.3559" height="61.866573760015" rx="6.118822909926" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.356" y="358.613307264004" text-anchor="middle" font-size="26.16775805659" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">4</text>
  <text x="202.7119" y="344.693325568001" font-size="21.261277925884" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Natural isolation</text>
  <text x="202.7119" y="372.533288960007" font-size="17.990359159001" fill="var(--text-muted)" font-family="Arial, sans-serif">Actors can crash independently. Supervision strategies for fault tolerance.</text>
  <rect x="80.6779" y="403.466731839989" width="81.3559" height="61.866573760015" rx="6.118822909926" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.356" y="443.679989184002" text-anchor="middle" font-size="26.16775805659" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">5</text>
  <text x="202.7119" y="429.759903488016" font-size="21.261277925884" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Scalable</text>
  <text x="202.7119" y="457.599970880005" font-size="17.990359159001" fill="var(--text-muted)" font-family="Arial, sans-serif">Actors can be distributed across threads or even machines.</text>
  <rect x="141.6949" y="503.999979200004" width="996.6102" height="77.333347199998" rx="6.118822909926" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="538.026589568013" text-anchor="middle" font-size="19.625818542442" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Rust Actor Libraries</text>
  <text x="640" y="565.866656960002" text-anchor="middle" font-size="19.625818542442" fill="var(--text)" font-family="Courier New, monospace">actix    xactor    stakker</text>
</svg>

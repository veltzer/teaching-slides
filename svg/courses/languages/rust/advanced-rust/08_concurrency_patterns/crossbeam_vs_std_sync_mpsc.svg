<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="51.4286" text-anchor="middle" font-size="30.72" font-weight="bold" fill="var(--text)">crossbeam-channel vs std::sync::mpsc</text>
  <rect x="34.1333" y="85.7143" width="341.3333" height="68.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="204.8" y="128.5714" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--bg)">Feature</text>
  <rect x="375.4667" y="85.7143" width="392.5333" height="68.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="571.7333" y="128.5714" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--bg)">std::sync::mpsc</text>
  <rect x="768" y="85.7143" width="477.8667" height="68.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1006.9333" y="128.5714" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--bg)">crossbeam-channel</text>
  <rect x="34.1333" y="162.8571" width="341.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="375.4667" y="162.8571" width="392.5333" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="768" y="162.8571" width="477.8667" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="51.2" y="200.5714" font-size="20.48" fill="var(--text)">Multiple producers</text>
  <text x="392.5333" y="200.5714" font-size="20.48" fill="var(--text)">Yes (clone tx)</text>
  <text x="785.0667" y="200.5714" font-size="20.48" fill="var(--text)">Yes (clone tx)</text>
  <rect x="34.1333" y="231.4286" width="341.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="375.4667" y="231.4286" width="392.5333" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="768" y="231.4286" width="477.8667" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="51.2" y="269.1429" font-size="20.48" fill="var(--text)">Multiple consumers</text>
  <text x="392.5333" y="269.1429" font-size="20.48" fill="var(--danger-accent)">No (MPSC only)</text>
  <text x="785.0667" y="269.1429" font-size="20.48" fill="var(--ok-accent)">Yes (MPMC)</text>
  <rect x="34.1333" y="300" width="341.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="375.4667" y="300" width="392.5333" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="768" y="300" width="477.8667" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="51.2" y="337.7143" font-size="20.48" fill="var(--text)">select! macro</text>
  <text x="392.5333" y="337.7143" font-size="20.48" fill="var(--danger-accent)">No</text>
  <text x="785.0667" y="337.7143" font-size="20.48" fill="var(--ok-accent)">Yes</text>
  <rect x="34.1333" y="368.5714" width="341.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="375.4667" y="368.5714" width="392.5333" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="768" y="368.5714" width="477.8667" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="51.2" y="406.2857" font-size="20.48" fill="var(--text)">Bounded channel</text>
  <text x="392.5333" y="406.2857" font-size="20.48" fill="var(--text)">sync_channel(n)</text>
  <text x="785.0667" y="406.2857" font-size="20.48" fill="var(--text)">bounded(n)</text>
  <rect x="34.1333" y="437.1429" width="341.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="375.4667" y="437.1429" width="392.5333" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="768" y="437.1429" width="477.8667" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="51.2" y="474.8571" font-size="20.48" fill="var(--text)">Unbounded channel</text>
  <text x="392.5333" y="474.8571" font-size="20.48" fill="var(--text)">channel()</text>
  <text x="785.0667" y="474.8571" font-size="20.48" fill="var(--text)">unbounded()</text>
  <rect x="34.1333" y="505.7143" width="341.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="375.4667" y="505.7143" width="392.5333" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="768" y="505.7143" width="477.8667" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="51.2" y="543.4286" font-size="20.48" fill="var(--text)">Send + Sync sender</text>
  <text x="392.5333" y="543.4286" font-size="20.48" fill="var(--text)">Sender: Send</text>
  <text x="785.0667" y="543.4286" font-size="20.48" fill="var(--ok-accent)">Sender: Send + Sync</text>
  <rect x="34.1333" y="574.2857" width="341.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="375.4667" y="574.2857" width="392.5333" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="768" y="574.2857" width="477.8667" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="51.2" y="612" font-size="20.48" fill="var(--text)">Performance</text>
  <text x="392.5333" y="612" font-size="20.48" fill="var(--text)">Good</text>
  <text x="785.0667" y="612" font-size="20.48" fill="var(--ok-accent)">Better (lock-free)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.4959" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">crossbeam-channel vs std::sync::mpsc</text>
  <rect x="40" y="74.1176" width="338.0281" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.0141" y="116.7647" text-anchor="middle" font-size="23.719" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Feature</text>
  <rect x="378.0282" y="74.1176" width="388.7323" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="572.3943" y="116.7647" text-anchor="middle" font-size="23.719" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">std::sync::mpsc</text>
  <rect x="766.7606" y="74.1176" width="473.2394" height="68.2353" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1003.3802" y="116.7647" text-anchor="middle" font-size="23.719" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">crossbeam-channel</text>
  <rect x="40" y="150.8823" width="338.0281" height="59.7059" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="150.8823" width="388.7323" height="59.7059" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="766.7606" y="150.8823" width="473.2394" height="59.7059" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9014" y="188.4117" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">Multiple producers</text>
  <text x="394.9296" y="188.4117" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">Yes (clone tx)</text>
  <text x="783.662" y="188.4117" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">Yes (clone tx)</text>
  <rect x="40" y="219.1177" width="338.0281" height="59.7059" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="219.1177" width="388.7323" height="59.7059" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="766.7606" y="219.1177" width="473.2394" height="59.7059" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9014" y="256.6471" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">Multiple consumers</text>
  <text x="394.9296" y="256.6471" font-size="20.3306" fill="var(--danger-accent)" font-family="Arial, sans-serif">No (MPSC only)</text>
  <text x="783.662" y="256.6471" font-size="20.3306" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes (MPMC)</text>
  <rect x="40" y="287.3529" width="338.0281" height="59.7059" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="287.3529" width="388.7323" height="59.7059" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="766.7606" y="287.3529" width="473.2394" height="59.7059" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9014" y="324.8824" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">select! macro</text>
  <text x="394.9296" y="324.8824" font-size="20.3306" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <text x="783.662" y="324.8824" font-size="20.3306" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <rect x="40" y="355.5882" width="338.0281" height="59.7059" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="355.5882" width="388.7323" height="59.7059" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="766.7606" y="355.5882" width="473.2394" height="59.7059" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="56.9014" y="393.1176" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">Bounded channel</text>
  <text x="394.9296" y="393.1176" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">sync_channel(n)</text>
  <text x="783.662" y="393.1176" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">bounded(n)</text>
  <rect x="40" y="423.8236" width="338.0281" height="59.7059" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="423.8236" width="388.7323" height="59.7059" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="766.7606" y="423.8236" width="473.2394" height="59.7059" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="56.9014" y="461.3529" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">Unbounded channel</text>
  <text x="394.9296" y="461.3529" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">channel()</text>
  <text x="783.662" y="461.3529" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">unbounded()</text>
  <rect x="40" y="492.0588" width="338.0281" height="59.7059" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="492.0588" width="388.7323" height="59.7059" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="766.7606" y="492.0588" width="473.2394" height="59.7059" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9014" y="529.5883" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">Send + Sync sender</text>
  <text x="394.9296" y="529.5883" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">Sender: Send</text>
  <text x="783.662" y="529.5883" font-size="20.3306" fill="var(--ok-accent)" font-family="Arial, sans-serif">Sender: Send + Sync</text>
  <rect x="40" y="560.2941" width="338.0281" height="59.7059" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="560.2941" width="388.7323" height="59.7059" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="766.7606" y="560.2941" width="473.2394" height="59.7059" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9014" y="597.8235" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">Performance</text>
  <text x="394.9296" y="597.8235" font-size="20.3306" fill="var(--text)" font-family="Arial, sans-serif">Good</text>
  <text x="783.662" y="597.8235" font-size="20.3306" fill="var(--ok-accent)" font-family="Arial, sans-serif">Better (lock-free)</text>
</svg>

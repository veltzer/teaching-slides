<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">crossbeam-channel vs std::sync::mpsc</text>
  <!-- Header row -->
  <rect x="20" y="50" width="200" height="40" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="120" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Feature</text>
  <rect x="220" y="50" width="230" height="40" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="335" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">std::sync::mpsc</text>
  <rect x="450" y="50" width="280" height="40" rx="5" fill="#28a745" stroke="#28a745" stroke-width="1.5"/>
  <text x="590" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">crossbeam-channel</text>
  <!-- Rows -->
  <rect x="20" y="95" width="200" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <rect x="220" y="95" width="230" height="35" rx="3" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <rect x="450" y="95" width="280" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="30" y="117" font-size="12" fill="#333">Multiple producers</text>
  <text x="230" y="117" font-size="12" fill="#333">Yes (clone tx)</text>
  <text x="460" y="117" font-size="12" fill="#333">Yes (clone tx)</text>

  <rect x="20" y="135" width="200" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <rect x="220" y="135" width="230" height="35" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <rect x="450" y="135" width="280" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="30" y="157" font-size="12" fill="#333">Multiple consumers</text>
  <text x="230" y="157" font-size="12" fill="#dc3545">No (MPSC only)</text>
  <text x="460" y="157" font-size="12" fill="#28a745">Yes (MPMC)</text>

  <rect x="20" y="175" width="200" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <rect x="220" y="175" width="230" height="35" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <rect x="450" y="175" width="280" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="30" y="197" font-size="12" fill="#333">select! macro</text>
  <text x="230" y="197" font-size="12" fill="#dc3545">No</text>
  <text x="460" y="197" font-size="12" fill="#28a745">Yes</text>

  <rect x="20" y="215" width="200" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <rect x="220" y="215" width="230" height="35" rx="3" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <rect x="450" y="215" width="280" height="35" rx="3" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="30" y="237" font-size="12" fill="#333">Bounded channel</text>
  <text x="230" y="237" font-size="12" fill="#333">sync_channel(n)</text>
  <text x="460" y="237" font-size="12" fill="#333">bounded(n)</text>

  <rect x="20" y="255" width="200" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <rect x="220" y="255" width="230" height="35" rx="3" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <rect x="450" y="255" width="280" height="35" rx="3" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="30" y="277" font-size="12" fill="#333">Unbounded channel</text>
  <text x="230" y="277" font-size="12" fill="#333">channel()</text>
  <text x="460" y="277" font-size="12" fill="#333">unbounded()</text>

  <rect x="20" y="295" width="200" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <rect x="220" y="295" width="230" height="35" rx="3" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <rect x="450" y="295" width="280" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="30" y="317" font-size="12" fill="#333">Send + Sync sender</text>
  <text x="230" y="317" font-size="12" fill="#333">Sender: Send</text>
  <text x="460" y="317" font-size="12" fill="#28a745">Sender: Send + Sync</text>

  <rect x="20" y="335" width="200" height="35" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <rect x="220" y="335" width="230" height="35" rx="3" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <rect x="450" y="335" width="280" height="35" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="30" y="357" font-size="12" fill="#333">Performance</text>
  <text x="230" y="357" font-size="12" fill="#333">Good</text>
  <text x="460" y="357" font-size="12" fill="#28a745">Better (lock-free)</text>
</svg>
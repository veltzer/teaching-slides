<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Fan-Out / Fan-In Pattern</text>
  <!-- Source -->
  <rect x="30" y="140" width="120" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Source</text>
  <text x="90" y="185" text-anchor="middle" font-size="9" fill="#555">Producer</text>
  <!-- Fan-out arrows -->
  <line x1="150" y1="155" x2="220" y2="90" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="170" x2="220" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="185" x2="220" y2="250" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="125" font-size="10" fill="#4a90e2" font-weight="bold">Fan-Out</text>
  <!-- Workers -->
  <rect x="230" y="60" width="160" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="310" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Worker 1</text>
  <text x="310" y="105" text-anchor="middle" font-size="9" fill="#555">Process task</text>
  <rect x="230" y="140" width="160" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="310" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Worker 2</text>
  <text x="310" y="185" text-anchor="middle" font-size="9" fill="#555">Process task</text>
  <rect x="230" y="220" width="160" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="310" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Worker 3</text>
  <text x="310" y="265" text-anchor="middle" font-size="9" fill="#555">Process task</text>
  <!-- Fan-in arrows -->
  <line x1="390" y1="90" x2="470" y2="155" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="170" x2="470" y2="170" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="250" x2="470" y2="185" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="125" font-size="10" fill="#28a745" font-weight="bold">Fan-In</text>
  <!-- Collector -->
  <rect x="480" y="140" width="120" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="540" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Collector</text>
  <text x="540" y="185" text-anchor="middle" font-size="9" fill="#555">Aggregate</text>
  <!-- Result -->
  <line x1="600" y1="170" x2="650" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="140" width="110" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="715" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Result</text>
  <text x="715" y="185" text-anchor="middle" font-size="9" fill="#555">Combined</text>
  <!-- Rust implementation -->
  <rect x="30" y="310" width="740" height="95" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Rust Implementation</text>
  <text x="45" y="358" font-size="10" fill="#555">Fan-Out: Clone mpsc::Sender for each worker, send tasks via channel</text>
  <text x="45" y="376" font-size="10" fill="#555">Fan-In: Workers send results to shared mpsc::Sender; collector reads from single Receiver</text>
  <text x="45" y="394" font-size="10" fill="#555">Or use tokio::JoinSet / futures::join_all to fan-out async tasks and collect results</text>
</svg>
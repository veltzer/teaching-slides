<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="51.4286" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Fan-Out / Fan-In Pattern</text>
  <rect x="48" y="240" width="192" height="102.8571" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="144" y="282.8571" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Source</text>
  <text x="144" y="317.1429" text-anchor="middle" font-size="16" fill="#555">Producer</text>
  <line x1="240" y1="265.7143" x2="352" y2="154.2857" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="240" y1="291.4286" x2="352" y2="291.4286" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="240" y1="317.1429" x2="352" y2="428.5714" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="280" y="214.2857" font-size="16" fill="#4a90e2" font-weight="bold">Fan-Out</text>
  <rect x="368" y="102.8571" width="256" height="102.8571" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="496" y="145.7143" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Worker 1</text>
  <text x="496" y="180" text-anchor="middle" font-size="16" fill="#555">Process task</text>
  <rect x="368" y="240" width="256" height="102.8571" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="496" y="282.8571" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Worker 2</text>
  <text x="496" y="317.1429" text-anchor="middle" font-size="16" fill="#555">Process task</text>
  <rect x="368" y="377.1429" width="256" height="102.8571" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="496" y="420" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Worker 3</text>
  <text x="496" y="454.2857" text-anchor="middle" font-size="16" fill="#555">Process task</text>
  <line x1="624" y1="154.2857" x2="752" y2="265.7143" stroke="#28a745" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="624" y1="291.4286" x2="752" y2="291.4286" stroke="#28a745" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="624" y1="428.5714" x2="752" y2="317.1429" stroke="#28a745" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="688" y="214.2857" font-size="16" fill="#28a745" font-weight="bold">Fan-In</text>
  <rect x="768" y="240" width="192" height="102.8571" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="864" y="282.8571" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Collector</text>
  <text x="864" y="317.1429" text-anchor="middle" font-size="16" fill="#555">Aggregate</text>
  <line x1="960" y1="291.4286" x2="1040" y2="291.4286" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="1056" y="240" width="176" height="102.8571" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="1144" y="282.8571" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Result</text>
  <text x="1144" y="317.1429" text-anchor="middle" font-size="16" fill="#555">Combined</text>
  <rect x="48" y="531.4286" width="1184" height="162.8571" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="574.2857" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Rust Implementation</text>
  <text x="72" y="613.7143" font-size="16" fill="#555">Fan-Out: Clone mpsc::Sender for each worker, send tasks via channel</text>
  <text x="72" y="644.5714" font-size="16" fill="#555">Fan-In: Workers send results to shared mpsc::Sender; collector reads from single Receiver</text>
  <text x="72" y="675.4286" font-size="16" fill="#555">Or use tokio::JoinSet / futures::join_all to fan-out async tasks and collect results</text>
</svg>
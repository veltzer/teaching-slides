<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Crossbeam Scoped Threads</text>
  <!-- Problem -->
  <rect x="30" y="55" width="350" height="140" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="205" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Problem: std::thread::spawn</text>
  <text x="45" y="105" font-size="10" fill="#555">let data = vec![1, 2, 3];</text>
  <text x="45" y="123" font-size="10" fill="#555">thread::spawn(|| {</text>
  <text x="55" y="141" font-size="10" fill="#dc3545">  println!("{:?}", data); // ERROR!</text>
  <text x="45" y="159" font-size="10" fill="#555">});</text>
  <text x="45" y="182" font-size="10" fill="#dc3545">Requires 'static - must own or Arc</text>
  <!-- Solution -->
  <rect x="420" y="55" width="350" height="140" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="595" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Solution: crossbeam::scope</text>
  <text x="435" y="105" font-size="10" fill="#555">let data = vec![1, 2, 3];</text>
  <text x="435" y="123" font-size="10" fill="#555">crossbeam::scope(|s| {</text>
  <text x="445" y="141" font-size="10" fill="#28a745">  s.spawn(|_| {</text>
  <text x="455" y="159" font-size="10" fill="#28a745">    println!("{:?}", data); // OK!</text>
  <text x="445" y="177" font-size="10" fill="#555">  });</text>
  <text x="435" y="190" font-size="10" fill="#555">}); // all threads joined here</text>
  <!-- Visual timeline -->
  <rect x="30" y="220" width="740" height="130" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Scoped Thread Timeline</text>
  <!-- Main thread line -->
  <line x1="60" y1="275" x2="740" y2="275" stroke="#4a90e2" stroke-width="3"/>
  <text x="60" y="270" font-size="10" fill="#4a90e2">Main thread</text>
  <!-- Scope start -->
  <line x1="150" y1="260" x2="150" y2="340" stroke="#28a745" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="150" y="255" text-anchor="middle" font-size="10" fill="#28a745">scope start</text>
  <!-- Spawned threads -->
  <line x1="200" y1="275" x2="200" y2="300" stroke="#ffc107" stroke-width="1.5"/>
  <line x1="200" y1="300" x2="500" y2="300" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="295" text-anchor="middle" font-size="10" fill="#333">Thread 1 (borrows data)</text>
  <line x1="250" y1="275" x2="250" y2="320" stroke="#ffc107" stroke-width="1.5"/>
  <line x1="250" y1="320" x2="450" y2="320" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="315" text-anchor="middle" font-size="10" fill="#333">Thread 2 (borrows data)</text>
  <!-- Scope end - all joined -->
  <line x1="550" y1="260" x2="550" y2="340" stroke="#dc3545" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="550" y="255" text-anchor="middle" font-size="10" fill="#dc3545">scope end (join all)</text>
  <line x1="500" y1="300" x2="550" y2="275" stroke="#ffc107" stroke-width="1.5"/>
  <line x1="450" y1="320" x2="550" y2="275" stroke="#ffc107" stroke-width="1.5"/>
  <!-- Key insight -->
  <rect x="30" y="370" width="740" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Key Insight</text>
  <text x="45" y="414" font-size="11" fill="#555">Scope guarantees all threads finish before the scope ends, so borrowed data outlives all threads.</text>
  <text x="660" y="414" font-size="11" fill="#28a745">No Arc needed!</text>
</svg>
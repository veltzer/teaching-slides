<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="11.4545" refX="16" refY="5.7273" orient="auto">
      <polygon points="0,16.3636 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="49.0909" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Crossbeam Scoped Threads</text>
  <rect x="48" y="90" width="560" height="229.0909" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="328" y="130.9091" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#dc3545">Problem: std::thread::spawn</text>
  <text x="72" y="171.8182" font-size="16" fill="#555">let data = vec![1, 2, 3];</text>
  <text x="72" y="201.2727" font-size="16" fill="#555">thread::spawn(|| {</text>
  <text x="88" y="230.7273" font-size="16" fill="#dc3545">  println!("{:?}", data); // ERROR!</text>
  <text x="72" y="260.1818" font-size="16" fill="#555">});</text>
  <text x="72" y="297.8182" font-size="16" fill="#dc3545">Requires 'static - must own or Arc</text>
  <rect x="672" y="90" width="560" height="229.0909" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="952" y="130.9091" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">Solution: crossbeam::scope</text>
  <text x="696" y="171.8182" font-size="16" fill="#555">let data = vec![1, 2, 3];</text>
  <text x="696" y="201.2727" font-size="16" fill="#555">crossbeam::scope(|s| {</text>
  <text x="712" y="230.7273" font-size="16" fill="#28a745">  s.spawn(|_| {</text>
  <text x="728" y="260.1818" font-size="16" fill="#28a745">    println!("{:?}", data); // OK!</text>
  <text x="712" y="289.6364" font-size="16" fill="#555">  });</text>
  <text x="696" y="310.9091" font-size="16" fill="#555">}); // all threads joined here</text>
  <rect x="48" y="360" width="1184" height="212.7273" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="400.9091" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Scoped Thread Timeline</text>
  <line x1="96" y1="450" x2="1184" y2="450" stroke="#4a90e2" stroke-width="4.8" />
  <text x="96" y="441.8182" font-size="16" fill="#4a90e2">Main thread</text>
  <line x1="240" y1="425.4545" x2="240" y2="556.3636" stroke="#28a745" stroke-width="3.2" stroke-dasharray="6.4 3.2" />
  <text x="240" y="417.2727" text-anchor="middle" font-size="16" fill="#28a745">scope start</text>
  <line x1="320" y1="450" x2="320" y2="490.9091" stroke="#ffc107" stroke-width="2.4" />
  <line x1="320" y1="490.9091" x2="800" y2="490.9091" stroke="#ffc107" stroke-width="3.2" />
  <text x="560" y="482.7273" text-anchor="middle" font-size="16" fill="#333">Thread 1 (borrows data)</text>
  <line x1="400" y1="450" x2="400" y2="523.6364" stroke="#ffc107" stroke-width="2.4" />
  <line x1="400" y1="523.6364" x2="720" y2="523.6364" stroke="#ffc107" stroke-width="3.2" />
  <text x="560" y="515.4545" text-anchor="middle" font-size="16" fill="#333">Thread 2 (borrows data)</text>
  <line x1="880" y1="425.4545" x2="880" y2="556.3636" stroke="#dc3545" stroke-width="3.2" stroke-dasharray="6.4 3.2" />
  <text x="880" y="417.2727" text-anchor="middle" font-size="16" fill="#dc3545">scope end (join all)</text>
  <line x1="800" y1="490.9091" x2="880" y2="450" stroke="#ffc107" stroke-width="2.4" />
  <line x1="720" y1="523.6364" x2="880" y2="450" stroke="#ffc107" stroke-width="2.4" />
  <rect x="48" y="605.4545" width="1184" height="90" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="640" y="641.4545" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Key Insight</text>
  <text x="72" y="677.4545" font-size="17.6" fill="#555">Scope guarantees all threads finish before the scope ends, so borrowed data outlives all threads.</text>
  <text x="1056" y="677.4545" font-size="17.6" fill="#28a745">No Arc needed!</text>
</svg>
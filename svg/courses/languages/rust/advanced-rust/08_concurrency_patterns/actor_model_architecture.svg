  <text x="230" y="193.877551020409" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231546211728" fill="var(--warn-text)">Mailbox</text>
  <text x="230" y="258.979591836735" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231546211728" fill="var(--primary-text)">One msg at a time</text>

  <rect x="450" y="40" width="380" height="260.408163265306" rx="8.703740692416" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="81.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.583416557936" font-weight="bold" fill="var(--primary-text)">OrderService</text>
  <rect x="470" y="105.102040816326" width="340" height="47.34693877551" rx="6.527805519312" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="134.693877551021" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231546211728" fill="var(--ok-text)">Private State</text>
  <rect x="470" y="164.285714285715" width="340" height="47.34693877551" rx="6.527805519312" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="193.877551020409" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231546211728" fill="var(--warn-text)">Mailbox</text>
  <text x="640" y="258.979591836735" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231546211728" fill="var(--primary-text)">One msg at a time</text>

  <rect x="860" y="40" width="380" height="260.408163265306" rx="8.703740692416" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="81.428571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.583416557936" font-weight="bold" fill="var(--primary-text)">EmailService</text>
  <rect x="880" y="105.102040816326" width="340" height="47.34693877551" rx="6.527805519312" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="134.693877551021" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231546211728" fill="var(--ok-text)">Private State</text>
  <rect x="880" y="164.285714285715" width="340" height="47.34693877551" rx="6.527805519312" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="193.877551020409" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231546211728" fill="var(--warn-text)">Mailbox</text>
  <text x="1050" y="258.979591836735" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.231546211728" fill="var(--primary-text)">One msg at a time</text>

  <line x1="420" y1="170.204081632653" x2="450" y2="170.204081632653" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="830" y1="170.204081632653" x2="860" y2="170.204081632653" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <rect x="40" y="335.918367346939" width="595" height="284.081632653061" rx="8.703740692416" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="383.265306122449" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.75935173104" font-weight="bold" fill="var(--ok-text)">Key Principles</text>
  <text x="335" y="436.530612244898" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.31951379828" fill="var(--ok-text)">No shared mutable state</text>
  <text x="335" y="483.877551020408" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.31951379828" fill="var(--ok-text)">Communicate via messages</text>

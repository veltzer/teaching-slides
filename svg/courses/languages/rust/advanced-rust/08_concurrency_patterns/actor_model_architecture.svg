  <ns0:text x="389.0466" y="167.914" font-size="13.7634" fill="var(--warn-yellow)">CreateOrder</ns0:text>
  <ns0:line x1="734.0502" y1="178.9247" x2="836.8172" y2="178.9247" stroke="var(--warn-yellow)" stroke-width="2.7527" marker-end="url(#arrow)" />
  <ns0:text x="785.4337" y="167.914" font-size="13.7634" fill="var(--warn-yellow)">SendEmail</ns0:text>
  <ns0:line x1="587.2401" y1="302.7957" x2="190.853" y2="302.7957" stroke="var(--ok-bright)" stroke-width="2.0645" stroke-dasharray="6.8817 4.129" marker-end="url(#arrow)" />
  <ns0:text x="389.0466" y="323.4409" font-size="13.7634" fill="var(--ok-bright)">UserFound(response)</ns0:text>
  <ns0:rect x="44.043" y="357.8495" width="513.8351" height="137.6344" rx="6.8817" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.7527" />
  <ns0:text x="300.9606" y="392.2581" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text-dark)">Key Principles</ns0:text>
  <ns0:text x="66.0645" y="423.914" font-size="13.7634" fill="var(--text-muted)">- No shared mutable state</ns0:text>
  <ns0:text x="66.0645" y="448.6882" font-size="13.7634" fill="var(--text-muted)">- Communication only via messages</ns0:text>
  <ns0:text x="66.0645" y="473.4624" font-size="13.7634" fill="var(--text-muted)">- Each actor has exclusive state ownership</ns0:text>
  <ns0:rect x="601.9211" y="357.8495" width="528.5161" height="137.6344" rx="6.8817" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.7527" />
  <ns0:text x="866.1792" y="392.2581" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text-dark)">Rust Implementation</ns0:text>
  <ns0:text x="623.9427" y="423.914" font-size="13.7634" fill="var(--text-muted)">- tokio::sync::mpsc channels</ns0:text>
  <ns0:text x="623.9427" y="448.6882" font-size="13.7634" fill="var(--text-muted)">- Each actor is a tokio::spawn task</ns0:text>
  <ns0:text x="623.9427" y="473.4624" font-size="13.7634" fill="var(--text-muted)">- Crates: actix, xactor, ractor</ns0:text>
  <ns0:rect x="44.043" y="523.0108" width="1086.3943" height="116.9892" rx="6.8817" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.7527" />
  <ns0:text x="587.2401" y="557.4194" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text-dark)">Benefits of Actor Model in Rust</ns0:text>
  <ns0:text x="205.5341" y="591.828" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">No locks needed</ns0:text>
  <ns0:text x="440.4301" y="591.828" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">Natural backpressure</ns0:text>
  <ns0:text x="690.0072" y="591.828" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">Fault isolation</ns0:text>
  <ns0:text x="939.5842" y="591.828" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">Scalable</ns0:text>
  <ns0:text x="587.2401" y="626.2366" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">Rust's ownership model aligns perfectly: messages are moved (Send), not shared</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="587.2401" y="41.2903" text-anchor="middle" font-size="27.5269" font-weight="bold" fill="var(--text)">Actor Model Architecture</text>
  <rect x="44.043" y="82.5806" width="293.6201" height="220.2151" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="190.853" y="116.9892" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text)">Actor: UserService</text>
  <rect x="66.0645" y="130.7527" width="249.5771" height="34.4086" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="190.853" y="154.1505" text-anchor="middle" font-size="13.7634" fill="var(--text)">Private State</text>
  <rect x="66.0645" y="172.043" width="249.5771" height="34.4086" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="190.853" y="195.4409" text-anchor="middle" font-size="13.7634" fill="var(--text)">Mailbox (channel rx)</text>
  <rect x="66.0645" y="213.3333" width="249.5771" height="34.4086" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="190.853" y="236.7312" text-anchor="middle" font-size="13.7634" fill="var(--text)">Message Handler</text>
  <text x="190.853" y="282.1505" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">Processes one msg at a time</text>
  <rect x="440.4301" y="82.5806" width="293.6201" height="220.2151" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="587.2401" y="116.9892" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text)">Actor: OrderService</text>
  <rect x="462.4516" y="130.7527" width="249.5771" height="34.4086" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="587.2401" y="154.1505" text-anchor="middle" font-size="13.7634" fill="var(--text)">Private State</text>
  <rect x="462.4516" y="172.043" width="249.5771" height="34.4086" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="587.2401" y="195.4409" text-anchor="middle" font-size="13.7634" fill="var(--text)">Mailbox (channel rx)</text>
  <rect x="462.4516" y="213.3333" width="249.5771" height="34.4086" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="587.2401" y="236.7312" text-anchor="middle" font-size="13.7634" fill="var(--text)">Message Handler</text>
  <text x="587.2401" y="282.1505" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">Processes one msg at a time</text>
  <rect x="836.8172" y="82.5806" width="293.6201" height="220.2151" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="983.6272" y="116.9892" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text)">Actor: EmailService</text>
  <rect x="858.8387" y="130.7527" width="249.5771" height="34.4086" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="983.6272" y="154.1505" text-anchor="middle" font-size="13.7634" fill="var(--text)">Private State</text>
  <rect x="858.8387" y="172.043" width="249.5771" height="34.4086" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="983.6272" y="195.4409" text-anchor="middle" font-size="13.7634" fill="var(--text)">Mailbox (channel rx)</text>
  <rect x="858.8387" y="213.3333" width="249.5771" height="34.4086" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="983.6272" y="236.7312" text-anchor="middle" font-size="13.7634" fill="var(--text)">Message Handler</text>
  <line x1="337.6631" y1="178.9247" x2="440.4301" y2="178.9247" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="389.0466" y="167.914" font-size="13.7634" fill="var(--warn-accent)">CreateOrder</text>
  <line x1="734.0502" y1="178.9247" x2="836.8172" y2="178.9247" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="785.4337" y="167.914" font-size="13.7634" fill="var(--warn-accent)">SendEmail</text>
  <line x1="587.2401" y1="302.7957" x2="190.853" y2="302.7957" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.8817 4.129" marker-end="url(#arrow)" />
  <text x="389.0466" y="323.4409" font-size="13.7634" fill="var(--ok-accent)">UserFound(response)</text>
  <rect x="44.043" y="357.8495" width="513.8351" height="137.6344" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="300.9606" y="392.2581" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text)">Key Principles</text>
  <text x="66.0645" y="423.914" font-size="13.7634" fill="var(--text-muted)">- No shared mutable state</text>
  <text x="66.0645" y="448.6882" font-size="13.7634" fill="var(--text-muted)">- Communication only via messages</text>
  <text x="66.0645" y="473.4624" font-size="13.7634" fill="var(--text-muted)">- Each actor has exclusive state ownership</text>
  <rect x="601.9211" y="357.8495" width="528.5161" height="137.6344" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="866.1792" y="392.2581" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text)">Rust Implementation</text>
  <text x="623.9427" y="423.914" font-size="13.7634" fill="var(--text-muted)">- tokio::sync::mpsc channels</text>
  <text x="623.9427" y="448.6882" font-size="13.7634" fill="var(--text-muted)">- Each actor is a tokio::spawn task</text>
  <text x="623.9427" y="473.4624" font-size="13.7634" fill="var(--text-muted)">- Crates: actix, xactor, ractor</text>
  <rect x="44.043" y="523.0108" width="1086.3943" height="116.9892" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="587.2401" y="557.4194" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text)">Benefits of Actor Model in Rust</text>
  <text x="205.5341" y="591.828" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">No locks needed</text>
  <text x="440.4301" y="591.828" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">Natural backpressure</text>
  <text x="690.0072" y="591.828" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">Fault isolation</text>
  <text x="939.5842" y="591.828" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">Scalable</text>
  <text x="587.2401" y="626.2366" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">Rust's ownership model aligns perfectly: messages are moved (Send), not shared</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="10.5" refX="16" refY="5.25" orient="auto">
      <polygon points="0,15 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Actor Model Architecture</text>
  <rect x="48" y="90" width="320" height="240" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="208" y="127.5" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Actor: UserService</text>
  <rect x="72" y="142.5" width="272" height="37.5" rx="4.5" fill="#d4edda" stroke="#28a745" stroke-width="1.5" />
  <text x="208" y="168" text-anchor="middle" font-size="15" fill="#333">Private State</text>
  <rect x="72" y="187.5" width="272" height="37.5" rx="4.5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5" />
  <text x="208" y="213" text-anchor="middle" font-size="15" fill="#333">Mailbox (channel rx)</text>
  <rect x="72" y="232.5" width="272" height="37.5" rx="4.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="208" y="258" text-anchor="middle" font-size="15" fill="#333">Message Handler</text>
  <text x="208" y="307.5" text-anchor="middle" font-size="15" fill="#555">Processes one msg at a time</text>
  <rect x="480" y="90" width="320" height="240" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="127.5" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Actor: OrderService</text>
  <rect x="504" y="142.5" width="272" height="37.5" rx="4.5" fill="#d4edda" stroke="#28a745" stroke-width="1.5" />
  <text x="640" y="168" text-anchor="middle" font-size="15" fill="#333">Private State</text>
  <rect x="504" y="187.5" width="272" height="37.5" rx="4.5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5" />
  <text x="640" y="213" text-anchor="middle" font-size="15" fill="#333">Mailbox (channel rx)</text>
  <rect x="504" y="232.5" width="272" height="37.5" rx="4.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="640" y="258" text-anchor="middle" font-size="15" fill="#333">Message Handler</text>
  <text x="640" y="307.5" text-anchor="middle" font-size="15" fill="#555">Processes one msg at a time</text>
  <rect x="912" y="90" width="320" height="240" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="1072" y="127.5" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Actor: EmailService</text>
  <rect x="936" y="142.5" width="272" height="37.5" rx="4.5" fill="#d4edda" stroke="#28a745" stroke-width="1.5" />
  <text x="1072" y="168" text-anchor="middle" font-size="15" fill="#333">Private State</text>
  <rect x="936" y="187.5" width="272" height="37.5" rx="4.5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5" />
  <text x="1072" y="213" text-anchor="middle" font-size="15" fill="#333">Mailbox (channel rx)</text>
  <rect x="936" y="232.5" width="272" height="37.5" rx="4.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="1072" y="258" text-anchor="middle" font-size="15" fill="#333">Message Handler</text>
  <line x1="368" y1="195" x2="480" y2="195" stroke="#ffc107" stroke-width="3" marker-end="url(#arrow)" />
  <text x="424" y="183" font-size="15" fill="#ffc107">CreateOrder</text>
  <line x1="800" y1="195" x2="912" y2="195" stroke="#ffc107" stroke-width="3" marker-end="url(#arrow)" />
  <text x="856" y="183" font-size="15" fill="#ffc107">SendEmail</text>
  <line x1="640" y1="330" x2="208" y2="330" stroke="#28a745" stroke-width="2.25" stroke-dasharray="7.5 4.5" marker-end="url(#arrow)" />
  <text x="424" y="352.5" font-size="15" fill="#28a745">UserFound(response)</text>
  <rect x="48" y="390" width="560" height="150" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="328" y="427.5" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Key Principles</text>
  <text x="72" y="462" font-size="15" fill="#555">- No shared mutable state</text>
  <text x="72" y="489" font-size="15" fill="#555">- Communication only via messages</text>
  <text x="72" y="516" font-size="15" fill="#555">- Each actor has exclusive state ownership</text>
  <rect x="656" y="390" width="576" height="150" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="944" y="427.5" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Rust Implementation</text>
  <text x="680" y="462" font-size="15" fill="#555">- tokio::sync::mpsc channels</text>
  <text x="680" y="489" font-size="15" fill="#555">- Each actor is a tokio::spawn task</text>
  <text x="680" y="516" font-size="15" fill="#555">- Crates: actix, xactor, ractor</text>
  <rect x="48" y="570" width="1184" height="127.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="607.5" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Benefits of Actor Model in Rust</text>
  <text x="224" y="645" text-anchor="middle" font-size="15" fill="#555">No locks needed</text>
  <text x="480" y="645" text-anchor="middle" font-size="15" fill="#555">Natural backpressure</text>
  <text x="752" y="645" text-anchor="middle" font-size="15" fill="#555">Fault isolation</text>
  <text x="1024" y="645" text-anchor="middle" font-size="15" fill="#555">Scalable</text>
  <text x="640" y="682.5" text-anchor="middle" font-size="15" fill="#555">Rust's ownership model aligns perfectly: messages are moved (Send), not shared</text>
</svg>
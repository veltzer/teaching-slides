  <text x="947" y="383.265306122449" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.75935173104" font-weight="bold" fill="var(--warn-text)">Rust Implementation</text>
  <text x="947" y="436.530612244898" text-anchor="middle" font-family="Courier New, monospace" font-size="15.231546211728" fill="var(--warn-text)">tokio::sync::mpsc</text>
  <text x="947" y="483.877551020408" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.31951379828" fill="var(--warn-text)">Each actor: tokio::spawn</text>
  <text x="947" y="531.224489795919" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.31951379828" fill="var(--warn-text)">Crates: actix, ractor</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.4748" font-weight="bold" fill="var(--text)">Actor Model Architecture</text>
  <rect x="40" y="80" width="324.3243" height="213.3334" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.1621" y="113.3333" text-anchor="middle" font-size="18.5086" font-weight="bold" fill="var(--text)">Actor: UserService</text>
  <rect x="64.3243" y="126.6667" width="275.6757" height="33.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.1621" y="149.3333" text-anchor="middle" font-size="14.2373" fill="var(--text)">Private State</text>
  <rect x="64.3243" y="166.6667" width="275.6757" height="33.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.1621" y="189.3334" text-anchor="middle" font-size="14.2373" fill="var(--text)">Mailbox (channel rx)</text>
  <rect x="64.3243" y="206.6666" width="275.6757" height="33.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.1621" y="229.3334" text-anchor="middle" font-size="14.2373" fill="var(--text)">Message Handler</text>
  <text x="202.1621" y="273.3333" text-anchor="middle" font-size="14.2373" fill="var(--text-muted)">Processes one msg at a time</text>
  <rect x="477.8378" y="80" width="324.3243" height="213.3334" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="113.3333" text-anchor="middle" font-size="18.5086" font-weight="bold" fill="var(--text)">Actor: OrderService</text>
  <rect x="502.1621" y="126.6667" width="275.6757" height="33.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="149.3333" text-anchor="middle" font-size="14.2373" fill="var(--text)">Private State</text>
  <rect x="502.1621" y="166.6667" width="275.6757" height="33.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="189.3334" text-anchor="middle" font-size="14.2373" fill="var(--text)">Mailbox (channel rx)</text>
  <rect x="502.1621" y="206.6666" width="275.6757" height="33.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="229.3334" text-anchor="middle" font-size="14.2373" fill="var(--text)">Message Handler</text>
  <text x="639.9999" y="273.3333" text-anchor="middle" font-size="14.2373" fill="var(--text-muted)">Processes one msg at a time</text>
  <rect x="915.6757" y="80" width="324.3243" height="213.3334" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8378" y="113.3333" text-anchor="middle" font-size="18.5086" font-weight="bold" fill="var(--text)">Actor: EmailService</text>
  <rect x="940" y="126.6667" width="275.6757" height="33.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8378" y="149.3333" text-anchor="middle" font-size="14.2373" fill="var(--text)">Private State</text>
  <rect x="940" y="166.6667" width="275.6757" height="33.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8378" y="189.3334" text-anchor="middle" font-size="14.2373" fill="var(--text)">Mailbox (channel rx)</text>
  <rect x="940" y="206.6666" width="275.6757" height="33.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8378" y="229.3334" text-anchor="middle" font-size="14.2373" fill="var(--text)">Message Handler</text>
  <line x1="364.3243" y1="173.3333" x2="477.8378" y2="173.3333" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="421.0811" y="162.6667" font-size="14.2373" fill="var(--warn-accent)">CreateOrder</text>
  <line x1="802.1622" y1="173.3333" x2="915.6757" y2="173.3333" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="858.9189" y="162.6667" font-size="14.2373" fill="var(--warn-accent)">SendEmail</text>
  <line x1="639.9999" y1="293.3333" x2="202.1621" y2="293.3333" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6.8817 4.129" marker-end="url(#arrow)" />
  <text x="421.0811" y="313.3334" font-size="14.2373" fill="var(--ok-accent)">UserFound(response)</text>
  <rect x="40" y="346.6667" width="567.5675" height="133.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="380" text-anchor="middle" font-size="18.5086" font-weight="bold" fill="var(--text)">Key Principles</text>
  <text x="64.3243" y="410.6667" font-size="14.2373" fill="var(--text-muted)">- No shared mutable state</text>
  <text x="64.3243" y="434.6667" font-size="14.2373" fill="var(--text-muted)">- Communication only via messages</text>
  <text x="64.3243" y="458.6667" font-size="14.2373" fill="var(--text-muted)">- Each actor has exclusive state ownership</text>
  <rect x="656.2162" y="346.6667" width="583.7837" height="133.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.1081" y="380" text-anchor="middle" font-size="18.5086" font-weight="bold" fill="var(--text)">Rust Implementation</text>
  <text x="680.5406" y="410.6667" font-size="14.2373" fill="var(--text-muted)">- tokio::sync::mpsc channels</text>
  <text x="680.5406" y="434.6667" font-size="14.2373" fill="var(--text-muted)">- Each actor is a tokio::spawn task</text>
  <text x="680.5406" y="458.6667" font-size="14.2373" fill="var(--text-muted)">- Crates: actix, xactor, ractor</text>
  <rect x="40" y="506.6667" width="1200" height="113.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="540" text-anchor="middle" font-size="18.5086" font-weight="bold" fill="var(--text)">Benefits of Actor Model in Rust</text>
  <text x="218.3784" y="573.3334" text-anchor="middle" font-size="14.2373" fill="var(--text-muted)">No locks needed</text>
  <text x="477.8378" y="573.3334" text-anchor="middle" font-size="14.2373" fill="var(--text-muted)">Natural backpressure</text>
  <text x="753.5135" y="573.3334" text-anchor="middle" font-size="14.2373" fill="var(--text-muted)">Fault isolation</text>
  <text x="1029.1891" y="573.3334" text-anchor="middle" font-size="14.2373" fill="var(--text-muted)">Scalable</text>
  <text x="639.9999" y="606.6667" text-anchor="middle" font-size="14.2373" fill="var(--text-muted)">Rust's ownership model aligns perfectly: messages are moved (Send), not shared</text>
</svg>
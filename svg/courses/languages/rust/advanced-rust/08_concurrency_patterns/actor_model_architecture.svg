  <ns0:text x="587.2401" y="41.2903" text-anchor="middle" font-size="27.5269" font-weight="bold" fill="var(--text-dark)">Actor Model Architecture</ns0:text>
  <ns0:rect x="44.043" y="82.5806" width="293.6201" height="220.2151" rx="6.8817" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.7527" />
  <ns0:text x="190.853" y="116.9892" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text-dark)">Actor: UserService</ns0:text>
  <ns0:rect x="66.0645" y="130.7527" width="249.5771" height="34.4086" rx="4.129" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.3763" />
  <ns0:text x="190.853" y="154.1505" text-anchor="middle" font-size="13.7634" fill="var(--text-dark)">Private State</ns0:text>
  <ns0:rect x="66.0645" y="172.043" width="249.5771" height="34.4086" rx="4.129" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.3763" />
  <ns0:text x="190.853" y="195.4409" text-anchor="middle" font-size="13.7634" fill="var(--text-dark)">Mailbox (channel rx)</ns0:text>
  <ns0:rect x="66.0645" y="213.3333" width="249.5771" height="34.4086" rx="4.129" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.3763" />
  <ns0:text x="190.853" y="236.7312" text-anchor="middle" font-size="13.7634" fill="var(--text-dark)">Message Handler</ns0:text>
  <ns0:text x="190.853" y="282.1505" text-anchor="middle" font-size="13.7634" fill="var(--text-muted)">Processes one msg at a time</ns0:text>
  <ns0:rect x="440.4301" y="82.5806" width="293.6201" height="220.2151" rx="6.8817" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.7527" />
  <ns0:text x="587.2401" y="116.9892" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="var(--text-dark)">Actor: OrderService</ns0:text>
  <ns0:rect x="462.4516" y="130.7527" width="249.5771" height="34.4086" rx="4.129" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.3763" />
  <ns0:text x="587.2401" y="154.1505" text-anchor="middle" font-size="13.7634" fill="var(--text-dark)">Private State</ns0:text>
  <ns0:rect x="462.4516" y="172.043" width="249.5771" height="34.4086" rx="4.129" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.3763" />
  <ns0:text x="587.2401" y="195.4409" text-anchor="middle" font-size="13.7634" fill="var(--text-dark)">Mailbox (channel rx)</ns0:text>

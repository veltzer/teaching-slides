<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Actor Model Architecture</text>
  <!-- Actor 1 -->
  <rect x="30" y="60" width="200" height="160" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="130" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Actor: UserService</text>
  <rect x="45" y="95" width="170" height="25" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="130" y="112" text-anchor="middle" font-size="10" fill="#333">Private State</text>
  <rect x="45" y="125" width="170" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="130" y="142" text-anchor="middle" font-size="10" fill="#333">Mailbox (channel rx)</text>
  <rect x="45" y="155" width="170" height="25" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="130" y="172" text-anchor="middle" font-size="10" fill="#333">Message Handler</text>
  <text x="130" y="205" text-anchor="middle" font-size="10" fill="#555">Processes one msg at a time</text>
  <!-- Actor 2 -->
  <rect x="300" y="60" width="200" height="160" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Actor: OrderService</text>
  <rect x="315" y="95" width="170" height="25" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="400" y="112" text-anchor="middle" font-size="10" fill="#333">Private State</text>
  <rect x="315" y="125" width="170" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="400" y="142" text-anchor="middle" font-size="10" fill="#333">Mailbox (channel rx)</text>
  <rect x="315" y="155" width="170" height="25" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="400" y="172" text-anchor="middle" font-size="10" fill="#333">Message Handler</text>
  <text x="400" y="205" text-anchor="middle" font-size="10" fill="#555">Processes one msg at a time</text>
  <!-- Actor 3 -->
  <rect x="570" y="60" width="200" height="160" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="670" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Actor: EmailService</text>
  <rect x="585" y="95" width="170" height="25" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="670" y="112" text-anchor="middle" font-size="10" fill="#333">Private State</text>
  <rect x="585" y="125" width="170" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="670" y="142" text-anchor="middle" font-size="10" fill="#333">Mailbox (channel rx)</text>
  <rect x="585" y="155" width="170" height="25" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="670" y="172" text-anchor="middle" font-size="10" fill="#333">Message Handler</text>
  <!-- Message arrows -->
  <line x1="230" y1="130" x2="300" y2="130" stroke="#ffc107" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="122" font-size="10" fill="#ffc107">CreateOrder</text>
  <line x1="500" y1="130" x2="570" y2="130" stroke="#ffc107" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="535" y="122" font-size="10" fill="#ffc107">SendEmail</text>
  <line x1="400" y1="220" x2="130" y2="220" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="265" y="235" font-size="10" fill="#28a745">UserFound(response)</text>
  <!-- Key principles -->
  <rect x="30" y="260" width="350" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="205" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Key Principles</text>
  <text x="45" y="308" font-size="10" fill="#555">- No shared mutable state</text>
  <text x="45" y="326" font-size="10" fill="#555">- Communication only via messages</text>
  <text x="45" y="344" font-size="10" fill="#555">- Each actor has exclusive state ownership</text>
  <!-- Rust implementation -->
  <rect x="410" y="260" width="360" height="100" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="590" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Rust Implementation</text>
  <text x="425" y="308" font-size="10" fill="#555">- tokio::sync::mpsc channels</text>
  <text x="425" y="326" font-size="10" fill="#555">- Each actor is a tokio::spawn task</text>
  <text x="425" y="344" font-size="10" fill="#555">- Crates: actix, xactor, ractor</text>
  <!-- Benefits -->
  <rect x="30" y="380" width="740" height="85" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Benefits of Actor Model in Rust</text>
  <text x="140" y="430" text-anchor="middle" font-size="10" fill="#555">No locks needed</text>
  <text x="300" y="430" text-anchor="middle" font-size="10" fill="#555">Natural backpressure</text>
  <text x="470" y="430" text-anchor="middle" font-size="10" fill="#555">Fault isolation</text>
  <text x="640" y="430" text-anchor="middle" font-size="10" fill="#555">Scalable</text>
  <text x="400" y="455" text-anchor="middle" font-size="10" fill="#555">Rust's ownership model aligns perfectly: messages are moved (Send), not shared</text>
</svg>
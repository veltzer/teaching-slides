<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </ns0:defs>
  <ns0:text x="587.2401" y="41.2903" text-anchor="middle" font-size="27.5269" font-weight="bold" fill="#333">Actor Model Architecture</ns0:text>
  <ns0:rect x="44.043" y="82.5806" width="293.6201" height="220.2151" rx="6.8817" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7527" />
  <ns0:text x="190.853" y="116.9892" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="#333">Actor: UserService</ns0:text>
  <ns0:rect x="66.0645" y="130.7527" width="249.5771" height="34.4086" rx="4.129" fill="#d4edda" stroke="#28a745" stroke-width="1.3763" />
  <ns0:text x="190.853" y="154.1505" text-anchor="middle" font-size="13.7634" fill="#333">Private State</ns0:text>
  <ns0:rect x="66.0645" y="172.043" width="249.5771" height="34.4086" rx="4.129" fill="#fff3cd" stroke="#ffc107" stroke-width="1.3763" />
  <ns0:text x="190.853" y="195.4409" text-anchor="middle" font-size="13.7634" fill="#333">Mailbox (channel rx)</ns0:text>
  <ns0:rect x="66.0645" y="213.3333" width="249.5771" height="34.4086" rx="4.129" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3763" />
  <ns0:text x="190.853" y="236.7312" text-anchor="middle" font-size="13.7634" fill="#333">Message Handler</ns0:text>
  <ns0:text x="190.853" y="282.1505" text-anchor="middle" font-size="13.7634" fill="#555">Processes one msg at a time</ns0:text>
  <ns0:rect x="440.4301" y="82.5806" width="293.6201" height="220.2151" rx="6.8817" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7527" />
  <ns0:text x="587.2401" y="116.9892" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="#333">Actor: OrderService</ns0:text>
  <ns0:rect x="462.4516" y="130.7527" width="249.5771" height="34.4086" rx="4.129" fill="#d4edda" stroke="#28a745" stroke-width="1.3763" />
  <ns0:text x="587.2401" y="154.1505" text-anchor="middle" font-size="13.7634" fill="#333">Private State</ns0:text>
  <ns0:rect x="462.4516" y="172.043" width="249.5771" height="34.4086" rx="4.129" fill="#fff3cd" stroke="#ffc107" stroke-width="1.3763" />
  <ns0:text x="587.2401" y="195.4409" text-anchor="middle" font-size="13.7634" fill="#333">Mailbox (channel rx)</ns0:text>
  <ns0:rect x="462.4516" y="213.3333" width="249.5771" height="34.4086" rx="4.129" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3763" />
  <ns0:text x="587.2401" y="236.7312" text-anchor="middle" font-size="13.7634" fill="#333">Message Handler</ns0:text>
  <ns0:text x="587.2401" y="282.1505" text-anchor="middle" font-size="13.7634" fill="#555">Processes one msg at a time</ns0:text>
  <ns0:rect x="836.8172" y="82.5806" width="293.6201" height="220.2151" rx="6.8817" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7527" />
  <ns0:text x="983.6272" y="116.9892" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="#333">Actor: EmailService</ns0:text>
  <ns0:rect x="858.8387" y="130.7527" width="249.5771" height="34.4086" rx="4.129" fill="#d4edda" stroke="#28a745" stroke-width="1.3763" />
  <ns0:text x="983.6272" y="154.1505" text-anchor="middle" font-size="13.7634" fill="#333">Private State</ns0:text>
  <ns0:rect x="858.8387" y="172.043" width="249.5771" height="34.4086" rx="4.129" fill="#fff3cd" stroke="#ffc107" stroke-width="1.3763" />
  <ns0:text x="983.6272" y="195.4409" text-anchor="middle" font-size="13.7634" fill="#333">Mailbox (channel rx)</ns0:text>
  <ns0:rect x="858.8387" y="213.3333" width="249.5771" height="34.4086" rx="4.129" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3763" />
  <ns0:text x="983.6272" y="236.7312" text-anchor="middle" font-size="13.7634" fill="#333">Message Handler</ns0:text>
  <ns0:line x1="337.6631" y1="178.9247" x2="440.4301" y2="178.9247" stroke="#ffc107" stroke-width="2.7527" marker-end="url(#arrow)" />
  <ns0:text x="389.0466" y="167.914" font-size="13.7634" fill="#ffc107">CreateOrder</ns0:text>
  <ns0:line x1="734.0502" y1="178.9247" x2="836.8172" y2="178.9247" stroke="#ffc107" stroke-width="2.7527" marker-end="url(#arrow)" />
  <ns0:text x="785.4337" y="167.914" font-size="13.7634" fill="#ffc107">SendEmail</ns0:text>
  <ns0:line x1="587.2401" y1="302.7957" x2="190.853" y2="302.7957" stroke="#28a745" stroke-width="2.0645" stroke-dasharray="6.8817 4.129" marker-end="url(#arrow)" />
  <ns0:text x="389.0466" y="323.4409" font-size="13.7634" fill="#28a745">UserFound(response)</ns0:text>
  <ns0:rect x="44.043" y="357.8495" width="513.8351" height="137.6344" rx="6.8817" fill="#d4edda" stroke="#28a745" stroke-width="2.7527" />
  <ns0:text x="300.9606" y="392.2581" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="#333">Key Principles</ns0:text>
  <ns0:text x="66.0645" y="423.914" font-size="13.7634" fill="#555">- No shared mutable state</ns0:text>
  <ns0:text x="66.0645" y="448.6882" font-size="13.7634" fill="#555">- Communication only via messages</ns0:text>
  <ns0:text x="66.0645" y="473.4624" font-size="13.7634" fill="#555">- Each actor has exclusive state ownership</ns0:text>
  <ns0:rect x="601.9211" y="357.8495" width="528.5161" height="137.6344" rx="6.8817" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7527" />
  <ns0:text x="866.1792" y="392.2581" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="#333">Rust Implementation</ns0:text>
  <ns0:text x="623.9427" y="423.914" font-size="13.7634" fill="#555">- tokio::sync::mpsc channels</ns0:text>
  <ns0:text x="623.9427" y="448.6882" font-size="13.7634" fill="#555">- Each actor is a tokio::spawn task</ns0:text>
  <ns0:text x="623.9427" y="473.4624" font-size="13.7634" fill="#555">- Crates: actix, xactor, ractor</ns0:text>
  <ns0:rect x="44.043" y="523.0108" width="1086.3943" height="116.9892" rx="6.8817" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7527" />
  <ns0:text x="587.2401" y="557.4194" text-anchor="middle" font-size="17.8925" font-weight="bold" fill="#333">Benefits of Actor Model in Rust</ns0:text>
  <ns0:text x="205.5341" y="591.828" text-anchor="middle" font-size="13.7634" fill="#555">No locks needed</ns0:text>
  <ns0:text x="440.4301" y="591.828" text-anchor="middle" font-size="13.7634" fill="#555">Natural backpressure</ns0:text>
  <ns0:text x="690.0072" y="591.828" text-anchor="middle" font-size="13.7634" fill="#555">Fault isolation</ns0:text>
  <ns0:text x="939.5842" y="591.828" text-anchor="middle" font-size="13.7634" fill="#555">Scalable</ns0:text>
  <ns0:text x="587.2401" y="626.2366" text-anchor="middle" font-size="13.7634" fill="#555">Rust's ownership model aligns perfectly: messages are moved (Send), not shared</ns0:text>
</ns0:svg>
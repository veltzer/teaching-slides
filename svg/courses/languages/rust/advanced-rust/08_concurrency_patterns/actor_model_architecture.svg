<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.198779106895" font-weight="bold" fill="var(--primary-accent)">Actor Model Architecture</text>

  <rect x="40" y="83.77358490566" width="380" height="240.754716981132" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--primary-text)">UserService</text>
  <rect x="60" y="143.962264150943" width="340" height="43.77358490566" rx="6.27664133236" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="171.320754716981" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Private State</text>
  <rect x="60" y="198.679245283019" width="340" height="43.77358490566" rx="6.27664133236" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="226.037735849057" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">Mailbox</text>
  <text x="230" y="286.22641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">One msg at a time</text>

  <rect x="450" y="83.77358490566" width="380" height="240.754716981132" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--primary-text)">OrderService</text>
  <rect x="470" y="143.962264150943" width="340" height="43.77358490566" rx="6.27664133236" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="171.320754716981" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Private State</text>
  <rect x="470" y="198.679245283019" width="340" height="43.77358490566" rx="6.27664133236" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="226.037735849057" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">Mailbox</text>
  <text x="640" y="286.22641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">One msg at a time</text>

  <rect x="860" y="83.77358490566" width="380" height="240.754716981132" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--primary-text)">EmailService</text>
  <rect x="880" y="143.962264150943" width="340" height="43.77358490566" rx="6.27664133236" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="171.320754716981" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Private State</text>
  <rect x="880" y="198.679245283019" width="340" height="43.77358490566" rx="6.27664133236" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="226.037735849057" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">Mailbox</text>
  <text x="1050" y="286.22641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">One msg at a time</text>

  <line x1="420" y1="204.150943396226" x2="450" y2="204.150943396226" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <line x1="830" y1="204.150943396226" x2="860" y2="204.150943396226" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>

  <rect x="40" y="357.358490566038" width="595" height="262.641509433962" rx="8.368855109814" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="401.132075471698" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--ok-text)">Key Principles</text>
  <text x="335" y="450.377358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--ok-text)">No shared mutable state</text>
  <text x="335" y="494.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--ok-text)">Communicate via messages</text>
  <text x="335" y="537.924528301887" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--ok-text)">Exclusive state ownership</text>

  <rect x="655" y="357.358490566038" width="585" height="262.641509433962" rx="8.368855109814" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947" y="401.132075471698" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--warn-text)">Rust Implementation</text>
  <text x="947" y="450.377358490566" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--warn-text)">tokio::sync::mpsc</text>
  <text x="947" y="494.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--warn-text)">Each actor: tokio::spawn</text>
  <text x="947" y="537.924528301887" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--warn-text)">Crates: actix, ractor</text>
</svg>

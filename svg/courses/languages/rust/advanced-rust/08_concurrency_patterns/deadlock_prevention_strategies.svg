<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="99.210526315789" rx="6.155870112511" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="78.157894736842" font-size="21.45064239622" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Lock Ordering</text>
  <text x="77.5001" y="116.315789473684" font-size="19.918446325216" fill="var(--text)" font-family="Arial, sans-serif">Always acquire locks in the same order (e.g., by address or ID).</text>
  <rect x="40" y="154.473684210526" width="1200" height="99.210526315789" rx="6.155870112511" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="192.631578947368" font-size="21.45064239622" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. try_lock with Backoff</text>
  <text x="77.5001" y="230.789473684211" font-size="19.918446325216" fill="var(--text)" font-family="Arial, sans-serif">Use try_lock() to avoid blocking. If it fails, release all locks and retry.</text>
  <rect x="40" y="268.947368421053" width="1200" height="99.210526315789" rx="6.155870112511" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="307.105263157895" font-size="21.45064239622" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">3. Single Lock</text>
  <text x="77.5001" y="345.263157894737" font-size="19.918446325216" fill="var(--text)" font-family="Arial, sans-serif">Combine related data under one Mutex to eliminate ordering issues.</text>
  <rect x="40" y="383.421052631579" width="1200" height="99.210526315789" rx="6.155870112511" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="421.578947368421" font-size="21.45064239622" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">4. Message Passing</text>
  <text x="77.5001" y="459.736842105263" font-size="19.918446325216" fill="var(--text)" font-family="Arial, sans-serif">Replace shared state with channels. Actors never deadlock.</text>
  <rect x="40" y="497.894736842105" width="1200" height="122.105263157895" rx="6.155870112511" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.5001" y="536.052631578947" font-size="21.45064239622" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">5. Lock Hierarchies</text>
  <text x="77.5001" y="574.210526315789" font-size="19.918446325216" fill="var(--text)" font-family="Arial, sans-serif">Assign a numeric level to each lock. A thread holding level N</text>
  <text x="77.5001" y="601.684210526316" font-size="19.918446325216" fill="var(--text)" font-family="Arial, sans-serif">may only acquire locks at level N+1 or higher.</text>
</svg>

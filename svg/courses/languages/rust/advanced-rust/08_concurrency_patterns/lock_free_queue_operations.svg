<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Lock-Free Queue Operations</text>
  <!-- CAS loop -->
  <rect x="30" y="55" width="350" height="170" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="205" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Compare-And-Swap (CAS) Loop</text>
  <text x="45" y="105" font-size="10" fill="#555">loop {</text>
  <text x="55" y="123" font-size="10" fill="#555">  let old = tail.load(Ordering::Acquire);</text>
  <text x="55" y="141" font-size="10" fill="#555">  let new_node = Node::new(value);</text>
  <text x="55" y="159" font-size="10" fill="#555">  match tail.compare_exchange(</text>
  <text x="65" y="177" font-size="10" fill="#555">    old, new_node, ...)</text>
  <text x="55" y="195" font-size="10" fill="#28a745">  { Ok(_) =&gt; break,  // success!</text>
  <text x="55" y="213" font-size="10" fill="#dc3545">    Err(_) =&gt; continue } // retry</text>
  <!-- Enqueue visualization -->
  <rect x="420" y="55" width="350" height="170" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="595" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Enqueue Operation</text>
  <!-- Queue nodes -->
  <rect x="440" y="100" width="60" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="470" y="122" text-anchor="middle" font-size="10" fill="#333">A</text>
  <line x1="500" y1="117" x2="530" y2="117" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="540" y="100" width="60" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="570" y="122" text-anchor="middle" font-size="10" fill="#333">B</text>
  <line x1="600" y1="117" x2="630" y2="117" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="640" y="100" width="60" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="670" y="122" text-anchor="middle" font-size="10" fill="#333">C</text>
  <text x="670" y="150" font-size="10" fill="#ffc107">tail</text>
  <!-- New node -->
  <rect x="640" y="160" width="60" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="670" y="182" text-anchor="middle" font-size="10" fill="#28a745">D</text>
  <line x1="670" y1="135" x2="670" y2="160" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="155" font-size="10" fill="#28a745">CAS</text>
  <text x="440" y="215" font-size="10" fill="#555">1. Read tail  2. Create node  3. CAS tail.next  4. Update tail</text>
  <!-- ABA problem -->
  <rect x="30" y="250" width="350" height="100" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="205" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">ABA Problem</text>
  <text x="45" y="298" font-size="10" fill="#555">Thread 1 reads A, pauses</text>
  <text x="45" y="316" font-size="10" fill="#555">Thread 2: A -&gt; B -&gt; A (same pointer!)</text>
  <text x="45" y="334" font-size="10" fill="#dc3545">Thread 1 CAS succeeds but state changed!</text>
  <!-- Solution -->
  <rect x="420" y="250" width="350" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="595" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">ABA Solutions</text>
  <text x="435" y="298" font-size="10" fill="#555">- Tagged pointers (generation counter)</text>
  <text x="435" y="316" font-size="10" fill="#555">- Epoch-based reclamation (crossbeam)</text>
  <text x="435" y="334" font-size="10" fill="#555">- Hazard pointers</text>
  <!-- Memory ordering -->
  <rect x="30" y="370" width="740" height="75" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Memory Ordering for Lock-Free Code</text>
  <text x="120" y="420" text-anchor="middle" font-size="10" fill="#555">Relaxed: counters</text>
  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#555">Acquire/Release: locks</text>
  <text x="470" y="420" text-anchor="middle" font-size="10" fill="#555">AcqRel: CAS ops</text>
  <text x="640" y="420" text-anchor="middle" font-size="10" fill="#555">SeqCst: safest</text>
  <text x="400" y="440" text-anchor="middle" font-size="10" fill="#dc3545">When in doubt, use SeqCst. Optimize only with proof of correctness.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.065" y="43.146" text-anchor="middle" font-size="28.764" font-weight="bold" fill="var(--text)">Lock-Free Queue Operations</text>
  <rect x="44.1049" y="79.1012" width="514.5568" height="244.4944" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="301.3833" y="115.0562" text-anchor="middle" font-size="20.1348" font-weight="bold" fill="var(--text)">Compare-And-Swap (CAS) Loop</text>
  <text x="66.1573" y="151.0112" font-size="14.382" fill="var(--text-muted)">loop {</text>
  <text x="80.8589" y="176.8989" font-size="14.382" fill="var(--text-muted)">  let old = tail.load(Ordering::Acquire);</text>
  <text x="80.8589" y="202.7866" font-size="14.382" fill="var(--text-muted)">  let new_node = Node::new(value);</text>
  <text x="80.8589" y="228.6742" font-size="14.382" fill="var(--text-muted)">  match tail.compare_exchange(</text>
  <text x="95.5606" y="254.5618" font-size="14.382" fill="var(--text-muted)">    old, new_node, ...)</text>
  <text x="80.8589" y="280.4495" font-size="14.382" fill="var(--ok-accent)">  { Ok(_) =&gt; break,  // success!</text>
  <text x="80.8589" y="306.3371" font-size="14.382" fill="var(--danger-accent)">    Err(_) =&gt; continue } // retry</text>
  <rect x="617.4682" y="79.1012" width="514.5568" height="244.4944" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="874.7466" y="115.0562" text-anchor="middle" font-size="20.1348" font-weight="bold" fill="var(--ok-accent)">Enqueue Operation</text>
  <rect x="646.8714" y="143.8202" width="88.2097" height="50.3371" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="690.9763" y="175.4607" text-anchor="middle" font-size="14.382" fill="var(--text)">A</text>
  <line x1="735.0812" y1="168.2696" x2="779.1861" y2="168.2696" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="793.8877" y="143.8202" width="88.2097" height="50.3371" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="837.9926" y="175.4607" text-anchor="middle" font-size="14.382" fill="var(--text)">B</text>
  <line x1="882.0974" y1="168.2696" x2="926.2023" y2="168.2696" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="940.9039" y="143.8202" width="88.2097" height="50.3371" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="985.0088" y="175.4607" text-anchor="middle" font-size="14.382" fill="var(--text)">C</text>
  <text x="985.0088" y="215.7303" font-size="14.382" fill="var(--warn-accent)">tail</text>
  <rect x="940.9039" y="230.1124" width="88.2097" height="50.3371" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5.7528 2.8764" />
  <text x="985.0088" y="261.7529" text-anchor="middle" font-size="14.382" fill="var(--ok-accent)">D</text>
  <line x1="985.0088" y1="194.1573" x2="985.0088" y2="230.1124" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1014.412" y="222.9214" font-size="14.382" fill="var(--ok-accent)">CAS</text>
  <text x="646.8714" y="309.2135" font-size="14.382" fill="var(--text-muted)">1. Read tail  2. Create node  3. CAS tail.next  4. Update tail</text>
  <rect x="44.1049" y="359.5505" width="514.5568" height="143.8202" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="301.3833" y="395.5057" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--danger-accent)">ABA Problem</text>
  <text x="66.1573" y="428.5843" font-size="14.382" fill="var(--text-muted)">Thread 1 reads A, pauses</text>
  <text x="66.1573" y="454.4719" font-size="14.382" fill="var(--text-muted)">Thread 2: A -&gt; B -&gt; A (same pointer!)</text>
  <text x="66.1573" y="480.3596" font-size="14.382" fill="var(--danger-accent)">Thread 1 CAS succeeds but state changed!</text>
  <rect x="617.4682" y="359.5505" width="514.5568" height="143.8202" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="874.7466" y="395.5057" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--ok-accent)">ABA Solutions</text>
  <text x="639.5206" y="428.5843" font-size="14.382" fill="var(--text-muted)">- Tagged pointers (generation counter)</text>
  <text x="639.5206" y="454.4719" font-size="14.382" fill="var(--text-muted)">- Epoch-based reclamation (crossbeam)</text>
  <text x="639.5206" y="480.3596" font-size="14.382" fill="var(--text-muted)">- Hazard pointers</text>
  <rect x="44.1049" y="532.1348" width="1087.9202" height="107.8652" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="588.065" y="568.0899" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--text)">Memory Ordering for Lock-Free Code</text>
  <text x="176.4195" y="604.045" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">Relaxed: counters</text>
  <text x="411.6455" y="604.045" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">Acquire/Release: locks</text>
  <text x="690.9763" y="604.045" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">AcqRel: CAS ops</text>
  <text x="940.9039" y="604.045" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">SeqCst: safest</text>
  <text x="588.065" y="632.8091" text-anchor="middle" font-size="14.382" fill="var(--danger-accent)">When in doubt, use SeqCst. Optimize only with proof of correctness.</text>
</svg>
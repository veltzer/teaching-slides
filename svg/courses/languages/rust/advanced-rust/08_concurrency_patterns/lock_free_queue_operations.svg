<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.7798" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Lock-Free Queue Operations</text>
  <rect x="40" y="74.9399" width="567.5675" height="237.5904" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="109.8796" text-anchor="middle" font-size="20.8458" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CAS Loop</text>
  <text x="64.3243" y="144.8193" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">loop {</text>
  <text x="80.5405" y="169.976" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">  old = tail.load(Acquire);</text>
  <text x="80.5405" y="195.1327" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">  node = Node::new(v);</text>
  <text x="80.5405" y="220.2892" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">  match tail.compare_exchange(</text>
  <text x="96.7568" y="245.4458" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">    old, node, ...)</text>
  <text x="80.5405" y="270.6025" font-size="14.8899" fill="var(--ok-accent)" font-family="Arial, sans-serif">  { Ok =&gt; break,</text>
  <text x="80.5405" y="295.7591" font-size="14.8899" fill="var(--danger-accent)" font-family="Arial, sans-serif">    Err =&gt; continue }</text>
  <rect x="672.4324" y="74.9399" width="567.5675" height="237.5904" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2161" y="109.8796" text-anchor="middle" font-size="20.8458" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Enqueue Operation</text>
  <rect x="704.8648" y="137.8314" width="97.2972" height="48.9157" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="753.5134" y="168.5784" text-anchor="middle" font-size="14.8899" fill="var(--text)" font-family="Arial, sans-serif">A</text>
  <line x1="802.1621" y1="161.5904" x2="850.8108" y2="161.5904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="867.027" y="137.8314" width="97.2972" height="48.9157" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915.6757" y="168.5784" text-anchor="middle" font-size="14.8899" fill="var(--text)" font-family="Arial, sans-serif">B</text>
  <line x1="964.3242" y1="161.5904" x2="1012.9729" y2="161.5904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1029.1891" y="137.8314" width="97.2972" height="48.9157" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8378" y="168.5784" text-anchor="middle" font-size="14.8899" fill="var(--text)" font-family="Arial, sans-serif">C</text>
  <text x="1077.8378" y="207.7109" font-size="14.8899" fill="var(--warn-accent)" font-family="Arial, sans-serif">tail</text>
  <rect x="1029.1891" y="221.6868" width="97.2972" height="48.9157" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5.7528 2.8764" filter="url(#shadow)"/>
  <text x="1077.8378" y="252.4339" text-anchor="middle" font-size="14.8899" fill="var(--ok-accent)" font-family="Arial, sans-serif">D</text>
  <line x1="1077.8378" y1="186.747" x2="1077.8378" y2="221.6868" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1110.2702" y="214.6989" font-size="14.8899" fill="var(--ok-accent)" font-family="Arial, sans-serif">CAS</text>
  <text x="704.8648" y="298.5543" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Read tail, create node, CAS tail.next, update tail</text>
  <rect x="40" y="347.4699" width="567.5675" height="139.759" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="382.4097" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">ABA Problem</text>
  <text x="64.3243" y="414.5543" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">T1 reads A, pauses</text>
  <text x="64.3243" y="439.7109" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">T2: A→B→A (same pointer)</text>
  <text x="64.3243" y="464.8675" font-size="14.8899" fill="var(--danger-accent)" font-family="Arial, sans-serif">T1 CAS succeeds, state changed</text>
  <rect x="672.4324" y="347.4699" width="567.5675" height="139.759" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2161" y="382.4097" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ABA Solutions</text>
  <text x="696.7567" y="414.5543" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">- Tagged pointers</text>
  <text x="696.7567" y="439.7109" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">- Epoch reclamation</text>
  <text x="696.7567" y="464.8675" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">- Hazard pointers</text>
  <rect x="40" y="515.1807" width="1200" height="104.8193" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="550.1205" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory Ordering</text>
  <text x="185.9459" y="585.0603" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Relaxed: counters</text>
  <text x="445.4054" y="585.0603" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Acq/Rel: locks</text>
  <text x="753.5134" y="585.0603" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">AcqRel: CAS</text>
  <text x="1029.1891" y="585.0603" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">SeqCst: safest</text>
  <text x="640" y="613.0122" text-anchor="middle" font-size="14.8899" fill="var(--danger-accent)" font-family="Arial, sans-serif">When in doubt, use SeqCst</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.7798" font-weight="bold" fill="var(--text)">Lock-Free Queue Operations</text>
  <rect x="40" y="74.9399" width="567.5675" height="237.5904" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="109.8796" text-anchor="middle" font-size="20.8458" font-weight="bold" fill="var(--text)">Compare-And-Swap (CAS) Loop</text>
  <text x="64.3243" y="144.8193" font-size="14.8899" fill="var(--text-muted)">loop {</text>
  <text x="80.5405" y="169.976" font-size="14.8899" fill="var(--text-muted)">  let old = tail.load(Ordering::Acquire);</text>
  <text x="80.5405" y="195.1327" font-size="14.8899" fill="var(--text-muted)">  let new_node = Node::new(value);</text>
  <text x="80.5405" y="220.2892" font-size="14.8899" fill="var(--text-muted)">  match tail.compare_exchange(</text>
  <text x="96.7568" y="245.4458" font-size="14.8899" fill="var(--text-muted)">    old, new_node, ...)</text>
  <text x="80.5405" y="270.6025" font-size="14.8899" fill="var(--ok-accent)">  { Ok(_) =&gt; break,  // success!</text>
  <text x="80.5405" y="295.7591" font-size="14.8899" fill="var(--danger-accent)">    Err(_) =&gt; continue } // retry</text>
  <rect x="672.4324" y="74.9399" width="567.5675" height="237.5904" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2161" y="109.8796" text-anchor="middle" font-size="20.8458" font-weight="bold" fill="var(--ok-accent)">Enqueue Operation</text>
  <rect x="704.8648" y="137.8314" width="97.2972" height="48.9157" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="753.5134" y="168.5784" text-anchor="middle" font-size="14.8899" fill="var(--text)">A</text>
  <line x1="802.1621" y1="161.5904" x2="850.8108" y2="161.5904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="867.027" y="137.8314" width="97.2972" height="48.9157" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915.6757" y="168.5784" text-anchor="middle" font-size="14.8899" fill="var(--text)">B</text>
  <line x1="964.3242" y1="161.5904" x2="1012.9729" y2="161.5904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1029.1891" y="137.8314" width="97.2972" height="48.9157" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8378" y="168.5784" text-anchor="middle" font-size="14.8899" fill="var(--text)">C</text>
  <text x="1077.8378" y="207.7109" font-size="14.8899" fill="var(--warn-accent)">tail</text>
  <rect x="1029.1891" y="221.6868" width="97.2972" height="48.9157" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5.7528 2.8764" filter="url(#shadow)"/>
  <text x="1077.8378" y="252.4339" text-anchor="middle" font-size="14.8899" fill="var(--ok-accent)">D</text>
  <line x1="1077.8378" y1="186.747" x2="1077.8378" y2="221.6868" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1110.2702" y="214.6989" font-size="14.8899" fill="var(--ok-accent)">CAS</text>
  <text x="704.8648" y="298.5543" font-size="14.8899" fill="var(--text-muted)">1. Read tail  2. Create node  3. CAS tail.next  4. Update tail</text>
  <rect x="40" y="347.4699" width="567.5675" height="139.759" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="382.4097" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--danger-accent)">ABA Problem</text>
  <text x="64.3243" y="414.5543" font-size="14.8899" fill="var(--text-muted)">Thread 1 reads A, pauses</text>
  <text x="64.3243" y="439.7109" font-size="14.8899" fill="var(--text-muted)">Thread 2: A -&gt; B -&gt; A (same pointer!)</text>
  <text x="64.3243" y="464.8675" font-size="14.8899" fill="var(--danger-accent)">Thread 1 CAS succeeds but state changed!</text>
  <rect x="672.4324" y="347.4699" width="567.5675" height="139.759" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2161" y="382.4097" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--ok-accent)">ABA Solutions</text>
  <text x="696.7567" y="414.5543" font-size="14.8899" fill="var(--text-muted)">- Tagged pointers (generation counter)</text>
  <text x="696.7567" y="439.7109" font-size="14.8899" fill="var(--text-muted)">- Epoch-based reclamation (crossbeam)</text>
  <text x="696.7567" y="464.8675" font-size="14.8899" fill="var(--text-muted)">- Hazard pointers</text>
  <rect x="40" y="515.1807" width="1200" height="104.8193" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="550.1205" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--text)">Memory Ordering for Lock-Free Code</text>
  <text x="185.9459" y="585.0603" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)">Relaxed: counters</text>
  <text x="445.4054" y="585.0603" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)">Acquire/Release: locks</text>
  <text x="753.5134" y="585.0603" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)">AcqRel: CAS ops</text>
  <text x="1029.1891" y="585.0603" text-anchor="middle" font-size="14.8899" fill="var(--text-muted)">SeqCst: safest</text>
  <text x="640" y="613.0122" text-anchor="middle" font-size="14.8899" fill="var(--danger-accent)">When in doubt, use SeqCst. Optimize only with proof of correctness.</text>
</svg>
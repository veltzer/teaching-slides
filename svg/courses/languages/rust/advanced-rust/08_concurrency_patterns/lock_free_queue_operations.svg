<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="10.9565" refX="16" refY="5.4783" orient="auto">
      <polygon points="0,15.6522 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="46.9565" text-anchor="middle" font-size="31.3043" font-weight="bold" fill="#333">Lock-Free Queue Operations</text>
  <rect x="48" y="86.087" width="560" height="266.087" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1304" />
  <text x="328" y="125.2174" text-anchor="middle" font-size="21.913" font-weight="bold" fill="#333">Compare-And-Swap (CAS) Loop</text>
  <text x="72" y="164.3478" font-size="15.6522" fill="#555">loop {</text>
  <text x="88" y="192.5217" font-size="15.6522" fill="#555">  let old = tail.load(Ordering::Acquire);</text>
  <text x="88" y="220.6957" font-size="15.6522" fill="#555">  let new_node = Node::new(value);</text>
  <text x="88" y="248.8696" font-size="15.6522" fill="#555">  match tail.compare_exchange(</text>
  <text x="104" y="277.0435" font-size="15.6522" fill="#555">    old, new_node, ...)</text>
  <text x="88" y="305.2174" font-size="15.6522" fill="#28a745">  { Ok(_) =&gt; break,  // success!</text>
  <text x="88" y="333.3913" font-size="15.6522" fill="#dc3545">    Err(_) =&gt; continue } // retry</text>
  <rect x="672" y="86.087" width="560" height="266.087" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="3.1304" />
  <text x="952" y="125.2174" text-anchor="middle" font-size="21.913" font-weight="bold" fill="#28a745">Enqueue Operation</text>
  <rect x="704" y="156.5217" width="96" height="54.7826" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.3478" />
  <text x="752" y="190.9565" text-anchor="middle" font-size="15.6522" fill="#333">A</text>
  <line x1="800" y1="183.1304" x2="848" y2="183.1304" stroke="#4a90e2" stroke-width="2.3478" marker-end="url(#arrow)" />
  <rect x="864" y="156.5217" width="96" height="54.7826" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.3478" />
  <text x="912" y="190.9565" text-anchor="middle" font-size="15.6522" fill="#333">B</text>
  <line x1="960" y1="183.1304" x2="1008" y2="183.1304" stroke="#4a90e2" stroke-width="2.3478" marker-end="url(#arrow)" />
  <rect x="1024" y="156.5217" width="96" height="54.7826" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1304" />
  <text x="1072" y="190.9565" text-anchor="middle" font-size="15.6522" fill="#333">C</text>
  <text x="1072" y="234.7826" font-size="15.6522" fill="#ffc107">tail</text>
  <rect x="1024" y="250.4348" width="96" height="54.7826" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="3.1304" stroke-dasharray="6.2609 3.1304" />
  <text x="1072" y="284.8696" text-anchor="middle" font-size="15.6522" fill="#28a745">D</text>
  <line x1="1072" y1="211.3043" x2="1072" y2="250.4348" stroke="#28a745" stroke-width="2.3478" marker-end="url(#arrow)" />
  <text x="1104" y="242.6087" font-size="15.6522" fill="#28a745">CAS</text>
  <text x="704" y="336.5217" font-size="15.6522" fill="#555">1. Read tail  2. Create node  3. CAS tail.next  4. Update tail</text>
  <rect x="48" y="391.3043" width="560" height="156.5217" rx="7.8261" fill="#f8d7da" stroke="#dc3545" stroke-width="3.1304" />
  <text x="328" y="430.4348" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#dc3545">ABA Problem</text>
  <text x="72" y="466.4348" font-size="15.6522" fill="#555">Thread 1 reads A, pauses</text>
  <text x="72" y="494.6087" font-size="15.6522" fill="#555">Thread 2: A -&gt; B -&gt; A (same pointer!)</text>
  <text x="72" y="522.7826" font-size="15.6522" fill="#dc3545">Thread 1 CAS succeeds but state changed!</text>
  <rect x="672" y="391.3043" width="560" height="156.5217" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="3.1304" />
  <text x="952" y="430.4348" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#28a745">ABA Solutions</text>
  <text x="696" y="466.4348" font-size="15.6522" fill="#555">- Tagged pointers (generation counter)</text>
  <text x="696" y="494.6087" font-size="15.6522" fill="#555">- Epoch-based reclamation (crossbeam)</text>
  <text x="696" y="522.7826" font-size="15.6522" fill="#555">- Hazard pointers</text>
  <rect x="48" y="579.1304" width="1184" height="117.3913" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1304" />
  <text x="640" y="618.2609" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#333">Memory Ordering for Lock-Free Code</text>
  <text x="192" y="657.3913" text-anchor="middle" font-size="15.6522" fill="#555">Relaxed: counters</text>
  <text x="448" y="657.3913" text-anchor="middle" font-size="15.6522" fill="#555">Acquire/Release: locks</text>
  <text x="752" y="657.3913" text-anchor="middle" font-size="15.6522" fill="#555">AcqRel: CAS ops</text>
  <text x="1024" y="657.3913" text-anchor="middle" font-size="15.6522" fill="#555">SeqCst: safest</text>
  <text x="640" y="688.6957" text-anchor="middle" font-size="15.6522" fill="#dc3545">When in doubt, use SeqCst. Optimize only with proof of correctness.</text>
</svg>
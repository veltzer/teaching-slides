<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="567.5675" height="252.820619230797" rx="6.189321628002" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="77.179433974345" text-anchor="middle" font-size="21.503560132168" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CAS Loop</text>
  <text x="64.3243" y="114.35886794869" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">loop {</text>
  <text x="80.5405" y="141.128183846148" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">  old = tail.load(Acquire);</text>
  <text x="80.5405" y="167.897499743606" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">  node = Node::new(v);</text>
  <text x="80.5405" y="194.666602820496" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">  match tail.compare_exchange(</text>
  <text x="96.7568" y="221.43581230767" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">    old, node, ...)</text>
  <text x="80.5405" y="248.205128205128" font-size="15.359730018132" fill="var(--ok-accent)" font-family="Arial, sans-serif">  { Ok =&gt; break,</text>
  <text x="80.5405" y="274.974337692302" font-size="15.359730018132" fill="var(--danger-accent)" font-family="Arial, sans-serif">    Err =&gt; continue }</text>
  <rect x="672.4324" y="40" width="567.5675" height="252.820619230797" rx="6.189321628002" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2161" y="77.179433974345" text-anchor="middle" font-size="21.503560132168" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Enqueue Operation</text>
  <rect x="704.8648" y="106.923023717935" width="97.2972" height="52.051335256424" rx="6.189321628002" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="753.5134" y="139.64099371794" text-anchor="middle" font-size="15.359730018132" fill="var(--text)" font-family="Arial, sans-serif">A</text>
  <line x1="802.1621" y1="132.205043076901" x2="850.8108" y2="132.205043076901" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="867.027" y="106.923023717935" width="97.2972" height="52.051335256424" rx="6.189321628002" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915.6757" y="139.64099371794" text-anchor="middle" font-size="15.359730018132" fill="var(--text)" font-family="Arial, sans-serif">B</text>
  <line x1="964.3242" y1="132.205043076901" x2="1012.9729" y2="132.205043076901" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1029.1891" y="106.923023717935" width="97.2972" height="52.051335256424" rx="6.189321628002" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8378" y="139.64099371794" text-anchor="middle" font-size="15.359730018132" fill="var(--text)" font-family="Arial, sans-serif">C</text>
  <text x="1077.8378" y="181.281998076909" font-size="15.359730018132" fill="var(--warn-accent)" font-family="Arial, sans-serif">tail</text>
  <rect x="1029.1891" y="196.153792948704" width="97.2972" height="52.051335256424" rx="6.189321628002" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5.7528 2.8764" filter="url(#shadow)"/>
  <text x="1077.8378" y="228.871869358994" text-anchor="middle" font-size="15.359730018132" fill="var(--ok-accent)" font-family="Arial, sans-serif">D</text>
  <line x1="1077.8378" y1="158.974252564075" x2="1077.8378" y2="196.153792948704" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1110.2702" y="188.717948717949" font-size="15.359730018132" fill="var(--ok-accent)" font-family="Arial, sans-serif">CAS</text>
  <text x="704.8648" y="277.948717948718" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Read tail, create node, CAS tail.next, update tail</text>
  <rect x="40" y="329.999946794858" width="567.5675" height="148.717948717949" rx="6.189321628002" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="367.179487179487" text-anchor="middle" font-size="19.967576814819" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">ABA Problem</text>
  <text x="64.3243" y="401.384647307701" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">T1 reads A, pauses</text>
  <text x="64.3243" y="428.153856794875" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">T2: A→B→A (same pointer)</text>
  <text x="64.3243" y="454.923066282048" font-size="15.359730018132" fill="var(--danger-accent)" font-family="Arial, sans-serif">T1 CAS succeeds, state changed</text>
  <rect x="672.4324" y="329.999946794858" width="567.5675" height="148.717948717949" rx="6.189321628002" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2161" y="367.179487179487" text-anchor="middle" font-size="19.967576814819" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ABA Solutions</text>
  <text x="696.7567" y="401.384647307701" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">- Tagged pointers</text>
  <text x="696.7567" y="428.153856794875" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">- Epoch reclamation</text>
  <text x="696.7567" y="454.923066282048" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">- Hazard pointers</text>
  <rect x="40" y="508.461485256396" width="1200" height="111.538514743603" rx="6.189321628002" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="545.641025641026" text-anchor="middle" font-size="19.967576814819" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory Ordering</text>
  <text x="185.9459" y="582.820566025655" text-anchor="middle" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Relaxed: counters</text>
  <text x="445.4054" y="582.820566025655" text-anchor="middle" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Acq/Rel: locks</text>
  <text x="753.5134" y="582.820566025655" text-anchor="middle" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">AcqRel: CAS</text>
  <text x="1029.1891" y="582.820566025655" text-anchor="middle" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">SeqCst: safest</text>
  <text x="640" y="612.564262179528" text-anchor="middle" font-size="15.359730018132" fill="var(--danger-accent)" font-family="Arial, sans-serif">When in doubt, use SeqCst</text>
</svg>

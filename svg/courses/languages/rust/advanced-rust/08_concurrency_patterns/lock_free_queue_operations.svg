<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.065" y="43.146" text-anchor="middle" font-size="28.764" font-weight="bold" fill="var(--text-dark)">Lock-Free Queue Operations</text>
  <rect x="44.1049" y="79.1012" width="514.5568" height="244.4944" rx="7.191" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8764" />
  <text x="301.3833" y="115.0562" text-anchor="middle" font-size="20.1348" font-weight="bold" fill="var(--text-dark)">Compare-And-Swap (CAS) Loop</text>
  <text x="66.1573" y="151.0112" font-size="14.382" fill="var(--text-muted)">loop {</text>
  <text x="80.8589" y="176.8989" font-size="14.382" fill="var(--text-muted)">  let old = tail.load(Ordering::Acquire);</text>
  <text x="80.8589" y="202.7866" font-size="14.382" fill="var(--text-muted)">  let new_node = Node::new(value);</text>
  <text x="80.8589" y="228.6742" font-size="14.382" fill="var(--text-muted)">  match tail.compare_exchange(</text>
  <text x="95.5606" y="254.5618" font-size="14.382" fill="var(--text-muted)">    old, new_node, ...)</text>
  <text x="80.8589" y="280.4495" font-size="14.382" fill="var(--ok-bright)">  { Ok(_) =&gt; break,  // success!</text>
  <text x="80.8589" y="306.3371" font-size="14.382" fill="var(--danger-bright)">    Err(_) =&gt; continue } // retry</text>
  <rect x="617.4682" y="79.1012" width="514.5568" height="244.4944" rx="7.191" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8764" />
  <text x="874.7466" y="115.0562" text-anchor="middle" font-size="20.1348" font-weight="bold" fill="var(--ok-bright)">Enqueue Operation</text>
  <rect x="646.8714" y="143.8202" width="88.2097" height="50.3371" rx="7.191" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.1573" />
  <text x="690.9763" y="175.4607" text-anchor="middle" font-size="14.382" fill="var(--text-dark)">A</text>
  <line x1="735.0812" y1="168.2696" x2="779.1861" y2="168.2696" stroke="var(--primary-bright)" stroke-width="2.1573" marker-end="url(#arrow)" />
  <rect x="793.8877" y="143.8202" width="88.2097" height="50.3371" rx="7.191" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.1573" />
  <text x="837.9926" y="175.4607" text-anchor="middle" font-size="14.382" fill="var(--text-dark)">B</text>
  <line x1="882.0974" y1="168.2696" x2="926.2023" y2="168.2696" stroke="var(--primary-bright)" stroke-width="2.1573" marker-end="url(#arrow)" />
  <rect x="940.9039" y="143.8202" width="88.2097" height="50.3371" rx="7.191" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8764" />
  <text x="985.0088" y="175.4607" text-anchor="middle" font-size="14.382" fill="var(--text-dark)">C</text>
  <text x="985.0088" y="215.7303" font-size="14.382" fill="var(--warn-yellow)">tail</text>
  <rect x="940.9039" y="230.1124" width="88.2097" height="50.3371" rx="7.191" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8764" stroke-dasharray="5.7528 2.8764" />
  <text x="985.0088" y="261.7529" text-anchor="middle" font-size="14.382" fill="var(--ok-bright)">D</text>
  <line x1="985.0088" y1="194.1573" x2="985.0088" y2="230.1124" stroke="var(--ok-bright)" stroke-width="2.1573" marker-end="url(#arrow)" />
  <text x="1014.412" y="222.9214" font-size="14.382" fill="var(--ok-bright)">CAS</text>
  <text x="646.8714" y="309.2135" font-size="14.382" fill="var(--text-muted)">1. Read tail  2. Create node  3. CAS tail.next  4. Update tail</text>
  <rect x="44.1049" y="359.5505" width="514.5568" height="143.8202" rx="7.191" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.8764" />
  <text x="301.3833" y="395.5057" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--danger-bright)">ABA Problem</text>
  <text x="66.1573" y="428.5843" font-size="14.382" fill="var(--text-muted)">Thread 1 reads A, pauses</text>
  <text x="66.1573" y="454.4719" font-size="14.382" fill="var(--text-muted)">Thread 2: A -&gt; B -&gt; A (same pointer!)</text>
  <text x="66.1573" y="480.3596" font-size="14.382" fill="var(--danger-bright)">Thread 1 CAS succeeds but state changed!</text>
  <rect x="617.4682" y="359.5505" width="514.5568" height="143.8202" rx="7.191" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8764" />
  <text x="874.7466" y="395.5057" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--ok-bright)">ABA Solutions</text>
  <text x="639.5206" y="428.5843" font-size="14.382" fill="var(--text-muted)">- Tagged pointers (generation counter)</text>
  <text x="639.5206" y="454.4719" font-size="14.382" fill="var(--text-muted)">- Epoch-based reclamation (crossbeam)</text>
  <text x="639.5206" y="480.3596" font-size="14.382" fill="var(--text-muted)">- Hazard pointers</text>
  <rect x="44.1049" y="532.1348" width="1087.9202" height="107.8652" rx="7.191" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8764" />
  <text x="588.065" y="568.0899" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--text-dark)">Memory Ordering for Lock-Free Code</text>
  <text x="176.4195" y="604.045" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">Relaxed: counters</text>
  <text x="411.6455" y="604.045" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">Acquire/Release: locks</text>
  <text x="690.9763" y="604.045" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">AcqRel: CAS ops</text>
  <text x="940.9039" y="604.045" text-anchor="middle" font-size="14.382" fill="var(--text-muted)">SeqCst: safest</text>
  <text x="588.065" y="632.8091" text-anchor="middle" font-size="14.382" fill="var(--danger-bright)">When in doubt, use SeqCst. Optimize only with proof of correctness.</text>
</svg>
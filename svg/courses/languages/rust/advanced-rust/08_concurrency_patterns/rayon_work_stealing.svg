  <ns0:text x="301.6092" y="419.3103" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text-dark)">Rayon Parallel Iterators</ns0:text>
  <ns0:text x="66.2069" y="453.1494" font-size="14.7126" fill="var(--text-muted)">data.par_iter().map(|x| x * 2).sum()</ns0:text>
  <ns0:text x="66.2069" y="482.5747" font-size="14.7126" fill="var(--text-muted)">data.par_sort()</ns0:text>
  <ns0:text x="66.2069" y="500.2299" font-size="14.7126" fill="var(--ok-bright)">Just add .par_ prefix!</ns0:text>
  <ns0:rect x="617.931" y="382.5287" width="514.9425" height="132.4138" rx="7.3563" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9425" />
  <ns0:text x="875.4023" y="419.3103" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text-dark)">rayon::join</ns0:text>
  <ns0:text x="640" y="453.1494" font-size="14.7126" fill="var(--text-muted)">rayon::join(|| compute_a(),</ns0:text>
  <ns0:text x="640" y="479.6322" font-size="14.7126" fill="var(--text-muted)">            || compute_b());</ns0:text>
  <ns0:text x="640" y="500.2299" font-size="14.7126" fill="var(--text-muted)">Fork-join parallelism</ns0:text>
  <ns0:rect x="44.1379" y="544.3678" width="1088.7356" height="95.6322" rx="7.3563" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9425" />
  <ns0:text x="588.5057" y="581.1494" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text-dark)">Key Benefits</ns0:text>
  <ns0:text x="191.2644" y="617.931" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Automatic load balancing</ns0:text>
  <ns0:text x="500.2299" y="617.931" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">No manual thread management</ns0:text>
  <ns0:text x="823.908" y="617.931" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Cache-friendly (LIFO local)</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="11.2" refX="16" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">Rayon Work Stealing</text>
  <rect x="48" y="88" width="1184" height="288" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="640" y="128" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Rayon Thread Pool</text>
  <rect x="80" y="152" width="256" height="192" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="208" y="184" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Thread 1</text>
  <rect x="96" y="200" width="56" height="32" rx="3.2" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6" />
  <text x="123.2" y="222.4" text-anchor="middle" font-size="16" fill="#333">T1</text>
  <rect x="155.2" y="200" width="56" height="32" rx="3.2" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6" />
  <text x="182.4" y="222.4" text-anchor="middle" font-size="16" fill="#333">T2</text>
  <rect x="214.4" y="200" width="56" height="32" rx="3.2" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6" />
  <text x="241.6" y="222.4" text-anchor="middle" font-size="16" fill="#333">T3</text>
  <rect x="96" y="236.8" width="56" height="32" rx="3.2" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6" />
  <text x="123.2" y="259.2" text-anchor="middle" font-size="16" fill="#333">T4</text>
  <text x="208" y="304" text-anchor="middle" font-size="16" fill="#555">Local deque (full)</text>
  <rect x="384" y="152" width="256" height="192" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="512" y="184" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Thread 2</text>
  <rect x="400" y="200" width="56" height="32" rx="3.2" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6" />
  <text x="427.2" y="222.4" text-anchor="middle" font-size="16" fill="#333">T5</text>
  <text x="512" y="304" text-anchor="middle" font-size="16" fill="#555">Local deque</text>
  <rect x="688" y="152" width="256" height="192" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <text x="816" y="184" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Thread 3 (idle)</text>
  <text x="816" y="248" text-anchor="middle" font-size="16" fill="#dc3545">Empty deque!</text>
  <text x="816" y="304" text-anchor="middle" font-size="16" fill="#dc3545">Steals from Thread 1</text>
  <line x1="688" y1="232" x2="336" y2="216" stroke="#dc3545" stroke-width="3.2" stroke-dasharray="8 4.8" marker-end="url(#arrow)" />
  <text x="496" y="204.8" font-size="16" fill="#dc3545" font-weight="bold">STEAL</text>
  <rect x="992" y="152" width="208" height="192" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="1096" y="184" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#333">Thread N</text>
  <rect x="1008" y="200" width="56" height="32" rx="3.2" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6" />
  <text x="1035.2" y="222.4" text-anchor="middle" font-size="16" fill="#333">T6</text>
  <rect x="48" y="416" width="560" height="144" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="328" y="456" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Rayon Parallel Iterators</text>
  <text x="72" y="492.8" font-size="16" fill="#555">data.par_iter().map(|x| x * 2).sum()</text>
  <text x="72" y="524.8" font-size="16" fill="#555">data.par_sort()</text>
  <text x="72" y="544" font-size="16" fill="#28a745">Just add .par_ prefix!</text>
  <rect x="672" y="416" width="560" height="144" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="952" y="456" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">rayon::join</text>
  <text x="696" y="492.8" font-size="16" fill="#555">rayon::join(|| compute_a(),</text>
  <text x="696" y="521.6" font-size="16" fill="#555">            || compute_b());</text>
  <text x="696" y="544" font-size="16" fill="#555">Fork-join parallelism</text>
  <rect x="48" y="592" width="1184" height="104" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="640" y="632" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#333">Key Benefits</text>
  <text x="208" y="672" text-anchor="middle" font-size="16" fill="#555">Automatic load balancing</text>
  <text x="544" y="672" text-anchor="middle" font-size="16" fill="#555">No manual thread management</text>
  <text x="896" y="672" text-anchor="middle" font-size="16" fill="#555">Cache-friendly (LIFO local)</text>
</svg>
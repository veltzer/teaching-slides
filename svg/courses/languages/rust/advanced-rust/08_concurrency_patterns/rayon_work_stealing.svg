<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.4783" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Rayon Work Stealing</text>
  <rect x="40" y="75.8025" width="1200" height="257.7778" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="111.6049" text-anchor="middle" font-size="21.3348" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Rayon Thread Pool</text>
  <rect x="72.4324" y="133.0864" width="259.4595" height="171.8518" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.1622" y="161.7284" text-anchor="middle" font-size="16.7631" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Thread 1</text>
  <rect x="88.6487" y="176.0494" width="56.7568" height="28.642" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="116.2163" y="196.0987" text-anchor="middle" font-size="15.2391" fill="var(--text)" font-family="Arial, sans-serif">T1</text>
  <rect x="148.6486" y="176.0494" width="56.7568" height="28.642" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="176.2162" y="196.0987" text-anchor="middle" font-size="15.2391" fill="var(--text)" font-family="Arial, sans-serif">T2</text>
  <rect x="208.6487" y="176.0494" width="56.7568" height="28.642" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.2162" y="196.0987" text-anchor="middle" font-size="15.2391" fill="var(--text)" font-family="Arial, sans-serif">T3</text>
  <rect x="88.6487" y="208.9876" width="56.7568" height="28.642" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="116.2163" y="229.037" text-anchor="middle" font-size="15.2391" fill="var(--text)" font-family="Arial, sans-serif">T4</text>
  <text x="202.1622" y="269.1358" text-anchor="middle" font-size="15.2391" fill="var(--text-muted)" font-family="Arial, sans-serif">Local deque (full)</text>
  <rect x="380.5405" y="133.0864" width="259.4595" height="171.8518" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.2703" y="161.7284" text-anchor="middle" font-size="16.7631" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Thread 2</text>
  <rect x="396.7568" y="176.0494" width="56.7568" height="28.642" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="424.3244" y="196.0987" text-anchor="middle" font-size="15.2391" fill="var(--text)" font-family="Arial, sans-serif">T5</text>
  <text x="510.2703" y="269.1358" text-anchor="middle" font-size="15.2391" fill="var(--text-muted)" font-family="Arial, sans-serif">Local deque</text>
  <rect x="688.6487" y="133.0864" width="259.4595" height="171.8518" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="818.3784" y="161.7284" text-anchor="middle" font-size="16.7631" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Thread 3 (idle)</text>
  <text x="818.3784" y="219.0124" text-anchor="middle" font-size="15.2391" fill="var(--danger-accent)" font-family="Arial, sans-serif">Empty deque!</text>
  <text x="818.3784" y="269.1358" text-anchor="middle" font-size="15.2391" fill="var(--danger-accent)" font-family="Arial, sans-serif">Steals from Thread 1</text>
  <line x1="688.6487" y1="204.6913" x2="331.8919" y2="190.3704" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138" marker-end="url(#arrow)"/>
  <text x="494.0542" y="180.3457" font-size="15.2391" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">STEAL</text>
  <rect x="996.7568" y="133.0864" width="210.8109" height="171.8518" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1622" y="161.7284" text-anchor="middle" font-size="16.7631" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Thread N</text>
  <rect x="1012.9731" y="176.0494" width="56.7568" height="28.642" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040.5406" y="196.0987" text-anchor="middle" font-size="15.2391" fill="var(--text)" font-family="Arial, sans-serif">T6</text>
  <rect x="40" y="369.3827" width="567.5676" height="128.8889" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="405.1852" text-anchor="middle" font-size="19.8109" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Rayon Parallel Iterators</text>
  <text x="64.3244" y="438.1234" font-size="15.2391" fill="var(--text-muted)" font-family="Arial, sans-serif">data.par_iter().map(|x| x * 2).sum()</text>
  <text x="64.3244" y="466.7654" font-size="15.2391" fill="var(--text-muted)" font-family="Arial, sans-serif">data.par_sort()</text>
  <text x="64.3244" y="483.9506" font-size="15.2391" fill="var(--ok-accent)" font-family="Arial, sans-serif">Just add .par_ prefix!</text>
  <rect x="672.4324" y="369.3827" width="567.5676" height="128.8889" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2163" y="405.1852" text-anchor="middle" font-size="19.8109" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">rayon::join</text>
  <text x="696.7568" y="438.1234" font-size="15.2391" fill="var(--text-muted)" font-family="Arial, sans-serif">rayon::join(|| compute_a(),</text>
  <text x="696.7568" y="463.9013" font-size="15.2391" fill="var(--text-muted)" font-family="Arial, sans-serif">            || compute_b());</text>
  <text x="696.7568" y="483.9506" font-size="15.2391" fill="var(--text-muted)" font-family="Arial, sans-serif">Fork-join parallelism</text>
  <rect x="40" y="526.9136" width="1200" height="93.0864" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="562.716" text-anchor="middle" font-size="19.8109" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Benefits</text>
  <text x="202.1622" y="598.5185" text-anchor="middle" font-size="15.2391" fill="var(--text-muted)" font-family="Arial, sans-serif">Automatic load balancing</text>
  <text x="542.7028" y="598.5185" text-anchor="middle" font-size="15.2391" fill="var(--text-muted)" font-family="Arial, sans-serif">No manual thread management</text>
  <text x="899.4595" y="598.5185" text-anchor="middle" font-size="15.2391" fill="var(--text-muted)" font-family="Arial, sans-serif">Cache-friendly (LIFO local)</text>
</svg>

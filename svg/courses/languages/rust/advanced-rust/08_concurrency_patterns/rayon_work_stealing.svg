<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.5057" y="44.1379" text-anchor="middle" font-size="29.4253" font-weight="bold" fill="var(--text)">Rayon Work Stealing</text>
  <rect x="44.1379" y="80.9195" width="1088.7356" height="264.8276" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="588.5057" y="117.7011" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="var(--text)">Rayon Thread Pool</text>
  <rect x="73.5632" y="139.7701" width="235.4023" height="176.5517" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="191.2644" y="169.1954" text-anchor="middle" font-size="16.1839" font-weight="bold" fill="var(--text)">Thread 1</text>
  <rect x="88.2759" y="183.908" width="51.4943" height="29.4253" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="113.2874" y="204.5057" text-anchor="middle" font-size="14.7126" fill="var(--text)">T1</text>
  <rect x="142.7126" y="183.908" width="51.4943" height="29.4253" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="167.7241" y="204.5057" text-anchor="middle" font-size="14.7126" fill="var(--text)">T2</text>
  <rect x="197.1494" y="183.908" width="51.4943" height="29.4253" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="222.1609" y="204.5057" text-anchor="middle" font-size="14.7126" fill="var(--text)">T3</text>
  <rect x="88.2759" y="217.7471" width="51.4943" height="29.4253" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="113.2874" y="238.3448" text-anchor="middle" font-size="14.7126" fill="var(--text)">T4</text>
  <text x="191.2644" y="279.5402" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Local deque (full)</text>
  <rect x="353.1034" y="139.7701" width="235.4023" height="176.5517" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="470.8046" y="169.1954" text-anchor="middle" font-size="16.1839" font-weight="bold" fill="var(--text)">Thread 2</text>
  <rect x="367.8161" y="183.908" width="51.4943" height="29.4253" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="392.8276" y="204.5057" text-anchor="middle" font-size="14.7126" fill="var(--text)">T5</text>
  <text x="470.8046" y="279.5402" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Local deque</text>
  <rect x="632.6437" y="139.7701" width="235.4023" height="176.5517" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="750.3448" y="169.1954" text-anchor="middle" font-size="16.1839" font-weight="bold" fill="var(--text)">Thread 3 (idle)</text>
  <text x="750.3448" y="228.046" text-anchor="middle" font-size="14.7126" fill="var(--danger-accent)">Empty deque!</text>
  <text x="750.3448" y="279.5402" text-anchor="middle" font-size="14.7126" fill="var(--danger-accent)">Steals from Thread 1</text>
  <line x1="632.6437" y1="213.3333" x2="308.9655" y2="198.6207" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138" marker-end="url(#arrow)" />
  <text x="456.092" y="188.3218" font-size="14.7126" fill="var(--danger-accent)" font-weight="bold">STEAL</text>
  <rect x="912.1839" y="139.7701" width="191.2644" height="176.5517" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1007.8161" y="169.1954" text-anchor="middle" font-size="16.1839" font-weight="bold" fill="var(--text)">Thread N</text>
  <rect x="926.8966" y="183.908" width="51.4943" height="29.4253" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="951.908" y="204.5057" text-anchor="middle" font-size="14.7126" fill="var(--text)">T6</text>
  <rect x="44.1379" y="382.5287" width="514.9425" height="132.4138" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="301.6092" y="419.3103" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text)">Rayon Parallel Iterators</text>
  <text x="66.2069" y="453.1494" font-size="14.7126" fill="var(--text-muted)">data.par_iter().map(|x| x * 2).sum()</text>
  <text x="66.2069" y="482.5747" font-size="14.7126" fill="var(--text-muted)">data.par_sort()</text>
  <text x="66.2069" y="500.2299" font-size="14.7126" fill="var(--ok-accent)">Just add .par_ prefix!</text>
  <rect x="617.931" y="382.5287" width="514.9425" height="132.4138" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="875.4023" y="419.3103" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text)">rayon::join</text>
  <text x="640" y="453.1494" font-size="14.7126" fill="var(--text-muted)">rayon::join(|| compute_a(),</text>
  <text x="640" y="479.6322" font-size="14.7126" fill="var(--text-muted)">            || compute_b());</text>
  <text x="640" y="500.2299" font-size="14.7126" fill="var(--text-muted)">Fork-join parallelism</text>
  <rect x="44.1379" y="544.3678" width="1088.7356" height="95.6322" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="588.5057" y="581.1494" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--text)">Key Benefits</text>
  <text x="191.2644" y="617.931" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Automatic load balancing</text>
  <text x="500.2299" y="617.931" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">No manual thread management</text>
  <text x="823.908" y="617.931" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">Cache-friendly (LIFO local)</text>
</svg>
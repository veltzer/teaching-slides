<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </ns0:defs>
  <ns0:text x="588.5057" y="44.1379" text-anchor="middle" font-size="29.4253" font-weight="bold" fill="#333">Rayon Work Stealing</ns0:text>
  <ns0:rect x="44.1379" y="80.9195" width="1088.7356" height="264.8276" rx="7.3563" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9425" />
  <ns0:text x="588.5057" y="117.7011" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="#333">Rayon Thread Pool</ns0:text>
  <ns0:rect x="73.5632" y="139.7701" width="235.4023" height="176.5517" rx="7.3563" fill="#d4edda" stroke="#28a745" stroke-width="2.2069" />
  <ns0:text x="191.2644" y="169.1954" text-anchor="middle" font-size="16.1839" font-weight="bold" fill="#333">Thread 1</ns0:text>
  <ns0:rect x="88.2759" y="183.908" width="51.4943" height="29.4253" rx="2.9425" fill="#fff3cd" stroke="#ffc107" stroke-width="1.4713" />
  <ns0:text x="113.2874" y="204.5057" text-anchor="middle" font-size="14.7126" fill="#333">T1</ns0:text>
  <ns0:rect x="142.7126" y="183.908" width="51.4943" height="29.4253" rx="2.9425" fill="#fff3cd" stroke="#ffc107" stroke-width="1.4713" />
  <ns0:text x="167.7241" y="204.5057" text-anchor="middle" font-size="14.7126" fill="#333">T2</ns0:text>
  <ns0:rect x="197.1494" y="183.908" width="51.4943" height="29.4253" rx="2.9425" fill="#fff3cd" stroke="#ffc107" stroke-width="1.4713" />
  <ns0:text x="222.1609" y="204.5057" text-anchor="middle" font-size="14.7126" fill="#333">T3</ns0:text>
  <ns0:rect x="88.2759" y="217.7471" width="51.4943" height="29.4253" rx="2.9425" fill="#fff3cd" stroke="#ffc107" stroke-width="1.4713" />
  <ns0:text x="113.2874" y="238.3448" text-anchor="middle" font-size="14.7126" fill="#333">T4</ns0:text>
  <ns0:text x="191.2644" y="279.5402" text-anchor="middle" font-size="14.7126" fill="#555">Local deque (full)</ns0:text>
  <ns0:rect x="353.1034" y="139.7701" width="235.4023" height="176.5517" rx="7.3563" fill="#d4edda" stroke="#28a745" stroke-width="2.2069" />
  <ns0:text x="470.8046" y="169.1954" text-anchor="middle" font-size="16.1839" font-weight="bold" fill="#333">Thread 2</ns0:text>
  <ns0:rect x="367.8161" y="183.908" width="51.4943" height="29.4253" rx="2.9425" fill="#fff3cd" stroke="#ffc107" stroke-width="1.4713" />
  <ns0:text x="392.8276" y="204.5057" text-anchor="middle" font-size="14.7126" fill="#333">T5</ns0:text>
  <ns0:text x="470.8046" y="279.5402" text-anchor="middle" font-size="14.7126" fill="#555">Local deque</ns0:text>
  <ns0:rect x="632.6437" y="139.7701" width="235.4023" height="176.5517" rx="7.3563" fill="#f8d7da" stroke="#dc3545" stroke-width="2.2069" />
  <ns0:text x="750.3448" y="169.1954" text-anchor="middle" font-size="16.1839" font-weight="bold" fill="#333">Thread 3 (idle)</ns0:text>
  <ns0:text x="750.3448" y="228.046" text-anchor="middle" font-size="14.7126" fill="#dc3545">Empty deque!</ns0:text>
  <ns0:text x="750.3448" y="279.5402" text-anchor="middle" font-size="14.7126" fill="#dc3545">Steals from Thread 1</ns0:text>
  <ns0:line x1="632.6437" y1="213.3333" x2="308.9655" y2="198.6207" stroke="#dc3545" stroke-width="2.9425" stroke-dasharray="7.3563 4.4138" marker-end="url(#arrow)" />
  <ns0:text x="456.092" y="188.3218" font-size="14.7126" fill="#dc3545" font-weight="bold">STEAL</ns0:text>
  <ns0:rect x="912.1839" y="139.7701" width="191.2644" height="176.5517" rx="7.3563" fill="#d4edda" stroke="#28a745" stroke-width="2.2069" />
  <ns0:text x="1007.8161" y="169.1954" text-anchor="middle" font-size="16.1839" font-weight="bold" fill="#333">Thread N</ns0:text>
  <ns0:rect x="926.8966" y="183.908" width="51.4943" height="29.4253" rx="2.9425" fill="#fff3cd" stroke="#ffc107" stroke-width="1.4713" />
  <ns0:text x="951.908" y="204.5057" text-anchor="middle" font-size="14.7126" fill="#333">T6</ns0:text>
  <ns0:rect x="44.1379" y="382.5287" width="514.9425" height="132.4138" rx="7.3563" fill="#d4edda" stroke="#28a745" stroke-width="2.9425" />
  <ns0:text x="301.6092" y="419.3103" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">Rayon Parallel Iterators</ns0:text>
  <ns0:text x="66.2069" y="453.1494" font-size="14.7126" fill="#555">data.par_iter().map(|x| x * 2).sum()</ns0:text>
  <ns0:text x="66.2069" y="482.5747" font-size="14.7126" fill="#555">data.par_sort()</ns0:text>
  <ns0:text x="66.2069" y="500.2299" font-size="14.7126" fill="#28a745">Just add .par_ prefix!</ns0:text>
  <ns0:rect x="617.931" y="382.5287" width="514.9425" height="132.4138" rx="7.3563" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9425" />
  <ns0:text x="875.4023" y="419.3103" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">rayon::join</ns0:text>
  <ns0:text x="640" y="453.1494" font-size="14.7126" fill="#555">rayon::join(|| compute_a(),</ns0:text>
  <ns0:text x="640" y="479.6322" font-size="14.7126" fill="#555">            || compute_b());</ns0:text>
  <ns0:text x="640" y="500.2299" font-size="14.7126" fill="#555">Fork-join parallelism</ns0:text>
  <ns0:rect x="44.1379" y="544.3678" width="1088.7356" height="95.6322" rx="7.3563" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9425" />
  <ns0:text x="588.5057" y="581.1494" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">Key Benefits</ns0:text>
  <ns0:text x="191.2644" y="617.931" text-anchor="middle" font-size="14.7126" fill="#555">Automatic load balancing</ns0:text>
  <ns0:text x="500.2299" y="617.931" text-anchor="middle" font-size="14.7126" fill="#555">No manual thread management</ns0:text>
  <ns0:text x="823.908" y="617.931" text-anchor="middle" font-size="14.7126" fill="#555">Cache-friendly (LIFO local)</ns0:text>
</ns0:svg>
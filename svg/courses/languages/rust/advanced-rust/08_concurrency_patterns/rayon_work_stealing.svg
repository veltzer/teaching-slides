  <ns0:text x="301.6092" y="419.3103" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">Rayon Parallel Iterators</ns0:text>
  <ns0:text x="66.2069" y="453.1494" font-size="14.7126" fill="#555">data.par_iter().map(|x| x * 2).sum()</ns0:text>
  <ns0:text x="66.2069" y="482.5747" font-size="14.7126" fill="#555">data.par_sort()</ns0:text>
  <ns0:text x="66.2069" y="500.2299" font-size="14.7126" fill="#28a745">Just add .par_ prefix!</ns0:text>
  <ns0:rect x="617.931" y="382.5287" width="514.9425" height="132.4138" rx="7.3563" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9425" />
  <ns0:text x="875.4023" y="419.3103" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">rayon::join</ns0:text>
  <ns0:text x="640" y="453.1494" font-size="14.7126" fill="#555">rayon::join(|| compute_a(),</ns0:text>
  <ns0:text x="640" y="479.6322" font-size="14.7126" fill="#555">            || compute_b());</ns0:text>
  <ns0:text x="640" y="500.2299" font-size="14.7126" fill="#555">Fork-join parallelism</ns0:text>
  <ns0:rect x="44.1379" y="544.3678" width="1088.7356" height="95.6322" rx="7.3563" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9425" />
  <ns0:text x="588.5057" y="581.1494" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#333">Key Benefits</ns0:text>
  <ns0:text x="191.2644" y="617.931" text-anchor="middle" font-size="14.7126" fill="#555">Automatic load balancing</ns0:text>
  <ns0:text x="500.2299" y="617.931" text-anchor="middle" font-size="14.7126" fill="#555">No manual thread management</ns0:text>
  <ns0:text x="823.908" y="617.931" text-anchor="middle" font-size="14.7126" fill="#555">Cache-friendly (LIFO local)</ns0:text>

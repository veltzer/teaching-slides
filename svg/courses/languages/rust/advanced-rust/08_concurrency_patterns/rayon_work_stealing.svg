<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.4783" font-weight="bold" fill="var(--text)">Rayon Work Stealing</text>
  <rect x="40" y="75.8025" width="1200" height="257.7778" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="111.6049" text-anchor="middle" font-size="21.3348" font-weight="bold" fill="var(--text)">Rayon Thread Pool</text>
  <rect x="72.4324" y="133.0864" width="259.4595" height="171.8518" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="202.1622" y="161.7284" text-anchor="middle" font-size="16.7631" font-weight="bold" fill="var(--text)">Thread 1</text>
  <rect x="88.6487" y="176.0494" width="56.7568" height="28.642" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="116.2163" y="196.0987" text-anchor="middle" font-size="15.2391" fill="var(--text)">T1</text>
  <rect x="148.6486" y="176.0494" width="56.7568" height="28.642" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="176.2162" y="196.0987" text-anchor="middle" font-size="15.2391" fill="var(--text)">T2</text>
  <rect x="208.6487" y="176.0494" width="56.7568" height="28.642" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="236.2162" y="196.0987" text-anchor="middle" font-size="15.2391" fill="var(--text)">T3</text>
  <rect x="88.6487" y="208.9876" width="56.7568" height="28.642" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="116.2163" y="229.037" text-anchor="middle" font-size="15.2391" fill="var(--text)">T4</text>
  <text x="202.1622" y="269.1358" text-anchor="middle" font-size="15.2391" fill="var(--text-muted)">Local deque (full)</text>
  <rect x="380.5405" y="133.0864" width="259.4595" height="171.8518" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="510.2703" y="161.7284" text-anchor="middle" font-size="16.7631" font-weight="bold" fill="var(--text)">Thread 2</text>
  <rect x="396.7568" y="176.0494" width="56.7568" height="28.642" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="424.3244" y="196.0987" text-anchor="middle" font-size="15.2391" fill="var(--text)">T5</text>
  <text x="510.2703" y="269.1358" text-anchor="middle" font-size="15.2391" fill="var(--text-muted)">Local deque</text>
  <rect x="688.6487" y="133.0864" width="259.4595" height="171.8518" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="818.3784" y="161.7284" text-anchor="middle" font-size="16.7631" font-weight="bold" fill="var(--text)">Thread 3 (idle)</text>
  <text x="818.3784" y="219.0124" text-anchor="middle" font-size="15.2391" fill="var(--danger-accent)">Empty deque!</text>
  <text x="818.3784" y="269.1358" text-anchor="middle" font-size="15.2391" fill="var(--danger-accent)">Steals from Thread 1</text>
  <line x1="688.6487" y1="204.6913" x2="331.8919" y2="190.3704" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.3563 4.4138" marker-end="url(#arrow)" />
  <text x="494.0542" y="180.3457" font-size="15.2391" fill="var(--danger-accent)" font-weight="bold">STEAL</text>
  <rect x="996.7568" y="133.0864" width="210.8109" height="171.8518" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1102.1622" y="161.7284" text-anchor="middle" font-size="16.7631" font-weight="bold" fill="var(--text)">Thread N</text>
  <rect x="1012.9731" y="176.0494" width="56.7568" height="28.642" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1040.5406" y="196.0987" text-anchor="middle" font-size="15.2391" fill="var(--text)">T6</text>
  <rect x="40" y="369.3827" width="567.5676" height="128.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="323.7838" y="405.1852" text-anchor="middle" font-size="19.8109" font-weight="bold" fill="var(--text)">Rayon Parallel Iterators</text>
  <text x="64.3244" y="438.1234" font-size="15.2391" fill="var(--text-muted)">data.par_iter().map(|x| x * 2).sum()</text>
  <text x="64.3244" y="466.7654" font-size="15.2391" fill="var(--text-muted)">data.par_sort()</text>
  <text x="64.3244" y="483.9506" font-size="15.2391" fill="var(--ok-accent)">Just add .par_ prefix!</text>
  <rect x="672.4324" y="369.3827" width="567.5676" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="956.2163" y="405.1852" text-anchor="middle" font-size="19.8109" font-weight="bold" fill="var(--text)">rayon::join</text>
  <text x="696.7568" y="438.1234" font-size="15.2391" fill="var(--text-muted)">rayon::join(|| compute_a(),</text>
  <text x="696.7568" y="463.9013" font-size="15.2391" fill="var(--text-muted)">            || compute_b());</text>
  <text x="696.7568" y="483.9506" font-size="15.2391" fill="var(--text-muted)">Fork-join parallelism</text>
  <rect x="40" y="526.9136" width="1200" height="93.0864" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="562.716" text-anchor="middle" font-size="19.8109" font-weight="bold" fill="var(--text)">Key Benefits</text>
  <text x="202.1622" y="598.5185" text-anchor="middle" font-size="15.2391" fill="var(--text-muted)">Automatic load balancing</text>
  <text x="542.7028" y="598.5185" text-anchor="middle" font-size="15.2391" fill="var(--text-muted)">No manual thread management</text>
  <text x="899.4595" y="598.5185" text-anchor="middle" font-size="15.2391" fill="var(--text-muted)">Cache-friendly (LIFO local)</text>
</svg>
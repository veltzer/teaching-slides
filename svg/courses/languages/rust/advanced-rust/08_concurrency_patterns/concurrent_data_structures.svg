<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="29.7798" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Concurrent Data Structures</text>
  <rect x="40" y="74.9399" width="372.9729" height="181.6867" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="109.8796" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Mutex&lt;T&gt;</text>
  <text x="64.3243" y="137.8314" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Exclusive</text>
  <text x="64.3243" y="162.988" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">lock()</text>
  <text x="64.3243" y="188.1446" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">RAII</text>
  <text x="64.3243" y="213.3013" font-size="14.8899" fill="var(--danger-accent)" font-family="Arial, sans-serif">Deadlocks</text>
  <text x="64.3243" y="241.2531" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Writes</text>
  <rect x="453.5135" y="74.9399" width="372.9729" height="181.6867" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="109.8796" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">RwLock&lt;T&gt;</text>
  <text x="477.8378" y="137.8314" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">N readers, 1 writer</text>
  <text x="477.8378" y="162.988" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">read()</text>
  <text x="477.8378" y="188.1446" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">write()</text>
  <text x="477.8378" y="213.3013" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Slower</text>
  <text x="477.8378" y="241.2531" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Reads</text>
  <rect x="867.027" y="74.9399" width="372.9729" height="181.6867" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="109.8796" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Atomics</text>
  <text x="891.3513" y="137.8314" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">AtomicBool, AtomicUsize</text>
  <text x="891.3513" y="162.988" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Lock-free</text>
  <text x="891.3513" y="188.1446" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">load, store, CAS</text>
  <text x="891.3513" y="213.3013" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Relaxed..SeqCst</text>
  <text x="891.3513" y="241.2531" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">For flags</text>
  <rect x="40" y="291.5663" width="372.9729" height="139.759" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="326.5061" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Arc&lt;T&gt;</text>
  <text x="64.3243" y="358.6507" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Atomic refcount</text>
  <text x="64.3243" y="383.8072" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Shared across threads</text>
  <text x="64.3243" y="408.9639" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Arc&lt;Mutex&gt; = mutable</text>
  <rect x="453.5135" y="291.5663" width="372.9729" height="139.759" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="326.5061" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">DashMap&lt;K, V&gt;</text>
  <text x="477.8378" y="358.6507" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Concurrent HashMap</text>
  <text x="477.8378" y="383.8072" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Sharded</text>
  <text x="477.8378" y="408.9639" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Faster than Mutex&lt;HashMap&gt;</text>
  <rect x="867.027" y="291.5663" width="372.9729" height="139.759" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="326.5061" text-anchor="middle" font-size="19.3568" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">crossbeam</text>
  <text x="891.3513" y="358.6507" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">SegQueue: lock-free</text>
  <text x="891.3513" y="383.8072" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">ArrayQueue: bounded</text>
  <text x="891.3513" y="408.9639" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Epoch GC</text>
  <rect x="40" y="466.2651" width="1200" height="153.7349" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="501.2049" text-anchor="middle" font-size="20.8458" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Guide</text>
  <text x="64.3243" y="536.1446" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Counter/flag -&gt; Atomic</text>
  <text x="64.3243" y="561.3012" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">State -&gt; Arc&lt;Mutex&gt; or Arc&lt;RwLock&gt;</text>
  <text x="64.3243" y="586.4579" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Map -&gt; DashMap</text>
  <text x="64.3243" y="611.6145" font-size="14.8899" fill="var(--text-muted)" font-family="Arial, sans-serif">Queue -&gt; crossbeam</text>
</svg>

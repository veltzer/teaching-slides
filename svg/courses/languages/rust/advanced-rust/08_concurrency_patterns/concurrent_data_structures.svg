<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="10.9565" refX="16" refY="5.4783" orient="auto">
      <polygon points="0,15.6522 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="46.9565" text-anchor="middle" font-size="31.3043" font-weight="bold" fill="#333">Concurrent Data Structures</text>
  <rect x="48" y="86.087" width="368" height="203.4783" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1304" />
  <text x="232" y="125.2174" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#4a90e2">Mutex&lt;T&gt;</text>
  <text x="72" y="156.5217" font-size="15.6522" fill="#555">Exclusive access</text>
  <text x="72" y="184.6957" font-size="15.6522" fill="#555">lock() -&gt; MutexGuard&lt;T&gt;</text>
  <text x="72" y="212.8696" font-size="15.6522" fill="#555">RAII: auto-unlock on drop</text>
  <text x="72" y="241.0435" font-size="15.6522" fill="#dc3545">Can deadlock if nested!</text>
  <text x="72" y="272.3478" font-size="15.6522" fill="#555">Use when: writes common</text>
  <rect x="456" y="86.087" width="368" height="203.4783" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="3.1304" />
  <text x="640" y="125.2174" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#28a745">RwLock&lt;T&gt;</text>
  <text x="480" y="156.5217" font-size="15.6522" fill="#555">Multiple readers OR one writer</text>
  <text x="480" y="184.6957" font-size="15.6522" fill="#555">read() -&gt; RwLockReadGuard</text>
  <text x="480" y="212.8696" font-size="15.6522" fill="#555">write() -&gt; RwLockWriteGuard</text>
  <text x="480" y="241.0435" font-size="15.6522" fill="#555">More overhead than Mutex</text>
  <text x="480" y="272.3478" font-size="15.6522" fill="#555">Use when: reads &gt;&gt; writes</text>
  <rect x="864" y="86.087" width="368" height="203.4783" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1304" />
  <text x="1048" y="125.2174" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#333">Atomics</text>
  <text x="888" y="156.5217" font-size="15.6522" fill="#555">AtomicBool, AtomicUsize, ...</text>
  <text x="888" y="184.6957" font-size="15.6522" fill="#555">Lock-free operations</text>
  <text x="888" y="212.8696" font-size="15.6522" fill="#555">load, store, CAS</text>
  <text x="888" y="241.0435" font-size="15.6522" fill="#555">Ordering: Relaxed..SeqCst</text>
  <text x="888" y="272.3478" font-size="15.6522" fill="#555">Use when: simple counters/flags</text>
  <rect x="48" y="328.6957" width="368" height="156.5217" rx="7.8261" fill="#d4edda" stroke="#28a745" stroke-width="3.1304" />
  <text x="232" y="367.8261" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#28a745">Arc&lt;T&gt;</text>
  <text x="72" y="403.8261" font-size="15.6522" fill="#555">Atomic Reference Counting</text>
  <text x="72" y="432" font-size="15.6522" fill="#555">Shared ownership across threads</text>
  <text x="72" y="460.1739" font-size="15.6522" fill="#555">Arc&lt;Mutex&lt;T&gt;&gt; = shared mutable</text>
  <rect x="456" y="328.6957" width="368" height="156.5217" rx="7.8261" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.1304" />
  <text x="640" y="367.8261" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#4a90e2">DashMap&lt;K, V&gt;</text>
  <text x="480" y="403.8261" font-size="15.6522" fill="#555">Concurrent HashMap</text>
  <text x="480" y="432" font-size="15.6522" fill="#555">Sharded internally</text>
  <text x="480" y="460.1739" font-size="15.6522" fill="#555">Much faster than Mutex&lt;HashMap&gt;</text>
  <rect x="864" y="328.6957" width="368" height="156.5217" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1304" />
  <text x="1048" y="367.8261" text-anchor="middle" font-size="20.3478" font-weight="bold" fill="#333">crossbeam</text>
  <text x="888" y="403.8261" font-size="15.6522" fill="#555">SegQueue - lock-free queue</text>
  <text x="888" y="432" font-size="15.6522" fill="#555">ArrayQueue - bounded</text>
  <text x="888" y="460.1739" font-size="15.6522" fill="#555">Epoch-based GC for safety</text>
  <rect x="48" y="524.3478" width="1184" height="172.1739" rx="7.8261" fill="#fff3cd" stroke="#ffc107" stroke-width="3.1304" />
  <text x="640" y="563.4783" text-anchor="middle" font-size="21.913" font-weight="bold" fill="#333">Selection Guide</text>
  <text x="72" y="602.6087" font-size="15.6522" fill="#555">Simple counter/flag -&gt; AtomicUsize / AtomicBool</text>
  <text x="72" y="630.7826" font-size="15.6522" fill="#555">Shared complex state -&gt; Arc&lt;Mutex&lt;T&gt;&gt; (or Arc&lt;RwLock&lt;T&gt;&gt; for read-heavy)</text>
  <text x="72" y="658.9565" font-size="15.6522" fill="#555">Concurrent map -&gt; DashMap (or flurry for Java-style ConcurrentHashMap)</text>
  <text x="72" y="687.1304" font-size="15.6522" fill="#555">Lock-free queue -&gt; crossbeam::SegQueue or crossbeam::ArrayQueue</text>
</svg>
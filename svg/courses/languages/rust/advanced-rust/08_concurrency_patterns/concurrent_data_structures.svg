<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Concurrent Data Structures</text>
  <!-- Mutex -->
  <rect x="30" y="55" width="230" height="130" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="145" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Mutex&lt;T&gt;</text>
  <text x="45" y="100" font-size="10" fill="#555">Exclusive access</text>
  <text x="45" y="118" font-size="10" fill="#555">lock() -&gt; MutexGuard&lt;T&gt;</text>
  <text x="45" y="136" font-size="10" fill="#555">RAII: auto-unlock on drop</text>
  <text x="45" y="154" font-size="10" fill="#dc3545">Can deadlock if nested!</text>
  <text x="45" y="174" font-size="10" fill="#555">Use when: writes common</text>
  <!-- RwLock -->
  <rect x="285" y="55" width="230" height="130" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">RwLock&lt;T&gt;</text>
  <text x="300" y="100" font-size="10" fill="#555">Multiple readers OR one writer</text>
  <text x="300" y="118" font-size="10" fill="#555">read() -&gt; RwLockReadGuard</text>
  <text x="300" y="136" font-size="10" fill="#555">write() -&gt; RwLockWriteGuard</text>
  <text x="300" y="154" font-size="10" fill="#555">More overhead than Mutex</text>
  <text x="300" y="174" font-size="10" fill="#555">Use when: reads &gt;&gt; writes</text>
  <!-- Atomic -->
  <rect x="540" y="55" width="230" height="130" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="655" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Atomics</text>
  <text x="555" y="100" font-size="10" fill="#555">AtomicBool, AtomicUsize, ...</text>
  <text x="555" y="118" font-size="10" fill="#555">Lock-free operations</text>
  <text x="555" y="136" font-size="10" fill="#555">load, store, CAS</text>
  <text x="555" y="154" font-size="10" fill="#555">Ordering: Relaxed..SeqCst</text>
  <text x="555" y="174" font-size="10" fill="#555">Use when: simple counters/flags</text>
  <!-- Arc -->
  <rect x="30" y="210" width="230" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="145" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Arc&lt;T&gt;</text>
  <text x="45" y="258" font-size="10" fill="#555">Atomic Reference Counting</text>
  <text x="45" y="276" font-size="10" fill="#555">Shared ownership across threads</text>
  <text x="45" y="294" font-size="10" fill="#555">Arc&lt;Mutex&lt;T&gt;&gt; = shared mutable</text>
  <!-- DashMap -->
  <rect x="285" y="210" width="230" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">DashMap&lt;K, V&gt;</text>
  <text x="300" y="258" font-size="10" fill="#555">Concurrent HashMap</text>
  <text x="300" y="276" font-size="10" fill="#555">Sharded internally</text>
  <text x="300" y="294" font-size="10" fill="#555">Much faster than Mutex&lt;HashMap&gt;</text>
  <!-- Crossbeam structures -->
  <rect x="540" y="210" width="230" height="100" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="655" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">crossbeam</text>
  <text x="555" y="258" font-size="10" fill="#555">SegQueue - lock-free queue</text>
  <text x="555" y="276" font-size="10" fill="#555">ArrayQueue - bounded</text>
  <text x="555" y="294" font-size="10" fill="#555">Epoch-based GC for safety</text>
  <!-- Decision table -->
  <rect x="30" y="335" width="740" height="110" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Selection Guide</text>
  <text x="45" y="385" font-size="10" fill="#555">Simple counter/flag -&gt; AtomicUsize / AtomicBool</text>
  <text x="45" y="403" font-size="10" fill="#555">Shared complex state -&gt; Arc&lt;Mutex&lt;T&gt;&gt; (or Arc&lt;RwLock&lt;T&gt;&gt; for read-heavy)</text>
  <text x="45" y="421" font-size="10" fill="#555">Concurrent map -&gt; DashMap (or flurry for Java-style ConcurrentHashMap)</text>
  <text x="45" y="439" font-size="10" fill="#555">Lock-free queue -&gt; crossbeam::SegQueue or crossbeam::ArrayQueue</text>
</svg>
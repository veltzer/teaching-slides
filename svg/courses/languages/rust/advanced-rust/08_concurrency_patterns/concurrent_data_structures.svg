<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="16" markerHeight="10.9565" refX="16" refY="5.4783" orient="auto">
      <ns0:polygon points="0,15.6522 5.6,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="588.065" y="43.146" text-anchor="middle" font-size="28.764" font-weight="bold" fill="#333">Concurrent Data Structures</ns0:text>
  <ns0:rect x="44.1049" y="79.1012" width="338.1373" height="186.9663" rx="7.191" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8764" />
  <ns0:text x="213.1735" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="#4a90e2">Mutex&lt;T&gt;</ns0:text>
  <ns0:text x="66.1573" y="143.8202" font-size="14.382" fill="#555">Exclusive access</ns0:text>
  <ns0:text x="66.1573" y="169.7079" font-size="14.382" fill="#555">lock() -&gt; MutexGuard&lt;T&gt;</ns0:text>
  <ns0:text x="66.1573" y="195.5955" font-size="14.382" fill="#555">RAII: auto-unlock on drop</ns0:text>
  <ns0:text x="66.1573" y="221.4832" font-size="14.382" fill="#dc3545">Can deadlock if nested!</ns0:text>
  <ns0:text x="66.1573" y="250.2472" font-size="14.382" fill="#555">Use when: writes common</ns0:text>
  <ns0:rect x="418.9963" y="79.1012" width="338.1373" height="186.9663" rx="7.191" fill="#d4edda" stroke="#28a745" stroke-width="2.8764" />
  <ns0:text x="588.065" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="#28a745">RwLock&lt;T&gt;</ns0:text>
  <ns0:text x="441.0487" y="143.8202" font-size="14.382" fill="#555">Multiple readers OR one writer</ns0:text>
  <ns0:text x="441.0487" y="169.7079" font-size="14.382" fill="#555">read() -&gt; RwLockReadGuard</ns0:text>
  <ns0:text x="441.0487" y="195.5955" font-size="14.382" fill="#555">write() -&gt; RwLockWriteGuard</ns0:text>
  <ns0:text x="441.0487" y="221.4832" font-size="14.382" fill="#555">More overhead than Mutex</ns0:text>
  <ns0:text x="441.0487" y="250.2472" font-size="14.382" fill="#555">Use when: reads &gt;&gt; writes</ns0:text>
  <ns0:rect x="793.8877" y="79.1012" width="338.1373" height="186.9663" rx="7.191" fill="#fff3cd" stroke="#ffc107" stroke-width="2.8764" />
  <ns0:text x="962.9564" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="#333">Atomics</ns0:text>
  <ns0:text x="815.9401" y="143.8202" font-size="14.382" fill="#555">AtomicBool, AtomicUsize, ...</ns0:text>
  <ns0:text x="815.9401" y="169.7079" font-size="14.382" fill="#555">Lock-free operations</ns0:text>
  <ns0:text x="815.9401" y="195.5955" font-size="14.382" fill="#555">load, store, CAS</ns0:text>
  <ns0:text x="815.9401" y="221.4832" font-size="14.382" fill="#555">Ordering: Relaxed..SeqCst</ns0:text>
  <ns0:text x="815.9401" y="250.2472" font-size="14.382" fill="#555">Use when: simple counters/flags</ns0:text>
  <ns0:rect x="44.1049" y="302.0225" width="338.1373" height="143.8202" rx="7.191" fill="#d4edda" stroke="#28a745" stroke-width="2.8764" />
  <ns0:text x="213.1735" y="337.9776" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="#28a745">Arc&lt;T&gt;</ns0:text>
  <ns0:text x="66.1573" y="371.0562" font-size="14.382" fill="#555">Atomic Reference Counting</ns0:text>
  <ns0:text x="66.1573" y="396.9438" font-size="14.382" fill="#555">Shared ownership across threads</ns0:text>
  <ns0:text x="66.1573" y="422.8315" font-size="14.382" fill="#555">Arc&lt;Mutex&lt;T&gt;&gt; = shared mutable</ns0:text>
  <ns0:rect x="418.9963" y="302.0225" width="338.1373" height="143.8202" rx="7.191" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8764" />
  <ns0:text x="588.065" y="337.9776" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="#4a90e2">DashMap&lt;K, V&gt;</ns0:text>
  <ns0:text x="441.0487" y="371.0562" font-size="14.382" fill="#555">Concurrent HashMap</ns0:text>
  <ns0:text x="441.0487" y="396.9438" font-size="14.382" fill="#555">Sharded internally</ns0:text>
  <ns0:text x="441.0487" y="422.8315" font-size="14.382" fill="#555">Much faster than Mutex&lt;HashMap&gt;</ns0:text>
  <ns0:rect x="793.8877" y="302.0225" width="338.1373" height="143.8202" rx="7.191" fill="#fff3cd" stroke="#ffc107" stroke-width="2.8764" />
  <ns0:text x="962.9564" y="337.9776" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="#333">crossbeam</ns0:text>
  <ns0:text x="815.9401" y="371.0562" font-size="14.382" fill="#555">SegQueue - lock-free queue</ns0:text>
  <ns0:text x="815.9401" y="396.9438" font-size="14.382" fill="#555">ArrayQueue - bounded</ns0:text>
  <ns0:text x="815.9401" y="422.8315" font-size="14.382" fill="#555">Epoch-based GC for safety</ns0:text>
  <ns0:rect x="44.1049" y="481.7978" width="1087.9202" height="158.2022" rx="7.191" fill="#fff3cd" stroke="#ffc107" stroke-width="2.8764" />
  <ns0:text x="588.065" y="517.7529" text-anchor="middle" font-size="20.1348" font-weight="bold" fill="#333">Selection Guide</ns0:text>
  <ns0:text x="66.1573" y="553.7079" font-size="14.382" fill="#555">Simple counter/flag -&gt; AtomicUsize / AtomicBool</ns0:text>
  <ns0:text x="66.1573" y="579.5955" font-size="14.382" fill="#555">Shared complex state -&gt; Arc&lt;Mutex&lt;T&gt;&gt; (or Arc&lt;RwLock&lt;T&gt;&gt; for read-heavy)</ns0:text>
  <ns0:text x="66.1573" y="605.4832" font-size="14.382" fill="#555">Concurrent map -&gt; DashMap (or flurry for Java-style ConcurrentHashMap)</ns0:text>
  <ns0:text x="66.1573" y="631.3708" font-size="14.382" fill="#555">Lock-free queue -&gt; crossbeam::SegQueue or crossbeam::ArrayQueue</ns0:text>
</ns0:svg>
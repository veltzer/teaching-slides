<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="372.9729" height="193.333333333333" rx="6.189321628002" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="77.179433974345" text-anchor="middle" font-size="19.967576814819" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Mutex&lt;T&gt;</text>
  <text x="64.3243" y="106.923023717935" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Exclusive</text>
  <text x="64.3243" y="133.692233205109" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">lock()</text>
  <text x="64.3243" y="160.461442692283" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">RAII</text>
  <text x="64.3243" y="187.230758589741" font-size="15.359730018132" fill="var(--danger-accent)" font-family="Arial, sans-serif">Deadlocks</text>
  <text x="64.3243" y="216.974348333331" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Writes</text>
  <rect x="453.5135" y="40" width="372.9729" height="193.333333333333" rx="6.189321628002" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="77.179433974345" text-anchor="middle" font-size="19.967576814819" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">RwLock&lt;T&gt;</text>
  <text x="477.8378" y="106.923023717935" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">N readers, 1 writer</text>
  <text x="477.8378" y="133.692233205109" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">read()</text>
  <text x="477.8378" y="160.461442692283" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">write()</text>
  <text x="477.8378" y="187.230758589741" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Slower</text>
  <text x="477.8378" y="216.974348333331" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Reads</text>
  <rect x="867.027" y="40" width="372.9729" height="193.333333333333" rx="6.189321628002" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="77.179433974345" text-anchor="middle" font-size="19.967576814819" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Atomics</text>
  <text x="891.3513" y="106.923023717935" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">AtomicBool, AtomicUsize</text>
  <text x="891.3513" y="133.692233205109" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Lock-free</text>
  <text x="891.3513" y="160.461442692283" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">load, store, CAS</text>
  <text x="891.3513" y="187.230758589741" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Relaxed..SeqCst</text>
  <text x="891.3513" y="216.974348333331" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">For flags</text>
  <rect x="40" y="270.512767307679" width="372.9729" height="148.717948717949" rx="6.189321628002" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="307.692307692308" text-anchor="middle" font-size="19.967576814819" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Arc&lt;T&gt;</text>
  <text x="64.3243" y="341.897467820521" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Atomic refcount</text>
  <text x="64.3243" y="368.666570897411" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Shared across threads</text>
  <text x="64.3243" y="395.435886794869" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Arc&lt;Mutex&gt; = mutable</text>
  <rect x="453.5135" y="270.512767307679" width="372.9729" height="148.717948717949" rx="6.189321628002" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="307.692307692308" text-anchor="middle" font-size="19.967576814819" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">DashMap&lt;K, V&gt;</text>
  <text x="477.8378" y="341.897467820521" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Concurrent HashMap</text>
  <text x="477.8378" y="368.666570897411" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Sharded</text>
  <text x="477.8378" y="395.435886794869" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Faster than Mutex&lt;HashMap&gt;</text>
  <rect x="867.027" y="270.512767307679" width="372.9729" height="148.717948717949" rx="6.189321628002" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="307.692307692308" text-anchor="middle" font-size="19.967576814819" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">crossbeam</text>
  <text x="891.3513" y="341.897467820521" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">SegQueue: lock-free</text>
  <text x="891.3513" y="368.666570897411" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">ArrayQueue: bounded</text>
  <text x="891.3513" y="395.435886794869" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Epoch GC</text>
  <rect x="40" y="456.410256410256" width="1200" height="163.589743589744" rx="6.189321628002" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="493.589796794886" text-anchor="middle" font-size="21.503560132168" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Guide</text>
  <text x="64.3243" y="530.769230769231" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Counter/flag -&gt; Atomic</text>
  <text x="64.3243" y="557.538440256405" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">State -&gt; Arc&lt;Mutex&gt; or Arc&lt;RwLock&gt;</text>
  <text x="64.3243" y="584.307756153863" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Map -&gt; DashMap</text>
  <text x="64.3243" y="611.076965641037" font-size="15.359730018132" fill="var(--text-muted)" font-family="Arial, sans-serif">Queue -&gt; crossbeam</text>
</svg>

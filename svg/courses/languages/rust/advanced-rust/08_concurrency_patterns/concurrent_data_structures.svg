<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</ns0:defs>
  <ns0:text x="588.065" y="43.146" text-anchor="middle" font-size="28.764" font-weight="bold" fill="var(--text-dark)">Concurrent Data Structures</ns0:text>
  <ns0:rect x="44.1049" y="79.1012" width="338.1373" height="186.9663" rx="7.191" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8764" />
  <ns0:text x="213.1735" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--primary-bright)">Mutex&lt;T&gt;</ns0:text>
  <ns0:text x="66.1573" y="143.8202" font-size="14.382" fill="var(--text-muted)">Exclusive access</ns0:text>
  <ns0:text x="66.1573" y="169.7079" font-size="14.382" fill="var(--text-muted)">lock() -&gt; MutexGuard&lt;T&gt;</ns0:text>
  <ns0:text x="66.1573" y="195.5955" font-size="14.382" fill="var(--text-muted)">RAII: auto-unlock on drop</ns0:text>
  <ns0:text x="66.1573" y="221.4832" font-size="14.382" fill="var(--danger-bright)">Can deadlock if nested!</ns0:text>
  <ns0:text x="66.1573" y="250.2472" font-size="14.382" fill="var(--text-muted)">Use when: writes common</ns0:text>
  <ns0:rect x="418.9963" y="79.1012" width="338.1373" height="186.9663" rx="7.191" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8764" />
  <ns0:text x="588.065" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--ok-bright)">RwLock&lt;T&gt;</ns0:text>
  <ns0:text x="441.0487" y="143.8202" font-size="14.382" fill="var(--text-muted)">Multiple readers OR one writer</ns0:text>
  <ns0:text x="441.0487" y="169.7079" font-size="14.382" fill="var(--text-muted)">read() -&gt; RwLockReadGuard</ns0:text>
  <ns0:text x="441.0487" y="195.5955" font-size="14.382" fill="var(--text-muted)">write() -&gt; RwLockWriteGuard</ns0:text>
  <ns0:text x="441.0487" y="221.4832" font-size="14.382" fill="var(--text-muted)">More overhead than Mutex</ns0:text>
  <ns0:text x="441.0487" y="250.2472" font-size="14.382" fill="var(--text-muted)">Use when: reads &gt;&gt; writes</ns0:text>
  <ns0:rect x="793.8877" y="79.1012" width="338.1373" height="186.9663" rx="7.191" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8764" />
  <ns0:text x="962.9564" y="115.0562" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--text-dark)">Atomics</ns0:text>
  <ns0:text x="815.9401" y="143.8202" font-size="14.382" fill="var(--text-muted)">AtomicBool, AtomicUsize, ...</ns0:text>
  <ns0:text x="815.9401" y="169.7079" font-size="14.382" fill="var(--text-muted)">Lock-free operations</ns0:text>
  <ns0:text x="815.9401" y="195.5955" font-size="14.382" fill="var(--text-muted)">load, store, CAS</ns0:text>
  <ns0:text x="815.9401" y="221.4832" font-size="14.382" fill="var(--text-muted)">Ordering: Relaxed..SeqCst</ns0:text>
  <ns0:text x="815.9401" y="250.2472" font-size="14.382" fill="var(--text-muted)">Use when: simple counters/flags</ns0:text>
  <ns0:rect x="44.1049" y="302.0225" width="338.1373" height="143.8202" rx="7.191" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8764" />
  <ns0:text x="213.1735" y="337.9776" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--ok-bright)">Arc&lt;T&gt;</ns0:text>
  <ns0:text x="66.1573" y="371.0562" font-size="14.382" fill="var(--text-muted)">Atomic Reference Counting</ns0:text>
  <ns0:text x="66.1573" y="396.9438" font-size="14.382" fill="var(--text-muted)">Shared ownership across threads</ns0:text>
  <ns0:text x="66.1573" y="422.8315" font-size="14.382" fill="var(--text-muted)">Arc&lt;Mutex&lt;T&gt;&gt; = shared mutable</ns0:text>
  <ns0:rect x="418.9963" y="302.0225" width="338.1373" height="143.8202" rx="7.191" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8764" />
  <ns0:text x="588.065" y="337.9776" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--primary-bright)">DashMap&lt;K, V&gt;</ns0:text>
  <ns0:text x="441.0487" y="371.0562" font-size="14.382" fill="var(--text-muted)">Concurrent HashMap</ns0:text>
  <ns0:text x="441.0487" y="396.9438" font-size="14.382" fill="var(--text-muted)">Sharded internally</ns0:text>
  <ns0:text x="441.0487" y="422.8315" font-size="14.382" fill="var(--text-muted)">Much faster than Mutex&lt;HashMap&gt;</ns0:text>
  <ns0:rect x="793.8877" y="302.0225" width="338.1373" height="143.8202" rx="7.191" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8764" />
  <ns0:text x="962.9564" y="337.9776" text-anchor="middle" font-size="18.6966" font-weight="bold" fill="var(--text-dark)">crossbeam</ns0:text>
  <ns0:text x="815.9401" y="371.0562" font-size="14.382" fill="var(--text-muted)">SegQueue - lock-free queue</ns0:text>
  <ns0:text x="815.9401" y="396.9438" font-size="14.382" fill="var(--text-muted)">ArrayQueue - bounded</ns0:text>
  <ns0:text x="815.9401" y="422.8315" font-size="14.382" fill="var(--text-muted)">Epoch-based GC for safety</ns0:text>
  <ns0:rect x="44.1049" y="481.7978" width="1087.9202" height="158.2022" rx="7.191" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8764" />
  <ns0:text x="588.065" y="517.7529" text-anchor="middle" font-size="20.1348" font-weight="bold" fill="var(--text-dark)">Selection Guide</ns0:text>
  <ns0:text x="66.1573" y="553.7079" font-size="14.382" fill="var(--text-muted)">Simple counter/flag -&gt; AtomicUsize / AtomicBool</ns0:text>
  <ns0:text x="66.1573" y="579.5955" font-size="14.382" fill="var(--text-muted)">Shared complex state -&gt; Arc&lt;Mutex&lt;T&gt;&gt; (or Arc&lt;RwLock&lt;T&gt;&gt; for read-heavy)</ns0:text>
  <ns0:text x="66.1573" y="605.4832" font-size="14.382" fill="var(--text-muted)">Concurrent map -&gt; DashMap (or flurry for Java-style ConcurrentHashMap)</ns0:text>
  <ns0:text x="66.1573" y="631.3708" font-size="14.382" fill="var(--text-muted)">Lock-free queue -&gt; crossbeam::SegQueue or crossbeam::ArrayQueue</ns0:text>
</ns0:svg>
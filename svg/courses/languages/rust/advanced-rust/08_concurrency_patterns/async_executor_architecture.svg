<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="10.5" refX="16" refY="5.25" orient="auto">
      <polygon points="0,15 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#333">Async Executor Architecture</text>
  <rect x="48" y="82.5" width="320" height="195" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="208" y="120" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Task Queue</text>
  <rect x="72" y="135" width="272" height="33" rx="4.5" fill="#d4edda" stroke="#28a745" stroke-width="1.5" />
  <text x="208" y="159" text-anchor="middle" font-size="15" fill="#333">Future A (ready)</text>
  <rect x="72" y="172.5" width="272" height="33" rx="4.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="208" y="196.5" text-anchor="middle" font-size="15" fill="#333">Future B (pending)</text>
  <rect x="72" y="210" width="272" height="33" rx="4.5" fill="#d4edda" stroke="#28a745" stroke-width="1.5" />
  <text x="208" y="234" text-anchor="middle" font-size="15" fill="#333">Future C (ready)</text>
  <text x="208" y="267" text-anchor="middle" font-size="15" fill="#555">FIFO scheduling</text>
  <line x1="368" y1="180" x2="448" y2="180" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="464" y="82.5" width="352" height="195" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="120" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Executor (Runtime)</text>
  <text x="488" y="150" font-size="15" fill="#555">loop {</text>
  <text x="504" y="177" font-size="15" fill="#555">  task = queue.pop();</text>
  <text x="504" y="204" font-size="15" fill="#555">  result = task.poll();</text>
  <text x="504" y="231" font-size="15" fill="#555">  if Pending: park task</text>
  <text x="488" y="258" font-size="15" fill="#555">}</text>
  <rect x="896" y="82.5" width="336" height="195" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="1064" y="120" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#28a745">Reactor</text>
  <text x="920" y="150" font-size="15" fill="#555">Monitors I/O sources:</text>
  <text x="936" y="177" font-size="15" fill="#555">- epoll (Linux)</text>
  <text x="936" y="204" font-size="15" fill="#555">- kqueue (macOS)</text>
  <text x="936" y="231" font-size="15" fill="#555">- IOCP (Windows)</text>
  <text x="920" y="262.5" font-size="15" fill="#28a745">Calls waker when ready</text>
  <line x1="816" y1="150" x2="896" y2="150" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrow)" />
  <text x="856" y="139.5" font-size="15" fill="#4a90e2">register</text>
  <line x1="896" y1="240" x2="816" y2="240" stroke="#28a745" stroke-width="3" marker-end="url(#arrow)" />
  <text x="856" y="229.5" font-size="15" fill="#28a745">wake!</text>
  <rect x="48" y="322.5" width="1184" height="165" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="640" y="360" text-anchor="middle" font-size="21" font-weight="bold" fill="#333">Future Poll State Machine</text>
  <rect x="96" y="382.5" width="192" height="60" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="192" y="420" text-anchor="middle" font-size="16.5" fill="#333">poll()</text>
  <line x1="288" y1="412.5" x2="400" y2="382.5" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="288" y1="412.5" x2="400" y2="442.5" stroke="#28a745" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="416" y="360" width="240" height="45" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="536" y="390" text-anchor="middle" font-size="16.5" fill="#333">Poll::Pending</text>
  <rect x="416" y="420" width="240" height="45" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="536" y="450" text-anchor="middle" font-size="16.5" fill="#333">Poll::Ready(T)</text>
  <text x="736" y="390" font-size="15" fill="#555">-&gt; Suspend, register waker</text>
  <text x="736" y="450" font-size="15" fill="#555">-&gt; Complete, return value</text>
  <rect x="48" y="525" width="1184" height="172.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="562.5" text-anchor="middle" font-size="21" font-weight="bold" fill="#333">Tokio Multi-Threaded Runtime</text>
  <rect x="96" y="585" width="208" height="60" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="200" y="622.5" text-anchor="middle" font-size="15" fill="#333">Worker Thread 1</text>
  <rect x="336" y="585" width="208" height="60" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="440" y="622.5" text-anchor="middle" font-size="15" fill="#333">Worker Thread 2</text>
  <rect x="576" y="585" width="208" height="60" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="680" y="622.5" text-anchor="middle" font-size="15" fill="#333">Worker Thread N</text>
  <rect x="848" y="585" width="208" height="60" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="952" y="622.5" text-anchor="middle" font-size="15" fill="#333">Blocking Pool</text>
  <text x="640" y="682.5" text-anchor="middle" font-size="16.5" fill="#555">Work-stealing scheduler: idle threads steal tasks from busy threads' local queues</text>
</svg>
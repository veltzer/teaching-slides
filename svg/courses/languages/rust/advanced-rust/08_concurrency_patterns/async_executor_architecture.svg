<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Async Executor Architecture</text>
  <!-- Task queue -->
  <rect x="30" y="55" width="200" height="130" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="130" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Task Queue</text>
  <rect x="45" y="90" width="170" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="130" y="106" text-anchor="middle" font-size="10" fill="#333">Future A (ready)</text>
  <rect x="45" y="115" width="170" height="22" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="130" y="131" text-anchor="middle" font-size="10" fill="#333">Future B (pending)</text>
  <rect x="45" y="140" width="170" height="22" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="130" y="156" text-anchor="middle" font-size="10" fill="#333">Future C (ready)</text>
  <text x="130" y="178" text-anchor="middle" font-size="10" fill="#555">FIFO scheduling</text>
  <!-- Arrow to executor -->
  <line x1="230" y1="120" x2="280" y2="120" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Executor -->
  <rect x="290" y="55" width="220" height="130" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Executor (Runtime)</text>
  <text x="305" y="100" font-size="10" fill="#555">loop {</text>
  <text x="315" y="118" font-size="10" fill="#555">  task = queue.pop();</text>
  <text x="315" y="136" font-size="10" fill="#555">  result = task.poll();</text>
  <text x="315" y="154" font-size="10" fill="#555">  if Pending: park task</text>
  <text x="305" y="172" font-size="10" fill="#555">}</text>
  <!-- Reactor/Waker -->
  <rect x="560" y="55" width="210" height="130" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="665" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Reactor</text>
  <text x="575" y="100" font-size="10" fill="#555">Monitors I/O sources:</text>
  <text x="585" y="118" font-size="10" fill="#555">- epoll (Linux)</text>
  <text x="585" y="136" font-size="10" fill="#555">- kqueue (macOS)</text>
  <text x="585" y="154" font-size="10" fill="#555">- IOCP (Windows)</text>
  <text x="575" y="175" font-size="10" fill="#28a745">Calls waker when ready</text>
  <!-- Arrows -->
  <line x1="510" y1="100" x2="560" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="535" y="93" font-size="10" fill="#4a90e2">register</text>
  <line x1="560" y1="160" x2="510" y2="160" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="535" y="153" font-size="10" fill="#28a745">wake!</text>
  <!-- Poll state machine -->
  <rect x="30" y="215" width="740" height="110" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="400" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Future Poll State Machine</text>
  <rect x="60" y="255" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="120" y="280" text-anchor="middle" font-size="11" fill="#333">poll()</text>
  <line x1="180" y1="275" x2="250" y2="255" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="275" x2="250" y2="295" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="260" y="240" width="150" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="335" y="260" text-anchor="middle" font-size="11" fill="#333">Poll::Pending</text>
  <rect x="260" y="280" width="150" height="30" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="335" y="300" text-anchor="middle" font-size="11" fill="#333">Poll::Ready(T)</text>
  <text x="460" y="260" font-size="10" fill="#555">-&gt; Suspend, register waker</text>
  <text x="460" y="300" font-size="10" fill="#555">-&gt; Complete, return value</text>
  <!-- Multi-threaded runtime -->
  <rect x="30" y="350" width="740" height="115" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Tokio Multi-Threaded Runtime</text>
  <rect x="60" y="390" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="125" y="415" text-anchor="middle" font-size="10" fill="#333">Worker Thread 1</text>
  <rect x="210" y="390" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="275" y="415" text-anchor="middle" font-size="10" fill="#333">Worker Thread 2</text>
  <rect x="360" y="390" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="425" y="415" text-anchor="middle" font-size="10" fill="#333">Worker Thread N</text>
  <rect x="530" y="390" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="595" y="415" text-anchor="middle" font-size="10" fill="#333">Blocking Pool</text>
  <text x="400" y="455" text-anchor="middle" font-size="11" fill="#555">Work-stealing scheduler: idle threads steal tasks from busy threads' local queues</text>
</svg>
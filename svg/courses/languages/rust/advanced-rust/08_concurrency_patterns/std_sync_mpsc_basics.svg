<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="290.3226" height="356.923098224851" rx="7.060180771338" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.1612" y="196.153872781064" text-anchor="middle" font-size="35.122751961895" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Producer</text>
  <text x="185.1612" y="307.692254437871" text-anchor="middle" font-size="28.098225103452" fill="var(--text-muted)" font-family="Arial, sans-serif">(thread)</text>
  <line x1="330.3226" y1="218.461549112426" x2="494.8387" y2="218.461549112426" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="413.5483" y="164.923042840238" text-anchor="middle" font-size="28.098225103452" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">send()</text>
  <rect x="494.8387" y="40" width="290.3226" height="356.923098224851" rx="7.060180771338" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="196.153872781064" text-anchor="middle" font-size="35.122751961895" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Channel</text>
  <text x="640" y="307.692254437871" text-anchor="middle" font-size="28.098225103452" fill="var(--text-muted)" font-family="Arial, sans-serif">(buffer)</text>
  <line x1="785.1613" y1="218.461549112426" x2="949.6774" y2="218.461549112426" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="868.3871" y="164.923042840238" text-anchor="middle" font-size="28.098225103452" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">recv()</text>
  <rect x="949.6774" y="40" width="290.3226" height="356.923098224851" rx="7.060180771338" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.8388" y="196.153872781064" text-anchor="middle" font-size="35.122751961895" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Consumer</text>
  <text x="1094.8388" y="307.692254437871" text-anchor="middle" font-size="28.098225103452" fill="var(--text-muted)" font-family="Arial, sans-serif">(thread)</text>
  <text x="640" y="620" text-anchor="middle" font-size="30.439616386586" fill="var(--text-muted)" font-family="Arial, sans-serif">Multiple Producer, Single Consumer (MPSC) channel</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="86.4" text-anchor="middle" font-size="32.9143" font-weight="bold" fill="#333">std::sync::mpsc Basics</text>
  <rect x="73.1429" y="230.4" width="274.2857" height="230.4" rx="9.1429" fill="#d4edda" stroke="#28a745" stroke-width="3.6571" />
  <text x="210.2857" y="331.2" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#333">Producer</text>
  <text x="210.2857" y="403.2" text-anchor="middle" font-size="21.9429" fill="#555">(thread)</text>
  <line x1="347.4286" y1="345.6" x2="502.8571" y2="345.6" stroke="#4a90e2" stroke-width="4.5714" marker-end="url(#arrowB)" />
  <text x="426.0571" y="311.04" text-anchor="middle" font-size="21.9429" fill="#4a90e2" font-weight="bold">send()</text>
  <rect x="502.8571" y="230.4" width="274.2857" height="230.4" rx="9.1429" fill="#fff3cd" stroke="#ffc107" stroke-width="3.6571" />
  <text x="640" y="331.2" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#333">Channel</text>
  <text x="640" y="403.2" text-anchor="middle" font-size="21.9429" fill="#555">(buffer)</text>
  <line x1="777.1429" y1="345.6" x2="932.5714" y2="345.6" stroke="#4a90e2" stroke-width="4.5714" marker-end="url(#arrowB)" />
  <text x="855.7714" y="311.04" text-anchor="middle" font-size="21.9429" fill="#4a90e2" font-weight="bold">recv()</text>
  <rect x="932.5714" y="230.4" width="274.2857" height="230.4" rx="9.1429" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6571" />
  <text x="1069.7143" y="331.2" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#333">Consumer</text>
  <text x="1069.7143" y="403.2" text-anchor="middle" font-size="21.9429" fill="#555">(thread)</text>
  <text x="640" y="604.8" text-anchor="middle" font-size="23.7714" fill="#555">Multiple Producer, Single Consumer (MPSC) channel</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowB" markerWidth="18.2857" markerHeight="20.16" refX="18.2857" refY="10.08" orient="auto">
      <polygon points="0,28.8 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
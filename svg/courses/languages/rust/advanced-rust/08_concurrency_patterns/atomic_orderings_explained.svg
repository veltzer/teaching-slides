<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="17.7778" y="15" width="1244.4444" height="690" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="67.5" text-anchor="middle" font-size="27" font-weight="bold" fill="#333">Memory Orderings</text>
  <line x1="53.3333" y1="82.5" x2="1226.6667" y2="82.5" stroke="#4a90e2" stroke-width="2.25" />
  <rect x="53.3333" y="97.5" width="1173.3333" height="105" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="80" y="135" font-size="21" font-weight="bold" fill="#333">Relaxed</text>
  <text x="302.2222" y="135" font-size="19.5" fill="#333">No ordering guarantees between threads.</text>
  <text x="302.2222" y="162" font-size="19.5" fill="#333">Only guarantees atomicity of the operation.</text>
  <text x="302.2222" y="189" font-size="19.5" fill="#555">Use for: counters, flags where order does not matter.</text>
  <rect x="53.3333" y="217.5" width="1173.3333" height="105" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="80" y="255" font-size="21" font-weight="bold" fill="#333">Acquire</text>
  <text x="302.2222" y="255" font-size="19.5" fill="#333">All reads/writes after this load see writes before</text>
  <text x="302.2222" y="282" font-size="19.5" fill="#333">the corresponding Release store.</text>
  <text x="302.2222" y="309" font-size="19.5" fill="#555">Use for: loading a lock/flag.</text>
  <rect x="53.3333" y="337.5" width="1173.3333" height="105" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="2.25" />
  <text x="80" y="375" font-size="21" font-weight="bold" fill="#333">Release</text>
  <text x="302.2222" y="375" font-size="19.5" fill="#333">All prior reads/writes are visible to threads</text>
  <text x="302.2222" y="402" font-size="19.5" fill="#333">that do an Acquire load.</text>
  <text x="302.2222" y="429" font-size="19.5" fill="#555">Use for: storing a lock/flag.</text>
  <rect x="53.3333" y="457.5" width="1173.3333" height="82.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.25" />
  <text x="80" y="495" font-size="21" font-weight="bold" fill="#333">AcqRel</text>
  <text x="302.2222" y="495" font-size="19.5" fill="#333">Acquire + Release combined.</text>
  <text x="302.2222" y="522" font-size="19.5" fill="#555">Use for: read-modify-write operations (e.g., compare_exchange).</text>
  <rect x="53.3333" y="555" width="1173.3333" height="105" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="80" y="592.5" font-size="21" font-weight="bold" fill="#333">SeqCst</text>
  <text x="302.2222" y="592.5" font-size="19.5" fill="#333">Strongest ordering. Total global order.</text>
  <text x="302.2222" y="619.5" font-size="19.5" fill="#333">All threads agree on the order of all SeqCst operations.</text>
  <text x="302.2222" y="646.5" font-size="19.5" fill="#555">Use when: you need total ordering guarantees.</text>
</svg>
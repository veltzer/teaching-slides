<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.1305" text-anchor="middle" font-size="24.3083" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory Orderings</text>
  <line x1="74.2856" y1="96.7391" x2="1205.7144" y2="96.7391" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="74.2856" y="109.3478" width="1131.4285" height="88.2608" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="140.8696" font-size="18.9065" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Relaxed</text>
  <text x="314.2856" y="140.8696" font-size="17.556" fill="var(--text)" font-family="Arial, sans-serif">No ordering guarantees between threads.</text>
  <text x="314.2856" y="163.5652" font-size="17.556" fill="var(--text)" font-family="Arial, sans-serif">Only guarantees atomicity of the operation.</text>
  <text x="314.2856" y="186.2609" font-size="17.556" fill="var(--text-muted)" font-family="Arial, sans-serif">Use for: counters, flags where order does not matter.</text>
  <rect x="74.2856" y="210.2174" width="1131.4285" height="88.2608" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="241.7392" font-size="18.9065" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Acquire</text>
  <text x="314.2856" y="241.7392" font-size="17.556" fill="var(--text)" font-family="Arial, sans-serif">All reads/writes after this load see writes before</text>
  <text x="314.2856" y="264.4348" font-size="17.556" fill="var(--text)" font-family="Arial, sans-serif">the corresponding Release store.</text>
  <text x="314.2856" y="287.1304" font-size="17.556" fill="var(--text-muted)" font-family="Arial, sans-serif">Use for: loading a lock/flag.</text>
  <rect x="74.2856" y="311.087" width="1131.4285" height="88.2608" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="342.6087" font-size="18.9065" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Release</text>
  <text x="314.2856" y="342.6087" font-size="17.556" fill="var(--text)" font-family="Arial, sans-serif">All prior reads/writes are visible to threads</text>
  <text x="314.2856" y="365.3044" font-size="17.556" fill="var(--text)" font-family="Arial, sans-serif">that do an Acquire load.</text>
  <text x="314.2856" y="388" font-size="17.556" fill="var(--text-muted)" font-family="Arial, sans-serif">Use for: storing a lock/flag.</text>
  <rect x="74.2856" y="411.9565" width="1131.4285" height="69.3478" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="443.4783" font-size="18.9065" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AcqRel</text>
  <text x="314.2856" y="443.4783" font-size="17.556" fill="var(--text)" font-family="Arial, sans-serif">Acquire + Release combined.</text>
  <text x="314.2856" y="466.1739" font-size="17.556" fill="var(--text-muted)" font-family="Arial, sans-serif">Use for: read-modify-write operations (e.g., compare_exchange).</text>
  <rect x="74.2856" y="493.9131" width="1131.4285" height="88.2608" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="525.4347" font-size="18.9065" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SeqCst</text>
  <text x="314.2856" y="525.4347" font-size="17.556" fill="var(--text)" font-family="Arial, sans-serif">Strongest ordering. Total global order.</text>
  <text x="314.2856" y="548.1305" font-size="17.556" fill="var(--text)" font-family="Arial, sans-serif">All threads agree on the order of all SeqCst operations.</text>
  <text x="314.2856" y="570.8261" font-size="17.556" fill="var(--text-muted)" font-family="Arial, sans-serif">Use when: you need total ordering guarantees.</text>
</svg>

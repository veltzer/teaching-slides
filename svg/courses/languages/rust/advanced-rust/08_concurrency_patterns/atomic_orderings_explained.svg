<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.015437062405" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory Orderings</text>
  <line x1="40" y1="54.683435218698" x2="1240" y2="54.683435218698" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="69.36698689311" width="1199.999681818246" height="102.784745265172" rx="6.668200671147" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.272842975183" y="106.075924306998" font-size="21.012055998172" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Relaxed</text>
  <text x="294.545403122141" y="106.075924306998" font-size="19.511155163775" fill="var(--text)" font-family="Arial, sans-serif">No ordering guarantees between threads.</text>
  <text x="294.545403122141" y="132.506247447512" font-size="19.511155163775" fill="var(--text)" font-family="Arial, sans-serif">Only guarantees atomicity of the operation.</text>
  <text x="294.545403122141" y="158.93668704374" font-size="19.511155163775" fill="var(--text-muted)" font-family="Arial, sans-serif">Use for: counters, flags where order does not matter.</text>
  <rect x="40" y="186.835400288409" width="1199.999681818246" height="102.784745265172" rx="6.668200671147" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.272842975183" y="223.544337702297" font-size="21.012055998172" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Acquire</text>
  <text x="294.545403122141" y="223.544337702297" font-size="19.511155163775" fill="var(--text)" font-family="Arial, sans-serif">All reads/writes after this load see writes before</text>
  <text x="294.545403122141" y="249.97466084281" font-size="19.511155163775" fill="var(--text)" font-family="Arial, sans-serif">the corresponding Release store.</text>
  <text x="294.545403122141" y="276.404983983324" font-size="19.511155163775" fill="var(--text-muted)" font-family="Arial, sans-serif">Use for: loading a lock/flag.</text>
  <rect x="40" y="304.303813683707" width="1199.999681818246" height="102.784745265172" rx="6.668200671147" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.272842975183" y="341.012634641881" font-size="21.012055998172" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Release</text>
  <text x="294.545403122141" y="341.012634641881" font-size="19.511155163775" fill="var(--text)" font-family="Arial, sans-serif">All prior reads/writes are visible to threads</text>
  <text x="294.545403122141" y="367.443074238109" font-size="19.511155163775" fill="var(--text)" font-family="Arial, sans-serif">that do an Acquire load.</text>
  <text x="294.545403122141" y="393.873397378622" font-size="19.511155163775" fill="var(--text-muted)" font-family="Arial, sans-serif">Use for: storing a lock/flag.</text>
  <rect x="40" y="421.772110623291" width="1199.999681818246" height="80.75947598141" rx="6.668200671147" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.272842975183" y="458.481048037179" font-size="21.012055998172" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AcqRel</text>
  <text x="294.545403122141" y="458.481048037179" font-size="19.511155163775" fill="var(--text)" font-family="Arial, sans-serif">Acquire + Release combined.</text>
  <text x="294.545403122141" y="484.911371177692" font-size="19.511155163775" fill="var(--text-muted)" font-family="Arial, sans-serif">Use for: read-modify-write operations (e.g., compare_exchange).</text>
  <rect x="40" y="517.215254734828" width="1199.999681818246" height="102.784745265172" rx="6.668200671147" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="67.272842975183" y="553.923959237287" font-size="21.012055998172" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SeqCst</text>
  <text x="294.545403122141" y="553.923959237287" font-size="19.511155163775" fill="var(--text)" font-family="Arial, sans-serif">Strongest ordering. Total global order.</text>
  <text x="294.545403122141" y="580.35451528923" font-size="19.511155163775" fill="var(--text)" font-family="Arial, sans-serif">All threads agree on the order of all SeqCst operations.</text>
  <text x="294.545403122141" y="606.784838429743" font-size="19.511155163775" fill="var(--text-muted)" font-family="Arial, sans-serif">Use when: you need total ordering guarantees.</text>
</svg>

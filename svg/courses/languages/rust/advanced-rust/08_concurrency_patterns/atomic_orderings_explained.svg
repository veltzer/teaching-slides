<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="16.1387" y="13.617" width="1129.7084" height="626.383" rx="6.8085" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7234" />
  <ns0:text x="580.9929" y="61.2766" text-anchor="middle" font-size="24.5106" font-weight="bold" fill="#333">Memory Orderings</ns0:text>
  <ns0:line x1="48.416" y1="74.8936" x2="1113.5698" y2="74.8936" stroke="#4a90e2" stroke-width="2.0426" />
  <ns0:rect x="48.416" y="88.5106" width="1065.1536" height="95.3191" rx="6.8085" fill="#d4edda" stroke="#28a745" stroke-width="2.0426" />
  <ns0:text x="72.6241" y="122.5532" font-size="19.0638" font-weight="bold" fill="#333">Relaxed</ns0:text>
  <ns0:text x="274.3577" y="122.5532" font-size="17.7021" fill="#333">No ordering guarantees between threads.</ns0:text>
  <ns0:text x="274.3577" y="147.0638" font-size="17.7021" fill="#333">Only guarantees atomicity of the operation.</ns0:text>
  <ns0:text x="274.3577" y="171.5745" font-size="17.7021" fill="#555">Use for: counters, flags where order does not matter.</ns0:text>
  <ns0:rect x="48.416" y="197.4468" width="1065.1536" height="95.3191" rx="6.8085" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.0426" />
  <ns0:text x="72.6241" y="231.4894" font-size="19.0638" font-weight="bold" fill="#333">Acquire</ns0:text>
  <ns0:text x="274.3577" y="231.4894" font-size="17.7021" fill="#333">All reads/writes after this load see writes before</ns0:text>
  <ns0:text x="274.3577" y="256" font-size="17.7021" fill="#333">the corresponding Release store.</ns0:text>
  <ns0:text x="274.3577" y="280.5106" font-size="17.7021" fill="#555">Use for: loading a lock/flag.</ns0:text>
  <ns0:rect x="48.416" y="306.383" width="1065.1536" height="95.3191" rx="6.8085" fill="#d4edda" stroke="#28a745" stroke-width="2.0426" />
  <ns0:text x="72.6241" y="340.4255" font-size="19.0638" font-weight="bold" fill="#333">Release</ns0:text>
  <ns0:text x="274.3577" y="340.4255" font-size="17.7021" fill="#333">All prior reads/writes are visible to threads</ns0:text>
  <ns0:text x="274.3577" y="364.9362" font-size="17.7021" fill="#333">that do an Acquire load.</ns0:text>
  <ns0:text x="274.3577" y="389.4468" font-size="17.7021" fill="#555">Use for: storing a lock/flag.</ns0:text>
  <ns0:rect x="48.416" y="415.3191" width="1065.1536" height="74.8936" rx="6.8085" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.0426" />
  <ns0:text x="72.6241" y="449.3617" font-size="19.0638" font-weight="bold" fill="#333">AcqRel</ns0:text>
  <ns0:text x="274.3577" y="449.3617" font-size="17.7021" fill="#333">Acquire + Release combined.</ns0:text>
  <ns0:text x="274.3577" y="473.8723" font-size="17.7021" fill="#555">Use for: read-modify-write operations (e.g., compare_exchange).</ns0:text>
  <ns0:rect x="48.416" y="503.8298" width="1065.1536" height="95.3191" rx="6.8085" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0426" />
  <ns0:text x="72.6241" y="537.8723" font-size="19.0638" font-weight="bold" fill="#333">SeqCst</ns0:text>
  <ns0:text x="274.3577" y="537.8723" font-size="17.7021" fill="#333">Strongest ordering. Total global order.</ns0:text>
  <ns0:text x="274.3577" y="562.383" font-size="17.7021" fill="#333">All threads agree on the order of all SeqCst operations.</ns0:text>
  <ns0:text x="274.3577" y="586.8936" font-size="17.7021" fill="#555">Use when: you need total ordering guarantees.</ns0:text>
</ns0:svg>
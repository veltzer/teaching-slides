<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.1305" text-anchor="middle" font-size="24.3083" font-weight="bold" fill="var(--text)">Memory Orderings</text>
  <line x1="74.2856" y1="96.7391" x2="1205.7144" y2="96.7391" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="74.2856" y="109.3478" width="1131.4285" height="88.2608" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="140.8696" font-size="18.9065" font-weight="bold" fill="var(--text)">Relaxed</text>
  <text x="314.2856" y="140.8696" font-size="17.556" fill="var(--text)">No ordering guarantees between threads.</text>
  <text x="314.2856" y="163.5652" font-size="17.556" fill="var(--text)">Only guarantees atomicity of the operation.</text>
  <text x="314.2856" y="186.2609" font-size="17.556" fill="var(--text-muted)">Use for: counters, flags where order does not matter.</text>
  <rect x="74.2856" y="210.2174" width="1131.4285" height="88.2608" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="241.7392" font-size="18.9065" font-weight="bold" fill="var(--text)">Acquire</text>
  <text x="314.2856" y="241.7392" font-size="17.556" fill="var(--text)">All reads/writes after this load see writes before</text>
  <text x="314.2856" y="264.4348" font-size="17.556" fill="var(--text)">the corresponding Release store.</text>
  <text x="314.2856" y="287.1304" font-size="17.556" fill="var(--text-muted)">Use for: loading a lock/flag.</text>
  <rect x="74.2856" y="311.087" width="1131.4285" height="88.2608" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="342.6087" font-size="18.9065" font-weight="bold" fill="var(--text)">Release</text>
  <text x="314.2856" y="342.6087" font-size="17.556" fill="var(--text)">All prior reads/writes are visible to threads</text>
  <text x="314.2856" y="365.3044" font-size="17.556" fill="var(--text)">that do an Acquire load.</text>
  <text x="314.2856" y="388" font-size="17.556" fill="var(--text-muted)">Use for: storing a lock/flag.</text>
  <rect x="74.2856" y="411.9565" width="1131.4285" height="69.3478" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="443.4783" font-size="18.9065" font-weight="bold" fill="var(--text)">AcqRel</text>
  <text x="314.2856" y="443.4783" font-size="17.556" fill="var(--text)">Acquire + Release combined.</text>
  <text x="314.2856" y="466.1739" font-size="17.556" fill="var(--text-muted)">Use for: read-modify-write operations (e.g., compare_exchange).</text>
  <rect x="74.2856" y="493.9131" width="1131.4285" height="88.2608" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="525.4347" font-size="18.9065" font-weight="bold" fill="var(--text)">SeqCst</text>
  <text x="314.2856" y="525.4347" font-size="17.556" fill="var(--text)">Strongest ordering. Total global order.</text>
  <text x="314.2856" y="548.1305" font-size="17.556" fill="var(--text)">All threads agree on the order of all SeqCst operations.</text>
  <text x="314.2856" y="570.8261" font-size="17.556" fill="var(--text-muted)">Use when: you need total ordering guarantees.</text>
</svg>
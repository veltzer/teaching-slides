<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="16.1387" y="13.617" width="1129.7084" height="626.383" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.9929" y="61.2766" text-anchor="middle" font-size="24.5106" font-weight="bold" fill="var(--text)">Memory Orderings</text>
  <line x1="48.416" y1="74.8936" x2="1113.5698" y2="74.8936" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="48.416" y="88.5106" width="1065.1536" height="95.3191" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="72.6241" y="122.5532" font-size="19.0638" font-weight="bold" fill="var(--text)">Relaxed</text>
  <text x="274.3577" y="122.5532" font-size="17.7021" fill="var(--text)">No ordering guarantees between threads.</text>
  <text x="274.3577" y="147.0638" font-size="17.7021" fill="var(--text)">Only guarantees atomicity of the operation.</text>
  <text x="274.3577" y="171.5745" font-size="17.7021" fill="var(--text-muted)">Use for: counters, flags where order does not matter.</text>
  <rect x="48.416" y="197.4468" width="1065.1536" height="95.3191" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="72.6241" y="231.4894" font-size="19.0638" font-weight="bold" fill="var(--text)">Acquire</text>
  <text x="274.3577" y="231.4894" font-size="17.7021" fill="var(--text)">All reads/writes after this load see writes before</text>
  <text x="274.3577" y="256" font-size="17.7021" fill="var(--text)">the corresponding Release store.</text>
  <text x="274.3577" y="280.5106" font-size="17.7021" fill="var(--text-muted)">Use for: loading a lock/flag.</text>
  <rect x="48.416" y="306.383" width="1065.1536" height="95.3191" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="72.6241" y="340.4255" font-size="19.0638" font-weight="bold" fill="var(--text)">Release</text>
  <text x="274.3577" y="340.4255" font-size="17.7021" fill="var(--text)">All prior reads/writes are visible to threads</text>
  <text x="274.3577" y="364.9362" font-size="17.7021" fill="var(--text)">that do an Acquire load.</text>
  <text x="274.3577" y="389.4468" font-size="17.7021" fill="var(--text-muted)">Use for: storing a lock/flag.</text>
  <rect x="48.416" y="415.3191" width="1065.1536" height="74.8936" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="72.6241" y="449.3617" font-size="19.0638" font-weight="bold" fill="var(--text)">AcqRel</text>
  <text x="274.3577" y="449.3617" font-size="17.7021" fill="var(--text)">Acquire + Release combined.</text>
  <text x="274.3577" y="473.8723" font-size="17.7021" fill="var(--text-muted)">Use for: read-modify-write operations (e.g., compare_exchange).</text>
  <rect x="48.416" y="503.8298" width="1065.1536" height="95.3191" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="72.6241" y="537.8723" font-size="19.0638" font-weight="bold" fill="var(--text)">SeqCst</text>
  <text x="274.3577" y="537.8723" font-size="17.7021" fill="var(--text)">Strongest ordering. Total global order.</text>
  <text x="274.3577" y="562.383" font-size="17.7021" fill="var(--text)">All threads agree on the order of all SeqCst operations.</text>
  <text x="274.3577" y="586.8936" font-size="17.7021" fill="var(--text-muted)">Use when: you need total ordering guarantees.</text>
</svg>
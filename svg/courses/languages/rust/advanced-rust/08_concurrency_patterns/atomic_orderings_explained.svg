<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="700" height="460" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Memory Orderings</text>
  <line x1="30" y1="55" x2="690" y2="55" stroke="#4a90e2" stroke-width="1.5"/>
  <!-- Relaxed -->
  <rect x="30" y="65" width="660" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="45" y="90" font-size="14" font-weight="bold" fill="#333">Relaxed</text>
  <text x="170" y="90" font-size="13" fill="#333">No ordering guarantees between threads.</text>
  <text x="170" y="108" font-size="13" fill="#333">Only guarantees atomicity of the operation.</text>
  <text x="170" y="126" font-size="13" fill="#555">Use for: counters, flags where order does not matter.</text>
  <!-- Acquire -->
  <rect x="30" y="145" width="660" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="45" y="170" font-size="14" font-weight="bold" fill="#333">Acquire</text>
  <text x="170" y="170" font-size="13" fill="#333">All reads/writes after this load see writes before</text>
  <text x="170" y="188" font-size="13" fill="#333">the corresponding Release store.</text>
  <text x="170" y="206" font-size="13" fill="#555">Use for: loading a lock/flag.</text>
  <!-- Release -->
  <rect x="30" y="225" width="660" height="70" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="45" y="250" font-size="14" font-weight="bold" fill="#333">Release</text>
  <text x="170" y="250" font-size="13" fill="#333">All prior reads/writes are visible to threads</text>
  <text x="170" y="268" font-size="13" fill="#333">that do an Acquire load.</text>
  <text x="170" y="286" font-size="13" fill="#555">Use for: storing a lock/flag.</text>
  <!-- AcqRel -->
  <rect x="30" y="305" width="660" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="45" y="330" font-size="14" font-weight="bold" fill="#333">AcqRel</text>
  <text x="170" y="330" font-size="13" fill="#333">Acquire + Release combined.</text>
  <text x="170" y="348" font-size="13" fill="#555">Use for: read-modify-write operations (e.g., compare_exchange).</text>
  <!-- SeqCst -->
  <rect x="30" y="370" width="660" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="45" y="395" font-size="14" font-weight="bold" fill="#333">SeqCst</text>
  <text x="170" y="395" font-size="13" fill="#333">Strongest ordering. Total global order.</text>
  <text x="170" y="413" font-size="13" fill="#333">All threads agree on the order of all SeqCst operations.</text>
  <text x="170" y="431" font-size="13" fill="#555">Use when: you need total ordering guarantees.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="356.7567" height="270.137020397821" rx="6.241706634985" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="79.726067423529" text-anchor="middle" font-size="20.634978106816" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Worker 1 (Busy)</text>
  <text x="218.3784" y="111.506899718518" text-anchor="middle" font-size="15.873180114986" fill="var(--text-muted)" font-family="Arial, sans-serif">Local Deque (LIFO)</text>
  <rect x="72.4324" y="127.397261756427" width="291.8919" height="34.958904702571" rx="6.241706634985" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="151.232858922876" text-anchor="middle" font-size="15.873180114986" fill="var(--text)" font-family="Arial, sans-serif">Task D (bottom - push/pop here)</text>
  <rect x="72.4324" y="167.123220960785" width="291.8919" height="34.958904702571" rx="6.241706634985" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="190.958926346405" text-anchor="middle" font-size="15.873180114986" fill="var(--text)" font-family="Arial, sans-serif">Task C</text>
  <rect x="72.4324" y="206.849288384314" width="291.8919" height="34.958904702571" rx="6.241706634985" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="230.684993769934" text-anchor="middle" font-size="15.873180114986" fill="var(--text)" font-family="Arial, sans-serif">Task B</text>
  <rect x="72.4324" y="246.575355807843" width="291.8919" height="34.958904702571" rx="6.241706634985" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="270.410952974292" text-anchor="middle" font-size="15.873180114986" fill="var(--text)" font-family="Arial, sans-serif">Task A (top - stolen from here)</text>
  <rect x="461.6215" y="40" width="356.7567" height="270.137020397821" rx="6.241706634985" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="79.726067423529" text-anchor="middle" font-size="20.634978106816" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Worker 2</text>
  <text x="640" y="111.506899718518" text-anchor="middle" font-size="15.873180114986" fill="var(--text-muted)" font-family="Arial, sans-serif">Local Deque</text>
  <rect x="494.054" y="127.397261756427" width="291.8919" height="34.958904702571" rx="6.241706634985" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="151.232858922876" text-anchor="middle" font-size="15.873180114986" fill="var(--text)" font-family="Arial, sans-serif">Task F</text>
  <rect x="494.054" y="167.123220960785" width="291.8919" height="34.958904702571" rx="6.241706634985" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="190.958926346405" text-anchor="middle" font-size="15.873180114986" fill="var(--text)" font-family="Arial, sans-serif">Task E</text>
  <rect x="883.2432" y="40" width="356.7567" height="270.137020397821" rx="6.241706634985" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6215" y="79.726067423529" text-anchor="middle" font-size="20.634978106816" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Worker 3 (Idle)</text>
  <text x="1061.6215" y="111.506899718518" text-anchor="middle" font-size="15.873180114986" fill="var(--text-muted)" font-family="Arial, sans-serif">Local Deque: EMPTY</text>
  <text x="1061.6215" y="167.123220960785" text-anchor="middle" font-size="19.047712109539" fill="var(--danger-accent)" font-family="Arial, sans-serif">Looking to steal...</text>
  <line x1="883.2432" y1="262.465826064923" x2="364.3242" y2="262.465826064923" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="11.7793 5.8897" marker-end="url(#arrow-danger)"/>
  <text x="640" y="291.068585952331" text-anchor="middle" font-size="17.460446112263" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">STEAL Task A (from top/oldest)</text>
  <rect x="40" y="357.808214730719" width="1200" height="127.123329179956" rx="6.241706634985" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="397.534282154248" text-anchor="middle" font-size="22.222452160981" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">How It Works</text>
  <text x="64.3242" y="434.082277170196" font-size="15.873180114986" fill="var(--text-muted)" font-family="Arial, sans-serif">Owner pushes/pops from BOTTOM (LIFO) - cache-friendly, processes newest subtasks first</text>
  <text x="64.3242" y="465.863109465185" font-size="15.873180114986" fill="var(--text-muted)" font-family="Arial, sans-serif">Thieves steal from TOP (FIFO) - steals oldest/largest tasks, minimizing steal frequency</text>
  <rect x="40" y="516.712376205664" width="1200" height="103.287623794336" rx="6.241706634985" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="556.438335410022" text-anchor="middle" font-size="20.634978106816" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Why This Is Clever</text>
  <text x="64.3242" y="592.986438645141" font-size="15.873180114986" fill="var(--text-muted)" font-family="Arial, sans-serif">LIFO local: warm cache, fine-grained tasks | FIFO steal: large tasks split into more work for the thief</text>
  <text x="931.8919" y="592.986438645141" font-size="15.873180114986" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">= Automatic load balancing</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.3636 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="588.9674" y="45.1765" text-anchor="middle" font-size="29.4484" font-weight="bold" fill="var(--text)">Work-Stealing Scheduler</text>
  <rect x="44.1726" y="90.3529" width="323.932" height="256" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="206.1386" y="128" text-anchor="middle" font-size="19.1414" font-weight="bold" fill="var(--text)">Worker 1 (Busy)</text>
  <text x="206.1386" y="158.1177" text-anchor="middle" font-size="14.7242" fill="var(--text-muted)">Local Deque (LIFO)</text>
  <rect x="73.6209" y="173.1765" width="265.0353" height="33.1294" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="206.1386" y="195.7647" text-anchor="middle" font-size="14.7242" fill="var(--text)">Task D (bottom - push/pop here)</text>
  <rect x="73.6209" y="210.8235" width="265.0353" height="33.1294" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="206.1386" y="233.4118" text-anchor="middle" font-size="14.7242" fill="var(--text)">Task C</text>
  <rect x="73.6209" y="248.4706" width="265.0353" height="33.1294" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="206.1386" y="271.0589" text-anchor="middle" font-size="14.7242" fill="var(--text)">Task B</text>
  <rect x="73.6209" y="286.1177" width="265.0353" height="33.1294" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="206.1386" y="308.7059" text-anchor="middle" font-size="14.7242" fill="var(--text)">Task A (top - stolen from here)</text>
  <rect x="427.0013" y="90.3529" width="323.932" height="256" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="588.9674" y="128" text-anchor="middle" font-size="19.1414" font-weight="bold" fill="var(--text)">Worker 2</text>
  <text x="588.9674" y="158.1177" text-anchor="middle" font-size="14.7242" fill="var(--text-muted)">Local Deque</text>
  <rect x="456.4497" y="173.1765" width="265.0353" height="33.1294" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="588.9674" y="195.7647" text-anchor="middle" font-size="14.7242" fill="var(--text)">Task F</text>
  <rect x="456.4497" y="210.8235" width="265.0353" height="33.1294" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="588.9674" y="233.4118" text-anchor="middle" font-size="14.7242" fill="var(--text)">Task E</text>
  <rect x="809.8301" y="90.3529" width="323.932" height="256" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="971.7961" y="128" text-anchor="middle" font-size="19.1414" font-weight="bold" fill="var(--danger-accent)">Worker 3 (Idle)</text>
  <text x="971.7961" y="158.1177" text-anchor="middle" font-size="14.7242" fill="var(--text-muted)">Local Deque: EMPTY</text>
  <text x="971.7961" y="210.8235" text-anchor="middle" font-size="17.669" fill="var(--danger-accent)">Looking to steal...</text>
  <line x1="809.8301" y1="301.1765" x2="338.6562" y2="301.1765" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="11.7793 5.8897" marker-end="url(#arrowRed)" />
  <text x="588.9674" y="328.2824" text-anchor="middle" font-size="16.1966" fill="var(--danger-accent)" font-weight="bold">STEAL Task A (from top/oldest)</text>
  <rect x="44.1726" y="391.5294" width="1089.5896" height="120.4706" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="588.9674" y="429.1765" text-anchor="middle" font-size="20.6139" font-weight="bold" fill="var(--text)">How It Works</text>
  <text x="66.2588" y="463.8118" font-size="14.7242" fill="var(--text-muted)">Owner pushes/pops from BOTTOM (LIFO) - cache-friendly, processes newest subtasks first</text>
  <text x="66.2588" y="493.9295" font-size="14.7242" fill="var(--text-muted)">Thieves steal from TOP (FIFO) - steals oldest/largest tasks, minimizing steal frequency</text>
  <rect x="44.1726" y="542.1177" width="1089.5896" height="97.8823" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="588.9674" y="579.7647" text-anchor="middle" font-size="19.1414" font-weight="bold" fill="var(--text)">Why This Is Clever</text>
  <text x="66.2588" y="614.4001" font-size="14.7242" fill="var(--text-muted)">LIFO local: warm cache, fine-grained tasks | FIFO steal: large tasks split into more work for the thief</text>
  <text x="854.0027" y="614.4001" font-size="14.7242" fill="var(--ok-accent)" font-weight="bold">= Automatic load balancing</text>
</svg>
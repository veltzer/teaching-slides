<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:marker id="arrowRed" markerWidth="16" markerHeight="11.4545" refX="16" refY="5.7273" orient="auto">
      <ns0:polygon points="0,16.3636 5.6,0" fill="#dc3545" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="588.9674" y="45.1765" text-anchor="middle" font-size="29.4484" font-weight="bold" fill="var(--text-dark)">Work-Stealing Scheduler</ns0:text>
  <ns0:rect x="44.1726" y="90.3529" width="323.932" height="256" rx="7.3621" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9448" />
  <ns0:text x="206.1386" y="128" text-anchor="middle" font-size="19.1414" font-weight="bold" fill="var(--text-dark)">Worker 1 (Busy)</ns0:text>
  <ns0:text x="206.1386" y="158.1177" text-anchor="middle" font-size="14.7242" fill="var(--text-muted)">Local Deque (LIFO)</ns0:text>
  <ns0:rect x="73.6209" y="173.1765" width="265.0353" height="33.1294" rx="4.4173" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.4724" />
  <ns0:text x="206.1386" y="195.7647" text-anchor="middle" font-size="14.7242" fill="var(--text-dark)">Task D (bottom - push/pop here)</ns0:text>
  <ns0:rect x="73.6209" y="210.8235" width="265.0353" height="33.1294" rx="4.4173" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.4724" />
  <ns0:text x="206.1386" y="233.4118" text-anchor="middle" font-size="14.7242" fill="var(--text-dark)">Task C</ns0:text>
  <ns0:rect x="73.6209" y="248.4706" width="265.0353" height="33.1294" rx="4.4173" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.4724" />
  <ns0:text x="206.1386" y="271.0589" text-anchor="middle" font-size="14.7242" fill="var(--text-dark)">Task B</ns0:text>
  <ns0:rect x="73.6209" y="286.1177" width="265.0353" height="33.1294" rx="4.4173" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4724" />
  <ns0:text x="206.1386" y="308.7059" text-anchor="middle" font-size="14.7242" fill="var(--text-dark)">Task A (top - stolen from here)</ns0:text>
  <ns0:rect x="427.0013" y="90.3529" width="323.932" height="256" rx="7.3621" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.9448" />
  <ns0:text x="588.9674" y="128" text-anchor="middle" font-size="19.1414" font-weight="bold" fill="var(--text-dark)">Worker 2</ns0:text>
  <ns0:text x="588.9674" y="158.1177" text-anchor="middle" font-size="14.7242" fill="var(--text-muted)">Local Deque</ns0:text>
  <ns0:rect x="456.4497" y="173.1765" width="265.0353" height="33.1294" rx="4.4173" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.4724" />
  <ns0:text x="588.9674" y="195.7647" text-anchor="middle" font-size="14.7242" fill="var(--text-dark)">Task F</ns0:text>
  <ns0:rect x="456.4497" y="210.8235" width="265.0353" height="33.1294" rx="4.4173" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.4724" />
  <ns0:text x="588.9674" y="233.4118" text-anchor="middle" font-size="14.7242" fill="var(--text-dark)">Task E</ns0:text>
  <ns0:rect x="809.8301" y="90.3529" width="323.932" height="256" rx="7.3621" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.9448" />
  <ns0:text x="971.7961" y="128" text-anchor="middle" font-size="19.1414" font-weight="bold" fill="var(--danger-bright)">Worker 3 (Idle)</ns0:text>
  <ns0:text x="971.7961" y="158.1177" text-anchor="middle" font-size="14.7242" fill="var(--text-muted)">Local Deque: EMPTY</ns0:text>
  <ns0:text x="971.7961" y="210.8235" text-anchor="middle" font-size="17.669" fill="var(--danger-bright)">Looking to steal...</ns0:text>
  <ns0:line x1="809.8301" y1="301.1765" x2="338.6562" y2="301.1765" stroke="var(--danger-bright)" stroke-width="3.681" stroke-dasharray="11.7793 5.8897" marker-end="url(#arrowRed)" />
  <ns0:text x="588.9674" y="328.2824" text-anchor="middle" font-size="16.1966" fill="var(--danger-bright)" font-weight="bold">STEAL Task A (from top/oldest)</ns0:text>
  <ns0:rect x="44.1726" y="391.5294" width="1089.5896" height="120.4706" rx="7.3621" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.9448" />
  <ns0:text x="588.9674" y="429.1765" text-anchor="middle" font-size="20.6139" font-weight="bold" fill="var(--text-dark)">How It Works</ns0:text>
  <ns0:text x="66.2588" y="463.8118" font-size="14.7242" fill="var(--text-muted)">Owner pushes/pops from BOTTOM (LIFO) - cache-friendly, processes newest subtasks first</ns0:text>
  <ns0:text x="66.2588" y="493.9295" font-size="14.7242" fill="var(--text-muted)">Thieves steal from TOP (FIFO) - steals oldest/largest tasks, minimizing steal frequency</ns0:text>
  <ns0:rect x="44.1726" y="542.1177" width="1089.5896" height="97.8823" rx="7.3621" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.9448" />
  <ns0:text x="588.9674" y="579.7647" text-anchor="middle" font-size="19.1414" font-weight="bold" fill="var(--text-dark)">Why This Is Clever</ns0:text>
  <ns0:text x="66.2588" y="614.4001" font-size="14.7242" fill="var(--text-muted)">LIFO local: warm cache, fine-grained tasks | FIFO steal: large tasks split into more work for the thief</ns0:text>
  <ns0:text x="854.0027" y="614.4001" font-size="14.7242" fill="var(--ok-bright)" font-weight="bold">= Automatic load balancing</ns0:text>
</ns0:svg>
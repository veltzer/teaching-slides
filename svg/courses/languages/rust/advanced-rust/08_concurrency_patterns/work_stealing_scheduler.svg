<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.3636 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.5169" font-weight="bold" fill="var(--text)">Work-Stealing Scheduler</text>
  <rect x="40" y="84.0506" width="356.7567" height="249.6203" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="120.7595" text-anchor="middle" font-size="19.8359" font-weight="bold" fill="var(--text)">Worker 1 (Busy)</text>
  <text x="218.3784" y="150.1266" text-anchor="middle" font-size="15.2585" fill="var(--text-muted)">Local Deque (LIFO)</text>
  <rect x="72.4324" y="164.8101" width="291.8919" height="32.3038" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="186.8354" text-anchor="middle" font-size="15.2585" fill="var(--text)">Task D (bottom - push/pop here)</text>
  <rect x="72.4324" y="201.5189" width="291.8919" height="32.3038" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="223.5443" text-anchor="middle" font-size="15.2585" fill="var(--text)">Task C</text>
  <rect x="72.4324" y="238.2278" width="291.8919" height="32.3038" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="260.2532" text-anchor="middle" font-size="15.2585" fill="var(--text)">Task B</text>
  <rect x="72.4324" y="274.9367" width="291.8919" height="32.3038" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="296.962" text-anchor="middle" font-size="15.2585" fill="var(--text)">Task A (top - stolen from here)</text>
  <rect x="461.6215" y="84.0506" width="356.7567" height="249.6203" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="120.7595" text-anchor="middle" font-size="19.8359" font-weight="bold" fill="var(--text)">Worker 2</text>
  <text x="640" y="150.1266" text-anchor="middle" font-size="15.2585" fill="var(--text-muted)">Local Deque</text>
  <rect x="494.054" y="164.8101" width="291.8919" height="32.3038" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="186.8354" text-anchor="middle" font-size="15.2585" fill="var(--text)">Task F</text>
  <rect x="494.054" y="201.5189" width="291.8919" height="32.3038" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="223.5443" text-anchor="middle" font-size="15.2585" fill="var(--text)">Task E</text>
  <rect x="883.2432" y="84.0506" width="356.7567" height="249.6203" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6215" y="120.7595" text-anchor="middle" font-size="19.8359" font-weight="bold" fill="var(--danger-accent)">Worker 3 (Idle)</text>
  <text x="1061.6215" y="150.1266" text-anchor="middle" font-size="15.2585" fill="var(--text-muted)">Local Deque: EMPTY</text>
  <text x="1061.6215" y="201.5189" text-anchor="middle" font-size="18.3101" fill="var(--danger-accent)">Looking to steal...</text>
  <line x1="883.2432" y1="289.6203" x2="364.3242" y2="289.6203" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="11.7793 5.8897" marker-end="url(#arrowRed)" />
  <text x="640" y="316.0507" text-anchor="middle" font-size="16.7843" fill="var(--danger-accent)" font-weight="bold">STEAL Task A (from top/oldest)</text>
  <rect x="40" y="377.7215" width="1200" height="117.4684" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="414.4304" text-anchor="middle" font-size="21.3619" font-weight="bold" fill="var(--text)">How It Works</text>
  <text x="64.3242" y="448.2026" font-size="15.2585" fill="var(--text-muted)">Owner pushes/pops from BOTTOM (LIFO) - cache-friendly, processes newest subtasks first</text>
  <text x="64.3242" y="477.5697" font-size="15.2585" fill="var(--text-muted)">Thieves steal from TOP (FIFO) - steals oldest/largest tasks, minimizing steal frequency</text>
  <rect x="40" y="524.557" width="1200" height="95.443" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="561.2658" text-anchor="middle" font-size="19.8359" font-weight="bold" fill="var(--text)">Why This Is Clever</text>
  <text x="64.3242" y="595.0381" font-size="15.2585" fill="var(--text-muted)">LIFO local: warm cache, fine-grained tasks | FIFO steal: large tasks split into more work for the thief</text>
  <text x="931.8919" y="595.0381" font-size="15.2585" fill="var(--ok-accent)" font-weight="bold">= Automatic load balancing</text>
</svg>
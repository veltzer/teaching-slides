<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="16" markerHeight="11.4545" refX="16" refY="5.7273" orient="auto">
      <ns0:polygon points="0,16.3636 5.6,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="arrowRed" markerWidth="16" markerHeight="11.4545" refX="16" refY="5.7273" orient="auto">
      <ns0:polygon points="0,16.3636 5.6,0" fill="#dc3545" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="588.9674" y="45.1765" text-anchor="middle" font-size="29.4484" font-weight="bold" fill="#333">Work-Stealing Scheduler</ns0:text>
  <ns0:rect x="44.1726" y="90.3529" width="323.932" height="256" rx="7.3621" fill="#d4edda" stroke="#28a745" stroke-width="2.9448" />
  <ns0:text x="206.1386" y="128" text-anchor="middle" font-size="19.1414" font-weight="bold" fill="#333">Worker 1 (Busy)</ns0:text>
  <ns0:text x="206.1386" y="158.1177" text-anchor="middle" font-size="14.7242" fill="#555">Local Deque (LIFO)</ns0:text>
  <ns0:rect x="73.6209" y="173.1765" width="265.0353" height="33.1294" rx="4.4173" fill="#fff3cd" stroke="#ffc107" stroke-width="1.4724" />
  <ns0:text x="206.1386" y="195.7647" text-anchor="middle" font-size="14.7242" fill="#333">Task D (bottom - push/pop here)</ns0:text>
  <ns0:rect x="73.6209" y="210.8235" width="265.0353" height="33.1294" rx="4.4173" fill="#fff3cd" stroke="#ffc107" stroke-width="1.4724" />
  <ns0:text x="206.1386" y="233.4118" text-anchor="middle" font-size="14.7242" fill="#333">Task C</ns0:text>
  <ns0:rect x="73.6209" y="248.4706" width="265.0353" height="33.1294" rx="4.4173" fill="#fff3cd" stroke="#ffc107" stroke-width="1.4724" />
  <ns0:text x="206.1386" y="271.0589" text-anchor="middle" font-size="14.7242" fill="#333">Task B</ns0:text>
  <ns0:rect x="73.6209" y="286.1177" width="265.0353" height="33.1294" rx="4.4173" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.4724" />
  <ns0:text x="206.1386" y="308.7059" text-anchor="middle" font-size="14.7242" fill="#333">Task A (top - stolen from here)</ns0:text>
  <ns0:rect x="427.0013" y="90.3529" width="323.932" height="256" rx="7.3621" fill="#d4edda" stroke="#28a745" stroke-width="2.9448" />
  <ns0:text x="588.9674" y="128" text-anchor="middle" font-size="19.1414" font-weight="bold" fill="#333">Worker 2</ns0:text>
  <ns0:text x="588.9674" y="158.1177" text-anchor="middle" font-size="14.7242" fill="#555">Local Deque</ns0:text>
  <ns0:rect x="456.4497" y="173.1765" width="265.0353" height="33.1294" rx="4.4173" fill="#fff3cd" stroke="#ffc107" stroke-width="1.4724" />
  <ns0:text x="588.9674" y="195.7647" text-anchor="middle" font-size="14.7242" fill="#333">Task F</ns0:text>
  <ns0:rect x="456.4497" y="210.8235" width="265.0353" height="33.1294" rx="4.4173" fill="#fff3cd" stroke="#ffc107" stroke-width="1.4724" />
  <ns0:text x="588.9674" y="233.4118" text-anchor="middle" font-size="14.7242" fill="#333">Task E</ns0:text>
  <ns0:rect x="809.8301" y="90.3529" width="323.932" height="256" rx="7.3621" fill="#f8d7da" stroke="#dc3545" stroke-width="2.9448" />
  <ns0:text x="971.7961" y="128" text-anchor="middle" font-size="19.1414" font-weight="bold" fill="#dc3545">Worker 3 (Idle)</ns0:text>
  <ns0:text x="971.7961" y="158.1177" text-anchor="middle" font-size="14.7242" fill="#555">Local Deque: EMPTY</ns0:text>
  <ns0:text x="971.7961" y="210.8235" text-anchor="middle" font-size="17.669" fill="#dc3545">Looking to steal...</ns0:text>
  <ns0:line x1="809.8301" y1="301.1765" x2="338.6562" y2="301.1765" stroke="#dc3545" stroke-width="3.681" stroke-dasharray="11.7793 5.8897" marker-end="url(#arrowRed)" />
  <ns0:text x="588.9674" y="328.2824" text-anchor="middle" font-size="16.1966" fill="#dc3545" font-weight="bold">STEAL Task A (from top/oldest)</ns0:text>
  <ns0:rect x="44.1726" y="391.5294" width="1089.5896" height="120.4706" rx="7.3621" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9448" />
  <ns0:text x="588.9674" y="429.1765" text-anchor="middle" font-size="20.6139" font-weight="bold" fill="#333">How It Works</ns0:text>
  <ns0:text x="66.2588" y="463.8118" font-size="14.7242" fill="#555">Owner pushes/pops from BOTTOM (LIFO) - cache-friendly, processes newest subtasks first</ns0:text>
  <ns0:text x="66.2588" y="493.9295" font-size="14.7242" fill="#555">Thieves steal from TOP (FIFO) - steals oldest/largest tasks, minimizing steal frequency</ns0:text>
  <ns0:rect x="44.1726" y="542.1177" width="1089.5896" height="97.8823" rx="7.3621" fill="#fff3cd" stroke="#ffc107" stroke-width="2.9448" />
  <ns0:text x="588.9674" y="579.7647" text-anchor="middle" font-size="19.1414" font-weight="bold" fill="#333">Why This Is Clever</ns0:text>
  <ns0:text x="66.2588" y="614.4001" font-size="14.7242" fill="#555">LIFO local: warm cache, fine-grained tasks | FIFO steal: large tasks split into more work for the thief</ns0:text>
  <ns0:text x="854.0027" y="614.4001" font-size="14.7242" fill="#28a745" font-weight="bold">= Automatic load balancing</ns0:text>
</ns0:svg>
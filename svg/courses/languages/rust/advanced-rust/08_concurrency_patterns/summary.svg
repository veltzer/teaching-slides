<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="680" height="500" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Concurrency Patterns Cheatsheet</text>
  <line x1="30" y1="55" x2="670" y2="55" stroke="#4a90e2" stroke-width="1.5"/>
  <!-- Items -->
  <rect x="30" y="65" width="640" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="45" y="85" font-size="13" fill="#333"><tspan font-weight="bold">mpsc::channel</tspan> : unbounded MPSC channel</text>

  <rect x="30" y="100" width="640" height="30" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="45" y="120" font-size="13" fill="#333"><tspan font-weight="bold">mpsc::sync_channel</tspan> : bounded MPSC with backpressure</text>

  <rect x="30" y="135" width="640" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="45" y="155" font-size="13" fill="#333"><tspan font-weight="bold">crossbeam-channel</tspan> : MPMC + select! macro</text>

  <rect x="30" y="170" width="640" height="30" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="45" y="190" font-size="13" fill="#333"><tspan font-weight="bold">Mutex&lt;T&gt;</tspan> : exclusive access, short locks</text>

  <rect x="30" y="205" width="640" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="45" y="225" font-size="13" fill="#333"><tspan font-weight="bold">RwLock&lt;T&gt;</tspan> : many readers, one writer</text>

  <rect x="30" y="240" width="640" height="30" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="45" y="260" font-size="13" fill="#333"><tspan font-weight="bold">AtomicU64/Bool</tspan> : lock-free counters and flags</text>

  <rect x="30" y="275" width="640" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="45" y="295" font-size="13" fill="#333"><tspan font-weight="bold">Ordering</tspan> : Relaxed &lt; Acquire/Release &lt; SeqCst</text>

  <rect x="30" y="310" width="640" height="30" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="45" y="330" font-size="13" fill="#333"><tspan font-weight="bold">rayon::par_iter</tspan> : data-parallel iterators</text>

  <rect x="30" y="345" width="640" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="45" y="365" font-size="13" fill="#333"><tspan font-weight="bold">Arc&lt;T&gt;</tspan> : shared ownership across threads</text>

  <rect x="30" y="380" width="640" height="30" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="45" y="400" font-size="13" fill="#333"><tspan font-weight="bold">DashMap</tspan> : concurrent HashMap (sharded)</text>

  <rect x="30" y="415" width="640" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="45" y="435" font-size="13" fill="#333"><tspan font-weight="bold">thread::scope</tspan> : borrow stack data in threads</text>

  <rect x="30" y="450" width="640" height="30" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="45" y="470" font-size="13" fill="#333"><tspan font-weight="bold">Actor pattern</tspan> : message-driven, no shared state</text>

  <rect x="30" y="485" width="640" height="16" rx="3" fill="none" stroke="none"/>
  <text x="350" y="498" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Lock ordering prevents deadlocks</text>
</svg>
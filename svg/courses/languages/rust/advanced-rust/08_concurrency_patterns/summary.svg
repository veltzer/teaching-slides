<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="16.5727" y="12.5491" width="1126.9417" height="627.4509" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.0435" y="56.4706" text-anchor="middle" font-size="22.5883" font-weight="bold" fill="var(--text)">Concurrency Patterns Cheatsheet</text>
  <line x1="49.718" y1="69.0196" x2="1110.3691" y2="69.0196" stroke="var(--primary-border)" stroke-width="1.8823" />
  <rect x="49.718" y="81.5686" width="1060.651" height="37.6471" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="74.577" y="106.6667" font-size="16.3137" fill="var(--text)">
    <tspan font-weight="bold">mpsc::channel</tspan> : unbounded MPSC channel</text>
  <rect x="49.718" y="125.4902" width="1060.651" height="37.6471" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.2549" />
  <text x="74.577" y="150.5882" font-size="16.3137" fill="var(--text)">
    <tspan font-weight="bold">mpsc::sync_channel</tspan> : bounded MPSC with backpressure</text>
  <rect x="49.718" y="169.4118" width="1060.651" height="37.6471" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="74.577" y="194.5098" font-size="16.3137" fill="var(--text)">
    <tspan font-weight="bold">crossbeam-channel</tspan> : MPMC + select! macro</text>
  <rect x="49.718" y="213.3333" width="1060.651" height="37.6471" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.2549" />
  <text x="74.577" y="238.4313" font-size="16.3137" fill="var(--text)">
    <tspan font-weight="bold">Mutex&lt;T&gt;</tspan> : exclusive access, short locks</text>
  <rect x="49.718" y="257.2549" width="1060.651" height="37.6471" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="74.577" y="282.353" font-size="16.3137" fill="var(--text)">
    <tspan font-weight="bold">RwLock&lt;T&gt;</tspan> : many readers, one writer</text>
  <rect x="49.718" y="301.1765" width="1060.651" height="37.6471" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.2549" />
  <text x="74.577" y="326.2745" font-size="16.3137" fill="var(--text)">
    <tspan font-weight="bold">AtomicU64/Bool</tspan> : lock-free counters and flags</text>
  <rect x="49.718" y="345.098" width="1060.651" height="37.6471" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="74.577" y="370.196" font-size="16.3137" fill="var(--text)">
    <tspan font-weight="bold">Ordering</tspan> : Relaxed &lt; Acquire/Release &lt; SeqCst</text>
  <rect x="49.718" y="389.0196" width="1060.651" height="37.6471" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.2549" />
  <text x="74.577" y="414.1176" font-size="16.3137" fill="var(--text)">
    <tspan font-weight="bold">rayon::par_iter</tspan> : data-parallel iterators</text>
  <rect x="49.718" y="432.9411" width="1060.651" height="37.6471" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="74.577" y="458.0392" font-size="16.3137" fill="var(--text)">
    <tspan font-weight="bold">Arc&lt;T&gt;</tspan> : shared ownership across threads</text>
  <rect x="49.718" y="476.8627" width="1060.651" height="37.6471" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.2549" />
  <text x="74.577" y="501.9608" font-size="16.3137" fill="var(--text)">
    <tspan font-weight="bold">DashMap</tspan> : concurrent HashMap (sharded)</text>
  <rect x="49.718" y="520.7843" width="1060.651" height="37.6471" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="74.577" y="545.8823" font-size="16.3137" fill="var(--text)">
    <tspan font-weight="bold">thread::scope</tspan> : borrow stack data in threads</text>
  <rect x="49.718" y="564.7058" width="1060.651" height="37.6471" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="74.577" y="589.8038" font-size="16.3137" fill="var(--text)">
    <tspan font-weight="bold">Actor pattern</tspan> : message-driven, no shared state</text>
  <rect x="49.718" y="608.6274" width="1060.651" height="20.0784" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <text x="580.0435" y="624.9412" text-anchor="middle" font-size="13.8039" fill="var(--text-muted)" font-style="italic">Lock ordering prevents deadlocks</text>
</svg>
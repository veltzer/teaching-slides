<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:text x="588.5057" y="44.1379" text-anchor="middle" font-size="26.4828" font-weight="bold" fill="var(--text-dark)">Lock-Free vs Lock-Based Trade-offs</ns0:text>
  <ns0:rect x="31.3869" y="73.5632" width="313.8697" height="58.8506" rx="7.3563" fill="var(--primary-bright)" stroke="var(--primary-bright)" stroke-width="2.2069" />
  <ns0:text x="188.3218" y="110.3448" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="var(--bg)">Property</ns0:text>
  <ns0:rect x="345.2567" y="73.5632" width="376.6437" height="58.8506" rx="7.3563" fill="var(--warn-yellow)" stroke="var(--warn-yellow)" stroke-width="2.2069" />
  <ns0:text x="533.5786" y="110.3448" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="var(--text-dark)">Lock-Based</ns0:text>
  <ns0:rect x="721.9004" y="73.5632" width="423.7241" height="58.8506" rx="7.3563" fill="var(--ok-bright)" stroke="var(--ok-bright)" stroke-width="2.2069" />
  <ns0:text x="933.7625" y="110.3448" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="var(--bg)">Lock-Free</ns0:text>
  <ns0:rect x="31.3869" y="139.7701" width="313.8697" height="51.4943" rx="4.4138" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="139.7701" width="376.6437" height="51.4943" rx="4.4138" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="139.7701" width="423.7241" height="51.4943" rx="4.4138" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="172.1379" font-size="17.6552" fill="var(--text-dark)">Simplicity</ns0:text>
  <ns0:text x="360.9502" y="172.1379" font-size="17.6552" fill="var(--text-dark)">Easy to reason about</ns0:text>
  <ns0:text x="737.5938" y="172.1379" font-size="17.6552" fill="var(--text-dark)">Complex, subtle bugs</ns0:text>
  <ns0:rect x="31.3869" y="198.6207" width="313.8697" height="51.4943" rx="4.4138" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="198.6207" width="376.6437" height="51.4943" rx="4.4138" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="198.6207" width="423.7241" height="51.4943" rx="4.4138" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="230.9885" font-size="17.6552" fill="var(--text-dark)">Contention</ns0:text>
  <ns0:text x="360.9502" y="230.9885" font-size="17.6552" fill="var(--text-dark)">Threads block</ns0:text>
  <ns0:text x="737.5938" y="230.9885" font-size="17.6552" fill="var(--text-dark)">Threads retry (spin)</ns0:text>
  <ns0:rect x="31.3869" y="257.4713" width="313.8697" height="51.4943" rx="4.4138" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="257.4713" width="376.6437" height="51.4943" rx="4.4138" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="257.4713" width="423.7241" height="51.4943" rx="4.4138" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="289.8391" font-size="17.6552" fill="var(--text-dark)">Priority inversion</ns0:text>
  <ns0:text x="360.9502" y="289.8391" font-size="17.6552" fill="var(--danger-bright)">Possible</ns0:text>
  <ns0:text x="737.5938" y="289.8391" font-size="17.6552" fill="var(--ok-bright)">Not possible</ns0:text>
  <ns0:rect x="31.3869" y="316.3218" width="313.8697" height="51.4943" rx="4.4138" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="316.3218" width="376.6437" height="51.4943" rx="4.4138" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="316.3218" width="423.7241" height="51.4943" rx="4.4138" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="348.6897" font-size="17.6552" fill="var(--text-dark)">Deadlock</ns0:text>
  <ns0:text x="360.9502" y="348.6897" font-size="17.6552" fill="var(--danger-bright)">Possible</ns0:text>
  <ns0:text x="737.5938" y="348.6897" font-size="17.6552" fill="var(--ok-bright)">Not possible</ns0:text>
  <ns0:rect x="31.3869" y="375.1724" width="313.8697" height="51.4943" rx="4.4138" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="375.1724" width="376.6437" height="51.4943" rx="4.4138" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="375.1724" width="423.7241" height="51.4943" rx="4.4138" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="407.5402" font-size="17.6552" fill="var(--text-dark)">Progress guarantee</ns0:text>
  <ns0:text x="360.9502" y="407.5402" font-size="17.6552" fill="var(--danger-bright)">None (can deadlock)</ns0:text>
  <ns0:text x="737.5938" y="407.5402" font-size="17.6552" fill="var(--ok-bright)">At least one progresses</ns0:text>
  <ns0:rect x="31.3869" y="434.023" width="313.8697" height="51.4943" rx="4.4138" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="434.023" width="376.6437" height="51.4943" rx="4.4138" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="434.023" width="423.7241" height="51.4943" rx="4.4138" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="466.3908" font-size="17.6552" fill="var(--text-dark)">Perf (low contention)</ns0:text>
  <ns0:text x="360.9502" y="466.3908" font-size="17.6552" fill="var(--text-dark)">Good</ns0:text>
  <ns0:text x="737.5938" y="466.3908" font-size="17.6552" fill="var(--text-dark)">Similar or better</ns0:text>
  <ns0:rect x="31.3869" y="492.8736" width="313.8697" height="51.4943" rx="4.4138" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="492.8736" width="376.6437" height="51.4943" rx="4.4138" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="492.8736" width="423.7241" height="51.4943" rx="4.4138" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="525.2414" font-size="17.6552" fill="var(--text-dark)">Perf (high contention)</ns0:text>
  <ns0:text x="360.9502" y="525.2414" font-size="17.6552" fill="var(--danger-bright)">Degrades quickly</ns0:text>
  <ns0:text x="737.5938" y="525.2414" font-size="17.6552" fill="var(--ok-bright)">Degrades gracefully</ns0:text>
  <ns0:rect x="31.3869" y="551.7241" width="313.8697" height="51.4943" rx="4.4138" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="551.7241" width="376.6437" height="51.4943" rx="4.4138" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="551.7241" width="423.7241" height="51.4943" rx="4.4138" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="584.092" font-size="17.6552" fill="var(--text-dark)">Memory reclamation</ns0:text>
  <ns0:text x="360.9502" y="584.092" font-size="17.6552" fill="var(--ok-bright)">Trivial</ns0:text>
  <ns0:text x="737.5938" y="584.092" font-size="17.6552" fill="var(--danger-bright)">Hard (ABA problem)</ns0:text>
  <ns0:text x="588.5057" y="640" text-anchor="middle" font-size="17.6552" fill="var(--text-muted)" font-style="italic">Prefer Mutex/RwLock unless profiling shows lock contention is a real bottleneck.</ns0:text>
</ns0:svg>
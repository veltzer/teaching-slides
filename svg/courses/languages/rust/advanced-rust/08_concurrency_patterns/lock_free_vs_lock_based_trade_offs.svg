<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="588.5057" y="44.1379" text-anchor="middle" font-size="26.4828" font-weight="bold" fill="#333">Lock-Free vs Lock-Based Trade-offs</ns0:text>
  <ns0:rect x="31.3869" y="73.5632" width="313.8697" height="58.8506" rx="7.3563" fill="#4a90e2" stroke="#4a90e2" stroke-width="2.2069" />
  <ns0:text x="188.3218" y="110.3448" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="#fff">Property</ns0:text>
  <ns0:rect x="345.2567" y="73.5632" width="376.6437" height="58.8506" rx="7.3563" fill="#ffc107" stroke="#ffc107" stroke-width="2.2069" />
  <ns0:text x="533.5786" y="110.3448" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="#333">Lock-Based</ns0:text>
  <ns0:rect x="721.9004" y="73.5632" width="423.7241" height="58.8506" rx="7.3563" fill="#28a745" stroke="#28a745" stroke-width="2.2069" />
  <ns0:text x="933.7625" y="110.3448" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="#fff">Lock-Free</ns0:text>
  <ns0:rect x="31.3869" y="139.7701" width="313.8697" height="51.4943" rx="4.4138" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="139.7701" width="376.6437" height="51.4943" rx="4.4138" fill="#d4edda" stroke="#28a745" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="139.7701" width="423.7241" height="51.4943" rx="4.4138" fill="#f8d7da" stroke="#dc3545" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="172.1379" font-size="17.6552" fill="#333">Simplicity</ns0:text>
  <ns0:text x="360.9502" y="172.1379" font-size="17.6552" fill="#333">Easy to reason about</ns0:text>
  <ns0:text x="737.5938" y="172.1379" font-size="17.6552" fill="#333">Complex, subtle bugs</ns0:text>
  <ns0:rect x="31.3869" y="198.6207" width="313.8697" height="51.4943" rx="4.4138" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="198.6207" width="376.6437" height="51.4943" rx="4.4138" fill="#fff3cd" stroke="#ffc107" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="198.6207" width="423.7241" height="51.4943" rx="4.4138" fill="#d4edda" stroke="#28a745" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="230.9885" font-size="17.6552" fill="#333">Contention</ns0:text>
  <ns0:text x="360.9502" y="230.9885" font-size="17.6552" fill="#333">Threads block</ns0:text>
  <ns0:text x="737.5938" y="230.9885" font-size="17.6552" fill="#333">Threads retry (spin)</ns0:text>
  <ns0:rect x="31.3869" y="257.4713" width="313.8697" height="51.4943" rx="4.4138" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="257.4713" width="376.6437" height="51.4943" rx="4.4138" fill="#f8d7da" stroke="#dc3545" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="257.4713" width="423.7241" height="51.4943" rx="4.4138" fill="#d4edda" stroke="#28a745" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="289.8391" font-size="17.6552" fill="#333">Priority inversion</ns0:text>
  <ns0:text x="360.9502" y="289.8391" font-size="17.6552" fill="#dc3545">Possible</ns0:text>
  <ns0:text x="737.5938" y="289.8391" font-size="17.6552" fill="#28a745">Not possible</ns0:text>
  <ns0:rect x="31.3869" y="316.3218" width="313.8697" height="51.4943" rx="4.4138" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="316.3218" width="376.6437" height="51.4943" rx="4.4138" fill="#f8d7da" stroke="#dc3545" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="316.3218" width="423.7241" height="51.4943" rx="4.4138" fill="#d4edda" stroke="#28a745" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="348.6897" font-size="17.6552" fill="#333">Deadlock</ns0:text>
  <ns0:text x="360.9502" y="348.6897" font-size="17.6552" fill="#dc3545">Possible</ns0:text>
  <ns0:text x="737.5938" y="348.6897" font-size="17.6552" fill="#28a745">Not possible</ns0:text>
  <ns0:rect x="31.3869" y="375.1724" width="313.8697" height="51.4943" rx="4.4138" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="375.1724" width="376.6437" height="51.4943" rx="4.4138" fill="#f8d7da" stroke="#dc3545" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="375.1724" width="423.7241" height="51.4943" rx="4.4138" fill="#d4edda" stroke="#28a745" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="407.5402" font-size="17.6552" fill="#333">Progress guarantee</ns0:text>
  <ns0:text x="360.9502" y="407.5402" font-size="17.6552" fill="#dc3545">None (can deadlock)</ns0:text>
  <ns0:text x="737.5938" y="407.5402" font-size="17.6552" fill="#28a745">At least one progresses</ns0:text>
  <ns0:rect x="31.3869" y="434.023" width="313.8697" height="51.4943" rx="4.4138" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="434.023" width="376.6437" height="51.4943" rx="4.4138" fill="#f9f9f9" stroke="#ddd" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="434.023" width="423.7241" height="51.4943" rx="4.4138" fill="#f9f9f9" stroke="#ddd" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="466.3908" font-size="17.6552" fill="#333">Perf (low contention)</ns0:text>
  <ns0:text x="360.9502" y="466.3908" font-size="17.6552" fill="#333">Good</ns0:text>
  <ns0:text x="737.5938" y="466.3908" font-size="17.6552" fill="#333">Similar or better</ns0:text>
  <ns0:rect x="31.3869" y="492.8736" width="313.8697" height="51.4943" rx="4.4138" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="492.8736" width="376.6437" height="51.4943" rx="4.4138" fill="#f8d7da" stroke="#dc3545" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="492.8736" width="423.7241" height="51.4943" rx="4.4138" fill="#d4edda" stroke="#28a745" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="525.2414" font-size="17.6552" fill="#333">Perf (high contention)</ns0:text>
  <ns0:text x="360.9502" y="525.2414" font-size="17.6552" fill="#dc3545">Degrades quickly</ns0:text>
  <ns0:text x="737.5938" y="525.2414" font-size="17.6552" fill="#28a745">Degrades gracefully</ns0:text>
  <ns0:rect x="31.3869" y="551.7241" width="313.8697" height="51.4943" rx="4.4138" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.4713" />
  <ns0:rect x="345.2567" y="551.7241" width="376.6437" height="51.4943" rx="4.4138" fill="#d4edda" stroke="#28a745" stroke-width="1.4713" />
  <ns0:rect x="721.9004" y="551.7241" width="423.7241" height="51.4943" rx="4.4138" fill="#f8d7da" stroke="#dc3545" stroke-width="1.4713" />
  <ns0:text x="47.0805" y="584.092" font-size="17.6552" fill="#333">Memory reclamation</ns0:text>
  <ns0:text x="360.9502" y="584.092" font-size="17.6552" fill="#28a745">Trivial</ns0:text>
  <ns0:text x="737.5938" y="584.092" font-size="17.6552" fill="#dc3545">Hard (ABA problem)</ns0:text>
  <ns0:text x="588.5057" y="640" text-anchor="middle" font-size="17.6552" fill="#555" font-style="italic">Prefer Mutex/RwLock unless profiling shows lock contention is a real bottleneck.</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="48" text-anchor="middle" font-size="28.8" font-weight="bold" fill="#333">Lock-Free vs Lock-Based Trade-offs</text>
  <rect x="34.1333" y="80" width="341.3333" height="64" rx="8" fill="#4a90e2" stroke="#4a90e2" stroke-width="2.4" />
  <text x="204.8" y="120" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#fff">Property</text>
  <rect x="375.4667" y="80" width="409.6" height="64" rx="8" fill="#ffc107" stroke="#ffc107" stroke-width="2.4" />
  <text x="580.2667" y="120" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Lock-Based</text>
  <rect x="785.0667" y="80" width="460.8" height="64" rx="8" fill="#28a745" stroke="#28a745" stroke-width="2.4" />
  <text x="1015.4667" y="120" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#fff">Lock-Free</text>
  <rect x="34.1333" y="152" width="341.3333" height="56" rx="4.8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <rect x="375.4667" y="152" width="409.6" height="56" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <rect x="785.0667" y="152" width="460.8" height="56" rx="4.8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6" />
  <text x="51.2" y="187.2" font-size="19.2" fill="#333">Simplicity</text>
  <text x="392.5333" y="187.2" font-size="19.2" fill="#333">Easy to reason about</text>
  <text x="802.1333" y="187.2" font-size="19.2" fill="#333">Complex, subtle bugs</text>
  <rect x="34.1333" y="216" width="341.3333" height="56" rx="4.8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <rect x="375.4667" y="216" width="409.6" height="56" rx="4.8" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6" />
  <rect x="785.0667" y="216" width="460.8" height="56" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="51.2" y="251.2" font-size="19.2" fill="#333">Contention</text>
  <text x="392.5333" y="251.2" font-size="19.2" fill="#333">Threads block</text>
  <text x="802.1333" y="251.2" font-size="19.2" fill="#333">Threads retry (spin)</text>
  <rect x="34.1333" y="280" width="341.3333" height="56" rx="4.8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <rect x="375.4667" y="280" width="409.6" height="56" rx="4.8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6" />
  <rect x="785.0667" y="280" width="460.8" height="56" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="51.2" y="315.2" font-size="19.2" fill="#333">Priority inversion</text>
  <text x="392.5333" y="315.2" font-size="19.2" fill="#dc3545">Possible</text>
  <text x="802.1333" y="315.2" font-size="19.2" fill="#28a745">Not possible</text>
  <rect x="34.1333" y="344" width="341.3333" height="56" rx="4.8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <rect x="375.4667" y="344" width="409.6" height="56" rx="4.8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6" />
  <rect x="785.0667" y="344" width="460.8" height="56" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="51.2" y="379.2" font-size="19.2" fill="#333">Deadlock</text>
  <text x="392.5333" y="379.2" font-size="19.2" fill="#dc3545">Possible</text>
  <text x="802.1333" y="379.2" font-size="19.2" fill="#28a745">Not possible</text>
  <rect x="34.1333" y="408" width="341.3333" height="56" rx="4.8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <rect x="375.4667" y="408" width="409.6" height="56" rx="4.8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6" />
  <rect x="785.0667" y="408" width="460.8" height="56" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="51.2" y="443.2" font-size="19.2" fill="#333">Progress guarantee</text>
  <text x="392.5333" y="443.2" font-size="19.2" fill="#dc3545">None (can deadlock)</text>
  <text x="802.1333" y="443.2" font-size="19.2" fill="#28a745">At least one progresses</text>
  <rect x="34.1333" y="472" width="341.3333" height="56" rx="4.8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <rect x="375.4667" y="472" width="409.6" height="56" rx="4.8" fill="#f8f9fa" stroke="#ddd" stroke-width="1.6" />
  <rect x="785.0667" y="472" width="460.8" height="56" rx="4.8" fill="#f8f9fa" stroke="#ddd" stroke-width="1.6" />
  <text x="51.2" y="507.2" font-size="19.2" fill="#333">Perf (low contention)</text>
  <text x="392.5333" y="507.2" font-size="19.2" fill="#333">Good</text>
  <text x="802.1333" y="507.2" font-size="19.2" fill="#333">Similar or better</text>
  <rect x="34.1333" y="536" width="341.3333" height="56" rx="4.8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <rect x="375.4667" y="536" width="409.6" height="56" rx="4.8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6" />
  <rect x="785.0667" y="536" width="460.8" height="56" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <text x="51.2" y="571.2" font-size="19.2" fill="#333">Perf (high contention)</text>
  <text x="392.5333" y="571.2" font-size="19.2" fill="#dc3545">Degrades quickly</text>
  <text x="802.1333" y="571.2" font-size="19.2" fill="#28a745">Degrades gracefully</text>
  <rect x="34.1333" y="600" width="341.3333" height="56" rx="4.8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.6" />
  <rect x="375.4667" y="600" width="409.6" height="56" rx="4.8" fill="#d4edda" stroke="#28a745" stroke-width="1.6" />
  <rect x="785.0667" y="600" width="460.8" height="56" rx="4.8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6" />
  <text x="51.2" y="635.2" font-size="19.2" fill="#333">Memory reclamation</text>
  <text x="392.5333" y="635.2" font-size="19.2" fill="#28a745">Trivial</text>
  <text x="802.1333" y="635.2" font-size="19.2" fill="#dc3545">Hard (ABA problem)</text>
  <text x="640" y="696" text-anchor="middle" font-size="19.2" fill="#555" font-style="italic">Prefer Mutex/RwLock unless profiling shows lock contention is a real bottleneck.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.1148" font-weight="bold" fill="var(--text)">Lock-Free vs Lock-Based Trade-offs</text>
  <rect x="40" y="68.642" width="338.0281" height="57.284" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.0141" y="104.4444" text-anchor="middle" font-size="21.0893" font-weight="bold" fill="var(--bg)">Property</text>
  <rect x="378.0282" y="68.642" width="405.6338" height="57.284" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580.8452" y="104.4444" text-anchor="middle" font-size="21.0893" font-weight="bold" fill="var(--text)">Lock-Based</text>
  <rect x="783.662" y="68.642" width="456.338" height="57.284" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1011.8311" y="104.4444" text-anchor="middle" font-size="21.0893" font-weight="bold" fill="var(--bg)">Lock-Free</text>
  <rect x="40" y="133.0864" width="338.0281" height="50.1235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="133.0864" width="405.6338" height="50.1235" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="133.0864" width="456.338" height="50.1235" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="164.5926" font-size="18.0765" fill="var(--text)">Simplicity</text>
  <text x="394.9296" y="164.5926" font-size="18.0765" fill="var(--text)">Easy to reason about</text>
  <text x="800.5633" y="164.5926" font-size="18.0765" fill="var(--text)">Complex, subtle bugs</text>
  <rect x="40" y="190.3704" width="338.0281" height="50.1235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="190.3704" width="405.6338" height="50.1235" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="190.3704" width="456.338" height="50.1235" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="221.8766" font-size="18.0765" fill="var(--text)">Contention</text>
  <text x="394.9296" y="221.8766" font-size="18.0765" fill="var(--text)">Threads block</text>
  <text x="800.5633" y="221.8766" font-size="18.0765" fill="var(--text)">Threads retry (spin)</text>
  <rect x="40" y="247.6544" width="338.0281" height="50.1235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="247.6544" width="405.6338" height="50.1235" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="247.6544" width="456.338" height="50.1235" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="279.1605" font-size="18.0765" fill="var(--text)">Priority inversion</text>
  <text x="394.9296" y="279.1605" font-size="18.0765" fill="var(--danger-accent)">Possible</text>
  <text x="800.5633" y="279.1605" font-size="18.0765" fill="var(--ok-accent)">Not possible</text>
  <rect x="40" y="304.9382" width="338.0281" height="50.1235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="304.9382" width="405.6338" height="50.1235" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="304.9382" width="456.338" height="50.1235" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="336.4445" font-size="18.0765" fill="var(--text)">Deadlock</text>
  <text x="394.9296" y="336.4445" font-size="18.0765" fill="var(--danger-accent)">Possible</text>
  <text x="800.5633" y="336.4445" font-size="18.0765" fill="var(--ok-accent)">Not possible</text>
  <rect x="40" y="362.2222" width="338.0281" height="50.1235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="362.2222" width="405.6338" height="50.1235" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="362.2222" width="456.338" height="50.1235" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="393.7284" font-size="18.0765" fill="var(--text)">Progress guarantee</text>
  <text x="394.9296" y="393.7284" font-size="18.0765" fill="var(--danger-accent)">None (can deadlock)</text>
  <text x="800.5633" y="393.7284" font-size="18.0765" fill="var(--ok-accent)">At least one progresses</text>
  <rect x="40" y="419.5062" width="338.0281" height="50.1235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="419.5062" width="405.6338" height="50.1235" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="783.662" y="419.5062" width="456.338" height="50.1235" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="56.9015" y="451.0124" font-size="18.0765" fill="var(--text)">Perf (low contention)</text>
  <text x="394.9296" y="451.0124" font-size="18.0765" fill="var(--text)">Good</text>
  <text x="800.5633" y="451.0124" font-size="18.0765" fill="var(--text)">Similar or better</text>
  <rect x="40" y="476.7902" width="338.0281" height="50.1235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="476.7902" width="405.6338" height="50.1235" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="476.7902" width="456.338" height="50.1235" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="508.2963" font-size="18.0765" fill="var(--text)">Perf (high contention)</text>
  <text x="394.9296" y="508.2963" font-size="18.0765" fill="var(--danger-accent)">Degrades quickly</text>
  <text x="800.5633" y="508.2963" font-size="18.0765" fill="var(--ok-accent)">Degrades gracefully</text>
  <rect x="40" y="534.074" width="338.0281" height="50.1235" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="534.074" width="405.6338" height="50.1235" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="534.074" width="456.338" height="50.1235" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="565.5803" font-size="18.0765" fill="var(--text)">Memory reclamation</text>
  <text x="394.9296" y="565.5803" font-size="18.0765" fill="var(--ok-accent)">Trivial</text>
  <text x="800.5633" y="565.5803" font-size="18.0765" fill="var(--danger-accent)">Hard (ABA problem)</text>
  <text x="640" y="620" text-anchor="middle" font-size="18.0765" fill="var(--text-muted)" font-style="italic">Prefer Mutex/RwLock unless profiling shows lock contention is a real bottleneck.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.1148" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Lock-Free vs Lock-Based Trade-offs</text>
  <rect x="40" y="68.642" width="338.0281" height="57.284" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="209.0141" y="104.4444" text-anchor="middle" font-size="21.0893" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Property</text>
  <rect x="378.0282" y="68.642" width="405.6338" height="57.284" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580.8452" y="104.4444" text-anchor="middle" font-size="21.0893" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Lock-Based</text>
  <rect x="783.662" y="68.642" width="456.338" height="57.284" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1011.8311" y="104.4444" text-anchor="middle" font-size="21.0893" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Lock-Free</text>
  <rect x="40" y="133.0864" width="338.0281" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="133.0864" width="405.6338" height="50.1235" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="133.0864" width="456.338" height="50.1235" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="164.5926" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Simplicity</text>
  <text x="394.9296" y="164.5926" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Easy to reason about</text>
  <text x="800.5633" y="164.5926" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Complex, subtle bugs</text>
  <rect x="40" y="190.3704" width="338.0281" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="190.3704" width="405.6338" height="50.1235" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="190.3704" width="456.338" height="50.1235" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="221.8766" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Contention</text>
  <text x="394.9296" y="221.8766" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Threads block</text>
  <text x="800.5633" y="221.8766" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Threads retry (spin)</text>
  <rect x="40" y="247.6544" width="338.0281" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="247.6544" width="405.6338" height="50.1235" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="247.6544" width="456.338" height="50.1235" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="279.1605" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Priority inversion</text>
  <text x="394.9296" y="279.1605" font-size="18.0765" fill="var(--danger-accent)" font-family="Arial, sans-serif">Possible</text>
  <text x="800.5633" y="279.1605" font-size="18.0765" fill="var(--ok-accent)" font-family="Arial, sans-serif">Not possible</text>
  <rect x="40" y="304.9382" width="338.0281" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="304.9382" width="405.6338" height="50.1235" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="304.9382" width="456.338" height="50.1235" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="336.4445" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Deadlock</text>
  <text x="394.9296" y="336.4445" font-size="18.0765" fill="var(--danger-accent)" font-family="Arial, sans-serif">Possible</text>
  <text x="800.5633" y="336.4445" font-size="18.0765" fill="var(--ok-accent)" font-family="Arial, sans-serif">Not possible</text>
  <rect x="40" y="362.2222" width="338.0281" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="362.2222" width="405.6338" height="50.1235" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="362.2222" width="456.338" height="50.1235" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="393.7284" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Progress guarantee</text>
  <text x="394.9296" y="393.7284" font-size="18.0765" fill="var(--danger-accent)" font-family="Arial, sans-serif">None (can deadlock)</text>
  <text x="800.5633" y="393.7284" font-size="18.0765" fill="var(--ok-accent)" font-family="Arial, sans-serif">At least one progresses</text>
  <rect x="40" y="419.5062" width="338.0281" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="419.5062" width="405.6338" height="50.1235" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <rect x="783.662" y="419.5062" width="456.338" height="50.1235" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="56.9015" y="451.0124" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Perf (low contention)</text>
  <text x="394.9296" y="451.0124" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Good</text>
  <text x="800.5633" y="451.0124" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Similar or better</text>
  <rect x="40" y="476.7902" width="338.0281" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="476.7902" width="405.6338" height="50.1235" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="476.7902" width="456.338" height="50.1235" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="508.2963" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Perf (high contention)</text>
  <text x="394.9296" y="508.2963" font-size="18.0765" fill="var(--danger-accent)" font-family="Arial, sans-serif">Degrades quickly</text>
  <text x="800.5633" y="508.2963" font-size="18.0765" fill="var(--ok-accent)" font-family="Arial, sans-serif">Degrades gracefully</text>
  <rect x="40" y="534.074" width="338.0281" height="50.1235" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="378.0282" y="534.074" width="405.6338" height="50.1235" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="783.662" y="534.074" width="456.338" height="50.1235" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="56.9015" y="565.5803" font-size="18.0765" fill="var(--text)" font-family="Arial, sans-serif">Memory reclamation</text>
  <text x="394.9296" y="565.5803" font-size="18.0765" fill="var(--ok-accent)" font-family="Arial, sans-serif">Trivial</text>
  <text x="800.5633" y="565.5803" font-size="18.0765" fill="var(--danger-accent)" font-family="Arial, sans-serif">Hard (ABA problem)</text>
  <text x="640" y="620" text-anchor="middle" font-size="18.0765" fill="var(--text-muted)" font-style="italic" font-family="Arial, sans-serif">Prefer Mutex/RwLock unless profiling shows lock contention is a real bottleneck.</text>
</svg>

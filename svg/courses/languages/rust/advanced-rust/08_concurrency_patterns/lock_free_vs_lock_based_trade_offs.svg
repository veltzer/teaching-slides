<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.5057" y="44.1379" text-anchor="middle" font-size="26.4828" font-weight="bold" fill="var(--text)">Lock-Free vs Lock-Based Trade-offs</text>
  <rect x="31.3869" y="73.5632" width="313.8697" height="58.8506" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="188.3218" y="110.3448" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="var(--bg)">Property</text>
  <rect x="345.2567" y="73.5632" width="376.6437" height="58.8506" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="533.5786" y="110.3448" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="var(--text)">Lock-Based</text>
  <rect x="721.9004" y="73.5632" width="423.7241" height="58.8506" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="933.7625" y="110.3448" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="var(--bg)">Lock-Free</text>
  <rect x="31.3869" y="139.7701" width="313.8697" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="345.2567" y="139.7701" width="376.6437" height="51.4943" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="721.9004" y="139.7701" width="423.7241" height="51.4943" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="47.0805" y="172.1379" font-size="17.6552" fill="var(--text)">Simplicity</text>
  <text x="360.9502" y="172.1379" font-size="17.6552" fill="var(--text)">Easy to reason about</text>
  <text x="737.5938" y="172.1379" font-size="17.6552" fill="var(--text)">Complex, subtle bugs</text>
  <rect x="31.3869" y="198.6207" width="313.8697" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="345.2567" y="198.6207" width="376.6437" height="51.4943" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="721.9004" y="198.6207" width="423.7241" height="51.4943" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="47.0805" y="230.9885" font-size="17.6552" fill="var(--text)">Contention</text>
  <text x="360.9502" y="230.9885" font-size="17.6552" fill="var(--text)">Threads block</text>
  <text x="737.5938" y="230.9885" font-size="17.6552" fill="var(--text)">Threads retry (spin)</text>
  <rect x="31.3869" y="257.4713" width="313.8697" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="345.2567" y="257.4713" width="376.6437" height="51.4943" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="721.9004" y="257.4713" width="423.7241" height="51.4943" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="47.0805" y="289.8391" font-size="17.6552" fill="var(--text)">Priority inversion</text>
  <text x="360.9502" y="289.8391" font-size="17.6552" fill="var(--danger-accent)">Possible</text>
  <text x="737.5938" y="289.8391" font-size="17.6552" fill="var(--ok-accent)">Not possible</text>
  <rect x="31.3869" y="316.3218" width="313.8697" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="345.2567" y="316.3218" width="376.6437" height="51.4943" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="721.9004" y="316.3218" width="423.7241" height="51.4943" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="47.0805" y="348.6897" font-size="17.6552" fill="var(--text)">Deadlock</text>
  <text x="360.9502" y="348.6897" font-size="17.6552" fill="var(--danger-accent)">Possible</text>
  <text x="737.5938" y="348.6897" font-size="17.6552" fill="var(--ok-accent)">Not possible</text>
  <rect x="31.3869" y="375.1724" width="313.8697" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="345.2567" y="375.1724" width="376.6437" height="51.4943" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="721.9004" y="375.1724" width="423.7241" height="51.4943" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="47.0805" y="407.5402" font-size="17.6552" fill="var(--text)">Progress guarantee</text>
  <text x="360.9502" y="407.5402" font-size="17.6552" fill="var(--danger-accent)">None (can deadlock)</text>
  <text x="737.5938" y="407.5402" font-size="17.6552" fill="var(--ok-accent)">At least one progresses</text>
  <rect x="31.3869" y="434.023" width="313.8697" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="345.2567" y="434.023" width="376.6437" height="51.4943" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="721.9004" y="434.023" width="423.7241" height="51.4943" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="47.0805" y="466.3908" font-size="17.6552" fill="var(--text)">Perf (low contention)</text>
  <text x="360.9502" y="466.3908" font-size="17.6552" fill="var(--text)">Good</text>
  <text x="737.5938" y="466.3908" font-size="17.6552" fill="var(--text)">Similar or better</text>
  <rect x="31.3869" y="492.8736" width="313.8697" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="345.2567" y="492.8736" width="376.6437" height="51.4943" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="721.9004" y="492.8736" width="423.7241" height="51.4943" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="47.0805" y="525.2414" font-size="17.6552" fill="var(--text)">Perf (high contention)</text>
  <text x="360.9502" y="525.2414" font-size="17.6552" fill="var(--danger-accent)">Degrades quickly</text>
  <text x="737.5938" y="525.2414" font-size="17.6552" fill="var(--ok-accent)">Degrades gracefully</text>
  <rect x="31.3869" y="551.7241" width="313.8697" height="51.4943" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="345.2567" y="551.7241" width="376.6437" height="51.4943" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="721.9004" y="551.7241" width="423.7241" height="51.4943" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="47.0805" y="584.092" font-size="17.6552" fill="var(--text)">Memory reclamation</text>
  <text x="360.9502" y="584.092" font-size="17.6552" fill="var(--ok-accent)">Trivial</text>
  <text x="737.5938" y="584.092" font-size="17.6552" fill="var(--danger-accent)">Hard (ABA problem)</text>
  <text x="588.5057" y="640" text-anchor="middle" font-size="17.6552" fill="var(--text-muted)" font-style="italic">Prefer Mutex/RwLock unless profiling shows lock contention is a real bottleneck.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="19.3939" markerHeight="13.2632" refX="17.4545" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 6.7879,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="19.3939" markerHeight="13.2632" refX="1.9394" refY="6.6316" orient="auto">
      <polygon points="0,0 6.7879,18.9474" fill="#555" />
    </marker>
  </defs>
  <text x="600.4938" y="39.1111" text-anchor="middle" font-size="24.8889" fill="var(--text-darker)" font-weight="bold">Tokio Runtime Architecture</text>
  <rect x="36.3936" y="62.2222" width="1128.2004" height="577.7778" fill="var(--surface)" stroke="var(--text-dark)" stroke-width="2.6667" rx="7.1111" />
  <text x="600.4938" y="103.1111" text-anchor="middle" font-size="24.8889" fill="var(--text-darker)" font-weight="bold">Tokio Runtime</text>
  <rect x="90.9839" y="124.4445" width="272.9517" height="106.6667" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.6667" rx="7.1111" />
  <text x="227.4597" y="170.6666" text-anchor="middle" font-size="21.3333" fill="var(--text-darker)" font-weight="bold">Worker 1</text>
  <text x="227.4597" y="202.6667" text-anchor="middle" font-size="19.5555" fill="var(--text-darker)">(thread)</text>
  <rect x="400.3292" y="124.4445" width="272.9517" height="106.6667" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.6667" rx="7.1111" />
  <text x="536.805" y="170.6666" text-anchor="middle" font-size="21.3333" fill="var(--text-darker)" font-weight="bold">Worker 2</text>
  <text x="536.805" y="202.6667" text-anchor="middle" font-size="19.5555" fill="var(--text-darker)">(thread)</text>
  <rect x="709.6745" y="124.4445" width="272.9517" height="106.6667" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.6667" rx="7.1111" />
  <text x="846.1504" y="170.6666" text-anchor="middle" font-size="21.3333" fill="var(--text-darker)" font-weight="bold">Worker 3</text>
  <text x="846.1504" y="202.6667" text-anchor="middle" font-size="19.5555" fill="var(--text-darker)">(thread)</text>
  <text x="1037.2165" y="186.6667" text-anchor="middle" font-size="28.4445" fill="var(--text-faint)">...</text>
  <rect x="90.9839" y="293.3333" width="1000.823" height="106.6667" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="2.6667" rx="7.1111" />
  <text x="591.3954" y="334.2222" text-anchor="middle" font-size="23.1111" fill="var(--text-darker)" font-weight="bold">Task Scheduler</text>
  <text x="591.3954" y="369.7778" text-anchor="middle" font-size="21.3333" fill="var(--text-darker)">(work-stealing queue)</text>
  <line x1="227.4597" y1="231.1111" x2="227.4597" y2="293.3333" stroke="var(--text-muted)" stroke-width="2.6667" marker-end="url(#arr)" />
  <line x1="536.805" y1="231.1111" x2="536.805" y2="293.3333" stroke="var(--text-muted)" stroke-width="2.6667" marker-end="url(#arr)" />
  <line x1="846.1504" y1="231.1111" x2="846.1504" y2="293.3333" stroke="var(--text-muted)" stroke-width="2.6667" marker-end="url(#arr)" />
  <rect x="90.9839" y="471.1111" width="482.2147" height="124.4445" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.6667" rx="7.1111" />
  <text x="331.1814" y="515.5555" text-anchor="middle" font-size="21.3333" fill="var(--text-darker)" font-weight="bold">I/O Driver (epoll)</text>
  <text x="331.1814" y="551.1111" text-anchor="middle" font-size="19.5555" fill="var(--text-darker)">async I/O notifications</text>
  <rect x="609.5922" y="471.1111" width="482.2147" height="124.4445" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.6667" rx="7.1111" />
  <text x="849.7897" y="515.5555" text-anchor="middle" font-size="21.3333" fill="var(--text-darker)" font-weight="bold">Timer Wheel</text>
  <text x="849.7897" y="551.1111" text-anchor="middle" font-size="19.5555" fill="var(--text-darker)">scheduled wakeups</text>
  <line x1="331.1814" y1="400" x2="331.1814" y2="471.1111" stroke="var(--text-muted)" stroke-width="2.6667" marker-end="url(#arr)" />
  <line x1="849.7897" y1="400" x2="849.7897" y2="471.1111" stroke="var(--text-muted)" stroke-width="2.6667" marker-end="url(#arr)" />
</svg>
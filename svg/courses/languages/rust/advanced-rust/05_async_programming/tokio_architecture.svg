<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.7879,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 6.7879,18.9474" fill="#555" />
    </marker>
  </defs>
  <text x="600.4938" y="39.1111" text-anchor="middle" font-size="24.8889" fill="var(--text)" font-weight="bold">Tokio Runtime Architecture</text>
  <rect x="36.3936" y="62.2222" width="1128.2004" height="577.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="600.4938" y="103.1111" text-anchor="middle" font-size="24.8889" fill="var(--text)" font-weight="bold">Tokio Runtime</text>
  <rect x="90.9839" y="124.4445" width="272.9517" height="106.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="227.4597" y="170.6666" text-anchor="middle" font-size="21.3333" fill="var(--text)" font-weight="bold">Worker 1</text>
  <text x="227.4597" y="202.6667" text-anchor="middle" font-size="19.5555" fill="var(--text)">(thread)</text>
  <rect x="400.3292" y="124.4445" width="272.9517" height="106.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="536.805" y="170.6666" text-anchor="middle" font-size="21.3333" fill="var(--text)" font-weight="bold">Worker 2</text>
  <text x="536.805" y="202.6667" text-anchor="middle" font-size="19.5555" fill="var(--text)">(thread)</text>
  <rect x="709.6745" y="124.4445" width="272.9517" height="106.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="846.1504" y="170.6666" text-anchor="middle" font-size="21.3333" fill="var(--text)" font-weight="bold">Worker 3</text>
  <text x="846.1504" y="202.6667" text-anchor="middle" font-size="19.5555" fill="var(--text)">(thread)</text>
  <text x="1037.2165" y="186.6667" text-anchor="middle" font-size="28.4445" fill="var(--text-faint)">...</text>
  <rect x="90.9839" y="293.3333" width="1000.823" height="106.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="591.3954" y="334.2222" text-anchor="middle" font-size="23.1111" fill="var(--text)" font-weight="bold">Task Scheduler</text>
  <text x="591.3954" y="369.7778" text-anchor="middle" font-size="21.3333" fill="var(--text)">(work-stealing queue)</text>
  <line x1="227.4597" y1="231.1111" x2="227.4597" y2="293.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="536.805" y1="231.1111" x2="536.805" y2="293.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="846.1504" y1="231.1111" x2="846.1504" y2="293.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <rect x="90.9839" y="471.1111" width="482.2147" height="124.4445" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="331.1814" y="515.5555" text-anchor="middle" font-size="21.3333" fill="var(--text)" font-weight="bold">I/O Driver (epoll)</text>
  <text x="331.1814" y="551.1111" text-anchor="middle" font-size="19.5555" fill="var(--text)">async I/O notifications</text>
  <rect x="609.5922" y="471.1111" width="482.2147" height="124.4445" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="849.7897" y="515.5555" text-anchor="middle" font-size="21.3333" fill="var(--text)" font-weight="bold">Timer Wheel</text>
  <text x="849.7897" y="551.1111" text-anchor="middle" font-size="19.5555" fill="var(--text)">scheduled wakeups</text>
  <line x1="331.1814" y1="400" x2="331.1814" y2="471.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <line x1="849.7897" y1="400" x2="849.7897" y2="471.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
</svg>
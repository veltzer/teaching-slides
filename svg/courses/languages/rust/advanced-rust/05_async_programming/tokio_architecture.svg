<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="650.909068363638" y="40" text-anchor="middle" font-size="29.576867554219" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Tokio Runtime</text>
  <rect x="40" y="65.126453346181" width="327.272727272727" height="125.631778644318" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.036945310994" filter="url(#shadow)"/>
  <text x="203.636250909098" y="119.566776871849" text-anchor="middle" font-size="25.351651024654" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Worker 1</text>
  <text x="203.636250909098" y="157.256456891119" text-anchor="middle" font-size="23.23892547745" fill="var(--text)" font-family="Arial, sans-serif">(thread)</text>
  <rect x="410.909113454544" y="65.126453346181" width="327.272727272727" height="125.631778644318" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.036945310994" filter="url(#shadow)"/>
  <text x="574.545364363642" y="119.566776871849" text-anchor="middle" font-size="25.351651024654" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Worker 2</text>
  <text x="574.545364363642" y="157.256456891119" text-anchor="middle" font-size="23.23892547745" fill="var(--text)" font-family="Arial, sans-serif">(thread)</text>
  <rect x="781.818114181823" y="65.126453346181" width="327.272727272727" height="125.631778644318" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.036945310994" filter="url(#shadow)"/>
  <text x="945.454590545452" y="119.566776871849" text-anchor="middle" font-size="25.351651024654" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Worker 3</text>
  <text x="945.454590545452" y="157.256456891119" text-anchor="middle" font-size="23.23892547745" fill="var(--text)" font-family="Arial, sans-serif">(thread)</text>
  <text x="1174.545364363642" y="138.411677892308" text-anchor="middle" font-size="33.802201366205" fill="var(--text-faint)" font-family="Arial, sans-serif">...</text>
  <rect x="40" y="264.04333451498" width="1200" height="125.631778644318" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.036945310994" filter="url(#shadow)"/>
  <text x="640" y="312.202227736572" text-anchor="middle" font-size="27.464259289437" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Task Scheduler</text>
  <text x="640" y="354.079446610796" text-anchor="middle" font-size="25.351651024654" fill="var(--text)" font-family="Arial, sans-serif">(work-stealing queue)</text>
  <line x1="203.636250909098" y1="190.758109968853" x2="203.636250909098" y2="264.04333451498" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="574.545364363642" y1="190.758109968853" x2="574.545364363642" y2="264.04333451498" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="945.454590545452" y1="190.758109968853" x2="945.454590545452" y2="264.04333451498" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="473.429550907746" width="578.181750545459" height="146.570449092254" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.036945310994" filter="url(#shadow)"/>
  <text x="327.999900800007" y="525.776105005937" text-anchor="middle" font-size="25.351651024654" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">I/O Driver (epoll)</text>
  <text x="327.999900800007" y="567.653445901808" text-anchor="middle" font-size="23.23892547745" fill="var(--text)" font-family="Arial, sans-serif">async I/O notifications</text>
  <rect x="661.818136727276" y="473.429550907746" width="578.181750545459" height="146.570449092254" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.036945310994" filter="url(#shadow)"/>
  <text x="949.818150254548" y="525.776105005937" text-anchor="middle" font-size="25.351651024654" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Timer Wheel</text>
  <text x="949.818150254548" y="567.653445901808" text-anchor="middle" font-size="23.23892547745" fill="var(--text)" font-family="Arial, sans-serif">scheduled wakeups</text>
  <line x1="327.999900800007" y1="389.675113159298" x2="327.999900800007" y2="473.429550907746" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="949.818150254548" y1="389.675113159298" x2="949.818150254548" y2="473.429550907746" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

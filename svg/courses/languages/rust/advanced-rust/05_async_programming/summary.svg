<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="1200" height="56.9942" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.6966" rx="6" />
  <text x="640" y="76.8786" text-anchor="middle" font-size="25.0098" fill="var(--bg)" font-weight="bold" font-family="Arial, sans-serif">Async Programming Cheatsheet</text>
  <rect x="40" y="96.9943" width="1200" height="43.5837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="59.3548" y="125.4913" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Future::poll()</text>
  <text x="485.1612" y="125.4913" text-anchor="start" font-size="21.437" fill="var(--text)" font-family="Arial, sans-serif">returns Pending or Ready(T)</text>
  <rect x="40" y="140.5781" width="1200" height="43.5837" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="169.0752" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">async fn</text>
  <text x="485.1612" y="169.0752" text-anchor="start" font-size="21.437" fill="var(--text)" font-family="Arial, sans-serif">generates a state machine</text>
  <rect x="40" y="184.1619" width="1200" height="43.5837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="59.3548" y="212.659" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">.await</text>
  <text x="485.1612" y="212.659" text-anchor="start" font-size="21.437" fill="var(--text)" font-family="Arial, sans-serif">yield point (state transition)</text>
  <rect x="40" y="227.7457" width="1200" height="43.5837" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="256.2428" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Pin&lt;&amp;mut F&gt;</text>
  <text x="485.1612" y="256.2428" text-anchor="start" font-size="21.437" fill="var(--text)" font-family="Arial, sans-serif">prevents moving self-referential futures</text>
  <rect x="40" y="271.3295" width="1200" height="43.5837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="59.3548" y="299.8267" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Unpin</text>
  <text x="485.1612" y="299.8267" text-anchor="start" font-size="21.437" fill="var(--text)" font-family="Arial, sans-serif">opt-out of pinning restrictions</text>
  <rect x="40" y="314.9133" width="1200" height="43.5837" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="343.4104" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">tokio::spawn</text>
  <text x="485.1612" y="343.4104" text-anchor="start" font-size="21.437" fill="var(--text)" font-family="Arial, sans-serif">run a Send + 'static future</text>
  <rect x="40" y="358.4972" width="1200" height="43.5837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="59.3548" y="386.9943" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">spawn_blocking</text>
  <text x="485.1612" y="386.9943" text-anchor="start" font-size="21.437" fill="var(--text)" font-family="Arial, sans-serif">run blocking code off the async runtime</text>
  <rect x="40" y="402.081" width="1200" height="43.5837" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="430.5781" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">join!</text>
  <text x="485.1612" y="430.5781" text-anchor="start" font-size="21.437" fill="var(--text)" font-family="Arial, sans-serif">run all futures concurrently</text>
  <rect x="40" y="445.6647" width="1200" height="43.5837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="59.3548" y="474.1619" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">select!</text>
  <text x="485.1612" y="474.1619" text-anchor="start" font-size="21.437" fill="var(--text)" font-family="Arial, sans-serif">race futures, first one wins</text>
  <rect x="40" y="489.2486" width="1200" height="43.5837" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="517.7458" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Stream</text>
  <text x="485.1612" y="517.7458" text-anchor="start" font-size="21.437" fill="var(--text)" font-family="Arial, sans-serif">async iterator</text>
  <rect x="40" y="532.8324" width="1200" height="43.5837" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="59.3548" y="561.3295" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Cancellation-safe</text>
  <text x="485.1612" y="561.3295" text-anchor="start" font-size="21.437" fill="var(--text)" font-family="Arial, sans-serif">no partial state lost on cancel</text>
  <rect x="40" y="576.4163" width="1200" height="43.5837" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="604.9134" text-anchor="start" font-size="21.437" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">async_trait</text>
  <text x="485.1612" y="604.9134" text-anchor="start" font-size="21.437" fill="var(--text)" font-family="Arial, sans-serif">async fn in dyn trait objects</text>
</svg>
  <rect x="20" y="19.6721" width="1240" height="66.8852" fill="#1565c0" stroke="#1565c0" stroke-width="2.9508" rx="7.8689" />
  <text x="640" y="62.9508" text-anchor="middle" font-size="27.541" fill="white" font-weight="bold">Async Programming Cheatsheet</text>
  <rect x="20" y="86.5574" width="1240" height="51.1475" fill="#f0f4f8" stroke="#ccc" stroke-width="2.9508" rx="7.8689" />
  <text x="40" y="120" text-anchor="start" font-size="23.6066" fill="#1565c0" font-weight="bold">Future::poll()</text>
  <text x="480" y="120" text-anchor="start" font-size="23.6066" fill="#222222">returns Pending or Ready(T)</text>
  <rect x="20" y="137.7049" width="1240" height="51.1475" fill="#e8edf2" stroke="#ccc" stroke-width="2.9508" rx="7.8689" />
  <text x="40" y="171.1475" text-anchor="start" font-size="23.6066" fill="#1565c0" font-weight="bold">async fn</text>
  <text x="480" y="171.1475" text-anchor="start" font-size="23.6066" fill="#222222">generates a state machine</text>
  <rect x="20" y="188.8525" width="1240" height="51.1475" fill="#f0f4f8" stroke="#ccc" stroke-width="2.9508" rx="7.8689" />
  <text x="40" y="222.2951" text-anchor="start" font-size="23.6066" fill="#1565c0" font-weight="bold">.await</text>
  <text x="480" y="222.2951" text-anchor="start" font-size="23.6066" fill="#222222">yield point (state transition)</text>
  <rect x="20" y="240" width="1240" height="51.1475" fill="#e8edf2" stroke="#ccc" stroke-width="2.9508" rx="7.8689" />
  <text x="40" y="273.4426" text-anchor="start" font-size="23.6066" fill="#1565c0" font-weight="bold">Pin&lt;&amp;mut F&gt;</text>
  <text x="480" y="273.4426" text-anchor="start" font-size="23.6066" fill="#222222">prevents moving self-referential futures</text>
  <rect x="20" y="291.1475" width="1240" height="51.1475" fill="#f0f4f8" stroke="#ccc" stroke-width="2.9508" rx="7.8689" />
  <text x="40" y="324.5902" text-anchor="start" font-size="23.6066" fill="#1565c0" font-weight="bold">Unpin</text>
  <text x="480" y="324.5902" text-anchor="start" font-size="23.6066" fill="#222222">opt-out of pinning restrictions</text>
  <rect x="20" y="342.2951" width="1240" height="51.1475" fill="#e8edf2" stroke="#ccc" stroke-width="2.9508" rx="7.8689" />
  <text x="40" y="375.7377" text-anchor="start" font-size="23.6066" fill="#1565c0" font-weight="bold">tokio::spawn</text>
  <text x="480" y="375.7377" text-anchor="start" font-size="23.6066" fill="#222222">run a Send + 'static future</text>
  <rect x="20" y="393.4426" width="1240" height="51.1475" fill="#f0f4f8" stroke="#ccc" stroke-width="2.9508" rx="7.8689" />
  <text x="40" y="426.8852" text-anchor="start" font-size="23.6066" fill="#1565c0" font-weight="bold">spawn_blocking</text>
  <text x="480" y="426.8852" text-anchor="start" font-size="23.6066" fill="#222222">run blocking code off the async runtime</text>
  <rect x="20" y="444.5902" width="1240" height="51.1475" fill="#e8edf2" stroke="#ccc" stroke-width="2.9508" rx="7.8689" />
  <text x="40" y="478.0328" text-anchor="start" font-size="23.6066" fill="#1565c0" font-weight="bold">join!</text>
  <text x="480" y="478.0328" text-anchor="start" font-size="23.6066" fill="#222222">run all futures concurrently</text>
  <rect x="20" y="495.7377" width="1240" height="51.1475" fill="#f0f4f8" stroke="#ccc" stroke-width="2.9508" rx="7.8689" />
  <text x="40" y="529.1803" text-anchor="start" font-size="23.6066" fill="#1565c0" font-weight="bold">select!</text>
  <text x="480" y="529.1803" text-anchor="start" font-size="23.6066" fill="#222222">race futures, first one wins</text>
  <rect x="20" y="546.8852" width="1240" height="51.1475" fill="#e8edf2" stroke="#ccc" stroke-width="2.9508" rx="7.8689" />
  <text x="40" y="580.3279" text-anchor="start" font-size="23.6066" fill="#1565c0" font-weight="bold">Stream</text>
  <text x="480" y="580.3279" text-anchor="start" font-size="23.6066" fill="#222222">async iterator</text>
  <rect x="20" y="598.0328" width="1240" height="51.1475" fill="#f0f4f8" stroke="#ccc" stroke-width="2.9508" rx="7.8689" />
  <text x="40" y="631.4754" text-anchor="start" font-size="23.6066" fill="#1565c0" font-weight="bold">Cancellation-safe</text>
  <text x="480" y="631.4754" text-anchor="start" font-size="23.6066" fill="#222222">no partial state lost on cancel</text>
  <rect x="20" y="649.1803" width="1240" height="51.1475" fill="#e8edf2" stroke="#ccc" stroke-width="2.9508" rx="7.8689" />
  <text x="40" y="682.623" text-anchor="start" font-size="23.6066" fill="#1565c0" font-weight="bold">async_trait</text>
  <text x="480" y="682.623" text-anchor="start" font-size="23.6066" fill="#222222">async fn in dyn trait objects</text>
